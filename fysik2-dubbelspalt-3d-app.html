    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // ── Konstanter, samma beteckningar som i genomgångarna Ljus,
        //    diffraktion och interferens (fy2-4.2) och Våg-partikeldualitet
        //    (fy2-4.6): n · λ = d · sin α_n och λ = h / (m · v). ──
        const H_PLANCK = 6.626e-34;    // Plancks konstant (Js)
        const M_E = 9.109e-31;         // elektronens massa (kg)
        const C_LIGHT = 2.998e8;       // ljusets hastighet (m/s)

        // Scenen är i MIKROMETERSKALA (1 scen-enhet = 1 µm): spaltavstånd på
        // några µm och en skärm några tiotal µm bort ger avböjningsvinklar på
        // tiotals grader, så att vågorna och maxima syns i samma bild. Alla
        // mått är riktiga; det är bara uppställningen som är liten.
        const GEO = {
            H: 6.5,          // plattans och skärmens höjd (µm)
            W: 24,           // scenens bredd i sidled (µm)
            SRC_X: -7,       // källans mynning (µm)
            XMIN: -9.5,      // vågytans början
            PLATE_T: 0.3,    // plattans tjocklek
        };
        const N_SUB = 7;     // Huygens-delkällor per spalt

        const LAM_MIN = 380, LAM_MAX = 750;      // nm
        const D_MIN = 0.8, D_MAX = 6;            // µm
        const B_MIN = 0.2, B_MAX = 1.6;          // µm
        const L_MIN = 8, L_MAX = 30;             // µm
        const RATE_MIN = 1, RATE_MAX = 300;      // partiklar per sekund

        const fmt = (num, decimals = 1) => {
            if (!isFinite(num)) return '–';
            const s = num.toFixed(decimals);
            if (parseFloat(s) === 0) return '0';
            return s.replace('.', ',');
        };
        const fmtNum = (n, d = 0) => {
            if (!isFinite(n)) return '–';
            const s = n.toFixed(d);
            if (parseFloat(s) === 0) return '0';
            const [intp, frac] = s.split('.');
            const withSpaces = intp.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
            return frac !== undefined ? withSpaces + ',' + frac : withSpaces;
        };
        const DEG = Math.PI / 180;

        // Våglängd → RGB (0–1), en vanlig approximation av det synliga spektrumet.
        function wlToRGB(w) {
            let r, g, b;
            if (w < 440) { r = -(w - 440) / 60; g = 0; b = 1; }
            else if (w < 490) { r = 0; g = (w - 440) / 50; b = 1; }
            else if (w < 510) { r = 0; g = 1; b = -(w - 510) / 20; }
            else if (w < 580) { r = (w - 510) / 70; g = 1; b = 0; }
            else if (w < 645) { r = 1; g = -(w - 645) / 65; b = 0; }
            else { r = 1; g = 0; b = 0; }
            let f = 1;
            if (w < 420) f = 0.35 + 0.65 * (w - 380) / 40;
            else if (w > 700) f = 0.4 + 0.6 * (750 - w) / 50;
            return [r * f, g * f, b * f];
        }
        const ELEKTRON_RGB = [0.55, 0.80, 1.0];
        const rgbHex = (c) => '#' + c.map(v => Math.round(Math.max(0, Math.min(1, v)) * 255).toString(16).padStart(2, '0')).join('');
        const mixRGB = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
        // Ljusets färg i scenen: våglängdens färg, något ljusare så att den
        // bär mot den mörka bakgrunden. Elektroner ritas blåvita.
        const sceneColor = (source, lam) => source === 'elektron' ? ELEKTRON_RGB : mixRGB(wlToRGB(lam), [1, 1, 1], 0.18);

        // ── Fysik: källorna bakom plattan och intensiteten på skärmen ──
        // Varje öppen spalt delas i N_SUB Huygens-delkällor jämnt över
        // spaltbredden b, centrerade i z = ±d/2. Samma källor driver vågytan
        // (i shadern) och skärmens intensitet, så att vågtopparna på golvet
        // träffar skärmen exakt där banden är ljusa.
        function buildSources(d, b, slitA, slitB) {
            const out = [];
            const add = (zc) => {
                for (let j = 0; j < N_SUB; j++) {
                    out.push({ z: zc + b * ((j + 0.5) / N_SUB - 0.5), a: 1 / N_SUB });
                }
            };
            if (slitA) add(-d / 2);
            if (slitB) add(d / 2);
            return out;
        }
        // Intensiteten I(z) längs skärmen (tidsmedelvärde av |Σ e^{ikr}/√r|²),
        // normerad så att centralmaximum med båda spalterna öppna är 1.
        const N_COLS = 1024;
        function computeIntensity(p) {
            const { lamUm, d, b, L, slitA, slitB } = p;
            const k = 2 * Math.PI / lamUm;
            const srcs = buildSources(d, b, slitA, slitB);
            const ref = buildSources(d, b, true, true);
            let re = 0, im = 0;
            for (const s of ref) {
                const r = Math.hypot(L, s.z); const a = s.a / Math.sqrt(r);
                re += a * Math.cos(k * r); im += a * Math.sin(k * r);
            }
            const Iref = re * re + im * im;
            const I = new Float32Array(N_COLS);
            for (let c = 0; c < N_COLS; c++) {
                const z = (c + 0.5) / N_COLS * GEO.W - GEO.W / 2;
                re = 0; im = 0;
                for (const s of srcs) {
                    const r = Math.hypot(L, z - s.z); const a = s.a / Math.sqrt(r);
                    re += a * Math.cos(k * r); im += a * Math.sin(k * r);
                }
                I[c] = (re * re + im * im) / Iref;
            }
            return I;
        }
        // Kumulativ fördelning för att lotta träffpunkter i partikelläget
        function buildCDF(I) {
            const cdf = new Float32Array(I.length);
            let acc = 0;
            for (let i = 0; i < I.length; i++) { acc += I[i]; cdf[i] = acc; }
            if (acc > 0) for (let i = 0; i < I.length; i++) cdf[i] /= acc;
            return { cdf, total: acc };
        }
        function sampleZ(cdfObj) {
            const { cdf } = cdfObj;
            const u = Math.random();
            let lo = 0, hi = cdf.length - 1;
            while (lo < hi) { const mid = (lo + hi) >> 1; if (cdf[mid] < u) lo = mid + 1; else hi = mid; }
            const c = lo + Math.random();
            return c / cdf.length * GEO.W - GEO.W / 2;
        }
        // Tankeexperimentet "vanliga små kulor": kulorna kommer i en riktad
        // stråle, går genom EN spalt och fortsätter rakt fram utan någon
        // vågnatur. På skärmen blir det två smala streck, vart och ett lika
        // brett som spalten (plus en mycket liten spridning i strålen).
        const KUL_SPRID = 0.4 * DEG;
        function kulSigma(L) { return Math.max(0.03, L * Math.tan(KUL_SPRID)); }
        // Felfunktionen (Abramowitz–Stegun 7.1.26), räcker för fördelningen
        function erf(x) {
            const sgn = x < 0 ? -1 : 1; x = Math.abs(x);
            const t = 1 / (1 + 0.3275911 * x);
            const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x);
            return sgn * y;
        }
        function computeKulor(d, b, L, slitA, slitB) {
            const I = new Float32Array(N_COLS);
            const sig = kulSigma(L), k = 1 / (Math.SQRT2 * sig);
            const zs = [];
            if (slitA) zs.push(-d / 2);
            if (slitB) zs.push(d / 2);
            for (let c = 0; c < N_COLS; c++) {
                const z = (c + 0.5) / N_COLS * GEO.W - GEO.W / 2;
                let v = 0;
                // likformigt över spaltbredden, utsmetat med den lilla spridningen
                for (const z0 of zs) v += 0.5 * (erf((z - z0 + b / 2) * k) - erf((z - z0 - b / 2) * k));
                I[c] = v;
            }
            return I;
        }
        function randn() {
            let u = 0, v = 0;
            while (u === 0) u = Math.random();
            while (v === 0) v = Math.random();
            return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
        }
        // Maximanas lägen enligt gitterformeln n · λ = d · sin α_n
        function maximaList(lamUm, d, L) {
            const out = [];
            for (let n = 0; n <= 12; n++) {
                const s = n * lamUm / d;
                if (s >= 1) break;
                const alpha = Math.asin(s);
                const z = L * Math.tan(alpha);
                if (z > GEO.W / 2) break;
                out.push({ n, alpha, z });
                if (n > 0) out.push({ n, alpha: -alpha, z: -z });
            }
            return out;
        }

        // ── Reglage-komponenter ──
        const NumInput = ({ value, min, max, onCommit, fmtFn, unit }) => {
            const [txt, setTxt] = useState(() => fmtFn(value));
            const [editing, setEditing] = useState(false);
            useEffect(() => { if (!editing) setTxt(fmtFn(value)); }, [value, editing]);
            const commit = (raw) => {
                const norm = raw.replace(',', '.').trim();
                if (norm === '' || norm === '-' || norm === '.') return;
                let n = parseFloat(norm);
                if (!isFinite(n)) return;
                if (min != null) n = Math.max(min, n);
                if (max != null) n = Math.min(max, n);
                onCommit(n);
            };
            return (
                <span className="num-wrap">
                    <input className="num-in" type="text" inputMode="decimal" value={txt}
                           onFocus={() => setEditing(true)}
                           onChange={(e) => setTxt(e.target.value)}
                           onBlur={() => { setEditing(false); commit(txt); }}
                           onKeyDown={(e) => { if (e.key === 'Enter') { e.target.blur(); } }} />
                    <span className="num-unit">{unit}</span>
                </span>
            );
        };
        const Slider = ({ label, sub, value, min, max, step, unit, onChange, decimals = 0, cmin, cmax }) => (
            <div className="p-3 rounded-xl glass-card mb-3">
                <div className="flex justify-between items-baseline mb-2 gap-2">
                    <label className="text-sm font-bold" style={{ color: 'var(--lab-ink)' }}
                           dangerouslySetInnerHTML={{ __html: label }} />
                    <NumInput value={value} min={cmin != null ? cmin : min} max={cmax != null ? cmax : max}
                              fmtFn={(x) => fmt(x, decimals)} unit={unit} onCommit={onChange} />
                </div>
                <input type="range" min={min} max={max} step={step} value={value}
                       onChange={(e) => onChange(parseFloat(e.target.value))}
                       className="w-full cursor-pointer" />
                <div className="flex justify-between mt-1 text-xs font-mono" style={{ color: 'var(--lab-ink-muted)' }}>
                    <span>{fmt(min, decimals)} {unit}</span>
                    <span>{fmt(max, decimals)} {unit}</span>
                </div>
                {sub && <div className="text-xs mt-1" style={{ color: 'var(--lab-ink-muted)' }}
                             dangerouslySetInnerHTML={{ __html: sub }} />}
            </div>
        );
        // Kompakt rad i inställningsrutan (fullskärm): etikett + sifferfält, glidaren under
        const StSlider = ({ label, value, min, max, step, onChange, decimals, unit }) => (
            <div className="st-slider">
                <div className="st-slider-top">
                    <span dangerouslySetInnerHTML={{ __html: label }} />
                    <NumInput value={value} min={min} max={max} fmtFn={(x) => fmt(x, decimals)} unit={unit} onCommit={onChange} />
                </div>
                <input type="range" min={min} max={max} step={step} value={value}
                       onChange={(e) => onChange(parseFloat(e.target.value))} />
            </div>
        );

        // ── Shaders ──
        // Vågytan: höjden räknas i vertexshadern ur de fysikaliska källorna.
        // Före plattan en plan våg, bakom den summan av delkällornas
        // cylindriska vågor (amplitud ∝ 1/√r). Normalen tas med finita
        // differenser, så att ljuset tecknar varje vågtopp.
        const WAVE_VERT = `
            uniform float uTime, uK, uOmega, uXMin, uXMax, uZW, uAmp, uNSrc, uPlane, uGain;
            uniform vec3 uSrc[16];
            varying vec3 vN; varying vec3 vP; varying float vH;
            float field(float x, float z) {
                if (x < 0.0) {
                    float env = smoothstep(uXMin, uXMin + 2.5, x);
                    return uPlane * env * cos(uK * x - uOmega * uTime);
                }
                float s = 0.0;
                for (int i = 0; i < 16; i++) {
                    if (float(i) >= uNSrc) break;
                    float dx = x - uSrc[i].x; float dz = z - uSrc[i].y;
                    float r = sqrt(dx * dx + dz * dz);
                    s += uSrc[i].z * cos(uK * r - uOmega * uTime) / sqrt(r + 0.35);
                }
                return uGain * s * smoothstep(0.0, 0.5, x);
            }
            void main() {
                float x = mix(uXMin, uXMax, position.x + 0.5);
                float z = position.y * uZW;
                float h  = uAmp * field(x, z);
                float e = 0.035;
                float hx = uAmp * field(x + e, z);
                float hz = uAmp * field(x, z + e);
                vN = normalize(vec3(-(hx - h) / e, 1.0, -(hz - h) / e));
                vH = h / max(uAmp, 0.0001);
                vP = vec3(x, h, z);
                gl_Position = projectionMatrix * modelViewMatrix * vec4(x, h, z, 1.0);
            }
        `;
        const WAVE_FRAG = `
            uniform vec3 uColor, uDeep, uLightDir, uCamPos;
            uniform float uZW, uXMin, uOpacity;
            varying vec3 vN; varying vec3 vP; varying float vH;
            void main() {
                vec3 n = normalize(vN);
                vec3 l = normalize(uLightDir);
                vec3 v = normalize(uCamPos - vP);
                float diff = max(dot(n, l), 0.0);
                vec3 hv = normalize(l + v);
                float spec = pow(max(dot(n, hv), 0.0), 70.0);
                float fres = pow(1.0 - max(dot(n, v), 0.0), 3.0);
                float crest = clamp(vH * 0.5 + 0.5, 0.0, 1.0);
                vec3 base = mix(uDeep, uColor, 0.22 + 0.55 * crest);
                vec3 col = base * (0.30 + 0.85 * diff) + spec * 0.55 * vec3(1.0) + fres * 0.22 * uColor;
                float zEdge = uZW * 0.5 - abs(vP.z);
                float a = smoothstep(0.0, 3.0, zEdge) * smoothstep(uXMin, uXMin + 3.5, vP.x);
                gl_FragColor = vec4(col, a * uOpacity);
            }
        `;
        // Partiklar och träffblixtar: mjuka, lysande prickar (additiv blandning)
        const DOT_VERT = `
            attribute float aSize; attribute float aAlpha;
            uniform float uHeightPx, uFovK;
            varying float vA;
            void main() {
                vA = aAlpha;
                vec4 mv = modelViewMatrix * vec4(position, 1.0);
                gl_PointSize = aSize * uHeightPx / (-mv.z * uFovK);
                gl_Position = projectionMatrix * mv;
            }
        `;
        const DOT_FRAG = `
            uniform vec3 uColor; varying float vA;
            void main() {
                vec2 c = gl_PointCoord - 0.5;
                float r = length(c) * 2.0;
                float a = smoothstep(1.0, 0.0, r);
                a = a * a;
                gl_FragColor = vec4(uColor * (0.55 + 0.7 * a) + vec3(0.25) * a * a, a * vA);
            }
        `;

        // ── 3D-scenen ──
        const SpaltScene = ({ stateRef, physRef, actionsRef, onMeasure }) => {
            const mountRef = useRef(null);

            useEffect(() => {
                const mount = mountRef.current;
                const width = mount.clientWidth, height = mount.clientHeight;

                const scene = new THREE.Scene();
                const FOV = 38;
                const camera = new THREE.PerspectiveCamera(FOV, width / height, 0.1, 400);
                const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
                renderer.setSize(width, height);
                renderer.setClearColor(0x000000, 0);
                mount.appendChild(renderer.domElement);

                const controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.08;
                controls.minDistance = 5;
                controls.maxDistance = 110;
                controls.maxPolarAngle = Math.PI * 0.53;
                controls.enablePan = true;
                controls.screenSpacePanning = false;

                // Kameravyer. Hemvyn: snett framifrån och ovanifrån, med skärmens
                // mönster, plattan och vågytan i samma bild.
                const applyView = (which) => {
                    const L = stateRef.current.L;
                    let pos, tgt;
                    if (which === 'ovan') { pos = [L * 0.4, 46, 0.01]; tgt = [L * 0.4, 0, 0]; }
                    else if (which === 'skarm') { pos = [L - 15, 8.5, 0.01]; tgt = [L, GEO.H * 0.5 - 0.3, 0]; }
                    else { pos = [-15, 13.5, 33]; tgt = [L * 0.36, 1.0, 0]; }
                    controls.enableDamping = false;
                    controls.update();
                    camera.position.set(pos[0], pos[1], pos[2]);
                    controls.target.set(tgt[0], tgt[1], tgt[2]);
                    controls.update();
                    controls.enableDamping = true;
                };
                applyView('sida');
                actionsRef.current.setView = applyView;
                window.__spaltCam = camera;

                // Ljus: svagt grundljus, ett kallt nyckelljus snett framifrån
                // och ett svagt punktljus i källans färg.
                scene.add(new THREE.AmbientLight(0xbfd0ff, 0.42));
                const key = new THREE.DirectionalLight(0xffffff, 0.9);
                key.position.set(-8, 22, 14);
                scene.add(key);
                const srcLight = new THREE.PointLight(0xffffff, 0.5, 40);
                srcLight.position.set(GEO.SRC_X + 1, GEO.H * 0.6, 0);
                scene.add(srcLight);

                // ── Vågytan ──
                const waveGeo = new THREE.PlaneGeometry(1, 1, 460, 250);
                const srcArr = [];
                for (let i = 0; i < 16; i++) srcArr.push(new THREE.Vector3(0, 0, 0));
                const waveMat = new THREE.ShaderMaterial({
                    vertexShader: WAVE_VERT, fragmentShader: WAVE_FRAG,
                    transparent: true, depthWrite: true, side: THREE.DoubleSide,
                    uniforms: {
                        uTime: { value: 0 }, uK: { value: 1 }, uOmega: { value: 1 },
                        uXMin: { value: GEO.XMIN }, uXMax: { value: 18 }, uZW: { value: GEO.W },
                        uAmp: { value: 0.22 }, uNSrc: { value: 0 }, uPlane: { value: 1.0 }, uGain: { value: 1.35 },
                        uSrc: { value: srcArr },
                        uColor: { value: new THREE.Color(1, 0.3, 0.3) },
                        uDeep: { value: new THREE.Color(0.05, 0.11, 0.26) },
                        uLightDir: { value: new THREE.Vector3(-0.35, 1, 0.6) },
                        uCamPos: { value: new THREE.Vector3() },
                        uOpacity: { value: 1 },
                    }
                });
                const wave = new THREE.Mesh(waveGeo, waveMat);
                wave.frustumCulled = false;
                scene.add(wave);

                // Ett stilla mörkt golv under vågytan, så att rummet har en
                // botten också när vågytan är avstängd (partikelläget).
                const floorMat = new THREE.MeshStandardMaterial({ color: 0x0c1a38, roughness: 0.85, metalness: 0.1, transparent: true, opacity: 0.9 });
                const floor = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), floorMat);
                floor.rotation.x = -Math.PI / 2;
                floor.position.y = -0.55;
                scene.add(floor);

                // ── Plattan med spalterna ──
                const plateMat = new THREE.MeshStandardMaterial({ color: 0x18253f, metalness: 0.4, roughness: 0.55 });
                const coverMat = new THREE.MeshStandardMaterial({ color: 0x8c6a3a, metalness: 0.6, roughness: 0.4 });
                const edgeMat = new THREE.LineBasicMaterial({ color: 0x6f9be0, transparent: true, opacity: 0.55 });
                const plateGroup = new THREE.Group();
                scene.add(plateGroup);
                const box = (z0, z1, mat, y0 = -0.6, y1 = GEO.H, x0 = -GEO.PLATE_T / 2, x1 = GEO.PLATE_T / 2) => {
                    const g = new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0);
                    const m = new THREE.Mesh(g, mat);
                    m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
                    plateGroup.add(m);
                    const e = new THREE.LineSegments(new THREE.EdgesGeometry(g), edgeMat);
                    e.position.copy(m.position);
                    plateGroup.add(e);
                };
                let plateKey = '';
                const buildPlate = (d, b, slitA, slitB) => {
                    const k = [d, b, slitA, slitB].join('|');
                    if (k === plateKey) return;
                    plateKey = k;
                    while (plateGroup.children.length) {
                        const c = plateGroup.children.pop();
                        c.geometry.dispose();
                    }
                    const zA = -d / 2, zB = d / 2, hb = b / 2;
                    box(-GEO.W / 2, zA - hb, plateMat);
                    box(zA + hb, zB - hb, plateMat);
                    box(zB + hb, GEO.W / 2, plateMat);
                    // en täckt spalt får en mässingsfärgad lucka framför sig
                    if (!slitA) box(zA - hb - 0.12, zA + hb + 0.12, coverMat, -0.6, GEO.H, -GEO.PLATE_T / 2 - 0.12, -GEO.PLATE_T / 2);
                    if (!slitB) box(zB - hb - 0.12, zB + hb + 0.12, coverMat, -0.6, GEO.H, -GEO.PLATE_T / 2 - 0.12, -GEO.PLATE_T / 2);
                };

                // ── Skärmen ──
                const scrCv = document.createElement('canvas');
                scrCv.width = N_COLS; scrCv.height = 384;
                const sctx = scrCv.getContext('2d');
                const dotCv = document.createElement('canvas');
                dotCv.width = N_COLS; dotCv.height = 384;
                const dctx = dotCv.getContext('2d');
                const scrTex = new THREE.CanvasTexture(scrCv);
                scrTex.anisotropy = 8;
                const scrMat = new THREE.MeshBasicMaterial({ map: scrTex });
                const screen = new THREE.Mesh(new THREE.PlaneGeometry(GEO.W, GEO.H), scrMat);
                screen.rotation.y = -Math.PI / 2;   // ytan vänd mot källan (−x)
                screen.position.set(18, GEO.H / 2, 0);
                scene.add(screen);
                const scrBackMat = new THREE.MeshStandardMaterial({ color: 0x1a2946, metalness: 0.3, roughness: 0.6 });
                const scrBack = new THREE.Mesh(new THREE.BoxGeometry(0.35, GEO.H + 0.5, GEO.W + 0.5), scrBackMat);
                scene.add(scrBack);
                const scrEdge = new THREE.LineSegments(new THREE.EdgesGeometry(scrBack.geometry), edgeMat);
                scene.add(scrEdge);
                const placeScreen = (L) => {
                    screen.position.x = L - 0.01;
                    scrBack.position.set(L + 0.18, GEO.H / 2 - 0.25, 0);
                    scrEdge.position.copy(scrBack.position);
                    waveMat.uniforms.uXMax.value = L - 0.15;
                    const fl = L - GEO.XMIN + 2;
                    floor.scale.set(fl, GEO.W + 8, 1);
                    floor.position.x = (GEO.XMIN + L) / 2;
                };

                // ── Källan: laser eller elektronkanon ──
                const srcGroup = new THREE.Group();
                scene.add(srcGroup);
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2a3a5c, metalness: 0.55, roughness: 0.4 });
                const body = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 0.85, 3.4, 40), bodyMat);
                body.rotation.z = Math.PI / 2;
                body.position.set(GEO.SRC_X - 1.7, GEO.H / 2, 0);
                srcGroup.add(body);
                const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 0.95, 0.35, 40), new THREE.MeshStandardMaterial({ color: 0x8fa5cf, metalness: 0.7, roughness: 0.3 }));
                ring.rotation.z = Math.PI / 2;
                ring.position.set(GEO.SRC_X - 0.2, GEO.H / 2, 0);
                srcGroup.add(ring);
                const aperMat = new THREE.MeshBasicMaterial({ color: 0xff4040 });
                const aper = new THREE.Mesh(new THREE.CircleGeometry(0.42, 32), aperMat);
                aper.rotation.y = Math.PI / 2;
                aper.position.set(GEO.SRC_X + 0.01, GEO.H / 2, 0);
                srcGroup.add(aper);
                // stativ ned till golvet
                const stand = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.16, GEO.H / 2 + 0.6, 16), bodyMat);
                stand.position.set(GEO.SRC_X - 1.7, (GEO.H / 2 - 0.6) / 2 - 0.3, 0);
                srcGroup.add(stand);
                const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 0.18, 32), bodyMat);
                foot.position.set(GEO.SRC_X - 1.7, -0.5, 0);
                srcGroup.add(foot);
                // glöd i mynningen (sprite)
                const glowCv = document.createElement('canvas');
                glowCv.width = 128; glowCv.height = 128;
                const gctx = glowCv.getContext('2d');
                const gg = gctx.createRadialGradient(64, 64, 0, 64, 64, 64);
                gg.addColorStop(0, 'rgba(255,255,255,1)');
                gg.addColorStop(0.25, 'rgba(255,255,255,0.55)');
                gg.addColorStop(1, 'rgba(255,255,255,0)');
                gctx.fillStyle = gg; gctx.fillRect(0, 0, 128, 128);
                const glowTex = new THREE.CanvasTexture(glowCv);
                const glowMat = new THREE.SpriteMaterial({ map: glowTex, color: 0xff5050, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
                const glow = new THREE.Sprite(glowMat);
                glow.scale.set(2.6, 2.6, 1);
                glow.position.set(GEO.SRC_X + 0.1, GEO.H / 2, 0);
                srcGroup.add(glow);
                // svag ljusstråle mellan källan och plattan (bara i vågläget)
                const beamMat = new THREE.MeshBasicMaterial({ color: 0xff5050, transparent: true, opacity: 0.09, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
                const beam = new THREE.Mesh(new THREE.BoxGeometry(-GEO.SRC_X - 0.2, 0.9, 1.6), beamMat);
                beam.position.set(GEO.SRC_X / 2 - 0.1, GEO.H / 2, 0);
                scene.add(beam);

                // ── Detektorer vid spalterna (observatören) ──
                // Två små givare monterade bakom plattan, en intill varje spalt,
                // med en lins vänd mot spalten och en lampa som blinkar när en
                // partikel registreras. Syns bara när eleven valt detektorn.
                const detGroup = new THREE.Group();
                scene.add(detGroup);
                const detBodyMat = new THREE.MeshStandardMaterial({ color: 0x3b4a6b, metalness: 0.5, roughness: 0.45 });
                const detLensMat = new THREE.MeshStandardMaterial({ color: 0x9fd3ff, metalness: 0.2, roughness: 0.2, emissive: 0x1a3a5c });
                const makeDet = () => {
                    const g = new THREE.Group();
                    const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), detBodyMat);
                    g.add(body);
                    const lens = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.34, 20), detLensMat);
                    lens.rotation.x = Math.PI / 2;
                    g.add(lens);
                    const lampMat = new THREE.MeshBasicMaterial({ color: 0x4a3510 });
                    const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 12), lampMat);
                    lamp.position.set(0, 0.42, 0);
                    g.add(lamp);
                    const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xffd166, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0 }));
                    halo.scale.set(1.6, 1.6, 1);
                    halo.position.copy(lamp.position);
                    g.add(halo);
                    detGroup.add(g);
                    return { g, lens, lampMat, halo, t: 9 };
                };
                const detA = makeDet(), detB = makeDet();
                const detDim = new THREE.Color(0x4a3510), detLit = new THREE.Color(0xffd166);
                const placeDets = (d, b) => {
                    const zA = -d / 2 - b / 2 - 0.55, zB = d / 2 + b / 2 + 0.55;
                    detA.g.position.set(-0.62, GEO.H / 2, zA);
                    detB.g.position.set(-0.62, GEO.H / 2, zB);
                    detA.lens.position.set(0, 0, 0.42);
                    detB.lens.position.set(0, 0, -0.42);
                };
                const updateDetLamps = (dt) => {
                    [detA, detB].forEach(det => {
                        det.t += dt;
                        const k = Math.exp(-det.t / 0.18);
                        det.lampMat.color.copy(detDim).lerp(detLit, k);
                        det.halo.material.opacity = 0.9 * k;
                    });
                };

                // ── Etiketter (sprites, läsbara ≥ 20 px) ──
                const makeLabel = (segments, hex, scale = 1, size = 40) => {
                    const cv = document.createElement('canvas');
                    cv.width = 640; cv.height = 110;
                    const ctx = cv.getContext('2d');
                    let total = 0;
                    segments.forEach(seg => {
                        const fs = seg.sub ? size * 0.7 : size;
                        ctx.font = (seg.i ? 'italic ' : '') + '600 ' + fs + 'px Poppins, sans-serif';
                        total += ctx.measureText(seg.t).width;
                    });
                    let x = (cv.width - total) / 2;
                    const cy = cv.height / 2;
                    ctx.fillStyle = hex;
                    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                    ctx.shadowColor = 'rgba(0,0,0,0.7)'; ctx.shadowBlur = 6;
                    segments.forEach(seg => {
                        const fs = seg.sub ? size * 0.7 : size;
                        ctx.font = (seg.i ? 'italic ' : '') + '600 ' + fs + 'px Poppins, sans-serif';
                        ctx.fillText(seg.t, x, cy + (seg.sub ? size * 0.22 : 0));
                        x += ctx.measureText(seg.t).width;
                    });
                    const tex = new THREE.CanvasTexture(cv);
                    tex.anisotropy = 4;
                    const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
                    spr.scale.set(cv.width * 0.0068 * scale, cv.height * 0.0068 * scale, 1);
                    spr.renderOrder = 10;
                    return spr;
                };
                const LBL = '#e9eef8';
                const lblSrcLaser = makeLabel([{ t: 'Laser' }], LBL, 2.7);
                const lblSrcEl = makeLabel([{ t: 'Elektronkanon' }], LBL, 2.7);
                lblSrcLaser.position.set(GEO.SRC_X - 1.7, GEO.H / 2 + 1.7, 0);
                lblSrcEl.position.copy(lblSrcLaser.position);
                scene.add(lblSrcLaser); scene.add(lblSrcEl);
                const lblPlate = makeLabel([{ t: 'Dubbelspalt' }], LBL, 2.7);
                lblPlate.position.set(0, GEO.H + 0.9, 0);
                scene.add(lblPlate);
                const lblScreen = makeLabel([{ t: 'Skärm' }], LBL, 2.7);
                scene.add(lblScreen);
                const lblDet = makeLabel([{ t: 'Detektorer' }], LBL, 2.4);
                detGroup.add(lblDet);
                const lblA = makeLabel([{ t: 'A' }], '#8fc1ff', 2.4);
                const lblB = makeLabel([{ t: 'B' }], '#ff9a8f', 2.4);
                scene.add(lblA); scene.add(lblB);

                // ── Maximilinjer, vinkelbåge och n-etiketter ──
                const maxGroup = new THREE.Group();
                scene.add(maxGroup);
                const maxLineMat = new THREE.LineDashedMaterial({ color: 0xf4f7ff, dashSize: 0.5, gapSize: 0.32, transparent: true, opacity: 0.8, depthTest: false });
                const centerLineMat = new THREE.LineBasicMaterial({ color: 0xf4f7ff, transparent: true, opacity: 0.55, depthTest: false });
                const arcMat = new THREE.LineBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.95, depthTest: false });
                const nLabels = new Map();
                const getNLabel = (n) => {
                    if (!nLabels.has(n)) {
                        const spr = makeLabel([{ t: 'n', i: true }, { t: ' = ' + n }], '#f4f7ff', 2.2);
                        nLabels.set(n, spr);
                    }
                    return nLabels.get(n);
                };
                let lblAlpha = makeLabel([{ t: 'α', i: true }, { t: '1', sub: true }], '#ffd166', 2.4);
                let maxKey = '';
                const buildMaxima = (lamUm, d, L, show) => {
                    const k = [lamUm, d, L, show].join('|');
                    if (k === maxKey) return;
                    maxKey = k;
                    while (maxGroup.children.length) {
                        const c = maxGroup.children.pop();
                        if (c.geometry && !c.isSprite) c.geometry.dispose();
                    }
                    if (!show) return;
                    const y = GEO.H / 2;
                    const list = maximaList(lamUm, d, L);
                    list.forEach(m => {
                        const g = new THREE.BufferGeometry().setFromPoints([
                            new THREE.Vector3(0, y, 0), new THREE.Vector3(L, y, m.z)]);
                        const ln = new THREE.Line(g, m.n === 0 ? centerLineMat : maxLineMat);
                        if (m.n !== 0) ln.computeLineDistances();
                        ln.renderOrder = 7;
                        maxGroup.add(ln);
                        const lbl = getNLabel(m.n);
                        const spr = lbl.clone();
                        spr.position.set(L, GEO.H + 0.55, m.z);
                        maxGroup.add(spr);
                    });
                    // vinkelbågen α₁ mellan centrallinjen och första maximet
                    const m1 = list.find(m => m.n === 1 && m.alpha > 0);
                    if (m1) {
                        const R = Math.min(4.2, L * 0.28);
                        const pts = [];
                        for (let i = 0; i <= 28; i++) {
                            const a = m1.alpha * i / 28;
                            pts.push(new THREE.Vector3(R * Math.cos(a), y, R * Math.sin(a)));
                        }
                        const arc = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), arcMat);
                        arc.renderOrder = 8;
                        maxGroup.add(arc);
                        const am = m1.alpha / 2;
                        const spr = lblAlpha.clone();
                        spr.position.set((R + 1.1) * Math.cos(am), y, (R + 1.1) * Math.sin(am));
                        maxGroup.add(spr);
                    }
                };

                // ── Intensitetskurvan som svävande ljusspår ovanför skärmen ──
                const CURVE_N = 400;
                const curvePos = new Float32Array(CURVE_N * 3);
                const curveGeo = new THREE.BufferGeometry();
                curveGeo.setAttribute('position', new THREE.BufferAttribute(curvePos, 3));
                const dotTexCv = document.createElement('canvas');
                dotTexCv.width = 32; dotTexCv.height = 32;
                const dtc = dotTexCv.getContext('2d');
                dtc.fillStyle = '#ffffff'; dtc.beginPath(); dtc.arc(16, 16, 14, 0, Math.PI * 2); dtc.fill();
                const dotTex = new THREE.CanvasTexture(dotTexCv);
                const curveMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.16, sizeAttenuation: true, map: dotTex, alphaTest: 0.5, transparent: true, depthTest: false });
                const curve = new THREE.Points(curveGeo, curveMat);
                curve.renderOrder = 9;
                scene.add(curve);
                const baseGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, -GEO.W / 2), new THREE.Vector3(0, 0, GEO.W / 2)]);
                const baseLine = new THREE.Line(baseGeo, new THREE.LineBasicMaterial({ color: 0x9fb3d9, transparent: true, opacity: 0.5, depthTest: false }));
                scene.add(baseLine);
                const updateCurve = (I, L, show) => {
                    curve.visible = show; baseLine.visible = show;
                    if (!show) return;
                    const y0 = GEO.H + 0.5;
                    for (let i = 0; i < CURVE_N; i++) {
                        const c = Math.floor(i / CURVE_N * N_COLS);
                        const z = (i + 0.5) / CURVE_N * GEO.W - GEO.W / 2;
                        curvePos[i * 3] = L - 0.3; curvePos[i * 3 + 1] = y0 + 2.2 * I[c]; curvePos[i * 3 + 2] = z;
                    }
                    curveGeo.attributes.position.needsUpdate = true;
                    baseLine.position.set(L - 0.3, y0, 0);
                };

                // ── Vägskillnadsmätaren: klick på skärmen ──
                const measGroup = new THREE.Group();
                scene.add(measGroup);
                const matA = new THREE.LineBasicMaterial({ color: 0x6fb0ff, depthTest: false });
                const matB = new THREE.LineBasicMaterial({ color: 0xff8a7a, depthTest: false });
                const marker = new THREE.Mesh(new THREE.SphereGeometry(0.22, 18, 12), new THREE.MeshBasicMaterial({ color: 0xffd166, depthTest: false }));
                marker.renderOrder = 11;
                const lineA = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]), matA);
                const lineB = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]), matB);
                lineA.renderOrder = 10; lineB.renderOrder = 10;
                measGroup.add(marker); measGroup.add(lineA); measGroup.add(lineB);
                let measLabel = null;
                measGroup.visible = false;
                const updateMeasure = () => {
                    const st = stateRef.current;
                    const mz = physRef.current.measureZ;
                    if (mz == null) { measGroup.visible = false; return; }
                    measGroup.visible = true;
                    const y = GEO.H / 2, L = st.L, d = st.d;
                    marker.position.set(L - 0.15, y, mz);
                    lineA.geometry.setFromPoints([new THREE.Vector3(0, y, -d / 2), new THREE.Vector3(L, y, mz)]);
                    lineB.geometry.setFromPoints([new THREE.Vector3(0, y, d / 2), new THREE.Vector3(L, y, mz)]);
                    const rA = Math.hypot(L, mz + d / 2), rB = Math.hypot(L, mz - d / 2);
                    const ds = Math.abs(rB - rA);
                    const lamUm = st.lam / 1000;
                    if (measLabel) { measGroup.remove(measLabel); measLabel.material.map.dispose(); measLabel.material.dispose(); }
                    measLabel = makeLabel([{ t: 'Δ' }, { t: 's', i: true }, { t: ' = ' + fmt(ds / lamUm, 2) + ' ' }, { t: 'λ', i: true }], '#ffd166', 2.3);
                    measLabel.position.set(L - 0.6, y + 1.1, mz);
                    measGroup.add(measLabel);
                };
                actionsRef.current.updateMeasure = updateMeasure;

                // ── Partiklar (i flykt) och träffblixtar ──
                const MAX_DOTS = 900;
                const dotPos = new Float32Array(MAX_DOTS * 3);
                const dotSize = new Float32Array(MAX_DOTS);
                const dotAlpha = new Float32Array(MAX_DOTS);
                const dotGeo = new THREE.BufferGeometry();
                dotGeo.setAttribute('position', new THREE.BufferAttribute(dotPos, 3));
                dotGeo.setAttribute('aSize', new THREE.BufferAttribute(dotSize, 1));
                dotGeo.setAttribute('aAlpha', new THREE.BufferAttribute(dotAlpha, 1));
                dotGeo.setDrawRange(0, 0);
                const dotMat = new THREE.ShaderMaterial({
                    vertexShader: DOT_VERT, fragmentShader: DOT_FRAG,
                    transparent: true, depthWrite: false, depthTest: true, blending: THREE.AdditiveBlending,
                    uniforms: {
                        uColor: { value: new THREE.Color(1, 0.3, 0.3) },
                        uHeightPx: { value: height * renderer.getPixelRatio() },
                        uFovK: { value: 2 * Math.tan(FOV / 2 * DEG) },
                    }
                });
                const dots = new THREE.Points(dotGeo, dotMat);
                dots.frustumCulled = false;
                dots.renderOrder = 6;
                scene.add(dots);
                const particles = [];   // { x, y, z, mode:'flyg'|'gomd', pm, slit, passed, hitZ, hitY, kz, ky }
                window.__spaltParticles = particles;   // test-handtag
                const flashes = [];     // { x, y, z, t }

                // ── Skärmens bild ──
                let I = null, cdfObj = null, intKey = '';
                let Iobs = null, Ikul = null, cdfA = null, cdfB = null, lastPm = null;
                let bandsDirty = true, dotsDirty = true, hits = 0;
                const bandsCv = document.createElement('canvas');
                bandsCv.width = N_COLS; bandsCv.height = 384;
                const bctx = bandsCv.getContext('2d');
                let colRGB = [1, 0.3, 0.3];
                const drawBands = (mode) => {
                    bctx.fillStyle = '#080f22';
                    bctx.fillRect(0, 0, N_COLS, 384);
                    if (mode !== 'vag' || !I) return;
                    const img = bctx.createImageData(N_COLS, 1);
                    const px = img.data;
                    for (let c = 0; c < N_COLS; c++) {
                        const v = Math.pow(Math.min(1, I[c]), 0.62);
                        px[c * 4] = Math.round((8 + (colRGB[0] * 255 - 8) * v));
                        px[c * 4 + 1] = Math.round((15 + (colRGB[1] * 255 - 15) * v));
                        px[c * 4 + 2] = Math.round((34 + (colRGB[2] * 255 - 34) * v));
                        px[c * 4 + 3] = 255;
                    }
                    for (let r = 0; r < 384; r++) bctx.putImageData(img, 0, r);
                    // mjuk ljusnedgång mot skärmens över- och underkant
                    const gv = bctx.createLinearGradient(0, 0, 0, 384);
                    gv.addColorStop(0, 'rgba(8,15,34,0.55)'); gv.addColorStop(0.18, 'rgba(8,15,34,0)');
                    gv.addColorStop(0.82, 'rgba(8,15,34,0)'); gv.addColorStop(1, 'rgba(8,15,34,0.55)');
                    bctx.fillStyle = gv; bctx.fillRect(0, 0, N_COLS, 384);
                };
                const clearDots = () => {
                    dctx.clearRect(0, 0, N_COLS, 384);
                    hits = 0; physRef.current.hits = 0;
                    physRef.current.hitsA = 0; physRef.current.hitsB = 0;
                    dotsDirty = true;
                };
                const addDot = (z, y) => {
                    const cx = (z + GEO.W / 2) / GEO.W * N_COLS;
                    const cy = (1 - y / GEO.H) * 384;
                    const g = dctx.createRadialGradient(cx, cy, 0, cx, cy, 5.5);
                    const c = colRGB.map(v => Math.round(v * 255));
                    g.addColorStop(0, `rgba(255,255,255,0.95)`);
                    g.addColorStop(0.35, `rgba(${c[0]},${c[1]},${c[2]},0.8)`);
                    g.addColorStop(1, `rgba(${c[0]},${c[1]},${c[2]},0)`);
                    dctx.globalCompositeOperation = 'lighter';
                    dctx.fillStyle = g;
                    dctx.beginPath(); dctx.arc(cx, cy, 5.5, 0, Math.PI * 2); dctx.fill();
                    hits++; physRef.current.hits = hits;
                    dotsDirty = true;
                };
                const composeScreen = () => {
                    sctx.globalCompositeOperation = 'source-over';
                    sctx.drawImage(bandsCv, 0, 0);
                    sctx.globalCompositeOperation = 'lighter';
                    sctx.drawImage(dotCv, 0, 0);
                    sctx.globalCompositeOperation = 'source-over';
                    scrTex.needsUpdate = true;
                };
                actionsRef.current.clearScreen = () => { clearDots(); particles.length = 0; flashes.length = 0; };

                // ── Klick på skärmen: vägskillnadsmätaren ──
                const raycaster = new THREE.Raycaster();
                const ndc = new THREE.Vector2();
                let downX = 0, downY = 0;
                const onDown = (ev) => { downX = ev.clientX; downY = ev.clientY; };
                const onUp = (ev) => {
                    if (Math.hypot(ev.clientX - downX, ev.clientY - downY) > 6) return;
                    const rect = renderer.domElement.getBoundingClientRect();
                    ndc.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
                    ndc.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
                    raycaster.setFromCamera(ndc, camera);
                    const hit = raycaster.intersectObject(screen, false);
                    if (hit.length) {
                        physRef.current.measureZ = hit[0].point.z;
                        updateMeasure();
                        onMeasure(hit[0].point.z);
                    }
                };
                renderer.domElement.addEventListener('pointerdown', onDown);
                renderer.domElement.addEventListener('pointerup', onUp);

                // ── Animationsloop ──
                let raf = 0, last = performance.now(), simT = 0, emitAcc = 0;
                let visible = true;
                const io = new IntersectionObserver((es) => { visible = es[0].isIntersecting; }, { threshold: 0.02 });
                io.observe(mount);
                let lastColKey = '';
                const tick = (now) => {
                    raf = requestAnimationFrame(tick);
                    let dt = Math.min(0.05, (now - last) / 1000);
                    last = now;
                    if (!visible) return;
                    const st = stateRef.current;
                    const ph = physRef.current;
                    const lamUm = st.lam / 1000;
                    const slowF = st.slow ? 0.2 : 1;
                    const running = st.running;

                    // färg och källa
                    const col = sceneColor(st.source, st.lam);
                    const colKey = st.source + '|' + st.lam;
                    if (colKey !== lastColKey) {
                        lastColKey = colKey; colRGB = col;
                        waveMat.uniforms.uColor.value.setRGB(col[0], col[1], col[2]);
                        const deep = mixRGB([0.05, 0.11, 0.26], col, 0.18);
                        waveMat.uniforms.uDeep.value.setRGB(deep[0], deep[1], deep[2]);
                        dotMat.uniforms.uColor.value.setRGB(col[0], col[1], col[2]);
                        curveMat.color.setRGB(col[0], col[1], col[2]);
                        aperMat.color.setRGB(col[0], col[1], col[2]);
                        glowMat.color.setRGB(col[0], col[1], col[2]);
                        beamMat.color.setRGB(col[0], col[1], col[2]);
                        srcLight.color.setRGB(col[0], col[1], col[2]);
                        bandsDirty = true;
                    }
                    lblSrcLaser.visible = st.source === 'ljus';
                    lblSrcEl.visible = st.source === 'elektron';
                    beam.visible = st.mode === 'vag';

                    // geometri
                    buildPlate(st.d, st.b, st.slitA, st.slitB);
                    placeScreen(st.L);
                    lblScreen.position.set(st.L, GEO.H + 0.9 + (st.show.max ? 0.75 : 0), 0);
                    lblA.position.set(0, GEO.H + 0.45, -st.d / 2 - 0.1);
                    lblB.position.set(0, GEO.H + 0.45, st.d / 2 + 0.1);
                    const ik = [st.lam, st.d, st.b, st.L, st.slitA, st.slitB].join('|');
                    if (ik !== intKey) {
                        intKey = ik;
                        I = computeIntensity({ lamUm, d: st.d, b: st.b, L: st.L, slitA: st.slitA, slitB: st.slitB });
                        cdfObj = buildCDF(I);
                        // Med detektor vid spalterna försvinner interferenstermen:
                        // mönstret blir summan av de två enkelspaltmönstren.
                        const IA = st.slitA ? computeIntensity({ lamUm, d: st.d, b: st.b, L: st.L, slitA: true, slitB: false }) : new Float32Array(N_COLS);
                        const IB = st.slitB ? computeIntensity({ lamUm, d: st.d, b: st.b, L: st.L, slitA: false, slitB: true }) : new Float32Array(N_COLS);
                        Iobs = new Float32Array(N_COLS);
                        for (let c = 0; c < N_COLS; c++) Iobs[c] = IA[c] + IB[c];
                        cdfA = buildCDF(IA); cdfB = buildCDF(IB);
                        Ikul = computeKulor(st.d, st.b, st.L, st.slitA, st.slitB);
                        // Normeringen utgår från dubbelspaltens centralmax med båda
                        // spalterna öppna. I gränsfall med stort d och kort ℓ ligger
                        // det maximet långt från spalternas egna toppar, och
                        // enkelspaltmönstren kan då överstiga 1: skala ned så att
                        // inget klipps på skärmen eller i kurvan.
                        [I, Iobs].forEach(arr => {
                            let mx = 0;
                            for (let c = 0; c < N_COLS; c++) if (arr[c] > mx) mx = arr[c];
                            if (mx > 1) for (let c = 0; c < N_COLS; c++) arr[c] /= mx;
                        });
                        bandsDirty = true;
                        // ett nytt experiment: gamla träffar hör inte hit
                        clearDots(); particles.length = 0; flashes.length = 0;
                        updateMeasure();
                    }
                    const pm = st.mode === 'partikel' ? st.partMode : 'kvant';
                    if (pm !== lastPm) {
                        lastPm = pm;
                        clearDots(); particles.length = 0; flashes.length = 0;
                    }
                    const Ishow = pm === 'detektor' ? Iobs : pm === 'kulor' ? Ikul : I;
                    ph.I = Ishow;
                    buildMaxima(lamUm, st.d, st.L, st.show.max);
                    updateCurve(Ishow, st.L, st.show.kurva);
                    detGroup.visible = pm === 'detektor';
                    placeDets(st.d, st.b);
                    lblDet.position.set(-0.62, GEO.H / 2 - 1.1, st.d / 2 + st.b / 2 + 1.9);
                    updateDetLamps(running ? dt : 0);

                    // vågytan
                    const srcs = buildSources(st.d, st.b, st.slitA, st.slitB);
                    waveMat.uniforms.uNSrc.value = srcs.length;
                    for (let i = 0; i < 16; i++) {
                        const s = srcs[i];
                        srcArr[i].set(s ? 0 : 0, s ? s.z : 0, s ? s.a : 0);
                    }
                    waveMat.uniforms.uK.value = 2 * Math.PI / lamUm;
                    // fasfarten hålls synlig: vågen går 1,7 µm/s i scenen
                    waveMat.uniforms.uOmega.value = 2 * Math.PI / lamUm * 1.7;
                    if (running) simT += dt * slowF;
                    waveMat.uniforms.uTime.value = simT;
                    waveMat.uniforms.uCamPos.value.copy(camera.position);
                    // Vågytan gäller det omätta försöket: med detektor eller i
                    // kultankeexperimentet har varje partikel en bestämd väg, och
                    // då finns ingen våg att rita.
                    wave.visible = st.show.vagyta && pm === 'kvant';
                    waveMat.uniforms.uOpacity.value = st.mode === 'vag' ? 1 : 0.55;

                    // partiklar
                    const vP = 15 * slowF;              // µm/s i scenen
                    if (st.mode === 'partikel' && running) {
                        emitAcc += st.rate * slowF * dt;
                        while (emitAcc >= 1 && particles.length < MAX_DOTS - 50) {
                            emitAcc -= 1;
                            const anyOpen = st.slitA || st.slitB;
                            particles.push({
                                x: GEO.SRC_X + 0.2, y: GEO.H / 2 + (Math.random() - 0.5) * 0.5,
                                z: (Math.random() - 0.5) * 0.9, mode: 'flyg', t: 0, alpha: 1,
                                pm, anyOpen, slit: null, passed: false
                            });
                        }
                    } else {
                        emitAcc = 0;
                    }
                    if (running) {
                        for (let i = particles.length - 1; i >= 0; i--) {
                            const p = particles[i];
                            if (p.mode === 'flyg') {
                                p.x += vP * dt;
                                if (p.pm !== 'kvant') {
                                    // Bestämd väg: genom EN spalt och sedan rakt mot
                                    // träffpunkten. Med detektorn lottas träffpunkten ur
                                    // spaltens eget enkelspaltmönster; för kulorna ur en
                                    // smal spridning rakt bakom spalten.
                                    if (p.slit == null && p.x >= -0.6) {
                                        const open = [];
                                        if (st.slitA) open.push(-st.d / 2);
                                        if (st.slitB) open.push(st.d / 2);
                                        if (!open.length) { p.mode = 'absorb'; continue; }
                                        const zs = open[Math.floor(Math.random() * open.length)];
                                        p.slit = zs;
                                        p.z = zs + (Math.random() - 0.5) * st.b * 0.9;
                                        let hz = p.pm === 'detektor' ? sampleZ(zs < 0 ? cdfA : cdfB)
                                                                     : p.z + randn() * kulSigma(st.L);
                                        hz = Math.max(-GEO.W / 2 + 0.3, Math.min(GEO.W / 2 - 0.3, hz));
                                        p.hitZ = hz;
                                        p.hitY = GEO.H * (0.12 + 0.76 * Math.random());
                                        const run = st.L - 0.1;
                                        p.kz = (hz - p.z) / run; p.ky = (p.hitY - p.y) / run;
                                    }
                                    if (p.slit != null && !p.passed && p.x >= -0.45) {
                                        p.passed = true;
                                        if (p.pm === 'detektor') {
                                            const det = p.slit < 0 ? detA : detB;
                                            det.t = 0;
                                            if (p.slit < 0) ph.hitsA = (ph.hitsA || 0) + 1; else ph.hitsB = (ph.hitsB || 0) + 1;
                                        }
                                    }
                                    if (p.passed) { p.z += p.kz * vP * dt; p.y += p.ky * vP * dt; }
                                    if (p.x >= st.L - 0.1) {
                                        addDot(p.hitZ, p.hitY); flashes.push({ x: st.L - 0.1, y: p.hitY, z: p.hitZ, t: 0 });
                                        particles.splice(i, 1);
                                    }
                                } else {
                                    // kvantpartikel: tonar bort i plattan och dyker upp på skärmen
                                    if (p.x > -1.4) p.alpha = Math.max(0, (-0.1 - p.x) / 1.3);
                                    if (p.x >= -0.1) {
                                        if (!p.anyOpen) { particles.splice(i, 1); continue; }
                                        p.mode = 'gomd'; p.t = 0;
                                        p.hitZ = sampleZ(cdfObj);
                                        p.hitY = GEO.H * (0.12 + 0.76 * Math.random());
                                        p.tHit = st.L / vP;
                                    }
                                }
                            } else if (p.mode === 'gomd') {
                                p.t += dt;
                                if (p.t >= p.tHit) {
                                    addDot(p.hitZ, p.hitY);
                                    flashes.push({ x: st.L - 0.1, y: p.hitY, z: p.hitZ, t: 0 });
                                    particles.splice(i, 1);
                                }
                            } else {
                                particles.splice(i, 1);
                            }
                        }
                        for (let i = flashes.length - 1; i >= 0; i--) {
                            flashes[i].t += dt * slowF;
                            if (flashes[i].t > 0.55) flashes.splice(i, 1);
                        }
                    }
                    // fyll punktbufferten
                    let n = 0;
                    for (const p of particles) {
                        if (p.mode !== 'flyg' || n >= MAX_DOTS) continue;
                        dotPos[n * 3] = p.x; dotPos[n * 3 + 1] = p.y; dotPos[n * 3 + 2] = p.z;
                        dotSize[n] = 0.42; dotAlpha[n] = p.alpha; n++;
                    }
                    for (const f of flashes) {
                        if (n >= MAX_DOTS) break;
                        const u = f.t / 0.55;
                        dotPos[n * 3] = f.x; dotPos[n * 3 + 1] = f.y; dotPos[n * 3 + 2] = f.z;
                        dotSize[n] = 0.55 + 0.9 * u; dotAlpha[n] = (1 - u) * (1 - u); n++;
                    }
                    dotGeo.setDrawRange(0, n);
                    dotGeo.attributes.position.needsUpdate = true;
                    dotGeo.attributes.aSize.needsUpdate = true;
                    dotGeo.attributes.aAlpha.needsUpdate = true;

                    // skärmen
                    if (bandsDirty || st.mode !== ph.lastMode) { drawBands(st.mode); bandsDirty = false; ph.lastMode = st.mode; dotsDirty = true; }
                    if (dotsDirty) { composeScreen(); dotsDirty = false; }

                    controls.update();
                    renderer.render(scene, camera);
                };
                raf = requestAnimationFrame(tick);

                const onResize = () => {
                    const w = mount.clientWidth, hh = mount.clientHeight;
                    if (!w || !hh) return;
                    camera.aspect = w / hh; camera.updateProjectionMatrix();
                    renderer.setSize(w, hh);
                    dotMat.uniforms.uHeightPx.value = hh * renderer.getPixelRatio();
                };
                window.addEventListener('resize', onResize);
                const ro = new ResizeObserver(onResize);
                ro.observe(mount);

                return () => {
                    cancelAnimationFrame(raf);
                    io.disconnect(); ro.disconnect();
                    window.removeEventListener('resize', onResize);
                    renderer.domElement.removeEventListener('pointerdown', onDown);
                    renderer.domElement.removeEventListener('pointerup', onUp);
                    controls.dispose();
                    renderer.dispose();
                    mount.removeChild(renderer.domElement);
                };
            }, []);

            // absolute inset-0: fyller ramen, och undantar scen-wrappern från
            // sektion 8:s height:auto på mobil (annars kollapsar ramen)
            return <div ref={mountRef} className="absolute inset-0"></div>;
        };

        // ── Intensitetsdiagram i sidopanelen ──
        const IntensityGraph = ({ I, lamUm, d, L, colHex, measureZ }) => {
            const Wpx = 320, Hpx = 130, padL = 30, padR = 46, padT = 12, padB = 26;
            const gw = Wpx - padL - padR, gh = Hpx - padT - padB;
            const path = useMemo(() => {
                if (!I) return '';
                const pts = [];
                for (let i = 0; i <= 200; i++) {
                    const c = Math.min(N_COLS - 1, Math.floor(i / 200 * N_COLS));
                    const x = padL + i / 200 * gw;
                    const y = padT + gh - Math.min(1, I[c]) * gh;
                    pts.push((i ? 'L' : 'M') + x.toFixed(1) + ',' + y.toFixed(1));
                }
                return pts.join(' ');
            }, [I]);
            const maxima = maximaList(lamUm, d, L);
            const zx = (z) => padL + (z + GEO.W / 2) / GEO.W * gw;
            return (
                <svg viewBox={`0 0 ${Wpx} ${Hpx}`} width="100%" style={{ display: 'block' }} role="img"
                     aria-label="Intensiteten längs skärmen med maxima markerade">
                    <line x1={padL} y1={padT + gh} x2={padL + gw + 6} y2={padT + gh} stroke="#1f2530" strokeWidth="1.2" />
                    <polygon points={`${padL + gw + 6},${padT + gh - 3.5} ${padL + gw + 13},${padT + gh} ${padL + gw + 6},${padT + gh + 3.5}`} fill="#1f2530" />
                    <line x1={padL} y1={padT + gh} x2={padL} y2={padT - 4} stroke="#1f2530" strokeWidth="1.2" />
                    <polygon points={`${padL - 3.5},${padT - 4} ${padL},${padT - 11} ${padL + 3.5},${padT - 4}`} fill="#1f2530" />
                    {[-10, -5, 0, 5, 10].map(z => (
                        <g key={z}>
                            <line x1={zx(z)} y1={padT + gh} x2={zx(z)} y2={padT + gh + 4} stroke="#1f2530" strokeWidth="1" />
                            <text x={zx(z)} y={padT + gh + 15} textAnchor="middle" fontSize="9.5" fill="#1f2530" fontFamily="Poppins, sans-serif">{z}</text>
                        </g>
                    ))}
                    <text x={padL + gw + 16} y={padT + gh + 3.5} textAnchor="start" fontSize="9.5" fill="#1f2530" fontFamily="Poppins, sans-serif"><tspan fontStyle="italic">x</tspan> (µm)</text>
                    <text x={padL - 6} y={padT + 2} textAnchor="end" fontSize="9.5" fill="#1f2530" fontFamily="Poppins, sans-serif"><tspan fontStyle="italic">I</tspan></text>
                    {maxima.map((m, i) => (
                        <line key={i} x1={zx(m.z)} y1={padT} x2={zx(m.z)} y2={padT + gh} stroke="#9aa0a6" strokeWidth="0.8" strokeDasharray="3 3" />
                    ))}
                    <path d={path} fill="none" stroke={colHex} strokeWidth="2" strokeLinejoin="round" />
                    {maxima.length <= 7 && maxima.filter(m => m.n <= 3 && zx(m.z) > padL + 16 && zx(m.z) < padL + gw - 4).map((m, i) => (
                        <text key={'t' + i} x={zx(m.z)} y={padT - 2} textAnchor="middle" fontSize="8.5" fill="#5a6170" fontFamily="Poppins, sans-serif">
                            <tspan fontStyle="italic">n</tspan>={m.n}
                        </text>
                    ))}
                    {measureZ != null && (
                        <circle cx={zx(measureZ)} cy={padT + gh + 0.5} r="3" fill="#d9a400" stroke="#1f2530" strokeWidth="0.8" />
                    )}
                </svg>
            );
        };

        // ── Huvudapp ──
        const App = () => {
            const [lam, setLam] = useState(650);
            const [d, setD] = useState(2.4);
            const [b, setB] = useState(0.6);
            const [L, setL] = useState(18);
            const [rate, setRate] = useState(60);
            const [source, setSource] = useState('ljus');
            const [mode, setMode] = useState('vag');
            const [show, setShow] = useState({ vagyta: true, max: false, kurva: false });
            // Partiklarna: 'kvant' = det verkliga försöket utan mätning,
            // 'detektor' = observatör som registrerar vilken spalt,
            // 'kulor' = tankeexperimentet med vanliga små kulor.
            const [partMode, setPartMode] = useState('kvant');
            const [slitA, setSlitA] = useState(true);
            const [slitB, setSlitB] = useState(true);
            const [running, setRunning] = useState(true);
            const [slow, setSlow] = useState(false);
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [togglesOpen, setTogglesOpen] = useState(true);
            const [measureZ, setMeasureZ] = useState(null);
            const [ui, setUi] = useState({ hits: 0, hitsA: 0, hitsB: 0, I: null });
            const sceneWrapRef = useRef(null);

            const stateRef = useRef({});
            stateRef.current = { lam, d, b, L, rate, source, mode, show, partMode, slitA, slitB, running, slow };
            const physRef = useRef({ hits: 0, hitsA: 0, hitsB: 0, measureZ: null, I: null, lastMode: null });
            const actionsRef = useRef({});
            useEffect(() => { window.__spaltPh = physRef.current; window.__spaltActions = actionsRef.current; }, []);

            useEffect(() => {
                const id = setInterval(() => {
                    const ph = physRef.current;
                    setUi(u => (u.hits === ph.hits && u.I === ph.I && u.hitsA === ph.hitsA && u.hitsB === ph.hitsB) ? u
                               : { hits: ph.hits, hitsA: ph.hitsA || 0, hitsB: ph.hitsB || 0, I: ph.I });
                }, 150);
                return () => clearInterval(id);
            }, []);
            useEffect(() => { if (actionsRef.current.updateMeasure) actionsRef.current.updateMeasure(); }, [lam, d, L]);

            useEffect(() => {
                const handler = () => setIsFullscreen(
                    document.fullscreenElement === sceneWrapRef.current ||
                    document.webkitFullscreenElement === sceneWrapRef.current
                );
                document.addEventListener('fullscreenchange', handler);
                document.addEventListener('webkitfullscreenchange', handler);
                return () => {
                    document.removeEventListener('fullscreenchange', handler);
                    document.removeEventListener('webkitfullscreenchange', handler);
                };
            }, []);
            const toggleFullscreen = () => {
                const el = sceneWrapRef.current;
                if (!el) return;
                if (document.fullscreenElement || document.webkitFullscreenElement)
                    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
            };

            const tShow = (k) => setShow(s => ({ ...s, [k]: !s[k] }));
            const clearScreen = () => actionsRef.current.clearScreen && actionsRef.current.clearScreen();
            const clearMeasure = () => { physRef.current.measureZ = null; setMeasureZ(null); if (actionsRef.current.updateMeasure) actionsRef.current.updateMeasure(); };
            const setView = (v) => actionsRef.current.setView && actionsRef.current.setView(v);
            const setModeAndClear = (m) => { setMode(m); clearScreen(); };
            // Färdiga försök. "Två skilda fält" är det parameterval där varje
            // spalts eget diffraktionsmönster (bredd ungefär ℓ·λ/b) blir smalare
            // än spaltavståndet d, så att detektorläget visar två åtskilda
            // fält i stället för ett brett: b·d > λ·ℓ. Med standardvärdena är
            // det omvänt (1,4 mot 12 µm²), så det krävs breda spalter, stort
            // spaltavstånd, kort våglängd OCH kort skärmavstånd samtidigt.
            const forsok = (which) => {
                if (which === 'standard') {
                    setLam(650); setD(2.4); setB(0.6); setL(18);
                    setSource('ljus'); setMode('vag'); setPartMode('kvant');
                    setSlitA(true); setSlitB(true);
                } else if (which === 'tvafalt') {
                    setLam(400); setD(6); setB(1.6); setL(8);
                    setSource('ljus'); setMode('partikel'); setPartMode('detektor'); setRate(200);
                    setSlitA(true); setSlitB(true);
                } else if (which === 'elektron') {
                    setLam(650); setD(2.4); setB(0.6); setL(18);
                    setSource('elektron'); setMode('partikel'); setPartMode('kvant'); setRate(60);
                    setSlitA(true); setSlitB(true);
                }
                clearScreen(); setRunning(true);
            };

            // ── Härledda storheter ──
            const lamUm = lam / 1000;
            const sin1 = lamUm / d;
            const alpha1 = sin1 < 1 ? Math.asin(sin1) : NaN;
            const x1 = isFinite(alpha1) ? L * Math.tan(alpha1) : NaN;
            const maxima = maximaList(lamUm, d, L);
            const nMax = maxima.length;
            const vEl = H_PLANCK / (M_E * lam * 1e-9);
            const fLight = C_LIGHT / (lam * 1e-9);
            const colHex = rgbHex(mixRGB(sceneColor(source, lam), [0, 0, 0], source === 'elektron' ? 0.25 : 0.12));
            const meas = useMemo(() => {
                if (measureZ == null) return null;
                const rA = Math.hypot(L, measureZ + d / 2), rB = Math.hypot(L, measureZ - d / 2);
                const ds = Math.abs(rB - rA);
                const k = ds / lamUm;
                const m = Math.round(k);
                let verdict, typ;
                if (Math.abs(k - m) < 0.12) { verdict = `Vägskillnaden är ${m} hel${m === 1 ? '' : 'a'} våglängd${m === 1 ? '' : 'er'}: vågorna från A och B kommer i fas, konstruktiv interferens. Maximum av ordningen n = ${m}.`; typ = 'max'; }
                else if (Math.abs(k - Math.floor(k) - 0.5) < 0.12) { verdict = `Vägskillnaden är ${Math.floor(k)} + ½ våglängder: vågtopp från den ena spalten möter vågdal från den andra, destruktiv interferens. Här är det mörkt (en nodlinje).`; typ = 'min'; }
                else { verdict = 'Varken helt i fas eller helt i motfas: vågorna förstärker varandra delvis. Flytta markören mot ett ljust band eller ett mörkt.'; typ = 'mellan'; }
                return { rA, rB, ds, k, verdict, typ };
            }, [measureZ, L, d, lamUm]);

            const Readout = ({ label, value, unit, accent }) => (
                <div className="p-2 rounded-lg" style={{ background: 'var(--lab-bg)', border: '1px solid var(--lab-line-strong)' }}>
                    <div className="text-xs" style={{ color: 'var(--lab-ink-muted)' }} dangerouslySetInnerHTML={{ __html: label }} />
                    <div className="font-mono font-bold text-sm" style={{ color: accent ? 'var(--lab-accent)' : 'var(--lab-ink)' }}>
                        {value} <span className="font-normal text-xs" style={{ color: 'var(--lab-ink-muted)' }}>{unit}</span>
                    </div>
                </div>
            );

            // Verktygsvalen (samma i sidopanelens kort och i fullskärmens ruta)
            const toggleBlocks = (nameSuffix) => (
                <React.Fragment>
                    <div>
                        <div className="st-title">Källa</div>
                        <label><input type="radio" name={'kalla' + nameSuffix} checked={source === 'ljus'} onChange={() => { setSource('ljus'); clearScreen(); }} /><span>Laser (ljus)</span></label>
                        <label><input type="radio" name={'kalla' + nameSuffix} checked={source === 'elektron'} onChange={() => { setSource('elektron'); clearScreen(); }} /><span>Elektronkanon</span></label>
                        <div className="st-title mt">Skickar</div>
                        <label><input type="radio" name={'mode' + nameSuffix} checked={mode === 'vag'} onChange={() => setModeAndClear('vag')} /><span>Vågor</span></label>
                        <label><input type="radio" name={'mode' + nameSuffix} checked={mode === 'partikel'} onChange={() => setModeAndClear('partikel')} /><span>En partikel i taget</span></label>
                        {mode === 'partikel' && (
                            <React.Fragment>
                                <div className="st-title mt">Vid spalterna</div>
                                <label><input type="radio" name={'pm' + nameSuffix} checked={partMode === 'kvant'} onChange={() => setPartMode('kvant')} /><span>Ingen mätning (verkligt försök)</span></label>
                                <label><input type="radio" name={'pm' + nameSuffix} checked={partMode === 'detektor'} onChange={() => setPartMode('detektor')} /><span>Detektor: vilken spalt?</span></label>
                                <label><input type="radio" name={'pm' + nameSuffix} checked={partMode === 'kulor'} onChange={() => setPartMode('kulor')} /><span>Tankeexperiment: vanliga små kulor</span></label>
                            </React.Fragment>
                        )}
                    </div>
                    <div>
                        <div className="st-title">Visa</div>
                        <label><input type="checkbox" checked={show.vagyta} onChange={() => tShow('vagyta')} /><span className="st-swatch" style={{ background: colHex }}></span><span>Vågyta</span></label>
                        <label><input type="checkbox" checked={show.max} onChange={() => tShow('max')} /><span className="st-swatch" style={{ background: '#3d4451' }}></span><span>Maximilinjer och <em>α</em><sub>1</sub></span></label>
                        <label><input type="checkbox" checked={show.kurva} onChange={() => tShow('kurva')} /><span className="st-swatch" style={{ background: colHex }}></span><span>Intensitetskurva</span></label>
                        <div className="st-title mt">Spalter</div>
                        <label><input type="checkbox" checked={slitA} onChange={() => setSlitA(v => !v)} /><span className="st-swatch" style={{ background: '#4f8ef7' }}></span><span>Spalt A öppen</span></label>
                        <label><input type="checkbox" checked={slitB} onChange={() => setSlitB(v => !v)} /><span className="st-swatch" style={{ background: '#e0524f' }}></span><span>Spalt B öppen</span></label>
                        <div className="st-title mt">Fart</div>
                        <label><input type="checkbox" checked={slow} onChange={() => setSlow(v => !v)} /><span>Ultrarapid</span></label>
                    </div>
                </React.Fragment>
            );

            const sceneToggles = () => {
                if (!togglesOpen) return (
                    <button className="st-show-btn" onClick={() => setTogglesOpen(true)}
                            aria-label="Visa inställningar" title="Visa inställningar" aria-expanded="false">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             strokeWidth="2" strokeLinecap="round" aria-hidden="true">
                            <line x1="4" y1="8" x2="20" y2="8" />
                            <circle cx="14.5" cy="8" r="2.7" fill="currentColor" stroke="none" />
                            <line x1="4" y1="16" x2="20" y2="16" />
                            <circle cx="9.5" cy="16" r="2.7" fill="currentColor" stroke="none" />
                        </svg>
                    </button>
                );
                return (
                    <div className="scene-toggles">
                        <button className="st-hide" onClick={() => setTogglesOpen(false)}
                                aria-label="Dölj inställningar" title="Dölj inställningar" aria-expanded="true">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 strokeWidth="2.4" strokeLinecap="round" aria-hidden="true">
                                <path d="M6 6l12 12M18 6L6 18" />
                            </svg>
                        </button>
                        {isFullscreen ? toggleBlocks('-fs') : (
                            <React.Fragment>
                                <div className="st-title">Visa</div>
                                <label><input type="checkbox" checked={show.vagyta} onChange={() => tShow('vagyta')} /><span className="st-swatch" style={{ background: colHex }}></span><span>Vågyta</span></label>
                                <label><input type="checkbox" checked={show.max} onChange={() => tShow('max')} /><span className="st-swatch" style={{ background: '#3d4451' }}></span><span>Maximilinjer och <em>α</em><sub>1</sub></span></label>
                                <label><input type="checkbox" checked={show.kurva} onChange={() => tShow('kurva')} /><span className="st-swatch" style={{ background: colHex }}></span><span>Intensitetskurva</span></label>
                            </React.Fragment>
                        )}
                        {isFullscreen && (
                            <React.Fragment>
                                <div className="st-title mt">Reglage</div>
                                <div className="st-sliders">
                                    <StSlider label="Våglängd <em>λ</em>" value={lam} min={LAM_MIN} max={LAM_MAX} step={1} decimals={0} unit="nm" onChange={setLam} />
                                    <StSlider label="Spaltavstånd <em>d</em>" value={d} min={D_MIN} max={D_MAX} step={0.05} decimals={2} unit="µm" onChange={setD} />
                                    <StSlider label="Spaltbredd <em>b</em>" value={b} min={B_MIN} max={B_MAX} step={0.05} decimals={2} unit="µm" onChange={setB} />
                                    <StSlider label="Skärmavstånd <em>ℓ</em>" value={L} min={L_MIN} max={L_MAX} step={0.5} decimals={1} unit="µm" onChange={setL} />
                                    {mode === 'partikel' && (
                                        <StSlider label="Partiklar per sekund" value={rate} min={RATE_MIN} max={RATE_MAX} step={1} decimals={0} unit="/s" onChange={setRate} />
                                    )}
                                </div>
                                <div className="st-title mt">Färdiga försök</div>
                                <div className="st-views">
                                    <button className="btn-toggle" onClick={() => forsok('standard')}>Utgångsläge</button>
                                    <button className="btn-toggle" onClick={() => forsok('elektron')}>Elektroner</button>
                                    <button className="btn-toggle" onClick={() => forsok('tvafalt')}>Två fält</button>
                                </div>
                                <div className="st-title mt">Kameravy</div>
                                <div className="st-views">
                                    <button className="btn-toggle" onClick={() => setView('sida')}>Snett</button>
                                    <button className="btn-toggle" onClick={() => setView('ovan')}>Ovanifrån</button>
                                    <button className="btn-toggle" onClick={() => setView('skarm')}>Mot skärmen</button>
                                </div>
                                <div className="st-actions">
                                    <button className="btn-toggle" onClick={() => setRunning(r => !r)}>{running ? 'Paus' : 'Start'}</button>
