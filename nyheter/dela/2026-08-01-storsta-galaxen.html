    <title>Astronomer hittar äntligen ytterkanten på universums största kända galax — 1,7 miljoner ljusår tvärs över, och den växer fortfarande — Fysiklabbet</title>
    <meta name="description" content="Vintergatan är ungefär 100 000 ljusår bred. Galaxen IC 1101 är sjutton gånger så stor — men exakt var den tar slut har ingen kunnat säga, eftersom en galax inte har någon skarp kant. Nu har ett forskarlag på Kanarieöarna samlat drygt åtta timmars ljus med ett teleskop på La Palma, räknat bort ljusspillet från 250 förgrundsstjärnor och för första gången pekat ut gränsen.">
