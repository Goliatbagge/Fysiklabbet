    <script id="tryck-motor">
// Tryckmotorn för Tryckbänken (fysik1-vatsketryck-app.html).
// Källan ligger här och klistras in oförändrad i sidan; testet
// .claude/test-tryck-motor.js kontrollerar fysiken och att kopian är identisk.
//
// Tre delar:
//   1. Vätsketrycket p = ρ · g · h (och totalt tryck p0 + ρ · g · h).
//   2. Fyra kärl med olika form som kan kopplas ihop i botten. Med kranen
//      öppen strömmar vätskan från högre till lägre bottentryck tills
//      nivåerna är lika (kommunicerande kärl). Volymen bevaras exakt.
//   3. Hydraulpressen: trycket p = F1 / A1 fortplantas i hela vätskan, så
//      oljan trycker på den stora kolven med F2 = p · A2. Kolvarna är
//      masslösa och vätskan går inte att pressa ihop, så den lilla kolven
//      går ned s1 = s2 · A2 / A1 när den stora går upp s2.
(function () {
    const G = 9.82;
    const P0 = 101300;

    const VATSKOR = {
        vatten:   { namn: 'Vatten',     rho: 998 },
        salt:     { namn: 'Saltvatten', rho: 1028 },
        olja:     { namn: 'Matolja',    rho: 920 },
        glycerol: { namn: 'Glycerol',   rho: 1260 },
    };

    const tryck = (rho, h) => rho * G * h;

    // ── Kärlen ──────────────────────────────────────────────
    // Varje kärl har bredden wb vid botten och wt vid kanten (höjd H) och
    // djupet D in i bilden. Bredden ändras linjärt med höjden.
    const KARL_H = 0.40, KARL_D = 0.10;
    const KARL = [
        { namn: 'Brett',         wb: 0.12, wt: 0.12 },
        { namn: 'Smalt',         wb: 0.04, wt: 0.04 },
        { namn: 'Vidgas uppåt',  wb: 0.06, wt: 0.20 },
        { namn: 'Smalnar uppåt', wb: 0.20, wt: 0.05 },
    ];
    const bredd = (k, h) => k.wb + (k.wt - k.wb) * h / KARL_H;
    const volym = (k, h) => KARL_D * (k.wb * h + (k.wt - k.wb) * h * h / (2 * KARL_H));
    function niva(k, V) {
        // löser D · (wb · h + c · h²) = V med c = (wt − wb) / (2H)
        const c = (k.wt - k.wb) / (2 * KARL_H), b = k.wb, q = V / KARL_D;
        if (Math.abs(c) < 1e-12) return q / b;
        return (-b + Math.sqrt(b * b + 4 * c * q)) / (2 * c);
    }
    const VMAX = KARL.map((k) => volym(k, KARL_H));

    // Ett steg med kranen öppen. Röret har samma ledningsförmåga till varje
    // kärl, så trycket i rörets mitt blir medelvärdet av bottentrycken och
    // flödet in i kärl i är K · (p̄ − p_i). Summan av flödena är noll, så
    // volymen bevaras. K väljs så att utjämningen tar ett par sekunder.
    const K_ROR = 2.5e-6;          // m³/(s · Pa)
    function stegKarl(V, rho, dt) {
        const n = 30, h = dt / n;
        const flode = V.map(() => 0);
        for (let s = 0; s < n; s++) {
            const p = V.map((v, i) => tryck(rho, niva(KARL[i], v)));
            const medel = p.reduce((a, b) => a + b, 0) / p.length;
            for (let i = 0; i < V.length; i++) {
                const q = K_ROR * (medel - p[i]);
                V[i] = Math.max(0, V[i] + q * h);
                flode[i] = q;
            }
        }
        return flode;              // m³/s in i varje kärl (negativt = ut)
    }
    // Den gemensamma nivån när alla kärl är sammankopplade: den nivå där
    // summan av volymerna är lika med den totala volymen.
    function gemensamNiva(Vtot) {
        let lo = 0, hi = KARL_H;
        for (let i = 0; i < 60; i++) {
            const mid = (lo + hi) / 2;
            const V = KARL.reduce((s, k) => s + volym(k, mid), 0);
            if (V < Vtot) lo = mid; else hi = mid;
        }
        return (lo + hi) / 2;
    }

    // ── Hydraulpressen ──────────────────────────────────────
    // cfg = { F1, A1, A2, m, s1max }, alla i SI-enheter.
    function press(cfg) {
        const p = cfg.F1 / cfg.A1;
        const F2 = p * cfg.A2;
        const FG = cfg.m * G;
        return { p, F2, FG, F1behov: FG * cfg.A1 / cfg.A2, lyfter: F2 > FG + 1e-9 };
    }
    const nyPress = () => ({ t: 0, s2: 0, v2: 0, klar: false });
    // Lasten accelereras av F2 − F_G. Räcker kraften inte står lasten kvar
    // på sina stöd. Steget är exakt för konstant acceleration.
    function stegPress(st, cfg, dt) {
        if (st.klar) return st;
        const d = press(cfg);
        if (!d.lyfter && st.v2 <= 0) { st.t += dt; return st; }
        const a = (d.F2 - d.FG) / cfg.m;
        const s2max = cfg.s1max * cfg.A1 / cfg.A2;
        let tt = dt;
        const s2ny = st.s2 + st.v2 * dt + 0.5 * a * dt * dt;
        if (s2ny >= s2max) {
            // tiden till slaget är slut: s2max − s2 = v · τ + a · τ² / 2
            const ds = s2max - st.s2;
            tt = Math.abs(a) > 1e-12 ? (-st.v2 + Math.sqrt(st.v2 * st.v2 + 2 * a * ds)) / a : ds / st.v2;
            st.s2 = s2max; st.v2 = st.v2 + a * tt; st.klar = true;
        } else {
            st.s2 = s2ny; st.v2 = st.v2 + a * dt;
        }
        st.t += tt;
        return st;
    }
    const s1av = (st, cfg) => st.s2 * cfg.A2 / cfg.A1;

    const ut = { G, P0, VATSKOR, tryck, KARL, KARL_H, KARL_D, bredd, volym, niva, VMAX,
                 stegKarl, gemensamNiva, press, nyPress, stegPress, s1av };
    if (typeof window !== 'undefined') window.TryckMotor = ut;
    if (typeof module !== 'undefined') module.exports = ut;
})();
</script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const M = window.TryckMotor;
        const G = M.G;

        // ── Talformat: decimalkomma, äkta minustecken, exakt noll som "0", hårt mellanslag i tusental ──
        const fmt = (num, d = 1) => {
            if (!isFinite(num)) return '–';
            const s = num.toFixed(d);
            if (parseFloat(s) === 0) return '0';
            const [hel, dec] = s.replace('-', '').split('.');
            const grupper = hel.length > 3 ? hel.replace(/\B(?=(\d{3})+(?!\d))/g, ' ') : hel;
            return (num < 0 ? '−' : '') + grupper + (dec !== undefined ? ',' + dec : '');
        };
        // tryck i Pa eller kPa, med lagom många decimaler
        const fmtP = (p) => (p < 10000 ? `${fmt(p, 0)} Pa` : `${fmt(p / 1000, 1)} kPa`);

        // Ren text med variabler i kursiv: F_1, A_2, p_0 får index, och ensamma
        // storhetsbokstäver (p, h, g, m, ρ) kursiveras. En bokstav direkt efter
        // ett tal är en enhet och står rakt.
        const Fx = ({ text }) => {
            const delar = [];
            const re = /(?<![\p{L}\d])([FApsm])_([\p{L}\d]+)|(?<![\p{L}\d])(?<!\d )([phgmρ])(?![\p{L}\d])/gu;
            let sist = 0, mm, n = 0;
            while ((mm = re.exec(text))) {
                if (mm.index > sist) delar.push(text.slice(sist, mm.index));
                if (mm[1]) delar.push(<span key={n++}><em>{mm[1]}</em><sub>{mm[2]}</sub></span>);
                else delar.push(<em key={n++}>{mm[3]}</em>);
                sist = re.lastIndex;
            }
            delar.push(text.slice(sist));
            return <React.Fragment>{delar}</React.Fragment>;
        };

        // Bråk med rakt bråkstreck mitt i löptexten
        const Brak = ({ t, n }) => (
            <span style={{ display: 'inline-flex', flexDirection: 'column', verticalAlign: 'middle', textAlign: 'center',
                           lineHeight: 1.05, fontSize: '0.92em', margin: '0 3px' }}>
                <span style={{ padding: '0 2px 1px' }}>{t}</span>
                <span style={{ padding: '1px 2px 0', borderTop: '1.5px solid currentColor' }}>{n}</span>
            </span>
        );

        const COL = {
            ink:   '#0f1620',
            soft:  'rgba(15,22,32,0.7)',
            tyngd: '#7c3aed',
            kraft: '#2563c9',
            olja:  '#2563c9',
            grans: '#c8324a',
            pelare:'#c8324a',
        };
        // vätskornas färg i scenen
        const FARG = {
            vatten:   { fyll: '#a9d6ea', kant: '#5f9fc0' },
            salt:     { fyll: '#93c6db', kant: '#4f8dab' },
            olja:     { fyll: '#efd27a', kant: '#b8962c' },
            glycerol: { fyll: '#d3e9df', kant: '#86b3a0' },
        };

        const LAGEN = {
            sond:  { namn: 'Trycksonden' },
            karl:  { namn: 'Kärlens form' },
            press: { namn: 'Hydraulpressen' },
        };

        // ════════════════════════════════════════════════════════
        //  SCENENS GEOMETRI (viewBox 1000 × 660)
        // ════════════════════════════════════════════════════════
        const VB_W = 1000, VB_H = 660;
        const BANK = 590;

        // Trycksonden: akvariet eller den djupa cisternen.
        const KAR = {
            akvarium: { namn: 'Akvarium', S: 650, x0: 150, x1: 520, botten: 560, hojd: 0.60, niva: 0.55, hmax: 0.45, steg: 0.01 },
            cistern:  { namn: 'Djup cistern', S: 36, x0: 255, x1: 415, botten: 560, hojd: 12, niva: 11.5, hmax: 10.4, steg: 0.1 },
        };
        const ytaY = (k) => k.botten - k.niva * k.S;
        const MEMBRAN_R = 22;                // membranets radie i scenen
        const MEMBRAN_A = 0.0036;            // membranets area, 36 cm²
        const ROT = { upp: 0, sida: 270, ned: 180 };   // åt sidan: membranet mot vänster
        // U-rörsmanometern (färgat vatten), samma skala som akvariet
        const MAN = { xv: 640, xh: 720, topp: 154, botten: 500, vila: 310, rho: 998 };

        // Kärlen
        const KS = 800;                      // px per meter
        const K_BOTTEN = 500, K_ROR = 538;
        const K_X = [118, 282, 458, 670];

        // Hydraulpressen
        const PS = 181;                      // px per meter, samma i alla led
        const P_X1 = 210, P_X2 = 560;        // cylindrarnas mitt
        const P_TOPP1 = 300, P_KOLV1 = 330, P_TOPP2 = 380, P_KOLV2 = 400, P_BOTTEN = 520, P_ROR = 542;
        const S1MAX = 0.25;
        const LASTER = {
            lada:  { namn: 'Lådan',      m: 100 },
            pall:  { namn: 'Tegelpallen', m: 500 },
            bil:   { namn: 'Bilen',      m: 2000 },
        };
        const diam = (A) => Math.sqrt(4 * A / Math.PI);

        // ════════════════════════════════════════════════════════
        //  RITDELAR
        // ════════════════════════════════════════════════════════
        // Pil med rakt avslutat skaft som slutar vid huvudets bas.
        const Pil = ({ x1, y1, x2, y2, color, width = 4.5, head = 15, dash = false, edge = false, opacity = 1 }) => {
            const len = Math.hypot(x2 - x1, y2 - y1);
            if (len < 2) return null;
            const ux = (x2 - x1) / len, uy = (y2 - y1) / len;
            const hd = Math.min(head, len * 0.9);
            const bx = x2 - ux * hd, by = y2 - uy * hd;
            const hw = hd * 0.48;
            const p1 = `${bx - uy * hw},${by + ux * hw}`;
            const p2 = `${bx + uy * hw},${by - ux * hw}`;
            const kant = 'rgba(15,22,32,0.5)';
            return (
                <g opacity={opacity}>
                    {edge && <line x1={x1} y1={y1} x2={bx} y2={by} stroke={kant} strokeWidth={width + 3} strokeLinecap="butt" />}
                    <line x1={x1} y1={y1} x2={bx} y2={by} stroke={color} strokeWidth={width}
                          strokeLinecap="butt" strokeDasharray={dash ? '7 5' : undefined} />
                    <polygon points={`${x2},${y2} ${p1} ${p2}`} fill={color}
                             stroke={edge ? kant : 'none'} strokeWidth={edge ? 1.6 : 0} strokeLinejoin="round" />
                </g>
            );
        };

        // Beteckning med index: F, Fₛ, F₁ … Variabeln kursiv, indexet rakt.
        const Bet = ({ x, y, sym, idx, color, size = 18, anchor = 'start', weight = 600 }) => (
            <text x={x} y={y} textAnchor={anchor} fontSize={size} fontWeight={weight} fill={color}
                  fontFamily="Poppins, sans-serif">
                <tspan fontStyle="italic">{sym}</tspan>
                {idx != null && <tspan fontSize={size * 0.68} dy={size * 0.25}>{idx}</tspan>}
            </text>
        );

        // En rund tryckmätare med visare och digital avläsning under.
        const Matare = ({ x, y, r = 24, p, pmax, text }) => {
            const v = (-130 + 260 * Math.max(0, Math.min(1, p / pmax))) * Math.PI / 180;
            return (
                <g>
                    <circle cx={x} cy={y} r={r} fill="#f8fafc" stroke="#4b5563" strokeWidth="2" />
                    {[0, 0.25, 0.5, 0.75, 1].map((f) => {
                        const a = (-130 + 260 * f) * Math.PI / 180;
                        return <line key={f} x1={x + Math.sin(a) * (r - 3)} y1={y - Math.cos(a) * (r - 3)} x2={x + Math.sin(a) * (r - 8)} y2={y - Math.cos(a) * (r - 8)} stroke="#4b5563" strokeWidth="1.3" />;
                    })}
                    <line x1={x} y1={y} x2={x + Math.sin(v) * (r - 6)} y2={y - Math.cos(v) * (r - 6)} stroke={COL.grans} strokeWidth="2.2" strokeLinecap="round" />
                    <circle cx={x} cy={y} r="2.6" fill="#374151" />
                    {text && <text x={x} y={y + r + 17} textAnchor="middle" fontSize="14" fontWeight="600" fill={COL.ink} fontFamily="Poppins, sans-serif">{text}</text>}
                </g>
            );
        };

        // Ett mätur: visaren går ett helt varv per millimeter.
        const Matur = ({ x, y, r, varv }) => {
            const a = 2 * Math.PI * (varv % 1);
            return (
                <g>
                    <circle cx={x} cy={y} r={r} fill="#f8fafc" stroke="#4b5563" strokeWidth="2" />
                    {Array.from({ length: 10 }, (_, i) => {
                        const b = 2 * Math.PI * i / 10;
                        return <line key={i} x1={x + Math.sin(b) * (r - 3)} y1={y - Math.cos(b) * (r - 3)} x2={x + Math.sin(b) * (r - (i % 5 ? 7 : 10))} y2={y - Math.cos(b) * (r - (i % 5 ? 7 : 10))} stroke="#4b5563" strokeWidth="1.2" />;
                    })}
                    <line x1={x} y1={y} x2={x + Math.sin(a) * (r - 5)} y2={y - Math.cos(a) * (r - 5)} stroke={COL.grans} strokeWidth="2" strokeLinecap="round" />
                    <circle cx={x} cy={y} r="2.6" fill="#374151" />
                </g>
            );
        };

        // ════════════════════════════════════════════════════════
        //  SCENEN: TRYCKSONDEN
        // ════════════════════════════════════════════════════════
        const SondScen = ({ k, vatska, h, sx, rikt, show, dolj, setH, setSx, svgRef }) => {
            const rho = M.VATSKOR[vatska].rho;
            const p = M.tryck(rho, h);
            const yta = ytaY(k);
            const cx = k === KAR.akvarium ? Math.max(k.x0 + 40, Math.min(k.x1 - 112, k.x0 + sx * k.S)) : (k.x0 + k.x1) / 2 + 20;
            const cy = yta + h * k.S;
            const f = FARG[vatska];
            const vinkel = ROT[rikt];
            const rad = vinkel * Math.PI / 180;
            const rotera = (lx, ly) => ({ x: cx + lx * Math.cos(rad) - ly * Math.sin(rad), y: cy + lx * Math.sin(rad) + ly * Math.cos(rad) });
            const stam = rotera(0, 44);
            const T = { x: cx + 92, y: cy - 30 };
            const ovan = k.botten - k.hojd * k.S - 30;           // slangen går över kanten här
            const kantY = k.botten - k.hojd * k.S;
            const kontroll = rotera(0, 80);
            const slang = k === KAR.akvarium
                ? `M ${stam.x} ${stam.y} C ${kontroll.x} ${kontroll.y} ${T.x} ${T.y + 40} ${T.x} ${T.y} L ${T.x} ${ovan + 14} Q ${T.x} ${ovan} ${T.x + 14} ${ovan} L ${MAN.xv - 14} ${ovan} Q ${MAN.xv} ${ovan} ${MAN.xv} ${ovan + 14} L ${MAN.xv} ${MAN.topp}`
                : `M ${stam.x} ${stam.y} C ${kontroll.x} ${kontroll.y} ${T.x} ${T.y + 40} ${T.x} ${T.y} L ${T.x} ${ovan + 14} Q ${T.x} ${ovan} ${T.x + 14} ${ovan} L 650 ${ovan} Q 680 ${ovan} 680 ${ovan + 30} L 680 236`;
            // membranet buktar inåt, mer ju större tryck
            const bukt = Math.min(9, 2 + 7 * p / (k === KAR.akvarium ? 6000 : 110000));
            // manometern: vänster skänkel trycks ned, höger stiger, nivåskillnaden Δh = p / (ρ_m · g)
            const dh = dolj ? 0 : p / (MAN.rho * G);
            const d = dh / 2 * k.S;
            const yV = MAN.vila + d, yH = MAN.vila - d;
            // vätskepelaren ovanför membranets mitt
            const pelBred = 2 * MEMBRAN_R;
            const bricka = k === KAR.akvarium ? 0.05 : 1;
            const nBrickor = h / bricka;
            const pelMassa = rho * MEMBRAN_A * h;

            const dra = (e) => {
                const svg = svgRef.current;
                if (!svg || dolj) return;
                e.preventDefault();
                const flytta = (ev) => {
                    const pt = svg.createSVGPoint();
                    pt.x = ev.clientX; pt.y = ev.clientY;
                    const q = pt.matrixTransform(svg.getScreenCTM().inverse());
                    const ny = Math.max(0.02, Math.min(k.hmax, (q.y - yta) / k.S));
                    setH(Math.round(ny / k.steg) * k.steg);
                    if (k === KAR.akvarium) setSx(Math.max(40, Math.min(k.x1 - k.x0 - 112, q.x - k.x0)) / k.S);
                };
                const slapp = () => { window.removeEventListener('pointermove', flytta); window.removeEventListener('pointerup', slapp); };
                window.addEventListener('pointermove', flytta);
                window.addEventListener('pointerup', slapp);
            };

            // djupskalan till vänster om karet
            const skala = [];
            const stegT = k === KAR.akvarium ? 0.05 : 1, stegL = k === KAR.akvarium ? 0.1 : 2;
            for (let t = 0; t <= k.niva + 1e-9; t += stegT) {
                const y = yta + t * k.S;
                const lang = Math.abs(t / stegL - Math.round(t / stegL)) < 1e-6;
                skala.push(<line key={'t' + t} x1={k.x0 - 6} y1={y} x2={k.x0 - (lang ? 16 : 11)} y2={y} stroke="#4b5563" strokeWidth="1.1" />);
                if (lang) skala.push(<text key={'l' + t} x={k.x0 - 20} y={y + 4} textAnchor="end" fontSize="12" fill={COL.soft} fontFamily="Poppins, sans-serif">
                    {k === KAR.akvarium ? fmt(t * 100, 0) : fmt(t, 0)}</text>);
            }

            // p–h-diagrammet
            const D = { x0: 812, x1: 980, y0: 400, y1: 190 };
            const hMaxD = k === KAR.akvarium ? 0.5 : 11, pMaxD = k === KAR.akvarium ? 7000 : 140000;
            const dx = (hh) => D.x0 + (D.x1 - D.x0) * hh / hMaxD, dy = (pp) => D.y0 - (D.y0 - D.y1) * pp / pMaxD;

            return (
                <g>
                    {/* karet */}
                    <rect x={k.x0} y={yta} width={k.x1 - k.x0} height={k.botten - yta} fill={f.fyll} opacity="0.85" />
                    <line x1={k.x0} y1={yta} x2={k.x1} y2={yta} stroke={f.kant} strokeWidth="2" />
                    {show.pelare && !dolj && (
                        <g>
                            <rect x={cx - pelBred / 2} y={yta} width={pelBred} height={cy - yta} fill="rgba(200,50,74,0.16)" stroke={COL.pelare} strokeWidth="1.6" strokeDasharray="5 4" />
                            {Array.from({ length: Math.floor(nBrickor + 1e-9) }, (_, i) => (
                                <line key={i} x1={cx - pelBred / 2} y1={yta + (i + 1) * bricka * k.S} x2={cx + pelBred / 2} y2={yta + (i + 1) * bricka * k.S}
                                      stroke={COL.pelare} strokeWidth="1" opacity="0.55" />
                            ))}
                        </g>
                    )}
                    <path d={`M ${k.x0} ${kantY} L ${k.x0} ${k.botten} L ${k.x1} ${k.botten} L ${k.x1} ${kantY}`} fill="none" stroke="#5b7083" strokeWidth="3" strokeLinejoin="round" />
                    <line x1={k.x0 + 8} y1={kantY + 10} x2={k.x0 + 8} y2={k.botten - 14} stroke="#eaf6fb" strokeWidth="3" opacity="0.5" />
                    <rect x={k.x0 - 12} y={k.botten} width={k.x1 - k.x0 + 24} height={BANK - k.botten} fill="#8b6a43" />
                    <text x={k.x0} y={kantY - 8} fontSize="13" fill={COL.soft} fontFamily="Poppins, sans-serif">{M.VATSKOR[vatska].namn}, <tspan fontStyle="italic">ρ</tspan> = {fmt(rho, 0)} kg/m³</text>

                    {/* djupskalan och djupet */}
                    {skala}
                    <text x={k.x0 - 20} y={yta - 10} textAnchor="end" fontSize="12" fill={COL.soft} fontFamily="Poppins, sans-serif">{k === KAR.akvarium ? 'cm' : 'm'}</text>
                    <line x1={k.x0 - 4} y1={cy} x2={k.x0 + 2} y2={cy} stroke={COL.pelare} strokeWidth="2" />
                    <polygon points={`${k.x0 - 4},${cy} ${k.x0 - 12},${cy - 5} ${k.x0 - 12},${cy + 5}`} fill={COL.pelare} />
                    <text x={k.x0 - 46} y={cy + 4} textAnchor="end" fontSize="14" fontWeight="600" fill={COL.pelare} fontFamily="Poppins, sans-serif">
                        <tspan fontStyle="italic">h</tspan> = {k === KAR.akvarium ? `${fmt(h * 100, 0)} cm` : `${fmt(h, 1)} m`}
                    </text>

                    {/* manometern eller tryckmätaren */}
                    {k === KAR.akvarium ? (
                        <g>
                            <rect x="602" y="100" width="172" height="468" rx="4" fill="#f4efe4" stroke="#b8a888" strokeWidth="1.2" />
                            {Array.from({ length: 61 }, (_, i) => {
                                const cm = i - 30, y = MAN.vila - cm * 0.01 * k.S / 2 * 2;
                                if (y < 112 || y > MAN.botten) return null;
                                const lang = cm % 10 === 0, mellan = cm % 5 === 0;
                                return (
                                    <g key={i}>
                                        <line x1="742" y1={y} x2={lang ? 758 : mellan ? 753 : 749} y2={y} stroke="#6b7280" strokeWidth="1" />
                                        {lang && <text x="762" y={y + 4} fontSize="11" fill={COL.soft} fontFamily="Poppins, sans-serif">{fmt(Math.abs(cm), 0)}</text>}
                                    </g>
                                );
                            })}
                            <path d={`M ${MAN.xv} ${MAN.topp} L ${MAN.xv} ${MAN.botten} A 40 40 0 0 0 ${MAN.xh} ${MAN.botten} L ${MAN.xh} 108`} fill="none" stroke="#9ca3af" strokeWidth="14" strokeLinejoin="round" />
                            <path d={`M ${MAN.xv} ${MAN.topp} L ${MAN.xv} ${MAN.botten} A 40 40 0 0 0 ${MAN.xh} ${MAN.botten} L ${MAN.xh} 108`} fill="none" stroke="#f8fafc" strokeWidth="10" strokeLinejoin="round" />
                            <path d={`M ${MAN.xv} ${yV} L ${MAN.xv} ${MAN.botten} A 40 40 0 0 0 ${MAN.xh} ${MAN.botten} L ${MAN.xh} ${yH}`} fill="none" stroke="#d04848" strokeWidth="10" />
                            {!dolj && dh > 0.004 && (
                                <g>
                                    <line x1={MAN.xv + 7} y1={yV} x2="672" y2={yV} stroke="rgba(15,22,32,0.45)" strokeWidth="1" strokeDasharray="3 3" />
                                    <line x1="664" y1={yH} x2={MAN.xh - 7} y2={yH} stroke="rgba(15,22,32,0.45)" strokeWidth="1" strokeDasharray="3 3" />
                                    <Pil x1="668" y1={(yV + yH) / 2} x2="668" y2={yH} color={COL.ink} width={1.4} head={7} />
                                    <Pil x1="668" y1={(yV + yH) / 2} x2="668" y2={yV} color={COL.ink} width={1.4} head={7} />
                                    <text x="673" y={(yV + yH) / 2 + 5} fontSize="13" fontWeight="600" fill={COL.ink} fontFamily="Poppins, sans-serif">Δ<tspan fontStyle="italic">h</tspan></text>
                                </g>
                            )}
                            {dolj && <text x="688" y="330" textAnchor="middle" fontSize="40" fontWeight="700" fill={COL.grans} fontFamily="Poppins, sans-serif">?</text>}
                            <text x="688" y="94" textAnchor="middle" fontSize="13" fill={COL.soft} fontFamily="Poppins, sans-serif">U-rörsmanometer</text>
                            <text x="688" y="561" textAnchor="middle" fontSize="12" fill={COL.soft} fontFamily="Poppins, sans-serif">färgat vatten, skala i cm</text>
                        </g>
                    ) : (
                        <g>
                            <rect x="676" y="236" width="8" height="40" fill="#9ca3af" />
                            <Matare x={680} y={330} r={58} p={dolj ? 0 : p} pmax={140000} />
                            {[0, 20, 40, 60, 80, 100, 120, 140].map((kp) => {
                                const a = (-130 + 260 * kp / 140) * Math.PI / 180;
                                return <text key={kp} x={680 + Math.sin(a) * 40} y={330 - Math.cos(a) * 40 + 4} textAnchor="middle" fontSize="10" fill={COL.soft} fontFamily="Poppins, sans-serif">{kp}</text>;
                            })}
                            <text x="680" y="358" textAnchor="middle" fontSize="11" fill={COL.soft} fontFamily="Poppins, sans-serif">kPa</text>
                            <text x="680" y="412" textAnchor="middle" fontSize="15" fontWeight="600" fill={COL.ink} fontFamily="Poppins, sans-serif">{dolj ? '?' : fmtP(p)}</text>
                            <text x="680" y="434" textAnchor="middle" fontSize="12" fill={COL.soft} fontFamily="Poppins, sans-serif">vätsketryck</text>
                        </g>
                    )}

                    {/* slangen och sonden */}
                    <path d={slang} fill="none" stroke="#4b5563" strokeWidth="7" strokeLinecap="round" strokeLinejoin="round" />
                    <path d={slang} fill="none" stroke="#c9d1d9" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" />
                    <g transform={`translate(${cx} ${cy}) rotate(${vinkel})`} style={{ cursor: dolj ? 'default' : 'grab' }} onPointerDown={dra}>
                        <path d={`M ${-MEMBRAN_R - 3} 0 L -5 30 L -5 44 L 5 44 L 5 30 L ${MEMBRAN_R + 3} 0 Z`} fill="#d1d5db" stroke="#4b5563" strokeWidth="1.6" strokeLinejoin="round" />
                        <path d={`M ${-MEMBRAN_R} 0 Q 0 ${2 * bukt} ${MEMBRAN_R} 0`} fill="#b45309" stroke="#7c2d12" strokeWidth="1.6" />
                        <circle cx="0" cy="18" r="34" fill="transparent" />
                    </g>
                    {!dolj && (
                        // små tryckpilar vinkelrätt mot membranet
                        [-12, 0, 12].map((lx) => {
                            const a = rotera(lx, -18), b = rotera(lx, -4 + bukt * (1 - (lx / MEMBRAN_R) ** 2));
                            return <Pil key={lx} x1={a.x} y1={a.y} x2={b.x} y2={b.y} color={COL.kraft} width={2.2} head={7} />;
                        })
                    )}

                    {/* p–h-diagrammet: trycket växer linjärt med djupet */}
                    <g fontFamily="Poppins, sans-serif">
                        <text x={D.x0} y={D.y1 - 22} fontSize="13" fontWeight="600" fill={COL.ink}>Vätsketrycket och djupet</text>
                        <line x1={D.x0} y1={D.y0} x2={D.x1 + 6} y2={D.y0} stroke={COL.ink} strokeWidth="1.3" />
                        <polygon points={`${D.x1 + 10},${D.y0} ${D.x1 + 2},${D.y0 - 4} ${D.x1 + 2},${D.y0 + 4}`} fill={COL.ink} />
                        <line x1={D.x0} y1={D.y0} x2={D.x0} y2={D.y1 - 6} stroke={COL.ink} strokeWidth="1.3" />
                        <polygon points={`${D.x0},${D.y1 - 10} ${D.x0 - 4},${D.y1 - 2} ${D.x0 + 4},${D.y1 - 2}`} fill={COL.ink} />
                        <text x={D.x0 + 8} y={D.y1 - 2} fontSize="12" fill={COL.soft}><tspan fontStyle="italic">p</tspan> ({k === KAR.akvarium ? 'Pa' : 'kPa'})</text>
                        <text x={D.x1} y={D.y0 + 32} textAnchor="end" fontSize="12" fill={COL.soft}><tspan fontStyle="italic">h</tspan> ({k === KAR.akvarium ? 'cm' : 'm'})</text>
                        {[0.5, 1].map((fr) => (
                            <g key={fr}>
                                <line x1={D.x0 - 4} y1={dy(pMaxD * fr)} x2={D.x0} y2={dy(pMaxD * fr)} stroke={COL.ink} strokeWidth="1" />
                                <text x={D.x0 - 6} y={dy(pMaxD * fr) + 4} textAnchor="end" fontSize="10" fill={COL.soft}>{k === KAR.akvarium ? fmt(pMaxD * fr, 0) : fmt(pMaxD * fr / 1000, 0)}</text>
                                <line x1={dx(hMaxD * fr)} y1={D.y0} x2={dx(hMaxD * fr)} y2={D.y0 + 4} stroke={COL.ink} strokeWidth="1" />
                                <text x={dx(hMaxD * fr)} y={D.y0 + 15} textAnchor="middle" fontSize="10" fill={COL.soft}>{k === KAR.akvarium ? fmt(hMaxD * fr * 100, 0) : fmt(hMaxD * fr, 1)}</text>
                            </g>
                        ))}
                        {Object.entries(M.VATSKOR).map(([key, v]) => {
                            const hEnd = Math.min(hMaxD, pMaxD / (v.rho * G));
                            const aktiv = key === vatska;
                            return <line key={key} x1={dx(0)} y1={dy(0)} x2={dx(hEnd)} y2={dy(v.rho * G * hEnd)} stroke={aktiv ? FARG[key].kant : 'rgba(15,22,32,0.18)'} strokeWidth={aktiv ? 2.6 : 1.2} />;
                        })}
                        {!dolj && <circle cx={dx(h)} cy={dy(p)} r="5" fill={COL.pelare} />}
                        {!dolj && <line x1={dx(h)} y1={dy(p)} x2={dx(h)} y2={D.y0} stroke={COL.pelare} strokeWidth="1" strokeDasharray="3 3" />}
                        <text x={D.x0} y={D.y0 + 56} fontSize="12" fill={COL.soft}>En linje för varje vätska.</text>
                        <text x={D.x0} y={D.y0 + 72} fontSize="12" fill={COL.soft}>Dubbla djupet, dubbla trycket.</text>
                    </g>
                </g>
            );
        };

        // ════════════════════════════════════════════════════════
        //  SCENEN: KÄRLENS FORM
        // ════════════════════════════════════════════════════════
        const KarlScen = ({ V, vatska, oppen, flode, dolj, svarat, svgRef, setNiva, vaxlaKran }) => {
            const rho = M.VATSKOR[vatska].rho;
            const f = FARG[vatska];
            const hh = V.map((v, i) => M.niva(M.KARL[i], v));
            const pp = hh.map((x) => M.tryck(rho, x));
            const mm = V.map((v) => rho * v);
            const lika = Math.max(...hh) - Math.min(...hh) < 0.002;
            const kantY = K_BOTTEN - M.KARL_H * KS;
            const pMax = M.tryck(1260, M.KARL_H), mMax = 1260 * Math.max(...M.VMAX);
            const kanDra = !oppen && !dolj;
            const stilla = flode.every((q) => Math.abs(q) < 2e-7);
            // dra i vattenytan: nivån följer pekaren, i steg om 0,5 cm
            const dra = (i) => (e) => {
                const svg = svgRef && svgRef.current;
                if (!svg || !kanDra) return;
                e.preventDefault();
                const flytta = (ev) => {
                    const pt = svg.createSVGPoint();
                    pt.x = ev.clientX; pt.y = ev.clientY;
                    const q = pt.matrixTransform(svg.getScreenCTM().inverse());
                    const x = Math.max(0, Math.min(0.38, (K_BOTTEN - q.y) / KS));
                    setNiva(i, Math.round(x * 200) / 200);
                };
                const slapp = () => { window.removeEventListener('pointermove', flytta); window.removeEventListener('pointerup', slapp); };
                window.addEventListener('pointermove', flytta);
                window.addEventListener('pointerup', slapp);
                flytta(e);
            };
            // instruktionen överst i scenen följer det man gör
            const instr = dolj ? [] : !oppen
                ? ['1. Dra i vattenytorna och ställ in olika nivåer i kärlen.', '2. Öppna kranarna: tryck på en kran eller på knappen.']
                : !lika || !stilla
                    ? ['Vattnet rinner från kärl med högre nivå till kärl med lägre nivå.', 'Det slutar rinna när nivåerna är lika och trycket i botten är lika stort.']
                    : [`Nivåerna är lika, så trycket i botten är ${fmtP(pp[0])} i alla kärl.`, 'Stäng kranarna för att ställa in nya nivåer.'];
            return (
                <g fontFamily="Poppins, sans-serif">
                    {instr.map((s, j) => (
                        <text key={j} x="76" y={44 + j * 22} fontSize="15" fontWeight={j === 0 ? 600 : 400} fill={j === 0 ? COL.ink : COL.soft}>{s}</text>
                    ))}
                    {/* röret i botten med kranarna */}
                    <line x1={K_X[0]} y1={K_ROR} x2={K_X[3]} y2={K_ROR} stroke="#4b5563" strokeWidth="12" strokeLinecap="round" />
                    <line x1={K_X[0]} y1={K_ROR} x2={K_X[3]} y2={K_ROR} stroke={f.fyll} strokeWidth="7" strokeLinecap="round" />
                    {M.KARL.map((k, i) => {
                        const x = K_X[i];
                        const wb = k.wb * KS / 2, wt = k.wt * KS / 2, wh = M.bredd(k, hh[i]) * KS / 2;
                        const yNiva = K_BOTTEN - hh[i] * KS;
                        const q = flode[i];
                        return (
                            <g key={i}>
                                {/* stosen och kranen */}
                                <line x1={x} y1={K_BOTTEN} x2={x} y2={K_ROR} stroke="#4b5563" strokeWidth="12" />
                                <line x1={x} y1={K_BOTTEN} x2={x} y2={K_ROR} stroke={f.fyll} strokeWidth="7" />
                                <g transform={`translate(${x} ${K_ROR - 18})`} onClick={dolj ? undefined : vaxlaKran}
                                   style={{ cursor: dolj ? 'default' : 'pointer' }}>
                                    <circle cx="0" cy="0" r="20" fill="transparent" />
                                    <path d="M -7 -9 L 7 9 L -7 9 L 7 -9 Z" fill={oppen ? '#16a34a' : '#c8324a'} stroke="#1f2937" strokeWidth="1.2" strokeLinejoin="round" />
                                    {/* vredet: längs röret när kranen är öppen, tvärs när den är stängd */}
                                    {oppen ? <line x1="0" y1="-15" x2="0" y2="15" stroke="#1f2937" strokeWidth="3.5" strokeLinecap="round" />
                                           : <line x1="-16" y1="0" x2="16" y2="0" stroke="#1f2937" strokeWidth="3.5" strokeLinecap="round" />}
                                    <circle cx="0" cy="0" r="3" fill="#1f2937" />
                                </g>
                                {oppen && Math.abs(q) > 2e-7 && (
                                    <Pil x1={x + 26} y1={K_ROR - 18 + (q > 0 ? 10 : -10)} x2={x + 26} y2={K_ROR - 18 + (q > 0 ? -10 : 10)} color={COL.kraft} width={2.4} head={8} />
                                )}
                                {/* kärlet */}
                                <polygon points={`${x - wb},${K_BOTTEN} ${x + wb},${K_BOTTEN} ${x + wh},${yNiva} ${x - wh},${yNiva}`} fill={f.fyll} opacity="0.9" />
                                <line x1={x - wh} y1={yNiva} x2={x + wh} y2={yNiva} stroke={f.kant} strokeWidth="2" />
                                {kanDra && (
                                    <g onPointerDown={dra(i)} style={{ cursor: 'ns-resize', touchAction: 'none' }}>
                                        <rect x={x - Math.max(wh, 26)} y={yNiva - 14} width={2 * Math.max(wh, 26)} height="28" fill="transparent" />
                                        <rect x={x - 15} y={yNiva - 7} width="30" height="14" rx="7" fill="#ffffff" stroke={f.kant} strokeWidth="1.8" />
                                        <path d={`M ${x - 5} ${yNiva - 2} L ${x} ${yNiva - 5} L ${x + 5} ${yNiva - 2} M ${x - 5} ${yNiva + 2} L ${x} ${yNiva + 5} L ${x + 5} ${yNiva + 2}`}
                                              fill="none" stroke={f.kant} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" />
                                    </g>
                                )}
                                <path d={`M ${x - wt} ${kantY} L ${x - wb} ${K_BOTTEN} L ${x + wb} ${K_BOTTEN} L ${x + wt} ${kantY}`} fill="none" stroke="#5b7083" strokeWidth="3" strokeLinejoin="round" />
                                <text x={x} y={kantY - 34} textAnchor="middle" fontSize="14" fontWeight="600" fill={COL.ink}>Kärl {i + 1}</text>
                                <text x={x} y={kantY - 16} textAnchor="middle" fontSize="12" fill={COL.soft}>{k.namn.toLowerCase()}</text>
                                {/* tryckmätaren i botten */}
                                <text x={x} y="572" textAnchor="middle" fontSize="13" fill={COL.ink}><tspan fontStyle="italic">h</tspan> = {fmt(hh[i] * 100, 1)} cm</text>
                                <text x={x} y="634" textAnchor="middle" fontSize="14" fontWeight="600" fill={COL.ink}><tspan fontStyle="italic">p</tspan> = {dolj ? '?' : fmtP(pp[i])}</text>
                            </g>
                        );
                    })}
                    {oppen && lika && stilla && (
                        <g>
                            <line x1={K_X[0] - 70} y1={K_BOTTEN - hh[0] * KS} x2={K_X[3] + 90} y2={K_BOTTEN - hh[0] * KS} stroke="rgba(15,22,32,0.5)" strokeWidth="1.2" strokeDasharray="6 4" />
                            <text x={(K_X[0] + K_X[1]) / 2 + 22} y={K_BOTTEN - hh[0] * KS - 8} textAnchor="middle" fontSize="13" fill={COL.ink}>samma nivå</text>
                        </g>
                    )}

                    {/* staplarna: tryck i botten och vätskans massa */}
                    {[['Tryck i botten', pp, pMax, (v) => fmt(v / 1000, 2), 'kPa', 150], ['Vätskans massa', mm, mMax, (v) => fmt(v, 2), 'kg', 400]].map(([rub, vals, max, fm, enh, y0]) => (
                        <g key={rub}>
                            <text x="808" y={y0 - 14} fontSize="13" fontWeight="600" fill={COL.ink}>{rub} ({enh})</text>
                            <line x1="806" y1={y0 + 170} x2="990" y2={y0 + 170} stroke={COL.ink} strokeWidth="1.2" />
                            {vals.map((v, i) => {
                                const hb = dolj && rub === 'Tryck i botten' ? 0 : 160 * v / max;
                                return (
                                    <g key={i}>
                                        <rect x={812 + i * 45} y={y0 + 170 - hb} width="34" height={hb} fill={rub === 'Tryck i botten' ? COL.kraft : '#94a3b8'} />
                                        <text x={829 + i * 45} y={y0 + 186} textAnchor="middle" fontSize="12" fill={COL.soft}>{i + 1}</text>
                                        {!(dolj && rub === 'Tryck i botten') && <text x={829 + i * 45} y={y0 + 164 - hb} textAnchor="middle" fontSize="11" fill={COL.ink}>{fm(v)}</text>}
                                    </g>
                                );
                            })}
                        </g>
                    ))}
                </g>
            );
        };

        // ════════════════════════════════════════════════════════
        //  SCENEN: HYDRAULPRESSEN
        // ════════════════════════════════════════════════════════
        const Last = ({ typ, x, y }) => {
            if (typ === 'bil') return (
                <g transform={`translate(${x - 150} ${y - 74}) scale(2.75)`}>
                    <path d="M 0 25 L 0 18 C 0 16 2 15 5 14 L 21 13 C 29 2 42 0 53 0 L 66 0 C 77 1 85 6 91 14 L 105 16 C 108 16 109 18 109 20 L 109 25 Z" fill="#c8324a" stroke="#7f1d1d" strokeWidth="0.6" strokeLinejoin="round" />
                    <path d="M 28 14 L 35 4 L 51 4 L 51 14 Z" fill="#dbeafe" />
                    <path d="M 55 14 L 55 4 L 68 4 L 75 14 Z" fill="#dbeafe" />
                    <circle cx="24" cy="23.5" r="5" fill="#1f2937" /><circle cx="24" cy="23.5" r="2" fill="#9ca3af" />
                    <circle cx="86" cy="23.5" r="5" fill="#1f2937" /><circle cx="86" cy="23.5" r="2" fill="#9ca3af" />
                </g>
            );
            if (typ === 'pall') return (
                <g>
                    <rect x={x - 90} y={y - 12} width="180" height="12" fill="#a8824d" stroke="#6b4a1e" strokeWidth="1" />
                    {Array.from({ length: 4 }, (_, r) => Array.from({ length: 6 }, (_, c) => (
                        <rect key={r + '-' + c} x={x - 88 + c * 29.3 + (r % 2 ? 7 : 0) - (r % 2 && c === 5 ? 7 : 0)} y={y - 12 - (r + 1) * 17} width={r % 2 && c === 5 ? 22 : 28} height="16" fill="#b5543a" stroke="#7c2d12" strokeWidth="0.8" />
                    )))}
                </g>
            );
            return (
                <g>
                    <rect x={x - 55} y={y - 80} width="110" height="80" fill="#c98d4f" stroke="#7a4d22" strokeWidth="1.8" />
                    <path d={`M ${x - 55} ${y - 80} L ${x + 55} ${y} M ${x + 55} ${y - 80} L ${x - 55} ${y}`} stroke="#9c6430" strokeWidth="2" opacity="0.6" />
                </g>
            );
        };

        const PressScen = ({ cfg, last, st, show, dolj, forsokt }) => {
            const d = M.press(cfg);
            const s1 = M.s1av(st, cfg);
            const w1 = Math.max(14, diam(cfg.A1) * PS), w2 = diam(cfg.A2) * PS;
            const yk1 = P_KOLV1 + s1 * PS, yk2 = P_KOLV2 - st.s2 * PS;
            const plattY = yk2 - 64;
            const pmax = 200000;
            const pVis = dolj ? 0 : d.p;
            const lyftLabel = forsokt && !d.lyfter;
            const W1 = cfg.F1 * s1, W2 = d.F2 * st.s2;
            const LMAX = 52, Fmax = Math.max(d.F2, d.FG, 1);
            const LF2 = LMAX * d.F2 / Fmax, LFG = LMAX * d.FG / Fmax;
            const stMax = Math.max(d.F2, d.FG, 1);
            const staplar = [['F', '1', cfg.F1, COL.kraft], ['F', '2', d.F2, COL.kraft], ['F', 'G', d.FG, COL.tyngd]];
            return (
                <g fontFamily="Poppins, sans-serif">
                    {/* röret och cylindrarna */}
                    <line x1={P_X1} y1={P_ROR} x2={P_X2} y2={P_ROR} stroke="#4b5563" strokeWidth="14" strokeLinecap="round" />
                    <line x1={P_X1} y1={P_ROR} x2={P_X2} y2={P_ROR} stroke="#efd27a" strokeWidth="9" strokeLinecap="round" />
                    <line x1={P_X1} y1={P_BOTTEN} x2={P_X1} y2={P_ROR} stroke="#4b5563" strokeWidth="14" />
                    <line x1={P_X1} y1={P_BOTTEN - 2} x2={P_X1} y2={P_ROR} stroke="#efd27a" strokeWidth="9" />
                    {/* liten cylinder */}
                    <rect x={P_X1 - w1 / 2} y={yk1} width={w1} height={P_BOTTEN - yk1} fill="#efd27a" />
                    <path d={`M ${P_X1 - w1 / 2 - 2} ${P_TOPP1} L ${P_X1 - w1 / 2 - 2} ${P_BOTTEN} L ${P_X1 + w1 / 2 + 2} ${P_BOTTEN} L ${P_X1 + w1 / 2 + 2} ${P_TOPP1}`} fill="none" stroke="#4b5563" strokeWidth="3" />
                    <rect x={P_X1 - w1 / 2} y={yk1 - 8} width={w1} height="8" fill="#6b7280" />
                    <rect x={P_X1 - 3} y={yk1 - 92} width="6" height="84" fill="#9ca3af" stroke="#4b5563" strokeWidth="1" />
                    <rect x={P_X1 - 30} y={yk1 - 102} width="60" height="12" rx="5" fill="#374151" />
                    <Pil x1={P_X1} y1={yk1 - 168} x2={P_X1} y2={yk1 - 104} color={COL.kraft} width={4} />
                    <Bet x={P_X1 + 12} y={yk1 - 140} sym="F" idx="1" color={COL.kraft} size={18} />
                    <text x={P_X1 + 40} y={yk1 - 120} fontSize="13" fill={COL.soft}><tspan fontStyle="italic">A</tspan><tspan fontSize="9" dy="3">1</tspan><tspan dy="-3"> = {fmt(cfg.A1 * 100, 2)} dm²</tspan></text>
                    {/* stor cylinder */}
                    <line x1={P_X2} y1={P_BOTTEN} x2={P_X2} y2={P_ROR} stroke="#4b5563" strokeWidth="14" />
                    <line x1={P_X2} y1={P_BOTTEN - 2} x2={P_X2} y2={P_ROR} stroke="#efd27a" strokeWidth="9" />
                    <rect x={P_X2 - w2 / 2} y={yk2} width={w2} height={P_BOTTEN - yk2} fill="#efd27a" />
                    <path d={`M ${P_X2 - w2 / 2 - 2} ${P_TOPP2} L ${P_X2 - w2 / 2 - 2} ${P_BOTTEN} L ${P_X2 + w2 / 2 + 2} ${P_BOTTEN} L ${P_X2 + w2 / 2 + 2} ${P_TOPP2}`} fill="none" stroke="#4b5563" strokeWidth="3" />
                    <rect x={P_X2 - w2 / 2} y={yk2 - 10} width={w2} height="10" fill="#6b7280" />
                    <rect x={P_X2 - 14} y={plattY + 8} width="28" height={yk2 - 10 - plattY - 8} fill="#9ca3af" stroke="#4b5563" strokeWidth="1" />
                    <rect x={P_X2 - 165} y={plattY} width="330" height="10" fill="#6b7280" stroke="#374151" strokeWidth="1" />
                    {/* stöden som bär lasten när kraften inte räcker */}
                    {[P_X2 - 150, P_X2 + 140].map((sx) => <rect key={sx} x={sx} y={P_KOLV2 - 64 + 10} width="10" height={BANK - (P_KOLV2 - 54)} fill="#a8a29e" stroke="#57534e" strokeWidth="1" />)}
                    <Last typ={last} x={P_X2} y={plattY} />
                    {/* F_2 och F_G ritas i samma skala, så att den större pilen syns som större */}
                    <Pil x1={P_X2} y1={plattY - 40} x2={P_X2} y2={plattY - 40 + LFG} color={COL.tyngd} width={4} edge />
                    <circle cx={P_X2} cy={plattY - 40} r="2.6" fill={COL.ink} />
                    <Bet x={P_X2} y={plattY - 92} sym="F" idx="G" color={COL.tyngd} size={18} anchor="middle" />
                    <Pil x1={P_X2 - 62} y1={yk2} x2={P_X2 - 62} y2={yk2 - LF2} color={COL.kraft} width={4} edge />
                    <Bet x={400} y={yk2 - 16} sym="F" idx="2" color={COL.kraft} size={18} anchor="end" />
                    <text x={400} y={yk2 + 66} textAnchor="end" fontSize="13" fill={COL.soft}><tspan fontStyle="italic">A</tspan><tspan fontSize="9" dy="3">2</tspan><tspan dy="-3"> = {fmt(cfg.A2 * 100, 0)} dm²</tspan></text>
                    {/* mäturet som mäter lyfthöjden */}
                    <rect x={P_X2 + 185} y={plattY - 2} width="6" height={BANK - plattY + 2} fill="#9ca3af" />
                    <line x1={P_X2 + 165} y1={plattY - 24} x2={P_X2 + 185} y2={plattY - 24} stroke="#4b5563" strokeWidth="2" />
                    <line x1={P_X2 + 160} y1={plattY - 24} x2={P_X2 + 160} y2={plattY} stroke="#4b5563" strokeWidth="2" />
                    <Matur x={P_X2 + 210} y={plattY - 50} r={26} varv={st.s2 * 1000} />
                    <text x={P_X2 + 236} y={plattY - 96} textAnchor="end" fontSize="14" fontWeight="600" fill={COL.ink}>mätur: <tspan fontStyle="italic">s</tspan><tspan fontSize="10" dy="3">2</tspan><tspan dy="-3"> = {fmt(st.s2 * 1000, 2)} mm</tspan></text>

                    {/* tryckmätarna: samma tryck överallt */}
                    {[[P_X1 - 78, 470], [262, 470], [790, 470]].map(([gx, gy], i) => (
                        <g key={i}>
                            <line x1={gx} y1={gy + 24} x2={gx} y2={P_ROR - 7} stroke="#6b7280" strokeWidth="5" />
                            {i === 0 && <line x1={gx} y1={P_ROR} x2={P_X1} y2={P_ROR} stroke="#4b5563" strokeWidth="8" />}
                            {i === 2 && <line x1={P_X2} y1={P_ROR} x2={gx} y2={P_ROR} stroke="#4b5563" strokeWidth="8" />}
                            <Matare x={gx} y={gy} r={24} p={pVis} pmax={pmax} />
                            <text x={gx} y={gy - 32} textAnchor="middle" fontSize="13" fontWeight="600" fill={COL.ink}>{dolj ? '?' : fmtP(d.p)}</text>
                        </g>
                    ))}

                    {/* arbetet */}
                    {show.arbete && !dolj && (
                        <g fontSize="13" fill={COL.soft}>
                            <text x="80" y="40" fontWeight="600">Arbetet</text>
                            <text x="80" y="60"><tspan fontStyle="italic">F</tspan><tspan fontSize="9" dy="3">1</tspan><tspan dy="-3"> · </tspan><tspan fontStyle="italic">s</tspan><tspan fontSize="9" dy="3">1</tspan><tspan dy="-3"> = {fmt(cfg.F1, 0)} N · {fmt(s1, 3)} m = {fmt(W1, 1)} J</tspan></text>
                            <text x="80" y="80"><tspan fontStyle="italic">F</tspan><tspan fontSize="9" dy="3">2</tspan><tspan dy="-3"> · </tspan><tspan fontStyle="italic">s</tspan><tspan fontSize="9" dy="3">2</tspan><tspan dy="-3"> = {fmt(d.F2, 0)} N · {fmt(st.s2, 5)} m = {fmt(W2, 1)} J</tspan></text>
                            {st.s2 > 0 && <text x="80" y="100"><tspan fontStyle="italic">F</tspan><tspan fontSize="9" dy="3">G</tspan><tspan dy="-3"> · </tspan><tspan fontStyle="italic">s</tspan><tspan fontSize="9" dy="3">2</tspan><tspan dy="-3"> = {fmt(d.FG * st.s2, 1)} J lyfter lasten, resten blir rörelseenergi</tspan></text>}
                        </g>
                    )}
                    {lyftLabel && !dolj && (
                        <text x="80" y="128" fontSize="14" fontWeight="600" fill={COL.grans}>
                            Kraften räcker inte: oljan trycker med {fmt(d.F2, 0)} N, men lastens tyngd är {fmt(d.FG, 0)} N.
                        </text>
                    )}

                    {/* staplarna */}
                    <text x="822" y="250" fontSize="13" fontWeight="600" fill={COL.ink}>Krafterna (N)</text>
                    <line x1="818" y1="520" x2="990" y2="520" stroke={COL.ink} strokeWidth="1.2" />
                    {staplar.map(([sym, idx, v, c], i) => {
                        const hb = dolj && idx === '2' ? 0 : 220 * v / stMax;
                        return (
                            <g key={i}>
                                <rect x={828 + i * 54} y={520 - hb} width="40" height={hb} fill={c} />
                                {!(dolj && idx === '2') && <text x={848 + i * 54} y={514 - hb} textAnchor="middle" fontSize="11" fill={COL.ink}>{fmt(v, 0)}</text>}
                                <Bet x={848 + i * 54} y={540} sym={sym} idx={idx} color={c} size={15} anchor="middle" />
                            </g>
                        );
                    })}
                </g>
            );
        };

        const Scen = (props) => (
            <svg ref={props.svgRef} viewBox={`0 0 ${VB_W} ${VB_H}`} preserveAspectRatio="xMidYMid meet" role="img"
                 aria-label="En labbänk med försök om tryck i vätskor: en trycksond i ett akvarium med en U-rörsmanometer, fyra kärl med olika form som kan kopplas ihop i botten, eller en hydraulpress med en liten och en stor kolv.">
                <defs>
                    <linearGradient id="vagg" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stopColor="#f7f2e8" /><stop offset="1" stopColor="#ece3d2" />
                    </linearGradient>
                </defs>
                <rect x="0" y="0" width={VB_W} height={VB_H} fill="url(#vagg)" />
                <rect x="20" y={BANK} width="960" height="12" fill="#cbb48c" stroke="#8a6230" strokeWidth="1" />
                {props.lage === 'sond' && <SondScen {...props} />}
                {props.lage === 'karl' && <KarlScen {...props} />}
                {props.lage === 'press' && <PressScen {...props} />}
            </svg>
        );

        // ════════════════════════════════════════════════════════
        //  REGLAGE
        // ════════════════════════════════════════════════════════
        const NumInput = ({ value, min, max, onCommit, fmtFn, unit, disabled, color = 'var(--lab-accent, #c8324a)' }) => {
            const [txt, setTxt] = useState(() => fmtFn(value));
            const [editing, setEditing] = useState(false);
            useEffect(() => { if (!editing) setTxt(fmtFn(value)); }, [value, editing]);
            const commit = (raw) => {
                const norm = raw.replace(',', '.').replace('−', '-').trim();
                if (norm === '' || norm === '-' || norm === '.') return;
                let n = parseFloat(norm);
                if (!isFinite(n)) return;
                if (min != null && n < min) n = min;
                if (max != null && n > max) n = max;
                onCommit(n);
            };
            return (
                <span className="num-wrap">
                    <input className="num-in" type="text" inputMode="decimal" value={txt} disabled={disabled}
                           style={{ color }} aria-label="Skriv in värde"
                           onFocus={() => setEditing(true)}
                           onChange={(e) => { setTxt(e.target.value); commit(e.target.value); }}
                           onBlur={() => { setEditing(false); setTxt(fmtFn(value)); }}
                           onKeyDown={(e) => { if (e.key === 'Enter') e.currentTarget.blur(); }} />
                    {unit && <span className="num-unit">{unit}</span>}
                </span>
            );
        };
        const Slider = ({ label, value, min, max, step, onChange, disabled, children }) => (
            <div className="flex items-center gap-2 mb-2">
                <span className="text-xs flex-shrink-0" style={{ minWidth: 112, color: 'var(--lab-ink-soft)' }}
                      dangerouslySetInnerHTML={{ __html: label }} />
                <input type="range" min={min} max={max} step={step} value={value} disabled={disabled}
                       onChange={(e) => onChange(parseFloat(e.target.value))} className="flex-1 cursor-pointer" />
                {children}
            </div>
        );
        const StSlider = ({ label, value, min, max, step, onChange, disabled, valueNode }) => (
            <div className="st-slider">
                <div className="st-slider-top">
                    <span dangerouslySetInnerHTML={{ __html: label }} />
                    {valueNode}
                </div>
                <input type="range" min={min} max={max} step={step} value={value} disabled={disabled}
                       onChange={(e) => onChange(parseFloat(e.target.value))} />
            </div>
        );

        // Formelkortet: varje storhet har sitt namn ovanför.
        const Vbl = ({ label, children }) => (
            <div className="flex flex-col items-center" style={{ lineHeight: 1.1 }}>
                <span className="flbl">{label}</span>
                <span className="fnum">{children}</span>
                <span className="flbl" aria-hidden="true" style={{ visibility: 'hidden' }}>{label}</span>
            </div>
        );

        // ════════════════════════════════════════════════════════
        //  FORMELKORTET
        // ════════════════════════════════════════════════════════
        const Sub = ({ s, i }) => <span><em>{s}</em><sub>{i}</sub></span>;
        // bråk med ordetikett ovanför täljaren och under nämnaren
        const BrakL = ({ tl, t, n, nl }) => (
            <div className="flex flex-col items-center" style={{ lineHeight: 1.1 }}>
                <span className="flbl">{tl}</span>
                <span className="fnum" style={{ padding: '0 4px' }}>{t}</span>
                <span style={{ alignSelf: 'stretch', borderTop: '2px solid currentColor', margin: '2px 0' }} />
                <span className="fnum" style={{ padding: '0 4px' }}>{n}</span>
                <span className="flbl">{nl}</span>
            </div>
        );
        const FormelKort = ({ lage, vatska, h, p0, kar, V, cfg, st, dolj }) => {
            let formel, rad1, rad2;
            if (lage === 'press') {
                const d = M.press(cfg);
                formel = (
                    <div className="flex items-center gap-x-3">
                        <BrakL tl="Kraft på lilla kolven" t={<Sub s="F" i="1" />} n={<Sub s="A" i="1" />} nl="Lilla kolvens area" />
                        <span className="fnum">=</span>
                        <BrakL tl="Kraft på stora kolven" t={<Sub s="F" i="2" />} n={<Sub s="A" i="2" />} nl="Stora kolvens area" />
                    </div>
                );
                rad1 = <span>Trycket fortplantas i hela oljan, så <Sub s="p" i="1" /> = <Sub s="p" i="2" />:{'  '}
                    <em>p</em> = <Brak t={<Sub s="F" i="1" />} n={<Sub s="A" i="1" />} /> = <Brak t={`${fmt(cfg.F1, 0)} N`} n={`${fmt(cfg.A1 * 100, 2)} dm²`} /> = {fmt(cfg.F1 / (cfg.A1 * 100), 1)} N/dm² = {fmt(d.p, 0)} Pa</span>;
                rad2 = dolj ? <span>Räkna själv innan du trycker ned kolven.</span>
                    : <span><Sub s="F" i="2" /> = <Brak t={<span><Sub s="F" i="1" /> · <Sub s="A" i="2" /></span>} n={<Sub s="A" i="1" />} /> = <Brak t={`${fmt(cfg.F1, 0)} · ${fmt(cfg.A2 * 100, 0)}`} n={fmt(cfg.A1 * 100, 2)} /> = {fmt(d.F2, 0)} N
                        {'   '}({d.lyfter ? 'större' : 'mindre'} än lastens tyngd, {fmt(d.FG, 0)} N)</span>;
            } else {
                const rho = M.VATSKOR[vatska].rho;
                formel = (
                    <div className="flex items-center gap-x-3">
                        <Vbl label={p0 && lage === 'sond' ? 'Totalt tryck' : 'Vätsketryck'}><em>p</em></Vbl>
                        <span className="fnum">=</span>
                        {p0 && lage === 'sond' && <React.Fragment><Vbl label="Lufttryck"><Sub s="p" i="0" /></Vbl><span className="fnum">+</span></React.Fragment>}
                        <Vbl label="Densitet"><em>ρ</em></Vbl>
                        <span className="fnum">·</span>
                        <Vbl label="Tyngdfaktor"><em>g</em></Vbl>
                        <span className="fnum">·</span>
                        <Vbl label="Vätskedjup"><em>h</em></Vbl>
                    </div>
                );
                if (lage === 'sond') {
                    const p = M.tryck(rho, h);
                    const hs = kar === KAR.akvarium ? fmt(h, 2) : fmt(h, 1);
                    const m = rho * MEMBRAN_A * h;
                    rad1 = <span>Vätskepelaren ovanför membranet: <em>p</em> = <Brak t={<em>F</em>} n={<em>A</em>} /> = <Brak t={<span><em>m</em> · <em>g</em></span>} n={<em>A</em>} /> = <Brak t={<span><em>ρ</em> · <em>A</em> · <em>h</em> · <em>g</em></span>} n={<em>A</em>} /> = <em>ρ</em> · <em>g</em> · <em>h</em>{'   '}(arean förkortas bort){!dolj && <span>, här <em>m</em> = {fmt(m, m < 10 ? 2 : 1)} kg på <em>A</em> = 36 cm²</span>}</span>;
                    rad2 = dolj ? <span>Räkna själv innan du tittar på manometern.</span>
                        : <span><em>p</em> = {p0 ? '101 300 + ' : ''}{fmt(rho, 0)} · 9,82 · {hs} = {fmt(p0 ? M.P0 + p : p, 0)} Pa{p0 ? ' (totalt tryck)' : ''}
                            {kar === KAR.cistern && !p0 ? `   (${fmt(100 * p / M.P0, 0)} % av lufttrycket)` : ''}
                            {kar === KAR.akvarium && <span>{'   '}Manometern: Δ<em>h</em> = {fmt(100 * p / (MAN.rho * G), 1)} cm, och <em>ρ</em><sub>vatten</sub> · <em>g</em> · Δ<em>h</em> = 998 · 9,82 · {fmt(p / (MAN.rho * G), 3)} = {fmt(p, 0)} Pa</span>}</span>;
                } else {
                    const hh = V.map((v, i) => M.niva(M.KARL[i], v));
                    rad1 = <span>Trycket i botten beror bara på vätskedjupet <em>h</em>, inte på kärlets form eller på hur mycket {M.VATSKOR[vatska].namn.toLowerCase()} det innehåller.</span>;
                    rad2 = dolj ? <span>Välj det kärl du tror har störst tryck i botten.</span>
                        : Math.max(...hh) - Math.min(...hh) < 0.002
                            ? <span>I alla fyra kärlen: <em>p</em> = {fmt(rho, 0)} · 9,82 · {fmt(hh[0], 3)} = {fmt(M.tryck(rho, hh[0]), 0)} Pa</span>
                            : <span className="flex flex-wrap gap-x-6">{hh.map((x, i) => <span key={i} style={{ whiteSpace: 'nowrap' }}>kärl {i + 1}: <em>p</em> = {fmt(rho, 0)} · 9,82 · {fmt(x, 3)} = {fmt(M.tryck(rho, x), 0)} Pa</span>)}</span>;
                }
            }
            return (
                <div className="glass-card rounded-xl p-4 mb-6" style={{ color: 'var(--lab-ink)' }}>
                    <div className="flex flex-wrap items-center gap-x-8 gap-y-3 mb-3">
                        {formel}
                        <div className="text-sm" style={{ color: 'var(--lab-ink-soft)', maxWidth: 520 }}>
                            {lage === 'press'
                                ? 'Pascals princip: en tryckökning fortplantas lika stor i hela vätskan. En liten kraft på en liten kolv ger en stor kraft på en stor kolv.'
                                : 'Vätsketrycket ökar med djupet. På ett visst djup är det lika stort åt alla håll, och tryckkraften verkar vinkelrätt mot ytan.'}
                        </div>
                    </div>
                    <div className="pt-3 fnum-live" style={{ borderTop: '1px solid var(--lab-line, rgba(15,22,32,0.14))' }}>
                        <div>{rad1}</div>
                        <div className="mt-1">{rad2}</div>
                    </div>
                </div>
            );
        };

        // ════════════════════════════════════════════════════════
        //  FÄRDIGA FÖRSÖK OCH GISSA-LÄGET
        // ════════════════════════════════════════════════════════
        const FORSOK = [
            { id: 'sond',  namn: '35 cm vatten', sub: 'sonden i akvariet', cfg: { lage: 'sond', kar: 'akvarium', vatska: 'vatten', h: 0.35, rikt: 'upp' } },
            { id: 'glyc',  namn: 'Glycerol', sub: 'samma djup, tätare vätska', cfg: { lage: 'sond', kar: 'akvarium', vatska: 'glycerol', h: 0.35, rikt: 'upp' } },
            { id: 'vrid',  namn: 'Vrid sonden', sub: 'membranet åt sidan', cfg: { lage: 'sond', kar: 'akvarium', vatska: 'vatten', h: 0.30, rikt: 'sida' } },
            { id: 'tio',   namn: 'Tio meter vatten', sub: 'ungefär ett lufttryck', cfg: { lage: 'sond', kar: 'cistern', vatska: 'vatten', h: 10, rikt: 'upp' } },
            { id: 'form',  namn: 'Fyra kärl, samma nivå', sub: 'olika mycket vatten', cfg: { lage: 'karl', nivaer: [0.25, 0.25, 0.25, 0.25], oppen: false } },
            { id: 'kran',  namn: 'Öppna kranarna', sub: 'nivåerna jämnar ut sig', cfg: { lage: 'karl', nivaer: [0.10, 0.35, 0.05, 0.25], oppen: true } },
            { id: 'ex1',   namn: 'Domkraften', sub: 'Exempel 1: 100 N lyfter 2 ton', cfg: { lage: 'press', F1: 100, A1: 0.5, A2: 100, last: 'bil', kor: true } },
            { id: 'svag',  namn: 'För liten kraft', sub: 'lasten står kvar', cfg: { lage: 'press', F1: 60, A1: 0.5, A2: 100, last: 'bil', kor: true } },
        ];
        const slump = (a) => a[Math.floor(Math.random() * a.length)];
        function nyUppgift(typ) {
            if (typ === 'sond') return { typ, vatska: slump(['vatten', 'salt', 'olja', 'glycerol']), h: slump([0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45]) };
            if (typ === 'karl') {
                // fyra olika nivåer; det högsta ska inte alltid sitta i samma kärl
                let n;
                do { n = [0, 1, 2, 3].map(() => slump([0.08, 0.12, 0.16, 0.20, 0.24, 0.28, 0.32, 0.36])); } while (new Set(n).size < 4);
                return { typ, nivaer: n };
            }
            // bara uppgifter där svaret ryms på kraftreglaget (högst 400 N)
            let u;
            do { u = { typ, A1: slump([0.2, 0.5, 1.0]), A2: slump([20, 50, 100]), last: slump(['lada', 'pall', 'bil']) }; }
            while (LASTER[u.last].m * G * u.A1 / u.A2 > 380);
            return u;
        }

        // ════════════════════════════════════════════════════════
        //  HUVUDAPP
        // ════════════════════════════════════════════════════════
        const startLage = (() => {
            const q = new URLSearchParams(location.search).get('lage');
            return q === 'pascal' ? 'press' : q === 'karl' ? 'karl' : 'sond';
        })();

        const App = () => {
            const [lage, setLage] = useState(startLage);
            const [vatska, setVatska] = useState('vatten');
            const [karNamn, setKarNamn] = useState('akvarium');
            const [h, setH] = useState(0.35);
            const [rikt, setRikt] = useState('upp');
            const [sx, setSx] = useState(0.315);       // sondens läge i sidled, meter från akvariets vänsterkant
            const [nivaer, setNivaer] = useState([0.32, 0.12, 0.24, 0.08]);
            const [oppen, setOppen] = useState(false);
            const [F1, setF1] = useState(100);
            const [A1, setA1] = useState(0.5);       // dm²
            const [A2, setA2] = useState(100);       // dm²
            const [last, setLast] = useState('bil');
            const [show, setShow] = useState({ pelare: true, p0: false, arbete: true, ultra: false });
            const [togglesOpen, setTogglesOpen] = useState(true);
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [kor, setKor] = useState(false);
            const [forsokt, setForsokt] = useState(false);
            const [, setFrame] = useState(0);
            const [gissa, setGissa] = useState(null);
            const [svarTxt, setSvarTxt] = useState('');
            const [svarStatus, setSvarStatus] = useState(null);
            const [poang, setPoang] = useState({ ratt: 0, totalt: 0, svit: 0 });

            const sceneWrapRef = useRef(null);
            const svgRef = useRef(null);
            const VRef = useRef(null);
            const flodeRef = useRef([0, 0, 0, 0]);
            const pressRef = useRef(M.nyPress());
            const korRef = useRef(false);
            const rafRef = useRef(null);
            const lastRef = useRef(null);
            const gissaRef = useRef(null);

            const kar = KAR[karNamn];
            const cfg = { F1, A1: A1 / 100, A2: A2 / 100, m: LASTER[last].m, s1max: S1MAX };
            const cfgRef = useRef(cfg); cfgRef.current = cfg;
            const ultraRef = useRef(show.ultra); ultraRef.current = show.ultra;
            const vatskaRef = useRef(vatska); vatskaRef.current = vatska;
            if (!VRef.current) VRef.current = nivaer.map((x, i) => M.volym(M.KARL[i], x));

            // kärlens nivåer följer reglagen så länge kranarna är stängda
            useEffect(() => {
                if (!oppen) { VRef.current = nivaer.map((x, i) => M.volym(M.KARL[i], x)); flodeRef.current = [0, 0, 0, 0]; setFrame((n) => n + 1); }
            }, [nivaer, oppen]);
            // pressen börjar om när något ändras
            useEffect(() => { if (!korRef.current) { pressRef.current = M.nyPress(); setForsokt(false); setFrame((n) => n + 1); } }, [F1, A1, A2, last]);
            useEffect(() => { if (h > kar.hmax) setH(kar.hmax); }, [karNamn]);

            // en enda ritloop: kärlen när kranarna är öppna, pressen när den körs
            const igang = (lage === 'karl' && oppen) || (lage === 'press' && kor);
            useEffect(() => {
                if (!igang) return;
                const loop = (ts) => {
                    if (lastRef.current == null) lastRef.current = ts;
                    const dt = Math.min((ts - lastRef.current) / 1000, 0.05);
                    lastRef.current = ts;
                    let fortsatt = true;
                    if (lage === 'karl') {
                        flodeRef.current = M.stegKarl(VRef.current, M.VATSKOR[vatskaRef.current].rho, dt);
                        const hh = VRef.current.map((v, i) => M.niva(M.KARL[i], v));
                        if (Math.max(...hh) - Math.min(...hh) < 2e-4 && Math.max(...flodeRef.current.map(Math.abs)) < 1e-8) {
                            fortsatt = false; flodeRef.current = [0, 0, 0, 0];
                        }
                    } else {
                        const st = pressRef.current;
                        M.stegPress(st, cfgRef.current, dt * (ultraRef.current ? 0.1 : 1));
                        if (st.klar || (!M.press(cfgRef.current).lyfter && st.t > 0.6)) {
                            fortsatt = false; korRef.current = false; setKor(false);
                            if (gissaRef.current) ratta();
                        }
                    }
                    setFrame((n) => n + 1);
                    if (fortsatt) rafRef.current = requestAnimationFrame(loop);
                    else { rafRef.current = null; lastRef.current = null; }
                };
                rafRef.current = requestAnimationFrame(loop);
                return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); rafRef.current = null; lastRef.current = null; };
            }, [igang, lage]);

            const nollPress = () => { pressRef.current = M.nyPress(); setForsokt(false); setFrame((n) => n + 1); };
            const tryckNed = () => {
                if (pressRef.current.klar || pressRef.current.t > 0) nollPress();
                setForsokt(true); korRef.current = true; setKor(true);
            };
            const pausa = () => { korRef.current = false; setKor(false); };
            const borjaOm = () => {
                korRef.current = false; setKor(false); nollPress();
                if (lage === 'karl') { setOppen(false); VRef.current = nivaer.map((x, i) => M.volym(M.KARL[i], x)); }
            };
            const vaxlaKran = () => {
                if (oppen) {
                    // stäng: reglagen tar över de nivåer som kärlen har nu
                    setNivaer(VRef.current.map((v, i) => Math.round(M.niva(M.KARL[i], v) * 1000) / 1000));
                    setOppen(false);
                } else setOppen(true);
            };

            const korForsok = (f) => {
                korRef.current = false; setKor(false);
                const c = f.cfg;
                setLage(c.lage);
                if (c.lage === 'sond') { setKarNamn(c.kar); setVatska(c.vatska); setH(c.h); setRikt(c.rikt); }
                if (c.lage === 'karl') { setVatska('vatten'); setOppen(false); setNivaer(c.nivaer); VRef.current = c.nivaer.map((x, i) => M.volym(M.KARL[i], x));
                                         if (c.oppen) setTimeout(() => setOppen(true), 500); }
                if (c.lage === 'press') { setF1(c.F1); setA1(c.A1); setA2(c.A2); setLast(c.last);
                                          setTimeout(() => { pressRef.current = M.nyPress(); setForsokt(true); korRef.current = true; setKor(true); }, 60); }
            };

            // ── Gissa-läget ──
            const startaGissa = (typ) => {
                const t = nyUppgift(typ);
                korRef.current = false; setKor(false);
                setLage(typ === 'sond' ? 'sond' : typ === 'karl' ? 'karl' : 'press');
                if (typ === 'sond') { setKarNamn('akvarium'); setVatska(t.vatska); setH(t.h); setRikt('upp'); }
                if (typ === 'karl') { setVatska('vatten'); setOppen(false); setNivaer(t.nivaer); VRef.current = t.nivaer.map((x, i) => M.volym(M.KARL[i], x)); }
                if (typ === 'press') { setA1(t.A1); setA2(t.A2); setLast(t.last); setF1(0); }
                setGissa(t); setSvarTxt(''); setSvarStatus(null); gissaRef.current = null;
                setTimeout(nollPress, 30);
            };
            const kolla = (val) => {
                if (gissa.typ === 'karl') { gissaRef.current = { svar: val, t: gissa }; ratta(); return; }
                const n = parseFloat(svarTxt.replace(/\s| /g, '').replace(',', '.').replace('−', '-'));
                if (!isFinite(n)) { setSvarStatus({ ratt: false, text: 'Skriv in ett tal, till exempel 2 450.' }); return; }
                gissaRef.current = { svar: n, t: gissa };
                if (gissa.typ === 'press') {
                    // pressen körs med elevens kraft, så att man ser om den räcker
                    setF1(Math.max(0, Math.min(400, n)));
                    setSvarStatus('kor');
                    setTimeout(() => { pressRef.current = M.nyPress(); setForsokt(true); korRef.current = true; setKor(true); }, 60);
                } else ratta();
            };
            function ratta() {
                const { svar, t } = gissaRef.current;
                gissaRef.current = null;
                const nara = (x, y) => Math.abs(x - y) <= Math.max(0.03 * Math.abs(y), 0.5);
                let text, ratt;
                if (t.typ === 'sond') {
                    const rho = M.VATSKOR[t.vatska].rho, facit = M.tryck(rho, t.h);
                    ratt = nara(svar, facit);
                    text = `${ratt ? 'Rätt!' : 'Inte riktigt.'} p = ρ · g · h = ${fmt(rho, 0)} · 9,82 · ${fmt(t.h, 2)} = ${fmt(facit, 0)} Pa.`;
                    if (!ratt && nara(svar, facit * 100)) text += ' Du räknade med djupet i centimeter. Djupet ska vara i meter för att trycket ska bli i pascal.';
                    else if (!ratt && nara(svar, rho * t.h)) text += ' Du glömde tyngdfaktorn g.';
                    else if (!ratt && nara(svar, M.P0 + facit)) text += ' Det är det totala trycket, med lufttrycket. Manometern visar bara vätsketrycket: lufttrycket verkar både på vattenytan i karet, och därmed på membranet, och på manometerns öppna skänkel, så det tar ut sig.';
                } else if (t.typ === 'karl') {
                    const max = t.nivaer.indexOf(Math.max(...t.nivaer));
                    const massor = t.nivaer.map((x, i) => M.volym(M.KARL[i], x));
                    ratt = svar === max;
                    text = `${ratt ? 'Rätt!' : 'Inte riktigt.'} Kärl ${max + 1} har den högsta nivån, ${fmt(t.nivaer[max] * 100, 0)} cm, och därför störst tryck i botten.`;
                    if (!ratt && svar === massor.indexOf(Math.max(...massor))) text += ` Kärl ${svar + 1} innehåller mest vatten, men det är bara djupet som avgör trycket. Mängden vatten och kärlets form spelar ingen roll.`;
                    else if (!ratt) text += ` Kärl ${svar + 1} har bara ${fmt(t.nivaer[svar] * 100, 0)} cm vatten.`;
                } else {
                    const m = LASTER[t.last].m, facit = m * G * t.A1 / t.A2;
                    ratt = Math.abs(svar - facit) <= 0.015 * facit;
                    text = `${ratt ? 'Rätt!' : 'Inte riktigt.'} Lastens tyngd är F_G = m · g = ${fmt(m, 0)} · 9,82 = ${fmt(m * G, 0)} N. Trycket är lika stort på båda kolvarna, så F_1 förhåller sig till F_G som A_1 till A_2: F_1 = F_G · A_1 delat med A_2 = ${fmt(m * G, 0)} · ${fmt(t.A1, 1)} delat med ${fmt(t.A2, 0)} = ${fmt(facit, facit < 10 ? 2 : 1)} N.`;
                    if (ratt) text += ' Vid exakt den kraften är oljans kraft lika stor som lastens tyngd. Lite mer, så lyfter lasten.';
                    if (!ratt && nara(svar, m * G * t.A2 / t.A1)) text += ' Du vände på areaförhållandet. Den lilla kolven behöver en mindre kraft än den stora.';
                    else if (!ratt && nara(svar, m * t.A1 / t.A2)) text += ' Du räknade med massan i stället för tyngden. Glöm inte g.';
                    else if (!ratt && svar < facit) text += ' Din kraft räckte inte, så lasten stod kvar.';
                }
                setSvarStatus({ ratt, text });
                setPoang((p) => ({ ratt: p.ratt + (ratt ? 1 : 0), totalt: p.totalt + 1, svit: ratt ? p.svit + 1 : 0 }));
            }
            const avslutaGissa = () => { setGissa(null); setSvarStatus(null); gissaRef.current = null; };
            const dolj = !!gissa && (svarStatus === null || svarStatus === 'kor');

            // ── Fullskärm ──
            useEffect(() => {
                const handler = () => setIsFullscreen(document.fullscreenElement === sceneWrapRef.current || document.webkitFullscreenElement === sceneWrapRef.current);
                document.addEventListener('fullscreenchange', handler);
                document.addEventListener('webkitfullscreenchange', handler);
                return () => { document.removeEventListener('fullscreenchange', handler); document.removeEventListener('webkitfullscreenchange', handler); };
            }, []);
            const toggleFullscreen = () => {
                const el = sceneWrapRef.current;
                if (!el) return;
                if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
            };

            const st = pressRef.current;
            const tShow = (key) => setShow((sh) => ({ ...sh, [key]: !sh[key] }));
            const last_ = kor || !!gissa;
            const pagar = st.t > 0 && !st.klar && M.press(cfg).lyfter;
            const startEtikett = kor ? 'Pausa' : pagar ? 'Fortsätt' : 'Tryck ned kolven';
            const startKlick = kor ? pausa : pagar ? () => { korRef.current = true; setKor(true); } : tryckNed;
            const satNiva = (i) => (x) => setNivaer((n) => n.map((y, j) => (j === i ? x : y)));

            const reglage = (Sl, kompakt) => {
                const rad = (label, value, min, max, step, onChange, unit, d = 2, las = last_) => (
                    <Sl key={label} label={label} value={value} min={min} max={max} step={step} onChange={onChange} disabled={las}
                        {...(kompakt ? { valueNode: <NumInput value={value} min={min} max={max} fmtFn={(x) => fmt(x, d)} unit={unit} disabled={las} onCommit={onChange} /> } : {})}>
                        {!kompakt && <NumInput value={value} min={min} max={max} fmtFn={(x) => fmt(x, d)} unit={unit} disabled={las} onCommit={onChange} />}
                    </Sl>
                );
                if (lage === 'sond') return rad('Djup <em>h</em>', karNamn === 'akvarium' ? h * 100 : h, karNamn === 'akvarium' ? 2 : 0.2, karNamn === 'akvarium' ? kar.hmax * 100 : kar.hmax,
                    karNamn === 'akvarium' ? 1 : 0.1, (x) => setH(karNamn === 'akvarium' ? x / 100 : x), karNamn === 'akvarium' ? 'cm' : 'm', karNamn === 'akvarium' ? 0 : 1, !!gissa);
                if (lage === 'karl') return M.KARL.map((k, i) => rad(`Nivå i kärl ${i + 1}`, oppen ? M.niva(k, VRef.current[i]) * 100 : nivaer[i] * 100, 0, 38, 0.5,
                    (x) => satNiva(i)(x / 100), 'cm', 1, !!gissa || oppen));
                return (
                    <React.Fragment>
                        {rad('Kraft <em>F</em><sub>1</sub>', F1, 0, 400, 1, setF1, 'N', 0)}
                        {rad('Liten kolv <em>A</em><sub>1</sub>', A1, 0.2, 2, 0.05, setA1, 'dm²', 2)}
                        {rad('Stor kolv <em>A</em><sub>2</sub>', A2, 10, 150, 1, setA2, 'dm²', 0)}
                    </React.Fragment>
                );
            };

            const sceneToggles = () => {
                if (!togglesOpen) return (
                    <button className="st-show-btn" onClick={() => setTogglesOpen(true)} aria-label="Visa inställningar" title="Visa inställningar" aria-expanded="false">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" aria-hidden="true">
                            <line x1="4" y1="8" x2="20" y2="8" /><circle cx="14.5" cy="8" r="2.7" fill="currentColor" stroke="none" />
                            <line x1="4" y1="16" x2="20" y2="16" /><circle cx="9.5" cy="16" r="2.7" fill="currentColor" stroke="none" />
                        </svg>
                    </button>
                );
                return (
                    <div className="scene-toggles">
                        <button className="st-hide" onClick={() => setTogglesOpen(false)} aria-label="Dölj inställningar" title="Dölj inställningar" aria-expanded="true">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
                        </button>
                        <div className="st-title">Visa</div>
                        {lage === 'sond' && <label><input type="checkbox" checked={show.pelare} onChange={() => tShow('pelare')} /><span>Vätskepelaren</span></label>}
                        {lage === 'sond' && <label><input type="checkbox" checked={show.p0} onChange={() => tShow('p0')} /><span>Räkna med lufttrycket</span></label>}
                        {lage === 'press' && <label><input type="checkbox" checked={show.arbete} onChange={() => tShow('arbete')} /><span>Arbetet</span></label>}
                        {lage === 'press' && <label><input type="checkbox" checked={show.ultra} onChange={() => tShow('ultra')} /><span>Ultrarapid</span></label>}
                        {lage === 'karl' && <label><input type="checkbox" checked={oppen} disabled={!!gissa} onChange={vaxlaKran} /><span>Kranarna öppna</span></label>}
                        {isFullscreen && (
                            <React.Fragment>
                                <div className="st-title mt">Reglage</div>
                                <div className="st-sliders">{reglage(StSlider, true)}</div>
                                {lage === 'press' && (
                                    <div className="st-actions">
                                        <button className="btn-start" onClick={startKlick} disabled={!!gissa}>{startEtikett}</button>
                                        <button className="btn-toggle" onClick={borjaOm} disabled={!!gissa}>Börja om</button>
                                    </div>
                                )}
                            </React.Fragment>
                        )}
                    </div>
                );
            };

            const knappar = (lista, val, satt, las) => (
