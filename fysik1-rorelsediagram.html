                <div className="min-h-screen px-4 md:px-8 pb-12" style={{ fontFamily: "'DM Sans', sans-serif" }}>
                    <div className="max-w-6xl mx-auto pt-6">
                        <div className="breadcrumb mb-4" style={{ fontSize: 13 }}>
                            <a href="index.html">Hem</a> / <a href="katalog.html?id=fy1">Fysik nivå 1</a> / Rörelsediagram
                        </div>
                        <h1 className="text-3xl md:text-4xl font-black tracking-tight" style={{ color: 'var(--lab-ink)' }}>Rörelsediagram</h1>
                        <p className="mt-2 mb-5" style={{ color: 'var(--lab-ink-soft)', maxWidth: 860 }}>
                            En rörelse med konstant acceleration, tre diagram. Kör bilen från genomgångens exempel eller kasta en boll rakt uppåt,
                            och se <em>s-t</em>-, <em>v-t</em>- och <em>a-t</em>-diagrammet ritas med samma tidsaxel. Dra i vilket diagram som helst:
                            startläget i <em>s-t</em>, starthastigheten och sluthastigheten i <em>v-t</em> eller accelerationen i <em>a-t</em>,
                            så följer de andra med. Arean under <em>v-t</em>-grafen delar sig i rektangeln <em>v</em>₀ · <em>t</em> och triangeln
                            ovanpå, precis som termerna i formeln.
                        </p>

                        <FormelKort M={M} tq={tq} d={d} dolt={dolt} medel={show.medel} />

                        <main className="flex flex-col lg:flex-row gap-6">
                            <div className="lg:w-2/3 order-1">
                                <div className={'scene-wrap' + (isFullscreen ? ' is-fs' : '') + (bredFs ? ' fs-bred' : '')}
                                     data-theme="ljusPapper" ref={sceneWrapRef} style={{ aspectRatio: `${L.W} / ${L.H}` }}>
                                    <Scen svgRef={svgRef} L={L} M={{ ...M }} obj={obj} ax={ax} sk={sk} ban={ban} tc={tc} tq={tq} show={show} dolt={dolt}
                                          onDown={onDown} onMove={onMove} onUp={onUp} onKlick={primar} />
                                    {bredFs && <div className="fs-vanster">{paneler}</div>}
                                    {sceneToggles()}
                                    <button className="fs-btn" onClick={toggleFullscreen} aria-label="Fullskärm"
                                            title={isFullscreen ? 'Lämna fullskärm' : 'Fullskärm'}>
                                        {isFullscreen ? (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M9 3v6H3" /><path d="M15 21v-6h6" /><path d="M21 9h-6V3" /><path d="M3 15h6v6" />
                                            </svg>
                                        ) : (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M3 9V3h6" /><path d="M21 9V3h-6" /><path d="M3 15v6h6" /><path d="M21 15v6h-6" />
                                            </svg>
                                        )}
                                    </button>
                                </div>
                                {!isFullscreen && <div className="mt-3">{styrknappar}</div>}
                                <p className="anm mt-2">
                                    {gissa
                                        ? 'Räkna med formlerna och svara. Diagrammen och rörelsen visas när du har svarat.'
                                        : (lod
                                            ? 'Dra i punkterna i s-t- och v-t-diagrammet, eller i den streckade ringen vid pilen när t = 0, och i diagrammen för att flytta tidslinjen. Klicka på bollen för att starta.'
                                            : 'Dra i punkterna i diagrammen, i a-t-linjen eller i de streckade ringarna vid pilarna när t = 0. Dra i diagrammen för att flytta tidslinjen. Klicka på bilen för att starta.')}
                                </p>
                                <div className="hidden lg:flex flex-col gap-3 mt-3">{paneler}</div>
                            </div>

                            <div className="lg:w-1/3 order-2 flex flex-col gap-3">
                                <div className="glass-card rounded-xl p-3">
                                    <div className="flbl mb-2">Läge</div>
                                    <div className="seg" style={{ gridTemplateColumns: '1fr 1fr' }}>
                                        <button className={!gissa ? 'active' : ''} onClick={() => valjLage('fri')}>Utforska</button>
                                        <button className={gissa ? 'active' : ''} onClick={() => valjLage('gissa')}>Testa dig själv</button>
                                    </div>
                                    {!gissa ? (
                                        <React.Fragment>
                                            <div className="flbl mt-3 mb-2">Färdiga försök</div>
                                            <div className="forsok">
                                                {FORSOK.map((f) => (
                                                    <button key={f.id} className={forsok === f.id ? 'active' : ''} onClick={() => valjForsok(f)}>{f.namn}</button>
                                                ))}
                                            </div>
                                            {forsokObj && <p className="anm mt-2" dangerouslySetInnerHTML={{ __html: forsokObj.text }} />}
                                        </React.Fragment>
                                    ) : (
                                        <p className="anm mt-2">
                                            Du får en uppgift av samma slag som i genomgången. Räkna med formlerna och svara. Rätt på första
                                            försöket ger 3 poäng, på andra 1 poäng. Sedan körs rörelsen och diagrammen visar svaret.
                                        </p>
                                    )}
                                </div>

                                {!gissa && (
                                    <div className="glass-card rounded-xl p-3 flex flex-col gap-3">
                                        <div>
                                            <div className="flbl mb-2">Rörelse</div>
                                            <div className="seg" style={{ gridTemplateColumns: '1fr 1fr' }}>
                                                <button className={!lod ? 'active' : ''} onClick={() => valjScen('vag')}>Bil på väg</button>
                                                <button className={lod ? 'active' : ''} onClick={() => valjScen('lod')}>Kast och fall</button>
                                            </div>
                                        </div>
                                        {reglage(false)}
                                    </div>
                                )}

                                <div className="glass-card rounded-xl p-3">
                                    <div className="flbl mb-2">Tidsförlopp</div>
                                    <div className="seg" style={{ gridTemplateColumns: 'repeat(4, 1fr)' }}>
                                        {FARTER.map(([v, t]) => (
                                            <button key={v} className={speed === v ? 'active' : ''} onClick={() => setSpeed(v)}>{t}</button>
                                        ))}
                                    </div>
                                </div>

                                <div className="lg:hidden flex flex-col gap-3">{paneler}</div>
                            </div>
                        </main>

                        <details className="glass-card rounded-xl p-4 mt-6">
                            <summary className="accordion-head">
                                <span>Så hänger diagrammen ihop</span>
                                <span aria-hidden="true">+</span>
                            </summary>
                            <ul className="mt-3 space-y-2" style={{ color: 'var(--lab-ink-soft)', fontSize: 14.5, lineHeight: 1.55, paddingLeft: 18, listStyle: 'disc' }}>
                                <li>Vid konstant acceleration är <em>a-t</em>-grafen en vågrät linje, <em>v-t</em>-grafen en rät linje och <em>s-t</em>-grafen en parabel. Det är samma rörelse sedd på tre sätt.</li>
                                <li>Lutningen i ett diagram är värdet i diagrammet under. Tangentens lutning i <em>s-t</em>-diagrammet är hastigheten <em>v</em>, och lutningen i <em>v-t</em>-diagrammet är accelerationen <em>a</em>.</li>
                                <li>Arean i ett diagram är ändringen i diagrammet ovanför. Arean under <em>a-t</em>-grafen är hastighetsändringen Δ<em>v</em> = <em>a</em> · <em>t</em>, och arean under <em>v-t</em>-grafen är förflyttningen Δ<em>s</em>.</li>
                                <li>Arean under <em>v-t</em>-grafen är rektangeln <em>v</em>₀ · <em>t</em> plus triangeln <em>a</em> · <em>t</em>²/2. Därför ser formeln ut som den gör: <em>s</em> = <em>s</em>₀ + <em>v</em>₀ · <em>t</em> + <em>a</em> · <em>t</em>²/2.</li>
                                <li>Vid en inbromsning har <em>v</em> och <em>a</em> olika tecken. Triangeln blir då negativ och dras bort från rektangeln. Byter hastigheten tecken vänder rörelsen, och då blir förflyttningen mindre än sträckan.</li>
                                <li>Vid fritt fall och kast rakt uppåt är <em>a</em> = −<em>g</em> = −9,82 m/s² när uppåt räknas positivt, hela tiden, även i högsta punkten där <em>v</em> = 0.</li>
                                <li>Medelhastigheten vid konstant acceleration är medelvärdet av start- och sluthastigheten, <em>v</em><sub>m</sub> = (<em>v</em>₀ + <em>v</em>)/2. Det är lutningen hos sekanten i <em>s-t</em>-diagrammet.</li>
                                <li>Stroboskopbilderna tas med jämna tidsmellanrum. Ökar farten hamnar de allt längre isär, och samma punkter syns på <em>s-t</em>-grafen.</li>
                            </ul>
                        </details>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script src="feedback.js" defer></script>
    <script src="sim-dock.js" defer></script>
    <script src="data/katalog.js"></script>
    <script src="section-nav.js"></script>
    <!-- Cloudflare Web Analytics: cookiefri besöksmätning, se CLAUDE.md. -->
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js"
            data-cf-beacon='{"token": "366677ecfe014a76b73f5bc78a489e0e"}'></script>
</body>
