    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback } = React;

        // ── Formatering ────────────────────────────────────────────
        const formatNum = (num, decimals = 0) => {
            const s = num.toFixed(decimals);
            if (parseFloat(s) === 0) return '0';
            const parts = s.split('.');
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
            return parts.join(',');
        };
        // Upp till `max` decimaler, avslutande nollor trimmas
        const fmtSmart = (num, max = 2) => {
            let s = num.toFixed(max);
            if (parseFloat(s) === 0) return '0';
            if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
            const parts = s.split('.');
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
            return parts.join(',');
        };
        const fmtForce = (F) => Math.abs(F) >= 100 ? formatNum(F, 0) : formatNum(F, 1);

        // ── Fysikkonstanter och scen-geometri ─────────────────────
        // Scenen är en labbänk med ett akvarium ovanpå. y = 0 vid bänkskivans
        // ovansida; akvariets glasbotten lyfter vätskan en aning.
        const G_ACC = 9.82;                  // tyngdfaktor, N/kg
        const PX = 470;                      // px per meter
        const VB_W = 900, VB_H = 635;        // viewBox
        const BENCH_PY = 520;                // bänkskivans ovansida i px
        const FLOOR_M = 9 / PX;              // akvariets inre botten (glastjocklek) (m)
        const TANK_L = 340 / PX;             // akvariets inre vänsterkant (m)
        const TANK_R = 650 / PX;             // akvariets inre högerkant (m)
        const WALL_M = 11 / PX;              // glasväggens tjocklek (m)
        const RIM_M = (BENCH_PY - 245) / PX; // glaskantens höjd över bänken (m)
        const POOL_DEPTH = 0.40;             // akvariets djup "in i skärmen" (m)
        const POOL_AREA = (TANK_R - TANK_L) * POOL_DEPTH;   // bottenarea (m²)
        const WATER_V0 = 0.085;              // vätskevolym utan föremål (m³) = 85 L
        const SCENE_W_M = VB_W / PX;
        const HANG_X = 499 / PX;             // stativets upphängningspunkt (m)
        const HANG_TOP_PY = 185;             // hängande blockets överkant i px

        const toPx = (xm) => xm * PX;
        const toPy = (ym) => BENCH_PY - ym * PX;
        const side = (V) => Math.cbrt(V);

        // ── Vätskor ───────────────────────────────────────────────
        const FLUIDS = [
            { id: 'bensin',      name: 'Bensin',      rho: 700,   fill: 'rgba(224,187,110,0.42)', line: '#c19a45', drop: '#d3ab5e', drag: 0.8 },
            { id: 'olja',        name: 'Matolja',     rho: 920,   fill: 'rgba(202,186,84,0.48)',  line: '#a89a38', drop: '#bfae4e', drag: 2.5 },
            { id: 'vatten',      name: 'Vatten',      rho: 998,   fill: 'rgba(127,180,212,0.45)', line: '#5b86a8', drop: '#7fb4d4', drag: 1 },
            { id: 'saltvatten',  name: 'Saltvatten',  rho: 1025,  fill: 'rgba(104,158,199,0.52)', line: '#4d7799', drop: '#6f9fc4', drag: 1.1 },
            { id: 'honung',      name: 'Honung',      rho: 1420,  fill: 'rgba(209,152,44,0.62)',  line: '#9c711f', drop: '#c08c2a', drag: 16 },
            { id: 'kvicksilver', name: 'Kvicksilver', rho: 13546, fill: 'rgba(158,164,172,0.93)', line: '#6d747d', drop: '#9ea4ac', drag: 2.5 },
        ];

        // ── Material ──────────────────────────────────────────────
        const MATERIALS = [
            { name: 'Frigolit',   rho: 50,   fill: '#edeff1', edge: '#aab4bc' },
            { name: 'Kork',       rho: 240,  fill: '#d9b98a', edge: '#a08050' },
            { name: 'Trä (furu)', rho: 500,  fill: '#d9a55f', edge: '#8a6532' },
            { name: 'Is',         rho: 917,  fill: '#cfeaf4', edge: '#7fc4dd' },
            { name: 'PVC',        rho: 1400, fill: '#8d97a8', edge: '#5a6373' },
            { name: 'Tegel',      rho: 1900, fill: '#b4543a', edge: '#7d3623' },
            { name: 'Aluminium',  rho: 2700, fill: '#c3cad3', edge: '#8f99a6' },
            { name: 'Järn',       rho: 7870, fill: '#6a7076', edge: '#3f454c' },
        ];
        const CUSTOM_STYLE = { fill: '#bb8f9c', edge: '#8a5f6d' };
        const MYSTERY_STYLE = { fill: '#ccd3d9', edge: '#8f99a4' };

        // Kraftfärger — samma som teorigenomgångens figurer (fy1-5.5)
        const COL_FL = '#d12f2f';   // lyftkraft
        const COL_FG = '#6d4ca8';   // tyngdkraft
        const COL_FN = '#2f9e44';   // normalkraft
        const COL_OK = '#2f7d46';   // "flyter"/rätt svar
        const INK = '#0f1620';
        const INK_SOFT = '#3a4151';
        const INK_MUTED = '#8a8579';

        // Flyter/svävar/sjunker med tolerans (svävar = densiteterna matchar
        // inom 0,5 %, dock minst 2 kg/m³)
        const statusOf = (rho, fl) => {
            const tol = Math.max(2, fl.rho * 0.005);
            if (Math.abs(rho - fl.rho) < tol) return 'Svävar';
            return rho < fl.rho ? 'Flyter' : 'Sjunker';
        };

        // ── Hjälpfunktioner för vatten och föremål ────────────────
        const centerInTank = (b) => b.x >= TANK_L && b.x <= TANK_R;

        function submergedVolume(b, h) {
            if (!centerInTank(b)) return 0;
            const s = side(b.V);
            const depth = Math.min(h - (b.y - s / 2), s);
            if (depth <= 0) return 0;
            return s * s * depth;
        }

        function waterLevel(blocks) {
            let h = FLOOR_M + WATER_V0 / POOL_AREA;
            for (let i = 0; i < 4; i++) {
                let disp = 0;
                for (const b of blocks) disp += submergedVolume(b, h);
                h = FLOOR_M + (WATER_V0 + disp) / POOL_AREA;
            }
            return Math.min(h, RIM_M - 0.012);
        }

        // ── Toppnivå-komponenter (definieras ALDRIG inne i App) ───
        const selectStyle = {
            width: '100%', border: '1px solid var(--lab-line-strong, rgba(15,22,32,0.28))',
            background: 'var(--lab-bg-panel, #ffffff)', color: 'var(--lab-ink, #0f1620)',
            borderRadius: 6, padding: '6px 8px', fontSize: 13.5, cursor: 'pointer',
        };

        const MiniSlider = ({ label, value, min, max, step = 1, unit, onChange, decimals = 1 }) => (
            <div>
                <div className="flex justify-between items-center mb-1">
                    <span className="text-xs font-semibold uppercase tracking-wide" style={{ color: 'var(--lab-ink-soft, #3a4151)', letterSpacing: '0.06em', fontFamily: 'var(--lab-font-mono, monospace)' }}>{label}</span>
                    <span className="font-mono text-sm font-semibold" style={{ color: 'var(--lab-accent, #c8324a)' }}>
                        {formatNum(value, decimals)}{' '}<span className="text-xs" style={{ color: 'var(--lab-ink-muted, #8a8579)' }}>{unit}</span>
                    </span>
                </div>
                <input type="range" min={min} max={max} step={step} value={value}
                    onChange={(e) => onChange(parseFloat(e.target.value))}
                    className="w-full rounded appearance-none cursor-pointer transition-all" />
            </div>
        );

        const matRho = (obj) => {
            if (!obj.mat) return obj.rho;
            const m = MATERIALS.find(x => x.name === obj.mat);
            return m ? m.rho : obj.rho;
        };

        // Föremålskort: material + volym (+ densitetsglidare för eget material)
        const ObjectCard = ({ title, obj, onChange }) => {
            const rho = matRho(obj);
            const mass = rho * obj.V / 1000;
            return (
                <div className="p-4 glass-card flex flex-col gap-3" style={{ borderRadius: '6px' }}>
                    <div className="text-sm font-semibold uppercase tracking-wide" style={{ color: 'var(--lab-ink-soft, #3a4151)', letterSpacing: '0.06em', fontFamily: 'var(--lab-font-mono, monospace)' }}>{title}</div>
                    <select value={obj.mat || ''} style={selectStyle}
                        onChange={(e) => {
                            const name = e.target.value;
                            if (!name) onChange({ ...obj, mat: null });
                            else onChange({ ...obj, mat: name, rho: MATERIALS.find(m => m.name === name).rho });
                        }}>
                        <option value="">Eget material — välj densitet</option>
                        {MATERIALS.map(m => (
                            <option key={m.name} value={m.name}>{m.name} — {formatNum(m.rho)}{' '}kg/m³</option>
                        ))}
                    </select>
                    <MiniSlider label={<span>Volym <em>V</em></span>} value={obj.V} min={1} max={10} step={0.25} unit="L"
                        onChange={(v) => onChange({ ...obj, V: v })} decimals={2} />
                    {!obj.mat && (
                        <MiniSlider label={<span>Densitet <em>ρ</em></span>} value={obj.rho} min={50} max={8000} step={10} unit="kg/m³"
                            onChange={(v) => onChange({ ...obj, rho: v })} decimals={0} />
                    )}
                    <div className="text-xs" style={{ color: 'var(--lab-ink-muted, #8a8579)' }}>
                        {obj.mat && <span><em>ρ</em> = {formatNum(rho)}{' '}kg/m³ &nbsp;·&nbsp; </span>}
                        massa <em>m</em> = <em>ρ</em> · <em>V</em> = {fmtSmart(mass, 2)}{' '}kg
                    </div>
                </div>
            );
        };

        // Skalenlig kraftpil: linjen slutar vid pilhuvudets BAS, butt-ändar.
        function ForceArrow({ xPx, fromPy, lenPy, dir, color, sub, value, showValue, dot }) {
            if (lenPy < 3) return null;
            const HEAD = Math.max(9, Math.min(13, lenPy * 0.5));
            const HALF = HEAD * 0.62;
            const tipPy = fromPy + dir * lenPy;
            const basePy = tipPy - dir * HEAD;
            const labelPy = tipPy + dir * 14 + (dir > 0 ? 4 : 0);
            return (
                <g>
                    {dot && <circle cx={xPx} cy={fromPy} r="2.6" fill={color} />}
                    <line x1={xPx} y1={fromPy} x2={xPx} y2={basePy} stroke={color} strokeWidth="3.4" strokeLinecap="butt" />
                    <polygon points={`${xPx - HALF},${basePy} ${xPx},${tipPy} ${xPx + HALF},${basePy}`} fill={color} />
                    <text x={xPx + 8} y={labelPy} textAnchor="start" fontSize="14.5" fill={color}>
                        <tspan fontStyle="italic">F</tspan>
                        <tspan fontSize="10.5" dy="3">{sub}</tspan>
                        {showValue && <tspan dy="-3">{' = ' + fmtForce(value) + ' N'}</tspan>}
                    </text>
                </g>
            );
        }

        // Etikett-chip på lugn "pappersyta" (läsbar även ovanpå färgat block/vätska)
        function Chip({ xPx, yPy, text, size = 11.5, bold = false, color = '#0f1620' }) {
            const w = text.length * size * 0.58 + 12;
            const h = size + 8;
            return (
                <g pointerEvents="none">
                    <rect x={xPx - w / 2} y={yPy - h / 2} width={w} height={h} rx="4"
                        fill="rgba(246,242,234,0.95)" stroke="rgba(15,22,32,0.35)" strokeWidth="0.9" />
                    <text x={xPx} y={yPy + size * 0.36} textAnchor="middle" fontSize={size}
                        fontWeight={bold ? 600 : 400} fill={color}>{text}</text>
                </g>
            );
        }

        // ── Blockrendering (front + liten 2,5D-avfasning + materialkänsla) ──
        function BlockDeco({ x0, y0, sp, mat, edge }) {
            if (mat === 'Trä (furu)') return (
                <g fill="none" stroke={edge} strokeWidth="1.2" opacity="0.4" pointerEvents="none">
                    <path d={`M ${x0 + sp * 0.08} ${y0 + sp * 0.32} q ${sp * 0.24} ${sp * 0.08} ${sp * 0.46} 0 t ${sp * 0.38} 0`} />
                    <path d={`M ${x0 + sp * 0.08} ${y0 + sp * 0.66} q ${sp * 0.22} ${-sp * 0.07} ${sp * 0.44} 0 t ${sp * 0.4} 0`} />
                </g>
            );
            if (mat === 'Kork') return (
                <g fill={edge} opacity="0.3" pointerEvents="none">
                    {[[0.22, 0.25], [0.55, 0.18], [0.8, 0.38], [0.3, 0.58], [0.68, 0.66], [0.18, 0.82], [0.52, 0.86], [0.84, 0.8]].map(([fx, fy], i) => (
                        <circle key={i} cx={x0 + sp * fx} cy={y0 + sp * fy} r={Math.max(1.2, sp * 0.03)} />
                    ))}
                </g>
            );
            if (mat === 'Tegel') return (
                <g fill="none" stroke={edge} strokeWidth="1.2" opacity="0.35" pointerEvents="none">
                    <line x1={x0} y1={y0 + sp / 3} x2={x0 + sp} y2={y0 + sp / 3} />
                    <line x1={x0} y1={y0 + 2 * sp / 3} x2={x0 + sp} y2={y0 + 2 * sp / 3} />
                    <line x1={x0 + sp * 0.5} y1={y0} x2={x0 + sp * 0.5} y2={y0 + sp / 3} />
                    <line x1={x0 + sp * 0.25} y1={y0 + sp / 3} x2={x0 + sp * 0.25} y2={y0 + 2 * sp / 3} />
                    <line x1={x0 + sp * 0.75} y1={y0 + 2 * sp / 3} x2={x0 + sp * 0.75} y2={y0 + sp} />
                </g>
            );
            if (mat === 'Is') return (
                <g fill="none" stroke="#e8f6fb" strokeLinecap="round" opacity="0.85" pointerEvents="none">
                    <line x1={x0 + sp * 0.2} y1={y0 + sp * 0.4} x2={x0 + sp * 0.42} y2={y0 + sp * 0.14} strokeWidth={Math.max(2, sp * 0.055)} />
                    <line x1={x0 + sp * 0.34} y1={y0 + sp * 0.52} x2={x0 + sp * 0.5} y2={y0 + sp * 0.33} strokeWidth={Math.max(1.4, sp * 0.035)} />
                </g>
            );
            if (mat === 'Frigolit') return (
                <g fill="#c6ccd2" opacity="0.7" pointerEvents="none">
                    {[[0.25, 0.3], [0.6, 0.2], [0.78, 0.5], [0.35, 0.62], [0.6, 0.8], [0.2, 0.85]].map(([fx, fy], i) => (
                        <circle key={i} cx={x0 + sp * fx} cy={y0 + sp * fy} r={Math.max(1, sp * 0.022)} />
                    ))}
                </g>
            );
            return null;
        }

        function BlockShape({ b, style }) {
            const s = side(b.V);
            const sp = s * PX;
            const x0 = toPx(b.x) - sp / 2;
            const y0 = toPy(b.y) - sp / 2;
            const bev = Math.min(10, sp * 0.16);
            const grabber = b.grabbed;
            return (
                <g style={{ cursor: grabber ? 'grabbing' : 'grab' }}>
                    {/* topp-fasning */}
                    <polygon points={`${x0},${y0} ${x0 + bev},${y0 - bev * 0.72} ${x0 + sp + bev},${y0 - bev * 0.72} ${x0 + sp},${y0}`}
                        fill={style.fill} stroke={style.edge} strokeWidth="1.4" strokeLinejoin="round"
                        style={{ filter: 'brightness(1.12)' }} />
                    {/* höger-fasning */}
                    <polygon points={`${x0 + sp},${y0} ${x0 + sp + bev},${y0 - bev * 0.72} ${x0 + sp + bev},${y0 + sp - bev * 0.72} ${x0 + sp},${y0 + sp}`}
                        fill={style.fill} stroke={style.edge} strokeWidth="1.4" strokeLinejoin="round"
                        style={{ filter: 'brightness(0.82)' }} />
                    {/* frontyta */}
                    <rect x={x0} y={y0} width={sp} height={sp}
                        fill={style.fill} stroke={style.edge} strokeWidth="1.8" />
                    <BlockDeco x0={x0} y0={y0} sp={sp} mat={style.mat} edge={style.edge} />
                    {style.mystery && (
                        <text x={x0 + sp / 2} y={y0 + sp / 2 + sp * 0.18} textAnchor="middle"
                            fontSize={sp * 0.52} fontWeight="700" fill="#3a4151" pointerEvents="none">?</text>
                    )}
                </g>
            );
        }

        // ── Gissa-lägets slumpade utmaningar ──────────────────────
        function genChallenge() {
            const r = Math.random();
            const outcome = r < 0.42 ? 'Flyter' : (r < 0.88 ? 'Sjunker' : 'Svävar');
            // Vatten viktas upp; övriga vätskor förekommer också
            const pool = ['vatten', 'vatten', 'vatten', 'bensin', 'olja', 'saltvatten', 'honung', 'kvicksilver'];
            const fluidId = pool[Math.floor(Math.random() * pool.length)];
            const fl = FLUIDS.find(f => f.id === fluidId);
            const V = 2 + Math.round(Math.random() * 12) / 2;   // 2–8 L i halvlitrar
            let m;
            if (outcome === 'Svävar') {
                m = Math.round(fl.rho * V / 1000 * 100) / 100;
            } else {
                const factor = outcome === 'Flyter'
                    ? 0.15 + Math.random() * 0.7
                    : 1.25 + Math.random() * 1.8;
                const rho = Math.min(15000, fl.rho * factor);
                m = Math.max(0.1, Math.round(rho * V / 1000 * 10) / 10);
            }
            return { m, V, fluidId };
        }

        // ── Huvudapp ──────────────────────────────────────────────
        const App = () => {
            const [mode, setMode] = useState('utforska');          // 'utforska' | 'gissa'
            const [objA, setObjA] = useState({ mat: 'Trä (furu)', rho: 500, V: 5 });
            const [objB, setObjB] = useState({ mat: 'Tegel', rho: 1900, V: 5 });
            const [twoObjects, setTwoObjects] = useState(false);
            const [fluidId, setFluidId] = useState('vatten');
            const [gissa, setGissa] = useState({ ch: null, phase: 'gissa', guess: null, streak: 0, right: 0, total: 0 });
            const [showFG, setShowFG] = useState(true);
            const [showFL, setShowFL] = useState(true);
            const [showFN, setShowFN] = useState(false);
            const [showValues, setShowValues] = useState(false);
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [togglesOpen, setTogglesOpen] = useState(true);
            const [, setTick] = useState(0);

            const sceneWrapRef = useRef(null);
            const svgRef = useRef(null);

            const fluid = FLUIDS.find(f => f.id === fluidId);

            // Föremålskonfiguration (V i m³, m i kg) härledd ur läget
            const blockCfg = useMemo(() => {
                if (mode === 'gissa') {
                    if (!gissa.ch) return [];
                    return [{ id: 'A', V: gissa.ch.V / 1000, m: gissa.ch.m }];
                }
                const cfgs = [{ id: 'A', V: objA.V / 1000, m: matRho(objA) * objA.V / 1000 }];
                if (twoObjects) cfgs.push({ id: 'B', V: objB.V / 1000, m: matRho(objB) * objB.V / 1000 });
                return cfgs;
            }, [mode, objA, objB, twoObjects, gissa.ch]);

            // ── Mutabel fysikvärld i refs ──
            const worldRef = useRef({
                blocks: [],
                splashes: [],   // {x, y, vx, vy, life}
                ripples: [],    // {xPx, py, age}
                h: FLOOR_M + WATER_V0 / POOL_AREA,
                forceScale: 1,  // px per N (glider mjukt)
                rhoMax: 1570,   // flytkartans skala (glider mjukt)
            });
            const fluidRef = useRef(fluid);
            fluidRef.current = fluid;
            const gissaRef = useRef(gissa);
            gissaRef.current = gissa;

            // Startpositioner: på bänken på var sin sida om akvariet.
            // I Gissa-läget hänger föremålet i stativet ovanför vattnet.
            const resetBlocks = useCallback(() => {
                const w = worldRef.current;
                const hanging = mode === 'gissa' && gissaRef.current.phase === 'gissa';
                w.blocks = blockCfg.map(cfg => {
                    const s = side(cfg.V);
                    const hangY = (BENCH_PY - HANG_TOP_PY) / PX - s;
                    return {
                        id: cfg.id, V: cfg.V, m: cfg.m,
                        x: hanging ? HANG_X : (cfg.id === 'A' ? 0.50 : 1.68),
                        y: hanging ? hangY + s / 2 : s / 2, vy: 0,
                        grabbed: false, resting: !hanging, held: hanging,
                    };
                });
                w.splashes = [];
                w.ripples = [];
            }, [blockCfg, mode]);

            // Nytt läge / ny utmaning / nytt antal föremål → börja om.
            // Ändrade värden på befintliga föremål → uppdatera V och m på plats.
            const blockIdsKey = mode + '|' + blockCfg.map(c => c.id).join(',') +
                '|' + (mode === 'gissa' && gissa.ch ? gissa.ch.m + '/' + gissa.ch.V + '/' + gissa.ch.fluidId : '');
            useEffect(() => { resetBlocks(); }, [blockIdsKey]);
            useEffect(() => {
                const w = worldRef.current;
                if (w.blocks.length !== blockCfg.length) return;
                w.blocks.forEach((b, i) => {
                    b.V = blockCfg[i].V;
                    b.m = blockCfg[i].m;
                    const s = side(b.V);
                    const floorY = centerInTank(b) ? FLOOR_M : 0;
                    if (!b.held && b.y - s / 2 < floorY) { b.y = floorY + s / 2; }
                });
            }, [blockCfg]);

            // Gissa-läget: se till att det alltid finns en utmaning
            useEffect(() => {
                if (mode === 'gissa' && !gissa.ch) {
                    const ch = genChallenge();
                    setGissa(g => ({ ...g, ch, phase: 'gissa', guess: null }));
                    setFluidId(ch.fluidId);
                }
            }, [mode]);

            const nextChallenge = () => {
                const ch = genChallenge();
                setGissa(g => ({ ...g, ch, phase: 'gissa', guess: null }));
                setFluidId(ch.fluidId);
            };

            const answer = (guess) => {
                const g = gissaRef.current;
                if (!g.ch || g.phase !== 'gissa') return;
                const rho = g.ch.m / (g.ch.V / 1000);
                const actual = statusOf(rho, fluid);
                const ok = guess === actual;
                worldRef.current.blocks.forEach(b => { b.held = false; });
                setGissa(prev => ({
                    ...prev, phase: 'svar', guess,
                    total: prev.total + 1,
                    right: prev.right + (ok ? 1 : 0),
                    streak: ok ? prev.streak + 1 : 0,
                }));
            };

            // ── Plask ──
            const spawnSplash = (b, h, speed) => {
                const w = worldRef.current;
                const s = side(b.V);
                const n = Math.round(Math.min(18, 6 + speed * 6 + s * 20));
                for (let i = 0; i < n; i++) {
                    const spread = (Math.random() - 0.5) * s * 1.6;
                    w.splashes.push({
                        x: b.x + spread,
                        y: h,
                        vx: (Math.random() - 0.5) * 0.5 + spread * 1.6,
                        vy: 0.5 + Math.random() * 0.9 * Math.min(2, speed),
                        life: 0.55 + Math.random() * 0.3,
                        r: 1.6 + Math.random() * 2.2,
                    });
                }
                w.ripples.push({ xPx: toPx(b.x), py: toPy(h), age: 0, w: s * PX });
                if (n > 10) w.ripples.push({ xPx: toPx(b.x), py: toPy(h), age: -0.12, w: s * PX * 0.6 });
            };

            const maybeSplash = (b, prevBottom, h) => {
                const s = side(b.V);
                const bottom = b.y - s / 2;
                if (centerInTank(b) && prevBottom > h && bottom <= h && b.vy < -0.35) {
                    spawnSplash(b, h, -b.vy);
                }
            };

            // ── Fysikloop ──
            useEffect(() => {
                let raf, last = performance.now();
                const step = (now) => {
                    const w = worldRef.current;
                    const fl = fluidRef.current;
                    let dtAll = Math.min(0.05, (now - last) / 1000);
                    last = now;
                    const SUB = 3, dt = dtAll / SUB;

                    for (let k = 0; k < SUB; k++) {
                        const h = waterLevel(w.blocks);
                        w.h = h;
                        for (const b of w.blocks) {
                            if (b.grabbed || b.held) continue;
                            const s = side(b.V);
                            const prevBottom = b.y - s / 2;
                            const inTank = centerInTank(b);
                            const floorY = inTank ? FLOOR_M : 0;
                            const subV = submergedVolume(b, h);
                            const subFrac = subV / b.V;
                            // Krafter: tyngdkraft ned, lyftkraft upp, dämpning.
                            // Dämpningen skalar med vätskans densitet (kvicksilver
                            // bromsar mer än bensin) + en liten luftterm.
                            let F = -b.m * G_ACC + fl.rho * G_ACC * subV;
                            const c = 0.9 * s * s + 0.42 * fl.rho * s * s * subFrac * fl.drag;
                            F -= c * b.vy;
                            b.vy += (F / b.m) * dt;
                            b.y += b.vy * dt;
                            // Golv (akvariets botten eller bänkskivan)
                            if (b.y - s / 2 < floorY) {
                                b.y = floorY + s / 2;
                                b.vy = b.vy < 0 ? -b.vy * 0.12 : b.vy;
                                if (Math.abs(b.vy) < 0.06) b.vy = 0;
                            }
                            b.resting = Math.abs(b.vy) < 0.02 && (b.y - s / 2) <= floorY + 0.002;
                            // Under glaskanten → håll föremålet innanför eller
                            // helt utanför glasväggarna
                            if (b.y - s / 2 < RIM_M - 0.005) {
                                if (inTank) {
                                    b.x = Math.max(TANK_L + s / 2 + 0.004, Math.min(TANK_R - s / 2 - 0.004, b.x));
                                } else if (b.x < TANK_L) {
                                    b.x = Math.min(b.x, TANK_L - WALL_M - s / 2 - 0.004);
                                } else if (b.x > TANK_R) {
                                    b.x = Math.max(b.x, TANK_R + WALL_M + s / 2 + 0.004);
                                }
                            }
                            b.x = Math.max(s / 2 + 0.01, Math.min(SCENE_W_M - s / 2 - 0.01, b.x));
                            maybeSplash(b, prevBottom, h);
                        }
                        // Enkel separation i sidled mellan två föremål
                        if (w.blocks.length === 2) {
                            const [a, b2] = w.blocks;
                            const sa = side(a.V), sb = side(b2.V);
                            const dx = Math.abs(a.x - b2.x), dy = Math.abs(a.y - b2.y);
                            const ox = (sa + sb) / 2 - dx, oy = (sa + sb) / 2 - dy;
                            if (ox > 0 && oy > 0) {
                                const dirX = a.x < b2.x ? -1 : 1;
                                if (!a.grabbed && !b2.grabbed) { a.x += dirX * ox / 2; b2.x -= dirX * ox / 2; }
                                else if (a.grabbed && !b2.grabbed) { b2.x -= dirX * ox; }
                                else if (!a.grabbed && b2.grabbed) { a.x += dirX * ox; }
                            }
                        }
                        // Plaskdroppar
                        for (const p of w.splashes) {
                            p.vy -= 6.5 * dt;
                            p.x += p.vx * dt;
                            p.y += p.vy * dt;
                            p.life -= dt;
                        }
                        w.splashes = w.splashes.filter(p => p.life > 0 && p.y > w.h - 0.02);
                        for (const r of w.ripples) r.age += dt;
                        w.ripples = w.ripples.filter(r => r.age < 0.9);
                    }

                    // Mjuk kraftskala: gemensam för alla pilar (skalenligt!)
                    let maxF = 1;
                    for (const b of w.blocks) {
                        maxF = Math.max(maxF, b.m * G_ACC, fl.rho * G_ACC * submergedVolume(b, w.h));
                    }
                    const target = Math.min(1.4, 118 / maxF);
                    w.forceScale += (target - w.forceScale) * 0.12;

                    // Mjuk skala för flytkartan (rymmer vätskan + alla föremål)
                    let rhoTop = Math.max(1400, fl.rho);
                    for (const b of w.blocks) rhoTop = Math.max(rhoTop, b.m / b.V);
                    const rhoTarget = rhoTop * 1.12;
                    w.rhoMax += (rhoTarget - w.rhoMax) * 0.08;

                    setTick(t => t + 1);
                    raf = requestAnimationFrame(step);
                };
                raf = requestAnimationFrame(step);
                return () => cancelAnimationFrame(raf);
            }, []);

            // ── Fullskärm ──
            useEffect(() => {
                const handler = () => {
                    setIsFullscreen(
                        document.fullscreenElement === sceneWrapRef.current ||
                        document.webkitFullscreenElement === sceneWrapRef.current
                    );
                };
                document.addEventListener('fullscreenchange', handler);
                document.addEventListener('webkitfullscreenchange', handler);
                return () => {
                    document.removeEventListener('fullscreenchange', handler);
                    document.removeEventListener('webkitfullscreenchange', handler);
                };
            }, []);

            const toggleFullscreen = () => {
                const el = sceneWrapRef.current;
                if (!el) return;
                const isFs = document.fullscreenElement || document.webkitFullscreenElement;
                if (isFs) {
                    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                } else {
                    (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
                }
            };

            // ── Dragning (pointer events) ──
            const dragRef = useRef(null);
            const svgPoint = (e) => {
                const svg = svgRef.current;
                const pt = svg.createSVGPoint();
                pt.x = e.clientX; pt.y = e.clientY;
                const p = pt.matrixTransform(svg.getScreenCTM().inverse());
                return { x: p.x / PX, y: (BENCH_PY - p.y) / PX };
            };

            const onBlockDown = (b) => (e) => {
                if (b.held) return;   // hängande mysterieföremål släpps först vid svar
                e.preventDefault();
                const p = svgPoint(e);
                b.grabbed = true;
                b.vy = 0;
                dragRef.current = { id: b.id, dx: p.x - b.x, dy: p.y - b.y, lastY: b.y, lastT: performance.now() };
                e.target.setPointerCapture(e.pointerId);
            };
            const onBlockMove = (b) => (e) => {
                const d = dragRef.current;
                if (!d || d.id !== b.id || !b.grabbed) return;
                const p = svgPoint(e);
                const s = side(b.V);
                const w = worldRef.current;
                const prevBottom = b.y - s / 2;
                let nx = p.x - d.dx;
                let ny = p.y - d.dy;
                // Klipp mot scenen (föremålets topp ska rymmas i bilden)
                nx = Math.max(s / 2 + 0.01, Math.min(SCENE_W_M - s / 2 - 0.01, nx));
                const topMax = (BENCH_PY - 12) / PX;
                ny = Math.min(ny, topMax - s / 2 + 0.02);
                // Under glaskanten → antingen i akvariet (innanför glaset)
                // eller utanför på bänken
                if (ny - s / 2 < RIM_M - 0.005) {
                    if (nx > TANK_L - 0.02 && nx < TANK_R + 0.02) {
                        nx = Math.max(TANK_L + s / 2 + 0.004, Math.min(TANK_R - s / 2 - 0.004, nx));
                        ny = Math.max(FLOOR_M + s / 2, ny);
                    } else {
                        if (nx < TANK_L) nx = Math.min(nx, TANK_L - WALL_M - s / 2 - 0.004);
                        else nx = Math.max(nx, TANK_R + WALL_M + s / 2 + 0.004);
                        ny = Math.max(s / 2, ny);
                    }
                }
                b.x = nx; b.y = ny;
                // Hastighet för naturligt släpp/kast
                const now = performance.now();
                const dtMs = Math.max(8, now - d.lastT);
                const vInst = (ny - d.lastY) / (dtMs / 1000);
                b.vy = b.vy * 0.55 + vInst * 0.45;
                d.lastY = ny; d.lastT = now;
                maybeSplash(b, prevBottom, w.h);
            };
            const onBlockUp = (b) => (e) => {
                if (!dragRef.current || dragRef.current.id !== b.id) return;
                b.grabbed = false;
                b.vy = Math.max(-3, Math.min(3, b.vy));
                dragRef.current = null;
            };

            // ── Härledda visningsvärden ──
            const w = worldRef.current;
            const h = w.h;
            const totalLiters = (h - FLOOR_M) * POOL_AREA * 1000;
            const blockStyle = (b) => {
                if (mode === 'gissa') return { ...MYSTERY_STYLE, mystery: true };
                const obj = b.id === 'A' ? objA : objB;
                if (obj.mat) {
                    const mat = MATERIALS.find(m => m.name === obj.mat);
                    return { fill: mat.fill, edge: mat.edge, mat: mat.name };
                }
                return { ...CUSTOM_STYLE };
            };
            const blockData = w.blocks.map(b => {
                const subV = submergedVolume(b, h);
                const rho = b.m / b.V;
                const FG = b.m * G_ACC;
                const FL = fluid.rho * G_ACC * subV;
                const FN = b.resting ? Math.max(0, FG - FL) : 0;
                return { b, subV, rho, FG, FL, FN, status: statusOf(rho, fluid), pct: 100 * subV / b.V };
            });

            const masked = mode === 'gissa' && gissa.phase === 'gissa';

            // ── Scenens SVG ──
            const time = performance.now() / 1000;
            const hPy = toPy(h);
            const surfPts = [];
            for (let x = 340; x <= 650; x += 12) {
                const yy = hPy + Math.sin(x * 0.05 + time * 1.9) * 1.1 + Math.sin(x * 0.021 - time * 1.2) * 0.8;
                surfPts.push(`${x},${yy.toFixed(1)}`);
            }
            const surfLine = 'M ' + surfPts.join(' L ');
            const fluidPath = surfLine + ` L 650,511 L 340,511 Z`;

            // ── Flytkartan (densitetsskala, tätare nedåt) ──
            const renderFloatMap = () => {
                const railX = 118, topPy = 178, botPy = 502;
                const rMax = w.rhoMax;
                const pyOf = (rho) => topPy + (Math.min(rho, rMax) / rMax) * (botPy - topPy);
                const steps = [100, 200, 500, 1000, 2000, 5000];
                const step = steps.find(s => rMax / s <= 8) || 5000;
                const ticks = [];
                for (let v = 0; v <= rMax; v += step) ticks.push(v);
                const fluidPyLine = pyOf(fluid.rho);
                const showMarkers = !masked;
                const markers = [];
                if (showMarkers) {
                    blockData.forEach((d, i) => {
                        let py = pyOf(d.rho);
                        let mx = railX;
                        // Ligger två markörer på nästan samma densitet → förskjut den andra
                        if (i > 0 && Math.abs(py - markers[0].py) < 16) mx = railX + 20;
                        markers.push({ py, mx, d });
                    });
                }
                return (
                    <g pointerEvents="none">
                        <text x="95" y="150" textAnchor="middle" fontSize="11" fontWeight="600"
                            letterSpacing="0.08em" fill={INK_SOFT}>FLYTKARTAN</text>
                        <text x="95" y="164" textAnchor="middle" fontSize="9.5" fill={INK_MUTED}>
                            <tspan fontStyle="italic">ρ</tspan> i kg/m³ — tätare nedåt</text>
                        {/* skalstreck */}
                        {ticks.map(v => (
                            <g key={'t' + v}>
                                <line x1={railX - 6} y1={pyOf(v)} x2={railX + 6} y2={pyOf(v)}
                                    stroke="rgba(15,22,32,0.45)" strokeWidth="1.2" />
                                {/* siffran döljs om vätskans linje går genom den */}
                                {Math.abs(pyOf(v) - fluidPyLine) > 11 && (
                                    <text x={railX - 12} y={pyOf(v) + 3.5} textAnchor="end" fontSize="10"
                                        fill={INK_MUTED}>{formatNum(v)}</text>
                                )}
                            </g>
                        ))}
                        {/* axel med pil nedåt (densiteten ökar nedåt) */}
                        <line x1={railX} y1={topPy - 6} x2={railX} y2={botPy + 7} stroke="rgba(15,22,32,0.55)" strokeWidth="1.6" strokeLinecap="butt" />
                        <polygon points={`${railX - 4.5},${botPy + 7} ${railX},${botPy + 15} ${railX + 4.5},${botPy + 7}`} fill="rgba(15,22,32,0.55)" />
                        {/* vätskans linje */}
                        <line x1="62" y1={fluidPyLine} x2="154" y2={fluidPyLine}
                            stroke={fluid.line} strokeWidth="2.6" strokeLinecap="butt" />
                        <text x="42" y={fluidPyLine - 6} textAnchor="start" fontSize="10.5" fontWeight="600" fill={INK_SOFT}>
                            {fluid.name}
                        </text>
                        {/* zonetiketter: ovanför linjen flyter man, under sjunker man */}
                        {fluidPyLine - topPy > 40 && (
                            <text x="152" y={(topPy + fluidPyLine) / 2 + 3} textAnchor="end" fontSize="10"
                                fontStyle="italic" fill={INK_MUTED}>flyter</text>
                        )}
                        {botPy - fluidPyLine > 40 && (
                            <text x="152" y={(fluidPyLine + botPy) / 2 + 3} textAnchor="end" fontSize="10"
                                fontStyle="italic" fill={INK_MUTED}>sjunker</text>
                        )}
                        {/* föremålens markörer */}
                        {markers.map(({ py, mx, d }) => {
                            const st = blockStyle(d.b);
                            return (
                                <g key={'m' + d.b.id}>
                                    <rect x={mx - 7.5} y={py - 7.5} width="15" height="15" rx="3"
                                        fill={st.fill} stroke={st.edge} strokeWidth="1.4" />
                                    {w.blocks.length > 1 && (
                                        <text x={mx} y={py + 3.5} textAnchor="middle" fontSize="10"
                                            fontWeight="600" fill={INK}>{d.b.id}</text>
                                    )}
                                </g>
                            );
                        })}
                    </g>
                );
            };

            const renderScene = () => (
                <svg ref={svgRef} viewBox={`0 0 ${VB_W} ${VB_H}`} preserveAspectRatio="xMidYMid meet"
                    role="img" aria-label="Akvarium på en labbänk med föremål som kan dras, släppas och tryckas ner i vätskan; till vänster en flytkarta som jämför densiteter">
                    <defs>
                        <clipPath id="tankClip">
                            <rect x="340" y="240" width="310" height="271" />
                        </clipPath>
                    </defs>

                    {/* Labbänk: skiva + ben */}
                    <g pointerEvents="none">
                        <rect x="20" y="520" width="860" height="28" fill="#dbc79e" stroke="rgba(15,22,32,0.5)" strokeWidth="1.4" />
                        <line x1="20" y1="527" x2="880" y2="527" stroke="rgba(15,22,32,0.16)" strokeWidth="1" />
                        <rect x="70" y="548" width="26" height="74" fill="#cdb890" stroke="rgba(15,22,32,0.5)" strokeWidth="1.4" />
                        <rect x="804" y="548" width="26" height="74" fill="#cdb890" stroke="rgba(15,22,32,0.5)" strokeWidth="1.4" />
                    </g>

                    {/* Flytkartan (bakom föremålen) */}
                    {renderFloatMap()}

                    {/* Labbstativ (endast Gissa-läget) */}
                    {mode === 'gissa' && (
                        <g pointerEvents="none">
                            <rect x="700" y="508" width="100" height="12" rx="2" fill="#b8bfc7" stroke="rgba(15,22,32,0.5)" strokeWidth="1.2" />
                            <rect x="746" y="150" width="8" height="358" fill="#9aa2ab" stroke="rgba(15,22,32,0.5)" strokeWidth="1.2" />
                            <rect x="495" y="160" width="255" height="8" rx="3" fill="#9aa2ab" stroke="rgba(15,22,32,0.5)" strokeWidth="1.2" />
                            <rect x="493" y="160" width="12" height="14" rx="2" fill="#6a7076" stroke="rgba(15,22,32,0.5)" strokeWidth="1" />
                            {gissa.phase === 'gissa' && w.blocks[0] && (
                                <line x1={toPx(HANG_X)} y1="174" x2={toPx(HANG_X)}
                                    y2={toPy(w.blocks[0].y + side(w.blocks[0].V) / 2)}
                                    stroke="#3a4151" strokeWidth="1.6" />
                            )}
                        </g>
                    )}

                    {/* Glasets inre: svag ton + bakre överkant, så att akvariet
                        läses som en sammanhängande glaslåda och inte två pelare */}
                    <rect x="340" y="246" width="310" height="265" fill="rgba(201,213,220,0.14)" pointerEvents="none" />
                    <line x1="340" y1="247" x2="650" y2="247" stroke="rgba(15,22,32,0.28)" strokeWidth="1.2" pointerEvents="none" />

                    {/* Akvariets inre (bakgrund) — bara under vattenytan, så att
                        pappersrutorna fortsätter i luften ovanför ytan */}
                    <path d={fluidPath} fill="#f4efe3" />

                    {/* Föremål (bakom vätske-överlägget så att nedsänkt del tonas) */}
                    {w.blocks.map(b => (
                        <g key={'blk' + b.id}
                            onPointerDown={onBlockDown(b)} onPointerMove={onBlockMove(b)}
                            onPointerUp={onBlockUp(b)} onPointerCancel={onBlockUp(b)}>
                            <BlockShape b={b} style={blockStyle(b)} />
                        </g>
                    ))}

                    {/* Vätskan — halvgenomskinligt överlägg + vågig yta */}
                    <g pointerEvents="none" clipPath="url(#tankClip)">
                        <path d={fluidPath} fill={fluid.fill} />
                        <path d={surfLine} fill="none" stroke={fluid.line} strokeWidth="1.8" opacity="0.85" />
                        {/* Ringar på ytan */}
                        {w.ripples.filter(r => r.age > 0).map((r, i) => {
                            const rx = Math.min(140, r.w * 0.5 + r.age * 150);
                            const op = Math.max(0, 0.55 * (1 - r.age / 0.9));
                            return (
                                <g key={'rip' + i} opacity={op}>
                                    <ellipse cx={r.xPx} cy={r.py} rx={rx} ry={rx * 0.16}
                                        fill="none" stroke={fluid.line} strokeWidth="1.4" />
                                </g>
                            );
                        })}
                        {/* Plaskdroppar */}
                        {w.splashes.map((p, i) => (
                            <circle key={'sp' + i} cx={toPx(p.x)} cy={toPy(p.y)} r={p.r}
                                fill={fluid.drop} opacity={Math.min(0.9, p.life * 1.8)} />
                        ))}
                    </g>

                    {/* Glasväggar, botten och kant */}
                    <g pointerEvents="none">
                        <rect x="329" y="245" width="11" height="275" fill="#c9d3da" opacity="0.8" stroke="rgba(15,22,32,0.5)" strokeWidth="1.1" />
                        <rect x="650" y="245" width="11" height="275" fill="#c9d3da" opacity="0.8" stroke="rgba(15,22,32,0.5)" strokeWidth="1.1" />
                        <rect x="340" y="511" width="310" height="9" fill="#c9d3da" opacity="0.8" stroke="rgba(15,22,32,0.5)" strokeWidth="1.1" />
                        <rect x="326" y="240" width="17" height="6" rx="2" fill="#b6c2ca" stroke="rgba(15,22,32,0.5)" strokeWidth="1" />
                        <rect x="647" y="240" width="17" height="6" rx="2" fill="#b6c2ca" stroke="rgba(15,22,32,0.5)" strokeWidth="1" />
                        {/* Glasreflex */}
                        <line x1="368" y1="480" x2="452" y2="286" stroke="#e9f1f6" strokeWidth="6" strokeLinecap="round" opacity="0.4" />
                        <line x1="390" y1="470" x2="440" y2="355" stroke="#e9f1f6" strokeWidth="3.4" strokeLinecap="round" opacity="0.35" />
                        {/* Litersskala: streck var 20:e liter på insidan av vänster vägg */}
                        {[20, 40, 60, 80, 100, 120, 140].map(VL => {
                            const py = toPy(FLOOR_M + (VL / 1000) / POOL_AREA);
                            if (py < 250) return null;
                            return <line key={'tick' + VL} x1="340" y1={py} x2="351" y2={py}
                                stroke="rgba(15,22,32,0.4)" strokeWidth="1.2" />;
                        })}
                    </g>

                    {/* Vattennivå-avläsning i liter, till vänster om akvariet */}
                    <g pointerEvents="none">
                        <polygon points={`329,${hPy} 318,${hPy - 5} 318,${hPy + 5}`} fill="#0f1620" opacity="0.75" />
                        <Chip xPx={280} yPy={hPy} text={formatNum(totalLiters, 1) + ' L'} size={12} bold />
                    </g>

                    {/* Facit-chip i Gissa-läget */}
                    {mode === 'gissa' && gissa.phase === 'svar' && blockData[0] && (
                        <Chip xPx={495} yPy={218} bold size={12.5}
                            color={gissa.guess === blockData[0].status ? COL_OK : '#c8324a'}
                            text={(gissa.guess === blockData[0].status ? 'Rätt gissat' : 'Fel gissat') +
                                ' — föremålet ' + blockData[0].status.toLowerCase()} />
                    )}

                    {/* Kraftpilar + föremålsetiketter (överst) */}
                    {blockData.map(({ b, FG, FL, FN }) => {
                        if (b.held) return null;
                        const s = side(b.V);
                        const sp = s * PX;
                        const cx = toPx(b.x);
                        const cy = toPy(b.y);
                        const sc = w.forceScale;
                        return (
                            <g key={'lbl' + b.id} pointerEvents="none">
                                {showFL && FL > 0.5 && (
                                    <ForceArrow xPx={cx} fromPy={cy} lenPy={FL * sc} dir={-1}
                                        color={COL_FL} sub="L" value={FL} showValue={showValues} />
                                )}
                                {showFG && (
                                    <ForceArrow xPx={cx} fromPy={cy} lenPy={FG * sc} dir={1}
                                        color={COL_FG} sub="G" value={FG} showValue={showValues} dot />
                                )}
                                {showFN && FN > 0.5 && (
                                    <ForceArrow xPx={cx + sp * 0.28} fromPy={cy + sp / 2} lenPy={FN * sc} dir={-1}
                                        color={COL_FN} sub="N" value={FN} showValue={showValues} />
                                )}
                                {/* Föremålsbokstav */}
                                {w.blocks.length > 1 && (
                                    <g>
                                        <rect x={cx - sp / 2 + 3} y={cy - sp / 2 + 3} width="16" height="16" rx="3" fill="#0f1620" opacity="0.85" />
                                        <text x={cx - sp / 2 + 11} y={cy - sp / 2 + 15} textAnchor="middle" fontSize="11"
                                            fontWeight="600" fill="#f3eee4">{b.id}</text>
                                    </g>
                                )}
                                {(() => {
                                    // Chip helt till vänster om kraftpilarnas mittlinje
                                    // (högerkant 10 px från centrum — pilspetsen är ~8 px
                                    // bred) så att F_G/F_L:s fulla längd alltid syns
                                    const txt = fmtSmart(b.m, 2) + ' kg';
                                    const cw = txt.length * 11 * 0.58 + 12;
                                    return <Chip xPx={cx - 10 - cw / 2} yPy={cy + sp / 2 - 11} text={txt} size={11} />;
                                })()}
                            </g>
                        );
                    })}

                    {/* Massa-chip även för hängande mysterieföremål */}
                    {blockData.filter(d => d.b.held).map(({ b }) => {
                        const s = side(b.V);
                        const sp = s * PX;
                        const cx = toPx(b.x);
                        const cy = toPy(b.y);
                        const txt = fmtSmart(b.m, 2) + ' kg';
                        const cw = txt.length * 11 * 0.58 + 12;
                        return <Chip key={'hm' + b.id} xPx={cx - sp / 2 - cw / 2 - 8} yPy={cy} text={txt} size={11} />;
                    })}
                </svg>
            );

            // ── Reglage-JSX (återanvänds i sidopanel och fullskärm) ──
            const fluidSelect = (extraProps) => (
                <select value={fluidId} onChange={(e) => setFluidId(e.target.value)} {...(extraProps || {})}>
                    {FLUIDS.map(f => (
                        <option key={f.id} value={f.id}>{f.name} — {formatNum(f.rho)}{' '}kg/m³</option>
                    ))}
                </select>
            );

            const PRESETS = [
                { name: 'Samma volym', desc: 'trä och järn, 5 L var — olika massa',
                  a: { mat: 'Trä (furu)', rho: 500, V: 5 }, b: { mat: 'Järn', rho: 7870, V: 5 } },
                { name: 'Samma massa', desc: 'båda väger 3 kg — olika volym',
                  a: { mat: null, rho: 600, V: 5 }, b: { mat: null, rho: 1500, V: 2 } },
                { name: 'Samma densitet', desc: 'trä i två storlekar — flyter lika djupt',
                  a: { mat: 'Trä (furu)', rho: 500, V: 2 }, b: { mat: 'Trä (furu)', rho: 500, V: 8 } },
            ];
            const applyPreset = (p) => { setObjA({ ...p.a }); setObjB({ ...p.b }); setTwoObjects(true); };

            const utforskaControls = (tag) => (
                <React.Fragment>
                    <ObjectCard title={twoObjects ? 'Föremål A' : 'Föremålet'} obj={objA} onChange={setObjA} />
                    <div className="p-3 glass-card" style={{ borderRadius: '6px' }}>
                        <label className="flex items-center gap-2 cursor-pointer text-sm" style={{ color: 'var(--lab-ink, #0f1620)' }}>
                            <input type="checkbox" checked={twoObjects} onChange={(e) => setTwoObjects(e.target.checked)}
                                style={{ width: 15, height: 15, accentColor: 'var(--lab-accent, #c8324a)' }} />
                            <span>Jämför med ett andra föremål</span>
                        </label>
                    </div>
                    {twoObjects && <ObjectCard title="Föremål B" obj={objB} onChange={setObjB} />}
                    <div className="p-4 glass-card flex flex-col gap-2" style={{ borderRadius: '6px' }}>
                        <div className="text-sm font-semibold uppercase tracking-wide" style={{ color: 'var(--lab-ink-soft, #3a4151)', letterSpacing: '0.06em', fontFamily: 'var(--lab-font-mono, monospace)' }}>Färdiga försök</div>
                        {PRESETS.map(p => (
                            <button key={p.name + tag} type="button" className="preset-btn" onClick={() => applyPreset(p)}>
                                <span className="p-title">{p.name}</span>
                                <span className="p-desc">{p.desc}</span>
                            </button>
                        ))}
                    </div>
                    <div className="p-4 glass-card" style={{ borderRadius: '6px' }}>
                        <div className="text-sm font-semibold uppercase tracking-wide mb-2" style={{ color: 'var(--lab-ink-soft, #3a4151)', letterSpacing: '0.06em', fontFamily: 'var(--lab-font-mono, monospace)' }}>Vätska</div>
                        {fluidSelect({ style: selectStyle })}
                    </div>
                </React.Fragment>
            );

            const gissaRho = gissa.ch ? gissa.ch.m / (gissa.ch.V / 1000) : 0;
            const gissaActual = gissa.ch ? statusOf(gissaRho, fluid) : null;
            const gissaOk = gissa.guess === gissaActual;

            const gissaCard = (
                <div className="p-4 glass-card flex flex-col gap-3" style={{ borderRadius: '6px' }}>
                    <div className="text-sm font-semibold uppercase tracking-wide" style={{ color: 'var(--lab-ink-soft, #3a4151)', letterSpacing: '0.06em', fontFamily: 'var(--lab-font-mono, monospace)' }}>Utmaning</div>
                    {gissa.ch && (
                        <React.Fragment>
                            <div className="text-sm" style={{ color: 'var(--lab-ink, #0f1620)' }}>
                                Ett okänt föremål hänger i stativet:
                            </div>
                            <div className="flex gap-4 text-sm font-mono" style={{ color: 'var(--lab-ink, #0f1620)' }}>
                                <span><em>m</em> = {fmtSmart(gissa.ch.m, 2)}{' '}kg</span>
                                <span><em>V</em> = {fmtSmart(gissa.ch.V, 1)}{' '}L</span>
                            </div>
                            <div className="text-sm" style={{ color: 'var(--lab-ink-soft, #3a4151)' }}>
                                Vätskan är <strong>{fluid.name.toLowerCase()}</strong> ({formatNum(fluid.rho)}{' '}kg/m³).
                                Beräkna föremålets densitet och jämför!
                            </div>
                            {gissa.phase === 'gissa' ? (
                                <div className="flex gap-2">
                                    {['Flyter', 'Svävar', 'Sjunker'].map(g => (
                                        <button key={g} type="button" className="guess-btn" onClick={() => answer(g)}>{g}</button>
                                    ))}
                                </div>
                            ) : (
                                <React.Fragment>
                                    <div className="text-sm font-semibold" style={{ color: gissaOk ? COL_OK : 'var(--lab-accent, #c8324a)' }}>
                                        {gissaOk ? 'Rätt!' : 'Inte riktigt — du gissade "' + gissa.guess + '".'}
                                    </div>
                                    <div className="text-sm" style={{ color: 'var(--lab-ink-soft, #3a4151)' }}>
                                        <em>ρ</em> = <em>m</em>{' '}/{' '}<em>V</em> = {formatNum(gissaRho)}{' '}kg/m³
                                        {' '}{gissaActual === 'Flyter' ? '< ' : (gissaActual === 'Sjunker' ? '> ' : '≈ ')}
                                        {formatNum(fluid.rho)}{' '}kg/m³ — föremålet {gissaActual.toLowerCase()}.
                                        Dra gärna i det och känn efter!
                                    </div>
                                    <button type="button" className="guess-btn" onClick={nextChallenge}>Nästa föremål</button>
                                </React.Fragment>
                            )}
                            <div className="text-xs" style={{ color: 'var(--lab-ink-muted, #8a8579)' }}>
                                Rätt: {gissa.right} av {gissa.total}{gissa.streak >= 2 ? ' — svit: ' + gissa.streak : ''}
                            </div>
                        </React.Fragment>
                    )}
                </div>
            );

            const statusColor = (st) => st === 'Flyter' ? COL_OK : (st === 'Sjunker' ? 'var(--lab-accent, #c8324a)' : '#8a6d1f');

            return (
                <div className="min-h-screen dark-container px-4 md:px-8 pb-8 pt-4 font-sans" style={{ fontFamily: 'Poppins, sans-serif' }}>
                    <div className="max-w-6xl mx-auto">
                        <div className="breadcrumb mb-6">
                            <a href="index.html">Hem</a> / <a href="katalog.html#fy1">Fysik nivå 1</a> / Flyta eller sjunka
                        </div>
                    </div>

                    <header className="max-w-6xl mx-auto mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h1 className="text-3xl md:text-4xl font-black tracking-tight glow-text">
                                Flyta eller sjunka?
                            </h1>
                            {/* Formelkort: F_L = ρ · g · V med ord-etiketter */}
                            <div className="mt-3 flex items-end gap-3 flex-wrap" style={{ fontFamily: 'Poppins, sans-serif', color: 'var(--lab-ink, #0f1620)' }}>
                                <div style={{ textAlign: 'center' }}>
                                    <div className="text-xs font-semibold mb-1" style={{ color: 'var(--lab-ink-muted, #8a8579)', letterSpacing: '0.06em', textTransform: 'uppercase' }}>Lyftkraft</div>
                                    <div className="text-2xl font-bold"><em>F</em><sub className="text-base">L</sub></div>
                                </div>
                                <div className="text-xl pb-1" style={{ color: 'var(--lab-ink-muted, #8a8579)' }}>=</div>
                                <div style={{ textAlign: 'center' }}>
                                    <div className="text-xs font-semibold mb-1" style={{ color: 'var(--lab-ink-muted, #8a8579)', letterSpacing: '0.06em', textTransform: 'uppercase' }}>Vätskans densitet</div>
                                    <div className="text-2xl font-bold"><em>ρ</em></div>
                                </div>
                                <div className="text-xl pb-1" style={{ color: 'var(--lab-ink-muted, #8a8579)' }}>·</div>
                                <div style={{ textAlign: 'center' }}>
                                    <div className="text-xs font-semibold mb-1" style={{ color: 'var(--lab-ink-muted, #8a8579)', letterSpacing: '0.06em', textTransform: 'uppercase' }}>Tyngdfaktor</div>
                                    <div className="text-2xl font-bold"><em>g</em></div>
                                </div>
                                <div className="text-xl pb-1" style={{ color: 'var(--lab-ink-muted, #8a8579)' }}>·</div>
                                <div style={{ textAlign: 'center' }}>
                                    <div className="text-xs font-semibold mb-1" style={{ color: 'var(--lab-ink-muted, #8a8579)', letterSpacing: '0.06em', textTransform: 'uppercase' }}>Volym under ytan</div>
                                    <div className="text-2xl font-bold"><em>V</em></div>
                                </div>
                            </div>
                            <p className="mt-2" style={{ color: 'var(--lab-ink-soft, #3a4151)' }}>
                                Dra föremålen från bänken ner i akvariet — släpp, tryck ner mot botten eller
                                lyft upp dem igen. Flytkartan till vänster visar varför det blir som det blir,
                                och i Gissa-läget förutsäger du resultatet innan föremålet släpps.
                            </p>
                        </div>

                        <div className="flex flex-col items-start md:items-end gap-2 flex-shrink-0">
                            {/* Växla mellan avsnittets två simuleringar */}
                            <div>
                                <div className="text-right mb-1" style={{ fontSize: 10, letterSpacing: '0.08em', textTransform: 'uppercase', color: 'var(--lab-ink-muted, #8a8579)', fontWeight: 600, fontFamily: 'var(--lab-font-mono, monospace)' }}>Simulering</div>
                                <div className="p-1 flex gap-1" style={{ background: 'var(--lab-bg, #f3eee4)', border: '1px solid var(--lab-line-strong, rgba(15,22,32,0.28))', borderRadius: '6px' }}>
                                    <span className="tab-button tab-active px-4 py-2 rounded text-sm font-semibold border">
                                        Flyta eller sjunka
                                    </span>
                                    <a href="fysik1-arkimedes.html"
                                        className="tab-button px-4 py-2 rounded text-sm font-semibold border"
                                        style={{ textDecoration: 'none' }}>
                                        Arkimedes princip
                                    </a>
                                </div>
                            </div>
                            {/* Läge inom denna simulering */}
                            <div>
                                <div className="text-right mb-1" style={{ fontSize: 10, letterSpacing: '0.08em', textTransform: 'uppercase', color: 'var(--lab-ink-muted, #8a8579)', fontWeight: 600, fontFamily: 'var(--lab-font-mono, monospace)' }}>Läge</div>
                                <div className="p-1 flex gap-1" style={{ background: 'var(--lab-bg, #f3eee4)', border: '1px solid var(--lab-line-strong, rgba(15,22,32,0.28))', borderRadius: '6px' }}>
                                    <button onClick={() => setMode('utforska')}
                                        className={`tab-button px-4 py-2 rounded text-sm font-semibold border ${mode === 'utforska' ? 'tab-active' : ''}`}>
                                        Utforska
                                    </button>
                                    <button onClick={() => setMode('gissa')}
                                        className={`tab-button px-4 py-2 rounded text-sm font-semibold border ${mode === 'gissa' ? 'tab-active' : ''}`}>
                                        Gissa
                                    </button>
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto flex flex-col lg:flex-row gap-6">
                        {/* Scen */}
                        <div className="flex-grow lg:w-2/3 order-1">
                            <div className="glass-card rounded-2xl overflow-hidden">
                                <div className="scene-wrap relative" data-theme="ljusPapper" ref={sceneWrapRef}
                                    style={{ backgroundImage: 'linear-gradient(rgba(200, 50, 74, 0.13) 1px, transparent 1px), linear-gradient(90deg, rgba(200, 50, 74, 0.13) 1px, transparent 1px)', backgroundSize: '20px 20px' }}>
                                    {renderScene()}

                                    <button className="fs-btn" onClick={toggleFullscreen} aria-label="Fullskärm"
                                        title={isFullscreen ? 'Lämna fullskärm' : 'Fullskärm'}>
                                        {isFullscreen ? (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M9 3v6H3" /><path d="M15 21v-6h6" /><path d="M21 9h-6V3" /><path d="M3 15h6v6" />
                                            </svg>
                                        ) : (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M3 9V3h6" /><path d="M21 9V3h-6" /><path d="M3 15v6h6" /><path d="M21 15v6h-6" />
                                            </svg>
                                        )}
                                    </button>

                                    {/* Inställningsrutan uppe till höger — hopfällbar, och i
                                        fullskärm bor reglagen/utmaningen här
                                        (placeringsregeln 2026-08-31). */}
                                    {!togglesOpen ? (
                                        <button className="st-show-btn" onClick={() => setTogglesOpen(true)}
                                                aria-label="Visa inställningar" title="Visa inställningar" aria-expanded="false">
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                 strokeWidth="2" strokeLinecap="round" aria-hidden="true">
                                                <line x1="4" y1="8" x2="20" y2="8" />
                                                <circle cx="14.5" cy="8" r="2.7" fill="currentColor" stroke="none" />
                                                <line x1="4" y1="16" x2="20" y2="16" />
                                                <circle cx="9.5" cy="16" r="2.7" fill="currentColor" stroke="none" />
                                            </svg>
                                        </button>
                                    ) : (
                                    <div className="scene-toggles">
                                        <button className="st-hide" onClick={() => setTogglesOpen(false)}
                                                aria-label="Dölj inställningar" title="Dölj inställningar" aria-expanded="true">
                                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                 strokeWidth="2.4" strokeLinecap="round" aria-hidden="true">
                                                <path d="M6 6l12 12M18 6L6 18" />
                                            </svg>
                                        </button>
                                        {isFullscreen && (
                                            <React.Fragment>
                                                <div className="st-title">Läge</div>
                                                <label>
                                                    <input type="radio" name="fs-mode" checked={mode === 'utforska'} onChange={() => setMode('utforska')} />
                                                    <span>Utforska</span>
                                                </label>
                                                <label>
                                                    <input type="radio" name="fs-mode" checked={mode === 'gissa'} onChange={() => setMode('gissa')} />
                                                    <span>Gissa</span>
                                                </label>
                                            </React.Fragment>
                                        )}
                                        <div className={'st-title' + (isFullscreen ? ' mt' : '')}>Visa</div>
                                        <label>
                                            <input type="checkbox" checked={showFG} onChange={(e) => setShowFG(e.target.checked)} />
                                            <span>Tyngdkraft <em>F</em><sub>G</sub></span>
                                        </label>
                                        <label>
                                            <input type="checkbox" checked={showFL} onChange={(e) => setShowFL(e.target.checked)} />
                                            <span>Lyftkraft <em>F</em><sub>L</sub></span>
                                        </label>
                                        <label>
                                            <input type="checkbox" checked={showFN} onChange={(e) => setShowFN(e.target.checked)} />
                                            <span>Normalkraft <em>F</em><sub>N</sub></span>
                                        </label>
                                        <label>
                                            <input type="checkbox" checked={showValues} onChange={(e) => setShowValues(e.target.checked)} />
                                            <span>Visa värden</span>
                                        </label>
                                        {/* Reglagen/utmaningen visas här BARA i fullskärm — i
                                            normalläget finns de i sidopanelen (aldrig dubblerade). */}
                                        {isFullscreen && (
                                            <React.Fragment>
                                                <div className="st-title mt">{mode === 'gissa' ? 'Utmaning' : 'Reglage'}</div>
                                                <div className="st-sliders">
                                                    {mode === 'gissa' ? gissaCard : utforskaControls('fs')}
                                                </div>
                                            </React.Fragment>
                                        )}
                                        {mode === 'utforska' && (
                                            <div className="st-actions">
                                                <button type="button" className="st-btn" onClick={resetBlocks}>Börja om</button>
                                            </div>
                                        )}
                                    </div>
                                    )}
                                </div>
                            </div>

                            {/* Förklaring under scenen */}
                            <div className="mt-6 p-4 text-sm glass-card" style={{ borderRadius: '6px', color: 'var(--lab-ink-soft, #3a4151)' }}>
                                <div className="font-semibold mb-2" style={{ color: 'var(--lab-ink, #0f1620)' }}>Så hänger det ihop</div>
                                <ul className="list-disc pl-5 flex flex-col gap-1">
                                    <li>Lyftkraften är lika stor som tyngden av den undanträngda vätskan:
                                        {' '}<em>F</em><sub>L</sub>{' '}={' '}<em>ρ</em>{' '}·{' '}<em>g</em>{' '}·{' '}<em>V</em>, där <em>ρ</em> är <strong>vätskans</strong> densitet
                                        och <em>V</em> är volymen under ytan.</li>
                                    <li><strong>Flytkartan</strong> jämför densiteter med tätare längre ner:
                                        hamnar föremålets markering <strong>ovanför</strong> vätskans linje flyter det,
                                        <strong> under</strong> linjen sjunker det, och <strong>på</strong> linjen svävar det.
                                        Precis som i verkligheten — det som är lättare än vätskan lägger sig ovanpå.</li>
                                    <li>Ett flytande föremål sjunker ner precis så långt att <em>F</em><sub>L</sub>{' '}={' '}<em>F</em><sub>G</sub> —
                                        andelen under ytan blir <em>ρ</em><sub>föremål</sub>{' '}/{' '}<em>ρ</em><sub>vätska</sub>.
                                        Är föremålets densitet större än vätskans räcker lyftkraften inte till och
                                        botten får bära resten med normalkraften <em>F</em><sub>N</sub>.</li>
                                    <li>Trycker du ner ett flytande föremål ökar volymen under ytan — lyftkraften blir större än
                                        tyngdkraften och föremålet skjuts upp igen när du släpper. Följ vattennivån i liter till
                                        vänster: den stiger exakt med den undanträngda volymen.</li>
                                    <li>I <strong>Gissa-läget</strong> hänger ett okänt föremål i stativet. Räkna ut
                                        densiteten ur <em>m</em> och <em>V</em>, jämför med vätskans och svara —
                                        sedan släpps föremålet och du ser direkt om du hade rätt.</li>
                                </ul>
                            </div>
                        </div>

                        {/* Sidopanel */}
                        <div className="lg:w-1/3 flex-shrink-0 order-2 flex flex-col gap-4">
                            {mode === 'utforska' ? utforskaControls('panel') : gissaCard}

                            {/* Avläsningar */}
                            <div className="p-4 glass-card" style={{ borderRadius: '6px' }}>
                                <div className="text-sm font-semibold uppercase tracking-wide mb-2" style={{ color: 'var(--lab-ink-soft, #3a4151)', letterSpacing: '0.06em', fontFamily: 'var(--lab-font-mono, monospace)' }}>Avläsningar</div>
                                <table className="readout-table">
                                    <thead>
                                        <tr>
                                            <th></th>
                                            {blockData.map(d => <th key={d.b.id}>{w.blocks.length > 1 ? 'Föremål ' + d.b.id : 'Föremålet'}</th>)}
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td>Massa <em>m</em></td>
                                            {blockData.map(d => <td key={d.b.id}>{fmtSmart(d.b.m, 2)}{' '}kg</td>)}
                                        </tr>
                                        <tr>
                                            <td>Volym <em>V</em></td>
                                            {blockData.map(d => <td key={d.b.id}>{fmtSmart(d.b.V * 1000, 2)}{' '}L</td>)}
                                        </tr>
                                        <tr>
                                            <td>Densitet <em>ρ</em></td>
                                            {blockData.map(d => <td key={d.b.id}>{masked ? '?' : formatNum(d.rho) + ' kg/m³'}</td>)}
                                        </tr>
                                        <tr>
                                            <td>Tyngdkraft <em>F</em><sub>G</sub></td>
                                            {blockData.map(d => <td key={d.b.id}>{fmtForce(d.FG)}{' '}N</td>)}
                                        </tr>
                                        <tr>
                                            <td>Lyftkraft <em>F</em><sub>L</sub></td>
                                            {blockData.map(d => <td key={d.b.id}>{fmtForce(d.FL)}{' '}N</td>)}
                                        </tr>
                                        <tr>
                                            <td>Under ytan</td>
                                            {blockData.map(d => <td key={d.b.id}>{formatNum(d.pct, 0)}{' '}%</td>)}
                                        </tr>
                                        <tr>
                                            <td>Undanträngd volym</td>
                                            {blockData.map(d => <td key={d.b.id}>{fmtSmart(d.subV * 1000, 2)}{' '}L</td>)}
                                        </tr>
                                        <tr>
                                            <td></td>
                                            {blockData.map(d => (
                                                <td key={d.b.id} style={{ color: masked ? 'var(--lab-ink-muted, #8a8579)' : statusColor(d.status), fontWeight: 600 }}>{masked ? '?' : d.status}</td>
                                            ))}
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script src="feedback.js" defer></script>
    <script src="sim-dock.js" defer></script>
    <script src="data/katalog.js"></script>
    <script src="section-nav.js"></script>
    <!-- Cloudflare Web Analytics: cookiefri besöksmätning, se CLAUDE.md. -->
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js"
            data-cf-beacon='{"token": "366677ecfe014a76b73f5bc78a489e0e"}'></script>
</body>
