                <div className="forsok-lista mb-3">
                    {lista.map(([k, namn]) => (
                        <button key={k} className="forsok" disabled={las} onClick={() => satt(k)}
                                style={val === k ? { background: 'var(--lab-ink)', color: 'var(--lab-bg)' } : undefined}>{namn}</button>
                    ))}
                </div>
            );

            return (
                <div className="min-h-screen dark-container px-4 md:px-8 pb-12" style={{ fontFamily: "'DM Sans', sans-serif" }}>
                    <div className="max-w-7xl mx-auto pt-6">
                        <div className="breadcrumb mb-4" style={{ fontSize: 13 }}>
                            <a href="index.html">Hem</a> / <a href="katalog.html#fy1">Fysik nivå 1</a> / Tryck i vätskor
                        </div>
                        <h1 className="text-3xl md:text-4xl font-black tracking-tight" style={{ color: 'var(--lab-ink)' }}>Tryck i vätskor</h1>
                        <p className="mt-2 mb-5" style={{ color: 'var(--lab-ink-soft)', maxWidth: 860 }}>
                            Ju djupare du kommer i en vätska, desto större blir trycket, eftersom vätskan ovanför väger mer. Sänk ned trycksonden
                            och läs av U-rörsmanometern, jämför fyra kärl med olika form och koppla ihop dem i botten, eller lyft en bil med en
                            hydraulpress. Vätskepelaren ovanför sonden visar <strong>varför</strong> bara djupet spelar roll.
                        </p>

                        <FormelKort lage={lage} vatska={vatska} h={h} p0={show.p0} kar={kar} V={VRef.current} cfg={cfg} st={st} dolj={dolj} />

                        <main className="flex flex-col lg:flex-row gap-6">
                            <div className="lg:w-2/3 xl:w-3/4 order-1">
                                <div className="scene-wrap" data-theme="ljusPapper" ref={sceneWrapRef}>
                                    <Scen lage={lage} svgRef={svgRef} k={kar} vatska={vatska} h={h} sx={sx} setSx={setSx} rikt={rikt} show={show} dolj={dolj} setH={setH}
                                          V={VRef.current} oppen={oppen} flode={flodeRef.current} cfg={cfg} last={last} st={st} forsokt={forsokt}
                                          setNiva={(i, x) => satNiva(i)(x)} vaxlaKran={vaxlaKran} />
                                    {sceneToggles()}
                                    <button className="fs-btn" onClick={toggleFullscreen} aria-label="Fullskärm" title={isFullscreen ? 'Lämna fullskärm' : 'Fullskärm'}>
                                        {isFullscreen ? (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M9 3v6H3" /><path d="M15 21v-6h6" /><path d="M21 9h-6V3" /><path d="M3 15h6v6" />
                                            </svg>
                                        ) : (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M3 9V3h6" /><path d="M21 9V3h-6" /><path d="M3 15v6h6" /><path d="M21 15v6h-6" />
                                            </svg>
                                        )}
                                    </button>
                                </div>
                                <p className="text-sm mt-2" style={{ color: 'var(--lab-ink-soft)' }}>
                                    {lage === 'sond' && karNamn === 'cistern' && 'Sonden och vätskepelaren är inte ritade i cisternens skala. '}
                                    {lage === 'sond' && 'Dra i sonden för att ändra djupet. Manometern är fylld med färgat vatten: nivåskillnaden Δh är lika stor som vattendjupet över sonden när karet också innehåller vatten.'}
                                    {lage === 'karl' && 'Dra i vattenytan för att ändra nivån i ett kärl, eller använd reglagen. Varje kärl sträcker sig 10 cm in i bilden. När kranarna öppnas blir kärlen kommunicerande. Tryck på en kran för att öppna eller stänga dem.'}
                                    {lage === 'press' && 'Kolvarna och oljan räknas som masslösa, och oljan går inte att pressa ihop. Pilarna visar krafternas riktning, staplarna deras storlek.'}
                                </p>
                            </div>

                            <div className="lg:w-1/3 xl:w-1/4 order-2">
                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <div className="flbl mb-2" style={{ textAlign: 'left' }}>Uppställning</div>
                                    {knappar(Object.entries(LAGEN).map(([k, v]) => [k, v.namn]), lage, (k) => { korRef.current = false; setKor(false); setLage(k); }, !!gissa || kor)}
                                    {lage !== 'press' && (
                                        <React.Fragment>
                                            <div className="flbl mb-2" style={{ textAlign: 'left' }}>Vätska</div>
                                            {knappar(Object.entries(M.VATSKOR).map(([k, v]) => [k, v.namn]), vatska, setVatska, !!gissa || oppen)}
                                        </React.Fragment>
                                    )}
                                    {lage === 'sond' && (
                                        <React.Fragment>
                                            <div className="flbl mb-2" style={{ textAlign: 'left' }}>Sondens membran</div>
                                            <div className="mode-seg mb-3">
                                                {[['upp', 'Uppåt'], ['sida', 'Åt sidan'], ['ned', 'Nedåt']].map(([k, n]) => (
                                                    <button key={k} className={rikt === k ? 'active' : ''} disabled={!!gissa} onClick={() => setRikt(k)}>{n}</button>
                                                ))}
                                            </div>
                                            <div className="flbl mb-2" style={{ textAlign: 'left' }}>Kar</div>
                                            {knappar(Object.entries(KAR).map(([k, v]) => [k, v.namn]), karNamn, setKarNamn, !!gissa)}
                                        </React.Fragment>
                                    )}
                                    {lage === 'press' && (
                                        <React.Fragment>
                                            <div className="flbl mb-2" style={{ textAlign: 'left' }}>Last</div>
                                            {knappar(Object.entries(LASTER).map(([k, v]) => [k, `${v.namn}, ${fmt(v.m, 0)} kg`]), last, setLast, last_)}
                                        </React.Fragment>
                                    )}
                                </div>

                                <div className="glass-card rounded-xl p-3 mb-3">
                                    {!isFullscreen && reglage(Slider, false)}
                                    {isFullscreen && <p className="text-xs mb-2" style={{ color: 'var(--lab-ink-soft)' }}>Reglagen finns i rutan uppe till höger i fullskärm.</p>}
                                    {lage === 'karl' && (
                                        <button className="btn-start w-full mt-2" onClick={vaxlaKran} disabled={!!gissa}>{oppen ? 'Stäng kranarna' : 'Öppna kranarna'}</button>
                                    )}
                                    {lage === 'karl' && !gissa && Math.max(...nivaer) - Math.min(...nivaer) < 0.002 && (
                                        <p className="text-xs mt-2" style={{ color: 'var(--lab-ink-soft)' }}>
                                            {oppen ? 'Nivåerna var redan lika, så inget vatten rinner mellan kärlen. Stäng kranarna och ändra nivån i något kärl, så ser du vattnet jämna ut sig.'
                                                   : 'Alla kärl har samma nivå, så inget vatten kommer att rinna när kranarna öppnas. Ändra nivån i något kärl först.'}
                                        </p>
                                    )}
                                    {lage === 'press' && (
                                        <div className="flex gap-2 mt-2">
                                            <button className="btn-start flex-1" onClick={startKlick} disabled={!!gissa}>{startEtikett}</button>
                                            <button className="btn-toggle flex-1" onClick={borjaOm} disabled={!!gissa}>Börja om</button>
                                        </div>
                                    )}
                                </div>

                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <div className="flbl mb-2" style={{ textAlign: 'left' }}>Färdiga försök</div>
                                    <div className="forsok-lista">
                                        {FORSOK.map((f) => (
                                            <button key={f.id} className="forsok" disabled={!!gissa} onClick={() => korForsok(f)}>
                                                {f.namn}<span className="sub">{f.sub}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <div className="flex items-center justify-between mb-2">
                                        <div className="flbl" style={{ textAlign: 'left' }}>Gissa-läge</div>
                                        {poang.totalt > 0 && <div className="text-xs" style={{ color: 'var(--lab-ink-soft)' }}>{poang.ratt} av {poang.totalt} rätt{poang.svit > 1 ? `, ${poang.svit} i rad` : ''}</div>}
                                    </div>
                                    {!gissa && (
                                        <div className="flex flex-col gap-2">
                                            <button className="btn-toggle" onClick={() => startaGissa('sond')}>Vad visar manometern?</button>
                                            <button className="btn-toggle" onClick={() => startaGissa('karl')}>Vilket kärl har störst tryck?</button>
                                            <button className="btn-toggle" onClick={() => startaGissa('press')}>Hur stor kraft lyfter lasten?</button>
                                        </div>
                                    )}
                                    {gissa && (
                                        <div>
                                            <p className="text-sm mb-2" style={{ color: 'var(--lab-ink)' }}>
                                                {gissa.typ === 'sond' && <span>Sonden sitter {fmt(gissa.h * 100, 0)} cm under ytan i {M.VATSKOR[gissa.vatska].namn.toLowerCase()} (<em>ρ</em> = {fmt(M.VATSKOR[gissa.vatska].rho, 0)} kg/m³). Hur stort är vätsketrycket där, i pascal?</span>}
                                                {gissa.typ === 'karl' && <span>Nivåerna står under kärlen. Vilket kärl har störst tryck i botten?</span>}
                                                {gissa.typ === 'press' && <span>{LASTER[gissa.last].namn} har massan {fmt(LASTER[gissa.last].m, 0)} kg. Den lilla kolven har arean {fmt(gissa.A1, 1)} dm² och den stora {fmt(gissa.A2, 0)} dm². Hur stor kraft <em>F</em><sub>1</sub> behövs minst på den lilla kolven för att lyfta lasten?</span>}
                                            </p>
                                            {gissa.typ === 'karl' ? (
                                                <div className="mode-seg mb-2">
                                                    {[0, 1, 2, 3].map((i) => <button key={i} disabled={svarStatus !== null} onClick={() => kolla(i)}>Kärl {i + 1}</button>)}
                                                </div>
                                            ) : (
                                                <div className="flex items-center gap-2 mb-2">
                                                    {gissa.typ === 'sond' ? <span><em>p</em> =</span> : <span><em>F</em><sub>1</sub> =</span>}
                                                    <input className="gissa-in" type="text" inputMode="decimal" value={svarTxt} disabled={svarStatus !== null}
                                                           onChange={(e) => setSvarTxt(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter' && svarStatus === null) kolla(); }} />
                                                    <span>{gissa.typ === 'sond' ? 'Pa' : 'N'}</span>
                                                    <button className="btn-start" onClick={() => kolla()} disabled={svarStatus !== null}>Kolla</button>
                                                </div>
                                            )}
                                            {svarStatus === 'kor' && <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>Kolven trycks ned med din kraft …</p>}
                                            {svarStatus && svarStatus !== 'kor' && <p className="text-sm mb-2" style={{ color: svarStatus.ratt ? '#15803d' : 'var(--lab-accent)' }}><Fx text={svarStatus.text} /></p>}
                                            <div className="flex gap-2">
                                                {svarStatus && svarStatus !== 'kor' && <button className="btn-toggle flex-1" onClick={() => startaGissa(gissa.typ)}>Ny uppgift</button>}
                                                <button className="btn-toggle flex-1" onClick={avslutaGissa} disabled={svarStatus === 'kor'}>Avsluta</button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </main>

                        <div className="grid md:grid-cols-3 gap-4 mt-6">
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Bara djupet räknas</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Trycket på ett visst djup kommer av tyngden hos vätskepelaren ovanför. Pelaren har massan <em>m</em> = <em>ρ</em> · <em>A</em> · <em>h</em>
                                    och tyngden <em>m</em> · <em>g</em>. När tyngden delas med arean <em>A</em> förkortas arean bort. Kvar blir <em>p</em> = <em>ρ</em> · <em>g</em> · <em>h</em>, oavsett hur brett kärlet är.
                                </p>
                            </div>
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Kommunicerande kärl</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Är kärlen sammankopplade i botten strömmar vätskan från högre till lägre tryck. Strömningen upphör först när trycket
                                    i botten är lika stort överallt, det vill säga när nivåerna är lika höga.
                                </p>
                            </div>
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Kraften förstärks, inte arbetet</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    I hydraulpressen är trycket lika stort i hela oljan. Är den stora kolvens area 200 gånger så stor som den lillas,
                                    blir också kraften på den 200 gånger så stor. Men oljan som trycks ut ur den smala cylindern sprids ut under den breda
                                    kolven, som därför bara rör sig en liten del av den lilla kolvens sträcka: <em>s</em><sub>2</sub> = <em>s</em><sub>1</sub> · <Brak t={<span><em>A</em><sub>1</sub></span>} n={<span><em>A</em><sub>2</sub></span>} />.
                                    Arbetet <em>F</em> · <em>s</em> blir detsamma på båda sidorna. Är kraften på den stora kolven större än lastens tyngd
                                    går en del av arbetet till rörelseenergi.
                                </p>
                            </div>
                        </div>

                        <details className="glass-card rounded-xl p-4 mt-4">
                            <summary className="accordion-head" style={{ color: 'var(--lab-ink)' }}>
                                <span>Vanliga missuppfattningar</span><span style={{ color: 'var(--lab-ink-muted)' }}>▾</span>
                            </summary>
                            <ul className="mt-3 space-y-2 text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                <li><strong>”Ett brett kärl med mycket vatten ger större tryck på botten.”</strong> Nej. Trycket beror bara på djupet.
                                    Är väggarna sneda bär de en del av vattnets tyngd (kärl 3), eller trycker själva ned på vattnet (kärl 4). Därför är kraften
                                    på botten inte lika med vattnets tyngd.</li>
                                <li><strong>”Vätsketrycket trycker bara nedåt.”</strong> Nej. På ett visst djup är trycket lika stort åt alla håll,
                                    och tryckkraften verkar vinkelrätt mot varje yta, även underifrån. Vrid sonden och se att manometern står still.</li>
                                <li><strong>”Hydraulpressen ger energi gratis.”</strong> Nej. Den stora kraften får man på bekostnad av sträckan: den
                                    lilla kolven måste tryckas ned mycket längre än den stora lyfts.</li>
                                <li><strong>”Manometern visar det totala trycket.”</strong> En öppen U-rörsmanometer visar bara skillnaden mot
                                    lufttrycket, eftersom luften trycker på den öppna skänkeln också. För det totala trycket läggs lufttrycket till.</li>
                            </ul>
                        </details>
                    </div>
                </div>
            );
        };
