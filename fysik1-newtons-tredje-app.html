    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback, useMemo } = React;

        const fmt = (num, decimals = 1) => {
            if (!isFinite(num)) return '–';
            const s = num.toFixed(decimals);
            if (parseFloat(s) === 0) return '0';     // exakt/avrundat noll → "0"
            return s.replace('.', ',');
        };

        // ── Fysikkonstanter ──────────────────────────────────────
        // Astronaut med dräkt och brandsläckare: m = 100 kg.
        // Brandsläckarens kraft på gasen: F = 50 N ⇒ a = 0,50 m/s².
        const PX_PER_M = 120;            // skala: 120 px = 1 m
        const F_SPRAY = 50;              // N
        const M_ASTRO = 100;             // kg
        const M_SAT = 1000;              // kg
        const A_SPRAY = F_SPRAY / M_ASTRO;   // m/s²
        const DOCK_SPEED = 1.0;          // maxfart vid dockning (m/s)
        const ASTRONAUT_RADIUS = 35;     // px
        const SATELLITE_RADIUS = 100;    // px (kollisionscirkel)
        const PARTICLE_SPEED = 3.0 * PX_PER_M;   // gasens fart, px/s
        const PARTICLE_LIFE = 0.9;       // s
        const ARROW_LEN = 90;            // px — lika långa: krafterna är lika stora

        // Kraftfärger (mörk scen): blå = kraften på gasen,
        // turkos = motkraften på astronauten (samma par som teorifiguren i fy1-3.3).
        const COL_AKTION = '#6ea8f7';
        const COL_REAKTION = '#3fd0bd';

        // ── Stjärnhimmel ─────────────────────────────────────────
        const Starfield = ({ starCount = 170 }) => {
            const stars = useMemo(() => (
                Array.from({ length: starCount }).map((_, i) => ({
                    id: i,
                    x: `${Math.random() * 100}%`,
                    y: `${Math.random() * 100}%`,
                    size: `${Math.random() * 1.8 + 0.8}px`,
                    opacity: Math.random() * 0.5 + 0.15,
                }))
            ), [starCount]);
            return (
                <div className="absolute inset-0 pointer-events-none" aria-hidden="true">
                    {stars.map((star) => (
                        <div key={star.id} className="absolute rounded-full"
                             style={{ top: star.y, left: star.x, width: star.size, height: star.size,
                                      background: '#dfe6f2', opacity: star.opacity }} />
                    ))}
                </div>
            );
        };

        // ── Astronaut ────────────────────────────────────────────
        const Astronaut = ({ state }) => (
            <div className="absolute w-20 h-20 pointer-events-none"
                 style={{ left: state.position.x, top: state.position.y,
                          transform: `translate(-50%, -50%) rotate(${state.rotation}deg)`,
                          willChange: 'transform, top, left' }}>
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <g>
                        <rect x="75" y="42" width="25" height="16" rx="4" fill="#c8324a"/>
                        <rect x="98" y="47" width="7" height="6" fill="#8a93a3"/>
                        <rect x="25" y="30" width="55" height="40" rx="20" fill="#e7ebf2"/>
                        <circle cx="28" cy="50" r="22" fill="#d5dbe6"/>
                        <circle cx="28" cy="50" r="16" fill="#232a38"/>
                        <path d="M20 45 C 25 38, 35 38, 40 45" stroke="#6b7688" strokeWidth="2" strokeLinecap="round"/>
                        <rect x="55" y="25" width="20" height="50" rx="8" fill="#9aa4b5"/>
                        <rect x="35" y="70" width="15" height="20" rx="7.5" fill="#e7ebf2"/>
                        <rect x="55" y="70" width="15" height="20" rx="7.5" fill="#e7ebf2"/>
                        <rect x="35" y="10" width="15" height="20" rx="7.5" fill="#e7ebf2"/>
                        <rect x="55" y="10" width="15" height="20" rx="7.5" fill="#e7ebf2"/>
                    </g>
                </svg>
            </div>
        );

        // ── Satellit med dockningsport ───────────────────────────
        const Satellite = ({ state }) => (
            <div className="absolute pointer-events-none"
                 style={{ left: state.position.x, top: state.position.y, width: 200, height: 200,
                          transform: `translate(-50%, -50%) rotate(${state.rotation}deg)`,
                          willChange: 'transform, top, left' }}>
                <svg viewBox="-40 -70 240 240" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <g>
                        <path d="M0,0 L100,0 L100,25 L130,25 L130,65 L100,65 L100,90 L0,90 Z" fill="#9aa4b5" stroke="#6b7688" strokeWidth="2"/>
                        <rect x="100" y="25" width="30" height="40" fill="#10141f" />
                        <circle cx="115" cy="45" r="15" fill="none" stroke="#e8b64c" strokeWidth="3" />
                        <circle cx="105" cy="20" r="2" fill="#e07070" />
                        <circle cx="130" cy="20" r="2" fill="#e07070" />
                        <circle cx="105" cy="70" r="2" fill="#e07070" />
                        <circle cx="130" cy="70" r="2" fill="#e07070" />
                        <rect x="10" y="10" width="80" height="15" rx="3" fill="#6b7688" />
                        <rect x="10" y="65" width="80" height="15" rx="3" fill="#6b7688" />
                        <circle cx="50" cy="45" r="12" fill="#6b7688" />
                        <rect x="30" y="-60" width="40" height="60" fill="#2f5f9e" rx="4" />
                        <rect x="30" y="90" width="40" height="60" fill="#2f5f9e" rx="4" />
                        <rect x="32" y="-58" width="36" height="56" fill="#4f83c4" rx="2" />
                        <rect x="32" y="92" width="36" height="56" fill="#4f83c4" rx="2" />
                    </g>
                </svg>
            </div>
        );

        // ── Kraft och motkraft (SVG-overlay) ─────────────────────
        // Två exakt lika långa pilar: kraften på gasen (blå, mot pekaren)
        // och motkraften på astronauten (turkos, åt motsatta hållet).
        const ForceArrows = ({ isSpraying, astro, pointer, size }) => {
            if (!isSpraying || !pointer) return null;
            const dx = pointer.x - astro.position.x;
            const dy = pointer.y - astro.position.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 8) return null;
            const ux = dx / dist, uy = dy / dist;

            const clampPt = (p) => ({
                x: Math.max(10, Math.min(size.w - 10, p.x)),
                y: Math.max(14, Math.min(size.h - 8, p.y)),
            });

            // Pil: skaftet slutar vid pilhuvudets BAS, spetsen i änden (vektorpil).
            const arrow = (tail, tip, color) => {
                const adx = tip.x - tail.x, ady = tip.y - tail.y;
                const len = Math.sqrt(adx * adx + ady * ady);
                const ax = adx / len, ay = ady / len;
                const head = 12, half = 6.5;
                const bx = tip.x - ax * head, by = tip.y - ay * head;   // huvudets bas
                const px = -ay, py = ax;                                 // normal
                return (
                    <g>
                        <line x1={tail.x} y1={tail.y} x2={bx} y2={by}
                              stroke={color} strokeWidth="4" strokeLinecap="butt" />
                        <polygon points={`${tip.x},${tip.y} ${bx + px * half},${by + py * half} ${bx - px * half},${by - py * half}`}
                                 fill={color} />
                    </g>
                );
            };

            // Kraften på gasen: från munstycket, i gasens riktning (mot pekaren).
            const gasTail = { x: astro.position.x + ux * (ASTRONAUT_RADIUS + 8),
                              y: astro.position.y + uy * (ASTRONAUT_RADIUS + 8) };
            const gasTip = { x: gasTail.x + ux * ARROW_LEN, y: gasTail.y + uy * ARROW_LEN };
            // Motkraften på astronauten: angreppspunkt i astronauten, motriktad.
            const astroTail = { x: astro.position.x, y: astro.position.y };
            const astroTip = { x: astroTail.x - ux * ARROW_LEN, y: astroTail.y - uy * ARROW_LEN };

            // Etiketten startar vid pilens spets och flödar utåt i fri rymd.
            const gasLbl = clampPt({ x: gasTip.x + ux * 16, y: gasTip.y + uy * 16 });
            const astroLbl = clampPt({ x: astroTip.x - ux * 16, y: astroTip.y - uy * 16 });
            const anchorFor = (dirX) => (dirX >= 0 ? 'start' : 'end');

            return (
                <svg className="absolute inset-0 w-full h-full pointer-events-none" aria-hidden="true"
                     style={{ zIndex: 4 }} fontFamily="Poppins, sans-serif">
                    {arrow(gasTail, gasTip, COL_AKTION)}
                    {arrow(astroTail, astroTip, COL_REAKTION)}
                    <text x={gasLbl.x} y={gasLbl.y} fill={COL_AKTION} fontSize="12.5" fontWeight="600"
                          textAnchor={anchorFor(ux)} dominantBaseline="middle">Kraften på gasen</text>
                    <text x={astroLbl.x} y={astroLbl.y} fill={COL_REAKTION} fontSize="12.5" fontWeight="600"
                          textAnchor={anchorFor(-ux)} dominantBaseline="middle">Motkraften på astronauten</text>
                </svg>
            );
        };

        // ── Formelkort: variabel med ord-etikett (osynlig spacer under
        //    centrerar symbolen på items-center-radens mittlinje) ──
        const Vbl = ({ label, children }) => (
            <div className="flex flex-col items-center" style={{ lineHeight: 1.1 }}>
                <span className="flbl">{label}</span>
                <span className="fnum">{children}</span>
                <span className="flbl" aria-hidden="true" style={{ visibility: 'hidden' }}>{label}</span>
            </div>
        );
        const FormulaCard = () => (
            <div className="glass-card rounded-xl p-4 mb-5 flex flex-wrap items-center gap-x-3 gap-y-3"
                 style={{ color: 'var(--lab-ink)' }}>
                <Vbl label="Astronautens kraft på gasen"><em>F</em><sub>A på G</sub></Vbl>
                <span className="fnum">=</span>
                <span className="fnum">−</span>
                <Vbl label="Gasens kraft på astronauten"><em>F</em><sub>G på A</sub></Vbl>
                <span className="fnum" style={{ marginLeft: 8, fontSize: 14, color: 'var(--lab-ink-soft)' }}>
                    lika stora, motriktade — och de verkar på olika föremål
                </span>
            </div>
        );

        // ── Huvudapp ─────────────────────────────────────────────
        const getInitialAstronaut = (size) => ({
            position: { x: (size?.w || 900) / 2, y: (size?.h || 560) / 2 },
            velocity: { x: 0, y: 0 },       // m/s
            rotation: 0,
            radius: ASTRONAUT_RADIUS,
        });

        const App = () => {
            const [astronaut, setAstronaut] = useState(() => getInitialAstronaut(null));
            const [satellite, setSatellite] = useState(null);
            const [particles, setParticles] = useState([]);
            const [isSpraying, setIsSpraying] = useState(false);
            const [isDocked, setIsDocked] = useState(false);
            const [showForces, setShowForces] = useState(true);
            const [elapsed, setElapsed] = useState(0);
            const [isFullscreen, setIsFullscreen] = useState(false);

            const sceneWrapRef = useRef(null);
            const surfaceRef = useRef(null);
            const sizeRef = useRef({ w: 0, h: 0 });
            const [size, setSize] = useState({ w: 0, h: 0 });
            const pointerRef = useRef(null);
            const rafRef = useRef(null);
            const lastTsRef = useRef(null);
            const particleIdRef = useRef(0);
            const pendingCenterRef = useRef(true);   // centrera astronauten när scenens mått är kända

            // Scenens storlek (fysiken räknar i scenkoordinater, inte fönstrets)
            useEffect(() => {
                const el = surfaceRef.current;
                if (!el) return;
                const measure = () => {
                    const r = el.getBoundingClientRect();
                    sizeRef.current = { w: r.width, h: r.height };
                    setSize({ w: r.width, h: r.height });
                };
                measure();
                const ro = new ResizeObserver(measure);
                ro.observe(el);
                return () => ro.disconnect();
            }, []);

            useEffect(() => {
                const handler = () => {
                    setIsFullscreen(
                        document.fullscreenElement === sceneWrapRef.current ||
                        document.webkitFullscreenElement === sceneWrapRef.current
                    );
                };
                document.addEventListener('fullscreenchange', handler);
                document.addEventListener('webkitfullscreenchange', handler);
                return () => {
                    document.removeEventListener('fullscreenchange', handler);
                    document.removeEventListener('webkitfullscreenchange', handler);
                };
            }, []);

            const toggleFullscreen = () => {
                const el = sceneWrapRef.current;
                if (!el) return;
                const isFs = document.fullscreenElement || document.webkitFullscreenElement;
                if (isFs) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
            };

            // ── Spelläge ──
            const spawnSatellite = () => {
                const { w, h } = sizeRef.current;
                const margin = 150;
                let x = Math.random() * Math.max(1, w - margin * 2) + margin;
                let y = Math.random() * Math.max(1, h - margin * 2) + margin;
                const distToCenter = Math.sqrt((x - w / 2) ** 2 + (y - h / 2) ** 2);
                if (distToCenter < 300) { x = margin + 50; y = margin + 50; }
                return {
                    position: { x, y },
                    velocity: { x: 0, y: 0 },      // m/s
                    rotation: Math.random() * 360,
                    radius: SATELLITE_RADIUS,
                };
            };

            const startGame = () => {
                setAstronaut(getInitialAstronaut(sizeRef.current));
                setParticles([]);
                setIsDocked(false);
                setElapsed(0);
                setSatellite(spawnSatellite());
            };
            const stopGame = () => {
                setSatellite(null);
                setIsDocked(false);
                setElapsed(0);
            };
            const restart = () => {
                setAstronaut(getInitialAstronaut(sizeRef.current));
                setParticles([]);
                setIsSpraying(false);
                setIsDocked(false);
                setElapsed(0);
                if (satellite) setSatellite(spawnSatellite());
            };

            // ── Pekare (scenlokala koordinater) ──
            const relPos = (clientX, clientY) => {
                const r = surfaceRef.current.getBoundingClientRect();
                return { x: clientX - r.left, y: clientY - r.top };
            };
            const handleMouseDown = useCallback((e) => {
                pointerRef.current = relPos(e.clientX, e.clientY);
                setIsSpraying(true);
            }, []);
            const handleMouseUp = useCallback(() => setIsSpraying(false), []);
            const handleMouseMove = useCallback((e) => {
                pointerRef.current = relPos(e.clientX, e.clientY);
            }, []);
            const handleTouchStart = useCallback((e) => {
                e.preventDefault();
                if (e.touches.length > 0) {
                    pointerRef.current = relPos(e.touches[0].clientX, e.touches[0].clientY);
                    setIsSpraying(true);
                }
            }, []);
            const handleTouchEnd = useCallback(() => setIsSpraying(false), []);
            const handleTouchMove = useCallback((e) => {
                e.preventDefault();
                if (e.touches.length > 0) {
                    pointerRef.current = relPos(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, []);

            // ── Fysikloop (dt-baserad; hastigheter i m/s, positioner i px) ──
            const gameLoop = useCallback((ts) => {
                if (lastTsRef.current == null) lastTsRef.current = ts;
                const dt = Math.min((ts - lastTsRef.current) / 1000, 0.05);
                lastTsRef.current = ts;
                const { w, h } = sizeRef.current;

                if (isDocked || w === 0) {
                    rafRef.current = requestAnimationFrame(gameLoop);
                    return;
                }

                let nextAstronaut = { ...astronaut, position: { ...astronaut.position }, velocity: { ...astronaut.velocity } };
                if (pendingCenterRef.current) {
                    pendingCenterRef.current = false;
                    nextAstronaut = getInitialAstronaut({ w, h });
                }
                const pointer = pointerRef.current;
                if (isSpraying && pointer) {
                    const dx = pointer.x - nextAstronaut.position.x;
                    const dy = pointer.y - nextAstronaut.position.y;
                    if (Math.sqrt(dx * dx + dy * dy) > 4) {
                        const angleRad = Math.atan2(dy, dx);
                        nextAstronaut.rotation = angleRad * (180 / Math.PI);
                        // Gasen puttas mot pekaren — motkraften åt motsatta hållet
                        nextAstronaut.velocity.x -= Math.cos(angleRad) * A_SPRAY * dt;
                        nextAstronaut.velocity.y -= Math.sin(angleRad) * A_SPRAY * dt;
                    }
                }

                let nextSatellite = satellite
                    ? { ...satellite, position: { ...satellite.position }, velocity: { ...satellite.velocity } }
                    : null;

                if (nextSatellite) {
                    setElapsed((e) => e + dt);
                    const dx = nextAstronaut.position.x - nextSatellite.position.x;
                    const dy = nextAstronaut.position.y - nextSatellite.position.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < nextAstronaut.radius + nextSatellite.radius) {
                        const satAngleRad = nextSatellite.rotation * (Math.PI / 180);
                        const cos = Math.cos(-satAngleRad);
                        const sin = Math.sin(-satAngleRad);
                        const localAstroPos = { x: cos * dx - sin * dy, y: sin * dx + cos * dy };
                        const SVG_CENTER_OFFSET = { x: 80, y: 50 };
                        const lp = { x: localAstroPos.x + SVG_CENTER_OFFSET.x, y: localAstroPos.y + SVG_CENTER_OFFSET.y };

                        const BAY = { x: 100, y: 25, depth: 35, height: 40 };
                        const isInsideDockingBay =
                            lp.x >= BAY.x && lp.x <= BAY.x + BAY.depth &&
                            lp.y >= BAY.y && lp.y <= BAY.y + BAY.height;

                        const astroSpeed = Math.sqrt(nextAstronaut.velocity.x ** 2 + nextAstronaut.velocity.y ** 2);

                        if (isInsideDockingBay && astroSpeed < DOCK_SPEED) {
                            setIsDocked(true);
                            setIsSpraying(false);
                        } else if (!isInsideDockingBay) {
                            const collisionBoxes = [
                                { x: 0, y: 0, width: 100, height: 25 },
                                { x: 0, y: 65, width: 100, height: 25 },
                                { x: 0, y: 25, width: 85, height: 40 },
                            ];
                            for (const box of collisionBoxes) {
                                const closestX = Math.max(box.x, Math.min(lp.x, box.x + box.width));
                                const closestY = Math.max(box.y, Math.min(lp.y, box.y + box.height));
                                const distToClosest = Math.sqrt((lp.x - closestX) ** 2 + (lp.y - closestY) ** 2);

                                if (distToClosest < nextAstronaut.radius) {
                                    let localNormal = { x: lp.x - closestX, y: lp.y - closestY };
                                    const mag = Math.sqrt(localNormal.x ** 2 + localNormal.y ** 2);
                                    if (mag > 0) {
                                        localNormal.x /= mag; localNormal.y /= mag;
                                    } else {
                                        const dx1 = lp.x - box.x, dx2 = (box.x + box.width) - lp.x;
                                        const dy1 = lp.y - box.y, dy2 = (box.y + box.height) - lp.y;
                                        const min_d = Math.min(dx1, dx2, dy1, dy2);
                                        if (min_d === dx1) localNormal = { x: -1, y: 0 };
                                        else if (min_d === dx2) localNormal = { x: 1, y: 0 };
                                        else if (min_d === dy1) localNormal = { x: 0, y: -1 };
                                        else localNormal = { x: 0, y: 1 };
                                    }
                                    const worldNormal = {
                                        x: Math.cos(satAngleRad) * localNormal.x - Math.sin(satAngleRad) * localNormal.y,
                                        y: Math.sin(satAngleRad) * localNormal.x + Math.cos(satAngleRad) * localNormal.y,
                                    };
                                    const normal = worldNormal;
                                    const tangent = { x: -normal.y, y: normal.x };

                                    // Elastisk stöt — även krocken lyder tredje lagen:
                                    // impulserna är lika stora och motriktade.
                                    const dpTanA = nextAstronaut.velocity.x * tangent.x + nextAstronaut.velocity.y * tangent.y;
                                    const dpTanS = nextSatellite.velocity.x * tangent.x + nextSatellite.velocity.y * tangent.y;
                                    const dpNormA = nextAstronaut.velocity.x * normal.x + nextAstronaut.velocity.y * normal.y;
                                    const dpNormS = nextSatellite.velocity.x * normal.x + nextSatellite.velocity.y * normal.y;
                                    const m1 = (dpNormA * (M_ASTRO - M_SAT) + 2 * M_SAT * dpNormS) / (M_ASTRO + M_SAT);
                                    const m2 = (dpNormS * (M_SAT - M_ASTRO) + 2 * M_ASTRO * dpNormA) / (M_ASTRO + M_SAT);

                                    nextAstronaut.velocity = {
                                        x: tangent.x * dpTanA + normal.x * m1,
                                        y: tangent.y * dpTanA + normal.y * m1,
                                    };
                                    nextSatellite.velocity = {
                                        x: tangent.x * dpTanS + normal.x * m2,
                                        y: tangent.y * dpTanS + normal.y * m2,
                                    };

                                    const overlap = nextAstronaut.radius - distToClosest;
                                    nextAstronaut.position.x += worldNormal.x * overlap;
                                    nextAstronaut.position.y += worldNormal.y * overlap;
                                    break;
                                }
                            }
                        }
                    }
                }

                nextAstronaut.position.x += nextAstronaut.velocity.x * PX_PER_M * dt;
                nextAstronaut.position.y += nextAstronaut.velocity.y * PX_PER_M * dt;
                if (nextSatellite) {
                    nextSatellite.position.x += nextSatellite.velocity.x * PX_PER_M * dt;
                    nextSatellite.position.y += nextSatellite.velocity.y * PX_PER_M * dt;
                }

                // Scenen sluter sig runt kanterna (glider man ut kommer man in på andra sidan)
                if (nextAstronaut.position.x < -40) nextAstronaut.position.x = w + 40;
                if (nextAstronaut.position.x > w + 40) nextAstronaut.position.x = -40;
                if (nextAstronaut.position.y < -40) nextAstronaut.position.y = h + 40;
                if (nextAstronaut.position.y > h + 40) nextAstronaut.position.y = -40;
                if (nextSatellite) {
                    const buf = 120;
                    if (nextSatellite.position.x < -buf) nextSatellite.position.x = w + buf;
                    if (nextSatellite.position.x > w + buf) nextSatellite.position.x = -buf;
                    if (nextSatellite.position.y < -buf) nextSatellite.position.y = h + buf;
                    if (nextSatellite.position.y > h + buf) nextSatellite.position.y = -buf;
                }

                setAstronaut(nextAstronaut);
                setSatellite(nextSatellite);

                setParticles((prev) => {
                    let next = prev
                        .map((p) => ({
                            ...p,
                            life: p.life - dt,
                            opacity: Math.max(0, p.life - dt) / PARTICLE_LIFE,
                            position: { x: p.position.x + p.velocity.x * dt, y: p.position.y + p.velocity.y * dt },
                        }))
                        .filter((p) => p.life > 0);
                    if (isSpraying && pointer) {
                        const angleRad = astronaut.rotation * (Math.PI / 180);
                        const startPos = {
                            x: astronaut.position.x + Math.cos(angleRad) * 50,
                            y: astronaut.position.y + Math.sin(angleRad) * 50,
                        };
                        const sprayAngle = Math.atan2(pointer.y - astronaut.position.y, pointer.x - astronaut.position.x);
                        for (let i = 0; i < 3; i++) {
                            const spread = (Math.random() - 0.5) * 0.5;
                            const speed = PARTICLE_SPEED * (Math.random() * 0.5 + 0.75);
                            next.push({
                                id: particleIdRef.current++,
                                position: startPos,
                                velocity: { x: Math.cos(sprayAngle + spread) * speed, y: Math.sin(sprayAngle + spread) * speed },
                                size: Math.random() * 3 + 2,
                                opacity: 1,
                                life: PARTICLE_LIFE,
                            });
                        }
                    }
                    return next;
                });

                rafRef.current = requestAnimationFrame(gameLoop);
            }, [astronaut, satellite, isSpraying, isDocked]);

            useEffect(() => {
                rafRef.current = requestAnimationFrame(gameLoop);
                return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
            }, [gameLoop]);

            const speed = Math.sqrt(astronaut.velocity.x ** 2 + astronaut.velocity.y ** 2);
            const gameActive = !!satellite;

            const hintText = isDocked
                ? 'Dockad — starta ett nytt försök i rutan uppe till höger.'
                : gameActive
                    ? `Navigera in i den gula dockningsporten — med fart under ${fmt(DOCK_SPEED, 1)} m/s!`
                    : 'Klicka/tryck och håll i scenen: brandsläckaren sprutar gas mot pekaren och motkraften puttar astronauten åt motsatta hållet.';

            return (
                <div className="min-h-screen dark-container px-4 md:px-8 pb-12" style={{ fontFamily: 'Poppins, sans-serif' }}>
                    <div className="max-w-6xl mx-auto pt-6">
                        <div className="breadcrumb mb-4" style={{ fontSize: 13 }}>
                            <a href="index.html">Hem</a> / <a href="katalog.html#fy1">Fysik nivå 1</a> / Brandsläckaren i rymden
                        </div>

                        <header className="flex flex-col md:flex-row justify-between items-start gap-4 mb-2">
                            <h1 className="text-3xl md:text-4xl font-black tracking-tight glow-text">
                                Brandsläckaren i rymden
                            </h1>
                            <div className="flex-shrink-0">
                                <div className="mb-1" style={{ fontSize: 10, letterSpacing: '0.08em', textTransform: 'uppercase', color: 'var(--lab-ink-muted, #8a8579)', fontWeight: 600, fontFamily: 'var(--lab-font-mono, monospace)' }}>Simulering</div>
                                <div className="p-1 flex gap-1" style={{ background: 'var(--lab-bg, #f3eee4)', border: '1px solid var(--lab-line-strong, rgba(15,22,32,0.28))', borderRadius: '6px' }}>
                                    <span className="tab-button tab-active px-4 py-2 rounded text-sm font-semibold border">
                                        Brandsläckaren i rymden
                                    </span>
                                    <a href="fysik1-flugan-i-bagaren-app.html"
                                       className="tab-button px-4 py-2 rounded text-sm font-semibold border"
                                       style={{ textDecoration: 'none' }}>
                                        Flugan i bägaren
                                    </a>
                                </div>
                            </div>
                        </header>

                        <p className="mt-1 mb-4" style={{ color: 'var(--lab-ink-soft)', maxWidth: 820 }}>
                            En astronaut svävar fritt i rymden — utan säkerhetslina, men med en brandsläckare.
                            Håll nere i scenen så sprutar släckaren gas mot pekaren: astronauten
                            puttar <strong>gasen</strong> åt ett håll, och gasens lika stora <strong>motkraft</strong> puttar
                            astronauten åt det motsatta. Det är <strong>Newtons tredje lag</strong> — och precis så
                            manövrerade Bruce McCandless II vid historiens första fria rymdpromenad 1984.
                            Starta <strong>spelläget</strong> för en utmaning: docka i satellitens gula port, tillräckligt sakta.
                        </p>

                        <FormulaCard />

                        <main className="flex flex-col lg:flex-row gap-6">
                            {/* Scen */}
                            <div className="flex-grow lg:w-2/3 order-1">
                                <div className="glass-card rounded-2xl overflow-hidden">
                                    <div className="scene-wrap" ref={sceneWrapRef}>
                                        <div ref={surfaceRef}
                                             className="sim-yta scene-canvas touch-none"
                                             role="img"
                                             aria-label="En astronaut med brandsläckare svävar i rymden. När gasen sprutas ut visas kraften på gasen och den motriktade kraften på astronauten som två lika långa pilar."
                                             onMouseDown={handleMouseDown} onMouseUp={handleMouseUp}
                                             onMouseMove={handleMouseMove} onMouseLeave={handleMouseUp}
                                             onTouchStart={handleTouchStart} onTouchEnd={handleTouchEnd}
                                             onTouchMove={handleTouchMove} onTouchCancel={handleTouchEnd}>
                                            <Starfield />
                                            {particles.map((p) => (
                                                <div key={p.id} className="absolute rounded-full pointer-events-none"
                                                     style={{ left: p.position.x, top: p.position.y,
                                                              width: p.size, height: p.size, opacity: p.opacity,
                                                              background: '#cfd6e2', transform: 'translate(-50%, -50%)' }} />
                                            ))}
                                            {satellite && <Satellite state={satellite} />}
                                            <Astronaut state={astronaut} />
                                            {showForces && (
                                                <ForceArrows isSpraying={isSpraying && !isDocked} astro={astronaut}
                                                             pointer={pointerRef.current} size={size} />
                                            )}
                                            {isDocked && (
                                                <div className="dock-overlay">
                                                    <div className="dock-card">
                                                        <h2>Dockad!</h2>
                                                        <p>Du nådde dockningsporten på {fmt(elapsed, 1)} s — framme i trygghet,
                                                           helt utan att ha något att ta spjärn mot.</p>
                                                        <div className="dock-actions">
                                                            <button className="st-btn" onClick={startGame}>Spela igen</button>
                                                            <button className="st-btn" onClick={stopGame}>Utforska fritt</button>
                                                        </div>
                                                    </div>
                                                </div>
                                            )}
                                        </div>

                                        <div className="scene-hint">{hintText}</div>

                                        <div className="scene-toggles">
                                            <div className="st-title">Visa</div>
                                            <label>
                                                <input type="checkbox" checked={showForces}
                                                       onChange={() => setShowForces(v => !v)} />
                                                <span>Kraft och motkraft</span>
                                            </label>
                                            {isFullscreen && (
                                                <div className="st-readout">
                                                    Fart: {fmt(speed, 1)} m/s{gameActive && !isDocked ? ` · Tid: ${fmt(elapsed, 1)} s` : ''}
                                                </div>
                                            )}
                                            <div className="st-actions">
                                                <button className="st-btn" onClick={gameActive ? stopGame : startGame}>
                                                    {gameActive ? 'Avsluta spelläget' : 'Spelläge — docka!'}
                                                </button>
                                                <button className="st-btn" onClick={restart}>↻ Börja om</button>
                                            </div>
                                        </div>

                                        <button className="fs-btn" onClick={toggleFullscreen} aria-label="Fullskärm"
                                                title={isFullscreen ? 'Lämna fullskärm' : 'Fullskärm'}>
                                            {isFullscreen ? (
                                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                    <path d="M9 3v6H3"/><path d="M15 21v-6h6"/><path d="M21 9h-6V3"/><path d="M3 15h6v6"/>
                                                </svg>
                                            ) : (
                                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                    <path d="M3 9V3h6"/><path d="M21 9V3h-6"/><path d="M3 15v6h6"/><path d="M21 15v6h-6"/>
                                                </svg>
                                            )}
                                        </button>
                                    </div>
                                </div>
                            </div>

                            {/* Sidopanel */}
                            <div className="lg:w-1/3 flex-shrink-0 order-2">
                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <div className="flbl mb-2">Avläsning</div>
                                    <table className="readout-table">
                                        <tbody>
                                            <tr>
                                                <td>Kraften på gasen</td>
                                                <td style={{ color: '#2563c9', fontWeight: 600 }}>
                                                    {isSpraying && !isDocked ? `${F_SPRAY} N` : '0'}
                                                </td>
                                            </tr>
                                            <tr>
                                                <td>Motkraften på astronauten</td>
                                                <td style={{ color: '#0d9488', fontWeight: 600 }}>
                                                    {isSpraying && !isDocked ? `${F_SPRAY} N` : '0'}
                                                </td>
                                            </tr>
                                            <tr>
                                                <td>Astronautens acceleration</td>
                                                <td>{isSpraying && !isDocked ? `${fmt(A_SPRAY, 2)} m/s²` : '0'}</td>
                                            </tr>
                                            <tr>
                                                <td>Astronautens fart</td>
                                                <td>{fmt(speed, 1)} m/s</td>
                                            </tr>
                                            {gameActive && (
                                                <tr>
                                                    <td>Tid i spelläget</td>
                                                    <td>{fmt(elapsed, 1)} s</td>
                                                </tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>

                                <div className="glass-card rounded-xl p-4">
                                    <h3 className="font-bold text-sm mb-2" style={{ color: 'var(--lab-ink)' }}>
                                        Så hänger det ihop
                                    </h3>
                                    <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                        Astronauten (med dräkt och släckare, <em>m</em> = 100 kg) trycker ut gasen med
                                        kraften 50 N. Enligt Newtons tredje lag trycker gasen då tillbaka på astronauten
                                        med en lika stor, motriktad kraft — det ger accelerationen
                                        {' '}<em>a</em> = <em>F</em> / <em>m</em> = 0,50 m/s². När sprutandet upphör är
                                        kraften noll och astronauten glider vidare med konstant fart (Newtons första lag)
                                        — i rymden finns ingen friktion som bromsar.
                                    </p>
                                    <p className="text-sm mt-2 pt-2" style={{ color: 'var(--lab-ink-soft)', borderTop: '1px solid var(--lab-line)' }}>
                                        Att brandsläckaren dessutom är knäpptyst här är också fysik: ljud är tryckvågor
                                        i ett medium, och i vakuumet mellan stjärnorna finns inget som kan bära dem.
                                    </p>
                                </div>
                            </div>
                        </main>

                        {/* Pedagogiska sektioner */}
                        <div className="grid md:grid-cols-3 gap-4 mt-6">
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Kraft och motkraft</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Mot varje kraft på ett föremål verkar en lika stor, men motsatt riktad, kraft av
                                    samma sort på ett <em>annat</em> föremål. Krafterna är alltid exakt lika stora —
                                    även när det ena föremålet är ett gasmoln och det andra en astronaut.
                                </p>
                            </div>
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Raketprincipen</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    I tomma rymden finns inget att ta spjärn mot — att vifta med armarna hjälper inte.
                                    Det enda sättet att ändra sin rörelse är att kasta ut massa åt motsatt håll.
                                    Brandsläckaren är i praktiken en liten raketmotor, och en riktig raket fungerar
                                    likadant: den skjuter gas nedåt och puttas själv uppåt.
                                </p>
                            </div>
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Motkrafter är inte jämviktskrafter</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Kraft och motkraft verkar på <em>två olika</em> föremål och kan därför aldrig
                                    ta ut varandra. Jämviktskrafter (som tyngdkraft och normalkraft på en vikt)
                                    verkar däremot på <em>samma</em> föremål — det är två helt olika begrepp.
                                </p>
                            </div>
                        </div>

                        <details className="glass-card rounded-xl p-4 mt-4">
                            <summary className="accordion-head" style={{ color: 'var(--lab-ink)' }}>
                                <span>Vanliga missuppfattningar</span><span style={{ color: 'var(--lab-ink-muted)' }}>▾</span>
                            </summary>
                            <ul className="mt-3 space-y-2 text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                <li><strong>”Den tunga satelliten knuffar hårdare än astronauten.”</strong> Nej — vid
                                    en krock är krafterna exakt lika stora åt båda håll. Men effekten skiljer:
                                    astronauten, med sin lilla massa, studsar iväg medan den tio gånger tyngre
                                    satelliten bara sätts i långsam drift. Prova i spelläget!</li>
                                <li><strong>”Gasen har inget att trycka mot i vakuum, så släckaren borde inte
                                    fungera.”</strong> Nej — kraftparet uppstår <em>mellan astronauten och gasen</em>.
                                    Något yttre ”mothåll” behövs inte, vilket är precis därför raketer fungerar i rymden.</li>
                                <li><strong>”När astronauten slutar spruta stannar hen.”</strong> Nej — utan kraft
                                    fortsätter rörelsen med konstant fart (Newtons första lag). Vill du stanna måste
                                    du spruta gas i färdriktningen.</li>
                            </ul>
                        </details>
                    </div>
                </div>
            );
        };
