    <script type="text/babel">
        const { useState, useEffect, useRef, useReducer } = React;

        const DEG = Math.PI / 180;

        // ── Formatering: decimalkomma, exakt noll utan decimaler ──
        const fmt = (num, decimals = 1) => {
            if (num === null || num === undefined || !isFinite(num)) return '–';
            const s = num.toFixed(decimals);
            if (parseFloat(s) === 0) return '0';
            return s.replace('.', ',');
        };
        // Pendellängden skrivs med tre decimaler bara när den behövs (0,995 m).
        const fmtT = (x) => x.toFixed(2).replace('.', ',');
        const fmtL = (l) => Math.abs(l * 100 - Math.round(l * 100)) > 1e-6 ? fmt(l, 3) : fmt(l, 2);

        // ── Platser och okända planeter ──
        const PLATSER = [
            { id: 'mon',     namn: 'Månen',   g: 1.62 },
            { id: 'mars',    namn: 'Mars',    g: 3.71 },
            { id: 'jorden',  namn: 'Jorden',  g: 9.82 },
            { id: 'jupiter', namn: 'Jupiter', g: 24.8 },
            { id: 'valfri',  namn: 'Valfri',  g: 9.82 },
        ];
        const OKANDA = [
            { namn: 'Pluto',   g: 0.62 },
            { namn: 'Månen',   g: 1.62 },
            { namn: 'Mars',    g: 3.71 },
            { namn: 'Jorden',  g: 9.82 },
            { namn: 'Jupiter', g: 24.8 },
        ];

        // ── Scenens geometri (viewBox-enheter) ──
        const VBH = 540;
        const PX = 350, PY = 62;           // upphängningspunkten
        const S = 185;                     // skala: bildpunkter per meter
        const BENCH = 486;                 // labbänkens översida
        const LMIN = 0.2, LMAX = 2.0;
        const A0MAX = 70;
        const MMIN = 20, MMAX = 500;

        const COL = {
            tyngd: '#d33a3a',   // tyngdkraften F_G
            spann: '#2f6fd0',   // spännkraften F_S
            ink:   '#0f1620',
            punkt: '#2563c9',
            fit:   '#7c3aed',
        };

        // ── Fysiken: exakt, α'' = −(g/l)·sin α, RK4 ──
        const acc = (th, g, l) => -(g / l) * Math.sin(th);
        const rk4 = (th, om, g, l, h) => {
            const k1t = om,                  k1o = acc(th, g, l);
            const k2t = om + 0.5 * h * k1o,  k2o = acc(th + 0.5 * h * k1t, g, l);
            const k3t = om + 0.5 * h * k2o,  k3o = acc(th + 0.5 * h * k2t, g, l);
            const k4t = om + h * k3o,        k4o = acc(th + h * k3t, g, l);
            return [th + (h / 6) * (k1t + 2 * k2t + 2 * k3t + k4t),
                    om + (h / 6) * (k1o + 2 * k2o + 2 * k3o + k4o)];
        };
        const nyMatning = () => ({ fas: 'idle', n: 0, t0: 0, dir: 0 });
        const nySim = () => ({ th: 0, om: 0, t: 0, thB: 0, omB: 0, flash: -1, meas: nyMatning(), tid: 0 });

        // Stegar fram pendlarna dt sekunder. Ljusgrinden fångar varje passage
        // av jämviktsläget och interpolerar tidpunkten mellan två delsteg.
        const framat = (sim, P, dt) => {
            const H = 1 / 400;
            let rem = dt;
            while (rem > 1e-9) {
                const h = Math.min(H, rem);
                rem -= h;
                const th0 = sim.th;
                const r = rk4(sim.th, sim.om, P.g, P.l, h);
                sim.th = r[0]; sim.om = r[1];
                if ((th0 < 0 && sim.th >= 0) || (th0 > 0 && sim.th <= 0)) {
                    const f = th0 / (th0 - sim.th);
                    const tc = sim.t + f * h;
                    const dir = sim.om >= 0 ? 1 : -1;
                    sim.flash = performance.now();
                    const m = sim.meas;
                    if (m.fas === 'armed') {
                        m.fas = 'running'; m.t0 = tc; m.dir = dir; m.n = 0;
                    } else if (m.fas === 'running' && dir === m.dir) {
                        m.n += 1;
                        if (m.n >= 10) {
                            m.fas = 'done';
                            m.T10 = Math.round((tc - m.t0) * 100) / 100;   // ljusgrindens tidsupplösning: 0,01 s
                            m.snap = { l: P.l, g: P.g, a0: P.a0 };
                            m.added = false;
                        }
                    }
                }
                sim.t += h;
                if (P.ghost) {
                    const rb = rk4(sim.thB, sim.omB, P.g, P.ghost.l, h);
                    sim.thB = rb[0]; sim.omB = rb[1];
                }
            }
        };

        // ── Färdiga försök ──
        const FORSOK = [
            { id: 'massa', namn: 'Samma längd, olika massa',
              set: { l: 1.0, a0: 10, m: 100, plats: 'jorden' }, ghost: { l: 1.0, m: 400, a0: 10 },
              text: 'A har massan 100 g och B massan 400 g, men längd och utslag är lika. Pendlarna svänger i takt: massan ingår inte i <em>T</em> = 2π√(<em>l</em>/<em>g</em>).' },
            { id: 'langd', namn: 'Fyrdubbla längden',
              set: { l: 0.5, a0: 10, m: 100, plats: 'jorden' }, ghost: { l: 2.0, m: 100, a0: 10 },
              text: 'B är fyra gånger så lång som A (2,00 m mot 0,50 m) och behöver dubbelt så lång tid för en svängning. <em>T</em> växer som √<em>l</em>.' },
            { id: 'sekund', namn: 'Sekundpendeln',
              set: { l: 0.995, a0: 5, m: 100, plats: 'jorden' }, ghost: null,
              text: 'Med <em>l</em> = 0,995 m blir <em>T</em> = 2,00 s. Ljusgrinden slås ut en gång per sekund, varje gång pendeln passerar jämviktsläget.' },
            { id: 'stort', namn: 'Stort utslag (formeln slutar gälla)',
              set: { l: 1.0, a0: 60, m: 100, plats: 'jorden' }, ghost: { l: 1.0, m: 100, a0: 5 },
              text: 'A släpps från 60° och B från 5°, båda med <em>l</em> = 1,00 m. A hänger efter: formeln gäller bara för små utslag, och vid 60° är perioden cirka 7 % längre.' },
            { id: 'manen', namn: 'Pendeln på Månen',
              set: { l: 1.0, a0: 10, m: 100, plats: 'mon' }, ghost: null,
              text: 'På Månen är <em>g</em> = 1,62 m/s². Samma pendel behöver ungefär 2,5 gånger så lång tid: <em>T</em> = 4,94 s.' },
        ];

        // ── SVG-pil: en sammanhängande polygon ──
        const Arrow = ({ x1, y1, x2, y2, color, width = 5, head = 15, dashed = false, opacity = 1 }) => {
            const ang = Math.atan2(y2 - y1, x2 - x1);
            const len = Math.hypot(x2 - x1, y2 - y1);
            if (len < 1) return null;
            if (dashed) {
                // streckad komponent: tunt streckat skaft med hel spets
                const hd = Math.min(head * 0.8, len * 0.8);
                const ux = Math.cos(ang), uy = Math.sin(ang);
                const bx = x2 - hd * Math.cos(0.42) * ux, by = y2 - hd * Math.cos(0.42) * uy;
                const hh = hd * Math.sin(0.42);
                return (
                    <g opacity={opacity}>
                        <line x1={x1} y1={y1} x2={bx} y2={by} stroke={color} strokeWidth="2.6"
                              strokeDasharray="6 4" strokeLinecap="butt" />
                        <polygon points={`${x2},${y2} ${bx - uy * hh},${by + ux * hh} ${bx + uy * hh},${by - ux * hh}`} fill={color} />
                    </g>
                );
            }
            const hw = 0.42;
            const hd = Math.max(10, Math.min(head, len * 0.9));
            const ux = Math.cos(ang), uy = Math.sin(ang);
            const nx = -uy, ny = ux;
            const hh = hd * Math.sin(hw);
            const bd = hd * Math.cos(hw);
            const bx = x2 - bd * ux, by = y2 - bd * uy;
            const w = Math.min(width, hh * 1.25) / 2;
            const P = (px, py) => `${px.toFixed(2)},${py.toFixed(2)}`;
            const pts = [
                P(x1 + nx * w, y1 + ny * w), P(bx + nx * w, by + ny * w), P(bx + nx * hh, by + ny * hh),
                P(x2, y2),
                P(bx - nx * hh, by - ny * hh), P(bx - nx * w, by - ny * w), P(x1 - nx * w, y1 - ny * w),
            ].join(' ');
            return <polygon points={pts} fill={color} opacity={opacity} />;
        };

        // Kraftetikett: symbol (kursiv) + index + resten, startar vid pilspetsen.
        const KraftEtikett = ({ x, y, anchor, color, sym, sub, rest }) => (
            <text x={x} y={y} textAnchor={anchor} fontSize="17" fontWeight="700" fill={color}>
                <tspan fontStyle="italic">{sym}</tspan>
                <tspan dy="4" fontSize="12" fontWeight="700">{sub}</tspan>
                <tspan dy="-4">{rest}</tspan>
            </text>
        );

        // Kula med massbunden radie.
        const bobRadie = (m) => 11 + 11 * Math.cbrt(Math.max(0, (m - MMIN) / (MMAX - MMIN)));

        // ═══════════════════════════════════════════════
        //  SCENEN: labbstativ, pendel, gradskiva, ljusgrind
        // ═══════════════════════════════════════════════
        const Scen = ({ svgRef, sim, P, show, compact, gissa, onDragStart, onDragMove, onDragEnd, vb }) => {
            const { l, m, g, a0, ghost } = P;
            const th = sim.th;
            const rA = bobRadie(m);
            const bx = PX + l * S * Math.sin(th), by = PY + l * S * Math.cos(th);
            const restY = PY + l * S;
            const flashOn = performance.now() - sim.flash < 220;
            const x0 = vb.x, x1 = vb.x + vb.w;

            // protraktorns gradering
            const ticks = [];
            for (let a = -90; a <= 90; a += 5) {
                const big = a % 10 === 0, r0 = 74, r1 = big ? 64 : 69;
                const sx = Math.sin(a * DEG), sy = Math.cos(a * DEG);
                ticks.push(<line key={a} x1={PX + r0 * sx} y1={PY + r0 * sy} x2={PX + r1 * sx} y2={PY + r1 * sy}
                                 stroke="#3a4151" strokeWidth={big ? 1.2 : 0.8} />);
            }
            const prLbl = [-60, -30, 0, 30, 60].map((a) => (
                <text key={a} x={PX + 53 * Math.sin(a * DEG)} y={PY + 53 * Math.cos(a * DEG) + 4}
                      textAnchor="middle" fontSize="11" fill="#3a4151">{a === 0 ? '0' : Math.abs(a)}</text>
            ));
            const a0x = PX + 82 * Math.sin(P.sgn * a0 * DEG), a0y = PY + 82 * Math.cos(P.sgn * a0 * DEG);

            // linjal (vänster sida): 0 vid upphängningen
            const rx = compact ? x0 + 10 : 56;
            const rulerTicks = [];
            for (let i = 0; i <= 41; i++) {
                const v = i * 0.05, yy = PY + v * S;
                const maj = i % 10 === 0, mid = i % 2 === 0;
                rulerTicks.push(<line key={i} x1={rx + 26} y1={yy} x2={rx + 26 - (maj ? 15 : mid ? 10 : 6)} y2={yy}
                                      stroke="#5b4a12" strokeWidth={maj ? 1.4 : 0.9} />);
                if (maj) rulerTicks.push(
                    <text key={'t' + i} x={rx + 8} y={yy + 4} fontSize="12" textAnchor="middle" fill="#5b4a12"
                          fontWeight="600">{i === 0 ? '0' : fmt(v, 1) + ''}</text>);
            }

            // krafter
            let krafter = null;
            if (show.krafter) {
                const mk = m / 1000;
                const FG = mk * g;
                const sc = 100 / (FG * (3 - 2 * Math.cos(Math.max(a0, 5) * DEG)));     // bildpunkter per newton
                const ur = { x: Math.sin(th), y: Math.cos(th) };
                const ut = { x: Math.cos(th), y: -Math.sin(th) };
                const FS = mk * (g * Math.cos(th) + l * sim.om * sim.om);
                const F1 = -FG * Math.sin(th);                 // tangentiell komposant (mot jämviktsläget)
                const Fr = FG * Math.cos(th);                  // komposant längs snöret, utåt
                const cx = bx, cy = by;
                const tipG = { x: cx, y: cy + FG * sc };
                const tipS = { x: cx - ur.x * FS * sc, y: cy - ur.y * FS * sc };
                const tipR = { x: cx + ur.x * Fr * sc, y: cy + ur.y * Fr * sc };
                const tipT = { x: cx + ut.x * F1 * sc, y: cy + ut.y * F1 * sc };
                const vis = (v) => !gissa ? ' = ' + fmt(v, 2) + ' N' : '';
                const sidT = F1 >= 0 ? 1 : -1;
                krafter = (
                    <g>
                        {/* parallellogrammets hjälplinjer */}
                        <line x1={tipG.x} y1={tipG.y} x2={tipR.x} y2={tipR.y} stroke={COL.tyngd} strokeWidth="1.2" strokeDasharray="3 4" opacity="0.6" />
                        <line x1={tipG.x} y1={tipG.y} x2={tipT.x} y2={tipT.y} stroke={COL.tyngd} strokeWidth="1.2" strokeDasharray="3 4" opacity="0.6" />
                        <Arrow x1={cx} y1={cy} x2={tipS.x} y2={tipS.y} color={COL.spann} width={5} head={15} />
                        <Arrow x1={cx} y1={cy} x2={tipG.x} y2={tipG.y} color={COL.tyngd} width={5} head={15} />
                        {Fr * sc > 6 && <Arrow x1={cx} y1={cy} x2={tipR.x} y2={tipR.y} color={COL.tyngd} dashed head={13} />}
                        {Math.abs(F1) * sc > 6 && <Arrow x1={cx} y1={cy} x2={tipT.x} y2={tipT.y} color={COL.tyngd} dashed head={13} />}
                        <circle cx={cx} cy={cy} r="3" fill={COL.tyngd} />
                        <KraftEtikett x={tipG.x + 10} y={tipG.y + 12} anchor="start" color={COL.tyngd} sym="F" sub="G" rest={vis(FG)} />
                        {FS * sc > 8 && <KraftEtikett x={tipS.x + 14} y={tipS.y - 4} anchor="start" color={COL.spann} sym="F" sub="S" rest={vis(FS)} />}
                        {Math.abs(F1) * sc > 14 && (
                            <KraftEtikett x={tipT.x + sidT * 8} y={tipT.y + 18} anchor={sidT > 0 ? 'start' : 'end'}
                                          color={COL.tyngd} sym="F" sub="1" rest={gissa ? '' : ' = ' + fmt(Math.abs(F1), 2) + ' N'} />
                        )}
                    </g>
                );
            }

            // jämförelsependel B
            let ghostEl = null;
            if (ghost && show.ghost) {
                const gx = PX + ghost.l * S * Math.sin(sim.thB), gy = PY + ghost.l * S * Math.cos(sim.thB);
                const rB = bobRadie(ghost.m);
                ghostEl = (
                    <g>
                        <line x1={PX} y1={PY} x2={gx} y2={gy} stroke="#2f6fd0" strokeWidth="1.8" opacity="0.85" />
                        <circle cx={gx} cy={gy} r={rB} fill="url(#bobB)" stroke="#2a4f8a" strokeWidth="1.4" />
                        <circle cx={gx} cy={gy} r="2" fill="#0f1620" />
                    </g>
                );
            }

            const lcdTid = sim.meas.fas === 'running' ? (sim.t - sim.meas.t0)
                         : sim.meas.fas === 'done' ? sim.meas.T10 : 0;

            return (
                <svg ref={svgRef} className="pend-scen" viewBox={`${vb.x} 0 ${vb.w} ${VBH}`} preserveAspectRatio="xMidYMid meet"
                     style={{ fontFamily: "'Poppins', sans-serif" }}>
                    <defs>
                        <pattern id="rutor" width="27" height="27" patternUnits="userSpaceOnUse">
                            <path d="M27 0H0V27" fill="none" stroke="rgba(60,110,180,0.13)" strokeWidth="1" />
                        </pattern>
                        <linearGradient id="papper" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0" stopColor="#f7f2e8" /><stop offset="1" stopColor="#ece3d2" />
                        </linearGradient>
                        <radialGradient id="bobA" cx="0.35" cy="0.3" r="0.8">
                            <stop offset="0" stopColor="#e6ebf2" /><stop offset="0.45" stopColor="#8f9cb0" /><stop offset="1" stopColor="#434d5d" />
                        </radialGradient>
                        <radialGradient id="bobB" cx="0.35" cy="0.3" r="0.8">
                            <stop offset="0" stopColor="#dbe8fa" /><stop offset="0.5" stopColor="#7ea4dc" /><stop offset="1" stopColor="#35598f" />
                        </radialGradient>
                        <linearGradient id="stal" x1="0" y1="0" x2="1" y2="0">
                            <stop offset="0" stopColor="#6c7686" /><stop offset="0.35" stopColor="#c9d0db" /><stop offset="1" stopColor="#5a6373" />
                        </linearGradient>
                        <linearGradient id="tra" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0" stopColor="#c99b63" /><stop offset="1" stopColor="#a87a45" />
                        </linearGradient>
                    </defs>

                    <rect x={x0 - 400} y="0" width={vb.w + 800} height={BENCH} fill="url(#papper)" />
                    <rect x={x0 - 400} y="0" width={vb.w + 800} height={BENCH} fill="url(#rutor)" />

                    {/* labbänken */}
                    <rect x={x0 - 400} y={BENCH} width={vb.w + 800} height={VBH - BENCH + 10} fill="url(#tra)" />
                    <line x1={x0 - 400} y1={BENCH} x2={x0 + vb.w + 400} y2={BENCH} stroke="#6b4a22" strokeWidth="3" />
                    {[0, 1, 2, 3, 4, 5].map((i) => (
                        <path key={i} d={`M${x0 - 20 + i * 170} ${BENCH + 12 + (i % 3) * 7} q 60 -6 130 0`} stroke="#8f6633" strokeWidth="1" fill="none" opacity="0.6" />
                    ))}

                    {/* stativ */}
                    {!compact && (
                        <g>
                            <rect x="4" y={BENCH - 12} width="96" height="12" rx="3" fill="#434d5d" />
                            <rect x="22" y="36" width="12" height={BENCH - 46} fill="url(#stal)" />
                        </g>
                    )}
                    <rect x={compact ? x0 - 10 : 28} y="42" width={PX + 18 - (compact ? x0 - 10 : 28)} height="9" rx="2" fill="url(#stal)" />
                    {!compact && <rect x="16" y="34" width="24" height="24" rx="3" fill="#434d5d" />}
                    {/* klämma och upphängning */}
                    <rect x={PX - 10} y="46" width="20" height="14" rx="2" fill="#434d5d" />
                    <circle cx={PX} cy={PY} r="3.5" fill="#0f1620" />

                    {/* linjal (måttband) med avläsning vid kulans tyngdpunkt */}
                    {show.linjal && (<g>
                    <rect x={rx} y={PY - 6} width="26" height={2.05 * S + 12} rx="2" fill="#e8c35c" stroke="#8a6d15" strokeWidth="1" />
                    {rulerTicks}
                    <line x1={rx + 26} y1={PY} x2={PX - 8} y2={PY} stroke="#5a6170" strokeWidth="1" strokeDasharray="2 5" opacity="0.7" />
                    <line x1={rx + 26} y1={restY} x2={PX - rA - 10} y2={restY} stroke="#5a6170" strokeWidth="1" strokeDasharray="2 5" opacity="0.7" />
                    <polygon points={`${rx + 26},${restY} ${rx + 36},${restY - 6} ${rx + 36},${restY + 6}`} fill="#c8324a" />
                    <text x={rx + 42} y={restY - 8} fontSize="15" fontWeight="700" fill="#0f1620">
                        <tspan fontStyle="italic">l</tspan> = {fmtL(l)} m
                    </text>
                    </g>)}

                    {/* gradskiva */}
                    {show.gradskiva && (<g>
                    <path d={`M ${PX - 74} ${PY} A 74 74 0 0 0 ${PX + 74} ${PY} Z`} fill="#fbf7ee" fillOpacity="0.72" stroke="#3a4151" strokeWidth="1.2" />
                    {ticks}{prLbl}
                    <line x1={PX} y1={PY} x2={PX} y2={PY + 26} stroke="#9aa3b2" strokeWidth="1" strokeDasharray="3 3" />
                    <circle cx={a0x} cy={a0y} r="3.5" fill="#c8324a" />
                    </g>)}
                    <text x={PX - 90} y={PY + 20} textAnchor="end" fontSize="15" fontWeight="700" fill="#0f1620">
                        <tspan fontStyle="italic">α</tspan> = {fmt(Math.abs(th) / DEG, 1)}°
                    </text>

                    {/* ljusgrinden: sitter bakom kulan vid jämviktsläget */}
                    {show.ljusgrind && (<g>
                    <rect x={PX - 1} y={restY - 14} width="3" height={BENCH - restY + 14} fill="#6c7686" />
                    <rect x={PX - 20} y={restY - 28} width="40" height="56" rx="6" fill="#3b4250" stroke="#1f2430" strokeWidth="1.2" />
                    <circle cx={PX + 11} cy={restY - 19} r="4.2" fill={flashOn ? '#ff3b3b' : '#6a2a2a'} />
                    <circle cx={PX} cy={restY} r="2.4" fill="#ff5a5a" opacity="0.9" />
                    <text x={PX + 8} y={restY + 46} textAnchor="start" fontSize="14" fill="#3a4151">Ljusgrind</text>
                    </g>)}

                    {/* tidtagare på bänken */}
                    {!compact && (
                        <g>
                            <text x="560" y={BENCH - 49} textAnchor="middle" fontSize="12" fill="#3a4151">Tidtagare</text>
                            <rect x="476" y={BENCH - 42} width="168" height="40" rx="6" fill="#1c2b22" stroke="#38453c" strokeWidth="2" />
                            <text x="632" y={BENCH - 14} textAnchor="end" fontSize="24" fontWeight="700" fill="#b6f2a0"
                                  style={{ fontFamily: "'JetBrains Mono', monospace" }}>{fmtT(lcdTid)} s</text>
                        </g>
                    )}

                    {/* jämförelsependel (bakom A) */}
                    {ghostEl}

                    {/* pendel A: snöret går ända till tyngdpunkten */}
                    <line x1={PX} y1={PY} x2={bx} y2={by} stroke="#2a2f3a" strokeWidth="2" />
                    <circle cx={bx} cy={by} r={rA} fill="url(#bobA)" stroke="#2a2f3a" strokeWidth="1.4" />
                    <circle cx={bx} cy={by} r="2.6" fill="#0f1620" />
                    {krafter}

                    {/* etiketter för A och B */}
                    {ghost && show.ghost && (
                        <g fontSize="14" fill="#0f1620">
                            <text x={x0 + (compact ? 52 : 100)} y="20" fontWeight="700">
                                A: <tspan fontStyle="italic">l</tspan> = {fmtL(l)} m, <tspan fontStyle="italic">m</tspan> = {m} g, <tspan fontStyle="italic">α</tspan> = {a0}°
                            </text>
                            <text x={x0 + (compact ? 52 : 100)} y="37" fontWeight="700" fill="#2a4f8a">
                                B: <tspan fontStyle="italic">l</tspan> = {fmtL(ghost.l)} m, <tspan fontStyle="italic">m</tspan> = {ghost.m} g, <tspan fontStyle="italic">α</tspan> = {ghost.a0}°
                            </text>
                        </g>
                    )}

                    {/* grepp: osynlig träffyta över kulan */}
                    <circle cx={bx} cy={by} r={rA + 16} fill="transparent" style={{ cursor: 'grab' }}
                            onPointerDown={onDragStart} onPointerMove={onDragMove}
                            onPointerUp={onDragEnd} onPointerCancel={onDragEnd} />
                </svg>
            );
        };

        // ═══════════════════════════════════════════════
        //  DIAGRAMMET: mätserien
        // ═══════════════════════════════════════════════
        const tickStep = (max) => {
            const raw = max / 5, e = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / e;
            return e * (f <= 1.4 ? 1 : f <= 3.5 ? 2 : f <= 7 ? 5 : 10);
        };

        const Diagram = React.memo(({ pts, mode, g, visaKurva, curL, gissa, onMode, onClear }) => {
            const W = 380, H = 300, L = 58, R = 372, T0 = 16, B = 244;
            const t2 = mode === 'T2';
            const val = (p) => t2 ? p.T * p.T : p.T;
            let ymaxDat = pts.reduce((a, p) => Math.max(a, val(p)), 0);
            let ymaxFormel = (!gissa && g) ? (t2 ? 4 * Math.PI * Math.PI * LMAX / g : 2 * Math.PI * Math.sqrt(LMAX / g)) : 0;
            let ymaxRaw = Math.max(ymaxDat * 1.18, ymaxFormel * 1.04, t2 ? 4 : 2);
            if (gissa) ymaxRaw = Math.max(ymaxDat * 1.35, t2 ? 4 : 2);
            const step = tickStep(ymaxRaw);
            const ymax = Math.ceil(ymaxRaw / step - 1e-9) * step;
            const X = (l) => L + (R - L) * l / LMAX;
            const Y = (v) => B - (B - T0) * v / ymax;
            const yt = [];
            for (let v = 0; v <= ymax + 1e-9; v += step) yt.push(v);
            const xt = [0, 0.5, 1, 1.5, 2];
            const decY = step < 1 ? (step < 0.1 ? 2 : 1) : 0;

            // anpassad rät linje T² = k·l genom origo
            let k = null;
            if (pts.length >= 1) {
                let sl = 0, sll = 0;
                pts.forEach((p) => { sl += p.l * p.T * p.T; sll += p.l * p.l; });
                k = sl / sll;
            }
            const kurva = [];
            if (visaKurva && g && !gissa) {
                if (t2) {
                    const kk = 4 * Math.PI * Math.PI / g;
                    const lEnd = Math.min(LMAX, ymax / kk);
                    kurva.push(`${X(0)},${Y(0)}`, `${X(lEnd)},${Y(kk * lEnd)}`);
                } else {
                    for (let l = 0; l <= LMAX + 1e-9; l += 0.04) {
                        const T = 2 * Math.PI * Math.sqrt(l / g);
                        if (T > ymax) break;
                        kurva.push(`${X(l).toFixed(1)},${Y(T).toFixed(1)}`);
                    }
                }
            }
            let fitLinje = null;
            if (t2 && k !== null) {
                const lEnd = Math.min(LMAX, ymax / k);
                fitLinje = <line x1={X(0)} y1={Y(0)} x2={X(lEnd)} y2={Y(k * lEnd)} stroke={COL.fit} strokeWidth="2.6" />;
            }
            const gEst = k ? 4 * Math.PI * Math.PI / k : null;

            return (
                <div className="glass-card rounded-xl p-3">
                    <div className="flex items-center justify-between mb-2 gap-2">
                        <div className="flbl">Mätserie</div>
                        <div className="seg" style={{ gridTemplateColumns: '1fr 1fr' }}>
                            <button className={!t2 ? 'active' : ''} onClick={() => onMode('T')}><em>T</em> mot <em>l</em></button>
                            <button className={t2 ? 'active' : ''} onClick={() => onMode('T2')}><em>T</em>² mot <em>l</em></button>
                        </div>
                    </div>
                    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', maxWidth: 470, margin: '0 auto', display: 'block', fontFamily: "'Poppins', sans-serif" }}>
                        <rect x={L} y={T0} width={R - L} height={B - T0} fill="rgba(255,255,255,0.35)" />
                        {yt.map((v) => (
                            <g key={'y' + v}>
                                <line x1={L} y1={Y(v)} x2={R} y2={Y(v)} stroke="rgba(15,22,32,0.14)" strokeWidth="1" />
                                <text x={L - 7} y={Y(v) + 4} textAnchor="end" fontSize="12" fill="#3a4151">{fmt(v, decY)}</text>
                            </g>
                        ))}
                        {xt.map((l) => (
                            <g key={'x' + l}>
                                <line x1={X(l)} y1={T0} x2={X(l)} y2={B} stroke="rgba(15,22,32,0.14)" strokeWidth="1" />
                                <text x={X(l)} y={B + 17} textAnchor="middle" fontSize="12" fill="#3a4151">{fmt(l, l % 1 ? 1 : 0)}</text>
                            </g>
                        ))}
                        {/* axlar med pilspets bara åt det positiva hållet */}
                        <line x1={L} y1={B} x2={R + 4} y2={B} stroke="#0f1620" strokeWidth="1.8" />
                        <polygon points={`${R + 12},${B} ${R + 3},${B - 4} ${R + 3},${B + 4}`} fill="#0f1620" />
                        <line x1={L} y1={B} x2={L} y2={T0 - 4} stroke="#0f1620" strokeWidth="1.8" />
                        <polygon points={`${L},${T0 - 11} ${L - 4},${T0 - 2} ${L + 4},${T0 - 2}`} fill="#0f1620" />
                        <text x={(L + R) / 2} y={B + 38} textAnchor="middle" fontSize="13" fill="#0f1620">
                            Pendellängd <tspan fontStyle="italic">l</tspan> (m)
                        </text>
                        <text transform={`rotate(-90 15 ${(T0 + B) / 2})`} x="15" y={(T0 + B) / 2} textAnchor="middle" fontSize="13" fill="#0f1620">
                            {t2 ? <tspan>Periodtid i kvadrat <tspan fontStyle="italic">T</tspan>² (s²)</tspan>
                                : <tspan>Periodtid <tspan fontStyle="italic">T</tspan> (s)</tspan>}
                        </text>
                        {/* aktuell längd */}
                        <line x1={X(curL)} y1={T0} x2={X(curL)} y2={B} stroke="#c8324a" strokeWidth="1.2" strokeDasharray="2 4" opacity="0.8" />
                        <polygon points={`${X(curL)},${B - 1} ${X(curL) - 5},${B + 8} ${X(curL) + 5},${B + 8}`} fill="#c8324a" />
                        {kurva.length > 1 && <polyline points={kurva.join(' ')} fill="none" stroke="#5a6170" strokeWidth="2" strokeDasharray="6 4" />}
                        {fitLinje}
                        {pts.map((p, i) => (
                            <circle key={i} cx={X(p.l)} cy={Y(val(p))} r="5.5"
                                    fill={p.a0 > 20 ? '#f3eee4' : COL.punkt} stroke={COL.punkt} strokeWidth={p.a0 > 20 ? 2.2 : 1}
                                    style={{ transition: 'cx 0.2s, cy 0.2s' }} />
                        ))}
                    </svg>
                    <div className="flex flex-wrap gap-x-4 gap-y-1 mt-1" style={{ fontSize: 11.5, color: 'var(--lab-ink-soft)' }}>
                        <span><span style={{ color: COL.punkt }}>●</span> mätpunkt</span>
                        <span><span style={{ color: COL.punkt }}>○</span> stort utslag (över 20°)</span>
                        {!gissa && <span><span style={{ color: '#5a6170' }}>- - -</span> formelns kurva</span>}
                        {t2 && <span><span style={{ color: COL.fit }}>━</span> anpassad linje</span>}
                    </div>
                    <p className="anm mt-2">
                        {t2 ? (
                            pts.length === 0 ? <span>Lägg mätpunkter i diagrammet. Punkterna hamnar på en rät linje genom origo, eftersom <em>T</em>² = (4π²/<em>g</em>)&thinsp;·&thinsp;<em>l</em>.</span> :
                            <span>Lutningen <em>k</em> = <em>T</em>²/<em>l</em> = {fmt(k, 2)} s²/m.{' '}
                                {gissa ? <span>Använd sambandet <em>k</em> = 4π²/<em>g</em> för att bestämma <em>g</em>.</span>
                                       : <span>Då är <em>g</em> = 4π²/<em>k</em> = {fmt(gEst, 2)} m/s².</span>}</span>
                        ) : (
                            <span>Kurvan böjer av: fyrdubblas <em>l</em> fördubblas <em>T</em>. Byt till <em>T</em>² mot <em>l</em> så blir sambandet en rät linje.</span>
                        )}
                    </p>
                    {pts.length > 0 && <button className="btn-toggle mt-2" style={{ padding: '4px 10px', fontSize: 12.5 }} onClick={onClear}>Rensa mätserien</button>}
                </div>
            );
        });

        // ═══════════════════════════════════════════════
        //  Delade hjälpkomponenter
        // ═══════════════════════════════════════════════
        const Slider = ({ label, value, min, max, step, onChange, children }) => (
            <div className="flex items-center gap-2 mb-2">
                <span className="text-xs flex-shrink-0" style={{ minWidth: 110, color: 'var(--lab-ink-soft)' }}
                      dangerouslySetInnerHTML={{ __html: label }} />
                <span className="sl-wrap">
                    <input type="range" min={min} max={max} step={step} value={value}
                           onChange={(e) => onChange(parseFloat(e.target.value))} className="cursor-pointer" />
                </span>
                {children}
            </div>
        );
        const StSlider = ({ label, value, min, max, step, onChange, valueNode }) => (
            <div className="st-slider">
                <div className="st-slider-top">
                    <span dangerouslySetInnerHTML={{ __html: label }} />
                    {valueNode}
                </div>
                <span className="sl-wrap">
                    <input type="range" min={min} max={max} step={step} value={value}
                           onChange={(e) => onChange(parseFloat(e.target.value))} />
                </span>
            </div>
        );
        const NumInput = ({ value, min, max, onCommit, fmtFn, unit }) => {
            const [txt, setTxt] = useState(() => fmtFn(value));
            const [editing, setEditing] = useState(false);
            useEffect(() => { if (!editing) setTxt(fmtFn(value)); }, [value, editing]);
            const commit = (raw) => {
                const norm = raw.replace(',', '.').trim();
                if (norm === '' || norm === '-' || norm === '.' || norm === '-.') return;
                let n = parseFloat(norm);
                if (!isFinite(n)) return;
                if (min != null && n < min) n = min;
                if (max != null && n > max) n = max;
                onCommit(n);
            };
            return (
                <span className="num-wrap">
                    <input className="num-in" type="text" inputMode="decimal" value={txt}
                           style={{ color: 'var(--lab-accent, #c8324a)' }} aria-label="Skriv in värde"
                           onFocus={() => setEditing(true)}
                           onChange={(e) => { setTxt(e.target.value); commit(e.target.value); }}
                           onBlur={() => { setEditing(false); setTxt(fmtFn(value)); }}
                           onKeyDown={(e) => { if (e.key === 'Enter') e.currentTarget.blur(); }} />
                    {unit && <span className="num-unit">{unit}</span>}
                </span>
            );
        };

        // ── Formelkort med ord-etiketter ──
        const Vbl = ({ label, children }) => (
            <div className="flex flex-col items-center" style={{ lineHeight: 1.1 }}>
                <span className="flbl">{label}</span>
                <span className="fnum">{children}</span>
                <span className="flbl" aria-hidden="true" style={{ visibility: 'hidden' }}>{label}</span>
            </div>
        );
        const Frac = ({ topLabel, top, bottomLabel, bottom }) => (
            <div className="flex flex-col items-center" style={{ lineHeight: 1.1 }}>
                <span className="flbl" style={topLabel ? null : { visibility: 'hidden' }}>{topLabel || 'x'}</span>
                <span className="fnum">{top}</span>
                <span className="fnum" style={{ alignSelf: 'stretch', textAlign: 'center',
                                                borderTop: '2px solid currentColor', paddingTop: 3, marginTop: 3 }}>{bottom}</span>
                <span className="flbl" style={bottomLabel ? null : { visibility: 'hidden' }}>{bottomLabel || 'x'}</span>
            </div>
        );
// Bråk under ett rottecken, med valfria ordetiketter utanför roten.
        const RotBrak = ({ topLabel, top, bottom, bottomLabel }) => (
            <span className="rb">
                {topLabel && <span className="flbl rb-lbl topp">{topLabel}</span>}
                <span className="rb-cell"><svg className="rb-tecken" viewBox="0 0 17 100" preserveAspectRatio="none" aria-hidden="true">
                    <path d="M1 62 L5 57 L9.5 98 L16 1 L17 1" fill="none" stroke="currentColor" strokeWidth="2"
                          strokeLinejoin="round" strokeLinecap="butt" vectorEffect="non-scaling-stroke" />
                </svg></span>
                <span className="rb-rad">
                    <span className="fnum">{top}</span>
                    <span className="rb-streck"></span>
                    <span className="fnum">{bottom}</span>
                </span>
                {bottomLabel && <span className="flbl rb-lbl botten">{bottomLabel}</span>}
            </span>
        );
        const FormulaCard = React.memo(({ l, g, T, gissa }) => (
            <div className="formula-card glass-card rounded-xl p-4 mb-6 flex flex-wrap items-center gap-x-3 gap-y-3" style={{ color: 'var(--lab-ink)' }}>
                <span className="fk-grupp">
                <Vbl label="Periodtid"><em>T</em></Vbl>
                <span className="fnum">=</span>
                <Vbl label="&nbsp;">2π</Vbl>
                <span className="fnum">·</span>
                <RotBrak topLabel="Pendellängd" top={<em>l</em>} bottom={<em>g</em>} bottomLabel="Tyngdacceleration" />
                </span>
                <span className="fk-grupp">
                <span className="fnum">=</span>
                <Vbl label="&nbsp;">2π</Vbl>
                <span className="fnum">·</span>
                <RotBrak top={<span>{fmtL(l)}&nbsp;m</span>} bottom={<span>{gissa ? '?' : fmt(g, 2)}&nbsp;m/s²</span>} />
                <span className="fnum">=</span>
                <Vbl label="&nbsp;"><b>{gissa ? '?' : fmt(T, 2) + ' s'}</b></Vbl>
                </span>
            </div>
        ));

        // ═══════════════════════════════════════════════
        //  Tidtagaren (ljusgrindens display) och avläsningar
        // ═══════════════════════════════════════════════
        const Tidtagare = ({ sim, running, onMat, onLagg, harPunkt }) => {
            const m = sim.meas;
            let storTid = 0, status = 'Redo.', delta = '';
            if (m.fas === 'armed') { status = 'Väntar på första passagen'; }
            else if (m.fas === 'running') { storTid = sim.t - m.t0; status = 'Mäter'; delta = m.n + ' av 10'; }
            else if (m.fas === 'done') { storTid = m.T10; status = 'Klart'; delta = '10 av 10'; }
            const aktiv = m.fas === 'armed' || m.fas === 'running';
            return (
                <div className="glass-card rounded-xl p-3">
                    <div className="flbl mb-2">Ljusgrind och tidtagare</div>
                    <div className="lcd">
                        <div className="lcd-big">{fmtT(storTid)} s</div>
                        <div className="lcd-sub"><span>{status}</span><span>{delta}</span></div>
                    </div>
                    {m.fas === 'done' && (
                        <p className="anm mt-2">
                            Tio svängningar tog {fmt(m.T10, 2)} s, så <em>T</em> = {fmt(m.T10, 2)} s / 10 = <b>{fmt(m.T10 / 10, 3)} s</b>.
                        </p>
                    )}
                    <div className="flex gap-2 mt-2 flex-wrap">
                        <button className="btn-toggle flex-1" onClick={onMat}>{aktiv ? 'Avbryt mätningen' : 'Mät 10 svängningar'}</button>
                        <button className="btn-toggle flex-1" disabled={m.fas !== 'done' || m.added} onClick={onLagg}>
                            {m.added ? 'Punkten ligger i diagrammet' : 'Lägg mätpunkt i diagrammet'}
                        </button>
                    </div>
                </div>
            );
        };

        const Avlasning = ({ sim, P, gissa }) => {
            const m = sim.meas;
            const Tf = 2 * Math.PI * Math.sqrt(P.l / P.g);
            const klar = m.fas === 'done' && m.snap;
            const Tm = klar ? m.T10 / 10 : null;
            const Tfm = klar ? 2 * Math.PI * Math.sqrt(m.snap.l / m.snap.g) : null;
            const avv = klar ? (Tm / Tfm - 1) * 100 : null;
            return (
                <div className="glass-card rounded-xl p-3">
                    <div className="flbl mb-2">Avläsning</div>
                    <div className="grid grid-cols-3 gap-2 rd">
                        <div className="rd"><b>{fmtL(P.l)} m</b><span>pendellängd <em>l</em></span></div>
                        <div className="rd"><b>{fmt(Math.abs(sim.th) / DEG, 1)}°</b><span>utslag nu <em>α</em></span></div>
                        <div className="rd"><b>{klar ? fmt(Tm, 3) + ' s' : '–'}</b><span>uppmätt <em>T</em></span></div>
                        <div className="rd"><b>{gissa ? '?' : fmt(Tf, 3) + ' s'}</b><span>formelns <em>T</em></span></div>
                        <div className="rd"><b>{gissa || !klar ? '–' : (avv >= 0 ? '+' : '−') + fmt(Math.abs(avv), 1) + ' %'}</b><span>avvikelse</span></div>
                        <div className="rd"><b>{klar ? fmt(m.snap.a0, 0) + '°' : '–'}</b><span>utslag vid mätningen</span></div>
                    </div>
                </div>
            );
        };

        // ── Gissa-läget: okänd planet ──
        const GissaPanel = ({ st, setSt, onKolla, onNy, harMatning }) => (
            <div className="glass-card rounded-xl p-3">
                <div className="flbl mb-2">Okänd planet</div>
                <p className="anm mb-2">
                    Pendeln hänger på en okänd himlakropp. Mät <em>T</em> för en eller flera längder, bestäm <em>g</em> och skriv in det. Ljusgrinden och diagrammet är dina enda mätinstrument.
                </p>
                {!st.klar ? (
                    <div className="flex items-center gap-2 flex-wrap">
                        <span style={{ fontSize: 13 }}><em>g</em> =</span>
                        <input className="txt-in" type="text" inputMode="decimal" value={st.input} aria-label="Ditt värde på g"
                               onChange={(e) => setSt({ ...st, input: e.target.value })}
                               onKeyDown={(e) => { if (e.key === 'Enter') onKolla(); }} />
                        <span style={{ fontSize: 13 }}>m/s²</span>
                        <button className="btn-toggle btn-prim" disabled={!harMatning} onClick={onKolla}>Kontrollera</button>
                    </div>
                ) : (
                    <button className="btn-toggle btn-prim" onClick={onNy}>Ny okänd planet</button>
                )}
                {!harMatning && !st.klar && <p className="anm mt-1">Gör en mätning först.</p>}
                {st.fb && <div className={'anm mt-2 ' + (st.fb.ok ? 'svar-ok' : 'svar-fel')} dangerouslySetInnerHTML={{ __html: st.fb.html }} />}
                <div className="flex gap-4 mt-2" style={{ fontSize: 13 }}>
                    <span>Poäng: <b>{st.poang}</b></span>
                    <span>Svit: <b>{st.svit}</b></span>
                </div>
            </div>
        );

        // ═══════════════════════════════════════════════
        //  Huvudappen
        // ═══════════════════════════════════════════════
        const slumpaPlanet = (not) => {
            let p;
            do { p = OKANDA[Math.floor(Math.random() * OKANDA.length)]; } while (not && p.namn === not);
            return p;
        };

        const App = () => {
            const [l, setL] = useState(1.0);
            const [a0, setA0] = useState(10);
            const [sgn, setSgn] = useState(1);
            const [m, setM] = useState(100);
            const [plats, setPlats] = useState('jorden');
            const [gFri, setGFri] = useState(9.82);
            const [lage, setLage] = useState('fri');                 // 'fri' | 'gissa'
            const [okand, setOkand] = useState(() => slumpaPlanet());
            const [running, setRunning] = useState(true);
            const [speed, setSpeed] = useState(1);
            const [show, setShow] = useState({ krafter: false, kurva: true, ghost: true, ljusgrind: true, gradskiva: true, linjal: true });
            const [diagMode, setDiagMode] = useState('T2');
            const [ghost, setGhost] = useState(null);
            const [forsok, setForsok] = useState(null);
            const [pts, setPts] = useState([]);
            const [togglesOpen, setTogglesOpen] = useState(true);
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [narrow, setNarrow] = useState(() => window.matchMedia('(max-width: 600px)').matches);
            const [gst, setGst] = useState({ input: '', fb: null, forsok: 0, klar: false, poang: 0, svit: 0 });
            const [, force] = useReducer((x) => x + 1, 0);

            const gissa = lage === 'gissa';
            const g = gissa ? okand.g : (plats === 'valfri' ? gFri : PLATSER.find((p) => p.id === plats).g);
            const P = { l, m, g, a0, sgn, ghost };

            const simRef = useRef(nySim());
            const Pref = useRef(P); Pref.current = P;
            const runRef = useRef(running); runRef.current = running;
            const spdRef = useRef(speed); spdRef.current = speed;
            const dragRef = useRef(false);
            const svgRef = useRef(null);
            const sceneWrapRef = useRef(null);

            // Ändrade villkor: pendlarna återgår till startläget, en pågående mätning avbryts.
            const ghostKey = ghost ? ghost.l + '|' + ghost.a0 : '-';
            useEffect(() => {
                const s = simRef.current;
                s.th = sgn * a0 * DEG; s.om = 0; s.t = 0;
                if (ghost) { s.thB = sgn * ghost.a0 * DEG; s.omB = 0; }
                if (s.meas.fas === 'armed' || s.meas.fas === 'running') s.meas = nyMatning();
                force();
            }, [l, a0, sgn, g, ghostKey]);

            // g ändras (plats): mätserien hör till en viss tyngdacceleration
            useEffect(() => { setPts([]); simRef.current.meas = nyMatning(); }, [g]);

            // animationsloop
            useEffect(() => {
                let raf, last = performance.now();
                const loop = (now) => {
                    const dt = Math.min(0.05, (now - last) / 1000);
                    last = now;
                    const s = simRef.current;
                    if (runRef.current && !dragRef.current) {
                        framat(s, Pref.current, dt * spdRef.current);
                        force();
                    } else if (now - s.flash < 260) force();
                    raf = requestAnimationFrame(loop);
                };
                raf = requestAnimationFrame(loop);
                return () => cancelAnimationFrame(raf);
            }, []);

            // fullskärm och smal skärm
            useEffect(() => {
                const handler = () => {
                    const w = sceneWrapRef.current;
                    setIsFullscreen(!!w && (document.fullscreenElement === w || document.webkitFullscreenElement === w));
                };
                document.addEventListener('fullscreenchange', handler);
                document.addEventListener('webkitfullscreenchange', handler);
                const mq = window.matchMedia('(max-width: 600px)');
                const mqh = () => setNarrow(mq.matches);
                mq.addEventListener('change', mqh);
                return () => {
                    document.removeEventListener('fullscreenchange', handler);
                    document.removeEventListener('webkitfullscreenchange', handler);
                    mq.removeEventListener('change', mqh);
                };
            }, []);
            const toggleFullscreen = () => {
                const el = sceneWrapRef.current;
                if (!el) return;
                if (document.fullscreenElement || document.webkitFullscreenElement)
                    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
            };

            // ── Åtgärder ──
            const rensaForsok = () => setForsok(null);
            const andraL = (v) => { setL(Math.max(LMIN, Math.min(LMAX, v))); rensaForsok(); };
            const andraA0 = (v) => { setA0(Math.max(1, Math.min(A0MAX, Math.round(v)))); rensaForsok(); };
            const andraM = (v) => { setM(Math.max(MMIN, Math.min(MMAX, Math.round(v)))); };
            const valjPlats = (id) => { setPlats(id); rensaForsok(); };
            const tShow = (k) => setShow((sh) => ({ ...sh, [k]: !sh[k] }));
            const tillbaka = () => {
                const s = simRef.current;
                s.th = sgn * a0 * DEG; s.om = 0; s.t = 0;
                if (ghost) { s.thB = sgn * ghost.a0 * DEG; s.omB = 0; }
                if (s.meas.fas === 'armed' || s.meas.fas === 'running') s.meas = nyMatning();
                setRunning(false); force();
            };
            const primar = () => {
                setRunning((r) => !r);
            };
            const primarText = running ? 'Pausa' : (simRef.current.t === 0 ? 'Släpp pendeln' : 'Fortsätt');

            const valjForsok = (f) => {
                setL(f.set.l); setA0(f.set.a0); setM(f.set.m); setSgn(1);
                if (f.set.plats !== plats) setPlats(f.set.plats);
                setGhost(f.ghost); setShow((sh) => ({ ...sh, ghost: true }));
                setForsok(f.id);
                setRunning(true);
                simRef.current.meas = nyMatning();
            };
            const valjLage = (nytt) => {
                if (nytt === lage) return;
                setLage(nytt); setForsok(null); setGhost(null);
                setL(1.0); setA0(10); setM(100); setSgn(1);
                if (nytt === 'gissa') {
                    setOkand(slumpaPlanet(okand.namn));
                    setGst({ input: '', fb: null, forsok: 0, klar: false, poang: gst.poang, svit: gst.svit });
                } else {
                    setPlats('jorden');
                }
                setPts([]); simRef.current.meas = nyMatning(); setRunning(true);
            };

            const matning = () => {
                const s = simRef.current;
                if (s.meas.fas === 'armed' || s.meas.fas === 'running') { s.meas = nyMatning(); force(); return; }
                s.meas = { fas: 'armed', n: 0, t0: 0, dir: 0 };
                if (!runRef.current) setRunning(true);
                force();
            };
            const laggPunkt = () => {
                const m2 = simRef.current.meas;
                if (m2.fas !== 'done' || m2.added) return;
                m2.added = true;
                setPts((p) => [...p, { l: m2.snap.l, T: m2.T10 / 10, a0: m2.snap.a0 }].slice(-24));
                force();
            };

            const kollaGissning = () => {
                const v = parseFloat(String(gst.input).replace(',', '.'));
                const mm = simRef.current.meas;
                if (!isFinite(v) || v <= 0) {
                    setGst({ ...gst, fb: { ok: false, html: 'Skriv in ett värde på <em>g</em> i m/s².' } });
                    return;
                }
                const rel = Math.abs(v - okand.g) / okand.g;
                const sist = (mm.fas === 'done' && mm.snap) ? mm : null;
                const hur = sist
                    ? 'Med <em>l</em> = ' + fmtL(sist.snap.l) + ' m och <em>T</em> = ' + fmt(sist.T10 / 10, 3) + ' s ger <em>g</em> = 4π²·<em>l</em>/<em>T</em>² = 4π² · ' + fmtL(sist.snap.l) + ' / ' + fmt(sist.T10 / 10, 3) + '² = ' + fmt(4 * Math.PI * Math.PI * sist.snap.l / Math.pow(sist.T10 / 10, 2), 2) + ' m/s².'
                    : 'Lös ut <em>g</em> ur <em>T</em> = 2π√(<em>l</em>/<em>g</em>): <em>g</em> = 4π²·<em>l</em>/<em>T</em>².';
                const stort = sist && sist.snap.a0 > 25
                    ? ' Mätningen gjordes med ' + sist.snap.a0 + '° utslag. Formeln gäller bara för små utslag, så ett värde från så stort utslag blir för lågt.' : '';
                if (rel <= 0.06) {
                    const poang = gst.forsok === 0 ? 3 : 1;
                    setGst({ ...gst, klar: true, poang: gst.poang + poang, svit: gst.svit + 1,
                        fb: { ok: true, html: 'Det stämmer. Din pendel hänger på <b>' + okand.namn + '</b>, där <em>g</em> = ' + fmt(okand.g, 2) + ' m/s². ' + hur + ' Du får ' + poang + (poang === 1 ? ' poäng.' : ' poäng.') } });
                    return;
                }
                if (gst.forsok === 0) {
                    const dir = v < okand.g ? 'Ditt värde är för litet' : 'Ditt värde är för stort';
                    setGst({ ...gst, forsok: 1,
                        fb: { ok: false, html: dir + '. Kontrollera att du kvadrerat <em>T</em> och att längden är mätt till kulans tyngdpunkt. Större <em>g</em> ger kortare period.' + stort + ' Försök en gång till.' } });
                } else {
                    setGst({ ...gst, klar: true, svit: 0,
                        fb: { ok: false, html: 'Det stämmer inte. Pendeln hängde på <b>' + okand.namn + '</b>, där <em>g</em> = ' + fmt(okand.g, 2) + ' m/s². ' + hur + stort } });
                }
            };
            const nyPlanet = () => {
                setOkand(slumpaPlanet(okand.namn));
                setGst({ ...gst, input: '', fb: null, forsok: 0, klar: false });
                setPts([]); simRef.current.meas = nyMatning();
                setRunning(true); setSgn(1); setA0(10); setL(1.0);
            };

            // ── Dra i kulan ──
            const svgPunkt = (e) => {
                const svg = svgRef.current;
                const pt = svg.createSVGPoint();
                pt.x = e.clientX; pt.y = e.clientY;
                return pt.matrixTransform(svg.getScreenCTM().inverse());
            };
            const dragTill = (e) => {
                const p = svgPunkt(e);
                const ang = Math.atan2(p.x - PX, p.y - PY) / DEG;
                const a = Math.max(1, Math.min(A0MAX, Math.round(Math.abs(ang))));
                setSgn(ang < 0 ? -1 : 1);
                setA0(a); rensaForsok();
            };
            const dragStart = (e) => {
                e.preventDefault();
                e.currentTarget.setPointerCapture(e.pointerId);
                dragRef.current = true;
                setRunning(false);
                dragTill(e);
            };
            const dragMove = (e) => { if (dragRef.current) dragTill(e); };
            const dragEnd = () => {
                if (!dragRef.current) return;
                dragRef.current = false;
                setRunning(true);
            };

            // ── Scenens synliga område ──
            const sim = simRef.current;
            let vb = { x: 0, w: 700 };
            if (narrow) {
                const lMax = Math.max(l, ghost && show.ghost ? ghost.l : 0);
                const aMax = Math.max(a0, ghost && show.ghost ? ghost.a0 : 0);
                const need = lMax * S * Math.sin(aMax * DEG) + 60;
                const h = Math.max(215, Math.min(350, need));
                vb = { x: PX - h, w: 2 * h };
            }
            const bredFs = isFullscreen && !narrow;
            const Tformel = 2 * Math.PI * Math.sqrt(l / g);

            // ── Paneler (tidtagare, avläsning, gissa, diagram): hamnar i sidopanelen,
            //    till vänster i bred fullskärm eller i verktygsrutan på mobil ──
            const paneler = (
                <React.Fragment>
                    <Tidtagare sim={sim} running={running} onMat={matning} onLagg={laggPunkt} />
                    <Avlasning sim={sim} P={P} gissa={gissa} />
                    {gissa && <GissaPanel st={gst} setSt={setGst} onKolla={kollaGissning} onNy={nyPlanet}
                                          harMatning={pts.length > 0 || (sim.meas.fas === 'done')} />}
                    <Diagram pts={pts} mode={diagMode} g={g} visaKurva={show.kurva} curL={l} gissa={gissa}
                             onMode={setDiagMode} onClear={() => setPts([])} />
                </React.Fragment>
            );

            const reglage = (kompakt) => {
                const S1 = kompakt ? StSlider : Slider;
                const wrap = (c) => kompakt ? <div className="st-sliders">{c}</div> : <div>{c}</div>;
                return wrap(
                    <React.Fragment>
                        <S1 label="Pendellängd <em>l</em>" value={l} min={LMIN} max={LMAX} step={0.01} onChange={andraL}
                            valueNode={<NumInput value={l} min={LMIN} max={LMAX} fmtFn={fmtL} unit="m" onCommit={andraL} />}>
                            {!kompakt && <NumInput value={l} min={LMIN} max={LMAX} fmtFn={fmtL} unit="m" onCommit={andraL} />}
                        </S1>
                        <S1 label="Utslag <em>α</em>" value={a0} min={1} max={A0MAX} step={1} onChange={andraA0}
                            valueNode={<NumInput value={a0} min={1} max={A0MAX} fmtFn={(x) => fmt(x, 0)} unit="°" onCommit={andraA0} />}>
                            {!kompakt && <NumInput value={a0} min={1} max={A0MAX} fmtFn={(x) => fmt(x, 0)} unit="°" onCommit={andraA0} />}
                        </S1>
                        <S1 label="Massa <em>m</em>" value={m} min={MMIN} max={MMAX} step={10} onChange={andraM}
                            valueNode={<NumInput value={m} min={MMIN} max={MMAX} fmtFn={(x) => fmt(x, 0)} unit="g" onCommit={andraM} />}>
                            {!kompakt && <NumInput value={m} min={MMIN} max={MMAX} fmtFn={(x) => fmt(x, 0)} unit="g" onCommit={andraM} />}
                        </S1>
                        {!gissa && plats === 'valfri' && (
                            <S1 label="Tyngdacceleration <em>g</em>" value={gFri} min={1} max={30} step={0.1} onChange={setGFri}
                                valueNode={<NumInput value={gFri} min={1} max={30} fmtFn={(x) => fmt(x, 1)} unit="m/s²" onCommit={setGFri} />}>
                                {!kompakt && <NumInput value={gFri} min={1} max={30} fmtFn={(x) => fmt(x, 1)} unit="m/s²" onCommit={setGFri} />}
                            </S1>
                        )}
                    </React.Fragment>
                );
            };

            const styrknappar = (
                <div className="flex gap-2">
                    <button className="btn-toggle btn-prim flex-1" onClick={primar}>{primarText}</button>
                    <button className="btn-toggle flex-1" onClick={tillbaka}>Börja om</button>
                </div>
            );

            // Inställningsrutan uppe till höger (hopfällbar)
            const sceneToggles = () => {
                if (!togglesOpen) return (
                    <button className="st-show-btn" onClick={() => setTogglesOpen(true)}
                            aria-label="Visa inställningar" title="Visa inställningar" aria-expanded="false">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             strokeWidth="2" strokeLinecap="round" aria-hidden="true">
                            <line x1="4" y1="8" x2="20" y2="8" /><circle cx="14.5" cy="8" r="2.7" fill="currentColor" stroke="none" />
                            <line x1="4" y1="16" x2="20" y2="16" /><circle cx="9.5" cy="16" r="2.7" fill="currentColor" stroke="none" />
                        </svg>
                    </button>
                );
                return (
                    <div className="scene-toggles">
                        <button className="st-hide" onClick={() => setTogglesOpen(false)}
                                aria-label="Dölj inställningar" title="Dölj inställningar" aria-expanded="true">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 strokeWidth="2.4" strokeLinecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
                        </button>
                        <div className="st-title">Visa</div>
                        <label><input type="checkbox" checked={show.krafter} onChange={() => tShow('krafter')} />
                            <span className="st-swatch" style={{ background: COL.tyngd }}></span>
                            <span>Krafter</span></label>
                        <label><input type="checkbox" checked={show.kurva} onChange={() => tShow('kurva')} disabled={gissa} />
                            <span className="st-swatch" style={{ background: '#5a6170' }}></span>
                            <span>Formelns kurva</span></label>
                        <label><input type="checkbox" checked={show.ljusgrind} onChange={() => tShow('ljusgrind')} />
                            <span>Ljusgrind</span></label>
                        <label><input type="checkbox" checked={show.gradskiva} onChange={() => tShow('gradskiva')} />
                            <span>Gradskiva</span></label>
                        <label><input type="checkbox" checked={show.linjal} onChange={() => tShow('linjal')} />
                            <span>Linjal</span></label>
                        {ghost && (
                            <label><input type="checkbox" checked={show.ghost} onChange={() => tShow('ghost')} />
                                <span className="st-swatch" style={{ background: '#2f6fd0' }}></span>
                                <span>Jämförelsependel B</span></label>
                        )}
                        {isFullscreen && (
                            <React.Fragment>
                                <div className="st-title mt">Tidsförlopp</div>
                                {[[0.25, 'Långsamt (¼×)'], [1, 'Normalt'], [4, 'Snabbt (4×)']].map(([v, t]) => (
                                    <label key={v}><input type="radio" name="speed" checked={speed === v} onChange={() => setSpeed(v)} /><span>{t}</span></label>
                                ))}
                                <div className="st-title mt">Läge</div>
                                <label><input type="radio" name="lage" checked={lage === 'fri'} onChange={() => valjLage('fri')} /><span>Fritt laboratorium</span></label>
                                <label><input type="radio" name="lage" checked={lage === 'gissa'} onChange={() => valjLage('gissa')} /><span>Okänd planet</span></label>
                                {!gissa && (
                                    <React.Fragment>
                                        <div className="st-title mt">Plats</div>
                                        <select value={plats} onChange={(e) => valjPlats(e.target.value)} aria-label="Plats">
                                            {PLATSER.map((p) => <option key={p.id} value={p.id}>{p.namn}{p.id !== 'valfri' ? ' (' + fmt(p.g, 2) + ' m/s²)' : ''}</option>)}
                                        </select>
                                        <div className="st-title mt">Färdigt försök</div>
                                        <select value={forsok || ''} onChange={(e) => { const f = FORSOK.find((x) => x.id === e.target.value); if (f) valjForsok(f); }} aria-label="Färdigt försök">
                                            <option value="">Välj försök</option>
                                            {FORSOK.map((f) => <option key={f.id} value={f.id}>{f.namn}</option>)}
                                        </select>
                                    </React.Fragment>
                                )}
                                <div className="st-title mt">Reglage</div>
                                {reglage(true)}
                                <div className="st-actions">{styrknappar}</div>
                                {narrow && <div className="st-panels">{paneler}</div>}
                            </React.Fragment>
                        )}
                    </div>
                );
            };

            const forsokObj = FORSOK.find((f) => f.id === forsok);

            return (
                <div className="min-h-screen dark-container px-4 md:px-8 pb-12" style={{ fontFamily: "'DM Sans', sans-serif" }}>
                    <div className="max-w-6xl mx-auto pt-6">
                        <div className="breadcrumb mb-4" style={{ fontSize: 13 }}>
                            <a href="index.html">Hem</a> / <a href="katalog.html?id=fy2">Fysik nivå 2</a> / Plan matematisk pendel
                        </div>
                        <h1 className="text-3xl md:text-4xl font-black tracking-tight" style={{ color: 'var(--lab-ink)' }}>Plan matematisk pendel</h1>
                        <p className="mt-2 mb-5" style={{ color: 'var(--lab-ink-soft)', maxWidth: 840 }}>
                            En liten kula i ett tunt snöre svänger fram och tillbaka. Dra i kulan för att välja utslag och släpp.
                            Ljusgrinden vid jämviktsläget mäter tiden för tio svängningar, och du lägger mätpunkten i diagrammet.
                            Ändra pendelns längd och mät igen: i diagrammet över <em>T</em>² mot <em>l</em> hamnar punkterna på en rät linje
                            genom origo, och linjens lutning är 4π²/<em>g</em>. Flytta pendeln till Månen, jämför två pendlar
                            eller gissa vilken okänd planet den hänger på.
                        </p>

                        <FormulaCard l={l} g={g} T={Tformel} gissa={gissa} />

                        <div className="dim-lankar" role="group" aria-label="Vy: 2D, 3D eller pendelvågen">
                            <span className="aktiv" aria-current="true">2D</span>
                            <a href="fysik2-pendel-3d-app.html?lage=en" title="Samma pendel i 3D, med krafterna">3D</a>
                            <a href="fysik2-pendel-3d-app.html" title="Femton pendlar som bildar en våg">Pendelvågen i 3D</a>
                        </div>

                        <main className="flex flex-col lg:flex-row gap-6">
                            {/* Scen */}
                            <div className="lg:w-3/5 order-1">
                                <div className={'scene-wrap' + (isFullscreen ? ' is-fs' : '') + (bredFs ? ' fs-bred' : '')}
                                     data-theme="ljusPapper" ref={sceneWrapRef}>
                                    <Scen svgRef={svgRef} sim={sim} P={P} show={show} compact={narrow} gissa={gissa} vb={vb}
                                          onDragStart={dragStart} onDragMove={dragMove} onDragEnd={dragEnd} />
                                    {bredFs && <div className="fs-vanster">{paneler}</div>}
                                    {!isFullscreen && <div className="scene-hint">
                                        Dra i kulan för att välja utslag. Pendeln startar när du släpper.
                                    </div>}
                                    {sceneToggles()}
                                    <button className="fs-btn" onClick={toggleFullscreen} aria-label="Fullskärm"
                                            title={isFullscreen ? 'Lämna fullskärm' : 'Fullskärm'}>
                                        {isFullscreen ? (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M9 3v6H3" /><path d="M15 21v-6h6" /><path d="M21 9h-6V3" /><path d="M3 15h6v6" />
                                            </svg>
                                        ) : (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M3 9V3h6" /><path d="M21 9V3h-6" /><path d="M3 15v6h6" /><path d="M21 15v6h-6" />
                                            </svg>
                                        )}
                                    </button>
                                </div>
                                <div className="hidden lg:flex flex-col gap-3 mt-3">{paneler}</div>
                            </div>

                            {/* Kontroller */}
                            <div className="lg:w-2/5 order-2 flex flex-col gap-3">
                                <div className="glass-card rounded-xl p-3">
                                    <div className="flbl mb-2">Läge</div>
                                    <div className="seg" style={{ gridTemplateColumns: '1fr 1fr' }}>
                                        <button className={!gissa ? 'active' : ''} onClick={() => valjLage('fri')}>Fritt laboratorium</button>
                                        <button className={gissa ? 'active' : ''} onClick={() => valjLage('gissa')}>Okänd planet</button>
                                    </div>
                                    {!gissa && (
                                        <React.Fragment>
                                            <div className="flbl mt-3 mb-2">Färdiga försök</div>
                                            <div className="forsok">
                                                {FORSOK.map((f) => (
                                                    <button key={f.id} className={forsok === f.id ? 'active' : ''} onClick={() => valjForsok(f)}>{f.namn}</button>
                                                ))}
                                            </div>
                                            {forsokObj && <p className="anm mt-2" dangerouslySetInnerHTML={{ __html: forsokObj.text }} />}
                                        </React.Fragment>
                                    )}
                                </div>

                                <div className="glass-card rounded-xl p-3">
                                    <div className="flbl mb-2">Reglage</div>
                                    {reglage(false)}
                                    {!gissa && (
                                        <React.Fragment>
                                            <div className="flbl mt-1 mb-2">Plats</div>
                                            <div className="seg mb-3" style={{ gridTemplateColumns: 'repeat(5, 1fr)' }}>
                                                {PLATSER.map((p) => (
                                                    <button key={p.id} className={plats === p.id ? 'active' : ''} onClick={() => valjPlats(p.id)}>{p.namn}</button>
                                                ))}
                                            </div>
                                        </React.Fragment>
                                    )}
                                    <div className="flbl mb-2">Tidsförlopp</div>
                                    <div className="seg mb-3" style={{ gridTemplateColumns: 'repeat(3, 1fr)' }}>
                                        {[[0.25, 'Långsamt'], [1, 'Normalt'], [4, 'Snabbt']].map(([v, t]) => (
                                            <button key={v} className={speed === v ? 'active' : ''} onClick={() => setSpeed(v)}>{t}</button>
                                        ))}
                                    </div>
                                    {styrknappar}
                                    <p className="anm mt-2">
                                        Ändrar du längd, utslag eller plats återgår pendeln till startläget.
                                        Massan påverkar inte rörelsen.
                                    </p>
                                </div>

                                <div className="lg:hidden flex flex-col gap-3">{paneler}</div>
                            </div>
                        </main>

                        <details className="glass-card rounded-xl p-4 mt-6">
                            <summary className="accordion-head">
                                <span>Så hänger det ihop</span>
                                <span aria-hidden="true">+</span>
                            </summary>
                            <ul className="mt-3 space-y-2" style={{ color: 'var(--lab-ink-soft)', fontSize: 14.5, lineHeight: 1.55, paddingLeft: 18, listStyle: 'disc' }}>
                                <li>Pendellängden <em>l</em> räknas från upphängningspunkten till kulans tyngdpunkt. Därför går snöret ända fram till pricken i kulans mitt, och måttbandets avläsning görs där.</li>
                                <li>Tyngdkraften <em>F</em><sub>G</sub> delas i en komposant längs snöret och en tangentiell komposant <em>F</em><sub>1</sub> = <em>F</em><sub>G</sub>&thinsp;·&thinsp;sin&nbsp;<em>α</em>. Spännkraften <em>F</em><sub>S</sub> tar upp den första, och bara <em>F</em><sub>1</sub> för pendeln mot jämviktsläget.</li>
                                <li>Massan ingår inte i formeln. <em>F</em><sub>1</sub> är proportionell mot massan, men det är också kulans tröghet, så massan förkortas bort. Prova försöket med samma längd och olika massa.</li>
                                <li>Kvadrerar du formeln får du <em>T</em>² = (4π²/<em>g</em>)&thinsp;·&thinsp;<em>l</em>, en rät linje genom origo med lutningen 4π²/<em>g</em>. Läs av lutningen och räkna ut <em>g</em> ur den.</li>
                                <li>Formeln gäller bara för små utslag, eftersom den bygger på att sin&nbsp;<em>α</em> ≈ <em>α</em> (i radianer). Vid 23° blir felet cirka 1 %, vid 45° cirka 4 % och vid 60° cirka 7 %. Simuleringen räknar rörelsen exakt, så du ser avvikelsen själv.</li>
                                <li>Sekundpendeln har perioden 2,00 s, så den passerar jämviktsläget en gång per sekund. Vid <em>g</em> = 9,82 m/s² är den knappt en meter lång, <em>l</em> ≈ 0,995 m.</li>
                            </ul>
                        </details>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script src="feedback.js" defer></script>
    <script src="sim-dock.js" defer></script>
    <script src="data/katalog.js"></script>
    <script src="section-nav.js"></script>
    <!-- Cloudflare Web Analytics: cookiefri besöksmätning, se CLAUDE.md. -->
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js"
            data-cf-beacon='{"token": "366677ecfe014a76b73f5bc78a489e0e"}'></script>
</body>
