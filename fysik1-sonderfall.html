                        <Nuc a="0" z="+1" sym="e" />
                        <span>+</span>
                        <span>&nu;<sub>e</sub></span>
                    </React.Fragment>
                ),
                gamma: (
                    <React.Fragment>
                        <Nuc a="99" z="43" sym="Tc*" />
                        <span>&rarr;</span>
                        <Nuc a="99" z="43" sym="Tc" />
                        <span>+</span>
                        <span>&gamma;</span>
                    </React.Fragment>
                ),
            };
            return (
                <div className="equation-box">
                    {equations[decayType]}
                </div>
            );
        }

        // ─── Explanation text for each decay ──────────────────────────────────
        function DecayExplanation({ decayType }) {
            const texts = {
                alpha: 'En alfapartikel (2 protoner och 2 neutroner) lämnar kärnan. Masstalet minskar med 4 och atomnumret minskar med 2. Radium-226 omvandlas till Radon-222.',
                betaMinus: 'En neutron i kärnan omvandlas till en proton. En elektron (e⁻), betapartikeln, och en antineutrino (ν̄ₑ) sänds ut. Atomnumret ökar med 1, masstalet är oförändrat. Kol-14 omvandlas till Kväve-14.',
                betaPlus: 'En proton i kärnan omvandlas till en neutron. En positron (e⁺), betapartikeln, och en neutrino (νₑ) sänds ut. Atomnumret minskar med 1, masstalet är oförändrat. Fluor-18 omvandlas till Syre-18. Samma omvandling kan också ske genom elektroninfångning: kärnan fångar in en av atomens egna elektroner i stället för att sända ut en positron.',
                gamma: 'Kärnan befinner sig i ett exciterat tillstånd (hög energi). Den avger energi som en gammafoton (elektromagnetisk strålning) och övergår till grundtillståndet. Varken masstal eller atomnummer förändras. Teknetium-99 i exciterat tillstånd övergår till grundtillståndet.',
            };
            return <p className="explanation-box">{texts[decayType]}</p>;
        }

        // ─── Legend ────────────────────────────────────────────────────────────
        function Legend({ decayType }) {
            const items = [
                { color: '#ef4444', label: 'Proton' },
                { color: COL_NEUTRON, label: 'Neutron' },
            ];
            if (decayType === 'alpha') {
                items.push({ color: COL_ALPHA, label: 'Alfapartikel (⁴He)' });
            }
            if (decayType === 'betaMinus') {
                items.push({ color: COL_ELECTRON, label: 'Elektron (e⁻)' });
                items.push({ color: '#5a6170', label: 'Antineutrino (ν̄ₑ)' });
            }
            if (decayType === 'betaPlus') {
                items.push({ color: '#ec4899', label: 'Positron (e⁺)' });
                items.push({ color: '#5a6170', label: 'Neutrino (νₑ)' });
            }
            if (decayType === 'gamma') {
                items.push({ color: COL_AMBER_TEXT, label: 'Gammafoton (γ)' });
            }
            return (
                <div className="flex flex-wrap gap-4 justify-center">
                    {items.map(item => (
                        <div key={item.label} className="flex items-center gap-2">
                            <span
                                className="legend-dot"
                                style={{ background: item.color, boxShadow: `0 0 6px ${item.color}88` }}
                            />
                            <span className="text-sm" style={{ fontFamily: 'Poppins, sans-serif' }}>
                                {item.label}
                            </span>
                        </div>
                    ))}
                </div>
            );
        }

        // ─── Nucleus info display ─────────────────────────────────────────────
        function NucleusInfo({ decayType }) {
            const info = {
                alpha: {
                    before: { name: 'Radium-226', symbol: '²²⁶₈₈Ra', protons: 88, neutrons: 138 },
                    after:  { name: 'Radon-222',  symbol: '²²²₈₆Rn', protons: 86, neutrons: 136 },
                },
                betaMinus: {
                    before: { name: 'Kol-14',    symbol: '¹⁴₆C', protons: 6, neutrons: 8 },
                    after:  { name: 'Kväve-14',  symbol: '¹⁴₇N', protons: 7, neutrons: 7 },
                },
                betaPlus: {
                    before: { name: 'Fluor-18',  symbol: '¹⁸₉F',  protons: 9,  neutrons: 9  },
                    after:  { name: 'Syre-18',   symbol: '¹⁸₈O',  protons: 8,  neutrons: 10 },
                },
                gamma: {
                    before: { name: 'Teknetium-99', symbol: '⁹⁹₄₃Tc*', protons: 43, neutrons: 56 },
                    after:  { name: 'Teknetium-99',  symbol: '⁹⁹₄₃Tc',  protons: 43, neutrons: 56 },
                },
            };
            const d = info[decayType];
            // Protontalet i en mörkare röd än nukleonerna (liten text på papper),
            // neutrontalet i mjukt bläck
            const pnRow = (n) => (
                <div className="nc-pn">
                    <span style={{ color: '#c0392b' }}>{n.protons} p</span>
                    {' '}&middot;{' '}
                    <span>{n.neutrons} n</span>
                </div>
            );
            return (
                <div className="flex flex-wrap gap-4 justify-center items-center text-sm" style={{ fontFamily: 'Poppins, sans-serif' }}>
                    <div className="glass-card-light rounded-lg nucleus-card">
                        <div className="nc-lbl">Moderkärna</div>
                        <div className="nc-name">{d.before.name}</div>
                        {pnRow(d.before)}
                    </div>
                    <div className="text-xl" style={{ color: 'var(--lab-ink-muted, #69655c)' }}>&rarr;</div>
                    <div className="glass-card-light rounded-lg nucleus-card">
                        <div className="nc-lbl">Dotterkärna</div>
                        <div className="nc-name">{d.after.name}</div>
                        {pnRow(d.after)}
                    </div>
                </div>
            );
        }

        // ─── Tab definitions ──────────────────────────────────────────────────
        const TABS = [
            { key: 'alpha',     label: 'Alfasönderfall' },
            { key: 'betaMinus', label: 'Beta\u207B-sönderfall' },
            { key: 'betaPlus',  label: 'Beta\u207A-sönderfall' },
            { key: 'gamma',     label: 'Gammasönderfall' },
        ];

        // ─── Main App ─────────────────────────────────────────────────────────
        function App() {
            const [activeTab, setActiveTab] = useState('alpha');
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [togglesOpen, setTogglesOpen] = useState(true);
            const sceneWrapRef = useRef(null);

            function handleTabChange(key) {
                if (key !== activeTab) setActiveTab(key);
            }

            useEffect(() => {
                const handler = () => {
                    setIsFullscreen(
                        document.fullscreenElement === sceneWrapRef.current ||
                        document.webkitFullscreenElement === sceneWrapRef.current
                    );
                };
                document.addEventListener('fullscreenchange', handler);
                document.addEventListener('webkitfullscreenchange', handler);
                return () => {
                    document.removeEventListener('fullscreenchange', handler);
                    document.removeEventListener('webkitfullscreenchange', handler);
                };
            }, []);

            const toggleFullscreen = () => {
                const el = sceneWrapRef.current;
                if (!el) return;
                const isFs = document.fullscreenElement || document.webkitFullscreenElement;
                if (isFs) {
                    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                } else {
                    (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
                }
            };

            return (
                <div className="min-h-screen" style={{ background: 'transparent' }}>
                    <div className="max-w-4xl mx-auto px-4 py-8">

                        {/* Breadcrumb */}
                        <div className="breadcrumb mb-4">
                            <a href="index.html">Hem</a>
                            <span className="mx-2">/</span>
                            <a href="fysik1.html">Fysik nivå 1</a>
                            <span className="mx-2">/</span>
                            <span>Radioaktivt sönderfall</span>
                        </div>

                        {/* Heading */}
                        <div className="mb-6">
                            <h1 className="text-3xl md:text-4xl font-bold glow-text mb-2">
                                Radioaktivt sönderfall
                            </h1>
                            <p className="text-sm md:text-base max-w-2xl leading-relaxed" style={{ color: 'var(--lab-ink-soft, #3f4a5c)' }}>
                                Utforska de fyra typerna av radioaktivt sönderfall. Varje atomkärna är uppbyggd
                                av protoner (röda) och neutroner (grå). Välj sönderfall, starta det och se vilka
                                partiklar som lämnar kärnan.
                            </p>
                        </div>

                        {/* Tabs */}
                        <div className="flex flex-wrap gap-2 mb-6">
                            {TABS.map(tab => (
                                <button
                                    key={tab.key}
                                    className={`tab-btn ${activeTab === tab.key ? 'active' : ''}`}
                                    onClick={() => handleTabChange(tab.key)}
                                >
                                    {tab.label}
                                </button>
                            ))}
                        </div>

                        {/* Main card */}
                        <div className="glass-card rounded-2xl p-5 mb-6">
                            {/* Scen-wrapper ligger i App (utanför DecayCanvas) så att
                                fullskärmsläget överlever remount vid byte av sönderfallstyp */}
                            <div className="scene-wrap" data-theme="ljusPapper" ref={sceneWrapRef}
                                 style={{ userSelect: 'none', boxShadow: 'none' }}>
                                <DecayCanvas key={activeTab} decayType={activeTab} />
                                <button className="fs-btn" onClick={toggleFullscreen} aria-label="Fullskärm"
                                        title={isFullscreen ? 'Lämna fullskärm' : 'Fullskärm'}>
                                    {isFullscreen ? (
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                            <path d="M9 3v6H3"/><path d="M15 21v-6h6"/><path d="M21 9h-6V3"/><path d="M3 15h6v6"/>
                                        </svg>
                                    ) : (
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                            <path d="M3 9V3h6"/><path d="M21 9V3h-6"/><path d="M3 15v6h6"/><path d="M21 15v6h-6"/>
                                        </svg>
                                    )}
                                </button>
                                {/* Inställningsrutan uppe till höger visas bara i fullskärm:
                                    i normalläget bor valet av sönderfall i flikraden ovanför
                                    scenen (aldrig dubblerat). Hopfällbar med krysset/runda knappen. */}
                                {isFullscreen && !togglesOpen && (
                                    <button className="st-show-btn" onClick={() => setTogglesOpen(true)}
                                            aria-label="Visa inställningar" title="Visa inställningar" aria-expanded="false">
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                             strokeWidth="2" strokeLinecap="round" aria-hidden="true">
                                            <line x1="4" y1="8" x2="20" y2="8" />
                                            <circle cx="14.5" cy="8" r="2.7" fill="currentColor" stroke="none" />
                                            <line x1="4" y1="16" x2="20" y2="16" />
                                            <circle cx="9.5" cy="16" r="2.7" fill="currentColor" stroke="none" />
                                        </svg>
                                    </button>
                                )}
                                {isFullscreen && togglesOpen && (
                                    <div className="scene-toggles">
                                        <button className="st-hide" onClick={() => setTogglesOpen(false)}
                                                aria-label="Dölj inställningar" title="Dölj inställningar" aria-expanded="true">
                                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                 strokeWidth="2.4" strokeLinecap="round" aria-hidden="true">
                                                <path d="M6 6l12 12M18 6L6 18" />
                                            </svg>
                                        </button>
                                        <div className="st-title">Sönderfallstyp</div>
                                        {TABS.map(tab => (
                                            <label key={tab.key}>
                                                <input type="radio" name="fsDecayType"
                                                       checked={activeTab === tab.key}
                                                       onChange={() => handleTabChange(tab.key)} />
                                                <span>{tab.label}</span>
                                            </label>
                                        ))}
                                    </div>
                                )}
                            </div>

                            {/* Legend is now drawn on the canvas */}
                        </div>

                        {/* Nucleus info */}
                        <div className="mb-5">
                            <NucleusInfo decayType={activeTab} />
                        </div>

                        {/* Equation */}
                        <div className="mb-4">
                            <div className="section-kicker text-center">Kärnreaktionsformel</div>
                            <DecayEquation decayType={activeTab} />
                        </div>

                        {/* Explanation */}
                        <div className="mb-8">
                            <div className="section-kicker">Förklaring</div>
                            <DecayExplanation decayType={activeTab} />
                        </div>

                        {/* Info cards */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                            <div className="glass-card-light rounded-xl p-4 info-card">
                                <h3 className="text-sm font-semibold mb-2" style={{ fontFamily: 'Poppins, sans-serif' }}>
                                    Om visualiseringen
                                </h3>
                                <p className="text-sm leading-relaxed" style={{ fontFamily: 'Poppins, sans-serif' }}>
                                    Kärnorna ritas med hexagonal packning för att efterlikna hur nukleoner sitter
                                    tätt packade i verkligheten. Storlekarna är inte i skala: en riktig atomkärna
                                    är bara ungefär en hundratusendel av atomens storlek.
                                </p>
                            </div>
                            <div className="glass-card-light rounded-xl p-4 info-card">
                                <h3 className="text-sm font-semibold mb-2" style={{ fontFamily: 'Poppins, sans-serif' }}>
                                    Bevarandelagarna
                                </h3>
                                <p className="text-sm leading-relaxed" style={{ fontFamily: 'Poppins, sans-serif' }}>
                                    Vid alla typer av sönderfall bevaras det totala masstalet (antalet nukleoner) och
                                    den totala laddningen. Energi och rörelsemängd bevaras också. Det är kärnfysikens
                                    grundlagar.
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script src="feedback.js" defer></script>
    <script src="sim-dock.js" defer></script>
    <script src="data/katalog.js"></script>
    <script src="section-nav.js"></script>
    <!-- Cloudflare Web Analytics: cookiefri besöksmätning, se CLAUDE.md. -->
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js"
            data-cf-beacon='{"token": "366677ecfe014a76b73f5bc78a489e0e"}'></script>
</body>
</html>
