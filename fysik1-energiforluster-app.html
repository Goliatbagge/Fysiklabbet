                                        <button className={lage === 'slapp' ? 'active' : ''} disabled={lastReglage} onClick={() => setLage('slapp')}>Släpp klossen</button>
                                        <button className={lage === 'dra' ? 'active' : ''} disabled={lastReglage} onClick={() => setLage('dra')}>Dra uppför</button>
                                    </div>
                                    {lage === 'slapp' && (
                                        <React.Fragment>
                                            <div className="text-xs mb-1" style={{ color: 'var(--lab-ink-soft)' }}>Remsa på planen</div>
                                            <div className="remsor mb-3">
                                                {REMSOR.map((r) => (
                                                    <button key={r.k} className={remsa === r.k ? 'active' : ''} disabled={lastReglage} onClick={() => setRemsa(r.k)}>
                                                        {r.namn}<span className="sub">μ = {fmt(r.mu, 2)}</span></button>
                                                ))}
                                            </div>
                                        </React.Fragment>
                                    )}
                                    <div className="text-xs mb-1" style={{ color: 'var(--lab-ink-soft)' }}>Rampernas yta</div>
                                    <div className="mode-seg">
                                        {RAMPER.map((r) => (
                                            <button key={r.k} className={ramp === r.k ? 'active' : ''} disabled={lastReglage} onClick={() => setRamp(r.k)}>
                                                {r.namn}<span className="sub">μ = {fmt(r.mu, 2)}</span></button>
                                        ))}
                                    </div>
                                </div>

                                <div className="glass-card rounded-xl p-3 mb-3">
                                    {!isFullscreen && reglage(Slider, false)}
                                    {isFullscreen && <p className="text-xs mb-2" style={{ color: 'var(--lab-ink-soft)' }}>Reglagen finns i rutan uppe till höger i fullskärm.</p>}
                                    <div className="flex gap-2 mt-2">
                                        <button className="btn-start flex-1" onClick={startKlick} disabled={!!gissa}>{startEtikett}</button>
                                        <button className="btn-toggle flex-1" onClick={borjaOm} disabled={!!gissa}>Börja om</button>
                                    </div>
                                </div>

                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <div className="flbl mb-2" style={{ textAlign: 'left' }}>Färdiga försök</div>
                                    <div className="forsok-lista">
                                        {FORSOK.map((f) => (
                                            <button key={f.id} className="forsok" disabled={!!gissa} onClick={() => korForsok(f)}>
                                                {f.namn}<span className="sub">{f.sub}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <div className="flbl mb-2" style={{ textAlign: 'left' }}>Avläsning</div>
                                    <div className="avl">
                                        <div><div className="v">{fmt(M.hojd(cfg, st.u), 2)} m</div><div className="l">höjd <em>h</em></div></div>
                                        <div><div className="v">{fmt(Math.abs(st.vel), 2)} m/s</div><div className="l">fart</div></div>
                                        <div><div className="v">{fmt(st.sTot, 2)} m</div><div className="l">sträcka <em>s</em></div></div>
                                        <div><div className="v" style={{ color: COL.Ep }}>{fmt(en.Ep, 2)} J</div><div className="l"><em>E</em><sub>p</sub></div></div>
                                        <div><div className="v" style={{ color: COL.Ek }}>{fmt(en.Ek, 2)} J</div><div className="l"><em>E</em><sub>k</sub></div></div>
                                        <div><div className="v" style={{ color: COL.Q }}>{fmt(en.Ev, 2)} J</div><div className="l"><em>E</em><sub>v</sub></div></div>
                                        <div><div className="v" style={{ color: COL.frik }}>{fmt(kNu.Ff, 2)} N</div><div className="l">friktion <em>F</em><sub>f</sub></div></div>
                                        <div><div className="v">{fmt(kNu.FN, 2)} N</div><div className="l">normalkraft <em>F</em><sub>N</sub></div></div>
                                        <div><div className="v" style={{ color: COL.brickK }}>{lage === 'dra' ? `${fmt(en.W, 2)} J` : '–'}</div><div className="l">arbete <em>W</em></div></div>
                                    </div>
                                </div>

                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <div className="flex items-center justify-between mb-2">
                                        <div className="flbl" style={{ textAlign: 'left' }}>Gissa-läge: var stannar klossen?</div>
                                        {poang.totalt > 0 && <div className="text-xs" style={{ color: 'var(--lab-ink-soft)' }}>{poang.traffar} av {poang.totalt} nära{poang.svit > 1 ? `, ${poang.svit} i rad` : ''}</div>}
                                    </div>
                                    {!gissa && (
                                        <div className="flex flex-col gap-2">
                                            <button className="btn-toggle" onClick={() => startaGissa(1)}>Nivå 1: friktion bara på planen</button>
                                            <button className="btn-toggle" onClick={() => startaGissa(2)}>Nivå 2: friktion även i backen</button>
                                        </div>
                                    )}
                                    {gissa && (
                                        <div>
                                            <p className="text-sm mb-2" style={{ color: 'var(--lab-ink)' }}>
                                                Klossen ({fmt(gissa.m, 1)} kg) släpps från höjden <em>h</em> = {fmt(gissa.h, 2)} m.
                                                {gissa.niva === 1
                                                    ? <span> Rampen är utan friktion och lutar {gissa.a}°.</span>
                                                    : <span> Rampen är av trä (<em>μ</em> = 0,25) och lutar {gissa.a}°.</span>}
                                                {' '}Remsan på planen är {REMSOR.find((r) => r.k === gissa.remsa).namn.toLowerCase()} med <em>μ</em> = {fmt(remsaMu, 2)}.
                                                Dra flaggan till stället där du tror att klossen stannar.
                                            </p>
                                            {gStatus === null && <button className="btn-start w-full mb-2" onClick={slappGissning}>Släpp klossen</button>}
                                            {gStatus === 'kor' && <p className="text-sm mb-2" style={{ color: 'var(--lab-ink-soft)' }}>Klossen glider …</p>}
                                            {gStatus && gStatus !== 'kor' && <p className="text-sm mb-2" style={{ color: gStatus.bra ? '#15803d' : 'var(--lab-accent)' }}><Fx text={gStatus.text} /></p>}
                                            <div className="flex gap-2">
                                                {gStatus && gStatus !== 'kor' && <button className="btn-toggle flex-1" onClick={() => startaGissa(gissa.niva)}>Ny uppgift</button>}
                                                <button className="btn-toggle flex-1" onClick={avslutaGissa} disabled={gStatus === 'kor'}>Avsluta</button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </main>

                        <div className="grid md:grid-cols-3 gap-4 mt-6">
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Energin försvinner inte</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Den mekaniska energin, lägesenergi plus rörelseenergi, minskar när klossen glider på ett strävt underlag.
                                    Men lika mycket blir värme i klossen och underlaget, där de gnids mot varandra. Den streckade linjen i diagrammet, den totala energin,
                                    ligger kvar på samma nivå hela tiden. Det är därför man säger att mekanisk energi går förlorad, inte energi.
                                </p>
                            </div>
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Värmen beror på sträckan</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Friktionsvärmen är <em>E</em><sub>v</sub> = <em>F</em><sub>f</sub> · <em>s</em>, där <em>s</em> är sträckan längs
                                    underlaget, inte höjdskillnaden. Friktionskraften är <em>F</em><sub>f</sub> = <em>μ</em> · <em>F</em><sub>N</sub>,
                                    och i en backe är normalkraften bara <em>m</em> · <em>g</em> · cos <em>α</em>. I värmekameran glöder spåret därför
                                    svagare i backen än på planen, om underlaget är detsamma.
                                </p>
                            </div>
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Mer arbete med friktion</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Drar man klossen uppför går arbetet till två saker: lägesenergi och värme,
                                    <em> W</em> = Δ<em>E</em><sub>p</sub> + <em>E</em><sub>v</sub>. För samma höjd krävs därför mer arbete när
                                    det finns friktion. Jämför de två försöken Dra uppför: arbetsrutan blir större med trä i backen.
                                </p>
                            </div>
                        </div>

                        <details className="glass-card rounded-xl p-4 mt-4">
                            <summary className="accordion-head" style={{ color: 'var(--lab-ink)' }}>
                                <span>Vanliga missuppfattningar</span><span style={{ color: 'var(--lab-ink-muted)' }}>▾</span>
                            </summary>
                            <ul className="mt-3 space-y-2 text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                <li><strong>”Friktionen förstör energi.”</strong> Nej. Energin byter form till värme, och summan är densamma. Det är
                                    bara den mekaniska energin som minskar.</li>
                                <li><strong>”En tyngre kloss glider längre.”</strong> Inte om friktionstalet är detsamma. Både lägesenergin och
                                    friktionskraften är proportionella mot massan, så massan förkortas bort. Prova den lätta och den tunga klossen.</li>
                                <li><strong>”Friktionsvärmen beror på höjden klossen faller.”</strong> Nej, den beror på sträckan längs underlaget.
                                    En flack ramp ger längre väg och mer värme i backen för samma höjd.</li>
                                <li><strong>”Friktionen är lika stor i backen som på planen.”</strong> Inte med samma underlag. I backen trycker klossen mindre mot
                                    underlaget, så normalkraften och därmed friktionen är mindre där.</li>
                                <li><strong>”Utan friktion skulle klossen till slut stanna ändå.”</strong> Inte i den här modellen. Utan friktion och
                                    luftmotstånd når klossen samma höjd varje gång, eftersom ingen mekanisk energi blir värme.</li>
                            </ul>
                        </details>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script src="feedback.js" defer></script>
    <script src="sim-dock.js" defer></script>
    <script src="data/katalog.js"></script>
    <script src="section-nav.js"></script>
    <!-- Cloudflare Web Analytics: cookiefri besöksmätning, se CLAUDE.md. -->
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js"

</body>
