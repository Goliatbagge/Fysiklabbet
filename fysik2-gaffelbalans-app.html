    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const fmt = (num, decimals = 2) => {
            if (!isFinite(num)) return '∞';
            const s = num.toFixed(decimals);
            if (parseFloat(s) === 0) return '0';
            return s.replace('.', ',');
        };

        // Färger (mättade — ingen vit halo mot ljus scen)
        const COL = {
            gravity: '#c8324a',   // tyngdkraft F_G — accent-röd
            cm:      '#2e9e4f',   // tyngdpunkt — grön (sajtens konvention)
            pivot:   '#0f1620',   // stödpunkt — bläck
            lever:   '#7c3aed'    // hävarm l — lila
        };

        // ── Fysikmodell (SI-enheter) ─────────────────────────────
        // Stödpunkten (nålspetsen på myntkanten) är origo. Positiv y uppåt.
        const PHYS = {
            g: 9.82,
            mNeedle: 0.0005, yNeedle: 0.0175,   // synlig nål 3,5 cm, tp på mitten
            mCork: 0.003,    yCork: 0.050,      // korkens mitt 5,0 cm över spetsen
            mFork: 0.045,                        // per gaffel
            forkAttachY: 0.045,                  // gaffelns fäste i korken
            forkAttachX: 0.011,                  // korkens radie
            forkCmDist: 0.080                    // gaffelns tp, avstånd från fästet
        };

        // Tyngdpunkt, tröghetsmoment och svängningsdata för given gaffelvinkel
        const computeDerived = (betaDeg, forksOn) => {
            const P = PHYS;
            const b = betaDeg * Math.PI / 180;
            const xF = P.forkAttachX + P.forkCmDist * Math.cos(b);
            const yF = P.forkAttachY - P.forkCmDist * Math.sin(b);
            const M = P.mNeedle + P.mCork + (forksOn ? 2 * P.mFork : 0);
            let num = P.mNeedle * P.yNeedle + P.mCork * P.yCork;
            if (forksOn) num += 2 * P.mFork * yF;
            const yCm = num / M;
            // Tröghetsmoment kring stödpunkten för vippningen. Vi modellerar
            // vippningen ISOTROPT med gaffelplanets tröghetsmoment — den
            // långsamma, synliga moden där gafflarna svänger upp och ned.
            // (Vippning tvärs gafflarna är en mycket snabbare mod; att blanda
            // två olika tröghetsmoment med ett pågående snurr kräver de
            // gyroskopiska termerna för att inte pumpa upp vipprörelsen.)
            const base = P.mNeedle * P.yNeedle * P.yNeedle + P.mCork * P.yCork * P.yCork;
            const I = base + (forksOn ? 2 * P.mFork * (xF * xF + yF * yF) : 0);
            const stable = yCm < 0;
            const omega0 = stable ? Math.sqrt(M * P.g * (-yCm) / I) : 0;
            const period = stable ? 2 * Math.PI / omega0 : 0;
            // Kritisk gaffelvinkel: y_cm = 0
            const constNum = P.mNeedle * P.yNeedle + P.mCork * P.yCork + 2 * P.mFork * P.forkAttachY;
            const sinCrit = constNum / (2 * P.mFork * P.forkCmDist);
            const betaCrit = sinCrit <= 1 ? Math.asin(sinCrit) * 180 / Math.PI : NaN;
            return { M, yCm, yForkCm: yF, xForkCm: xF, I, stable, period, betaCrit };
        };

        const SLIP_ANGLE = 0.35;   // rad — nålen glider av myntkanten
        const DROP_ANGLE = 0.55;   // rad — nålspetsen tappar myntkanten: fritt fall

        // ── Graf: tyngdpunktens höjd mot gaffelvinkeln ───────────
        const YcmGraph = ({ beta, forksOn }) => {
            const W = 320, H = 190, padL = 46, padB = 30, padT = 14, padR = 14;
            const bMin = 10, bMax = 70;
            const yMax = 8, yMin = -30;   // mm relativt stödpunkten
            const gx = (b) => padL + ((b - bMin) / (bMax - bMin)) * (W - padL - padR);
            const gy = (y) => padT + ((yMax - y) / (yMax - yMin)) * (H - padT - padB);
            const pts = [];
            for (let i = 0; i <= 60; i++) {
                const b = bMin + (bMax - bMin) * (i / 60);
                const d = computeDerived(b, true);
                pts.push([gx(b), gy(Math.max(yMin, Math.min(yMax, d.yCm * 1000)))]);
            }
            const path = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
            const cur = computeDerived(beta, true);
            const y0 = gy(0);
            return (
                <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: 'auto' }} role="img"
                     aria-label="Graf: tyngdpunktens höjd över stödpunkten som funktion av gaffelvinkeln. Över nollinjen välter systemet, under nollinjen är det stabilt.">
                    {/* zoner */}
                    <rect x={padL} y={padT} width={W - padL - padR} height={y0 - padT} fill="rgba(200,50,74,0.08)" />
                    <rect x={padL} y={y0} width={W - padL - padR} height={H - padB - y0} fill="rgba(46,158,79,0.10)" />
                    {/* nollinje = stödpunktens höjd */}
                    <line x1={padL} y1={y0} x2={W - padR} y2={y0} stroke="rgba(15,22,32,0.45)" strokeWidth="1.2" strokeDasharray="4 3" />
                    <text x={W - padR - 3} y={y0 - 5} textAnchor="end" fontSize="9.5" fill="var(--lab-ink-muted)">stödpunktens höjd</text>
                    <text x={padL + 5} y={padT + 12} fontSize="9.5" fill="#c8324a" fontWeight="600">VÄLTER</text>
                    <text x={padL + 5} y={H - padB - 6} fontSize="9.5" fill="#2e9e4f" fontWeight="600">STABILT</text>
                    {/* axlar (pil endast åt positiva hållet) */}
                    <line x1={padL} y1={padT - 4} x2={padL} y2={H - padB} stroke="#38bdf8" strokeWidth="1" />
                    <polygon points={`${padL},${padT - 10} ${padL - 3.4},${padT - 3} ${padL + 3.4},${padT - 3}`} fill="#38bdf8" />
                    <line x1={padL} y1={H - padB} x2={W - padR + 2} y2={H - padB} stroke="#38bdf8" strokeWidth="1" />
                    <polygon points={`${W - padR + 8},${H - padB} ${W - padR + 1},${H - padB - 3.4} ${W - padR + 1},${H - padB + 3.4}`} fill="#38bdf8" />
                    {/* skalstreck */}
                    {[20, 40, 60].map(b => (
                        <g key={b}>
                            <line x1={gx(b)} y1={H - padB} x2={gx(b)} y2={H - padB + 4} stroke="#38bdf8" strokeWidth="1" />
                            <text x={gx(b)} y={H - padB + 15} textAnchor="middle" fontSize="9.5" fill="var(--lab-ink-muted)">{b}°</text>
                        </g>
                    ))}
                    {[0, -10, -20, -30].map(y => (
                        <g key={y}>
                            <line x1={padL - 4} y1={gy(y)} x2={padL} y2={gy(y)} stroke="#38bdf8" strokeWidth="1" />
                            <text x={padL - 7} y={gy(y) + 3.5} textAnchor="end" fontSize="9.5" fill="var(--lab-ink-muted)">{y === 0 ? '0' : String(y).replace('-', '−')}</text>
                        </g>
                    ))}
                    <text x={padL - 7} y={padT + 2} textAnchor="end" fontSize="10" fill="var(--lab-ink-muted)">mm</text>
                    <text x={W - padR} y={H - padB - 6} textAnchor="end" fontSize="10" fill="var(--lab-ink-muted)"><tspan fontStyle="italic">β</tspan></text>
                    {/* kurva */}
                    <path d={path} fill="none" stroke="var(--lab-accent)" strokeWidth="2" />
                    {/* aktuell punkt */}
                    {forksOn && <circle cx={gx(beta)} cy={gy(Math.max(yMin, Math.min(yMax, cur.yCm * 1000)))} r="4.5" fill="var(--lab-ink)" />}
                </svg>
            );
        };

        // ── Reglage ──────────────────────────────────────────────
        const Slider = ({ label, sub, value, min, max, step, unit, onChange, decimals = 0 }) => (
            <div className="p-3 rounded-xl glass-card mb-3">
                <div className="flex justify-between items-baseline mb-2">
                    <label className="text-sm font-bold" style={{ color: 'var(--lab-ink)' }}
                           dangerouslySetInnerHTML={{ __html: label }} />
                    <div className="font-mono font-semibold text-sm" style={{ color: 'var(--lab-accent)' }}>
                        {fmt(value, decimals)}<span style={{ color: 'var(--lab-ink-muted)' }}>{unit}</span>
                    </div>
                </div>
                <input type="range" min={min} max={max} step={step} value={value}
                       onChange={(e) => onChange(parseFloat(e.target.value))}
                       className="w-full cursor-pointer" />
                <div className="flex justify-between mt-1 text-xs font-mono" style={{ color: 'var(--lab-ink-muted)' }}>
                    <span>{fmt(min, 0)}{unit}</span>
                    <span>{fmt(max, 0)}{unit}</span>
                </div>
                {sub && <div className="text-xs mt-1" style={{ color: 'var(--lab-ink-muted)' }}
                             dangerouslySetInnerHTML={{ __html: sub }} />}
            </div>
        );

        const FsSlider = ({ label, value, min, max, step, unit, onChange, decimals = 0 }) => (
            <div className="fs-row">
                <span className="fs-label" style={{ minWidth: 128 }} dangerouslySetInnerHTML={{ __html: label }} />
                <input type="range" min={min} max={max} step={step} value={value}
                       onChange={(e) => onChange(parseFloat(e.target.value))} />
                <span className="fs-value" style={{ minWidth: 56, textAlign: 'right' }}>
                    {fmt(value, decimals)}{unit}
                </span>
            </div>
        );

        // ── 3D-scenen ────────────────────────────────────────────
        // Scen-enhet: 1 = 1 cm. Bordet ligger i y = 0.
        const BalansScene = ({ stateRef, physRef, actionsRef }) => {
            const mountRef = useRef(null);

            useEffect(() => {
                const mount = mountRef.current;
                const width = mount.clientWidth;
                const height = mount.clientHeight;

                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0xeef0ee);

                const COIN_R = 1.25, COIN_T = 0.18;
                // Flaska med kork; myntet står PÅ HÖGKANT i en skåra i korken.
                // Stödpunkten är nålspetsen mot myntets övre, smala kant.
                const BOTTLE = { bodyR: 3.1, bodyH: 10, shoulderH: 3, neckR: 1.3, neckH: 3.5 };
                const neckTop = BOTTLE.bodyH + BOTTLE.shoulderH + BOTTLE.neckH;   // 16,5
                const corkTop = neckTop + 2.2;                                     // korken sticker upp
                const coinCy = corkTop + 0.55;                                     // nedre delen i skåran
                const PIVOT = new THREE.Vector3(0, coinCy + COIN_R, 0);

                const camera = new THREE.PerspectiveCamera(42, width / height, 0.5, 400);
                camera.position.set(33, 28, 25);

                const renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setPixelRatio(window.devicePixelRatio);
                renderer.setSize(width, height);
                mount.appendChild(renderer.domElement);

                const controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.08;
                controls.target.set(0, 13.5, 0);
                controls.minDistance = 6;
                controls.maxDistance = 70;
                controls.maxPolarAngle = Math.PI * 0.55;

                scene.add(new THREE.AmbientLight(0xffffff, 0.72));
                const dir = new THREE.DirectionalLight(0xffffff, 0.6);
                dir.position.set(12, 24, 14);
                scene.add(dir);
                const fill = new THREE.DirectionalLight(0xffffff, 0.25);
                fill.position.set(-14, 10, -10);
                scene.add(fill);
                // frontljus mot myntets högkantsvända yta
                const front = new THREE.DirectionalLight(0xffffff, 0.3);

                // ── Bordet (träskiva med ådring via canvas-textur) ──

                const woodTex = new THREE.CanvasTexture(woodCv);

                const table = new THREE.Mesh(

                // ── Glasflaskan (svagt grön, transparent) ──
                const glassMat = new THREE.MeshStandardMaterial({
                    color: 0xd2e4d6, transparent: true, opacity: 0.26,

                });
                const body = new THREE.Mesh(
                    new THREE.CylinderGeometry(BOTTLE.bodyR * 0.97, BOTTLE.bodyR, BOTTLE.bodyH, 44, 1, true), glassMat);
                body.position.y = BOTTLE.bodyH / 2;
                scene.add(body);
                const shoulder = new THREE.Mesh(
                    new THREE.CylinderGeometry(BOTTLE.neckR, BOTTLE.bodyR * 0.97, BOTTLE.shoulderH, 44, 1, true), glassMat);
                shoulder.position.y = BOTTLE.bodyH + BOTTLE.shoulderH / 2;
                scene.add(shoulder);
                const neck = new THREE.Mesh(
                    new THREE.CylinderGeometry(BOTTLE.neckR, BOTTLE.neckR, BOTTLE.neckH, 32, 1, true), glassMat);
                neck.position.y = BOTTLE.bodyH + BOTTLE.shoulderH + BOTTLE.neckH / 2;
                scene.add(neck);
                const bottleBottom = new THREE.Mesh(
                    new THREE.CylinderGeometry(BOTTLE.bodyR, BOTTLE.bodyR, 0.3, 44),

                bottleBottom.position.y = 0.15;

                const lip = new THREE.Mesh(
                    new THREE.TorusGeometry(BOTTLE.neckR, 0.14, 10, 40),

                lip.rotation.x = Math.PI / 2;

                scene.add(lip);

                // ── Korken i flaskhalsen ──
                const baseCorkCv = document.createElement('canvas');
                baseCorkCv.width = 128; baseCorkCv.height = 128;
                const bctx = baseCorkCv.getContext('2d');
                bctx.fillStyle = '#dbc298'; bctx.fillRect(0, 0, 128, 128);
                for (let i = 0; i < 120; i++) {
                    bctx.fillStyle = 'rgba(138,106,58,' + (0.12 + Math.random() * 0.28) + ')';
                    bctx.fillRect(Math.random() * 128, Math.random() * 128, 1 + Math.random() * 3.5, 0.8 + Math.random() * 2.4);
                }
                const baseCork = new THREE.Mesh(
                    new THREE.CylinderGeometry(1.45, 1.32, 4.4, 28),
                    new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(baseCorkCv), roughness: 0.92 }));
                baseCork.position.y = corkTop - 2.2;
                scene.add(baseCork);
                const baseCorkTop = new THREE.Mesh(new THREE.CylinderGeometry(1.43, 1.43, 0.06, 28),
                    new THREE.MeshStandardMaterial({ color: 0xcbb084, roughness: 0.95 }));
                baseCorkTop.position.y = corkTop + 0.01;
                scene.add(baseCorkTop);
                // skåran som myntet står i
                const slit = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.1, 2.0),
                    new THREE.MeshStandardMaterial({ color: 0x6b5230, roughness: 1 }));
                slit.position.set(0, corkTop + 0.03, 0);
                scene.add(slit);

                // ── Myntet PÅ HÖGKANT (axeln vågrät, kanten uppåt) ──
                const coinGroup = new THREE.Group();
                const goldMat = new THREE.MeshStandardMaterial({ color: 0xe6bc55, metalness: 0.35, roughness: 0.38 });
                const goldDark = new THREE.MeshStandardMaterial({ color: 0xcda344, metalness: 0.35, roughness: 0.45 });
                const coin = new THREE.Mesh(new THREE.CylinderGeometry(COIN_R, COIN_R, COIN_T, 48), goldMat);
                coinGroup.add(coin);
                const relief = new THREE.Mesh(new THREE.CylinderGeometry(COIN_R * 0.72, COIN_R * 0.72, COIN_T * 1.3, 40), goldDark);
                coinGroup.add(relief);
                const coinEdge = new THREE.Mesh(new THREE.TorusGeometry(COIN_R - 0.03, 0.04, 8, 48), goldDark);
                coinEdge.rotation.x = Math.PI / 2;
                coinEdge.position.y = COIN_T / 2;
                coinGroup.add(coinEdge);
                // res myntet på högkant: cylinderaxeln läggs vågrät (längs x),
                // så den smala kanten vetter uppåt och kantlinjen löper längs z
                coinGroup.rotation.z = Math.PI / 2;
                coinGroup.position.set(0, coinCy, 0);
                scene.add(coinGroup);

                // ── Balanssystemet (grupp med origo i stödpunkten) ──
                const assembly = new THREE.Group();
                assembly.position.copy(PIVOT);
                scene.add(assembly);

                const steelMat = new THREE.MeshStandardMaterial({ color: 0xd4d9de, metalness: 0.55, roughness: 0.32 });
                const steelDark = new THREE.MeshStandardMaterial({ color: 0xb9bfc7, metalness: 0.5, roughness: 0.4 });

                // Nålen — spetsen i origo, sticker 1 cm in i korken
                const needle = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 4.3, 10), steelDark);
                needle.position.y = 0.2 + 4.3 / 2;
                assembly.add(needle);
                const needleTip = new THREE.Mesh(new THREE.ConeGeometry(0.055, 0.22, 10), steelDark);
                needleTip.rotation.x = Math.PI;
                needleTip.position.y = 0.11;
                assembly.add(needleTip);

                // Korken — spräcklig via canvas-textur
                const corkCv = document.createElement('canvas');
                corkCv.width = 128; corkCv.height = 128;
                const cctx = corkCv.getContext('2d');
                cctx.fillStyle = '#d2a86a'; cctx.fillRect(0, 0, 128, 128);
                for (let i = 0; i < 140; i++) {
                    cctx.fillStyle = 'rgba(138,106,58,' + (0.12 + Math.random() * 0.25) + ')';
                    const w = 1 + Math.random() * 3.5, h = 0.8 + Math.random() * 2;
                    cctx.fillRect(Math.random() * 128, Math.random() * 128, w, h);
                }
                const corkTex = new THREE.CanvasTexture(corkCv);
                const cork = new THREE.Mesh(
                    new THREE.CylinderGeometry(1.1, 1.1, 3.0, 28),
                    new THREE.MeshStandardMaterial({ map: corkTex, roughness: 0.9 }));
                cork.position.y = 5.0;
                cork.userData.action = 'knuff';       // klick på korken = knuff
                assembly.add(cork);
                const corkLid = new THREE.Mesh(new THREE.CylinderGeometry(1.08, 1.08, 0.06, 28),
                    new THREE.MeshStandardMaterial({ color: 0xc09858, roughness: 0.95 }));
                corkLid.position.y = 6.52;
                corkLid.userData.action = 'knuff';
                assembly.add(corkLid);

                // ── Gaffel: byggs längs +x (klorna vid x≈0, skaftet utåt) ──
                // Måtten är en vanlig matgaffel i cm: klor ≈ 4,5, hela gaffeln
                // ≈ 18. Skaftet är i det närmaste RAKT — det kröker bara ett par
                // grader uppåt mot änden, precis som en riktig bestickgaffel.
                const buildFork = () => {
                    const fork = new THREE.Group();

                    // Fyra klor som pekar in mot korken (−x). De är BÖJDA, som
                    // på ett riktigt bestick: raka där de går ut ur bladet och
                    // sedan allt mer krökta mot spetsen. De innersta ~1,2 cm
                    // sitter instuckna i korken.
                    const tineSegs = [[1.4, 0.05], [1.4, 0.22], [1.3, 0.42]];
                    for (let i = 0; i < 4; i++) {
                        const z = -0.60 + i * 0.40;
                        let px = 2.8, py = 0, a = 0;
                        tineSegs.forEach(([len, ang], k) => {
                            a = ang;
                            // klon smalnar av mot spetsen
                            const seg = new THREE.Mesh(
                                new THREE.BoxGeometry(len + 0.12, 0.135 - k * 0.012, 0.215 - k * 0.015), steelMat);
                            seg.position.set(px - (len / 2) * Math.cos(a), py - (len / 2) * Math.sin(a), z);
                            seg.rotation.z = a;
                            fork.add(seg);
                            px -= len * Math.cos(a);
                            py -= len * Math.sin(a);
                        });
                        // avsmalnande klospets, i klons riktning
                        const point = new THREE.Mesh(new THREE.ConeGeometry(0.098, 0.5, 8), steelMat);
                        point.rotation.z = Math.PI / 2 + a;
                        point.position.set(px - 0.25 * Math.cos(a), py - 0.25 * Math.sin(a), z);
                        fork.add(point);
                    }

                    // Gaffelbladets bas, där klorna löper ihop.
                    const head = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.16, 1.75), steelMat);
                    head.position.set(3.5, 0.02, 0);
                    fork.add(head);

                    // Halsen: smalast av allt, med en svag knäck.
                    const neck = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.19, 0.66), steelMat);
                    neck.position.set(5.2, 0.10, 0);
                    neck.rotation.z = 0.06;
                    fork.add(neck);

                    // Skaftet: sex segment utåt från halsen. Total krökning bara
                    // ~7° — alltså i det närmaste rakt — och greppet blir en
                    // aning bredare mot änden.
                    let px = 6.1, py = 0.16, ang = 0.05;
                    const segs = [[1.9, 0.80, 0.010], [1.9, 0.88, 0.014], [1.9, 0.96, 0.018],
                                  [1.9, 1.04, 0.020], [1.9, 1.08, 0.018], [1.8, 1.06, 0.014]];
                    segs.forEach(([len, wz, dAng]) => {
                        ang += dAng;
                        const seg = new THREE.Mesh(new THREE.BoxGeometry(len + 0.2, 0.27, wz), steelMat);
                        seg.position.set(px + (len / 2) * Math.cos(ang), py + (len / 2) * Math.sin(ang), 0);
                        seg.rotation.z = ang;
                        seg.userData.action = 'snurr';   // klick på skaftet = snurr
                        fork.add(seg);
                        px += len * Math.cos(ang);
                        py += len * Math.sin(ang);
                    });
                    // rundad skaftände
                    const tip = new THREE.Mesh(new THREE.CylinderGeometry(0.53, 0.53, 0.27, 18), steelMat);
                    tip.rotation.x = Math.PI / 2;
                    tip.position.set(px, py, 0);
                    tip.userData.action = 'snurr';
                    fork.add(tip);
                    return fork;
                };

                // Gafflarna hänger längs glaskantens riktning (±z), så att de
                // går fria från glaset — precis som i det verkliga tricket.
                const forkR = buildFork();
                const forkRWrap = new THREE.Group();
                forkRWrap.position.set(0, PHYS.forkAttachY * 100, PHYS.forkAttachX * 100);
                forkRWrap.rotation.y = -Math.PI / 2;
                forkRWrap.add(forkR);
                assembly.add(forkRWrap);
                const forkL = buildFork();
                const forkLWrap = new THREE.Group();
                forkLWrap.position.set(0, PHYS.forkAttachY * 100, -PHYS.forkAttachX * 100);
                forkLWrap.rotation.y = Math.PI / 2;
                forkLWrap.add(forkL);
                assembly.add(forkLWrap);

                // ── Overlays: tyngdpunkt, lodlinje, stödpunkt, F_G, hävarm ──
                // Overlay-objekten ritas alltid ovanpå (depthTest av) — tyngd-
                // punkten och kraftpilen ligger annars gömda inne i kork/mynt.
                const cmDot = new THREE.Mesh(new THREE.SphereGeometry(0.28, 20, 20),
                    new THREE.MeshBasicMaterial({ color: 0x2e9e4f, depthTest: false }));
                cmDot.renderOrder = 10;
                scene.add(cmDot);

                const plumbMat = new THREE.LineDashedMaterial({ color: 0x0f1620, dashSize: 0.35, gapSize: 0.25, transparent: true, opacity: 0.65, depthTest: false });
                const plumbLine = new THREE.Line(new THREE.BufferGeometry(), plumbMat);
                plumbLine.renderOrder = 9;
                scene.add(plumbLine);

                const pivotDot = new THREE.Mesh(new THREE.SphereGeometry(0.17, 16, 16),
                    new THREE.MeshBasicMaterial({ color: 0x0f1620, depthTest: false }));
                pivotDot.renderOrder = 10;
                pivotDot.position.copy(PIVOT);
                scene.add(pivotDot);

                const gravArrow = new THREE.ArrowHelper(new THREE.Vector3(0, -1, 0), new THREE.Vector3(), 1, 0xc8324a, 0.6, 0.35);
                gravArrow.line.material.depthTest = false;
                gravArrow.cone.material.depthTest = false;
                gravArrow.line.renderOrder = 11;
                gravArrow.cone.renderOrder = 11;
                scene.add(gravArrow);

                const leverMat = new THREE.LineBasicMaterial({ color: 0x7c3aed, linewidth: 2, depthTest: false });
                const leverLine = new THREE.Line(new THREE.BufferGeometry(), leverMat);
                leverLine.renderOrder = 11;
                scene.add(leverLine);

                // Textetiketter som sprites (kursiv variabel, rakt index)
                // Canvasen kapas till TEXTENS bredd (i stället för en fast
                // 460 px-duk med texten centrerad i mitten) och spriten
                // ankras i sin VÄNSTRA kant med `center`. Då betyder
                // positionen nedan alltid "här börjar texten", oavsett hur
                // långt ordet är, och etiketten kan läggas tätt intill sin
                // punkt utan att bredda ut sig över mekaniken.
                // VU_PER_PX sätter etiketternas storlek på skärmen: den
                // gamla faktorn 0,0075 gav ~6 px hög text, långt under de
                // ~20 px en scenetikett ska ha för att gå att läsa.
                const VU_PER_PX = 0.0205;
                const makeLabel = (segments, hex, scale = 1, vanster = true) => {
                    const cv = document.createElement('canvas');
                    const ctx0 = cv.getContext('2d');
                    const BASE = 46, SUBSZ = 30, SUBDY = 11, PAD = 10;
                    const fontFor = (seg) => (seg.i ? 'italic ' : '') + '600 ' +
                        (seg.sub ? SUBSZ : BASE) + 'px Poppins, sans-serif';
                    let total = 0;
                    segments.forEach(seg => { ctx0.font = fontFor(seg); total += ctx0.measureText(seg.t).width; });
                    cv.width = Math.ceil(total) + 2 * PAD; cv.height = 72;
                    const ctx = cv.getContext('2d');
                    let x = PAD;
                    const cy = cv.height / 2;
                    ctx.fillStyle = hex;
                    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                    segments.forEach(seg => {
                        ctx.font = fontFor(seg);
                        ctx.fillText(seg.t, x, cy + (seg.sub ? SUBDY : 0));
                        x += ctx.measureText(seg.t).width;
                    });
                    const tex = new THREE.CanvasTexture(cv);
                    tex.anisotropy = 4;
                    const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
                    spr.scale.set(cv.width * VU_PER_PX * scale, cv.height * VU_PER_PX * scale, 1);
                    if (vanster) spr.center.set(0, 0.5);
                    return spr;
                };
                const cmLabel = makeLabel([{ t: 'Tyngdpunkt' }], COL.cm);
                const pivotLabel = makeLabel([{ t: 'Stödpunkt' }], COL.pivot);
                pivotLabel.position.copy(PIVOT).add(new THREE.Vector3(1.4, 1.5, 0));
                const gravLabel = makeLabel([{ t: 'F', i: true }, { t: 'G', sub: true }], COL.gravity);
                const leverLabel = makeLabel([{ t: 'l', i: true }], COL.lever, 1, false);
                scene.add(cmLabel); scene.add(pivotLabel); scene.add(gravLabel); scene.add(leverLabel);

                // ── Animationsloop med fysikintegration ──
                let last = performance.now();
                let raf;
                const tmpV = new THREE.Vector3();
                const qTilt = new THREE.Quaternion();
                const qYaw = new THREE.Quaternion();
                const qSettleStart = new THREE.Quaternion();
                const qSettleEnd = new THREE.Quaternion();
                const settleM = new THREE.Matrix4();
                const vA = new THREE.Vector3(), vB = new THREE.Vector3(), vC = new THREE.Vector3();
                const tiltEuler = new THREE.Euler();
                const YAXIS = new THREE.Vector3(0, 1, 0);

                const animate = () => {
                    raf = requestAnimationFrame(animate);
                    const now = performance.now();
                    const dt = Math.min((now - last) / 1000, 0.033);
                    last = now;

                    const s = stateRef.current;
                    const ph = physRef.current;
                    const d = computeDerived(s.beta, s.forksOn);

                    // Gafflarnas vinkel (mjuk animation mot målet)
                    const targetBeta = s.beta * Math.PI / 180;
                    ph.betaShown += (targetBeta - ph.betaShown) * Math.min(1, dt * 10);
                    forkR.rotation.z = -ph.betaShown;
                    forkL.rotation.z = -ph.betaShown;
                    forkRWrap.visible = s.forksOn;
                    forkLWrap.visible = s.forksOn;

                    // Pendeldynamik kring stödpunkten, två vippriktningar.
                    // tbx/tbz: lutning kring världens x- respektive z-axel
                    if (!ph.frozen && ph.dropping && !ph.landed) {
                        // Fritt fall: nålspetsen har tappat myntkanten. Inget
                        // vridmoment verkar längre kring tyngdpunkten, så
                        // rotationsfarten är konstant medan tyngdaccelerationen
                        // (9,82 m/s² = 982 cm/s² i scenens cm-skala) drar bygget
                        // ned till bordsytan. Landningen mäts längre ned, mot
                        // byggets faktiskt lägsta punkt.
                        ph.vy -= 982 * dt;
                        ph.px += ph.vx * dt;
                        ph.py += ph.vy * dt;
                        ph.pz += ph.vz * dt;
                        ph.tbx += ph.wbx * dt;
                        ph.tbz += ph.wbz * dt;
                        ph.psi += ph.wPsi * dt;
                        ph.tilt = Math.sqrt(ph.tbx * ph.tbx + ph.tbz * ph.tbz);
                    } else if (!ph.frozen && ph.landed) {
                        // Vältfasen: första kontakten har tagit — oftast änden
                        // av ETT gaffelskaft, medan korken fortfarande är högt
                        // uppe. Ett stelt föremål stannar inte så: tyngdkraften
                        // vrider det vidare kring kontaktpunkten tills det
                        // ligger ned. Orienteringen förs mot viloposen (nålens
                        // axel OCH gaffelplanet vågräta — beräknad vid islaget
                        // nedan) medan kontaktklampningen håller den lägsta
                        // punkten kvar på bordsytan under hela vridningen.
                        ph.settleT += dt / ph.settleDur;
                        ph.px += ph.vx * dt;
                        ph.pz += ph.vz * dt;
                        ph.vx *= Math.max(0, 1 - 4 * dt);
                        ph.vz *= Math.max(0, 1 - 4 * dt);
                        if (ph.settleT >= 1) {
                            ph.settleT = 1;
                            ph.frozen = true;
                            ph.fellAt = now;
                        }
                    } else if (!ph.frozen) {
                        // Snurr kring den LODRÄTA axeln genom stödpunkten och
                        // tyngdpunkten. Den axeln är parallell med tyngdkraften,
                        // så snurret ger inget vridmoment som kan välta bygget —
                        // det bromsas bara av friktionen i nålspetsen (en trög
                        // del ∝ farten + en konstant del som får det att stanna).
                        if (ph.wPsi !== 0) {
                            const brake = (0.18 * Math.abs(ph.wPsi) + 0.32) * dt;
                            const mag = Math.abs(ph.wPsi) - brake;
                            ph.wPsi = mag <= 0 ? 0 : Math.sign(ph.wPsi) * mag;
                            ph.psi += ph.wPsi * dt;
                        }
                        // Vippningen mäts mot VÄRLDENS axlar och är isotrop, så
                        // den är helt frikopplad från snurret ψ — precis som
                        // fysiken säger: en rotation kring den lodräta axeln
                        // genom stöd- och tyngdpunkten ger inget vridmoment som
                        // kan ändra lutningen.
                        const k = d.M * PHYS.g * d.yCm / d.I;   // < 0 → återförande
                        const damp = 0.22;
                        const steps = 4;
                        const h = dt / steps;
                        for (let i = 0; i < steps; i++) {
                            ph.wbx += (k * Math.sin(ph.tbx) - damp * ph.wbx) * h;
                            ph.wbz += (k * Math.sin(ph.tbz) - damp * ph.wbz) * h;
                            ph.tbx += ph.wbx * h;
                            ph.tbz += ph.wbz * h;
                        }
                        const tilt = Math.sqrt(ph.tbx * ph.tbx + ph.tbz * ph.tbz);
                        if (!ph.falling && tilt > SLIP_ANGLE) ph.falling = true;
                        if (ph.falling) {
                            // förbi glidgränsen: tyngdkraften får vinna oavsett
                            ph.wbx += 7 * Math.sin(ph.tbx) * dt;
                            ph.wbz += 7 * Math.sin(ph.tbz) * dt;
                            if (tilt > DROP_ANGLE) {
                                // nålspetsen glider av myntkanten — fritt fall,
                                // med en liten sidledsfart åt hållet bygget lutar
                                ph.dropping = true;
                                const lx = -Math.sin(ph.tbz), lz = Math.sin(ph.tbx);
                                const ln = Math.hypot(lx, lz) || 1;
                                ph.vx = 26 * lx / ln;
                                ph.vz = 26 * lz / ln;
                                ph.vy = 0;
                            }
                        }
                        ph.tilt = tilt;
                    }
                    // Snurret ψ läggs FÖRST, kring byggets egen lodräta axel, så
                    // att lutningen fortsatt mäts mot världens axlar.
                    qTilt.setFromEuler(tiltEuler.set(ph.tbx, 0, ph.tbz, 'XYZ'));
                    qYaw.setFromAxisAngle(YAXIS, ph.psi);
                    assembly.quaternion.copy(qTilt).multiply(qYaw);
                    if (ph.landed) {
                        const kS = ph.settleT >= 1 ? 1
                            : ph.settleT * ph.settleT * (3 - 2 * ph.settleT);
                        assembly.quaternion.copy(qSettleStart).slerp(qSettleEnd, kS);
                    }
                    assembly.position.set(PIVOT.x + ph.px, PIVOT.y + ph.py, PIVOT.z + ph.pz);

                    // Markkontakt: byggets LÄGSTA punkt mäts mot bordsytan
                    // (y = 0). Kandidaterna är gaffelskaftens ändar, nålens
                    // båda ändar och korkens kanter — de transformeras med
                    // byggets aktuella rotation och läge. Första träffen
                    // startar VÄLTFASEN (se dynamiken ovan); under den hålls
                    // kontaktpunkten kvar exakt på bordsytan medan bygget
                    // vrider sig ned till liggande.
                    if (ph.dropping) {
                        const armL = 2 * PHYS.forkCmDist * 100;
                        const fez = PHYS.forkAttachX * 100 + armL * Math.cos(ph.betaShown);
                        const fey = PHYS.forkAttachY * 100 - armL * Math.sin(ph.betaShown);
                        const kandidater = [
                            [0, 0, 0], [0, 6.7, 0],
                            [1.1, 3.5, 0], [-1.1, 3.5, 0],
                            [1.1, 6.5, 0], [-1.1, 6.5, 0],
                            [0, 3.5, 1.1], [0, 3.5, -1.1]
                        ];
                        if (s.forksOn) kandidater.push([0, fey, fez], [0, fey, -fez]);
                        let lagsta = Infinity;
                        for (const q of kandidater) {
                            tmpV.set(q[0], q[1], q[2])
                                .applyQuaternion(assembly.quaternion)
                                .add(assembly.position);
                            if (tmpV.y < lagsta) lagsta = tmpV.y;
                        }
                        if (!ph.landed && lagsta <= 0) {
                            // Islaget: dämpa rörelsen och räkna ut VILOPOSEN —
                            // bygget liggande med nålens axel vågrät i fall-
                            // riktningen och gaffelplanet vågrätt (normalen åt
                            // det håll gaffelplanet redan lutar, så vridningen
                            // tar närmaste vägen). Vältfasens längd sätts av
                            // hur stor vridningen är.
                            ph.landed = true;
                            qSettleStart.copy(assembly.quaternion);
                            const lx = -Math.sin(ph.tbz), lz = Math.sin(ph.tbx);
                            const ln2 = Math.hypot(lx, lz) || 1;
                            vB.set(lx / ln2, 0, lz / ln2);
                            vA.set(1, 0, 0).applyQuaternion(assembly.quaternion);
                            vA.set(0, vA.y >= 0 ? 1 : -1, 0);
                            vC.crossVectors(vA, vB);
                            qSettleEnd.setFromRotationMatrix(settleM.makeBasis(vA, vB, vC));
                            ph.settleT = 0;
                            ph.settleDur = Math.min(0.7,
                                Math.max(0.18, qSettleStart.angleTo(qSettleEnd) / 3.2));
                            ph.vx *= 0.25;
                            ph.vz *= 0.25;
                            ph.vy = 0;
                            ph.wPsi = 0;
                        }
                        if (ph.landed && isFinite(lagsta)) {
                            // håll den lägsta punkten på bordet (både när
                            // vridningen sänker OCH lyfter den)
                            ph.py -= lagsta;
                            assembly.position.y = PIVOT.y + ph.py;
                        }
                    }

                    // Tyngdpunkten i världskoordinater (lokalt: (0, y_cm, 0) i cm).
                    // Punkten ligger på snurraxeln, så ψ flyttar den inte — därför
                    // går lodlinjen genom stödpunkten hela snurret igenom.
                    tmpV.set(0, d.yCm * 100, 0).applyQuaternion(assembly.quaternion).add(assembly.position);
                    const cmVisible = s.show.cm;
                    cmDot.visible = cmVisible;
                    cmLabel.visible = cmVisible;
                    if (cmVisible) {
                        cmDot.position.copy(tmpV);
                        cmLabel.position.copy(tmpV).add(new THREE.Vector3(1.3, -3.3, 0));
                    }

                    // Lodlinje från tyngdpunkten rakt ned + stödpunkt
                    const plumbVisible = s.show.plumb;
                    plumbLine.visible = plumbVisible;
                    pivotDot.visible = plumbVisible;
                    pivotLabel.visible = plumbVisible;
                    if (plumbVisible) {
                        plumbLine.geometry.setFromPoints([
                            new THREE.Vector3(tmpV.x, tmpV.y + 2.2, tmpV.z),
                            new THREE.Vector3(tmpV.x,
                                Math.min(PIVOT.y - 3.6, Math.max(0.2, tmpV.y - 3)), tmpV.z)
                        ]);
                        plumbLine.computeLineDistances();
                    }

                    // Tyngdkraftpil från tyngdpunkten
                    const gVisible = s.show.gravity;
                    gravArrow.visible = gVisible;
                    gravLabel.visible = gVisible;
                    if (gVisible) {
                        const len = d.M * PHYS.g * 3.6;   // skala: pil-längd ∝ F_G
                        gravArrow.position.copy(tmpV);
                        gravArrow.setDirection(new THREE.Vector3(0, -1, 0));
                        gravArrow.setLength(len, Math.min(0.75, len * 0.28), Math.min(0.45, len * 0.17));
                        gravLabel.position.set(tmpV.x + 1.2, tmpV.y - len - 1.5, tmpV.z);
                    }

                    // Hävarmen: vågrätt avstånd stödpunkt → tyngdkraftens riktningslinje
                    const leverVisible = s.show.lever && !ph.dropping && Math.abs(tmpV.x - PIVOT.x) + Math.abs(tmpV.z - PIVOT.z) > 0.12;
                    leverLine.visible = leverVisible;
                    leverLabel.visible = leverVisible;
                    if (leverVisible) {
                        leverLine.geometry.setFromPoints([
                            PIVOT, new THREE.Vector3(tmpV.x, PIVOT.y, tmpV.z)
                        ]);
                        leverLabel.position.set((PIVOT.x + tmpV.x) / 2, PIVOT.y + 1.3, (PIVOT.z + tmpV.z) / 2);
                    }

                    controls.update();
                    renderer.render(scene, camera);
                };
                animate();

                // ── Klick i scenen: korken = knuff, gaffelskaften = snurr ──
                // Ett klick skiljs från en kameradragning på att pekaren inte
                // flyttat sig mer än några pixlar mellan ned- och uppsläpp.
                const raycaster = new THREE.Raycaster();
                const pointerNDC = new THREE.Vector2();
                const pickAction = (ev) => {
                    const rect = renderer.domElement.getBoundingClientRect();
                    pointerNDC.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
                    pointerNDC.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
                    raycaster.setFromCamera(pointerNDC, camera);
                    const hits = raycaster.intersectObject(assembly, true);
                    for (const h of hits) {
                        if (h.object.userData.action) return { action: h.object.userData.action, point: h.point };
                    }
                    return null;
                };

                // Snurrets riktning: klicket ska kännas som en putt RAKT IN I
                // SKÄRMEN. Ett skaft till höger om snurraxeln puttas då bort
                // från betraktaren och bygget vrider sig moturs sett ovanifrån;
                // ett skaft till vänster ger medurs. Vi jämför därför träff-
                // punktens läge i bild med axelns, så att riktningen blir rätt
                // oavsett hur kameran står och hur bygget hunnit vrida sig.
                // (+ψ = moturs uppifrån, eftersom en rotation kring +y för +z
                // mot +x.)
                const pivotNDC = new THREE.Vector3();
                const hitNDC = new THREE.Vector3();
                const spinSign = (point) => {
                    hitNDC.copy(point).project(camera);
                    pivotNDC.copy(PIVOT).project(camera);
                    const dx = hitNDC.x - pivotNDC.x;
                    if (Math.abs(dx) < 1e-4) return 0;   // rakt över axeln
                    return dx > 0 ? 1 : -1;
                };
                let downAt = null;
                const onPointerDown = (ev) => { downAt = { x: ev.clientX, y: ev.clientY }; };
                const onPointerUp = (ev) => {
                    if (!downAt) return;
                    const moved = Math.hypot(ev.clientX - downAt.x, ev.clientY - downAt.y);
                    downAt = null;
                    if (moved > 7) return;   // kameradragning, inte klick
                    const hit = pickAction(ev);
                    if (!hit) return;
                    const acts = actionsRef.current;
                    if (hit.action === 'knuff' && acts.knuffa) acts.knuffa();
                    if (hit.action === 'snurr' && acts.snurra) acts.snurra(spinSign(hit.point));
                };
                // Pekarmarkör över de klickbara delarna
                let lastHover = 0;
                const onPointerMove = (ev) => {
                    const now2 = performance.now();
                    if (now2 - lastHover < 90 || downAt) return;
                    lastHover = now2;
                    renderer.domElement.style.cursor = pickAction(ev) ? 'pointer' : '';
                };
                renderer.domElement.addEventListener('pointerdown', onPointerDown);
                renderer.domElement.addEventListener('pointerup', onPointerUp);
                renderer.domElement.addEventListener('pointermove', onPointerMove);

                const onResize = () => {
                    const w = mount.clientWidth, hh = mount.clientHeight;
                    if (!w || !hh) return;
                    camera.aspect = w / hh; camera.updateProjectionMatrix();
                    renderer.setSize(w, hh);
                };
                window.addEventListener('resize', onResize);
                const ro = new ResizeObserver(onResize);
                ro.observe(mount);

                return () => {
                    cancelAnimationFrame(raf);
                    window.removeEventListener('resize', onResize);
                    renderer.domElement.removeEventListener('pointerdown', onPointerDown);
                    renderer.domElement.removeEventListener('pointerup', onPointerUp);
                    renderer.domElement.removeEventListener('pointermove', onPointerMove);
                    ro.disconnect();
                    renderer.dispose();
                    mount.removeChild(renderer.domElement);
                };
            }, []);

            // absolute inset-0: fyller ramen — och undantar scen-wrappern från
            // sektion 8:s height:auto på mobil (annars kollapsar ramen till 0)
            return <div ref={mountRef} className="absolute inset-0"></div>;
        };

        // ── Huvudapp ─────────────────────────────────────────────
        const App = () => {
            const [beta, setBeta] = useState(50);
            const [forksOn, setForksOn] = useState(true);
            const [show, setShow] = useState({ cm: true, plumb: true, gravity: false, lever: false });
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [controlsOpen, setControlsOpen] = useState(false);
            const [tiltDeg, setTiltDeg] = useState(0);
            const [spinF, setSpinF] = useState(0);
            const [fallen, setFallen] = useState(false);
            const sceneWrapRef = useRef(null);

            const stateRef = useRef({ beta, forksOn, show });
            useEffect(() => { stateRef.current = { beta, forksOn, show }; }, [beta, forksOn, show]);

            // Fysikens tillstånd (muteras i animationsloopen, inte React-state)
            // tbx/tbz = lutning kring världens x- respektive z-axel, wbx/wbz
            // deras vinkelhastigheter, psi/wPsi snurret kring lodlinjen.
            const physRef = useRef({
                tbx: 0.09, tbz: 0.015, wbx: 0, wbz: 0, psi: 0, wPsi: 0,
                px: 0, py: 0, pz: 0, vx: 0, vy: 0, vz: 0, dropping: false,
                landed: false, settleT: 0, settleDur: 0.4,
                betaShown: 50 * Math.PI / 180, falling: false, frozen: false, tilt: 0.09
            });

            // Test-handtag för mätskript (skärmdumpsgranskning av fallet)
            useEffect(() => { window.__gaffelPh = physRef.current; }, []);

            // Läs av vinkel, varvtal + fallstatus till UI:t några gånger per sekund
            useEffect(() => {
                const id = setInterval(() => {
                    const ph = physRef.current;
                    setTiltDeg(ph.tilt * 180 / Math.PI);
                    setSpinF(Math.abs(ph.wPsi) / (2 * Math.PI));
                    setFallen(ph.frozen);
                    // Mini-läget: rapportera läget till minisim-kortet utanför
                    if (window.__MINI && window.parent !== window) {
                        const st = stateRef.current;
                        const dd = computeDerived(st.beta, st.forksOn);
                        window.parent.postMessage({ fysikGaffelStatus: {
                            fallen: ph.frozen, stable: dd.stable, period: dd.period,
                            betaCrit: dd.betaCrit, forksOn: st.forksOn,
                            spinF: Math.abs(ph.wPsi) / (2 * Math.PI)
                        } }, '*');
                    }
                }, 180);
                return () => clearInterval(id);
            }, []);

            useEffect(() => {
                const handler = () => setIsFullscreen(
                    document.fullscreenElement === sceneWrapRef.current ||
                    document.webkitFullscreenElement === sceneWrapRef.current
                );
                document.addEventListener('fullscreenchange', handler);
                document.addEventListener('webkitfullscreenchange', handler);
                return () => {
                    document.removeEventListener('fullscreenchange', handler);
                    document.removeEventListener('webkitfullscreenchange', handler);
                };
            }, []);

            const toggleFullscreen = () => {
                const el = sceneWrapRef.current;
                if (!el) return;
                if (document.fullscreenElement || document.webkitFullscreenElement)
                    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
            };

            const knuffa = () => {
                const ph = physRef.current;
                if (ph.frozen) return;
                const dirSign = Math.random() < 0.5 ? -1 : 1;
                ph.wbx += dirSign * (0.55 + Math.random() * 0.3);
                ph.wbz += (Math.random() - 0.5) * 0.5;
            };

            // Snurret ges kring den lodräta axeln — ingen extra lutning, så
            // lodlinjen från tyngdpunkten fortsätter gå genom stödpunkten.
            const snurra = (dir) => {
                const ph = physRef.current;
                if (ph.frozen) return;
                const KICK = 9, MAX = 22;
                if (typeof dir === 'number' && dir !== 0) {
                    // Klick i scenen: riktningen kommer av VAR man puttar, så
                    // putten alltid går in i skärmen. Puttar man mot ett
                    // pågående snurr bromsas det i stället, som i verkligheten.
                    ph.wPsi = Math.max(-MAX, Math.min(MAX, ph.wPsi + dir * KICK));
                    return;
                }
                // Knappen Snurra: fyller på i den riktning bygget redan snurrar.
                const dirSign = ph.wPsi !== 0 ? Math.sign(ph.wPsi) : (Math.random() < 0.5 ? -1 : 1);
                ph.wPsi = dirSign * Math.min(MAX, Math.abs(ph.wPsi) + KICK);
            };

            // Bär in knapparnas handlingar till 3D-scenens klickhantering:
            // klick på korken gör en knuff, klick på ett gaffelskaft ett snurr.
            const actionsRef = useRef({});
            actionsRef.current = { knuffa, snurra };

            const reset = () => {
                const ph = physRef.current;
                ph.tbx = forksOn ? 0.09 : 0.02;
                ph.tbz = 0.015;
                ph.wbx = 0; ph.wbz = 0;
                ph.psi = 0; ph.wPsi = 0;
                ph.px = 0; ph.py = 0; ph.pz = 0;
                ph.vx = 0; ph.vy = 0; ph.vz = 0; ph.dropping = false;
                ph.landed = false; ph.settleT = 0;
                ph.falling = false; ph.frozen = false; ph.tilt = ph.tbx;
            };

            // Startar om med liten störning när gafflarna sätts på/tas av
            const toggleForks = (on) => {
                setForksOn(on);
                const ph = physRef.current;
                ph.tbx = on ? 0.09 : 0.02;
                ph.tbz = 0.01;
                ph.wbx = 0; ph.wbz = 0;
                ph.psi = 0; ph.wPsi = 0;
                ph.px = 0; ph.py = 0; ph.pz = 0;
                ph.vx = 0; ph.vy = 0; ph.vz = 0; ph.dropping = false;
                ph.landed = false; ph.settleT = 0;
                ph.falling = false; ph.frozen = false; ph.tilt = ph.tbx;
            };

            // Mini-läget: minisim-kortet i teorin styr sidan via postMessage
            const miniRef = useRef({});
            miniRef.current = { knuffa, snurra, reset, setBeta };
            useEffect(() => {
                if (!window.__MINI) return;
                const onMsg = (e) => {
                    const msg = e.data;
                    if (!msg || !msg.fysikGaffel) return;
                    const m = miniRef.current;
                    if (msg.fysikGaffel === 'knuffa') m.knuffa();
                    else if (msg.fysikGaffel === 'snurra') m.snurra();
                    else if (msg.fysikGaffel === 'reset') m.reset();
                    else if (msg.fysikGaffel === 'beta')
                        m.setBeta(Math.max(10, Math.min(70, +msg.value || 0)));
                };
                window.addEventListener('message', onMsg);
                return () => window.removeEventListener('message', onMsg);
            }, []);

            const d = useMemo(() => computeDerived(beta, forksOn), [beta, forksOn]);
            const dMm = d.yCm * 1000;
            const tShow = (k) => setShow(s => ({ ...s, [k]: !s[k] }));

            const Readout = ({ label, value, unit, accent }) => (
                <div className="p-2 rounded-lg" style={{ background: 'var(--lab-bg)', border: '1px solid var(--lab-line-strong)' }}>
                    <div className="text-xs" style={{ color: 'var(--lab-ink-muted)' }} dangerouslySetInnerHTML={{ __html: label }} />
                    <div className="font-mono font-bold text-sm" style={{ color: accent ? 'var(--lab-accent)' : 'var(--lab-ink)' }}>
                        {value} <span className="font-normal text-xs" style={{ color: 'var(--lab-ink-muted)' }}>{unit}</span>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen dark-container px-4 md:px-8 pb-12" style={{ fontFamily: 'Poppins, sans-serif' }}>
                    <div className="max-w-6xl mx-auto pt-6">
                        <div className="breadcrumb mb-4" style={{ fontSize: 13 }}>
                            <a href="index.html">Hem</a> / <a href="katalog.html#fy2">Fysik nivå 2</a> / Gaffelbalansen
                        </div>
                        <h1 className="text-3xl md:text-4xl font-black tracking-tight" style={{ color: 'var(--lab-ink)' }}>Gaffelbalansen</h1>
                        <p className="mt-2 mb-5" style={{ color: 'var(--lab-ink-soft)', maxWidth: 760 }}>
                            Två gafflar sitter fast i en kork, en nål sticks genom korken — och alltihop
                            balanserar på nålspetsen mot den ytterst smala kanten av ett mynt som står
                            på högkant. Det ser omöjligt ut, men är förvånansvärt lätt. Hemligheten: gafflarna hänger så lågt att hela
                            systemets <strong>tyngdpunkt hamnar under stödpunkten</strong>. Knuffa till det,
                            sätt snurr på det, ändra gaffelvinkeln — och ta bort gafflarna för att
                            se skillnaden.
                        </p>

                        {/* Formelkort: återförande kraftmoment */}
                        <div className="glass-card rounded-xl p-4 mb-6 flex flex-wrap items-center gap-x-10 gap-y-4">
                            <div className="flex items-end gap-3">
                                <div style={{ textAlign: 'center' }}>
                                    <div className="flbl mb-1">Återförande kraftmoment</div>
                                    <div className="fnum"><em>M</em></div>
                                </div>
                                <span style={{ color: 'var(--lab-ink-muted)', fontSize: '17px' }}>=</span>
                                <div style={{ textAlign: 'center' }}>
                                    <div className="flbl mb-1">Tyngdkraft</div>
                                    <div className="fnum"><em>F</em><sub>G</sub></div>
                                </div>
                                <span style={{ color: 'var(--lab-ink)', fontSize: '17px' }}>⋅</span>
                                <div style={{ textAlign: 'center' }}>
                                    <div className="flbl mb-1">Hävarm</div>
                                    <div className="fnum"><em>l</em></div>
                                </div>
                            </div>
                            <div className="text-sm" style={{ color: 'var(--lab-ink-soft)', maxWidth: 420 }}>
                                Ligger tyngdpunkten <strong>under</strong> stödpunkten vrider momentet
                                systemet <strong>tillbaka</strong> när det lutar — stabil jämvikt.
                                Ligger den <strong>ovanför</strong> vrider samma moment i stället
                                systemet <strong>vidare</strong> — det välter.
                            </div>
                        </div>

                        <main className="flex flex-col lg:flex-row gap-6">
                            {/* Scen */}
                            <div className="lg:w-3/5 order-1">
                                <div className={"scene-wrap" + (isFullscreen ? " is-fs" : "")} data-theme="ljusPapper" ref={sceneWrapRef}>
                                    <div className="scene-stage">
                                        <BalansScene stateRef={stateRef} physRef={physRef} actionsRef={actionsRef} />
                                        <button className="fs-btn" onClick={toggleFullscreen} aria-label="Fullskärm"
                                                title={isFullscreen ? 'Lämna fullskärm' : 'Fullskärm'}>
                                            {isFullscreen ? (
                                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                    <path d="M9 3v6H3"/><path d="M15 21v-6h6"/><path d="M21 9h-6V3"/><path d="M3 15h6v6"/>
                                                </svg>
                                            ) : (
                                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                    <path d="M3 9V3h6"/><path d="M21 9V3h-6"/><path d="M3 15v6h6"/><path d="M21 15v6h-6"/>
                                                </svg>
                                            )}
                                        </button>
                                        <div className="scene-hint">Klicka på korken (knuff) eller ett gaffelskaft (snurr) · dra för att rotera</div>
                                    </div>

                                    <div className="scene-toggles">
                                        <div className="st-title">Visa</div>
                                        <label>
                                            <input type="checkbox" checked={show.cm} onChange={() => tShow('cm')} />
                                            <span className="st-swatch" style={{ background: COL.cm }}></span>
                                            <span>Tyngdpunkt</span>
                                        </label>
                                        <label>
                                            <input type="checkbox" checked={show.plumb} onChange={() => tShow('plumb')} />
                                            <span className="st-swatch" style={{ background: COL.pivot }}></span>
                                            <span>Stödpunkt och lodlinje</span>
                                        </label>
                                        <label>
                                            <input type="checkbox" checked={show.gravity} onChange={() => tShow('gravity')} />
                                            <span className="st-swatch" style={{ background: COL.gravity }}></span>
                                            <span>Tyngdkraft <em>F</em><sub>G</sub></span>
                                        </label>
                                        <label>
                                            <input type="checkbox" checked={show.lever} onChange={() => tShow('lever')} />
                                            <span className="st-swatch" style={{ background: COL.lever }}></span>
                                            <span>Hävarm <em>l</em></span>
                                        </label>
                                        <div className="st-title" style={{ marginTop: 7 }}>Jämför</div>
                                        <label>
                                            <input type="checkbox" checked={!forksOn} onChange={(e) => toggleForks(!e.target.checked)} />
                                            <span className="st-swatch" style={{ background: 'transparent' }}></span>
                                            <span>Utan gafflar</span>
                                        </label>
                                        {isFullscreen && (
                                            <div className="st-actions">
                                                <button className="btn-toggle" onClick={knuffa}>Knuffa till</button>
                                                <button className="btn-toggle" onClick={snurra}>Snurra</button>
                                                <button className="btn-toggle" onClick={reset}>Börja om</button>
                                            </div>
                                        )}
                                    </div>

                                    {isFullscreen && (
                                        <React.Fragment>
                                            <div className={`fs-controls ${controlsOpen ? '' : 'collapsed'}`}>
                                                <FsSlider label="Gaffelvinkel (<em>β</em>)" value={beta}
                                                          min={10} max={70} step={1} unit="°" onChange={setBeta} />
                                            </div>
                                            <button className="fs-toggle-handle" onClick={() => setControlsOpen(o => !o)}
                                                    title={controlsOpen ? 'Dölj reglage' : 'Visa reglage'}
                                                    aria-expanded={controlsOpen}>
                                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                     strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"
                                                     style={{ transform: controlsOpen ? 'rotate(0deg)' : 'rotate(180deg)' }}>
                                                    <path d="M6 9l6 6 6-6"/>
                                                </svg>
                                                <span>{controlsOpen ? 'Dölj reglage' : 'Reglage'}</span>
                                            </button>
                                        </React.Fragment>
                                    )}

                                </div>

                                {fallen && (
                                    <div className="mt-3 p-3 rounded-lg text-sm" style={{ background: 'var(--lab-bg)', borderLeft: '3px solid var(--lab-accent)', color: 'var(--lab-ink-soft)' }}>
                                        <strong>Det välte!</strong>{' '}
                                        {forksOn && d.stable
                                            ? 'Knuffen blev för stor — nålspetsen gled av myntkanten. Så länge lutningen är liten vrider momentet alltid tillbaka.'
                                            : forksOn
                                                ? <span>Med gaffelvinkeln {fmt(beta, 0)}° ligger tyngdpunkten <strong>ovanför</strong> stödpunkten — samma moment som annars räddar balansen vräker nu omkull systemet. Vinkla gafflarna brantare än {fmt(d.betaCrit, 0)}°.</span>
                                                : <span>Utan gafflar ligger tyngdpunkten cirka {fmt(dMm, 0)} mm <strong>ovanför</strong> stödpunkten — instabil jämvikt, precis som klossen som lutas förbi sin vridningspunkt.</span>}
                                        {' '}Tryck på <em>Börja om</em>.
                                    </div>
                                )}
                                {!fallen && !d.stable && (
                                    <div className="mt-3 p-3 rounded-lg text-sm" style={{ background: 'var(--lab-bg)', borderLeft: '3px solid var(--lab-accent)', color: 'var(--lab-ink-soft)' }}>
                                        <strong>Instabilt läge.</strong> Tyngdpunkten ligger nu {fmt(Math.abs(dMm), 1)}&nbsp;mm{' '}
                                        <strong>ovanför</strong> stödpunkten — minsta störning växer och systemet faller.
                                    </div>
                                )}
                            </div>

                            {/* Kontroller */}
                            <div className="lg:w-2/5 order-2">
                                <Slider label="Gaffelvinkel (<em>β</em>)"
                                        sub={`Hur brant nedåt gafflarna pekar. Brantare vinkel sänker tyngdpunkten — gränsen går vid <em>β</em> ≈ ${fmt(d.betaCrit, 0)}°, där tyngdpunkten passerar stödpunkten.`}
                                        value={beta} min={10} max={70} step={1} unit="°" onChange={setBeta} />

                                <div className="flex gap-2 mb-4">
                                    <button className="btn-toggle flex-1" onClick={knuffa}>Knuffa till</button>
                                    <button className="btn-toggle flex-1" onClick={snurra}>Snurra</button>
                                    <button className="btn-toggle flex-1" onClick={reset}>Börja om</button>
                                </div>

                                <div className="glass-card rounded-xl p-3 mb-4">
                                    <h3 className="font-bold text-sm mb-2" style={{ color: 'var(--lab-ink)' }}>Beräknade värden</h3>
                                    <div className="grid grid-cols-2 gap-2">
                                        <Readout label="Tyngdpunktens läge" value={fmt(Math.abs(dMm), 1)}
                                                 unit={`mm ${d.stable ? 'under' : 'över'} stödpunkten`} accent />
                                        <Readout label="Utslagsvinkel" value={fmt(tiltDeg, 1)} unit="°" />
                                        <Readout label="Svängningstid <em>T</em>" value={d.stable && forksOn ? fmt(d.period, 2) : '—'} unit={d.stable && forksOn ? 's' : ''} />
                                        <Readout label="Kritisk vinkel <em>β</em>" value={fmt(d.betaCrit, 0)} unit="°" />
                                        <div className="col-span-2">
                                            <Readout label="Varvtal <em>f</em> (snurr kring lodräta axeln)"
                                                     value={fmt(spinF, 1)} unit="varv/s" />
                                        </div>
                                    </div>
                                    <div className="mt-2 p-2 rounded-lg text-xs" style={{ background: d.stable ? 'rgba(46,158,79,0.10)' : 'rgba(200,50,74,0.10)', color: 'var(--lab-ink-soft)' }}>
                                        {d.stable
                                            ? <span><strong>Stabil jämvikt</strong> — lutar systemet lyfts tyngdpunkten, och momentet <em>M</em> = <em>F</em><sub>G</sub> · <em>l</em> vrider tillbaka.</span>
                                            : <span><strong>Instabil jämvikt</strong> — lutar systemet sänks tyngdpunkten, och momentet <em>M</em> = <em>F</em><sub>G</sub> · <em>l</em> vrider vidare.</span>}
                                    </div>
                                </div>

                                <div className="glass-card rounded-xl p-4">
                                    <h3 className="font-bold text-sm mb-1" style={{ color: 'var(--lab-ink)' }}>Tyngdpunktens höjd mot gaffelvinkeln</h3>
                                    <p className="text-xs mb-2" style={{ color: 'var(--lab-ink-soft)' }}>
                                        Kurvan visar var systemets tyngdpunkt hamnar i förhållande till
                                        stödpunkten. Bara i det gröna området — tyngdpunkten under
                                        stödpunkten — är balansen stabil.
                                    </p>
                                    <YcmGraph beta={beta} forksOn={forksOn} />
                                </div>
                            </div>
                        </main>

                        {/* Pedagogiska sektioner */}
                        <div className="grid md:grid-cols-2 gap-4 mt-6">
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Varför är det så lätt att balansera?</h3>
                                <p className="text-sm mb-2" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Gafflarnas tunga skaft hänger snett nedåt, på båda sidor om myntet. De
                                    väger tillsammans mycket mer än korken och nålen — så hela systemets
                                    tyngdpunkt dras ned till en punkt <strong>strax under nålspetsen</strong>,
                                    bara någon centimeter, men det räcker.
                                </p>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Då fungerar alltihop som en <strong>hängande pendel</strong>: lutar det åt
                                    ena hållet flyttas tyngdpunkten ut i sidled och <strong>lyfts</strong>, och
                                    tyngdkraften får en hävarm <em>l</em> till stödpunkten. Kraftmomentet{' '}
                                    <em>M</em> = <em>F</em><sub>G</sub> · <em>l</em> vrider systemet tillbaka
                                    mot jämviktsläget — det rättar till sig självt, precis som en gunga som
                                    alltid svänger tillbaka mot sitt lägsta läge.
                                </p>
                            </div>

                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Varför överlever balansen ett snurr?</h3>
                                <p className="text-sm mb-2" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Tryck på <em>Snurra</em> och se bygget rotera runt — utan att tappa
                                    balansen. Snurret sker kring den <strong>lodräta axeln</strong>, och den
                                    axeln går genom både stödpunkten och tyngdpunkten. Tyngdkraften är
                                    riktad längs precis samma linje, så dess hävarm till snurraxeln är{' '}
                                    <em>l</em> = 0 och kraftmomentet blir noll: tyngdkraften kan varken
                                    driva på snurret eller bromsa det, och framför allt inte välta bygget.
                                </p>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Att snurret ändå avtar beror på <strong>friktionen</strong> mellan
                                    nålspetsen och myntkanten — den enda kraft som ger ett moment kring
                                    axeln. Följ varvtalet <em>f</em> i avläsningen medan det saktar in. Ett
                                    snurrande föremål blir dessutom stabilare, precis som en snurra: det
                                    motsätter sig att rotationsaxeln vrids åt sidan.
                                </p>
                            </div>

                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Jämför med klossen som välter</h3>
                                <p className="text-sm mb-2" style={{ color: 'var(--lab-ink-soft)' }}>
                                    I teoriavsnittet lutas en kloss tills tyngdpunkten passerar
                                    vridningspunkten — då välter den. Där ligger tyngdpunkten{' '}
                                    <strong>ovanför</strong> stödet: lutar klossen <strong>sänks</strong>{' '}
                                    tyngdpunkten, och samma kraftmoment som här räddar balansen vräker i
                                    stället omkull klossen.
                                </p>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Kryssa i <em>Utan gafflar</em> och se skillnaden direkt: kork och nål
                                    ensamma har tyngdpunkten högt ovanför nålspetsen, och de faller på
                                    bråkdelen av en sekund. Det är alltså inte skickligt handlag som håller
                                    gaffelbygget uppe — det är gafflarnas låga tyngdpunkt som gör hela jobbet.
                                </p>
                            </div>
                        </div>

                        <details className="glass-card rounded-xl p-4 mt-4">
                            <summary className="accordion-head" style={{ color: 'var(--lab-ink)' }}>
                                <span>Vanliga missuppfattningar</span><span style={{ color: 'var(--lab-ink-muted)' }}>▾</span>
                            </summary>
                            <ul className="mt-3 space-y-2 text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                <li><strong>"Tricket trotsar tyngdkraften."</strong> Tvärtom — det är tyngdkraften som håller systemet uppe. Varje gång det lutar ger tyngdkraften ett moment som vrider tillbaka. Utan tyngdkraft funnes ingen återförande verkan alls.</li>
                                <li><strong>"Tyngdpunkten måste ligga i ett föremål."</strong> Systemets tyngdpunkt ligger här i tomma luften, under nålspetsen mellan gafflarna. Tyngdpunkten är en beräknad punkt — medelläget för all massa — och behöver inte ligga i något materiellt.</li>
                                <li><strong>"Stödytan måste vara stor för att något ska stå stabilt."</strong> Stödet är här en punkt — nålspetsen mot myntkanten. En stor stödyta behövs bara när tyngdpunkten ligger <em>ovanför</em> stödet. Ligger den under räcker en enda punkt.</li>
                            </ul>
                        </details>

                        <details className="glass-card rounded-xl p-4 mt-4">
                            <summary className="accordion-head" style={{ color: 'var(--lab-ink)' }}>
                                <span>Prova själv hemma — och samma princip i verkligheten</span><span style={{ color: 'var(--lab-ink-muted)' }}>▾</span>
                            </summary>
                            <p className="mt-3 text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                Tryck fast två likadana gafflar i varsin sida av en vinkork, snett nedåt.
                                Stick en grov nål genom korken. Kläm sedan fast ett mynt på högkant i en
                                skåra i korken på en flaska, och ställ nålspetsen på myntets övre, smala
                                kant. Justera gafflarnas vinkel tills
                                bygget hänger stilla — känns det ostadigt sitter gafflarna för högt eller
                                för plant. Samma princip används på riktigt: en lindansares balansstång
                                böjer sig nedåt i ändarna för att sänka tyngdpunkten, lastfartyg lägger
                                barlast djupt nere i skrovet, och en leksaksfågel som balanserar på
                                näbben har blyvikter i vingspetsarna — alltid samma recept: flytta
                                tyngdpunkten så långt ned som möjligt, helst under stödpunkten.
                            </p>
                        </details>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script src="feedback.js" defer></script>
    <script src="sim-dock.js" defer></script>
    <script src="data/katalog.js"></script>
    <script src="section-nav.js"></script>
</body>
</html>
