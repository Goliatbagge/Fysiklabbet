    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Kort elektrisk smäll när glödlampan går sönder (syntetiserat, inga ljudfiler)
        const playBurnoutSound = () => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const duration = 0.5;
                const sampleRate = ctx.sampleRate;
                const length = sampleRate * duration;
                const buffer = ctx.createBuffer(1, length, sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < length; i++) {
                    const t = i / sampleRate;
                    const pop = (t < 0.01) ? Math.sin(2 * Math.PI * 150 * t) * 4 : 0;
                    const buzz = Math.sin(2 * Math.PI * 100 * t) * Math.exp(-t * 8) * 0.5;
                    const fizzle = (Math.random() * 2 - 1) * Math.exp(-t * 6) * 0.4;
                    const thump = Math.sin(2 * Math.PI * 60 * t) * Math.exp(-t * 20);
                    data[i] = (pop + buzz + fizzle + thump) * 0.25;
                }
                const source = ctx.createBufferSource();
                source.buffer = buffer;
                const lowpass = ctx.createBiquadFilter();
                lowpass.type = 'lowpass';
                lowpass.frequency.value = 2000;
                source.connect(lowpass);
                lowpass.connect(ctx.destination);
                source.start();
                source.onended = () => ctx.close();
            } catch (e) {
                // Ljud stöds inte, ignorera tyst
            }
        };

        const fmt = (v, d) => {
            const s = v.toFixed(d);
            if (parseFloat(s) === 0) return '0';
            return s.replace('.', ',');
        };
        const fmtI = (i) => fmt(i, i < 1 ? 2 : 1);

        const CircuitType = { DC: 'dc', AC: 'ac' };

        // ── Kretsens geometri (viewBox 640 × 400) ─────────────────────
        // Ledningen är en rektangel. Positionen längs ledningen räknas
        // medurs från det övre vänstra hörnet: överledningen, högra sidan
        // (komponenten), bottenledningen och vänstra sidan (batteriet).
        const VB_W = 640, VB_H = 400;
        const XL = 90, XR = 550, YT = 70, YB = 330;
        const LEN_T = XR - XL, LEN_R = YB - YT;
        const PER = 2 * (LEN_T + LEN_R);
        const MID_Y = (YT + YB) / 2;
        const COMP_POS = LEN_T + (MID_Y - YT);     // komponentens mitt längs ledningen
        const RES_HALF = 45;                       // resistorns halva längd
        const AMP_X = (XL + XR) / 2;
        const WIRE_PATH = `M ${XL} ${YT} H ${XR} V ${YB} H ${XL} Z`;
        const NUM_ELECTRONS = 60;
        const NUM_ARROWS = 16;
        const DRIFT_PX_PER_AMP = 26;   // driftfart i bilden: px/s per ampere (∝ strömmen)
        const AC_PX_PER_AMP = 9;       // svängningens amplitud vid växelström: px per ampere
        const BREAK_CURRENT = 24;      // lampan går sönder vid denna ström (A)
        const INK = '#0f1620';
        const MUTED = '#5a6170';
        const ACCENT = '#c8324a';
        const PAPER = '#f4eee2';

        const pointAt = (pos) => {
            const p = ((pos % PER) + PER) % PER;
            if (p < LEN_T) return { x: XL + p, y: YT, dx: 1, dy: 0 };
            if (p < LEN_T + LEN_R) return { x: XR, y: YT + (p - LEN_T), dx: 0, dy: 1 };
            if (p < 2 * LEN_T + LEN_R) return { x: XR - (p - LEN_T - LEN_R), y: YB, dx: -1, dy: 0 };
            return { x: XL, y: YB - (p - 2 * LEN_T - LEN_R), dx: 0, dy: -1 };
        };
        const pathDist = (a, b) => {
            const d = (((a - b) % PER) + PER) % PER;
            return Math.min(d, PER - d);
        };
        const clamp01 = (v) => Math.max(0, Math.min(1, v));

        // Glödlampans ljusstyrka ur effekten P = U · I (mättas mjukt)
        const brightness = (U, I) => 1 - Math.exp(-(U * I) / 20);

        // Positiva joner i resistorns metallgitter
        const IONS = (() => {
            const out = [];
            for (let r = 0; r < 6; r++) {
                const y = MID_Y - 37 + r * 14.8;
                const xs = r % 2 === 0 ? [XR - 12, XR + 12] : [XR - 15.5, XR, XR + 15.5];
                xs.forEach((x) => out.push({ x, y }));
            }
            return out;
        })();

        // ── Scenen ────────────────────────────────────────────────
        // Det statiska ritas av React. Elektroner, strömpilar och lampans
        // sken flyttas direkt i DOM:en i en requestAnimationFrame-loop, så
        // att React inte behöver rendera om scenen 60 gånger i sekunden.
        const CircuitScene = (props) => {
            const { circuitType, showElectrons, showArrows, current, voltage, resistance,
                    isBroken, batteryFlipped, onBatteryClick, showValues, componentType,
                    sceneWrapRef, overlay } = props;
            const live = useRef(props);
            live.current = props;
            const elRefs = useRef([]);
            const arRefs = useRef([]);
            const glowRef = useRef(null);
            const coreRef = useRef(null);
            const seeds = useRef(null);
            if (!seeds.current) {
                seeds.current = Array.from({ length: NUM_ELECTRONS }, (_, i) => ({
                    base: (i + Math.random() * 0.5) * PER / NUM_ELECTRONS,
                    f1: 5 + Math.random() * 5, f2: 8 + Math.random() * 6, f3: 4 + Math.random() * 5,
                    p1: Math.random() * 6.28, p2: Math.random() * 6.28, p3: Math.random() * 6.28,
                }));
            }
            const st = useRef({ drift: 0, tAc: 0, tTh: 0, last: null });

            useEffect(() => {
                let raf;
                const frame = (now) => {
                    raf = requestAnimationFrame(frame);
                    const s = st.current;
                    const L = live.current;
                    const dt = s.last == null ? 0 : Math.min(0.05, (now - s.last) / 1000);
                    s.last = now;
                    const blocked = L.componentType === 'bulb' && L.isBroken;
                    const ac = L.circuitType === CircuitType.AC;
                    if (!L.isPaused) {
                        s.tTh += dt;
                        if (!blocked) {
                            if (ac) s.tAc += dt;
                            else s.drift += (L.batteryFlipped ? 1 : -1) * DRIFT_PX_PER_AMP * L.current * dt;
                        }
                    }
                    const w = 2 * Math.PI * L.frequency;
                    const off = ac ? AC_PX_PER_AMP * L.current * Math.sin(w * s.tAc) : s.drift;
                    const resistor = L.componentType === 'resistor';

                    // Elektronerna: drift längs ledningen + värmerörelse (darrning)
                    seeds.current.forEach((e, i) => {
                        const node = elRefs.current[i];
                        if (!node) return;
                        const pos = e.base + off;
                        const pt = pointAt(pos);
                        let amp = 1.8;
                        if (resistor) {
                            amp += 7.5 * clamp01((RES_HALF + 6 - pathDist(pos, COMP_POS)) / 14);
                        }
                        const t = s.tTh;
                        const n = amp * (0.62 * Math.sin(e.f1 * t + e.p1) + 0.38 * Math.sin(e.f2 * t + e.p2));
                        const tg = amp * 0.45 * Math.sin(e.f3 * t + e.p3);
                        const x = pt.x + pt.dx * tg - pt.dy * n;
                        const y = pt.y + pt.dy * tg + pt.dx * n;
                        node.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)})`);
                    });

                    // Strömpilarna: rör sig åt motsatt håll mot elektronerna
                    const vel = ac ? Math.cos(w * s.tAc) : 0;
                    for (let j = 0; j < NUM_ARROWS; j++) {
                        const node = arRefs.current[j];
                        if (!node) continue;
                        const pos = (j + 0.5) * PER / NUM_ARROWS - off;
                        const pt = pointAt(pos);
                        let ang = Math.atan2(pt.dy, pt.dx) * 180 / Math.PI;
                        const medurs = ac ? vel < 0 : !L.batteryFlipped;
                        if (!medurs) ang += 180;
                        node.setAttribute('transform', `translate(${pt.x.toFixed(1)} ${pt.y.toFixed(1)}) rotate(${ang.toFixed(1)})`);
                        node.setAttribute('opacity', ac ? (0.2 + 0.8 * Math.abs(vel)).toFixed(2) : '1');
                    }

                    // Glödlampans sken (fladdrar i takt med växelströmmen)
                    if (glowRef.current && coreRef.current) {
                        let b = blocked ? 0 : brightness(L.voltage, L.current);
                        if (ac) b *= 0.4 + 0.6 * Math.pow(Math.sin(w * s.tAc), 2);
                        glowRef.current.setAttribute('opacity', b.toFixed(3));
                        coreRef.current.setAttribute('opacity', (0.95 * b).toFixed(3));
                    }
                };
                raf = requestAnimationFrame(frame);
                return () => cancelAnimationFrame(raf);
            }, []);

            const blocked = componentType === 'bulb' && isBroken;
            const iVisas = blocked ? 0 : current;

            // Batteri (likström) eller växelspänningskälla på vänstra ledningen
            const Source = () => {
                if (circuitType === CircuitType.AC) {
                    return (
                        <g>
                            <circle cx={XL} cy={MID_Y} r="23" fill={PAPER} stroke={INK} strokeWidth="2.4" />
                            <path d={`M ${XL - 12} ${MID_Y} C ${XL - 7} ${MID_Y - 10}, ${XL - 1} ${MID_Y - 10}, ${XL} ${MID_Y} S ${XL + 7} ${MID_Y + 10}, ${XL + 12} ${MID_Y}`}
                                  fill="none" stroke={INK} strokeWidth="2.4" strokeLinecap="round" />
                        </g>
                    );
                }
                const yLang = batteryFlipped ? MID_Y + 7 : MID_Y - 7;   // lång platta = pluspol
                const yKort = batteryFlipped ? MID_Y - 7 : MID_Y + 7;   // kort platta = minuspol
                return (
                    <g className="batteri-klick" onPointerDown={(e) => { e.stopPropagation(); onBatteryClick(); }}>
                        <title>Klicka för att vända batteriet</title>
                        <rect x={XL - 40} y={MID_Y - 34} width="80" height="68" fill="transparent" />
                        <rect x={XL - 13} y={MID_Y - 7} width="26" height="14" fill={PAPER} />
                        <line className="batteri-pol" x1={XL - 25} y1={yLang} x2={XL + 25} y2={yLang}
                              stroke={INK} strokeWidth="2.2" strokeLinecap="butt" />
                        <line className="batteri-pol" x1={XL - 13} y1={yKort} x2={XL + 13} y2={yKort}
                              stroke={INK} strokeWidth="5.5" strokeLinecap="butt" />
                        <text x={XL - 31} y={yLang} textAnchor="end" dominantBaseline="central"
                              fill={INK} fontSize="17" fontWeight="600">+</text>
                        <text x={XL - 31} y={yKort} textAnchor="end" dominantBaseline="central"
                              fill={INK} fontSize="17" fontWeight="600">−</text>
                    </g>
                );
            };

            // Glödlampa (svensk symbol: cirkel med kryss) på högra ledningen
            const Bulb = () => {
                const r = 24, k = 16.5;
                if (isBroken) {
                    return (
                        <g>
                            <circle cx={XR} cy={MID_Y - 36} r="13" fill="#8a8f99" opacity="0.18" />
                            <circle cx={XR + 9} cy={MID_Y - 52} r="9" fill="#8a8f99" opacity="0.12" />
                            <circle cx={XR} cy={MID_Y} r={r} fill={PAPER} stroke="#7b818c" strokeWidth="2.4" strokeDasharray="7 4" />
                            <path d={`M ${XR - k} ${MID_Y - k} L ${XR - 3} ${MID_Y - 3} M ${XR + 3} ${MID_Y + 3} L ${XR + k} ${MID_Y + k}`}
                                  stroke="#7b818c" strokeWidth="2.4" strokeLinecap="round" />
                            <path d={`M ${XR + k} ${MID_Y - k} L ${XR + 4} ${MID_Y - 2} M ${XR - 2} ${MID_Y + 4} L ${XR - k} ${MID_Y + k}`}
                                  stroke="#7b818c" strokeWidth="2.4" strokeLinecap="round" />
                            <circle cx={XR} cy={MID_Y} r="5" fill="#3d3a36" opacity="0.35" />
                        </g>
                    );
                }
                return (
                    <g>
                        <circle cx={XR} cy={MID_Y} r={r} fill={PAPER} />
                        <circle ref={coreRef} cx={XR} cy={MID_Y} r={r - 1.5} fill="url(#lampKarna)" opacity="0" />
                        <circle cx={XR} cy={MID_Y} r={r} fill="none" stroke={INK} strokeWidth="2.4" />
                        <line x1={XR - k} y1={MID_Y - k} x2={XR + k} y2={MID_Y + k} stroke={INK} strokeWidth="2.4" strokeLinecap="round" />
                        <line x1={XR + k} y1={MID_Y - k} x2={XR - k} y2={MID_Y + k} stroke={INK} strokeWidth="2.4" strokeLinecap="round" />
                    </g>
                );
            };

            const etikettX = XR - 36;
            const legend = [];
            if (showElectrons) legend.push('el');
            if (showElectrons && componentType === 'resistor') legend.push('jon');
            if (showArrows && !blocked) legend.push('pil');

            return (
                <div className="scene-wrap" data-theme="ljusPapper" ref={sceneWrapRef} style={{ userSelect: 'none' }}>
                    <svg viewBox="32 18 576 356" fontFamily="'DM Sans', Poppins, system-ui, sans-serif"
                         role="img" aria-label="Elektrisk krets med spänningskälla, amperemeter och en glödlampa eller resistor">
                        <defs>
                            <linearGradient id="papper" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0" stopColor="#f7f2e8" />
                                <stop offset="1" stopColor="#ece3d2" />
                            </linearGradient>
                            <pattern id="rutnat" width="20" height="20" patternUnits="userSpaceOnUse">
                                <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(70,110,190,0.14)" strokeWidth="1" />
                            </pattern>
                            <radialGradient id="elKropp" cx="36%" cy="32%" r="72%">
                                <stop offset="0" stopColor="#d6e9ff" />
                                <stop offset="0.38" stopColor="#5d9cf0" />
                                <stop offset="1" stopColor="#1a4aa3" />
                            </radialGradient>
                            <radialGradient id="elSken">
                                <stop offset="0" stopColor="rgba(46,110,230,0.38)" />
                                <stop offset="1" stopColor="rgba(46,110,230,0)" />
                            </radialGradient>
                            <radialGradient id="jonKropp" cx="36%" cy="32%" r="72%">
                                <stop offset="0" stopColor="#f6d2c6" />
                                <stop offset="1" stopColor="#c46a52" />
                            </radialGradient>
                            <radialGradient id="lampSken">
                                <stop offset="0" stopColor="rgba(255,196,40,0.75)" />
                                <stop offset="0.45" stopColor="rgba(255,190,40,0.32)" />
                                <stop offset="1" stopColor="rgba(255,190,40,0)" />
                            </radialGradient>
                            <radialGradient id="lampKarna">
                                <stop offset="0" stopColor="#fff3b0" />
                                <stop offset="1" stopColor="#f5b52e" />
                            </radialGradient>
                            <g id="elektron">
                                <circle r="9" fill="url(#elSken)" />
                                <circle r="5" fill="url(#elKropp)" stroke="#173f8c" strokeWidth="0.6" />
                                <rect x="-2.5" y="-0.7" width="5" height="1.4" rx="0.5" fill="#eef5ff" />
                            </g>
                        </defs>

                        <rect x="0" y="0" width={VB_W} height={VB_H} fill="url(#papper)" />
                        <rect x="0" y="0" width={VB_W} height={VB_H} fill="url(#rutnat)" />

                        {/* Lampans sken ligger under ledningen, som ljus på papperet */}
                        {componentType === 'bulb' && !isBroken && (
                            <circle ref={glowRef} cx={XR} cy={MID_Y} r="78" fill="url(#lampSken)" opacity="0" />
                        )}

                        {/* Ledningen: en genomskuren kopparledning som elektronerna rör sig i */}
                        <path d={WIRE_PATH} fill="none" stroke={INK} strokeWidth="21" strokeLinejoin="round" />
                        <path d={WIRE_PATH} fill="none" stroke="#e7cba0" strokeWidth="16.5" strokeLinejoin="round" />
                        <path d={WIRE_PATH} fill="none" stroke="#f3e2c6" strokeWidth="7" strokeLinejoin="round" />

                        {/* Resistorns metallgitter med positiva joner */}
                        {componentType === 'resistor' && (
                            <g>
                                <rect x={XR - 23} y={MID_Y - RES_HALF} width="46" height={2 * RES_HALF} fill="#e3cfae" />
                                {IONS.map((p, i) => (
                                    <g key={i} transform={`translate(${p.x} ${p.y})`}>
                                        <circle r="4.6" fill="url(#jonKropp)" stroke="#8f3a26" strokeWidth="0.7" />
                                        <path d="M -2.4 0 H 2.4 M 0 -2.4 V 2.4" stroke="#6e2615" strokeWidth="1.1" />
                                    </g>
                                ))}
                            </g>
                        )}

                        {/* Strömriktningen (från plus till minus) */}
                        <g display={showArrows && !blocked ? 'inline' : 'none'}>
                            {Array.from({ length: NUM_ARROWS }, (_, j) => (
                                <path key={j} ref={(n) => { arRefs.current[j] = n; }}
                                      d="M -5 -6 L 4 0 L -5 6" fill="none" stroke={ACCENT}
                                      strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
                            ))}
                        </g>

                        {/* Elektronerna */}
                        <g display={showElectrons ? 'inline' : 'none'}>
                            {seeds.current.map((e, i) => (
                                <use key={i} href="#elektron" ref={(n) => { elRefs.current[i] = n; }} />
                            ))}
                        </g>

                        {/* Komponenterna ritas ovanpå, så att elektronerna passerar bakom dem */}
                        {componentType === 'resistor' && (
                            <rect x={XR - 23} y={MID_Y - RES_HALF} width="46" height={2 * RES_HALF}
                                  fill="none" stroke={INK} strokeWidth="2.6" />
                        )}
                        {componentType === 'bulb' && <Bulb />}
                        <Source />

                        {/* Amperemeter på överledningen */}
                        <circle cx={AMP_X} cy={YT} r="17" fill={PAPER} stroke={INK} strokeWidth="2.4" />
                        <text x={AMP_X} y={YT + 1} textAnchor="middle" dominantBaseline="central"
                              fill={INK} fontSize="17" fontWeight="600">A</text>

                        {/* Värden */}
                        {showValues && (
                            <g fontSize="16" fill={INK}>
                                <text x={AMP_X} y={YT - 28} textAnchor="middle">
                                    <tspan fontStyle="italic">I</tspan> = {fmtI(iVisas)} A
                                </text>
                                <text x={XL + 40} y={MID_Y} dominantBaseline="central">
                                    <tspan fontStyle="italic">U</tspan> = {voltage} V
                                </text>
                                <text x={etikettX} y={MID_Y} textAnchor="end" dominantBaseline="central">
                                    <tspan fontStyle="italic">R</tspan> = {resistance} Ω
                                </text>
                            </g>
                        )}

                        {/* Teckenförklaring nere till vänster inne i kretsen */}
                        <g fontSize="13" fill={MUTED}>
                            {legend.map((typ, k) => {
                                const y = YB - 30 - k * 22;
                                const x = XL + 34;
                                if (typ === 'el') return (
                                    <g key={typ}>
                                        <use href="#elektron" transform={`translate(${x} ${y})`} />
                                        <text x={x + 14} y={y} dominantBaseline="central">Elektron (negativt laddad)</text>
                                    </g>
                                );
                                if (typ === 'jon') return (
                                    <g key={typ}>
                                        <g transform={`translate(${x} ${y})`}>
                                            <circle r="4.6" fill="url(#jonKropp)" stroke="#8f3a26" strokeWidth="0.7" />
                                            <path d="M -2.4 0 H 2.4 M 0 -2.4 V 2.4" stroke="#6e2615" strokeWidth="1.1" />
                                        </g>
                                        <text x={x + 14} y={y} dominantBaseline="central">Positiv jon i resistorns metall</text>
                                    </g>
                                );
                                return (
                                    <g key={typ}>
                                        <path d={`M ${x - 5} ${y - 6} L ${x + 4} ${y} L ${x - 5} ${y + 6}`} fill="none"
                                              stroke={ACCENT} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
                                        <text x={x + 14} y={y} dominantBaseline="central">Strömriktning</text>
                                    </g>
                                );
                            })}
                        </g>
                    </svg>
                    {overlay}
                </div>
            );
        };

        // Kompakt reglage-rad för inställningsrutan uppe till höger i
        // fullskärm: etikett + värde på en rad, glidaren under.
        const StSlider = ({ label, value, min, max, step, unit, onChange, formatValue }) => (
            <div className="st-slider">
                <div className="st-slider-top">
                    <span dangerouslySetInnerHTML={{ __html: label }} />
                    <span style={{ whiteSpace: 'nowrap', fontWeight: 600, color: 'var(--lab-ink, #0f1620)' }}>
                        {formatValue ? formatValue(value) : value} {unit}
                    </span>
                </div>
                <input type="range" min={min} max={max} step={step} value={value}
                       onChange={(e) => onChange(parseFloat(e.target.value))} />
            </div>
        );

        // Formelkortet: variabel med ord-etikett ovanför (och en osynlig
        // spacer under, så att symbolen linjerar med bråkens mittlinje).
        const Vbl = ({ label, children }) => (
            <div className="flex flex-col items-center" style={{ lineHeight: 1.1 }}>
                <span className="flbl">{label}</span>
                <span className="fnum">{children}</span>
                <span className="flbl" aria-hidden="true" style={{ visibility: 'hidden' }}>{label}</span>
            </div>
        );
        const Frac = ({ top, bottom, size = 19 }) => (
            <div className="flex flex-col items-center" style={{ lineHeight: 1.15, fontSize: size, color: 'var(--lab-ink)' }}>
                <span style={{ padding: '0 8px 3px' }}>{top}</span>
                <span style={{ padding: '3px 8px 0', borderTop: '2px solid currentColor', alignSelf: 'stretch', textAlign: 'center' }}>{bottom}</span>
            </div>
        );
        const FormulaCard = ({ U, R, I, broken }) => (
            <div className="glass-card rounded-xl p-4 mb-6 flex flex-wrap items-center gap-x-3 gap-y-3" style={{ color: 'var(--lab-ink)' }}>
                <Vbl label="Spänning"><em>U</em></Vbl>
                <span className="fnum">=</span>
                <Vbl label="Resistans"><em>R</em></Vbl>
                <span className="fnum">·</span>
                <Vbl label="Ström"><em>I</em></Vbl>
                <span className="fnum" style={{ margin: '0 4px' }}>⟺</span>
                <span className="fnum"><em>I</em> =</span>
                <Frac top={<em>U</em>} bottom={<em>R</em>} />
                {broken ? (
                    <span style={{ fontSize: 15, color: 'var(--lab-accent, #c8324a)', marginLeft: 6 }}>
                        Lampan är trasig. Kretsen är bruten och ingen ström går.
                    </span>
                ) : (
                    <React.Fragment>
                        <span className="fnum">=</span>
                        <Frac top={`${U} V`} bottom={`${R} Ω`} size={15} />
                        <span className="fnum">=</span>
                        <span className="fnum">{fmtI(I)} A</span>
                    </React.Fragment>
                )}
            </div>
        );

        const SEL = 'bg-cyan-500/30 text-cyan-300 border-2 border-cyan-400 btn-glow';
        const OSEL = 'bg-slate-800/50 text-slate-400 border border-slate-700 hover:border-slate-500';
        const Seg = ({ options, value, onChange }) => (
            <div className="flex gap-2">
                {options.map((o) => (
                    <button key={o.v} onClick={() => onChange(o.v)}
                            className={`flex-1 px-3 py-2.5 rounded-xl font-medium transition-all text-sm ${value === o.v ? SEL : OSEL}`}>
                        {o.t}
                    </button>
                ))}
            </div>
        );

        const App = () => {
            const [circuitType, setCircuitType] = useState(CircuitType.DC);
            const [displayMode, setDisplayMode] = useState('electrons');   // 'current' | 'electrons' | 'both'
            const [voltage, setVoltage] = useState(12);
            const [resistance, setResistance] = useState(10);
            const [frequency, setFrequency] = useState(1.0);
            const [isPaused, setIsPaused] = useState(false);
            const [isBulbBroken, setIsBulbBroken] = useState(false);
            const [batteryFlipped, setBatteryFlipped] = useState(false);
            const [showValues, setShowValues] = useState(true);
            const [componentType, setComponentType] = useState('bulb');   // 'bulb' | 'resistor'
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [togglesOpen, setTogglesOpen] = useState(true);
            const sceneWrapRef = useRef(null);

            useEffect(() => {
                const handler = () => {
                    setIsFullscreen(
                        document.fullscreenElement === sceneWrapRef.current ||
                        document.webkitFullscreenElement === sceneWrapRef.current
                    );
                };
                document.addEventListener('fullscreenchange', handler);
                document.addEventListener('webkitfullscreenchange', handler);
                return () => {
                    document.removeEventListener('fullscreenchange', handler);
                    document.removeEventListener('webkitfullscreenchange', handler);
                };
            }, []);

            const toggleFullscreen = () => {
                const el = sceneWrapRef.current;
                if (!el) return;
                const isFs = document.fullscreenElement || document.webkitFullscreenElement;
                if (isFs) {
                    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                } else {
                    (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
                }
            };

            const current = voltage / resistance;
            const broken = componentType === 'bulb' && isBulbBroken;

            // Lampan går sönder när strömmen når 24 A (bara när lampan sitter i kretsen)
            useEffect(() => {
                if (componentType === 'bulb' && current >= BREAK_CURRENT && !isBulbBroken) {
                    playBurnoutSound();
                    setIsBulbBroken(true);
                }
            }, [current, isBulbBroken, componentType]);

            const handleReplaceBulb = () => setIsBulbBroken(false);

            const sceneOverlay = (
                <>
                    <button className="fs-btn" onClick={toggleFullscreen} aria-label="Fullskärm"
                            title={isFullscreen ? 'Lämna fullskärm' : 'Fullskärm'}>
                        {isFullscreen ? (
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                <path d="M9 3v6H3"/><path d="M15 21v-6h6"/><path d="M21 9h-6V3"/><path d="M3 15h6v6"/>
                            </svg>
                        ) : (
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                <path d="M3 9V3h6"/><path d="M21 9V3h-6"/><path d="M3 15v6h6"/><path d="M21 15v6h-6"/>
                            </svg>
                        )}
                    </button>
                    {/* Inställningsrutan uppe till höger: hopfällbar, och i
                        fullskärm bor även glidarna här (placeringsregeln
                        2026-08-31). Rutans innehåll dubblerar sidopanelen,
                        så den visas bara i fullskärm. */}
                    {isFullscreen && (
                        !togglesOpen ? (
                            <button className="st-show-btn" onClick={() => setTogglesOpen(true)}
                                    aria-label="Visa inställningar" title="Visa inställningar" aria-expanded="false">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                     strokeWidth="2" strokeLinecap="round" aria-hidden="true">
                                    <line x1="4" y1="8" x2="20" y2="8" />
                                    <circle cx="14.5" cy="8" r="2.7" fill="currentColor" stroke="none" />
                                    <line x1="4" y1="16" x2="20" y2="16" />
                                    <circle cx="9.5" cy="16" r="2.7" fill="currentColor" stroke="none" />
                                </svg>
                            </button>
                        ) : (
                            <div className="scene-toggles">
                                <button className="st-hide" onClick={() => setTogglesOpen(false)}
                                        aria-label="Dölj inställningar" title="Dölj inställningar" aria-expanded="true">
                                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                         strokeWidth="2.4" strokeLinecap="round" aria-hidden="true">
                                        <path d="M6 6l12 12M18 6L6 18" />
                                    </svg>
                                </button>
                                <div className="st-title">Kretstyp</div>
                                <label>
                                    <input type="radio" name="fs-kretstyp" checked={circuitType === CircuitType.DC}
                                           onChange={() => setCircuitType(CircuitType.DC)} />
                                    Likström
                                </label>
                                <label>
                                    <input type="radio" name="fs-kretstyp" checked={circuitType === CircuitType.AC}
                                           onChange={() => setCircuitType(CircuitType.AC)} />
                                    Växelström
                                </label>
                                <div className="st-title mt">Visa</div>
                                <label>
                                    <input type="radio" name="fs-visning" checked={displayMode === 'electrons'}
                                           onChange={() => setDisplayMode('electrons')} />
                                    Elektroner
                                </label>
                                <label>
                                    <input type="radio" name="fs-visning" checked={displayMode === 'current'}
                                           onChange={() => setDisplayMode('current')} />
                                    Strömriktning
                                </label>
                                <label>
                                    <input type="radio" name="fs-visning" checked={displayMode === 'both'}
                                           onChange={() => setDisplayMode('both')} />
                                    Båda
                                </label>
                                <div className="st-title mt">Komponent</div>
                                <label>
                                    <input type="radio" name="fs-komponent" checked={componentType === 'bulb'}
                                           onChange={() => setComponentType('bulb')} />
                                    Glödlampa
                                </label>
                                <label>
                                    <input type="radio" name="fs-komponent" checked={componentType === 'resistor'}
                                           onChange={() => setComponentType('resistor')} />
                                    Resistor
                                </label>
                                <label style={{ marginTop: 7 }}>
                                    <input type="checkbox" checked={showValues}
                                           onChange={(e) => setShowValues(e.target.checked)} />
                                    Visa värden
                                </label>
                                <div className="st-title mt">Reglage</div>
                                <div className="st-sliders">
                                    <StSlider label="Spänning (<em>U</em>)" value={voltage}
                                              min={1} max={24} step={1} unit="V"
                                              onChange={(v) => setVoltage(v)} />
                                    <StSlider label="Resistans (<em>R</em>)" value={resistance}
                                              min={1} max={50} step={1} unit="Ω"
                                              onChange={(v) => setResistance(v)} />
                                    {circuitType === CircuitType.AC && (
                                        <StSlider label="Frekvens (<em>f</em>)" value={frequency}
                                                  min={0.2} max={5} step={0.1} unit="Hz"
                                                  formatValue={(v) => fmt(v, 1)}
                                                  onChange={(v) => setFrequency(v)} />
                                    )}
                                </div>
                                <div className="st-actions">
                                    <button className="st-btn" onClick={() => setIsPaused(prev => !prev)}>
                                        {isPaused ? 'Starta' : 'Pausa'}
                                    </button>
                                    {circuitType === CircuitType.DC && (
                                        <button className="st-btn" onClick={() => setBatteryFlipped(prev => !prev)}>
                                            Vänd batteriet
                                        </button>
                                    )}
                                    {broken && (
                                        <button className="st-btn" onClick={handleReplaceBulb}>
                                            Byt lampa
                                        </button>
                                    )}
                                </div>
                            </div>
                        )
                    )}
                </>
            );

            return (
                <div className="min-h-screen dark-container px-4 md:px-8 pb-12" style={{ fontFamily: "'DM Sans', sans-serif" }}>
                    <div className="max-w-6xl mx-auto pt-6">
                        <div className="breadcrumb mb-4" style={{ fontSize: 13 }}>
                            <a href="index.html">Hem</a> / <a href="katalog.html?id=fy1">Fysik nivå 1</a> / Elektriska kretsar
                        </div>
                        <h1 className="text-3xl md:text-4xl font-black tracking-tight" style={{ color: 'var(--lab-ink)' }}>Elektriska kretsar</h1>
                        <p className="mt-2 mb-5" style={{ color: 'var(--lab-ink-soft)', maxWidth: 820 }}>
                            Spänningen från batteriet driver <strong>elektronerna</strong> runt i kretsen. Hur stor
                            <strong> strömmen</strong> blir beror på <strong>resistansen</strong>: ju större resistans, desto
                            mindre ström vid samma spänning. Det sambandet är <strong>Ohms lag</strong>. Elektronerna darrar
                            hela tiden av värmerörelsen, men det är den långsamma driften längs ledningen som är strömmen.
                        </p>

                        <FormulaCard U={voltage} R={resistance} I={current} broken={broken} />

                        <div className="flex flex-col lg:flex-row gap-6">
                            {/* Scen och förklaringar */}
                            <div className="lg:w-2/3 order-1 flex flex-col gap-4">
                                <CircuitScene
                                    circuitType={circuitType}
                                    showElectrons={displayMode !== 'current'}
                                    showArrows={displayMode !== 'electrons'}
                                    current={current}
                                    voltage={voltage}
                                    resistance={resistance}
                                    frequency={frequency}
                                    isPaused={isPaused}
                                    isBroken={isBulbBroken}
                                    batteryFlipped={batteryFlipped}
                                    onBatteryClick={() => setBatteryFlipped(prev => !prev)}
                                    showValues={showValues}
                                    componentType={componentType}
                                    sceneWrapRef={sceneWrapRef}
                                    overlay={sceneOverlay}
                                />
                                {circuitType === CircuitType.DC && (
                                    <p className="text-sm" style={{ color: 'var(--lab-ink-muted)', marginTop: -4 }}>
                                        Klicka på batteriet för att vända det.
                                    </p>
                                )}

                            </div>

                            {/* Sidopanel med reglage */}
                            <div className="lg:w-1/3 order-2 flex flex-col gap-4">
                                <div className="glass-card p-4 rounded-xl">
                                    <div className="panel-rubrik">Kretstyp</div>
                                    <Seg value={circuitType} onChange={setCircuitType}
                                         options={[{ v: CircuitType.DC, t: 'Likström' }, { v: CircuitType.AC, t: 'Växelström' }]} />
                                    {circuitType === CircuitType.DC && (
                                        <button onClick={() => setBatteryFlipped(prev => !prev)}
                                                className={`w-full mt-3 px-4 py-2.5 rounded-xl font-medium transition-all text-sm ${batteryFlipped ? SEL : OSEL}`}>
                                            {batteryFlipped ? 'Batteriet är vänt' : 'Vänd batteriet'}
                                        </button>
                                    )}
                                </div>

                                <div className="glass-card p-4 rounded-xl">
                                    <div className="panel-rubrik">Visa</div>
                                    <Seg value={displayMode} onChange={setDisplayMode}
                                         options={[{ v: 'electrons', t: 'Elektroner' }, { v: 'current', t: 'Strömriktning' }, { v: 'both', t: 'Båda' }]} />
                                    <div className="panel-rubrik" style={{ marginTop: 16 }}>Komponent i kretsen</div>
                                    <Seg value={componentType} onChange={setComponentType}
                                         options={[{ v: 'bulb', t: 'Glödlampa' }, { v: 'resistor', t: 'Resistor' }]} />
                                    <label className="flex items-center gap-3 cursor-pointer mt-4">
                                        <input type="checkbox" checked={showValues}
                                               onChange={(e) => setShowValues(e.target.checked)}
                                               style={{ width: 18, height: 18, accentColor: 'var(--lab-accent)' }} />
                                        <span style={{ color: 'var(--lab-ink)' }}>Visa värden</span>
                                    </label>
                                </div>

                                <div className="glass-card p-4 rounded-xl">
                                    <div className="panel-rubrik">Reglage</div>
                                    <div className="space-y-5">
                                        <div>
                                            <div className="flex justify-between items-center mb-2">
                                                <label style={{ color: 'var(--lab-ink)' }}>Spänning (<em>U</em>)</label>
                                                <span className="font-mono px-2 py-1 rounded" style={{ color: 'var(--lab-ink)', border: '1px solid var(--lab-line)' }}>{voltage} V</span>
                                            </div>
                                            <input type="range" min="1" max="24" step="1" value={voltage}
                                                   onChange={(e) => setVoltage(parseFloat(e.target.value))} />
                                        </div>
                                        <div>
                                            <div className="flex justify-between items-center mb-2">
                                                <label style={{ color: 'var(--lab-ink)' }}>Resistans (<em>R</em>)</label>
                                                <span className="font-mono px-2 py-1 rounded" style={{ color: 'var(--lab-ink)', border: '1px solid var(--lab-line)' }}>{resistance} Ω</span>
                                            </div>
                                            <input type="range" min="1" max="50" step="1" value={resistance}
                                                   onChange={(e) => setResistance(parseFloat(e.target.value))} />
                                        </div>
                                        {circuitType === CircuitType.AC && (
                                            <div>
                                                <div className="flex justify-between items-center mb-2">
                                                    <label style={{ color: 'var(--lab-ink)' }}>Frekvens (<em>f</em>)</label>
                                                    <span className="font-mono px-2 py-1 rounded" style={{ color: 'var(--lab-ink)', border: '1px solid var(--lab-line)' }}>{fmt(frequency, 1)} Hz</span>
                                                </div>
                                                <input type="range" min="0.2" max="5" step="0.1" value={frequency}
                                                       onChange={(e) => setFrequency(parseFloat(e.target.value))} />
                                            </div>
                                        )}
                                    </div>
                                </div>

                                <div className="glass-card p-4 rounded-xl">
                                    <div className="flex items-center justify-between gap-3">
                                        <div>
                                            <div className="panel-rubrik" style={{ marginBottom: 2 }}>Strömmen</div>
                                            <div className="text-3xl font-bold" style={{ color: broken ? 'var(--lab-accent)' : 'var(--lab-ink)' }}>
                                                <em>I</em> = {fmtI(broken ? 0 : current)} A
                                            </div>
                                        </div>
                                        <button onClick={() => setIsPaused(prev => !prev)}
                                                className={`px-5 py-2.5 rounded-xl font-semibold transition-all ${isPaused ? SEL : OSEL}`}>
                                            {isPaused ? 'Starta' : 'Pausa'}
                                        </button>
                                    </div>
                                    {broken && (
                                        <div className="mt-4 p-3 rounded-lg" style={{ border: '1px solid var(--lab-accent)' }}>
                                            <div className="text-sm font-semibold mb-3" style={{ color: 'var(--lab-accent)' }}>
                                                Strömmen blev för stor och glödtråden brann av. Kretsen är bruten.
                                            </div>
                                            <button onClick={handleReplaceBulb}
                                                    className={`w-full px-4 py-2 rounded-lg font-semibold transition-all ${SEL}`}>
                                                Byt lampa
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-6">
                                    <div className="glass-card p-5 rounded-xl">
                                        <div className="panel-rubrik">{circuitType === CircuitType.DC ? 'Likström' : 'Växelström'}</div>
                                        <p className="text-sm leading-relaxed" style={{ color: 'var(--lab-ink-soft)' }}>
                                            {circuitType === CircuitType.DC
                                                ? <span>I en likströmskrets driver batteriet elektronerna åt ett och samma håll: från minuspolen, genom kretsen, till pluspolen. Den överenskomna <strong>strömriktningen</strong> är den motsatta, från plus till minus. Batterier och solceller ger likström.</span>
                                                : <span>I en växelströmskrets byter spänningen riktning hela tiden, och elektronerna svänger fram och tillbaka på ungefär samma ställe. De kommer ingenstans, men energin förs ändå vidare genom kretsen. Eluttagen i hemmet ger växelström med frekvensen 50&nbsp;Hz. Titta på lampan: den lyser starkast när strömmen är som störst.</span>}
                                        </p>
                                        {circuitType === CircuitType.DC && batteryFlipped && (
                                            <p className="text-sm mt-3" style={{ color: 'var(--lab-accent)' }}>
                                                Batteriet är vänt, så strömmen går nu åt andra hållet.
                                            </p>
                                        )}
                                    </div>
                                    <div className="glass-card p-5 rounded-xl">
                                        <div className="panel-rubrik">Varför ger en resistor motstånd?</div>
                                        <p className="text-sm leading-relaxed" style={{ color: 'var(--lab-ink-soft)' }}>
                                            I en metall sitter <strong>positiva joner</strong> i ett gitter, och elektronerna krockar med dem
                                            på vägen. Varje krock bromsar elektronerna, så det krävs en spänning för att hålla dem i rörelse.
                                            Byt till resistorn: inne i den studsar elektronerna mycket mer. Strömmen är ändå lika stor överallt
                                            i kretsen, så de driver lika fort där som i ledningen.
                                        </p>
                                    </div>
                                </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
