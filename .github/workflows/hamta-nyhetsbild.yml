# Hämtar fria pressbilder till nyhetsartiklar och committar dem i
# nyheter/bilder/.
#
# VARFÖR DEN FINNS
# Nyhetsagenten kan köras i en miljö vars utgående nätverk bara släpper
# igenom GitHub (t.ex. Claude Code på webben). Då går den fria pressbilden
# inte att ladda ner från NOIRLab, ESO, EurekAlert! eller Wikimedia — och
# artikeln får en AI-illustration fastän ett äkta foto finns. Den här
# körningen gör nedladdningen från en runner med fri nättrafik.
#
# ANVÄNDNING
# Skriv en rad per bild i .github/bildorder.txt och pusha:
#
#     <url> <filnamn>
#
# url är en bildsida ELLER en direktlänk; på en bildsida letas största
# jpg/png i sidans HTML upp automatiskt. filnamn hamnar i nyheter/bilder/.
# Rader som börjar med # hoppas över. Körningen committar bilderna på samma
# gren och tömmer beställningsfilen.
#
# Bilden skalas till högst 1920 px bred, EXIF strippas. Licensen kontrolleras
# INTE — det ansvaret ligger kvar hos den som väljer bilden. Se Bildregler i
# .claude/agents/nyhetsagent.md.

name: Hämta nyhetsbild

on:
  push:
    paths:
      - '.github/bildorder.txt'
  workflow_dispatch:

jobs:
  hamta:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Installera Pillow
        run: python3 -m pip install --quiet --break-system-packages pillow

      - name: Hämta bilderna
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36'
          MAXBREDD=1920

          [ -s .github/bildorder.txt ] || { echo "Ingen beställning"; exit 0; }

          while read -r url fil rest; do
            case "${url:-}" in ''|'#'*) continue ;; esac
            case "$fil" in */*|'') echo "fil ska vara ett filnamn utan katalog: $fil"; exit 1 ;; esac

            echo "=============================================================="
            echo "beställning: $url -> nyheter/bilder/$fil"

            typ=$(curl -sSL -A "$UA" -o /dev/null -w '%{content_type}' "$url")
            echo "content-type: $typ"

            if [ "${typ#image/}" != "$typ" ]; then
              bildurl="$url"
            else
              # Bildsida: leta upp arkivets jpg/png. Största varianten först.
              curl -sSL -A "$UA" "$url" -o sida.html
              echo "--- kandidater ---"
              grep -oE 'https?://[^"'"'"' ]+\.(jpg|jpeg|png)' sida.html | sort -u | tee kandidater.txt
              bildurl=$(grep -E '/(original|fullsize|large)/' kandidater.txt | head -1 || true)
              [ -n "$bildurl" ] || bildurl=$(grep -E '/(screen|publicationjpg|wallpaper)/' kandidater.txt | head -1 || true)
              [ -n "$bildurl" ] || { echo "Hittade ingen bildlänk på sidan"; exit 1; }
              echo "--- sidans metadata (bildtext/kredit) ---"
              grep -oE '<meta[^>]+(og:description|og:title)[^>]*>' sida.html | head -5 || true
            fi

            echo "laddar ner: $bildurl"
            curl -sSL -A "$UA" "$bildurl" -o rå.bin
            case "$(file -b --mime-type rå.bin)" in
              image/*) ;;
              *) echo "Nedladdad fil är ingen bild"; file rå.bin; exit 1 ;;
            esac

            mkdir -p nyheter/bilder
            # Bredden kapas men bilden förstoras aldrig. Sparas om utan EXIF.
            MAXBREDD="$MAXBREDD" IN=rå.bin UT="nyheter/bilder/$fil" python3 - <<'PY'
          import os
          from PIL import Image
          Image.MAX_IMAGE_PIXELS = None
          maxbredd = int(os.environ['MAXBREDD'])
          bild = Image.open(os.environ['IN'])
          print('original:', bild.size, bild.mode)
          if bild.width > maxbredd:
              höjd = round(bild.height * maxbredd / bild.width)
              bild = bild.resize((maxbredd, höjd), Image.LANCZOS)
          ut = os.environ['UT']
          if ut.lower().endswith(('.jpg', '.jpeg')):
              bild.convert('RGB').save(ut, 'JPEG', quality=84, optimize=True, progressive=True)
          else:
              bild.save(ut, optimize=True)
          print('sparad:', ut, Image.open(ut).size, os.path.getsize(ut), 'byte')
          PY
            ls -l "nyheter/bilder/$fil"
            rm -f rå.bin sida.html kandidater.txt
          done < .github/bildorder.txt

      - name: Committa bilderna
        run: |
          set -euo pipefail
          : > .github/bildorder.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nyheter/bilder .github/bildorder.txt
          git diff --cached --quiet && { echo "Inget nytt att committa"; exit 0; }
          git commit -m "Hämta pressbilder till nyheter"
          git push origin HEAD:${{ github.ref_name }}
