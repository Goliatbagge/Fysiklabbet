# Håller feed.xml, sitemap.xml och delningssidorna i takt med data/nyheter.js
# och data/begrepp.js.
#
# VARFÖR DEN LIGGER HÄR OCH INTE HOS NYHETSAGENTEN
# Poängen är att fånga misstag som agenten själv gör. En kontroll som agenten
# ska komma ihåg att köra hjälper inte den dag agenten glömmer steg 8 — då
# hoppas kontrollen över av precis samma skäl. Den här körs av GitHub, utan
# att någon behöver komma ihåg något.
#
# TVÅ BETEENDEN, EFTER VEM SOM ÄR NÄRVARANDE
#   push/PR   → bara kontroll, rött kryss vid drift. Här står författaren
#               kvar vid tangentbordet och ska få veta att byggskriptet inte
#               kördes. Att i stället tyst committa ovanpå någons push är
#               förvirrande, och går ändå inte för PR:er från forkar.
#   schema    → bygger om, committar och pushar själv. Ingen människa är
#   /manuell    inblandad: en framtidsdaterad artikel blir synlig på sajten
#               vid midnatt utan att någon pushar, och då är feed.xml och
#               sitemap.xml plötsligt inaktuella av sig själva. Fixen är
#               deterministisk (kör byggskriptet), så den behöver inte gå
#               omvägen via ett mejl och en människa.
#
# Misslyckas körningen ändå mejlar GitHub repots ägare automatiskt.

name: Verifiera sitemap och RSS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Varje timme, tjugotre minuter över. TIDPUNKTEN ÄR VALD MED OMSORG — läs
  # det här innan du glesar ut schemat igen.
  #
  # Vad som går sönder utan att någon rör något: en datumgrindad artikel blir
  # synlig på sajten i samma stund som klockan passerar dess datum (midnatt
  # svensk tid, eller den time: artikeln anger). Då är feed.xml och sitemap.xml
  # inaktuella på fläcken, utan att någon har pushat. De lagas först när det
  # här jobbet kör.
  #
  # Varför en gång om dygnet inte räckte: fram till körningen ger VARJE push
  # till main ett rött kryss och ett mejl till ägaren, fast författaren inte
  # gjort något fel. Och GitHub kör inte cron på utsatt tid — schemat är en
  # tidigast-tid. I slutet av augusti 2026 sköts körningarna upp 5–12 timmar
  # (27 aug: 06:00 → 17:26, 28 aug: 06:00 → 18:20, 31 aug: 06:00 → 13:03).
  # Fyra pushar den 31 augusti och två den 1 september blev röda i det glappet.
  #
  # Två saker följer av det:
  #   * :00 undviks. Där ligger hela världens cron-jobb, och förseningen är
  #     som värst just då. En udda minut ger kortare kö.
  #   * Varje timme, inte varje dygn. Blir en körning uppskjuten tar nästa vid
  #     en timme senare i stället för ett dygn senare. Det kostar ingenting:
  #     repot är publikt, och jobbet gatear på verifieraren — är allt i takt
  #     avslutas det på någon sekund utan att committa.
  schedule:
    - cron: '23 * * * *'
  # Går även att starta för hand från fliken Actions ("bygg om nu"-knappen).
  workflow_dispatch:

jobs:
  # ── Push och PR: kontrollera bara ────────────────────────────────────────
  verifiera:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Datumgrinden i build-nyheter-og.js läser LOKAL klocka, och runnern går i
    # UTC — två timmar efter svensk tid på sommaren. Utan detta räknas en
    # artikel med time: "07:00" som opublicerad här fastän den redan syns på
    # sajten. Måste vara samma tidszon i båda jobben.
    env:
      TZ: Europe/Stockholm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Kontrollera feed.xml, sitemap.xml och delningssidor
        run: node .claude/verify-sitemap.js

  # ── Schema och manuell start: laga vid drift ─────────────────────────────
  lag-i-takt:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Europe/Stockholm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bygg om vid drift och committa
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Tre försök, för att en push till main mitt i körningen inte ska bli
          # ett mejl om ett problem som inte finns. Bygget är deterministiskt:
          # blir vår push avvisad hämtar vi den nya spetsen och gör om alltihop
          # på den grunden.
          for forsok in 1 2 3; do
            # Gatea på VERIFIERAREN, aldrig på `git diff`. feed.xml innehåller
            # <lastBuildDate>, en tidsstämpel som ändras varje gång byggskriptet
            # körs; verifieraren ignorerar den men git gör det inte. Byggde vi om
            # ovillkorligt skulle det bli en skräpcommit varje timme — och en
            # Pages-omdeploy på köpet.
            if node .claude/verify-sitemap.js; then
              echo "Allt i takt — ingenting att göra."
              exit 0
            fi

            echo "== Drift upptäckt (försök $forsok), bygger om =="
            node data/build-nyheter-og.js

            # Andra rundan får inte fela. Gör den det är driften något annat än
            # ett oskrivet bygge, och då ska körningen bli röd och mejla.
            node .claude/verify-sitemap.js

            git add feed.xml sitemap.xml nyheter/dela katalog/dela data/begrepp-sok.js
            git diff --cached --quiet && { echo "Inget att committa"; exit 0; }
            git commit -m "Bygg om RSS och sitemap (automatisk körning)"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "== Push avvisad: main har flyttat sig. Gör om på ny grund =="
            # Vår commit byggdes på en grund som inte längre är spetsen, så den
            # slängs. FETCH_HEAD i stället för origin/main: checkout-actionen
            # hämtar grunt och konfigurerar en smal refspec, så fjärrgrenen
            # finns inte alltid som lokal referens.
            git fetch origin main
            git reset --hard FETCH_HEAD
          done

          echo "Kunde inte pusha efter tre försök — main ändras snabbare än bygget hinner."
          exit 1
