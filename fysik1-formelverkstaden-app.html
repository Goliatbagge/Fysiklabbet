                                                {svar && <button className="btn-toggle flex-1" onClick={() => startaGissa('uttryck')}>Ny uppgift</button>}
                                                <button className="btn-toggle flex-1" onClick={avslutaGissa}>Avsluta</button>
                                            </div>
                                        </div>
                                    )}
                                    {gissa && gissa.typ === 'felet' && (
                                        <div>
                                            <p className="text-sm mb-2" style={{ color: 'var(--lab-ink)' }}>
                                                Någon har löst ut <span className="mx" style={{ fontSize: 17 }}><SymBas k={gissa.k} /></span> ur {UR[gissa.F.id]}, men en rad blev fel. Klicka på den raden i uträkningen.
                                            </p>
                                            {svar && <p className="text-sm mb-2" style={{ color: svar.ratt ? '#15803d' : 'var(--lab-accent)' }}>{svar.text}</p>}
                                            <div className="flex gap-2">
                                                {svar && <button className="btn-toggle flex-1" onClick={() => startaGissa('felet')}>Ny uppgift</button>}
                                                <button className="btn-toggle flex-1" onClick={() => { avslutaGissa(); borjaOm(); }}>Avsluta</button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </main>

                        <div className="grid md:grid-cols-3 gap-4 mt-6">
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Samma sak i båda led</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    En formel säger att två saker är lika stora. Multiplicerar du båda med samma tal är de fortfarande lika stora, och
                                    likadant när du dividerar (men aldrig med noll), adderar eller subtraherar. Gör du något med bara det ena ledet slutar likheten att gälla.
                                </p>
                            </div>
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Gör det motsatta</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    För att få en storhet ensam gör du motsatsen till det som görs med den. Multipliceras den med något dividerar
                                    du båda led med det. Står den i nämnaren multiplicerar du med den. Adderas något till den subtraherar du det från
                                    båda led, och tvärtom. Är den i kvadrat drar du roten ur.
                                </p>
                            </div>
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Kontrollera enheten</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Sätt in enheterna i det nya uttrycket. Blir enheten rätt för den storhet du löst ut är det ett gott tecken. Blir den
                                    fel har något hamnat på fel plats, till exempel i täljaren i stället för i nämnaren. Ett tappat tal, som en
                                    tvåa, syns däremot inte i enheten.
                                </p>
                            </div>
                        </div>

                        <details className="glass-card rounded-xl p-4 mt-4">
                            <summary className="accordion-head" style={{ color: 'var(--lab-ink)' }}>
                                <span>Vanliga missuppfattningar</span><span style={{ color: 'var(--lab-ink-muted)' }}>▾</span>
                            </summary>
                            <ul className="mt-3 space-y-2 text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                <li><strong>”Man flyttar över och byter tecken.”</strong> Det är en genväg som fungerar, men det som egentligen händer är att samma
                                    term subtraheras från eller adderas till båda led. Den som vet det byter aldrig tecken på fel term.</li>
                                <li><strong>”Står <em>t</em> i nämnaren kan man flytta upp den genom att stryka bråkstrecket.”</strong> Nej. Båda led multipliceras med <em>t</em>. Då
                                    förkortas den bort i det ena ledet och hamnar i täljaren i det andra.</li>
                                <li><strong>”I <span className="mx" style={{ fontSize: 17 }}><Brak t={<span><em>v</em> − <em>v</em><sub>0</sub></span>} n={<em>a</em>} /></span> räcker det att dividera <em>v</em> med <em>a</em>.”</strong> Nej. Hela täljaren divideras,
                                    och därför står den över ett gemensamt bråkstreck.</li>
                                <li><strong>”Roten ur <span style={{ whiteSpace: 'nowrap' }}><em>v</em><sub>0</sub><sup>2</sup> + 2 · <em>a</em> · <em>s</em></span> är <span style={{ whiteSpace: 'nowrap' }}><em>v</em><sub>0</sub> + √(2 · <em>a</em> · <em>s</em>)</span>.”</strong> Nej. Roten ur en summa
                                    är inte summan av rötterna. Pröva med tal: √(9 + 16) = 5, men √9 + √16 = 7.</li>
                                <li><strong>”Formeltriangeln fungerar för alla formler.”</strong> Bara för formler där en storhet är produkten av två andra,
                                    som <em>U</em> = <em>R</em> · <em>I</em>. För <span style={{ whiteSpace: 'nowrap' }}><em>v</em> = <em>v</em><sub>0</sub> + <em>a</em> · <em>t</em></span> behövs operationer i båda led.</li>
                            </ul>
                        </details>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script src="feedback.js" defer></script>
    <script src="sim-dock.js" defer></script>
    <script src="data/katalog.js"></script>
    <script src="section-nav.js"></script>
    <!-- Cloudflare Web Analytics: cookiefri besöksmätning, se CLAUDE.md. -->
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js"
            data-cf-beacon='{"token": "366677ecfe014a76b73f5bc78a489e0e"}'></script>
</body>
