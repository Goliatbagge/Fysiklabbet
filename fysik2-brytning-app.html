    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
        /* Kort, reglage och rubriker stylas centralt av styles-laborans-sim.css
           (papperstemat). Scenen ritas helt i laboranstemat: pappersbotten
           med rutnät, glas i kall blå ton och en laser med mörk kärna som
           håller kontrast mot papperet (omdesign 2026-09-14). */
        .scene-wrap {
            position: relative;
            border-radius: 4px;
            overflow: hidden;
            width: 100%;
            aspect-ratio: 16 / 9;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        .scene-wrap svg text { user-select: none; -webkit-user-select: none; }
        .scene-wrap:fullscreen,
        .scene-wrap:-webkit-full-screen {
            background: var(--lab-bg);
            border-radius: 0;
            width: 100vw !important;
            height: 100vh !important;
        }
        .scene-wrap > svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Inställningsrutan uppe till höger (bara i fullskärm — i normal-
           läget bor reglagen i sidopanelen). Hopfällbarheten
           (.st-hide/.st-show-btn) och reglageraderna (.st-slider) är
           centrala klasser i styles-laborans-sim.css. Se placeringsregeln
           i CLAUDE.md (omskriven 2026-08-31; bottenpanelen .fs-controls
           skymde den brutna strålen i det undre mediet medan man drog i
           infallsvinkeln). */
        .scene-toggles {
            position: absolute; top: 14px; right: 14px; z-index: 6;
            background: rgba(246,242,234,0.94);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
            border: 1px solid var(--lab-line-strong, rgba(15,22,32,0.28));
            border-radius: 10px; padding: 9px 13px;
            display: flex; flex-direction: column; gap: 6px;
            box-shadow: 0 2px 8px rgba(15,22,32,0.12);
            width: 252px;
            font-family: 'Poppins', sans-serif;
        }
        .scene-toggles .st-title {
            font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase;
            color: var(--lab-ink-muted, #5a6170); font-weight: 600;
        }
        .scene-toggles .st-rad-topp {
            display: flex; align-items: center; justify-content: space-between;
            gap: 8px; font-size: 12.5px; color: var(--lab-ink-soft, #3a4151);
        }
        .scene-toggles .st-val { font-weight: 600; color: var(--lab-ink, #0f1620); white-space: nowrap; }
        .scene-toggles label {
            display: flex; align-items: center; gap: 6px; cursor: pointer;
            font-size: 12.5px; color: var(--lab-ink, #0f1620);
        }
        .scene-toggles input[type="radio"], .scene-toggles input[type="checkbox"] { cursor: pointer; }
        .scene-toggles .st-radgrupp { display: flex; flex-wrap: wrap; gap: 4px 14px; }
        .fs-materials { display: flex; gap: 5px; flex-wrap: wrap; }
        .fs-mat-btn {
            padding: 4px 10px;
            font-size: 0.75rem;
            border-radius: 6px;
            background: var(--lab-bg-panel, #ffffff);
            border: 1px solid var(--lab-line-strong, rgba(15,22,32,0.28));
            color: var(--lab-ink, #0f1620);
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: background 0.15s ease, border-color 0.15s ease;
        }
        .fs-mat-btn.active {
            background: var(--lab-ink, #0f1620);
            border-color: var(--lab-ink, #0f1620);
            color: var(--lab-bg, #f3eee4);
        }
        .fs-mat-btn:hover:not(.active) { border-color: var(--lab-accent, #c8324a); }

        /* Mobil: formeln får aldrig radbrytas — behåll EN rad och skrolla
           kortet i sidled i stället. Scenetiketten "Luft (n1 = ...)" flyttas
           åt höger så att den inte hamnar under fullskärmsknappen. */
        @media (max-width: 600px) {
            .formula-scroll { flex-wrap: nowrap !important; overflow-x: auto;
                              justify-content: flex-start;
                              -webkit-overflow-scrolling: touch; }
            .formula-scroll > * { flex-shrink: 0; }
            .formula-scroll .text-2xl { font-size: 1.15rem; }
            .formula-scroll .text-xl { font-size: 1rem; }
            .formula-scroll .text-xs { font-size: 0.62rem; }
            .medium1-label { transform: translate(120px, 0); }
        }

    <script type="text/babel">
        const { useState, useRef, useCallback, useMemo, useEffect } = React;

        const Slider = ({ id, label, value, min, max, step, onChange, displayPrecision = 2, suffix = '' }) => {
            return (
                <div className="flex flex-col gap-2">
                    <div className="flex justify-between text-sm">
                        <label htmlFor={id} className="text-slate-400">{label}</label>
                        <span className="font-mono text-cyan-400">{value.toFixed(displayPrecision).replace('.', ',')}{suffix}</span>
                    </div>
                    <input
                        id={id}
                        type="range"
                        min={min}
                        max={max}
                        step={step}
                        value={value}
                        onChange={onChange}
                        className="w-full appearance-none cursor-pointer"
                    />
                </div>
            );
        };

        const MATERIALS = [
            { name: 'Luft', n: 1.00 },
            { name: 'Vatten', n: 1.33 },
            { name: 'Glas', n: 1.52 },
            { name: 'Diamant', n: 2.42 }
        ];

        const MaterialButtons = ({ value, onSelect }) => (
            <div className="flex gap-1.5 flex-wrap">
                {MATERIALS.map(m => {
                    const active = Math.abs(value - m.n) < 0.005;
                    return (
                        <button
                            key={m.name}
                            type="button"
                            onClick={() => onSelect(m.n)}
                            className="px-2.5 py-1 text-xs rounded-md transition"
                            style={active ? {
                                background: 'var(--lab-ink, #0f1620)',
                                border: '1px solid var(--lab-ink, #0f1620)',
                                color: 'var(--lab-bg, #f3eee4)'
                            } : {
                                background: 'var(--lab-bg-panel, #ffffff)',
                                border: '1px solid var(--lab-line-strong, rgba(15,22,32,0.28))',
                                color: 'var(--lab-ink, #0f1620)'
                            }}
                        >
                            {m.name}
                        </button>
                    );
                })}
            </div>
        );

        const ControlsView = ({ n1, setN1, n2, setN2, incidentAngle, setIncidentAngle, showReflected, setShowReflected, showAngles, setShowAngles, angleDisplay, setAngleDisplay, laserColor, setLaserColor, layerMode, setLayerMode }) => {
            const theta1Rad = incidentAngle * (Math.PI / 180);
            const sinTheta2 = (n1 / n2) * Math.sin(theta1Rad);
            const isTIR = Math.abs(sinTheta2) > 1;
            const theta2 = isTIR ? 0 : -Math.asin(sinTheta2) * (180 / Math.PI);

            return (
                <div className="glass-card p-6 h-full flex flex-col gap-6">
                    <div>
                        <h2 className="text-xl font-semibold text-cyan-400 mb-2">Inställningar</h2>
                        <p className="text-sm text-slate-400">
                            Justera parametrarna med reglagen nedan, eller dra i ljusstrålen för att ändra infallsvinkeln.
                        </p>
                    </div>

                    <div className="space-y-6">
                        <Slider
                            id="incident-angle"
                            label={<>Infallsvinkel (<i>i</i><sub>1</sub>)</>}
                            min={-89.9}
                            max={89.9}
                            step={0.1}
                            value={incidentAngle}
                            onChange={(e) => setIncidentAngle(parseFloat(e.target.value))}
                            displayPrecision={1}
                            suffix="°"
                        />
                        <div className="flex flex-col gap-2">
                            <Slider
                                id="n1-slider"
                                label={<>Brytningsindex medium 1 (<i>n</i>₁)</>}
                                min={1.00}
                                max={2.50}
                                step={0.01}
                                value={n1}
                                onChange={(e) => setN1(parseFloat(e.target.value))}
                            />
                            <MaterialButtons value={n1} onSelect={setN1} />
                        </div>
                        <div className="flex flex-col gap-2">
                            <Slider
                                id="n2-slider"
                                label={<>Brytningsindex block (<i>n</i>₂)</>}
                                min={1.00}
                                max={2.50}
                                step={0.01}
                                value={n2}
                                onChange={(e) => setN2(parseFloat(e.target.value))}
                            />
                            <MaterialButtons value={n2} onSelect={setN2} />
                        </div>

                        <div className="pt-1">
                            <span className="text-sm text-slate-400 block mb-2">Antal skikt</span>
                            <div className="flex flex-col gap-1.5">
                                <label className="flex items-center gap-2 cursor-pointer select-none">
                                    <input
                                        type="radio"
                                        name="layer-mode"
                                        value="three"
                                        checked={layerMode === 'three'}
                                        onChange={() => setLayerMode('three')}
                                        className="w-4 h-4 cursor-pointer"
                                        style={{ accentColor: '#c8324a' }}
                                    />
                                    <span className="text-sm text-slate-300">Tre skikt (medium 1 + 2 + 1)</span>
                                </label>
                                <label className="flex items-center gap-2 cursor-pointer select-none">
                                    <input
                                        type="radio"
                                        name="layer-mode"
                                        value="two"
                                        checked={layerMode === 'two'}
                                        onChange={() => setLayerMode('two')}
                                        className="w-4 h-4 cursor-pointer"
                                        style={{ accentColor: '#c8324a' }}
                                    />
                                    <span className="text-sm text-slate-300">Två skikt (medium 1 + 2)</span>
                                </label>
                            </div>
                        </div>

                        <label htmlFor="show-reflected" className="flex items-center gap-3 cursor-pointer select-none pt-1">
                            <input
                                id="show-reflected"
                                type="checkbox"
                                checked={showReflected}
                                onChange={(e) => setShowReflected(e.target.checked)}
                                className="w-4 h-4 cursor-pointer"
                                style={{ accentColor: '#c8324a' }}
                            />
                            <span className="text-sm text-slate-300">Visa reflekterade strålar</span>
                        </label>

                        <div className="flex flex-col gap-2">
                            <label htmlFor="show-angles" className="flex items-center gap-3 cursor-pointer select-none">
                                <input
                                    id="show-angles"
                                    type="checkbox"
                                    checked={showAngles}
                                    onChange={(e) => setShowAngles(e.target.checked)}
                                    className="w-4 h-4 cursor-pointer"
                                    style={{ accentColor: '#c8324a' }}
                                />
                                <span className="text-sm text-slate-300">Visa vinklar</span>
                            </label>
                            {showAngles && (
                                <div className="flex flex-col gap-1.5 ml-7">
                                    <label className="flex items-center gap-2 cursor-pointer select-none">
                                        <input
                                            type="radio"
                                            name="angle-display"
                                            value="labels"
                                            checked={angleDisplay === 'labels'}
                                            onChange={() => setAngleDisplay('labels')}
                                            className="w-4 h-4 cursor-pointer"
                                            style={{ accentColor: '#c8324a' }}
                                        />
                                        <span className="text-sm text-slate-300">Beteckningar</span>
                                    </label>
                                    <label className="flex items-center gap-2 cursor-pointer select-none">
                                        <input
                                            type="radio"
                                            name="angle-display"
                                            value="values"
                                            checked={angleDisplay === 'values'}
                                            onChange={() => setAngleDisplay('values')}
                                            className="w-4 h-4 cursor-pointer"
                                            style={{ accentColor: '#c8324a' }}
                                        />
                                        <span className="text-sm text-slate-300">Värden</span>
                                    </label>
                                </div>
                            )}
                        </div>

                        <div className="pt-1">
                            <span className="text-sm text-slate-400 block mb-2">Laserfärg</span>
                            <div className="flex gap-4">
                                <label className="flex items-center gap-2 cursor-pointer select-none">
                                    <input
                                        type="radio"
                                        name="laser-color"
                                        value="green"
                                        checked={laserColor === 'green'}
                                        onChange={() => setLaserColor('green')}
                                        className="w-4 h-4 cursor-pointer"
                                        style={{ accentColor: '#22c55e' }}
                                    />
                                    <span className="text-sm text-slate-300">Grön</span>
                                </label>
                                <label className="flex items-center gap-2 cursor-pointer select-none">
                                    <input
                                        type="radio"
                                        name="laser-color"
                                        value="red"
                                        checked={laserColor === 'red'}
                                        onChange={() => setLaserColor('red')}
                                        className="w-4 h-4 cursor-pointer"
                                        style={{ accentColor: '#ef4444' }}
                                    />
                                    <span className="text-sm text-slate-300">Röd</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div className="mt-4 pt-6 space-y-3" style={{ borderTop: '1px solid var(--lab-line-strong, rgba(15,22,32,0.28))' }}>
                        <div className="flex justify-between items-center p-3 rounded-lg"
                             style={{ background: 'var(--lab-bg-panel, #ffffff)', border: '1px solid var(--lab-line, rgba(15,22,32,0.12))' }}>
                            <span className="text-slate-300">Infallsvinkel (<i>i</i><sub>1</sub>):</span>
                            <span className="font-mono text-lg text-cyan-300">{incidentAngle.toFixed(1).replace('.', ',')}°</span>
                        </div>
                        <div className="flex justify-between items-center p-3 rounded-lg"
                             style={{ background: 'var(--lab-bg-panel, #ffffff)', border: '1px solid var(--lab-line, rgba(15,22,32,0.12))' }}>
                            <span className="text-slate-300">Brytningsvinkel (<i>b</i><sub>1</sub>):</span>
                            {isTIR ? (
                                <span className="font-semibold text-sm text-right" style={{ color: 'var(--lab-accent, #c8324a)' }}>Total intern reflektion</span>
                            ) : (
                                <span className="font-mono text-lg text-cyan-300">{theta2.toFixed(1).replace('.', ',')}°</span>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const SimulationView = ({ n1, setN1, n2, setN2, incidentAngle, setIncidentAngle, showReflected, setShowReflected, showAngles, setShowAngles, angleDisplay, setAngleDisplay, laserColor, setLaserColor, layerMode, setLayerMode }) => {
            const svgRef = useRef(null);
            const sceneWrapRef = useRef(null);
            const [isDragging, setIsDragging] = useState(false);
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [togglesOpen, setTogglesOpen] = useState(true);

            const isRedLaser = laserColor === 'red';
            // Laserfärger för den ljusa pappersscenen: en mörk, mättad kärna
            // som håller kontrast mot papperet, en tunn ljus mittlinje (den
            // "heta" kärnan) och ett mjukt sken i en ljusare ton runt om.
            // Neongrönt (#39ff14) mot papper gav en stråle som knappt syntes
            // (påpekat 2026-09-14).
            const LASER = isRedLaser
                ? { core: '#b91c1c', hot: '#fecaca', glow: '#f87171', aperture: '#fecaca' }
                : { core: '#15803d', hot: '#bbf7d0', glow: '#4ade80', aperture: '#bbf7d0' };
            const rayColor = LASER.core;
            const apertureCenterColor = LASER.aperture;
            const glowEdgeColor = LASER.glow;

            useEffect(() => {
                const handler = () => {
                    setIsFullscreen(
                        document.fullscreenElement === sceneWrapRef.current ||
                        document.webkitFullscreenElement === sceneWrapRef.current
                    );
                };
                document.addEventListener('fullscreenchange', handler);
                document.addEventListener('webkitfullscreenchange', handler);
                return () => {
                    document.removeEventListener('fullscreenchange', handler);
                    document.removeEventListener('webkitfullscreenchange', handler);
                };
            }, []);

            const toggleFullscreen = () => {
                const el = sceneWrapRef.current;
                if (!el) return;
                const isFs = document.fullscreenElement || document.webkitFullscreenElement;
                if (isFs) {
                    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                } else {
                    (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
                }
            };

            const isTwoLayer = layerMode === 'two';

            const VIEWBOX_WIDTH = 800;
            const VIEWBOX_HEIGHT = 450;
            const BLOCK_Y = isTwoLayer ? VIEWBOX_HEIGHT / 2 : 125;
            const BLOCK_HEIGHT = 200;
            const ENTRY_X = VIEWBOX_WIDTH / 2;
            const RAY_LENGTH = 175;
            const PEN_DIST = 95;
            const PEN_BODY_LEN = 84;
            const PEN_BODY_H = 14;

            const effectiveBlockHeight = isTwoLayer ? VIEWBOX_HEIGHT - BLOCK_Y : BLOCK_HEIGHT;

            const calculations = useMemo(() => {
                const theta1Rad = incidentAngle * (Math.PI / 180);
                const sinTheta2 = (n1 / n2) * Math.sin(theta1Rad);
                const isTIR = n1 > n2 && Math.abs(sinTheta2) > 1;
                const theta2Rad = isTIR ? 0 : -Math.asin(sinTheta2);

                const penTip = {
                    x: ENTRY_X + PEN_DIST * Math.sin(theta1Rad),
                    y: BLOCK_Y - PEN_DIST * Math.cos(theta1Rad)
                };
                const p2 = { x: ENTRY_X, y: BLOCK_Y };

                let p3, p4;

                if (isTIR) {
                    p3 = {
                        x: ENTRY_X - RAY_LENGTH * Math.sin(theta1Rad),
                        y: BLOCK_Y - RAY_LENGTH * Math.cos(theta1Rad)
                    };
                    p4 = p3;
                } else if (isTwoLayer) {
                    const dy = VIEWBOX_HEIGHT - BLOCK_Y;
                    const internalDx = dy * Math.tan(theta2Rad);
                    p3 = { x: ENTRY_X + internalDx, y: VIEWBOX_HEIGHT };
                    p4 = p3;
                } else {
                    const internalDx = BLOCK_HEIGHT * Math.tan(theta2Rad);
                    p3 = { x: ENTRY_X + internalDx, y: BLOCK_Y + BLOCK_HEIGHT };

                    p4 = {
                        x: p3.x - RAY_LENGTH * Math.sin(theta1Rad),
                        y: p3.y + RAY_LENGTH * Math.cos(theta1Rad)
                    };
                }

                // Reflekterad stråle vid övre gränsytan (partiell reflektion, tillbaka in i medium 1)
                const pR = {
                    x: ENTRY_X - RAY_LENGTH * Math.sin(theta1Rad),
                    y: BLOCK_Y - RAY_LENGTH * Math.cos(theta1Rad)
                };

                // Reflekterad stråle vid undre gränsytan (partiell reflektion, tillbaka in i medium 2)
                let pR2 = null;
                if (!isTIR && !isTwoLayer) {
                    pR2 = {
                        x: p3.x + RAY_LENGTH * Math.sin(theta2Rad),
                        y: p3.y - RAY_LENGTH * Math.cos(theta2Rad)
                    };
                }

                return { penTip, p2, p3, p4, pR, pR2, theta1Rad, theta2Rad, isTIR };
            }, [incidentAngle, n1, n2, isTwoLayer]);

            const { penTip, p2, p3, p4, pR, pR2, theta1Rad, theta2Rad, isTIR } = calculations;

            // Materialberoende opacitet: luft (n=1) → nästan osynlig medium-effekt,
            // glas/diamant → tydlig och briljant. Skalar specular och kropp gemensamt.
            const glassOpacity = Math.min(1.0, Math.max(0.16, (n2 - 1) * 1.05 + 0.16));
            const medium1Opacity = Math.min(1.0, Math.max(0, (n1 - 1) * 1.05));

            // Strålens delsträckor: huvudstrålen (heldragen) och de partiellt
            // reflekterade strålarna (streckade). Ritas i tre lager: sken,
            // kärna och het mittlinje (se LASER ovan).
            const beam = [[penTip, p2], [p2, p3]];
            if (!isTIR && !isTwoLayer) beam.push([p3, p4]);
            const reflected = [];
            if (showReflected && !isTIR) {
                reflected.push([p2, pR]);
                if (pR2) reflected.push([p3, pR2]);
            }
            const segLines = (segs, props) => segs.map(([a, b], k) =>
                <line key={k} x1={a.x} y1={a.y} x2={b.x} y2={b.y} {...props} />);
            // Riktningspil mitt på en delsträcka (markören ritar själva spetsen)
            const midArrow = ([a, b], k, w, op) => {
                const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
                const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
                return <line key={k} x1={mx} y1={my} x2={mx + dx / len} y2={my + dy / len}
                             stroke={rayColor} strokeWidth={w} opacity={op} markerEnd="url(#arrow)" />;
            };

            const theta1Deg = Math.abs(incidentAngle);
            const theta2Deg = isTIR ? 0 : Math.abs(theta2Rad * 180 / Math.PI);
            const showAngleValues = angleDisplay === 'values';
            const fmtDeg = (d) => d.toFixed(1).replace('.', ',');
            const getMediumLabel = (n, fallback) => {
                const mat = MATERIALS.find(m => Math.abs(n - m.n) < 0.005);
                return mat ? mat.name : fallback;
            };

            const handleInteraction = useCallback((e) => {
                if (!svgRef.current) return;

                let clientX, clientY;
                if (e.touches) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }

                const svg = svgRef.current;
                const ctm = svg.getScreenCTM();
                if (!ctm) return;
                const pt = svg.createSVGPoint();
                pt.x = clientX;
                pt.y = clientY;
                const svgP = pt.matrixTransform(ctm.inverse());

                const dx = svgP.x - p2.x;
                let dy = svgP.y - p2.y;
                if (dy >= 0) dy = -0.01;

                const angleRad = Math.atan2(dx, -dy);
                const angleDeg = angleRad * (180 / Math.PI);

                const clampedAngle = Math.max(-89.9, Math.min(89.9, angleDeg));
                setIncidentAngle(clampedAngle);

            }, [p2.x, p2.y, setIncidentAngle]);

            const handleMouseDown = (e) => {
                setIsDragging(true);
                handleInteraction(e);
            };

            const handleMouseUp = () => setIsDragging(false);

            const handleMouseMove = (e) => {
                if (isDragging) {
                    handleInteraction(e);
                }
            };

            const handleTouchStart = (e) => {
                setIsDragging(true);
                handleInteraction(e);
            };

            const handleTouchMove = (e) => {
                if (isDragging) {
                    e.preventDefault();
                    handleInteraction(e);
                }
            };

            const getArcPath = (cx, cy, radius, angle1Rad, angle2Rad) => {
                const startAngleRad = Math.min(angle1Rad, angle2Rad);
                const endAngleRad = Math.max(angle1Rad, angle2Rad);

                const startX = cx + radius * Math.sin(startAngleRad);
                const startY = cy - radius * Math.cos(startAngleRad);
                const endX = cx + radius * Math.sin(endAngleRad);
                const endY = cy - radius * Math.cos(endAngleRad);

                return `M ${startX} ${startY} A ${radius} ${radius} 0 0 1 ${endX} ${endY}`;
            };

            const getDownwardArcPath = (cx, cy, radius, angle1Rad, angle2Rad) => {
                const startAngleRad = Math.min(angle1Rad, angle2Rad);
                const endAngleRad = Math.max(angle1Rad, angle2Rad);

                const startX = cx + radius * Math.sin(startAngleRad);
                const startY = cy + radius * Math.cos(startAngleRad);
                const endX = cx + radius * Math.sin(endAngleRad);
                const endY = cy + radius * Math.cos(endAngleRad);

                return `M ${startX} ${startY} A ${radius} ${radius} 0 0 0 ${endX} ${endY}`;
            };

            return (
                <div className="scene-wrap" data-theme="ljusPapper"
                    ref={sceneWrapRef}
                    onMouseUp={handleMouseUp}
                    onMouseLeave={handleMouseUp}
                    onMouseMove={handleMouseMove}
                    onTouchEnd={handleMouseUp}
                    onTouchCancel={handleMouseUp}
                    onTouchMove={handleTouchMove}
                >
                    <svg
                        ref={svgRef}
                        viewBox={`0 0 ${VIEWBOX_WIDTH} ${VIEWBOX_HEIGHT}`}
                        preserveAspectRatio="xMidYMid meet"
                        className="cursor-pointer"
                        onMouseDown={handleMouseDown}
                        onTouchStart={handleTouchStart}
                    >
                        <defs>
                            <marker
                                id="arrow"
                                viewBox="0 0 10 10"
                                refX="8"
                                refY="5"
                                markerWidth="4"
                                markerHeight="4"
                                orient="auto"
                            >
                                <path d="M 0 0 L 10 5 L 0 10 z" fill={rayColor} />
                            </marker>
                            {/* Pappersbotten med kollegieblocksrutnät (laboranstemat) */}
                            <linearGradient id="paperBg" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stopColor="#f7f2e8"/>
                                <stop offset="100%" stopColor="#ece3d2"/>
                            </linearGradient>
                            <pattern id="paperGrid" width="25" height="25" patternUnits="userSpaceOnUse">
                                <path d="M 25 0 L 0 0 0 25" fill="none" stroke="rgba(96,130,175,0.20)" strokeWidth="0.8"/>
                            </pattern>
                            {/* Glaskropp: kall blå ton, tätast vid ytorna (Fresnel-känsla) */}
                            <linearGradient id="glassBody" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stopColor="rgba(44,112,186,0.52)"/>
                                <stop offset="12%" stopColor="rgba(84,150,212,0.32)"/>
                                <stop offset="50%" stopColor="rgba(128,186,232,0.26)"/>
                                <stop offset="88%" stopColor="rgba(84,150,212,0.32)"/>
                                <stop offset="100%" stopColor="rgba(44,112,186,0.52)"/>
                            </linearGradient>
                            {/* Glasreflex: ett snett ljusstråk (brett mjukt + smalt skarpt band)
                                som löper genom blocket i cirka 60 graders lutning. Ritas i
                                användarkoordinater så att stråket blir snett även i det breda
                                blocket (med objectBoundingBox blev det vågräta dimband). */}
                            <linearGradient id="glassSheen" gradientUnits="userSpaceOnUse"
                                            x1="150" y1={BLOCK_Y} x2={150 + effectiveBlockHeight * 1.9} y2={BLOCK_Y + effectiveBlockHeight}>
                                <stop offset="0%" stopColor="rgba(255,255,255,0)"/>
                                <stop offset="28%" stopColor="rgba(255,255,255,0)"/>
                                <stop offset="40%" stopColor="rgba(255,255,255,0.55)"/>
                                <stop offset="47%" stopColor="rgba(255,255,255,0.06)"/>
                                <stop offset="52%" stopColor="rgba(255,255,255,0.40)"/>
                                <stop offset="64%" stopColor="rgba(255,255,255,0)"/>
                                <stop offset="100%" stopColor="rgba(255,255,255,0)"/>
                            </linearGradient>
                            {/* Ljus kant precis innanför en polerad yta (tonar bort inåt) */}
                            <linearGradient id="faceGlowDown" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stopColor="rgba(255,255,255,0.80)"/>
                                <stop offset="100%" stopColor="rgba(255,255,255,0)"/>
                            </linearGradient>
                            <linearGradient id="faceGlowUp" x1="0" y1="1" x2="0" y2="0">
                                <stop offset="0%" stopColor="rgba(255,255,255,0.80)"/>
                                <stop offset="100%" stopColor="rgba(255,255,255,0)"/>
                            </linearGradient>
                            {/* Medium 1 när det är vatten eller glas: tonas mot gränsytan */}
                            <linearGradient id="medium1Upper" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stopColor="rgba(128,186,232,0.22)"/>
                                <stop offset="100%" stopColor="rgba(44,112,186,0.48)"/>
                            </linearGradient>
                            <linearGradient id="medium1Lower" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stopColor="rgba(44,112,186,0.48)"/>
                                <stop offset="100%" stopColor="rgba(128,186,232,0.22)"/>
                            </linearGradient>
                            {/* Ljusfläck där strålen träffar en yta (spritt ljus i laserns färg) */}
                            <radialGradient id="hitGlow" cx="50%" cy="50%" r="50%">
                                <stop offset="0%" stopColor={LASER.hot} stopOpacity="1"/>
                                <stop offset="30%" stopColor={LASER.glow} stopOpacity="0.75"/>
                                <stop offset="100%" stopColor={LASER.glow} stopOpacity="0"/>
                            </radialGradient>
                            <linearGradient id="penBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stopColor="#64748b"/>
                                <stop offset="35%" stopColor="#334155"/>
                                <stop offset="55%" stopColor="#1e293b"/>
                                <stop offset="100%" stopColor="#020617"/>
                            </linearGradient>
                            <radialGradient id="penTipGlow" cx="50%" cy="50%" r="50%">
                                <stop offset="0%" stopColor={apertureCenterColor} stopOpacity="1"/>
                                <stop offset="60%" stopColor={glowEdgeColor} stopOpacity="0.9"/>
                                <stop offset="100%" stopColor={glowEdgeColor} stopOpacity="0"/>
                            </radialGradient>
                            <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
                                <feGaussianBlur stdDeviation="3.4"/>
                            </filter>
                        </defs>

                        {/* Pappersbotten med rutnät */}
                        <rect x="0" y="0" width={VIEWBOX_WIDTH} height={VIEWBOX_HEIGHT} fill="url(#paperBg)"/>
                        <rect x="0" y="0" width={VIEWBOX_WIDTH} height={VIEWBOX_HEIGHT} fill="url(#paperGrid)"/>

                        {/* === MEDIUM 1: genomskinligt när det är luft, blåtonat när det är
                            vatten eller glas (opaciteten följer n1) === */}
                        {medium1Opacity > 0 && <g opacity={medium1Opacity}>
                            <rect x="0" y="0" width={VIEWBOX_WIDTH} height={BLOCK_Y} fill="url(#medium1Upper)"/>
                            <rect x="0" y={BLOCK_Y - 16} width={VIEWBOX_WIDTH} height="16" fill="url(#faceGlowUp)" opacity="0.7"/>
                            {!isTwoLayer && <>
                                <rect x="0" y={BLOCK_Y + BLOCK_HEIGHT} width={VIEWBOX_WIDTH} height={VIEWBOX_HEIGHT - BLOCK_Y - BLOCK_HEIGHT} fill="url(#medium1Lower)"/>
                                <rect x="0" y={BLOCK_Y + BLOCK_HEIGHT} width={VIEWBOX_WIDTH} height="16" fill="url(#faceGlowDown)" opacity="0.7"/>
                            </>}
                        </g>}

                        {/* === GLASBLOCKET: skiktat för glaskänsla på papper: kall blå
                            kropp som är tätast vid ytorna, diagonal glans, ljus kant
                            innanför varje polerad yta och en tunn mörkblå ytlinje === */}
                        <g opacity={glassOpacity}>
                            <rect x="0" y={BLOCK_Y} width={VIEWBOX_WIDTH} height={effectiveBlockHeight} fill="url(#glassBody)"/>
                            <rect x="0" y={BLOCK_Y} width={VIEWBOX_WIDTH} height={effectiveBlockHeight} fill="url(#glassSheen)"/>
                            <rect x="0" y={BLOCK_Y} width={VIEWBOX_WIDTH} height="22" fill="url(#faceGlowDown)"/>
                            {!isTwoLayer && <rect x="0" y={BLOCK_Y + BLOCK_HEIGHT - 22} width={VIEWBOX_WIDTH} height="22" fill="url(#faceGlowUp)"/>}
                            {/* Övre yta: mörkblå kantlinje med en vit speglingslinje strax under */}
                            <line x1="0" y1={BLOCK_Y} x2={VIEWBOX_WIDTH} y2={BLOCK_Y} stroke="rgba(28,61,107,0.65)" strokeWidth="1.8"/>
                            <line x1="0" y1={BLOCK_Y + 2.4} x2={VIEWBOX_WIDTH} y2={BLOCK_Y + 2.4} stroke="rgba(255,255,255,0.85)" strokeWidth="1"/>
                            {/* Undre yta (tre skikt) */}
                            {!isTwoLayer && <>
                                <line x1="0" y1={BLOCK_Y + BLOCK_HEIGHT} x2={VIEWBOX_WIDTH} y2={BLOCK_Y + BLOCK_HEIGHT} stroke="rgba(28,61,107,0.65)" strokeWidth="1.8"/>
                                <line x1="0" y1={BLOCK_Y + BLOCK_HEIGHT - 2.4} x2={VIEWBOX_WIDTH} y2={BLOCK_Y + BLOCK_HEIGHT - 2.4} stroke="rgba(255,255,255,0.85)" strokeWidth="1"/>
                            </>}
                        </g>

                        {/* Medium-texter */}
                        <text className="medium1-label" x="20" y="85" fill="#3f4a5c" fontSize="22" fontWeight="500" fontFamily="Poppins, sans-serif">
                            {getMediumLabel(n1, 'Medium 1')} (<tspan fontStyle="italic">n</tspan>
                            <tspan fontSize="16" dy="4">1</tspan>
                            <tspan dy="-4"> = {n1.toFixed(2).replace('.', ',')}</tspan>)
                        </text>
                        <text x="20" y={BLOCK_Y + 40} fill="#1c3d6b" fontSize="22" fontWeight="500" fontFamily="Poppins, sans-serif">
                            {getMediumLabel(n2, 'Medium 2')} (<tspan fontStyle="italic">n</tspan>
                            <tspan fontSize="16" dy="4">2</tspan>
                            <tspan dy="-4"> = {n2.toFixed(2).replace('.', ',')}</tspan>)
                        </text>

                        {/* Normallinjer (streckade) */}
                        {showAngles && <line x1={p2.x} y1="0" x2={p2.x} y2={VIEWBOX_HEIGHT} stroke="rgba(15,22,32,0.5)" strokeWidth="1.8" strokeDasharray="6,5" />}
                        {showAngles && !isTIR && !isTwoLayer && <line x1={p3.x} y1={BLOCK_Y} x2={p3.x} y2={VIEWBOX_HEIGHT} stroke="rgba(15,22,32,0.5)" strokeWidth="1.8" strokeDasharray="6,5" />}

                        {/* Ljusstrålar i tre lager: mjukt sken, mörk kärna, het mittlinje */}
                        <g filter="url(#laserGlow)" fill="none" strokeLinecap="round" stroke={LASER.glow}>
                            {segLines(beam, { strokeWidth: 10, opacity: 0.55 })}
                            {segLines(reflected, { strokeWidth: 6, opacity: 0.28 })}
                        </g>
                        <g fill="none" strokeLinecap="round">
                            {segLines(beam, { stroke: LASER.core, strokeWidth: 3.6 })}
                            {segLines(beam, { stroke: LASER.hot, strokeWidth: 1.2, opacity: 0.9 })}
                        </g>
                        {/* Partiellt reflekterade strålar (streckade) */}
                        <g fill="none" strokeLinecap="round" strokeDasharray="8,5" opacity="0.6">
                            {segLines(reflected, { stroke: LASER.core, strokeWidth: 2.6 })}
                        </g>

                        {/* Ljusfläckar där strålen träffar och lämnar en yta */}
                        <g style={{ pointerEvents: 'none' }}>
                            <circle cx={p2.x} cy={p2.y} r={18} fill="url(#hitGlow)" opacity="0.85"/>
                            <circle cx={p2.x} cy={p2.y} r={3.6} fill={LASER.hot}/>
                            {!isTIR && !isTwoLayer && <>
                                <circle cx={p3.x} cy={p3.y} r={18} fill="url(#hitGlow)" opacity="0.85"/>
                                <circle cx={p3.x} cy={p3.y} r={3.6} fill={LASER.hot}/>
                            </>}
                        </g>

                        {/* Riktningspilar mitt på varje delsträcka */}
                        <g>
                            {beam.map((seg, k) => midArrow(seg, k, 3, 1))}
                            {reflected.map((seg, k) => midArrow(seg, 'r' + k, 2.5, 0.6))}
                        </g>

                        {/* Laserpenna - sitter vid penTip och pekar mot p2 */}
                        {(() => {
                            const angleDeg = 90 + incidentAngle;
                            const L = PEN_BODY_LEN;
                            const H = PEN_BODY_H;
                            const capLen = 6;
                            const bodyLen = L - capLen;
                            return (
                                <g transform={`translate(${penTip.x} ${penTip.y}) rotate(${angleDeg})`}>
                                    {/* Visuella element - klick passerar igenom till SVG-drag */}
                                    <g style={{ pointerEvents: 'none' }}>
                                        {/* Mjukt halo runt aperturen (laserkällan) */}
                                        <circle cx={0} cy={0} r={9} fill="url(#penTipGlow)"/>
                                        {/* Pennans huvudkropp */}
                                        <rect x={-L} y={-H/2} width={bodyLen} height={H}
                                              fill="url(#penBodyGrad)" stroke="rgba(15,22,32,0.7)" strokeWidth="0.8" rx="3" ry="3"/>
                                        {/* Främre kapsel (där lasern kommer ut) */}
                                        <rect x={-capLen} y={-H/2 - 1.2} width={capLen} height={H + 2.4}
                                              fill="#d7dde6" stroke="rgba(15,22,32,0.7)" strokeWidth="0.8" rx="1.6" ry="1.6"/>
                                        {/* Aperturen (källan) */}
                                        <circle cx={-1.5} cy={0} r={2.4} fill={apertureCenterColor}/>
                                        <circle cx={-1.5} cy={0} r={1.4} fill="#ffffff"/>
                                        {/* Subtil ljusstrimma längs ovansidan för metallisk känsla */}
                                        <line x1={-L + 4} y1={-H/2 + 2} x2={-capLen - 3} y2={-H/2 + 2}
                                              stroke="rgba(15, 22, 32, 0.3)" strokeWidth="0.8" strokeLinecap="round"/>
                                    </g>
                                    {/* Grön laserknapp på baksidan av pennan */}
                                    {(() => {
                                        const cx = -L + 7;
                                        const cy = 0;
                                        const r = 2.5;
                                        const active = !isRedLaser;
                                        return (
                                            <g style={{ cursor: 'pointer' }}
                                               onClick={(e) => { e.stopPropagation(); setLaserColor('green'); }}
                                               onMouseDown={(e) => e.stopPropagation()}
                                               onTouchStart={(e) => e.stopPropagation()}>
                                                {/* Träffyta */}
                                                <circle cx={cx} cy={cy} r={6} fill="#cfd6df"/>
                                                {/* Bas/kant */}
                                                <circle cx={cx} cy={cy} r={r + 0.7} fill="#cfd6df"/>
                                                {/* Knappens framsida */}
                                                <circle cx={cx} cy={cy} r={r} fill={active ? '#22c55e' : '#14532d'}/>
                                                {/* Glow när aktiv */}
                                                {active && <circle cx={cx} cy={cy} r={r + 1.4} fill="none" stroke="#22c55e" strokeWidth="0.4" opacity="0.7"/>}
                                                {/* Inre skugga */}
                                                <circle cx={cx} cy={cy} r={r} fill="none"
                                                        stroke={active ? '#166534' : '#022c22'} strokeWidth="0.4"/>
                                                {/* Ljusstrimma */}
                                                <ellipse cx={cx - 0.7} cy={cy - 0.7} rx={0.8} ry={0.5}
                                                         fill={active ? 'rgba(220,255,220,0.8)' : 'rgba(160,200,160,0.35)'}/>
                                            </g>
                                        );
                                    })()}
                                    {/* Röd laserknapp på baksidan av pennan */}
                                    {(() => {
                                        const cx = -L + 14;
                                        const cy = 0;
                                        const r = 2.5;
                                        const active = isRedLaser;
                                        return (
                                            <g style={{ cursor: 'pointer' }}
                                               onClick={(e) => { e.stopPropagation(); setLaserColor('red'); }}
                                               onMouseDown={(e) => e.stopPropagation()}
                                               onTouchStart={(e) => e.stopPropagation()}>
                                                {/* Träffyta */}
                                                <circle cx={cx} cy={cy} r={6} fill="#cfd6df"/>
                                                {/* Bas/kant */}
                                                <circle cx={cx} cy={cy} r={r + 0.7} fill="#cfd6df"/>
                                                {/* Knappens framsida */}
                                                <circle cx={cx} cy={cy} r={r} fill={active ? '#ef4444' : '#450a0a'}/>
                                                {/* Glow när aktiv */}
                                                {active && <circle cx={cx} cy={cy} r={r + 1.4} fill="none" stroke="#ef4444" strokeWidth="0.4" opacity="0.7"/>}
                                                {/* Inre skugga */}
                                                <circle cx={cx} cy={cy} r={r} fill="none"
                                                        stroke={active ? '#7f1d1d' : '#1c0606'} strokeWidth="0.4"/>
                                                {/* Ljusstrimma */}
                                                <ellipse cx={cx - 0.7} cy={cy - 0.7} rx={0.8} ry={0.5}
                                                         fill={active ? 'rgba(255,220,220,0.8)' : 'rgba(200,160,160,0.35)'}/>
                                            </g>
                                        );
                                    })()}
                                </g>
                            );
                        })()}

                        {/* TIR-etikett */}
                        {isTIR && <text x={p2.x + 15} y={p2.y - 40} fill="#c8324a" fontSize="18" fontWeight="bold" fontFamily="Poppins, sans-serif">Total intern reflektion</text>}

                        {/* Vinkelbågar - övre gränsyta */}
                        {showAngles && <g>
                            <path d={getArcPath(p2.x, p2.y, 40, 0, theta1Rad)} stroke="#1c3d6b" strokeWidth="2" fill="none"/>
                            <text x={p2.x + 55 * Math.sin(theta1Rad/2)} y={p2.y - 55 * Math.cos(theta1Rad/2)} fill="#1c3d6b" fontSize="16" fontStyle="italic" textAnchor="middle" fontFamily="Poppins, sans-serif">
                                {showAngleValues
                                    ? <tspan fontSize="14" fontStyle="normal">{fmtDeg(theta1Deg)}°</tspan>
                                    : <><tspan>i</tspan><tspan fontSize="12" dy="4">1</tspan></>
                                }
                            </text>

                            {isTIR ? (
                                <g>
                                    <path d={getArcPath(p2.x, p2.y, 60, 0, -theta1Rad)} stroke="#1c3d6b" strokeWidth="2" fill="none"/>
                                    <text x={p2.x + 75 * Math.sin(-theta1Rad/2)} y={p2.y - 75 * Math.cos(-theta1Rad/2)} fill="#1c3d6b" fontSize="18" fontStyle="italic" textAnchor="middle" fontFamily="Poppins, sans-serif">
                                        {showAngleValues
                                            ? <tspan fontSize="14" fontStyle="normal">{fmtDeg(theta1Deg)}°</tspan>
                                            : <><tspan>r</tspan><tspan fontSize="13" dy="4">1</tspan></>
                                        }
                                    </text>
                                </g>
                            ) : (
                                <g>
                                    <path d={getDownwardArcPath(p2.x, p2.y, 40, 0, theta2Rad)} stroke="#6d28d9" strokeWidth="2" fill="none" />
                                    <text x={p2.x + 60 * Math.sin(theta2Rad/2)} y={p2.y + 60 * Math.cos(theta2Rad/2)} fill="#6d28d9" fontSize="16" fontStyle="italic" textAnchor="middle" fontFamily="Poppins, sans-serif">
                                        {showAngleValues
                                            ? <tspan fontSize="14" fontStyle="normal">{fmtDeg(theta2Deg)}°</tspan>
                                            : <><tspan>b</tspan><tspan fontSize="12" dy="4">1</tspan></>
                                        }
                                    </text>
                                </g>
                            )}
                        </g>}

                        {/* Vinkelbågar - nedre gränsyta */}
                        {showAngles && !isTIR && !isTwoLayer && (
                            <g>
                                <path d={getArcPath(p3.x, p3.y, 40, 0, -theta2Rad)} stroke="#6d28d9" strokeWidth="2" fill="none"/>
                                <text x={p3.x - 55 * Math.sin(theta2Rad/2)} y={p3.y - 55 * Math.cos(theta2Rad/2)} fill="#6d28d9" fontSize="16" fontStyle="italic" textAnchor="middle" fontFamily="Poppins, sans-serif">
                                    {showAngleValues
                                        ? <tspan fontSize="14" fontStyle="normal">{fmtDeg(theta2Deg)}°</tspan>
                                        : <><tspan>i</tspan><tspan fontSize="12" dy="4">2</tspan></>
                                    }
                                </text>

                                <path d={getDownwardArcPath(p3.x, p3.y, 40, 0, -theta1Rad)} stroke="#1c3d6b" strokeWidth="2" fill="none" />
                                <text x={p3.x - 60 * Math.sin(theta1Rad/2)} y={p3.y + 60 * Math.cos(theta1Rad/2)} fill="#1c3d6b" fontSize="16" fontStyle="italic" textAnchor="middle" fontFamily="Poppins, sans-serif">
                                    {showAngleValues
                                        ? <tspan fontSize="14" fontStyle="normal">{fmtDeg(theta1Deg)}°</tspan>
                                        : <><tspan>b</tspan><tspan fontSize="12" dy="4">2</tspan></>
                                    }
                                </text>
                            </g>
                        )}

                        {/* Reflektionsvinklar - visas när reflekterade strålar och vinklar båda är på */}
                        {showAngles && showReflected && !isTIR && (
                            <g>
                                {/* Reflektion vid övre gränsytan (spegelvänd kring normalen från i₁) */}
                                <path d={getArcPath(p2.x, p2.y, 60, 0, -theta1Rad)} stroke="#1c3d6b" strokeWidth="2" fill="none" strokeDasharray="4,3" opacity="0.7"/>
                                <text x={p2.x + 75 * Math.sin(-theta1Rad/2)} y={p2.y - 75 * Math.cos(-theta1Rad/2)} fill="#1c3d6b" fontSize="16" fontStyle="italic" textAnchor="middle" fontFamily="Poppins, sans-serif" opacity="0.85">
                                    {showAngleValues
                                        ? <tspan fontSize="14" fontStyle="normal">{fmtDeg(theta1Deg)}°</tspan>
                                        : <><tspan>r</tspan><tspan fontSize="12" dy="4">1</tspan></>
                                    }
                                </text>

                                {/* Reflektion vid undre gränsytan (endast tre-skiktsläge) */}
                                {!isTwoLayer && pR2 && (
                                    <g>
                                        <path d={getArcPath(p3.x, p3.y, 60, 0, theta2Rad)} stroke="#6d28d9" strokeWidth="2" fill="none" strokeDasharray="4,3" opacity="0.7"/>
                                        <text x={p3.x + 75 * Math.sin(theta2Rad/2)} y={p3.y - 75 * Math.cos(theta2Rad/2)} fill="#6d28d9" fontSize="16" fontStyle="italic" textAnchor="middle" fontFamily="Poppins, sans-serif" opacity="0.85">
                                            {showAngleValues
                                                ? <tspan fontSize="14" fontStyle="normal">{fmtDeg(theta2Deg)}°</tspan>
                                                : <><tspan>r</tspan><tspan fontSize="12" dy="4">2</tspan></>
                                            }
                                        </text>
                                    </g>
                                )}
                            </g>
                        )}

                        {/* Vinkelsamband-rutan — göms medan inställningsrutan är
                            öppen i fullskärm (de delar hörnet uppe till höger,
                            och två rutor på varandra är förbjudet) */}
                        {showAngles && !isTIR && !isTwoLayer && !(isFullscreen && togglesOpen) && (
                            <g>
                                <rect x={VIEWBOX_WIDTH - 170} y="15" width="155" height="70"
                                      fill="rgba(255,255,255,0.92)"
                                      stroke="rgba(15,22,32,0.28)"
                                      strokeWidth="1.2"
                                      rx="6"/>
                                <text x={VIEWBOX_WIDTH - 92.5} y="38" fill="#3f4a5c" fontSize="16" fontWeight="bold" textAnchor="middle" fontFamily="Poppins, sans-serif">Vinkelsamband:</text>
                                <text x={VIEWBOX_WIDTH - 92.5} y="58" fill="#1c3d6b" fontSize="15" textAnchor="middle" fontFamily="Poppins, sans-serif">
                                    <tspan fontStyle="italic">i</tspan><tspan fontSize="11" dy="3">1</tspan><tspan dy="-3"> = </tspan>
                                    <tspan fontStyle="italic">b</tspan><tspan fontSize="11" dy="3">2</tspan>
                                </text>
                                <text x={VIEWBOX_WIDTH - 92.5} y="76" fill="#6d28d9" fontSize="15" textAnchor="middle" fontFamily="Poppins, sans-serif">
                                    <tspan fontStyle="italic">b</tspan><tspan fontSize="11" dy="3">1</tspan><tspan dy="-3"> = </tspan>
                                    <tspan fontStyle="italic">i</tspan><tspan fontSize="11" dy="3">2</tspan>
                                </text>
                            </g>
                        )}

                    </svg>

                    {/* Inställningsrutan uppe till höger — bara i fullskärm; i
                        normalläget bor reglagen i sidopanelen (aldrig
                        dubblerade). Hopfällbar (placeringsregeln 2026-08-31). */}
                    {isFullscreen && (!togglesOpen ? (
                        <button className="st-show-btn" onClick={() => setTogglesOpen(true)}
                                aria-label="Visa inställningar" title="Visa inställningar" aria-expanded="false">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 strokeWidth="2" strokeLinecap="round" aria-hidden="true">
                                <line x1="4" y1="8" x2="20" y2="8" />
                                <circle cx="14.5" cy="8" r="2.7" fill="currentColor" stroke="none" />
                                <line x1="4" y1="16" x2="20" y2="16" />
                                <circle cx="9.5" cy="16" r="2.7" fill="currentColor" stroke="none" />
                            </svg>
                        </button>
                    ) : (
                    <div className="scene-toggles">
                        <button className="st-hide" onClick={() => setTogglesOpen(false)}
                                aria-label="Dölj inställningar" title="Dölj inställningar" aria-expanded="true">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 strokeWidth="2.4" strokeLinecap="round" aria-hidden="true">
                                <path d="M6 6l12 12M18 6L6 18" />
                            </svg>
                        </button>
                        <div className="st-title">Reglage</div>
                        <div className="st-slider">
                            <div className="st-slider-top">
                                <span>Infallsvinkel <em style={{fontStyle: 'italic'}}>i</em><sub>1</sub></span>
                                <span className="st-val">{incidentAngle.toFixed(1).replace('.', ',')}°</span>
                            </div>
                            <input
                                type="range"
                                min={-89.9}
                                max={89.9}
                                step={0.1}
                                value={incidentAngle}
                                onChange={e => setIncidentAngle(parseFloat(e.target.value))}
                            />
                        </div>
                        <div className="st-rad-topp" style={{ marginTop: 3 }}>
                            <span>Medium 1 <em style={{fontStyle: 'italic'}}>n</em><sub>1</sub></span>
                            <span className="st-val">{n1.toFixed(2).replace('.', ',')}</span>
                        </div>
                        <div className="fs-materials">
                            {MATERIALS.map(m => (
                                <button key={m.name}
                                    type="button"
                                    className={`fs-mat-btn ${Math.abs(n1 - m.n) < 0.005 ? 'active' : ''}`}
                                    onClick={() => setN1(m.n)}>
                                    {m.name}
                                </button>
                            ))}
                        </div>
                        <div className="st-rad-topp" style={{ marginTop: 3 }}>
                            <span>Medium 2 <em style={{fontStyle: 'italic'}}>n</em><sub>2</sub></span>
                            <span className="st-val">{n2.toFixed(2).replace('.', ',')}</span>
                        </div>
                        <div className="fs-materials">
                            {MATERIALS.map(m => (
                                <button key={m.name}
                                    type="button"
                                    className={`fs-mat-btn ${Math.abs(n2 - m.n) < 0.005 ? 'active' : ''}`}
                                    onClick={() => setN2(m.n)}>
                                    {m.name}
                                </button>
                            ))}
                        </div>
                        <div className="st-title" style={{ marginTop: 4 }}>Laserfärg</div>
                        <div className="st-radgrupp">
                            <label>
                                <input type="radio" name="fs-laser-color" value="green"
                                    checked={laserColor === 'green'}
                                    onChange={() => setLaserColor('green')}
                                    style={{ accentColor: '#22c55e' }}/>
                                Grön
                            </label>
                            <label>
                                <input type="radio" name="fs-laser-color" value="red"
                                    checked={laserColor === 'red'}
                                    onChange={() => setLaserColor('red')}
                                    style={{ accentColor: '#ef4444' }}/>
                                Röd
                            </label>
                        </div>
                        <div className="st-title" style={{ marginTop: 4 }}>Visa</div>
                        <label>
                            <input type="checkbox"
                                checked={showReflected}
                                onChange={(e) => setShowReflected(e.target.checked)}
                                style={{ accentColor: '#c8324a', width: 14, height: 14 }}/>
                            Reflekterade strålar
                        </label>
                        <label>
                            <input type="checkbox"
                                checked={showAngles}
                                onChange={(e) => setShowAngles(e.target.checked)}
                                style={{ accentColor: '#c8324a', width: 14, height: 14 }}/>
                            Visa vinklar
                        </label>
                        {showAngles && (
                            <div className="st-radgrupp">
                                <label>
                                    <input type="radio" name="fs-angle-display" value="labels"
                                        checked={angleDisplay === 'labels'}
                                        onChange={() => setAngleDisplay('labels')}
                                        style={{ accentColor: '#c8324a' }}/>
                                    Beteckningar
                                </label>
                                <label>
                                    <input type="radio" name="fs-angle-display" value="values"
                                        checked={angleDisplay === 'values'}
                                        onChange={() => setAngleDisplay('values')}
                                        style={{ accentColor: '#c8324a' }}/>
                                    Värden
                                </label>
                            </div>
                        )}
                        <div className="st-title" style={{ marginTop: 4 }}>Antal skikt</div>
                        <div className="st-radgrupp">
                            <label>
                                <input type="radio" name="fs-layer-mode" value="three"
                                    checked={layerMode === 'three'}
                                    onChange={() => setLayerMode('three')}
                                    style={{ accentColor: '#c8324a' }}/>
                                Tre (1+2+1)
                            </label>
                            <label>
                                <input type="radio" name="fs-layer-mode" value="two"
                                    checked={layerMode === 'two'}
                                    onChange={() => setLayerMode('two')}
                                    style={{ accentColor: '#c8324a' }}/>
                                Två (1+2)
                            </label>
                        </div>
                    </div>
                    ))}

                    <button className="fs-btn" onClick={toggleFullscreen} aria-label="Fullskärm" title={isFullscreen ? 'Lämna fullskärm' : 'Fullskärm'}>{isFullscreen ? (<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 3v6H3"/><path d="M15 21v-6h6"/><path d="M21 9h-6V3"/><path d="M3 15h6v6"/></svg>) : (<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9V3h6"/><path d="M21 9V3h-6"/><path d="M3 15v6h6"/><path d="M21 15v6h-6"/></svg>)}</button>
                </div>
            );
        };

        const App = () => {
            const [n1, setN1] = useState(1.0);
            const [n2, setN2] = useState(1.52);
            const [incidentAngle, setIncidentAngle] = useState(-40);
            const [showReflected, setShowReflected] = useState(false);
            const [showAngles, setShowAngles] = useState(false);
            const [angleDisplay, setAngleDisplay] = useState('labels');
            const [laserColor, setLaserColor] = useState('green');
            const [layerMode, setLayerMode] = useState('three');

            return (
                <div className="min-h-screen dark-container flex flex-col" style={{ fontFamily: 'Poppins, sans-serif' }}>
                    <div className="max-w-7xl mx-auto w-full px-4 sm:px-6 pt-6">
                        <div className="breadcrumb mb-4">
                            <a href="index.html">Hem</a> / <a href="fysik2.html">Fysik nivå 2</a> / Brytningslagen
                        </div>
                        <header className="mb-6">
                            <h1 className="text-2xl sm:text-3xl font-bold text-slate-100 glow-text">Brytningslagen</h1>
                            <p className="text-slate-400 mt-1 text-sm sm:text-base">Utforska ljusets brytning vid gränsytan mellan två medier.</p>
                            <div className="mt-6 flex flex-row flex-wrap items-stretch gap-6 text-cyan-300" style={{fontFamily: 'Poppins, sans-serif'}}>
                                <div className="formula-scroll flex items-end gap-3 flex-wrap px-6 py-4 rounded-xl border border-cyan-500/20 bg-slate-900/40">
                                    <div style={{textAlign:'center'}}>
                                        <div className="text-xs font-semibold mb-1" style={{ color: 'var(--lab-ink-muted, #69655c)', letterSpacing: '0.06em', textTransform: 'uppercase' }}>Brytningsindex medium 1</div>
                                        <div className="text-2xl font-bold"><em>n</em><sub>1</sub></div>
                                    </div>
                                    <div className="text-2xl font-bold text-slate-400">⋅</div>
                                    <div className="text-2xl font-bold text-slate-300">sin</div>
                                    <div style={{textAlign:'center'}}>
                                        <div className="text-xs font-semibold mb-1" style={{ color: 'var(--lab-ink-muted, #69655c)', letterSpacing: '0.06em', textTransform: 'uppercase' }}>Infallsvinkel</div>
                                        <div className="text-2xl font-bold"><em>i</em></div>
                                    </div>
                                    <div className="text-xl text-slate-500">=</div>
                                    <div style={{textAlign:'center'}}>
                                        <div className="text-xs font-semibold mb-1" style={{ color: 'var(--lab-ink-muted, #69655c)', letterSpacing: '0.06em', textTransform: 'uppercase' }}>Brytningsindex medium 2</div>
                                        <div className="text-2xl font-bold"><em>n</em><sub>2</sub></div>
                                    </div>
                                    <div className="text-2xl font-bold text-slate-400">⋅</div>
                                    <div className="text-2xl font-bold text-slate-300">sin</div>
                                    <div style={{textAlign:'center'}}>
                                        <div className="text-xs font-semibold mb-1" style={{ color: 'var(--lab-ink-muted, #69655c)', letterSpacing: '0.06em', textTransform: 'uppercase' }}>Brytningsvinkel</div>
                                        <div className="text-2xl font-bold"><em>b</em></div>
                                    </div>
                                </div>
                            </div>
                        </header>
                    </div>

                    <main className="flex-grow flex flex-col lg:flex-row px-4 sm:px-6 pb-6 gap-6 max-w-7xl mx-auto w-full">
                        <div className="flex-grow lg:w-2/3 xl:w-3/4 min-h-0 order-1 lg:order-1">
                            <SimulationView
                                n1={n1}
                                setN1={setN1}
                                n2={n2}
                                setN2={setN2}
                                incidentAngle={incidentAngle}
                                setIncidentAngle={setIncidentAngle}
                                showReflected={showReflected}
                                setShowReflected={setShowReflected}
                                showAngles={showAngles}
                                setShowAngles={setShowAngles}
                                angleDisplay={angleDisplay}
                                setAngleDisplay={setAngleDisplay}
                                laserColor={laserColor}
                                setLaserColor={setLaserColor}
                                layerMode={layerMode}
                                setLayerMode={setLayerMode}
                            />
                        </div>
                        <div className="lg:w-1/3 xl:w-1/4 flex-shrink-0 order-2 lg:order-2">
                            <ControlsView
                                n1={n1}
                                setN1={setN1}
                                n2={n2}
                                setN2={setN2}
                                incidentAngle={incidentAngle}
                                setIncidentAngle={setIncidentAngle}
                                showReflected={showReflected}
                                setShowReflected={setShowReflected}
                                showAngles={showAngles}
                                setShowAngles={setShowAngles}
                                angleDisplay={angleDisplay}
                                setAngleDisplay={setAngleDisplay}
                                laserColor={laserColor}
                                setLaserColor={setLaserColor}
                                layerMode={layerMode}
                                setLayerMode={setLayerMode}
                            />
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <footer class="footer">
        <p>&copy; 2025 Fysiklabbet. Skapad av Sam Skoglund.</p>
    </footer>
    <script src="feedback.js" defer></script>
    <script src="sim-dock.js" defer></script>
    <script src="data/katalog.js"></script>
    <script src="section-nav.js"></script>
    <!-- Cloudflare Web Analytics: cookiefri besöksmätning, se CLAUDE.md. -->
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js"
            data-cf-beacon='{"token": "366677ecfe014a76b73f5bc78a489e0e"}'></script>
</body>
</html>
