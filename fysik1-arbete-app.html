                                <div className="st-actions">
                                    <button className="btn-start" onClick={startKlick} disabled={lastGissa}>{startEtikett}</button>
                                    <button className="btn-toggle" onClick={borjaOm} disabled={lastGissa}>Börja om</button>
                                </div>
                            </React.Fragment>
                        )}
                    </div>
                );
            };

            const Fs = kNu.Fs;
            const sVisa = st.x > 0 ? st.x : s;
            const varierat = st.prov.some((p) => Math.abs(p[1] - st.prov[st.prov.length - 1][1]) > 1e-6);

            return (
                <div className="min-h-screen dark-container px-4 md:px-8 pb-12" style={{ fontFamily: "'DM Sans', sans-serif" }}>
                    <div className="max-w-7xl mx-auto pt-6">
                        <div className="breadcrumb mb-4" style={{ fontSize: 13 }}>
                            <a href="index.html">Hem</a> / <a href="katalog.html#fy1">Fysik nivå 1</a> / Arbete
                        </div>
                        <h1 className="text-3xl md:text-4xl font-black tracking-tight" style={{ color: 'var(--lab-ink)' }}>Arbete</h1>
                        <p className="mt-2 mb-5" style={{ color: 'var(--lab-ink-soft)', maxWidth: 860 }}>
                            När en kraft flyttar ett föremål uträttar kraften ett <strong>arbete</strong>: energi förs över till
                            föremålet och byter form. Arbetet är kraften i rörelsens riktning gånger sträckan,
                            och det syns här som en <strong>area</strong> som fylls med brickor på en joule var.
                            Ta tag i handen och dra i dynamometern. Avståndet bestämmer kraften och riktningen bestämmer
                            vinkeln <em>v</em>. Tryck sedan på Starta och se vart energin tar vägen.
                        </p>

                        <FormelKort Fs={Fs} s={sVisa} W={st.x > 0 ? en.W : Fs * s} F={effF} v={effV} dolj={doljSvar} lage={lage} varierat={varierat} />

                        <main className="flex flex-col lg:flex-row gap-6">
                            <div className="lg:w-2/3 xl:w-3/4 order-1">
                                <div className="scene-wrap" data-theme="ljusPapper" ref={sceneWrapRef}>
                                    <Scen cfg={cfgRef.current} st={st} k={kNu} en={en} show={show} svgRef={svgRef}
                                          handtag={handtag} drar={drar} gissaDolj={doljSvar} ghost={ghost && ghost.lage === lage ? ghost : null}
                                          flygande={flygRef.current} raknare={rakRef.current} utforska={utforska} smax={smax} />
                                    {sceneToggles()}
                                    <button className="fs-btn" onClick={toggleFullscreen} aria-label="Fullskärm"
                                            title={isFullscreen ? 'Lämna fullskärm' : 'Fullskärm'}>
                                        {isFullscreen ? (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M9 3v6H3" /><path d="M15 21v-6h6" /><path d="M21 9h-6V3" /><path d="M3 15h6v6" />
                                            </svg>
                                        ) : (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M3 9V3h6" /><path d="M21 9V3h-6" /><path d="M3 15v6h6" /><path d="M21 15v6h-6" />
                                            </svg>
                                        )}
                                    </button>
                                </div>
                                <p className="text-sm mt-2" style={{ color: 'var(--lab-ink-soft)' }}>
                                    {lage === 'dra' && 'Ta tag i handen och dra: avståndet från föremålet bestämmer kraften, riktningen bestämmer vinkeln v. Det går också att ändra kraften medan föremålet rör sig.'}
                                    {lage === 'lyft' && 'Dra handen uppåt eller nedåt för att ändra kraften. Från vila lyfts vikten först när kraften är större än tyngdkraften. De färdiga lyftförsöken startar med en liten fart uppåt, och då räcker en kraft lika stor som tyngdkraften för att vikten ska fortsätta uppåt med jämn fart.'}
                                    {lage === 'bar' && 'Handen bär vikten med jämn fart längs bänken. Kraften är lika stor som tyngdkraften och pekar rakt uppåt.'}
                                    {' '}Luftmotståndet försummas.
                                </p>

                                {resultat && (
                                    <div className="glass-card rounded-xl p-4 mt-3 resultat">
                                        <div className="font-bold mb-1" style={{ color: 'var(--lab-ink)' }}>{resultat.rubrik}</div>
                                        <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>{resultat.text}</p>
                                    </div>
                                )}
                            </div>

                            {/* ── Sidopanelen ── */}
                            <div className="lg:w-1/3 xl:w-1/4 order-2">
                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <div className="flbl mb-2" style={{ textAlign: 'left' }}>Försöket</div>
                                    <div className="mode-seg mb-2">
                                        {[['dra', 'Dra'], ['lyft', 'Lyfta'], ['bar', 'Bära']].map(([k, n]) => (
                                            <button key={k} className={lage === k ? 'active' : ''} disabled={lastReglage}
                                                    onClick={() => valjLage(k)}>{n}</button>
                                        ))}
                                    </div>
                                    {lage === 'dra' && (
                                        <div className="mode-seg">
                                            <button className={obj === 'vagn' ? 'active' : ''} disabled={lastReglage} onClick={() => setObj('vagn')}>
                                                Vagn<span className="sub">ingen friktion</span></button>
                                            <button className={obj === 'lada' ? 'active' : ''} disabled={lastReglage} onClick={() => { setObj('lada'); setFraw(startKraft('dra', 'lada', m, mu, F, v)); }}>
                                                Trälåda<span className="sub">med friktion</span></button>
                                        </div>
                                    )}
                                </div>

                                <div className="glass-card rounded-xl p-3 mb-3">
                                    {!isFullscreen && reglage(Slider, false)}
                                    {isFullscreen && <p className="text-xs mb-2" style={{ color: 'var(--lab-ink-soft)' }}>Reglagen finns i rutan uppe till höger i fullskärm.</p>}
                                    <div className="flex gap-2 mt-2">
                                        <button className="btn-start flex-1" onClick={startKlick} disabled={lastGissa}>{startEtikett}</button>
                                        <button className="btn-toggle flex-1" onClick={borjaOm} disabled={lastGissa}>Börja om</button>
                                    </div>
                                    <label className="flex items-center gap-2 mt-3 text-sm cursor-pointer" style={{ color: 'var(--lab-ink)' }}>
                                        <input type="checkbox" checked={utforska} disabled={lastReglage}
                                               onChange={() => { if (!utforska && v0 === 0) setV0(1.2); setUtforska((u) => !u); }} style={{ accentColor: 'var(--lab-accent)' }} />
                                        <span>Utforska: vinklar över 90° och startfart</span>
                                    </label>
                                </div>

                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <div className="flbl mb-2" style={{ textAlign: 'left' }}>Färdiga försök</div>
                                    <div className="forsok-lista">
                                        {FORSOK.map((f) => (
                                            <button key={f.id} className="forsok" disabled={lastGissa} onClick={() => korForsok(f)}>
                                                {f.namn}<span className="sub">{f.sub}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <div className="flbl mb-2" style={{ textAlign: 'left' }}>Avläsning</div>
                                    <div className="avl">
                                        <div><div className="v" style={{ color: COL.F }}>{fmt(effF, 1)} N</div><div className="l">kraft <em>F</em></div></div>
                                        <div><div className="v" style={{ color: COL.F }}>{fmt(Fs, 1)} N</div><div className="l">längs rörelsen <em>F</em><sub>s</sub></div></div>
                                        <div><div className="v">{fmt(st.x, 2)} m</div><div className="l">sträcka <em>s</em></div></div>
                                        <div><div className="v" style={{ color: COL.frik }}>{lage === 'dra' && obj === 'lada' ? `${fmt(kNu.Ff, 1)} N` : '–'}</div><div className="l">friktion <em>F</em><sub>f</sub></div></div>
                                        <div><div className="v">{fmt(Math.abs(st.vel), 2)} m/s</div><div className="l">fart</div></div>
                                        <div><div className="v" style={{ color: COL.brickK }}>{doljSvar ? '?' : `${fmt(en.W, 1)} J`}</div><div className="l">arbete <em>W</em></div></div>
                                    </div>
                                </div>

                                {/* Gissa-läget */}
                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <div className="flex items-center justify-between mb-2">
                                        <div className="flbl" style={{ textAlign: 'left' }}>Gissa-läge</div>
                                        {poang.totalt > 0 && <div className="text-xs" style={{ color: 'var(--lab-ink-soft)' }}>
                                            {poang.ratt} av {poang.totalt} rätt{poang.svit > 1 ? `, ${poang.svit} i rad` : ''}</div>}
                                    </div>
                                    {!gissa && (
                                        <div className="flex flex-col gap-2">
                                            <button className="btn-toggle" onClick={startaRakna}>Räkna ut arbetet</button>
                                            <button className="btn-toggle" onClick={startaJamfor}>Vilket försök ger mest arbete?</button>
                                        </div>
                                    )}
                                    {gissa === 'rakna' && uppg && (
                                        <div>
                                            <p className="text-sm mb-2" style={{ color: 'var(--lab-ink)' }}>
                                                En hand drar {uppg.obj === 'vagn' ? 'vagnen' : 'lådan'} med kraften <em>F</em> = {fmt(uppg.F, 0)} N
                                                i vinkeln <em>v</em> = {uppg.v}° mot bänken, sträckan <em>s</em> = {fmt(uppg.s, 1)} m.
                                                Hur stort arbete uträttar kraften?
                                            </p>
                                            <div className="flex items-center gap-2 mb-2">
                                                <span style={{ fontStyle: 'italic' }}>W</span> =
                                                <input className="gissa-in" type="text" inputMode="decimal" value={svarTxt}
                                                       disabled={svarStatus !== null}
                                                       onChange={(e) => setSvarTxt(e.target.value)}
                                                       onKeyDown={(e) => { if (e.key === 'Enter' && svarStatus === null) kollaSvar(); }} />
                                                <span>J</span>
                                                <button className="btn-start" onClick={kollaSvar} disabled={svarStatus !== null}>Kolla</button>
                                            </div>
                                            {svarStatus === 'kor' && <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>Försöket körs. Räkna brickorna!</p>}
                                            {svarStatus && svarStatus !== 'kor' && (
                                                <p className="text-sm mb-2" style={{ color: svarStatus.ratt ? '#15803d' : 'var(--lab-accent)' }}>{svarStatus.text}</p>
                                            )}
                                            <div className="flex gap-2">
                                                {svarStatus && svarStatus !== 'kor' && <button className="btn-toggle flex-1" onClick={startaRakna}>Ny uppgift</button>}
                                                <button className="btn-toggle flex-1" onClick={avslutaGissa} disabled={svarStatus === 'kor'}>Avsluta</button>
                                            </div>
                                        </div>
                                    )}
                                    {gissa === 'jamfor' && jamfor && (
                                        <div>
                                            <p className="text-sm mb-2" style={{ color: 'var(--lab-ink)' }}>
                                                Föremålet flyttas sträckan <em>s</em> av en kraft <em>F</em> i vinkeln <em>v</em> mot rörelsen.
                                                I vilket försök uträttar kraften störst arbete?
                                            </p>
                                            <div className="kort3 mb-2">
                                                {jamfor.map((k, i) => {
                                                    const max = Math.max(...jamfor.map((q) => q.W));
                                                    const basta = valt != null && k.W === max;
                                                    return (
                                                        <button key={i} className={`${valt === i ? 'vald' : ''} ${basta ? 'basta' : ''}`} onClick={() => valjKort(i)} disabled={valt != null}>
                                                            <span className="bok">{'ABC'[i]}</span>
                                                            <em>F</em> = {k.F} N<br /><em>v</em> = {k.v}°<br /><em>s</em> = {fmt(k.s, 1)} m
                                                            {valt != null && <span style={{ display: 'block', marginTop: 4, fontWeight: 700 }}>{fmt(k.W, 1)} J</span>}
                                                            {valt != null && <div className="stapel" style={{ width: `${Math.max(4, (k.W / max) * 100)}%` }}></div>}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                            {valt != null && (() => {
                                                const max = Math.max(...jamfor.map((q) => q.W));
                                                const ratt = jamfor[valt].W === max;
                                                return <p className="text-sm mb-2" style={{ color: ratt ? '#15803d' : 'var(--lab-accent)' }}>
                                                    {ratt ? 'Rätt! ' : 'Inte riktigt. '}Arbetet är <em>F</em> · cos <em>v</em> · <em>s</em>: en stor kraft i en stor vinkel ger en liten komposant längs rörelsen.
                                                </p>;
                                            })()}
                                            <div className="flex gap-2">
                                                {valt != null && <button className="btn-toggle flex-1" onClick={startaJamfor}>Ny fråga</button>}
                                                <button className="btn-toggle flex-1" onClick={avslutaGissa}>Avsluta</button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </main>

                        {/* Pedagogiska sektioner */}
                        <div className="grid md:grid-cols-3 gap-4 mt-6">
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Arbetet är en area</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Ritar man kraften i rörelsens riktning mot sträckan blir arbetet <em>W</em> = <em>F</em><sub>s</sub> · <em>s</em> arean
                                    under grafen, eftersom en rektangels area är höjd gånger bredd. Varje ruta i diagrammet är 10 N gånger 0,1 m,
                                    alltså 1 Nm = 1 J. Ändras kraften under vägen blir ytan trappformad, men arbetet är fortfarande arean.
                                </p>
                            </div>
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Bara kraften längs rörelsen räknas</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    En sned kraft delas upp i en komposant längs rörelsen, <em>F</em><sub>2</sub> = <em>F</em> · cos <em>v</em>, och en
                                    vinkelrät, <em>F</em><sub>1</sub> = <em>F</em> · sin <em>v</em>. Bara den första uträttar arbete. Den andra lyfter lite
                                    i föremålet och minskar normalkraften och därmed friktionen, men flyttar det inte. Vid <em>v</em> = 90° blir arbetet noll.
                                </p>
                            </div>
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Arbete flyttar energi</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Arbete är ingen energiform utan en process där energi förs över till eller från föremålet och byter form.
                                    Utan friktion blir allt rörelseenergi, med friktion blir en del värme, och vid ett lyft blir det lägesenergi.
                                    Brickorna i facken är startenergin plus arbetet, räknat i hela joule.
                                </p>
                            </div>
                        </div>

                        <details className="glass-card rounded-xl p-4 mt-4">
                            <summary className="accordion-head" style={{ color: 'var(--lab-ink)' }}>
                                <span>Vanliga missuppfattningar</span><span style={{ color: 'var(--lab-ink-muted)' }}>▾</span>
                            </summary>
                            <ul className="mt-3 space-y-2 text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                <li><strong>”Det jag blir trött av är arbete.”</strong> Nej. Att bära en väska rakt fram eller trycka mot en vägg som inte
                                    rör sig ger inget arbete i fysikens mening, eftersom ingenting flyttas i kraftens riktning. Musklerna blir ändå trötta,
                                    men energin som musklerna gör av med blir värme i kroppen.</li>
                                <li><strong>”Större kraft ger alltid större arbete.”</strong> Bara om sträckan och vinkeln är desamma. En stor kraft i
                                    stor vinkel kan ge mindre arbete än en liten kraft rakt framåt.</li>
                                <li><strong>”Det tyngre föremålet kräver alltid mer arbete att lyfta.”</strong> Det beror också på höjden. Att lyfta 1 kg 0,6 m uppåt ger
                                    samma arbete som att lyfta 2 kg 0,3 m, eftersom arbetet är kraft gånger sträcka.</li>
                                <li><strong>”Tyngdkraften och normalkraften uträttar arbete när lådan dras längs bänken.”</strong> Nej. Båda är
                                    vinkelräta mot rörelsen, så deras komposant längs rörelsen är noll.</li>
                                <li><strong>”Arbete kan inte vara negativt.”</strong> Jo. Pekar kraften bakåt mot rörelsen tar den energi från föremålet.
                                    Prova försöket Bromsa vagnen i Utforska-läget.</li>
                            </ul>
                        </details>
