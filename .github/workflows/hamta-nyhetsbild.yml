# Hämtar en fri pressbild till en nyhetsartikel och committar den i
# nyheter/bilder/.
#
# VARFÖR DEN FINNS
# Nyhetsagenten kan köras i en miljö vars nätverk bara släpper igenom GitHub
# (t.ex. Claude Code på webben). Då går det inte att ladda ner pressbilden
# från NOIRLab, ESO, EurekAlert! eller Wikimedia — och artikeln får en
# AI-illustration trots att det finns ett äkta foto. Den här körningen gör
# nedladdningen från en runner som har fri utgående trafik.
#
# ANVÄNDNING (fliken Actions → Hämta nyhetsbild → Run workflow)
#   url  – bildsida ELLER direktlänk till bildfilen. På en bildsida letas
#          största jpg/png i sidans HTML upp automatiskt.
#   fil  – filnamn under nyheter/bilder/, t.ex. 2026-08-05-rubin.jpg
#
# Licensen kontrolleras INTE av körningen — det ansvaret ligger kvar hos den
# som väljer bilden. Se Bildregler i .claude/agents/nyhetsagent.md.

name: Hämta nyhetsbild

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Bildsida eller direktlänk till bilden'
        required: true
      fil:
        description: 'Filnamn under nyheter/bilder/ (t.ex. 2026-08-05-rubin.jpg)'
        required: true
      maxbredd:
        description: 'Skala ner till högst så här många pixlar bred'
        required: false
        default: '1920'

jobs:
  hamta:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Hämta bilden
        env:
          URL: ${{ inputs.url }}
          FIL: ${{ inputs.fil }}
          MAXBREDD: ${{ inputs.maxbredd }}
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36'

          case "$FIL" in
            */*|"") echo "fil ska vara ett filnamn utan katalog"; exit 1 ;;
          esac

          typ=$(curl -sSL -A "$UA" -o /dev/null -w '%{content_type}' "$URL")
          echo "content-type: $typ"

          if [ "${typ#image/}" != "$typ" ]; then
            bildurl="$URL"
          else
            # Bildsida: leta upp arkivets jpg/png. Största varianten först.
            curl -sSL -A "$UA" "$URL" -o sida.html
            echo "--- kandidater ---"
            grep -oE 'https?://[^"'"'"' ]+\.(jpg|jpeg|png)' sida.html | sort -u | tee kandidater.txt
            bildurl=$(grep -E '/(original|fullsize|large)/' kandidater.txt | head -1 || true)
            [ -n "$bildurl" ] || bildurl=$(grep -E '/(screen|publicationjpg|wallpaper)/' kandidater.txt | head -1 || true)
            [ -n "$bildurl" ] || { echo "Hittade ingen bildlänk på sidan"; exit 1; }
            echo "--- bildtext/kredit i sidans metadata ---"
            grep -oE '<meta[^>]+(og:description|og:title)[^>]*>' sida.html | head -5 || true
          fi

          echo "laddar ner: $bildurl"
          curl -sSL -A "$UA" "$bildurl" -o rå.bin
          file rå.bin
          case "$(file -b --mime-type rå.bin)" in
            image/*) ;;
            *) echo "Nedladdad fil är ingen bild"; exit 1 ;;
          esac

          mkdir -p nyheter/bilder
          # -strip tar bort EXIF; bredden kapas men bilden förstoras aldrig.
          convert rå.bin -resize "${MAXBREDD}x>" -strip -quality 84 "nyheter/bilder/$FIL"
          identify "nyheter/bilder/$FIL"
          ls -l "nyheter/bilder/$FIL"

      - name: Committa bilden
        env:
          FIL: ${{ inputs.fil }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "nyheter/bilder/$FIL"
          git diff --cached --quiet && { echo "Bilden var redan identisk"; exit 0; }
          git commit -m "Hämta pressbild $FIL"
          git push origin HEAD:${{ github.ref_name }}
