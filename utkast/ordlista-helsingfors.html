<!--
  ordlista-helsingfors.html: privat övningssida (inte länkad från sajten, noindex).
  101 svensk-engelska ord och fraser inför Nordplus-seminariet NGGN + AI i Esbo
  23–25 oktober 2026: skola och styrdokument, undervisning och bedömning,
  matematik, digitala verktyg och AI, projektet och seminariet.

  Flashcards i rundor: runda 1 går igenom alla ord i valt urval en gång, i
  blandad ordning. Runda 2 tar bara de ord som missades i runda 1, runda 3 de
  som missades i runda 2, och så vidare tills alla är klara. Ett ord kommer
  alltså aldrig tillbaka förrän rundan är slut. Allt sparas i localStorage
  (nyckeln fysiklabbet.ordlista-hki.v1). Uttal via webbläsarens talsyntes (en-GB).
-->
<style>
:root {
  --bg: #f3eee4; --bg2: #ebe4d4; --panel: #fffdf9; --ink: #0f1620; --soft: #3f4a5c; --muted: #69655c;
  --line: rgba(15,22,32,.10); --line2: rgba(15,22,32,.20);
  --accent: #c8324a; --accent-soft: rgba(200,50,74,.09); --blue: #1c3d6b; --blue-soft: rgba(28,61,107,.09);
  --green: #2f6b4f; --green-soft: rgba(47,107,79,.12);
  --shadow: 0 1px 2px rgba(15,22,32,.05), 0 24px 50px -26px rgba(15,22,32,.4);
  --sans: "DM Sans", system-ui, sans-serif; --serif: "Instrument Serif", Georgia, serif; --mono: "JetBrains Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: radial-gradient(900px 500px at 0% -10%, rgba(200,50,74,.07), transparent 60%), radial-gradient(900px 600px at 110% 0%, rgba(28,61,107,.08), transparent 60%), var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; min-height: 100dvh; }
button { font-family: inherit; font-size: inherit; color: inherit; cursor: pointer; }
.wrap { max-width: 760px; margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 18px; min-height: 100dvh; }
header .over { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px; }
header .over span { color: var(--muted); }
h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(38px, 8vw, 58px); line-height: 1; margin: 0; letter-spacing: -.01em; }
h1 em { color: var(--accent); }
.framsteg { display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.framsteg .stapel { flex: 1; height: 8px; border-radius: 4px; background: var(--line2); overflow: hidden; display: flex; }
.framsteg .stapel i { display: block; height: 100%; transition: width .4s; }
.framsteg .stapel i.l3 { background: var(--green); } .framsteg .stapel i.l2 { background: #6c9b83; } .framsteg .stapel i.l1 { background: rgba(200,50,74,.35); }
.reglage { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { border: 1px solid var(--line2); background: var(--panel); border-radius: 999px; padding: 6px 12px; font-size: 13px; }
.chip[aria-pressed=true] { background: var(--ink); color: #fff; border-color: var(--ink); }
.vaxel { display: inline-flex; border: 1px solid var(--line2); border-radius: 10px; overflow: hidden; margin-left: auto; }
.vaxel button { border: 0; background: var(--panel); padding: 7px 12px; font-size: 13px; }
.vaxel button[aria-pressed=true] { background: var(--blue); color: #fff; }

/* Kortet */
.scen { perspective: 1400px; flex: 1; display: flex; flex-direction: column; gap: 14px; min-height: 360px; }
.kort { position: relative; flex: 1; min-height: 300px; border: 0; padding: 0; background: none; text-align: left; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.2,.7,.2,1); }
.kort.vand { transform: rotateY(180deg); }
.sida { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); padding: 26px 26px 22px; display: flex; flex-direction: column; }
.sida.bak { transform: rotateY(180deg); background: linear-gradient(180deg, #fffdf9, #f8f4ec); }
.sida .topp { display: flex; justify-content: space-between; align-items: center; font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.lador { display: inline-flex; gap: 4px; }
.lador i { width: 8px; height: 8px; border-radius: 2px; background: var(--line2); }
.lador i.p { background: var(--green); }
.ordet { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
.ordet .huvud { font-family: var(--serif); font-size: clamp(38px, 9vw, 64px); line-height: 1.02; letter-spacing: -.01em; overflow-wrap: anywhere; }
.ordet .not { color: var(--soft); font-size: 16px; line-height: 1.5; }
.ordet .exempel { font-size: 17px; line-height: 1.55; color: var(--soft); border-left: 3px solid var(--accent); padding-left: 12px; font-style: italic; }
.ordet .exempel b { color: var(--ink); font-style: normal; }
.sida .tips { font-size: 13px; color: var(--muted); }
.lyssna { align-self: flex-start; display: inline-flex; gap: 8px; align-items: center; border: 1px solid var(--line2); background: #fff; border-radius: 999px; padding: 7px 12px; font-size: 13px; }
.knappar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.knappar button { border-radius: 14px; padding: 15px; font-size: 16px; font-weight: 600; border: 1.5px solid; }
.nej { background: var(--accent-soft); border-color: rgba(200,50,74,.4) !important; color: #7a1d2d; }
.ja { background: var(--green-soft); border-color: rgba(47,107,79,.45) !important; color: #1f4a36; }
.vand-knapp { grid-column: 1 / -1; background: var(--blue); border-color: var(--blue) !important; color: #fff; }
.kbd { font-family: var(--mono); font-size: 11px; opacity: .65; font-weight: 400; margin-left: 6px; }

/* Lista */
.lista { display: flex; flex-direction: column; gap: 18px; }
.lista h2 { font-family: var(--serif); font-weight: 400; font-size: 28px; margin: 6px 0 0; }
.lista table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.lista td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; line-height: 1.45; font-size: 15px; }
.lista tr:last-child td { border-bottom: 0; }
.lista td:first-child { width: 42%; color: var(--soft); }
.lista td:nth-child(2) { font-weight: 600; }
.lista td small { display: block; font-weight: 400; color: var(--muted); font-style: italic; margin-top: 2px; }
.lista td .lador { margin-left: 6px; vertical-align: middle; }
.klart { text-align: center; padding: 40px 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); }
.klart p { color: var(--soft); line-height: 1.55; margin: 0 0 20px; }
.runda { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.runda b { color: var(--blue); font-weight: 500; }
.runda .ny { color: var(--accent); }
.klart h2 { font-family: var(--serif); font-weight: 400; font-size: 40px; margin: 0 0 8px; }
footer { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
footer button { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 0; }
.bekrafta { color: var(--accent); }
.bekrafta button { margin-left: 8px; color: var(--accent); }
@media (prefers-reduced-motion: reduce) { .kort { transition: none; } }
</style>
</head>

</div>

    ['språkmodell', 'large language model', 'Digitalt och AI', 'A <b>large language model</b> predicts text; it does not check the maths.', 'Förkortning: LLM.'],
    ['AI-agent', 'AI agent', 'Digitalt och AI', 'An <b>AI agent</b> can edit files and run code, not just chat.'],
    ['simulering', 'simulation', 'Digitalt och AI', 'The <b>simulation</b> lets students change one variable at a time.'],
    ['källkritik', 'source criticism', 'Digitalt och AI', 'Students need <b>source criticism</b> when they ask a chatbot.', 'Även: critical evaluation of sources.'],
    ['digital kompetens', 'digital competence', 'Digitalt och AI', '<b>Digital competence</b> is one of the key goals of the curriculum.'],

    // Projektet och seminariet
    ['läroplansjämförelse', 'curriculum comparison', 'Projektet', 'Our <b>curriculum comparison</b> covers upper secondary school.'],
    ['mervärde', 'added value', 'Projektet', 'What is the <b>added value</b> of the tool in this lesson?'],
    ['fallgrop', 'pitfall', 'Projektet', 'One <b>pitfall</b> is that students copy numbers without thinking.'],
    ['pilotera', 'to pilot', 'Projektet', 'Each country will <b>pilot</b> two or three resources from another partner.'],
    ['sprida resultaten', 'to disseminate the results', 'Projektet', 'We will <b>disseminate the results</b> at local workshops.'],
    ['fortbildning', 'professional development', 'Projektet', 'The framework is for teacher <b>professional development</b> workshops.', 'Förkortning: CPD (continuing professional development).'],
    ['lärarutbildning', 'teacher education', 'Projektet', 'Several partners work in <b>teacher education</b>.', 'Även: teacher training.'],
    ['ansökan', 'application', 'Projektet', 'The <b>application</b> was submitted in February.'],
    ['ersättning för utlägg', 'reimbursement', 'Projektet', 'I keep the receipts for the <b>reimbursement</b>.'],

    // Tillagda senare: läggs alltid sist, så att sparade lådor och rundor behåller sina index.
    ['huvudräkning', 'mental arithmetic', 'Matematik', 'With the rule of 72, students can solve the equation by <b>mental arithmetic</b>.', 'Även: mental maths. Räkna i huvudet: work it out in your head.']
  ];

  var NYCKEL = 'fysiklabbet.ordlista-hki.v1';
  function $(id) { return document.getElementById(id); }
  var st = { lador: {}, riktning: 'sv', lage: 'kort', kat: 'Alla' };
  try { var sparat = JSON.parse(localStorage.getItem(NYCKEL) || 'null'); if (sparat) st = Object.assign(st, sparat); } catch (e) {}
  function spara() { try { localStorage.setItem(NYCKEL, JSON.stringify(st)); } catch (e) {} }
  function lada(i) { return st.lador[i] || 0; }

  var kategorier = ['Alla'];
  ORD.forEach(function (o) { if (kategorier.indexOf(o[2]) < 0) kategorier.push(o[2]); });
  var kat = $('kategorier');
  kategorier.forEach(function (k) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.dataset.kat = k;
    b.textContent = k === 'Alla' ? 'Alla (' + ORD.length + ')' : k + ' (' + ORD.filter(function (o) { return o[2] === k; }).length + ')';
    b.addEventListener('click', function () { if (st.kat !== k) { st.kat = k; nyGenomgang(); } nuvarande = null; ritaAllt(); nastaKort(); });
    kat.appendChild(b);
  });

  function urval() {
    var ut = [];
    ORD.forEach(function (o, i) { if (st.kat === 'Alla' || o[2] === st.kat) ut.push(i); });
    return ut;
  }
  // Rundor: kön innehåller rundans ord i blandad ordning. Missade ord samlas till nästa runda.
  var nuvarande = null;
  function blanda(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function nyGenomgang() {
    var u = urval();
    st.cykel = { kat: st.kat, runda: 1, ko: blanda(u), missade: [], klara: [], antal: u.length, rundstorlek: u.length };
    spara();
  }
  function cykelGiltig() {
    var c = st.cykel;
    if (!(c && c.kat === st.kat && Array.isArray(c.ko) && Array.isArray(c.missade))) return false;
    // Ord som har lagts till i listan efter att genomgången startade läggs sist i den pågående rundan.
    var finns = c.ko.concat(c.missade, c.klara), nya = urval().filter(function (i) { return finns.indexOf(i) < 0; });
    if (nya.length) { c.ko = c.ko.concat(blanda(nya)); c.antal += nya.length; c.rundstorlek += nya.length; spara(); }
    return true;
  }
  function ladorHtml(i) { var s = ''; for (var k = 1; k <= 3; k++) s += '<i class="' + (lada(i) >= k ? 'p' : '') + '"></i>'; return s; }

  function visaKort(i) {
    nuvarande = i;
    var o = ORD[i], sv = st.riktning === 'sv';
    $('kort').classList.remove('vand');
    $('f-kat').textContent = o[2] + (sv ? ' · svenska' : ' · engelska');
    $('b-kat').textContent = o[2] + (sv ? ' · engelska' : ' · svenska');
    $('f-lador').innerHTML = $('b-lador').innerHTML = ladorHtml(i);
    $('f-ord').textContent = sv ? o[0] : o[1];
    $('f-not').textContent = '';
    $('b-ord').textContent = sv ? o[1] : o[0];
    $('b-not').textContent = o[4] || '';
    $('b-ex').innerHTML = o[3] || '';
    $('vand').hidden = false; $('nej').hidden = true; $('ja').hidden = true;
  }
  function nastaKort() {
    if (st.lage !== 'kort') return;
    if (!cykelGiltig()) nyGenomgang();
    var c = st.cykel;
    if (!c.ko.length && c.missade.length) {
      c.runda++; c.ko = blanda(c.missade); c.missade = []; c.rundstorlek = c.ko.length; spara();
    }
    ritaRunda();
    if (!c.ko.length) { visaKlart(); return; }
    $('klart').hidden = true; $('kort').hidden = false; document.querySelector('.knappar').hidden = false; $('lyssna').hidden = !('speechSynthesis' in window);
    var i = c.ko[0];
    // Låt kortet vända tillbaka innan nästa ord visas, så att baksidan inte syns.
    if ($('kort').classList.contains('vand')) { $('kort').classList.remove('vand'); setTimeout(function () { visaKort(i); }, 280); }
    else visaKort(i);
  }
  function vand() {
    if (nuvarande == null) return;
    var v = !$('kort').classList.contains('vand');
    $('kort').classList.toggle('vand', v);
    $('vand').hidden = v; $('nej').hidden = !v; $('ja').hidden = !v;
    if (v && st.riktning === 'sv') tala(ORD[nuvarande][1]);
  }
  function svara(kunde) {
    if (nuvarande == null || !$('kort').classList.contains('vand')) return;
    var c = st.cykel, i = c.ko.shift();
    if (kunde) { if (c.klara.indexOf(i) < 0) c.klara.push(i); }
    else c.missade.push(i);
    st.lador[i] = kunde ? Math.min(3, lada(i) + 1) : 0;
    spara(); nastaKort(); ritaFramsteg();
  }
  function ritaRunda() {
    var c = st.cykel, gjort = c.rundstorlek - c.ko.length;
    $('runda').innerHTML = '<span><b>Runda ' + c.runda + '</b>' + (c.runda > 1 ? ' · <span class="ny">' + (c.rundstorlek === 1 ? 'ordet du missade' : 'de ' + c.rundstorlek + ' du missade') + '</span>' : '') + '</span><span>' +
      Math.min(gjort + 1, c.rundstorlek) + ' av ' + c.rundstorlek + (c.missade.length ? ' · ' + c.missade.length + ' till nästa runda' : '') + '</span>';
  }
  function visaKlart() {
    var c = st.cykel;
    nuvarande = null;
    $('kort').hidden = true; document.querySelector('.knappar').hidden = true; $('lyssna').hidden = true;
    $('klart').hidden = false;
    $('runda').innerHTML = '<span><b>Klart</b></span><span>' + c.antal + ' av ' + c.antal + '</span>';
    $('klart-rubrik').textContent = 'Alla ' + c.antal + ' ord klara!';
    $('klart-text').textContent = c.runda === 1 ? 'Alla rätt på första rundan.' : 'Det tog ' + c.runda + ' rundor. Kör en ny genomgång i morgon, så sitter orden ännu bättre.';
  }
  $('ny-genomgang').addEventListener('click', function () { nyGenomgang(); ritaFramsteg(); nastaKort(); });
  $('kort').addEventListener('click', vand);
  $('vand').addEventListener('click', vand);
  $('ja').addEventListener('click', function () { svara(true); });
  $('nej').addEventListener('click', function () { svara(false); });
  document.addEventListener('keydown', function (e) {
    if (st.lage !== 'kort') return;
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!$('kort').classList.contains('vand')) vand(); }
    else if (e.key === 'ArrowRight') svara(true);
    else if (e.key === 'ArrowLeft') svara(false);
  });

  // Uttal: webbläsarens talsyntes, brittisk engelska om den finns.
  var rost = null;
  function hittaRost() {
    if (!('speechSynthesis' in window)) return;
    var r = speechSynthesis.getVoices();
    rost = r.filter(function (v) { return /en-GB/i.test(v.lang); })[0] || r.filter(function (v) { return /^en/i.test(v.lang); })[0] || null;
  }
  if ('speechSynthesis' in window) { hittaRost(); speechSynthesis.onvoiceschanged = hittaRost; }
  else $('lyssna').hidden = true;
  function tala(text) {
    if (!('speechSynthesis' in window) || !st.ljud) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text); u.lang = 'en-GB'; if (rost) u.voice = rost; u.rate = 0.92;
    speechSynthesis.speak(u);
  }
  $('lyssna').addEventListener('click', function () {
    if (nuvarande == null) return;
    st.ljud = true; spara();
    var o = ORD[nuvarande];
    tala($('kort').classList.contains('vand') || st.riktning === 'en' ? o[1] : o[1]);
  });

  // Stapeln: klara ord i den här genomgången (grönt) och ord som väntar på nästa runda (ljust).
  function ritaFramsteg() {
    if (!cykelGiltig()) nyGenomgang();
    var c = st.cykel, klara = c.klara.length, missade = c.missade.length;
    $('kan').textContent = klara + ' / ' + c.antal;
    $('s3').style.width = (klara / c.antal * 100) + '%';
    $('s2').style.width = '0%';
    $('s1').style.width = (missade / c.antal * 100) + '%';
    $('status').textContent = 'Klara: ' + klara + ' · Kvar i rundan: ' + c.ko.length + ' · Till nästa runda: ' + missade;
  }
  function ritaLista() {
    var html = '';
    kategorier.slice(1).forEach(function (k) {
      if (st.kat !== 'Alla' && st.kat !== k) return;
      html += '<h2>' + k + '</h2><div style="overflow-x:auto"><table>';
      ORD.forEach(function (o, i) {
        if (o[2] !== k) return;
        html += '<tr><td>' + o[0] + '</td><td>' + o[1] + '<span class="lador">' + ladorHtml(i) + '</span>' + (o[4] ? '<small>' + o[4] + '</small>' : '') + '</td></tr>';
      });
      html += '</table></div>';
    });
    $('lista').innerHTML = html;
  }
  function ritaAllt() {
    [].forEach.call(kat.children, function (b) { b.setAttribute('aria-pressed', String(b.dataset.kat === st.kat)); });
    document.querySelectorAll('[data-riktning]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.riktning === st.riktning)); });
    document.querySelectorAll('[data-lage]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.lage === st.lage)); });
    $('scen').hidden = st.lage !== 'kort';
    $('lista').hidden = st.lage !== 'lista';
    if (st.lage === 'lista') ritaLista();
    ritaFramsteg();
  }
  document.querySelectorAll('[data-riktning]').forEach(function (b) {
    b.addEventListener('click', function () { st.riktning = b.dataset.riktning; spara(); ritaAllt(); if (nuvarande != null) visaKort(nuvarande); });
  });
  document.querySelectorAll('[data-lage]').forEach(function (b) {
    b.addEventListener('click', function () { st.lage = b.dataset.lage; spara(); ritaAllt(); if (st.lage === 'kort') nastaKort(); });
  });
  $('nollstall').addEventListener('click', function () { $('bekrafta').hidden = false; });
  $('nej-nollstall').addEventListener('click', function () { $('bekrafta').hidden = true; });
  $('ja-nollstall').addEventListener('click', function () { st.lador = {}; nyGenomgang(); $('bekrafta').hidden = true; ritaAllt(); nastaKort(); });

  ritaAllt();
  nastaKort();
})();
</script>
