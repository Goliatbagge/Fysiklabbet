    <script id="varme-motor">
// Motorn för Värmeflödet (fysik1-andra-huvudsatsen-app.html).
// Källan ligger här och klistras in oförändrad i sidan; testet
// .claude/test-varme-motor.js kontrollerar fysiken och att kopian är identisk.
//
// Läge 1: två block som utbyter energi. Varje block är en Einsteinkristall
// med N svängande partiklar (N proportionellt mot massan) och q energikvanta,
// "brickor". Antalet sätt att fördela q brickor på N partiklar är
//     Ω(N, q) = (q + N − 1)! / (q! · (N − 1)!)
// och för de två blocken tillsammans Ω_A · Ω_B. Varje partikel har sitt
// eget antal brickor. I varje steg väljs två partiklar helt på måfå, utan
// hänsyn till block eller temperatur, och har den första minst en bricka
// flyttas en bricka till den andra. Förslaget är symmetriskt, så alla
// mikrotillstånd blir lika sannolika, och en fördelning mellan blocken blir
// lika sannolik som sitt antal sätt. Systemet hamnar därför där sätten är flest.
// Temperaturen räknas som T = κ · q / N (i °C), där κ väljs så att
// starttemperaturerna stämmer. Brickorna är alltså bara energin över 0 °C.
//
// Läge 2: värmemaskinen och värmepumpen mellan två behållare. Den största
// möjliga verkningsgraden är η_max = 1 − T_k / T_v (kelvin), och en
// värmepump kan hämta högst Q_k = W · T_k / (T_v − T_k) från den kalla sidan.
(function () {
    const PER_KG = 50;               // svängande partiklar per kilogram i modellen

    // ln Γ(x) med Lanczos approximation
    const LG = [676.5203681218851, -1259.1392167224028, 771.32342877765313, -176.61502916214059,
                12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
    function lnGamma(x) {
        if (x < 0.5) return Math.log(Math.PI / Math.sin(Math.PI * x)) - lnGamma(1 - x);
        x -= 1;
        let a = 0.99999999999980993;
        const t = x + 7.5;
        for (let i = 0; i < 8; i++) a += LG[i] / (x + i + 1);
        return 0.5 * Math.log(2 * Math.PI) + (x + 0.5) * Math.log(t) - t + Math.log(a);
    }
    const lnOmega = (N, q) => lnGamma(q + N) - lnGamma(q + 1) - lnGamma(N);
    const lnSatt = (st, qA) => lnOmega(st.NA, qA) + lnOmega(st.NB, st.q - qA);
    // ln Ω för varje möjlig fördelning qA = 0 … q
    function fordelning(st) {
        const ut = [];
        for (let qA = 0; qA <= st.q; qA++) ut.push(lnSatt(st, qA));
        return ut;
    }

    // Två block med massorna mA, mB (kg) och temperaturerna TA, TB (°C, > 0), q brickor.
    function nyttPar({ mA, mB, TA, TB, q }, slump = Math.random) {
        const NA = Math.max(1, Math.round(PER_KG * mA)), NB = Math.max(1, Math.round(PER_KG * mB));
        const kappa = (NA * TA + NB * TB) / q;
        const qA = Math.max(0, Math.min(q, Math.round(NA * TA / kappa)));
        // brickorna läggs ut på måfå bland partiklarna i respektive block
        const n = new Array(NA + NB).fill(0);
        for (let i = 0; i < qA; i++) n[Math.floor(slump() * NA)]++;
        for (let i = qA; i < q; i++) n[NA + Math.floor(slump() * NB)]++;
        return { NA, NB, q, qA, qA0: qA, kappa, n, t: 0, hopp: 0, tillbaka: 0 };
    }
    const temp = (st, qA = st.qA) => ({ A: st.kappa * qA / st.NA, B: st.kappa * (st.q - qA) / st.NB });
    const slutTemp = (st) => st.kappa * st.q / (st.NA + st.NB);

    // Ett steg: två partiklar väljs på måfå. Returnerar +1 om en bricka gick
    // från B till A, −1 om den gick från A till B och 0 annars (ingen bricka
    // att flytta, eller en flytt inom samma block).
    function hopp(st, slump = Math.random) {
        const N = st.NA + st.NB;
        const i = Math.floor(slump() * N), j = Math.floor(slump() * N);
        st.hopp++;
        if (st.n[i] === 0 || i === j) return 0;
        st.n[i]--; st.n[j]++;
        const iA = i < st.NA, jA = j < st.NA;
        if (iA === jA) return 0;
        st.qA += jA ? 1 : -1;
        if (st.qA === st.qA0) st.tillbaka++;
        return jA ? 1 : -1;
    }
    // Sannolikheten (som tiologaritm) att råka befinna sig i startfördelningen.
    function log10ChansStart(st) {
        const l = fordelning(st);
        const max = Math.max(...l);
        const summa = max + Math.log(l.reduce((s, x) => s + Math.exp(x - max), 0));
        return (lnSatt(st, st.qA0) - summa) / Math.LN10;
    }

    // ── Värmemaskinen ──
    const etaMax = (Tv, Tk) => (Tv > Tk ? 1 - Tk / Tv : 0);
    function maskin(Tv, Tk, eta, Qv) {
        const W = eta * Qv;
        return { W, Qk: Qv - W, etaMax: etaMax(Tv, Tk), mojlig: eta <= etaMax(Tv, Tk) + 1e-9 };
    }
    // Värmepumpen: arbetet W hämtar värmen Qk från den kalla sidan och lämnar Qv = W + Qk på den varma.
    const qkMax = (Tv, Tk, W) => (Tv > Tk ? W * Tk / (Tv - Tk) : Infinity);
    function pump(Tv, Tk, W, Qk) {
        return { Qv: W + Qk, qkMax: qkMax(Tv, Tk, W), mojlig: Qk <= qkMax(Tv, Tk, W) + 1e-9 };
    }

    const ut = { PER_KG, lnGamma, lnOmega, lnSatt, fordelning, nyttPar, temp, slutTemp, hopp, log10ChansStart, etaMax, maskin, qkMax, pump };
    if (typeof window !== 'undefined') window.VarmeMotor = ut;
    if (typeof module !== 'undefined') module.exports = ut;
})();
</script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const M = window.VarmeMotor;

        // ── Talformat: decimalkomma, äkta minustecken, exakt noll som "0", hårt mellanslag i tusental ──
        const fmt = (num, d = 1) => {
            if (!isFinite(num)) return '–';
            const s = num.toFixed(d);
            if (parseFloat(s) === 0) return '0';
            const [hel, dec] = s.replace('-', '').split('.');
            const grupper = hel.length > 3 ? hel.replace(/\B(?=(\d{3})+(?!\d))/g, ' ') : hel;
            return (num < 0 ? '−' : '') + grupper + (dec !== undefined ? ',' + dec : '');
        };
        // ett stort tal som a · 10^b, i SVG
        const Tiopot = ({ lg }) => {
            if (lg < 6) return <tspan>{fmt(Math.pow(10, lg), 0)}</tspan>;
            const b = Math.floor(lg), a = Math.pow(10, lg - b);
            return <tspan>{fmt(a, 1)} · 10<tspan dy="-6" fontSize="0.72em">{b}</tspan><tspan dy="6"> </tspan></tspan>;
        };

        // Text som byggs i koden översätts här (norska med ?lang=nb), med {platshållare}.
        const tr = (s, v) => (window.I18N ? I18N.t(s, v) : s.replace(/\{(\w+)\}/g, (m, k) => (v && v[k] != null ? v[k] : m)));
        // Ren text med variabler i kursiv: T_v, Q_k, η_max får index.
        const Fx = ({ text: sv }) => {
            const text = tr(sv);
            const delar = [];
            const re = /(?<![\p{L}\d])([TQWmη])_([\p{L}\d]+)|(?<![\p{L}\d])([TQWη])(?![\p{L}\d])/gu;
            let sist = 0, mm, n = 0;
            while ((mm = re.exec(text))) {
                if (mm.index > sist) delar.push(text.slice(sist, mm.index));
                if (mm[1]) delar.push(<span key={n++}><em>{mm[1]}</em><sub>{mm[2]}</sub></span>);
                else delar.push(<em key={n++}>{mm[3]}</em>);
                sist = re.lastIndex;
            }
            delar.push(text.slice(sist));
            return <React.Fragment>{delar}</React.Fragment>;
        };
        const Brak = ({ t, n }) => (
            <span style={{ display: 'inline-flex', flexDirection: 'column', verticalAlign: 'middle', textAlign: 'center',
                           lineHeight: 1.05, fontSize: '0.92em', margin: '0 3px' }}>
                <span style={{ padding: '0 2px 1px' }}>{t}</span>
                <span style={{ padding: '1px 2px 0', borderTop: '1.5px solid currentColor' }}>{n}</span>
            </span>
        );
        const Sub = ({ s, i }) => <span><em>{s}</em><sub>{i}</sub></span>;

        const COL = {
            ink:   '#0f1620',
            soft:  'rgba(15,22,32,0.7)',
            varm:  '#d9480f',
            kall:  '#2563c9',
            W:     '#15803d',
            sliten:'#94a3b8',
            grans: '#c8324a',
            bricka:'#7c3aed',
        };
        const KELVIN = 273.15;

        // ════════════════════════════════════════════════════════
        //  SCENENS GEOMETRI (viewBox 1000 × 660)
        // ════════════════════════════════════════════════════════
        const VB_W = 1000, VB_H = 660;
        const BENK = 560;                                   // bänkskivans ovansida i läge 1
        const LADA = { x: 30, y: 150, w: 510, h: 410, t: 20 };   // den isolerade lådan
        const GOLV = LADA.y + LADA.h - LADA.t;              // lådans inre botten
        const MITT = LADA.x + LADA.w / 2;                    // där blocken möts
        const KOL = 10, SP = 16, ATOM_R = 5.2;               // atomgittret i blocken
        const BLOCK_W = KOL * SP + 10;
        const GAP_ISAR = 44;
        const blockH = (N) => Math.ceil(N / KOL) * SP + 10;
        // blockets yta i scenen; gap är glipan mellan blocken (0 = i kontakt)
        function blockRekt(st, sida, gap) {
            const N = sida === 'A' ? st.NA : st.NB;
            const h = blockH(N);
            const x = sida === 'A' ? MITT - gap / 2 - BLOCK_W : MITT + gap / 2;
            return { x, y: GOLV - h, w: BLOCK_W, h };
        }
        // var atom nummer i sitter (block A har atomerna 0 … NA − 1)
        function atomPos(st, i, rA, rB) {
            const iA = i < st.NA, k = iA ? i : i - st.NA, r = iA ? rA : rB;
            const kol = k % KOL, rad = Math.floor(k / KOL);
            return { x: r.x + 5 + SP / 2 + kol * SP, y: r.y + r.h - 5 - SP / 2 - rad * SP };
        }
        // atomens färg efter hur många brickor den har: mörk koppar när den
        // saknar energi, glödande gul när den har många
        const ATOMFARG = ['#5b2f17', '#a8501f', '#d9731f', '#ef9a1f', '#f6bf2a', '#fbd55a'];
        const atomFarg = (n) => ATOMFARG[Math.min(ATOMFARG.length - 1, n)];

        // ════════════════════════════════════════════════════════
        //  RITDELAR
        // ════════════════════════════════════════════════════════
        // Pil med rakt avslutat skaft som slutar vid huvudets bas.
        const Pil = ({ x1, y1, x2, y2, color, width = 4.5, head = 15, dash = false, opacity = 1 }) => {
            const len = Math.hypot(x2 - x1, y2 - y1);
            if (len < 2) return null;
            const ux = (x2 - x1) / len, uy = (y2 - y1) / len;
            const hd = Math.min(head, len * 0.9);
            const bx = x2 - ux * hd, by = y2 - uy * hd;
            const hw = hd * 0.48;
            return (
                <g opacity={opacity}>
                    <line x1={x1} y1={y1} x2={bx} y2={by} stroke={color} strokeWidth={width}
                          strokeLinecap="butt" strokeDasharray={dash ? '7 5' : undefined} />
                    <polygon points={`${x2},${y2} ${bx - uy * hw},${by + ux * hw} ${bx + uy * hw},${by - ux * hw}`} fill={color} />
                </g>
            );
        };
        // Beteckning med index i SVG: variabeln kursiv, indexet rakt.
        const SvgVar = ({ s, i, size }) => (
            <React.Fragment>
                <tspan fontStyle="italic">{s}</tspan>
                {i != null && <tspan fontSize={size * 0.7} dy={size * 0.26}>{i}</tspan>}
                {i != null && <tspan dy={-size * 0.26}>{' '}</tspan>}
            </React.Fragment>
        );
        // En bricka: en liten energiruta.
        const Bricka = ({ x, y, s = 8, fill = '#e2a40e' }) => (
            <rect x={x - s / 2} y={y - s / 2} width={s} height={s} rx="1.6" fill={fill} stroke="rgba(15,22,32,0.55)" strokeWidth="0.9" />
        );
        // Labbänk i trä
        const Bank = ({ y, h = 30 }) => (
            <g>
                <rect x="0" y={y} width={VB_W} height={h} fill="#c9a578" />
                <rect x="0" y={y} width={VB_W} height="5" fill="#dcbd92" />
                {[0.35, 0.6, 0.82].map((f, i) => (
                    <path key={i} d={`M 0 ${y + h * f} C 220 ${y + h * f - 3} 420 ${y + h * f + 3} 640 ${y + h * f - 1} S 900 ${y + h * f + 2} 1000 ${y + h * f}`}
                          stroke="rgba(120,78,36,0.28)" strokeWidth="1.2" fill="none" />
                ))}
                <rect x="0" y={y + h} width={VB_W} height={VB_H - y - h} fill="#e3d7c1" />
                <line x1="0" y1={y + h} x2={VB_W} y2={y + h} stroke="rgba(15,22,32,0.25)" strokeWidth="1" />
            </g>
        );

        // ════════════════════════════════════════════════════════
        //  LÄGE 1: VARMT OCH KALLT
        // ════════════════════════════════════════════════════════
        const BlockScen = ({ st, gap, Tvisad, hist, flyg, nu, dolj, kula, flode, klickBlock }) => {
            // termometrarna skickar sina värden trådlöst till dataloggern
            const rA = blockRekt(st, 'A', gap), rB = blockRekt(st, 'B', gap);
            const l = M.fordelning(st);
            const lmax = Math.max(...l);
            const lgNu = l[st.qA] / Math.LN10, lgMax = lmax / Math.LN10;
            // en bricka i luften räknas fortfarande hos den atom den lämnade
            const n = st.n.slice();
            flyg.forEach((f) => { n[f.j]--; n[f.i]++; });
            const tid = nu / 1000;
            const blockGrupp = (k, r, T) => {
                const i0 = k === 'A' ? 0 : st.NA, i1 = k === 'A' ? st.NA : st.NA + st.NB;
                const atomer = [];
                for (let i = i0; i < i1; i++) {
                    const p = atomPos(st, i, rA, rB), e = Math.max(0, n[i]);
                    // svängningen växer med energin
                    const a = Math.min(3.4, 1.15 * Math.sqrt(e));
                    const dx = a * Math.sin(tid * (13 + (i * 7) % 9) + i * 1.7), dy = a * Math.cos(tid * (11 + (i * 5) % 7) + i * 2.3);
                    atomer.push(<circle key={i} cx={p.x + dx} cy={p.y + dy} r={ATOM_R} fill={atomFarg(e)} stroke="rgba(40,18,6,0.55)" strokeWidth="0.8" />);
                }
                const probeX = k === 'A' ? r.x + 24 : r.x + r.w - 24;
                return (
                    <g key={k} onClick={klickBlock} style={{ cursor: 'pointer' }}>
                        {/* kopparblocket med fjädrar mellan atomerna */}
                        <rect x={r.x} y={r.y} width={r.w} height={r.h} rx="3" fill="url(#koppar)" stroke="#5e2f12" strokeWidth="2" />
                        <rect x={r.x + 2} y={r.y + 2} width={r.w - 4} height="5" rx="2" fill="rgba(255,226,190,0.45)" />
                        <g stroke="rgba(70,32,10,0.30)" strokeWidth="1">
                            {Array.from({ length: Math.ceil((i1 - i0) / KOL) }, (_, rad) => {
                                const y = r.y + r.h - 5 - SP / 2 - rad * SP;
                                const ant = Math.min(KOL, i1 - i0 - rad * KOL);
                                return <line key={'h' + rad} x1={r.x + 5 + SP / 2} y1={y} x2={r.x + 5 + SP / 2 + (ant - 1) * SP} y2={y} />;
                            })}
                            {Array.from({ length: Math.min(KOL, i1 - i0) }, (_, kol) => {
                                const rader = Math.ceil((i1 - i0 - kol) / KOL);
                                const x = r.x + 5 + SP / 2 + kol * SP;
                                return <line key={'v' + kol} x1={x} y1={r.y + r.h - 5 - SP / 2} x2={x} y2={r.y + r.h - 5 - SP / 2 - (rader - 1) * SP} />;
                            })}
                        </g>
                        {atomer}
                        {/* termometerns givare i ett borrat hål */}
                        <rect x={probeX - 3} y={r.y - 4} width="6" height="26" fill="#3b2414" />
                        <rect x={probeX - 2} y={r.y - 52} width="4" height="70" fill="#b8bec7" stroke="#6b7280" strokeWidth="0.6" />
                        <rect x={probeX - 6} y={r.y - 92} width="12" height="42" rx="3" fill="#1f2937" />
                        <rect x={probeX - 3.5} y={r.y - 86} width="7" height="12" rx="1.5" fill={k === 'A' ? '#fdba74' : '#93c5fd'} />
                        <text x={k === 'A' ? r.x : r.x + r.w} y={r.y - 128} textAnchor={k === 'A' ? 'start' : 'end'} fontSize="15" fontWeight="700" fill={COL.ink}>
                            Block {k}
                        </text>
                        <text x={k === 'A' ? r.x : r.x + r.w} y={r.y - 110} textAnchor={k === 'A' ? 'start' : 'end'} fontSize="12.5" fill={COL.soft}>
                            {fmt(k === 'A' ? st.NA / M.PER_KG : st.NB / M.PER_KG, 1)} kg, {k === 'A' ? st.qA : st.q - st.qA} brickor
                        </text>
                    </g>
                );
            };
            // diagrammet över antalet sätt: ett berg med en kula som visar läget nu
            const O = { x0: 612, x1: 952, y0: 300, y1: 168 };
            const ox = (qA) => O.x0 + (O.x1 - O.x0) * qA / st.q;
            const oh = (qA) => {
                const a = Math.max(0, Math.min(st.q, qA)), i0 = Math.floor(a), i1 = Math.min(st.q, i0 + 1), f = a - i0;
                const v = Math.exp(l[i0] - lmax) * (1 - f) + Math.exp(l[i1] - lmax) * f;
                return (O.y0 - O.y1) * v;
            };
            let berg = '';
            if (st.q > 40) {
                berg = `M ${O.x0} ${O.y0}`;
                for (let i = 0; i <= st.q; i++) berg += ` L ${ox(i).toFixed(1)} ${(O.y0 - (O.y0 - O.y1) * Math.exp(l[i] - lmax)).toFixed(1)}`;
                berg += ` L ${O.x1} ${O.y0} Z`;
            }
            const bw = (O.x1 - O.x0) / (st.q + 1);
            const kx = st.q > 40 ? ox(kula) : O.x0 + (kula + 0.5) * bw;
            const ky = O.y0 - oh(kula) - 9;
            const startX = st.q > 40 ? ox(st.qA0) : O.x0 + (st.qA0 + 0.5) * bw;

            // dataloggerns skärm
            const G = { x0: 642, x1: 944, y0: 500, y1: 418 };
            const tSpann = 60;
            const t0 = hist.length ? Math.max(0, hist[hist.length - 1].t - tSpann) : 0;
            const tx = (t) => G.x0 + (G.x1 - G.x0) * Math.max(0, t - t0) / tSpann;
            const ty = (T) => G.y0 - (G.y0 - G.y1) * Math.max(0, Math.min(1, T / 100));
            const linje = (k) => hist.map((h, i) => `${i ? 'L' : 'M'} ${tx(h.t).toFixed(1)} ${ty(h[k]).toFixed(1)}`).join(' ');
            const Ts = M.slutTemp(st);

            return (
                <g fontFamily="Poppins, sans-serif">
                    <Bank y={BENK} />
                    {/* den isolerade lådan i genomskärning */}
                    <path d={`M ${LADA.x} ${LADA.y} L ${LADA.x} ${LADA.y + LADA.h} L ${LADA.x + LADA.w} ${LADA.y + LADA.h} L ${LADA.x + LADA.w} ${LADA.y}
                              L ${LADA.x + LADA.w - LADA.t} ${LADA.y} L ${LADA.x + LADA.w - LADA.t} ${GOLV} L ${LADA.x + LADA.t} ${GOLV} L ${LADA.x + LADA.t} ${LADA.y} Z`}
                          fill="url(#frigolit)" stroke="#8b8577" strokeWidth="1.6" strokeLinejoin="round" />
                    <rect x={LADA.x + LADA.t} y={LADA.y} width={LADA.w - 2 * LADA.t} height={GOLV - LADA.y} fill="rgba(255,252,244,0.55)" />
                    <text x={LADA.x} y={LADA.y - 14} fontSize="13" fill={COL.soft}>Isolerad låda: ingen energi går in eller ut</text>

                    {blockGrupp('A', rA, Tvisad.A)}
                    {blockGrupp('B', rB, Tvisad.B)}

                    {/* brickor på väg mellan två atomer */}
                    {flyg.map((f) => {
                        const u = Math.min(1, (nu - f.t0) / f.dur);
                        const a = atomPos(st, f.i, rA, rB), b = atomPos(st, f.j, rA, rB);
                        const x = a.x + (b.x - a.x) * u, y = a.y + (b.y - a.y) * u - Math.sin(Math.PI * u) * (12 + 0.25 * Math.abs(b.x - a.x));
                        return <Bricka key={f.id} x={x} y={y} s={7} />;
                    })}

                    {/* räknarna: brickor åt båda hållen genom kontaktytan */}
                    {gap < 2 && (
                        <g>
                            <text x={MITT} y={LADA.y + 84} textAnchor="middle" fontSize="11.5" fontWeight="600" fill={COL.soft} letterSpacing="0.04em">GENOM KONTAKTYTAN</text>
                            <Pil x1={MITT - 46} y1={LADA.y + 102} x2={MITT + 46} y2={LADA.y + 102} color={COL.varm} width={3} head={10} />
                            <text x={MITT + 54} y={LADA.y + 107} fontSize="14" fontWeight="700" fill={COL.varm}>{flode.ab}</text>
                            <Pil x1={MITT + 46} y1={LADA.y + 124} x2={MITT - 46} y2={LADA.y + 124} color={COL.kall} width={3} head={10} />
                            <text x={MITT - 54} y={LADA.y + 129} textAnchor="end" fontSize="14" fontWeight="700" fill={COL.kall}>{flode.ba}</text>
                        </g>
                    )}

                    {/* teckenförklaring */}
                    <g>
                        <text x={LADA.x} y="622" fontSize="12.5" fill={COL.soft}>Atomens energi:</text>
                        {ATOMFARG.map((c, i) => (
                            <g key={i}>
                                <circle cx={LADA.x + 112 + i * 34} cy="618" r={ATOM_R + 0.6} fill={c} stroke="rgba(40,18,6,0.55)" strokeWidth="0.8" />
                                <text x={LADA.x + 120 + i * 34} y="622" fontSize="11.5" fill={COL.soft}>{i === ATOMFARG.length - 1 ? `${i}+` : i}</text>
                            </g>
                        ))}
                        <text x={LADA.x + 112 + ATOMFARG.length * 34} y="622" fontSize="12.5" fill={COL.soft}>brickor</text>
                        <Bricka x={LADA.x + 196 + ATOMFARG.length * 34} y={618} s={8} />
                        <text x={LADA.x + 206 + ATOMFARG.length * 34} y="622" fontSize="12.5" fill={COL.soft}>en bricka: en lika stor energimängd</text>
                    </g>


                    {/* antalet sätt: millimeterpapper på väggen */}
                    <g>
                        <rect x="588" y="104" width="388" height="246" fill="#fbf8f1" stroke="rgba(15,22,32,0.22)" strokeWidth="1" />
                        <rect x="588" y="104" width="388" height="246" fill="url(#mmpapper)" />
                        <rect x="600" y="98" width="46" height="14" fill="rgba(214,196,150,0.7)" transform="rotate(-4 623 105)" />
                        <rect x="918" y="98" width="46" height="14" fill="rgba(214,196,150,0.7)" transform="rotate(5 941 105)" />
                        <text x="604" y="132" fontSize="14" fontWeight="700" fill={COL.ink}>Antalet sätt att fördela brickorna</text>
                        <text x="604" y="150" fontSize="11.5" fill={COL.soft}>Kulan visar var systemet är just nu</text>
                        {st.q > 40
                            ? <path d={berg} fill="url(#berg)" stroke="#475569" strokeWidth="1.3" strokeLinejoin="round" />
                            : l.map((v, i) => {
                                const h = (O.y0 - O.y1) * Math.exp(v - lmax);
                                return <rect key={i} x={O.x0 + i * bw + 1} y={O.y0 - h} width={Math.max(1, bw - 2)} height={h} fill="#9aa8bd" stroke="#475569" strokeWidth="0.8" />;
                            })}
                        <line x1={O.x0} y1={O.y0} x2={O.x1} y2={O.y0} stroke={COL.ink} strokeWidth="1.3" />
                        {/* flaggan vid startfördelningen */}
                        <line x1={startX} y1={O.y0} x2={startX} y2={O.y1 + 6} stroke={COL.ink} strokeWidth="1.2" />
                        <path d={`M ${startX} ${O.y1 + 6} L ${startX + 22} ${O.y1 + 12} L ${startX} ${O.y1 + 18} Z`} fill={COL.grans} />
                        <text x={startX + 26} y={O.y1 + 16} fontSize="11.5" fill={COL.soft}>start</text>
                        <circle cx={kx} cy={ky} r="8.5" fill="url(#kula)" stroke="#1f2937" strokeWidth="1.2" />
                        <text x={O.x0} y={O.y0 + 16} textAnchor="middle" fontSize="11" fill={COL.soft}>0</text>
                        <text x={O.x1} y={O.y0 + 16} textAnchor="middle" fontSize="11" fill={COL.soft}>{st.q}</text>
                        <text x={(O.x0 + O.x1) / 2} y={O.y0 + 16} textAnchor="middle" fontSize="11" fill={COL.soft}>brickor i block A</text>
                        <text x="604" y="338" fontSize="12.5" fill={COL.ink}>Nu: <Tiopot lg={lgNu} /> sätt. Toppen: <Tiopot lg={lgMax} /> sätt.</text>
                    </g>

                    {/* dataloggern på bänken */}
                    <g>
                        <rect x="596" y="378" width="374" height="178" rx="10" fill="#2f3542" stroke="#161a22" strokeWidth="1.5" />
                        <rect x="603" y={BENK - 4} width="24" height="5" rx="2" fill="#161a22" />
                        <rect x="939" y={BENK - 4} width="24" height="5" rx="2" fill="#161a22" />
                        <rect x="608" y="390" width="350" height="128" rx="4" fill="#e7ecdc" stroke="#11151c" strokeWidth="1.5" />
                        <text x={G.x0 + 6} y="405" fontSize="10.5" fill="#3b4232"><tspan fontStyle="italic">T</tspan> (°C)</text>
                        <text x={G.x1} y="513" textAnchor="end" fontSize="10.5" fill="#3b4232"><tspan fontStyle="italic">t</tspan>, de senaste 60 s</text>
                        <line x1={G.x0} y1={G.y0} x2={G.x1} y2={G.y0} stroke="#3b4232" strokeWidth="1" />
                        <line x1={G.x0} y1={G.y0} x2={G.x0} y2={G.y1} stroke="#3b4232" strokeWidth="1" />
                        {[0, 50, 100].map((T) => <text key={T} x={G.x0 - 5} y={ty(T) + 3.5} textAnchor="end" fontSize="10" fill="#3b4232">{T}</text>)}
                        {[50, 100].map((T) => <line key={T} x1={G.x0} y1={ty(T)} x2={G.x1} y2={ty(T)} stroke="rgba(59,66,50,0.18)" strokeWidth="1" />)}
                        {!dolj && <line x1={G.x0} y1={ty(Ts)} x2={G.x1} y2={ty(Ts)} stroke="rgba(59,66,50,0.55)" strokeWidth="1" strokeDasharray="4 3" />}
                        {!dolj && <path d={linje('A')} fill="none" stroke={COL.varm} strokeWidth="2.2" strokeLinejoin="round" />}
                        {!dolj && <path d={linje('B')} fill="none" stroke={COL.kall} strokeWidth="2.2" strokeLinejoin="round" />}
                        {dolj && <text x={(G.x0 + G.x1) / 2} y={(G.y0 + G.y1) / 2 + 5} textAnchor="middle" fontSize="13" fill="#3b4232">Skärmen är dold i gissa-läget</text>}
                        <text x="612" y="542" fontSize="12" fontWeight="600" fill="#cbd5e1" letterSpacing="0.06em">DATALOGGER</text>
                        <text x="760" y="542" fontSize="15" fontWeight="700" fill="#fdba74"><SvgVar s="T" i="A" size={15} /> {dolj ? '?' : `${fmt(Tvisad.A, 1)} °C`}</text>
                        <text x="870" y="542" fontSize="15" fontWeight="700" fill="#93c5fd"><SvgVar s="T" i="B" size={15} /> {dolj ? '?' : `${fmt(Tvisad.B, 1)} °C`}</text>
                    </g>
                </g>
            );
        };

        // ════════════════════════════════════════════════════════
        //  LÄGE 2: VÄRMEMASKINEN OCH VÄRMEPUMPEN
        // ════════════════════════════════════════════════════════
        const BRICKA2 = 10;                 // joule per bricka i maskinen
        // De färdiga försöken med riktiga maskiner får vardagsnamn på delarna,
        // så att man ser vad den varma och den kalla behållaren är i verkligheten.
        const EXEMPEL = {
            bil:   { varm: ['Förbränningen i cylindern', 'bensin och luft brinner'], kall: ['Luften runt bilen', 'avgaserna och kylarens värme'],
                     maskin: 'bilmotorn', last: 'bil' },
            kraft: { varm: ['Ångpannan', 'vattnet kokas till het ånga'], kall: ['Kyltornet eller havet', 'ångan kyls och blir vatten igen'],
                     maskin: 'ångturbinen', last: 'generator' },
            kyl:   { varm: ['Köket', 'kylskåpet värmer rummet'], kall: ['Kylskåpets insida', 'luften och maten i skåpet'],
                     maskin: 'kompressorn', last: 'eluttag' },
        };
        // maskinens delar
        const BENK2 = 622;
        const VARM = { x: 40, y: 42, w: 390, h: 100 }, KALL = { x: 40, y: 512, w: 390, h: 110 };
        const BAND_X = 170;                                  // där värmebanden går
        const CYL = { x: 100, y: 292, w: 140, h: 60 };
        const HJUL = { x: 330, y: 322, r: 50 };
        const LAST_X = 556;                                  // där arbetsbandet når lasten
        const VEV = 22, VEVSTAKE = 132;

        const MaskinScen = ({ typ, Tv, Tk, Qv, W, Qk, mojlig, flyg2, nu, lyft, dolj, exempel, kor, klickMaskin }) => {
            const ex_ = EXEMPEL[exempel] || null;
            const pump = typ === 'pump';
            const arbetet = lyft * 10 * 9.82;                  // J som maskinen hittills har gjort
            const go = kor && mojlig;
            // bandens bredd följer energin, med samma skala för alla tre
            const skala = Math.min(0.3, 62 / Math.max(Qv, W, Qk, 1));
            const b = (E) => Math.max(2.5, E * skala);
            const Wmax = M.etaMax(Tv, Tk) * Qv;
            const qkm = M.qkMax(Tv, Tk, W);
            const vinkel = go ? (nu / 1000) * (pump ? -3.4 : 3.4) : 0.6;
            const pin = { x: HJUL.x + VEV * Math.cos(vinkel), y: HJUL.y + VEV * Math.sin(vinkel) };
            const kolvX = pin.x - Math.sqrt(VEVSTAKE * VEVSTAKE - (pin.y - CYL.y - CYL.h / 2) ** 2);
            const flytt = go ? -(nu / 28) : 0;                   // strömmen i banden
            const rod = !mojlig && !dolj;
            const wFarg = rod ? COL.grans : COL.W;
            const viktY = 440 - Math.min(250, lyft * 40);
            const band = (d, E, c, key) => (
                <g key={key}>
                    <path d={d} stroke={c} strokeWidth={b(E)} opacity="0.32" fill="none" />
                    <path d={d} stroke={c} strokeWidth={b(E)} opacity="0.5" fill="none" strokeDasharray="3 13" strokeDashoffset={flytt} />
                </g>
            );
            // Q_v-bandet, Q_k-bandet och W-bandet, riktade efter maskintypen
            const qvD = `M ${BAND_X} ${VARM.y + VARM.h} L ${BAND_X} ${CYL.y}`;
            const qkD = `M ${BAND_X} ${CYL.y + CYL.h} L ${BAND_X} ${KALL.y}`;
            const wD = `M ${HJUL.x + HJUL.r} ${HJUL.y} L ${LAST_X} ${HJUL.y}`;
            const behallare = (r, varm) => {
                const namn = ex_ ? (varm ? ex_.varm : ex_.kall) : [varm ? 'Varm behållare' : 'Kall behållare', null];
                const T = varm ? Tv : Tk;
                return (
                    <g>
                        <rect x={r.x} y={r.y} width={r.w} height={r.h} rx="10" fill={varm ? 'url(#het)' : 'url(#kallt)'} stroke={varm ? '#9a3412' : '#1e3a8a'} strokeWidth="2" />
                        {varm
                            ? [0, 1, 2, 3, 4, 5].map((i) => {
                                const x = r.x + 230 + i * 26, f = (nu / 900 + i * 0.37) % 1;
                                return <path key={i} d={`M ${x} ${r.y + r.h - 14} c -6 -10 6 -16 0 -26 s 6 -16 0 -26`} fill="none" stroke="#c2410c" strokeWidth="2" strokeLinecap="round" opacity={go ? 0.25 + 0.5 * Math.sin(Math.PI * f) : 0.35} />;
                            })
                            : (ex_ && ex_.last !== 'eluttag' ? [] : [[262, 0.3], [318, -0.4], [372, 0.2]]).map(([x, rot], i) => (
                                <rect key={i} x={x} y={r.y + 24 + (i % 2) * 8} width="30" height="26" rx="4" fill="rgba(240,249,255,0.85)" stroke="#60a5fa" strokeWidth="1.4" transform={`rotate(${rot * 20} ${x + 15} ${r.y + 37})`} />
                            ))}
                        <text x={r.x + 16} y={r.y + 30} fontSize="15.5" fontWeight="700" fill={varm ? '#7c2d12' : '#1e3a8a'}>{namn[0]}</text>
                        {namn[1] && <text x={r.x + 16} y={r.y + 49} fontSize="12" fill={COL.soft}>{namn[1]}</text>}
                        <text x={r.x + 16} y={r.y + (namn[1] ? 76 : 62)} fontSize="15" fill={COL.ink}>
                            <SvgVar s="T" i={varm ? 'v' : 'k'} size={15} /> = {fmt(T, 0)} K ({fmt(T - KELVIN, 0)} °C)
                        </text>
                    </g>
                );
            };
            const pilV = (x, y1, y2, c, E) => <Pil x1={x} y1={y1} x2={x} y2={y2} color={c} width={2.2} head={Math.max(12, b(E) * 0.42 + 9)} />;
            return (
                <g fontFamily="Poppins, sans-serif">
                    <Bank y={BENK2} h={38} />
                    {behallare(VARM, true)}
                    {/* den kalla behållaren: ett glaskar med isvatten på bänken */}
                    {behallare(KALL, false)}

                    {/* energibanden */}
                    {band(qvD, Qv, COL.varm, 'qv')}
                    {band(qkD, Qk, COL.sliten, 'qk')}
                    {band(wD, W, wFarg, 'w')}
                    {/* den största möjliga arbetsmängden som streckad kontur */}
                    {!pump && !dolj && Wmax * skala < 120 && (
                        <rect x={HJUL.x + HJUL.r + 20} y={HJUL.y - Wmax * skala / 2} width={LAST_X - HJUL.x - HJUL.r - 40} height={Math.max(1, Wmax * skala)}
                              fill="none" stroke={COL.W} strokeWidth="1.4" strokeDasharray="5 4" />
                    )}
                    {pump && !dolj && qkm * skala < 130 && (
                        <rect x={BAND_X - qkm * skala / 2} y={CYL.y + CYL.h + 22} width={Math.max(1, qkm * skala)} height={KALL.y - CYL.y - CYL.h - 44}
                              fill="none" stroke="#475569" strokeWidth="1.4" strokeDasharray="5 4" />
                    )}
                    {/* riktningen */}
                    {pump ? pilV(BAND_X, CYL.y - 6, VARM.y + VARM.h + 4, COL.varm, Qv) : pilV(BAND_X, VARM.y + VARM.h + 10, CYL.y - 4, COL.varm, Qv)}
                    {pump ? pilV(BAND_X, KALL.y - 6, CYL.y + CYL.h + 4, '#475569', Qk) : pilV(BAND_X, CYL.y + CYL.h + 6, KALL.y - 4, '#475569', Qk)}
                    {pump ? <Pil x1={LAST_X - 4} y1={HJUL.y} x2={HJUL.x + HJUL.r + 6} y2={HJUL.y} color={wFarg} width={2.2} head={Math.max(12, b(W) * 0.42 + 9)} />
                          : <Pil x1={HJUL.x + HJUL.r + 6} y1={HJUL.y} x2={LAST_X - 4} y2={HJUL.y} color={wFarg} width={2.2} head={Math.max(12, b(W) * 0.42 + 9)} />}
                    {/* etiketterna i fri yta bredvid banden */}
                    <text x={BAND_X + b(Qv) / 2 + 14} y={(VARM.y + VARM.h + CYL.y) / 2 + 6} fontSize="16" fontWeight="700" fill={COL.varm}>
                        <SvgVar s="Q" i="v" size={16} /> = {fmt(Qv, 0)} J
                    </text>
                    <text x={BAND_X + b(Qk) / 2 + 14} y={(CYL.y + CYL.h + KALL.y) / 2 + 6} fontSize="16" fontWeight="700" fill="#475569">
                        <SvgVar s="Q" i="k" size={16} /> = {fmt(Qk, 0)} J
                    </text>
                    <text x={(HJUL.x + HJUL.r + LAST_X) / 2} y={HJUL.y - Math.max(b(W), !pump && !dolj ? Wmax * skala : 0) / 2 - 12} textAnchor="middle" fontSize="16" fontWeight="700" fill={wFarg}>
                        <tspan fontStyle="italic">W</tspan> = {fmt(W, 0)} J
                    </text>
                    {!pump && !dolj && Wmax * skala < 120 && (
                        <text x={(HJUL.x + HJUL.r + LAST_X) / 2} y={HJUL.y + Math.max(b(W), Wmax * skala) / 2 + 20} textAnchor="middle" fontSize="12" fill={COL.W}>
                            högst möjligt: {fmt(Wmax, 0)} J
                        </text>
                    )}

                    {/* maskinen: cylinder, kolv, vevstake och svänghjul; ett klick startar eller pausar */}
                    <g onClick={klickMaskin} style={{ cursor: 'pointer' }}>
                        <rect x={CYL.x} y={CYL.y} width={CYL.w} height={CYL.h} rx="5" fill={rod ? '#fecaca' : 'url(#stal)'} stroke={rod ? COL.grans : '#374151'} strokeWidth="2.2" />
                        {[0, 1, 2, 3, 4].map((i) => <line key={i} x1={CYL.x + 14 + i * 12} y1={CYL.y - 7} x2={CYL.x + 14 + i * 12} y2={CYL.y + CYL.h + 7} stroke={rod ? COL.grans : '#4b5563'} strokeWidth="5" opacity="0.55" />)}
                        <rect x={CYL.x + 4} y={CYL.y + 10} width={CYL.w - 8} height={CYL.h - 20} fill="#d1d5db" stroke="#4b5563" strokeWidth="1" />
                        <rect x={kolvX - 22} y={CYL.y + 11} width="24" height={CYL.h - 22} rx="2" fill="#6b7280" stroke="#1f2937" strokeWidth="1.2" />
                        <line x1={kolvX - 10} y1={CYL.y + CYL.h / 2} x2={pin.x} y2={pin.y} stroke="#374151" strokeWidth="6" strokeLinecap="round" />
                        <circle cx={HJUL.x} cy={HJUL.y} r={HJUL.r} fill="none" stroke={rod ? COL.grans : '#374151'} strokeWidth="9" />
                        <g transform={`rotate(${vinkel * 180 / Math.PI} ${HJUL.x} ${HJUL.y})`}>
                            {[0, 60, 120].map((a) => <line key={a} x1={HJUL.x - (HJUL.r - 4) * Math.cos(a * Math.PI / 180)} y1={HJUL.y - (HJUL.r - 4) * Math.sin(a * Math.PI / 180)}
                                                          x2={HJUL.x + (HJUL.r - 4) * Math.cos(a * Math.PI / 180)} y2={HJUL.y + (HJUL.r - 4) * Math.sin(a * Math.PI / 180)} stroke="#4b5563" strokeWidth="4" />)}
                        </g>
                        <circle cx={HJUL.x} cy={HJUL.y} r="9" fill="#1f2937" />
                        <circle cx={pin.x} cy={pin.y} r="5" fill="#9ca3af" stroke="#1f2937" strokeWidth="1.4" />
                        <text x={HJUL.x} y={HJUL.y + HJUL.r + 26} textAnchor="middle" fontSize="15" fontWeight="700" fill={rod ? COL.grans : COL.ink}>
                            {ex_ ? ex_.maskin : pump ? 'värmepumpen' : 'värmemaskinen'}
                        </text>
                        {ex_ && <text x={HJUL.x} y={HJUL.y + HJUL.r + 44} textAnchor="middle" fontSize="12" fill={COL.soft}>{pump ? 'en värmepump' : 'en värmemaskin'}</text>}
                        {rod && <path d={`M ${HJUL.x - 34} ${HJUL.y - 34} L ${HJUL.x + 34} ${HJUL.y + 34} M ${HJUL.x + 34} ${HJUL.y - 34} L ${HJUL.x - 34} ${HJUL.y + 34}`} stroke={COL.grans} strokeWidth="7" strokeLinecap="round" />}
                    </g>

                    {/* lasten: en vikt, bilen, generatorn eller elmotorn */}
                    {!pump && ex_ && ex_.last === 'bil' ? (
                        <g>
                            <g transform={`translate(566 ${HJUL.y - 48}) scale(1.75)`}>
                                <path d="M 0 25 L 0 18 C 0 16 2 15 5 14 L 21 13 C 29 2 42 0 53 0 L 66 0 C 77 1 85 6 91 14 L 105 16 C 108 16 109 18 109 20 L 109 25 Z" fill="#c8324a" stroke="#7f1d1d" strokeWidth="0.6" strokeLinejoin="round" />
                                <path d="M 28 14 L 35 4 L 51 4 L 51 14 Z" fill="#dbeafe" />
                                <path d="M 55 14 L 55 4 L 68 4 L 75 14 Z" fill="#dbeafe" />
                                {[24, 86].map((hx) => (
                                    <g key={hx} transform={`rotate(${go ? (nu / 3) % 360 : 0} ${hx} 25)`}>
                                        <circle cx={hx} cy="25" r="6" fill="#1f2937" /><circle cx={hx} cy="25" r="2.6" fill="#9ca3af" />
                                        <line x1={hx - 4.5} y1="25" x2={hx + 4.5} y2="25" stroke="#9ca3af" strokeWidth="1" />
                                    </g>
                                ))}
                            </g>
                            <line x1="556" y1={HJUL.y + 37} x2="790" y2={HJUL.y + 37} stroke="#6b5a45" strokeWidth="2.4" />
                            {[0, 1, 2, 3, 4, 5].map((j) => <line key={j} x1={570 + ((j * 40 - (go ? nu / 4 : 0)) % 220 + 220) % 220} y1={HJUL.y + 42} x2={584 + ((j * 40 - (go ? nu / 4 : 0)) % 220 + 220) % 220} y2={HJUL.y + 42} stroke="#6b5a45" strokeWidth="2" />)}
                            <text x="566" y={HJUL.y + 68} fontSize="13" fill={COL.soft}>arbetet driver bilen: {fmt(arbetet / 1000, 1)} kJ hittills</text>
                        </g>
                    ) : !pump && ex_ && ex_.last === 'generator' ? (
                        <g>
                            <rect x={LAST_X} y={HJUL.y - 36} width="104" height="72" rx="10" fill="url(#stal)" stroke="#374151" strokeWidth="2" />
                            <circle cx={LAST_X + 52} cy={HJUL.y} r="22" fill="#e5e7eb" stroke="#374151" strokeWidth="1.6" />
                            <path d={`M ${LAST_X + 36} ${HJUL.y} c 4 -12 8 -12 12 0 s 8 12 12 0 s 8 -12 8 -6`} fill="none" stroke="#b45309" strokeWidth="2.2" strokeLinecap="round" />
                            <text x={LAST_X + 52} y={HJUL.y + 56} textAnchor="middle" fontSize="13" fontWeight="600" fill={COL.ink}>generator</text>
                            <path d={`M ${LAST_X + 104} ${HJUL.y} L 720 ${HJUL.y} L 720 ${HJUL.y - 60}`} fill="none" stroke="#1f2937" strokeWidth="2.4" />
                            <circle cx="720" cy={HJUL.y - 82} r="20" fill={go ? '#fde68a' : '#f3f4f6'} stroke="#92400e" strokeWidth="1.8" />
                            <path d={`M 712 ${HJUL.y - 62} L 712 ${HJUL.y - 74} L 716 ${HJUL.y - 88} M 728 ${HJUL.y - 62} L 728 ${HJUL.y - 74} L 724 ${HJUL.y - 88}`} fill="none" stroke="#92400e" strokeWidth="1.4" />
                            <rect x="710" y={HJUL.y - 64} width="20" height="8" fill="#6b7280" />
                            <text x={LAST_X} y={HJUL.y + 84} fontSize="13" fill={COL.soft}>el till elnätet: {fmt(arbetet / 1000, 1)} kJ hittills</text>
                        </g>
                    ) : !pump ? (
                        <g>
                            {/* vinsch, trissa på ett stativ och en vikt på 10 kg */}
                            <rect x="772" y="92" width="10" height={BENK2 - 92} fill="#6b7280" stroke="#374151" strokeWidth="1" />
                            <rect x="744" y={BENK2 - 8} width="66" height="8" rx="2" fill="#374151" />
                            <rect x="690" y="88" width="92" height="8" fill="#6b7280" stroke="#374151" strokeWidth="1" />
                            <line x1="700" y1="96" x2="700" y2="108" stroke="#374151" strokeWidth="3" />
                            <circle cx="700" cy="118" r="17" fill="#e5e7eb" stroke="#374151" strokeWidth="2" />
                            <circle cx="700" cy="118" r="3.5" fill="#374151" />
                            <line x1={LAST_X + 24} y1={HJUL.y - 26} x2={683} y2={118} stroke="#5b4a3a" strokeWidth="1.8" />
                            <line x1="717" y1="118" x2="717" y2={viktY} stroke="#5b4a3a" strokeWidth="1.8" />
                            <circle cx={LAST_X + 26} cy={HJUL.y} r="26" fill="url(#stal)" stroke="#374151" strokeWidth="2" />
                            <g transform={`rotate(${vinkel * 90 / Math.PI} ${LAST_X + 26} ${HJUL.y})`}>
                                <line x1={LAST_X + 8} y1={HJUL.y} x2={LAST_X + 44} y2={HJUL.y} stroke="#374151" strokeWidth="3" />
                                <line x1={LAST_X + 26} y1={HJUL.y - 18} x2={LAST_X + 26} y2={HJUL.y + 18} stroke="#374151" strokeWidth="3" />
                            </g>
                            <path d={`M 699 ${viktY + 8} L 735 ${viktY + 8} L 741 ${viktY + 50} L 693 ${viktY + 50} Z`} fill="#57534e" stroke="#1c1917" strokeWidth="1.3" strokeLinejoin="round" />
                            <path d={`M 709 ${viktY + 8} C 709 ${viktY - 2} 725 ${viktY - 2} 725 ${viktY + 8}`} fill="none" stroke="#1c1917" strokeWidth="2" />
                            <text x="717" y={viktY + 35} textAnchor="middle" fontSize="12.5" fontWeight="600" fill="#f5f5f4">10 kg</text>
                            <text x="717" y={viktY + 70} textAnchor="middle" fontSize="12.5" fill={COL.soft}>lyft {fmt(lyft, 2)} m</text>
                        </g>
                    ) : (
                        <g>
                            <rect x={LAST_X} y={HJUL.y - 36} width="96" height="72" rx="10" fill="url(#stal)" stroke="#374151" strokeWidth="2" />
                            <text x={LAST_X + 48} y={HJUL.y + 5} textAnchor="middle" fontSize="13.5" fontWeight="700" fill={COL.ink}>elmotor</text>
                            <path d={`M ${LAST_X + 96} ${HJUL.y + 10} C 712 ${HJUL.y + 10} 740 ${HJUL.y + 30} 740 ${HJUL.y + 70}`} fill="none" stroke="#1f2937" strokeWidth="3" />
                            <rect x="721" y={HJUL.y + 70} width="38" height="44" rx="6" fill="#f3f4f6" stroke="#374151" strokeWidth="1.8" />
                            <circle cx="734" cy={HJUL.y + 92} r="3" fill="#374151" /><circle cx="746" cy={HJUL.y + 92} r="3" fill="#374151" />
                            <text x={LAST_X} y={HJUL.y + 58} fontSize="12.5" fill={COL.soft}>{ex_ ? 'drivs med el från eluttaget' : 'arbetet kommer från en elmotor'}</text>
                        </g>
                    )}

                    {/* brickor på väg */}
                    {flyg2.map((f) => {
                        if (nu < f.t0) return null;
                        const u = Math.min(1, (nu - f.t0) / 900);
                        return <Bricka key={f.id} x={f.x0 + (f.x1 - f.x0) * u} y={f.y0 + (f.y1 - f.y0) * u} s={11} fill={f.c} />;
                    })}

                    {/* energins kvalitet: en stege från arbete till sliten värme */}
                    <g>
                        <text x="798" y="168" fontSize="14" fontWeight="700" fill={COL.ink}>Energins kvalitet</text>
                        <rect x="800" y="190" width="12" height="290" rx="6" fill="url(#kvalitet)" />
                        <text x="806" y="500" textAnchor="middle" fontSize="11" fill={COL.soft}>låg</text>
                        <text x="806" y="184" textAnchor="middle" fontSize="11" fill={COL.soft}>hög</text>
                        {[[COL.W, 'Arbete', 'kan bli all slags energi', <tspan><tspan fontStyle="italic">W</tspan> = {fmt(W, 0)} J</tspan>, 212],
                          [COL.varm, 'Värme, hög temperatur', 'kan delvis bli arbete', <tspan><SvgVar s="Q" i="v" size={13} /> = {fmt(Qv, 0)} J</tspan>, 330],
                          ['#64748b', 'Värme, låg temperatur', 'gör nästan ingen nytta', <tspan><SvgVar s="Q" i="k" size={13} /> = {fmt(Qk, 0)} J</tspan>, 448]].map(([c, t1, t2, v, y], i) => (
                            <g key={i}>
                                <line x1="812" y1={y - 7} x2="824" y2={y - 7} stroke={c} strokeWidth="2" />
                                <text x="828" y={y - 3} fontSize="12" fontWeight="700" fill={COL.ink}>{t1}</text>
                                <text x="828" y={y + 13} fontSize="11" fill={COL.soft}>{t2}</text>
                                <text x="828" y={y + 31} fontSize="13" fontWeight="700" fill={c}>{v}</text>
                            </g>
                        ))}
                        <text x="798" y="530" fontSize="12" fill={COL.ink}>Energin bevaras:</text>
                        <text x="798" y="548" fontSize="12.5" fontWeight="700" fill={COL.ink}>{fmt(Qv, 0)} J = {fmt(W, 0)} J + {fmt(Qk, 0)} J</text>
                    </g>

                    {/* mätaren: var maskinen ligger i förhållande till andra huvudsatsens gräns */}
                    {(() => {
                        const cx = 556, cy = 528, R = 96;
                        // maskinen: verkningsgraden 0 … 100 %; pumpen: värmen från kalla sidan 0 … 2 · gränsen
                        const max = pump ? Math.max(2 * qkm, 1.25 * Qk, 1) : 1;
                        const varde = pump ? Qk : W / Qv, grans = pump ? qkm : M.etaMax(Tv, Tk);
                        const vink = (f) => Math.PI * (1 - Math.max(0, Math.min(1, f)));
                        const pt = (f, r) => ({ x: cx + r * Math.cos(vink(f)), y: cy - r * Math.sin(vink(f)) });
                        const bage = (f0, f1, r) => { const a = pt(f0, r), c = pt(f1, r); return `M ${a.x} ${a.y} A ${r} ${r} 0 0 1 ${c.x} ${c.y}`; };
                        const fg = Math.min(1, grans / max), fv = Math.min(1, varde / max);
                        const nal = pt(fv, R - 14);
                        return (
                            <g>
                                <path d={`${bage(0, 1, R + 14)} L ${cx + R - 14} ${cy} A ${R - 14} ${R - 14} 0 0 0 ${cx - R + 14} ${cy} Z`} fill="#fbf8f1" stroke="rgba(15,22,32,0.25)" strokeWidth="1" />
                                {dolj
                                    ? <path d={bage(0, 1, R)} stroke="#cbd5e1" strokeWidth="14" fill="none" />
                                    : <React.Fragment>
                                        <path d={bage(0, fg, R)} stroke="rgba(21,128,61,0.55)" strokeWidth="14" fill="none" />
                                        {fg < 1 && <path d={bage(fg, 1, R)} stroke="rgba(200,50,74,0.55)" strokeWidth="14" fill="none" />}
                                        <line x1={pt(fg, R - 10).x} y1={pt(fg, R - 10).y} x2={pt(fg, R + 12).x} y2={pt(fg, R + 12).y} stroke={COL.ink} strokeWidth="2" />
                                    </React.Fragment>}
                                {[0, 0.25, 0.5, 0.75, 1].map((f) => <line key={f} x1={pt(f, R - 7).x} y1={pt(f, R - 7).y} x2={pt(f, R + 7).x} y2={pt(f, R + 7).y} stroke="rgba(15,22,32,0.45)" strokeWidth="1" />)}
                                {!pump && [0, 50, 100].map((v) => <text key={v} x={pt(v / 100, R + 26).x} y={pt(v / 100, R + 26).y + 4} textAnchor="middle" fontSize="10.5" fill={COL.soft}>{v} %</text>)}
                                <line x1={cx} y1={cy} x2={nal.x} y2={nal.y} stroke={COL.ink} strokeWidth="3" strokeLinecap="round" />
                                <circle cx={cx} cy={cy} r="6" fill={COL.ink} />
                                {!dolj && fg < 1 && <text x={pt((fg + 1) / 2, R - 30).x} y={pt((fg + 1) / 2, R - 30).y + 4} textAnchor="middle" fontSize="11" fontWeight="700" fill={COL.grans}>omöjligt</text>}
                                <text x={cx} y={cy + 24} textAnchor="middle" fontSize="13" fontWeight="700" fill={COL.ink}>
                                    {pump ? <tspan><SvgVar s="Q" i="k" size={13} /> = {fmt(Qk, 0)} J</tspan> : <tspan><tspan fontStyle="italic">η</tspan> = {fmt(100 * W / Qv, 0)} %</tspan>}
                                </text>
                                <text x={cx} y={cy + 42} textAnchor="middle" fontSize="12" fill={COL.soft}>
                                    {dolj ? 'gränsen är dold i gissa-läget'
                                        : pump ? <tspan>högst {fmt(qkm, 0)} J med <tspan fontStyle="italic">W</tspan> = {fmt(W, 0)} J</tspan>
                                               : <tspan>största möjliga: <SvgVar s="η" i="max" size={12} /> = {fmt(100 * grans, 0)} %</tspan>}
                                </text>
                            </g>
                        );
                    })()}

                    {rod && (
                        <text x="440" y="610" fontSize="13.5" fontWeight="700" fill={COL.grans}>
                            {pump ? 'Omöjligt: så mycket värme går inte att flytta med så lite arbete.' : 'Omöjligt: högre verkningsgrad än den största möjliga.'}
                        </text>
                    )}
                </g>
            );
        };

        const Scen = (p) => (
            <svg ref={p.svgRef} viewBox={`0 0 ${VB_W} ${VB_H}`} preserveAspectRatio="xMidYMid meet" role="img"
                 aria-label="Två kopparblock i en isolerad låda vars atomer utbyter energi i form av brickor, med en datalogger och ett diagram över antalet sätt att fördela brickorna, eller en kolvmaskin mellan en varm och en kall behållare med energiband för värme och arbete.">
                <defs>
                    <linearGradient id="vagg" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stopColor="#f7f2e8" /><stop offset="1" stopColor="#ece3d2" />
                    </linearGradient>
                    <linearGradient id="koppar" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0" stopColor="#f1d3b5" /><stop offset="0.5" stopColor="#dcae86" /><stop offset="1" stopColor="#bf8a62" />
                    </linearGradient>
                    <pattern id="frigolit" width="14" height="14" patternUnits="userSpaceOnUse">
                        <rect width="14" height="14" fill="#f4f1ea" />
                        <circle cx="4" cy="4" r="3.2" fill="none" stroke="rgba(120,112,96,0.22)" strokeWidth="0.8" />
                        <circle cx="11" cy="10" r="3.2" fill="none" stroke="rgba(120,112,96,0.22)" strokeWidth="0.8" />
                    </pattern>
                    <pattern id="mmpapper" width="20" height="20" patternUnits="userSpaceOnUse">
                        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(37,99,201,0.16)" strokeWidth="0.8" />
                        <path d="M 10 0 L 10 20 M 0 10 L 20 10" fill="none" stroke="rgba(37,99,201,0.07)" strokeWidth="0.6" />
                    </pattern>
                    <linearGradient id="berg" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stopColor="#7d8ea8" /><stop offset="1" stopColor="#c9d2df" />
                    </linearGradient>
                    <radialGradient id="kula" cx="0.35" cy="0.35" r="0.7">
                        <stop offset="0" stopColor="#f08aa0" /><stop offset="1" stopColor="#a3122f" />
                    </radialGradient>
                    <linearGradient id="het" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stopColor="#fff1e0" /><stop offset="0.65" stopColor="#fed7aa" /><stop offset="1" stopColor="#fb923c" />
                    </linearGradient>
                    <linearGradient id="kallt" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stopColor="#e0f2fe" /><stop offset="0.25" stopColor="#bfdbfe" /><stop offset="1" stopColor="#93c5fd" />
                    </linearGradient>
                    <linearGradient id="stal" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stopColor="#f3f4f6" /><stop offset="0.5" stopColor="#d1d5db" /><stop offset="1" stopColor="#9ca3af" />
                    </linearGradient>
                    <linearGradient id="kvalitet" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stopColor={COL.W} /><stop offset="0.5" stopColor={COL.varm} /><stop offset="1" stopColor="#94a3b8" />
                    </linearGradient>
                </defs>
                <rect x="0" y="0" width={VB_W} height={VB_H} fill="url(#vagg)" />
                {p.lage === 'block' ? <BlockScen {...p} /> : <MaskinScen {...p} />}
            </svg>
        );

        // ════════════════════════════════════════════════════════
        //  REGLAGE
        // ════════════════════════════════════════════════════════
        const NumInput = ({ value, min, max, onCommit, fmtFn, unit, disabled, color = 'var(--lab-accent, #c8324a)' }) => {
            const [txt, setTxt] = useState(() => fmtFn(value));
            const [editing, setEditing] = useState(false);
            useEffect(() => { if (!editing) setTxt(fmtFn(value)); }, [value, editing]);
            const commit = (raw) => {
                const norm = raw.replace(',', '.').replace('−', '-').trim();
                if (norm === '' || norm === '-' || norm === '.') return;
                let n = parseFloat(norm);
                if (!isFinite(n)) return;
                if (min != null && n < min) n = min;
                if (max != null && n > max) n = max;
                onCommit(n);
            };
            return (
                <span className="num-wrap">
                    <input className="num-in" type="text" inputMode="decimal" value={txt} disabled={disabled}
                           style={{ color }} aria-label="Skriv in värde"
                           onFocus={() => setEditing(true)}
                           onChange={(e) => { setTxt(e.target.value); commit(e.target.value); }}
                           onBlur={() => { setEditing(false); setTxt(fmtFn(value)); }}
                           onKeyDown={(e) => { if (e.key === 'Enter') e.currentTarget.blur(); }} />
                    {unit && <span className="num-unit">{unit}</span>}
                </span>
            );
        };
        const Slider = ({ label, value, min, max, step, onChange, disabled, children }) => (
            <div className="flex items-center gap-2 mb-2">
                <span className="text-xs flex-shrink-0" style={{ minWidth: 112, color: 'var(--lab-ink-soft)' }}
                      dangerouslySetInnerHTML={{ __html: label }} />
                <input type="range" min={min} max={max} step={step} value={value} disabled={disabled}
                       onChange={(e) => onChange(parseFloat(e.target.value))} className="flex-1 cursor-pointer" />
                {children}
            </div>
        );
        const StSlider = ({ label, value, min, max, step, onChange, disabled, valueNode }) => (
            <div className="st-slider">
                <div className="st-slider-top">
                    <span dangerouslySetInnerHTML={{ __html: label }} />
                    {valueNode}
                </div>
                <input type="range" min={min} max={max} step={step} value={value} disabled={disabled}
                       onChange={(e) => onChange(parseFloat(e.target.value))} />
            </div>
        );

        // Formelkortet: varje storhet har sitt namn ovanför.
        const Vbl = ({ label, children }) => (
            <div className="flex flex-col items-center" style={{ lineHeight: 1.1 }}>
                <span className="flbl">{label}</span>
                <span className="fnum">{children}</span>
                <span className="flbl" aria-hidden="true" style={{ visibility: 'hidden' }}>{label}</span>
            </div>
        );

        // ════════════════════════════════════════════════════════
        //  FORMELKORTET
        // ════════════════════════════════════════════════════════
        const BrakL = ({ tl, t, n, nl }) => (
            <div className="flex flex-col items-center" style={{ lineHeight: 1.1 }}>
                <span className="flbl">{tl}</span>
                <span className="fnum" style={{ padding: '0 4px' }}>{t}</span>
                <span style={{ alignSelf: 'stretch', borderTop: '2px solid currentColor', margin: '2px 0' }} />
                <span className="fnum" style={{ padding: '0 4px' }}>{n}</span>
                <span className="flbl">{nl}</span>
            </div>
        );
        const FormelKort = ({ lage, st, typ, Tv, Tk, Qv, W, Qk, mojlig, dolj, mA, mB, TA, TB }) => {
            if (lage === 'block') {
                const Ts = M.slutTemp(st), T0 = M.temp(st, st.qA0);
                return (
                    <div className="glass-card rounded-xl p-4 mb-6" style={{ color: 'var(--lab-ink)' }}>
                        <div className="flex flex-wrap items-center gap-x-8 gap-y-3 mb-3">
                            <div className="flex items-center gap-x-3">
                                <Vbl label="Sluttemperatur"><Sub s="T" i="slut" /></Vbl>
                                <span className="fnum">=</span>
                                <BrakL tl="Massa · temperatur" t={<span><Sub s="m" i="A" /> · <Sub s="T" i="A" /> + <Sub s="m" i="B" /> · <Sub s="T" i="B" /></span>} n={<span><Sub s="m" i="A" /> + <Sub s="m" i="B" /></span>} nl="Total massa" />
                            </div>
                            <div className="text-sm" style={{ color: 'var(--lab-ink-soft)', maxWidth: 520 }}>
                                Termodynamikens andra huvudsats: värme går av sig själv från varmt till kallt, aldrig tvärtom. Blocken är av samma metall,
                                så sluttemperaturen blir ett medelvärde av temperaturerna, vägt med massorna.
                            </div>
                        </div>
                        <div className="pt-3 fnum-live" style={{ borderTop: '1px solid var(--lab-line, rgba(15,22,32,0.14))' }}>
                            {dolj ? <div>Räkna själv innan du trycker ihop blocken.</div>
                                : <div><Sub s="T" i="slut" /> = <Brak t={`${fmt(mA, 1)} · ${fmt(T0.A, 0)} + ${fmt(mB, 1)} · ${fmt(T0.B, 0)}`} n={`${fmt(mA, 1)} + ${fmt(mB, 1)}`} /> = {fmt(Ts, 1)} °C
                    {(Math.abs(T0.A - TA) > 0.5 || Math.abs(T0.B - TB) > 0.5) && <span className="text-base" style={{ color: 'var(--lab-ink-soft)' }}>{'   '}(med {st.q} brickor blir starttemperaturerna {fmt(T0.A, 0)} °C och {fmt(T0.B, 0)} °C)</span>}</div>}
                            <div className="mt-1 text-base" style={{ color: 'var(--lab-ink-soft)' }}>
                                Brickorna hoppar på måfå, men det finns många fler sätt att fördela dem jämnt än ojämnt. Därför sprids energin
                                tills temperaturerna är lika. Med få brickor fladdrar temperaturerna kring sluttemperaturen, och ju fler brickor, desto mindre fladder.
                            </div>
                        </div>
                    </div>
                );
            }
            const em = M.etaMax(Tv, Tk);
            return (
                <div className="glass-card rounded-xl p-4 mb-6" style={{ color: 'var(--lab-ink)' }}>
                    <div className="flex flex-wrap items-center gap-x-8 gap-y-3 mb-3">
                        {typ === 'maskin' ? (
                        <div className="flex items-center gap-x-3">
                            <Vbl label="Verkningsgrad"><em>η</em></Vbl>
                            <span className="fnum">=</span>
                            <BrakL tl="Nyttig energi" t={<Sub s="E" i="n" />} n={<Sub s="E" i="t" />} nl="Tillförd energi" />
                            <span className="fnum">=</span>
                            <BrakL tl="Arbete" t={<em>W</em>} n={<Sub s="Q" i="v" />} nl="Värme in" />
                            <span className="fnum">≤</span>
                            <Vbl label="Största möjliga"><Sub s="η" i="max" /></Vbl>
                            <span className="fnum">= 1 −</span>
                            <BrakL tl="Kalla sidans temperatur" t={<Sub s="T" i="k" />} n={<Sub s="T" i="v" />} nl="Varma sidans temperatur" />
                        </div>
                        ) : (
                        <div className="flex items-center gap-x-3">
                            <Vbl label="Värme från kalla sidan"><Sub s="Q" i="k" /></Vbl>
                            <span className="fnum">≤</span>
                            <Vbl label="Arbete"><em>W</em></Vbl>
                            <span className="fnum">·</span>
                            <BrakL tl="Kalla sidans temperatur" t={<Sub s="T" i="k" />} n={<span><Sub s="T" i="v" /> − <Sub s="T" i="k" /></span>} nl="Temperaturskillnad" />
                        </div>
                        )}
                        <div className="text-sm" style={{ color: 'var(--lab-ink-soft)', maxWidth: 440 }}>
                            {typ === 'maskin' ? 'En värmemaskin måste släppa ut en del av värmen till något kallare.' : 'En värmepump behöver arbete för att flytta värme från kallt till varmt.'} Temperaturerna räknas i kelvin.
                        </div>
                    </div>
                    <div className="pt-3 fnum-live" style={{ borderTop: '1px solid var(--lab-line, rgba(15,22,32,0.14))' }}>
                        {typ === 'maskin' ? (
                            <div><Sub s="η" i="max" /> = 1 − <Brak t={`${fmt(Tk, 0)} K`} n={`${fmt(Tv, 0)} K`} /> = {fmt(100 * em, 0)} %{dolj ? '' : <span>, och här är <em>η</em> = <Brak t={`${fmt(W, 0)} J`} n={`${fmt(Qv, 0)} J`} /> = {fmt(100 * W / Qv, 0)} %{mojlig ? '' : ': omöjligt'}</span>}</div>
                        ) : (
                            <div>Värmepumpen: <Sub s="Q" i="v" /> = <em>W</em> + <Sub s="Q" i="k" /> = {fmt(W, 0)} J + {fmt(Qk, 0)} J = {fmt(Qv, 0)} J.{' '}
                                Med <em>W</em> = {fmt(W, 0)} J går det att hämta högst <Sub s="Q" i="k" /> = <em>W</em> · <Brak t={<Sub s="T" i="k" />} n={<span><Sub s="T" i="v" /> − <Sub s="T" i="k" /></span>} /> = {fmt(M.qkMax(Tv, Tk, W), 0)} J från den kalla sidan.</div>
                        )}
                        <div className="mt-1 text-base" style={{ color: 'var(--lab-ink-soft)' }}>
                            {typ === 'maskin'
                                ? <Fx text="Energin bevaras, Q_v = W + Q_k, men värmen som går ut till den kalla sidan har låg kvalitet och gör inte mycket nytta." />
                                : <Fx text="Körs maskinen baklänges flyttar den värme från kallt till varmt, men bara om den tillförs arbete. Gränsen gäller en idealmaskin. Ett verkligt kylskåp flyttar bara två till tre joule värme per joule arbete, eftersom köldmediet måste vara kallare än insidan och varmare än köket." />}
                        </div>
                    </div>
                </div>
            );
        };

        // ════════════════════════════════════════════════════════
        //  FÄRDIGA FÖRSÖK OCH GISSA-LÄGET
        // ════════════════════════════════════════════════════════
        const FORSOK = [
            { id: 'mot',  namn: 'Varmt möter kallt', sub: '80 °C och 20 °C, lika stora block', cfg: { lage: 'block', mA: 1, mB: 1, TA: 80, TB: 20, q: 200 } },
            { id: 'stor', namn: 'Litet varmt, stort kallt', sub: '1 kg vid 80 °C, 3 kg vid 20 °C', cfg: { lage: 'block', mA: 1, mB: 3, TA: 80, TB: 20, q: 200 } },
            { id: 'tio',  namn: 'Tio brickor', sub: 'då går det ibland baklänges', cfg: { lage: 'block', mA: 1, mB: 1, TA: 80, TB: 20, q: 10 } },
            { id: 'bil',  namn: 'Bilmotorn', sub: '900 K och 350 K, η = 28 %', cfg: { lage: 'maskin', typ: 'maskin', Tv: 900, Tk: 350, eta: 0.28 } },
            { id: 'kraft', namn: 'Kraftverket', sub: '800 K och 300 K, η = 40 %', cfg: { lage: 'maskin', typ: 'maskin', Tv: 800, Tk: 300, eta: 0.4 } },
            { id: 'kyl',  namn: 'Kylskåpet', sub: 'värme från 5 °C till 20 °C', cfg: { lage: 'maskin', typ: 'pump', Tv: 293, Tk: 278, Qk: 300 } },
        ];
        const slump = (a) => a[Math.floor(Math.random() * a.length)];
        function nyUppgift(typ) {
            if (typ === 'slut') {
                const TA = slump([60, 70, 80, 90]), TB = slump([10, 15, 20, 30]);
                return { typ, mA: slump([0.5, 1, 1.5, 2]), mB: slump([1, 1.5, 2, 3]), TA, TB };
            }
            const Tv = slump([400, 500, 600, 800, 900]), Tk = slump([280, 300, 350]);
            const em = M.etaMax(Tv, Tk);
            // hälften av uppgifterna går att bygga
            const eta = Math.round(100 * (Math.random() < 0.5 ? em * (0.4 + 0.5 * Math.random()) : Math.min(0.95, em + 0.05 + 0.25 * Math.random()))) / 100;
            return { typ, Tv, Tk, eta };
        }

        // ════════════════════════════════════════════════════════
        //  HUVUDAPP
        // ════════════════════════════════════════════════════════
        const App = () => {
            const [lage, setLage] = useState(new URLSearchParams(location.search).get('lage') === 'maskin' ? 'maskin' : 'block');
            // läge 1
            const [mA, setMA] = useState(1);
            const [mB, setMB] = useState(1);
            const [TA, setTA] = useState(80);
            const [TB, setTB] = useState(20);
            const [q, setQ] = useState(200);
            const [ihop, setIhop] = useState(false);
            const [snabb, setSnabb] = useState(false);
            // läge 2
            const [typ, setTyp] = useState('maskin');
            const [exempel, setExempel] = useState(null);     // { id, typ } för Bilmotorn, Kraftverket, Kylskåpet
            const [Tv, setTv] = useState(900);
            const [Tk, setTk] = useState(350);
            const [eta, setEta] = useState(0.28);
            const [Qk2, setQk2] = useState(300);
            const [kor, setKor] = useState(false);

            const [togglesOpen, setTogglesOpen] = useState(true);
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [, setFrame] = useState(0);
            const [gissa, setGissa] = useState(null);
            const [svarTxt, setSvarTxt] = useState('');
            const [svarStatus, setSvarStatus] = useState(null);
            const [poang, setPoang] = useState({ ratt: 0, totalt: 0, svit: 0 });

            const sceneWrapRef = useRef(null);
            const svgRef = useRef(null);
            const stRef = useRef(null);
            const histRef = useRef([]);
            const Tvis = useRef({ A: 80, B: 20 });
            const flygRef = useRef([]);
            const flyg2Ref = useRef([]);
            const lyftRef = useRef(0);
            const idRef = useRef(0);
            const st2Ref = useRef({ t: 0, varv: 0 });
            const lastRef = useRef(null);
            const accRef = useRef(0);
            const gapRef = useRef(GAP_ISAR);
            const kulaRef = useRef(0);
            const flodeRef = useRef({ ab: 0, ba: 0 });
            const live = useRef({});
            live.current = { lage, ihop, snabb, kor, typ, Tv, Tk, eta, Qk2 };

            const nyttPar = (c) => {
                stRef.current = M.nyttPar(c);
                const t = M.temp(stRef.current);
                Tvis.current = { ...t };
                histRef.current = [{ t: 0, A: t.A, B: t.B }];
                flygRef.current = [];
                flodeRef.current = { ab: 0, ba: 0 };
                kulaRef.current = stRef.current.qA;
                setIhop(false);
                setFrame((n) => n + 1);
            };
            if (!stRef.current) {
                stRef.current = M.nyttPar({ mA, mB, TA, TB, q });
                const t = M.temp(stRef.current);
                histRef.current = [{ t: 0, A: t.A, B: t.B }];
                kulaRef.current = stRef.current.qA;
            }
            useEffect(() => { if (!live.current.ihop || stRef.current.hopp === 0) nyttPar({ mA, mB, TA, TB, q }); }, [mA, mB, TA, TB, q]);

            const maskinVal = () => {
                const Qv = 200;
                if (typ === 'maskin') { const r = M.maskin(Tv, Tk, eta, Qv); return { Qv, W: r.W, Qk: r.Qk, mojlig: r.mojlig }; }
                const W = 100, r = M.pump(Tv, Tk, W, Qk2);
                return { Qv: r.Qv, W, Qk: Qk2, mojlig: r.mojlig };
            };

            useEffect(() => {
                let raf;
                const loop = (ts) => {
                    if (lastRef.current == null) lastRef.current = ts;
                    const dt = Math.min((ts - lastRef.current) / 1000, 0.05);
                    lastRef.current = ts;
                    const L = live.current;
                    if (L.lage === 'block') {
                        const st = stRef.current;
                        // blocken glider ihop eller isär
                        gapRef.current += ((L.ihop ? 0 : GAP_ISAR) - gapRef.current) * Math.min(1, dt * 7);
                        if (Math.abs(gapRef.current - (L.ihop ? 0 : GAP_ISAR)) < 0.3) gapRef.current = L.ihop ? 0 : GAP_ISAR;
                        // kulan i diagrammet följer fördelningen
                        kulaRef.current += (st.qA - kulaRef.current) * Math.min(1, dt * (L.snabb ? 12 : 5));
                        if (L.ihop && gapRef.current === 0) {
                            const takt = L.snabb ? 3000 : 80;            // försök per sekund
                            accRef.current += dt * takt;
                            const N = st.NA + st.NB;
                            while (accRef.current >= 1) {
                                accRef.current -= 1;
                                // samma två slumptal som motorn använder, så att flygturen går mellan rätt atomer
                                const r1 = Math.random(), r2 = Math.random();
                                const i = Math.floor(r1 * N), j = Math.floor(r2 * N);
                                const flyttas = st.n[i] > 0 && i !== j;
                                let k = 0;
                                const d = M.hopp(st, () => (k++ ? r2 : r1));
                                if (d > 0) flodeRef.current.ba++;
                                if (d < 0) flodeRef.current.ab++;
                                if (flyttas && !L.snabb) flygRef.current.push({ id: idRef.current++, t0: ts, i, j, dur: 420 });
                            }
                        }
                        flygRef.current = flygRef.current.filter((f) => ts - f.t0 < f.dur);
                        if (L.ihop) {
                            const t = M.temp(st), k = Math.min(1, dt / (L.snabb ? 0.4 : 2.5));
                            Tvis.current = { A: Tvis.current.A + (t.A - Tvis.current.A) * k, B: Tvis.current.B + (t.B - Tvis.current.B) * k };
                            const h = histRef.current, tt = (h.length ? h[h.length - 1].t : 0) + dt;
                            h.push({ t: tt, A: Tvis.current.A, B: Tvis.current.B });
                            while (h.length > 2 && h[h.length - 1].t - h[0].t > 62) h.shift();
                        }
                    }
                    if (L.lage === 'maskin' && L.kor) {
                        const s2 = st2Ref.current;
                        s2.t += dt;
                        const v = maskinValRef.current();
                        if (v.mojlig) {
                            // ett varv på 2 s: brickor ut ur den varma behållaren, och arbete och kall värme ut ur maskinen
                            const fas = s2.t % 2, forra = (s2.t - dt) % 2;
                            const pump = L.typ === 'pump';
                            const nyB = (n, f0, f1) => Math.floor(Math.min(f1, 1) * n) - Math.floor(Math.min(f0, 1) * n);
                            const skicka = (n, c, x0, y0, x1, y1) => { for (let i = 0; i < n; i++) flyg2Ref.current.push({ id: idRef.current++, t0: ts + i * 40, c, x0, y0, x1, y1 }); };
                            const f0 = fas < forra ? 0 : forra, f1 = fas;
                            const vY = VARM.y + VARM.h, cT = CYL.y, cB = CYL.y + CYL.h, kY = KALL.y, hR = HJUL.x + HJUL.r;
                            if (!pump) {
                                skicka(nyB(Math.round(v.Qv / BRICKA2), f0, f1), COL.varm, BAND_X, vY, BAND_X, cT);
                                skicka(nyB(Math.round(v.W / BRICKA2), f0 - 0.6, f1 - 0.6), COL.W, hR, HJUL.y, LAST_X, HJUL.y);
                                skicka(nyB(Math.round(v.Qk / BRICKA2), f0 - 0.6, f1 - 0.6), COL.sliten, BAND_X, cB, BAND_X, kY);
                                lyftRef.current += v.W / (10 * 9.82) * dt / 2;
                            } else {
                                skicka(nyB(Math.round(v.W / BRICKA2), f0, f1), COL.W, LAST_X, HJUL.y, hR, HJUL.y);
                                skicka(nyB(Math.round(v.Qk / BRICKA2), f0, f1), COL.sliten, BAND_X, kY, BAND_X, cB);
                                skicka(nyB(Math.round(v.Qv / BRICKA2), f0 - 0.6, f1 - 0.6), COL.varm, BAND_X, cT, BAND_X, vY);
                            }
                        }
                        flyg2Ref.current = flyg2Ref.current.filter((f) => ts - f.t0 < 900 || f.t0 > ts);
                    }
                    setFrame((n) => n + 1);
                    raf = requestAnimationFrame(loop);
                };
                raf = requestAnimationFrame(loop);
                return () => cancelAnimationFrame(raf);
            }, []);
            const maskinValRef = useRef(maskinVal); maskinValRef.current = maskinVal;

            // ── Gissa-läget ──
            const startaGissa = (t) => {

                setGissa(u); setSvarTxt(''); setSvarStatus(null);
                if (t === 'slut') {

                        {isFullscreen && (

            const chans = M.log10ChansStart(st);
            return (

                            <a href="index.html">Hem</a> / <a href="katalog.html#fy1">Fysik nivå 1</a> / Termodynamikens andra huvudsats
                        </div>

                            hoppa på måfå mellan atomerna. Ändå jämnar temperaturerna ut sig, och diagrammet över antalet sätt att fördela energin visar <strong>varför</strong>.

                        <FormelKort lage={lage} st={st} typ={typ} Tv={Tv} Tk={Tk} {...v} dolj={dolj} mA={mA} mB={mB} TA={TA} TB={TB} />

                                          typ={typ} Tv={Tv} Tk={Tk} {...v} flyg2={flyg2Ref.current} lyft={lyftRef.current}

                                    {gissa && (
