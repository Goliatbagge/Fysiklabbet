    <script type="text/babel">
        const { useState, useRef, useEffect, useMemo, useCallback } = React;

        // ── Konstanter ────────────────────────────────────────────────
        const TIME_STEP = 1 / 60;          // fysiksteg (s)
        const DRAG_K = 0.01;               // luftmotstånd: a = −k·v·|v|
        const ULTRA = 0.15;                // tidsfaktor i ultrarapid
        const PAD_L = 58, PAD_R = 26, PAD_T = 22, GROUND_H = 68;   // markremsan rymmer x-värdena och scen-tipset
        const BALL_R = 8;

        // Färger: komposanterna röda och resultanten blå — samma som i
        // teorifiguren i fy2-1.8, så att simuleringen och genomgången
        // läses som samma bild.
        const COL = {
            comp: '#c0392b', v: '#2563c9', axis: '#38bdf8',
            ink: '#0f1620', soft: '#3a4151', muted: '#5a6170',
            grid: 'rgba(96,130,175,0.20)', traj: 'rgba(15,22,32,0.55)',
            ball: '#d6dd4a', ballEdge: '#7e8420', seam: '#f6f8dc',
        };

        const BODIES = [
            { name: 'Solen',     g: 274.0, grad: 'linear-gradient(45deg, #fde68a, #f97316)', ground: '#f0a24a' },
            { name: 'Merkurius', g: 3.7,   grad: 'linear-gradient(45deg, #b8b2ab, #78716c)', ground: '#9c948c' },
            { name: 'Venus',     g: 8.87,  grad: 'linear-gradient(45deg, #fde68a, #d9a521)', ground: '#dcb95a' },
            { name: 'Jorden',    g: 9.82,  grad: 'linear-gradient(45deg, #3fb970, #3b82f6)', ground: '#7fb26a' },
            { name: 'Månen',     g: 1.62,  grad: 'linear-gradient(45deg, #f1f5f9, #94a3b8)', ground: '#b5b9bf' },
            { name: 'Mars',      g: 3.72,  grad: 'linear-gradient(45deg, #f28b7d, #b91c1c)', ground: '#cf7a5a' },
            { name: 'Jupiter',   g: 24.79, grad: 'linear-gradient(45deg, #f5d27a, #a16207)', ground: '#cfa860' },
            { name: 'Saturnus',  g: 10.44, grad: 'linear-gradient(45deg, #fbe4a0, #ca8a04)', ground: '#d8be74' },
            { name: 'Uranus',    g: 8.69,  grad: 'linear-gradient(45deg, #a5e3fb, #0ea5e9)', ground: '#8fc9df' },
            { name: 'Neptunus',  g: 11.15, grad: 'linear-gradient(45deg, #60c3f5, #2563eb)', ground: '#7aa9dc' },
        ];

        // ── Sifferformatering (komma, exakt/avrundat noll utan decimaler) ──
        const fmt = (n, d = 2) => {
            const s = n.toFixed(d);
            if (parseFloat(s) === 0) return '0';
            return s.replace('.', ',');
        };
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

        // ── Fysiken: ett steg ────────────────────────────────────────
        // Returnerar nytt tillstånd; landar bollen (y < 0) interpoleras
        // steget till y = 0 så att nedslagspunkten och flygtiden blir
        // exakta i stället för "nästa bildruta".
        function stepState(st, p, dt) {
            let { t, x, y, vx, vy } = st;
            // accelerationen räknas i stegets början och läget uppdateras
            // med s = v·t + a·t²/2 — exakt när accelerationen är konstant,
            // så att kastvidd och stighöjd stämmer med formlerna.
            let ax = 0, ay = -p.g;
            if (p.air) {
                const sp = Math.hypot(vx, vy);
                ax = -DRAG_K * vx * sp;
                ay += -DRAG_K * vy * sp;
            }
            x += vx * dt + ax * dt * dt / 2;
            y += vy * dt + ay * dt * dt / 2;
            vx += ax * dt; vy += ay * dt; t += dt;
            let done = false;
            if (y < 0) {
                const f = st.y > 0 ? st.y / (st.y - y) : 0;
                x = st.x + f * (x - st.x);
                t = st.t + f * dt;
                vx = st.vx + f * (vx - st.vx);
                vy = st.vy + f * (vy - st.vy);
                y = 0;
                done = true;
            }
            let peak = y > st.peak.y ? { x, y } : st.peak;
            // Högsta punkten ligger oftast mellan två bildrutor: utan
            // luftmotstånd räknas den ut exakt när v_y byter tecken.
            if (!p.air && st.vy > 0 && vy <= 0) {
                const tt = st.vy / p.g;
                peak = { x: st.x + st.vx * tt, y: st.y + st.vy * st.vy / (2 * p.g) };
            }
            return { t, x, y, vx, vy, peak, done };
        }
        function initialState(p) {
            const a = p.angle * Math.PI / 180;
            return { t: 0, x: 0, y: p.h, vx: p.v0 * Math.cos(a), vy: p.v0 * Math.sin(a),
                     peak: { x: 0, y: p.h }, done: false };
        }
        // Kastvidd, stighöjd och flygtid utan luftmotstånd — används för
        // att välja skalan så att hela banan ryms på pappret.
        function predict(p) {
            const a = p.angle * Math.PI / 180;
            const vx0 = p.v0 * Math.cos(a), vy0 = p.v0 * Math.sin(a);
            const tF = (vy0 + Math.sqrt(vy0 * vy0 + 2 * p.g * p.h)) / p.g;
            return { vx0, vy0, tF, xm: vx0 * tF, ym: p.h + vy0 * vy0 / (2 * p.g) };
        }

        // ── Canvas-hjälpare ───────────────────────────────────────────
        function arrow(ctx, x1, y1, x2, y2, color, width, head, dashed) {
            const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy);
            if (L < 1) return;
            const ux = dx / L, uy = dy / L;
            const h = Math.min(head, L * 0.6);
            const bx = x2 - ux * h, by = y2 - uy * h;   // pilhuvudets bas
            ctx.save();
            ctx.strokeStyle = color; ctx.fillStyle = color;
            ctx.lineWidth = width; ctx.lineCap = 'butt';
            if (dashed) ctx.setLineDash([6, 4]);
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(bx, by); ctx.stroke();
            ctx.setLineDash([]);
            const w = h * 0.5;
            ctx.beginPath();
            ctx.moveTo(x2, y2);
            ctx.lineTo(bx - uy * w, by + ux * w);
            ctx.lineTo(bx + uy * w, by - ux * w);
            ctx.closePath(); ctx.fill();
            ctx.restore();
        }
        // "v" kursiv + upprätt index (som i figuren: v_x, v_y, v)
        function vLabel(ctx, sub, x, y, align, baseline, color) {
            ctx.save();
            ctx.font = "italic 15px 'Poppins', sans-serif";
            const wv = ctx.measureText('v').width;
            ctx.font = "11px 'Poppins', sans-serif";
            const ws = sub ? ctx.measureText(sub).width : 0;
            const total = wv + ws + (sub ? 1 : 0);
            const x0 = align === 'right' ? x - total : align === 'center' ? x - total / 2 : x;
            ctx.textAlign = 'left'; ctx.textBaseline = baseline; ctx.fillStyle = color;
            ctx.font = "italic 15px 'Poppins', sans-serif";
            ctx.fillText('v', x0, y);
            if (sub) { ctx.font = "11px 'Poppins', sans-serif"; ctx.fillText(sub, x0 + wv + 1, y + 3); }
            ctx.restore();
        }
        // "y_max = 6,72 m" — kursiv variabel, upprätt index, upprätt värde
        function resultLabel(ctx, varName, value, x, y, align, color) {
            ctx.save();
            ctx.font = "italic 600 13px 'Poppins', sans-serif";
            const w1 = ctx.measureText(varName).width;
            ctx.font = "600 9.5px 'Poppins', sans-serif";
            const w2 = ctx.measureText('max').width;
            ctx.font = "600 13px 'Poppins', sans-serif";
            const rest = ' = ' + value;
            const w3 = ctx.measureText(rest).width;
            const total = w1 + w2 + w3 + 1;
            const x0 = align === 'right' ? x - total : align === 'center' ? x - total / 2 : x;
            ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = color;
            ctx.font = "italic 600 13px 'Poppins', sans-serif"; ctx.fillText(varName, x0, y);
            ctx.font = "600 9.5px 'Poppins', sans-serif"; ctx.fillText('max', x0 + w1 + 1, y + 3);
            ctx.font = "600 13px 'Poppins', sans-serif"; ctx.fillText(rest, x0 + w1 + w2 + 1, y);
            ctx.restore();
        }
        function niceStep(range) {
            if (!(range > 0)) return 1;
            const e = Math.floor(Math.log10(range));
            const f = range / Math.pow(10, e);
            const nf = f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10;
            return Math.max(0.05, nf * Math.pow(10, e));
        }
        const tickText = (m, step) => fmt(m, step < 0.1 ? 2 : step < 1 ? 1 : 0);

        // ── Reglage ──────────────────────────────────────────────────
        const Slider = ({ label, value, min, max, step, onChange, children }) => (
            <div className="flex items-center gap-2 mb-2">
                <span className="text-xs flex-shrink-0" style={{ minWidth: 118, color: 'var(--lab-ink-soft)' }}
                      dangerouslySetInnerHTML={{ __html: label }} />
                <input type="range" min={min} max={max} step={step} value={clamp(value, min, max)}
                       onChange={(e) => onChange(parseFloat(e.target.value))}
                       className="flex-1 cursor-pointer" />
                {children}
            </div>
        );
        // Kompakt reglage-rad för inställningsrutan uppe till höger i
        // fullskärm: etikett + sifferfält på en rad, glidaren under.
        const StSlider = ({ label, value, min, max, step, onChange, valueNode }) => (
            <div className="st-slider">
                <div className="st-slider-top">
                    <span dangerouslySetInnerHTML={{ __html: label }} />
                    {valueNode}
                </div>
                <input type="range" min={min} max={max} step={step} value={clamp(value, min, max)}
                       onChange={(e) => onChange(parseFloat(e.target.value))} />
            </div>
        );
        const NumInput = ({ value, min, max, onCommit, fmtFn, unit, color = 'var(--lab-accent, #c8324a)' }) => {
            const [txt, setTxt] = useState(() => fmtFn(value));
            const [editing, setEditing] = useState(false);
            useEffect(() => { if (!editing) setTxt(fmtFn(value)); }, [value, editing]);
            const commit = (raw) => {
                const norm = raw.replace(',', '.').trim();
                if (norm === '' || norm === '-' || norm === '.' || norm === '-.') return;
                let n = parseFloat(norm);
                if (!isFinite(n)) return;
                if (min != null && n < min) n = min;
                if (max != null && n > max) n = max;
                onCommit(n);
            };
            return (
                <span className="num-wrap">
                    <input className="num-in" type="text" inputMode="decimal" value={txt}
                           style={{ color }} aria-label="Skriv in värde"
                           onFocus={() => setEditing(true)}
                           onChange={(e) => { setTxt(e.target.value); commit(e.target.value); }}
                           onBlur={() => { setEditing(false); setTxt(fmtFn(value)); }}
                           onKeyDown={(e) => { if (e.key === 'Enter') e.currentTarget.blur(); }} />
                    {unit && <span className="num-unit">{unit}</span>}
                </span>
            );
        };

        // ── Formelkort (ord-etikett över/under varje variabel) ─────────
        const Vbl = ({ label, children }) => (
            <div className="flex flex-col items-center" style={{ lineHeight: 1.1 }}>
                <span className="flbl">{label}</span>
                <span className="fnum">{children}</span>
                <span className="flbl" aria-hidden="true" style={{ visibility: 'hidden' }}>{label}</span>
            </div>
        );
        const FormulaCard = () => (
            <div className="formula-card glass-card rounded-xl p-4 mb-6 flex flex-wrap items-center gap-x-4 gap-y-3" style={{ color: 'var(--lab-ink)' }}>
                <Vbl label="Hastighet i x-led"><em>v</em><sub>x</sub></Vbl>
                <span className="fnum">=</span>
                <Vbl label="Utgångshastighet"><em>v</em><sub>0</sub></Vbl>
                <span className="fnum">·</span>
                <Vbl label="Vinkel">cos&thinsp;<em>α</em></Vbl>
                <span className="fnum" style={{ margin: '0 14px', color: 'var(--lab-ink-muted)' }}>|</span>
                <Vbl label="Hastighet i y-led"><em>v</em><sub>y</sub></Vbl>
                <span className="fnum">=</span>
                <Vbl label="Utgångshastighet"><em>v</em><sub>0</sub></Vbl>
                <span className="fnum">·</span>
                <Vbl label="Vinkel">sin&thinsp;<em>α</em></Vbl>
                <span className="fnum">−</span>
                <Vbl label="Tyngdacceleration"><em>g</em></Vbl>
                <span className="fnum">·</span>
                <Vbl label="Tid"><em>t</em></Vbl>
            </div>
        );

        // ── Ikoner (currentColor, inga emoji) ────────────────────────
        const IconPlay = () => (<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>);
        const IconPause = () => (<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4.5" width="4" height="15"/><rect x="14" y="4.5" width="4" height="15"/></svg>);
        const IconStepBack = () => (<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="2.6" height="14"/><path d="M19 5v14L9 12z"/></svg>);
        const IconStepFwd = () => (<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="16.4" y="5" width="2.6" height="14"/><path d="M5 5v14l10-7z"/></svg>);

        // ── Huvudapp ─────────────────────────────────────────────────
        const App = () => {
            // Utgångsläget är Exempel 1 i genomgången (Elin sparkar en boll:
            // 15 m/s, 50°), så att eleven kan spela upp exemplet direkt.
            const [params, setParams] = useState({ angle: 50, v0: 15, h: 0, g: 9.82, air: false, ultra: false });
            const [show, setShow] = useState({ vx: true, vy: true, v: true, axes: true, sym: false });
            const [status, setStatus] = useState('idle');    // idle | running | paused | finished
            const [snap, setSnap] = useState(() => initialState({ angle: 50, v0: 15, h: 0, g: 9.82 }));
            const [result, setResult] = useState(null);      // { xmax, ymax, tF }
            const [finishedAir, setFinishedAir] = useState(false);
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [togglesOpen, setTogglesOpen] = useState(true);
            const [size, setSize] = useState({ w: 800, h: 533 });
            const [panelRect, setPanelRect] = useState(null);
            const [fontsReady, setFontsReady] = useState(false);

            const sceneWrapRef = useRef(null);
            const canvasRef = useRef(null);
            const togglesRef = useRef(null);
            const paramsRef = useRef(params); paramsRef.current = params;
            const stateRef = useRef(snap);
            const histRef = useRef([snap]);
            const trajRef = useRef([{ x: 0, y: 0 }]);
            const rafRef = useRef(null);

            const setP = (key, val) => setParams((p) => ({ ...p, [key]: val }));
            const tShow = (key) => setShow((s) => ({ ...s, [key]: !s[key] }));

            useEffect(() => {
                if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => setFontsReady(true));
            }, []);

            // ── Fullskärm ─────────────────────────────────────────────
            useEffect(() => {
                const handler = () => {
                    const fs = document.fullscreenElement === sceneWrapRef.current ||
                               document.webkitFullscreenElement === sceneWrapRef.current;
                    setIsFullscreen(fs);
                };
                document.addEventListener('fullscreenchange', handler);
                document.addEventListener('webkitfullscreenchange', handler);
                return () => {
                    document.removeEventListener('fullscreenchange', handler);
                    document.removeEventListener('webkitfullscreenchange', handler);
                };
            }, []);
            const toggleFullscreen = () => {
                const el = sceneWrapRef.current;
                if (!el) return;
                const isFs = document.fullscreenElement || document.webkitFullscreenElement;
                if (isFs) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
            };

            // ── Scenens och inställningsrutans mått ───────────────────
            useEffect(() => {
                const c = canvasRef.current;
                if (!c) return;
                const ro = new ResizeObserver(() => {
                    const w = c.clientWidth, h = c.clientHeight;
                    if (w > 0 && h > 0) setSize((s) => (s.w === w && s.h === h) ? s : { w, h });
                });
                ro.observe(c);
                return () => ro.disconnect();
            }, []);
            useEffect(() => {
                const el = togglesRef.current, wrap = sceneWrapRef.current;
                if (!el || !wrap) { setPanelRect(null); return; }
                const mata = () => {
                    const r = el.getBoundingClientRect(), w = wrap.getBoundingClientRect();
                    // Bara en ruta som ligger OVANPÅ scenen (absolut positionerad)
                    // ska banan väja för: på en telefon dockas rutan under scenen.
                    if (r.width === 0 || getComputedStyle(el).position !== "absolute") { setPanelRect(null); return; }
                    setPanelRect({ left: r.left - w.left, right: r.right - w.left, bottom: r.bottom - w.top });
                };
                mata();
                const ro = new ResizeObserver(mata);
                ro.observe(el);
                return () => ro.disconnect();
            }, [togglesOpen, isFullscreen, status, finishedAir, size.w, size.h]);

            // ── Återställning ─────────────────────────────────────────
            const reset = useCallback(() => {
                if (rafRef.current) cancelAnimationFrame(rafRef.current);
                const st = initialState(paramsRef.current);
                stateRef.current = st;
                histRef.current = [st];
                trajRef.current = [{ x: 0, y: st.y }];
                setSnap(st);
                setResult(null);
                setStatus('idle');
                setShow((s) => s.sym ? { ...s, sym: false } : s);
            }, []);
            // Nytt kast så snart förutsättningarna ändras
            useEffect(() => { reset(); }, [params.angle, params.v0, params.h, params.g, params.air]);

            const applyStep = (st) => {
                stateRef.current = st;
                histRef.current.push(st);
                if (histRef.current.length % 3 === 0 || st.done) trajRef.current.push({ x: st.x, y: st.y });
                setSnap(st);
                if (st.done) {
                    setResult({ xmax: st.x, ymax: st.peak.y, tF: st.t });
                    setFinishedAir(paramsRef.current.air);
                    setStatus('finished');
                }
                return st.done;
            };

            // ── Uppspelning (verklig tid, fast fysiksteg) ─────────────
            useEffect(() => {
                if (status !== 'running') return;
                let last = performance.now(), acc = 0, alive = true;
                const loop = (now) => {
                    if (!alive) return;
                    const p = paramsRef.current;
                    acc += Math.min((now - last) / 1000, 0.05) * (p.ultra ? ULTRA : 1);
                    last = now;
                    let done = false;
                    while (acc >= TIME_STEP && !done) {
                        acc -= TIME_STEP;
                        done = applyStep(stepState(stateRef.current, p, TIME_STEP));
                    }
                    if (!done) rafRef.current = requestAnimationFrame(loop);
                };
                rafRef.current = requestAnimationFrame(loop);
                return () => { alive = false; if (rafRef.current) cancelAnimationFrame(rafRef.current); };
            }, [status]);

            const primary = () => {
                if (status === 'running') setStatus('paused');
                else if (status === 'paused') setStatus('running');
                else if (status === 'finished') { reset(); setTimeout(() => setStatus('running'), 0); }
                else setStatus('running');
            };
            const stepForward = () => {
                if (status !== 'paused') return;
                applyStep(stepState(stateRef.current, paramsRef.current, TIME_STEP));
            };
            const stepBackward = () => {
                if (status !== 'paused' || histRef.current.length <= 1) return;
                histRef.current.pop();
                const st = histRef.current[histRef.current.length - 1];
                stateRef.current = st;
                const n = 1 + Math.floor(histRef.current.length / 3);
                if (trajRef.current.length > n) trajRef.current.length = n;
                setSnap(st);
            };

            // ── Mini-läget: minisim-kortet i teorin styr sidan ─────────
            const apiRef = useRef({});
            apiRef.current = { primary, reset, setP, stepForward, stepBackward };
            const miniStatusRef = useRef({});
            miniStatusRef.current = {
                status, t: snap.t, v: Math.hypot(snap.vx, snap.vy), x: snap.x, y: snap.y,
                xmax: result ? result.xmax : null, ymax: result ? result.ymax : null,
                tF: result ? result.tF : null, angle: params.angle, v0: params.v0, air: params.air,
                canBack: histRef.current.length > 1,
            };
            useEffect(() => {
                if (!window.__MINI) return;
                const onMsg = (e) => {
                    const m = e.data;
                    if (!m || !m.fysikKast) return;
                    const a = apiRef.current;
                    if (m.fysikKast === 'primar') a.primary();
                    else if (m.fysikKast === 'reset') a.reset();
                    else if (m.fysikKast === 'stegfram') a.stepForward();
                    else if (m.fysikKast === 'stegbak') a.stepBackward();
                    else if (m.fysikKast === 'vinkel') a.setP('angle', clamp(+m.value || 0, 0, 90));
                    else if (m.fysikKast === 'fart') a.setP('v0', clamp(+m.value || 1, 1, 30));
                };
                window.addEventListener('message', onMsg);
                const id = window.parent !== window
                    ? setInterval(() => { window.parent.postMessage({ fysikKastStatus: miniStatusRef.current }, '*'); }, 150)
                    : null;
                return () => { window.removeEventListener('message', onMsg); if (id) clearInterval(id); };
            }, []);

            // ── Skalan: hela banan ska rymmas, lika skala i x- och y-led ──
            const fit = useMemo(() => {
                const pr = predict(params);
                const W = size.w, H = size.h;
                const worldW = Math.max(pr.xm * 1.08 + 0.4, pr.ym * 0.9, 1.5);
                const worldH = Math.max(pr.ym * 1.18 + 0.25, pr.xm * 0.2, 1.0);
                const availW = W - PAD_L - PAD_R, availH = H - PAD_T - GROUND_H;
                let s = Math.min(availW / worldW, availH / worldH);
                // Banan får inte försvinna in bakom inställningsrutan uppe
                // till höger: krymp skalan tills kurvan går fri under den.
                if (panelRect && pr.vx0 > 1e-6) {
                    const a = params.angle * Math.PI / 180;
                    const under = (sc) => {
                        for (let px = panelRect.left; px <= panelRect.right; px += 6) {
                            const xw = (px - PAD_L) / sc;
                            if (xw < 0 || xw > pr.xm) continue;
                            const yw = params.h + xw * Math.tan(a) - params.g * xw * xw / (2 * pr.vx0 * pr.vx0);
                            if (H - GROUND_H - yw * sc < panelRect.bottom + 14) return true;
                        }
                        return false;
                    };
                    const s0 = s;
                    for (let i = 0; i < 30 && under(s); i++) s *= 0.95;
                    s = Math.max(s, s0 * 0.5);
                }
                const refPx = Math.max(pr.xm * s, pr.ym * s, 90);
                const vec = Math.min(0.24 * refPx / params.v0, 0.3 * W / params.v0);   // px per m/s
                return { s, vec, ...pr };
            }, [params.angle, params.v0, params.h, params.g, size.w, size.h, panelRect]);

            // ── Rendering ─────────────────────────────────────────────
            useEffect(() => {
                const c = canvasRef.current;
                if (!c) return;
                const W = size.w, H = size.h;
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                if (c.width !== Math.round(W * dpr) || c.height !== Math.round(H * dpr)) {
                    c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
                }
                const ctx = c.getContext('2d');
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                const { s, vec } = fit;
                const toX = (x) => PAD_L + x * s;
                const toY = (y) => H - GROUND_H - y * s;
                const groundY = toY(0);
                // Markytan ligger en bollradie under x-axeln: bollens
                // centrum följer y = 0, men bollen ska vila PÅ marken, inte
                // sitta halvvägs ned i den.
                const gTop = groundY + BALL_R + 1;

                // Papper med kollegieblocks-rutnät, i takt med axlarnas skala
                const bg = ctx.createLinearGradient(0, 0, 0, H);
                bg.addColorStop(0, '#f7f2e8'); bg.addColorStop(1, '#ece3d2');
                ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
                const step = niceStep(Math.max((W - PAD_L - PAD_R) / s / 10, 46 / s));
                const stepPx = step * s;
                // finare hjälplinjer (fjärdedels steg) i ljusare ton, sedan
                // huvudlinjerna i takt med axlarnas värden
                const grid = (px, alpha) => {
                    ctx.strokeStyle = 'rgba(96,130,175,' + alpha + ')'; ctx.lineWidth = 1;
                    ctx.beginPath();
                    for (let x = PAD_L - Math.floor(PAD_L / px) * px; x < W; x += px) {
                        ctx.moveTo(Math.round(x) + 0.5, 0); ctx.lineTo(Math.round(x) + 0.5, H);
                    }
                    for (let y = groundY - Math.floor(groundY / px) * px; y < H; y += px) {
                        ctx.moveTo(0, Math.round(y) + 0.5); ctx.lineTo(W, Math.round(y) + 0.5);
                    }
                    ctx.stroke();
                };
                if (stepPx / 4 >= 9) grid(stepPx / 4, 0.10);
                grid(stepPx, 0.24);

                // Marken — papperston med himlakroppens färg som tunn lasyr
                const body = BODIES.find((b) => Math.abs(b.g - params.g) < 0.005);
                ctx.fillStyle = '#e3d9c3'; ctx.fillRect(0, gTop, W, H - gTop);
                if (body) { ctx.globalAlpha = 0.32; ctx.fillStyle = body.ground; ctx.fillRect(0, gTop, W, H - gTop); ctx.globalAlpha = 1; }
                ctx.strokeStyle = 'rgba(15,22,32,0.55)'; ctx.lineWidth = 1.4;
                ctx.beginPath(); ctx.moveTo(0, gTop + 0.5); ctx.lineTo(W, gTop + 0.5); ctx.stroke();

                // Utkastramp när kastet startar från en höjd
                if (params.h > 0) {
                    const top = toY(params.h);
                    ctx.fillStyle = '#cdbf9f';
                    ctx.strokeStyle = 'rgba(15,22,32,0.5)'; ctx.lineWidth = 1.2;
                    ctx.beginPath(); ctx.rect(PAD_L - 16, top, 16, gTop - top); ctx.fill(); ctx.stroke();
                    ctx.fillStyle = 'rgba(15,22,32,0.14)';
                    for (let yy = top + 8; yy < gTop - 4; yy += 12) ctx.fillRect(PAD_L - 13, yy, 10, 2);
                }

                // Axlar (pilspets bara åt det positiva hållet)
                if (show.axes) {
                    ctx.save();
                    ctx.strokeStyle = COL.axis; ctx.fillStyle = COL.axis; ctx.lineWidth = 1.6;
                    ctx.beginPath(); ctx.moveTo(PAD_L, groundY); ctx.lineTo(W - 12, groundY); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(W - 12, groundY - 4); ctx.lineTo(W - 2, groundY); ctx.lineTo(W - 12, groundY + 4); ctx.closePath(); ctx.fill();
                    ctx.beginPath(); ctx.moveTo(PAD_L, groundY); ctx.lineTo(PAD_L, 12); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(PAD_L - 4, 12); ctx.lineTo(PAD_L, 2); ctx.lineTo(PAD_L + 4, 12); ctx.closePath(); ctx.fill();
                    ctx.fillStyle = COL.muted; ctx.font = "11px 'Poppins', sans-serif";
                    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
                    for (let m = step; toX(m) < W - 30; m += step) {
                        const x = toX(m);
                        ctx.strokeStyle = COL.axis; ctx.beginPath(); ctx.moveTo(x, groundY); ctx.lineTo(x, groundY + 4); ctx.stroke();
                        ctx.fillText(tickText(m, step), x, gTop + 5);
                    }
                    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
                    // y-värdena börjar nedanför fullskärmsknappen (14–54 px)
                    for (let m = step; toY(m) > 62; m += step) {
                        const y = toY(m);
                        ctx.beginPath(); ctx.moveTo(PAD_L - 4, y); ctx.lineTo(PAD_L, y); ctx.stroke();
                        ctx.fillText(tickText(m, step), PAD_L - 7, y);
                    }
                    // axelnamn: kursiv variabel + upprätt enhet
                    ctx.fillStyle = COL.soft; ctx.textBaseline = 'top';
                    ctx.font = "11px 'Poppins', sans-serif";
                    const wm = ctx.measureText('(m)').width;
                    ctx.textAlign = 'right'; ctx.fillText('(m)', W - 4, gTop + 18);
                    ctx.font = "italic 13px 'Poppins', sans-serif"; ctx.fillText('x', W - 4 - wm - 4, gTop + 16);
                    ctx.textAlign = 'left';
                    ctx.fillText('y', PAD_L + 9, 3);
                    const wy = ctx.measureText('y').width;
                    ctx.font = "11px 'Poppins', sans-serif"; ctx.fillText('(m)', PAD_L + 9 + wy + 4, 5);
                    ctx.restore();
                }

                // Utkastriktningen innan kastet: streckad linje + vinkelbåge α
                const sx = toX(0), sy = toY(params.h);
                if (status === 'idle') {
                    const a = params.angle * Math.PI / 180;
                    const L = params.v0 * vec;
                    ctx.save();
                    ctx.setLineDash([6, 5]); ctx.strokeStyle = 'rgba(15,22,32,0.5)'; ctx.lineWidth = 1.6;
                    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + L * Math.cos(a), sy - L * Math.sin(a)); ctx.stroke();
                    ctx.setLineDash([]);
                    if (params.angle > 0.5) {
                        const r = Math.min(30, L * 0.6);
                        ctx.strokeStyle = COL.ink; ctx.lineWidth = 1.2;
                        ctx.beginPath(); ctx.arc(sx, sy, r, 0, -a, true); ctx.stroke();
                        ctx.fillStyle = COL.ink; ctx.font = "italic 14px 'Poppins', sans-serif";
                        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        ctx.fillText('α', sx + (r + 12) * Math.cos(a / 2), sy - (r + 12) * Math.sin(a / 2));
                    }
                    ctx.restore();
                }

                // Banan
                const traj = trajRef.current;
                if (traj.length > 1 || status !== 'idle') {
                    ctx.save();
                    ctx.setLineDash([4, 4]); ctx.strokeStyle = COL.traj; ctx.lineWidth = 1.8;
                    ctx.beginPath(); ctx.moveTo(toX(traj[0].x), toY(traj[0].y));
                    for (let i = 1; i < traj.length; i++) ctx.lineTo(toX(traj[i].x), toY(traj[i].y));
                    ctx.lineTo(toX(snap.x), toY(snap.y));
                    ctx.stroke();
                    ctx.restore();
                }

                // Symmetrilinje genom högsta punkten
                if (show.sym && status === 'finished' && !finishedAir) {
                    const px = toX(snap.peak.x);
                    ctx.save();
                    ctx.setLineDash([5, 5]); ctx.strokeStyle = 'rgba(37,99,201,0.6)'; ctx.lineWidth = 1.4;
                    ctx.beginPath(); ctx.moveTo(px, 14); ctx.lineTo(px, groundY); ctx.stroke();
                    ctx.restore();
                }

                // Resultat efter nedslaget: stighöjd och kastvidd
                if (status === 'finished' && result) {
                    const px = toX(snap.peak.x), py = toY(snap.peak.y);
                    const lx = toX(result.xmax);
                    ctx.save();
                    ctx.setLineDash([2, 4]); ctx.strokeStyle = 'rgba(15,22,32,0.4)'; ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, groundY); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(PAD_L, py); ctx.stroke();
                    ctx.setLineDash([]);
                    ctx.fillStyle = COL.ink;
                    ctx.beginPath(); ctx.arc(px, py, 2.6, 0, Math.PI * 2); ctx.fill();
                    resultLabel(ctx, 'y', fmt(result.ymax) + ' m', px, py - 16, 'center', COL.ink);
                    const rightSide = lx > W * 0.55;
                    resultLabel(ctx, 'x', fmt(result.xmax) + ' m', rightSide ? lx - 12 : lx + 12, groundY - 16,
                                rightSide ? 'right' : 'left', COL.ink);
                    ctx.restore();
                }

                // Bollen (tennisboll) och hastighetsvektorerna från bollens kant
                const bx = toX(snap.x), by = toY(snap.y);
                ctx.save();
                ctx.fillStyle = COL.ball; ctx.strokeStyle = COL.ballEdge; ctx.lineWidth = 1.4;
                ctx.beginPath(); ctx.arc(bx, by, BALL_R, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.strokeStyle = COL.seam; ctx.lineWidth = 1.5;
                ctx.beginPath(); ctx.arc(bx - BALL_R * 0.95, by, BALL_R * 0.95, -0.9, 0.9); ctx.stroke();
                ctx.beginPath(); ctx.arc(bx + BALL_R * 0.95, by, BALL_R * 0.95, Math.PI - 0.9, Math.PI + 0.9); ctx.stroke();
                ctx.restore();

                const { vx, vy } = snap;
                const sp = Math.hypot(vx, vy);
                if (show.vx && Math.abs(vx) > 1e-6) {
                    const x0 = bx + Math.sign(vx) * BALL_R, x1 = bx + vx * vec;
                    arrow(ctx, x0, by, x1, by, COL.comp, 2.6, 9);
                    // under pilen — men ovanför den när bollen ligger på marken,
                    // annars hamnar etiketten på axelns värden
                    const paMarken = by > groundY - 16;
                    vLabel(ctx, 'x', x1 + (vx > 0 ? 6 : -6), paMarken ? by - 4 : by + 14,
                           vx > 0 ? 'left' : 'right', paMarken ? 'bottom' : 'middle', COL.comp);
                }
                if (show.vy && Math.abs(vy) > 1e-6) {
                    const y0 = by - Math.sign(vy) * BALL_R, y1 = by - vy * vec;
                    arrow(ctx, bx, y0, bx, y1, COL.comp, 2.6, 9);
                    const vidAxeln = bx - PAD_L < 40;
                    vLabel(ctx, 'y', vidAxeln ? bx + 8 : bx - 8, y1 + (vy > 0 ? 6 : -6),
                           vidAxeln ? 'left' : 'right', vy > 0 ? 'bottom' : 'top', COL.comp);
                }
                if (show.v && sp > 1e-6) {
                    const ux = vx / sp, uy = vy / sp;
                    const x1 = bx + vx * vec, y1 = by - vy * vec;
                    arrow(ctx, bx + ux * BALL_R, by - uy * BALL_R, x1, y1, COL.v, 3, 10);
                    vLabel(ctx, '', x1 + ux * 8 + (ux >= 0 ? 2 : -2), y1 - uy * 8, ux >= 0 ? 'left' : 'right',
                           uy >= 0 ? 'bottom' : 'top', COL.v);
                }
            }, [snap, status, result, finishedAir, show, params.h, params.g, fit, size, fontsReady, isFullscreen]);

            // ── Inställningsrutan uppe till höger ─────────────────────
            const primaryLabel = status === 'running' ? 'Pausa' : status === 'paused' ? 'Fortsätt'
                               : status === 'finished' ? 'Kasta igen' : 'Kasta';
            const canStep = status === 'paused';
            const sceneToggles = () => {
                if (!togglesOpen) return (
                    <button className="st-show-btn" onClick={() => setTogglesOpen(true)}
                            aria-label="Visa inställningar" title="Visa inställningar" aria-expanded="false">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             strokeWidth="2" strokeLinecap="round" aria-hidden="true">
                            <line x1="4" y1="8" x2="20" y2="8" />
                            <circle cx="14.5" cy="8" r="2.7" fill="currentColor" stroke="none" />
                            <line x1="4" y1="16" x2="20" y2="16" />
                            <circle cx="9.5" cy="16" r="2.7" fill="currentColor" stroke="none" />
                        </svg>
                    </button>
                );
                return (
                    <div className="scene-toggles" ref={togglesRef}>
                        <button className="st-hide" onClick={() => setTogglesOpen(false)}
                                aria-label="Dölj inställningar" title="Dölj inställningar" aria-expanded="true">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 strokeWidth="2.4" strokeLinecap="round" aria-hidden="true">
                                <path d="M6 6l12 12M18 6L6 18" />
                            </svg>
                        </button>
                        <div className="st-title">Visa</div>
                        <label><input type="checkbox" checked={show.vx} onChange={() => tShow('vx')} />
                            <span className="st-swatch" style={{ background: COL.comp }}></span>
                            <span>Hastighet i <em>x</em>-led <em>v</em><sub>x</sub></span></label>
                        <label><input type="checkbox" checked={show.vy} onChange={() => tShow('vy')} />
                            <span className="st-swatch" style={{ background: COL.comp }}></span>
                            <span>Hastighet i <em>y</em>-led <em>v</em><sub>y</sub></span></label>
                        <label><input type="checkbox" checked={show.v} onChange={() => tShow('v')} />
                            <span className="st-swatch" style={{ background: COL.v }}></span>
                            <span>Total hastighet <em>v</em></span></label>
                        <label><input type="checkbox" checked={show.axes} onChange={() => tShow('axes')} />
                            <span className="st-swatch" style={{ background: COL.axis }}></span>
                            <span>Koordinataxlar</span></label>
                        {status === 'finished' && !finishedAir && (
                            <label><input type="checkbox" checked={show.sym} onChange={() => tShow('sym')} />
                                <span className="st-swatch" style={{ background: 'rgba(37,99,201,0.6)' }}></span>
                                <span>Symmetrilinje</span></label>
                        )}
                        <div className="st-title mt">Fysik</div>
                        <label><input type="checkbox" checked={params.air} onChange={(e) => setP('air', e.target.checked)} /><span>Luftmotstånd</span></label>
                        <label><input type="checkbox" checked={params.ultra} onChange={(e) => setP('ultra', e.target.checked)} /><span>Ultrarapid</span></label>
                        {/* Glidare och styrknappar visas här BARA i fullskärm — i
                            normalläget finns de i sidopanelen (aldrig dubblerade). */}
                        {isFullscreen && (
                            <React.Fragment>
                                <div className="st-title mt">Reglage</div>
                                <div className="st-sliders">
                                    <StSlider label="Utkastvinkel (<em>α</em>)" value={params.angle} min={0} max={90} step={1}
                                              onChange={(v) => setP('angle', v)}
                                              valueNode={<NumInput value={params.angle} min={0} max={90} fmtFn={(x) => fmt(x, 0)} unit="°" onCommit={(v) => setP('angle', v)} />} />
                                    <StSlider label="Utgångshastighet (<em>v</em>₀)" value={params.v0} min={1} max={30} step={0.5}
                                              onChange={(v) => setP('v0', v)}
                                              valueNode={<NumInput value={params.v0} min={1} max={30} fmtFn={(x) => fmt(x, 1)} unit="m/s" onCommit={(v) => setP('v0', v)} />} />
                                    <StSlider label="Utkasthöjd (<em>h</em>)" value={params.h} min={0} max={20} step={0.1}
                                              onChange={(v) => setP('h', v)}
                                              valueNode={<NumInput value={params.h} min={0} max={20} fmtFn={(x) => fmt(x, 1)} unit="m" onCommit={(v) => setP('h', v)} />} />
                                    <StSlider label="Tyngdacceleration (<em>g</em>)" value={params.g} min={1} max={30} step={0.01}
                                              onChange={(v) => setP('g', v)}
                                              valueNode={<NumInput value={params.g} min={0.5} max={300} fmtFn={(x) => fmt(x, 2)} unit="m/s²" onCommit={(v) => setP('g', v)} />} />
                                </div>
                                <div className="st-actions">
                                    <button className="btn-toggle primary" onClick={primary}>{primaryLabel}</button>
                                    <div className="flex gap-2">
                                        <button className="btn-toggle flex-1" onClick={stepBackward} disabled={!canStep || histRef.current.length <= 1}>Stega bakåt</button>
                                        <button className="btn-toggle flex-1" onClick={stepForward} disabled={!canStep}>Stega framåt</button>
                                    </div>
                                    <button className="btn-toggle" onClick={reset}>Börja om</button>
                                </div>
                            </React.Fragment>
                        )}
                    </div>
                );
            };

            const speed = Math.hypot(snap.vx, snap.vy);
            const activeBody = BODIES.find((b) => Math.abs(b.g - params.g) < 0.005);

            return (
                <div className="min-h-screen dark-container px-4 md:px-8 pb-12" style={{ fontFamily: "'DM Sans', sans-serif" }}>
                    <div className="max-w-6xl mx-auto pt-6">
                        <div className="breadcrumb mb-4" style={{ fontSize: 13 }}>
                            <a href="index.html">Hem</a> / <a href="katalog.html#fy2">Fysik nivå 2</a> / Snett kast
                        </div>
                        <h1 className="text-3xl md:text-4xl font-black tracking-tight" style={{ color: 'var(--lab-ink)' }}>Snett kast</h1>
                        <p className="mt-2 mb-5" style={{ color: 'var(--lab-ink-soft)', maxWidth: 820 }}>
                            En tennisboll kastas med utgångshastigheten <em>v</em><sub>0</sub> i vinkeln <em>α</em> mot
                            marken och följer en <strong>kastparabel</strong>. Rörelsen delas upp i två oberoende delar:
                            i <em>x</em>-led är hastigheten <strong>konstant</strong>, i <em>y</em>-led ändras den hela tiden
                            av tyngdaccelerationen <em>g</em>. Kasta, pausa och stega bildruta för bildruta, visa
                            hastighetsvektorerna en led i taget, slå på luftmotstånd eller ta med bollen till månen.
                        </p>

                        <FormulaCard />

                        <main className="flex flex-col lg:flex-row gap-6">
                            {/* Scen */}
                            <div className="lg:w-3/5 order-1">
                                <div className={"scene-wrap" + (isFullscreen ? " is-fs" : "")} data-theme="ljusPapper" ref={sceneWrapRef}>
                                    <canvas ref={canvasRef} width={800} height={533} role="img"
                                            aria-label="En tennisboll kastas i ett snett kast på rutat papper. Röda pilar visar hastigheten i x-led och y-led, en blå pil den totala hastigheten." />
                                    <div className="scene-hint">
                                        {params.air
                                            ? 'Luftmotstånd påslaget: banan är inte längre en symmetrisk parabel.'
                                            : 'Luftmotståndet försummas. Hastigheten i x-led är konstant hela vägen.'}
                                    </div>
                                    {sceneToggles()}
                                    <button className="fs-btn" onClick={toggleFullscreen} aria-label="Fullskärm"
                                            title={isFullscreen ? 'Lämna fullskärm' : 'Fullskärm'}>
                                        {isFullscreen ? (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M9 3v6H3" /><path d="M15 21v-6h6" /><path d="M21 9h-6V3" /><path d="M3 15h6v6" />
                                            </svg>
                                        ) : (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M3 9V3h6" /><path d="M21 9V3h-6" /><path d="M3 15v6h6" /><path d="M21 15v6h-6" />
                                            </svg>
                                        )}
                                    </button>
                                </div>
                            </div>

                            {/* Kontroller */}
                            <div className="lg:w-2/5 order-2">
                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <div className="flbl mb-2">Kastet</div>
                                    <Slider label="Utkastvinkel <em>α</em>" value={params.angle} min={0} max={90} step={1} onChange={(v) => setP('angle', v)}>
                                        <NumInput value={params.angle} min={0} max={90} fmtFn={(x) => fmt(x, 0)} unit="°" onCommit={(v) => setP('angle', v)} />
                                    </Slider>
                                    <Slider label="Utgångshastighet <em>v</em>₀" value={params.v0} min={1} max={30} step={0.5} onChange={(v) => setP('v0', v)}>
                                        <NumInput value={params.v0} min={1} max={30} fmtFn={(x) => fmt(x, 1)} unit="m/s" onCommit={(v) => setP('v0', v)} />
                                    </Slider>
                                    <Slider label="Utkasthöjd <em>h</em>" value={params.h} min={0} max={20} step={0.1} onChange={(v) => setP('h', v)}>
                                        <NumInput value={params.h} min={0} max={20} fmtFn={(x) => fmt(x, 1)} unit="m" onCommit={(v) => setP('h', v)} />
                                    </Slider>
                                    <div className="flex gap-2 mt-3">
                                        <button className="btn-toggle primary flex-1 inline-flex items-center justify-center gap-2" onClick={primary}>
                                            {status === 'running' ? <IconPause /> : <IconPlay />}<span>{primaryLabel}</span>
                                        </button>
                                        <button className="btn-toggle btn-icon" onClick={stepBackward} disabled={!canStep || histRef.current.length <= 1}
                                                aria-label="Stega bakåt" title="Stega bakåt en bildruta"><IconStepBack /></button>
                                        <button className="btn-toggle btn-icon" onClick={stepForward} disabled={!canStep}
                                                aria-label="Stega framåt" title="Stega framåt en bildruta"><IconStepFwd /></button>
                                        <button className="btn-toggle" onClick={reset}>Börja om</button>
                                    </div>
                                    <p className="text-xs mt-2" style={{ color: 'var(--lab-ink-muted)' }}>
                                        Pausa kastet för att stega det en bildruta ({fmt(TIME_STEP * 1000, 0)} ms) i taget.
                                        Visningsval, luftmotstånd och ultrarapid väljs i rutan uppe till höger på scenen.
                                    </p>
                                </div>

                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <div className="flbl mb-2">Tyngdaccelerationen</div>
                                    <Slider label="Tyngdacceleration <em>g</em>" value={params.g} min={1} max={30} step={0.01} onChange={(v) => setP('g', v)}>
                                        <NumInput value={params.g} min={0.5} max={300} fmtFn={(x) => fmt(x, 2)} unit="m/s²" onCommit={(v) => setP('g', v)} />
                                    </Slider>
                                    <div className="text-xs mb-1" style={{ color: 'var(--lab-ink-muted)' }}>eller välj en himlakropp</div>
                                    <div className="body-grid">
                                        {BODIES.map((b) => (
                                            <button key={b.name} type="button"
                                                    className={"body-btn" + (activeBody && activeBody.name === b.name ? ' active' : '')}
                                                    onClick={() => setP('g', b.g)}
                                                    title={`${b.name}: ${fmt(b.g, 2)} m/s²`} aria-label={`${b.name}: ${fmt(b.g, 2)} m/s²`}>
                                                <span className="body-dot" style={{ backgroundImage: b.grad }}></span>
                                                <span>{b.name}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <div className="flbl mb-2">Avläsning</div>
                                    <div className="readout">
                                        <div><div className="rv">{fmt(snap.t)} s</div><div className="rl">tid <em>t</em></div></div>
                                        <div><div className="rv">{fmt(snap.x)} m</div><div className="rl">läge <em>x</em></div></div>
                                        <div><div className="rv">{fmt(snap.y)} m</div><div className="rl">läge <em>y</em></div></div>
                                        <div><div className="rv" style={{ color: COL.comp }}>{fmt(snap.vx)} m/s</div><div className="rl">hastighet <em>v</em><sub>x</sub></div></div>
                                        <div><div className="rv" style={{ color: COL.comp }}>{fmt(snap.vy)} m/s</div><div className="rl">hastighet <em>v</em><sub>y</sub></div></div>
                                        <div><div className="rv" style={{ color: COL.v }}>{fmt(speed)} m/s</div><div className="rl">fart <em>v</em></div></div>
                                    </div>
                                    {result && (
                                        <div className="readout mt-3 pt-3" style={{ borderTop: '1px solid var(--lab-line, rgba(15,22,32,0.14))' }}>
                                            <div><div className="rv">{fmt(result.ymax)} m</div><div className="rl">stighöjd <em>y</em><sub>max</sub></div></div>
                                            <div><div className="rv">{fmt(result.xmax)} m</div><div className="rl">kastvidd <em>x</em><sub>max</sub></div></div>
                                            <div><div className="rv">{fmt(result.tF)} s</div><div className="rl">tid i luften</div></div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </main>

                        {/* Pedagogiska sektioner */}
                        <div className="grid md:grid-cols-3 gap-4 mt-6">
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Två oberoende rörelser</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Ingen kraft verkar i <em>x</em>-led när luftmotståndet försummas, så
                                    <em> v</em><sub>x</sub> = <em>v</em><sub>0</sub>&thinsp;·&thinsp;cos&thinsp;<em>α</em> är
                                    lika stor hela vägen. I <em>y</em>-led verkar bara tyngdkraften: bollen bromsas
                                    på väg upp, står stilla i höjdled i högsta punkten och accelererar sedan nedåt,
                                    precis som vid fritt fall. Pausa kastet och stega fram bildruta för bildruta,
                                    så ser du att den röda pilen i <em>x</em>-led aldrig ändrar längd.
                                </p>
                            </div>
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Symmetrin kring högsta punkten</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Startar och slutar kastet i samma höjd är parabeln symmetrisk kring sin högsta
                                    punkt: tiden upp är lika lång som tiden ned, och bollen slår i marken med samma
                                    fart som den kastades med, fast riktad snett nedåt. Kryssa i symmetrilinjen efter
                                    nedslaget. Med luftmotstånd bryts symmetrin: bollen faller brantare än den steg.
                                </p>
                            </div>
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Vinkeln avgör kastvidden</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Kastvidden <em>x</em><sub>max</sub> = <em>v</em><sub>0</sub>²&thinsp;·&thinsp;sin&thinsp;(2<em>α</em>)&thinsp;/&thinsp;<em>g</em>
                                    är störst vid 45°, och två vinklar som ligger lika långt från 45° ger samma vidd:
                                    prova 30° och 60°. Dubblar du utgångshastigheten blir kastet fyra gånger så
                                    långt, och på månen, där <em>g</em> är en sjättedel av jordens, sex gånger så långt.
                                </p>
                            </div>
                        </div>

                        <details className="glass-card rounded-xl p-4 mt-4">
                            <summary className="accordion-head" style={{ color: 'var(--lab-ink)' }}>
                                <span>Vanliga missuppfattningar</span><span style={{ color: 'var(--lab-ink-muted)' }}>▾</span>
                            </summary>
                            <ul className="mt-3 space-y-2 text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                <li><strong>”I högsta punkten står bollen stilla.”</strong> Bara hastigheten i <em>y</em>-led är
                                    noll där. Bollen rör sig fortfarande framåt med <em>v</em><sub>x</sub>, och den totala
                                    hastigheten är som minst men inte noll. Accelerationen är dessutom lika stor som
                                    överallt annars: <em>g</em>, riktad rakt nedåt.</li>
                                <li><strong>”Bollen bromsas av tyngdkraften även i sidled.”</strong> Tyngdkraften är riktad
                                    rakt nedåt och påverkar bara rörelsen i <em>y</em>-led. Att kastet ändå tar slut beror
                                    på att bollen når marken, inte på att den saktar in i <em>x</em>-led.</li>
                                <li><strong>”Ett tyngre föremål landar tidigare.”</strong> Utan luftmotstånd följer alla
                                    föremål samma bana oavsett massa, eftersom accelerationen <em>g</em> är densamma. Det är
                                    luftmotståndet som gör att en ballong och en tennisboll får olika banor.</li>
                                <li><strong>”Formeln för kastvidd gäller alltid.”</strong> Den gäller bara när kastet startar
                                    och slutar i samma höjd. Ställ in en utkasthöjd och jämför: bollen landar längre bort
                                    än formeln säger, och då måste tiden lösas ut ur <em>y</em>-ekvationen först.</li>
                            </ul>
                        </details>
                    </div>
                </div>
