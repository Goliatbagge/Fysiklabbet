    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ─────────────────────────────────────────────────────────────────
        // Intensitet och ljudnivå (fy2-2.11), omgjord i 3D 2026-11-08.
        //
        // En rundstrålande högtalare (tolv element på en dodekaeder, den
        // sorts ljudkälla man använder i akustiklabb för att få en
        // punktformig källa) står mitt i ett rum med gallergolv. Eleven
        // drar en ljudnivåmätare på stativ runt i rummet. Sfären genom
        // mätaren visar ytan som effekten P har spridits över, och en
        // kvadrat på 1 m² vid mätaren visar vad intensiteten I betyder:
        // effekten som går genom just den kvadratmetern. Decibelstegen
        // bredvid scenen har ljudnivån L till vänster och intensiteten I
        // till höger, så att man ser att varje 10 dB är en tiodubbling.
        //
        // Beteckningar exakt som genomgången: I = P/(4π · r²),
        // L = 10 · lg(I/I₀), I₀ = 10⁻¹² W/m².
        //
        // Skala: högtalaren och mätaren ritas större än i verkligheten så
        // att de syns när sfären är 40 m bred. Gallergolvets rutor och
        // kvadraten är däremot exakt 1 m, så att avstånd och area stämmer.
        // ─────────────────────────────────────────────────────────────────

        const I0 = 1e-12;                    // hörbarhetsgränsen (W/m²)
        const LPMIN = -3, LPMAX = 2;         // effekten P på logskala: 1 mW till 100 W
        const RMIN = 1, RMAX = 20;           // avståndet r (m)
        const SRC_R = 0.8;                  // högtalarens radie i scenen (överdriven)
        const GOLV_Y = -2.2;                 // gallergolvets höjd under ljudkällans mitt
        const TVA_DX = 0.86;                 // två källor: var och en så här långt från mitten (vid full storlek)

        const COL = {
            ink:    '#0f1620',
            muted:  '#5a6170',
            src:    '#c0392b',   // ljudkällan och energin (röd, som teorifiguren)
            rpil:   '#2563c9',   // avståndet r (blå, som teorifiguren)
            sfar:   '#3e6ea8',   // sfären med arean 4π · r²
            kvad:   '#d9701a',   // kvadratmetern vid mätaren
            accent: '#c8324a',
        };

        // ── Talformatering (komma, noll utan decimaler, NBSP i tusental) ──
        const fmt = (num, decimals = 1) => {
            if (!isFinite(num)) return '–';
            const s = num.toFixed(decimals);
            if (parseFloat(s) === 0) return '0';
            return s.replace('.', ',').replace('-', '−');
        };
        const fmtNum = (n, d) => {
            const s = n.toFixed(d);
            if (parseFloat(s) === 0) return '0';
            const [intp, frac] = s.split('.');
            const withSpaces = intp.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
            return frac !== undefined ? withSpaces + ',' + frac : withSpaces;
        };
        // tre värdesiffror med lämpligt prefix
        const fmtI = (I) => {
            const pick = (val, unit) => `${fmt(val, val < 10 ? 2 : val < 100 ? 1 : 0)} ${unit}`;
            if (I >= 1) return pick(I, 'W/m²');
            if (I >= 1e-3) return pick(I * 1e3, 'mW/m²');
            if (I >= 1e-6) return pick(I * 1e6, 'µW/m²');
            if (I >= 1e-9) return pick(I * 1e9, 'nW/m²');
            return pick(I * 1e12, 'pW/m²');
        };
        const fmtP = (P) => P >= 0.1 ? `${fmt(P, P < 1 ? 2 : P < 10 ? 1 : 0)} W` : `${fmt(P * 1e3, P * 1e3 < 10 ? 1 : 0)} mW`;
        const fmtR = (r) => `${fmt(r, Math.abs(r - Math.round(r)) < 0.05 ? 0 : 1)} m`;
        const fmtL = (L) => `${fmt(L, 1)} dB`;
        // kvot med två värdesiffror (0,25 / 4,0 / 100)
        const fmtKvot = (k) => {
            if (k >= 100) return fmtNum(k, 0);
            const s = parseFloat(k.toPrecision(2));
            const dec = s >= 10 ? 0 : s >= 1 ? 1 : Math.max(0, 1 - Math.floor(Math.log10(s)));
            return fmt(s, dec);
        };

        // Exakt enligt genomgången. Två likadana källor tätt intill varandra:
        // intensiteterna adderas, I = 2 · P/(4π · r²).
        const berakna = (P, r, tva) => {
            const A = 4 * Math.PI * r * r;
            const I = (tva ? 2 : 1) * P / A;
            const L = 10 * Math.log10(I / I0);
            return { A, I, L };
        };
        const avrundaP = (logP) => parseFloat(Math.pow(10, logP).toPrecision(2));

        // ── Energiprickarna. Varje prick bär energin Q, så att prickar per
        //    sekund = P/Q och fler watt ger fler prickar. Effekten spänner
        //    över fem tiopotenser, så Q väljs ur serien 1, 2, 5, 10 … och byts
        //    bara när antalet prickar annars blir för litet eller för stort
        //    (som skalan på en karta). Inom ett skalläge är antalet alltså
        //    proportionellt mot P: dubbla effekten ger dubbelt så många. ──
        const PRICK_DMAX = RMAX * 1.04, PRICK_FART = 4.5;
        const PRICK_LIV = PRICK_DMAX / PRICK_FART;     // s från källan till ytterkanten
        const PRICK_MAX = 12000, PRICK_MIN = 500, PRICK_MAL = 1200;
        const snyggQ = (x) => {
            const e = Math.floor(Math.log10(x)), m = x / Math.pow(10, e);
            const f = m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10;
            return parseFloat((f * Math.pow(10, e)).toPrecision(1));
        };
        const valjQ = (P) => snyggQ(P * PRICK_LIV / PRICK_MAL);
        const fmtE = (Q) => {
            const v = (x, u) => `${fmt(x, 0)} ${u}`;
            if (Q >= 1) return v(Q, 'J');
            if (Q >= 1e-3) return v(Q * 1e3, 'mJ');
            if (Q >= 1e-6) return v(Q * 1e6, 'µJ');
            return v(Q * 1e9, 'nJ');
        };

        // Delat läge mellan React och 3D-scenen (scenen byggs bara en gång)
        const SIM = {
            p: { P: 5, Q: 0.05, r: 10, ang: 1.5, tva: false, L: 96, show: { sfar: true, kvad: true, energi: true, etik: false } },
            cb: {},
            vy: null,
        };

        // ─────────────────────────────────────────────────────────────────
        // Grafikhjälp
        // ─────────────────────────────────────────────────────────────────
        const linjar = (hex) => new THREE.Color(hex).convertSRGBToLinear();
        function canvasTex(w, h, rita) {
            const c = document.createElement('canvas');
            c.width = w; c.height = h;
            rita(c.getContext('2d'), w, h);
            const t = new THREE.CanvasTexture(c);
            t.encoding = THREE.sRGBEncoding;
            t.anisotropy = 8;
            return t;
        }

        // Etikett som går att skriva om: parts = [{ t, color, italic, sup, small, weight }]
        function etikett() {
            const c = document.createElement('canvas');
            const ctx = c.getContext('2d');
            const tex = new THREE.CanvasTexture(c);
            tex.minFilter = THREE.LinearFilter;
            tex.encoding = THREE.sRGBEncoding;
            const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false, toneMapped: false }));
            spr.renderOrder = 20;
            let nyckel = '';
            const FS = 64, PAD = 14;
            const font = (p) => `${p.italic ? 'italic ' : ''}${p.weight || 600} ${p.small || p.sup ? FS * 0.66 : FS}px Poppins, sans-serif`;
            spr.userData.aspect = 1;
            spr.userData.satt = (parts) => {
                const k = JSON.stringify(parts);
                if (k === nyckel) return;
                nyckel = k;
                let w = 0;
                parts.forEach((p) => { ctx.font = font(p); w += ctx.measureText(p.t).width; });
                c.width = Math.max(2, Math.ceil(w) + PAD * 2);
                c.height = FS + PAD * 2;
                ctx.clearRect(0, 0, c.width, c.height);
                let x = PAD;
                parts.forEach((p) => {
                    ctx.font = font(p);
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = p.color || COL.ink;
                    ctx.fillText(p.t, x, c.height / 2 + 3 + (p.sup ? -FS * 0.26 : 0));
                    x += ctx.measureText(p.t).width;
                });
                tex.dispose();
                tex.image = c;
                tex.needsUpdate = true;
                spr.userData.aspect = c.width / c.height;
            };
            return spr;
        }

        // Pil med skaft (cylinder, rak ände) och spets; skaftet slutar vid spetsens bas
        const Y_AXEL = new THREE.Vector3(0, 1, 0);
        const markMat = (hex) => new THREE.MeshStandardMaterial({
            color: linjar(hex), emissive: linjar(hex).multiplyScalar(0.55),
            roughness: 0.55, metalness: 0, toneMapped: false });
        function pil(color) {
            const g = new THREE.Group();
            const mat = markMat(color);
            const skaft = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 1, 14), mat);
            const spets = new THREE.Mesh(new THREE.ConeGeometry(1, 1, 18), mat);
            g.add(skaft, spets);
            g.userData = { skaft, spets };
            return g;
        }
        function stallPil(g, from, vec, r) {
            const len = vec.length();
            if (len < 1e-6) { g.visible = false; return; }
            g.visible = true;
            const head = Math.min(r * 6.5, len * 0.5);
            const shaft = len - head;
            g.position.copy(from);
            g.quaternion.setFromUnitVectors(Y_AXEL, vec.clone().normalize());
            const { skaft, spets } = g.userData;
            skaft.scale.set(r, Math.max(shaft, 1e-4), r);
            skaft.position.set(0, shaft / 2, 0);
            spets.scale.set(r * 2.6, head, r * 2.6);
            spets.position.set(0, shaft + head / 2, 0);
        }

        // Gallergolvet: rutor på 1 m, var femte linje kraftigare, tonar ut åt kanterna
        function golvTextur(storlek) {
            return canvasTex(2048, 2048, (ctx, w, h) => {
                const px = w / storlek;
                for (let i = 0; i <= storlek; i++) {
                    const fem = i % 5 === 0;
                    ctx.strokeStyle = fem ? 'rgba(52,62,78,0.34)' : 'rgba(52,62,78,0.17)';
                    ctx.lineWidth = fem ? 3.4 : 1.8;
                    ctx.beginPath(); ctx.moveTo(i * px, 0); ctx.lineTo(i * px, h); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(0, i * px); ctx.lineTo(w, i * px); ctx.stroke();
                }
                ctx.globalCompositeOperation = 'destination-in';
                const g = ctx.createRadialGradient(w / 2, h / 2, w * 0.12, w / 2, h / 2, w / 2);
                g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(0.7, 'rgba(0,0,0,0.75)'); g.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
            });
        }
        // Mjuk omgivning att spegla metallen i
        function omgivning(renderer) {
            const tex = canvasTex(1024, 512, (ctx, w, h) => {
                const g = ctx.createLinearGradient(0, 0, 0, h);
                g.addColorStop(0, '#fbf8f2'); g.addColorStop(0.5, '#efe7d8'); g.addColorStop(1, '#8b7a64');
                ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
                ctx.fillStyle = 'rgba(255,255,255,0.95)';
                ctx.fillRect(w * 0.12, h * 0.12, w * 0.16, h * 0.2);
                ctx.fillRect(w * 0.6, h * 0.08, w * 0.22, h * 0.14);
            });
            tex.mapping = THREE.EquirectangularReflectionMapping;
            const pm = new THREE.PMREMGenerator(renderer);
            const env = pm.fromEquirectangular(tex).texture;
            pm.dispose();
            return env;
        }
        // Ljudnivåmätarens display (LCD)
        function lcdTextur() {
            const c = document.createElement('canvas');
            c.width = 512; c.height = 200;
            const tex = new THREE.CanvasTexture(c);
            tex.encoding = THREE.sRGBEncoding;
            tex.anisotropy = 8;
            let senast = '';
            tex.userData = {
                satt: (txt) => {
                    if (txt === senast) return;
                    senast = txt;
                    const ctx = c.getContext('2d');
                    const g = ctx.createLinearGradient(0, 0, 0, c.height);
                    g.addColorStop(0, '#cdd8bf'); g.addColorStop(1, '#b7c4a6');
                    ctx.fillStyle = g; ctx.fillRect(0, 0, c.width, c.height);
                    ctx.fillStyle = '#1d2a1c';
                    ctx.textBaseline = 'middle';
                    ctx.font = '700 118px "JetBrains Mono", monospace';
                    ctx.textAlign = 'right';
                    ctx.fillText(txt, c.width - 130, c.height / 2 + 8);
                    ctx.font = '600 52px Poppins, sans-serif';
                    ctx.textAlign = 'left';
                    ctx.fillText('dB', c.width - 112, c.height / 2 + 26);
                    ctx.font = '600 30px Poppins, sans-serif';
                    ctx.fillStyle = 'rgba(29,42,28,0.7)';
                    ctx.fillText('LAeq', 22, 32);
                    tex.needsUpdate = true;
                },
            };
            return tex;
        }
        // Rund prick till energipartiklarna
        function prickTextur() {
            return canvasTex(64, 64, (ctx, w, h) => {
                const g = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
                g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.55, 'rgba(255,255,255,1)'); g.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
            });
        }

        // ── Den rundstrålande högtalaren: dodekaeder med ett element på varje sida ──
        function hogtalare(env) {
            const g = new THREE.Group();
            const huvud = new THREE.Group();
            g.add(huvud);
            g.userData.huvud = huvud;
            const R = SRC_R;
            const kroppMat = new THREE.MeshStandardMaterial({ color: linjar('#2f343c'), roughness: 0.5, metalness: 0.25, envMap: env, envMapIntensity: 0.6, flatShading: true });
            const geo = new THREE.DodecahedronGeometry(R, 0);
            const kropp = new THREE.Mesh(geo, kroppMat);
            kropp.castShadow = true;
            huvud.add(kropp);
            const kanter = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: linjar('#8a929e'), transparent: true, opacity: 0.55 }));
            huvud.add(kanter);
            // sidornas normaler: gruppera trianglarnas normaler
            const pos = geo.attributes.position;
            const normaler = [];
            const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
            for (let i = 0; i < pos.count; i += 3) {
                a.fromBufferAttribute(pos, i); b.fromBufferAttribute(pos, i + 1); c.fromBufferAttribute(pos, i + 2);
                const n = new THREE.Vector3().subVectors(c, b).cross(new THREE.Vector3().subVectors(a, b)).normalize();
                if (n.dot(a) < 0) n.negate();
                if (!normaler.some(m => m.dot(n) > 0.99)) normaler.push(n);
            }
            const ri = R * 0.7947;
            const ringMat = new THREE.MeshStandardMaterial({ color: linjar('#15181c'), roughness: 0.85 });
            const konMat = new THREE.MeshStandardMaterial({ color: linjar('#4a515c'), roughness: 0.6, metalness: 0.2, side: THREE.DoubleSide });
            const kapMat = new THREE.MeshStandardMaterial({ color: linjar('#9aa3ad'), roughness: 0.3, metalness: 0.8, envMap: env });
            normaler.forEach((n) => {
                const d = new THREE.Group();
                const kon = new THREE.Mesh(new THREE.CylinderGeometry(R * 0.33, R * 0.12, R * 0.07, 32, 1, true), konMat);
                kon.position.y = R * 0.035;
                const ring = new THREE.Mesh(new THREE.TorusGeometry(R * 0.34, R * 0.035, 10, 40), ringMat);
                ring.rotation.x = Math.PI / 2;
                ring.position.y = R * 0.045;
                const kap = new THREE.Mesh(new THREE.SphereGeometry(R * 0.1, 18, 8, 0, Math.PI * 2, 0, Math.PI / 2), kapMat);
                kap.position.y = R * 0.0;
                d.add(kon, ring, kap);
                d.quaternion.setFromUnitVectors(Y_AXEL, n);
                d.position.copy(n).multiplyScalar(ri + 0.002);
                huvud.add(d);
            });
            // stativ ned till golvet
            const metall = new THREE.MeshStandardMaterial({ color: linjar('#b9bec5'), roughness: 0.3, metalness: 0.9, envMap: env });
            const stav = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, -GOLV_Y - 0.25, 16), metall);
            stav.position.y = (GOLV_Y - 0.25) / 2;
            stav.castShadow = true;
            g.add(stav);
            g.add(tripod(metall, 0.62, 0.0));
            return g;
        }
        // Tre ben från en nav på stativstången ned till golvet
        function tripod(mat, spann, x0) {
            const t = new THREE.Group();
            const navY = GOLV_Y + 0.75;
            const nav = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.12, 16), mat);
            nav.position.set(x0, navY, 0);
            t.add(nav);
            for (let k = 0; k < 3; k++) {
                const v = k * 2 * Math.PI / 3 + 0.4;
                const fot = new THREE.Vector3(x0 + spann * Math.cos(v), GOLV_Y, spann * Math.sin(v));
                const topp = new THREE.Vector3(x0, navY, 0);
                const dir = new THREE.Vector3().subVectors(fot, topp);
                const ben = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, dir.length(), 10), mat);
                ben.position.copy(topp).addScaledVector(dir, 0.5);
                ben.quaternion.setFromUnitVectors(Y_AXEL, dir.clone().normalize());
                ben.castShadow = true;
                t.add(ben);
                const sko = new THREE.Mesh(new THREE.SphereGeometry(0.04, 10, 8), new THREE.MeshStandardMaterial({ color: linjar('#1d2025'), roughness: 0.9 }));
                sko.position.copy(fot);
                t.add(sko);
            }
            return t;
        }
        // ── Ljudnivåmätaren på stativ. Origo = mikrofonens mitt (där mätningen görs),
        //    kroppen sträcker sig längs lokal +x, bort från ljudkällan. ──
        function matare(env, lcd) {
            const g = new THREE.Group();
            const S = 3.4;   // överdriven storlek, så att mätaren syns på 20 m
            const skum = new THREE.Mesh(new THREE.SphereGeometry(0.075 * S, 28, 20),
                new THREE.MeshStandardMaterial({ color: linjar('#3c4148'), roughness: 1 }));
            g.add(skum);
            const hals = new THREE.Mesh(new THREE.CylinderGeometry(0.022 * S, 0.034 * S, 0.2 * S, 20),
                new THREE.MeshStandardMaterial({ color: linjar('#c3c8ce'), roughness: 0.25, metalness: 0.9, envMap: env }));
            hals.rotation.z = -Math.PI / 2;
            hals.position.x = 0.15 * S;
            g.add(hals);
            const kroppMat = new THREE.MeshStandardMaterial({ color: linjar('#e3b23c'), roughness: 0.45, metalness: 0.05, envMap: env, envMapIntensity: 0.4 });
            const kropp = new THREE.Mesh(new THREE.BoxGeometry(0.44 * S, 0.07 * S, 0.15 * S), kroppMat);
            kropp.position.x = 0.47 * S;
            kropp.castShadow = true;
            g.add(kropp);
            const ram = new THREE.Mesh(new THREE.BoxGeometry(0.3 * S, 0.012 * S, 0.12 * S),
                new THREE.MeshStandardMaterial({ color: linjar('#23272d'), roughness: 0.6 }));
            ram.position.set(0.43 * S, 0.04 * S, 0);
            g.add(ram);
            const skarm = new THREE.Mesh(new THREE.PlaneGeometry(0.26 * S, 0.1 * S),
                new THREE.MeshBasicMaterial({ map: lcd, toneMapped: false }));
            // displayen ligger på ovansidan, texten löper längs kroppen
            skarm.rotation.set(-Math.PI / 2, 0, Math.PI);
            skarm.position.set(0.43 * S, 0.0465 * S, 0);
            g.add(skarm);
            [-0.035, 0.035].forEach((z) => {
                const knapp = new THREE.Mesh(new THREE.CylinderGeometry(0.013 * S, 0.013 * S, 0.012 * S, 14),
                    new THREE.MeshStandardMaterial({ color: linjar('#2a2e34'), roughness: 0.6 }));
                knapp.position.set(0.64 * S, 0.04 * S, z * S);
                g.add(knapp);
            });
            const metall = new THREE.MeshStandardMaterial({ color: linjar('#b9bec5'), roughness: 0.3, metalness: 0.9, envMap: env });
            const fx = 0.5 * S;
            const stav = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, -GOLV_Y - 0.06 * S, 14), metall);
            stav.position.set(fx, (GOLV_Y - 0.06 * S) / 2, 0);
            stav.castShadow = true;
            g.add(stav);
            g.add(tripod(metall, 0.45, fx));
            // osynlig, generös träffyta för att ta tag i mätaren
            const greppa = new THREE.Mesh(new THREE.BoxGeometry(1.25 * S, 0.6, 0.7), new THREE.MeshBasicMaterial({ visible: false }));
            greppa.position.x = 0.4 * S;
            g.add(greppa);
            g.userData.greppbara = [greppa, skum, kropp, stav];
            return g;
        }
        // Sfärens latitud- och longitudlinjer (enhetssfär, skalas med r)
        function sfarLinjer() {
            const p = [];
            const N = 96;
            for (let m = 0; m < 12; m++) {
                const f = m * Math.PI / 6;
                for (let i = 0; i < N; i++) {
                    const t0 = i * Math.PI / N, t1 = (i + 1) * Math.PI / N;
                    p.push(Math.sin(t0) * Math.cos(f), Math.cos(t0), Math.sin(t0) * Math.sin(f));
                    p.push(Math.sin(t1) * Math.cos(f), Math.cos(t1), Math.sin(t1) * Math.sin(f));
                }
            }
            for (let k = 1; k < 8; k++) {
                const t = k * Math.PI / 8;
                for (let i = 0; i < N * 2; i++) {
                    const f0 = i * Math.PI / N, f1 = (i + 1) * Math.PI / N;
                    p.push(Math.sin(t) * Math.cos(f0), Math.cos(t), Math.sin(t) * Math.sin(f0));
                    p.push(Math.sin(t) * Math.cos(f1), Math.cos(t), Math.sin(t) * Math.sin(f1));
                }
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
            return geo;
        }

        const VYER = {
            snett: { theta: 0.62, phi: 1.12 },
            sidan: { theta: 0.0,  phi: 1.5 },
            ovan:  { theta: 0.0,  phi: 0.04 },
        };

        // ─────────────────────────────────────────────────────────────────
        // 3D-scenen
        // ─────────────────────────────────────────────────────────────────
        function LjudScene({ wrapRef }) {
            const mountRef = useRef(null);
            useEffect(() => {
                const wrap = wrapRef.current;
                const el = mountRef.current;
                const W = () => el.clientWidth, H = () => el.clientHeight;

                const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

                renderer.outputEncoding = THREE.sRGBEncoding;
                renderer.toneMapping = THREE.ACESFilmicToneMapping;
                renderer.toneMappingExposure = 1.05;
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                el.appendChild(renderer.domElement);

                const scene = new THREE.Scene();
                const env = omgivning(renderer);
                const camera = new THREE.PerspectiveCamera(34, W() / H(), 0.1, 400);

                scene.add(new THREE.HemisphereLight(0xfffaf0, 0x9a8a72, 0.75));

                sol.shadow.bias = -0.0005;
                sol.shadow.radius = 3;
                scene.add(sol);
                const fyll = new THREE.DirectionalLight(0xdfe8ff, 0.4);
                fyll.position.set(-14, 8, -6);
                scene.add(fyll);

                // ── Gallergolvet (genomsiktligt, så att hela sfären syns) ──
                const GOLV = 90;
                const golv = new THREE.Mesh(new THREE.PlaneGeometry(GOLV, GOLV),
                    new THREE.MeshBasicMaterial({ map: golvTextur(GOLV), transparent: true, depthWrite: false, toneMapped: false }));
                golv.rotation.x = -Math.PI / 2;
                golv.position.y = GOLV_Y;
                golv.renderOrder = 1;
                scene.add(golv);
                const skugga = new THREE.Mesh(new THREE.PlaneGeometry(GOLV, GOLV), new THREE.ShadowMaterial({ opacity: 0.16, depthWrite: false }));
                skugga.rotation.x = -Math.PI / 2;
                skugga.position.y = GOLV_Y + 0.005;
                skugga.receiveShadow = true;
                scene.add(skugga);

                // ── Ljudkällorna ──
                const kalla1 = hogtalare(env);
                const kalla2 = hogtalare(env);
                scene.add(kalla1, kalla2);

                // ── Sfären med radien r ──
                const sfarG = new THREE.Group();
                const sfarYta = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 32),
                    new THREE.MeshBasicMaterial({ color: linjar(COL.sfar), transparent: true, opacity: 0.07, side: THREE.DoubleSide, depthWrite: false, toneMapped: false }));
                const sfarNat = new THREE.LineSegments(sfarLinjer(),
                    new THREE.LineBasicMaterial({ color: linjar(COL.sfar), transparent: true, opacity: 0.38, depthWrite: false, toneMapped: false }));
                sfarYta.renderOrder = 2; sfarNat.renderOrder = 3;
                sfarG.add(sfarYta, sfarNat);
                scene.add(sfarG);

                // ── Kvadratmetern vid mätaren + strålarna från källan till dess hörn ──
                const kvadG = new THREE.Group();
                const kvadYta = new THREE.Mesh(new THREE.PlaneGeometry(1, 1),
                    new THREE.MeshBasicMaterial({ color: linjar(COL.kvad), transparent: true, opacity: 0.42, side: THREE.DoubleSide, depthWrite: false, toneMapped: false }));
                const kvadKant = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(-0.5, -0.5, 0), new THREE.Vector3(0.5, -0.5, 0), new THREE.Vector3(0.5, 0.5, 0), new THREE.Vector3(-0.5, 0.5, 0)]),
                    new THREE.LineBasicMaterial({ color: linjar(COL.kvad), toneMapped: false }));
                kvadYta.renderOrder = 4; kvadKant.renderOrder = 5;
                kvadG.add(kvadYta, kvadKant);
                scene.add(kvadG);
                const stralGeo = new THREE.BufferGeometry();
                stralGeo.setAttribute('position', new THREE.Float32BufferAttribute(new Array(24).fill(0), 3));
                const stralar = new THREE.LineSegments(stralGeo,
                    new THREE.LineBasicMaterial({ color: linjar(COL.kvad), transparent: true, opacity: 0.55, depthWrite: false, toneMapped: false }));
                stralar.renderOrder = 4;
                scene.add(stralar);

                // ── Mätaren ──
                const lcd = lcdTextur();
                const matG = matare(env, lcd);
                scene.add(matG);

                // ── Avståndspilen r ──
                const rPil = pil(COL.rpil);
                scene.add(rPil);

                // ── Energin som sprids: prickar som flyger rakt ut åt alla håll ──
                const NP = PRICK_MAX, DMAX = PRICK_DMAX, FART = PRICK_FART;
                const riktn = new Float32Array(NP * 3), fas = new Float32Array(NP);
                for (let i = 0; i < NP; i++) {
                    const z = Math.random() * 2 - 1, f = Math.random() * Math.PI * 2, s = Math.sqrt(1 - z * z);
                    riktn[i * 3] = s * Math.cos(f); riktn[i * 3 + 1] = z; riktn[i * 3 + 2] = s * Math.sin(f);
                    fas[i] = Math.random();
                }
                const prickMat = new THREE.PointsMaterial({ color: linjar(COL.src), size: 0.2, map: prickTextur(), transparent: true, alphaTest: 0.4, depthWrite: false, toneMapped: false });
                const gorPrickar = () => {
                    const geo = new THREE.BufferGeometry();
                    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(NP * 3), 3));
                    const pts = new THREE.Points(geo, prickMat);
                    pts.frustumCulled = false;
                    pts.renderOrder = 6;
                    scene.add(pts);
                    return pts;
                };
                const prickar1 = gorPrickar(), prickar2 = gorPrickar();
                // vilka prickar som är utsända: avgörs varje gång en prick
                // lämnar källan, så att en ändrad effekt sprider sig utåt
                prickar1.userData = { aktiv: new Uint8Array(NP), varv: new Int32Array(NP).fill(-1) };
                prickar2.userData = { aktiv: new Uint8Array(NP), varv: new Int32Array(NP).fill(-1) };
                let ritadQ = null;

                // ── Etiketter ──
                const lblP = etikett(), lblR = etikett(), lblKv = etikett(), lblA = etikett(), lblL = etikett(), lblQ = etikett();
                scene.add(lblP, lblR, lblKv, lblA, lblL, lblQ);

                // ── Kamera: vrid, zooma, förinställda vyer ──
                const cam = { theta: VYER.snett.theta, phi: VYER.snett.phi, zoom: 1, radius: 40 };
                let camMal = null;
                SIM.vy = (namn) => {
                    const v = VYER[namn];
                    const d = ((v.theta - cam.theta) % (2 * Math.PI) + 3 * Math.PI) % (2 * Math.PI) - Math.PI;
                    camMal = { theta: cam.theta + d, phi: v.phi };
                };
                const target = new THREE.Vector3(0, -0.4, 0);
                const radieFor = (r) => (r * 3.9 + 6) * cam.zoom;
                cam.radius = radieFor(SIM.p.r);
                const uppdateraKamera = () => {
                    const sp = Math.sin(cam.phi);
                    camera.position.set(
                        target.x + cam.radius * sp * Math.sin(cam.theta),
                        target.y + cam.radius * Math.cos(cam.phi),
                        target.z + cam.radius * sp * Math.cos(cam.theta));
                    camera.up.set(0, 1, 0);
                    if (cam.phi < 0.1) camera.up.set(-Math.sin(cam.theta), 0, -Math.cos(cam.theta));
                    camera.lookAt(target);
                };

                // ── Pekare: dra i mätaren = flytta den, dra i tomma ytan = vrid ──
                const ray = new THREE.Raycaster();
                const ndc = new THREE.Vector2();
                const plan = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
                const pt = new THREE.Vector3();
                const satt = (e) => {
                    const r = el.getBoundingClientRect();
                    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
                    ray.setFromCamera(ndc, camera);
                };
                const paMatare = (e) => { satt(e); return ray.intersectObjects(matG.userData.greppbara, false).length > 0; };
                const pekare = new Map();
                let drag = null, pinch = null, flytt = false;
                const onDown = (e) => {
                    if (e.target !== renderer.domElement) return;
                    pekare.set(e.pointerId, { x: e.clientX, y: e.clientY });
                    renderer.domElement.setPointerCapture(e.pointerId);
                    if (pekare.size === 1) {
                        flytt = paMatare(e);
                        drag = { x: e.clientX, y: e.clientY };
                        wrap.classList.add(flytt ? 'flytta' : 'dragging');
                    }
                    if (pekare.size === 2) {
                        const [a, b] = [...pekare.values()];
                        pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: cam.zoom };
                        drag = null; flytt = false;
                    }
                    camMal = null;
                };
                const onMove = (e) => {
                    if (pekare.has(e.pointerId)) pekare.set(e.pointerId, { x: e.clientX, y: e.clientY });
                    if (pinch && pekare.size === 2) {
                        const [a, b] = [...pekare.values()];
                        const d = Math.hypot(a.x - b.x, a.y - b.y);
                        cam.zoom = Math.max(0.35, Math.min(2.2, pinch.z * pinch.d / Math.max(d, 1)));
                        return;
                    }
                    if (drag && flytt) {
                        satt(e);
                        if (ray.ray.intersectPlane(plan, pt)) {
                            const r = Math.max(RMIN, Math.min(RMAX, Math.round(Math.hypot(pt.x, pt.z) * 10) / 10));
                            if (SIM.cb.flytta) SIM.cb.flytta(r, Math.atan2(pt.z, pt.x));
                        }
                        return;
                    }
                    if (drag) {
                        const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
                        drag.x = e.clientX; drag.y = e.clientY;
                        cam.theta -= dx * 0.008;
                        cam.phi = Math.max(0.04, Math.min(1.55, cam.phi - dy * 0.006));
                        return;
                    }
                    if (e.pointerType === 'mouse' && e.target === renderer.domElement) {
                        const pa = paMatare(e);
                        wrap.classList.toggle('flytta', pa);
                        wrap.classList.toggle('grab', !pa);
                    }
                };
                const onUp = (e) => {
                    pekare.delete(e.pointerId);
                    if (pekare.size < 2) pinch = null;
                    if (pekare.size === 0) { drag = null; flytt = false; }
                    wrap.classList.remove('dragging', 'flytta');
                };
                const onWheel = (e) => {
                    e.preventDefault();
                    cam.zoom = Math.max(0.35, Math.min(2.2, cam.zoom * Math.exp(e.deltaY * 0.0012)));
                };
                el.addEventListener('pointerdown', onDown);
                window.addEventListener('pointermove', onMove);
                window.addEventListener('pointerup', onUp);
                window.addEventListener('pointercancel', onUp);
                el.addEventListener('wheel', onWheel, { passive: false });
                wrap.classList.add('grab');

                const ro = new ResizeObserver(() => {
                    renderer.setSize(W(), H());
                    camera.aspect = W() / H();
                    // bred ruta: flytta bilden lite åt vänster, bort från inställningsrutan
                    if (W() > 600) camera.setViewOffset(W(), H(), Math.round(W() * 0.05), 0, W(), H());
                    else camera.clearViewOffset();
                    // stående ruta: vidare synfält så att hela sfären ryms på bredden
                    camera.fov = camera.aspect < 1 ? 34 / Math.max(camera.aspect, 0.55) : 34;
                    camera.updateProjectionMatrix();
                });
                ro.observe(el);

                let synlig = true;
                const io = new IntersectionObserver((en) => { synlig = en[0].isIntersecting; }, { threshold: 0.01 });
                io.observe(wrap);

                // ── Animation ──
                let t = 0, tLast = performance.now(), raf = 0, pRad = SRC_R * 0.9;
                const u = new THREE.Vector3(), tmp = new THREE.Vector3();
                const kc1 = new THREE.Vector3(), kc2 = new THREE.Vector3();
                const etikettH = (spr, h) => spr.scale.set(h * spr.userData.aspect, h, 1);
                const flyttaPrickar = (pts, c, r, syns, andel, nyttQ) => {
                    pts.visible = syns;
                    const { aktiv, varv } = pts.userData;
                    const a = pts.geometry.attributes.position.array;
                    for (let i = 0; i < NP; i++) {
                        const x = t * FART / DMAX + fas[i];
                        const v = Math.floor(x);
                        if (v !== varv[i] || nyttQ) { aktiv[i] = Math.random() < andel ? 1 : 0; varv[i] = v; }
                        if (!syns) continue;
                        const d = (x - v) * DMAX;
                        if (!aktiv[i] || d > r || d < pRad) { a[i * 3] = 0; a[i * 3 + 1] = -999; a[i * 3 + 2] = 0; continue; }
                        a[i * 3] = c.x + riktn[i * 3] * d;
                        a[i * 3 + 1] = c.y + riktn[i * 3 + 1] * d;
                        a[i * 3 + 2] = c.z + riktn[i * 3 + 2] * d;
                    }
                    pts.geometry.attributes.position.needsUpdate = true;
                };

                const tick = () => {
                    raf = requestAnimationFrame(tick);
                    const now = performance.now();
                    const dt = Math.min(0.05, (now - tLast) / 1000);
                    tLast = now;
                    if (!synlig) return;
                    t += dt;
                    const p = SIM.p, sh = p.show;
                    const r = p.r;

                    // källorna: en i mitten, eller två tätt intill varandra
                    const vinkelratt = new THREE.Vector3(-Math.sin(p.ang), 0, Math.cos(p.ang));
                    // nära källan krymps högtalaren, så att den ryms i en sfär på 1 m
                    const ks = Math.min(1, 0.3 + 0.22 * r);
                    kalla1.userData.huvud.scale.setScalar(ks); kalla2.userData.huvud.scale.setScalar(ks);
                    pRad = SRC_R * ks * 0.9;
                    kc1.set(0, 0, 0); kc2.set(0, 0, 0);
                    if (p.tva) { kc1.addScaledVector(vinkelratt, TVA_DX * ks); kc2.addScaledVector(vinkelratt, -TVA_DX * ks); }
                    kalla1.position.copy(kc1);
                    kalla2.position.copy(kc2);
                    kalla2.visible = p.tva;

                    // mätaren på avståndet r från mitten
                    u.set(Math.cos(p.ang), 0, Math.sin(p.ang));
                    matG.position.copy(u).multiplyScalar(r);
                    matG.rotation.set(0, -p.ang, 0);
                    lcd.userData.satt(fmt(p.L, 1));

                    sfarG.visible = sh.sfar;
                    sfarG.scale.setScalar(r);

                    kvadG.visible = sh.kvad;
                    stralar.visible = sh.kvad;
                    kvadG.position.copy(u).multiplyScalar(r);
                    kvadG.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), u);
                    if (sh.kvad) {
                        const a = stralGeo.attributes.position.array;
                        [[-0.5, -0.5], [0.5, -0.5], [0.5, 0.5], [-0.5, 0.5]].forEach(([x, y], k) => {
                            tmp.set(x, y, 0).applyQuaternion(kvadG.quaternion).add(kvadG.position);
                            a[k * 6] = 0; a[k * 6 + 1] = 0; a[k * 6 + 2] = 0;
                            a[k * 6 + 3] = tmp.x; a[k * 6 + 4] = tmp.y; a[k * 6 + 5] = tmp.z;
                        });
                        stralGeo.attributes.position.needsUpdate = true;
                    }

                    // r-pilen från mitten till mikrofonen
                    stallPil(rPil, new THREE.Vector3(0, 0, 0), u.clone().multiplyScalar(Math.max(0.05, r - 0.13)), 0.035 + r * 0.0025);

                    // antal prickar i luften från varje källa: P/Q · PRICK_LIV
                    const nyttQ = ritadQ !== p.Q;
                    ritadQ = p.Q;
                    const andel = Math.min(1, p.P / p.Q * PRICK_LIV / NP);
                    flyttaPrickar(prickar1, kc1, r, sh.energi, andel, nyttQ);
                    flyttaPrickar(prickar2, kc2, r, sh.energi && p.tva, andel, nyttQ);
                    prickMat.size = 0.22 + r * 0.022;

                    // kamera
                    if (camMal) {
                        const k = Math.min(1, dt * 5);
                        cam.theta += (camMal.theta - cam.theta) * k;
                        cam.phi += (camMal.phi - cam.phi) * k;
                        if (Math.abs(camMal.phi - cam.phi) < 1e-3 && Math.abs(camMal.theta - cam.theta) < 1e-3) camMal = null;
                    }
                    cam.radius += (radieFor(r) - cam.radius) * Math.min(1, dt * 4);
                    uppdateraKamera();

                    // etiketter: konstant storlek på skärmen
                    const h = cam.radius * 0.03 * Math.tan(camera.fov * Math.PI / 360) / Math.tan(17 * Math.PI / 180);
                    [lblP, lblR, lblKv, lblA, lblL].forEach(s => { s.visible = sh.etik; });
                    lblP.userData.satt(p.tva
                        ? [{ t: '2 · ', color: COL.src }, { t: 'P', italic: true, color: COL.src }, { t: ' = 2 · ' + fmtP(p.P), color: COL.src }]
                        : [{ t: 'P', italic: true, color: COL.src }, { t: ' = ' + fmtP(p.P), color: COL.src }]);
                    lblP.position.set(0, SRC_R * ks + h * 1.15, 0);
                    lblQ.visible = sh.etik && sh.energi;
                    lblQ.userData.satt([{ t: '1 prick = ' + fmtE(p.Q), color: COL.src, weight: 500 }]);
                    lblQ.position.set(0, SRC_R * ks + h * 1.95, 0);
                    lblR.userData.satt([{ t: 'r', italic: true, color: COL.rpil }, { t: ' = ' + fmtR(r), color: COL.rpil }]);
                    lblR.position.copy(u).multiplyScalar(r * 0.6).add(new THREE.Vector3(0, h * 0.7, 0));
                    lblKv.visible = sh.etik && sh.kvad;
                    lblKv.userData.satt([{ t: '1 m', color: COL.kvad }, { t: '2', color: COL.kvad, sup: true }]);
                    lblKv.position.copy(u).multiplyScalar(r).add(new THREE.Vector3(0, -0.5 - h * 0.7, 0));
                    lblA.visible = sh.etik && sh.sfar;
                    lblA.userData.satt([{ t: 'A', italic: true, color: COL.sfar }, { t: ' = 4π · ', color: COL.sfar }, { t: 'r', italic: true, color: COL.sfar },
                                        { t: '2', color: COL.sfar, sup: true }, { t: ' = ' + fmtNum(4 * Math.PI * r * r, r < 3 ? 1 : 0) + ' m', color: COL.sfar }, { t: '2', color: COL.sfar, sup: true }]);
                    lblA.position.set(0, r + h * 0.75, 0);
                    lblL.userData.satt([{ t: 'L', italic: true, color: COL.ink }, { t: ' = ' + fmtL(p.L), color: COL.ink, weight: 700 }]);
                    // under mätarens stativ, där golvet är fritt
                    lblL.position.copy(u).multiplyScalar(r + 0.9).add(new THREE.Vector3(0, GOLV_Y - h * 0.8, 0));
                    [[lblP, 1], [lblR, 0.95], [lblKv, 0.9], [lblA, 0.9], [lblL, 1.05], [lblQ, 0.72]].forEach(([s, f]) => etikettH(s, h * f));

                    renderer.render(scene, camera);
                };
                uppdateraKamera();
                tick();

                return () => {
                    cancelAnimationFrame(raf);
                    ro.disconnect(); io.disconnect();
                    el.removeEventListener('pointerdown', onDown);
                    window.removeEventListener('pointermove', onMove);
                    window.removeEventListener('pointerup', onUp);
                    window.removeEventListener('pointercancel', onUp);
                    el.removeEventListener('wheel', onWheel);
                    renderer.dispose();
                    if (renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement);
                };
            }, []);
            return <div ref={mountRef} className="tre-mount" />;
        }

        // ─────────────────────────────────────────────────────────────────
        // Decibelstegen: L till vänster (linjär), I till höger (tiopotenser)
        // ─────────────────────────────────────────────────────────────────
        const DBMAX = 140;
        const SY0 = 404, SY1 = 22;
        const yDb = (db) => SY0 - (SY0 - SY1) * Math.max(0, Math.min(DBMAX, db)) / DBMAX;
        const REFERENSER = [
            [0, 'Hörbarhetsgräns'], [20, 'Viskning'], [60, 'Samtal'], [75, 'Inuti en bil'],
            [85, 'Risk för hörselskada'], [120, 'Smärtgräns'], [140, 'Startande jetplan'],
        ];
        const Stege = ({ L }) => {
            const BX = 56, BW = 16;
            return (
                <svg viewBox="0 0 320 418" width="100%" style={{ display: 'block', maxWidth: 360, margin: '0 auto' }}
                     fontFamily="Poppins, sans-serif" role="img" aria-label="Decibelskala från 0 till 140 dB med motsvarande ljudintensitet">

                            <line x1={BX + BW + 1} y1={yDb(db)} x2={BX + BW + (db % 20 ? 5 : 8)} y2={yDb(db)} stroke="rgba(15,22,32,0.45)" strokeWidth="1.1" />
                            {db % 20 === 0 && <text x={BX - 12} y={yDb(db) + 4} textAnchor="end" fontSize="12" fill={COL.ink}>{db}</text>}

                    {REFERENSER.map(([db, namn]) => (

                            <text x={151} y={yDb(db) + 4} fontSize="12" fill="#3a404b">{db} dB: {namn}</text>
                        </g>
                    ))}
                    <line x1={BX - 3} y1={yDb(L)} x2={BX + BW + 3} y2={yDb(L)} stroke={COL.ink} strokeWidth="2.6" />
                    <polygon points={`${BX + BW + 4},${yDb(L)} ${BX + BW + 13},${yDb(L) - 5.5} ${BX + BW + 13},${yDb(L) + 5.5}`} fill={COL.accent} />
                </svg>

        // ── Formelkort ──
        const Vbl = ({ label, children }) => (

        const FormulaCard = () => (

        // Kvoter med namn, så att jämförelsen läses i ord
        const KVOTNAMN = [[100, 'hundra gånger så stor'], [10, 'tio gånger så stor'], [4, 'fyra gånger så stor'],
                          [2, 'dubbelt så stor'], [1, 'lika stor'], [0.5, 'hälften så stor'], [0.25, 'en fjärdedel'],
                          [0.1, 'en tiondel'], [0.01, 'en hundradel']];
        const kvotIOrd = (k) => {
            const hit = KVOTNAMN.find(([v]) => Math.abs(k / v - 1) < 0.02);
            return hit ? hit[1] : null;
        };

        // ── Ljudet: en ton på 440 Hz vars volym följer ljudnivån (relativt) ──
        // Grundton + två svaga övertoner (PeriodicWave), så att tonen hörs
        // tydligt även i små högtalare men inte låter som en skarp pipton.
        // Samma frekvens som tongeneratorn i teorin (fy2-2.11).
        const Ljud = {
            ctx: null, gain: null,
            start() {
                if (!this.ctx) {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    if (!AC) return false;
                    this.ctx = new AC();
                    const osc = this.ctx.createOscillator();
                    const re = new Float32Array([0, 0, 0, 0]);
                    const im = new Float32Array([0, 1, 0.28, 0.1]);
                    osc.setPeriodicWave(this.ctx.createPeriodicWave(re, im));
                    osc.frequency.value = 440;
                    this.gain = this.ctx.createGain();
                    this.gain.gain.value = 0;
                    osc.connect(this.gain).connect(this.ctx.destination);
                    osc.start();
                }
                if (this.ctx.state === 'suspended') this.ctx.resume();
                return true;
            },
            satt(L, pa) {
                if (!this.gain) return;
                // 20 dB lägre nivå = en tiondel av amplituden; 110 dB ger full volym
                const g = pa ? Math.min(0.35, 0.35 * Math.pow(10, (L - 110) / 20)) : 0;
                this.gain.gain.setTargetAtTime(g, this.ctx.currentTime, 0.06);
            },
        };

        // ─────────────────────────────────────────────────────────────────
        // Huvudapp
        // ─────────────────────────────────────────────────────────────────
        const App = () => {
            const q = new URLSearchParams(location.search);
            const num = (k, d) => (isFinite(parseFloat(q.get(k))) ? parseFloat(q.get(k)) : d);
            const [logP, setLogP] = useState(num('lp', Math.log10(5)));
            const [r, setR] = useState(Math.max(RMIN, Math.min(RMAX, num('r', 10))));
            const [ang, setAng] = useState(1.5);
            const [tva, setTva] = useState(q.get('tva') === '1');
            const [show, setShow] = useState({ sfar: true, kvad: true, energi: true, etik: false });
            const [ljudPa, setLjudPa] = useState(false);
            const [vy, setVy] = useState('snett');
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [togglesOpen, setTogglesOpen] = useState(true);
            const sceneWrapRef = useRef(null);
            const animRef = useRef(0);

            const P = avrundaP(logP);
            const { A, I, L } = berakna(P, r, tva);
            // prickskalan byts bara när antalet prickar hamnar utanför sitt intervall
            const [Q, setQ] = useState(() => valjQ(avrundaP(num('lp', Math.log10(5)))));
            const nPrickar = P / Q * PRICK_LIV;
            useEffect(() => {
                if (nPrickar > PRICK_MAX * 0.97 || nPrickar < PRICK_MIN) setQ(valjQ(P));
            }, [P]);

            SIM.p.P = P; SIM.p.Q = Q; SIM.p.r = r; SIM.p.ang = ang; SIM.p.tva = tva; SIM.p.L = L; SIM.p.show = show;

            const stoppaAnim = () => { cancelAnimationFrame(animRef.current); clearTimeout(animRef.current); animRef.current = 0; };
            SIM.cb.flytta = (rr, a) => { stoppaAnim(); setR(rr); setAng(a); };

            useEffect(() => { Ljud.satt(L, ljudPa); }, [L, ljudPa]);

            useEffect(() => {
                const handler = () => {
                    const fs = document.fullscreenElement === sceneWrapRef.current ||
                        document.webkitFullscreenElement === sceneWrapRef.current;
                    setIsFullscreen(fs);
                };
                document.addEventListener('fullscreenchange', handler);
                document.addEventListener('webkitfullscreenchange', handler);
                return () => {
                    document.removeEventListener('fullscreenchange', handler);
                    document.removeEventListener('webkitfullscreenchange', handler);
                };
            }, []);
            const toggleFullscreen = () => {
                const el = sceneWrapRef.current;
                if (!el) return;
                if (document.fullscreenElement || document.webkitFullscreenElement)
                    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
            };

            const valjVy = (v) => { setVy(v); if (SIM.vy) SIM.vy(v); };
            const tShow = (key) => setShow(sh => ({ ...sh, [key]: !sh[key] }));
            const andraP = (v) => { stoppaAnim(); setLogP(v); };
            const andraR = (v) => { stoppaAnim(); setR(v); };
            const andraTva = (v) => { stoppaAnim(); setTva(v); };
            const vaxlaLjud = () => {
                if (!ljudPa && !Ljud.start()) return;
                setLjudPa(pa => !pa);
            };

            const MINI = document.documentElement.classList.contains('mini-mode');
            const sceneToggles = () => {
                if (!togglesOpen) {
                    return (
                        <button className="st-show-btn" onClick={() => setTogglesOpen(true)}
                                aria-label="Visa inställningar" title="Visa inställningar" aria-expanded="false">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 strokeWidth="2" strokeLinecap="round" aria-hidden="true">
                                <line x1="4" y1="8" x2="20" y2="8" />
                                <circle cx="14.5" cy="8" r="2.7" fill="currentColor" stroke="none" />
                                <line x1="4" y1="16" x2="20" y2="16" />
                                <circle cx="9.5" cy="16" r="2.7" fill="currentColor" stroke="none" />
                            </svg>
                        </button>
                    );
                }
                return (
                    <div className="scene-toggles">
                        <button className="st-hide" onClick={() => setTogglesOpen(false)}
                                aria-label="Dölj inställningar" title="Dölj inställningar" aria-expanded="true">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 strokeWidth="2.4" strokeLinecap="round" aria-hidden="true">
                                <path d="M6 6l12 12M18 6L6 18" />
                            </svg>
                        </button>
                        <div className="st-title">Visa</div>
                        <label><input type="checkbox" checked={show.sfar} onChange={() => tShow('sfar')} />
                            <span className="st-swatch" style={{ background: COL.sfar }}></span>
                            <span>Sfären med radien <em>r</em></span></label>
                        <label><input type="checkbox" checked={show.kvad} onChange={() => tShow('kvad')} />
                            <span className="st-swatch" style={{ background: COL.kvad }}></span>
                            <span>En kvadratmeter vid mätaren</span></label>
                        <label><input type="checkbox" checked={show.energi} onChange={() => tShow('energi')} />
                            <span className="st-dot" style={{ background: COL.src }}></span>
                            <span>Energin som sprids <span style={{ whiteSpace: 'nowrap', color: 'var(--lab-ink-muted)' }}>(1 prick = {fmtE(Q)})</span></span></label>
                        <label><input type="checkbox" checked={show.etik} onChange={() => tShow('etik')} />
                            <span className="st-swatch" style={{ background: COL.ink }}></span>
                            <span>Etiketter</span></label>
                        <div className="st-title mt">Vy</div>
                        <div className="vy-seg">
                            {[['snett', 'Snett'], ['sidan', 'Sidan'], ['ovan', 'Ovan']].map(([k, n]) => (
                                <button key={k} className={vy === k ? 'active' : ''} onClick={() => valjVy(k)}>{n}</button>
                            ))}
                        </div>
                        {(isFullscreen || MINI) && (
                            <React.Fragment>
                                <div className="st-title mt">Reglage</div>
                                <div className="st-sliders">
                                    <StSlider label="Utsänd effekt (<em>P</em>)" value={logP} min={LPMIN} max={LPMAX} step={0.05}
                                              onChange={andraP} valueText={fmtP(P)} />
                                    <StSlider label="Avstånd till källan (<em>r</em>)" value={r} min={RMIN} max={RMAX} step={0.1}
                                              onChange={andraR} valueText={fmtR(r)} />
                                </div>
                                <label style={{ marginTop: 6 }}><input type="checkbox" checked={tva} onChange={() => andraTva(!tva)} />
                                    <span>Två likadana ljudkällor</span></label>
                            </React.Fragment>
                        )}
                    </div>
                );
            };

            return (
                <div className="min-h-screen dark-container px-4 md:px-8 pb-12" style={{ fontFamily: "'DM Sans', sans-serif" }}>
                    <div className="max-w-6xl mx-auto pt-6">
                        <div className="breadcrumb mb-4" style={{ fontSize: 13 }}>
                            <a href="index.html">Hem</a> / <a href="katalog.html?id=fy2">Fysik nivå 2</a> / Intensitet och ljudnivå
                        </div>
                        <h1 className="text-3xl md:text-4xl font-black tracking-tight" style={{ color: 'var(--lab-ink)' }}>Intensitet och ljudnivå</h1>
                        <p className="mt-2 mb-5" style={{ color: 'var(--lab-ink-soft)', maxWidth: 820 }}>
                            En rundstrålande högtalare sänder ut effekten <em>P</em> lika mycket åt alla håll. På
                            avståndet <em>r</em> har effekten spridits ut över en sfär med arean 4<em>π</em> · <em>r</em>²,
                            och ljudintensiteten <em>I</em> är den effekt som går genom en kvadratmeter av sfären.
                            Dra ljudnivåmätaren närmare eller längre bort och se hur intensiteten och ljudnivån <em>L</em> ändras.
                        </p>

                        <FormulaCard />

                        <main className="flex flex-col lg:flex-row gap-6">
                            <div className="lg:w-3/5 order-1">
                                <div className="scene-wrap" data-theme="ljusPapper" ref={sceneWrapRef}>
                                    <LjudScene wrapRef={sceneWrapRef} />

                                    <div className="scene-info">
                                        <span className="si-lbl">Ljudintensitet <em style={{ textTransform: 'none' }}>I</em></span>
                                        <span className="si-val">{fmtI(I)}</span>
                                        <span className="si-lbl" style={{ marginTop: 4 }}>Ljudnivå <em style={{ textTransform: 'none' }}>L</em></span>
                                        <span className="si-val">{fmtL(L)}</span>
                                    </div>

                                    <div className="scene-hint">Dra i ljudnivåmätaren. Dra i rummet för att vrida.</div>
                                    {sceneToggles()}

                                    <button className={'ljud-btn' + (ljudPa ? ' pa' : '')} onClick={vaxlaLjud}
                                            aria-label={ljudPa ? 'Stäng av ljudet' : 'Slå på ljudet'} aria-pressed={ljudPa}
                                            title={ljudPa ? 'Stäng av ljudet' : 'Lyssna'}>
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"
                                             strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                                            <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor" />
                                            {ljudPa ? (
                                                <React.Fragment><path d="M15.5 9a4 4 0 0 1 0 6" /><path d="M18.3 6.5a7.5 7.5 0 0 1 0 11" /></React.Fragment>
                                            ) : (
                                                <React.Fragment><path d="M16 9.5l5 5" /><path d="M21 9.5l-5 5" /></React.Fragment>
                                            )}
                                        </svg>
                                    </button>
                                    <button className="fs-btn" onClick={toggleFullscreen} aria-label="Fullskärm"
                                            title={isFullscreen ? 'Lämna fullskärm' : 'Fullskärm'}>
                                        {isFullscreen ? (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M9 3v6H3" /><path d="M15 21v-6h6" /><path d="M21 9h-6V3" /><path d="M3 15h6v6" />
                                            </svg>
                                        ) : (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M3 9V3h6" /><path d="M21 9V3h-6" /><path d="M3 15v6h6" /><path d="M21 15v6h-6" />
                                            </svg>
                                        )}
                                    </button>
                                </div>

                            </div>

                            <div className="lg:w-2/5 order-2">
                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <Slider label="Utsänd effekt (<em>P</em>)"
                                            sub="Reglaget är logaritmiskt, från 1&nbsp;mW till 100&nbsp;W."
                                            value={logP} min={LPMIN} max={LPMAX} step={0.05} onChange={andraP} valueText={fmtP(P)} />
                                    <Slider label="Avstånd till källan (<em>r</em>)"
                                            sub="Du kan också dra i mätaren i scenen."
                                            value={r} min={RMIN} max={RMAX} step={0.1} onChange={andraR} valueText={fmtR(r)} />
                                    <label className="flex items-center gap-2 text-sm mb-3" style={{ color: 'var(--lab-ink)', cursor: 'pointer' }}>
                                        <input type="checkbox" checked={tva} onChange={() => andraTva(!tva)} style={{ width: 16, height: 16, accentColor: 'var(--lab-accent)' }} />
                                        Två likadana ljudkällor tätt intill varandra
                                    </label>
                                    <div className="text-sm p-2 rounded-lg" style={{ background: 'rgba(37,99,201,0.07)', color: 'var(--lab-ink-soft)' }}>
                                        <strong style={{ color: 'var(--lab-ink)' }}>Lyssna själv.</strong> Slå på ljudet med högtalarknappen uppe till
                                        vänster i scenen och kryssa i Två likadana ljudkällor. Intensiteten blir dubbelt så stor, men ljudet låter bara
                                        lite starkare: 3&nbsp;dB är en liten skillnad för örat. Gör sedan effekten tio gånger så stor.
                                        Först när intensiteten blir ungefär tio gånger så stor, alltså 10&nbsp;dB mer, upplever
                                        de flesta att ljudet låter dubbelt så starkt. Det är därför decibelskalan är logaritmisk.
                                    </div>
                                    {ljudPa && (
                                        <div className="text-xs mt-2" style={{ color: 'var(--lab-ink-muted)' }}>
                                            Datorns högtalare kan inte spela upp de verkliga nivåerna, men volymen ändras
                                            lika mycket som ljudnivån: dubbel intensitet i simuleringen är dubbel ljudeffekt
                                            ur högtalaren. Över 110&nbsp;dB ökar volymen inte längre.
                                        </div>
                                    )}
                                </div>

                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <div className="flbl mb-1">Decibelstegen</div>
                                    <div className="flex justify-between items-baseline mb-2" style={{ color: 'var(--lab-ink)' }}>
                                        <span style={{ fontSize: 15 }}><em>L</em> = <b className="font-mono">{fmtL(L)}</b></span>
                                        <span style={{ fontSize: 15 }}><em>I</em> = <b className="font-mono">{fmtI(I)}</b></span>
                                    </div>
                                    <Stege L={L} />
                                    <p className="text-xs mt-2" style={{ color: 'var(--lab-ink-muted)' }}>
                                        Varje steg på 10&nbsp;dB uppåt är tio gånger så stor intensitet.
                                    </p>
                                </div>
                            </div>
                        </main>

                        <div className="glass-card rounded-xl p-4 mt-6">
                            <div className="flbl mb-3">Beräkning med värdena just nu</div>
                            <div className="flex flex-wrap items-center gap-x-2 gap-y-2" style={{ color: 'var(--lab-ink)', fontSize: 16 }}>
                                <span><em>A</em> = 4<em>π</em> · <em>r</em>² = 4<em>π</em> · ({fmtR(r)})² = <b>{fmtNum(A, A < 100 ? 1 : 0)}&nbsp;m²</b></span>
                            </div>
                            <div className="flex flex-wrap items-center gap-x-2 gap-y-2 mt-3" style={{ color: 'var(--lab-ink)', fontSize: 16 }}>
                                <span><em>I</em></span><span>=</span>
                                {tva && <span>2 ·</span>}
                                <FracP top={<em>P</em>} bot={<em>A</em>} />
                                <span>=</span>
                                {tva && <span>2 ·</span>}
                                <FracP top={fmtP(P)} bot={<React.Fragment>{fmtNum(A, A < 100 ? 1 : 0)}&nbsp;m²</React.Fragment>} />
                                <span>=</span>
                                <b style={{ color: 'var(--lab-accent)' }}>{fmtI(I)}</b>
                                {tva && <span className="text-sm" style={{ color: 'var(--lab-ink-muted)' }}>(två källor ger dubbel intensitet)</span>}
                            </div>
                            <div className="flex flex-wrap items-center gap-x-2 gap-y-2 mt-3" style={{ color: 'var(--lab-ink)', fontSize: 16 }}>
                                <span><em>L</em></span><span>=</span><span>10 · lg</span>
                                <span style={{ fontSize: 24, fontWeight: 300 }}>(</span>
                                <FracP top={<em>I</em>} bot={<React.Fragment><em>I</em><sub>0</sub></React.Fragment>} />
                                <span style={{ fontSize: 24, fontWeight: 300 }}>)</span>
                                <span>=</span><span>10 · lg</span>
                                <span style={{ fontSize: 24, fontWeight: 300 }}>(</span>
                                <FracP top={fmtI(I)} bot={<React.Fragment>10<sup>−12</sup>&nbsp;W/m²</React.Fragment>} />
                                <span style={{ fontSize: 24, fontWeight: 300 }}>)</span>
                                <span>=</span>
                                <b style={{ color: 'var(--lab-accent)' }}>{fmtL(L)}</b>
                            </div>
                        </div>

                        <div className="grid md:grid-cols-3 gap-4 mt-6">
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Samma effekt, större sfär</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Högtalaren sänder ut samma effekt var du än står. På dubbla avståndet har sfären
                                    som effekten sprids över fyra gånger så stor area, så genom varje kvadratmeter går
                                    bara en fjärdedel. Det ser du på prickarna: varje prick är en bestämd mängd
                                    energi, och högtalaren skickar ut fler prickar per sekund ju större effekten är.
                                    Längre ut sprids samma prickar över en större yta och ligger glesare.
                                </p>
                            </div>
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Decibelskalan är logaritmisk</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Dubbel intensitet ger ungefär 3&nbsp;dB mer, eftersom 10 · lg&nbsp;2&nbsp;≈&nbsp;3.
                                    Tio gånger så stor intensitet ger 10&nbsp;dB mer. Ljudnivån 40&nbsp;dB är därför inte fyra
                                    gånger så stark som 10&nbsp;dB, utan 1&nbsp;000 gånger så stark.
                                </p>
                            </div>
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Från hörbarhetsgräns till smärtgräns</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Örat hör ned till <em>I</em><sub>0</sub> = 10<sup>−12</sup>&nbsp;W/m², vilket är 0&nbsp;dB.
                                    Smärtgränsen går vid 1&nbsp;W/m², alltså 120&nbsp;dB. Däremellan ryms hela vår ljudvärld:
                                    en viskning kring 20&nbsp;dB, ett samtal kring 60&nbsp;dB och risk för hörselskada från
                                    85&nbsp;dB vid långvarig exponering.
                                </p>
                            </div>
                        </div>

                        <details className="glass-card rounded-xl p-4 mt-4">
                            <summary className="accordion-head" style={{ color: 'var(--lab-ink)' }}>
                                <span>Varför en rundstrålande högtalare?</span><span style={{ color: 'var(--lab-ink-muted)' }}>▾</span>
                            </summary>
                            <p className="mt-3 text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                Formeln <em>I</em> = <em>P</em>/(4<em>π</em> · <em>r</em>²) gäller en punktformig källa som
                                sänder ut ljudet lika mycket åt alla håll. En vanlig högtalare gör inte det, den låter mest
                                rakt fram. I akustiklabb används därför högtalare som är byggda som en dodekaeder, en kropp
                                med tolv likadana sidor, med ett högtalarelement på varje sida. Tillsammans sänder de ut
                                ljudet nästan lika mycket åt alla håll. I scenen är högtalaren och mätaren ritade större än
                                i verkligheten så att de syns, men golvets rutor och den orange kvadraten är exakt 1&nbsp;m.
                            </p>
                        </details>

                        <details className="glass-card rounded-xl p-4 mt-4">
                            <summary className="accordion-head" style={{ color: 'var(--lab-ink)' }}>
                                <span>Vanliga missuppfattningar</span><span style={{ color: 'var(--lab-ink-muted)' }}>▾</span>
                            </summary>
                            <ul className="mt-3 space-y-2 text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                <li><strong>"På dubbla avståndet är ljudet hälften så starkt."</strong> Nej. Intensiteten avtar med kvadraten på avståndet, så dubbla avståndet ger en fjärdedel av intensiteten, och ljudnivån sjunker med 6&nbsp;dB.</li>
                                <li><strong>"Två högtalare på 60&nbsp;dB ger 120&nbsp;dB."</strong> Nej. Intensiteterna adderas, så två likadana källor ger dubbel intensitet. Det är bara 3&nbsp;dB mer, alltså 63&nbsp;dB. Kryssa i Två likadana ljudkällor och prova.</li>
                                <li><strong>"40&nbsp;dB är dubbelt så starkt som 20&nbsp;dB."</strong> Nej. 20&nbsp;dB mer betyder 100 gånger så stor intensitet. Varje steg på 10&nbsp;dB är en tiodubbling.</li>
                                <li><strong>"0&nbsp;dB betyder att det är helt tyst."</strong> Nej. 0&nbsp;dB är hörbarhetsgränsen, den svagaste intensitet örat kan uppfatta (<em>I</em><sub>0</sub> = 10<sup>−12</sup>&nbsp;W/m²). Ett ännu svagare ljud har negativ ljudnivå, det är bara för svagt för att höras.</li>
                            </ul>
                        </details>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script src="feedback.js" defer></script>
    <script src="sim-dock.js" defer></script>
    <script src="data/katalog.js"></script>
    <script src="section-nav.js"></script>
    <!-- Cloudflare Web Analytics: cookiefri besöksmätning, se CLAUDE.md. -->
