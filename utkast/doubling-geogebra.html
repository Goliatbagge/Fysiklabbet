  (fordubbling.html / doubling.html). Två appletar och ett kort elevavsnitt.

  SV/EN: ALL synlig text står i TEXT nedan, på båda språken. Ändra båda
  samtidigt. Den engelska sidan doubling-geogebra.html genereras med
  node .claude/bygg-doubling-geogebra.js och redigeras aldrig för hand.

  Applet 1: f(x) = K·(1 + r/100)^x och linjen y = 2K. Skärningspunkten S har
  x-koordinaten T = ln 2 / ln(1 + r/100), fördubblingstiden. R = (72/r, 2K)
  är 72-regelns gissning. "Fler fördubblingar" visar 4K och 8K vid 2T och 3T.
  Applet 2: h(x) = x · ln 2 / ln(1 + x/100), alltså räntesats · fördubblingstid.
  Kurvan skär y = 72 vid knappt 8 %; där stämmer regeln exakt.
  Kontrollvärden: T(6 %) = 11,90; T(8 %) = 9,01; T(1 %) = 69,66; h(25) = 77,6.

  Allt (reglage, kryssrutor, objekt) ligger inne i GeoGebra, så filen som
  laddas ner med knappen fungerar fristående och kan läggas i en GeoGebra-bok.

  var LAGRING = 'fordubbling-geogebra-' + SPRAK;
  var sparat = {};
  try { sparat = JSON.parse(localStorage.getItem(LAGRING) || '{}'); } catch (e) { sparat = {}; }
  function spara() { try { localStorage.setItem(LAGRING, JSON.stringify(sparat)); } catch (e) {} }
  var nr = 0;
  function byggFragor(lista, behallare) {
    lista.forEach(function (f) {
      nr++;
      var div = document.createElement('div');
      div.className = 'fraga';
      div.innerHTML = '<p class="q"><span class="qn">' + nr + '</span><span>' + f[SPRAK] + '</span></p>' +
        '<textarea id="' + f.id + '" aria-label="' + t('fraga') + ' ' + nr + '"></textarea>';
      behallare.appendChild(div);
      var ta = div.querySelector('textarea');
      ta.value = sparat[f.id] || '';
      ta.addEventListener('input', function () { sparat[f.id] = ta.value; spara(); });
    });
  }
  byggFragor(FRAGOR, document.getElementById('fragor'));
  byggFragor(FRAGOR2, document.getElementById('fragor-2'));

  document.getElementById('kopiera').addEventListener('click', function () {
    var rader = [document.title, ''];
    FRAGOR.concat(FRAGOR2).forEach(function (f, i) {
      rader.push(t('fraga') + ' ' + (i + 1) + ': ' + (document.getElementById(f.id).value || ''));
    });
    var st = document.getElementById('kopiera-status');
    var text = rader.join('\n');
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(function () { st.textContent = t('kopierat'); }, function () { st.textContent = t('kopieraFel'); });
    } else { st.textContent = t('kopieraFel'); }
  });
  document.getElementById('skriv-ut').addEventListener('click', function () { window.print(); });

  // ---------- GeoGebra ----------
  var api1 = null, api2 = null;

  function storlek(id) {
    // GeoGebra sätter en fast bredd på behållaren, så mät kortet runt den.
    var kort = document.getElementById(id).parentElement;
    var w = Math.max(280, kort.clientWidth - 28);
    return { w: w, h: w < 560 ? 380 : 460 };
  }

  function stil(api, namn, farg, tjocklek, streckad) {
    api.setColor(namn, farg[0], farg[1], farg[2]);
    if (tjocklek) api.setLineThickness(namn, tjocklek);
    if (streckad) api.setLineStyle(namn, 1);
  }
  var BLA = [28, 61, 107], ROD = [200, 50, 74], GRON = [47, 107, 79], GRA = [105, 101, 92];

  function rubrikObjekt(api, namn, text) {
    api.setCaption(namn, text);
    api.setLabelStyle(namn, 3);
    api.setLabelVisible(namn, true);
  }

  function bygg1(api) {
    var c = [
      'K = Slider(1000, 100000, 1000, 1, 180, false, true, false, false)',
      'r = Slider(1, 25, 0.5, 1, 180, false, true, false, false)',
      'visaÅr = Checkbox()',
      'visa72 = Checkbox()',
      'visaFler = Checkbox()',
      'f(x) = If(x >= 0, K (1 + r / 100)^x)',
      'T = ln(2) / ln(1 + r / 100)',
      'd: y = 2K',
      'S = (T, 2K)',
      'v = Segment((T, 0), S)',
      'år = Sequence((n, K (1 + r / 100)^n), n, 0, 160)',
      'R = (72 / r, 2K)',
      'd4: y = 4K',
      'd8: y = 8K',
      'S4 = (2T, 4K)',
      'S8 = (3T, 8K)',
      'v4 = Segment((2T, 0), S4)',
      'v8 = Segment((3T, 0), S8)'
    ];
    c.forEach(function (k) { api.evalCommand(k); });
    api.setValue('K', 10000);
    api.setValue('r', 6);
    api.setValue('visaÅr', 0);
    api.setValue('visa72', 0);
    api.setValue('visaFler', 0);
    api.setVisible('T', false);

    ['år'].forEach(function (n) { api.evalCommand('SetConditionToShowObject(' + n + ', visaÅr)'); });
    api.evalCommand('SetConditionToShowObject(R, visa72)');
    ['d4', 'd8', 'S4', 'S8', 'v4', 'v8'].forEach(function (n) { api.evalCommand('SetConditionToShowObject(' + n + ', visaFler)'); });

    stil(api, 'f', BLA, 6);
    stil(api, 'd', ROD, 4, true);
    stil(api, 'd4', ROD, 2, true);
    stil(api, 'd8', ROD, 2, true);
    stil(api, 'v', GRA, 3, true);
    stil(api, 'v4', GRA, 2, true);
    stil(api, 'v8', GRA, 2, true);
    stil(api, 'S', ROD); api.setPointSize('S', 6);
    stil(api, 'S4', ROD); api.setPointSize('S4', 5);
    stil(api, 'S8', ROD); api.setPointSize('S8', 5);
    stil(api, 'år', BLA); api.setPointSize('år', 3);
    stil(api, 'R', GRON); api.setPointSize('R', 6); api.setPointStyle('R', 2);
    ['f', 'v', 'v4', 'v8', 'år', 'T'].forEach(function (n) { api.setLabelVisible(n, false); });
    ['S', 'S4', 'S8', 'R', 'år', 'f', 'd', 'd4', 'd8', 'v', 'v4', 'v8'].forEach(function (n) { api.setFixed(n, true, false); });

    rubrikObjekt(api, 'K', t('gK'));
    rubrikObjekt(api, 'r', t('gR'));
    api.setLabelStyle('K', 9);
    api.setLabelStyle('r', 9);
    rubrikObjekt(api, 'visaÅr', t('gVisaAr'));
    rubrikObjekt(api, 'visa72', t('gVisa72'));
    rubrikObjekt(api, 'visaFler', t('gVisaFler'));
    // Linjen y = 2K får ingen etikett: den krockar med y-axelns tal.
    rubrikObjekt(api, 'S', t('gS'));
    rubrikObjekt(api, 'R', t('gR72'));
    rubrikObjekt(api, 'S4', '4K');
    rubrikObjekt(api, 'S8', '8K');
    api.setLabelVisible('d', false);
    api.setLabelVisible('d4', false);
    api.setLabelVisible('d8', false);

    api.evalCommand('SetCoords(K, 40, 30)');
    api.evalCommand('SetCoords(r, 40, 68)');
    api.evalCommand('SetCoords(visaÅr, 30, 86)');
    api.evalCommand('SetCoords(visa72, 30, 114)');
    api.evalCommand('SetCoords(visaFler, 30, 142)');

    api.setAxisLabels(1, t('gXaxel'), t('gYaxel'));
    api.setGridVisible(true);
    api.setRounding('1');
    api.setPerspective('G');
    // På sidan styrs allt av HTML-reglagen under grafen. GeoGebras egna
    // reglage visas bara i den nedladdade filen (se laddaNer).
    REGLAGE1.forEach(function (n) { api.setVisible(n, false); });
    uppdatera();
  }

  function bygg2(api) {
    var c = [
      'r = Slider(1, 25, 0.5, 1, 180, false, true, false, false)',
      'h(x) = If(0 < x <= 25, x ln(2) / ln(1 + x / 100))',
      'g: y = 72',
      'P = (r, h(r))'
    ];
    c.forEach(function (k) { api.evalCommand(k); });
    stil(api, 'h', BLA, 6);
    stil(api, 'g', ROD, 4, true);
    stil(api, 'P', ROD); api.setPointSize('P', 6);
    api.setFixed('P', true, false);
    api.setFixed('h', true, false);
    api.setFixed('g', true, false);
    api.setLabelVisible('h', false);
    rubrikObjekt(api, 'r', t('gR'));
    api.setLabelStyle('r', 9);
    rubrikObjekt(api, 'g', '72');
    api.setCaption('P', '%y');
    api.setLabelStyle('P', 3);
    api.setLabelVisible('P', true);
    api.evalCommand('SetCoords(r, 40, 30)');
    api.setAxisLabels(1, t('gX2'), t('gY2'));
    api.setGridVisible(true);
    api.setRounding('1');
    api.setPerspective('G');
    api.setVisible('r', false);
    uppdatera();
  }

  // ---------- Läget och HTML-reglagen ----------
  var REGLAGE1 = ['K', 'r', 'visaÅr', 'visa72', 'visaFler'];
  var lage = { K: 10000, r: 6, ar: false, r72: false, fler: false };
  var $ = function (id) { return document.getElementById(id); };

  function vy1(medPlats) {
    var T = Math.log(2) / Math.log(1 + lage.r / 100);
    var xmax = Math.max(8, (lage.fler ? 3.25 : 1.6) * Math.max(T, 72 / lage.r));
    // medPlats: lämna plats överst till vänster för GeoGebras egna reglage.
    var ymax = (lage.fler ? (medPlats ? 12 : 8.8) : (medPlats ? 3.4 : 2.6)) * lage.K;
    api1.setCoordSystem(-0.07 * xmax, xmax, -0.08 * ymax, ymax);
  }
  var VY2 = [-1.5, 26.5, 66.8, 79.5];

  function uppdatera() {
    var K = lage.K, r = lage.r;
    var T = Math.log(2) / Math.log(1 + r / 100);
    var regel = 72 / r, fel = regel - T;
    $('ut-k').textContent = tal(K, 0) + ' kr';
    $('ut-r').textContent = $('ut-r2').textContent = tal(r, 1) + ' %';
    $('av-r').textContent = tal(r, 1) + ' %';
    $('av-t').textContent = tal(T, 1) + ' ' + t('ar');
    $('av-hela').textContent = Math.ceil(T - 1e-9) + ' ' + t('ar');
    $('av-72').textContent = tal(regel, 1) + ' ' + t('ar');
    $('av-fel').textContent = (fel > 0.05 ? '+' : '') + tal(fel, 1) + ' ' + t('ar');
    $('av-fel-ruta').className = Math.abs(fel) >= 0.15 ? 'varn' : '';
    if (api1) {
      api1.setValue('K', K);
      api1.setValue('r', r);
      api1.setValue('visaÅr', lage.ar ? 1 : 0);
      api1.setValue('visa72', lage.r72 ? 1 : 0);
      api1.setValue('visaFler', lage.fler ? 1 : 0);
      vy1(false);
    }
    if (api2) {
      api2.setValue('r', r);
      api2.setCoordSystem(VY2[0], VY2[1], VY2[2], VY2[3]);
    }
  }

  $('in-k').addEventListener('input', function () { lage.K = +this.value; uppdatera(); });
  [$('in-r'), $('in-r2')].forEach(function (el) {
    el.addEventListener('input', function () {
      lage.r = +this.value;
      $('in-r').value = $('in-r2').value = this.value;
      uppdatera();
    });
  });
  $('in-ar').addEventListener('change', function () { lage.ar = this.checked; uppdatera(); });
  $('in-72').addEventListener('change', function () { lage.r72 = this.checked; uppdatera(); });
  $('in-fler').addEventListener('change', function () { lage.fler = this.checked; uppdatera(); });
  [['in-k', 'gK'], ['in-r', 'gR'], ['in-r2', 'gR']].forEach(function (p) { $(p[0]).setAttribute('aria-label', t(p[1])); });
  uppdatera();

  function starta(id, bygg, satt) {
    var s = storlek(id);
    var app = new GGBApplet({
      appName: 'classic',
      id: id.replace('-', ''),
      width: s.w,
      height: s.h,
      language: SPRAK,
      showToolBar: false,
      showAlgebraInput: false,
      showMenuBar: false,
      showResetIcon: false,
      enableRightClick: false,
      enableShiftDragZoom: true,
      showZoomButtons: true,
      showFullscreenButton: true,
      borderColor: '#FFFDF9',
      appletOnLoad: function (api) { satt(api); bygg(api); }
    }, true);
    app.inject(id);
  }

  function laddaNer(api, filnamn, statusId) {
    var st = document.getElementById(statusId);
    if (!api) { st.textContent = t('laddar'); return; }
    // Den nedladdade filen ska fungera fristående: visa GeoGebras egna
    // reglage och lämna plats för dem, spara, och återställ sedan sidan.
    var reglage = api === api1 ? REGLAGE1 : ['r'];
    reglage.forEach(function (n) { api.setVisible(n, true); });
    if (api === api1) vy1(true); else api.setCoordSystem(VY2[0], VY2[1], VY2[2], VY2[3] + 3);
    api.getBase64(function (b64) {
      reglage.forEach(function (n) { api.setVisible(n, false); });
      uppdatera();
      var bin = atob(b64), u8 = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([u8], { type: 'application/vnd.geogebra.file' }));
      a.download = filnamn;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    });
  }
  var FIL = SPRAK === 'sv' ? ['fordubbling-graf.ggb', 'fordubbling-72-regeln.ggb'] : ['doubling-graph.ggb', 'doubling-rule-of-72.ggb'];
  document.getElementById('ladda-1').addEventListener('click', function () { laddaNer(api1, FIL[0], 'status-1'); });
  document.getElementById('ladda-2').addEventListener('click', function () { laddaNer(api2, FIL[1], 'status-2'); });

  if (typeof GGBApplet !== 'function') {
    document.getElementById('ggb-1').textContent = t('ingenGgb');
    document.getElementById('ggb-2').textContent = t('ingenGgb');
    return;
  }
  starta('ggb-1', bygg1, function (a) { api1 = a; });
  starta('ggb-2', bygg2, function (a) { api2 = a; });

  var vantar = null;
  window.addEventListener('resize', function () {
    clearTimeout(vantar);
    vantar = setTimeout(function () {
      if (api1) { var s1 = storlek('ggb-1'); api1.setSize(s1.w, s1.h); }
      if (api2) { var s2 = storlek('ggb-2'); api2.setSize(s2.w, s2.h); }
      uppdatera();
    }, 200);
  });
})();
</script>
</body>
</html>
