    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>

    <script type="text/babel" data-presets="react">
        const { useState, useEffect, useMemo, useRef } = React;
        const K = window.KATALOG;
        const KF = window.KATALOG_FLAT;
        const TEORI = window.TEORI || {};

        // --- Skydda math-block från marked (annars äts \; \, \! upp och
        // semikolonet blir kvar som synlig text).
        function protectMath(md) {
            const tokens = [];
            md = md.replace(/\$\$([\s\S]+?)\$\$/g, (m) => {
                tokens.push(m);
                return '@@LABMATH' + (tokens.length - 1) + '@@';
            });
            md = md.replace(/\$([^\n$]+?)\$/g, (m) => {
                tokens.push(m);
                return '@@LABMATH' + (tokens.length - 1) + '@@';
            });
            return { md, tokens };
        }
        function restoreMath(html, tokens) {
            html = html.replace(/@@LABMATH(\d+)@@/g, (_, i) => tokens[+i]);
            // Håll ihop variabel + bindestreck + efterled ("$x$-termen",
            // "<em>pq</em>-formeln") — annars kan raden brytas efter
            // bindestrecket eller mellan variabeln och bindestrecket.
            html = html.replace(/(\$(?!\$)[^$\n]+?\$|<em>[^<]{1,8}<\/em>)-([a-zA-Zåäöé]+)/g,
                '<span class="var-compound">$1-$2</span>');
            return html;
        }

        // --- Konvertera Unicode-superscript (⁻²⁷, ³⁰, …) till <sup>-27</sup>.
        // ¹²³ kommer från Latin-1 Supplement, ⁰⁴-⁹ från Superscripts-blocket;
        // i många fonter renderas de olika och hamnar på olika höjd. Genom
        // att lägga dem i ett <sup> med ASCII-siffror får vi konsekvent
        // typografi. Körs efter protectMath, så KaTeX-uttryck rörs inte.
        const SUP_MAP = {
            '⁻': '-', '⁺': '+',
            '⁰': '0', '¹': '1', '²': '2', '³': '3',
            '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7',
            '⁸': '8', '⁹': '9',
            '⁽': '(', '⁾': ')', 'ⁿ': 'n',
        };
        const SUP_RE = /[⁻⁺⁰¹²³⁴-⁹⁽⁾ⁿ]+/g;
        function preprocessSuperscripts(md) {
            // Skydda HTML-attributvärden (t.ex. data-tip="...m/s²...") så att
            // ² inte konverteras till "<sup>2</sup>" som plain text i tooltip.
            const tokens = [];
            md = md.replace(/\b(data-tip|title|aria-label)="([^"]*)"/g, (m) => {
                tokens.push(m);
                return '@@ATTR' + (tokens.length - 1) + '@@';
            });
            md = md.replace(SUP_RE, (run) => {
                let ascii = '';
                for (const ch of run) ascii += (SUP_MAP[ch] || ch);
                return '<sup>' + ascii + '</sup>';
            });
            md = md.replace(/@@ATTR(\d+)@@/g, (_, i) => tokens[+i]);
            return md;
        }

        // --- Markdown-preprocessor: gruppera deluppgifter (a/b/c/d-frågor).
        // Två eller fler konsekutiva rader på formen **a) ... ?** läggs i en
        // grid (.lab-deluppgifter) — c) under a), d) under b).
        function preprocessSubproblems(md) {
            const lines = md.split('\n');
            const isSub = (l) => /^\*\*[a-d]\)\s+.+\*\*\s*$/i.test(l);
            const out = [];
            let i = 0;
            while (i < lines.length) {
                if (isSub(lines[i])) {
                    const group = [];
                    let j = i;
                    while (j < lines.length && isSub(lines[j])) {
                        group.push(lines[j]);
                        j++;
                    }
                    if (group.length >= 2) {
                        out.push('<div class="lab-deluppgifter">');
                        out.push('');
                        for (const g of group) {
                            out.push(g);
                            out.push('');
                        }
                        out.push('</div>');
                        out.push('');
                        i = j;
                        continue;
                    }
                }
                out.push(lines[i]);
                i++;
            }
            return out.join('\n');
        }

        // --- Mät-och-bryt: efter KaTeX renderat formler kontrollerar vi om
        // de spiller över. Om så är fallet bryter vi vid en top-level = i
        // taget och renderar om — repeat tills den ryms. Skala som fallback.
        function findTopLevelEquals(latex) {
            // "=" inuti \left…\right-par och \begin{…}…\end{…}-miljöer
            // (värdeklamrarnas array) får inte bli brytpunkter — ett
            // insprutat "&="/"\\" där slår sönder miljön. Sådana formler
            // faller i stället igenom till scaleDownDisplay.
            const positions = [];
            let depth = 0, fence = 0, env = 0;
            for (let i = 0; i < latex.length; i++) {
                const ch = latex[i];
                if (ch === '\\') {
                    const m = /^[a-zA-Z]+/.exec(latex.slice(i + 1));
                    if (m) {
                        if (m[0] === 'left') fence++;
                        else if (m[0] === 'right') fence = Math.max(0, fence - 1);
                        else if (m[0] === 'begin') env++;
                        else if (m[0] === 'end') env = Math.max(0, env - 1);
                        i += m[0].length;
                    } else {
                        i++;
                    }
                    continue;
                }
                if (ch === '{') depth++;
                else if (ch === '}') depth--;
                else if (ch === '=' && depth === 0 && fence === 0 && env === 0) positions.push(i);
            }
            return positions;
        }

        function buildAligned(latex, breakPositions) {
            const segs = [];
            let prev = 0;
            for (const pos of breakPositions) {
                segs.push(latex.slice(prev, pos).trim());
                prev = pos + 1;
            }
            segs.push(latex.slice(prev).trim());
            const lines = [segs[0] + ' &= ' + segs[1]];
            for (let i = 2; i < segs.length; i++) lines.push('&= ' + segs[i]);
            return '\\begin{aligned}\n' + lines.join(' \\\\\n') + '\n\\end{aligned}';
        }

        function dispOverflows(disp) {
            const avail = disp.clientWidth;
            if (avail === 0) return false;
            const inner = disp.querySelector('.katex');
            const natural = inner
                ? Math.max(disp.scrollWidth, inner.scrollWidth, inner.offsetWidth)
                : disp.scrollWidth;
            return natural > avail + 0.5;
        }

        function renderDisplayMath(latex) {
            const wrapper = document.createElement('div');
            wrapper.innerHTML = window.katex.renderToString(latex, {
                displayMode: true,
                throwOnError: false,
            });
            return wrapper.firstElementChild;
        }

        function scaleDownDisplay(disp) {
            const inner = disp.querySelector('.katex');
            if (!inner) return;
            const avail = disp.clientWidth;
            const natural = Math.max(disp.scrollWidth, inner.scrollWidth, inner.offsetWidth);
            if (avail === 0 || natural <= avail + 0.5) return;
            const scale = avail / natural;
            // 'left top': formlerna är vänsterställda (padding-left på .katex),
            // en center-origin lämnar högerkanten utanför rutan efter skalning.
            inner.style.transformOrigin = 'left top';
            inner.style.transform = 'scale(' + scale + ')';
            // Höjden räknas på INNEHÅLLETS höjd — inte på .katex offsetHeight.
            // KaTeX ritar bråkens nämnare en bit under sin egen ruta (~0,3 em),
            // och .katex-display klipper i höjdled. Med offsetHeight blev rutan
            // för låg och nämnaren kapades: "a" i g(x)/a klipptes rakt av i
            // sammanfattningsrutan i ma3c-3.1 (rapporterat 2026-08-29).
            // scrollHeight räknar med överhänget, +1 px täcker avrundningen,
            // och rutans egen padding (--katex-luft-botten) läggs på när
            // box-sizing är border-box. Kontrolleras av
            // .claude/verify-formelklipp.js.
            const cs = getComputedStyle(disp);
            const padY = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
            const ram = cs.boxSizing === 'border-box' ? padY : 0;
            const ink = Math.max(inner.offsetHeight, inner.scrollHeight) + 1;
            disp.style.height = Math.ceil(ink * scale + ram) + 'px';
        }

        function fitMathDisplays(root) {
            if (!root || !window.katex) return;
            const displays = Array.from(root.querySelectorAll('.katex-display'));
            displays.forEach((disp) => {
                disp.style.height = '';
                const inner0 = disp.querySelector('.katex');
                if (inner0) {
                    inner0.style.transform = '';
                    inner0.style.transformOrigin = '';
                }
                if (!dispOverflows(disp)) return;
                const ann = disp.querySelector('annotation[encoding="application/x-tex"]');
                const orig = ann ? ann.textContent : null;
                let current = disp;
                if (orig) {
                    const eqs = findTopLevelEquals(orig);
                    for (let n = 2; n <= eqs.length; n++) {
                        const broken = buildAligned(orig, eqs.slice(0, n));
                        const newDisp = renderDisplayMath(broken);
                        current.replaceWith(newDisp);
                        current = newDisp;
                        if (!dispOverflows(current)) break;
                    }
                }
                if (dispOverflows(current)) scaleDownDisplay(current);
            });
        }


        // Ankarnamn för en blockruta: "Exempel 1 — Den fatala gungan" →
        // "exempel-1-den-fatala-gungan". Används av direktlänkningen till en
        // enskild ruta (katalog.html?id=<avsnitt>&block=<ankare>).
        function blockSlug(s) {
            return String(s == null ? '' : s)
                .toLowerCase()
                .replace(/[\u00e5\u00e4]/g, 'a').replace(/\u00f6/g, 'o')
                .replace(/[\u00e9\u00e8]/g, 'e').replace(/\u00fc/g, 'u')
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '');
        }

        // --- Markdown-preprocessor: ::: typ "Titel" ... ::: → HTML-blockruta
        // Hanterar nästlade ::: bild ... ::: inuti t.ex. ::: kuriosa ... :::.
        function preprocessBlocks(md) {
            const lines = md.split('\n');
            const out = [];
            const stack = [];
            const rakn = {};   // ordningsnummer per blocktyp (ankare, se nedan)

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                // ::: graf — interaktiv grafritare. Samla config-raderna och
                // gör om till en mount-placeholder (graf.js bygger widgeten).
                const grafOpen = line.match(/^:::\s*graf\s*$/i);
                if (grafOpen) {
                    const cfgLines = [];
                    let j = i + 1;
                    for (; j < lines.length; j++) {
                        if (/^:::\s*$/.test(lines[j])) break;
                        cfgLines.push(lines[j]);
                    }
                    const src = cfgLines.join('\n');
                    const b64 = btoa(unescape(encodeURIComponent(src)));
                    out.push('<div class="lab-graf" data-graf-src="' + b64 + '"></div>');
                    i = j; // hoppa förbi det avslutande :::
                    continue;
                }
                // ::: handskrift — animerad handskriven lösning. Samma
                // mönster: config-raderna → mount-placeholder (handskrift.js).
                const hkOpen = line.match(/^:::\s*handskrift\s*$/i);
                if (hkOpen) {
                    const cfgLines = [];
                    let j = i + 1;
                    for (; j < lines.length; j++) {
                        if (/^:::\s*$/.test(lines[j])) break;
                        cfgLines.push(lines[j]);
                    }
                    const src = cfgLines.join('\n');
                    const b64 = btoa(unescape(encodeURIComponent(src)));
                    out.push('<div class="lab-handskrift" data-handskrift-src="' + b64 + '"></div>');
                    i = j; // hoppa förbi det avslutande :::
                    continue;
                }
                // ::: video — inbäddat fritt videoklipp (archive.org eller
                // YouTube). Config-raderna görs om direkt till en <figure>
                // med iframe — ingen JS-mount behövs. Se buildVideoEmbed.
                const vidOpen = line.match(/^:::\s*video\s*$/i);
                if (vidOpen) {
                    const cfg = {};
                    let j = i + 1;
                    for (; j < lines.length; j++) {
                        if (/^:::\s*$/.test(lines[j])) break;
                        const m = lines[j].match(/^([a-zåäö]+):\s*(.+)$/i);
                        if (m) cfg[m[1].toLowerCase()] = m[2].trim();
                    }
                    rakn.video = (rakn.video || 0) + 1;
                    out.push(buildVideoEmbed(cfg, rakn.video));
                    i = j; // hoppa förbi det avslutande :::
                    continue;
                }
                // ::: minisim — inbäddad minisimulering. Samma mönster:
                // config-raderna → mount-placeholder (minisim.js).
                const msOpen = line.match(/^:::\s*minisim\s*$/i);
                if (msOpen) {
                    const cfgLines = [];
                    let j = i + 1;
                    for (; j < lines.length; j++) {
                        if (/^:::\s*$/.test(lines[j])) break;
                        cfgLines.push(lines[j]);
                    }
                    const src = cfgLines.join('\n');
                    const b64 = btoa(unescape(encodeURIComponent(src)));
                    out.push('<div class="lab-minisim" data-minisim-src="' + b64 + '"></div>');
                    i = j; // hoppa förbi det avslutande :::
                    continue;
                }
                const open = line.match(/^:::\s*([a-zåäö]+)(?:\s+"([^"]*)")?\s*$/i);
                const close = line.match(/^:::\s*$/);

                if (open) {
                    const [, type, title] = open;
                    const ty = type.toLowerCase();
                    const parent = stack.length ? stack[stack.length - 1].type : null;
                    // Nästlad ::: härledning INUTI ::: formel → hopfällbar
                    // dropdown (<details>) längst ned i formelrutan i stället
                    // för en egen fristående ruta.
                    if ((ty === 'härledning' || ty === 'harledning') && parent === 'formel') {
                        stack.push({ type: ty, close: '</div></details>' });
                        const label = title
                            ? escapeHtml(title).replace(/\*([^*]+)\*/g, '<em>$1</em>')
                            : 'Härledning';
                        out.push('<details class="formel-harledning">');
                        out.push('<summary>' + label + '<span class="fh-chevron"></span></summary>');
                        out.push('<div class="formel-harledning-body">');
                        out.push('');
                        continue;
                    }
                    stack.push({ type: ty, close: '</div>' });
                    // Ankare per ruta, så att en länk kan peka RAKT på den:
                    //   data-blocknr  typ + ordningsnummer  (exempel-2)
                    //   data-block    slug av titeln        (den-fatala-gungan)
                    // Se scrollaTillBlock — hashen är upptagen av
                    // avsnittsroutingen, därför läses ankaret ur ?block=.
                    rakn[ty] = (rakn[ty] || 0) + 1;
                    let ankare = ' data-blocknr="' + blockSlug(ty) + '-' + rakn[ty] + '"';
                    if (title) {
                        const slug = blockSlug(title);
                        ankare += ' data-block="' + slug + '"';
                        // "Exempel 1 — Den fatala gungan" ger också den korta
                        // formen "den-fatala-gungan", som överlever att
                        // exemplen numreras om.
                        const kort = slug.replace(
                            new RegExp('^' + blockSlug(ty) + '-\\d+-'), '');
                        if (kort && kort !== slug) ankare += ' data-blockkort="' + kort + '"';
                    }
                    out.push('<div class="lab-block lab-block-' + ty + '"' + ankare + '>');
                    if (title) {
                        // '*pq*-formeln' → kursiverad variabeldel (<em>pq</em>).
                        const t = escapeHtml(title).replace(/\*([^*]+)\*/g, '<em>$1</em>');
                        out.push('<div class="lab-block-title">' + t + '</div>');
                    }
                    out.push('');
                } else if (close && stack.length > 0) {
                    const top = stack.pop();
                    out.push('');
                    out.push(top.close);
                } else {
                    out.push(line);
                }
            }
            return out.join('\n');
        }

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // ::: video-blockets config → färdig HTML. Nycklar:
        //   fil:    självhostad mp4 i media/video/ (FÖRSTAHANDSVALET — 
        //           tredjeparts-iframes visade sig opålitliga i mobilen)
        //   affisch: affischbild (poster) till fil:
        //   arkiv:  archive.org-identifierare (iframe-inbäddning)
        //   youtube: YouTube-video-id (bäddas in via youtube-nocookie.com)
        //   titel:  visas under klippet
        //   källa:  upphov/licens (t.ex. "Film: NASA (public domain)")
        //   länk:   extern länk till originalet ("Se filmen i original")
        //   format: "4:3" för äldre filmmaterial (standard 16:9)
        // Saknas fil:, arkiv: och youtube: renderas bara en länkrad — så att
        // material som inte går att bädda in ändå blir ett klick bort.
        function buildVideoEmbed(cfg, nr) {
            const ratio = cfg.format === '4:3' ? '4 / 3' : '16 / 9';
            // Ankare, så att en länk kan peka RAKT på filmen
            // (katalog.html?id=…&block=…). `ankare:` i config-blocket är den
            // stabila formen och överlever att filmens titel skrivs om;
            // video-N finns alltid som reserv. Se scrollaTillBlock.
            let ank = ' data-blocknr="video-' + (nr || 1) + '"';
            if (cfg.ankare) ank += ' data-block="' + blockSlug(cfg.ankare) + '"';
            const cap = [];
            if (cfg.titel) cap.push('<span class="lab-video-titel">' + escapeHtml(cfg.titel) + '</span>');
            const meta = [];
            if (cfg['källa'] || cfg.kalla) meta.push(escapeHtml(cfg['källa'] || cfg.kalla));
            if (cfg['länk'] || cfg.lank) {
                const url = escapeHtml(cfg['länk'] || cfg.lank);
                meta.push('<a href="' + url + '" target="_blank" rel="noopener">Se filmen i original</a>');
            }
            if (meta.length) cap.push('<span class="lab-video-kalla">' + meta.join(' · ') + '</span>');
            const caption = '<figcaption>' + cap.join('') + '</figcaption>';
            if (cfg.fil) {
                const poster = (cfg.affisch ? ' poster="' + escapeHtml(cfg.affisch) + '"' : '');
                return '<figure class="lab-video"' + ank + '><div class="lab-video-ram" style="aspect-ratio:' + ratio + '">' +
                    '<video controls preload="metadata" playsinline' + poster + '>' +
                    '<source src="' + escapeHtml(cfg.fil) + '" type="video/mp4">' +
                    '</video></div>' + caption + '</figure>';
            }
            const src = cfg.arkiv
                ? 'https://archive.org/embed/' + encodeURIComponent(cfg.arkiv)
                : (cfg.youtube
                    ? 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(cfg.youtube)
                    : null);
            if (!src) {
                return '<div class="lab-video lab-video-lank"' + ank + '>' + cap.join('') + '</div>';
            }
            return '<figure class="lab-video"' + ank + '><div class="lab-video-ram" style="aspect-ratio:' + ratio + '">' +
                '<iframe src="' + src + '" title="' + escapeHtml(cfg.titel || 'Videoklipp') + '"' +
                ' loading="lazy" frameborder="0" allow="fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>' +
                '</div>' + caption + '</figure>';
        }

        // Kursiverade variabler i titlar: '*pq*-formeln' → <em>pq</em>-formeln.
        function emTitle(s) {
            if (!s || s.indexOf('*') === -1) return s;
            return s.split(/\*([^*]+)\*/g).map((part, i) =>
                i % 2 ? <em key={i}>{part}</em> : part);
        }

        // Konfigurera marked
        marked.setOptions({ gfm: true, breaks: false });

        // Breda tabeller lindas i en scroll-ruta (.lab-tabell) — annars
        // klipps de yttre kolumnerna bort på mobil. Samma som katalog.html.
        marked.use({
            renderer: {
                table(header, body) {
                    return '<div class="lab-tabell"><table>\n<thead>\n' + header +
                        '</thead>\n' + (body ? '<tbody>' + body + '</tbody>' : '') +
                        '</table></div>\n';
                },
            },
        });

        // Hämta id från URL — använder hash (#fy1-2.3) eftersom file:// strippar query strings.
        function getId() {
            const hash = window.location.hash.replace(/^#/, '').trim();
            if (hash) return hash;
            // Fallback för http(s) — om någon delar en ?id-länk
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        // Slå upp avsnitt i katalogen
        function findSection(id) {
            // id-format: fy1-2.3, fy2-3.4, ...
            const m = id && id.match(/^fy([12])-(\d+\.(?:\d+|S|E))$/);
            if (!m) return null;
            const course = m[1] === '1' ? 'Fysik nivå 1' : 'Fysik nivå 2';
            const num = m[2];
            return KF.find(s => s.course === course && s.num === num) || null;
        }

        // Frontmatter-parser (enkel YAML utan beroenden)
        function parseFrontmatter(md) {
            // Normalisera radslut först — en CRLF-sparad md-fil (`---\r\n`)
            // matchar annars inte och hela YAML-blocket läcker ut som text.
            md = md.replace(/\r\n?/g, '\n');
            if (!md.startsWith('---\n')) return { fm: {}, body: md };
            const end = md.indexOf('\n---\n', 4);
            if (end === -1) return { fm: {}, body: md };
            const block = md.slice(4, end);
            const fm = {};
            for (const line of block.split('\n')) {
                const m = line.match(/^([a-zA-Z]+):\s*(.*)$/);
                if (m) {
                    let v = m[2].trim();
                    if (v.startsWith("'") && v.endsWith("'")) v = v.slice(1, -1);
                    if (v.startsWith('"') && v.endsWith('"')) v = v.slice(1, -1);
                    fm[m[1]] = v;
                }
            }
            return { fm, body: md.slice(end + 5) };
        }

        function Article({ id }) {
            const meta = findSection(id);
            const raw = TEORI[id];
            const containerRef = useRef(null);

            const { fm, html } = useMemo(() => {
                if (!raw) return { fm: {}, html: null };
                const { fm, body } = parseFrontmatter(raw);
                const { md, tokens } = protectMath(body);
                let processed = preprocessSuperscripts(md);
                processed = preprocessSubproblems(processed);
                processed = preprocessBlocks(processed);
                const html = restoreMath(marked.parse(processed), tokens);
                return { fm, html };
            }, [raw]);

            useEffect(() => {
                if (!containerRef.current || !html) return;
                renderMathInElement(containerRef.current, {
                    delimiters: [
                        { left: '$$', right: '$$', display: true },
                        { left: '$', right: '$', display: false },
                    ],
                    throwOnError: false,
                });
                // Interaktiva grafer (::: graf) — bygg widgetarna.
                if (window.FYSIKGRAF) window.FYSIKGRAF.mountAll(containerRef.current);
                // Handskrivna lösningar (::: handskrift) — bygg widgetarna.
                if (window.HANDSKRIFT) window.HANDSKRIFT.mountAll(containerRef.current);
                // Minisimuleringar (::: minisim) — bygg widgetarna.
                if (window.FYSIKMINISIM) window.FYSIKMINISIM.mountAll(containerRef.current);
                const root = containerRef.current;
                const fit = () => fitMathDisplays(root);
                let cancelled = false;
                const safeFit = () => { if (!cancelled) fit(); };
                const raf1 = requestAnimationFrame(safeFit);
                if (document.fonts && document.fonts.ready) {
                    document.fonts.ready.then(safeFit);
                }
                const tid = setTimeout(safeFit, 250);
                window.addEventListener('resize', fit);
                return () => {
                    cancelled = true;
                    cancelAnimationFrame(raf1);
                    clearTimeout(tid);
                    window.removeEventListener('resize', fit);
                };
            }, [html]);

    <!-- Tooltip för fysikaliska begrepp (.lab-term med data-tip) -->
    <script>
    (function () {
        let tip = null;
        function ensureTip() {
            if (tip) return tip;
            tip = document.createElement('div');
            tip.className = 'lab-term-tooltip';
            document.body.appendChild(tip);
            return tip;
        }
        function position(e) {
            if (!tip) return;
            const offset = 16;
            const rect = tip.getBoundingClientRect();
            let x = e.clientX + offset;
            let y = e.clientY + offset;
            if (x + rect.width > window.innerWidth - 8)  x = e.clientX - rect.width - offset;
            if (y + rect.height > window.innerHeight - 8) y = e.clientY - rect.height - offset;
            if (x < 8) x = 8;
            if (y < 8) y = 8;
            tip.style.left = x + 'px';
            tip.style.top = y + 'px';
        }
        document.addEventListener('mouseover', (e) => {
            const t = e.target.closest && e.target.closest('.lab-term');
            if (!t) return;
            ensureTip().innerHTML = t.dataset.tip || '';
            tip.classList.add('visible');
            position(e);
        });
        document.addEventListener('mousemove', (e) => {
            if (tip && tip.classList.contains('visible')) position(e);
        });
        document.addEventListener('mouseout', (e) => {
            const from = e.target.closest && e.target.closest('.lab-term');
            const to = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.lab-term');
            if (from && from !== to && tip) tip.classList.remove('visible');
        });
    })();
    </script>
