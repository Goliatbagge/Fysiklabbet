    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const COL = {
            falt:  '#c0392b',    // fältlinjer (röda)
            kraft: '#2563c9',    // kraftpilar (blå, som teorifigurerna)
            npol:  '#c0392b',
            spol:  '#cfd4da',
            spolText: '#3a3f47',
            ink:   '#30363f',
            nal:   '#5d646e',
        };

        const PX_PER_CM = 26;                 // skala: 26 px = 1 cm
        const HALF = 72, HW = 21;             // magnetens halvlängd och halvtjocklek
        const PD = 58;                        // polernas läge från magnetens mitt
        const KRAFT = 9.0e6;                  // kraftkonstant (px-enheter)
        const F_STAT = 200;                   // statisk friktion — tröskel för att börja glida
        const F_KIN = 150;                    // kinetisk friktion (px/s²)

        const fmt = (num, decimals = 1) => {
            if (!isFinite(num)) return '–';
            const s = num.toFixed(decimals);
            if (parseFloat(s) === 0) return '0';
            return s.replace('.', ',').replace('-', '−');
        };

        // ── Fältmodell: fyra magnetpoler (två per magnet) ───────────────
        const polesOf = (m) => ([
            { x: m.x + m.dir * PD, y: m.y, q: +1 },   // N
            { x: m.x - m.dir * PD, y: m.y, q: -1 },   // S
        ]);
        const fieldAt = (x, y, poles) => {
            let bx = 0, by = 0;
            for (let i = 0; i < poles.length; i++) {
                const p = poles[i];
                const dx = x - p.x, dy = y - p.y;
                const r2 = dx * dx + dy * dy + 20;
                const inv = p.q / (r2 * Math.sqrt(r2));
                bx += dx * inv; by += dy * inv;
            }
            return [bx, by];
        };

        // Kraften i x-led på HÖGER magnet från vänster (pol-par-summa, 1/r²).
        // Positivt värde ⟹ höger magnet trycks åt höger (repulsion).
        const forceOnRight = (L, R, styrka) => {
            let F = 0;
            for (const pl of polesOf(L))
                for (const pr of polesOf(R)) {
                    const dx = pr.x - pl.x;
                    const d2 = dx * dx + 90;          // mjukning vid kontakt
                    F += pl.q * pr.q * Math.sign(dx) * KRAFT * styrka / d2;
                }
            return F;
        };

        // Fältlinje (RK4 längs fältet) — samma modell som stavmagnetsimuleringen
        const traceLine = (x0, y0, poles, W, H) => {
            const pts = [[x0, y0]];
            let x = x0, y = y0;
            const dirAt = (px, py) => {
                const [bx, by] = fieldAt(px, py, poles);
                const n = Math.hypot(bx, by) || 1;
                return [bx / n, by / n];
            };
            const M = 120;
            for (let i = 0; i < 1100; i++) {
                const ds = 3.4;
                const k1 = dirAt(x, y);
                const k2 = dirAt(x + 0.5 * ds * k1[0], y + 0.5 * ds * k1[1]);
                const k3 = dirAt(x + 0.5 * ds * k2[0], y + 0.5 * ds * k2[1]);
                const k4 = dirAt(x + ds * k3[0], y + ds * k3[1]);
                x += ds * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]) / 6;
                y += ds * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1]) / 6;
                pts.push([x, y]);
                if (x < -M || x > W + M || y < -M || y > H + M) break;
                let done = false;
                for (const p of poles) {
                    if (p.q < 0 && Math.hypot(x - p.x, y - p.y) < 13) {
                        pts.push([p.x, p.y]);
                        done = true;
                    }
                }
                if (done) break;
            }
            return pts;
        };

        const FsSlider = ({ label, value, min, max, step, onChange, valueText }) => (
            <div className="fs-row">
                <span className="fs-label" style={{ minWidth: 150 }} dangerouslySetInnerHTML={{ __html: label }} />
                <input type="range" min={min} max={max} step={step} value={value}
                       onChange={(e) => onChange(parseFloat(e.target.value))} />
                <span className="fs-value" style={{ minWidth: 60, textAlign: 'right' }}>{valueText}</span>
            </div>
        );

        const Slider = ({ label, sub, value, min, max, step, onChange, valueText }) => (
            <div className="mb-1">
                <div className="flex justify-between items-baseline mb-1">
                    <label className="text-sm font-bold" style={{ color: 'var(--lab-ink)' }}
                           dangerouslySetInnerHTML={{ __html: label }} />
                    <div className="font-mono font-semibold text-sm" style={{ color: 'var(--lab-accent)' }}>{valueText}</div>
                </div>
                <input type="range" min={min} max={max} step={step} value={value}
                       onChange={(e) => onChange(parseFloat(e.target.value))}
                       className="w-full cursor-pointer" />
                {sub && <div className="text-xs mt-1" style={{ color: 'var(--lab-ink-muted)' }}
                             dangerouslySetInnerHTML={{ __html: sub }} />}
            </div>
        );

        // ── Kraft–avståndsgrafen (pedagogisk centerpiece) ───────────────
        const ForceGraph = ({ styrka, attract, gapCm }) => {
            const W = 320, H = 170, padL = 40, padB = 34, padT = 14, padR = 12;
            const gw = W - padL - padR, gh = H - padT - padB;
            const dMin = 14, dMax = 300;                    // gap mellan magneterna i px
            const Fof = (gapPx) =>
                Math.abs(forceOnRight({ x: 0, y: 0, dir: attract ? 1 : -1 },
                                      { x: gapPx + 2 * HALF, y: 0, dir: 1 }, styrka));
            const yMax = Fof(dMin) * 1.05;
            const pts = [];
            for (let i = 0; i <= 70; i++) {
                const d = dMin + (dMax - dMin) * i / 70;
                const F = Fof(d);
                pts.push([padL + gw * (d - dMin) / (dMax - dMin),
                          padT + gh * (1 - Math.min(1, F / yMax))]);
            }
            const path = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
            const gapPx = Math.min(dMax, Math.max(dMin, gapCm * PX_PER_CM));
            const dotX = padL + gw * (gapPx - dMin) / (dMax - dMin);
            const dotY = padT + gh * (1 - Math.min(1, Fof(gapPx) / yMax));
            return (
                <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: 'auto', display: 'block' }}
                     role="img" aria-label="Graf över kraftens storlek mot avståndet mellan polerna: kurvan är hög vid små avstånd och faller brant när avståndet ökar. En punkt visar det aktuella avståndet.">
                    <line x1={padL} y1={padT + gh} x2={padL + gw + 6} y2={padT + gh} stroke="#38bdf8" strokeWidth="1.6" />
                    <polygon points={`${padL + gw + 12},${padT + gh} ${padL + gw + 4},${padT + gh - 3.4} ${padL + gw + 4},${padT + gh + 3.4}`} fill="#38bdf8" />
                    <line x1={padL} y1={padT + gh} x2={padL} y2={padT - 4} stroke="#38bdf8" strokeWidth="1.6" />
                    <polygon points={`${padL},${padT - 10} ${padL - 3.4},${padT - 2} ${padL + 3.4},${padT - 2}`} fill="#38bdf8" />
                    <path d={path} fill="none" stroke={COL.falt} strokeWidth="2.2" strokeLinejoin="round" />
                    <circle cx={dotX} cy={dotY} r="4.4" fill={COL.kraft} stroke="#f3eee4" strokeWidth="1.4" />
                    <text x={padL - 8} y={padT + 4} textAnchor="end" fontSize="11"
                          fill="var(--lab-ink-muted)" fontFamily="Poppins, sans-serif">
                        <tspan fontStyle="italic">F</tspan>
                    </text>
                    <text x={padL + gw + 2} y={padT + gh + 16} textAnchor="end" fontSize="11"
                          fill="var(--lab-ink-muted)" fontFamily="Poppins, sans-serif">Avstånd mellan magneterna</text>
                </svg>
            );
        };

        // ── Huvudapp ────────────────────────────────────────────────────
        const App = () => {
            const [show, setShow] = useState({ kraft: true, falt: true });
            const [running, setRunning] = useState(false);
            const [styrka, setStyrka] = useState(0.6);
            const [dirs, setDirs] = useState({ L: 1, R: 1 });   // dir = +1: N åt höger
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [controlsOpen, setControlsOpen] = useState(true);
            const [info, setInfo] = useState({ dcm: 0, pct: 0, laege: 'attraherar' });
            const [fontsReady, setFontsReady] = useState(0);
            const [resetTick, setResetTick] = useState(0);

            const sceneWrapRef = useRef(null);
            const canvasRef = useRef(null);
            const stRef = useRef(null);
            const pRef = useRef({});
            pRef.current = { show, running, styrka, dirs };

            useEffect(() => {
                if (document.fonts && document.fonts.ready)
                    document.fonts.ready.then(() => setFontsReady(1));
            }, []);

            useEffect(() => {
                const st = stRef.current;
                if (st) st.dirty = true;
            }, [fontsReady, styrka, dirs, show]);

            // Börja om: ställ tillbaka magneterna
            useEffect(() => {
                const st = stRef.current;
                if (!st) return;
                st.reset();
            }, [resetTick]);

            useEffect(() => {
                const wrap = sceneWrapRef.current;
                const canvas = canvasRef.current;
                if (!wrap || !canvas) return;
                const ctx = canvas.getContext('2d');

                const st = {
                    W: 0, H: 0, dpr: 1, benchY: 0,
                    L: { x: 0, y: 0, v: 0, dir: 1 },
                    R: { x: 0, y: 0, v: 0, dir: 1 },
                    stuck: false,
                    flash: 0,                     // "klick"-blixt när magneterna slår ihop
                    drag: null,
                    placed: false,
                    dirty: true,
                    lines: [], arrows: [],
                    lastInfo: 0,
                };
                stRef.current = st;

                st.reset = () => {
                    st.L.x = st.W * 0.28; st.R.x = st.W * 0.72;
                    st.L.v = 0; st.R.v = 0;
                    st.stuck = false;
                    st.dirty = true;
                };

                // Canvasen ligger I FLÖDET (inte absolut) så att mobil-CSS:ens
                // dockning (sektion 8) kan lägga verktygsrutorna under scenen.
                const sceneH = (w) => {
                    const narrow = window.matchMedia('(max-width: 600px)').matches;
                    const fs = document.fullscreenElement === wrap ||
                               document.webkitFullscreenElement === wrap;
                    if (fs) return narrow ? Math.round(window.innerHeight * 0.54) : wrap.clientHeight;
                    if (narrow) return Math.min(Math.round(w * 0.8), 400);
                    return wrap.clientHeight;
                };
                const resize = () => {
                    const w = wrap.clientWidth, h = sceneH(wrap.clientWidth);
                    if (!w || !h) return;
                    if (w === st.W && h === st.H) return;
                    st.dpr = Math.min(window.devicePixelRatio || 1, 2);
                    canvas.width = Math.round(w * st.dpr);
                    canvas.height = Math.round(h * st.dpr);
                    canvas.style.width = w + 'px';
                    canvas.style.height = h + 'px';
                    // behåll uppställningen proportionellt vid storleksändring
                    if (st.placed && st.pw) { st.L.x *= w / st.pw; st.R.x *= w / st.pw; }
                    st.pw = w;
                    st.W = w; st.H = h;
                    st.benchY = Math.round(h * 0.66);
                    st.L.y = st.benchY - HW; st.R.y = st.benchY - HW;
                    if (!st.placed) { st.reset(); st.placed = true; }
                    st.L.x = Math.min(Math.max(st.L.x, HALF + 8), w - HALF - 8);
                    st.R.x = Math.min(Math.max(st.R.x, HALF + 8), w - HALF - 8);
                    st.dirty = true;
                };
                const ro = new ResizeObserver(resize);
                ro.observe(wrap);
                resize();

                // ── Pekare: dra magneterna i sidled ──
                const pos = (e) => {
                    const r = canvas.getBoundingClientRect();
                    return [e.clientX - r.left, e.clientY - r.top];
                };
                const hit = (m, x, y) =>
                    Math.abs(x - m.x) < HALF + 10 && Math.abs(y - m.y) < HW + 14;
                const onDown = (e) => {
                    const [x, y] = pos(e);
                    const m = hit(st.L, x, y) ? st.L : hit(st.R, x, y) ? st.R : null;
                    if (!m) return;
                    st.drag = { m, dx: m.x - x };
                    m.v = 0;
                    canvas.setPointerCapture(e.pointerId);
                    e.preventDefault();
                };
                const onMove = (e) => {
                    if (!st.drag) return;
                    const [x] = pos(e);
                    const m = st.drag.m;
                    let nx = x + st.drag.dx;
                    nx = Math.min(Math.max(nx, HALF + 8), st.W - HALF - 8);
                    // magneterna kan inte passera genom varandra
                    if (m === st.L) nx = Math.min(nx, st.R.x - 2 * HALF);
                    else nx = Math.max(nx, st.L.x + 2 * HALF);
                    if (st.stuck && Math.abs(nx - m.x) > 0) st.stuck = false;
                    m.x = nx;
                    st.dirty = true;
                };
                const onUp = (e) => {
                    st.drag = null;
                    try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
                };
                canvas.addEventListener('pointerdown', onDown);
                canvas.addEventListener('pointermove', onMove);
                canvas.addEventListener('pointerup', onUp);
                canvas.addEventListener('pointercancel', onUp);

                // ── Fältbild ──
                const rebuildField = () => {
                    const poles = [...polesOf(st.L), ...polesOf(st.R)];
                    st.lines = []; st.arrows = [];
                    for (const m of [st.L, st.R]) {
                        const N = polesOf(m)[0];
                        const NL = 9;
                        for (let i = 0; i < NL; i++) {
                            const rel = (i / (NL - 1) - 0.5) * 2;
                            const th = (m.dir > 0 ? 0 : Math.PI) + rel * 2.45;
                            const x0 = N.x + Math.cos(th) * 14, y0 = N.y + Math.sin(th) * 14;
                            const pts = traceLine(x0, y0, poles, st.W, st.H);
                            if (pts.length < 8) continue;
                            st.lines.push(pts);
                            const ai = Math.floor(pts.length / 2);
                            const a = pts[ai], b = pts[Math.min(ai + 1, pts.length - 1)];
                            st.arrows.push({ x: a[0], y: a[1], ang: Math.atan2(b[1] - a[1], b[0] - a[0]) });
                        }
                    }
                    st.dirty = false;
                };

                // ── Ritfunktioner ──
                const drawPaper = () => {
                    const g = ctx.createLinearGradient(0, 0, 0, st.H);
                    g.addColorStop(0, '#f7f2e8');
                    g.addColorStop(1, '#ece3d2');
                    ctx.fillStyle = g;
                    ctx.fillRect(0, 0, st.W, st.H);
                    ctx.strokeStyle = 'rgba(96,130,175,0.18)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    for (let x = 26; x < st.W; x += 26) { ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, st.H); }
                    for (let y = 26; y < st.H; y += 26) { ctx.moveTo(0, y + 0.5); ctx.lineTo(st.W, y + 0.5); }
                    ctx.stroke();
                };

                const drawBench = () => {
                    // labbänk med träådring under magneterna
                    const y = st.benchY;
                    const h = st.H - y;
                    const g = ctx.createLinearGradient(0, y, 0, st.H);
                    g.addColorStop(0, '#dcc9a4');
                    g.addColorStop(1, '#c9b28a');
                    ctx.fillStyle = g;
                    ctx.fillRect(0, y, st.W, h);
                    // bänkkant
                    ctx.fillStyle = 'rgba(122,96,58,0.55)';
                    ctx.fillRect(0, y, st.W, 3);
                    // träådring — svaga vågiga linjer
                    ctx.strokeStyle = 'rgba(122,96,58,0.28)';
                    ctx.lineWidth = 1;
                    for (let k = 0; k < 6; k++) {
                        const yy = y + 14 + k * (h - 20) / 6;
                        ctx.beginPath();
                        for (let x = 0; x <= st.W; x += 14) {
                            const dy = Math.sin(x * 0.018 + k * 2.1) * 2.4 + Math.sin(x * 0.05 + k) * 1.1;
                            if (x === 0) ctx.moveTo(x, yy + dy);
                            else ctx.lineTo(x, yy + dy);
                        }
                        ctx.stroke();
                    }
                };

                const rr = (x, y, w, h, r) => {
                    ctx.beginPath();
                    if (!r) { ctx.rect(x, y, w, h); return; }
                    ctx.moveTo(x + r, y);
                    ctx.arcTo(x + w, y, x + w, y + h, r);
                    ctx.arcTo(x + w, y + h, x, y + h, r);
                    ctx.arcTo(x, y + h, x, y, r);
                    ctx.arcTo(x, y, x + w, y, r);
                    ctx.closePath();
                };

                const drawMagnet = (m) => {
                    ctx.save();
                    ctx.translate(m.x, m.y);
                    // skugga mot bänken
                    ctx.fillStyle = 'rgba(15,22,32,0.16)';
                    ctx.beginPath();
                    ctx.ellipse(0, HW + 2.5, HALF * 0.96, 4.5, 0, 0, 2 * Math.PI);
                    ctx.fill();
                    // syd- och nordhalva
                    ctx.fillStyle = COL.npol;
                    ctx.fillRect(m.dir > 0 ? 0 : -HALF, -HW, HALF, HW * 2);
                    ctx.fillStyle = COL.spol;
                    ctx.fillRect(m.dir > 0 ? -HALF : 0, -HW, HALF, HW * 2);
                    // glans
                    const gl = ctx.createLinearGradient(0, -HW, 0, HW);
                    gl.addColorStop(0, 'rgba(255,255,255,0.34)');
                    gl.addColorStop(0.45, 'rgba(255,255,255,0.05)');
                    gl.addColorStop(1, 'rgba(15,22,32,0.13)');
                    ctx.fillStyle = gl;
                    ctx.fillRect(-HALF, -HW, HALF * 2, HW * 2);
                    // kant
                    ctx.strokeStyle = '#5d646e';
                    ctx.lineWidth = 1.4;
                    ctx.strokeRect(-HALF, -HW, HALF * 2, HW * 2);
                    // bokstäver
                    ctx.font = '600 19px Poppins, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = '#ffffff';
                    ctx.fillText('N', m.dir * HALF / 2, 1.5);
                    ctx.fillStyle = COL.spolText;
                    ctx.fillText('S', -m.dir * HALF / 2, 1.5);
                    ctx.restore();
                };

                const drawLines = () => {
                    ctx.strokeStyle = COL.falt;
                    ctx.lineWidth = 1.5;
                    ctx.lineJoin = 'round';
                    ctx.globalAlpha = 0.85;
                    for (const pts of st.lines) {
                        ctx.beginPath();
                        ctx.moveTo(pts[0][0], pts[0][1]);
                        for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
                        ctx.stroke();
                    }
                    for (const a of st.arrows) {
                        ctx.save();
                        ctx.translate(a.x, a.y);
                        ctx.rotate(a.ang);
                        ctx.fillStyle = COL.falt;
                        ctx.beginPath();
                        ctx.moveTo(6, 0);
                        ctx.lineTo(-4.2, -4.3);
                        ctx.lineTo(-4.2, 4.3);
                        ctx.closePath();
                        ctx.fill();
                        ctx.restore();
                    }
                    ctx.globalAlpha = 1;
                };

                // Kraftpilar i gapet, som i teorifigurens repellerar/attraherar-
                // bild: vid attraktion pekar pilarna MOT varandra (svansen vid
                // respektive magnetände), vid repulsion pekar de UT från gapets
                // mitt mot var sin magnet. Pilarna är lika långa (Newtons
                // tredje lag) och längden växer med kraftens storlek.
                const drawForces = (F) => {
                    const gapL = st.L.x + HALF, gapR = st.R.x - HALF;
                    const gap = gapR - gapL;
                    if (gap < 4) return;
                    const y = st.L.y;
                    const mag = Math.abs(F);
                    // längdskala: mjuk logskala så pilarna växer tydligt när
                    // magneterna närmar sig utan att spränga gapet
                    const t = Math.min(1, Math.log10(1 + mag / 40) / 2.6);
                    const L = Math.min(gap / 2 - 4, 14 + t * 120);
                    if (L < 12) return;
                    const head = Math.max(9, Math.min(15, L * 0.5));
                    const arrow = (x0, dir) => {
                        // skaftet slutar vid pilhuvudets BAS; butt-ändar
                        ctx.strokeStyle = COL.kraft;
                        ctx.fillStyle = COL.kraft;
                        ctx.lineWidth = 3.4;
                        ctx.lineCap = 'butt';
                        ctx.beginPath();
                        ctx.moveTo(x0, y);
                        ctx.lineTo(x0 + dir * (L - head), y);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.moveTo(x0 + dir * L, y);
                        ctx.lineTo(x0 + dir * (L - head), y - 5.6);
                        ctx.lineTo(x0 + dir * (L - head), y + 5.6);
                        ctx.closePath();
                        ctx.fill();
                    };
                    if (F < 0) {
                        // attraktion: från magnetändarna in mot mitten
                        arrow(gapL + 2, +1);
                        arrow(gapR - 2, -1);
                    } else {
                        // repulsion: från gapets mitt ut mot var sin magnet
                        const c = (gapL + gapR) / 2;
                        arrow(c - 2, -1);
                        arrow(c + 2, +1);
                    }
                    // etikett F i fri yta ovanför gapet
                    ctx.font = 'italic 600 15px Poppins, sans-serif';
                    ctx.fillStyle = COL.kraft;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'alphabetic';
                    ctx.fillText('F', (gapL + gapR) / 2, y - HW - 10);
                };

                // ── Fysik + rendering ──
                let raf, last = performance.now();
                const loop = (now) => {
                    raf = requestAnimationFrame(loop);
                    const dt = Math.min((now - last) / 1000, 0.04);
                    last = now;
                    const p = pRef.current;

                    st.L.dir = p.dirs.L; st.R.dir = p.dirs.R;
                    const F = forceOnRight(st.L, st.R, p.styrka);   // på höger magnet
                    if (st.stuck && F > 0) st.stuck = false;        // pol vänd ⟹ släpper

                    if (p.running && !st.drag) {
                        // två magneter med friktion mot bänken
                        const step = (m, Fm) => {
                            if (st.stuck) return;
                            if (m.v === 0 && Math.abs(Fm) < F_STAT) return;
                            m.v += Fm * dt;
                            const damp = F_KIN * dt;
                            if (Math.abs(m.v) <= damp) m.v = 0;
                            else m.v -= Math.sign(m.v) * damp;
                            m.x += m.v * dt;
                        };
                        step(st.R, F);
                        step(st.L, -F);
                        // väggar
                        for (const m of [st.L, st.R]) {
                            if (m.x < HALF + 8) { m.x = HALF + 8; m.v = 0; }
                            if (m.x > st.W - HALF - 8) { m.x = st.W - HALF - 8; m.v = 0; }
                        }
                        // kollision mellan magneterna
                        if (st.R.x - st.L.x <= 2 * HALF) {
                            const mid = (st.R.x + st.L.x) / 2;
                            st.L.x = mid - HALF; st.R.x = mid + HALF;
                            if (F < 0 && !st.stuck) {
                                st.stuck = true;       // olika poler: de "klickar" ihop
                                st.flash = 1;
                            }
                            st.L.v = 0; st.R.v = 0;
                        }
                        if (Math.abs(st.L.v) > 1 || Math.abs(st.R.v) > 1) st.dirty = true;
                    }

                    if (st.dirty && p.show.falt) rebuildField();

                    // ── rita ──
                    ctx.setTransform(st.dpr, 0, 0, st.dpr, 0, 0);
                    drawPaper();
                    drawBench();
                    if (p.show.falt) drawLines();
                    drawMagnet(st.L);
                    drawMagnet(st.R);
                    if (p.show.kraft) drawForces(F);

                    // "klick"-blixt när magneterna slår ihop
                    if (st.flash > 0) {
                        st.flash = Math.max(0, st.flash - dt * 2.4);
                        const cx = (st.L.x + st.R.x) / 2, cy = st.L.y;
                        ctx.strokeStyle = 'rgba(37,99,201,' + (0.75 * st.flash).toFixed(3) + ')';
                        ctx.lineWidth = 2.2;
                        const r0 = 14 + (1 - st.flash) * 34;
                        for (let k = 0; k < 8; k++) {
                            const a = k * Math.PI / 4 + 0.4;
                            ctx.beginPath();
                            ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
                            ctx.lineTo(cx + Math.cos(a) * (r0 + 9), cy + Math.sin(a) * (r0 + 9));
                            ctx.stroke();
                        }
                    }

                    // avläsning (throttlad)
                    if (now - st.lastInfo > 140) {
                        st.lastInfo = now;
                        const gap = Math.max(0, st.R.x - st.L.x - 2 * HALF);
                        const dcm = gap / PX_PER_CM;
                        const mag = Math.abs(F);
                        const pct = Math.round(Math.min(1, Math.log10(1 + mag / 40) / 2.6) * 100);
                        const laege = st.stuck ? 'sitter ihop' : (F < 0 ? 'attraherar' : 'repellerar');
                        setInfo((old) =>
                            (old.pct === pct && old.laege === laege && Math.abs(old.dcm - dcm) < 0.05)
                                ? old : { dcm, pct, laege });
                    }
                };
                raf = requestAnimationFrame(loop);

                return () => {
                    cancelAnimationFrame(raf);
                    ro.disconnect();
                    canvas.removeEventListener('pointerdown', onDown);
                    canvas.removeEventListener('pointermove', onMove);
                    canvas.removeEventListener('pointerup', onUp);
                    canvas.removeEventListener('pointercancel', onUp);
                    stRef.current = null;
                };
            }, []);

            // ── Fullskärm ──
            useEffect(() => {
                const handler = () => {
                    const fs = document.fullscreenElement === sceneWrapRef.current ||
                        document.webkitFullscreenElement === sceneWrapRef.current;
                    setIsFullscreen(fs);
                    if (fs) setControlsOpen(false);
                };
                document.addEventListener('fullscreenchange', handler);
                document.addEventListener('webkitfullscreenchange', handler);
                return () => {
                    document.removeEventListener('fullscreenchange', handler);
                    document.removeEventListener('webkitfullscreenchange', handler);
                };
            }, []);
            const toggleFullscreen = () => {
                const el = sceneWrapRef.current;
                if (!el) return;
                if (document.fullscreenElement || document.webkitFullscreenElement)
                    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
            };

            const tShow = (key) => setShow((sh) => ({ ...sh, [key]: !sh[key] }));
            const flip = (which) => setDirs((d) => ({ ...d, [which]: -d[which] }));
            const attract = dirs.L === dirs.R;      // N mot S ⟹ attraktion

            return (
                <div className="min-h-screen dark-container px-4 md:px-8 pb-12" style={{ fontFamily: "'DM Sans', sans-serif" }}>
                    <div className="max-w-6xl mx-auto pt-6">
                        <div className="breadcrumb mb-4" style={{ fontSize: 13 }}>
                            <a href="index.html">Hem</a> / <a href="katalog.html#fy2">Fysik nivå 2</a> / Attraktion och repulsion
                        </div>
                        <div className="intro-head">
                            <h1 className="text-3xl md:text-4xl font-black tracking-tight" style={{ color: 'var(--lab-ink)' }}>Attraktion och repulsion</h1>
                            {/* Växlare till avsnittets andra simulering */}
                            <div className="sim-switch-wrap">
                                <span className="sim-switch-label">Simulering</span>
                                <div className="sim-switch">
                                    <a href="fysik2-stavmagnet-app.html">Stavmagnetens fält</a>
                                    <span className="sim-switch-active">Attraktion och repulsion</span>
                                </div>
                            </div>
                        </div>
                        <p className="mt-2 mb-5" style={{ color: 'var(--lab-ink-soft)', maxWidth: 820 }}>
                            <strong>Lika poler repellerar varandra och olika poler attraherar varandra.</strong> Här
                            ligger två stavmagneter på en labbänk: dra dem närmare varandra, vänd polerna på var och
                            en, och släpp dem sedan fria. Kraftpilarna i gapet visar kraften på varje magnet — lika
                            stora men motriktade — och fältbilden visar <em>varför</em>: mellan olika poler kopplar
                            fältlinjerna ihop magneterna, mellan lika poler trycks fältet undan. Magnetkraften verkar
                            på avstånd, men den avtar snabbt — magneterna börjar inte glida förrän kraften
                            övervinner friktionen mot bänken.
                        </p>

                        <main className="flex flex-col lg:flex-row gap-6">
                            {/* Scen */}
                            <div className="lg:w-3/5 order-1">
                                <div className="scene-wrap" data-theme="ljusPapper" ref={sceneWrapRef}>
                                    <canvas ref={canvasRef} />

                                    <div className="scene-info">
                                        <span className="si-lbl">Avstånd mellan magneterna</span>
                                        <span className="si-val">{fmt(info.dcm, 1)} cm</span>
                                        <span className="si-lbl" style={{ marginTop: 3 }}>Kraftens storlek</span>
                                        <div className="si-bar"><div style={{ width: info.pct + '%' }} /></div>
                                        <span className="si-ord">Magneterna {info.laege}</span>
                                    </div>

                                    <div className="scene-hint">Dra magneterna i sidled — släpp dem sedan fria</div>

                                    <div className="scene-toggles">
                                        <div className="st-title">Visa</div>
                                        <label><input type="checkbox" checked={show.kraft} onChange={() => tShow('kraft')} />
                                            <span className="st-swatch" style={{ background: COL.kraft }}></span>
                                            <span>Kraftpilar</span></label>
                                        <label><input type="checkbox" checked={show.falt} onChange={() => tShow('falt')} />
                                            <span className="st-swatch" style={{ background: COL.falt }}></span>
                                            <span>Fältbild</span></label>
                                        <div className="st-actions">
                                            <div className="st-row">
                                                <button className="btn-toggle btn-mini" onClick={() => flip('L')}>Vänd vänster</button>
                                                <button className="btn-toggle btn-mini" onClick={() => flip('R')}>Vänd höger</button>
                                            </div>
                                            <button className={`btn-toggle ${running ? 'active' : ''}`}
                                                    onClick={() => setRunning((r) => !r)}>
                                                {running ? 'Håll fast magneterna' : 'Släpp magneterna'}
                                            </button>
                                            <button className="btn-toggle" onClick={() => { setRunning(false); setResetTick((t) => t + 1); }}>
                                                Börja om
                                            </button>
                                        </div>
                                    </div>

                                    {/* Fullskärm: glidaren i en hopfällbar panel i underkant */}
                                    {isFullscreen && (
                                        <React.Fragment>
                                            <div className={`fs-controls ${controlsOpen ? '' : 'collapsed'}`}>
                                                <FsSlider label="Magneternas styrka" value={styrka}
                                                          min={0.2} max={1.2} step={0.05} onChange={setStyrka}
                                                          valueText={`${fmt(styrka * 100, 0)} %`} />
                                            </div>
                                            <button className="fs-toggle-handle" onClick={() => setControlsOpen((o) => !o)}
                                                    title={controlsOpen ? 'Dölj reglage' : 'Visa reglage'}
                                                    aria-expanded={controlsOpen}>
                                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                     strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"
                                                     style={{ transform: controlsOpen ? 'rotate(0deg)' : 'rotate(180deg)' }}>
                                                    <path d="M6 9l6 6 6-6"/>
                                                </svg>
                                                <span>{controlsOpen ? 'Dölj reglage' : 'Reglage'}</span>
                                            </button>
                                        </React.Fragment>
                                    )}

                                    <button className="fs-btn" onClick={toggleFullscreen} aria-label="Fullskärm"
                                            title={isFullscreen ? 'Lämna fullskärm' : 'Fullskärm'}>
                                        {isFullscreen ? (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M9 3v6H3" /><path d="M15 21v-6h6" /><path d="M21 9h-6V3" /><path d="M3 15h6v6" />
                                            </svg>
                                        ) : (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M3 9V3h6" /><path d="M21 9V3h-6" /><path d="M3 15v6h6" /><path d="M21 15v6h-6" />
                                            </svg>
                                        )}
                                    </button>
                                </div>
                            </div>

                            {/* Sidopanel */}
                            <div className="lg:w-2/5 order-2">
                                <div className="glass-card rounded-xl p-4 mb-3">
                                    <Slider label="Magneternas styrka"
                                            sub="Starkare magneter ⟹ kraften känns på längre avstånd."
                                            value={styrka} min={0.2} max={1.2} step={0.05} onChange={setStyrka}
                                            valueText={`${fmt(styrka * 100, 0)} %`} />
                                </div>

                                <div className="glass-card rounded-xl p-4 mb-3">
                                    <div className="flbl mb-1">Kraftens storlek mot avståndet</div>
                                    <ForceGraph styrka={styrka} attract={attract} gapCm={info.dcm} />
                                    <p className="text-xs mt-1" style={{ color: 'var(--lab-ink-muted)' }}>
                                        Punkten visar det aktuella avståndet. Kurvan faller brant: redan på några
                                        centimeters håll är kraften nästan borta — men nära polerna växer den
                                        våldsamt. Det är därför två magneter "hugger tag" först i sista stunden.
                                    </p>
                                </div>

                                <div className="glass-card rounded-xl p-4 mb-3">
                                    <div className="flbl mb-2">Testa själv</div>
                                    <ul className="space-y-2 text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                        <li><strong>Ställ magneterna en bit isär och släpp dem</strong> — inget händer.
                                            Skjut dem sedan närmare tills magnetkraften övervinner friktionen.</li>
                                        <li><strong>Vänd ena magneten</strong> så att lika poler möts, ställ dem nära
                                            och släpp — de glider ifrån varandra.</li>
                                        <li><strong>Följ fältbilden</strong>: mellan olika poler går fältlinjerna
                                            från den ena magnetens nordända in i den andras sydända.</li>
                                        <li><strong>Jämför kraftpilarna</strong> — de är alltid lika långa och
                                            motriktade, oavsett avstånd.</li>
                                    </ul>
                                </div>
                            </div>
                        </main>

                        {/* Pedagogiska sektioner */}
                        <div className="grid md:grid-cols-3 gap-4 mt-6">
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Lika repellerar, olika attraherar</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Vänds två nordändar (eller två sydändar) mot varandra trycks magneterna isär.
                                    Vänds en nordända mot en sydända dras de ihop. Jämför med elektriska laddningar:
                                    lika laddningar stöter bort varandra, olika dras till varandra — samma mönster.
                                </p>
                            </div>
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Kraft på avstånd</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Precis som gravitationen och den elektriska kraften verkar magnetiska krafter
                                    på avstånd — magneterna behöver inte röra vid varandra. Men kraften avtar snabbt
                                    med avståndet: i simuleringen ligger magneterna stilla tills de kommer så nära
                                    att magnetkraften övervinner friktionen mot bänken.
                                </p>
                            </div>
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Krafterna är alltid lika stora</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Kraften på den ena magneten är alltid lika stor som kraften på den andra, fast
                                    motriktad — det är Newtons tredje lag. Det gäller även om den ena magneten vore
                                    mycket större: en liten kylskåpsmagnet drar i jättemagneten precis lika hårt som
                                    jättemagneten drar i den.
                                </p>
                            </div>
                        </div>

                        <details className="glass-card rounded-xl p-4 mt-4">
                            <summary className="accordion-head" style={{ color: 'var(--lab-ink)' }}>
                                <span>Vanliga missuppfattningar</span><span style={{ color: 'var(--lab-ink-muted)' }}>▾</span>
                            </summary>
                            <ul className="mt-3 space-y-2 text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                <li><strong>"Den större magneten drar hårdast."</strong> Nej — krafterna på de två magneterna är alltid lika stora och motriktade (Newtons tredje lag). En starkare magnet ger ett starkare kraftpar, men aldrig en ensidig kraft.</li>
                                <li><strong>"Magneter attraherar alltid."</strong> Bara olika poler attraherar. Två lika poler repellerar — därför känns det som en osynlig kudde när du försöker pressa ihop två nordändar.</li>
                                <li><strong>"Kraften avtar jämnt med avståndet."</strong> Den avtar mycket snabbare än så — dubbelt så långt bort är kraften långt mindre än hälften. Titta på kurvans branta fall i grafen.</li>
                                <li><strong>"Norrändan är plus och söderändan minus."</strong> Magnetpoler är inte laddningar. De uppträder alltid parvis: delar du en magnet får du två nya magneter, aldrig en ensam nord- eller sydpol.</li>
                            </ul>
                        </details>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script src="feedback.js" defer></script>
    <script src="sim-dock.js" defer></script>
    <script src="data/katalog.js"></script>
    <script src="section-nav.js"></script>
</body>
</html>
