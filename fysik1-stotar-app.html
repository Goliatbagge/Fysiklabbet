                        <span className="anm">{fraga.enhet}</span>
                        {!gst.klar && <button className="btn-toggle btn-prim" onClick={svara}>Svara</button>}
                    </div>
                    {gst.resultat && gst.resultat.typ === 'tom' && <p className="anm mt-2">Skriv ett tal, till exempel 0,25 eller −0,15.</p>}
                    {gst.resultat && gst.resultat.typ === 'forsok' && (
                        <p className="anm mt-2 svar-fel">Inte riktigt. Ställ upp rörelsemängden före och efter stöten och försök en gång till.</p>
                    )}
                    {gst.klar && (
                        <div className={'anm mt-2 ' + (gst.resultat.typ === 'ratt' ? 'svar-ok' : 'svar-fel')}>
                            <p><b>{gst.resultat.typ === 'ratt' ? `Rätt, ${gst.resultat.pts} poäng.` : `Svaret är ${fmt(fraga.facit, 2)} ${fraga.enhet}.`}</b></p>
                            <p className="mt-1" dangerouslySetInnerHTML={{ __html: fraga.forklaring }} />
                            <button className="btn-toggle mt-2" onClick={() => nyUppgift()}>Ny uppgift</button>
                        </div>
                    )}
                    {!gst.klar && (
                        <p className="anm mt-2">Simuleringen stannar precis när stöten sker. Svara, så får du se resten.</p>
                    )}
                </div>
            );

            // Mätvärdestabellen
            const efterKant = M.harStot && S.efter && !gom;
            const tE = (x) => efterKant ? x : '–';
            const pfA = mul(M.fore.vA, M.mA), pfB = mul(M.fore.vB, M.mB);
            const peA = M.efter ? mul(M.efter.vA, M.mA) : null, peB = M.efter ? mul(M.efter.vB, M.mB) : null;
            const EfA = M.mA * dot(M.fore.vA, M.fore.vA) / 2, EfB = M.mB * dot(M.fore.vB, M.fore.vB) / 2;
            const EeA = M.efter ? M.mA * dot(M.efter.vA, M.efter.vA) / 2 : 0, EeB = M.efter ? M.mB * dot(M.efter.vB, M.efter.vB) / 2 : 0;
            const matt = (
                <div className="glass-card rounded-xl p-3">
                    <div className="flbl mb-2">Mätvärden</div>
                    <div className="matt-wrap">
                        <table className="matt">
                            <thead>
                                <tr><th></th><th style={{ color: COL.A }}>A</th><th style={{ color: COL.B }}>B</th><th>Totalt</th></tr>
                            </thead>
                            <tbody>
                                <tr><td>Massa (kg)</td><td>{fmt(M.mA, 2)}</td><td>{fmt(M.mB, 2)}</td><td>{fmt(M.mA + M.mB, 2)}</td></tr>
                                {aktivDim === '1d' ? (
                                    <React.Fragment>
                                        <tr><td>Hastighet före (m/s)</td><td>{fmt(M.fore.vA.x, 2)}</td><td>{fmt(M.fore.vB.x, 2)}</td><td></td></tr>
                                        <tr><td>Hastighet efter (m/s)</td><td>{tE(fmt(M.efter && M.efter.vA.x, 2))}</td><td>{tE(fmt(M.efter && M.efter.vB.x, 2))}</td><td></td></tr>
                                        <tr className="summa"><td>Rörelsemängd före (kg · m/s)</td><td>{fmt(pfA.x, 3)}</td><td>{fmt(pfB.x, 3)}</td><td>{fmt(pfA.x + pfB.x, 3)}</td></tr>
                                        <tr className="summa"><td>Rörelsemängd efter (kg · m/s)</td><td>{tE(fmt(peA && peA.x, 3))}</td><td>{tE(fmt(peB && peB.x, 3))}</td><td>{tE(fmt(peA && peA.x + peB.x, 3))}</td></tr>
                                    </React.Fragment>
                                ) : (
                                    <React.Fragment>
                                        <tr><td>Fart före (m/s)</td><td>{fmt(len(M.fore.vA), 2)}</td><td>{fmt(len(M.fore.vB), 2)}</td><td></td></tr>
                                        <tr><td>Fart efter (m/s)</td><td>{tE(fmt(M.efter && len(M.efter.vA), 2))}</td><td>{tE(fmt(M.efter && len(M.efter.vB), 2))}</td><td></td></tr>
                                        <tr className="summa"><td><em>p</em><sub>x</sub> före (kg · m/s)</td><td>{fmt(pfA.x, 3)}</td><td>{fmt(pfB.x, 3)}</td><td>{fmt(pfA.x + pfB.x, 3)}</td></tr>
                                        <tr className="summa"><td><em>p</em><sub>x</sub> efter (kg · m/s)</td><td>{tE(fmt(peA && peA.x, 3))}</td><td>{tE(fmt(peB && peB.x, 3))}</td><td>{tE(fmt(peA && peA.x + peB.x, 3))}</td></tr>
                                        <tr className="summa"><td><em>p</em><sub>y</sub> före (kg · m/s)</td><td>{fmt(pfA.y, 3)}</td><td>{fmt(pfB.y, 3)}</td><td>{fmt(pfA.y + pfB.y, 3)}</td></tr>
                                        <tr className="summa"><td><em>p</em><sub>y</sub> efter (kg · m/s)</td><td>{tE(fmt(peA && peA.y, 3))}</td><td>{tE(fmt(peB && peB.y, 3))}</td><td>{tE(fmt(peA && peA.y + peB.y, 3))}</td></tr>
                                    </React.Fragment>
                                )}
                                {M.typ === 'isar' && <tr><td>Fjäderns energi (J)</td><td></td><td></td><td>{fmt(M.E, 3)}</td></tr>}
                                <tr><td>Rörelseenergi före (J)</td><td>{fmt(EfA, 3)}</td><td>{fmt(EfB, 3)}</td><td>{fmt(EfA + EfB, 3)}</td></tr>
                                <tr><td>Rörelseenergi efter (J)</td><td>{tE(fmt(EeA, 3))}</td><td>{tE(fmt(EeB, 3))}</td><td>{tE(fmt(EeA + EeB, 3))}</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            );

            const tShow = (k) => setShow((s) => ({ ...s, [k]: !s[k] }));
            const forsokLista = dim === '1d' ? FORSOK_1D : FORSOK_2D;
            const forsokId = dim === '1d' ? forsok1 : forsok2;
            const forsokObj = forsokLista.find((f) => f.id === forsokId);

            const sceneToggles = () => {
                if (!togglesOpen) return (
                    <button className="st-show-btn" onClick={() => setTogglesOpen(true)}
                            aria-label="Visa inställningar" title="Visa inställningar" aria-expanded="false">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             strokeWidth="2" strokeLinecap="round" aria-hidden="true">
                            <line x1="4" y1="8" x2="20" y2="8" /><circle cx="14.5" cy="8" r="2.7" fill="currentColor" stroke="none" />
                            <line x1="4" y1="16" x2="20" y2="16" /><circle cx="9.5" cy="16" r="2.7" fill="currentColor" stroke="none" />
                        </svg>
                    </button>
                );
                return (
                    <div className="scene-toggles">
                        <button className="st-hide" onClick={() => setTogglesOpen(false)}
                                aria-label="Dölj inställningar" title="Dölj inställningar" aria-expanded="true">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 strokeWidth="2.4" strokeLinecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
                        </button>
                        <div className="st-title">Visa</div>
                        <label><input type="checkbox" checked={show.pilar} onChange={() => tShow('pilar')} /><span className="st-swatch" style={{ background: COL.A }}></span><span>Hastighetspilar</span></label>
                        <label><input type="checkbox" checked={show.strob} onChange={() => tShow('strob')} /><span className="st-swatch" style={{ background: COL.B }}></span><span>Stroboskop, var {aktivDim === '1d' ? '0,1' : '0,2'} s</span></label>
                        <label><input type="checkbox" checked={show.cm} onChange={() => tShow('cm')} /><span className="st-swatch" style={{ background: COL.ink }}></span><span>Masscentrum</span></label>
                        {isFullscreen && (
                            <React.Fragment>
                                <div className="st-title mt">Läge</div>
                                <label><input type="radio" name="lage-fs" checked={!gissa} onChange={() => valjLage('fri')} /><span>Utforska</span></label>
                                <label><input type="radio" name="lage-fs" checked={gissa} onChange={() => valjLage('gissa')} /><span>Testa dig själv</span></label>
                                <div className="st-title mt">Rörelse</div>
                                <label><input type="radio" name="dim-fs" checked={dim === '1d'} onChange={() => valjDim('1d')} /><span>En dimension</span></label>
                                <label><input type="radio" name="dim-fs" checked={dim === '2d'} onChange={() => valjDim('2d')} /><span>Två dimensioner</span></label>
                                {!gissa && (
                                    <React.Fragment>
                                        <div className="st-title mt">Stöt</div>
                                        {typKnappar.map(([k, t2]) => (
                                            <label key={k}><input type="radio" name="typ-fs" checked={typ === k} onChange={() => valjTyp(k)} /><span>{t2}</span></label>
                                        ))}
                                        <div className="st-title mt">Färdigt försök</div>
                                        <select value={forsokId || ''} onChange={(e) => { const f = forsokLista.find((x) => x.id === e.target.value); if (f) valjForsok(f); }} aria-label="Färdigt försök">
                                            <option value="">Egen inställning</option>
                                            {forsokLista.map((f) => <option key={f.id} value={f.id}>{f.namn}</option>)}
                                        </select>
                                        <div className="st-title mt">Reglage</div>
                                        <div className="st-sliders">{reglage(true)}</div>
                                    </React.Fragment>
                                )}
                                <div className="st-title mt">Tidsförlopp</div>
                                {fartval('fart-fs')}
                                <div className="st-actions">{styrknappar}</div>
                                {gissa && <div className="st-panels">{testPanel}</div>}
                            </React.Fragment>
                        )}
                    </div>
                );
            };

            return (
                <div className="min-h-screen px-4 md:px-8 pb-12" style={{ fontFamily: "'DM Sans', sans-serif" }}>
                    <div className="max-w-6xl mx-auto pt-6">
                        <div className="breadcrumb mb-4" style={{ fontSize: 13 }}>
                            <a href="index.html">Hem</a> / <a href="katalog.html?id=fy1">Fysik nivå 1</a> / Elastisk och oelastisk stöt
                        </div>
                        <h1 className="text-3xl md:text-4xl font-black tracking-tight" style={{ color: 'var(--lab-ink)' }}>Elastisk och oelastisk stöt</h1>
                        <p className="mt-2 mb-5" style={{ color: 'var(--lab-ink-soft)', maxWidth: 860 }}>
                            Två vagnar krockar på en luftkuddebana, eller två puckar på ett airhockeybord. Välj om de ska studsa isär
                            (elastisk stöt) eller haka i varandra (oelastisk stöt) och starta. Diagrammet under visar rörelsemängden:
                            pilarna för A och B läggs efter varandra, och den streckade summapilen är exakt lika lång före och efter
                            stöten. Rörelseenergin bevaras däremot bara när föremålen studsar. Dra i vagnarna och puckarna för att flytta
                            dem och i pilspetsarna för att ändra hastigheten.
                        </p>

                        <FormulaCard M={M} S={S} gom={gom} />

                        <main className="flex flex-col lg:flex-row gap-6">
                            <div className="lg:w-2/3 order-1">
                                <div className={'scene-wrap' + (isFullscreen ? ' is-fs' : '') + (bredFs ? ' fs-bred' : '')}
                                     data-theme="ljusPapper" ref={sceneWrapRef} style={{ aspectRatio: `${W} / ${aktivDim === '1d' ? H1 : H}` }}>
                                    {aktivDim === '1d'
                                        ? <Scen1D svgRef={svgRef} M={M} P={aktivP} t={tv} S={S} show={show} gissa={gissa} gom={gom}
                                                  onDown={onDown} onMove={onMove} onUp={onUp} />
                                        : <Scen2D svgRef={svgRef} M={M} t={tv} S={S} show={show} gissa={gissa} gom={gom}
                                                  onDown={onDown} onMove={onMove} onUp={onUp} />}
                                    {sceneToggles()}
                                    <button className="fs-btn" onClick={toggleFullscreen} aria-label="Fullskärm"
                                            title={isFullscreen ? 'Lämna fullskärm' : 'Fullskärm'}>
                                        {isFullscreen ? (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M9 3v6H3" /><path d="M15 21v-6h6" /><path d="M21 9h-6V3" /><path d="M3 15h6v6" />
                                            </svg>
                                        ) : (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M3 9V3h6" /><path d="M21 9V3h-6" /><path d="M3 15v6h6" /><path d="M21 15v6h-6" />
                                            </svg>
                                        )}
                                    </button>
                                </div>
                                {!isFullscreen && <div className="mt-3">{styrknappar}</div>}
                                <p className="anm mt-2">
                                    {gissa
                                        ? 'Räkna ut svaret med rörelsemängdslagen. Efter svaret spelas resten av stöten upp.'
                                        : aktivDim === '1d'
                                            ? 'Dra i vagnarna för att flytta dem och i de streckade ringarna vid pilspetsarna för att ändra hastigheten. Prickarna på remsan sätts var 0,1 s, så avståndet mellan dem visar farten.'
                                            : 'Dra i puckarna för att flytta dem och i de streckade ringarna vid pilspetsarna för att ändra hastighetens storlek och riktning. De bleka ringarna på bordet är puckarnas lägen var 0,2 s.'}
                                </p>
                                <div className="mt-3">{matt}</div>
                            </div>

                            <div className="lg:w-1/3 order-2 flex flex-col gap-3">
                                <div className="glass-card rounded-xl p-3">
                                    <div className="flbl mb-2">Läge</div>
                                    <div className="seg" style={{ gridTemplateColumns: '1fr 1fr' }}>
                                        <button className={!gissa ? 'active' : ''} onClick={() => valjLage('fri')}>Utforska</button>
                                        <button className={gissa ? 'active' : ''} onClick={() => valjLage('gissa')}>Testa dig själv</button>
                                    </div>
                                    <div className="flbl mt-3 mb-2">Rörelse</div>
                                    <div className="seg" style={{ gridTemplateColumns: '1fr 1fr' }}>
                                        <button className={dim === '1d' ? 'active' : ''} onClick={() => valjDim('1d')}>En dimension</button>
                                        <button className={dim === '2d' ? 'active' : ''} onClick={() => valjDim('2d')}>Två dimensioner</button>
                                    </div>
                                    {!gissa && (
                                        <React.Fragment>
                                            <div className="flbl mt-3 mb-2">Stöt</div>
                                            <div className="seg" style={{ gridTemplateColumns: `repeat(${typKnappar.length}, 1fr)` }}>
                                                {typKnappar.map(([k, t2]) => (
                                                    <button key={k} className={typ === k ? 'active' : ''} onClick={() => valjTyp(k)}>{t2}</button>
                                                ))}
                                            </div>
                                            <p className="anm mt-2">
                                                {typ === 'elastisk' ? 'Fjädrande stötfångare: föremålen studsar isär och har varsin hastighet efteråt.'
                                                    : typ === 'oelastisk' ? 'Kardborreband: föremålen hakar i varandra och fortsätter med en gemensam hastighet.'
                                                    : 'En hoptryckt fjäder hålls ihop av en tråd. När tråden går av knuffas vagnarna isär.'}
                                            </p>
                                        </React.Fragment>
                                    )}
                                    {gissa && (
                                        <p className="anm mt-3">
                                            Du får en slumpad stöt och en fråga. Simuleringen stannar när stöten sker, och det som händer efteråt visas
                                            först när du har svarat. Rätt på första försöket ger 3 poäng, på andra 1 poäng.
                                        </p>
                                    )}
                                </div>

                                {testPanel}

                                {!gissa && (
                                    <div className="glass-card rounded-xl p-3">
                                        <div className="flbl mb-2">Färdiga försök</div>
                                        <div className="forsok">
                                            {forsokLista.map((f) => (
                                                <button key={f.id} className={forsokId === f.id ? 'active' : ''} onClick={() => valjForsok(f)}>{f.namn}</button>
                                            ))}
                                        </div>
                                        {forsokObj && <p className="anm mt-2" dangerouslySetInnerHTML={{ __html: forsokObj.text }} />}
                                    </div>
                                )}

                                {!gissa && (
                                    <div className="glass-card rounded-xl p-3">
                                        <div className="flbl mb-2">Reglage</div>
                                        {reglage(false)}
                                    </div>
                                )}

                                <div className="glass-card rounded-xl p-3">
                                    <div className="flbl mb-2">Tidsförlopp</div>
                                    <div className="seg" style={{ gridTemplateColumns: 'repeat(3, 1fr)' }}>
                                        {[[0.25, 'Ultrarapid'], [0.5, 'Långsamt'], [1, 'Normalt']].map(([v, t2]) => (
                                            <button key={v} className={speed === v ? 'active' : ''} onClick={() => setSpeed(v)}>{t2}</button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </main>

                        <details className="glass-card rounded-xl p-4 mt-6">
                            <summary className="accordion-head">
                                <span>Så hänger det ihop</span>
                                <span aria-hidden="true">+</span>
                            </summary>
                            <ul className="mt-3 space-y-2" style={{ color: 'var(--lab-ink-soft)', fontSize: 14.5, lineHeight: 1.55, paddingLeft: 18, listStyle: 'disc' }}>
                                <li>Rörelsemängden är massa gånger hastighet, <em>p</em> = <em>m</em> · <em>v</em>, med enheten kg · m/s. Den är en vektor och pekar åt samma håll som hastigheten. Därför räknas en hastighet åt vänster med minustecken.</li>
                                <li>Under stöten verkar vagnarna på varandra med lika stora och motriktade krafter under samma tid. Impulserna är alltså lika stora och motriktade, och det A förlorar i rörelsemängd får B. Summan ändras inte, och det är rörelsemängdslagen.</li>
                                <li>I en <b>elastisk stöt</b> studsar föremålen isär. Med en perfekt fjädrande stötfångare bevaras även rörelseenergin, som i simuleringen. Riktiga stötar förlorar alltid lite energi.</li>
                                <li>I en <b>oelastisk stöt</b> hakar föremålen i varandra och fortsätter tillsammans: <em>m</em><sub>A</sub> · <em>v</em><sub>A</sub> + <em>m</em><sub>B</sub> · <em>v</em><sub>B</sub> = (<em>m</em><sub>A</sub> + <em>m</em><sub>B</sub>) · <em>v</em>. Rörelsemängden bevaras, men en del av rörelseenergin blir värme och deformation.</li>
                                <li>När två vagnar knuffas isär från stillastående är den totala rörelsemängden noll både före och efter. Rörelsemängderna blir lika stora och motriktade, så den tyngre vagnen får lägre fart.</li>
                                <li>I två dimensioner gäller rörelsemängdslagen i <em>x</em>-led och i <em>y</em>-led var för sig. I diagrammet läggs vektorerna efter varandra, och summan pekar åt samma håll och är lika lång före och efter stöten.</li>
                                <li>Masscentrum är den punkt där massan i genomsnitt finns. Det rör sig med konstant hastighet hela tiden, även genom stöten, eftersom inga yttre krafter verkar på vagnarna.</li>
                            </ul>
                        </details>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script src="feedback.js" defer></script>
    <script src="sim-dock.js" defer></script>
    <script src="data/katalog.js"></script>
    <script src="section-nav.js"></script>

</body>
