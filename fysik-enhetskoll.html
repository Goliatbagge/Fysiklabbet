                    id: i,
                    color: colors[i % colors.length],
                    left: Math.random() * 100,
                    delay: Math.random() * 2,
                    duration: 2 + Math.random() * 3,
                    size: 6 + Math.random() * 10

                    style: {
                        background: 'linear-gradient(135deg, #0ea5e9, #38bdf8)',
                        boxShadow: '0 0 20px rgba(200, 50, 74, 0.3)',
                        fontFamily: "'Poppins', sans-serif",
                        cursor: 'pointer',
                        border: 'none',
                        fontSize: '1rem'
                    },
                    onClick: onContinue
                }, `Starta runda ${round + 1}`)
            );
        }

        function WrongAnswerOverlay({ wrongUnit, wrongExplanation, correctText, onDismiss }) {
            return React.createElement('div', {
                className: 'bonus-overlay',
                onClick: onDismiss
            },
                React.createElement('div', {
                    className: 'wrong-banner rounded-2xl px-8 py-8 text-center',
                    onClick: (e) => e.stopPropagation()
                },
                    React.createElement('p', {
                        className: 'text-red-400 font-bold text-lg mb-2',
                        style: { fontFamily: "'Poppins', sans-serif" }
                    }, `Du valde ${wrongUnit}`),
                    React.createElement('p', {
                        className: 'text-slate-300 text-base mb-5',
                        style: { fontFamily: "'Poppins', sans-serif", lineHeight: '1.6' }
                    }, wrongExplanation),
                    React.createElement('div', {
                        className: 'rounded-xl px-5 py-3 mb-6',
                        style: { background: 'rgba(34, 197, 94, 0.1)', border: '1px solid rgba(34, 197, 94, 0.3)' }
                    },
                        React.createElement('p', {
                            className: 'text-green-400 font-bold text-base',
                            style: { fontFamily: "'Poppins', sans-serif" }
                        }, correctText)
                    ),
                    React.createElement('button', {
                        className: 'px-6 py-2.5 rounded-xl font-semibold text-white text-sm',
                        style: {
                            background: 'linear-gradient(135deg, #ef4444, #dc2626)',
                            border: 'none',
                            cursor: 'pointer',
                            fontFamily: "'Poppins', sans-serif"
                        },
                        onClick: onDismiss
                    }, 'Jag förstår!')
                )
            );
        }

        function BonusOverlay({ text, onDismiss }) {
            return React.createElement('div', {
                className: 'bonus-overlay',
                onClick: onDismiss
            },
                React.createElement('div', {
                    className: 'bonus-banner rounded-2xl px-8 py-8 text-center',
                    onClick: (e) => e.stopPropagation()
                },
                    React.createElement('p', {
                        className: 'text-amber-300 font-bold text-xl mb-6',
                        style: { fontFamily: "'Poppins', sans-serif", lineHeight: '1.5' }
                    }, text),
                    React.createElement('button', {
                        className: 'px-6 py-2.5 rounded-xl font-semibold text-white text-sm',
                        style: {
                            background: 'linear-gradient(135deg, #f59e0b, #d97706)',
                            border: 'none',
                            cursor: 'pointer',
                            fontFamily: "'Poppins', sans-serif"
                        },
                        onClick: onDismiss
                    }, 'Uppfattat!')
                )
            );
        }

        function Quiz({ chapterId, mode }) {
            const chapter = CHAPTERS[chapterId];
            const allQuestions = mode === 'units' ? chapter.units : (chapter.symbols || []);
            const [currentQuestions, setCurrentQuestions] = useState(() => shuffle(allQuestions));
            const [currentIndex, setCurrentIndex] = useState(0);
            const [results, setResults] = useState({});
            const [selectedAnswer, setSelectedAnswer] = useState(null);
            const [round, setRound] = useState(1);
            const [showSummary, setShowSummary] = useState(false);
            const [wrongThisRound, setWrongThisRound] = useState([]);
            const [allDone, setAllDone] = useState(false);
            const [showBonus, setShowBonus] = useState(null);
            const [showWrongInfo, setShowWrongInfo] = useState(null);
            const pendingAdvance = React.useRef(null);

            useEffect(() => {
                setCurrentQuestions(shuffle(allQuestions));
                setCurrentIndex(0);
                setResults({});
                setSelectedAnswer(null);
                setRound(1);
                setShowSummary(false);
                setWrongThisRound([]);
                setAllDone(false);
                setShowBonus(null);
                setShowWrongInfo(null);
            }, [mode, chapterId]);

            const question = currentQuestions[currentIndex];
            const correctAnswer = question ? (question.correct) : null;

            const advanceToNext = useCallback((isCorrect, updatedWrongThisRound) => {
                if (currentIndex < currentQuestions.length - 1) {
                    setCurrentIndex(prev => prev + 1);
                    setSelectedAnswer(null);
                } else {
                    if (updatedWrongThisRound.length === 0) {
                        setAllDone(true);
                    }
                    setShowSummary(true);
                }
            }, [currentIndex, currentQuestions]);

            const handleAnswer = useCallback((answer) => {
                setSelectedAnswer(answer);
                const isCorrect = answer === correctAnswer;
                setResults(prev => ({ ...prev, [currentIndex]: isCorrect }));
                const newWrong = !isCorrect ? [...wrongThisRound, question] : wrongThisRound;
                if (!isCorrect) {
                    setWrongThisRound(newWrong);
                }

                if (isCorrect && question.bonusInfo) {
                    setTimeout(() => {
                        setShowBonus(question.bonusInfo);
                        pendingAdvance.current = () => advanceToNext(isCorrect, newWrong);
                    }, 800);
                } else if (!isCorrect && question.wrongInfo && question.wrongInfo[answer]) {
                    setTimeout(() => {
                        setShowWrongInfo({
                            wrongUnit: answer,
                            wrongExplanation: question.wrongInfo[answer],
                            correctText: question.ratt
                                || `SI-enheten för ${question.quantity.toLowerCase()} är ${question.correct}`,
                        });
                        pendingAdvance.current = () => advanceToNext(isCorrect, newWrong);
                    }, 800);
                } else {
                    setTimeout(() => {
                        advanceToNext(isCorrect, newWrong);
                    }, 1200);
                }
            }, [currentIndex, correctAnswer, question, wrongThisRound, advanceToNext]);

            const handleContinue = useCallback(() => {
                if (allDone) {
                    setCurrentQuestions(shuffle(allQuestions));
                    setCurrentIndex(0);
                    setResults({});
                    setSelectedAnswer(null);
                    setRound(1);
                    setShowSummary(false);
                    setWrongThisRound([]);
                    setAllDone(false);
                } else {
                    setCurrentQuestions(shuffle(wrongThisRound));
                    setCurrentIndex(0);
                    setResults({});
                    setSelectedAnswer(null);
                    setRound(prev => prev + 1);
                    setShowSummary(false);
                    setWrongThisRound([]);
                }
            }, [allDone, wrongThisRound, allQuestions]);

            const correctCount = Object.values(results).filter(Boolean).length;
            const questionLabel = mode === 'units'
                ? `Vilken är SI-enheten för denna storhet?`
                : `Vilken storhet betecknas med denna symbol?`;

            const handleDismissOverlay = useCallback(() => {
                setShowBonus(null);
                setShowWrongInfo(null);
                if (pendingAdvance.current) {
                    pendingAdvance.current();
                    pendingAdvance.current = null;
                }
            }, []);

            if (showSummary) {
                return React.createElement(RoundSummary, {
                    round,
                    totalQuestions: allQuestions.length,
                    correctCount,
                    wrongQuestions: wrongThisRound,
                    onContinue: handleContinue,
                    allDone
                });
            }

            return React.createElement('div', null,
                showBonus && React.createElement(BonusOverlay, {
                    text: showBonus,
                    onDismiss: handleDismissOverlay
                }),
                showWrongInfo && React.createElement(WrongAnswerOverlay, {
                    wrongUnit: showWrongInfo.wrongUnit,
                    wrongExplanation: showWrongInfo.wrongExplanation,
                    correctText: showWrongInfo.correctText,
                    onDismiss: handleDismissOverlay
                }),
                React.createElement('div', { className: 'flex justify-between items-center mb-2' },
                    React.createElement('span', { className: 'text-slate-400 text-sm' },
                        `Runda ${round}`
                    ),
                    React.createElement('span', { className: 'text-slate-400 text-sm' },
                        `Fråga ${currentIndex + 1} av ${currentQuestions.length}`
                    )
                ),
                React.createElement(ProgressDots, {
                    questions: currentQuestions,
                    currentIndex,
                    results
                }),
                question && React.createElement(QuizQuestion, {
                    key: `${round}-${currentIndex}`,
                    question,
                    questionLabel,
                    onAnswer: handleAnswer,
                    answered: selectedAnswer !== null,
                    selectedAnswer,
                    correctAnswer
                })
            );
        }

        // Kapitelväljare — visas när adressen saknar giltig kapitel-hash.
        function ChapterPicker() {
            return React.createElement('div', { className: 'max-w-2xl mx-auto' },
                React.createElement('h1', {
                    className: 'lab-section-title',
                    style: { marginBottom: 8 }
                }, 'Enhetskoll'),
                React.createElement('p', {
                    style: { fontFamily: "'Poppins', sans-serif", color: 'var(--lab-ink-muted, #5b6472)', maxWidth: '46rem' }
                }, 'Varje kapitel avslutas med en enhetskoll — ett snabbt quiz på just de storheter, enheter och beteckningar som kapitlet använder. Välj kapitel:'),
                KURSER.map(kurs =>
                    React.createElement('div', { key: kurs.hash },
                        React.createElement('div', { className: 'ek-kurs-rubrik' }, kurs.namn),
                        kurs.kapitel.map(n => {
                            const ch = CHAPTERS[`${kurs.hash}-${n}`];
                            if (!ch) return null;
                            return React.createElement('a', {
                                key: n,
                                className: 'ek-kap-lank',
                                href: `#${kurs.hash}-${n}`
                            },
                                React.createElement('span', { className: 'ek-kap-num' }, `Kap ${n}`),
                                React.createElement('span', null, ch.kapitel)
                            );
                        })
                    )
                )
            );
        }

        function App() {
            const [chapterId, setChapterId] = useState(readChapterId);
            const [mode, setMode] = useState('units');
            const [isFullscreen, setIsFullscreen] = useState(false);
            const sceneWrapRef = React.useRef(null);

            useEffect(() => {
                const onHashChange = () => {
                    setChapterId(readChapterId());
                    setMode('units');
                };
                window.addEventListener('hashchange', onHashChange);
                return () => window.removeEventListener('hashchange', onHashChange);
            }, []);

            const chapter = chapterId ? CHAPTERS[chapterId] : null;

            useEffect(() => {
                document.title = chapter
                    ? `Enhetskoll: ${chapter.kapitel} — ${chapter.kurs} — Fysiklabbet`
                    : 'Enhetskoll — Fysiklabbet';
            }, [chapterId]);

            useEffect(() => {
                const handler = () => {
                    setIsFullscreen(
                        document.fullscreenElement === sceneWrapRef.current ||
                        document.webkitFullscreenElement === sceneWrapRef.current
                    );
                };
                document.addEventListener('fullscreenchange', handler);
                document.addEventListener('webkitfullscreenchange', handler);
                return () => {
                    document.removeEventListener('fullscreenchange', handler);
                    document.removeEventListener('webkitfullscreenchange', handler);
                };
            }, []);

            const toggleFullscreen = () => {
                const el = sceneWrapRef.current;
                if (!el) return;
                const isFs = document.fullscreenElement || document.webkitFullscreenElement;
                if (isFs) {
                    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                } else {
                    (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
                }
            };

            if (!chapter) {
                return React.createElement(ChapterPicker);
            }

            const hasSymbols = chapter.symbols && chapter.symbols.length > 0;

            return React.createElement('div', {
                className: 'scene-wrap ek-scene dark-container min-h-0 rounded-2xl p-6 md:p-10',
                ref: sceneWrapRef,
                style: { fontFamily: "'Poppins', sans-serif", userSelect: 'none' }
            },
                React.createElement('button', {
                    className: 'fs-btn',
                    onClick: toggleFullscreen,
                    'aria-label': 'Fullskärm',
                    title: isFullscreen ? 'Lämna fullskärm' : 'Fullskärm'
                }, isFullscreen
                    ? React.createElement('svg', { width: 18, height: 18, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2.2, strokeLinecap: 'round', strokeLinejoin: 'round' },
                        React.createElement('path', { d: 'M9 3v6H3' }),
                        React.createElement('path', { d: 'M15 21v-6h6' }),
                        React.createElement('path', { d: 'M21 9h-6V3' }),
                        React.createElement('path', { d: 'M3 15h6v6' }))
                    : React.createElement('svg', { width: 18, height: 18, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2.2, strokeLinecap: 'round', strokeLinejoin: 'round' },
                        React.createElement('path', { d: 'M3 9V3h6' }),
                        React.createElement('path', { d: 'M21 9V3h-6' }),
                        React.createElement('path', { d: 'M3 15v6h6' }),
                        React.createElement('path', { d: 'M21 15v6h-6' }))
                ),
                React.createElement('div', { className: 'text-center mb-8' },
                    React.createElement('p', {
                        className: 'text-sky-400 text-xs font-semibold tracking-wider uppercase mb-2'
                    }, `${chapter.kurs} · Kapitel ${chapter.nummer}`),
                    React.createElement('h1', {
                        className: 'text-3xl md:text-4xl font-bold text-white mb-3',
                        style: { fontFamily: "'Poppins', sans-serif" }
                    }, `Enhetskoll: ${chapter.kapitel}`),
                    React.createElement('p', {
                        className: 'text-slate-400 max-w-xl mx-auto'
                    }, 'Kolla att du kan kapitlets storheter, enheter och beteckningar! Svarar du fel får du öva igen tills allt sitter.')
                ),
                hasSymbols && React.createElement('div', {
                    className: 'flex justify-center gap-3 mb-8 flex-wrap'
                },
                    React.createElement('button', {
                        className: `mode-tab px-5 py-2.5 rounded-xl text-sm font-semibold border-2 ${mode === 'units' ? 'active' : ''}`,
                        onClick: () => setMode('units')
                    }, 'Storheter → enheter'),
                    React.createElement('button', {
                        className: `mode-tab px-5 py-2.5 rounded-xl text-sm font-semibold border-2 ${mode === 'symbols' ? 'active' : ''}`,
                        onClick: () => setMode('symbols')
                    }, 'Beteckningar → storheter')
                ),
                React.createElement(Quiz, { key: chapterId, chapterId, mode: hasSymbols ? mode : 'units' })
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(
            React.createElement(App)
        );
    </script>
    <script src="feedback.js" defer></script>
    <script src="sim-dock.js" defer></script>
</body>
</html>
