<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Sammanfattningar i rotation — Fysiklabbet</title>
<meta name="description" content="Utkast: avsnittssammanfattningarna i Matematik fortsättning nivå 2, kapitel 1 och 4, visade en i taget i ett rullande bildspel.">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300..700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

<!--
  Sammanfattningar i rotation (utkast, 2026-10-05)

  Visar ::: sammanfattning-rutorna ur avsnitten i Matematik fortsättning
  nivå 2, kapitel 1 (Trigonometri) och kapitel 4 (Komplexa tal), en i
  taget, och byter av sig själv efter en inställbar tid. Tänkt för en
  skärm i klassrummet eller korridoren inför ett prov.

  Innehållet läses direkt ur data/teori/bundle.js, så sidan följer med
  när en genomgång skrivs om (kör data/teori/build.js som vanligt).
  Kapitlens egna sammanfattningsavsnitt (1.S, 4.S) saknar
  ::: sammanfattning-ruta och hoppas därför över av sig självt.

  Renderingen är en avskalad kopia av katalog.html: protectMath →
  preprocessBlocks → marked → restoreMath → KaTeX, med samma klasser
  (.lab-block-sammanfattning/.lab-block-sampunkt) och samma
  storleksanpassning som presentationsläget (fitSammanfattning): rutan
  krymps om den är för hög och växer så länge det finns luft kvar.

  Adressparametrar: ?kap=1 eller ?kap=4 (bara ett kapitel), ?tid=45
  (sekunder per sammanfattning).
-->
<style>
html, body { height: 100%; }
body.laborans { overflow: hidden; }

.rot {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    background: var(--lab-bg);
}

/* --- Slidens huvud: kurs och kapitel, sedan avsnittets titel --- */
.rot-scen {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    padding: 2.2vh 3vw 1.2vh;
    box-sizing: border-box;
}
.rot-slide {
    position: absolute;
    inset: 2.2vh 3vw 1.2vh;
    display: flex; flex-direction: column;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.6s ease, visibility 0s linear 0.6s;
}
.rot-slide.is-on {
    opacity: 1;
    visibility: visible;
    transition: opacity 0.6s ease, visibility 0s;
}
.rot-huvud {
    display: flex; align-items: baseline; gap: 18px;
    margin: 0 0 1.4vh;
    flex: 0 0 auto;
}
.rot-nr {
    font-family: var(--lab-font-mono);
    font-size: clamp(14px, 1.6vw, 22px);
    color: var(--lab-accent);
    font-weight: 500;
}
.rot-titel {
    font-family: var(--lab-font-display);
    font-size: clamp(26px, 3.1vw, 46px);
    line-height: 1.1;
    margin: 0;
    font-weight: 400;
}
.rot-titel em { font-style: italic; }
.rot-kapitel {
    margin-left: auto;
    font-family: var(--lab-font-mono);
    font-size: clamp(10px, 0.9vw, 13px);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--lab-ink-muted);
    text-align: right;
    white-space: nowrap;
}
.rot-yta { flex: 1 1 auto; min-height: 0; }

/* Rutan fyller bredden. Rubriken "Sammanfattning" behövs inte: slidens
   huvud säger redan vad det är. */
.rot .lab-block-sammanfattning {
    margin: 0;
    font-size: 17px;
    line-height: 1.55;
    gap: 14px;
    box-sizing: border-box;
}
.rot .lab-block-sammanfattning > .lab-block-title { display: none; }

/* --- Kontrollisten --- */
.rot-lista {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 10px;
    flex-wrap: wrap;
    padding: 10px 3vw 12px;
    border-top: 1px solid var(--lab-line);
    background: var(--lab-bg-raised);
    font-family: var(--lab-font-mono);
    font-size: 12px;
    color: var(--lab-ink-soft);
    position: relative;
}
.rot-tidlinje {
    position: absolute; left: 0; top: -1px; height: 3px;
    width: 100%;
    background: var(--lab-accent);
    transform-origin: left center;
    transform: scaleX(0);
    transition: transform 0.1s linear;
}
.rot-knapp {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px;
    border: 1px solid var(--lab-line-strong);
    border-radius: 50%;
    background: var(--lab-bg-panel);
    color: var(--lab-ink);
    cursor: pointer;
    padding: 0;
}
.rot-knapp:hover { border-color: var(--lab-ink); }
.rot-knapp:focus-visible { outline: 2px solid var(--lab-accent-2); outline-offset: 2px; }
.rot-raknare { min-width: 64px; text-align: center; }
.rot-lista label { display: inline-flex; align-items: center; gap: 6px; }
.rot-lista select {
    font: inherit;
    color: var(--lab-ink);
    background: var(--lab-bg-panel);
    border: 1px solid var(--lab-line-strong);
    border-radius: 3px;
    padding: 5px 6px;
}
.rot-hoger { margin-left: auto; display: inline-flex; align-items: center; gap: 12px; }
.rot-lista a { color: var(--lab-accent-2); text-decoration: underline; text-underline-offset: 3px; }
.rot-utkast {
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--lab-accent); font-size: 11px;
}

/* Smal eller stående skärm: ingen helsidesanpassning, rutan får skrolla
   (samma undantag som presentationsläget i katalogen). */
@media (max-width: 899px), (orientation: portrait) {
    body.laborans { overflow: auto; }
    .rot { position: static; min-height: 100%; }
    .rot-slide { position: static; display: none; }
    .rot-slide.is-on { display: flex; }
    .rot-huvud { flex-wrap: wrap; gap: 4px 12px; }
    .rot-kapitel { margin-left: 0; width: 100%; text-align: left; white-space: normal; order: -1; }
    .rot-lista { position: sticky; bottom: 0; }
    .rot-hoger { margin-left: 0; width: 100%; justify-content: space-between; }
}
@media (prefers-reduced-motion: reduce) {
    .rot-slide, .rot-slide.is-on { transition: none; }
}
.rot-fel { padding: 40px 3vw; font-size: 17px; }
</style>
</head>
<body class="laborans">
<div class="rot" id="rot">
    <div class="rot-scen" id="scen"></div>
    <div class="rot-lista">
        <div class="rot-tidlinje" id="tidlinje"></div>
        <button class="rot-knapp" id="bak" aria-label="Föregående sammanfattning" title="Föregående (vänsterpil)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <button class="rot-knapp" id="spela" aria-label="Pausa" title="Pausa (mellanslag)"></button>
        <button class="rot-knapp" id="fram" aria-label="Nästa sammanfattning" title="Nästa (högerpil)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
        </button>
        <span class="rot-raknare" id="raknare">0 / 0</span>
        <label>Kapitel
            <select id="kap">
                <option value="alla">1 och 4</option>
                <option value="1">1 Trigonometri</option>
                <option value="4">4 Komplexa tal</option>
            </select>
        </label>
        <label>Visningstid
            <select id="tid">
                <option value="15">15 s</option>
                <option value="30">30 s</option>
                <option value="45">45 s</option>
                <option value="60">1 min</option>
                <option value="90">1,5 min</option>
                <option value="120">2 min</option>
            </select>
        </label>
        <span class="rot-hoger">
            <a id="oppna" href="#" target="_blank" rel="noopener">Öppna genomgången</a>
            <span class="rot-utkast">Utkast</span>
            <button class="rot-knapp" id="helskarm" aria-label="Helskärm" title="Helskärm (F)"></button>
        </span>
    </div>
</div>

<script>document.write('<scr' + 'ipt src="../data/teori/bundle.js?v=' + window.__CB + '"></scr' + 'ipt>');</script>
<script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script>
(function () {
    'use strict';
    const TEORI = window.TEORI || {};
    const KURS = 'ma4';
    const KAPITEL = ['1', '4'];
    const KURSNAMN = 'Matematik fortsättning nivå 2';

    const IKON_PAUS = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
    const IKON_SPELA = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
    const IKON_FS_IN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9V3h6"/><path d="M21 9V3h-6"/><path d="M3 15v6h6"/><path d="M21 15v6h-6"/></svg>';
    const IKON_FS_UT = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v6H3"/><path d="M15 21v-6h6"/><path d="M21 9h-6V3"/><path d="M3 15h6v6"/></svg>';

    // ---------- Rendering (avskalad kopia av katalog.html) ----------

    function protectMath(md) {
        const tokens = [];
        md = md.replace(/\$\$([\s\S]+?)\$\$/g, (m) => { tokens.push(m); return '@@LABMATH' + (tokens.length - 1) + '@@'; });
        md = md.replace(/\$([^\n$]+?)\$/g, (m) => { tokens.push(m); return '@@LABMATH' + (tokens.length - 1) + '@@'; });
        return { md, tokens };
    }
    function restoreMath(html, tokens) {
        html = html.replace(/@@LABMATH(\d+)@@/g, (_, i) => tokens[+i]);
        // Samma nowrap-omslag som i katalogen: parentes + formel och
        // variabel + bindestreck + efterled ("$n$-hörning").
        html = html.replace(/\(( *)(\$(?!\$)[^$\n]+?\$)/g, '<span class="math-paren">($1$2</span>');
        html = html.replace(/(\$(?!\$)[^$\n]+?\$|<em>[^<]{1,8}<\/em>)-([a-zA-Zåäöé]+)/g,
            '<span class="var-compound">$1-$2</span>');
        return html;
    }
    function escapeHtml(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function emTitel(s) {
        return escapeHtml(s).replace(/\*([^*]+)\*/g, '<em>$1</em>');
    }
    // ::: typ "Titel" … ::: → blockrutor (bara de typer en sammanfattning har).
    function preprocessBlocks(md) {
        const out = [];
        const stack = [];
        for (const line of md.split('\n')) {
            const open = line.match(/^:::\s*([a-zåäö]+)(?:\s+"([^"]*)")?\s*$/i);
            if (open) {
                const ty = open[1].toLowerCase();
                stack.push(ty);
                out.push('<div class="lab-block lab-block-' + ty + '">');
                if (open[2]) out.push('<div class="lab-block-title">' + emTitel(open[2]) + '</div>');
                out.push('');
            } else if (/^:::\s*$/.test(line) && stack.length) {
                stack.pop();
                out.push('', '</div>');
            } else {
                out.push(line);
            }
        }
        return out.join('\n');
    }
    function parseFrontmatter(md) {
        md = md.replace(/\r\n?/g, '\n');
        if (!md.startsWith('---\n')) return { fm: {}, body: md };
        const end = md.indexOf('\n---\n', 4);
        if (end === -1) return { fm: {}, body: md };
        const fm = {};
        for (const line of md.slice(4, end).split('\n')) {
            const m = line.match(/^([a-zA-Z]+):\s*(.*)$/);
            if (!m) continue;
            let v = m[2].trim();
            if ((v.startsWith("'") && v.endsWith("'")) || (v.startsWith('"') && v.endsWith('"'))) v = v.slice(1, -1);
            fm[m[1]] = v;
        }
        return { fm, body: md.slice(end + 5) };
    }
    // Plocka ut ::: sammanfattning-rutan, med de nästlade sampunkt-korten.
    function hamtaSammanfattning(body) {
        const rader = body.split('\n');
        const start = rader.findIndex(r => /^:::\s*sammanfattning\b/i.test(r));
        if (start === -1) return null;
        let djup = 0;
        for (let i = start; i < rader.length; i++) {
            if (/^:::\s*[a-zåäö]/i.test(rader[i])) djup++;
            else if (/^:::\s*$/.test(rader[i])) {
                djup--;
                if (djup === 0) return rader.slice(start, i + 1).join('\n');
            }
        }
        return rader.slice(start).join('\n');
    }

    marked.setOptions({ gfm: true, breaks: false });

    // ---------- Samla avsnitten ----------

    const sektionsNr = (id) => id.slice(KURS.length + 1).split('.').map(Number);
    const ALLA = Object.keys(TEORI)
        .filter(id => KAPITEL.some(k => id.startsWith(KURS + '-' + k + '.')))
        .filter(id => !/\.S$/.test(id))
        .sort((a, b) => {
            const [ka, sa] = sektionsNr(a), [kb, sb] = sektionsNr(b);
            return ka - kb || sa - sb;
        })
        .map(id => {
            const { fm, body } = parseFrontmatter(TEORI[id]);
            const sam = hamtaSammanfattning(body);
            if (!sam) return null;
            return {
                id,
                kap: String(fm.chapterNumber || id.split('-')[1].split('.')[0]),
                kapitel: fm.chapter || '',
                nr: fm.section || id.split('-')[1],
                titel: fm.title || id,
                md: sam,
            };
        })
        .filter(Boolean);

    const scen = document.getElementById('scen');
    if (!ALLA.length) {
        scen.innerHTML = '<p class="rot-fel">Inga sammanfattningar kunde läsas in. Öppna sidan via webbservern, till exempel http://localhost:8000/utkast/sammanfattningar-ma4.html.</p>';
        return;
    }

    for (const a of ALLA) {
        const el = document.createElement('section');
        el.className = 'rot-slide';
        const { md, tokens } = protectMath(a.md);
        el.innerHTML =
            '<header class="rot-huvud">' +
                '<span class="rot-nr">' + escapeHtml(a.nr) + '</span>' +
                '<h1 class="rot-titel">' + emTitel(a.titel) + '</h1>' +
                '<span class="rot-kapitel">' + escapeHtml(KURSNAMN) + '<br>Kapitel ' +
                    escapeHtml(a.kap) + ' · ' + escapeHtml(a.kapitel) + '</span>' +
            '</header>' +
            '<div class="rot-yta">' + restoreMath(marked.parse(preprocessBlocks(md)), tokens) + '</div>';
        renderMathInElement(el, {
            delimiters: [
                { left: '$$', right: '$$', display: true },
                { left: '$', right: '$', display: false },
            ],
            throwOnError: false,
        });
        scen.appendChild(el);
        a.el = el;
        a.ruta = el.querySelector('.lab-block-sammanfattning');
    }

    // ---------- Storleksanpassning (som fitSammanfattning i katalogen) ----------

    const SAM_MIN = 12, SAM_MAX = 34;
    const SAM_KOLUMNER = { 1: 1, 2: 2, 3: 3, 4: 2, 5: 3, 6: 3, 7: 4, 8: 4 };
    const helsida = () => window.innerWidth >= 900 && window.innerWidth >= window.innerHeight;

    function anpassa(a) {
        const el = a.ruta;
        if (!el) return;
        el.style.fontSize = '';
        el.style.gridTemplateColumns = '';
        el.style.gridTemplateRows = '';
        el.style.gridAutoRows = '';
        el.style.height = '';
        if (!helsida()) return;
        const kort = el.querySelectorAll(':scope > .lab-block-sampunkt').length;
        if (kort) el.style.gridTemplateColumns = 'repeat(' + (SAM_KOLUMNER[kort] || 4) + ', minmax(0, 1fr))';
        const maxH = el.parentElement.clientHeight;
        // För stor: rutan är högre än ytan, ELLER ett kort spiller i sidled.
        // En lång inline-formel bryts aldrig (nowrap) och klipps annars av
        // kortets högerkant (de Moivres formel i 4.8).
        const kortlista = el.querySelectorAll(':scope > .lab-block-sampunkt');
        const forStor = () => el.getBoundingClientRect().height > maxH ||
            [...kortlista].some(k => k.scrollWidth > k.clientWidth + 1);
        let size = 17;
        el.style.fontSize = size + 'px';
        while (size > SAM_MIN && forStor()) {
            size -= 0.5;
            el.style.fontSize = size + 'px';
        }
        while (size < SAM_MAX) {
            el.style.fontSize = (size + 0.5) + 'px';
            if (forStor()) { el.style.fontSize = size + 'px'; break; }
            size += 0.5;
        }
        // Slår texten i taket med yta kvar fördelas luften i korten i
        // stället för att samlas som ett tomt band i underkant.
        if (size >= SAM_MAX && el.getBoundingClientRect().height < maxH) {
            el.style.gridAutoRows = '1fr';
            el.style.height = maxH + 'px';
        }
    }

    // ---------- Bildspelet ----------

    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const kapSel = $('kap'), tidSel = $('tid');
    if (KAPITEL.includes(params.get('kap'))) kapSel.value = params.get('kap');
    const tidParam = parseInt(params.get('tid'), 10);
    if (tidParam >= 5 && tidParam <= 600) {
        if (![...tidSel.options].some(o => o.value === String(tidParam))) {
            const o = document.createElement('option');
            o.value = String(tidParam); o.textContent = tidParam + ' s';
            tidSel.appendChild(o);
        }
        tidSel.value = String(tidParam);
    } else {
        tidSel.value = '30';
    }

    let lista = [], pos = 0, spelar = true;
    let startTid = 0, forbrukat = 0;   // ms av aktuell visningstid som gått
    const varaktighet = () => parseInt(tidSel.value, 10) * 1000;

    function byggLista() {
        const k = kapSel.value;
        lista = ALLA.filter(a => k === 'alla' || a.kap === k);
    }
    function visa(i) {
        pos = (i + lista.length) % lista.length;
        const a = lista[pos];
        for (const b of ALLA) b.el.classList.toggle('is-on', b === a);
        anpassa(a);
        if (!helsida()) window.scrollTo(0, 0);   // smal skärm: sidan skrollar
        $('raknare').textContent = (pos + 1) + ' / ' + lista.length;
        $('oppna').href = '../katalog.html?id=' + a.id + '&block=sammanfattning';
        forbrukat = 0;
        startTid = performance.now();
    }
    function satSpelar(v) {
        spelar = v;
        if (v) startTid = performance.now() - forbrukat;
        $('spela').innerHTML = v ? IKON_PAUS : IKON_SPELA;
        $('spela').setAttribute('aria-label', v ? 'Pausa' : 'Spela');
        $('spela').title = (v ? 'Pausa' : 'Spela') + ' (mellanslag)';
    }
    // En vanlig timer, inte requestAnimationFrame: rAF står still när
    // fliken eller fönstret är dolt, och då slutar bildspelet att rulla.
    function tick() {
        const nu = performance.now();
        if (spelar) {
            forbrukat = nu - startTid;
            if (forbrukat >= varaktighet()) visa(pos + 1);
        }
        $('tidlinje').style.transform = 'scaleX(' + Math.min(1, forbrukat / varaktighet()) + ')';
    }

    $('bak').onclick = () => visa(pos - 1);
    $('fram').onclick = () => visa(pos + 1);
    $('spela').onclick = () => satSpelar(!spelar);
    kapSel.onchange = () => {
        const nu = lista[pos];
        byggLista();
        const i = lista.indexOf(nu);
        visa(i >= 0 ? i : 0);
    };
    tidSel.onchange = () => { forbrukat = 0; startTid = performance.now(); };

    function uppdateraFsIkon() {
        const fs = !!document.fullscreenElement;
        $('helskarm').innerHTML = fs ? IKON_FS_UT : IKON_FS_IN;
        $('helskarm').title = fs ? 'Lämna helskärm (F)' : 'Helskärm (F)';
    }
    function vaxlaHelskarm() {
        if (document.fullscreenElement) document.exitFullscreen();
        else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    }
    $('helskarm').onclick = vaxlaHelskarm;
    document.addEventListener('fullscreenchange', uppdateraFsIkon);

    document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'SELECT' || e.altKey || e.ctrlKey || e.metaKey) return;
        if (e.key === 'ArrowRight' || e.key === 'PageDown') { visa(pos + 1); e.preventDefault(); }
        else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { visa(pos - 1); e.preventDefault(); }
        else if (e.key === ' ') { satSpelar(!spelar); e.preventDefault(); }
        else if (e.key === 'f' || e.key === 'F') vaxlaHelskarm();
    });

    let resizeTimer = null;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => anpassa(lista[pos]), 120);
    });
    // Teckensnitten ändrar textens bredd; mät om när de laddats.
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => anpassa(lista[pos]));

    byggLista();
    uppdateraFsIkon();
    satSpelar(true);
    visa(0);
    setInterval(tick, 100);
})();
