    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        /* =====================================================================
           Doserad kurva.
           En bil kör med konstant fart v runt en cirkulär kurva med radien r.
           Vägbanan lutar vinkeln α in mot kurvans centrum (doseringen).
           Tre krafter verkar på bilen: tyngdkraften F_G, normalkraften F_N
           (vinkelrätt mot vägbanan) och friktionskraften F_f (längs vägbanan).
           Deras resultant är centripetalkraften F_C = m · v² / r, vågrät och
           riktad in mot centrum.

           Med u = riktningen uppför vägbanan (utåt och uppåt) ger Newtons
           andra lag, vågrätt och lodrätt:
               F_N · sin α − F_f · cos α = m · v² / r
               F_N · cos α + F_f · sin α = m · g
           där F_f räknas positiv uppför vägbanan. Lösningen är
               F_N = m · (g · cos α + a · sin α)
               F_f = m · (g · sin α − a · cos α),   a = v² / r.
           F_f = 0 när tan α = v² / (r · g): den friktionsfria farten.
           Greppet räcker så länge |F_f| ≤ μ · F_N. Annars glider bilen längs
           vägbanan (utåt eller inåt) med glidfriktionen μ · F_N, och banans
           radie ändras medan den glider.

           Normalkraften och friktionen angriper där hjulen möter vägen. Bilen
           ska inte rotera, så kontaktkraften (F_N + F_f) måste gå genom
           tyngdpunkten: angreppspunkten flyttas mot ytterhjulen när friktionen
           pekar inåt (lastöverföring), och mot innerhjulen när den pekar utåt.

           Enheter i scenen: 1 enhet = 1 m.
           ===================================================================== */

        const G = 9.82;            // tyngdfaktor (N/kg)
        const MASSA = 1200;        // bilens massa (kg)
        const BREDD = 12;          // vägbanans bredd längs lutningen (m)
        const SPAR = 0.78;         // halva spårvidden (m)
        const H_TP = 0.55;         // tyngdpunktens höjd över vägbanan (m)
        const D_MAX = BREDD / 2 - 1.2;   // hur långt bilen kan glida från körfältets mitt
        const V_MAX = 40, R_MIN = 20, R_MAX = 150, A_MAX = 45;
        const K3 = 2.3 / (MASSA * G);    // pilskala i 3D: m per N (F_G blir 2,3 m)
        const K2 = 100 / (MASSA * G);     // pilskala i tvärsnittet: px per N

        const UNDERLAG = [
            { id: 'torr', namn: 'Torr asfalt', mu: 0.80 },
            { id: 'vat',  namn: 'Våt asfalt',  mu: 0.50 },
            { id: 'sno',  namn: 'Snö',         mu: 0.25 },
            { id: 'is',   namn: 'Is',          mu: 0.10 },
        ];
        const underlagFor = (mu) => mu >= 0.65 ? 'torr' : mu >= 0.38 ? 'vat' : mu >= 0.17 ? 'sno' : 'is';

        const COL = {
            ink:   '#0f1620',
            fart:  '#2563c9',  // hastighet v (som i Cirkulär rörelse)
            fc:    '#b8860b',  // centripetalkraften F_C (streckad)
            frik:  '#e0701a',  // friktionskraft F_f
            tyngd: '#c8324a',  // tyngdkraft F_G
            norm:  '#0d9488',  // normalkraft F_N
            vmax:  '#9b2c2c',
            vmin:  '#1f4fa3',
            hall:  '#3f7d3a',
            bil:   '#5d6875',   // bilen i tvärsnittet (grafit, som i 3D)
            bil3d: '#4a5563',   // bilen i 3D (grafit, så att kraftpilarna syns mot den)
            rand:  '#1f2f4a',
        };

        const rad = (d) => d * Math.PI / 180;
        const fmt = (num, decimals = 1) => {
            if (!isFinite(num)) return '–';
            const s = num.toFixed(decimals);
            if (parseFloat(s) === 0) return '0';
            const [i, f] = s.replace('-', '').split('.');
            const ig = i.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
            return (num < 0 ? '−' : '') + (f !== undefined ? ig + ',' + f : ig);
        };

        // ── Fysiken ──
        function krafter(v, alfaGrad, r) {
            const a = rad(alfaGrad), acc = v * v / r;
            const N = MASSA * (G * Math.cos(a) + acc * Math.sin(a));
            const f = MASSA * (G * Math.sin(a) - acc * Math.cos(a));   // + uppför vägbanan
            return { acc, N, f };
        }
        function granser(alfaGrad, r, mu) {
            const a = rad(alfaGrad), s = Math.sin(a), c = Math.cos(a);
            const v0 = Math.sqrt(r * G * Math.tan(a));
            const den = c - mu * s;
            const vmax = den <= 1e-9 ? Infinity : Math.sqrt(r * G * (s + mu * c) / den);
            const num = s - mu * c;
            const vmin = num <= 0 ? 0 : Math.sqrt(r * G * num / (c + mu * s));
            return { v0, vmin, vmax };
        }
        // Var kontaktkraften angriper, räknat längs vägbanan från bilens mitt (+ utåt)
        const angreppsPunkt = (N, f) => Math.max(-SPAR, Math.min(SPAR, -H_TP * f / Math.max(N, 1)));

        // Delat läge mellan React och scenen (scenen byggs bara en gång)
        const SIM = {
            p: { v: 20, alfa: 15, r: 60, mu: 0.8, running: true, slow: false,
                 show: { krafter: true, fc: true, fart: true, radie: true } },
            ut: { d: 0, w: 0, glider: false, kant: 0, av: 0, N: 0, f: 0, acc: 0, rc: 60 },
            cb: {},
            vy: null,
            reset: null,
        };

        // ─────────────────────────────────────────────────────────────────
        // Grafikhjälp
        // ─────────────────────────────────────────────────────────────────
        const Y_AXEL = new THREE.Vector3(0, 1, 0);
        const linjar = (hex) => new THREE.Color(hex).convertSRGBToLinear();
        const markMat = (hex, glod = 0.5) => new THREE.MeshStandardMaterial({
            color: linjar(hex), emissive: linjar(hex).multiplyScalar(glod),
            roughness: 0.55, metalness: 0, toneMapped: false, depthTest: false, transparent: true });

        const textSprite = (parts) => {
            const c = document.createElement('canvas');
            const ctx = c.getContext('2d');
            const FS = 64, PAD = 12;
            const fontFor = (p) => `${p.italic ? 'italic ' : ''}${p.weight || 600} ${p.small ? FS * 0.72 : FS}px Poppins, sans-serif`;
            const rita = () => {
                let w = 0;
                parts.forEach((p) => { ctx.font = fontFor(p); w += ctx.measureText(p.t).width; });
                c.width = Math.max(2, Math.ceil(w) + PAD * 2);
                c.height = FS + PAD * 2 + 12;
                let x = PAD;
                parts.forEach((p) => {
                    ctx.font = fontFor(p);
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = p.color;
                    const dy = p.sub ? FS * 0.26 : 0;
                    ctx.fillText(p.t, x, c.height / 2 + dy - 2);
                    x += ctx.measureText(p.t).width;
                });
            };
            rita();
            const tex = new THREE.CanvasTexture(c);
            tex.minFilter = THREE.LinearFilter;
            tex.encoding = THREE.sRGBEncoding;
            const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false, toneMapped: false }));
            spr.renderOrder = 30;
            spr.userData.aspect = c.width / c.height;
            // rita om när Poppins har laddats (annars blir det reservtypsnittet)
            if (document.fonts) Promise.all([document.fonts.load('600 64px Poppins'), document.fonts.load('italic 600 64px Poppins')]).then(() => {
                rita(); tex.dispose(); spr.userData.aspect = c.width / c.height;

        const kraftEtikett = (sym, sub, color) => textSprite([{ t: sym, italic: true, color }, { t: sub, color, small: true, sub: true }]);

        // Platta pilar, ritade som på papper: en polygon i det plan som innehåller
        // pilen och vetter mot kameran. Bredden anges i skärmpixlar, så att
        // pilarna ser likadana ut på alla avstånd, precis som i tvärsnittet.
        // Skaftet slutar vid spetsens bas. Hörnen räknas om varje bildruta i
        // ritaPilar(), efter kamerans läge.
        const PILAR = [];
        function nyPil(color, px, streckad) {
            const maxKvad = streckad ? 400 : 1;
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array((maxKvad * 6 + 3) * 3), 3));
            const mat = new THREE.MeshBasicMaterial({ color: linjar(color), side: THREE.DoubleSide,
                depthTest: false, depthWrite: false, transparent: true, toneMapped: false });
            const m = new THREE.Mesh(geo, mat);
            m.frustumCulled = false;
            m.renderOrder = 25;
            m.userData = { px, streckad, utanSpets: false, from: new THREE.Vector3(), vec: new THREE.Vector3() };
            PILAR.push(m);
            return m;
        }
        const pil = (color, px = 4) => nyPil(color, px, false);
        const streckPil = (color, px = 3.4) => nyPil(color, px, true);
        function stallPil(g, from, vec, utanSpets = false) {
            if (vec.length() < 0.05) { g.visible = false; return; }
            g.visible = true;
            g.userData.from.copy(from);
            g.userData.vec.copy(vec);
            g.userData.utanSpets = utanSpets;
        }
        const stallStreckPil = stallPil;
        const _A = new THREE.Vector3(), _B = new THREE.Vector3(), _d = new THREE.Vector3(),
              _s = new THREE.Vector3(), _k = new THREE.Vector3(), _m = new THREE.Vector3();
        function ritaPilar(camera, hojdPx) {
            const tanH = Math.tan(rad(camera.fov / 2));
            PILAR.forEach((m) => {
                if (!m.visible) return;
                const { from, vec, px, streckad, utanSpets } = m.userData;
                const len = vec.length();
                _d.copy(vec).divideScalar(len);
                _m.copy(from).addScaledVector(vec, 0.5);
                const perPx = 2 * camera.position.distanceTo(_m) * tanH / hojdPx;   // meter per skärmpixel
                _k.subVectors(camera.position, _m);
                _s.crossVectors(_d, _k);
                if (_s.lengthSq() < 1e-12) _s.set(1, 0, 0);
                _s.normalize();
                const hb = px / 2 * perPx;
                const spets = utanSpets ? 0 : Math.min(14 * perPx, len * 0.6);
                const sb = 6.5 * perPx;
                const skaft = len - spets;
                const pos = m.geometry.attributes.position.array;
                let i = 0;
                const punkt = (P, sid) => { pos[i++] = P.x + _s.x * sid; pos[i++] = P.y + _s.y * sid; pos[i++] = P.z + _s.z * sid; };
                const kvad = (s0, s1) => {
                    _A.copy(from).addScaledVector(_d, s0);
                    _B.copy(from).addScaledVector(_d, s1);
                    punkt(_A, -hb); punkt(_A, hb); punkt(_B, hb);
                    punkt(_A, -hb); punkt(_B, hb); punkt(_B, -hb);

                if (streckad) {
                    const STRECK = 9 * perPx, LUCKA = 6 * perPx;
                    for (let t = 0; t < skaft && i <= pos.length - 27; t += STRECK + LUCKA) kvad(t, Math.min(t + STRECK, skaft));

                if (!utanSpets) {
                    _A.copy(from).addScaledVector(_d, skaft);
                    _B.copy(from).add(vec);

                m.geometry.attributes.position.needsUpdate = true;
            });

        function canvasTex(w, h, rita) {
            const c = document.createElement('canvas');
            c.width = w; c.height = h;

        function slump(seed) { let s = seed; return () => { s = (s * 16807) % 2147483647; return s / 2147483647; }; }

        // Rutat papper som mark: en ruta = 5 m, en tjockare linje var 50:e meter
        function papperTextur() {
            return canvasTex(512, 512, (ctx, w, h) => {

        // Asfalt i fyra varianter. u (x) längs banan, v (y) tvärs över den.
        function asfaltTextur(typ) {
            return canvasTex(512, 512, (ctx, w, h) => {
                const rnd = slump(typ === 'torr' ? 11 : typ === 'vat' ? 23 : typ === 'sno' ? 37 : 53);
                const bas = { torr: '#55585e', vat: '#34373d', sno: '#5a5d63', is: '#8fa6b4' }[typ];
                ctx.fillStyle = bas; ctx.fillRect(0, 0, w, h);
                // korn
                for (let i = 0; i < 9000; i++) {
                    const l = rnd() < 0.5 ? 255 : 0;
                    ctx.fillStyle = `rgba(${l},${l},${l},${0.03 + rnd() * 0.07})`;
                    ctx.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 2, 1 + rnd() * 2);
                }
                // däckspår i körfältet
                ctx.fillStyle = typ === 'sno' ? 'rgba(40,42,46,0.55)' : 'rgba(20,20,22,0.10)';
                [0.43, 0.57].forEach(v => ctx.fillRect(0, v * h - 10, w, 20));
                if (typ === 'vat') {
                    for (let i = 0; i < 26; i++) {
                        const x = rnd() * w, y = rnd() * h;
                        const g = ctx.createRadialGradient(x, y, 2, x, y, 30 + rnd() * 50);
                        g.addColorStop(0, 'rgba(190,205,225,0.20)'); g.addColorStop(1, 'rgba(190,205,225,0)');
                        ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
                    }
                }
                if (typ === 'sno') {
                    for (let i = 0; i < 1600; i++) {
                        const v = rnd();
                        const iSpar = Math.abs(v - 0.43) < 0.03 || Math.abs(v - 0.57) < 0.03;
                        if (iSpar && rnd() < 0.85) continue;

                        ctx.beginPath(); ctx.arc(rnd() * w, v * h, 2 + rnd() * 9, 0, Math.PI * 2); ctx.fill();
                    }

                if (typ === 'is') {
                    ctx.strokeStyle = 'rgba(240,248,255,0.45)';
                    for (let i = 0; i < 70; i++) {
                        ctx.lineWidth = 0.6 + rnd() * 1.4;
                        let x = rnd() * w, y = rnd() * h;
                        ctx.beginPath(); ctx.moveTo(x, y);
                        for (let k = 0; k < 4; k++) { x += (rnd() - 0.5) * 60; y += (rnd() - 0.5) * 60; ctx.lineTo(x, y); }

                ctx.fillStyle = typ === 'sno' ? 'rgba(245,245,245,0.6)' : '#ece8de';

        // En ring som sveps runt y-axeln ur en profil [[R, y, v], …]
        function ringRemsa(profil, segs, uPer) {
            const np = profil.length, pos = [], uv = [], idx = [];
            const Rm = profil.reduce((s, p) => s + p[0], 0) / np;
            for (let i = 0; i <= segs; i++) {
                const th = i / segs * Math.PI * 2, c = Math.cos(th), s = Math.sin(th);
                profil.forEach(([R, y, v]) => { pos.push(R * c, y, -R * s); uv.push(th * Rm / uPer, v); });
            }
            for (let i = 0; i < segs; i++) for (let j = 0; j < np - 1; j++) {
                const a = i * np + j, b = a + np;
                idx.push(a, a + 1, b, b, a + 1, b + 1);
            }
            const g = new THREE.BufferGeometry();
            g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
            g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
            g.setIndex(idx);
            g.computeVertexNormals();
            return g;
        }

                scene.add(centrumLapp);
                const radieLinje = streckPil(COL.ink, 2.4);
                scene.add(radieLinje);
                let radieLapp = null, radieText = '';

                // ── Bilen ──
                const { bil, hjul } = byggBil(env);
                scene.add(bil);

                // ── Bromsspår (när bilen glider) ──
                const SKID_MAX = 900;
                const skidGeo = new THREE.PlaneGeometry(1.0, 0.2); skidGeo.rotateX(-Math.PI / 2);

                    depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }), SKID_MAX);
                skidMesh.count = 0; skidMesh.renderOrder = 3;

                const tmpM = new THREE.Matrix4(), ett = new THREE.Vector3(1, 1, 1);

                // ── Krafter och hastighet ──
                const pFG = pil(COL.tyngd), pFN = pil(COL.norm), pFf = pil(COL.frik), pFC = streckPil(COL.fc), pV = pil(COL.fart);
                scene.add(pFG, pFN, pFf, pFC, pV);

                      lFf = kraftEtikett('F', 'f', COL.frik), lFC = kraftEtikett('F', 'C', COL.fc),

                const lappar = [lFG, lFN, lFf, lFC, lV, centrumLapp];
                scene.add(lFG, lFN, lFf, lFC, lV);

                // ── Kamera ──
                const cam = { theta: VYER.folj.theta, phi: VYER.folj.phi, radius: VYER.folj.radius, target: new THREE.Vector3() };
                let vy = 'folj', camMal = null, overgang = 0;
                const hela = () => ({ theta: VYER.hela.theta, phi: VYER.hela.phi, radius: SIM.p.r * 2.3 + 28 });
                SIM.vy = (n) => {
                    vy = n;
                    const m = n === 'hela' ? hela() : VYER[n];
                    camMal = { ...m };
                    overgang = 1;
                };

                // ── Pekare: dra för att vrida, hjul/nyp för att zooma ──
                const pekare = new Map();
                let drag = null, nyp = null;
                const rMin = () => vy === 'hela' ? 30 : 5, rMax = () => vy === 'hela' ? 700 : 80;
                const onDown = (e) => {

                    pekare.set(e.pointerId, { x: e.clientX, y: e.clientY });
                    renderer.domElement.setPointerCapture(e.pointerId);
                    if (pekare.size === 1) drag = { x: e.clientX, y: e.clientY };
                    if (pekare.size === 2) {
                        const [a, b] = [...pekare.values()];
                        nyp = { d: Math.hypot(a.x - b.x, a.y - b.y), r: cam.radius };
                        drag = null;
                    }
                    camMal = null;
                };
                const onMove = (e) => {
                    if (pekare.has(e.pointerId)) pekare.set(e.pointerId, { x: e.clientX, y: e.clientY });
                    if (nyp && pekare.size === 2) {

                        const d = Math.hypot(a.x - b.x, a.y - b.y);

                const ro = new ResizeObserver(() => {

                // ── Tillstånd ──
                let phi = 0;            // bilens vinkel runt kurvan

                      tp = new THREE.Vector3(), P = new THREE.Vector3(), basis = new THREE.Matrix4(), tmp = new THREE.Vector3();

                // fysiksteg

                    const p = SIM.p;

                    const rc = p.r + d * ca;
                    const acc = p.v * p.v / rc;

                        if (Math.abs(d) > 0.005) d -= Math.sign(d) * Math.min(Math.abs(d), 1.4 * dt);

                    if (glider && kant !== 0) {

                        // fortsatt om kanten inte fanns. Den stannar där, så att scenen
                        // aldrig visar ett läge där en kraft från barriären saknas.

                    return { rc, sa, ca };
                };

                let tLast = performance.now(), raf = 0;

                    const now = performance.now();
                    const dtv = Math.min(0.05, (now - tLast) / 1000);

                    const typ = underlagFor(p.mu);
                    if (typ !== byggdU) {

                    bil.position.copy(pos);

                    tp.copy(pos).addScaledVector(upp, H_TP);

                    // bromsspår

                    P.copy(pos).addScaledVector(uppfor, Pe);
                    const vFG = new THREE.Vector3(0, -MASSA * G * K3, 0);
                    const vFN = upp.clone().multiplyScalar(ut.N * K3);
                    const vFf = uppfor.clone().multiplyScalar(ut.f * K3);
                    const vFC = new THREE.Vector3().add(vFG).add(vFN).add(vFf);
                    const kap = (v) => { if (v.length() > 7) v.setLength(7); return v; };
                    stallPil(pFG, tp, vFG);
                    stallPil(pFN, P, kap(vFN));
                    stallPil(pFf, P, kap(vFf));
                    stallStreckPil(pFC, tp, kap(vFC));
                    tmp.copy(pos).addScaledVector(upp, 0.62).addScaledVector(fram, 2.32);
                    stallPil(pV, tmp, fram.clone().multiplyScalar(p.v * 0.1));
                    pFG.visible = sh.krafter; pFN.visible = sh.krafter && ut.N > 1; tpPrick.visible = sh.krafter;
                    tpPrick.position.copy(tp);
                    pFf.visible = sh.krafter && Math.abs(ut.f) * K3 > 0.06;
                    pFC.visible = sh.fc && vFC.length() > 0.06;
                    pV.visible = sh.fart && p.v > 0.2;
                    const tipp = (lapp, from, vec, extra = 0.42) => {
                        const n = vec.clone().normalize();
                        lapp.position.copy(from).add(vec).addScaledVector(n, extra);
                    };
                    tipp(lFG, tp, vFG); tipp(lFN, P, vFN); tipp(lFf, P, vFf, 0.45); tipp(lFC, tp, vFC, 0.5);
                    tipp(lV, tmp, fram.clone().multiplyScalar(p.v * 0.1), 0.35);
                    lFG.visible = pFG.visible; lFN.visible = pFN.visible; lFf.visible = pFf.visible;
                    lFC.visible = pFC.visible; lV.visible = pV.visible;

                    // radien: vågrätt från centrumaxeln till bilens mitt, i höjd med
                    // vägbanan under bilen (så att den inte ligger på centripetalkraften)
                    const radieStart = new THREE.Vector3(0, tp.y, 0);
                    const radieSlut = tp.clone();
                    stallStreckPil(radieLinje, radieStart, radieSlut.clone().sub(radieStart), true);
                    const oversikt = cam.radius > 32;
                    radieLinje.visible = sh.radie && oversikt;
                    const rText = 'r = ' + fmt(rc, 0) + ' m';
                    if (rText !== radieText) {
                        if (radieLapp) { scene.remove(radieLapp); radieLapp.material.map.dispose(); radieLapp.material.dispose(); }
                        radieLapp = textSprite([{ t: 'r', italic: true, color: COL.ink }, { t: rText.slice(1), color: COL.ink }]);
                        scene.add(radieLapp);
                        radieText = rText;
                    }
                    radieLapp.position.copy(radieStart).lerp(radieSlut, 0.5).add(new THREE.Vector3(0, 1.2, 0));
                    radieLapp.visible = sh.radie && oversikt;
                    centrumLapp.visible = oversikt;
                    // etiketten vid centrum på andra sidan om radielinjen
                    centrumLapp.position.set(-tp.x * 0.1, 3.2, -tp.z * 0.1);

                    // kamera
                    const mal = vy === 'hela' ? new THREE.Vector3(0, 0, 0) : tp.clone();
                    if (camMal) {
                        const k = Math.min(1, dtv * 3.2);
                        cam.theta += (camMal.theta - cam.theta) * k;
                        cam.phi += (camMal.phi - cam.phi) * k;
                        cam.radius += (camMal.radius - cam.radius) * k;
                        if (Math.abs(camMal.phi - cam.phi) < 1e-3 && Math.abs(camMal.theta - cam.theta) < 1e-3 && Math.abs(camMal.radius - cam.radius) < 0.05) camMal = null;
                    }
                    if (overgang > 0) {
                        overgang = Math.max(0, overgang - dtv * 1.4);
                        cam.target.lerp(mal, Math.min(1, dtv * 5));
                        if (overgang === 0) cam.target.copy(mal);
                    } else cam.target.copy(mal);
                    const az = (vy === 'hela' ? 0 : phi) + cam.theta;
                    camera.position.set(
                        cam.target.x + cam.radius * Math.sin(cam.phi) * Math.sin(az),
                        cam.target.y + cam.radius * Math.cos(cam.phi),
                        cam.target.z + cam.radius * Math.sin(cam.phi) * Math.cos(az));
                    if (camera.position.y < 0.6) camera.position.y = 0.6;
                    camera.lookAt(cam.target);

                    // skuggan följer bilen
                    sol.position.copy(pos).add(new THREE.Vector3(14, 26, 10));
                    sol.target.position.copy(pos);

                    // etiketterna behåller sin storlek på skärmen
                    const lappH = camera.fov > 45 ? 0.046 : 0.04;
                    [...lappar, radieLapp].forEach(s => {
                        const h = lappH * camera.position.distanceTo(s.position);
                        s.scale.set(h * s.userData.aspect, h, 1);
                    });
                    const nara = cam.radius < 45;
                    [lFG, lFN, lFf, lFC, lV].forEach(s => { if (!nara) s.visible = false; });

                    if (tpPrick.visible) {
                        const perPx = 2 * camera.position.distanceTo(tp) * Math.tan(rad(camera.fov / 2)) / H();
                        tpPrick.scale.setScalar(4.2 * perPx / 0.1);

                    ritaPilar(camera, H());

                };

                return () => {
                    cancelAnimationFrame(raf);
                    ro.disconnect(); io.disconnect();

                    window.removeEventListener('pointermove', onMove);
                    window.removeEventListener('pointerup', onUp);
                    window.removeEventListener('pointercancel', onUp);

                };
            }, []);
            return <div ref={mountRef} className="bana-mount" />;
        }

        // ─────────────────────────────────────────────────────────────────
        // SVG-hjälp
        // ─────────────────────────────────────────────────────────────────
        // Pil som EN polygon (skaft + spets), skaftet slutar vid spetsens bas
        function pilPunkter(x1, y1, x2, y2, bredd = 3.6, spets = 13) {
            const L = Math.hypot(x2 - x1, y2 - y1);
            if (L < 1) return null;
            const ux = (x2 - x1) / L, uy = (y2 - y1) / L, nx = -uy, ny = ux;
            const h = Math.min(spets, L * 0.6), hb = bredd / 2, hs = 6.5;
            const bx = x2 - ux * h, by = y2 - uy * h;
            const P = [[x1 + nx * hb, y1 + ny * hb], [bx + nx * hb, by + ny * hb], [bx + nx * hs, by + ny * hs], [x2, y2],
                       [bx - nx * hs, by - ny * hs], [bx - nx * hb, by - ny * hb], [x1 - nx * hb, y1 - ny * hb]];
            return P.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ');
        }
        const Pil = ({ x1, y1, x2, y2, color, streckad, tunn }) => {
            const L = Math.hypot(x2 - x1, y2 - y1);
            if (L < 2) return null;
            if (!streckad) return <polygon points={pilPunkter(x1, y1, x2, y2, tunn ? 2.2 : 3.6, tunn ? 10 : 13)} fill={color} />;
            const ux = (x2 - x1) / L, uy = (y2 - y1) / L, h = Math.min(tunn ? 10 : 13, L * 0.6);
            const bx = x2 - ux * h, by = y2 - uy * h;
            return (
                <g>
                    <line x1={x1} y1={y1} x2={bx} y2={by} stroke={color} strokeWidth={tunn ? 2 : 3.4}
                          strokeDasharray={tunn ? '4 3' : '7 4'} strokeLinecap="butt" />
                    <polygon points={pilPunkter(bx - ux * 0.5, by - uy * 0.5, x2, y2, 0.1, h)} fill={color} />
                </g>
            );
        };
        const KraftNamn = ({ x, y, sub, color, anchor = 'middle' }) => (
            <text x={x} y={y} textAnchor={anchor} fill={color} fontSize="17" fontWeight="600"
                  fontFamily="Poppins, sans-serif">
                <tspan fontStyle="italic">F</tspan><tspan fontSize="12" dy="5">{sub}</tspan>
            </text>
        );

                return () => window.removeEventListener('resize', h);
            }, []);
            return smal;
        }

                        <rect key={s} x={s > 0 ? m(0.6) : -m(0.86)} y={-m(0.8)} width={m(0.26)} height={m(0.12)} rx="2" fill="#b3121f" />
                    ))}
                    <rect x={-m(0.26)} y={-m(0.64)} width={m(0.52)} height={m(0.14)} rx="1.5" fill="#f4efe5" stroke="#2a3340" strokeWidth="0.8" />
                    <rect x={-m(0.92)} y={-m(0.44)} width={m(1.84)} height={m(0.12)} rx="3" fill="#2a2d33" />
                </g>
            );
        }

        function Tvarsnitt({ alfa, N, f, acc, kompos, visaFC, glider }) {
            const smal = useSmal();
            // På en smal skärm visas ett tätare utsnitt kring bilen, så att
            // etiketterna blir lika stora som brödtexten.
            const VX = smal ? 112 : 0, VW = smal ? 340 : VB_W;
            const a = rad(alfa), ca = Math.cos(a), sa = Math.sin(a);
            // riktningar i SVG (y nedåt): uppför vägbanan = utåt (höger) och uppåt
            const u = { x: ca, y: -sa };          // längs vägbanan, uppåt
            const n = { x: -sa, y: -ca };         // normalen, snett in mot centrum
            const HALV = smal ? 150 : 205;
            const L = { x: C0.x - u.x * HALV, y: C0.y - u.y * HALV };
            const R = { x: C0.x + u.x * HALV, y: C0.y + u.y * HALV };
            const Pe = angreppsPunkt(N, f) * PX;
            const P = { x: C0.x + u.x * Pe, y: C0.y + u.y * Pe };
            const TP = { x: C0.x + n.x * H_TP * PX, y: C0.y + n.y * H_TP * PX };
            const kap = (v) => { const l = Math.hypot(v.x, v.y); return l > 175 ? { x: v.x * 175 / l, y: v.y * 175 / l } : v; };
            const vG = { x: 0, y: MASSA * G * K2 };
            const vN = kap({ x: n.x * N * K2, y: n.y * N * K2 });
            const vF = kap({ x: u.x * f * K2, y: u.y * f * K2 });
            const sum = { x: n.x * N * K2 + u.x * f * K2, y: n.y * N * K2 + u.y * f * K2 + vG.y };
            const vC = kap(sum);

            // Etiketten läggs bortom pilspetsen och flyttas ut ur bilen om den hamnar där
            const iBil = (pt) => {
                const dx = pt.x - C0.x, dy = pt.y - C0.y;
                const lx = dx * u.x + dy * u.y;          // längs vägbanan
                const ly = -(dx * n.x + dy * n.y);       // − ut från vägbanan (lokalt y)
                return Math.abs(lx) < 64 && ly < 12 && ly > -90;
            };
            const etikett = (from, vec, extra = 16) => {
                const l = Math.hypot(vec.x, vec.y) || 1;
                const dx = vec.x / l, dy = vec.y / l;
                let s = extra;
                let pt = { x: from.x + vec.x + dx * s, y: from.y + vec.y + dy * s };
                for (let i = 0; i < 20 && iBil(pt); i++) { s += 8; pt = { x: from.x + vec.x + dx * s, y: from.y + vec.y + dy * s }; }
                const anchor = dx > 0.35 ? 'start' : dx < -0.35 ? 'end' : 'middle';
                return { x: pt.x, y: pt.y + (dy > 0.35 ? 10 : dy < -0.35 ? 0 : 6), anchor };
            };
            const eG = etikett(TP, vG), eN = etikett(P, vN), eC = etikett(TP, vC, 14);
            // friktionens etikett ovanför vägbanan, vid pilspetsen (inte på vägen)
            const fs = Math.sign(f) || 1;
            let eF = { x: P.x + vF.x + u.x * fs * 6 + n.x * 20, y: P.y + vF.y + u.y * fs * 6 + n.y * 20 };
            // hamnar etiketten på bilen flyttas den längs vägbanan, i pilens riktning, tills den är fri
            for (let i = 0; i < 30 && iBil(eF); i++) eF = { x: eF.x + u.x * fs * 8, y: eF.y + u.y * fs * 8 };
            eF = { x: eF.x, y: eF.y + 6, anchor: fs > 0 ? 'start' : 'end' };

            // vinkelbågen vid vägbanans nedre ände
            const bR = 64;
            const bage = alfa >= 2
                ? `M ${L.x + bR} ${L.y} A ${bR} ${bR} 0 0 0 ${L.x + bR * ca} ${L.y - bR * sa}` : null;
            const am = a / 2;
            const alfaLapp = alfa >= 14
                ? { x: L.x + (bR + 14) * Math.cos(am), y: L.y - (bR + 14) * Math.sin(am) + 6 }
                : { x: L.x + bR + 20, y: L.y + 18 };

            const markPunkter = `${VX},${L.y} ${L.x},${L.y} ${R.x},${R.y} ${VX + VW},${R.y} ${VX + VW},${VB_H} ${VX},${VB_H}`;
            const vagband = `${L.x},${L.y} ${R.x},${R.y} ${R.x + n.x * -13},${R.y + n.y * -13} ${L.x + n.x * -13},${L.y + n.y * -13}`;
            const visaF = Math.abs(f) * K2 > 2;

            return (
                <svg viewBox={`${VX} 0 ${VW} ${VB_H}`} width="100%" style={{ display: 'block', maxWidth: 640, margin: '0 auto' }}
                     role="img" aria-label="Tvärsnitt av vägbanan med bilen sedd bakifrån och krafterna på bilen">
                    <polygon points={markPunkter} fill="#e8dcc2" />
                    <polyline points={`${VX},${L.y} ${L.x},${L.y} ${R.x},${R.y} ${VX + VW},${R.y}`} fill="none" stroke="#2a2f38" strokeWidth="1.6" />
                    <polygon points={vagband} fill="#4c4f55" />
                    <line x1={L.x} y1={L.y} x2={R.x} y2={R.y} stroke="#1f2328" strokeWidth="2" />
                    {/* vågrät referens och vinkeln */}
                    <line x1={L.x} y1={L.y} x2={L.x + 130} y2={L.y} stroke={COL.ink} strokeWidth="1.3" strokeDasharray="5 4" opacity="0.7" />
                    {bage && <path d={bage} fill="none" stroke={COL.ink} strokeWidth="1.5" />}
                    {alfa >= 2 && (
                        <text x={alfaLapp.x} y={alfaLapp.y} textAnchor="middle" fontSize="16" fontStyle="italic"
                              fontFamily="Poppins, sans-serif" fill={COL.ink}>α</text>
                    )}
                    {/* riktningen mot centrum */}
                    <g opacity="0.85">
                        <polygon points={pilPunkter(VX + 96, 30, VX + 14, 30, 2, 10)} fill="#5a6170" />
                        <text x={VX + 104} y="35" fontSize={smal ? 15 : 13} fill="#5a6170" fontFamily="DM Sans, sans-serif">mot kurvans centrum</text>
                    </g>

                    <g transform={`translate(${C0.x} ${C0.y}) rotate(${-alfa})`} opacity={glider ? 0.92 : 1}>
                        <BilBakifran />
                    </g>

                    {/* komposanter */}
                    {kompos && (
                        <g>
                            <Pil x1={P.x} y1={P.y} x2={P.x + n.x * N * K2} y2={P.y} color={COL.norm} streckad tunn />
                            <Pil x1={P.x} y1={P.y} x2={P.x} y2={P.y + n.y * N * K2} color={COL.norm} streckad tunn />
                            {visaF && <Pil x1={P.x} y1={P.y} x2={P.x + u.x * f * K2} y2={P.y} color={COL.frik} streckad tunn />}
                            {visaF && <Pil x1={P.x} y1={P.y} x2={P.x} y2={P.y + u.y * f * K2} color={COL.frik} streckad tunn />}
                        </g>
                    )}

                    {/* krafterna */}
                    <Pil x1={TP.x} y1={TP.y} x2={TP.x + vG.x} y2={TP.y + vG.y} color={COL.tyngd} />
                    <Pil x1={P.x} y1={P.y} x2={P.x + vN.x} y2={P.y + vN.y} color={COL.norm} />
                    {visaF && <Pil x1={P.x} y1={P.y} x2={P.x + vF.x} y2={P.y + vF.y} color={COL.frik} />}
                    {visaFC && <Pil x1={TP.x} y1={TP.y} x2={TP.x + vC.x} y2={TP.y + vC.y} color={COL.fc} streckad />}
                    <circle cx={TP.x} cy={TP.y} r="3.2" fill={COL.tyngd} />

                    <KraftNamn {...eG} sub="G" color={COL.tyngd} />
                    <KraftNamn {...eN} sub="N" color={COL.norm} />
                    {visaF && <KraftNamn {...eF} sub="f" color={COL.frik} />}
                    {visaFC && Math.hypot(vC.x, vC.y) > 16 && <KraftNamn {...eC} sub="C" color={COL.fc} />}
                </svg>
            );
        }

        // ─────────────────────────────────────────────────────────────────
        // Fartkartan: vilka kombinationer av α och v håller bilen kvar?
        // ─────────────────────────────────────────────────────────────────
        const KW = 540, KH = 320, KL = 56, KR = 22, KT = 18, KB = 46;
        const kx = (al) => KL + al / A_MAX * (KW - KL - KR);
        const ky = (v) => KH - KB - v / V_MAX * (KH - KT - KB);
        const kyKlipp = (v) => ky(Math.min(V_MAX, v));

        function Fartkarta({ alfa, v, r, mu, onSatt }) {
            const smal = useSmal();
            const fs = smal ? 1.55 : 1;          // större text på smal skärm
            const svgRef = useRef(null);
            const drar = useRef(false);
            const kurvor = useMemo(() => {
                const pts = [];
                for (let al = 0; al <= A_MAX + 1e-9; al += 0.25) pts.push({ al, ...granser(al, r, mu) });
                const lin = (key, max = V_MAX) => {
                    const segs = []; let cur = [];
                    pts.forEach(q => {
                        const val = q[key];
                        if (isFinite(val) && val <= max && (key !== 'vmin' || val > 0)) cur.push(`${kx(q.al).toFixed(1)},${ky(val).toFixed(1)}`);
                        else if (cur.length) { segs.push(cur.join(' ')); cur = []; }
                    });
                    if (cur.length) segs.push(cur.join(' '));
                    return segs;
                };
                const upp = pts.map(q => `${kx(q.al).toFixed(1)},${kyKlipp(isFinite(q.vmax) ? q.vmax : V_MAX).toFixed(1)}`);
                const ned = pts.map(q => `${kx(q.al).toFixed(1)},${kyKlipp(q.vmin).toFixed(1)}`);
                const hall = [...upp, ...ned.slice().reverse()].join(' ');
                const ut = [`${kx(0)},${ky(V_MAX)}`, ...upp, `${kx(A_MAX)},${ky(V_MAX)}`].join(' ');
                const in_ = [`${kx(0)},${ky(0)}`, ...ned, `${kx(A_MAX)},${ky(0)}`].join(' ');
                return { hall, ut, in_, vmax: lin('vmax'), vmin: lin('vmin').filter(s => s.split(' ').length > 1), v0: lin('v0') };
            }, [r, mu]);
            const fran = (e) => {
                const svg = svgRef.current;
                const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
                const q = pt.matrixTransform(svg.getScreenCTM().inverse());
                const al = Math.round(Math.max(0, Math.min(A_MAX, (q.x - KL) / (KW - KL - KR) * A_MAX)));
                const vv = Math.round(2 * Math.max(0, Math.min(V_MAX, (KH - KB - q.y) / (KH - KT - KB) * V_MAX))) / 2;
                onSatt(al, vv);
            };
            const ned = (e) => { drar.current = true; e.currentTarget.setPointerCapture(e.pointerId); fran(e); };
            const flytt = (e) => { if (drar.current) fran(e); };
            const upp = () => { drar.current = false; };
            const g = granser(alfa, r, mu);
            const haller = v <= g.vmax + 1e-9 && v >= g.vmin - 1e-9;
            const tickA = [0, 5, 10, 15, 20, 25, 30, 35, 40, 45];
            const tickV = [0, 5, 10, 15, 20, 25, 30, 35, 40];
            return (
                <svg ref={svgRef} viewBox={`0 0 ${KW} ${KH}`} width="100%" style={{ display: 'block', cursor: 'crosshair' }}
                     onPointerDown={ned} onPointerMove={flytt} onPointerUp={upp} onPointerCancel={upp}
                     role="img" aria-label="Fartkarta: doseringsvinkel mot fart, med området där greppet räcker">
                    <rect x={kx(0)} y={ky(V_MAX)} width={kx(A_MAX) - kx(0)} height={ky(0) - ky(V_MAX)} fill="#f6f1e7" />
                    <polygon points={kurvor.ut} fill="rgba(155,44,44,0.10)" />
                    <polygon points={kurvor.in_} fill="rgba(31,79,163,0.11)" />
                    <polygon points={kurvor.hall} fill="rgba(63,125,58,0.17)" />
                    {/* rutnät */}
                    {tickA.map(t => <line key={'a' + t} x1={kx(t)} y1={ky(0)} x2={kx(t)} y2={ky(V_MAX)} stroke="rgba(70,110,170,0.16)" />)}
                    {tickV.map(t => <line key={'v' + t} x1={kx(0)} y1={ky(t)} x2={kx(A_MAX)} y2={ky(t)} stroke="rgba(70,110,170,0.16)" />)}
                    {/* kurvor */}
                    {kurvor.vmax.map((s, i) => <polyline key={'x' + i} points={s} fill="none" stroke={COL.vmax} strokeWidth="2.6" />)}
                    {kurvor.vmin.map((s, i) => <polyline key={'n' + i} points={s} fill="none" stroke={COL.vmin} strokeWidth="2.6" />)}
                    {kurvor.v0.map((s, i) => <polyline key={'o' + i} points={s} fill="none" stroke={COL.ink} strokeWidth="2" strokeDasharray="7 5" />)}
                    {/* axlar: pil bara åt det positiva hållet */}
                    <line x1={kx(0)} y1={ky(0)} x2={kx(A_MAX) + 10} y2={ky(0)} stroke={COL.ink} strokeWidth="1.5" />
                    <polygon points={`${kx(A_MAX) + 16},${ky(0)} ${kx(A_MAX) + 6},${ky(0) - 4.5} ${kx(A_MAX) + 6},${ky(0) + 4.5}`} fill={COL.ink} />
                    <line x1={kx(0)} y1={ky(0)} x2={kx(0)} y2={ky(V_MAX) - 6} stroke={COL.ink} strokeWidth="1.5" />
                    <polygon points={`${kx(0)},${ky(V_MAX) - 13} ${kx(0) - 4.5},${ky(V_MAX) - 3} ${kx(0) + 4.5},${ky(V_MAX) - 3}`} fill={COL.ink} />
                    {tickA.filter(t => !smal || t % 10 === 0).map(t => <text key={'ta' + t} x={kx(t)} y={ky(0) + 12 + 5 * fs} textAnchor="middle" fontSize={12.5 * fs} fill="#3a4150" fontFamily="DM Sans, sans-serif">{t}</text>)}
                    {tickV.filter(t => t > 0 && (!smal || t % 10 === 0)).map(t => <text key={'tv' + t} x={kx(0) - 7} y={ky(t) + 4.5 * fs} textAnchor="end" fontSize={12.5 * fs} fill="#3a4150" fontFamily="DM Sans, sans-serif">{t}</text>)}
                    <text x={kx(0) - 7} y={ky(0) + 4.5 * fs} textAnchor="end" fontSize={12.5 * fs} fill="#3a4150" fontFamily="DM Sans, sans-serif">0</text>
                    <text x={kx(A_MAX)} y={KH - 4} textAnchor="end" fontSize={14 * fs} fill={COL.ink} fontFamily="DM Sans, sans-serif">
                        doseringsvinkel <tspan fontStyle="italic">α</tspan> (°)
                    </text>
                    <text x={kx(0) + 12} y={ky(V_MAX) - 2} textAnchor="start" fontSize={14 * fs} fill={COL.ink} fontFamily="DM Sans, sans-serif">
                        fart <tspan fontStyle="italic">v</tspan> (m/s)
                    </text>
                    {/* bilens läge */}
                    <line x1={kx(alfa)} y1={ky(0)} x2={kx(alfa)} y2={ky(v)} stroke={COL.ink} strokeWidth="1" strokeDasharray="3 3" opacity="0.55" />
                    <line x1={kx(0)} y1={ky(v)} x2={kx(alfa)} y2={ky(v)} stroke={COL.ink} strokeWidth="1" strokeDasharray="3 3" opacity="0.55" />
                    <circle cx={kx(alfa)} cy={ky(v)} r="9.5" fill={haller ? COL.hall : COL.vmax} opacity="0.25" />
                    <circle cx={kx(alfa)} cy={ky(v)} r="6" fill={COL.ink} />
                </svg>
            );
        }

        // ─────────────────────────────────────────────────────────────────
        // Formelkort och KaTeX
        // ─────────────────────────────────────────────────────────────────
        const Vbl = ({ lbl, children, color }) => (
            <div className="flex flex-col items-center" style={{ lineHeight: 1.1 }}>
                <span className="flbl">{lbl}</span>
                <span className="fnum" style={color ? { color } : undefined}>{children}</span>
                <span className="flbl" aria-hidden="true" style={{ visibility: 'hidden' }}>{lbl}</span>
            </div>
        );
        const Op = ({ children }) => <span className="fnum" style={{ padding: '0 2px' }}>{children}</span>;
        const Brak = ({ topp, nam, tLbl, nLbl }) => (
            <div className="flex flex-col items-center" style={{ lineHeight: 1.1 }}>
                <span className="flbl brak-etikett">{tLbl}</span>
                <span className="fnum" style={{ padding: '0 3px 3px' }}>{topp}</span>
                <span className="fnum" style={{ padding: '3px 3px 0', borderTop: '2px solid currentColor', alignSelf: 'stretch', textAlign: 'center' }}>{nam}</span>
                <span className="flbl brak-etikett">{nLbl}</span>
            </div>
        );
        const FormulaCard = () => (
            <div className="glass-card rounded-xl p-4 mb-6" style={{ color: 'var(--lab-ink)' }}>
                <div className="flex flex-wrap items-start gap-x-10 gap-y-5">
                    <div>
                        <div className="fcap">Resultanten krökar banan</div>
                        <div className="flex items-center gap-x-2">
                            <Vbl lbl="Centripetalkraft" color={COL.fc}><em>F</em><sub>C</sub></Vbl>
                            <Op>=</Op>
                            <Brak topp={<span><em>m</em> · <em>v</em><sup>2</sup></span>} nam={<em>r</em>} tLbl={<span>Massa · fart<sup>2</sup></span>} nLbl="Radie" />
                        </div>
                    </div>
                    <div>
                        <div className="fcap">Greppet räcker så länge</div>
                        <div className="flex items-center gap-x-2">
                            <Vbl lbl="Friktionskraft" color={COL.frik}><em>F</em><sub>f</sub></Vbl>
                            <Op>≤</Op>
                            <Vbl lbl="Friktionstal"><em>μ</em></Vbl>
                            <Op>·</Op>
                            <Vbl lbl="Normalkraft" color={COL.norm}><em>F</em><sub>N</sub></Vbl>
                        </div>
                    </div>
                    <div>
                        <div className="fcap">Ingen friktion behövs när</div>
                        <div className="flex items-center gap-x-2">
                            <Vbl lbl="Doseringsvinkel">tan <em>α</em></Vbl>
                            <Op>=</Op>
                            <Brak topp={<span><em>v</em><sup>2</sup></span>} nam={<span><em>r</em> · <em>g</em></span>} tLbl={<span>Fart<sup>2</sup></span>} nLbl={<span>Radie · tyngdfaktor</span>} />
                        </div>
                    </div>
                </div>
            </div>
        );

        const Tex = ({ t, d }) => {
            const ref = useRef(null);
            useEffect(() => {
                let stopp = false;
                const rita = () => {
                    if (stopp || !ref.current) return;
                    if (window.katex) katex.render(t, ref.current, { displayMode: !!d, throwOnError: false });
                    else setTimeout(rita, 120);
                };
                rita();
                return () => { stopp = true; };
            }, [t, d]);
            return d ? <div ref={ref} /> : <span ref={ref} />;
        };

        const StSlider = ({ label, value, min, max, step, onChange, valueText }) => (
            <div className="st-slider">
                <div className="st-slider-top">
                    <span dangerouslySetInnerHTML={{ __html: label }} />
                    <span style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 600, fontSize: 13 }}>{valueText}</span>
                </div>
                <span className="sl-wrap">
                    <input type="range" min={min} max={max} step={step} value={value}
                           onChange={(e) => onChange(parseFloat(e.target.value))} />
                </span>
            </div>
        );
        const Reglage = ({ label, value, min, max, step, onChange, text, aria }) => (
            <div className="mb-2">
                <div className="mb-1 flex justify-between items-baseline">
                    <span className="text-sm" style={{ color: 'var(--lab-ink)' }} dangerouslySetInnerHTML={{ __html: label }} />
                    <span className="mono text-sm">{text}</span>
                </div>
                <input type="range" className="w-full cursor-pointer" min={min} max={max} step={step} value={value}
                       onChange={(e) => onChange(parseFloat(e.target.value))} aria-label={aria} />
            </div>
        );

        // ─────────────────────────────────────────────────────────────────
        // Appen
        // ─────────────────────────────────────────────────────────────────
        const START = { v: 20, alfa: 15, r: 60, mu: 0.8 };

        const App = () => {
            const [v, setV] = useState(START.v);
            const [alfa, setAlfa] = useState(START.alfa);
            const [r, setR] = useState(START.r);
            const [mu, setMu] = useState(START.mu);
            const [running, setRunning] = useState(true);
            const [slow, setSlow] = useState(false);
            const [show, setShow] = useState({ ...SIM.p.show });
            const [kompos, setKompos] = useState(false);
            const [vy, setVy] = useState('folj');
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [togglesOpen, setTogglesOpen] = useState(true);
            const [ut, setUt] = useState({ ...SIM.ut });
            const sceneWrapRef = useRef(null);

            useEffect(() => {
                Object.assign(SIM.p, { v, alfa, r, mu, running, slow, show: { ...show } });
            }, [v, alfa, r, mu, running, slow, show]);
            useEffect(() => {
                const id = setInterval(() => setUt({ ...SIM.ut }), 90);
                return () => clearInterval(id);
            }, []);
            useEffect(() => {
                const h = () => setIsFullscreen(!!(document.fullscreenElement || document.webkitFullscreenElement));
                document.addEventListener('fullscreenchange', h);
                document.addEventListener('webkitfullscreenchange', h);
                return () => { document.removeEventListener('fullscreenchange', h); document.removeEventListener('webkitfullscreenchange', h); };
            }, []);
            const toggleFullscreen = () => {
                const el = sceneWrapRef.current;
                if (document.fullscreenElement || document.webkitFullscreenElement) {
                    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                } else {
                    (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
                }
            };
            const tShow = (k) => setShow(s => ({ ...s, [k]: !s[k] }));
            const valjVy = (n) => { setVy(n); if (SIM.vy) SIM.vy(n); };
            const borjaOm = () => {
                setV(START.v); setAlfa(START.alfa); setR(START.r); setMu(START.mu);
                setRunning(true); setSlow(false); if (SIM.reset) SIM.reset(); valjVy('folj');
            };

            const g = granser(alfa, r, mu);
            const friktionsfri = () => setV(Math.round(Math.min(V_MAX, g.v0) * 10) / 10);
            const typ = underlagFor(mu);

            // grepp och status
            const behov = Math.abs(ut.fBehov != null ? ut.fBehov : 0);
            const fMax = mu * ut.N;
            const andel = fMax > 1 ? behov / fMax : (behov > 1 ? Infinity : 0);
            const status = ut.av === 1 ? 'Bilen gled ut till ytterkanten'
                : ut.av === -1 ? 'Bilen gled ned till innerkanten'
                : ut.glider ? (ut.w > 0 ? 'Bilen glider utåt' : 'Bilen glider inåt')
                : 'Greppet räcker';
            const statusFarg = ut.glider ? COL.vmax : COL.hall;
            const friktRiktning = Math.abs(ut.f) < 30 ? 'ingen friktion behövs'
                : ut.f > 0 ? 'uppför vägbanan, utåt' : 'nedför vägbanan, inåt';
            const kN = (x) => fmt(Math.abs(x) / 1000, 1) + ' kN';

            const reglageFS = (
                <React.Fragment>
                    <StSlider label="Fart (<em>v</em>)" value={v} min={0} max={V_MAX} step={0.5} onChange={setV} valueText={`${fmt(v, 1)} m/s`} />
                    <StSlider label="Doseringsvinkel (<em>α</em>)" value={alfa} min={0} max={A_MAX} step={1} onChange={setAlfa} valueText={`${fmt(alfa, 0)}°`} />
                    <StSlider label="Radie (<em>r</em>)" value={r} min={R_MIN} max={R_MAX} step={5} onChange={setR} valueText={`${fmt(r, 0)} m`} />
                    <StSlider label="Friktionstal (<em>μ</em>)" value={mu} min={0} max={1} step={0.05} onChange={setMu} valueText={fmt(mu, 2)} />
