    <script type="importmap">
{

    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",

    <script type="module">
      import React, { useState, useEffect, useRef } from 'react';
      import ReactDOM from 'react-dom/client';
      import { Thermometer, MoveHorizontal, Info } from 'lucide-react';

      // =====================================================================
      // FYSIKALISK MODELL — kroppens värmebalans i vila
      // ---------------------------------------------------------------------
      // 1. Ämnesomsättningen alstrar hela tiden värme. En vuxen i vila
      //    motsvarar ett element på ca 100 W (80–100 W). Termodynamikens
      //    första huvudsats kräver att exakt lika mycket värme lämnar kroppen,
      //    annars ändras kroppstemperaturen.
      //
      // 2. Det är HUDENS YTA som växlar värme med rummet, inte kärnan.
      //    Huden håller ca 33 °C medan kärnan håller 37 °C.
      //
      // 3. Värmeutbytet med rummet är DUBBELRIKTAT. Allt som är varmare än
      //    absoluta nollpunkten strålar värme, så rummet strålar hela tiden
      //    in värme mot kroppen — samtidigt som huden strålar ut. Båda
      //    bruttoflödena modelleras Stefan–Boltzmann-mässigt som C · T⁴
      //    (T i kelvin), med konstanten C kalibrerad så att NETTOT
      //
      //        P_netto = C · (T_hud⁴ − T_luft⁴)
      //
      //    blir precis 100 W vid 22 °C — då råder termisk komfort.
      //    (Konvektionen bakas in i samma konstant; en klädd person i
      //    stillastående luft. Bruttoflödena hamnar då på realistiska
      //    ~700 W ut och ~600 W in.)
      //
      // 4. Räcker inte den passiva avgivningen måste resten bort genom
      //    AVDUNSTNING (svettning). Är luften varmare än huden vänder
      //    nettoflödet helt: värme strömmar IN i kroppen och bara
      //    avdunstning kyler.
      //
      // 5. Upplevelsen styrs av balansen P_netto − P_metabol, inte av om
      //    luften är kallare än kroppens 37 °C. Därför känns 36 °C hett.
      // =====================================================================

      const T_HUD = 33;                        // °C — hudens yttemperatur i vila
      const T_KARNA = 37;                      // °C — kroppens kärntemperatur
      const P_METABOL = 100;                   // W  — värmeeffekt i vila
      const T_KOMFORT = 22;                    // °C — lufttemperatur för komfort

      const K4 = (c) => Math.pow(c + 273.15, 4);           // (T i kelvin)⁴
      const C_STR = P_METABOL / (K4(T_HUD) - K4(T_KOMFORT)); // ≈ 8,4·10⁻⁸ W/K⁴

      const P_UT_STRAL = C_STR * K4(T_HUD);    // ≈ 730 W — konstant (huden 33 °C)
      const stralIn = (tAir) => C_STR * K4(tAir);

      const T_MIN = -20;                       // °C — glidarens ändlägen
      const T_MAX = 50;

      // ===== UTILS =====
      const NB = ' ';                     // hårt mellanslag
      const MINUS = '−';                  // äkta minustecken

      const kelvin = (c) => Math.round(c + 273.15);

      const fmtC = (c) => {
        const r = Math.round(c);
        return (r < 0 ? MINUS : '') + Math.abs(r) + NB + '°C';
      };

      const fmtW = (w) => {
        const r = Math.round(w);
        if (r === 0) return '0' + NB + 'W';
        return (r < 0 ? MINUS : '') + Math.abs(r) + NB + 'W';
      };

      // Bruttoflödena är modellvärden — avrunda till tiotal W
      const fmtW10 = (w) => {
        const r = Math.round(w / 10) * 10;
        if (r === 0) return '0' + NB + 'W';
        return (r < 0 ? MINUS : '') + Math.abs(r) + NB + 'W';
      };

      // Nettoflöde ut från huden (positivt = ut, negativt = in i kroppen)
      const heatOut = (tAir) => P_UT_STRAL - stralIn(tAir);

      // Pillängder. Bruttopilarna ("alla"-läget) är STRIKT proportionella
      // mot effekten så att ut- och in-pilen kan jämföras med ögat.
      const lenGross = (p) => 0.19 * Math.abs(p);
      // Nettopilarna ("balans"-läget) är proportionella i det normala
      // spannet och mättas mjukt först vid extremkyla.
      const lenNet = (p) => 260 * Math.tanh(Math.abs(p) * 0.9 / 260);

      // Upplevelsen bestäms av balansen mellan avgiven och alstrad värme.
      const sensation = (balans) => {
        if (balans > 100) return {
          text: 'MYCKET KALLT', tone: '#1e3a8a',
          why: 'Du förlorar långt mer värme än kroppen hinner alstra.'
        };
        if (balans > 39) return {
          text: 'KALLT', tone: '#1d4ed8',
          why: 'Värmeförlusten är mycket större än värmeproduktionen.'
        };
        if (balans > 9) return {
          text: 'SVALT', tone: '#2563eb',
          why: 'Du gör dig av med lite mer värme än du alstrar.'
        };
        if (balans >= -9) return {
          text: 'BEHAGLIGT', tone: '#15803d',
          why: 'Du gör dig av med precis så mycket värme som du alstrar.'
        };
        if (balans >= -39) return {
          text: 'VARMT', tone: '#c2410c',
          why: 'Du blir inte av med all värme — resten måste svettas bort.'
        };
        if (balans >= -94) return {
          text: 'MYCKET VARMT', tone: '#c8324a',
          why: 'Nästan ingen värme lämnar huden passivt. Du svettas mycket.'
        };
        return {
          text: 'HETT', tone: '#991b1b',
          why: 'Luften är varmare än huden, så värme strömmar in i kroppen. Bara avdunstning kyler.'
        };
      };

      // ===== FÄRGER (mörka nog för ljus pappersbakgrund) =====
      const COL = {
        ut: '#c8324a',       // värme som strålar ut från huden
        in: '#c2410c',       // värme som strålar in från rummet
        metabol: '#b45309',  // kroppens egen värmeproduktion
        metabolGlow: '#f59e0b',
        referens: '#b45309', // streckad referenspil = det som måste bort
        svett: '#0e7490',    // avdunstning
        overskott: '#2563eb' // överskottet som kyler ner dig
      };

      // ===== COMPONENT: FLOW ARROW (vågrät) =====
      // Pekar från (xTail, y) till (xTip, y). Skaftet slutar vid huvudets
      // bas; fast huvudstorlek — det är LÄNGDEN som bär informationen.
      const FlowArrow = ({ xTail, xTip, y, color, dashed = false, animate = true }) => {
        const len = Math.abs(xTip - xTail);
        if (len < 14) return null;
        const dir = xTip > xTail ? 1 : -1;
        const headL = Math.min(20, Math.max(13, len * 0.35));
        const headW = 11;
        const baseX = xTip - dir * headL;
        return React.createElement('g', {
          className: animate && !dashed ? 'flow-anim' : undefined
        },
          React.createElement('line', {
            x1: xTail, y1: y, x2: baseX, y2: y,
            stroke: color,
            strokeWidth: dashed ? 3 : 12,
            strokeLinecap: 'butt',
            strokeDasharray: dashed ? '8 6' : undefined
          }),
          React.createElement('polygon', {
            points: `${baseX},${y - headW} ${xTip},${y} ${baseX},${y + headW}`,
            fill: dashed ? 'none' : color,
            stroke: dashed ? color : 'none',
            strokeWidth: dashed ? 2.4 : 0,
            strokeLinejoin: 'round'
          })
        );
      };

      // ===== COMPONENT: EVAPORATION ARROW (uppåt) =====
      const EvapArrow = ({ x, yBase, len, color }) => {
        if (len < 14) return null;
        const tipY = yBase - len;
        const headY = tipY + 11;
        return React.createElement('g', { className: 'flow-anim' },
          React.createElement('line', {
            x1: x, y1: yBase, x2: x, y2: headY,
            stroke: color, strokeWidth: 5, strokeLinecap: 'butt'
          }),
          React.createElement('polygon', {
            points: `${x - 7.5},${headY} ${x},${tipY} ${x + 7.5},${headY}`,
            fill: color
          })
        );
      };

      // ===== SCENENS REKVISITA =====
      const el = React.createElement;

      // Människa: klädd figur (t-shirt + byxor), ritad med omsorg.
      // Fötterna står på golvet (lokal y = 100 ⇒ global y = 350).
      // Siluetten håller sig inom |x| ≲ 31 så att flödespilarna
      // (fäste vid ±40) aldrig ligger på armarna.
      const Person = ({ cx, cy }) => el('g', { transform: `translate(${cx}, ${cy})` },
        // Skugga på golvet
        el('ellipse', { cx: 0, cy: 101, rx: 46, ry: 6, fill: 'rgba(15,22,32,0.10)' }),
        // Byxor
        el('path', {
          d: 'M -19 12 L -21.5 86 Q -21.5 91 -17 91 L -7.5 91 Q -4.5 91 -4.3 87 L -1.5 38 L 1.5 38 L 4.3 87 Q 4.5 91 7.5 91 L 17 91 Q 21.5 91 21.5 86 L 19 12 Z',
          fill: '#3f4a5c'
        }),
        // Skor
        el('path', { d: 'M -22 91 L -5 91 L -5 98 Q -5 100 -8 100 L -20 100 Q -24 100 -24 96 Q -24 92 -22 91 Z', fill: '#2a2f3a' }),
        el('path', { d: 'M 22 91 L 5 91 L 5 98 Q 5 100 8 100 L 20 100 Q 24 100 24 96 Q 24 92 22 91 Z', fill: '#2a2f3a' }),
        // Armar (hud) — från ärmslut ner till händerna
        el('path', { d: 'M -25 -12 Q -28 10 -26.5 30', fill: 'none', stroke: '#d4a37c', strokeWidth: 9, strokeLinecap: 'round' }),
        el('path', { d: 'M 25 -12 Q 28 10 26.5 30', fill: 'none', stroke: '#d4a37c', strokeWidth: 9, strokeLinecap: 'round' }),
        el('circle', { cx: -26.5, cy: 34, r: 5.2, fill: '#d4a37c' }),
        el('circle', { cx: 26.5, cy: 34, r: 5.2, fill: '#d4a37c' }),
        // Hals
        el('rect', { x: -6.5, y: -58, width: 13, height: 10, fill: '#c99a70' }),
        // T-shirt (axlar, korta ärmar, midja)
        el('path', {
          d: 'M 0 -52 C -13 -52 -23 -48 -25.5 -40 L -30 -14 Q -30.5 -9 -26 -8.5 L -20.5 -8 L -20.5 8 Q -20.5 15 -13 15 L 13 15 Q 20.5 15 20.5 8 L 20.5 -8 L 26 -8.5 Q 30.5 -9 30 -14 L 25.5 -40 C 23 -48 13 -52 0 -52 Z',
          fill: '#6b7a8f'
        }),
        // Halsringning
        el('path', { d: 'M -8 -51 Q 0 -45 8 -51', fill: 'none', stroke: '#59687c', strokeWidth: 2.5, strokeLinecap: 'round' }),
        // Huvud
        el('circle', { cx: 0, cy: -74, r: 20, fill: '#d4a37c', stroke: 'rgba(90,60,35,0.35)', strokeWidth: 1.4 }),

        useEffect(() => {
          const handler = () => {
            setIsFullscreen(
              document.fullscreenElement === sceneRef.current ||
              document.webkitFullscreenElement === sceneRef.current
            );
          };
          document.addEventListener('fullscreenchange', handler);
          document.addEventListener('webkitfullscreenchange', handler);
          return () => {
            document.removeEventListener('fullscreenchange', handler);
            document.removeEventListener('webkitfullscreenchange', handler);
          };
        }, []);

        const toggleFullscreen = () => {
          const el = sceneRef.current;
          if (!el) return;
          const isFs = document.fullscreenElement || document.webkitFullscreenElement;
          if (isFs) {
            (document.exitFullscreen || document.webkitExitFullscreen).call(document);
          } else {
            (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
          }
        };

        const handleTempChange = (e) => setTAir(Number(e.target.value));

        return React.createElement('div', {
          className: "min-h-screen font-sans",
          style: { fontFamily: 'Poppins, sans-serif' }

                    React.createElement('li', null,
                      "Allt som är varmare än absoluta nollpunkten strålar värme. Rummet strålar därför hela tiden in värme mot dig — men huden (ca 33" + NB + "°C) strålar ut ännu mer, så nettoflödet går ut."),
