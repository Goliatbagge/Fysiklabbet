    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ─────────────────────────────────────────────────────────────────
        // Fysiken, exakt enligt genomgången fy1-7.2:
        //   F = k · |Q1| · |Q2| / r²,  k ≈ 8,99 · 10⁹ N·m²/C²
        // Laddningar i nC, avstånd i cm, kraft i N. Laddningarna räknas som
        // punktladdningar (laddningen tänks samlad i kulans mitt).
        // ─────────────────────────────────────────────────────────────────
        const K = 8.99e9;
        const kraft = (q1, q2, r) => K * Math.abs(q1) * Math.abs(q2) * 1e-18 / Math.pow(r / 100, 2);

        const QMAX = 10;                        // laddning −10 … +10 nC
        const NB = ' ';
        const fmt = (num, decimals = 1) => {
            if (!isFinite(num)) return '–';
            const s = num.toFixed(decimals);
            if (parseFloat(s) === 0) return '0';
            return s.replace('.', ',').replace('-', '−');
        };
        const fmtQ = (q) => (q > 0 ? '+' : q < 0 ? '−' : '') + fmt(Math.abs(q), 1) + NB + 'nC';
        const fmtR = (r) => fmt(r, 1) + NB + 'cm';
        const tre = (v) => fmt(v, v >= 100 ? 0 : v >= 10 ? 1 : 2);
        const fmtF = (F) => {
            const u = F * 1e6;
            if (u === 0) return '0' + NB + 'N';
            if (u >= 999.5) return tre(u / 1000) + NB + 'mN';
            if (u >= 0.9995) return tre(u) + NB + 'µN';
            return tre(u * 1000) + NB + 'nN';
        };
        const fmtFak = (x) => (x >= 100 ? fmt(x, 0) : String(parseFloat(x.toPrecision(2))).replace('.', ','));

        const COL = {
            ink:   '#1f2530',
            pos:   '#c0392b',   // positiv laddning (röd, som i genomgångens figur)
            neg:   '#2563c9',   // negativ laddning (blå)
            noll:  '#8a919c',   // oladdad
            kraft: '#1a7f4b',   // kraftpilarna (grön: syns mot både röd och blå kula)
            matt:  '#5a6170',   // avståndet r
        };
        const farg = (q) => (q > 0 ? COL.pos : q < 0 ? COL.neg : COL.noll);

        // ─────────────────────────────────────────────────────────────────
        // Scenen: ett rutat papper där en ruta är 1 cm. Laddningarna dras
        // fritt över papperet.
        // ─────────────────────────────────────────────────────────────────
        const S = 30;                           // px per cm
        const BRED = 32, HOJD = 18;             // papperets storlek (cm)
        const VBW = BRED * S, VBH = HOJD * S;
        const R = 20;                           // kulans radie (px)
        const DMIN = (2 * R + 8) / S;           // minsta avstånd mellan mittpunkterna (cm)
        // Kraftpilarnas skala är FAST: pilens längd är alltid proportionell mot kraften.
        const PXF = 2.5;                        // px per µN
        const RINGAR = [5, 10, 15, 20, 25];     // avståndsringar (cm)

        const klamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const iScen = (p) => ({ x: klamp(p.x, 1, BRED - 1), y: klamp(p.y, 1, HOJD - 1) });

        // Pil från (x, y) i riktningen (ux, uy) med längden L
        const Pil = ({ x, y, ux, uy, L, col }) => {
            const h = Math.max(6, Math.min(14, L * 0.5));
            const v = Math.atan2(uy, ux) * 180 / Math.PI;
            return (
                <g transform={`translate(${x} ${y}) rotate(${v})`}>
                    <line x1="0" y1="0" x2={L - h} y2="0" stroke={col} strokeWidth="4.5" strokeLinecap="butt" />
                    <polygon points={`${L},0 ${L - h},-6.5 ${L - h},6.5`} fill={col} />
                </g>
            );
        };

        const Kula = ({ p, q, visaTecken, handlers }) => {
            const x = p.x * S, y = p.y * S;
            // ett enda tecken, större ju större laddningen är
            const storlek = Math.abs(q) / QMAX;
            const arm = 4 + 8.5 * storlek;
            const id = q > 0 ? 'gPos' : q < 0 ? 'gNeg' : 'gNoll';
            return (
                <g className="kula" {...handlers}>
                    <circle cx={x} cy={y} r={R + 10} fill="transparent" />
                    <ellipse cx={x + 3} cy={y + R + 3} rx={R * 0.9} ry="4" fill="rgba(15,22,32,0.13)" />
                    <circle cx={x} cy={y} r={R} fill={`url(#${id})`} stroke={q > 0 ? '#7d1f16' : q < 0 ? '#143a80' : '#565c66'} strokeWidth="1.5" />
                    <ellipse cx={x - 7} cy={y - 9} rx="6.5" ry="4" fill="#fff" opacity="0.28" transform={`rotate(-30 ${x - 7} ${y - 9})`} />
                    {visaTecken && q !== 0 && (
                        <g stroke="#f7f2e8" strokeWidth={1.8 + 1.7 * storlek} strokeLinecap="round">
                            <line x1={x - arm} y1={y} x2={x + arm} y2={y} />
                            {q > 0 && <line x1={x} y1={y - arm} x2={x} y2={y + arm} />}
                        </g>
                    )}
                </g>
            );
        };

        // En avståndsring kring den laddning som står still, med kraften just där
        const Ring = ({ c, andra, rr, q1, q2, varden }) => {
            const cx = c.x * S, cy = c.y * S, rad = rr * S;
            const text = varden && q1 !== 0 && q2 !== 0 ? `${rr} cm: ${fmtF(kraft(q1, q2, rr))}` : `${rr} cm`;
            const w = text.length * 7.3 + 14;
            const motAndra = Math.atan2(andra.y - c.y, andra.x - c.x);
            let val = null;
            for (const g of [-90, 90, -45, -135, 45, 135, 0, 180]) {
                const a = g * Math.PI / 180;
                const x = cx + rad * Math.cos(a), y = cy + rad * Math.sin(a);
                if (x < w / 2 + 8 || x > VBW - w / 2 - 8 || y < 22 || y > VBH - 14) continue;
                if (x > VBW - 300 && y < 235) continue;                       // inställningsrutan
                if (x < 330 && y < 80) continue;                              // fullskärmsknappen och pilskalan
                if (x < 300 && y > VBH - 110) continue;                       // avläsningsrutan
                let d = Math.abs(a - motAndra) % (2 * Math.PI); if (d > Math.PI) d = 2 * Math.PI - d;
                if (d < 0.5) continue;                                        // inte mot den andra laddningen
                val = { a, x, y }; break;
            }
            const ring = { fill: 'none', stroke: 'rgba(15,22,32,0.30)', strokeWidth: 1.2, strokeDasharray: '3 5' };
            if (!val) return <circle cx={cx} cy={cy} r={rad} {...ring} />;
            const lucka = Math.min(2.4, w / rad) / 2;
            const a0 = val.a + lucka, a1 = val.a - lucka + 2 * Math.PI;
            const P = (a) => `${(cx + rad * Math.cos(a)).toFixed(1)} ${(cy + rad * Math.sin(a)).toFixed(1)}`;
            return (
                <g>
                    <path d={`M${P(a0)} A${rad} ${rad} 0 1 1 ${P(a1)}`} {...ring} />
                    <text x={val.x} y={val.y + 4.5} textAnchor="middle" fontSize="13" fill="#4a515e">{text}</text>
                </g>
            );
        };

        const Scen = ({ svgRef, p1, p2, q1, q2, r, F, show, ankare, handlers }) => {
            const a = { x: p1.x * S, y: p1.y * S }, b = { x: p2.x * S, y: p2.y * S };
            const d = Math.hypot(b.x - a.x, b.y - a.y) || 1;
            const ux = (b.x - a.x) / d, uy = (b.y - a.y) / d;     // enhetsvektor från 1 mot 2
            let nx = -uy, ny = ux; if (ny > 0) { nx = -nx; ny = -ny; }   // normal, uppåt i bilden
            const attr = q1 * q2 < 0;
            const L = Math.min(F * 1e6 * PXF, 4000);
            const gap = d - 2 * R - 6;
            const sida = attr && 2 * L > gap - 8 ? 7 : 0;         // pilarna går förbi varandra i stället för ovanpå
            const QEtikett = ({ p, n, q, s }) => {
                const ut = R + 16 + Math.abs(nx) * 52;
                const isar = d < 140 ? (140 - d) * 0.55 * s : 0;
                let x = p.x - nx * ut + ux * isar, y = p.y - ny * ut + 6 + uy * isar;
                if (y > VBH - 6 || x < 62 || x > VBW - 62) { x = p.x + nx * ut + ux * isar; y = p.y + ny * ut + 6 + uy * isar; }
                if (!show.bet && !show.varden) return null;
                if (!show.bet) return <text x={x} y={y} textAnchor="middle" fontSize="17" fill={COL.ink} pointerEvents="none">{fmtQ(q)}</text>;
                return (
                    <text x={x} y={y} textAnchor="middle" fontSize="17" fill={COL.ink} pointerEvents="none">
                        <tspan fontStyle="italic" fill={farg(q)} fontWeight="600">Q</tspan>
                        <tspan fontSize="12" dy="4" fill={farg(q)} fontWeight="600">{n}</tspan>
                        <tspan dy="-4">{show.varden ? ` = ${fmtQ(q)}` : ''}</tspan>
                    </text>
                );
            };
            const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
            const rUt = (d < 150 ? R + 18 : 15) + Math.abs(nx) * 44;
            return (
                <svg ref={svgRef} viewBox={`0 0 ${VBW} ${VBH}`} preserveAspectRatio="xMidYMid meet"
                     fontFamily="Poppins, system-ui, sans-serif" role="img"
                     aria-label="Två laddningar på ett rutat papper. Kraftpilarna på laddningarna är lika långa.">
                    <defs>
                        <radialGradient id="gPos" cx="35%" cy="30%" r="75%">
                            <stop offset="0%" stopColor="#e8695a" /><stop offset="55%" stopColor="#c0392b" /><stop offset="100%" stopColor="#8f2419" />
                        </radialGradient>
                        <radialGradient id="gNeg" cx="35%" cy="30%" r="75%">
                            <stop offset="0%" stopColor="#5b8fe8" /><stop offset="55%" stopColor="#2563c9" /><stop offset="100%" stopColor="#173f8a" />
                        </radialGradient>
                        <radialGradient id="gNoll" cx="35%" cy="30%" r="75%">
                            <stop offset="0%" stopColor="#c3c8cf" /><stop offset="55%" stopColor="#9aa1ab" /><stop offset="100%" stopColor="#6f7681" />
                        </radialGradient>
                        <pattern id="rutor" width={S} height={S} patternUnits="userSpaceOnUse">
                            <path d={`M${S} 0H0V${S}`} fill="none" stroke="rgba(37,99,201,0.13)" strokeWidth="1" />
                        </pattern>
                        <pattern id="rutor5" width={5 * S} height={5 * S} patternUnits="userSpaceOnUse">
                            <path d={`M${5 * S} 0H0V${5 * S}`} fill="none" stroke="rgba(37,99,201,0.26)" strokeWidth="1.2" />
                        </pattern>
                    </defs>

                    {show.rutor && (
                        <g pointerEvents="none">
                            <rect x={-60 * S} y={-60 * S} width={VBW + 120 * S} height={VBH + 120 * S} fill="url(#rutor)" />
                            <rect x={-60 * S} y={-60 * S} width={VBW + 120 * S} height={VBH + 120 * S} fill="url(#rutor5)" />
                        </g>
                    )}

                    {show.ringar && (
                        <g pointerEvents="none">
                            {RINGAR.map(rr => <Ring key={rr} c={ankare === 1 ? p1 : p2} andra={ankare === 1 ? p2 : p1} rr={rr} q1={q1} q2={q2} varden={show.varden} />)}
                        </g>
                    )}

                    {/* avståndet r mellan mittpunkterna */}
                    {show.linje && <g pointerEvents="none">
                        <line x1={a.x + ux * R} y1={a.y + uy * R} x2={b.x - ux * R} y2={b.y - uy * R}
                              stroke={COL.matt} strokeWidth="1.3" strokeDasharray="5 5" />
                        <text x={mx + nx * rUt} y={my + ny * rUt + 5 * Math.abs(nx)} textAnchor="middle" fontSize="17" fill={COL.ink}>
                            {show.bet && <tspan fontStyle="italic">r</tspan>}{show.bet && show.varden ? ' = ' : ''}{show.varden ? fmtR(r) : ''}
                        </text>
                    </g>}

                    {/* kraftpilarna: alltid lika långa (Newtons tredje lag), fast skala */}
                    {show.kraft && L >= 3 && (attr ? (
                        <g pointerEvents="none">
                            <Pil x={a.x + ux * (R + 3) + nx * sida} y={a.y + uy * (R + 3) + ny * sida} ux={ux} uy={uy} L={L} col={COL.kraft} />
                            <Pil x={b.x - ux * (R + 3) - nx * sida} y={b.y - uy * (R + 3) - ny * sida} ux={-ux} uy={-uy} L={L} col={COL.kraft} />
                            {show.bet && d >= 150 && [[a, 1], [b, -1]].map(([c, s]) => (
                                <text key={s} x={c.x + s * ux * (R + 16) + nx * 24} y={c.y + s * uy * (R + 16) + ny * 24 + 7} textAnchor="middle"
                                      fontSize="20" fontStyle="italic" fontWeight="600" fill={COL.kraft}>F</text>
                            ))}
                        </g>
                    ) : (
                        <g pointerEvents="none">
                            <Pil x={a.x - ux * (R + 3)} y={a.y - uy * (R + 3)} ux={-ux} uy={-uy} L={L} col={COL.kraft} />
                            <Pil x={b.x + ux * (R + 3)} y={b.y + uy * (R + 3)} ux={ux} uy={uy} L={L} col={COL.kraft} />
                            {show.bet && <text x={a.x - ux * (R + 3 + L + 14)} y={a.y - uy * (R + 3 + L + 14) + 7} textAnchor="middle" fontSize="20" fontStyle="italic" fontWeight="600" fill={COL.kraft}>F</text>}
                            {show.bet && <text x={b.x + ux * (R + 3 + L + 14)} y={b.y + uy * (R + 3 + L + 14) + 7} textAnchor="middle" fontSize="20" fontStyle="italic" fontWeight="600" fill={COL.kraft}>F</text>}
                        </g>
                    ))}

                    <Kula p={p1} q={q1} visaTecken={show.tecken} handlers={handlers(1)} />
                    <Kula p={p2} q={q2} visaTecken={show.tecken} handlers={handlers(2)} />
                    <QEtikett p={a} n="1" q={q1} s={-1} />
                    <QEtikett p={b} n="2" q={q2} s={1} />

                    {/* pilskalan (ändras aldrig) */}
                    {show.kraft && (
                        <g pointerEvents="none">
                            <text x="120" y="30" fontSize="14" fill="#5a6170">Pilskala</text>
                            <line x1="120" y1="44" x2="170" y2="44" stroke={COL.kraft} strokeWidth="3" />
                            <line x1="120" y1="39" x2="120" y2="49" stroke={COL.kraft} strokeWidth="1.5" />
                            <line x1="170" y1="39" x2="170" y2="49" stroke={COL.kraft} strokeWidth="1.5" />
                            <text x="179" y="49" fontSize="15" fill={COL.ink}>= {50 / PXF}{NB}µN</text>
                        </g>
                    )}
                </svg>
            );
        };

        // ─────────────────────────────────────────────────────────────────
        // Formelkort, reglage och små hjälpkomponenter
        // ─────────────────────────────────────────────────────────────────
        const LBL0 = { width: 0, display: 'flex', justifyContent: 'center', whiteSpace: 'nowrap' };
        const LBLW = { display: 'flex', justifyContent: 'center', whiteSpace: 'nowrap' };
        const Etikett = ({ a, b, smal, dold }) => (
            <span className="flbl" style={{ ...(smal ? LBL0 : LBLW), visibility: dold ? 'hidden' : 'visible' }} aria-hidden={dold ? 'true' : undefined}>
                <span style={{ textAlign: 'center' }}>{a}<br />{b || NB}</span>
            </span>
        );
        const Vbl = ({ a, b, children }) => (
            <div className="flex flex-col items-center" style={{ gap: 2 }}>
                <Etikett a={a} b={b} />
                <span className="fnum">{children}</span>
                <Etikett a={a} b={b} dold />
            </div>
        );
        const Bel = ({ n }) => (<span style={{ whiteSpace: 'nowrap' }}>|<em>Q</em><span style={{ fontSize: '0.6em', verticalAlign: '-0.28em', marginLeft: '0.04em', marginRight: '0.12em' }}>{n}</span>|</span>);
        const FormulaCard = () => (
            <div className="glass-card rounded-xl p-4 mb-6" style={{ color: 'var(--lab-ink)' }}>
                <div className="flex flex-wrap items-center gap-x-10 gap-y-3">
                    <div className="flex items-center gap-x-2">
                        <Vbl a="Elektrisk" b="kraft"><em>F</em></Vbl>
                        <span className="fnum">=</span>
                        <Vbl a="Coulombs" b="konstant"><em>k</em></Vbl>
                        <span className="fnum">·</span>
                        <div className="flex flex-col items-center" style={{ gap: 2 }}>
                            <Etikett a="Laddningarnas" b="belopp" smal />
                            <span className="inline-flex flex-col items-center fnum" style={{ lineHeight: 1.12 }}>
                                <span style={{ padding: '0 3px 2px' }}><Bel n="1" /> · <Bel n="2" /></span>
                                <span style={{ padding: '2px 3px 0', borderTop: '2px solid var(--lab-ink, #1f2530)', alignSelf: 'stretch', textAlign: 'center' }}><em>r</em><sup style={{ fontSize: '0.6em' }}>2</sup></span>
                            </span>
                            <Etikett a="Avstånd" smal />
                        </div>
                    </div>
                    <div style={{ fontSize: 14, lineHeight: 1.55 }}>
                        <div><em>k</em> ≈ 8,99 · 10<sup>9</sup>{NB}N·m<sup>2</sup>/C<sup>2</sup></div>
                        <div style={{ color: 'var(--lab-ink-muted)' }}>Räkna med laddningarna i coulomb och avståndet i meter.</div>
                    </div>
                </div>
            </div>
        );
        const Frac = ({ top, bot, size = 15 }) => (
            <div className="inline-flex flex-col items-center" style={{ lineHeight: 1.2 }}>
                <span style={{ fontSize: size, padding: '0 4px 2px', whiteSpace: 'nowrap' }}>{top}</span>
                <span style={{ fontSize: size, padding: '2px 4px 0', borderTop: '2px solid currentColor', alignSelf: 'stretch', textAlign: 'center', whiteSpace: 'nowrap' }}>{bot}</span>
            </div>
        );
        // Tal i grundpotensform: 5,0 · 10⁻⁹
        const Pot = ({ v, dec = 1 }) => {
            if (v === 0) return <span>0</span>;
            let e = Math.floor(Math.log10(v));
            let m = v / Math.pow(10, e);
            if (parseFloat(m.toFixed(dec)) >= 10) { m /= 10; e += 1; }
            return <span style={{ whiteSpace: 'nowrap' }}>{m.toFixed(dec).replace('.', ',')} · 10<sup>{String(e).replace('-', '−')}</sup></span>;
        };
        const Q = ({ n }) => (<span style={{ whiteSpace: 'nowrap' }}><em>Q</em>{n === 1 ? '₁' : '₂'}</span>);
        const Slider = ({ n, q, onChange }) => (
            <div className="mb-4">
                <div className="flex justify-between items-baseline mb-1">
                    <label className="text-sm font-bold flex items-center gap-2" style={{ color: 'var(--lab-ink)' }}>
                        <span style={{ width: 11, height: 11, borderRadius: '50%', background: farg(q), display: 'inline-block' }}></span>
                        <span>Laddning <Q n={n} /></span>
                    </label>
                    <div className="font-mono font-semibold text-sm" style={{ color: farg(q) }}>{fmtQ(q)}</div>
                </div>
                <input type="range" min={-QMAX} max={QMAX} step="0.5" value={q}
                       onChange={(e) => onChange(parseFloat(e.target.value))} className="w-full cursor-pointer laddreglage" />
                <div className="flex justify-between text-xs" style={{ color: 'var(--lab-ink-muted)' }}>
                    <span>−10 nC</span><span>0</span><span>+10 nC</span>
                </div>
            </div>
        );
        const StSlider = ({ n, q, onChange }) => (
            <div className="st-slider">
                <div className="st-slider-top">
                    <span>Laddning <Q n={n} /></span>
                    <span style={{ whiteSpace: 'nowrap', fontWeight: 600, color: farg(q) }}>{fmtQ(q)}</span>
                </div>
                <span className="sl-wrap">
                    <input type="range" min={-QMAX} max={QMAX} step="0.5" value={q} onChange={(e) => onChange(parseFloat(e.target.value))} />
                </span>
            </div>
        );

        // ─────────────────────────────────────────────────────────────────
        // Appen
        // ─────────────────────────────────────────────────────────────────
        const App = () => {
            const [q1, setQ1] = useState(5);
            const [q2, setQ2] = useState(-5);
            const [p1, setP1] = useState({ x: 11, y: 9 });
            const [p2, setP2] = useState({ x: 21, y: 9 });
            const [show, setShow] = useState({ kraft: true, ringar: false, rutor: true, tecken: true, bet: true, varden: false, linje: true });
            const [ankare, setAnkare] = useState(1);         // laddningen som ringarna ligger kring
            const [tag, setTag] = useState(null);            // avstånd och kraft när man tog tag i en laddning
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [togglesOpen, setTogglesOpen] = useState(true);

            const sceneWrapRef = useRef(null), svgRef = useRef(null);
            const drag = useRef(null), pos = useRef({ p1, p2 });
            pos.current = { p1, p2 };

            const r = Math.hypot(p2.x - p1.x, p2.y - p1.y);
            const F = kraft(q1, q2, r);
            const attr = q1 * q2 < 0, noll = q1 === 0 || q2 === 0;

            // ── dra laddningarna fritt; ett klick byter tecken ──
            const tillCm = (e) => {
                const svg = svgRef.current, p = svg.createSVGPoint();
                p.x = e.clientX; p.y = e.clientY;
                const m = p.matrixTransform(svg.getScreenCTM().inverse());
                return { x: m.x / S, y: m.y / S };
            };
            const handlers = (n) => ({
                onPointerDown: (e) => {
                    e.preventDefault();
                    const m = tillCm(e), p = n === 1 ? p1 : p2;
                    drag.current = { n, sx: e.clientX, sy: e.clientY, flyttad: false, dx: m.x - p.x, dy: m.y - p.y };
                    e.currentTarget.setPointerCapture(e.pointerId);
                },
                onPointerMove: (e) => {
                    const d = drag.current;
                    if (!d || d.n !== n) return;
                    if (!d.flyttad && Math.hypot(e.clientX - d.sx, e.clientY - d.sy) > 4) {
                        d.flyttad = true;
                        setAnkare(n === 1 ? 2 : 1);
                        setTag({ r, F });
                    }
                    if (!d.flyttad) return;
                    const m = tillCm(e), andra = n === 1 ? pos.current.p2 : pos.current.p1;
                    let ny = iScen({ x: m.x - d.dx, y: m.y - d.dy });
                    // laddningarna kan inte ligga ovanpå varandra
                    for (let i = 0; i < 2; i++) {
                        let vx = ny.x - andra.x, vy = ny.y - andra.y, a = Math.hypot(vx, vy);
                        if (a >= DMIN) break;
                        if (a < 1e-6) { vx = n === 1 ? -1 : 1; vy = 0; a = 1; }
                        ny = iScen({ x: andra.x + vx / a * DMIN, y: andra.y + vy / a * DMIN });
                    }
                    if (Math.hypot(ny.x - andra.x, ny.y - andra.y) < DMIN - 1e-6) return;
                    (n === 1 ? setP1 : setP2)(ny);
                },
                onPointerUp: () => {
                    const d = drag.current;
                    if (d && d.n === n && !d.flyttad) { (n === 1 ? setQ1 : setQ2)(q => -q); }
                    drag.current = null;
                },
                onPointerCancel: () => { drag.current = null; },
            });

            // ── fullskärm ──
            useEffect(() => {
                const h = () => setIsFullscreen(document.fullscreenElement === sceneWrapRef.current || document.webkitFullscreenElement === sceneWrapRef.current);
                document.addEventListener('fullscreenchange', h);
                document.addEventListener('webkitfullscreenchange', h);
                return () => { document.removeEventListener('fullscreenchange', h); document.removeEventListener('webkitfullscreenchange', h); };
            }, []);
            const toggleFullscreen = () => {
                const el = sceneWrapRef.current;
                if (!el) return;
                if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
            };
            const tShow = (k) => setShow(s => ({ ...s, [k]: !s[k] }));
            const andraQ = (set) => (v) => { set(v); setTag(null); };

            // Vad hände sedan man tog tag i laddningen? (avståndet × a ger kraften × b)
            const fr = tag ? r / tag.r : 1;
            const visaTag = tag && !noll && Math.abs(fr - 1) > 0.02;

            const sceneToggles = () => (
                !togglesOpen ? (
                    <button className="st-show-btn" onClick={() => setTogglesOpen(true)} aria-label="Visa inställningar" title="Visa inställningar" aria-expanded="false">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" aria-hidden="true">
                            <line x1="4" y1="8" x2="20" y2="8" /><circle cx="14.5" cy="8" r="2.7" fill="currentColor" stroke="none" />
                            <line x1="4" y1="16" x2="20" y2="16" /><circle cx="9.5" cy="16" r="2.7" fill="currentColor" stroke="none" />
                        </svg>
                    </button>
                ) : (
                <div className="scene-toggles">
                    <button className="st-hide" onClick={() => setTogglesOpen(false)} aria-label="Dölj inställningar" title="Dölj inställningar" aria-expanded="true">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
                    </button>
                    <div className="st-title">Visa</div>
                    <label><input type="checkbox" checked={show.kraft} onChange={() => tShow('kraft')} />
                        <span className="st-swatch" style={{ background: COL.kraft }}></span><span>Kraftpilarna <em>F</em></span></label>
                    <label><input type="checkbox" checked={show.linje} onChange={() => tShow('linje')} />
                        <span className="st-swatch" style={{ background: `repeating-linear-gradient(90deg, ${COL.matt} 0 4px, transparent 4px 7px)`, height: 2 }}></span><span>Avståndet <em>r</em></span></label>
                    <label><input type="checkbox" checked={show.ringar} onChange={() => tShow('ringar')} /><span>Avståndsringarna</span></label>
                    <label><input type="checkbox" checked={show.rutor} onChange={() => tShow('rutor')} /><span>Rutnätet (1 cm)</span></label>
                    <label><input type="checkbox" checked={show.tecken} onChange={() => tShow('tecken')} /><span>Laddningstecknen</span></label>
                    <label><input type="checkbox" checked={show.bet} onChange={() => tShow('bet')} /><span>Beteckningar</span></label>
                    <label><input type="checkbox" checked={show.varden} onChange={() => tShow('varden')} /><span>Värden</span></label>
                    {isFullscreen && (
                        <React.Fragment>
                            <div className="st-title st-group">Reglage</div>
                            <div className="st-sliders">
                                <StSlider n={1} q={q1} onChange={andraQ(setQ1)} />
                                <StSlider n={2} q={q2} onChange={andraQ(setQ2)} />
                            </div>
                        </React.Fragment>
                    )}
                </div>
                )
            );

            return (
                <div className="min-h-screen dark-container px-4 md:px-8 pb-12" style={{ fontFamily: "'DM Sans', sans-serif" }}>
                    <div className="max-w-6xl mx-auto pt-6">
                        <div className="breadcrumb mb-4" style={{ fontSize: 13 }}>
                            <a href="index.html">Hem</a> / <a href="katalog.html#fy1">Fysik nivå 1</a> / Coulombs lag
                        </div>
                        <h1 className="text-3xl md:text-4xl font-black tracking-tight" style={{ color: 'var(--lab-ink)' }}>Coulombs lag</h1>
                        <p className="mt-2 mb-5" style={{ color: 'var(--lab-ink-soft)', maxWidth: 840 }}>
                            Utforska den elektriska kraften mellan två laddningar. Dra laddningarna vart du vill på
                            papperet, klicka på en laddning för att byta tecken och ändra laddningarnas storlek med
                            reglagen. Kraftpilarna är alltid <strong>lika långa</strong> på båda laddningarna, och
                            ringarna visar hur stor kraften blir på olika avstånd.
                        </p>

                        <FormulaCard />

                        <main className="flex flex-col lg:flex-row gap-6">
                            <div className="lg:w-2/3 order-1">
                                <div className={'scene-wrap' + (isFullscreen ? ' is-fs' : '')} data-theme="ljusPapper" ref={sceneWrapRef}>
                                    <Scen svgRef={svgRef} p1={p1} p2={p2} q1={q1} q2={q2} r={r} F={F} show={show} ankare={ankare} handlers={handlers} />

                                    {show.varden && <div className="scene-info">
                                        <span className="si-lbl">Kraft på vardera laddningen</span>
                                        <span className="si-val" style={{ color: COL.kraft }}><em>F</em> = {fmtF(F)}</span>
                                        {visaTag && (
                                            <span className="si-val" style={{ fontSize: 12, fontWeight: 600, color: 'var(--lab-ink-soft)' }}>
                                                avståndet × {fmtFak(fr)} ger kraften × {fmtFak(F / tag.F)}
                                            </span>
                                        )}
                                    </div>}

                                    <div className="scene-hint">Dra laddningarna. Klicka på en laddning för att byta tecken.</div>
                                    {sceneToggles()}

                                    <button className="fs-btn" onClick={toggleFullscreen} aria-label="Fullskärm" title={isFullscreen ? 'Lämna fullskärm' : 'Fullskärm'}>
                                        {isFullscreen ? (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M9 3v6H3" /><path d="M15 21v-6h6" /><path d="M21 9h-6V3" /><path d="M3 15h6v6" />
                                            </svg>
                                        ) : (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M3 9V3h6" /><path d="M21 9V3h-6" /><path d="M3 15v6h6" /><path d="M21 15v6h-6" />
                                            </svg>
                                        )}
                                    </button>
                                </div>
                                <div className="text-xs mt-2" style={{ color: 'var(--lab-ink-muted)' }}>
                                    En ruta är 1 cm. Pilarna ritas i en fast skala, så dubbelt så lång pil betyder
                                    dubbelt så stor kraft. Ringarna ligger kring laddningen du inte drar i.
                                </div>
                                <div className="glass-card rounded-xl p-4 mt-3">
                                    <div className="flbl mb-2">Beräkning</div>
                                    <div className="flex flex-wrap items-center gap-x-2 gap-y-2" style={{ color: 'var(--lab-ink)', fontSize: 15 }}>
                                        <span><em>F</em></span><span>=</span><span><em>k</em></span><span>·</span>
                                        <Frac top={<span>|<Q n={1} />| · |<Q n={2} />|</span>} bot={<span><em>r</em><sup>2</sup></span>} />
                                        <span>=</span>
                                        <span style={{ whiteSpace: 'nowrap' }}>8,99 · 10<sup>9</sup></span><span>·</span>
                                        <Frac top={<span><Pot v={Math.abs(q1) * 1e-9} /> · <Pot v={Math.abs(q2) * 1e-9} /></span>}
                                              bot={<span>{fmt(r / 100, 3)}<sup>2</sup></span>} />
                                        {noll ? <span>=</span> : <span>≈</span>}
                                        {!noll && <span style={{ whiteSpace: 'nowrap' }}><Pot v={F} dec={2} />{NB}N</span>}
                                        {!noll && <span>=</span>}
                                        <span className="font-bold" style={{ color: COL.kraft, whiteSpace: 'nowrap' }}>{fmtF(F)}</span>
                                    </div>
                                    <div className="text-xs mt-2" style={{ color: 'var(--lab-ink-soft)' }}>
                                        Laddningarna sätts in <strong>utan tecken</strong>, i coulomb, och avståndet i meter.
                                        Riktningen resonerar man sig fram till.
                                    </div>
                                </div>
                            </div>

                            <div className="lg:w-1/3 order-2">
                                <div className="glass-card rounded-xl p-4 mb-3">
                                    <Slider n={1} q={q1} onChange={andraQ(setQ1)} />
                                    <Slider n={2} q={q2} onChange={andraQ(setQ2)} />
                                    <div className="text-xs" style={{ color: 'var(--lab-ink-muted)' }}>1{NB}nC = 10<sup>−9</sup>{NB}C</div>
                                </div>

                                <div className="glass-card rounded-xl p-4 mb-3">
                                    <div className="flbl mb-1">Elektrisk kraft</div>
                                    <div className="font-bold" style={{ color: COL.kraft, fontSize: 26, lineHeight: 1.2 }}>
                                        <em>F</em> = {fmtF(F)}
                                    </div>
                                    <div className="text-sm mt-1" style={{ color: 'var(--lab-ink-soft)' }}>
                                        {noll ? 'Ingen kraft: den ena laddningen är noll.'
                                            : attr ? 'Olika tecken: laddningarna attraherar varandra.'
                                                   : 'Lika tecken: laddningarna repellerar varandra.'}
                                    </div>
                                    <div className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                        Avstånd: <em>r</em> = {fmtR(r)}
                                    </div>
                                </div>

                            </div>
                        </main>

                        <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-4 mt-6">
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Lika stor kraft på båda</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Enligt Newtons tredje lag är den elektriska kraften <strong>lika stor</strong> på båda
                                    laddningarna, fast motriktad. Det gäller även när den ena laddningen är mycket större
                                    än den andra. Ställ in 10 nC och 1 nC och jämför pilarna.
                                </p>
                            </div>
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Avståndet står i kvadrat</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Dubbelt avstånd ger en fjärdedel av kraften, tre gånger så långt avstånd en niondel.
                                    Jämför ringarna på 5, 10 och 15 cm, eller dra en laddning och läs av i rutan nere
                                    till vänster hur kraften ändras.
                                </p>
                            </div>
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Räkna utan tecken</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Sätt in laddningarnas belopp i formeln och strunta i tecknen. Kraftens riktning
                                    bestämmer du genom att resonera: <strong>lika tecken repellerar</strong> och{' '}
                                    <strong>olika tecken attraherar</strong>.
                                </p>
                            </div>
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Samma form som gravitationslagen</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Coulombs lag och Newtons gravitationslag är uppbyggda på samma sätt, med laddningar
                                    i stället för massor. Skillnaden är att gravitationen alltid drar, medan elektriska
                                    krafter både kan dra och stöta bort.
                                </p>
                            </div>
                        </div>

                        <details className="glass-card rounded-xl p-4 mt-4">
                            <summary className="accordion-head" style={{ color: 'var(--lab-ink)' }}>
                                <span>Vanliga missuppfattningar</span><span style={{ color: 'var(--lab-ink-muted)' }}>▾</span>
                            </summary>
                            <ul className="mt-3 space-y-2 text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                <li><strong>"Den större laddningen drar hårdare."</strong> Nej. Kraften är lika stor på båda laddningarna, och pilarna är därför alltid lika långa.</li>
                                <li><strong>"Dubbelt avstånd ger halva kraften."</strong> Nej. Avståndet står i kvadrat, så kraften blir en fjärdedel. Jämför ringen på 5 cm med ringen på 10 cm.</li>
                                <li><strong>"En negativ laddning ger en negativ kraft."</strong> Nej. I formeln sätts beloppen in, och kraften får sin riktning av om tecknen är lika eller olika.</li>
                                <li><strong>"Långt bort försvinner kraften."</strong> Nej. Kraften blir snabbt svag men aldrig noll.</li>
                            </ul>
                        </details>

                        <details className="glass-card rounded-xl p-4 mt-4">
                            <summary className="accordion-head" style={{ color: 'var(--lab-ink)' }}>
                                <span>Om modellen</span><span style={{ color: 'var(--lab-ink-muted)' }}>▾</span>
                            </summary>
                            <div className="mt-3 text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                <p>
                                    Coulombs lag gäller för punktladdningar. Här räknas kulorna som om all laddning satt i
                                    kulans mitt, och avståndet <em>r</em> mäts därför mellan mittpunkterna. Krafterna är
                                    små: några mikronewton är ungefär tyngden av ett sandkorn. Eftersom pilarnas skala
                                    är fast kan pilarna bli längre än papperet när två stora laddningar ligger tätt intill varandra.
                                </p>
                            </div>
                        </details>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
