    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        /* =====================================================================
           Inducerad ström och Lenz lag, i 2D och 3D.
           En stavmagnet förs längs slingans (eller spolens) axel, mot den,
           genom den och bort från den. Ändras flödet induceras en spänning,
           e = −N · dΦ/dt, och kretsen får strömmen I = e/R.

           Fysiken (gemensam för 2D och 3D):
           - Stavmagneten är två magnetiska poler (Gilbert-modellen), +Q vid
             nordändan och −Q vid sydändan, Q = Br · A (remanens gånger
             magnetens tvärsnittsarea). Flödet från en punktpol genom en
             cirkelskiva med radien a på avståndet d är
             Q/2 · (sign d − d/√(d² + a²)). Ligger skivan mellan polerna
             läggs magnetiseringens flöde Q till (riktat från S mot N), så
             att flödet blir kontinuerligt när magneten går genom slingan.
           - Spolen har N varv jämnt fördelade över sin längd, och flödena
             summeras: Φ = Σ Φ_varv.
           - e = −(dΦ/dx) · v räknas direkt ur magnetens fart (inget brus
             från numerisk derivering). Kraften på magneten följer av att
             effekten e · I tas från rörelsen: F = −(dΦ/dx)² · v/R, alltid
             motriktad farten, vilket är Lenz lag.
           Teckenkonvention: x åt höger längs axeln. Positiv ström har sitt
           eget fält åt +x och går nedåt i slingans framkant (mot betraktaren).
           ===================================================================== */

        const RMIN = 0.25, RMAX = 3.0;       // resistans R (Ω)
        const AVMIN = 5, AVMAX = 80;         // automatisk fart (cm/s)
        const NMIN = 4, NMAX = 20;           // varvtal i spolen

        // ── Magnet och ledare (cm) ──
        const LM = 10, HM = 1.25;            // magnetens längd och halva höjd
        const QPOL = 5.9e-4;                 // polstyrka Br · A (Wb)
        const A_SLINGA = 4.0;                // slingans radie
        const A_SPOLE = 3.2, L_SPOLE = 8.0;  // spolens radie och längd
        const XMIN = -13, XMAX = 22;         // magnetens mittläge (cm, relativt ledarens mitt)
        const AUTO_A = 20, AUTO_B = -11;     // vändlägen för den automatiska rörelsen

        const tr = (t, p) => (window.I18N ? I18N.t(t, p) : t);

        const fmt = (num, decimals = 1) => {
            if (!isFinite(num)) return '–';
            const s = num.toFixed(decimals);
            if (parseFloat(s) === 0) return '0';
            return s.replace('.', ',').replace('-', '−');
        };
        const fmtSmart = (a, unit) => {
            const b = Math.abs(a);
            if (b < 0.005) return `0 ${unit}`;
            return `${fmt(a, b >= 100 ? 0 : b >= 10 ? 1 : 2)} ${unit}`;
        };

        const COL = {
            ink:    '#1f2530',
            falt:   '#c0392b',   // magnetens fältlinjer (röda, som teorifigurerna)
            v:      '#3f8f4a',   // hastigheten v (grön, som teorifigurerna)
            ind:    '#7b3fa0',   // inducerad ström och dess fält (lila, som teorifigurerna)
            elek:   '#0e7c86',   // elektronerna (blågröna)
            kraft:  '#2563c9',   // kraften på magneten (blå)
            kopparY: '#8a5a28',
            kopparI: '#c87f3a',
            npol:   '#c0392b',
            spol:   '#f4f2ee',
        };

        // ─────────────────────────────────────────────────────────────────
        // Fysiken
        // ─────────────────────────────────────────────────────────────────
        function varvLagen(ledare, N) {
            if (ledare === 'slinga') return { a: A_SLINGA, xs: [0] };
            const xs = [];
            for (let k = 0; k < N; k++) xs.push(-L_SPOLE / 2 + L_SPOLE * (k + 0.5) / N);
            return { a: A_SPOLE, xs };
        }
        // flödet (Wb) åt +x genom ett varv i xt med radien a, magneten i xm
        function phiVarv(xt, a, xm, nMot) {
            const s = nMot ? 1 : -1;               // nMot: nordändan åt −x (mot ledaren)
            const xN = xm - s * LM / 2, xS = xm + s * LM / 2;
            let phi = 0;
            const d1 = xt - xN, d2 = xt - xS;
            phi += QPOL / 2 * (Math.sign(d1) - d1 / Math.hypot(d1, a));
            phi -= QPOL / 2 * (Math.sign(d2) - d2 / Math.hypot(d2, a));
            if (Math.abs(xt - xm) < LM / 2) phi += -s * QPOL;
            return phi;
        }
        function phiTot(xm, geo, nMot) {
            let p = 0;
            for (const xt of geo.xs) p += phiVarv(xt, geo.a, xm, nMot);
            return p;
        }
        function dPhiDx(xm, geo, nMot) {            // Wb per meter
            const h = 0.02;
            return (phiTot(xm + h, geo, nMot) - phiTot(xm - h, geo, nMot)) / (2 * h) * 100;
        }

        // Fältlinjer runt magneten, i magnetens ram (nordändan i x = −LM/2).
        // Spåras en gång i planet genom axeln (övre halvan); 2D speglar dem,
        // 3D vrider ut dem runt axeln.
        function faltPol(x, y) {
            const p = [[-LM / 2, 1], [LM / 2, -1]];
            let hx = 0, hy = 0;
            for (const [px, q] of p) {
                const dx = x - px, dy = y, r = Math.hypot(dx, dy);
                const r3 = r * r * r + 1e-9;
                hx += q * dx / r3; hy += q * dy / r3;
            }
            return [hx, hy];
        }
        function sparaFalt() {
            const linjer = [];
            const vinklar = [0, 24, 48, 74, 102, 132];
            for (const deg of vinklar) {
                const th = deg * Math.PI / 180;
                let x = -LM / 2 - 0.3 * Math.cos(th), y = 0.3 * Math.sin(th);
                const pts = [[x, y]];
                for (let n = 0; n < 2500; n++) {
                    let [hx, hy] = faltPol(x, y); let m = Math.hypot(hx, hy);
                    const h = 0.12;
                    const mx = x + hx / m * h / 2, my = y + hy / m * h / 2;
                    [hx, hy] = faltPol(mx, my); m = Math.hypot(hx, hy);
                    x += hx / m * h; y += hy / m * h;
                    if (n % 2 === 0) pts.push([x, y]);
                    if (Math.hypot(x - LM / 2, y) < 0.35) { pts.push([LM / 2, 0]); break; }
                    if (Math.abs(x) > 34 || Math.abs(y) > 22) break;
                }
                linjer.push(pts);
            }
            return linjer;
        }
        const FALT_LINJER = sparaFalt();

        // ─────────────────────────────────────────────────────────────────
        // 2D-scenen
        // ─────────────────────────────────────────────────────────────────
        const VBW = 820, VBH = 540;
        const PX = 18;                      // px per cm
        const LX = 330, LY = 300;           // ledarens mitt
        const GX = 112, GY = 462;           // galvanometern
        const sx = (x) => LX + x * PX;

        // Punkter längs ledaren: slingan eller spolens skruvlinje. Parametern
        // u går från 0 till N varv; framsidan (mot betraktaren) är högra halvan.
        function ledarPunkt(u, ledare, N) {
            const rx = ledare === 'slinga' ? 22 : 13;
            const ry = (ledare === 'slinga' ? A_SLINGA : A_SPOLE) * PX;
            const len = ledare === 'slinga' ? 0 : L_SPOLE * PX;
            const x0 = LX - len / 2;
            const phi = 2 * Math.PI * u;
            const x = x0 + (ledare === 'slinga' ? 0 : len * u / N) + rx * Math.sin(phi);
            const y = LY - ry * Math.cos(phi);
            return { x, y, fram: Math.sin(phi) >= 0 };
        }

        function Scen2D({ st, p, show, onMagnetDown, svgRef }) {
            const { ledare, N, nMot } = p;
            const nV = ledare === 'slinga' ? 1 : N;
            const els = [], fram = [], bak = [];

            // ledaren: bakre och främre halvor i separata lager
            for (let k = 0; k < nV; k++) {
                for (const halva of [0, 1]) {
                    const pts = [];
                    for (let j = 0; j <= 24; j++) {
                        const u = k + (halva ? 0.5 : 0) + 0.5 * j / 24;
                        const q = ledarPunkt(u, ledare, nV);
                        pts.push(`${q.x.toFixed(1)},${q.y.toFixed(1)}`);
                    }
                    const tjock = ledare === 'slinga' ? 1 : 0.62;
                    const g = (
                        <g key={'v' + k + halva}>
                            <polyline points={pts.join(' ')} fill="none" stroke={COL.kopparY} strokeWidth={11 * tjock} strokeLinecap="round" />
                            <polyline points={pts.join(' ')} fill="none" stroke={halva ? '#a8692f' : COL.kopparI} strokeWidth={7.5 * tjock} strokeLinecap="round" />
                        </g>
                    );
                    (halva ? bak : fram).push(g);
                }
            }
            // spolens stomme (genomskinligt plaströr)

            }
            // ledningar till galvanometern
            const start = ledarPunkt(0.5, ledare, nV), slut = ledarPunkt(nV - 0.5 + 1e-6, ledare, nV);
            const yb = LY + (ledare === 'slinga' ? A_SLINGA : A_SPOLE) * PX;
            const xa = ledare === 'slinga' ? LX - 6 : start.x;
            const xb = ledare === 'slinga' ? LX + 6 : slut.x;
            els.push(
                <g key="ledn" fill="none" stroke={COL.kopparI} strokeWidth="3" strokeLinejoin="round">

            );

            // magnetens fältlinjer (följer med magneten)
            const xmPx = sx(st.xm);
            if (show.linjer) {
                const fEls = [];
                const flip = nMot ? 1 : -1;      // i magnetens ram ligger nordändan åt −x
                FALT_LINJER.forEach((l, i) => {
                    [1, -1].forEach((sy) => {
                        if (i === 0 && sy < 0) return;
                        const pts = l.map(([x, y]) => `${(xmPx + flip * x * PX).toFixed(1)},${(LY - sy * y * PX).toFixed(1)}`);
                        fEls.push(<polyline key={'f' + i + sy} points={pts.join(' ')} fill="none" stroke={COL.falt}
                                            strokeWidth="1.3" opacity="0.6" />);
                        // pil mitt på linjen
                        const m = Math.floor(l.length / 2);
                        const a = l[m], b = l[Math.min(l.length - 1, m + 1)];
                        const ax = xmPx + flip * a[0] * PX, ay = LY - sy * a[1] * PX;
                        let ux = flip * (b[0] - a[0]), uy = -sy * (b[1] - a[1]);
                        const n = Math.hypot(ux, uy) || 1; ux /= n; uy /= n;
                        fEls.push(<polygon key={'fh' + i + sy}
                            points={`${ax + ux * 8},${ay + uy * 8} ${ax - uy * 4},${ay + ux * 4} ${ax + uy * 4},${ay - ux * 4}`}
                            fill={COL.falt} />);

            }

            // magneten
            const nVanster = nMot;
            const mag = (
                <g key="magnet" onPointerDown={onMagnetDown} style={{ cursor: 'grab' }}>
                    <rect x={xmPx - LM * PX / 2 - 12} y={LY - HM * PX - 14} width={LM * PX + 24} height={2 * HM * PX + 28} fill="transparent" />
                    <rect x={xmPx - LM * PX / 2} y={LY - HM * PX} width={LM * PX / 2} height={2 * HM * PX}
                          fill={nVanster ? COL.npol : COL.spol} stroke="#5d646e" strokeWidth="1.2" />
                    <rect x={xmPx} y={LY - HM * PX} width={LM * PX / 2} height={2 * HM * PX}
                          fill={nVanster ? COL.spol : COL.npol} stroke="#5d646e" strokeWidth="1.2" />
                    <rect x={xmPx - LM * PX / 2} y={LY - HM * PX} width={LM * PX} height={HM * PX * 0.55}
                          fill="rgba(255,255,255,0.18)" style={{ pointerEvents: 'none' }} />
                    {[[-1, nVanster ? 'N' : 'S'], [1, nVanster ? 'S' : 'N']].map(([sd, t]) => (
                        <text key={t} x={xmPx + sd * LM * PX / 4} y={LY + 7} textAnchor="middle" fontSize="20" fontWeight="700"
                              fill="#ffffff" stroke={t === 'S' ? '#0f1620' : 'none'} strokeWidth={t === 'S' ? 2.2 : 0}
                              paintOrder="stroke" style={{ pointerEvents: 'none' }}>{t}</text>
                    ))}
                </g>
            );

            // inducerad ström och elektroner längs ledaren
            const strom = [];
            const aktiv = Math.abs(st.I) > 2e-5;
            if (aktiv && (show.strom || show.elek)) {
                const tot = nV;
                if (show.strom) {
                    const per = ledare === 'slinga' ? 8 : 4;
                    for (let k = 0; k < tot * per; k++) {
                        let u = ((k / per + st.flodI) % tot + tot) % tot;
                        const q = ledarPunkt(u, ledare, tot), q2 = ledarPunkt(u + 0.01 * Math.sign(st.I || 1), ledare, tot);
                        let ux = q2.x - q.x, uy = q2.y - q.y; const n = Math.hypot(ux, uy) || 1; ux /= n; uy /= n;
                        const s = 6.5;
                        strom.push(<polygon key={'i' + k} opacity={q.fram ? 1 : 0.35}
                            points={`${q.x + ux * s},${q.y + uy * s} ${q.x - ux * s * 0.7 - uy * s * 0.75},${q.y - uy * s * 0.7 + ux * s * 0.75} ${q.x - ux * s * 0.7 + uy * s * 0.75},${q.y - uy * s * 0.7 - ux * s * 0.75}`}
                            fill={COL.ind} />);
                    }
                }
                if (show.elek) {
                    const per = ledare === 'slinga' ? 14 : 7;
                    for (let k = 0; k < tot * per; k++) {
                        let u = ((k / per + 0.5 / per + st.flodE) % tot + tot) % tot;
                        const q = ledarPunkt(u, ledare, tot);
                        strom.push(<circle key={'e' + k} cx={q.x} cy={q.y} r="3" fill={COL.elek} opacity={q.fram ? 1 : 0.35} />);
                    }
                }
            }

            // jämförelse av fälten genom ledaren (ovanför)
            const jmf = [];
            if (show.falten) {
                const yA = LY - (ledare === 'slinga' ? A_SLINGA : A_SPOLE) * PX - 70;
                const pil = (y, dir, L, color, label, key) => {
                    jmf.push(<text key={key + 't'} x={LX - 62} y={y + 4} textAnchor="end" fontSize="13" fill={color}>{label}</text>);
                    if (L < 6) {
                        jmf.push(<text key={key + 'n'} x={LX} y={y + 4} textAnchor="middle" fontSize="13" fill="var(--lab-ink-muted, #5a6170)">{tr('inget')}</text>);
                        return;
                    }
                    const x0 = LX - dir * L / 2, x1 = LX + dir * L / 2;
                    jmf.push(<line key={key + 'l'} x1={x0} y1={y} x2={x1 - dir * 9} y2={y} stroke={color} strokeWidth="3" strokeLinecap="butt" />);
                    jmf.push(<polygon key={key + 'h'} points={`${x1},${y} ${x1 - dir * 10},${y - 5.5} ${x1 - dir * 10},${y + 5.5}`} fill={color} />);
                };
                const Bm = st.phiVarv / (Math.PI * Math.pow((ledare === 'slinga' ? A_SLINGA : A_SPOLE) / 100, 2));
                pil(yA, Bm >= 0 ? 1 : -1, Math.min(90, 1800 * Math.abs(Bm)), COL.falt, tr('Magnetens fält'), 'm');
                const Li = aktiv ? Math.min(90, 12 + 78 * Math.tanh(Math.abs(st.I) / st.iSkala)) : 0;

            // hastighet och kraft
            const pilar = [];
            if (Math.abs(st.v) > 1.5) {

                pilar.push(<g key="v" style={{ pointerEvents: 'none' }}>
                    <line x1={x0} y1={y} x2={x1 - vd * 10} y2={y} stroke={COL.v} strokeWidth="3" strokeLinecap="butt" />
                    <polygon points={`${x1},${y} ${x1 - vd * 11},${y - 5.5} ${x1 - vd * 11},${y + 5.5}`} fill={COL.v} />

                </g>);
            }
            if (show.kraft && Math.abs(st.F) > 2e-6) {
                const fd = st.F > 0 ? 1 : -1;
                const Lf = Math.min(130, 2600 * Math.abs(st.F) + 14);
                const y = LY + HM * PX + 22;
                const x0 = xmPx, x1 = xmPx + fd * Lf;
                pilar.push(<g key="F" style={{ pointerEvents: 'none' }}>
                    <line x1={x0} y1={y} x2={x1 - fd * 10} y2={y} stroke={COL.kraft} strokeWidth="3" strokeLinecap="butt" />
                    <polygon points={`${x1},${y} ${x1 - fd * 11},${y - 5.5} ${x1 - fd * 11},${y + 5.5}`} fill={COL.kraft} />

            // galvanometern
            const ang = 46 * Math.tanh(st.I / st.iSkala) * Math.PI / 180;
            const galv = (
                <g key="galv">
                    <circle cx={GX} cy={GY} r="44" fill="#fbf8f2" stroke={COL.ink} strokeWidth="1.8" />

                        const rr = a * Math.PI / 180;
                        return <line key={'t' + a} x1={GX + 30 * Math.sin(rr)} y1={GY + 10 - 30 * Math.cos(rr)}
                                     x2={GX + (a === 0 ? 38 : 35) * Math.sin(rr)} y2={GY + 10 - (a === 0 ? 38 : 35) * Math.cos(rr)}
                                     stroke={COL.ink} strokeWidth={a === 0 ? 1.8 : 1.2} />;
                    })}
                    <text x={GX - 30} y={GY - 8} textAnchor="middle" fontSize="12" fill={COL.ink}>−</text>
                    <text x={GX + 30} y={GY - 8} textAnchor="middle" fontSize="12" fill={COL.ink}>+</text>
                    <line x1={GX} y1={GY + 10} x2={GX + 34 * Math.sin(ang)} y2={GY + 10 - 34 * Math.cos(ang)}

                    <circle cx={GX} cy={GY + 10} r="3.2" fill={COL.ink} />
                    <text x={GX} y={GY + 31} textAnchor="middle" fontSize="12" fontWeight="600" fill="var(--lab-ink-muted, #5a6170)">mA</text>
                </g>

            return (
                <svg ref={svgRef} viewBox={`0 0 ${VBW} ${VBH}`} preserveAspectRatio="xMidYMid meet" fontFamily="Poppins, sans-serif">
                    <defs>
                        <linearGradient id="paperG" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0" stopColor="#f7f2e8" />
                            <stop offset="1" stopColor="#ece3d2" />
                        </linearGradient>
                    </defs>
                    <rect x="0" y="0" width={VBW} height={VBH} fill="url(#paperG)" />
                    {/* axeln magneten följer */}
                    <line x1="0" y1={LY} x2={VBW} y2={LY} stroke="rgba(31,37,48,0.12)" strokeWidth="1" strokeDasharray="5 5" />
                    {els}
                    {bak}
                    {mag}
                    {fram}
                    {strom}
                    {jmf}
                    {pilar}
                    {galv}
                </svg>
            );
        }

        // ─────────────────────────────────────────────────────────────────
        // 3D-hjälp (samma mönster som Den enklaste elmotorn)
        // ─────────────────────────────────────────────────────────────────
        const Y_AXEL = new THREE.Vector3(0, 1, 0);
        const linjar = (hex) => new THREE.Color(hex).convertSRGBToLinear();
        const markMat = (hex, opt = {}) => new THREE.MeshStandardMaterial({
            color: linjar(hex), emissive: linjar(hex).multiplyScalar(opt.glod != null ? opt.glod : 0.5),
            roughness: 0.55, metalness: 0, toneMapped: false,
            transparent: !!opt.opacity, opacity: opt.opacity || 1, depthWrite: !opt.opacity });
        function canvasTex(w, h, rita) {
            const c = document.createElement('canvas');
            c.width = w; c.height = h;
            rita(c.getContext('2d'), w, h);
            const t = new THREE.CanvasTexture(c);
            t.encoding = THREE.sRGBEncoding;
            t.anisotropy = 8;
            return t;
        }
        const textSprite = (parts, h = 0.42) => {
            const c = document.createElement('canvas');
            const ctx = c.getContext('2d');
            const FS = 64, PAD = 14;
            const fontFor = (q) => `${q.italic ? 'italic ' : ''}${q.weight || 600} ${q.small ? FS * 0.74 : FS}px Poppins, sans-serif`;
            let w = 0;
            parts.forEach((q) => { ctx.font = fontFor(q); w += ctx.measureText(q.t).width; });
            c.width = Math.max(2, Math.ceil(w) + PAD * 2);
            c.height = FS + PAD * 2;
            let x = PAD;
            parts.forEach((q) => {
                ctx.font = fontFor(q); ctx.textBaseline = 'middle'; ctx.fillStyle = q.color;
                ctx.fillText(q.t, x, c.height / 2 + 2);
                x += ctx.measureText(q.t).width;
            });
            const tex = new THREE.CanvasTexture(c);
            tex.minFilter = THREE.LinearFilter; tex.encoding = THREE.sRGBEncoding;
            const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false, toneMapped: false }));
            spr.scale.set(h * c.width / c.height, h, 1);
            spr.renderOrder = 20;
            return spr;
        };
        function pil(color, r = 0.12) {
            const g = new THREE.Group();
            const mat = markMat(color);
            const skaft = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 1, 14), mat);
            const spets = new THREE.Mesh(new THREE.ConeGeometry(1, 1, 18), mat);
            g.add(skaft, spets);
            g.userData = { skaft, spets, r };
            return g;
        }
        function stallPil(g, from, vec) {
            const len = vec.length();
            if (len < 1e-4) { g.visible = false; return; }
            g.visible = true;
            const r = g.userData.r, head = Math.min(r * 6, len * 0.55), shaft = len - head;
            g.position.copy(from);
            g.quaternion.setFromUnitVectors(Y_AXEL, vec.clone().normalize());
            g.userData.skaft.scale.set(r, Math.max(shaft, 1e-4), r);
            g.userData.skaft.position.set(0, shaft / 2, 0);
            g.userData.spets.scale.set(r * 2.5, head, r * 2.5);
            g.userData.spets.position.set(0, shaft + head / 2, 0);
        }
        function traTextur() {
            return canvasTex(1024, 1024, (ctx, w, h) => {
                const g = ctx.createLinearGradient(0, 0, w, h);
                g.addColorStop(0, '#caa274'); g.addColorStop(1, '#b98d5e');
                ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
                let seed = 11;
                const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
                for (let i = 0; i < 140; i++) {
                    const y0 = rnd() * h, amp = 4 + rnd() * 14, fr = 0.004 + rnd() * 0.01, ph = rnd() * 6;
                    ctx.strokeStyle = `rgba(${90 + rnd() * 30},${55 + rnd() * 20},30,${0.05 + rnd() * 0.13})`;
                    ctx.lineWidth = 0.6 + rnd() * 2.4;
                    ctx.beginPath();
                    for (let x = 0; x <= w; x += 8) {
                        const y = y0 + Math.sin(x * fr + ph) * amp + Math.sin(x * fr * 3.1 + ph) * amp * 0.25;
                        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                    }
                    ctx.stroke();
                }
                ctx.strokeStyle = 'rgba(70,45,25,0.35)'; ctx.lineWidth = 2;
                [256, 512, 768].forEach(y => { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); });
            });
        }
        function omgivning(renderer) {
            const tex = canvasTex(1024, 512, (ctx, w, h) => {
                const g = ctx.createLinearGradient(0, 0, 0, h);
                g.addColorStop(0, '#fbf8f2'); g.addColorStop(0.45, '#efe7d8'); g.addColorStop(0.55, '#a98559'); g.addColorStop(1, '#5d4128');
                ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
                ctx.fillStyle = 'rgba(255,255,255,0.95)';
                ctx.fillRect(w * 0.12, h * 0.12, w * 0.16, h * 0.2);
                ctx.fillRect(w * 0.6, h * 0.08, w * 0.22, h * 0.14);
            });
            tex.mapping = THREE.EquirectangularReflectionMapping;
            const pm = new THREE.PMREMGenerator(renderer);
            const env = pm.fromEquirectangular(tex).texture;
            pm.dispose();
            return env;
        }
        // magnetens ändytor och sidor: röd med vitt N, vit med vitt S och svart kontur
        function magnetTex(nord, w = 512, h = 128) {
            return canvasTex(w, h, (ctx) => {
                ctx.fillStyle = nord ? COL.npol : COL.spol; ctx.fillRect(0, 0, w, h);
                const g = ctx.createLinearGradient(0, 0, 0, h);
                g.addColorStop(0, 'rgba(255,255,255,0.22)'); g.addColorStop(0.5, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(0,0,0,0.08)');
                ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.font = `700 ${Math.round(h * 0.72)}px Poppins, sans-serif`;
                if (!nord) { ctx.lineWidth = h * 0.06; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0f1620'; ctx.strokeText('S', w / 2, h / 2 + h * 0.04); }
                ctx.fillStyle = '#ffffff';
                ctx.fillText(nord ? 'N' : 'S', w / 2, h / 2 + h * 0.04);
            });
        }
        function galvTex() {
            return canvasTex(512, 512, (ctx, w, h) => {
                ctx.fillStyle = '#fbf8f2'; ctx.fillRect(0, 0, w, h);
                const cx = w / 2, cy = h * 0.72;
                ctx.strokeStyle = '#1f2530'; ctx.lineWidth = 4;
                ctx.beginPath(); ctx.arc(cx, cy, h * 0.5, Math.PI * 1.25, Math.PI * 1.75); ctx.stroke();
                for (let k = -10; k <= 10; k++) {

                }
                ctx.fillStyle = '#1f2530'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.font = '700 46px Poppins, sans-serif';
                ctx.fillText('0', cx, cy - h * 0.66);
                ctx.fillText('−', cx - h * 0.42, cy - h * 0.48);
                ctx.fillText('+', cx + h * 0.42, cy - h * 0.48);
                ctx.font = '600 40px Poppins, sans-serif';
                ctx.fillStyle = '#5a6170';
                ctx.fillText('mA', cx, cy - h * 0.18);
            });

        const VYER3 = {

                // labbänk
                const tra = traTextur(); tra.wrapS = tra.wrapT = THREE.RepeatWrapping; tra.repeat.set(2, 1.3);
                const traMat = new THREE.MeshStandardMaterial({ map: tra, roughness: 0.78, envMapIntensity: 0.22 });
                const bank = new THREE.Mesh(new THREE.BoxGeometry(130, 2, 80), traMat);
