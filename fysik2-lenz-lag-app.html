                nal.geometry.translate(0, 1.8, 0);
                const nalG = new THREE.Group(); nalG.position.set(0, 3.8 - 2.7 + 0.75 * 0 + 0.0, 2.32); nalG.add(nal);
                nalG.position.y = 3.8 - 5.4 / 2 + 5.4 * 0.28;
                galvG.add(nalG);
                const glas = new THREE.Mesh(new THREE.PlaneGeometry(7.4, 5.4), new THREE.MeshPhysicalMaterial({ color: linjar(0xffffff), transparent: true, opacity: 0.12, roughness: 0.05, metalness: 0 }));
                glas.position.set(0, 3.8, 2.4); galvG.add(glas);
                const pol = (x, c) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.8, 20), new THREE.MeshStandardMaterial({ color: linjar(c), roughness: 0.4 })); m.position.set(x, 7.4, 1); galvG.add(m); };
                pol(-2.6, 0x1f2530); pol(2.6, 0xb8323a);
                galvG.position.set(-25, 0, -4);
                galvG.rotation.y = 0.55;
                scene.add(galvG);
                galvG.updateMatrixWorld();
                const polV = new THREE.Vector3(-2.6, 7.8, 1).applyMatrix4(galvG.matrixWorld);
                const polH = new THREE.Vector3(2.6, 7.8, 1).applyMatrix4(galvG.matrixWorld);

                // ledaren byggs om när läge eller varvtal ändras
                const ledG = new THREE.Group(); scene.add(ledG);
                const flodG = new THREE.Group(); scene.add(flodG);
                let ledBana = null;          // polylinje för ström och elektroner
                const stromKon = new THREE.ConeGeometry(0.32, 0.9, 14);
                const stromMat = markMat(COL.ind, { glod: 0.45 });
                const elekGeo = new THREE.SphereGeometry(0.22, 12, 8);
                const elekMat = markMat(COL.elek, { glod: 0.45 });
                let stromPilar = [], elektroner = [];

                function polylinje(pts) {
                    const L = [0];
                    for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + pts[i].distanceTo(pts[i - 1]));
                    return {
                        pts, L, len: L[L.length - 1],
                        at(s) {
                            s = ((s % this.len) + this.len) % this.len;
                            let lo = 0, hi = this.L.length - 1;
                            while (hi - lo > 1) { const m = (lo + hi) >> 1; if (this.L[m] < s) lo = m; else hi = m; }
                            const t = (s - this.L[lo]) / Math.max(1e-9, this.L[hi] - this.L[lo]);
                            return { p: this.pts[lo].clone().lerp(this.pts[hi], t), d: this.pts[hi].clone().sub(this.pts[lo]).normalize() };
                        },
                    };
                }
                const tub = (pts, r = 0.16) => {
                    const m = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), Math.max(40, pts.length * 3), r, 10, false), koppar);
                    m.castShadow = true; return m;
                };
                function byggLedare(ledare, N) {
                    while (ledG.children.length) { const c = ledG.children.pop(); if (c.geometry) c.geometry.dispose(); }
                    while (flodG.children.length) flodG.children.pop();
                    let pts = [], a, endA, endB;
                    if (ledare === 'slinga') {
                        a = A_SLINGA;
                        const gap = 0.12;
                        for (let j = 0; j <= 200; j++) {
                            const phi = Math.PI + gap + (2 * Math.PI - 2 * gap) * j / 200;   // börjar längst ned
                            pts.push(new THREE.Vector3(0, AXEL_Y + a * Math.cos(phi), a * Math.sin(phi)));
                        }
                        const ring = tub(pts, 0.22); ledG.add(ring);
                        endA = pts[0]; endB = pts[pts.length - 1];
                        // träfot med stolpe
                        const fot = new THREE.Mesh(new THREE.BoxGeometry(5, 1.2, 5), morkTra); fot.position.set(0, 0.6, 0); fot.castShadow = true; fot.receiveShadow = true; ledG.add(fot);
                        const stolpe = new THREE.Mesh(new THREE.BoxGeometry(1.1, AXEL_Y - a - 1.2 + 0.2, 1.1), morkTra);
                        stolpe.position.set(-0.9, 1.2 + (AXEL_Y - a - 1.2) / 2, 0); stolpe.castShadow = true; ledG.add(stolpe);
                    } else {
                        a = A_SPOLE;
                        const n = N * 60;
                        for (let j = 0; j <= n; j++) {
                            const t = j / n, phi = Math.PI + 2 * Math.PI * N * t;
                            pts.push(new THREE.Vector3(-L_SPOLE / 2 + L_SPOLE * t, AXEL_Y + a * Math.cos(phi), a * Math.sin(phi)));
                        }
                        ledG.add(tub(pts, 0.16));
                        endA = pts[0]; endB = pts[pts.length - 1];
                        // stomme: genomskinligt rör med flänsar, på två träklossar
                        const ror = new THREE.Mesh(new THREE.CylinderGeometry(a - 0.25, a - 0.25, L_SPOLE + 1.2, 48, 1, true),
                            new THREE.MeshPhysicalMaterial({ color: linjar(0xcfe3ee), transparent: true, opacity: 0.22, roughness: 0.1, side: THREE.DoubleSide, depthWrite: false }));
                        ror.rotation.z = Math.PI / 2; ror.position.y = AXEL_Y; ledG.add(ror);
                        [-1, 1].forEach(sd => {
                            const fl = new THREE.Mesh(new THREE.TorusGeometry(a + 0.05, 0.28, 10, 48), new THREE.MeshStandardMaterial({ color: linjar(0x3a5a78), roughness: 0.4 }));
                            fl.rotation.y = Math.PI / 2; fl.position.set(sd * (L_SPOLE / 2 + 0.6), AXEL_Y, 0); ledG.add(fl);
                            const kl = new THREE.Mesh(new THREE.BoxGeometry(1.4, AXEL_Y - a - 0.2, 4), morkTra);
                            kl.position.set(sd * (L_SPOLE / 2 + 0.6), (AXEL_Y - a - 0.2) / 2, 0); kl.castShadow = true; kl.receiveShadow = true; ledG.add(kl);
                        });
                    }
                    // ledningar ned till bordet och fram till galvanometern
                    const ledning = (fran, till, z0) => {
                        const p = [fran.clone(), new THREE.Vector3(fran.x, 1.4, fran.z), new THREE.Vector3(fran.x, 0.25, fran.z + 1.5),
                                   new THREE.Vector3((fran.x + till.x) / 2, 0.25, z0), new THREE.Vector3(till.x + 1.5, 0.25, till.z + 2),
                                   new THREE.Vector3(till.x, 1.5, till.z + 0.8), till.clone()];
                        ledG.add(tub(new THREE.CatmullRomCurve3(p, false, 'centripetal').getPoints(80), 0.13));
                    };
                    ledning(endA, polV, 5);
                    ledning(endB, polH, 6.5);
                    ledBana = polylinje(pts);
                    // strömpilar och elektroner
                    stromPilar = []; elektroner = [];
                    const nP = Math.round(ledBana.len / (ledare === 'slinga' ? 3.2 : 4.2));
                    for (let i = 0; i < nP; i++) { const m = new THREE.Mesh(stromKon, stromMat); flodG.add(m); stromPilar.push({ m, s0: i * ledBana.len / nP }); }
                    const nE = Math.round(ledBana.len / (ledare === 'slinga' ? 1.4 : 1.9));
                    for (let i = 0; i < nE; i++) { const m = new THREE.Mesh(elekGeo, elekMat); flodG.add(m); elektroner.push({ m, s0: (i + 0.5) * ledBana.len / nE }); }
                    return a;
                }

                // stavmagneten med sina fältlinjer (i magnetens ram ligger nordändan åt −x)
                const magG = new THREE.Group(); scene.add(magG);
                const kropp = new THREE.Group(); magG.add(kropp);
                const sidaN = magnetTex(true), sidaS = magnetTex(false);
                const halva = (nord) => {
                    const mats = [];
                    const side = new THREE.MeshStandardMaterial({ map: nord ? sidaN : sidaS, roughness: 0.32, metalness: 0.2 });
                    const end = new THREE.MeshStandardMaterial({ map: magnetTex(nord, 256, 256), roughness: 0.32, metalness: 0.2 });
                    const plain = new THREE.MeshStandardMaterial({ color: linjar(nord ? COL.npol : COL.spol), roughness: 0.32, metalness: 0.2 });
                    // ordning: +x, −x, +y, −y, +z, −z
                    mats.push(nord ? plain : end, nord ? end : plain, side, side, side, side);
                    const m = new THREE.Mesh(new THREE.BoxGeometry(LM / 2, 2 * HM, 2 * HM), mats);
                    m.position.x = nord ? -LM / 4 : LM / 4;
                    m.castShadow = true;
                    m.userData.magnet = true;
                    return m;
                };
                const hN = halva(true), hS = halva(false);
                kropp.add(hN, hS);
                const faltG = new THREE.Group(); magG.add(faltG);
                const faltMat = new THREE.MeshBasicMaterial({ color: linjar(COL.falt), transparent: true, opacity: 0.6, depthWrite: false, toneMapped: false });
                const faltPilMat = markMat(COL.falt, { glod: 0.6 });
                const PLAN = 4;
                FALT_LINJER.forEach((l, i) => {
                    const planer = i === 0 ? 1 : PLAN;
                    for (let k = 0; k < planer; k++) {
                        const w = (k / PLAN) * Math.PI * 2 + Math.PI / 4;
                        const pts = l.map(([x, y]) => new THREE.Vector3(x, y * Math.cos(w), y * Math.sin(w)));
                        const rorL = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), Math.min(300, pts.length * 2), 0.055, 6, false), faltMat);
                        rorL.renderOrder = 2; faltG.add(rorL);
                        const pl = polylinje(pts);
                        const { p, d } = pl.at(pl.len * 0.5);
                        const kon = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.9, 12), faltPilMat);
                        kon.position.copy(p); kon.quaternion.setFromUnitVectors(Y_AXEL, d); faltG.add(kon);
                    }
                });

                // pilar och etiketter
                const vPil = pil(COL.v, 0.16), fPil = pil(COL.kraft, 0.16);
                const bmPil = pil(COL.falt, 0.18), biPil = pil(COL.ind, 0.18);
                scene.add(vPil, fPil, bmPil, biPil);
                const vL = textSprite([{ t: 'v', italic: true, color: COL.v }], 1.5);
                const fL = textSprite([{ t: 'F', italic: true, color: COL.kraft }], 1.5);
                const bmL = textSprite([{ t: tr('Magnetens fält'), color: COL.falt, weight: 600 }], 1.55);
                const biL = textSprite([{ t: tr('Inducerat fält'), color: COL.ind, weight: 600 }], 1.55);
                const iL = textSprite([{ t: 'I', italic: true, color: COL.ind }], 1.6);
                scene.add(vL, fL, bmL, biL, iL);

                let byggt = '';
                let aNu = A_SLINGA;

                // kamera
                const cam = { ...VYER3.snett, target: new THREE.Vector3(...VYER3.snett.target) };
                let camMal = null;
                apiRef.current.vy = (namn) => {
                    const v = VYER3[namn];
                    camMal = { theta: v.theta, phi: v.phi, radius: v.radius, target: new THREE.Vector3(...v.target) };
                };
                const uppdKam = () => {
                    const sp = Math.sin(cam.phi);
                    camera.position.set(cam.target.x + cam.radius * sp * Math.sin(cam.theta),
                                        cam.target.y + cam.radius * Math.cos(cam.phi),
                                        cam.target.z + cam.radius * sp * Math.cos(cam.theta));
                    camera.lookAt(cam.target);
                };

                // pekare: dra magneten längs axeln, annars vrid scenen
                const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
                const satt = (e) => {
                    const r = el.getBoundingClientRect();
                    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
                    ray.setFromCamera(ndc, camera);
                };
                const traffMagnet = () => ray.intersectObjects([hN, hS], false).length > 0;
                const axelX = () => {
                    // planet genom axeln, vänt mot kameran
                    const n = new THREE.Vector3().subVectors(camera.position, new THREE.Vector3(camera.position.x, AXEL_Y, 0));
                    n.x = 0; if (n.lengthSq() < 1e-6) n.set(0, 1, 0); n.normalize();
                    const plan = new THREE.Plane().setFromNormalAndCoplanarPoint(n, new THREE.Vector3(0, AXEL_Y, 0));
                    const q = new THREE.Vector3();
                    return ray.ray.intersectPlane(plan, q) ? q.x : null;
                };
                const pek = new Map();
                let drag = null, pinch = null, magDrag = null;
                const onDown = (e) => {
                    pek.set(e.pointerId, { x: e.clientX, y: e.clientY });
                    el.setPointerCapture(e.pointerId);
                    camMal = null;
                    if (pek.size === 1) {
                        satt(e);
                        if (traffMagnet()) {
                            const x = axelX();
                            magDrag = { off: x != null ? stRef.current.xm - x : 0 };
                            apiRef.current.dragStart();
                        } else drag = { x: e.clientX, y: e.clientY };
                    } else if (pek.size === 2) {
                        const [a, b] = [...pek.values()];
                        pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), r: cam.radius };
                        drag = null;
                    }
                };
                const onMove = (e) => {
                    if (pek.has(e.pointerId)) pek.set(e.pointerId, { x: e.clientX, y: e.clientY });
                    if (pinch && pek.size === 2) {
                        const [a, b] = [...pek.values()];
                        cam.radius = Math.max(30, Math.min(140, pinch.r * pinch.d / Math.max(1, Math.hypot(a.x - b.x, a.y - b.y))));
                        return;
                    }
                    if (magDrag) {
                        satt(e);
                        const x = axelX();
                        if (x != null) apiRef.current.dragTo(x + magDrag.off);
                        return;
                    }
                    if (drag) {
                        cam.theta -= (e.clientX - drag.x) * 0.006;
                        cam.phi = Math.max(0.06, Math.min(1.55, cam.phi - (e.clientY - drag.y) * 0.005));
                        drag.x = e.clientX; drag.y = e.clientY;
                        el.classList.add('dragging');
                        return;
                    }
                    if (e.pointerType === 'mouse') {
                        satt(e);
                        const h = traffMagnet();
                        el.classList.toggle('pointer', h); el.classList.toggle('grab', !h);
                    }
                };
                const onUp = (e) => {
                    pek.delete(e.pointerId);
                    if (magDrag && pek.size === 0) { magDrag = null; apiRef.current.dragEnd(); }
                    if (pek.size < 2) pinch = null;
                    if (pek.size === 0) drag = null;
                    el.classList.remove('dragging');
                };
                const onWheel = (e) => { e.preventDefault(); camMal = null; cam.radius = Math.max(30, Math.min(140, cam.radius * Math.exp(e.deltaY * 0.0012))); };
                el.addEventListener('pointerdown', onDown);
                el.addEventListener('pointermove', onMove);
                el.addEventListener('pointerup', onUp);
                el.addEventListener('pointercancel', onUp);
                el.addEventListener('wheel', onWheel, { passive: false });
                el.classList.add('grab');

                const ro = new ResizeObserver(() => {
                    renderer.setSize(W(), H());
                    camera.aspect = W() / H();
                    // samma vågräta synfält (44°) på alla skärmar, så att magnetens hela väg ryms
                    camera.fov = Math.max(28, Math.min(62, 2 * Math.atan(Math.tan(22 * Math.PI / 180) / camera.aspect) * 180 / Math.PI));
                    camera.updateProjectionMatrix();
                });
                ro.observe(el);
                let synlig = true;
                const io = new IntersectionObserver((en) => { synlig = en[0].isIntersecting; }, { threshold: 0.01 });
                io.observe(el);

                let raf = 0, tLast = performance.now(), nalVinkel = 0;
                const tick = () => {
                    raf = requestAnimationFrame(tick);
                    const now = performance.now();
                    const dt = Math.min(0.05, (now - tLast) / 1000); tLast = now;
                    if (!synlig) return;
                    const st = stRef.current, p = pRef.current, sh = p.show;
                    const nyckel = p.ledare + (p.ledare === 'spole' ? p.N : '');
                    if (nyckel !== byggt) { aNu = byggLedare(p.ledare, p.N); byggt = nyckel; }

                    magG.position.set(st.xm, AXEL_Y, 0);
                    magG.rotation.y = p.nMot ? 0 : Math.PI;
                    faltG.visible = sh.linjer;

                    // ström och elektroner
                    const aktiv = Math.abs(st.I) > 2e-5;
                    const sgn = st.I >= 0 ? 1 : -1;
                    stromPilar.forEach(a => {
                        a.m.visible = sh.strom && aktiv;
                        if (!a.m.visible) return;
                        const { p: q, d } = ledBana.at(a.s0 + st.flodI * ledBana.len / (p.ledare === 'slinga' ? 1 : p.N));
                        a.m.position.copy(q);
                        a.m.quaternion.setFromUnitVectors(Y_AXEL, d.multiplyScalar(sgn));
                    });
                    elektroner.forEach(a => {
                        a.m.visible = sh.elek && aktiv;
                        if (a.m.visible) a.m.position.copy(ledBana.at(a.s0 + st.flodE * ledBana.len / (p.ledare === 'slinga' ? 1 : p.N)).p);
                    });
                    // I-etikett vid ledarens framkant
                    iL.visible = sh.strom && aktiv;
                    iL.position.set((p.ledare === 'slinga' ? 0 : L_SPOLE / 2) + 1.6, AXEL_Y - aNu - 1.4, aNu + 1);

                    // galvanometerns nål
                    const malV = -0.8 * Math.tanh(st.I / st.iSkala);
                    nalVinkel += (malV - nalVinkel) * Math.min(1, dt * 12);
                    nalG.rotation.z = nalVinkel;

                    // fart och kraft
                    const ytt = AXEL_Y + HM + 1.6;
                    if (Math.abs(st.v) > 1.5) {
                        const vd = Math.sign(st.v), L = Math.min(7, 1.2 + 0.06 * Math.abs(st.v));
                        stallPil(vPil, new THREE.Vector3(st.xm - vd * L / 2, ytt, 0), new THREE.Vector3(vd * L, 0, 0));
                        vL.visible = true; vL.position.set(st.xm + vd * (L / 2 + 1), ytt, 0);
                    } else { vPil.visible = false; vL.visible = false; }
                    if (sh.kraft && Math.abs(st.F) > 2e-6) {
                        const fd = Math.sign(st.F), L = Math.min(9, 1 + 180 * Math.abs(st.F));
                        const y = AXEL_Y - HM - 1.6;
                        stallPil(fPil, new THREE.Vector3(st.xm, y, 0), new THREE.Vector3(fd * L, 0, 0));
                        fL.visible = true; fL.position.set(st.xm + fd * (L + 1), y, 0);
                    } else { fPil.visible = false; fL.visible = false; }

                    // fälten genom ledaren, ovanför den
                    const yJ = AXEL_Y + aNu + 3.2;
                    if (sh.falten) {
                        const Bm = st.phiVarv / (Math.PI * Math.pow(aNu / 100, 2));
                        const Lm = Math.min(6, 120 * Math.abs(Bm));
                        stallPil(bmPil, new THREE.Vector3(-Math.sign(Bm) * Lm / 2, yJ + 1.9, 0), new THREE.Vector3(Math.sign(Bm) * Lm, 0, 0));
                        bmL.visible = true; bmL.position.set(-4.5 - bmL.scale.x / 2, yJ + 1.9, 0);
                        const Li = aktiv ? 1 + 5 * Math.tanh(Math.abs(st.I) / st.iSkala) : 0;
                        stallPil(biPil, new THREE.Vector3(-sgn * Li / 2, yJ, 0), new THREE.Vector3(sgn * Li, 0, 0));
                        biL.visible = true; biL.position.set(-4.5 - biL.scale.x / 2, yJ, 0);
                    } else { bmPil.visible = biPil.visible = false; bmL.visible = biL.visible = false; }

                    if (camMal) {
                        const k = Math.min(1, dt * 4);
                        cam.theta += (camMal.theta - cam.theta) * k; cam.phi += (camMal.phi - cam.phi) * k;
                        cam.radius += (camMal.radius - cam.radius) * k; cam.target.lerp(camMal.target, k);
                        if (Math.abs(camMal.phi - cam.phi) < 1e-3 && Math.abs(camMal.theta - cam.theta) < 1e-3) camMal = null;
                    }
                    uppdKam();
                    renderer.render(scene, camera);
                };
                tick();
                return () => {
                    cancelAnimationFrame(raf); ro.disconnect(); io.disconnect();
                    el.removeEventListener('pointerdown', onDown); el.removeEventListener('pointermove', onMove);
                    el.removeEventListener('pointerup', onUp); el.removeEventListener('pointercancel', onUp);
                    el.removeEventListener('wheel', onWheel);
                    renderer.dispose();
                    if (renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement);
                };
            }, []);
            return <div ref={mountRef} className="tre-mount" />;
        }

        // ─────────────────────────────────────────────────────────────────
        // Graf över den inducerade spänningen
        // ─────────────────────────────────────────────────────────────────
        const GRAF_T = 8;   // sekunder
        function Graf({ buf }) {
            const W = 320, H = 130, pl = 40, pr = 10, pt = 10, pb = 22;
            const max = Math.max(...buf.map(b => Math.abs(b.e)), 1e-4);
            const steg = [0.5, 1, 2, 5, 10, 20, 50, 100, 200, 500, 1000];
            const skala = steg.find(s => s >= max * 1000 * 1.05) || 1000;    // mV
            const tNu = buf.length ? buf[buf.length - 1].t : 0;
            const X = (t) => pl + (W - pl - pr) * (1 - (tNu - t) / GRAF_T);
            const Y = (e) => pt + (H - pt - pb) / 2 * (1 - e * 1000 / skala);
            const pts = buf.map(b => `${X(b.t).toFixed(1)},${Y(b.e).toFixed(1)}`).join(' ');
            return (
                <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ display: 'block' }} fontFamily="Poppins, sans-serif">
                    <line x1={pl} y1={pt} x2={pl} y2={H - pb} stroke={COL.ink} strokeWidth="1" opacity="0.5" />
                    <line x1={pl} y1={Y(0)} x2={W - pr} y2={Y(0)} stroke="#38bdf8" strokeWidth="1.4" />
                    <line x1={pl - 4} y1={Y(skala / 1000)} x2={pl} y2={Y(skala / 1000)} stroke={COL.ink} strokeWidth="1" />
                    <line x1={pl - 4} y1={Y(-skala / 1000)} x2={pl} y2={Y(-skala / 1000)} stroke={COL.ink} strokeWidth="1" />
                    <text x={pl - 6} y={Y(skala / 1000) + 4} textAnchor="end" fontSize="10" fill={COL.ink}>{fmt(skala, skala < 1 ? 1 : 0)}</text>
                    <text x={pl - 6} y={Y(0) + 4} textAnchor="end" fontSize="10" fill={COL.ink}>0</text>
                    <text x={pl - 6} y={Y(-skala / 1000) + 4} textAnchor="end" fontSize="10" fill={COL.ink}>{'−' + fmt(skala, skala < 1 ? 1 : 0)}</text>
                    <text x={pl + 4} y={pt + 9} fontSize="10.5" fill={COL.ink}><tspan fontStyle="italic">e</tspan> (mV)</text>
                    <text x={W - pr} y={H - 6} textAnchor="end" fontSize="10.5" fill={COL.ink}><tspan fontStyle="italic">t</tspan> {tr('(senaste 8 s)')}</text>
                    <polyline points={pts} fill="none" stroke={COL.ind} strokeWidth="2" strokeLinejoin="round" />
                </svg>
            );
        }

        // ─────────────────────────────────────────────────────────────────
        // Formelkort
        // ─────────────────────────────────────────────────────────────────
        const Vbl = ({ label, children }) => (
            <div className="flex flex-col items-center" style={{ lineHeight: 1.1 }}>
                <span className="flbl">{label}</span>
                <span className="fnum">{children}</span>
                <span className="flbl" aria-hidden="true" style={{ visibility: 'hidden' }}>{label}</span>
            </div>
        );
        const FracL = ({ topLbl, top, botLbl, bot }) => (
            <div className="flex flex-col items-center" style={{ lineHeight: 1.15 }}>
                <span className="flbl" style={topLbl ? {} : { visibility: 'hidden' }}>{topLbl || '·'}</span>
                <span className="fnum" style={{ padding: '0 8px 3px' }}>{top}</span>
                <span className="fnum" style={{ padding: '3px 8px 0', borderTop: '2px solid currentColor', alignSelf: 'stretch', textAlign: 'center' }}>{bot}</span>
                <span className="flbl" style={botLbl ? {} : { visibility: 'hidden' }}>{botLbl || '·'}</span>
            </div>
        );
        const FormulaCard = () => (
            <div className="glass-card rounded-xl p-4 mb-6 flex flex-wrap items-center gap-x-10 gap-y-4" style={{ color: 'var(--lab-ink)' }}>
                <div style={{ maxWidth: 330 }}>
                    <div className="flbl mb-1">Lenz lag</div>
                    <div style={{ fontSize: 15 }}>
                        En inducerad ström får en sådan riktning att <strong>orsaken till dess
                        uppkomst motverkas</strong>.
                    </div>
                </div>
                <div className="flex items-center gap-x-2">
                    <Vbl label="Inducerad spänning"><em>e</em></Vbl>
                    <span className="fnum">=</span>
                    <span className="fnum">−</span>
                    <Vbl label="Antal varv"><em>N</em></Vbl>
                    <span className="fnum">·</span>
                    <FracL topLbl="Flödesändring" top={<span>Δ<em>Φ</em></span>} botLbl="Tid" bot={<span>Δ<em>t</em></span>} />
                </div>
                <div className="flex items-center gap-x-2">
                    <Vbl label="Inducerad ström"><em>I</em></Vbl>
                    <span className="fnum">=</span>
                    <FracL topLbl="Inducerad spänning" top={<em>e</em>} botLbl="Resistans" bot={<em>R</em>} />
                </div>
            </div>
        );

        const Slider = ({ label, sub, value, min, max, step, onChange, valueText }) => (
            <div className="mb-3">
                <div className="flex justify-between items-baseline mb-1">
                    <label className="text-sm font-bold" style={{ color: 'var(--lab-ink)' }} dangerouslySetInnerHTML={{ __html: label }} />
                    <div className="font-mono font-semibold text-sm" style={{ color: 'var(--lab-accent)' }}>{valueText}</div>
                </div>
                <input type="range" min={min} max={max} step={step} value={value}
                       onChange={(e) => onChange(parseFloat(e.target.value))} className="w-full cursor-pointer" />
                {sub && <div className="text-xs mt-1" style={{ color: 'var(--lab-ink-muted)' }} dangerouslySetInnerHTML={{ __html: sub }} />}
            </div>
        );
        const StSlider = ({ label, value, min, max, step, onChange, valueText }) => (
            <div className="st-slider">
                <div className="st-slider-top">
                    <span dangerouslySetInnerHTML={{ __html: label }} />
                    <span style={{ whiteSpace: 'nowrap', fontWeight: 600, color: 'var(--lab-ink, #0f1620)' }}>{valueText}</span>
                </div>
                <span className="sl-wrap">
                    <input type="range" min={min} max={max} step={step} value={value}
                           onChange={(e) => onChange(parseFloat(e.target.value))} />
                </span>
            </div>
        );
        const Readout = ({ label, value, color }) => (
            <div className="p-2 rounded-lg" style={{ background: 'var(--lab-bg)', border: '1px solid var(--lab-line-strong)' }}>
                <div className="text-xs" style={{ color: 'var(--lab-ink-muted)' }} dangerouslySetInnerHTML={{ __html: label }} />
                <div className="font-mono font-bold text-sm" style={{ color: color || 'var(--lab-ink)' }}>{value}</div>
            </div>
        );

        // ─────────────────────────────────────────────────────────────────
        // Appen
        // ─────────────────────────────────────────────────────────────────
        const App = () => {
            const q = new URLSearchParams(location.search);
            const num = (k, d) => (isFinite(parseFloat(q.get(k))) ? parseFloat(q.get(k)) : d);
            const [R, setR] = useState(num('r', 0.75));
            const [autoV, setAutoV] = useState(num('v', 25));
            const [autoRun, setAutoRun] = useState(q.get('auto') === '1');
            const [nMot, setNMot] = useState(q.get('pol') !== 's');
            const [ledare, setLedare] = useState(q.get('ledare') === 'spole' ? 'spole' : 'slinga');
            const [N, setN] = useState(Math.round(Math.max(NMIN, Math.min(NMAX, num('n', 10)))));
            const [dim, setDim] = useState(q.get('vy') === '3d' ? '3d' : '2d');
            const [vy3, setVy3] = useState('snett');
            const [show, setShow] = useState({ linjer: true, falten: true, strom: true, elek: false, kraft: false });
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [togglesOpen, setTogglesOpen] = useState(true);
            const [, setTick] = useState(0);

            const sceneWrapRef = useRef(null);
            const svgRef = useRef(null);
            const stRef = useRef({
                xm: 14, v: 0, adir: -1, dragging: false, lastX: 0, lastMove: 0,
                phi: 0, phiVarv: 0, e: 0, I: 0, F: 0, flodI: 0, flodE: 0, iSkala: 0.004, t: 0, buf: [],
            });
            const pRef = useRef({});
            const apiRef = useRef({});
            pRef.current = { autoRun, autoV, R, nMot, ledare, N, show };

            // ── Fysikloopen (gemensam för 2D och 3D) ──
            useEffect(() => {
                let raf, last = performance.now(), sista = 0;
                const loop = (now) => {
                    raf = requestAnimationFrame(loop);
                    const dt = Math.min((now - last) / 1000, 0.05);
                    last = now;
                    const p = pRef.current, st = stRef.current;
                    st.t += dt;
                    if (st.dragging) {
                        if (now - st.lastMove > 80) st.v *= Math.pow(0.0005, dt);
                    } else if (p.autoRun) {
                        st.xm += st.adir * p.autoV * dt;
                        if (st.xm > AUTO_A) { st.xm = AUTO_A; st.adir = -1; }
                        if (st.xm < AUTO_B) { st.xm = AUTO_B; st.adir = 1; }
                        st.v = st.adir * p.autoV;
                    } else {
                        st.v *= Math.pow(0.0005, dt);
                    }
                    if (Math.abs(st.v) < 0.3) st.v = 0;

                    const geo = varvLagen(p.ledare, p.N);
                    st.phi = phiTot(st.xm, geo, p.nMot);
                    st.phiVarv = phiVarv(0, geo.a, st.xm, p.nMot);       // flödet genom mittvarvet
                    const dfdx = dPhiDx(st.xm, geo, p.nMot);
                    const v = st.v / 100;                                 // m/s
                    st.e = -dfdx * v;                                     // V
                    st.I = st.e / p.R;                                    // A
                    st.F = -dfdx * dfdx * v / p.R;                        // N
                    st.iSkala = p.ledare === 'slinga' ? 0.004 : 0.03;
                    // strömmen flyter runt ledaren: positiv I är växande u
                    const fart = Math.min(2.2, 0.25 + 1.6 * Math.tanh(Math.abs(st.I) / st.iSkala));
                    if (Math.abs(st.I) > 2e-5) {
                        st.flodI += Math.sign(st.I) * fart * dt * 0.55;
                        st.flodE -= Math.sign(st.I) * fart * dt * 0.35;
                    }
                    if (st.t - sista > 1 / 30) {
                        sista = st.t;
                        st.buf.push({ t: st.t, e: st.e });
                        while (st.buf.length && st.t - st.buf[0].t > GRAF_T) st.buf.shift();
                    }
                    setTick(t => (t + 1) % 1e6);
                };
                raf = requestAnimationFrame(loop);
                return () => cancelAnimationFrame(raf);
            }, []);

            // ── Dra i magneten (2D och 3D använder samma funktioner) ──
            const dragTo = (x) => {
                const st = stRef.current;
                const now = performance.now();
                const dtS = Math.max((now - st.lastMove) / 1000, 1e-3);
                const nx = Math.max(XMIN, Math.min(XMAX, x));
                const vInst = (nx - st.xm) / dtS;
                st.v = 0.6 * st.v + 0.4 * Math.max(-250, Math.min(250, vInst));
                st.xm = nx;
                st.lastMove = now;
            };
            apiRef.current.dragStart = () => { const st = stRef.current; st.dragging = true; st.lastMove = performance.now(); setAutoRun(false); };
            apiRef.current.dragTo = dragTo;
            apiRef.current.dragEnd = () => { stRef.current.dragging = false; };

            const svgX = (e) => {
                const svg = svgRef.current;
                const pt = svg.createSVGPoint();
                pt.x = e.clientX; pt.y = e.clientY;
                return (pt.matrixTransform(svg.getScreenCTM().inverse()).x - LX) / PX;
            };
            const onMagnetDown = (e) => {
                e.preventDefault();
                const st = stRef.current;
                st.grepp = st.xm - svgX(e);
                apiRef.current.dragStart();
            };
            useEffect(() => {
                const move = (e) => { const st = stRef.current; if (!st.dragging || !svgRef.current) return; dragTo(svgX(e) + (st.grepp || 0)); };
                const up = () => { stRef.current.dragging = false; };
                window.addEventListener('pointermove', move);
                window.addEventListener('pointerup', up);
                return () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
            }, []);

            useEffect(() => {
                const handler = () => setIsFullscreen(document.fullscreenElement === sceneWrapRef.current || document.webkitFullscreenElement === sceneWrapRef.current);
                document.addEventListener('fullscreenchange', handler);
                document.addEventListener('webkitfullscreenchange', handler);
                return () => { document.removeEventListener('fullscreenchange', handler); document.removeEventListener('webkitfullscreenchange', handler); };
            }, []);
            const toggleFullscreen = () => {
                const el = sceneWrapRef.current;
                if (!el) return;
                if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
            };
            const tShow = (key) => setShow(sh => ({ ...sh, [key]: !sh[key] }));
            const valjVy3 = (n) => { setVy3(n); if (apiRef.current.vy) apiRef.current.vy(n); };

            const st = stRef.current;
            const aktiv = Math.abs(st.I) > 2e-5;
            const phiOkar = Math.abs(st.e) < 1e-6 ? null : (Math.sign(st.phi) === -Math.sign(st.e));
            const framUpp = st.I < 0;           // positiv ström går nedåt i framkanten
            const ledOrd = ledare === 'slinga' ? 'slingan' : 'spolen';

            const reglage = (Comp) => (
                <React.Fragment>
                    {ledare === 'spole' && <Comp label={Comp === Slider ? 'Antal varv i spolen (<em>N</em>)' : 'Antal varv (<em>N</em>)'} value={N}
                        min={NMIN} max={NMAX} step={1} onChange={(x) => setN(Math.round(x))} valueText={`${N}`}
                        sub={Comp === Slider ? 'Fler varv ger större inducerad spänning, e = −N · ΔΦ/Δt.' : undefined} />}
                    <Comp label={Comp === Slider ? `Resistans i kretsen (<em>R</em>)` : 'Resistans (<em>R</em>)'} value={R}
                        min={RMIN} max={RMAX} step={0.05} onChange={setR} valueText={`${fmt(R, 2)} Ω`}
                        sub={Comp === Slider ? 'Mindre resistans ger större inducerad ström (Ohms lag).' : undefined} />
                    <Comp label="Automatisk fart" value={autoV} min={AVMIN} max={AVMAX} step={5} onChange={setAutoV}
                        valueText={`${fmt(autoV, 0)} cm/s`}
                        sub={Comp === Slider ? 'Fortare rörelse ger snabbare flödesändring och större ström.' : undefined} />
                </React.Fragment>
            );

            const sceneToggles = () => (
                !togglesOpen ? (
                    <button className="st-show-btn" onClick={() => setTogglesOpen(true)} aria-label="Visa inställningar" title="Visa inställningar" aria-expanded="false">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" aria-hidden="true">
                            <line x1="4" y1="8" x2="20" y2="8" /><circle cx="14.5" cy="8" r="2.7" fill="currentColor" stroke="none" />
                            <line x1="4" y1="16" x2="20" y2="16" /><circle cx="9.5" cy="16" r="2.7" fill="currentColor" stroke="none" />
                        </svg>
                    </button>
                ) : (
                <div className="scene-toggles">
                    <button className="st-hide" onClick={() => setTogglesOpen(false)} aria-label="Dölj inställningar" title="Dölj inställningar" aria-expanded="true">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
                    </button>
                    <div className="st-title">Visa</div>
                    <label><input type="checkbox" checked={show.linjer} onChange={() => tShow('linjer')} />
                        <span className="st-swatch" style={{ background: COL.falt }}></span><span>Magnetens fältlinjer</span></label>
                    <label><input type="checkbox" checked={show.falten} onChange={() => tShow('falten')} />
                        <span className="st-swatch" style={{ background: `linear-gradient(90deg, ${COL.falt} 50%, ${COL.ind} 50%)` }}></span><span>Fälten genom ledaren</span></label>
                    <label><input type="checkbox" checked={show.strom} onChange={() => tShow('strom')} />
                        <span className="st-swatch" style={{ background: COL.ind }}></span><span>Inducerad ström <em>I</em></span></label>
                    <label><input type="checkbox" checked={show.elek} onChange={() => tShow('elek')} />
                        <span className="st-dot" style={{ background: COL.elek }}></span><span>Elektronerna</span></label>
                    <label><input type="checkbox" checked={show.kraft} onChange={() => tShow('kraft')} />
                        <span className="st-swatch" style={{ background: COL.kraft }}></span><span>Kraften på magneten</span></label>
                    <div className="st-title st-group">Magneten</div>
                    <label><input type="radio" name="pol" checked={nMot} onChange={() => setNMot(true)} /><span>Nordändan mot {ledOrd}</span></label>
                    <label><input type="radio" name="pol" checked={!nMot} onChange={() => setNMot(false)} /><span>Sydändan mot {ledOrd}</span></label>
                    {isFullscreen && (
                        <React.Fragment>
                            <div className="st-title st-group">Reglage</div>
                            <div className="st-sliders">{reglage(StSlider)}</div>
                            <div className="st-actions">
                                <button className={`btn-toggle ${autoRun ? 'active' : ''}`} onClick={() => setAutoRun(r => !r)}>
                                    {autoRun ? 'Stoppa rörelsen' : 'För magneten fram och tillbaka'}
                                </button>
                            </div>
                        </React.Fragment>
                    )}
                </div>
                )
            );

            return (
                <div className="min-h-screen dark-container px-4 md:px-8 pb-12" style={{ fontFamily: "'DM Sans', sans-serif" }}>
                    <div className="max-w-6xl mx-auto pt-6">
                        <div className="breadcrumb mb-4" style={{ fontSize: 13 }}>
                            <a href="index.html">Hem</a> / <a href="katalog.html#fy2">Fysik nivå 2</a> / Inducerad ström och Lenz lag
                        </div>
                        <h1 className="text-3xl md:text-4xl font-black tracking-tight" style={{ color: 'var(--lab-ink)' }}>Inducerad ström och Lenz lag</h1>
                        <p className="mt-2 mb-5" style={{ color: 'var(--lab-ink-soft)', maxWidth: 840 }}>
                            Ta tag i stavmagneten och för den mot en slinga eller en spole, rakt igenom och ut på
                            andra sidan. När magnetfältet genom ledaren ändras induceras en ström, och enligt{' '}
                            <strong>Lenz lag</strong> får den en riktning som <strong>motverkar orsaken</strong>: ledarens
                            eget magnetfält motverkar ändringen av flödet. Titta på galvanometern. Den ger utslag åt ena
                            hållet när magneten närmar sig, åt andra hållet när den dras bort och inget utslag alls när
                            magneten står still. Växla till 3D för att se slingan och spolen från alla håll.
                        </p>

                        <FormulaCard />

                        <main className="flex flex-col lg:flex-row gap-6">
                            <div className="lg:w-3/5 order-1">
                                <div className={'scene-wrap' + (isFullscreen ? ' is-fs' : '')} data-theme="ljusPapper" ref={sceneWrapRef}>
                                    {dim === '2d'
                                        ? <Scen2D st={st} p={pRef.current} show={show} onMagnetDown={onMagnetDown} svgRef={svgRef} />
                                        : <Scen3D stRef={stRef} pRef={pRef} apiRef={apiRef} />}

                                    <div className="scene-info">
                                        <span className="si-lbl">Inducerad spänning <em style={{ textTransform: 'none' }}>e</em></span>
                                        <span className="si-val">{fmtSmart(st.e * 1000, 'mV')}</span>
                                        <span className="si-lbl" style={{ marginTop: 4 }}>Inducerad ström <em style={{ textTransform: 'none' }}>I</em></span>
                                        <span className="si-val">{fmtSmart(st.I * 1000, 'mA')}</span>
                                        <span className="si-lbl" style={{ marginTop: 4 }}>Flödet genom {ledOrd}</span>
                                        <span className="si-val" style={{ fontSize: 12.5 }}>{phiOkar === null ? 'oförändrat' : phiOkar ? 'ökar' : 'minskar'}</span>
                                    </div>

                                    <div className="scene-hint">{dim === '2d'
                                        ? tr('Ta tag i magneten och för den mot eller genom {led}', { led: tr(ledOrd) }).replace('{led}', ledOrd)
                                        : 'Dra i magneten för att flytta den. Dra någon annanstans för att vrida scenen.'}</div>
                                    {sceneToggles()}

                                    <div className="fs-quick">
                                        <button className="fq-play" onClick={() => setAutoRun(r => !r)} aria-label={autoRun ? 'Paus' : 'Start'} title={autoRun ? 'Paus' : 'Start'}>
                                            {autoRun ? (
                                                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" /><rect x="14" y="5" width="4" height="14" rx="1" /></svg>
                                            ) : (
                                                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" /></svg>
                                            )}
                                        </button>
                                        <div className="fq-rows">
                                            <div className="fq-row">
                                                <span className="fq-lbl">Fart</span>
                                                <input type="range" min={AVMIN} max={AVMAX} step={5} value={autoV} onChange={e => setAutoV(parseFloat(e.target.value))} aria-label="Fart" />
                                            </div>
                                        </div>
                                    </div>

                                    <button className="fs-btn" onClick={toggleFullscreen} aria-label="Fullskärm" title={isFullscreen ? 'Lämna fullskärm' : 'Fullskärm'}>
                                        {isFullscreen ? (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M9 3v6H3" /><path d="M15 21v-6h6" /><path d="M21 9h-6V3" /><path d="M3 15h6v6" />
                                            </svg>
                                        ) : (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M3 9V3h6" /><path d="M21 9V3h-6" /><path d="M3 15v6h6" /><path d="M21 15v6h-6" />
                                            </svg>
                                        )}
                                    </button>
                                </div>
                            </div>

                            <div className="lg:w-2/5 order-2">
                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <div className="flbl mb-2">Visning</div>
                                            <div className="seg" style={{ gridTemplateColumns: '1fr 1fr' }}>
                                                <button className={dim === '2d' ? 'active' : ''} onClick={() => setDim('2d')}>2D</button>
                                                <button className={dim === '3d' ? 'active' : ''} onClick={() => setDim('3d')}>3D</button>
                                            </div>
                                        </div>
                                        <div>
                                            <div className="flbl mb-2">Ledare</div>
                                            <div className="seg" style={{ gridTemplateColumns: '1fr 1fr' }}>
                                                <button className={ledare === 'slinga' ? 'active' : ''} onClick={() => setLedare('slinga')}>Slinga</button>
                                                <button className={ledare === 'spole' ? 'active' : ''} onClick={() => setLedare('spole')}>Spole</button>
                                            </div>
                                        </div>
                                    </div>
                                    {dim === '3d' && (
                                        <div className="mt-3">
                                            <div className="flbl mb-2">Vy</div>
                                            <div className="seg" style={{ gridTemplateColumns: '1fr 1fr 1fr' }}>
                                                <button className={vy3 === 'snett' ? 'active' : ''} onClick={() => valjVy3('snett')}>Snett</button>
                                                <button className={vy3 === 'sidan' ? 'active' : ''} onClick={() => valjVy3('sidan')}>Från sidan</button>
                                                <button className={vy3 === 'ovan' ? 'active' : ''} onClick={() => valjVy3('ovan')}>Ovanifrån</button>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <div className="glass-card rounded-xl p-3 mb-3">
                                    {reglage(Slider)}
                                    <button className={`btn-toggle w-full ${autoRun ? 'active' : ''}`} onClick={() => setAutoRun(r => !r)}>
                                        {autoRun ? 'Stoppa rörelsen' : 'För magneten fram och tillbaka'}
                                    </button>
                                </div>

                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <div className="flbl mb-2">Inducerad spänning över tid</div>
                                    <Graf buf={st.buf} />
                                    <div className="text-xs mt-1" style={{ color: 'var(--lab-ink-muted)' }}>
                                        För magneten rakt igenom {ledOrd}: spänningen byter tecken när magnetens mitt passerar.
                                    </div>
                                </div>

                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <div className="flbl mb-2">Avläsning</div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <Readout label="Inducerad spänning <em>e</em>" value={fmtSmart(st.e * 1000, 'mV')} color={COL.ind} />
                                        <Readout label="Inducerad ström <em>I</em>" value={fmtSmart(st.I * 1000, 'mA')} color={COL.ind} />
                                        <Readout label="Flödet <em>Φ</em> genom ledaren" value={fmtSmart(st.phi * 1e6, 'µWb')} />
                                        <Readout label="Kraften på magneten" value={fmtSmart(Math.abs(st.F) * 1000, 'mN')} color={COL.kraft} />
                                        <Readout label="Magnetens fart" value={`${fmt(Math.abs(st.v), 0)} cm/s`} />
                                        <Readout label="Strömmen i framkanten" value={aktiv ? (framUpp ? 'uppåt' : 'nedåt') : '–'} />
                                    </div>
                                </div>
                            </div>
                        </main>

                        <div className="grid md:grid-cols-3 gap-4 mt-6">
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Lenz lag i simuleringen</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    När magneten närmar sig <strong>förstärks</strong> fältet genom ledaren. Den inducerade
                                    strömmen skapar då ett eget fält som är <strong>motriktat</strong>. Jämför de två pilarna
                                    ovanför ledaren. När magneten dras bort <strong>försvagas</strong> fältet, och det
                                    inducerade fältet vänder för att i stället förstärka det. Orsaken motverkas alltid.
                                </p>
                            </div>
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Spolen ger större spänning</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Varje varv i spolen får samma flödesändring som slingan, och spänningarna i varven
                                    adderas: <em>e</em>&nbsp;=&nbsp;−<em>N</em>&thinsp;·&thinsp;Δ<em>Φ</em>/Δ<em>t</em>.
                                    Med tio varv blir spänningen ungefär tio gånger så stor. Pröva att ändra varvtalet och
                                    se grafen växa.
                                </p>
                            </div>
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Kraften motverkar rörelsen</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Ledaren blir en liten elektromagnet som <strong>bromsar magneten</strong>: den stöter
                                    bort en magnet som närmar sig och håller kvar en som dras bort. Slå på "Kraften på
                                    magneten". Den energi som blir elektrisk energi i kretsen kommer från arbetet du gör
                                    när du för magneten.
                                </p>
                            </div>
                        </div>

                        <details className="glass-card rounded-xl p-4 mt-4">
                            <summary className="accordion-head" style={{ color: 'var(--lab-ink)' }}>
                                <span>Så läser du av strömriktningen</span><span style={{ color: 'var(--lab-ink-muted)' }}>+</span>
                            </summary>
                            <p className="mt-3 text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                Gör som i teorins Exempel 2, i tre steg. <strong>1)</strong> Avgör åt vilket håll
                                magnetens fält pekar genom ledaren och om det <strong>förstärks eller försvagas</strong> av
                                rörelsen. <strong>2)</strong> Lenz lag: den inducerade strömmens fält ska <strong>motverka
                                ändringen</strong>, alltså vara motriktat om fältet förstärks och medriktat om det
                                försvagas. <strong>3)</strong> Använd tumregeln för spole och slinga baklänges: låt tummen
                                peka i det inducerade fältets riktning, så visar fingrarna strömmens riktning runt
                                ledaren, till exempel uppåt i framkanten.
                            </p>
                        </details>

                        <details className="glass-card rounded-xl p-4 mt-4">
                            <summary className="accordion-head" style={{ color: 'var(--lab-ink)' }}>
                                <span>Elektronerna och strömriktningen</span><span style={{ color: 'var(--lab-ink-muted)' }}>+</span>
                            </summary>
                            <p className="mt-3 text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                Strömpilarna visar den överenskomna strömriktningen, från plus till minus. Det som
                                faktiskt rör sig i koppartråden är elektroner, och eftersom de är negativt laddade
                                rör de sig åt motsatt håll. Slå på Elektronerna och se dem vandra mot strömpilarna.
                                Deras verkliga fart är mycket liten, bara bråkdelar av en millimeter per sekund, så i
                                simuleringen är farten kraftigt förstorad.
                            </p>
                        </details>

                        <details className="glass-card rounded-xl p-4 mt-4">
                            <summary className="accordion-head" style={{ color: 'var(--lab-ink)' }}>
                                <span>Vanliga missuppfattningar</span><span style={{ color: 'var(--lab-ink-muted)' }}>+</span>
                            </summary>
                            <ul className="mt-3 space-y-2 text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                <li><strong>”Den inducerade strömmen motverkar magnetens fält.”</strong> Inte riktigt. Den motverkar <em>ändringen</em> av flödet. När magneten dras bort är det inducerade fältet till och med <em>medriktat</em> magnetens, för att försöka behålla flödet.</li>
                                <li><strong>”En stark magnet nära slingan ger ström.”</strong> Nej. Utan rörelse blir det ingen flödesändring och ingen ström, hur stark magneten än är. Pröva att hålla magneten stilla mitt i spolen.</li>
                                <li><strong>”Strömmen är störst när magneten är mitt i spolen.”</strong> Nej, där är flödet störst men ändras som minst. Strömmen är störst när magnetens ändar passerar ledaren, och den byter riktning just när magnetens mitt passerar. Titta på grafen.</li>
                                <li><strong>”Strömmen borde förstärka orsaken.”</strong> Då skulle energi skapas ur ingenting: strömmen skulle driva på rörelsen som skapar mer ström. Lenz lag är energiprincipen i elektromagnetisk form, och man måste utföra arbete för att inducera ström.</li>
                            </ul>
                        </details>
                    </div>
                </div>
            );
