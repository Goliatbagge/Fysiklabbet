                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 strokeWidth="2.4" strokeLinecap="round" aria-hidden="true"><path d="M6 12h12" /></svg>
                        </button>
                        <div className="st-title">Visa</div>
                        {visaRad('spar', 'Spår', null, false)}
                        {visaRad('langa', 'Långa spår', null, !show.spar)}
                        {visaRad('band', 'Gravitationsband', null, false)}
                        {visaRad('krafter', 'Kraftpilar', null, false)}
                        {visaRad('namn', 'Massorna', null, false)}
                        {visaRad('kopia', 'Kopia med en stjärna flyttad 0,01 AU', null, gissaLage)}
                        {isFullscreen && (
                            <React.Fragment>
                                <div className="st-title mt">Läge</div>
                                <label><input type="radio" name="lage-fs" checked={!gissaLage} onChange={() => valjLage('fri')} /><span>Utforska</span></label>
                                <label><input type="radio" name="lage-fs" checked={gissaLage} onChange={() => valjLage('gissa')} /><span>Vem kastas ut?</span></label>
                                {!gissaLage && (
                                    <React.Fragment>
                                        <div className="st-title mt">Färdigt försök</div>
                                        <select value={forsok} onChange={(e) => valjForsok(e.target.value)} aria-label="Färdigt försök">
                                            {FORSOK.map((f) => <option key={f.id} value={f.id}>{f.namn}</option>)}
                                        </select>
                                    </React.Fragment>
                                )}
                                <div className="st-title mt">Reglage</div>
                                <div className="st-sliders">
                                    {forsok === 'egen' && !gissaLage && massReglage}
                                    {fartReglage}
                                </div>
                                <div className="st-actions">{styrknappar}</div>
                                <div className="st-panels">{paneler}</div>
                            </React.Fragment>
                        )}
                    </div>
                );
            };

            return (
                <div className="min-h-screen px-4 md:px-8 pb-12" style={{ fontFamily: "'DM Sans', sans-serif" }}>
                    <div className="max-w-6xl mx-auto pt-6">
                        <div className="breadcrumb mb-4" style={{ fontSize: 13 }}>
                            <a href="index.html">Hem</a> / {FRAN_FY2
                                ? <React.Fragment><a href="katalog.html?id=fy2">Fysik nivå 2</a> / <a href="katalog.html?id=fy2-5.6">Stjärnbildning</a></React.Fragment>
                                : <a href="katalog.html?id=fy1">Fysik nivå 1</a>} / Trekropparsproblemet
                        </div>
                        <h1 className="text-3xl md:text-4xl font-black tracking-tight" style={{ color: 'var(--lab-ink)' }}>Trekropparsproblemet</h1>
                        <p className="mt-2 mb-5" style={{ color: 'var(--lab-ink-soft)', maxWidth: 840 }}>
                            Två stjärnor som drar i varandra går att räkna ut med papper och penna. Med tre stjärnor går det inte längre:
                            varje stjärna dras av de två andra med Newtons gravitationslag, och krafterna ändras hela tiden när avstånden
                            ändras. Här räknar datorn fram förloppet i hundratusentals små steg. Släpp stjärnorna och se hur nära
                            passager slungar dem runt, tills en av dem ofta kastas ut ur systemet för gott.
                        </p>

                        <FormulaCard snap={snap} valtPar={valtPar} setValtPar={setValtPar} massor={massor} />

                        <main className="flex flex-col lg:flex-row gap-6">
                            <div className="lg:w-2/3 order-1">
                                <div className={'scene-wrap' + (isFullscreen ? ' is-fs' : '')} ref={sceneWrapRef}>
                                    <canvas ref={canvasRef} onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp} onPointerCancel={onUp}
                                            aria-label="Tre stjärnor som påverkar varandra med gravitation" />
                                    {sceneToggles()}
                                    <button className="fs-btn" onClick={toggleFullscreen} aria-label="Fullskärm"
                                            title={isFullscreen ? 'Lämna fullskärm' : 'Fullskärm'}>
                                        {isFullscreen ? (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M9 3v6H3" /><path d="M15 21v-6h6" /><path d="M21 9h-6V3" /><path d="M3 15h6v6" />
                                            </svg>
                                        ) : (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M3 9V3h6" /><path d="M21 9V3h-6" /><path d="M3 15v6h6" /><path d="M21 15v6h-6" />
                                            </svg>
                                        )}
                                    </button>
                                    <div className="fs-quick">
                                        <button className="fq-play" onClick={primar} disabled={gissaLage && gis.fas !== 'kor' && gis.fas !== 'klar'} aria-label={running ? 'Pausa' : 'Släpp stjärnorna'}>
                                            {running
                                                ? <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" /><rect x="14" y="5" width="4" height="14" rx="1" /></svg>
                                                : <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15L19.5 12z" /></svg>}
                                        </button>
                                        <div className="fq-rows">
                                            <div className="fq-row">
                                                <span className="fq-lbl">Tidsförlopp</span>
                                                <input type="range" min="0" max="100" value={fartTillReg(fart)} onChange={(e) => setFart(regTillFart(+e.target.value))} aria-label="Tidsförlopp" />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                {!isFullscreen && <div className="mt-3">{styrknappar}</div>}
                                <p className="anm mt-2">
                                    {gissaLage
                                        ? 'Klicka på den stjärna du tror kastas ut. Stjärnorna släpps från vila.'
                                        : 'Innan stjärnorna släpps kan du dra dem dit du vill. Trådarna mellan stjärnorna lyser starkare ju större gravitationskraften i paret är.'}
                                </p>
                                <div className="hidden lg:flex flex-col gap-3 mt-3">{paneler}</div>
                            </div>

                            <div className="lg:w-1/3 order-2 flex flex-col gap-3">
                                <div className="glass-card rounded-xl p-3">
                                    <div className="flbl mb-2">Läge</div>
                                    <div className="seg" style={{ gridTemplateColumns: '1fr 1fr' }}>
                                        <button className={!gissaLage ? 'active' : ''} onClick={() => valjLage('fri')}>Utforska</button>
                                        <button className={gissaLage ? 'active' : ''} onClick={() => valjLage('gissa')}>Vem kastas ut?</button>
                                    </div>
                                    {!gissaLage ? (
                                        <React.Fragment>
                                            <div className="flbl mt-3 mb-2">Färdiga försök</div>
                                            <div className="forsok">
                                                {FORSOK.map((f) => (
                                                    <button key={f.id} className={forsok === f.id ? 'active' : ''} onClick={() => valjForsok(f.id)}>{f.namn}</button>
                                                ))}
                                            </div>
                                            {forsokObj && <p className="anm mt-2">{forsokObj.text}</p>}
                                        </React.Fragment>
                                    ) : (
                                        <p className="anm mt-2">
                                            Tre stjärnor med slumpade massor ställs upp på slumpade platser. Gissa vilken som kastas ut innan
                                            de släpps. Ingen formel kan ge svaret, men det finns ett mönster att upptäcka.
                                        </p>
                                    )}
                                </div>

                                {forsok === 'egen' && !gissaLage && (
                                    <div className="glass-card rounded-xl p-3">
                                        <div className="flbl mb-2">Massorna</div>
                                        {massReglage}
                                    </div>
                                )}

                                <div className="glass-card rounded-xl p-3">
                                    {fartReglage}
                                    <p className="anm mt-2">Stjärnorna rör sig med några km/s, så det tar tusentals år för dem att flytta sig några hundra AU.</p>
                                </div>

                                <div className="lg:hidden flex flex-col gap-3">{paneler}</div>
                            </div>
                        </main>

                        <details className="glass-card rounded-xl p-4 mt-6">
                            <summary className="accordion-head">
                                <span>Så hänger det ihop</span>
                                <span aria-hidden="true">+</span>
                            </summary>
                            <ul className="mt-3 space-y-2" style={{ color: 'var(--lab-ink-soft)', fontSize: 14.5, lineHeight: 1.55, paddingLeft: 18, listStyle: 'disc' }}>
                                <li>Varje par av stjärnor drar i varandra med Newtons gravitationslag, <em>F</em><sub>G</sub> = <em>G</em> · <em>m</em>₁ · <em>m</em>₂ / <em>r</em><sup>2</sup>. Med tre stjärnor finns tre par, och varje stjärna påverkas av två krafter samtidigt.</li>
                                <li>Krafterna i ett par är lika stora och motriktade, enligt Newtons tredje lag. Slå på kraftpilarna: pilen på den ena stjärnan är lika lång som pilen på den andra. Samma kraft ger ändå den lätta stjärnan störst acceleration, eftersom <em>a</em> = <em>F</em> / <em>m</em>.</li>
                                <li>Eftersom avståndet är kvadrerat växer kraften mycket snabbt när två stjärnor kommer nära varandra. Vid en nära passage blir kraften tusentals gånger större än vanligt under en kort stund, och stjärnorna slungas iväg. En rymdsond utnyttjar samma sak när den tar fart förbi en planet.</li>
                                <li>För två stjärnor finns en formel som ger banan för all framtid: en ellips. För tre stjärnor finns ingen sådan formel. Förloppet måste räknas fram steg för steg, och just därför kallas det trekropparsproblemet.</li>
                                <li>Rörelsen är kaotisk. Slå på kopian, där en stjärna är flyttad 0,01 AU (1,5 miljoner km, mindre än fyra gånger avståndet till månen) av flera hundra AU. Först följs kopian och originalet åt, sedan går de skilda vägar, och i det pythagoreiska försöket är det en annan stjärna som kastas ut.</li>
                                <li>När en stjärna kastas ut tar den med sig rörelseenergi, och de två som blir kvar kommer närmare varandra och bildar en tät dubbelstjärna. Ett AU (astronomisk enhet) är avståndet mellan jorden och solen, ungefär 150 miljoner km, och en solmassa är 1,99 · 10<sup>30</sup> kg.</li>
                            </ul>
                        </details>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script src="feedback.js" defer></script>
    <script src="sim-dock.js" defer></script>
    <script src="data/katalog.js"></script>
    <script src="section-nav.js"></script>
    <!-- Cloudflare Web Analytics: cookiefri besöksmätning, se CLAUDE.md. -->
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js"
            data-cf-beacon='{"token": "366677ecfe014a76b73f5bc78a489e0e"}'></script>
</body>
