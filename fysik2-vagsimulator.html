    <script type="text/babel">
const { useState, useRef, useEffect } = React;

// ═══════════════════════════════════════════════════════════════════════
//  Vågsimulatorn: en vågtank sedd uppifrån (omgjord 2026-11-10)
// ═══════════════════════════════════════════════════════════════════════
// Skala: 1 px på scenen = 1 mm i tanken, alltså en tank på 80 × 60 cm.
// Vågornas fart är 0,20 m/s (200 px/s), vilket på grunt vatten svarar mot
// djupet h = v²/g ≈ 4,1 mm. Lägena delas mellan tre teoriavsnitt och väljs
// med adressen:
//   fysik2-vagsimulator.html                  fy2-2.13 (punktkälla, plana vågor, brytning)
//   fysik2-vagsimulator.html?lage=interferens fy2-2.14 (två källor, en och två öppningar)
//   fysik2-vagsimulator.html?lage=doppler     fy2-2.12 (dopplereffekt, överljudsfart)
//
// Alla lägen utom dopplereffekten är tidsharmoniska: utslaget i en punkt är
// z = S · cos φ − C · sin φ, där φ = ω · t. S och C räknas fram EN gång när
// en parameter ändras (byggFalt), och varje bildruta blir då billig även
// för diffraktionen med många Huygens-källor. Bildrutan ska hålla sig under
// ~10 ms, annars når sidan aldrig network-idle i Puppeteer.

const W = 800, H = 600;           // scenens koordinater (mm)
const V = 200;                    // vågornas fart (px/s = mm/s)
const G = 9.82;
const H_DJUP = (0.2 * 0.2) / G;   // djup som ger v = 0,20 m/s (m)
const FS = 2, FW = W / FS, FH = H / FS;           // fältets upplösning
const G3 = 5, GX3 = W / G3, GY3 = H / G3;         // 3D-nätets upplösning
const RAM = 14;                                    // tankens kant (px)
const YB_BRYT = 300, YB_SPALT = 210;

const LAGEN = {
    vatten: ['single', 'planar', 'refraction'],
    interferens: ['double', 'diffraction', 'diffraction-double'],
    doppler: ['doppler'],
};
const NAMN = {
    single: ['En punktkälla', 'cirkulära vågor'],
    planar: ['Plana vågor', 'raka vågfronter'],
    refraction: ['Brytning', 'djupt och grunt vatten'],
    double: ['Två punktkällor', 'i fas'],
    diffraction: ['En öppning', 'diffraktion'],
    'diffraction-double': ['Två öppningar', 'dubbelspalt'],
    doppler: ['Rörlig källa', 'dopplereffekt'],
};
const lageFranAdress = () => {
    const l = (new URLSearchParams(location.search).get('lage') || '').toLowerCase();
    return LAGEN[l] ? l : 'vatten';
};

const fmt = (x, d) => {
    const s = x.toFixed(d);
    if (parseFloat(s) === 0) return '0';
    return s.replace('.', ',');
};

// Vattnets färger: dal → mitt → topp. Det grunda området är ljusare och
// grönare, som när botten skiner igenom.
const PAL_DJUP = [[14, 58, 92], [40, 112, 156], [206, 236, 247]];
const PAL_GRUNT = [[30, 92, 98], [82, 152, 152], [224, 245, 236]];
const BLAECK = '#0f1620', ROD = '#c0392b', GRON = '#1d7a46';

// ── Fältet: S och C i varje punkt ──────────────────────────────────────
function huygensKallor(mode, b, d) {
    const n = Math.max(3, Math.min(24, Math.round(b / 6)));
    const mitter = mode === 'diffraction' ? [W / 2] : [W / 2 - d / 2, W / 2 + d / 2];
    const xs = [];
    for (const c of mitter) for (let j = 0; j < n; j++) xs.push(c - b / 2 + b * (j + 0.5) / n);
    return xs;
}
function brytGeometri(p) {
    const i = p.vinkel * Math.PI / 180;
    const v1 = V, v2 = Math.sqrt(G * p.h2 / 1000) * 1000;
    const b = Math.asin(Math.min(1, v2 / v1 * Math.sin(i)));
    return { i, b, v1, v2 };
}
// Fasen θ och amplituden A i punkten (x, y); utslaget är A · sin(θ − φ).
function byggFalt(p, nx, ny, steg) {
    const S = new Float32Array(nx * ny), C = new Float32Array(nx * ny);
    const lam = V / p.f, k = 2 * Math.PI / lam;
    let norm = 1;
    const sett = (idx, A, th) => { S[idx] += A * Math.sin(th); C[idx] += A * Math.cos(th); };
    if (p.mode === 'single' || p.mode === 'double') {
        const kallor = p.mode === 'single' ? [p.k1] : [p.k1, p.k2];
        let mx = 0;
        for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
            const x = (i + 0.5) * steg, y = (j + 0.5) * steg, idx = j * nx + i;
            let nara = false;
            for (const s of kallor) {
                const r = Math.hypot(x - s.x, y - s.y);
                if (r < 30) nara = true;
                sett(idx, 1 / Math.sqrt(1 + r / (2 * lam)), k * r);
            }
            if (!nara) { const a = Math.hypot(S[idx], C[idx]); if (a > mx) mx = a; }
        }
        norm = mx || 1;
    } else if (p.mode === 'planar') {
        for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) sett(j * nx + i, 1, k * (i + 0.5) * steg);
    } else if (p.mode === 'refraction') {
        const g = brytGeometri(p), k1 = 2 * Math.PI * p.f / g.v1, k2 = 2 * Math.PI * p.f / g.v2;
        const fas0 = (k1 * Math.cos(g.i) - k2 * Math.cos(g.b)) * YB_BRYT;
        for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
            const x = (i + 0.5) * steg, y = (j + 0.5) * steg;
            const th = y < YB_BRYT ? k1 * (x * Math.sin(g.i) + y * Math.cos(g.i))
                                   : k2 * (x * Math.sin(g.b) + y * Math.cos(g.b)) + fas0;
            sett(j * nx + i, 1, th);
        }
    } else if (p.mode === 'diffraction' || p.mode === 'diffraction-double') {
        const xs = huygensKallor(p.mode, p.b, p.d);
        let mx = 0;
        for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
            const x = (i + 0.5) * steg, y = (j + 0.5) * steg, idx = j * nx + i;
            if (y < YB_SPALT) { sett(idx, 1, k * y); continue; }
            for (const hx of xs) {
                const r = Math.hypot(x - hx, y - YB_SPALT);
                sett(idx, 1 / Math.sqrt(1 + r / (2 * lam)), k * r + k * YB_SPALT);
            }
            if (y > YB_SPALT + 40) { const a = Math.hypot(S[idx], C[idx]); if (a > mx) mx = a; }
        }
        // Normera området bakom öppningen för sig, så att mönstret syns
        // lika tydligt oavsett hur många Huygens-källor som summeras.
        const sk = 1 / (mx || 1);
        for (let j = 0; j < ny; j++) {
            if ((j + 0.5) * steg < YB_SPALT) continue;
            for (let i = 0; i < nx; i++) { S[j * nx + i] *= sk; C[j * nx + i] *= sk; }
        }
    }
    return { S, C, norm };
}

// Vågtoppar: punkter där θ − φ = π/2 + 2π · n.
// Spår A + s · a längs utbredningsriktningen a: s för den topp som ligger
// i [0, λ) framför A, och hur långt in i varvet den kommit (för att tona).
function toppSpar(cA, k, fas0, phi) {
    const lam = 2 * Math.PI / k;
    let s = (phi + Math.PI / 2 - fas0) / k - cA;
    s -= lam * Math.floor(s / lam);
    return { s, u: s / lam, lam };
}
const tona = (u) => Math.max(0, Math.min(1, u / 0.15, (1 - u) / 0.15));

function dubbelpil(ctx, x1, y1, x2, y2, farg, alfa) {
    const L = Math.hypot(x2 - x1, y2 - y1); if (L < 4) return;
    const ux = (x2 - x1) / L, uy = (y2 - y1) / L, hd = Math.min(11, L * 0.3), bb = hd * 0.5;
    ctx.save(); ctx.globalAlpha = alfa; ctx.strokeStyle = farg; ctx.fillStyle = farg; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x1 + ux * hd, y1 + uy * hd); ctx.lineTo(x2 - ux * hd, y2 - uy * hd); ctx.stroke();
    for (const [px, py, sx] of [[x1, y1, 1], [x2, y2, -1]]) {
        const bx = px + sx * ux * hd, by = py + sx * uy * hd;
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(bx - uy * bb, by + ux * bb); ctx.lineTo(bx + uy * bb, by - ux * bb); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
}
function pil(ctx, x1, y1, x2, y2, farg, bredd) {
    const L = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / L, uy = (y2 - y1) / L, hd = 14, bb = 7;
    const bx = x2 - ux * hd, by = y2 - uy * hd;
    ctx.strokeStyle = farg; ctx.fillStyle = farg; ctx.lineWidth = bredd; ctx.lineCap = 'butt';

// Kursiv beteckning med index, till exempel λ₁: (ctx, 'λ', '1', x, y)

// Interferenslinjer: hyperbler med fokus i källorna (eller öppningarna).
// Δs = n · λ på maximilinjerna och Δs = (n + 1/2) · λ på nodlinjerna.
function interferensLinjer(F1, F2, lam, typ) {
    const ut = [], c = Math.hypot(F2.x - F1.x, F2.y - F1.y) / 2;
    const cx = (F1.x + F2.x) / 2, cy = (F1.y + F2.y) / 2;
    const ux = (F2.x - F1.x) / (2 * c), uy = (F2.y - F1.y) / (2 * c), nx = -uy, ny = ux;
    const off = typ === 'nod' ? 0.5 : 0;
    for (let n = 0; (n + off) * lam < 2 * c - 0.5; n++) {
        const a = (n + off) * lam / 2, bh = Math.sqrt(c * c - a * a);
        for (const gren of a === 0 ? [1] : [1, -1]) {
            const pts = [];
            for (let t = -3.2; t <= 3.2; t += 0.04) {
                const lx = gren * a * Math.cosh(t), ly = bh * Math.sinh(t);
                pts.push([cx + ux * lx + nx * ly, cy + uy * lx + ny * ly]);
            }
            ut.push(pts);
        }
    }
    return ut;
}

const WaveSimulator = () => {

    useEffect(() => {

    useEffect(() => {

    }, [mode]);

    // Fullskärm

    }, []);
    const toggleFullscreen = () => {

        else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);

    // ── Ritloopen (startas en gång, läser parametrarna ur P) ─────────────
    useEffect(() => {
        const cv = canvasRef.current, ctx = cv.getContext('2d');

            g.addColorStop(0, '#8b96a3'); g.addColorStop(1, '#4a5461');

        function ritaSkarm(xa, xb) {
            const g = ctx.createLinearGradient(0, YB_SPALT - 6, 0, YB_SPALT + 6);

                if (g.i > 0.01) {

            ctx.restore();
            // observatörerna vid tankens kortsidor
            const fFram = p.u < 1 ? p.f / (1 - p.u) : null, fBak = p.f / (1 + p.u);
            info.current = { f: p.f, lam, v: V, fFram, fBak, u: p.u };
            for (const [x, txt, ank, lx] of [[RAM + 30, 'bakom', 'left', RAM + 10], [W - RAM - 30, 'framför', 'right', W - RAM - 10]]) {
                ctx.save(); ctx.fillStyle = '#f3eee4'; ctx.strokeStyle = BLAECK; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(x, y0, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.fillStyle = BLAECK; ctx.beginPath(); ctx.arc(x, y0, 4, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
                etikett(ctx, txt, lx, y0 - 22, '#f3eee4', 21, ank);
            }
            if (p.visa.lambda) {
                const fram = [], bak = [];
                for (const fr of D.fronter) {
                    const R = V * (t - fr.t); if (R <= 2) continue;
                    if (fr.x + R > D.x + 1) fram.push(fr.x + R);
                    if (fr.x - R < D.x - 1) bak.push(fr.x - R);
                }
                fram.sort((a, b) => a - b); bak.sort((a, b) => b - a);
                const lamF = lam * (1 - p.u), lamB = lam * (1 + p.u);
                const g0 = D.x + 50;
                const iF = fram.findIndex((x) => x >= g0);
                if (p.u < 0.98 && iF >= 0 && iF + 1 < fram.length && fram[iF + 1] < W - RAM) {
                    const al = tona((fram[iF] - g0) / lamF);
                    dubbelpil(ctx, fram[iF], y0 - 34, fram[iF + 1], y0 - 34, '#f6f2ea', al);
                    ctx.save(); ctx.globalAlpha = al;
                    beteckning(ctx, 'λ', '', (fram[iF] + fram[iF + 1]) / 2, y0 - 48, '#f6f2ea', 25, 'middle'); ctx.restore();
                }
                const g1 = D.x - 50;
                const iB = bak.findIndex((x) => x <= g1);
                if (iB >= 0 && iB + 1 < bak.length && bak[iB + 1] > RAM) {
                    const al = tona((g1 - bak[iB]) / lamB);
                    dubbelpil(ctx, bak[iB + 1], y0 - 34, bak[iB], y0 - 34, '#f6f2ea', al);
                    ctx.save(); ctx.globalAlpha = al;
                    beteckning(ctx, 'λ', '', (bak[iB] + bak[iB + 1]) / 2, y0 - 48, '#f6f2ea', 25, 'middle'); ctx.restore();
                }
            }
            // källan och dess hastighet
            if (p.u > 0.02) pil(ctx, D.x + 14, y0 + 30, D.x + 14 + 40 + 50 * p.u, y0 + 30, '#ffe9a8', 4);
            ritaKalla(D.x, y0, phi);
        }

        // ── 3D: vattenytan i Three.js, på en labbänk ────────────────────
        // Ytan är ett nät med (GX3 + 1) × (GY3 + 1) hörn vars höjd sätts
        // varje bildruta ur S och C (samma fält som i 2D). Färgen följer
        // samma palett, och ljuset ger glansen på vågtopparna.
        let tre = null;
        function byggTre() {
            const cv3 = canvas3Ref.current;
            const renderer = new THREE.WebGLRenderer({ canvas: cv3, antialias: true });
            renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
            const scene = new THREE.Scene();
            scene.background = new THREE.Color('#ece5d8');
            const camera = new THREE.PerspectiveCamera(38, W / H, 10, 5000);
            scene.add(new THREE.HemisphereLight(0xf4f1ea, 0x5a5048, 0.7));
            const sol = new THREE.DirectionalLight(0xffffff, 0.75);
            sol.position.set(-400, 700, -300); scene.add(sol);
            // vattenytan
            const geo = new THREE.PlaneGeometry(W, H, GX3, GY3);
            geo.rotateX(-Math.PI / 2);
            const nv = geo.attributes.position.count;
            geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(nv * 3), 3));
            const mat = new THREE.MeshPhongMaterial({ vertexColors: true, shininess: 70, specular: 0x6f8fa8, side: THREE.DoubleSide });
            const yta = new THREE.Mesh(geo, mat); scene.add(yta);
            // tankens ram och botten
            const ramMat = new THREE.MeshPhongMaterial({ color: 0x3d4651, shininess: 40 });
            const kant = (w, d, x, z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, 34, d), ramMat); m.position.set(x, 2, z); scene.add(m); };
            kant(W + 28, 14, 0, -H / 2 - 7); kant(W + 28, 14, 0, H / 2 + 7);
            kant(14, H, -W / 2 - 7, 0); kant(14, H, W / 2 + 7, 0);
            const botten = new THREE.Mesh(new THREE.BoxGeometry(W + 28, 6, H + 28), new THREE.MeshPhongMaterial({ color: 0x24303b }));
            botten.position.y = -18; scene.add(botten);
            const bank = new THREE.Mesh(new THREE.BoxGeometry(1700, 30, 1250), new THREE.MeshLambertMaterial({ color: 0x9c7c58 }));
            bank.position.y = -36; scene.add(bank);
            // det som byts med läget: källor, skärm, glasskiva
            const extra = new THREE.Group(); scene.add(extra);
            return { renderer, scene, camera, geo, yta, extra, nyckel: '' };
        }
        function bygglage(p) {
            const g = tre.extra;
            while (g.children.length) g.remove(g.children[0]);
            const kulMat = new THREE.MeshPhongMaterial({ color: 0xe6ebf0, shininess: 90 });
            if (p.mode === 'single' || p.mode === 'double' || p.mode === 'doppler') {
                const n = p.mode === 'double' ? 2 : 1;
                for (let i = 0; i < n; i++) { const k = new THREE.Mesh(new THREE.SphereGeometry(9, 20, 14), kulMat); k.name = 'kalla' + i; g.add(k); }
            }
            if (p.mode === 'diffraction' || p.mode === 'diffraction-double') {
                const xs = p.mode === 'diffraction' ? [[W / 2 - p.b / 2, W / 2 + p.b / 2]]
                    : [[W / 2 - p.d / 2 - p.b / 2, W / 2 - p.d / 2 + p.b / 2], [W / 2 + p.d / 2 - p.b / 2, W / 2 + p.d / 2 + p.b / 2]];
                const bit = []; let x = 0;
                for (const [a, bb] of xs) { if (a > x) bit.push([x, a]); x = bb; }
                bit.push([x, W]);
                const sm = new THREE.MeshPhongMaterial({ color: 0x5b6672, shininess: 50 });
                for (const [xa, xb] of bit) {
                    if (xb - xa < 1) continue;
                    const m = new THREE.Mesh(new THREE.BoxGeometry(xb - xa, 40, 10), sm);
                    m.position.set((xa + xb) / 2 - W / 2, 6, YB_SPALT - H / 2); g.add(m);
                }
            }
            if (p.mode === 'planar' || p.mode === 'diffraction' || p.mode === 'diffraction-double') {
                const bar = new THREE.Mesh(p.mode === 'planar' ? new THREE.BoxGeometry(12, 26, H - 8) : new THREE.BoxGeometry(W - 8, 26, 12),
                                           new THREE.MeshPhongMaterial({ color: 0x7d8895, shininess: 50 }));
                bar.name = 'alstrare'; g.add(bar);
            }
        }
        function rita3D(ctx, p) {
            if (!window.THREE) return;
            if (!tre) tre = byggTre();
            const cv3 = canvas3Ref.current, br = cv3.clientWidth, hr = Math.round(br * H / W);
            if (br < 10) return;
            if (cv3.width !== Math.round(br * tre.renderer.getPixelRatio())) tre.renderer.setSize(br, hr, false);
            const lk = [p.mode, p.b, p.d].join('|');
            if (lk !== tre.nyckel) { tre.nyckel = lk; bygglage(p); }
            const phi = fas.current, lam = V / p.f;
            info.current = { f: p.f, lam, v: V };
            const pos = tre.geo.attributes.position, col = tre.geo.attributes.color, nx = GX3 + 1;
            const AMP = 13;
            const satt = (idx, zn, pal) => {
                pos.setY(idx, zn * AMP);
                let tt = (zn + 1) / 2; tt = tt < 0 ? 0 : tt > 1 ? 1 : tt;
                let c0, c1, s;
                if (tt < 0.5) { c0 = pal[0]; c1 = pal[1]; s = tt * 2; } else { c0 = pal[1]; c1 = pal[2]; s = (tt - 0.5) * 2; }
                col.setXYZ(idx, (c0[0] + (c1[0] - c0[0]) * s) / 255, (c0[1] + (c1[1] - c0[1]) * s) / 255, (c0[2] + (c1[2] - c0[2]) * s) / 255);
            };
            if (p.mode === 'doppler') {
                const D = doppler.current, tt = tid.current, sig = 13;
                info.current = { f: p.f, lam, v: V, fFram: p.u < 1 ? p.f / (1 - p.u) : null, fBak: p.f / (1 + p.u), u: p.u };
                const ringar = [];
                for (const fr of D.fronter) { const R = V * (tt - fr.t); if (R > 2 && R < 1000) ringar.push([fr.x, R, Math.max(0, 1 - R / 950)]); }
                for (let j = 0; j <= GY3; j++) for (let i = 0; i <= GX3; i++) {
                    const x = i * G3, y = j * G3; let zz = 0;
                    for (const [fx, R, A] of ringar) {
                        const r = Math.hypot(x - fx, y - H / 2), q = (r - R) / sig;
                        if (q > -3 && q < 3) zz += A * (Math.exp(-q * q) - 0.45 * Math.exp(-(q + 1.6) * (q + 1.6)));
                    }
                    satt(j * nx + i, Math.max(-1.2, Math.min(1.2, zz)), PAL_DJUP);
                }
                const k0 = tre.extra.getObjectByName('kalla0');
                if (k0) k0.position.set(D.x - W / 2, 6, 0);
            } else {
                if (!falt3.current) falt3.current = byggFalt(p, nx, GY3 + 1, G3);
                const F = falt3.current, cw = Math.cos(phi), sw = Math.sin(phi), inv = 1 / F.norm;
                const grund = p.mode === 'refraction' ? YB_BRYT : 1e9;
                for (let j = 0; j <= GY3; j++) {
                    const pal = j * G3 >= grund ? PAL_GRUNT : PAL_DJUP;
                    for (let i = 0; i <= GX3; i++) {
                        const idx = j * nx + i;
                        let zz = (F.S[idx] * cw - F.C[idx] * sw) * inv;
                        satt(idx, Math.max(-1.25, Math.min(1.25, zz)), pal);
                    }
                }
                if (p.mode === 'refraction') {
                    const g = brytGeometri(p);
                    info.current = { f: p.f, lam, v: g.v1, lam2: g.v2 / p.f, v2: g.v2, i: g.i, b: g.b };
                }
                const ks = p.mode === 'single' ? [p.k1] : p.mode === 'double' ? [p.k1, p.k2] : [];
                ks.forEach((s, i) => { const k = tre.extra.getObjectByName('kalla' + i); if (k) k.position.set(s.x - W / 2, 8 + 3 * Math.sin(phi), s.y - H / 2); });
                const bar = tre.extra.getObjectByName('alstrare');
                if (bar) {
                    const s = 4 * Math.sin(phi);
                    if (p.mode === 'planar') bar.position.set(-W / 2 + 12 + s, 4, 0);
                    else bar.position.set(0, 4, -H / 2 + 12 + s);
                }
            }
            pos.needsUpdate = true; col.needsUpdate = true;
            tre.geo.computeVertexNormals();
            const k = kamera.current, R = 1280;
            tre.camera.position.set(R * Math.cos(k.v) * Math.sin(k.h), R * Math.sin(k.v), R * Math.cos(k.v) * Math.cos(k.h));
            tre.camera.lookAt(0, -20, 10);
            tre.renderer.render(tre.scene, tre.camera);
        }

        raf = requestAnimationFrame(ram);
        return () => { cancelAnimationFrame(raf); obs.disconnect(); };
    }, []);

    // ── Pekare: dra i källorna (2D) eller vrid kameran (3D) ─────────────
    const tillScen = (e) => {
        const r = canvasRef.current.getBoundingClientRect();
        return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
    };
    const kanDra = vy === '3D' || mode === 'single' || mode === 'double';
    const onDown = (e) => {
        if (vy === '3D') { drag.current = { kamera: true, x: e.clientX, y: e.clientY }; e.currentTarget.setPointerCapture(e.pointerId); return; }
        if (mode !== 'single' && mode !== 'double') return;
        const q = tillScen(e);
        const lista = mode === 'single' ? ['k1'] : ['k1', 'k2'];
        for (const n of lista) {
            const s = kallor[n];
            if (Math.hypot(q.x - s.x, q.y - s.y) < 34) { drag.current = { kalla: n }; e.currentTarget.setPointerCapture(e.pointerId); return; }
        }
    };
    const onMove = (e) => {
        const dr = drag.current; if (!dr) return;
        if (dr.kamera) {
            const k = kamera.current;
            k.h += (e.clientX - dr.x) * 0.008;
            k.v = Math.max(0.25, Math.min(1.45, k.v + (e.clientY - dr.y) * 0.006));
            dr.x = e.clientX; dr.y = e.clientY; return;
        }
        const q = tillScen(e);
        const x = Math.max(RAM + 12, Math.min(W - RAM - 12, q.x)), y = Math.max(RAM + 12, Math.min(H - RAM - 12, q.y));
        setKallor((k) => {
            const ny = { ...k, [dr.kalla]: { x, y } };
            if (mode === 'double') setD(Math.round(Math.hypot(ny.k2.x - ny.k1.x, ny.k2.y - ny.k1.y)));
            return ny;
        });
    };
    const onUp = () => { drag.current = null; };

    // Avståndsreglaget flyttar källorna symmetriskt kring deras mittpunkt
    const sattD = (nd) => {
        setD(nd);
        if (mode === 'double') setKallor((k) => {
            const mx = (k.k1.x + k.k2.x) / 2, my = (k.k1.y + k.k2.y) / 2;
            let ux = k.k2.x - k.k1.x, uy = k.k2.y - k.k1.y; const L = Math.hypot(ux, uy) || 1; ux /= L; uy /= L;
            return { k1: { x: mx - ux * nd / 2, y: my - uy * nd / 2 }, k2: { x: mx + ux * nd / 2, y: my + uy * nd / 2 } };
        });
    };
    const tVisa = (n) => setVisa((s) => ({ ...s, [n]: !s[n] }));
    const byt = (m) => setMode(m);

    // ── Avläsning ───────────────────────────────────────────────────────
    const I = info.current;
    const avlasning = () => {
        const rader = [];
        const cm = (px) => fmt(px / 10, 1) + ' cm';
        const ms = (pxs) => fmt(pxs / 1000, 2) + ' m/s';
        if (mode === 'refraction' && I.v2) {
            rader.push(['<em>f</em>', fmt(f, 1) + ' Hz'], ['<em>v</em><sub>1</sub>', ms(I.v)], ['<em>λ</em><sub>1</sub>', cm(I.lam)],
                       ['<em>v</em><sub>2</sub>', ms(I.v2)], ['<em>λ</em><sub>2</sub>', cm(I.lam2)],
                       ['<em>i</em>', fmt(I.i * 180 / Math.PI, 0) + '°'], ['<em>b</em>', fmt(I.b * 180 / Math.PI, 0) + '°']);
        } else if (mode === 'doppler') {
            rader.push(['<em>f</em> hos källan', fmt(f, 1) + ' Hz'], ['<em>v</em>', ms(V)], ['källans fart', ms(u * V)],
                       ['<em>f</em> framför', u < 1 ? fmt(f / (1 - u), 1) + ' Hz' : 'ingen våg'], ['<em>f</em> bakom', fmt(f / (1 + u), 1) + ' Hz']);
        } else {
            rader.push(['<em>f</em>', fmt(f, 1) + ' Hz'], ['<em>v</em>', ms(V)], ['<em>λ</em>', cm(V / f)]);
            if (mode === 'double' || mode === 'diffraction-double') rader.push(['<em>d</em>', cm(d)]);
            if (mode === 'diffraction' || mode === 'diffraction-double') rader.push(['öppning', cm(b)]);
        }
        return (
            <div className="scene-info">
                {rader.map(([l, v]) => (
                    <React.Fragment key={l}><span className="si-lbl" dangerouslySetInnerHTML={{ __html: l }} /><span className="si-val">{v}</span></React.Fragment>
                ))}
            </div>
        );
    };

    // ── Reglage ─────────────────────────────────────────────────────────
    const reglage = (kompakt) => {
        const rad = (key, label, value, min, max, step, onChange, visaV, not) => kompakt ? (
            <div className="st-slider" key={key}>
                <div className="st-slider-top"><span dangerouslySetInnerHTML={{ __html: label }} /><span className="sl-val">{visaV}</span></div>
                <input type="range" min={min} max={max} step={step} value={value} onChange={(e) => onChange(parseFloat(e.target.value))} />
            </div>
        ) : (
            <div className="sl-row" key={key}>
                <div className="sl-top"><span dangerouslySetInnerHTML={{ __html: label }} /><span className="sl-val">{visaV}</span></div>
                <input type="range" min={min} max={max} step={step} value={value} onChange={(e) => onChange(parseFloat(e.target.value))} />
                {not && <div className="sl-note" dangerouslySetInnerHTML={{ __html: not }} />}
            </div>
        );
        const ut = [rad('f', 'Frekvens <em>f</em>', f, 1.5, 5, 0.1, setF, fmt(f, 1) + ' Hz',
            mode === 'doppler' ? 'Frekvensen som källan svänger med.' : 'Våglängden blir <em>λ</em> = <em>v</em> / <em>f</em>.')];
        if (mode === 'refraction') {
            ut.push(rad('i', 'Infallsvinkel <em>i</em>', vinkel, 0, 70, 1, setVinkel, fmt(vinkel, 0) + '°'));
            ut.push(rad('h', 'Djup i det grunda området <em>h</em><sub>2</sub>', h2, 0.5, 4, 0.1, setH2, fmt(h2, 1) + ' mm',
                'Djupt vatten är ' + fmt(H_DJUP * 1000, 1) + '&nbsp;mm. Ju grundare, desto långsammare går vågen.'));
        }
        if (mode === 'double' || mode === 'diffraction-double')
            ut.push(rad('d', mode === 'double' ? 'Avstånd mellan källorna <em>d</em>' : 'Avstånd mellan öppningarna <em>d</em>',
                d, 40, mode === 'double' ? 360 : 320, 2, sattD, fmt(d / 10, 1) + ' cm'));
        if (mode === 'diffraction' || mode === 'diffraction-double')
            ut.push(rad('b', 'Öppningens bredd', b, 20, mode === 'diffraction' ? 300 : 120, 2, setB, fmt(b / 10, 1) + ' cm'));
        if (mode === 'doppler')
            ut.push(rad('u', 'Källans fart', u, 0, 1.5, 0.05, setU, fmt(u * V / 1000, 2) + ' m/s',
                u >= 1 ? 'Källan går lika fort som eller fortare än vågorna. Fronterna hopar sig till en kil, som en ljudbang.'
                       : 'Vågorna går med <em>v</em> = 0,20&nbsp;m/s.'));
        return ut;
    };

    const visaRutor = () => {
        if (vy === '3D') return null;
        const r = [];
        const cb = (n, txt, swatch) => (
            <label key={n}><input type="checkbox" checked={!!visa[n]} onChange={() => tVisa(n)} />{swatch}<span dangerouslySetInnerHTML={{ __html: txt }} /></label>
        );
        if (mode === 'single' || mode === 'planar' || mode === 'refraction') r.push(cb('toppar', 'Vågtoppar (vågfronter)', <span className="st-swatch" style={{ background: 'rgba(15,22,32,0.6)' }}></span>));
        if (mode === 'single' || mode === 'planar' || mode === 'refraction' || mode === 'doppler') r.push(cb('lambda', 'Våglängd <em>λ</em>'));
        if (mode === 'refraction') r.push(cb('stralen', 'Stråle, normal och vinklar'));
        if (mode === 'double' || mode === 'diffraction-double') {
            r.push(cb('nod', 'Nodlinjer', <span className="st-swatch streck" style={{ borderColor: ROD }}></span>));
            r.push(cb('max', 'Maximilinjer', <span className="st-swatch streck" style={{ borderColor: GRON }}></span>));
        }
        return r;
    };

    const lagesVal = (kompakt) => lagen.length < 2 ? null : kompakt ? (
        <React.Fragment>
            <div className="st-title mt">Försök</div>
            {lagen.map((m) => (
                <label key={m}><input type="radio" name="fs-mode" checked={mode === m} onChange={() => byt(m)} /><span>{NAMN[m][0]}</span></label>
            ))}
        </React.Fragment>
    ) : (
        <div className="glass-card rounded-xl p-3 mb-3">
            <div className="flbl mb-2">Försök</div>
            <div className="mode-seg" style={{ gridTemplateColumns: 'repeat(' + lagen.length + ', 1fr)' }}>
                {lagen.map((m) => (
                    <button key={m} className={mode === m ? 'active' : ''} onClick={() => byt(m)}>
                        {NAMN[m][0]}<span className="sub">{NAMN[m][1]}</span>
                    </button>
                ))}
            </div>
        </div>
    );

    const sceneToggles = () => {
        if (!togglesOpen) return (
            <button className="st-show-btn" onClick={() => setTogglesOpen(true)} aria-label="Visa inställningar" title="Visa inställningar" aria-expanded="false">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" aria-hidden="true">
                    <line x1="4" y1="8" x2="20" y2="8" /><circle cx="14.5" cy="8" r="2.7" fill="currentColor" stroke="none" />
                    <line x1="4" y1="16" x2="20" y2="16" /><circle cx="9.5" cy="16" r="2.7" fill="currentColor" stroke="none" />
                </svg>
            </button>
        );
        const rutor = visaRutor();
        return (
            <div className="scene-toggles">
                <button className="st-hide" onClick={() => setTogglesOpen(false)} aria-label="Dölj inställningar" title="Dölj inställningar" aria-expanded="true">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
                </button>
                {rutor && rutor.length > 0 && <React.Fragment><div className="st-title">Visa</div>{rutor}</React.Fragment>}
                <label><input type="checkbox" checked={ultra} onChange={() => setUltra((x) => !x)} /><span>Ultrarapid</span></label>
                <div className="st-title mt">Vy</div>
                <div className="st-row">
                    <button className={vy === '2D' ? 'btn-toggle active' : 'btn-toggle'} onClick={() => setVy('2D')}>Uppifrån</button>
                    <button className={vy === '3D' ? 'btn-toggle active' : 'btn-toggle'} onClick={() => setVy('3D')}>3D</button>
                </div>
                {isFullscreen && (
                    <React.Fragment>
                        {lagesVal(true)}
                        <div className="st-title mt">Reglage</div>
                        <div className="st-sliders">{reglage(true)}</div>
                        <div className="st-actions">
                            <button className="btn-toggle" onClick={() => setSpelar((s) => !s)}>{spelar ? 'Pausa' : 'Spela'}</button>
                        </div>
                    </React.Fragment>
                )}
            </div>
        );
    };

    // ── Texter per avsnitt ──────────────────────────────────────────────
    const Vbl = ({ label, children }) => (
        <div className="flex flex-col items-center" style={{ lineHeight: 1.1 }}>
            <span className="flbl">{label}</span>
            <span className="fnum">{children}</span>
            <span className="flbl" aria-hidden="true" style={{ visibility: 'hidden' }}>{label}</span>
        </div>
    );
    const Op = ({ children }) => <span className="fnum">{children}</span>;
    const formel = lage === 'interferens' ? (
        <div className="formula-card glass-card rounded-xl p-4 mb-6 flex flex-wrap items-center gap-x-2 gap-y-3" style={{ color: 'var(--lab-ink)' }}>
            <span className="flbl" style={{ marginRight: 6 }}>Maximilinje</span>
            <Vbl label="Vägskillnad">Δ<em>s</em></Vbl><Op>=</Op>
            <Vbl label="Ordningsnummer"><em>n</em></Vbl><Op>·</Op>
            <Vbl label="Våglängd"><em>λ</em></Vbl>
            <span className="fnum" style={{ margin: '0 14px', color: 'var(--lab-ink-muted)' }}>|</span>
            <span className="flbl" style={{ marginRight: 6 }}>Nodlinje</span>
            <Vbl label="Vägskillnad">Δ<em>s</em></Vbl><Op>=</Op>
            <Op>(</Op><Vbl label="Ordningsnummer"><em>n</em></Vbl><Op>+</Op>
            <div className="flex flex-col items-center" style={{ lineHeight: 1.05, margin: '0 1px' }}>
                <span className="fnum" style={{ fontSize: 15, padding: '0 2px' }}>1</span>
                <span className="fnum" style={{ fontSize: 15, borderTop: '1.6px solid currentColor', padding: '0 2px' }}>2</span>
            </div>
            <Op>)</Op><Op>·</Op>
            <Vbl label="Våglängd"><em>λ</em></Vbl>
        </div>
    ) : (
        <div className="formula-card glass-card rounded-xl p-4 mb-6 flex flex-wrap items-center gap-x-2 gap-y-3" style={{ color: 'var(--lab-ink)' }}>
            <Vbl label="Våghastighet"><em>v</em></Vbl><Op>=</Op>
            <Vbl label="Frekvens"><em>f</em></Vbl><Op>·</Op>
            <Vbl label="Våglängd"><em>λ</em></Vbl>
        </div>
    );
    const TEXT = {
        vatten: {
            titel: 'Vågtanken: vattenvågor och brytning',
            krumelur: ['Hem', 'Fysik nivå 2', 'Vattenvågor och brytningslagen'],
            ingress: <React.Fragment>En vågtank sedd uppifrån. En <strong>punktformig vågkälla</strong> ger cirkulära vågor, och en rak <strong>vågalstrare</strong> ger plana vågor med raka vågfronter. Där en glasskiva gör vattnet <strong>grundare</strong> går vågorna långsammare. Frekvensen är densamma, så våglängden blir kortare, och en våg som kommer snett in <strong>bryts mot normalen</strong>.</React.Fragment>,
            prova: ['Dra i punktkällan och se att vågfronterna alltid är cirklar runt den.', 'Öka frekvensen. Vad händer med våglängden när farten är densamma?', 'Brytning: gör det grunda området grundare. Hur ändras <em>λ</em><sub>2</sub> och brytningsvinkeln <em>b</em>?', 'Sätt infallsvinkeln till 0°. Ändrar vågen riktning nu?'],
        },
        interferens: {
            titel: 'Vågtanken: interferens och diffraktion',
            krumelur: ['Hem', 'Fysik nivå 2', 'Diffraktion och interferens'],
            ingress: <React.Fragment>Två vågkällor som svänger <strong>i fas</strong> ger ett mönster av stråk där vattnet nästan står stilla, <strong>nodlinjer</strong>, och stråk där vågorna förstärker varandra, <strong>maximilinjer</strong>. En plan våg som går genom en öppning <strong>böjs av vid kanterna</strong> (diffraktion), och två öppningar fungerar som två källor i fas.</React.Fragment>,
            prova: ['Slå på nodlinjerna och dra isär källorna. Blir nodlinjerna fler eller färre?', 'Öka frekvensen så att våglängden blir kortare. Hur ändras mönstret?', 'En öppning: gör öppningen smal jämfört med våglängden, och sedan bred. När böjs vågen mest?', 'Två öppningar: jämför mönstret med två punktkällor.'],
        },
        doppler: {
            titel: 'Vågtanken: dopplereffekt',
            krumelur: ['Hem', 'Fysik nivå 2', 'Ljudfrekvens och dopplereffekt'],
            ingress: <React.Fragment>En vågkälla som rör sig genom vattnet. Varje vågfront sprids som en cirkel från den plats där källan var när fronten skickades ut. <strong>Framför</strong> källan kommer fronterna tätare, så en observatör där uppfattar en <strong>högre frekvens</strong>. <strong>Bakom</strong> källan blir våglängden längre och frekvensen <strong>lägre</strong>.</React.Fragment>,
            prova: ['Jämför våglängden framför och bakom källan.', 'Sätt källans fart till 0. Hur ser fronterna ut då?', 'Öka källans fart till samma som vågornas fart, 0,20 m/s. Vad händer framför källan?', 'Gå över vågornas fart. Fronterna bildar en kil, precis som ljudet bakom ett flygplan som flyger fortare än ljudet.'],
        },
    }[lage];

    const tips = vy === '3D' ? 'Dra för att vrida vattenytan'
        : mode === 'single' ? 'Dra i vågkällan'
        : mode === 'double' ? 'Dra i vågkällorna' : null;

    return (
        <div className="min-h-screen dark-container px-4 md:px-8 pb-12" style={{ fontFamily: "'DM Sans', sans-serif" }}>
            <div className="max-w-6xl mx-auto pt-6">
                <div className="breadcrumb mb-4" style={{ fontSize: 13 }}>
                    <a href="index.html">Hem</a> / <a href="katalog.html#fy2">Fysik nivå 2</a> / {TEXT.krumelur[2]}
                </div>
                <h1 className="text-3xl md:text-4xl font-black tracking-tight" style={{ color: 'var(--lab-ink)' }}>{TEXT.titel}</h1>
                <p className="mt-2 mb-5" style={{ color: 'var(--lab-ink-soft)', maxWidth: 820 }}>{TEXT.ingress}</p>
                {formel}

                <main className="flex flex-col lg:flex-row gap-6">
                    <div className="lg:w-3/5 order-1">
                        <div className={'scene-wrap' + (isFullscreen ? ' is-fs' : '')} data-theme="ljusPapper" ref={wrapRef}>
                            <canvas ref={canvas3Ref} className="vs-3d" style={{ display: vy === '3D' ? 'block' : 'none', touchAction: 'none', cursor: 'grab' }}
                                    onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp} onPointerCancel={onUp}
                                    aria-label="Vågtanken i 3D" role="img" />
                            <canvas ref={canvasRef} width={W} height={H}
                                    style={{ display: vy === '3D' ? 'none' : 'block', touchAction: kanDra ? 'none' : 'auto', cursor: vy === '3D' ? 'grab' : (mode === 'single' || mode === 'double') ? 'pointer' : 'default' }}
                                    onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp} onPointerCancel={onUp}
                                    aria-label="Vågtank sedd uppifrån med vattenvågor" role="img" />
                            {avlasning()}
                            {tips && <div className="scene-hint">{tips}</div>}
                            {sceneToggles()}
                            <button className="fs-btn" onClick={toggleFullscreen} aria-label="Fullskärm" title={isFullscreen ? 'Lämna fullskärm' : 'Fullskärm'}>
                                {isFullscreen ? (
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                        <path d="M9 3v6H3" /><path d="M15 21v-6h6" /><path d="M21 9h-6V3" /><path d="M3 15h6v6" />
                                    </svg>
                                ) : (
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                        <path d="M3 9V3h6" /><path d="M21 9V3h-6" /><path d="M3 15v6h6" /><path d="M21 15v6h-6" />
                                    </svg>
                                )}
                            </button>
                        </div>
                    </div>

                    <div className="lg:w-2/5 order-2">
                        {lagesVal(false)}
                        <div className="glass-card rounded-xl p-3 mb-3">
                            {reglage(false)}
                            <div className="flex gap-2 mt-1">
                                <button className={'btn-toggle flex-1' + (spelar ? '' : ' active')} onClick={() => setSpelar((s) => !s)}>{spelar ? 'Pausa' : 'Spela'}</button>
                            </div>
                        </div>
                        <div className="glass-card rounded-xl p-4">
                            <div className="flbl mb-2">Prova själv</div>
                            <ul className="provlista text-sm list-disc pl-5" style={{ color: 'var(--lab-ink-soft)' }}>
                                {TEXT.prova.map((t, i) => <li key={i} dangerouslySetInnerHTML={{ __html: t }} />)}
                            </ul>
                        </div>
                    </div>
                </main>
            </div>
        </div>
    );
};
