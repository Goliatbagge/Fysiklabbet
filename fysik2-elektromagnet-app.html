                    if (p.on) { ctx.strokeStyle = 'rgba(60,207,110,0.35)'; ctx.lineWidth = 4 * s; ctx.stroke(); }
                    // strömbrytare (vippa)
                    const W2 = S.sw;
                    ctx.fillStyle = '#1b2027'; rr(W2.x, W2.y, W2.w, W2.h, 5 * s); ctx.fill();
                    const kx = p.on ? W2.x + W2.w * 0.5 : W2.x + 2 * s;
                    const kg = ctx.createLinearGradient(0, W2.y, 0, W2.y + W2.h);
                    kg.addColorStop(0, p.on ? '#e15b55' : '#9aa1aa'); kg.addColorStop(1, p.on ? '#a8302b' : '#6c737c');
                    ctx.fillStyle = kg; rr(kx, W2.y + 2 * s, W2.w * 0.5 - 2 * s, W2.h - 4 * s, 4 * s); ctx.fill();
                    ctx.fillStyle = '#e8e2d6';
                    ctx.font = `600 ${Math.round(9.5 * s)}px Poppins, sans-serif`; ctx.textAlign = 'center';
                    ctx.fillText(p.on ? 'PÅ' : 'AV', p.on ? W2.x + W2.w * 0.25 : W2.x + W2.w * 0.75, W2.y + W2.h / 2 + 1);
                    // anslutningar
                    const term = (T, red, label) => {
                        ctx.beginPath(); ctx.arc(T.x, T.y, 10 * s, 0, 2 * Math.PI);
                        ctx.fillStyle = red ? '#c0392b' : '#1b1f25'; ctx.fill();
                        ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1; ctx.stroke();
                        ctx.beginPath(); ctx.arc(T.x, T.y, 4 * s, 0, 2 * Math.PI);
                        ctx.fillStyle = '#c9ccd1'; ctx.fill();
                        ctx.fillStyle = '#e8e2d6';
                        ctx.font = `700 ${Math.round(12 * s)}px Poppins, sans-serif`;
                        ctx.textBaseline = 'middle'; ctx.fillText(label, T.x - 16 * s, T.y);
                    };
                    term(S.plus, true, p.ac ? '~' : '+');
                    term(S.minus, false, p.ac ? '~' : '−');
                    ctx.restore();
                    return S;
                };

                const drawCoilBody = (p, E) => {
                    const c = st.coil, L = st.Lp, ap = st.ap;
                    // skugga på bänken
                    ctx.fillStyle = 'rgba(15,22,32,0.13)';
                    rr(E.outL + 3, c.y - ap + 6, E.outR - E.outL, ap * 2 + 2, 6); ctx.fill();
                    if (p.core === 'jarn') {
                        const cr = ap * 0.62;
                        const g = ctx.createLinearGradient(0, c.y - cr, 0, c.y + cr);
                        g.addColorStop(0, '#4c535c'); g.addColorStop(0.35, '#a3abb5'); g.addColorStop(0.5, '#c2c9d1');
                        g.addColorStop(0.7, '#7d858f'); g.addColorStop(1, '#3f454d');
                        ctx.fillStyle = g; rr(E.outL, c.y - cr, E.outR - E.outL, cr * 2, 3); ctx.fill();
                        ctx.strokeStyle = '#353a41'; ctx.lineWidth = 1; ctx.stroke();
                    }
                    // spolstommen (genomskinlig plast), så att fältet syns inuti
                    const g = ctx.createLinearGradient(0, c.y - ap, 0, c.y + ap);
                    g.addColorStop(0, 'rgba(206,214,222,0.55)'); g.addColorStop(0.45, 'rgba(244,247,250,0.42)');
                    g.addColorStop(1, 'rgba(180,190,200,0.55)');
                    ctx.fillStyle = g; ctx.fillRect(c.x - L / 2, c.y - ap, L, ap * 2);
                };
                const drawStrips = (p, E, Bdir, flowOn) => {
                    const c = st.coil, L = st.Lp, ap = st.ap;
                    const Ns = Math.min(25, Math.max(4, Math.round(p.n / 40)));
                    const x0 = c.x - L / 2 + E.fw, span = L - 2 * E.fw;
                    const sp = span / Ns;
                    const tk = Math.min(10, Math.max(2.6, sp * 0.7));
                    const sl = p.wind * Math.max(sp * 0.9, 6);
                    if (!p.show.snitt) {
                        const g = ctx.createLinearGradient(0, c.y - ap, 0, c.y + ap);
                        g.addColorStop(0, '#6e3712'); g.addColorStop(0.3, '#cf8a4f'); g.addColorStop(0.5, '#f1b781');
                        g.addColorStop(0.72, '#c47a3f'); g.addColorStop(1, '#5e2f10');
                        ctx.strokeStyle = g; ctx.lineWidth = tk; ctx.lineCap = 'butt';
                        for (let i = 0; i < Ns; i++) {
                            const xm = x0 + (i + 0.5) * sp;
                            ctx.beginPath(); ctx.moveTo(xm - sl / 2, c.y - ap); ctx.lineTo(xm + sl / 2, c.y + ap); ctx.stroke();
                        }
                        // strömmen över spolens ovansida
                        if (flowOn) {
                            const dir = Bdir > 0 ? 1 : -1;     // ner i bilden när fältet pekar åt höger
                            const step = Ns > 14 ? 2 : 1;
                            for (let i = 0; i < Ns; i += step) {
                                const xm = x0 + (i + 0.5) * sp;
                                const pts = [[xm - sl / 2, c.y - ap], [xm + sl / 2, c.y + ap]];
                                flowAlong(pts, st.phase * 0.6, dir, 0.85);
                            }
                        }
                    } else {
                        // genomskärning: ledarnas tvärsnitt längs norra och södra kanten
                        const rC = Math.min(sp * 0.42, 7.5);
                        const mark = (x, y, out) => {
                            ctx.beginPath(); ctx.arc(x, y, rC, 0, 2 * Math.PI);
                            ctx.fillStyle = '#d58c50'; ctx.fill();
                            ctx.strokeStyle = '#6e3712'; ctx.lineWidth = 1.1; ctx.stroke();
                            if (Bdir === 0) return;
                            ctx.strokeStyle = COL.strom; ctx.fillStyle = COL.strom;
                            if (out) { ctx.beginPath(); ctx.arc(x, y, Math.max(1.8, rC * 0.36), 0, 2 * Math.PI); ctx.fill(); }
                            else {
                                const d = rC * 0.55; ctx.lineWidth = Math.max(1.3, rC * 0.24);
                                ctx.beginPath(); ctx.moveTo(x - d, y - d); ctx.lineTo(x + d, y + d);
                                ctx.moveTo(x + d, y - d); ctx.lineTo(x - d, y + d); ctx.stroke();
                            }
                        };
                        // fältet åt höger ⇒ ström ut ur bänken (⊙) vid norra kanten, in (⊗) vid södra
                        for (let i = 0; i < Ns; i++) {
                            const xm = x0 + (i + 0.5) * sp;
                            mark(xm, c.y - ap, Bdir > 0);
                            mark(xm, c.y + ap, Bdir < 0);
                        }
                        // små fältcirklar kring två ledare: fälten samverkar inuti spolen
                        if (Bdir !== 0) {
                            const xm = x0 + (Math.floor(Ns / 2) + 0.5) * sp;
                            const ring = (y, ccw) => {
                                const R = rC + 7;
                                ctx.strokeStyle = COL.falt; ctx.lineWidth = 1.3;
                                ctx.beginPath(); ctx.arc(xm, y, R, 0, 2 * Math.PI); ctx.stroke();
                                // pilspetsen på cirkelns insida (mot spolens axel)
                                const ay = y < c.y ? y + R : y - R;
                                const right = (y < c.y) === ccw;
                                chevronRed(xm, ay, right ? 0 : Math.PI);
                            };
                            ring(c.y - ap, Bdir > 0);
                            ring(c.y + ap, Bdir < 0);
                        }
                    }
                };
                const chevronRed = (x, y, ang, k = 1) => {
                    ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(k, k);
                    ctx.fillStyle = COL.falt;
                    ctx.beginPath(); ctx.moveTo(5, 0); ctx.lineTo(-4, -3.8); ctx.lineTo(-4, 3.8); ctx.closePath(); ctx.fill();
                    ctx.restore();
                };
                // Kompassros i skattkartestil: väderstrecken N, Ö, S, V, norr uppåt i bilden
                const roseGeom = () => {
                    const k = st.W < 520 ? 0.78 : 1;
                    // mobil: uppe till höger (verktygen ligger under scenen där), annars under fullskärmsknappen
                    if (st.W < 520) return { k, x: st.W - 14 - 34 * k, y: 12 + 44 * k, R: 30 * k };
                    return { k, x: 14 + 34 * k, y: 66 + 44 * k, R: 30 * k };
                };
                const drawRose = () => {
                    const { k, x, y, R } = roseGeom();
                    const ink = '#3d2c1a', mork = '#4a3523', ljus = '#e6d3a6';
                    ctx.save();
                    ctx.translate(x, y);
                    // pergamentskiva med dubbel ring
                    ctx.fillStyle = 'rgba(61,44,26,0.16)';
                    ctx.beginPath(); ctx.arc(1.5, 2.5, R + 3 * k, 0, 2 * Math.PI); ctx.fill();
                    const g = ctx.createRadialGradient(-R * 0.3, -R * 0.3, R * 0.1, 0, 0, R + 3 * k);
                    g.addColorStop(0, '#fbf1d6'); g.addColorStop(1, '#ead6a4');
                    ctx.fillStyle = g;
                    ctx.beginPath(); ctx.arc(0, 0, R + 3 * k, 0, 2 * Math.PI); ctx.fill();
                    ctx.strokeStyle = ink; ctx.lineWidth = 1.8 * k; ctx.stroke();
                    ctx.lineWidth = 0.9 * k;
                    ctx.beginPath(); ctx.arc(0, 0, R - 1 * k, 0, 2 * Math.PI); ctx.stroke();
                    // gradstreck mellan ringarna
                    for (let i = 0; i < 32; i++) {
                        const t = i * Math.PI / 16, l = i % 4 === 0 ? 3.2 * k : 1.6 * k;
                        ctx.beginPath();
                        ctx.moveTo(Math.cos(t) * (R - 1 * k), Math.sin(t) * (R - 1 * k));
                        ctx.lineTo(Math.cos(t) * (R - 1 * k - l), Math.sin(t) * (R - 1 * k - l));
                        ctx.stroke();
                    }
                    // en spets i två halvor (mörk och ljus), som på gamla sjökort
                    const spets = (ang, len, bred, c1, c2) => {
                        ctx.save(); ctx.rotate(ang);
                        ctx.fillStyle = c1;
                        ctx.beginPath(); ctx.moveTo(0, -len); ctx.lineTo(bred, 0); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
                        ctx.fillStyle = c2;
                        ctx.beginPath(); ctx.moveTo(0, -len); ctx.lineTo(-bred, 0); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
                        ctx.strokeStyle = ink; ctx.lineWidth = 0.8 * k; ctx.lineJoin = 'round';
                        ctx.beginPath(); ctx.moveTo(0, -len); ctx.lineTo(bred, 0); ctx.lineTo(0, 0); ctx.lineTo(-bred, 0); ctx.closePath(); ctx.stroke();
                        ctx.restore();
                    };
                    for (let i = 0; i < 4; i++) spets(Math.PI / 4 + i * Math.PI / 2, R * 0.58, 4.2 * k, mork, ljus);
                    for (let i = 1; i < 4; i++) spets(i * Math.PI / 2, R * 0.86, 6 * k, mork, ljus);
                    spets(0, R * 1.02, 6.5 * k, '#8e2219', '#d0473b');      // norr i rött
                    ctx.beginPath(); ctx.arc(0, 0, 2.6 * k, 0, 2 * Math.PI);
                    ctx.fillStyle = '#fbf1d6'; ctx.fill(); ctx.strokeStyle = ink; ctx.lineWidth = 1 * k; ctx.stroke();
                    // bokstäverna utanför skivan
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = ink;
                    ctx.font = `700 ${Math.round(17 * k)}px Georgia, 'Times New Roman', serif`;
                    ctx.fillText('N', 0, -R - 13 * k);
                    ctx.font = `700 ${Math.round(11 * k)}px Georgia, 'Times New Roman', serif`;
                    ctx.fillText('S', 0, R + 11 * k);
                    ctx.fillText('Ö', R + 10 * k, 0.5);
                    ctx.fillText('V', -R - 10 * k, 0.5);
                    ctx.restore();
                };
                const drawFlanges = (E) => {
                    const c = st.coil, L = st.Lp, ap = st.ap;
                    const fh = ap + 8;
                    [c.x - L / 2, c.x + L / 2 - E.fw].forEach((fx) => {
                        const g = ctx.createLinearGradient(fx, 0, fx + E.fw, 0);
                        g.addColorStop(0, '#2f3a49'); g.addColorStop(0.5, '#56657a'); g.addColorStop(1, '#2b3442');
                        ctx.fillStyle = g; rr(fx, c.y - fh, E.fw, fh * 2, 2); ctx.fill();
                    });
                };
                const drawBar = (Bdir) => {
                    const c = st.coil, L = st.Lp, ap = st.ap;
                    ctx.fillStyle = 'rgba(15,22,32,0.14)'; rr(c.x - L / 2 + 3, c.y - ap + 5, L, ap * 2, 4); ctx.fill();
                    const nRight = Bdir >= 0;
                    ctx.fillStyle = nRight ? COL.spol : COL.npol; ctx.fillRect(c.x - L / 2, c.y - ap, L / 2, ap * 2);
                    ctx.fillStyle = nRight ? COL.npol : COL.spol; ctx.fillRect(c.x, c.y - ap, L / 2, ap * 2);
                    const gl = ctx.createLinearGradient(0, c.y - ap, 0, c.y + ap);
                    gl.addColorStop(0, 'rgba(255,255,255,0.34)'); gl.addColorStop(0.45, 'rgba(255,255,255,0.05)');
                    gl.addColorStop(1, 'rgba(15,22,32,0.13)');
                    ctx.fillStyle = gl; ctx.fillRect(c.x - L / 2, c.y - ap, L, ap * 2);
                    ctx.strokeStyle = '#5d646e'; ctx.lineWidth = 1.4; ctx.strokeRect(c.x - L / 2, c.y - ap, L, ap * 2);
                    ctx.font = `600 ${Math.round(Math.min(22, ap * 0.8))}px Poppins, sans-serif`;
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    const sx = c.x + (nRight ? -L / 4 : L / 4), nx = c.x + (nRight ? L / 4 : -L / 4);
                    ctx.fillStyle = '#ffffff'; ctx.fillText('N', nx, c.y + 1);
                    ctx.lineWidth = 3.5; ctx.strokeStyle = '#0f1620'; ctx.lineJoin = 'round';
                    ctx.strokeText('S', sx, c.y + 1); ctx.fillStyle = '#ffffff'; ctx.fillText('S', sx, c.y + 1);
                };
                const drawLines = (alpha, width, Bdir) => {
                    ctx.save();
                    ctx.globalAlpha = alpha;
                    ctx.strokeStyle = COL.falt; ctx.lineWidth = width; ctx.lineJoin = 'round';
                    for (const pts of st.lines) strokePts(pts);
                    ctx.restore();
                };
                const drawArrows = (alpha, Bdir) => {
                    ctx.save(); ctx.globalAlpha = alpha;
                    for (const a of st.arrows) {
                        if (a.inside && pRef.current.kalla === 'stav') continue;   // inuti magneten syns inga linjer
                        chevronRed(a.x, a.y, a.ang + (Bdir < 0 ? Math.PI : 0), 1.9);
                    }
                    ctx.restore();
                };
                const badge = (x, y, isN, alpha) => {
                    ctx.save(); ctx.globalAlpha = alpha;
                    ctx.beginPath(); ctx.arc(x, y, 13, 0, 2 * Math.PI);
                    ctx.fillStyle = isN ? COL.npol : COL.spol; ctx.fill();
                    ctx.strokeStyle = isN ? '#8e2219' : '#5d646e'; ctx.lineWidth = 1.4; ctx.stroke();
                    ctx.font = '700 15px Poppins, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    if (isN) { ctx.fillStyle = '#ffffff'; ctx.fillText('N', x, y + 1); }
                    else {
                        ctx.lineWidth = 3; ctx.strokeStyle = '#0f1620'; ctx.lineJoin = 'round';
                        ctx.strokeText('S', x, y + 1); ctx.fillStyle = '#ffffff'; ctx.fillText('S', x, y + 1);
                    }
                    ctx.restore();
                };
                const drawClip = (g) => {
                    const s = st.sc * 1.05;
                    ctx.save(); ctx.translate(g.x, g.y); ctx.rotate(g.ang); ctx.scale(s, s);
                    const path = () => {
                        ctx.beginPath();
                        ctx.moveTo(-5, 1.4); ctx.lineTo(8, 1.4);
                        ctx.arc(8, -0.4, 1.8, Math.PI / 2, -Math.PI / 2, true);
                        ctx.lineTo(-10, -2.2);
                        ctx.arc(-10, 0.4, 2.6, -Math.PI / 2, Math.PI / 2, true);
                        ctx.lineTo(11.5, 3.0);
                        ctx.arc(11.5, -0.3, 3.3, Math.PI / 2, -Math.PI / 2, true);
                        ctx.lineTo(-1, -3.6);
                    };
                    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                    ctx.strokeStyle = 'rgba(15,22,32,0.18)'; ctx.lineWidth = 1.9;
                    ctx.save(); ctx.translate(0.8, 1.4); path(); ctx.stroke(); ctx.restore();
                    ctx.strokeStyle = '#6f7782'; ctx.lineWidth = 1.5; path(); ctx.stroke();
                    ctx.strokeStyle = 'rgba(235,240,245,0.75)'; ctx.lineWidth = 0.5; path(); ctx.stroke();
                    ctx.restore();
                };
                const drawProbe = (B) => {
                    drawCompass(st.probe.x, st.probe.y, st.probe.ang, 25, true);
                    // fältmätarens avläsning bredvid provkompassen
                    const txtV = '= ' + fmtB(B) + ' mT';
                    ctx.font = "600 13px 'JetBrains Mono', monospace";
                    const wV = ctx.measureText(txtV).width;
                    ctx.font = "italic 600 14px Poppins, sans-serif";
                    const wB = ctx.measureText('B').width;
                    const w = wB + 6 + wV + 18, h = 26;
                    let tx = st.probe.x + 32, ty = st.probe.y - h / 2;
                    if (tx + w > st.W - 6) tx = st.probe.x - 32 - w;
                    ty = Math.min(Math.max(ty, 6), st.H - h - 6);
                    ctx.fillStyle = 'rgba(253,250,243,0.96)'; rr(tx, ty, w, h, 6); ctx.fill();
                    ctx.strokeStyle = '#5d646e'; ctx.lineWidth = 1.2; ctx.stroke();
                    ctx.textBaseline = 'middle'; ctx.textAlign = 'left'; ctx.fillStyle = '#0f1620';
                    ctx.font = "italic 600 14px Poppins, sans-serif";
                    ctx.fillText('B', tx + 9, ty + h / 2 + 1);
                    ctx.font = "600 13px 'JetBrains Mono', monospace";
                    ctx.fillText(txtV, tx + 9 + wB + 6, ty + h / 2 + 1);
                };
                // ── Tumregeln: ett blått band som lindas runt spolen ──
                // Bandet ses snett, som en ring runt spolens axel. Halvan till
                // vänster går UNDER spolen (ritas före spolen, ljusare och delvis
                // skymd av lindningen), halvan till höger går OVANPÅ (ritas efter,
                // med skugga på spolen). Över spolens ovansida går strömmen nedåt i
                // bilden när fältet pekar åt höger, precis som pilarna på tråden.
                const tumGeom = () => {
                    const c = st.coil, ap = st.ap;
                    return { cx: c.x, cy: c.y, rx: Math.max(16, ap * 0.55), ry: ap + 17 };
                };
                const bandArc = (G, t0, t1) => {
                    ctx.beginPath();
                    const N = 40;
                    for (let i = 0; i <= N; i++) {
                        const t = t0 + (t1 - t0) * i / N;
                        const x = G.cx + G.rx * Math.cos(t), y = G.cy + G.ry * Math.sin(t);
                        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                    }
                };
                const bandHead = (G, t, dir, fill, kant) => {
                    // pilspets i bandets riktning (dir = +1: ökande vinkel)
                    const x = G.cx + G.rx * Math.cos(t), y = G.cy + G.ry * Math.sin(t);
                    const tx = -G.rx * Math.sin(t) * dir, ty = G.ry * Math.cos(t) * dir;
                    const a = Math.atan2(ty, tx);
                    ctx.save(); ctx.translate(x, y); ctx.rotate(a);
                    ctx.beginPath(); ctx.moveTo(13, 0); ctx.lineTo(-7, -10); ctx.lineTo(-7, 10); ctx.closePath();
                    ctx.fillStyle = fill; ctx.fill();
                    ctx.strokeStyle = kant; ctx.lineWidth = 1.4; ctx.lineJoin = 'round'; ctx.stroke();
                    ctx.restore();
                };
                const band = (G, t0, t1, ljus) => {
                    ctx.lineCap = 'butt'; ctx.lineJoin = 'round';
                    bandArc(G, t0, t1); ctx.strokeStyle = ljus ? '#6d8fc4' : '#123f80'; ctx.lineWidth = 9; ctx.stroke();
                    bandArc(G, t0, t1); ctx.strokeStyle = ljus ? '#a9c1e6' : '#2f6fcc'; ctx.lineWidth = 6; ctx.stroke();
                    bandArc(G, t0, t1); ctx.strokeStyle = ljus ? 'rgba(235,242,252,0.7)' : 'rgba(170,205,245,0.9)'; ctx.lineWidth = 1.6; ctx.stroke();
                };
                const drawThumbBack = (Bdir) => {
                    if (Bdir === 0) return;
                    const G = tumGeom();
                    ctx.save();
                    band(G, Math.PI / 2 - 0.02, 3 * Math.PI / 2 + 0.02, true);
                    // pilspets på den del som syns under spolens nedre kant
                    const t = Bdir > 0 ? Math.PI / 2 + 0.42 : 3 * Math.PI / 2 - 0.42;
                    bandHead(G, t, Bdir > 0 ? 1 : -1, '#a9c1e6', '#6d8fc4');
                    ctx.restore();
                };
                const drawThumbFront = (Bdir, E) => {
                    if (Bdir === 0) return;
                    const G = tumGeom(), c = st.coil;
                    ctx.save();
                    // skugga på spolen under bandet
                    ctx.save(); ctx.translate(3, 4);
                    bandArc(G, -Math.PI / 2, Math.PI / 2);
                    ctx.strokeStyle = 'rgba(15,22,32,0.22)'; ctx.lineWidth = 9; ctx.stroke();
                    ctx.restore();
                    band(G, -Math.PI / 2 - 0.02, Math.PI / 2 + 0.02, false);
                    bandHead(G, 0.12 * Bdir, Bdir > 0 ? 1 : -1, '#2f6fcc', '#123f80');

                    // tummen: en tjock pil ut ur nordändan längs axeln
                    const xN = Bdir > 0 ? E.outR + 10 : E.outL - 10;
                    const len = Math.min(92, st.Lp * 0.42);
                    const x2 = xN + Bdir * len, hb = x2 - Bdir * 18;
                    const g = ctx.createLinearGradient(0, c.y - 6, 0, c.y + 6);
                    g.addColorStop(0, '#e0665b'); g.addColorStop(0.5, '#c0392b'); g.addColorStop(1, '#8e2219');
                    ctx.beginPath();
                    ctx.moveTo(xN, c.y - 5); ctx.lineTo(hb, c.y - 5); ctx.lineTo(hb, c.y - 12); ctx.lineTo(x2, c.y);
                    ctx.lineTo(hb, c.y + 12); ctx.lineTo(hb, c.y + 5); ctx.lineTo(xN, c.y + 5); ctx.closePath();
                    ctx.fillStyle = g; ctx.fill();
                    ctx.strokeStyle = '#6e1a12'; ctx.lineWidth = 1.3; ctx.lineJoin = 'round'; ctx.stroke();

                    // etiketter i fri yta
                    ctx.font = '600 13px Poppins, sans-serif';
                    ctx.fillStyle = '#123f80'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
                    ctx.fillText('Fingrarna följer strömmen', G.cx, G.cy - G.ry - 8);
                    ctx.fillStyle = '#8e2219'; ctx.textAlign = Bdir > 0 ? 'left' : 'right'; ctx.textBaseline = 'top';
                    ctx.fillText('Tummen pekar mot', xN, c.y + 17);
                    ctx.fillText('nordändan', xN, c.y + 33);
                    ctx.restore();
                };

                // ── Animationsloop ──
                let raf, last = performance.now();
                const loop = (now) => {
                    raf = requestAnimationFrame(loop);
                    const dt = Math.min((now - last) / 1000, 0.05);
                    last = now;
                    const p = pRef.current;
                    st.t += dt;
                    if (st.linesDirty) rebuildLines();

                    // strömmens tidsfaktor (−1…1) och fältets riktning
                    const stav = p.kalla === 'stav';
                    let f = p.on ? (p.ac ? Math.sin(2 * Math.PI * AC_F * st.t) : 1) : 0;
                    let Ieff = p.I;
                    if (stav) { f = 1; if (Ieff < 0.05) Ieff = 1.5; }
                    const sgn = p.pol * p.wind;
                    const coreF = p.core === 'jarn' ? KARNA : 1;
                    const scale = MU0 * p.n * Ieff / L_M * coreF * f * sgn;   // T per tabellenhet
                    const Bdir = Math.abs(scale) < 1e-9 ? 0 : (scale > 0 ? 1 : -1);
                    const Bc = Math.abs(scale) * 0.95;
                    const iNow = Ieff * f;
                    const E = coilEnds();

                    // nålarna: spolens fält + jordens fält (norr = uppåt i bilden)
                    const settle = (nd) => {
                        const [bx, by] = coilB(nd.x, nd.y, scale);
                        const target = Math.atan2(by - B_JORD, bx);
                        let d = target - nd.ang;
                        while (d > Math.PI) d -= 2 * Math.PI;
                        while (d < -Math.PI) d += 2 * Math.PI;
                        nd.w += (d * 130 - nd.w * 11) * dt;
                        nd.ang += nd.w * dt;
                    };
                    st.needles.forEach(settle);
                    settle(st.probe);

                    // gemen: järn dras mot den närmaste änden när fältet räcker
                    const gemOn = p.show.gem && !p.gissar && !stav;
                    if (gemOn) {
                        // Gemen reagerar på fältets storlek. Vid växelström hinner de inte släppa
                        // varje gång strömmen passerar noll, så där räknas effektivvärdet.
                        const scaleGem = p.on ? MU0 * p.n * p.I / L_M * coreF * sgn * (p.ac ? Math.SQRT1_2 : 1) : 0;
                        const slots = [[0, -0.55], [0, 0.0], [0, 0.55], [1, -0.28], [1, 0.28]];
                        st.clips.forEach((g, k) => {
                            if (g.held) return;
                            const side = g.stuck || (g.x < st.coil.x ? -1 : 1);
                            const half = 12 * st.sc;
                            const sl = slots[k % slots.length];
                            const sx = (side > 0 ? E.outR + half * (1 + 1.75 * sl[0]) : E.outL - half * (1 + 1.75 * sl[0]));
                            const sy = st.coil.y + sl[1] * st.ap * (p.core === 'jarn' ? 1.0 : 1.4);
                            if (g.stuck) {
                                const [hx, hy] = coilB(sx, sy, scaleGem);
                                if (Math.hypot(hx, hy) < B_HALL) {
                                    // fältet räcker inte längre: gemet släpper och glider en bit ut på bänken
                                    g.stuck = null;
                                    g.vx = side * (70 + 50 * Math.random());
                                    g.vy = (Math.random() - 0.5) * 70 + Math.sign(sl[1] || (Math.random() - 0.5)) * 35;
                                    g.spin = (Math.random() - 0.5) * 7;
                                    return;
                                }
                                g.x += (sx - g.x) * Math.min(1, dt * 12); g.y += (sy - g.y) * Math.min(1, dt * 12);
                                g.ang += ((0) - (((g.ang + Math.PI / 2) % Math.PI + Math.PI) % Math.PI - Math.PI / 2)) * Math.min(1, dt * 8);
                                return;
                            }
                            const [bx, by] = coilB(g.x, g.y, scaleGem);
                            const B = Math.hypot(bx, by);
                            if (g.spin) { g.ang += g.spin * dt; g.spin *= Math.max(0, 1 - 4 * dt); }
                            if (B > B_GEM) {
                                const dx = sx - g.x, dy = sy - g.y, dd = Math.hypot(dx, dy) || 1;
                                const acc = 1800 * Math.min(6, B / B_GEM);
                                g.vx += acc * dx / dd * dt; g.vy += acc * dy / dd * dt;
                                // gemet vrider sig längs fältet
                                const fa = Math.atan2(by, bx);
                                let da = fa - g.ang;
                                da = ((da + Math.PI / 2) % Math.PI + Math.PI) % Math.PI - Math.PI / 2;
                                g.ang += da * Math.min(1, dt * 6);
                                if (dd < 4) { g.stuck = side; g.vx = 0; g.vy = 0; }
                            }
                            g.vx *= Math.max(0, 1 - 7 * dt); g.vy *= Math.max(0, 1 - 7 * dt);
                            g.x += g.vx * dt; g.y += g.vy * dt;
                        });
                    }

                    st.phase += dt * 38 * Math.min(1.6, Math.abs(iNow) / 1.5 + 0.25) * (f >= 0 ? 1 : -1);

                    // ── rita ──
                    ctx.setTransform(st.dpr, 0, 0, st.dpr, 0, 0);
                    drawPaper();

                    const S = supply();
                    const hidden = (x, y) => {
                        if (x > E.outL - 18 && x < E.outR + 18 && Math.abs(y - st.coil.y) < st.ap + 20) return true;
                        if (!stav && x > S.x - 12 && x < S.x + S.w + 12 && y > S.y - 26 && y < S.y + S.h + 12) return true;
                        if (p.show.prov && Math.hypot(x - st.probe.x, y - st.probe.y) < 40) return true;
                        { const r = roseGeom(); if (Math.hypot(x - r.x, y - r.y) < r.R + 28) return true; }
                        if (gemOn && st.clips.some((g) => Math.hypot(x - g.x, y - g.y) < 20)) return true;
                        return false;
                    };
                    if (p.show.kompass) {
                        for (const nd of st.needles) if (!hidden(nd.x, nd.y)) drawCompass(nd.x, nd.y, nd.ang, 10, false);
                    }

                    const showField = Bdir !== 0 && (!p.gissar || p.fas === 'svar');
                    const s01 = Math.min(1, Math.max(0, (Math.log10(Math.max(Bc, 1e-6)) - Math.log10(1.5e-4)) / (Math.log10(0.4) - Math.log10(1.5e-4))));
                    const alpha = 0.22 + 0.78 * s01;
                    const lw = 1.3 + 1.1 * s01;

                    if (!stav) {
                        // sladdar från nätaggregatet till spolens ändar
                        const Ld = leads();
                        const toPlus = p.pol > 0 ? Ld.L : Ld.R, toMinus = p.pol > 0 ? Ld.R : Ld.L;
                        const wRed = wirePath(S.plus, toPlus), wBlack = wirePath(S.minus, toMinus);
                        drawSupply(p, p.I, iNow);
                        ctx.lineCap = 'round';
                        [[wBlack, '#22262c'], [wRed, '#b8322a']].forEach(([pts, col]) => {
                            ctx.strokeStyle = 'rgba(15,22,32,0.15)'; ctx.lineWidth = 6;
                            ctx.save(); ctx.translate(1.5, 3); strokePts(pts); ctx.restore();
                            ctx.strokeStyle = col; ctx.lineWidth = 4.2; strokePts(pts);
                        });
                        // banankontakterna
                        [[S.plus, '#b8322a'], [S.minus, '#22262c']].forEach(([T, col]) => {
                            ctx.beginPath(); ctx.arc(T.x, T.y, 6 * S.s, 0, 2 * Math.PI);
                            ctx.fillStyle = col; ctx.fill();
                            ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1; ctx.stroke();
                        });
                        if (p.show.tumregel && showField) drawThumbBack(Bdir);
                        drawCoilBody(p, E);
                        if (showField && p.show.linjer) drawLines(alpha, lw, Bdir);
                        const flowOn = Bdir !== 0 && p.show.strom && (!p.gissar || p.fas === 'svar');
                        drawStrips(p, E, (!p.gissar || p.fas === 'svar') ? Bdir : 0, flowOn);
                        drawFlanges(E);
                        // ledningarnas ändar in i spolen
                        ctx.strokeStyle = '#b8692f'; ctx.lineWidth = 2.4;
                        [Ld.L, Ld.R].forEach((P) => { ctx.beginPath(); ctx.moveTo(P.x, P.y); ctx.lineTo(P.x, P.y - 5); ctx.stroke(); });
                        if (flowOn) {
                            // konventionell strömriktning: ut ur pluspolen, in i minuspolen
                            flowAlong(wRed, st.phase, 1, 1);
                            flowAlong(wBlack, st.phase, -1, 1);
                        }
                    } else {
                        if (showField && p.show.linjer) drawLines(alpha, lw, Bdir);
                        drawBar(Bdir);
                    }
                    if (showField && p.show.linjer) drawArrows(alpha, Bdir);

                    // polerna
                    if (!stav && p.show.poler && showField) {
                        const a = Math.min(1, Math.abs(f) * 2.5);
                        const yb = st.coil.y - st.ap - 22;
                        badge(E.outR + 6, yb, Bdir > 0, a);
                        badge(E.outL - 6, yb, Bdir < 0, a);
                    }
                    // gissa-läget: markera änden man pekar på
                    if (p.gissar && p.fas === 'fraga' && st.hover) {
                        ctx.save();
                        ctx.strokeStyle = 'rgba(200,50,74,0.85)'; ctx.lineWidth = 2.5; ctx.setLineDash([6, 4]);
                        const xL = st.hover === 'v' ? E.outL - 10 : st.coil.x + 4, xR = st.hover === 'v' ? st.coil.x - 4 : E.outR + 10;
                        rr(xL, st.coil.y - st.ap - 14, xR - xL, st.ap * 2 + 28, 8); ctx.stroke();
                        ctx.restore();
                    }
                    if (p.show.tumregel && showField && !stav) drawThumbFront(Bdir, E);

                    drawRose();
                    if (gemOn) st.clips.forEach(drawClip);

                    let Bp = 0;
                    {
                        const [bx, by] = coilB(st.probe.x, st.probe.y, scale);
                        Bp = Math.hypot(bx, by - B_JORD);
                    }
                    if (p.show.prov) drawProbe(Bp);

                    if (now - st.lastInfo > 160) {
                        st.lastInfo = now;
                        st.onInfo && st.onInfo(Bp);
                    }
                };
                raf = requestAnimationFrame(loop);

                return () => {
                    cancelAnimationFrame(raf);
                    ro.disconnect();
                    canvas.removeEventListener('pointerdown', onDown);
                    canvas.removeEventListener('pointermove', onMove);
                    canvas.removeEventListener('pointerup', onUp);
                    canvas.removeEventListener('pointercancel', onUp);
                    canvas.removeEventListener('pointerleave', onLeave);
                };
            }, []);

            useEffect(() => {
                const st = stRef.current;
                if (st) st.onInfo = (b) => setProbeB((old) => (Math.abs(old - b) < 1e-7 ? old : b));
            }, []);
            // kärnan ändrar spolens ytterkanter → gemens platser
            useEffect(() => { const st = stRef.current; if (st) st.linesDirty = true; }, [core, kalla]);
            useEffect(() => { const st = stRef.current; if (st && st.resetClips && gemNyckel) st.resetClips(); }, [gemNyckel]);

            // ── Fullskärm ──
            useEffect(() => {
                const handler = () => {
                    const fs = document.fullscreenElement === sceneWrapRef.current ||
                        document.webkitFullscreenElement === sceneWrapRef.current;
                    setIsFullscreen(fs);
                };
                document.addEventListener('fullscreenchange', handler);
                document.addEventListener('webkitfullscreenchange', handler);
                return () => {
                    document.removeEventListener('fullscreenchange', handler);
                    document.removeEventListener('webkitfullscreenchange', handler);
                };
            }, []);
            const toggleFullscreen = () => {
                const el = sceneWrapRef.current;
                if (!el) return;
                if (document.fullscreenElement || document.webkitFullscreenElement)
                    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
            };

            const tShow = (k) => setShow((s) => ({ ...s, [k]: !s[k] }));
            const valjForsok = (fo) => {
                setForsok(fo.id);
                const s = fo.set;
                setOn(s.on); setAc(s.ac); setI(s.I); setN(s.n); setCore(s.core); setKalla(s.kalla);
                if (s.gem) { setShow((sh) => ({ ...sh, gem: true })); setGemNyckel((k) => k + 1); }
            };
            const nyGissning = () => {
                setGissa({ fas: 'fraga', pol: Math.random() < 0.5 ? 1 : -1, wind: Math.random() < 0.5 ? 1 : -1, svar: null });
            };
            const valjLage = (l) => {
                setLage(l);
                if (l === 'gissa') nyGissning();
            };
            const ratt = gissa.pol * gissa.wind > 0 ? 'h' : 'v';
            const svara = (sida) => {
                if (gissa.fas !== 'fraga') return;
                const ok = sida === ratt;
                setGissa((g) => ({ ...g, fas: 'svar', svar: sida }));
                setPoang((p) => ({ ratt: p.ratt + (ok ? 1 : 0), totalt: p.totalt + 1, svit: ok ? p.svit + 1 : 0 }));
            };
            svaraRef.current = svara;

            const forsokObj = FORSOK.find((f) => f.id === forsok);
            const stav = kalla === 'stav';

            const regI = (
                <div className="reg">
                    <div className="reg-top"><span>Ström <em>I</em>{ac ? ' (toppvärde)' : ''}</span><b>{fmt(I, 1)} A</b></div>
                    <input type="range" min="0" max="3" step="0.1" value={I} disabled={gissar}
                           onChange={(e) => { setI(parseFloat(e.target.value)); setForsok(null); }} aria-label="Ström" />
                </div>
            );
            const regN = (
                <div className="reg">
                    <div className="reg-top"><span>Varvtal <em>n</em></span><b>{fmt(n, 0)} varv</b></div>
                    <input type="range" min="100" max="1000" step="50" value={n} disabled={gissar}
                           onChange={(e) => { setN(parseFloat(e.target.value)); setForsok(null); }} aria-label="Varvtal" />
                </div>
            );
            const paKnapp = (
                <button className={'btn-toggle btn-pa' + (on && !stav ? ' on' : '')} disabled={gissar || stav} onClick={() => setOn((v) => !v)}>
                    <span className="led"></span>{on ? 'Slå av strömmen' : 'Slå på strömmen'}
                </button>
            );

            const visaRad = (k, text, farg, av) => (
                <label className={av ? 'av' : ''}>
                    <input type="checkbox" checked={show[k] && !av} disabled={av} onChange={() => tShow(k)} />
                    {farg && <span className="st-swatch" style={{ background: farg }}></span>}
                    <span>{text}</span>
                </label>
            );

            const sceneToggles = () => {
                if (!togglesOpen) return (
                    <button className="st-show-btn" onClick={() => setTogglesOpen(true)}
                            aria-label="Visa inställningar" title="Visa inställningar" aria-expanded="false">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             strokeWidth="2" strokeLinecap="round" aria-hidden="true">
                            <line x1="4" y1="8" x2="20" y2="8" /><circle cx="14.5" cy="8" r="2.7" fill="currentColor" stroke="none" />
                            <line x1="4" y1="16" x2="20" y2="16" /><circle cx="9.5" cy="16" r="2.7" fill="currentColor" stroke="none" />
                        </svg>
                    </button>
                );
                return (
                    <div className="scene-toggles">
                        <button className="st-hide" onClick={() => setTogglesOpen(false)}
                                aria-label="Dölj inställningar" title="Dölj inställningar" aria-expanded="true">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 strokeWidth="2.4" strokeLinecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
                        </button>
                        <div className="st-title">Visa</div>
                        {visaRad('linjer', 'Fältlinjer', COL.falt, gissar && gissa.fas === 'fraga')}
                        {visaRad('kompass', 'Kompassnålar', COL.nal, false)}
                        {visaRad('prov', 'Provkompass', '#a08a5c', false)}
                        {visaRad('strom', 'Strömmens riktning', COL.strom, stav || (gissar && gissa.fas === 'fraga'))}
                        {visaRad('poler', 'Polerna (N och S)', COL.npol, stav || (gissar && gissa.fas === 'fraga'))}
                        {visaRad('snitt', 'Genomskärning av spolen', COL.koppar, stav)}
                        {visaRad('tumregel', 'Tumregeln', COL.strom, stav || (gissar && gissa.fas === 'fraga'))}
                        {visaRad('gem', 'Gem på bänken', '#6f7782', stav || gissar)}
                        {isFullscreen && !gissar && (
                            <React.Fragment>
                                <div className="st-title mt">Reglage</div>
                                <div className="st-sliders">
                                    <div className="st-slider">
                                        <div className="st-slider-top"><span>Ström <em>I</em></span><b>{fmt(I, 1)} A</b></div>
                                        <input type="range" min="0" max="3" step="0.1" value={I} onChange={(e) => { setI(parseFloat(e.target.value)); setForsok(null); }} />
                                    </div>
                                    <div className="st-slider">
                                        <div className="st-slider-top"><span>Varvtal <em>n</em></span><b>{fmt(n, 0)} varv</b></div>
                                        <input type="range" min="100" max="1000" step="50" value={n} onChange={(e) => { setN(parseFloat(e.target.value)); setForsok(null); }} />
                                    </div>
                                </div>
                                <div className="st-title mt">Spolen</div>
                                <label className={stav ? 'av' : ''}><input type="checkbox" checked={core === 'jarn'} disabled={stav} onChange={() => setCore((c) => c === 'jarn' ? 'luft' : 'jarn')} /><span>Järnkärna</span></label>
                                <label className={stav ? 'av' : ''}><input type="checkbox" checked={ac} disabled={stav} onChange={() => setAc((v) => !v)} /><span>Växelström</span></label>
                                <label><input type="checkbox" checked={stav} onChange={() => setKalla((k) => k === 'stav' ? 'spole' : 'stav')} /><span>Byt till stavmagnet</span></label>
                                <div className="st-actions">
                                    {paKnapp}
                                    <button className="btn-toggle" disabled={stav} onClick={() => setPol((v) => -v)}>Vänd strömmen</button>
                                </div>
                            </React.Fragment>
                        )}
                    </div>
                );
            };

            const forklaring = () => {
                const nRight = ratt === 'h';
                const inV = gissa.pol > 0;
                return (
                    <React.Fragment>
                        Strömmen går ut ur pluspolen och kommer in i spolens {inV ? 'vänstra' : 'högra'} ände. Följ tråden runt
                        spolen: över ovansidan går strömmen {nRight ? 'nedåt' : 'uppåt'} i bilden. Böj högerhandens fingrar i
                        strömmens riktning runt spolen, så pekar tummen åt {nRight ? 'höger' : 'vänster'}. Där kommer
                        fältlinjerna ut, och där är nordändan.
                    </React.Fragment>
                );
            };

            return (
                <div className="min-h-screen px-4 md:px-8 pb-12" style={{ fontFamily: "'DM Sans', sans-serif" }}>
                    <div className="max-w-6xl mx-auto pt-6">
                        <div className="breadcrumb mb-4" style={{ fontSize: 13 }}>
                            <a href="index.html">Hem</a> / <a href="katalog.html?id=fy2">Fysik nivå 2</a> / Elektromagneten
                        </div>
                        <h1 className="text-3xl md:text-4xl font-black tracking-tight" style={{ color: 'var(--lab-ink)' }}>Elektromagneten</h1>
                        <p className="mt-2 mb-5" style={{ color: 'var(--lab-ink-soft)', maxWidth: 840 }}>
                            En spole med 600 varv koppartråd ligger på bänken, kopplad till ett nätaggregat. Slå på strömmen så
                            blir spolen en <strong>elektromagnet</strong>: kompassnålarna runt den svänger in sig i ett fält som ser ut
                            precis som en stavmagnets. Flytta provkompassen för att mäta flödestätheten <em>B</em>, dra i spolen, stoppa
                            in en järnkärna och se gemen dras till, och vänd strömmen så byter nordändan och sydändan plats.
                        </p>

                        <FormulaCard n={gissar ? 600 : n} I={gissar ? 1.5 : I} core={gissar ? 'luft' : core} ac={!gissar && ac} />

                        <main className="flex flex-col lg:flex-row gap-6">
                            <div className="lg:w-2/3 order-1">
                                <div className="scene-wrap" data-theme="ljusPapper" ref={sceneWrapRef}>
                                    <canvas ref={canvasRef} />
                                    {sceneToggles()}
                                    <button className="fs-btn" onClick={toggleFullscreen} aria-label="Fullskärm"
                                            title={isFullscreen ? 'Lämna fullskärm' : 'Fullskärm'}>
                                        {isFullscreen ? (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M9 3v6H3" /><path d="M15 21v-6h6" /><path d="M21 9h-6V3" /><path d="M3 15h6v6" />
                                            </svg>
                                        ) : (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M3 9V3h6" /><path d="M21 9V3h-6" /><path d="M3 15v6h6" /><path d="M21 15v6h-6" />
                                            </svg>
                                        )}
                                    </button>
                                </div>
                                <p className="anm mt-2">
                                    {gissar
                                        ? 'Klicka på den ände av spolen som du tror blir nordända, eller svara i rutan bredvid.'
                                        : 'Dra i spolen, i provkompassen och i gemen. Klicka på strömbrytaren på nätaggregatet för att slå av och på.'}
                                </p>
                            </div>

                            <div className="lg:w-1/3 order-2 flex flex-col gap-3">
                                <div className="glass-card rounded-xl p-3">
                                    <div className="flbl mb-2">Läge</div>
                                    <div className="seg" style={{ gridTemplateColumns: '1fr 1fr' }}>
                                        <button className={!gissar ? 'active' : ''} onClick={() => valjLage('fri')}>Utforska</button>
                                        <button className={gissar ? 'active' : ''} onClick={() => valjLage('gissa')}>Var är nordändan?</button>
                                    </div>
                                    {gissar && (
                                        <div className="mt-3 flex flex-col gap-3">
                                            <div className="poang">
                                                <span><b>{poang.ratt}</b> av {poang.totalt} rätt</span>
                                                <span>Svit: <b>{poang.svit}</b></span>
                                            </div>
                                            <p className="fraga">
                                                Följ tråden från pluspolen genom spolen. Vilken ände blir nordända när strömmen slås på?
                                            </p>
                                            {gissa.fas === 'fraga' ? (
                                                <div className="seg" style={{ gridTemplateColumns: '1fr 1fr' }}>
                                                    <button onClick={() => svara('v')}>Vänstra änden</button>
                                                    <button onClick={() => svara('h')}>Högra änden</button>
                                                </div>
                                            ) : (
                                                <React.Fragment>
                                                    <div className={gissa.svar === ratt ? 'svar-ok' : 'svar-fel'}>
                                                        <p className="fraga mb-1">{gissa.svar === ratt ? 'Rätt.' : 'Inte riktigt.'} Nordändan är den {ratt === 'h' ? 'högra' : 'vänstra'} änden.</p>
                                                        <p className="anm">{forklaring()}</p>
                                                    </div>
                                                    <button className="btn-toggle btn-prim" onClick={nyGissning}>Ny spole</button>
                                                </React.Fragment>
                                            )}
                                            <p className="anm">
                                                Tips: lindningen kan gå åt två håll. Titta på hur trådarna lutar på spolens ovansida
                                                och på vilken ände den röda sladden från pluspolen går till.
                                            </p>
                                        </div>
                                    )}
                                </div>

                                {!gissar && (
                                    <React.Fragment>
                                        <div className="glass-card rounded-xl p-3 flex flex-col gap-3">
                                            <div className="flbl">Strömkälla</div>
                                            {paKnapp}
                                            <div className="seg" style={{ gridTemplateColumns: '1fr 1fr' }}>
                                                <button className={!ac ? 'active' : ''} disabled={stav} onClick={() => { setAc(false); setForsok(null); }}>Likström</button>
                                                <button className={ac ? 'active' : ''} disabled={stav} onClick={() => { setAc(true); setForsok(null); }}>Växelström</button>
                                            </div>
                                            {regI}
                                            <button className="btn-toggle" disabled={stav} onClick={() => setPol((v) => -v)}>Vänd strömmen</button>
                                        </div>

                                        <div className="glass-card rounded-xl p-3 flex flex-col gap-3">
                                            <div className="flbl">Spolen</div>
                                            {regN}
                                            <div>
                                                <div className="anm mb-1">Kärna</div>
                                                <div className="seg" style={{ gridTemplateColumns: '1fr 1fr' }}>
                                                    <button className={core === 'luft' ? 'active' : ''} disabled={stav} onClick={() => { setCore('luft'); setForsok(null); }}>Ingen (luft)</button>
                                                    <button className={core === 'jarn' ? 'active' : ''} disabled={stav} onClick={() => { setCore('jarn'); setForsok(null); }}>Järnkärna</button>
                                                </div>
                                            </div>
                                            <div>
                                                <div className="anm mb-1">Jämför</div>
                                                <div className="seg" style={{ gridTemplateColumns: '1fr 1fr' }}>
                                                    <button className={!stav ? 'active' : ''} onClick={() => setKalla('spole')}>Elektromagnet</button>
                                                    <button className={stav ? 'active' : ''} onClick={() => setKalla('stav')}>Stavmagnet</button>
                                                </div>
                                            </div>
                                            <button className="btn-toggle" disabled={stav} onClick={() => setWind((v) => -v)}>Linda spolen åt andra hållet</button>
                                            <div className="anm">
                                                Vid provkompassen: <strong><em>B</em> = {fmtB(probeB)} mT</strong>
                                                {probeB < 3e-5 ? ' (nästan bara jordens magnetfält)' : ''}
                                            </div>
                                        </div>

                                        <div className="glass-card rounded-xl p-3">
                                            <div className="flbl mb-2">Färdiga försök</div>
                                            <div className="forsok">
                                                {FORSOK.map((fo) => (
                                                    <button key={fo.id} className={forsok === fo.id ? 'active' : ''} onClick={() => valjForsok(fo)}>{fo.namn}</button>
                                                ))}
                                            </div>
                                            {forsokObj && <p className="anm mt-2" dangerouslySetInnerHTML={{ __html: forsokObj.text }} />}
                                            <button className="btn-toggle mt-3 w-full" onClick={() => setGemNyckel((k) => k + 1)}>Lägg tillbaka gemen</button>
                                        </div>
                                    </React.Fragment>
                                )}
                            </div>
                        </main>

                        <div className="grid md:grid-cols-3 gap-4 mt-6">
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Varför blir spolen en magnet?</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Runt varje strömförande ledare finns ett magnetfält som går i cirklar. Slå på
                                    genomskärningen: inne i spolen pekar fälten från alla varv åt samma håll och förstärker
                                    varandra, medan de utanför till stor del tar ut varandra. Därför blir fältet starkt och
                                    nästan homogent inuti, och utanför ser det ut som en stavmagnets.
                                </p>
                            </div>
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Tumregeln för spolen</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Låt högerhandens fingrar följa strömmen runt spolen. Tummen pekar då i fältets riktning
                                    inuti spolen, alltså mot nordändan. Det är tvärtom mot regeln för en rak ledare, där tummen
                                    pekar i strömmens riktning och fingrarna visar fältet.
                                </p>
                            </div>
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Starkare med järn</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Järn har mycket högre permeabilitet än luft. Fältet från spolen ställer in järnets små
                                    magnetiska områden åt samma håll, och de bidrar med ett eget fält. Därför har nästan alla
                                    elektromagneter en järnkärna: i lyftmagneter, reläer, dörrklockor och högtalare.
                                </p>
                            </div>
                        </div>

                        <details className="glass-card rounded-xl p-4 mt-4">
                            <summary className="accordion-head" style={{ color: 'var(--lab-ink)' }}>
                                <span>Bra att veta om simuleringen</span><span style={{ color: 'var(--lab-ink-muted)' }}>+</span>
                            </summary>
                            <ul className="mt-3 space-y-2 text-sm" style={{ color: 'var(--lab-ink-soft)', paddingLeft: 18, listStyle: 'disc' }}>
                                <li>Spolen är 10 cm lång och 3,2 cm i diameter. Fältet räknas fram ur alla varvens bidrag,
                                    så mitt i spolen blir <em>B</em> nästan lika stort som formeln för en lång rak spole ger.
                                    Formeln gäller bara inuti spolen; utanför blir fältet snabbt svagare.</li>
                                <li>Kompassnålarna känner också av jordens magnetfält, cirka 0,016 mT mot norr. När strömmen är
                                    avslagen pekar alla nålar därför mot norr, och långt från en svag spole tar jordfältet över.</li>
                                <li>En stavmagnet och en spole med samma form har precis samma fält utanför. Inuti magneten går
                                    fältlinjerna från sydändan till nordändan, precis som inuti spolen.</li>
                                <li>Ett gem börjar glida mot spolen när flödestätheten där det ligger är minst 2,5 mT, och det
                                    släpper först när fältet vid spolens ände sjunker under 1 mT: ett gem som redan sitter fast
                                    hålls kvar av ett svagare fält än det som krävs för att dra det till sig. Gränserna är valda
                                    för att effekten ska synas och beror i verkligheten på gemets massa och friktionen mot bänken.
                                    Järnkärnan är av mjukt järn, som nästan inte behåller någon magnetism, så gemen släpper även
                                    med kärnan i när strömmen slås av.</li>
                                <li>Järnkärnans förstärkning är satt till tio gånger. Det är rimligt för en kort, rak järnstav;
                                    en sluten järnkärna, som i en transformator, kan förstärka tusentals gånger.</li>
                                <li>Växelströmmen går i slow motion, 0,35 perioder per sekund. Elnätets ström har frekvensen 50 Hz
                                    och byter alltså riktning 100 gånger per sekund.</li>
                            </ul>
                        </details>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script src="feedback.js" defer></script>
    <script src="sim-dock.js" defer></script>
    <script src="data/katalog.js"></script>
    <script src="section-nav.js"></script>

</body>
