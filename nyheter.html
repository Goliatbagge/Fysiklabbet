<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyheter — Fysiklabbet</title>
    <meta name="description" content="Dagliga fysiknyheter, populärvetenskapligt skrivna på svenska — från forskningsfronten till klassrummet.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="favicon.svg">
    <link rel="alternate" type="application/rss+xml" title="Fysiklabbet — fysiknyheter" href="https://fysiklabbet.se/feed.xml">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Fysiklabbet">
    <meta property="og:title" content="Nyheter — Fysiklabbet">
    <meta property="og:description" content="Dagliga fysiknyheter, populärvetenskapligt skrivna på svenska — från forskningsfronten till klassrummet.">
    <meta property="og:url" content="https://fysiklabbet.se/nyheter.html">
    <meta property="og:image" content="https://fysiklabbet.se/og-fysiklabbet.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://fysiklabbet.se/og-fysiklabbet.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300..700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- OpenDyslexic — dyslexivänligt typsnitt (toggle i artikelvyn) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/opendyslexic@5/400.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/opendyslexic@5/700.css">
    <!-- KaTeX — formler i artikeltexten skrivs som $…$ i data/nyheter.js och
         sätts med samma matematiksättning som teoriavsnitten (raka
         divisionsstreck, rotmärken som täcker hela uttrycket). -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script>window.__CB = String(Date.now());</script>
    <script>document.write('<link rel="stylesheet" href="styles-laborans.css?v=' + window.__CB + '">');</script>
    <style>
        /* ── Sidan Nyheter ─────────────────────────────────────────── */
        .news-hero { max-width: 1100px; margin: 0 auto; padding: 56px 56px 4px; width: 100%; }
        .news-hero-title {
            font-family: var(--lab-font-display);
            font-size: clamp(40px, 6vw, 64px);
            line-height: 1.02; letter-spacing: -0.01em;
            color: var(--lab-ink); margin: 10px 0 14px;
        }
        .news-hero-title em { font-style: italic; color: var(--lab-accent); }
        .news-hero-lead {
            font-size: 17px; line-height: 1.6;
            color: var(--lab-ink-soft); max-width: 62ch;
        }

        .news-wrap { max-width: 1100px; margin: 0 auto; padding: 8px 56px 24px; width: 100%; }

        /* Utvald (senaste) artikel */
        .news-featured {
            display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 34px;
            align-items: center;
            margin: 26px 0 14px; padding-bottom: 38px;
            border-bottom: 2px solid var(--lab-line-strong);
            text-decoration: none; color: var(--lab-ink);
        }
        .news-featured-media {
            position: relative; border-radius: 4px; overflow: hidden;
            border: 1px solid var(--lab-line-strong);
            background: var(--lab-bg-raised); aspect-ratio: 16 / 9;
        }
        .news-featured-media img { width: 100%; height: 100%; object-fit: cover; display: block;
            transition: transform 600ms cubic-bezier(.2,.7,.2,1); }
        .news-featured:hover .news-featured-media img { transform: scale(1.03); }
        .news-featured-flag {
            position: absolute; top: 12px; left: 12px;
            font-family: var(--lab-font-mono); font-size: 10px; letter-spacing: 0.14em;
            text-transform: uppercase; color: #fff; background: var(--lab-accent);
            padding: 5px 9px; border-radius: 2px;
        }
        .news-meta-row {
            display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
            font-family: var(--lab-font-mono); font-size: 11px; letter-spacing: 0.06em;
            color: var(--lab-ink-muted); text-transform: uppercase; margin-bottom: 14px;
        }
        .news-meta-cat { color: var(--lab-accent); }
        .news-meta-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--lab-ink-muted); }
        /* Byline-chip: signalerar att nyheten i huvudsak är skriven av AI. */
        .news-meta-ai {
            border: 1px solid var(--lab-line-strong); border-radius: 2px;
            padding: 2.5px 7px; color: var(--lab-ink-soft); letter-spacing: 0.08em;
            cursor: help;
        }
        .news-featured-title {
            font-family: var(--lab-font-display);
            font-size: clamp(28px, 3.4vw, 40px); line-height: 1.08;
            letter-spacing: -0.01em; color: var(--lab-ink); margin: 0 0 14px;
        }
        .news-featured:hover .news-featured-title { color: var(--lab-accent); }
        .news-featured-deck { font-size: 16px; line-height: 1.6; color: var(--lab-ink-soft); margin: 0 0 16px; }
        .news-readmore {
            font-family: var(--lab-font-mono); font-size: 12px; letter-spacing: 0.04em;
            color: var(--lab-ink); border-bottom: 2px solid var(--lab-accent);
            padding-bottom: 2px; align-self: flex-start;
        }

        /* Rutnät med övriga artiklar */
        .news-grid-head {
            display: flex; justify-content: space-between; align-items: baseline;
            margin: 30px 0 18px;
        }
        .news-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; }
        .news-card { text-decoration: none; color: var(--lab-ink); display: flex; flex-direction: column; }
        .news-card-media {
            border-radius: 4px; overflow: hidden; border: 1px solid var(--lab-line-strong);
            background: var(--lab-bg-raised); aspect-ratio: 16 / 10; margin-bottom: 13px;
        }
        .news-card-media img { width: 100%; height: 100%; object-fit: cover; display: block;
            transition: transform 500ms cubic-bezier(.2,.7,.2,1); }
        .news-card:hover .news-card-media img { transform: scale(1.04); }
        .news-card-title {
            font-family: var(--lab-font-display); font-size: 21px; line-height: 1.12;
            margin: 4px 0 8px; color: var(--lab-ink);
        }
        .news-card:hover .news-card-title { color: var(--lab-accent); }
        .news-card-deck { font-size: 13.5px; line-height: 1.55; color: var(--lab-ink-soft); }

        .news-empty {
            margin-top: 14px; font-size: 15px; color: var(--lab-ink-soft);
            padding: 22px; border: 1px dashed var(--lab-line-strong); border-radius: 4px;
            background: var(--lab-bg-raised);
        }

        /* Arkivfilter: sökruta + kategori-chips (alla artiklar ska gå att gräva fram) */
        .news-filter { margin: 24px 0 0; display: flex; flex-direction: column; gap: 12px; }
        .news-search {
            width: 100%; max-width: 430px;
            font-family: var(--lab-font-sans); font-size: 14px;
            color: var(--lab-ink); background: var(--lab-bg-panel);
            border: 1px solid var(--lab-line-strong); border-radius: 4px;
            padding: 10px 14px; outline: none;
        }
        .news-search:focus { border-color: var(--lab-accent); }
        .news-search::placeholder { color: var(--lab-ink-muted); }
        /* Kategorierna ligger på EN svepbar rad (i stället för att radbrytas
           till ett tiotal rader på mobil). Tonade kanter visar att raden går
           att dra i sidled; klasserna fade-l/fade-r sätts av React vid scroll. */
        .news-cats-wrap { position: relative; }
        .news-cats {
            display: flex; flex-wrap: nowrap; gap: 5px; align-items: center;
            overflow-x: auto; -webkit-overflow-scrolling: touch;
            scrollbar-width: none; padding: 2px;
        }
        .news-cats::-webkit-scrollbar { display: none; }
        .news-cats-wrap::before, .news-cats-wrap::after {
            content: ''; position: absolute; top: 0; bottom: 0; width: 30px;
            pointer-events: none; opacity: 0; transition: opacity 160ms ease; z-index: 1;
        }
        .news-cats-wrap::before { left: 0; background: linear-gradient(90deg, var(--lab-bg), transparent); }
        .news-cats-wrap::after { right: 0; background: linear-gradient(270deg, var(--lab-bg), transparent); }
        .news-cats-wrap.fade-l::before { opacity: 1; }
        .news-cats-wrap.fade-r::after { opacity: 1; }
        /* Bläddringspilar för muspekare (rullningslisten är dold); på
           touchskärm sveper man i stället och pilarna göms. */
        .news-cats-nav {
            position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
            width: 22px; height: 22px; border-radius: 50%; padding: 0;
            display: flex; align-items: center; justify-content: center;
            background: var(--lab-bg-panel); border: 1px solid var(--lab-line-strong);
            color: var(--lab-ink-soft); cursor: pointer;
            box-shadow: 0 1px 3px rgba(15, 22, 32, 0.10);
        }
        .news-cats-nav:hover { color: var(--lab-accent); border-color: var(--lab-accent); }
        .news-cats-nav.is-l { left: -6px; }
        .news-cats-nav.is-r { right: -6px; }
        @media (pointer: coarse) { .news-cats-nav { display: none; } }
        .news-cat-chip {
            flex: 0 0 auto; white-space: nowrap;
            font-family: var(--lab-font-mono); font-size: 9px; letter-spacing: 0.04em;
            text-transform: uppercase; line-height: 1;
            color: var(--lab-ink-soft); background: var(--lab-bg-raised);
            border: 1px solid var(--lab-line-strong); border-radius: 999px;
            padding: 3.5px 8px; cursor: pointer;
        }
        .news-cat-chip:hover { border-color: var(--lab-accent); color: var(--lab-accent); }
        .news-cat-chip.is-on { background: var(--lab-ink); color: var(--lab-bg); border-color: var(--lab-ink); }
        .news-cat-chip.is-on:hover { color: var(--lab-bg); }
        .news-cat-chip .chip-n { opacity: 0.5; margin-left: 3px; }
        .news-clear {
            font-family: var(--lab-font-mono); font-size: 11px; letter-spacing: 0.05em;
            text-transform: uppercase; color: var(--lab-accent);
            background: none; border: none; cursor: pointer; padding: 6px 4px;
        }
        .news-rss {
            display: inline-block; margin-top: 14px;
            font-family: var(--lab-font-mono); font-size: 11px; letter-spacing: 0.05em;
            text-transform: uppercase; color: var(--lab-ink-muted); text-decoration: none;
            border-bottom: 1px solid var(--lab-line-strong); padding-bottom: 2px;
        }
        .news-rss:hover { color: var(--lab-accent); border-color: var(--lab-accent); }
        .news-hero-links { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: baseline; }

        /* ── Artikelvy ─────────────────────────────────────────────── */
        .article { max-width: 760px; margin: 0 auto; padding: 40px 28px 20px; width: 100%; }
        .article-back {
            font-family: var(--lab-font-mono); font-size: 12px; letter-spacing: 0.04em;
            color: var(--lab-ink-muted); text-decoration: none; display: inline-block; margin-bottom: 26px;
        }
        .article-back:hover { color: var(--lab-accent); }
        .article-title {
            font-family: var(--lab-font-display); font-size: clamp(32px, 5vw, 52px);
            line-height: 1.06; letter-spacing: -0.01em; color: var(--lab-ink); margin: 12px 0 18px;
        }
        .article-deck {
            font-size: 19px; line-height: 1.55; color: var(--lab-ink-soft);
            font-style: italic; margin: 0 0 26px;
            padding-left: 18px; border-left: 3px solid var(--lab-accent);
        }
        /* Poddspelare (ljudöversikt) — visas bara om en ljudfil finns */
        .article-podcast {
            margin: 0 0 24px; padding: 15px 18px;
            border: 1px solid var(--lab-line-strong); border-radius: 8px;
            background: var(--lab-bg-panel); box-shadow: 0 1px 0 var(--lab-line);
        }
        .article-podcast-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .article-podcast-icon {
            flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: var(--lab-accent-soft); color: var(--lab-accent);
        }
        .article-podcast-title {
            font-family: var(--lab-font-display); font-size: 19px; line-height: 1.1;
            color: var(--lab-ink);
        }
        .article-podcast-sub {
            font-family: var(--lab-font-mono); font-size: 10px; letter-spacing: 0.07em;
            text-transform: uppercase; color: var(--lab-ink-muted); margin-top: 3px;
        }
        .article-podcast-audio { width: 100%; height: 40px; accent-color: var(--lab-accent); }
        figure.article-figure { margin: 0 0 12px; }
        figure.article-figure img {
            width: 100%; display: block; border-radius: 4px;
            border: 1px solid var(--lab-line-strong);
        }
        figure.article-figure figcaption {
            font-family: var(--lab-font-mono); font-size: 11px; letter-spacing: 0.03em;
            color: var(--lab-ink-muted); margin-top: 8px; text-align: right;
        }
        /* Bild insprängd i brödtexten — body-block { type: 'image' }. Används när
           nyheten har flera fria pressbilder; bildtexten står till vänster och
           källan/krediten under den. */
        .article-body figure.article-figure-inline { margin: 32px 0 28px; }
        .article-body figure.article-figure-inline figcaption {
            display: flex; flex-direction: column; gap: 5px;
            margin-top: 9px; text-align: left;
        }
        .article-body figure.article-figure-inline .fig-caption {
            font-family: var(--lab-font-sans); font-size: 14.5px; line-height: 1.55;
            letter-spacing: 0; text-transform: none; color: var(--lab-ink);
        }
        .article-body figure.article-figure-inline .fig-credit {
            font-family: var(--lab-font-mono); font-size: 11px; letter-spacing: 0.03em;
            color: var(--lab-ink-muted);
        }
        /* Inbäddat fritt videoklipp — body-block { type: 'video' }. Ramen
           får bildförhållandet via inline aspect-ratio (4:3 för äldre
           filmmaterial, annars 16:9). */
        .article-body .article-video-frame {
            position: relative; width: 100%;
            background: #0f1620; /* mörk yta bakom spelaren medan den laddar */
            border: 1px solid var(--lab-line-strong); border-radius: 4px;
            overflow: hidden;
        }
        .article-body .article-video-frame iframe,
        .article-body .article-video-frame video {
            position: absolute; inset: 0; width: 100%; height: 100%;
            border: 0; display: block; object-fit: contain;
        }
        .article-body figure.article-video .fig-credit a {
            color: var(--lab-accent); text-decoration: underline;
            text-underline-offset: 2px;
        }
        /* AI-transparens: rutan allra överst i varje artikel, före rubriken.
           Nyheterna skrivs i huvudsak av AI ("AI-redaktören") och granskas
           av en människa före publicering — det ska läsaren veta innan
           något annat. Vit botten så att rutan lyfter från pappersytan. */
        .article-ai {
            margin: 0 0 24px; padding: 14px 18px;
            background: #ffffff;
            border: 1px solid var(--lab-line-strong);
            border-left: 3px solid var(--lab-accent);
            border-radius: 4px;
            box-shadow: 0 2px 10px rgba(15, 22, 32, 0.07);
        }
        .article-ai-label {
            font-family: var(--lab-font-mono); font-size: 10px; letter-spacing: 0.09em;
            text-transform: uppercase; color: var(--lab-accent); margin-bottom: 6px;
        }
        .article-ai p { margin: 0; font-size: 13.5px; line-height: 1.6; color: var(--lab-ink-soft); }
        .article-ai-link {
            background: none; border: none; padding: 0; cursor: pointer;
            font: inherit; color: var(--lab-accent);
            text-decoration: underline; text-underline-offset: 2px;
        }
        .article-ai-link:hover { color: var(--lab-ink); }
        /* Felrapportering: rutan i artikelns slut. Öppnar feedback-widgeten
           (feedback.js) förifylld som felrapport för just den här artikeln. */
        .article-felrapport {
            margin-top: 26px; padding: 15px 18px;
            border: 1px dashed var(--lab-line-strong); border-radius: 4px;
            display: flex; justify-content: space-between; align-items: center;
            gap: 14px 22px; flex-wrap: wrap;
        }
        .article-felrapport-text { margin: 0; font-size: 14px; line-height: 1.55; color: var(--lab-ink-soft); }
        .article-felrapport-text strong { color: var(--lab-ink); font-weight: 600; }
        .article-felrapport-btn {
            flex: 0 0 auto;
            font-family: var(--lab-font-mono); font-size: 11px; letter-spacing: 0.06em;
            text-transform: uppercase; color: var(--lab-ink);
            background: none; border: 1px solid var(--lab-ink); border-radius: 2px;
            padding: 8px 14px; cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
        }
        .article-felrapport-btn:hover {
            background: var(--lab-accent); border-color: var(--lab-accent); color: #fff;
        }
        .article-body { margin-top: 26px; }
        .article-body p {
            font-size: 17.5px; line-height: 1.72; color: var(--lab-ink); margin: 0 0 20px;
        }
        .article-body p a { color: var(--lab-accent); text-decoration: underline; text-underline-offset: 2px; }
        /* Formler (KaTeX). Samma sättning som teoriavsnitten; storleken
           trimmas mot brödtexten så att en inline-formel inte sticker upp
           som en främmande kropp i stycket. .katex { white-space: nowrap }
           i styles-laborans.css håller ihop formeln över radbrytningar. */
        .article-body .katex { font-size: 1.03em; }
        .article-body .katex-display {
            margin: 18px 0 !important; text-align: left !important;
            overflow-x: auto; overflow-y: hidden;
        }
        .article-body .katex-display > .katex { text-align: left; padding-left: 1.5em; }
        .article-body h2 {
            font-family: var(--lab-font-display); font-size: 27px; line-height: 1.15;
            color: var(--lab-ink); margin: 34px 0 14px; letter-spacing: -0.005em;
        }
        .article-quote {
            margin: 30px 0; padding: 4px 0 4px 22px; border-left: 4px solid var(--lab-accent);
        }
        .article-quote p {
            font-family: var(--lab-font-display); font-size: 25px; line-height: 1.3;
            color: var(--lab-ink); font-style: italic; margin: 0 0 8px;
        }
        .article-quote cite {
            font-family: var(--lab-font-mono); font-size: 11.5px; letter-spacing: 0.06em;
            color: var(--lab-ink-muted); font-style: normal; text-transform: uppercase;
        }
        .article-fact {
            margin: 30px 0; padding: 22px 24px; border-radius: 5px;
            background: var(--lab-bg-panel); border: 1px solid var(--lab-line-strong);
            box-shadow: 0 1px 0 var(--lab-line);
        }
        .article-fact-title {
            font-family: var(--lab-font-mono); font-size: 11px; letter-spacing: 0.14em;
            text-transform: uppercase; color: var(--lab-accent); margin-bottom: 12px;
        }
        .article-fact ul { margin: 0; padding-left: 20px; }
        .article-fact li { font-size: 15.5px; line-height: 1.6; color: var(--lab-ink-soft); margin-bottom: 9px; }
        .article-fact li:last-child { margin-bottom: 0; }
        /* Videoklipp nästlat i faktarutan (fact.video) — filmen ska ligga
           i direkt anslutning till punkten som refererar den, inom den
           vita rutan, inte som en egen lös figur under rutan. */
        .article-fact figure.article-figure-inline { margin: 18px 0 0; }

        /* Ordförklaringar — de begrepp ur ordlistan som artikeln nämner.
           Fylls av begrepp-lank.js autolänkning (se ArticleView). */
        .article-ord {
            margin: 38px 0 0; padding-top: 22px; border-top: 2px solid var(--lab-line-strong);
        }
        .article-ord-lead {
            font-size: 14px; line-height: 1.55; color: var(--lab-ink-soft); margin: -4px 0 13px;
        }

        .article-sources {
            margin: 38px 0 10px; padding-top: 22px; border-top: 2px solid var(--lab-line-strong);
        }
        .article-sources-label {
            font-family: var(--lab-font-mono); font-size: 11px; letter-spacing: 0.14em;
            text-transform: uppercase; color: var(--lab-ink-muted); margin-bottom: 12px;
        }
        .article-sources-list { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
        .article-source-pill {
            font-family: var(--lab-font-mono); font-size: 12px; letter-spacing: 0.02em;
            color: var(--lab-ink); text-decoration: none;
            border: 1px solid var(--lab-line-strong); border-radius: 999px; padding: 6px 13px;
        }
        .article-source-pill:hover { border-color: var(--lab-accent); color: var(--lab-accent); }
        .article-research {
            font-size: 14px; line-height: 1.55; color: var(--lab-ink-soft);
            background: var(--lab-bg-raised); border-radius: 5px; padding: 15px 17px;
        }
        .article-research strong { color: var(--lab-ink); font-weight: 600; }
        .article-research a { color: var(--lab-accent); text-decoration: underline; text-underline-offset: 2px; }

        /* "För läraren" — diskussionsfrågor och momentkoppling.
           Ligger UTANFÖR artikeltexten (under källorna) eftersom artikeln
           själv aldrig får hänvisa till kurserna. Tydligt avgränsad så att
           en elev ser att rutan inte är en del av nyheten. */
        .article-larare {
            margin: 34px 0 0; padding: 22px 24px;
            border: 1px solid var(--lab-line-strong); border-radius: 5px;
            background: var(--lab-bg-raised);
        }
        .article-larare-head {
            display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
            margin-bottom: 4px;
        }
        .article-larare-label {
            font-family: var(--lab-font-mono); font-size: 11px; letter-spacing: 0.14em;
            text-transform: uppercase; color: var(--lab-accent);
        }
        .article-larare-note {
            font-family: var(--lab-font-mono); font-size: 10.5px; letter-spacing: 0.06em;
            color: var(--lab-ink-muted);
        }
        .article-larare-moment {
            display: flex; flex-wrap: wrap; gap: 7px; margin: 12px 0 18px;
        }
        .article-larare-moment a,
        .article-larare-moment span {
            font-family: var(--lab-font-mono); font-size: 11px; letter-spacing: 0.04em;

    <!-- KaTeX-motorn + auto-render. Artikeltextens $…$ sätts av renderMath()
         nedan, före begreppslänkning och bionisk läsning. -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <script type="text/babel" data-presets="react">
        const NYHETER = (window.NYHETER || []).slice();

        function formatDate(iso) {
            const months = ['januari','februari','mars','april','maj','juni','juli',
                'augusti','september','oktober','november','december'];
            const [y, m, d] = iso.split('-').map(Number);
            return `${d} ${months[m - 1]} ${y}`;
        }

        // ── Formler (KaTeX) ─────────────────────────────────────────
        // Artiklarnas formler skrivs som $…$ (och $$…$$ för block) i
        // data/nyheter.js — exakt samma notation som teoriavsnitten, så att
        // division blir ett rakt bråkstreck och rotmärket täcker hela
        // uttrycket. Kom ihåg att backslash måste dubblas i JS-strängar:
        // "$v = \\sqrt{\\dfrac{GM}{r}}$".
        //
        // prepMath() limmar ihop en öppningsparentes med formeln efter den,
        // så att "(" aldrig blir ensam kvar i radslutet (samma knep som
        // restoreMath() i katalog.html).
        function prepMath(html) {
            if (!html) return html;
            return html.replace(/\(( *)(\$(?!\$)[^$\n]+?\$)/g,
                '<span class="math-paren">($1$2</span>');
        }
        function renderMath(root) {
            if (!root || !window.renderMathInElement) return;
            try {
                window.renderMathInElement(root, {
                    delimiters: [
                        { left: '$$', right: '$$', display: true },
                        { left: '$', right: '$', display: false },
                    ],
                    ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
                    throwOnError: false,
                });
            } catch (e) { /* formeln får stå kvar som råtext hellre än att allt dör */ }
        }

        // ── Bionisk läsning ─────────────────────────────────────────
        // Fetmarkerar början ("fixeringspunkten") av varje ord som lässtöd.
        // Spannen läggs ALLTID in i DOM:en; på/av styrs sedan av klassen
        // .bionic-on på behållaren (ren CSS-växling). Hoppar över rubriker,
        // kod och script. Samma algoritm som teorisidorna i katalog.html.
        function bionicFixLen(n) {
            if (n <= 3) return 1;
            if (n <= 6) return 2;
            if (n <= 9) return 3;
            return Math.ceil(n * 0.4);
        }
        function applyBionic(root) {
            if (!root || root.querySelector('.lab-bionic')) return; // redan gjort
            const SKIP = { SCRIPT: 1, STYLE: 1, CODE: 1, PRE: 1, H1: 1, H2: 1, H3: 1, H4: 1, H5: 1, H6: 1, FIGCAPTION: 1 };
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
                acceptNode(node) {
                    if (!node.nodeValue || !/\S/.test(node.nodeValue)) return NodeFilter.FILTER_REJECT;
                    for (let p = node.parentElement; p && p !== root; p = p.parentElement) {
                        if (SKIP[p.tagName]) return NodeFilter.FILTER_REJECT;
                        // Färdigsatta KaTeX-formler lämnas orörda — spann
                        // inuti dem slår sönder matematiksättningen.
                        const c = p.classList;
                        if (c && (c.contains('katex') || c.contains('katex-display'))) return NodeFilter.FILTER_REJECT;
                    }
                    return NodeFilter.FILTER_ACCEPT;
                }
            });
            const nodes = [];
            for (let n = walker.nextNode(); n; n = walker.nextNode()) nodes.push(n);
            const wordRe = /\p{L}[\p{L}\p{M}'’\-]*/gu;
            for (const tn of nodes) {
                const text = tn.nodeValue;
                wordRe.lastIndex = 0;
                if (!wordRe.test(text)) continue;
                wordRe.lastIndex = 0;
                const frag = document.createDocumentFragment();
                let last = 0, m;
                while ((m = wordRe.exec(text))) {
                    const word = m[0], start = m.index;
                    if (start > last) frag.appendChild(document.createTextNode(text.slice(last, start)));
                    let k = bionicFixLen(word.length);
                    if (word.length > 1) k = Math.min(k, word.length - 1);
                    const span = document.createElement('span');
                    span.className = 'lab-bionic';
                    span.textContent = word.slice(0, k);
                    frag.appendChild(span);
                    if (k < word.length) frag.appendChild(document.createTextNode(word.slice(k)));
                    last = start + word.length;
                }
                if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
                tn.parentNode.replaceChild(frag, tn);
            }
        }

        // Söknormalisering: gemener + å/ä/ö → a/a/o, så att "vagor" träffar "Vågor".
        function normSok(s) {

            }, []);

            // Kategoriraden scrollas i sidled — tonade kanter visar när det
            // finns fler chips åt något håll.
            const catsRef = React.useRef(null);
            const [fade, setFade] = React.useState({ l: false, r: false });
            const updateFade = React.useCallback(() => {
                const el = catsRef.current; if (!el) return;
                const max = el.scrollWidth - el.clientWidth;
                setFade(f => {
                    const l = el.scrollLeft > 4, r = el.scrollLeft < max - 4;
                    return (f.l === l && f.r === r) ? f : { l, r };
                });
            }, []);
            React.useEffect(() => {
                updateFade();
                window.addEventListener('resize', updateFade);

            }, [updateFade]);
            React.useEffect(() => {

            const q = normSok(query.trim());

            const matches = NYHETER.filter(a => {

                if (!q) return true;

            const [featured, ...rest] = matches;

            return (

                                       placeholder="Sök bland nyheterna — rubrik, ämne eller nyckelord …"
                                       aria-label="Sök bland nyheterna" />
                                <div className={'news-cats-wrap' + (fade.l ? ' fade-l' : '') + (fade.r ? ' fade-r' : '')}>
                                    {fade.l && (
                                        <button type="button" className="news-cats-nav is-l"
                                                aria-label="Bläddra kategorier åt vänster" onClick={() => scrollCats(-1)}>
                                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                 strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M15 18l-6-6 6-6" />
                                            </svg>
                                        </button>
                                    )}
                                    {fade.r && (
                                        <button type="button" className="news-cats-nav is-r"
                                                aria-label="Bläddra kategorier åt höger" onClick={() => scrollCats(1)}>
                                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                 strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M9 6l6 6-6 6" />
                                            </svg>
                                        </button>
                                    )}
                                    <div className="news-cats" ref={catsRef} onScroll={updateFade}>
                                        <button type="button"
                                                className={'news-cat-chip' + (!cat ? ' is-on' : '')}
                                                onClick={() => setCat('')}>
                                            Alla<span className="chip-n">{NYHETER.length}</span>
                                        </button>
                                        {cats.map(([c, n]) => (
                                            <button type="button" key={c}
                                                    className={'news-cat-chip' + (cat === c ? ' is-on' : '')}
                                                    onClick={() => setCat(cat === c ? '' : c)}>
                                                {c}<span className="chip-n">{n}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {NYHETER.length === 0 && (
                            <div className="news-empty">Inga nyheter publicerade ännu — kom tillbaka snart!</div>
                        )}

                        {filtering ? (
                            <React.Fragment>
                                <div className="news-grid-head">
                                    <span className="lab-mono-label">
                                        {matches.length === 0 ? 'Inga träffar'
                                            : matches.length === 1 ? '1 träff'
                                            : `${matches.length} träffar`}
                                    </span>
                                    <button type="button" className="news-clear"
                                            onClick={() => { setQuery(''); setCat(''); }}>
                                        Rensa filtret ✕
                                    </button>
                                </div>
                                {matches.length === 0 ? (
                                    <div className="news-empty">
                                        Ingen nyhet matchar — prova ett annat sökord eller en annan kategori.
                                    </div>
                                ) : (
                                    <div className="news-grid">
                                        {matches.map(a => <NewsCard a={a} key={a.id} />)}
                                    </div>
                                )}
                                <NyhetsbrevBox />
                            </React.Fragment>
                        ) : (
                            <React.Fragment>
                                {featured && (
                                    <a className="news-featured" href={`?id=${featured.id}`}>
                                        <div className="news-featured-media">
                                            <span className="news-featured-flag">Senaste nytt</span>
                                            <img src={featured.image} alt={featured.imageAlt} loading="eager" />
                                        </div>
                                        <div className="news-featured-text">
                                            <MetaRow a={featured} byline />
                                            <h2 className="news-featured-title">{featured.title}</h2>
                                            <p className="news-featured-deck">{featured.deck}</p>
                                            <span className="news-readmore">Läs hela →</span>
                                        </div>
                                    </a>
                                )}

                                {/* Rutan sitter i sömmen mellan senaste nytt och
                                    arkivet. Längst ned på sidan hamnade den efter
                                    ett femtiotal artiklar och syntes aldrig.
                                    Exakt EN ruta får finnas per sida — skriptet
                                    hittar formuläret med document.querySelector. */}
                                <NyhetsbrevBox />

                                {rest.length > 0 && (
                                    <React.Fragment>
                                        <div className="news-grid-head">
                                            <span className="lab-mono-label">Tidigare nyheter</span>
                                            <span className="lab-mono-label">{rest.length} st</span>
                                        </div>
                                        <div className="news-grid">
                                            {rest.map(a => <NewsCard a={a} key={a.id} />)}
                                        </div>
                                    </React.Fragment>
                                )}
                            </React.Fragment>
                        )}
                    </div>
                </React.Fragment>
            );
        }

        // Inbäddat fritt videoklipp — används både som eget body-block
        // ({ type: 'video', … }) och nästlat i en faktaruta (fact.video),
        // så att filmen kan ligga i direkt anslutning till texten som
        // refererar den. v.src (självhostad mp4) föredras; v.embed
        // (iframe-URL) är reserv. Saknas båda renderas ingenting — hellre
        // ingen ruta än en svart.
        function ArticleVideo({ v }) {
            if (!v || (!v.src && !v.embed)) return null;
            return (
                <figure className="article-figure article-figure-inline article-video">
                    <div className="article-video-frame"
                         style={{ aspectRatio: v.ratio === '4:3' ? '4 / 3' : '16 / 9' }}>
                        {v.src
                            ? <video controls preload="metadata" playsInline poster={v.poster} title={v.title || 'Videoklipp'}>
                                  <source src={v.src} type="video/mp4" />
                              </video>
                            : <iframe src={v.embed} title={v.title || 'Videoklipp'} loading="lazy"
                                      frameBorder="0" allow="fullscreen; encrypted-media; picture-in-picture"
                                      allowFullScreen />}
                    </div>
                    <figcaption>
                        {v.caption && <span className="fig-caption"
                            dangerouslySetInnerHTML={{ __html: prepMath(v.caption) }} />}
                        {(v.credit || v.url) && (
                            <span className="fig-credit">
                                {v.credit}
                                {v.credit && v.url ? ' · ' : ''}
                                {v.url && <a href={v.url} target="_blank"
                                             rel="noopener noreferrer">Se filmen i original</a>}
                            </span>
                        )}
                    </figcaption>
                </figure>
            );
        }

        function Block({ b }) {
            if (b.type === 'h2') return <h2>{b.text}</h2>;
            if (b.type === 'quote') return (
                <blockquote className="article-quote">
                    <p dangerouslySetInnerHTML={{ __html: prepMath(b.html) }} />
                    {b.cite && <cite>{b.cite}</cite>}
                </blockquote>
            );
            if (b.type === 'image') return (
                <figure className="article-figure article-figure-inline">
                    <img src={b.src} alt={b.alt} loading="lazy" />
                    {(b.caption || b.credit) && (
                        <figcaption>
                            {b.caption && <span className="fig-caption"
                                dangerouslySetInnerHTML={{ __html: prepMath(b.caption) }} />}
                            {b.credit && <span className="fig-credit">{b.credit}</span>}
                        </figcaption>
                    )}
                </figure>
            );
            if (b.type === 'video') return <ArticleVideo v={b} />;
            if (b.type === 'fact') return (
                <div className="article-fact">
                    <div className="article-fact-title">{b.title}</div>
                    <ul>{b.items.map((it, i) => <li key={i} dangerouslySetInnerHTML={{ __html: prepMath(it) }} />)}</ul>
                    {b.video && <ArticleVideo v={b.video} />}
                </div>
            );
            return <p dangerouslySetInnerHTML={{ __html: prepMath(b.html) }} />;
        }

        // Poddspelare: visar en spelare om det finns en ljudfil för artikeln.
        // Lägg ljudfilen som nyheter/podd/<id>.<ext> (m4a/mp3/…), så hittar
        // spelaren den automatiskt — ingen ändring i data/nyheter.js behövs.
        // Ett explicit a.audio-fält går att sätta om filen ligger annorstädes.
        function ArticlePodcast({ a }) {
            const [src, setSrc] = React.useState(null);
            React.useEffect(() => {
                let alive = true;
                const candidates = a.audio
                    ? [a.audio]
                    : ['m4a', 'mp3', 'wav', 'ogg', 'aac', 'opus'].map(ext => `nyheter/podd/${a.id}.${ext}`);
                (async () => {
                    for (const c of candidates) {
                        try {
                            const r = await fetch(c, { method: 'HEAD' });
                            if (r.ok) { if (alive) setSrc(c); return; }
                        } catch (e) { /* nästa kandidat */ }
                    }
                    if (alive) setSrc(null);
                })();
                return () => { alive = false; };
            }, [a.id]);

            if (!src) return null;
            return (
                <div className="article-podcast">
                    <div className="article-podcast-head">
                        <span className="article-podcast-icon">
                            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                                <rect x="9" y="2" width="6" height="11" rx="3" />
                                <path d="M5 10a7 7 0 0 0 14 0" />
                                <line x1="12" y1="17" x2="12" y2="22" />
                                <line x1="8" y1="22" x2="16" y2="22" />
                            </svg>
                        </span>
                        <div>
                            <div className="article-podcast-title">Lyssna: djupdykning</div>
                            <div className="article-podcast-sub">Ljudöversikt skapad i NotebookLM</div>
                        </div>
                    </div>
                    <audio className="article-podcast-audio" controls preload="none" src={src}>
                        Din webbläsare kan inte spela upp ljudet.
                    </audio>
                </div>
            );
        }

        // Dela-artikel-rad: inbyggd delningsmeny (mobil) + kopiera länk +
        // e-post och sociala kanaler. Alla ikoner är inline-SVG (currentColor),
        // inga emojis.
        //
        // Raden renderas två gånger per artikel: en KOMPAKT variant direkt
        // under ingressen (compact) och den fullständiga i artikelfoten.
        // Skälet är att foten ligger efter källor, ordförklaringar och
        // lärarrutan — en läsare som inte skrollar hela vägen ned får aldrig
        // veta att artikeln går att dela. I compact-läget behåller de två
        // huvudknapparna (Dela, Kopiera länk) sin text medan e-post och de
        // sociala kanalerna blir rena ikonknappar, så att raden inte
        // konkurrerar med rubriken.
        function ShareBar({ a, compact }) {
            const [copied, setCopied] = React.useState(false);
            const [canNativeShare, setCanNativeShare] = React.useState(false);
            React.useEffect(() => {
                setCanNativeShare(typeof navigator !== 'undefined' && !!navigator.share);
            }, []);

            // Dela alltid per-artikel-OG-sidan (nyheter/dela/<id>.html) på den
            // publika domänen — den bär artikelns egna og:*-taggar så att
            // Facebook/X/LinkedIn m.fl. visar rätt bild och rubrik, och
            // omdirigerar människor vidare till den riktiga artikeln.
            // Genereras av data/build-nyheter-og.js. Hårdkodad produktions-
            // origin så att man aldrig råkar dela en localhost-länk.
            const SITE_ORIGIN = 'https://fysiklabbet.se';
            const url = `${SITE_ORIGIN}/nyheter/dela/${a.id}.html`;
            const title = a.title;
            const text = a.deck || a.title;
            const enc = encodeURIComponent;

            const nativeShare = async () => {
                try { await navigator.share({ title, text, url }); } catch (e) { /* avbruten */ }
            };
            const copyLink = async () => {
                try {
                    await navigator.clipboard.writeText(url);
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                } catch (e) { /* clipboard nekad */ }
            };

            const icon = compact ? ' is-icon' : '';

            return (
                <div className={'article-share' + (compact ? ' is-top' : '')}>
                    <div className="article-share-label">Dela artikeln</div>
                    <div className="article-share-btns">
                        {canNativeShare && (
                            <button type="button" className="share-btn is-primary" onClick={nativeShare}>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"
                                     strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                                    <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
                                    <line x1="8.6" y1="10.5" x2="15.4" y2="6.5"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/>
                                </svg>
                                Dela
                            </button>
                        )}
                        <button type="button" className={'share-btn' + (copied ? ' is-copied' : '')} onClick={copyLink}>
                            {copied ? (
                                <React.Fragment>
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"
                                         strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
                                    Länk kopierad
                                </React.Fragment>
                            ) : (
                                <React.Fragment>
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"
                                         strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                                        <path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                                        <path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                                    </svg>
                                    Kopiera länk
                                </React.Fragment>
                            )}
                        </button>
                        <a className={'share-btn' + icon} aria-label="Dela via e-post"
                           title={compact ? 'E-post' : null}
                           href={`mailto:?subject=${enc(title)}&body=${enc(text + '\n\n' + url)}`}>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"
                                 strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                                <rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>
                            </svg>
                            {!compact && 'E-post'}
                        </a>
                        <a className={'share-btn' + icon} href={`https://www.facebook.com/sharer/sharer.php?u=${enc(url)}`}
                           target="_blank" rel="noopener noreferrer" aria-label="Dela på Facebook"
                           title={compact ? 'Facebook' : null}>
                            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                <path d="M14 8.5V7c0-.8.5-1 1-1h2V3h-2.5C12 3 11 4.7 11 6.6v1.9H9V11h2v10h3V11h2.2l.3-2.5H14z"/>
                            </svg>
                            {!compact && 'Facebook'}
                        </a>
                        <a className={'share-btn' + icon} href={`https://twitter.com/intent/tweet?url=${enc(url)}&text=${enc(title)}`}
                           target="_blank" rel="noopener noreferrer" aria-label="Dela på X"
                           title={compact ? 'X' : null}>
                            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                <path d="M18.24 3h3.3l-7.2 8.24L23 21h-6.63l-5.2-6.8L5.2 21H1.9l7.7-8.8L1 3h6.8l4.7 6.2L18.24 3zm-1.16 16h1.83L7.02 4.9H5.06L17.08 19z"/>
                            </svg>
                            {!compact && 'X'}
                        </a>
                        <a className={'share-btn' + icon} href={`https://www.linkedin.com/sharing/share-offsite/?url=${enc(url)}`}
                           target="_blank" rel="noopener noreferrer" aria-label="Dela på LinkedIn"
                           title={compact ? 'LinkedIn' : null}>
                            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                <path d="M6.5 8.5H3.8V21h2.7V8.5zM5.1 3.5A1.6 1.6 0 1 0 5.1 6.7 1.6 1.6 0 0 0 5.1 3.5zM21 21h-2.7v-6.1c0-1.5-.5-2.4-1.8-2.4-1 0-1.5.7-1.8 1.3-.1.2-.1.5-.1.9V21h-2.7s.04-10.1 0-11.1h2.7v1.6c.36-.6 1-1.4 2.5-1.4 1.85 0 3.2 1.2 3.2 3.8V21z"/>
                            </svg>
                            {!compact && 'LinkedIn'}
                        </a>
                    </div>
                </div>
            );
        }

        function ArticleView({ a }) {
            const bodyRef = React.useRef(null);
            const articleRef = React.useRef(null);
            // Lässtöd: minns valen mellan besök (samma nycklar som teorisidorna).
            const [bionic, setBionic] = React.useState(() => {
                try { return localStorage.getItem('fy-bionic') === '1'; } catch (e) { return false; }
            });
            const [dyslexia, setDyslexia] = React.useState(() => {
                try { return localStorage.getItem('fy-dyslexia') === '1'; } catch (e) { return false; }
            });
            React.useEffect(() => {
                try { localStorage.setItem('fy-bionic', bionic ? '1' : '0'); } catch (e) {}
            }, [bionic]);
            React.useEffect(() => {
                try { localStorage.setItem('fy-dyslexia', dyslexia ? '1' : '0'); } catch (e) {}
            }, [dyslexia]);
            // Begrepp som ordlistan förklarar och som faktiskt förekommer i
            // den här artikeln (fylls i av autolänkaren nedan).
            const [ordIds, setOrdIds] = React.useState([]);

            // Ordning: formler FÖRST, sedan begreppslänkning, sist bionisk
            // läsning. KaTeX måste få se råtexten innan någon annan rör
            // DOM:en, och applyBionic styckar orden i <span>-taggar så att
            // ordlistan inte längre hittar dem. Båda hoppar över .katex.
            // Alla tre muterar DOM:en direkt; React rör inte blocken igen
            // eftersom deras html-strängar är oförändrade.
            React.useEffect(() => {
                renderMath(bodyRef.current);
                setOrdIds(window.BEGREPPSLANK
                    ? window.BEGREPPSLANK.linkify(bodyRef.current) : []);
                applyBionic(bodyRef.current);
            }, [a]);

            return (
                <article className="article" ref={articleRef}>
                    <a className="article-back" href="nyheter.html">← Alla nyheter</a>

                    <AiRuta a={a} />

                    <MetaRow a={a} byline />
                    <h1 className="article-title">{a.title}</h1>
                    <p className="article-deck">{a.deck}</p>

                    <ShareBar a={a} compact />

                    <ArticlePodcast a={a} />

                    <figure className="article-figure">
                        <img src={a.image} alt={a.imageAlt} />
                        {a.imageCredit && <figcaption>{a.imageCredit}</figcaption>}
                    </figure>

                    <div className="lab-bionic-bar">
                        <button type="button"
                            className={'lab-bionic-toggle' + (bionic ? ' is-on' : '')}
                            onClick={() => setBionic(b => !b)}
                            aria-pressed={bionic}
                            title="Bionisk läsning — fetmarkerar början av varje ord som lässtöd">
                            <span className="lab-bionic-knob" />
                            <span><b>Bio</b>nisk <b>läs</b>ning</span>
                        </button>
                        <button type="button"
                            className={'lab-bionic-toggle' + (dyslexia ? ' is-on' : '')}
                            onClick={() => setDyslexia(d => !d)}
                            aria-pressed={dyslexia}
                            title="Dyslexivänligt typsnitt (OpenDyslexic) — anpassat för läsare med dyslexi">
                            <span className="lab-bionic-knob" />
                            <span className="lab-dys-label">Dyslexivänligt</span>
                        </button>
                    </div>

                    <div ref={bodyRef}
                         className={'article-body' + (bionic ? ' bionic-on' : '') + (dyslexia ? ' dyslexia-on' : '')}>
                        {a.body.map((b, i) => <Block b={b} key={i} />)}
                    </div>

                    {ordIds.length > 0 && (
                        <div className="article-ord">
                            <div className="article-sources-label">Ordförklaringar</div>
                            <p className="article-ord-lead">
                                De understrukna orden i texten förklaras i ordlistan:
                            </p>
                            <div className="article-sources-list">
                                {ordIds.map(id => {
                                    const b = window.BEGREPPSLANK.byId(id);
                                    return b ? (
                                        <a className="article-source-pill" key={id}
                                           href={`begrepp.html?ord=${b.id}`}>{b.term}</a>
                                    ) : null;
                                })}
                            </div>
                        </div>
                    )}

                    <div className="article-sources">
                        <div className="article-sources-label">Källor</div>
                        <div className="article-sources-list">
                            {a.sources.map((s, i) => (
                                <a className="article-source-pill" href={s.url}
                                   target="_blank" rel="noopener noreferrer" key={i}>{s.name} ↗</a>
                            ))}
                        </div>
                        {a.research && (
                            <p className="article-research">
                                <strong>Originalforskningen:</strong>{' '}
                                <a href={a.research.url} target="_blank" rel="noopener noreferrer">
                                    {a.research.citation}
                                </a>
                            </p>
                        )}
                    </div>

                    <FelRuta a={a} />

                    {/* Rutan ligger direkt efter källorna och felrapporten —
                        alltså så snart artikeln är utläst, och FÖRE lärarrutan
                        och dela-raden. Sist på sidan hamnade den under en
                        lärarruta som kan vara flera skärmhöjder lång, och sågs
                        sällan. */}
                    <NyhetsbrevBox />

                    {a.larare && <LararRuta l={a.larare} />}

                    <ShareBar a={a} />
                </article>
            );
        }

        // "För läraren": diskussionsfrågor och momentkoppling.
        //
        // Renderas UNDER källorna, alltså utanför artikeltexten. Det är
        // avsiktligt: artikeln ska stå på egna ben och aldrig hänvisa till
        // gymnasiekurserna eller Fysiklabbets eget material. Rutan är till
        // för läraren som ska använda nyheten i klassrummet — inte för
        // eleven som läser artikeln.
        function LararRuta({ l }) {
            const moment = l.moment || [];
            const fragor = l.fragor || [];
            if (!moment.length && !fragor.length) return null;
            return (
                <div className="article-larare">
                    <div className="article-larare-head">
                        <span className="article-larare-label">För läraren</span>
                        <span className="article-larare-note">Diskussionsunderlag</span>
                    </div>
                    {moment.length > 0 && (
                        <div className="article-larare-moment">
                            {moment.map((m, i) => (m.href
                                ? <a href={m.href} key={i}>{m.label}</a>
                                : <span key={i}>{m.label}</span>
                            ))}
                        </div>
                    )}
                    {fragor.length > 0 && (
                        <ol>
                            {fragor.map((f, i) => <li key={i}>{f}</li>)}
                        </ol>
                    )}
                </div>
            );
        }

        function App() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const article = id ? NYHETER.find(a => a.id === id) : null;

            React.useEffect(() => {
                document.title = article
                    ? `${article.title} — Fysiklabbet`
                    : 'Nyheter — Fysiklabbet';
            }, [article]);

            return (
                <div className="lab-page">
                    <Topbar />
                    <Header />
                    {article ? <ArticleView a={article} /> : <ListView />}
                    <Footer />
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>

    <script>document.write('<scr' + 'ipt src="feedback.js?v=' + window.__CB + '" defer></scr' + 'ipt>');</script>
</body>
</html>
