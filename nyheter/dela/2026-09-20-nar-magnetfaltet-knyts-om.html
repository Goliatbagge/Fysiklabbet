    <title>Solens utbrott börjar med att magnetfältet slits av — och omkopplingen går alltid ungefär lika fort — Fysiklabbet</title>
    <meta name="description" content="Ett enda utbrott på solen kan frigöra mer energi på några minuter än hela mänskligheten gör av med under tiotusen år, och energin kommer inte från kärnreaktioner utan från solens eget magnetfält. Hur snabbt fältlinjerna kan slitas av och knytas ihop på nytt är en av plasmafysikens envisaste gåtor. Ett japanskt lag har nu byggt om förloppet i millimeterskala med en av världens kraftfullaste lasrar, och får samma takt hur de än ändrar förutsättningarna.">
