            );
        };

        // ════════════════════════════════════════════════════════
        //  REGLAGE
        // ════════════════════════════════════════════════════════
        const NumInput = ({ value, min, max, onCommit, fmtFn, unit, disabled, color = 'var(--lab-accent, #c8324a)' }) => {
            const [txt, setTxt] = useState(() => fmtFn(value));
            const [editing, setEditing] = useState(false);
            useEffect(() => { if (!editing) setTxt(fmtFn(value)); }, [value, editing]);
            const commit = (raw) => {
                const norm = raw.replace(',', '.').replace('−', '-').trim();
                if (norm === '' || norm === '-' || norm === '.') return;
                let n = parseFloat(norm);
                if (!isFinite(n)) return;
                if (min != null && n < min) n = min;
                if (max != null && n > max) n = max;
                onCommit(n);
            };
            return (
                <span className="num-wrap">
                    <input className="num-in" type="text" inputMode="decimal" value={txt} disabled={disabled}
                           style={{ color }} aria-label="Skriv in värde"
                           onFocus={() => setEditing(true)}
                           onChange={(e) => { setTxt(e.target.value); commit(e.target.value); }}
                           onBlur={() => { setEditing(false); setTxt(fmtFn(value)); }}
                           onKeyDown={(e) => { if (e.key === 'Enter') e.currentTarget.blur(); }} />
                    {unit && <span className="num-unit">{unit}</span>}
                </span>
            );
        };
        const Slider = ({ label, value, min, max, step, onChange, disabled, children }) => (
            <div className="flex items-center gap-2 mb-2">
                <span className="text-xs flex-shrink-0" style={{ minWidth: 112, color: 'var(--lab-ink-soft)' }}
                      dangerouslySetInnerHTML={{ __html: label }} />
                <input type="range" min={min} max={max} step={step} value={value} disabled={disabled}
                       onChange={(e) => onChange(parseFloat(e.target.value))} className="flex-1 cursor-pointer" />
                {children}
            </div>
        );
        const StSlider = ({ label, value, min, max, step, onChange, disabled, valueNode }) => (
            <div className="st-slider">
                <div className="st-slider-top">
                    <span dangerouslySetInnerHTML={{ __html: label }} />
                    {valueNode}
                </div>
                <input type="range" min={min} max={max} step={step} value={value} disabled={disabled}
                       onChange={(e) => onChange(parseFloat(e.target.value))} />
            </div>
        );

        // Formelkortet: varje storhet har sitt namn ovanför.
        const Vbl = ({ label, children }) => (
            <div className="flex flex-col items-center" style={{ lineHeight: 1.1 }}>
                <span className="flbl">{label}</span>
                <span className="fnum">{children}</span>
                <span className="flbl" aria-hidden="true" style={{ visibility: 'hidden' }}>{label}</span>
            </div>
        );

        const FormelKort = ({ lage, P, dE, dt, eta, dolj }) => (
            <div className="glass-card rounded-xl p-4 mb-6" style={{ color: 'var(--lab-ink)' }}>
                <div className="flex flex-wrap items-center gap-x-8 gap-y-3">
                    <div className="flex items-center gap-x-3">
                        <Vbl label="Effekt"><em>P</em></Vbl>
                        <span className="fnum">=</span>
                        <div className="flex flex-col items-center" style={{ lineHeight: 1.1 }}>
                            <span className="flbl">Omvandlad energi</span>
                            <span className="fnum" style={{ padding: '0 8px 3px' }}>Δ<em>E</em></span>
                            <span className="fnum" style={{ padding: '3px 8px 0', borderTop: '2px solid currentColor', alignSelf: 'stretch', textAlign: 'center' }}>Δ<em>t</em></span>
                            <span className="flbl">Tid</span>
                        </div>
                    </div>
                    <div className="flex items-center gap-x-3">
                        <Vbl label="Verkningsgrad"><em>η</em></Vbl>
                        <span className="fnum">=</span>
                        <div className="flex flex-col items-center" style={{ lineHeight: 1.1 }}>
                            <span className="flbl">Nyttig energi</span>
                            <span className="fnum" style={{ padding: '0 8px 3px' }}><em>E</em><sub>n</sub></span>
                            <span className="fnum" style={{ padding: '3px 8px 0', borderTop: '2px solid currentColor', alignSelf: 'stretch', textAlign: 'center' }}><em>E</em><sub>t</sub></span>
                            <span className="flbl">Tillförd energi</span>
                        </div>
                        <span className="fnum">=</span>
                        <div className="flex flex-col items-center" style={{ lineHeight: 1.1 }}>
                            <span className="flbl">Nyttig effekt</span>
                            <span className="fnum" style={{ padding: '0 8px 3px' }}><em>P</em><sub>n</sub></span>
                            <span className="fnum" style={{ padding: '3px 8px 0', borderTop: '2px solid currentColor', alignSelf: 'stretch', textAlign: 'center' }}><em>P</em><sub>t</sub></span>
                            <span className="flbl">Tillförd effekt</span>
                        </div>
                    </div>
                </div>
                <div className="mt-3 pt-3" style={{ borderTop: '1px solid var(--lab-line, rgba(15,22,32,0.14))' }}>
                    {dolj ? (
                        <span className="fnum-live" style={{ color: 'var(--lab-ink-soft)' }}>Gissa-läget: räkna själv innan du kör.</span>
                    ) : lage === 'lyft' ? (
                        <span className="fnum-live">
                            <span style={{ display: 'inline-block', marginRight: 28 }}><em>P</em><sub>n</sub> = {fmtA(dE)} J / {fmt(dt, 2)} s = {fmtA(P)} W</span>
                            <span style={{ display: 'inline-block' }}><em>η</em> = {fmt(eta, 2)} = {fmt(eta * 100, 0)} %</span>
                        </span>
                    ) : (
                        <span className="fnum-live">1 kWh = 1 000 W · 3 600 s = 3,6 · 10<sup>6</sup> J</span>
                    )}
                </div>
            </div>
        );

        // ════════════════════════════════════════════════════════
        //  FÄRDIGA FÖRSÖK
        // ════════════════════════════════════════════════════════
        const FORSOK = [
            { id: 'p5',  namn: 'Lyft med 5 W', sub: 'elmotor, 1 kg, 0,8 m', cfg: { lage: 'lyft', motor: 'el', Pt: 5, m: 1, h: 0.8 } },
            { id: 'p10', namn: 'Samma lyft med 10 W', sub: 'dubbel effekt', cfg: { lage: 'lyft', motor: 'el', Pt: 10, m: 1, h: 0.8 } },
            { id: 'gam', namn: 'Leksaksmotor', sub: '10 W, η = 25 %', cfg: { lage: 'lyft', motor: 'leksak', Pt: 10, m: 1, h: 0.8 } },
            { id: 'ny',  namn: 'Elmotor', sub: '10 W, η = 70 %', cfg: { lage: 'lyft', motor: 'el', Pt: 10, m: 1, h: 0.8 } },
            { id: 'gar', namn: 'Emilia går', sub: '60 kg, 4,0 m på 10 s', cfg: { lage: 'lyft', emilia: 'ga' } },
            { id: 'spr', namn: 'Emilia springer', sub: 'samma trappa på 2,5 s', cfg: { lage: 'lyft', emilia: 'spring' } },
            { id: 'lam', namn: 'Glödlampa och LED-lampa', sub: 'lika mycket ljus, ett dygn', cfg: { lage: 'app', A: 'glod', B: 'led', takt: 'h', tMax: 24 } },
            { id: 'glom', namn: 'Den glömda glödlampan', sub: '8,5 W i två dygn, mot en LED-lampa', cfg: { lage: 'app', A: 'glod85', B: 'led1', takt: 'dygn', tMax: 48 } },
            { id: 'kok', namn: 'Vattenkokare och akvarium', sub: 'stor effekt under kort tid', cfg: { lage: 'app', A: 'kok', B: 'akv', takt: 'h', tMax: 24 } },
            { id: 'tv',  namn: 'Tv i viloläge', sub: 'mot laddaren, under ett år', cfg: { lage: 'app', A: 'tv', B: 'lad', takt: 'vecka', tMax: 365 * 24 } },
        ];
        const EMILIA = { m: 60, h: 4.0, eta: 0.2 };
        const emiliaLyft = (vad) => {
            const dt = vad === 'spring' ? 2.5 : 10;
            const Pn = (EMILIA.m * G * EMILIA.h) / dt;
            return { m: EMILIA.m, h: EMILIA.h, eta: EMILIA.eta, Pt: Pn / EMILIA.eta };
        };

        // ════════════════════════════════════════════════════════
        //  GISSA-LÄGET
        // ════════════════════════════════════════════════════════
        const slump = (a) => a[Math.floor(Math.random() * a.length)];
        function nyUppgift(typ) {
            const motor = slump(MOTORER);
            // lagom långa lyft (cirka 2–15 s) så att det finns något att se
            for (let f = 0; f < 100; f++) {
                const Pt = slump([2, 3, 4, 5, 6, 8]);
                const m = slump([0.5, 1, 1.5, 2]);
                const h = slump([0.5, 0.6, 0.8, 1.0]);
                const T = (m * G * h) / (motor.eta * Pt);
                if (T < 2 || T > 15) continue;
                return { typ, motor: motor.k, eta: motor.eta, Pt, m, h, T };
            }
            return { typ, motor: 'el', eta: 0.7, Pt: 4, m: 1, h: 0.8, T: (1 * G * 0.8) / (0.7 * 4) };
        }

        // ════════════════════════════════════════════════════════
        //  HUVUDAPP
        // ════════════════════════════════════════════════════════
        const App = () => {
            const params = new URLSearchParams(location.search);
            const [lage, setLage] = useState(params.get('lage') === 'apparater' ? 'app' : 'lyft');
            const [motor, setMotor] = useState('el');
            const [Pt, setPt] = useState(8);
            const [m, setM] = useState(1);
            const [h, setH] = useState(0.8);
            const [emilia, setEmilia] = useState(null);       // null | 'ga' | 'spring'
            const [appA, setAppA] = useState('glod');
            const [appB, setAppB] = useState('led');
            const [takt, setTakt] = useState('h');
            const [tMaxApp, setTMaxApp] = useState(24);
            const [pris, setPris] = useState(1.5);
            const [show, setShow] = useState({ ir: false, forra: true });
            const [togglesOpen, setTogglesOpen] = useState(true);
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [kor, setKor] = useState(false);
            const [, setFrame] = useState(0);
            const [ghost, setGhost] = useState(null);
            const [gissa, setGissa] = useState(null);
            const [svarTxt, setSvarTxt] = useState('');
            const [svarStatus, setSvarStatus] = useState(null);
            const [poang, setPoang] = useState({ ratt: 0, totalt: 0, svit: 0 });

            const sceneWrapRef = useRef(null);
            const svgRef = useRef(null);
            const korRef = useRef(false);
            const rafRef = useRef(null);
            const lastRef = useRef(null);
            const tRef = useRef(0);                 // simulerad tid: s (lyft) eller h (apparater)
            const flygA = useRef([]), flygB = useRef([]);
            const raknA = useRef(0), raknB = useRef(0);
            const idRef = useRef(1);
            const senasteRef = useRef(null);
            const gissaRef = useRef(null);

            const motorEta = MOTORER.find((x) => x.k === motor).eta;
            const lyft = emilia ? emiliaLyft(emilia) : { m, h, Pt, eta: motorEta };
            const lyftRef = useRef(lyft); lyftRef.current = lyft;
            const A = app(appA), B = app(appB);
            const taktH = TAKTER.find((x) => x.k === takt).hPerS;
            const appRef = useRef(null); appRef.current = { A, B, taktH, tMax: tMaxApp };
            const lageRef = useRef(lage); lageRef.current = lage;

            // Brickans värde: lagom många brickor per sekund
            // Emilia har samma brickvärde när hon går och springer, så att samma
            // energi alltid är lika många brickor. Apparaterna får minst cirka 20
            // brickor under hela försöket.
            const brickJ = lage === 'lyft'
                ? (emilia ? 200 : M.brickVarde(lyft.Pt, 16))
                : Math.min(M.brickVarde(Math.max(A.P, B.P) * taktH, 14, 0),
                           M.snyggtNedat(Math.max(M.apparatVid(A, tMaxApp).Et, M.apparatVid(B, tMaxApp).Et) / 20));
            const brickRef = useRef(brickJ); brickRef.current = brickJ;

            const nollstall = () => {
                if (senasteRef.current) { setGhost(senasteRef.current); senasteRef.current = null; }
                tRef.current = 0; flygA.current = []; flygB.current = []; raknA.current = 0; raknB.current = 0;
                lastRef.current = null;
                setFrame((n) => n + 1);
            };
            useEffect(() => { if (!korRef.current) nollstall(); }, [lage, motor, Pt, m, h, emilia, appA, appB, takt, tMaxApp]);
            useEffect(() => { setGhost(null); senasteRef.current = null; }, [lage]);

            // ── Brickorna: en ny bricka för varje brickvärde energi som tillförs ──
            const RESTID = 1.5;     // s (verklig tid) för en bricka genom diagrammet
            const spawn = (lista, rakn, Etot, eta, g) => {
                const n = Math.floor(Etot / brickRef.current + 1e-9);
                while (rakn.current < n) {
                    const k = rakn.current++;
                    lista.current.push({ id: idRef.current++, u: 0, nyttig: M.arNyttig(k, eta), g, x: g.sx0, y: g.y0, op: 1 });
                }
            };
            const flytta = (lista, dt) => {
                lista.current = lista.current.filter((t) => {
                    t.u += dt / RESTID;
                    const p = brickPunkt(t.g, t.nyttig, Math.min(1, t.u));
                    t.x = p.x; t.y = p.y;
                    t.op = t.u > 0.92 ? Math.max(0, (1 - t.u) / 0.08) : 1;
                    return t.u < 1;
                });
            };

            useEffect(() => {
                const loop = (ts) => {
                    if (lastRef.current == null) lastRef.current = ts;
                    const dt = Math.min((ts - lastRef.current) / 1000, 0.05);
                    lastRef.current = ts;
                    if (korRef.current) {
                        if (lageRef.current === 'lyft') {
                            const L = lyftRef.current;
                            const d = M.lyftData(L);
                            tRef.current = Math.min(d.T, tRef.current + dt);
                            const s = M.lyftVid(L, tRef.current);
                            const skala = emiliaRef.current ? 100 / 5000 : 5;
                            spawn(flygA, raknA, s.Et, L.eta, sankeyGeo(230, Math.max(2, L.Pt * skala), L.eta, false));
                            if (s.klar) avsluta();
                        } else {
                            const a = appRef.current;
                            tRef.current = Math.min(a.tMax, tRef.current + dt * a.taktH);
                            const skala = 70 / Math.max(a.A.P, a.B.P);
                            spawn(flygA, raknA, M.apparatVid(a.A, tRef.current).Et, a.A.eta, sankeyGeo(150, Math.max(2, a.A.P * skala), a.A.eta, true));
                            spawn(flygB, raknB, M.apparatVid(a.B, tRef.current).Et, a.B.eta, sankeyGeo(320, Math.max(2, a.B.P * skala), a.B.eta, true));
                            if (tRef.current >= a.tMax) avsluta();
                        }
                    }
                    flytta(flygA, dt); flytta(flygB, dt);
                    setFrame((n) => n + 1);
                    if (korRef.current || flygA.current.length || flygB.current.length) rafRef.current = requestAnimationFrame(loop);
                    else { rafRef.current = null; lastRef.current = null; }
                };
                if ((kor || flygA.current.length || flygB.current.length) && !rafRef.current) rafRef.current = requestAnimationFrame(loop);
                return () => { if (rafRef.current) { cancelAnimationFrame(rafRef.current); rafRef.current = null; } };
            }, [kor]);
            const emiliaRef = useRef(emilia); emiliaRef.current = emilia;

            const avsluta = () => {
                korRef.current = false; setKor(false);
                if (lageRef.current === 'lyft') {
                    const L = lyftRef.current, d = M.lyftData(L);
                    senasteRef.current = { Pt: L.Pt, Pn: d.Pn, T: d.T, Et: d.Et };
                    if (gissaRef.current) ratta();
                }
            };
            const starta = () => {
                const klar = lage === 'lyft' ? tRef.current >= M.lyftData(lyft).T - 1e-9 : tRef.current >= tMaxApp - 1e-9;
                if (klar || tRef.current > 0) nollstall();
                korRef.current = true; setKor(true);
            };
            const pausa = () => { korRef.current = false; setKor(false); };
            const fortsatt = () => { korRef.current = true; setKor(true); };
            const borjaOm = () => { korRef.current = false; setKor(false); nollstall(); };

            const korForsok = (f) => {
                korRef.current = false; setKor(false);
                const c = f.cfg;
                setLage(c.lage);
                if (c.lage === 'lyft') {
                    setEmilia(c.emilia || null);
                    if (!c.emilia) { setMotor(c.motor); setPt(c.Pt); setM(c.m); setH(c.h); }
                } else {
                    setAppA(c.A); setAppB(c.B); setTakt(c.takt); setTMaxApp(c.tMax);
                }
                setTimeout(() => { nollstall(); korRef.current = true; setKor(true); }, 40);
            };

            // ── Gissa-läget ──
            const startaGissa = (typ) => {
                const u = nyUppgift(typ);
                korRef.current = false; setKor(false);
                setLage('lyft'); setEmilia(null); setMotor(u.motor); setPt(u.Pt); setM(u.m); setH(u.h);
                setGissa(u); setSvarTxt(''); setSvarStatus(null); gissaRef.current = null;
                setGhost(null); senasteRef.current = null;
                setTimeout(() => nollstall(), 30);
            };
            const kolla = () => {
                const n = parseFloat(svarTxt.replace(',', '.').replace('−', '-'));
                if (!isFinite(n)) { setSvarStatus({ ratt: false, text: 'Skriv in ett tal, till exempel 12,5.' }); return; }
                gissaRef.current = { svar: n, u: gissa };
                setSvarStatus('kor');
                nollstall(); korRef.current = true; setKor(true);
            };
            function ratta() {
                const { svar, u } = gissaRef.current;
                gissaRef.current = null;
                const d = M.lyftData({ m: u.m, h: u.h, Pt: u.Pt, eta: u.eta });
                const facit = u.typ === 'tid' ? d.T : d.Pn;
                const ratt = Math.abs(svar - facit) <= Math.max(0.03 * Math.abs(facit), 0.05);
                let text;
                if (u.typ === 'tid') {
                    text = `${ratt ? 'Rätt!' : 'Inte riktigt.'} Nyttig effekt P_n = η · P_t = ${fmt(u.eta, 2)} · ${u.Pt} W = ${fmt(d.Pn, 2)} W. Den nyttiga energin är lägesenergin E_n = m · g · h = ${fmt(u.m, 1)} · 9,82 · ${fmt(u.h, 1)} = ${fmt(d.En, 2)} J, så Δt = E_n / P_n = ${fmt(d.En, 2)} / ${fmt(d.Pn, 2)} = ${fmt(d.T, 2)} s.`;
                    if (!ratt && Math.abs(svar - d.En / u.Pt) < 0.03 * d.En / u.Pt) text += ' Du räknade med hela den tillförda effekten. Bara den nyttiga delen lyfter vikten.';
                } else {
                    text = `${ratt ? 'Rätt!' : 'Inte riktigt.'} Den nyttiga energin är lägesenergin E_n = m · g · h = ${fmt(d.En, 2)} J, och den omvandlades på ${fmt(d.T, 2)} s. P_n = E_n / Δt = ${fmt(d.En, 2)} / ${fmt(d.T, 2)} = ${fmt(d.Pn, 2)} W. Verkningsgraden blir η = P_n / P_t = ${fmt(d.Pn, 2)} / ${u.Pt} = ${fmt(u.eta, 2)}.`;
                    if (!ratt && Math.abs(svar - u.Pt) < 0.03 * u.Pt) text += ' Det är den tillförda effekten. Den nyttiga är mindre, eftersom en del blir värme.';
                }
                setSvarStatus({ ratt, text });
                setPoang((p) => ({ ratt: p.ratt + (ratt ? 1 : 0), totalt: p.totalt + 1, svit: ratt ? p.svit + 1 : 0 }));
            }
            const avslutaGissa = () => { setGissa(null); setSvarStatus(null); gissaRef.current = null; };
            const dolj = !!gissa && (svarStatus === null || svarStatus === 'kor');

            // ── Fullskärm ──
            useEffect(() => {
                const handler = () => setIsFullscreen(document.fullscreenElement === sceneWrapRef.current || document.webkitFullscreenElement === sceneWrapRef.current);
                document.addEventListener('fullscreenchange', handler);
                document.addEventListener('webkitfullscreenchange', handler);
                return () => { document.removeEventListener('fullscreenchange', handler); document.removeEventListener('webkitfullscreenchange', handler); };
            }, []);
            const toggleFullscreen = () => {
                const el = sceneWrapRef.current;
                if (!el) return;
                if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
            };

            const d = M.lyftData(lyft);
            const sim = lage === 'lyft' ? M.lyftVid(lyft, tRef.current) : null;
            const appSim = { t: tRef.current, tMax: tMaxApp, pris };
            const tShow = (key) => setShow((sh) => ({ ...sh, [key]: !sh[key] }));
            const lastReglage = kor || !!gissa;
            const klarNu = lage === 'lyft' ? tRef.current >= d.T - 1e-9 : tRef.current >= tMaxApp - 1e-9;
            const pagar = tRef.current > 0 && !klarNu;
            const startEtikett = kor ? 'Pausa' : pagar ? 'Fortsätt' : 'Starta';
            const startKlick = kor ? pausa : pagar ? fortsatt : starta;
            const kalla = emilia ? 'Maten' : 'Eluttag';

            const reglage = (Sl, kompakt) => {
                const rad = (label, value, min, max, step, onChange, fmtFn, unit) => (
                    <Sl label={label} value={value} min={min} max={max} step={step} onChange={onChange} disabled={lastReglage}
                        {...(kompakt ? { valueNode: <NumInput value={value} min={min} max={max} fmtFn={fmtFn} unit={unit} disabled={lastReglage} onCommit={onChange} /> } : {})}>
                        {!kompakt && <NumInput value={value} min={min} max={max} fmtFn={fmtFn} unit={unit} disabled={lastReglage} onCommit={onChange} />}
                    </Sl>
                );
                if (lage === 'lyft') {
                    if (emilia) return <p className="text-xs mb-1" style={{ color: 'var(--lab-ink-soft)' }}>Emilia väger 60 kg och trappan är 4,0 m hög. Välj ett annat försök eller läget Lyft för att ställa in egna värden.</p>;
                    return (
                        <React.Fragment>
                            {rad('Tillförd effekt <em>P</em><sub>t</sub>', Pt, 2, 20, 0.5, setPt, (x) => fmt(x, 1), 'W')}
                            {rad('Massa <em>m</em>', m, 0.2, 2, 0.1, setM, (x) => fmt(x, 1), 'kg')}
                            {rad('Höjd <em>h</em>', h, 0.2, 1.0, 0.05, setH, (x) => fmt(x, 2), 'm')}
                        </React.Fragment>
                    );
                }
                return rad('Elpris', pris, 0.5, 4, 0.05, setPris, (x) => fmt(x, 2), 'kr/kWh');
            };

            const sceneToggles = () => {
                if (!togglesOpen) return (
                    <button className="st-show-btn" onClick={() => setTogglesOpen(true)} aria-label="Visa inställningar" title="Visa inställningar" aria-expanded="false">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" aria-hidden="true">
                            <line x1="4" y1="8" x2="20" y2="8" /><circle cx="14.5" cy="8" r="2.7" fill="currentColor" stroke="none" />
                            <line x1="4" y1="16" x2="20" y2="16" /><circle cx="9.5" cy="16" r="2.7" fill="currentColor" stroke="none" />
                        </svg>
                    </button>
                );
                return (
                    <div className="scene-toggles">
                        <button className="st-hide" onClick={() => setTogglesOpen(false)} aria-label="Dölj inställningar" title="Dölj inställningar" aria-expanded="true">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
                        </button>
                        <div className="st-title">Visa</div>
                        <label><input type="checkbox" checked={show.ir} onChange={() => tShow('ir')} /><span>Värmekamera</span></label>
                        <label><input type="checkbox" checked={show.forra} onChange={() => tShow('forra')} disabled={lage !== 'lyft'} /><span>Förra lyftet</span></label>
                        {isFullscreen && (
                            <React.Fragment>
                                <div className="st-title mt">Reglage</div>
                                <div className="st-sliders">{reglage(StSlider, true)}</div>
                                <div className="st-actions">
                                    <button className="btn-start" onClick={startKlick} disabled={!!gissa}>{startEtikett}</button>
                                    <button className="btn-toggle" onClick={borjaOm} disabled={!!gissa}>Börja om</button>
                                </div>
                            </React.Fragment>
                        )}
                    </div>
                );
            };

            return (
                <div className="min-h-screen dark-container px-4 md:px-8 pb-12" style={{ fontFamily: "'DM Sans', sans-serif" }}>
                    <div className="max-w-7xl mx-auto pt-6">
                        <div className="breadcrumb mb-4" style={{ fontSize: 13 }}>
                            <a href="index.html">Hem</a> / <a href="katalog.html#fy1">Fysik nivå 1</a> / Effekt och verkningsgrad
                        </div>
                        <h1 className="text-3xl md:text-4xl font-black tracking-tight" style={{ color: 'var(--lab-ink)' }}>Effekt och verkningsgrad</h1>
                        <p className="mt-2 mb-5" style={{ color: 'var(--lab-ink-soft)', maxWidth: 860 }}>
                            <strong>Energi</strong> är hur mycket som omvandlas, <strong>effekt</strong> är hur snabbt det går. Här strömmar
                            energin som brickor genom ett energiflödesdiagram: antalet brickor är energin och hur många brickor som
                            strömmar per sekund är effekten. Vid apparaten delar sig flödet. En del blir det apparaten är till för, resten
                            blir värme, och andelen som blir nytta är <strong>verkningsgraden</strong>. Lyft en vikt med en motor, låt Emilia
                            springa uppför en trappa, eller jämför vad lampor och andra apparater kostar att ha på.
                        </p>

                        <FormelKort lage={lage} P={d.Pn} dE={sim ? sim.En : 0} dt={sim ? sim.t : 0} eta={lyft.eta} dolj={dolj} />

                        <main className="flex flex-col lg:flex-row gap-6">
                            <div className="lg:w-2/3 xl:w-3/4 order-1">
                                <div className="scene-wrap" data-theme="ljusPapper" ref={sceneWrapRef}>
                                    <Scen lage={lage} lyft={lyft} sim={sim || { t: 0, y: 0, Et: 0, En: 0, klar: false }} appA={appA} appB={appB} appSim={appSim}
                                          show={show} flygA={flygA.current} flygB={flygB.current} ghost={ghost} svgRef={svgRef}
                                          emilia={emilia} dolj={dolj} kalla={kalla} brick={brickJ} />
                                    {sceneToggles()}
                                    <button className="fs-btn" onClick={toggleFullscreen} aria-label="Fullskärm" title={isFullscreen ? 'Lämna fullskärm' : 'Fullskärm'}>
                                        {isFullscreen ? (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M9 3v6H3" /><path d="M15 21v-6h6" /><path d="M21 9h-6V3" /><path d="M3 15h6v6" />
                                            </svg>
                                        ) : (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M3 9V3h6" /><path d="M21 9V3h-6" /><path d="M3 15v6h6" /><path d="M21 15v6h-6" />
                                            </svg>
                                        )}
                                    </button>
                                </div>
                                <p className="text-sm mt-2" style={{ color: 'var(--lab-ink-soft)' }}>
                                    {lage === 'lyft' && emilia
                                        ? 'Exempel 1 i genomgången söker den nyttiga effekten, den som ökar Emilias lägesenergi: 0,24 kW när hon går och 0,94 kW när hon springer. Kroppen har en verkningsgrad på ungefär 20 %, så den tillförda effekten från maten är omkring fem gånger så stor, och resten blir värme.'
                                        : lage === 'lyft'
                                        ? 'Motorn lyfter vikten med jämn fart till den röda linjen. Energimätaren visar den tillförda effekten och energin, och stoppuret tiden. Igångsättningen försummas.'
                                        : 'Tiden snabbspolas. Energin räknas i kilowattimmar, och kostnaden räknas ut med elpriset. Effekterna och verkningsgraderna är ungefärliga.'}
                                </p>
                            </div>

                            <div className="lg:w-1/3 xl:w-1/4 order-2">
                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <div className="flbl mb-2" style={{ textAlign: 'left' }}>Försöket</div>
                                    <div className="mode-seg mb-3">
                                        <button className={lage === 'lyft' ? 'active' : ''} disabled={lastReglage} onClick={() => { setLage('lyft'); setEmilia(null); }}>Lyft</button>
                                        <button className={lage === 'app' ? 'active' : ''} disabled={lastReglage} onClick={() => setLage('app')}>Apparater</button>
                                    </div>
                                    {lage === 'lyft' && !emilia && (
                                        <div className="mode-seg">
                                            {MOTORER.map((x) => (
                                                <button key={x.k} className={motor === x.k ? 'active' : ''} disabled={lastReglage} onClick={() => setMotor(x.k)}>
                                                    {x.namn}<span className="sub"><em>η</em> = {fmt(x.eta * 100, 0)} %</span></button>
                                            ))}
                                        </div>
                                    )}
                                    {lage === 'app' && (
                                        <div className="flex flex-col gap-2">
                                            {[['A', appA, setAppA], ['B', appB, setAppB]].map(([bok, v, set]) => (
                                                <label key={bok} className="text-sm flex items-center gap-2" style={{ color: 'var(--lab-ink)' }}>
                                                    <span style={{ fontWeight: 700, width: 14 }}>{bok}</span>
                                                    <select className="flex-1 num-in" style={{ width: 'auto', textAlign: 'left', fontFamily: 'inherit' }} value={v} disabled={lastReglage} onChange={(e) => set(e.target.value)}>
                                                        {APPARATER.map((x) => <option key={x.k} value={x.k}>{x.namn}</option>)}
                                                    </select>
                                                </label>
                                            ))}
                                            <div className="mode-seg mt-1">
                                                {TAKTER.map((x) => (
                                                    <button key={x.k} className={takt === x.k ? 'active' : ''} disabled={kor} onClick={() => setTakt(x.k)} style={{ fontSize: 12 }}>{x.namn}</button>
                                                ))}
                                            </div>
                                            <div className="mode-seg">
                                                {[[1, '1 h'], [24, '1 dygn'], [48, '2 dygn'], [365 * 24, '1 år']].map(([t, n]) => (
                                                    <button key={t} className={tMaxApp === t ? 'active' : ''} disabled={kor} onClick={() => setTMaxApp(t)} style={{ fontSize: 12 }}>{n}</button>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <div className="glass-card rounded-xl p-3 mb-3">
                                    {!isFullscreen && reglage(Slider, false)}
                                    {isFullscreen && <p className="text-xs mb-2" style={{ color: 'var(--lab-ink-soft)' }}>Reglagen finns i rutan uppe till höger i fullskärm.</p>}
                                    <div className="flex gap-2 mt-2">
                                        <button className="btn-start flex-1" onClick={startKlick} disabled={!!gissa}>{startEtikett}</button>
                                        <button className="btn-toggle flex-1" onClick={borjaOm} disabled={!!gissa}>Börja om</button>
                                    </div>
                                </div>

                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <div className="flbl mb-2" style={{ textAlign: 'left' }}>Färdiga försök</div>
                                    <div className="forsok-lista">
                                        {FORSOK.map((f) => (
                                            <button key={f.id} className="forsok" disabled={!!gissa} onClick={() => korForsok(f)}>
                                                {f.namn}<span className="sub">{f.sub}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <div className="flex items-center justify-between mb-2">
                                        <div className="flbl" style={{ textAlign: 'left' }}>Gissa-läge</div>
                                        {poang.totalt > 0 && <div className="text-xs" style={{ color: 'var(--lab-ink-soft)' }}>{poang.ratt} av {poang.totalt} rätt{poang.svit > 1 ? `, ${poang.svit} i rad` : ''}</div>}
                                    </div>
                                    {!gissa && (
                                        <div className="flex flex-col gap-2">
                                            <button className="btn-toggle" onClick={() => startaGissa('tid')}>Hur länge tar lyftet?</button>
                                            <button className="btn-toggle" onClick={() => startaGissa('effekt')}>Räkna den nyttiga effekten</button>
                                        </div>
                                    )}
                                    {gissa && (
                                        <div>
                                            {gissa.typ === 'tid' ? (
                                                <p className="text-sm mb-2" style={{ color: 'var(--lab-ink)' }}>
                                                    En {MOTORER.find((x) => x.k === gissa.motor).namn.toLowerCase()} med verkningsgraden <em>η</em> = {fmt(gissa.eta * 100, 0)} %
                                                    får den tillförda effekten <em>P</em><sub>t</sub> = {gissa.Pt} W och lyfter {fmt(gissa.m, 1)} kg till höjden {fmt(gissa.h, 1)} m.
                                                    Hur lång tid tar lyftet?
                                                </p>
                                            ) : (
                                                <p className="text-sm mb-2" style={{ color: 'var(--lab-ink)' }}>
                                                    En motor får den tillförda effekten <em>P</em><sub>t</sub> = {gissa.Pt} W och lyfter {fmt(gissa.m, 1)} kg till höjden {fmt(gissa.h, 1)} m.
                                                    Stoppuret visar att lyftet tar {fmt(gissa.T, 2)} s. Hur stor är den nyttiga effekten?
                                                </p>
                                            )}
                                            <div className="flex items-center gap-2 mb-2">
                                                {gissa.typ === 'tid' ? <span>Δ<em>t</em> =</span> : <span><em>P</em><sub>n</sub> =</span>}
                                                <input className="gissa-in" type="text" inputMode="decimal" value={svarTxt} disabled={svarStatus !== null}
                                                       onChange={(e) => setSvarTxt(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter' && svarStatus === null) kolla(); }} />
                                                <span>{gissa.typ === 'tid' ? 's' : 'W'}</span>
                                                <button className="btn-start" onClick={kolla} disabled={svarStatus !== null}>Kolla</button>
                                            </div>
                                            {svarStatus === 'kor' && <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>Lyftet körs …</p>}
                                            {svarStatus && svarStatus !== 'kor' && <p className="text-sm mb-2" style={{ color: svarStatus.ratt ? '#15803d' : 'var(--lab-accent)' }}><Fx text={svarStatus.text} /></p>}
                                            <div className="flex gap-2">
                                                {svarStatus && svarStatus !== 'kor' && <button className="btn-toggle flex-1" onClick={() => startaGissa(gissa.typ)}>Ny uppgift</button>}
                                                <button className="btn-toggle flex-1" onClick={avslutaGissa} disabled={svarStatus === 'kor'}>Avsluta</button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </main>

                        <div className="grid md:grid-cols-3 gap-4 mt-6">
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Energi och effekt</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Energin är hur mycket som omvandlas och mäts i joule. Effekten är hur snabbt det sker, <em>P</em> = <Brak t={<span>Δ<em>E</em></span>} n={<span>Δ<em>t</em></span>} />,
                                    och mäts i watt: 1 W = 1 J/s. I diagrammet över energin mot tiden är effekten lutningen. Samma lyft med dubbel effekt
                                    kräver samma energi men tar halva tiden.
                                </p>
                            </div>
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Verkningsgrad</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Verkningsgraden är andelen av den tillförda energin som blir nyttig, <em>η</em> = <Brak t={<span><em>E</em><sub>n</sub></span>} n={<span><em>E</em><sub>t</sub></span>} /> = <Brak t={<span><em>P</em><sub>n</sub></span>} n={<span><em>P</em><sub>t</sub></span>} />.
                                    Den ligger alltid mellan 0 och 1. Resten blir oftast värme, och den försvinner inte: i energiflödesdiagrammet
                                    är nytta plus värme alltid lika många brickor som det tillförda.
                                </p>
                            </div>
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Kilowattimmar</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    På elräkningen betalar man för energi, inte effekt. 1 kWh är energin som omvandlas på en timme med effekten 1 000 W:
                                    1 kWh = 1 000 W · 3 600 s = 3,6 · 10<sup>6</sup> J. En apparat med liten effekt kan därför kosta mer än en med stor
                                    effekt, om den är på mycket längre.
                                </p>
                            </div>
                        </div>

                        <details className="glass-card rounded-xl p-4 mt-4">
                            <summary className="accordion-head" style={{ color: 'var(--lab-ink)' }}>
                                <span>Vanliga missuppfattningar</span><span style={{ color: 'var(--lab-ink-muted)' }}>▾</span>
                            </summary>
                            <ul className="mt-3 space-y-2 text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                <li><strong>”Effekt och energi är samma sak.”</strong> Nej. Energi är hur mycket, effekt är hur snabbt. Emilias lägesenergi
                                    ökar lika mycket när hon går som när hon springer, men den nyttiga effekten blir fyra gånger så stor när det tar en fjärdedel av tiden.</li>
                                <li><strong>”En apparat med stor effekt kostar alltid mest.”</strong> Nej, det beror också på hur länge den är på.
                                    Jämför vattenkokaren och laddaren under ett dygn.</li>
                                <li><strong>”Energi försvinner i en dålig motor.”</strong> Nej, den blir värme. Verkningsgraden säger hur stor andel
                                    som blir det man vill ha.</li>
                                <li><strong>”Verkningsgraden kan bli större än 100 %.”</strong> Aldrig. Då skulle apparaten ge ut mer energi än den får.</li>
                                <li><strong>”kW och kWh är samma enhet.”</strong> Nej. kW är effekt (hur snabbt), kWh är energi (hur mycket).</li>
                            </ul>
                        </details>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script src="feedback.js" defer></script>
    <script src="sim-dock.js" defer></script>
    <script src="data/katalog.js"></script>
    <script src="section-nav.js"></script>
    <!-- Cloudflare Web Analytics: cookiefri besöksmätning, se CLAUDE.md. -->
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js"
            data-cf-beacon='{"token": "366677ecfe014a76b73f5bc78a489e0e"}'></script>
</body>
