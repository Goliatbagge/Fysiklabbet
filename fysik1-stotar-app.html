    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // ═══════════════════════════════════════════════
        //  Elastisk och oelastisk stöt (fy1-4.8)
        //
        //  En dimension: två vagnar på en luftkuddebana. Två dimensioner:
        //  två puckar på ett airhockeybord sett uppifrån. Stöten räknas ut
        //  exakt (kontakttiden ur rörelseekvationerna), så positionen är en
        //  ren funktion av tiden och tidslinjen kan dras fram och tillbaka.
        //
        //  Beteckningarna följer genomgången:
        //    elastisk:  m_A · v_A0 + m_B · v_B0 = m_A · v_A + m_B · v_B
        //    oelastisk: m_A · v_A + m_B · v_B = (m_A + m_B) · v
        //  Rörelsemängd p = m · v (kg · m/s), rörelseenergi E_k = m · v²/2.
        //
        //  Den pedagogiska kärnan är rörelsemängdsdiagrammet: pilarna för
        //  A och B läggs efter varandra, och summapilen (streckad) är lika
        //  lång före och efter stöten. Energistaplarna visar att
        //  rörelseenergin bara bevaras i den elastiska stöten.
        // ═══════════════════════════════════════════════

        // Decimalkomma, äkta minustecken, exakt noll utan decimaler
        const fmt = (num, d = 2) => {
            if (num === null || num === undefined || !isFinite(num)) return '–';
            const s = (Math.round(num * 1e9) / 1e9).toFixed(d);
            if (parseFloat(s) === 0) return '0';
            return s.replace('.', ',').replace('-', '−');
        };
        // Utan nollor i slutet (0,4, 0,25, −1,5)
        const fmtk = (num, d = 3) => {
            if (!isFinite(num)) return '–';
            const s = num.toFixed(d);
            if (parseFloat(s) === 0) return '0';
            return String(parseFloat(s)).replace('.', ',').replace('-', '−');
        };
        const par = (s) => s.startsWith('−') ? '(' + s + ')' : s;
        const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
        const snapv = (x, s = 0.05) => Math.round(x / s) * s;
        const rnd = (arr) => arr[Math.floor(Math.random() * arr.length)];

        // Vektorer (en dimension: y = 0)
        const V = (x, y = 0) => ({ x, y });
        const add = (a, b) => V(a.x + b.x, a.y + b.y);
        const sub = (a, b) => V(a.x - b.x, a.y - b.y);
        const mul = (a, k) => V(a.x * k, a.y * k);
        const dot = (a, b) => a.x * b.x + a.y * b.y;
        const len = (a) => Math.hypot(a.x, a.y);

        const COL = {
            ink: '#0f1620',
            muted: '#5a6170',
            A: '#1f5fa8', Aljus: '#5b8fd0', Amork: '#16467d',
            B: '#c2410c', Bljus: '#e3793f', Bmork: '#8f2f08',
            tot: '#0f1620',
            lika: '#2f8f4e',
            varme: '#8a8f99',
            fjader: '#7b3fa0',
            cm: '#0f1620',
        };

        // ── Modellen i en dimension ──
        const TRACK = 2.0;            // banans längd (m)
        const GL = 0.16;              // vagnens längd (m)
        const KANT = { elastisk: 0.02, oelastisk: 0.006, isar: 0.01 };   // studsfjäder, kardborre, fjäder
        const D1 = (typ) => GL + 2 * KANT[typ];   // avstånd mellan mittpunkterna vid kontakt
        const XMIN = GL / 2 + 0.03, XMAX = TRACK - GL / 2 - 0.03;
        const T_REL = 0.6;            // isärknuffen: tråden går av

        const tEndUr = (pos, stopp, cap) => {
            for (let t = 0; t <= cap; t += 0.002) {
                if (stopp(pos(t))) return Math.max(t - 0.002, 0);
            }
            return cap;
        };

        const modell1D = (P) => {
            const { typ, mA, mB } = P;
            const D = D1(typ), M = mA + mB;
            let xA0 = P.xA0, xB0 = P.xB0, vA0 = P.vA0, vB0 = P.vB0, tc = null, vA1 = null, vB1 = null;
            if (typ === 'isar') {
                xA0 = P.xc - D / 2; xB0 = P.xc + D / 2; vA0 = 0; vB0 = 0; tc = T_REL;
                vA1 = -Math.sqrt(2 * P.E * mB / (mA * M));
                vB1 = Math.sqrt(2 * P.E * mA / (mB * M));
            } else {
                const w = vB0 - vA0, gap = xB0 - xA0 - D;
                if (w < -1e-9) tc = Math.max(0, gap / -w);
                if (tc !== null) {
                    if (typ === 'elastisk') {
                        vA1 = ((mA - mB) * vA0 + 2 * mB * vB0) / M;
                        vB1 = ((mB - mA) * vB0 + 2 * mA * vA0) / M;
                    } else {
                        vA1 = vB1 = (mA * vA0 + mB * vB0) / M;
                    }
                }
            }
            const pos = (t) => {
                if (tc === null || t <= tc) return { A: V(xA0 + vA0 * t), B: V(xB0 + vB0 * t) };
                const d = t - tc;
                return { A: V(xA0 + vA0 * tc + vA1 * d), B: V(xB0 + vB0 * tc + vB1 * d) };
            };
            const stillaEfter = tc !== null && Math.abs(vA1) < 1e-9 && Math.abs(vB1) < 1e-9;
            const stillaFore = Math.abs(vA0) < 1e-9 && Math.abs(vB0) < 1e-9 && typ !== 'isar';
            const cap = stillaFore ? 1.5 : tc === null ? 8 : stillaEfter ? tc + 1.8 : Math.min(tc + 5, 22);
            const tEnd = tEndUr(pos, (p) => p.A.x < XMIN || p.B.x > XMAX, cap);
            const harStot = tc !== null && tc <= tEnd + 1e-9;
            return {
                dim: '1d', typ, mA, mB, tc, harStot, tEnd, pos,
                fore: { vA: V(vA0), vB: V(vB0) },
                efter: harStot ? { vA: V(vA1), vB: V(vB1) } : null,
                E: typ === 'isar' ? P.E : 0,
                start: { A: V(xA0), B: V(xB0) },
            };
        };

        // ── Modellen i två dimensioner ──
        const TW = 1.40, TH = 1.25;   // bordets yta (m)
        const radie = (m) => 0.045 * Math.sqrt(m / 0.3);

        const modell2D = (P) => {
            const { typ, mA, mB } = P;
            const rA = radie(mA), rB = radie(mB), R = rA + rB, M = mA + mB;
            const pA0 = P.A, pB0 = P.B, vA0 = P.vA, vB0 = P.vB;
            const d = sub(pB0, pA0), w = sub(vB0, vA0);
            const a = dot(w, w), b = 2 * dot(d, w), c = dot(d, d) - R * R;
            let tc = null, vA1 = null, vB1 = null, n = null;
            if (a > 1e-12 && b < 0) {
                const disk = b * b - 4 * a * c;
                if (disk >= 0) {
                    const t = (-b - Math.sqrt(disk)) / (2 * a);
                    if (t >= -1e-9) tc = Math.max(0, t);
                }
            }
            if (tc !== null) {
                n = mul(add(d, mul(w, tc)), 1 / R);
                if (typ === 'elastisk') {
                    const rel = dot(sub(vA0, vB0), n);
                    vA1 = sub(vA0, mul(n, 2 * mB / M * rel));
                    vB1 = add(vB0, mul(n, 2 * mA / M * rel));
                } else {
                    vA1 = vB1 = mul(add(mul(vA0, mA), mul(vB0, mB)), 1 / M);
                }
            }
            const pos = (t) => {
                if (tc === null || t <= tc) return { A: add(pA0, mul(vA0, t)), B: add(pB0, mul(vB0, t)) };
                const dt = t - tc;
                return { A: add(add(pA0, mul(vA0, tc)), mul(vA1, dt)), B: add(add(pB0, mul(vB0, tc)), mul(vB1, dt)) };
            };
            const ute = (p, r) => p.x < r || p.x > TW - r || p.y < r || p.y > TH - r;
            const stillaFore = len(vA0) < 1e-9 && len(vB0) < 1e-9;
            const stillaEfter = tc !== null && len(vA1) < 1e-9 && len(vB1) < 1e-9;
            const cap = stillaFore ? 1.5 : tc === null ? 8 : stillaEfter ? tc + 1.8 : Math.min(tc + 5, 22);
            const tEnd = tEndUr(pos, (p) => ute(p.A, rA) || ute(p.B, rB), cap);
            const harStot = tc !== null && tc <= tEnd + 1e-9;
            return {
                dim: '2d', typ, mA, mB, rA, rB, tc, harStot, tEnd, pos, n,
                fore: { vA: vA0, vB: vB0 },
                efter: harStot ? { vA: vA1, vB: vB1 } : null,
                E: 0,
                start: { A: pA0, B: pB0 },
            };
        };

        // Tillstånd vid tiden t: hastigheter, rörelsemängd och energi
        const tillstand = (M, t) => {
            const efter = M.harStot && t >= M.tc;
            const v = efter ? M.efter : M.fore;
            const pA = mul(v.vA, M.mA), pB = mul(v.vB, M.mB);
            const EA = M.mA * dot(v.vA, v.vA) / 2, EB = M.mB * dot(v.vB, v.vB) / 2;
            return { efter, vA: v.vA, vB: v.vB, pA, pB, p: add(pA, pB), EA, EB };
        };
        const energiFore = (M) => M.mA * dot(M.fore.vA, M.fore.vA) / 2 + M.mB * dot(M.fore.vB, M.fore.vB) / 2;

        // ── Färdiga försök ──
        const FORSOK_1D = [
            { id: 'lika', namn: 'Lika massor, B står still', typ: 'elastisk', mA: 0.30, mB: 0.30, vA0: 0.50, vB0: 0, xA0: 0.45, xB0: 1.10,
              text: 'Vagn A stannar helt och vagn B fortsätter med samma hastighet som A hade. Hela rörelsemängden går över från A till B.' },
            { id: 'tunglatt', namn: 'Tung mot lätt', typ: 'elastisk', mA: 0.80, mB: 0.20, vA0: 0.40, vB0: 0, xA0: 0.45, xB0: 1.00,
              text: 'Den tunga vagnen fortsätter framåt med lägre fart, och den lätta skjuts iväg med större fart än den tunga hade från början.' },
            { id: 'latttung', namn: 'Lätt mot tung', typ: 'elastisk', mA: 0.20, mB: 0.80, vA0: 0.50, vB0: 0, xA0: 0.55, xB0: 1.15,
              text: 'Den lätta vagnen studsar tillbaka, så dess hastighet byter tecken. Därför får B större rörelsemängd än A hade från början, och summan stämmer ändå.' },
            { id: 'hakar', namn: 'Hakar i en vagn som står still', typ: 'oelastisk', mA: 0.40, mB: 0.20, vA0: 0.60, vB0: 0, xA0: 0.40, xB0: 1.00,
              text: 'Vagnarna fortsätter tillsammans med <em>v</em> = 0,24 / 0,60 = 0,40 m/s. Rörelsemängden bevaras, men en tredjedel av rörelseenergin blir värme och deformation.' },
            { id: 'frontal', namn: 'Frontalkrock som hakar i', typ: 'oelastisk', mA: 0.40, mB: 0.40, vA0: 0.40, vB0: -0.40, xA0: 0.45, xB0: 1.55,
              text: 'Rörelsemängderna är lika stora och motriktade, så summan är noll. Efter stöten står vagnarna helt still, och all rörelseenergi har blivit värme och deformation.' },
            { id: 'isar', namn: 'Knuffa isär', typ: 'isar', mA: 0.60, mB: 0.85, E: 0.13, xc: 1.0, vA0: 0, vB0: 0, xA0: 0.45, xB0: 1.10,
              text: 'Som Agnes och Boel i genomgångens exempel 1. Före knuffen står vagnarna still, så den totala rörelsemängden är noll, och det är den efteråt också. Den tyngre vagnen får lägre fart.' },
        ];
        const FORSOK_2D = [
            { id: 'snett', namn: 'Snett träff, lika massor', typ: 'elastisk', mA: 0.30, mB: 0.30,
              A: V(0.30, 0.62), vA: V(0.50, 0), B: V(0.85, 0.68), vB: V(0, 0),
              text: 'Puckarna går isär i rät vinkel mot varandra. Det gäller alltid när två lika tunga puckar stöter elastiskt och den ena står still.' },
            { id: 'rak', namn: 'Rak träff, lika massor', typ: 'elastisk', mA: 0.30, mB: 0.30,
              A: V(0.30, 0.62), vA: V(0.50, 0), B: V(0.85, 0.62), vB: V(0, 0),
              text: 'Träffar A mitt på stannar den helt, och B tar över hela rörelsemängden. Det är samma stöt som i en dimension.' },
            { id: 'tung2', namn: 'Tung mot lätt, snett', typ: 'elastisk', mA: 0.80, mB: 0.20,
              A: V(0.30, 0.62), vA: V(0.45, 0), B: V(0.85, 0.66), vB: V(0, 0),
              text: 'Den tunga pucken böjs bara av lite, medan den lätta skjuts iväg snett. Summan av rörelsemängderna pekar ändå åt samma håll som före stöten.' },
            { id: 'latt2', namn: 'Lätt mot tung, snett', typ: 'elastisk', mA: 0.20, mB: 0.80,
              A: V(0.30, 0.60), vA: V(0.60, 0), B: V(0.85, 0.63), vB: V(0, 0),
              text: 'Den lätta pucken studsar ut åt sidan och lite bakåt. Den tunga får en rörelsemängd som är större än den lätta hade från början.' },
            { id: 'kors', namn: 'Korsande puckar som hakar i', typ: 'oelastisk', mA: 0.30, mB: 0.30,
              A: V(0.25, 0.75), vA: V(0.50, 0), B: V(0.80, 0.20), vB: V(0, 0.50),
              text: 'Puckarna hakar i varandra och fortsätter snett. Rörelsemängden i <em>x</em>-led kom från A och i <em>y</em>-led från B, och summapilen pekar snett mellan dem.' },
        ];
        const P1 = (f) => ({ typ: f.typ, mA: f.mA, mB: f.mB, vA0: f.vA0, vB0: f.vB0, xA0: f.xA0, xB0: f.xB0, E: f.E != null ? f.E : 0.08, xc: f.xc != null ? f.xc : 1.0 });
        const P2 = (f) => ({ typ: f.typ, mA: f.mA, mB: f.mB, A: f.A, vA: f.vA, B: f.B, vB: f.vB });

        // ── Ritverktyg ──
        const Pil = ({ x1, y1, x2, y2, c, w = 3.4, dash, head = 12, op = 1 }) => {
            const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy);
            if (L < 1) return null;
            const ux = dx / L, uy = dy / L, h = Math.min(head, L), hw = h * 0.5;
            const bx = x2 - ux * h, by = y2 - uy * h;
            return (
                <g opacity={op}>
                    {L > h + 0.5 && <line x1={x1} y1={y1} x2={bx} y2={by} stroke={c} strokeWidth={w} strokeLinecap="butt" strokeDasharray={dash} />}
                    <polygon points={`${x2},${y2} ${bx - uy * hw},${by + ux * hw} ${bx + uy * hw},${by - ux * hw}`} fill={c} />
                </g>
            );
        };
        // Beteckning med index: kursiv bokstav, upprätt index
        const Sb = ({ s, i }) => (
            <React.Fragment>
                <tspan fontStyle="italic">{s}</tspan>
                {i && <tspan fontSize="72%" dy="0.32em">{i}</tspan>}
                {i && <tspan dy="-0.32em">{'​'}</tspan>}
            </React.Fragment>
        );
        const Txt = ({ x, y, size = 13, c = COL.ink, a = 'start', w = 500, children, op }) => (
            <text x={x} y={y} fontSize={size} fill={c} textAnchor={a} fontWeight={w} opacity={op}
                  fontFamily="'DM Sans', Poppins, sans-serif" style={{ fontSize: size * LAY.F }}>{children}</text>
        );
        // Masscentrumets symbol: cirkel i fyra fält
        const CMsym = ({ x, y, r = 7 }) => (
            <g>
                <circle cx={x} cy={y} r={r} fill="#f7f2e8" stroke={COL.cm} strokeWidth="1.6" />
                <path d={`M${x},${y} L${x + r},${y} A${r},${r} 0 0,0 ${x},${y - r} Z`} fill={COL.cm} />
                <path d={`M${x},${y} L${x - r},${y} A${r},${r} 0 0,0 ${x},${y + r} Z`} fill={COL.cm} />
            </g>
        );
        // Beteckningar för hastigheten före och efter, som i genomgången
        const vNamn = (typ, vem, efter) => {
            if (typ === 'oelastisk') return efter ? { s: 'v', i: null } : { s: 'v', i: vem };
            return efter ? { s: 'v', i: vem } : { s: 'v', i: vem + '0' };
        };
        const htmlV = (typ, vem, efter) => {
            const n = vNamn(typ, vem, efter);
            return '<em>' + n.s + '</em>' + (n.i ? '<sub>' + n.i + '</sub>' : '');
        };

        // ── Layouten: bred (dator) eller smal (telefon, stående) ──
        // På en smal skärm skulle den breda scenen krympa till en tredjedel och
        // texten bli oläslig. Där byggs scenen i stället på höjden: banan eller
        // bordet överst och diagrammen under, med större text (F).
        let W, H, H1, DY1, X0, X1, S1, VS1, TX0, TY0, S2, VS2, LAY;
        const BRED = {
            W: 960, H: 560, H1: 640, DY1: 80, X0: 70, X1: 890, VS1: 120, TX0: 30, TY0: 30, S2: 400, VS2: 170,
            F: 1, infoX: 84, pX0: 24, pXZ: 330, pHW: 270, e1: { x: 668, y: 362 }, eBW: 168,
            box2: { x: 624, y: 210, w: 316, h: 168 }, e2: { x: 622, y: 426 },
        };
        const SMAL = {
            W: 480, H: 940, H1: 760, DY1: 6, X0: 30, X1: 450, VS1: 100, TX0: 20, TY0: 20, S2: 314, VS2: 135,
            F: 1.25, infoX: 60, pX0: 12, pXZ: 262, pHW: 190, e1: { x: 12, y: 578 }, eBW: 290,
            box2: { x: 24, y: 530, w: 432, h: 190 }, e2: { x: 20, y: 770 },
        };
        const valjLayout = (smal) => {
            LAY = smal ? SMAL : BRED;
            ({ W, H, H1, DY1, X0, X1, VS1, TX0, TY0, S2, VS2 } = LAY);
            S1 = (X1 - X0) / TRACK;
        };
        valjLayout(false);

        const Monster = () => (
            <defs>
                <pattern id="hatch-varme" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                    <rect width="7" height="7" fill="rgba(138,143,153,0.22)" />
                    <line x1="0" y1="0" x2="0" y2="7" stroke={COL.varme} strokeWidth="2.4" />
                </pattern>
                <pattern id="hatch-fjader" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
                    <rect width="7" height="7" fill="rgba(123,63,160,0.15)" />
                    <line x1="0" y1="0" x2="0" y2="7" stroke={COL.fjader} strokeWidth="2.4" />
                </pattern>
                <linearGradient id="g-bank" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stopColor="#d9b98c" />
                    <stop offset="1" stopColor="#c9a676" />
                </linearGradient>
                <linearGradient id="g-balk" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stopColor="#e9edf1" />
                    <stop offset="0.5" stopColor="#cdd4dc" />
                    <stop offset="1" stopColor="#b3bcc7" />
                </linearGradient>
                <linearGradient id="g-vikt" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0" stopColor="#9a6f22" />
                    <stop offset="0.45" stopColor="#e3bd62" />
                    <stop offset="1" stopColor="#a87a28" />
                </linearGradient>
                <linearGradient id="g-A" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stopColor={COL.Aljus} />
                    <stop offset="1" stopColor={COL.A} />
                </linearGradient>
                <linearGradient id="g-B" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stopColor={COL.Bljus} />
                    <stop offset="1" stopColor={COL.B} />
                </linearGradient>
                <radialGradient id="r-A" cx="0.38" cy="0.35" r="0.75">
                    <stop offset="0" stopColor={COL.Aljus} />
                    <stop offset="1" stopColor={COL.Amork} />
                </radialGradient>
                <radialGradient id="r-B" cx="0.38" cy="0.35" r="0.75">
                    <stop offset="0" stopColor={COL.Bljus} />
                    <stop offset="1" stopColor={COL.Bmork} />
                </radialGradient>
                <pattern id="lufthal" width="20" height="20" patternUnits="userSpaceOnUse">
                    <circle cx="10" cy="10" r="1.3" fill="rgba(15,22,32,0.13)" />

        );

        // ── Rörelseenergin: två liggande staplar, Före och Nu ──
        const Energi = ({ x, y, M, S }) => {
            const E0 = energiFore(M) + M.E;
            const EAf = M.mA * dot(M.fore.vA, M.fore.vA) / 2, EBf = M.mB * dot(M.fore.vB, M.fore.vB) / 2;
            const forlust = S.efter && M.typ === 'oelastisk' ? Math.max(0, E0 - S.EA - S.EB) : 0;
            const fjaderNu = M.typ === 'isar' && !S.efter ? M.E : 0;
            const max = Math.max(E0, S.EA + S.EB + forlust + fjaderNu, 1e-6);
            const BW = LAY.eBW, F = LAY.F, x0 = x + 46 * F;
            const stapel = (yy, delar) => {
                let xx = x0;
                return delar.map((d, k) => {
                    const w = d.v / max * BW;
                    const el = w > 0.3 ? <rect key={k} x={xx} y={yy} width={w} height={18} fill={d.f} stroke={d.s || 'none'} strokeWidth="1" /> : null;
                    xx += w;
                    return el;
                });
            };
            const summaFore = E0, summaNu = S.EA + S.EB + fjaderNu;
            const foreDelar = M.typ === 'isar' ? [{ v: M.E, f: 'url(#hatch-fjader)', s: COL.fjader }]
                : [{ v: EAf, f: COL.A }, { v: EBf, f: COL.B }];
            const nuDelar = [{ v: S.EA, f: COL.A }, { v: S.EB, f: COL.B }, { v: fjaderNu, f: 'url(#hatch-fjader)', s: COL.fjader },
                             { v: forlust, f: 'url(#hatch-varme)', s: COL.varme }];
            const xEnd = (s) => x0 + s / max * BW + 6;
            return (
                <g>
                    <Txt x={x} y={y} size={12} c={COL.muted} w={700}>RÖRELSEENERGI (J)</Txt>
                    <Txt x={x} y={y + 37} size={13} w={600}>Före</Txt>
                    <rect x={x0} y={y + 24} width={BW} height={18} fill="rgba(15,22,32,0.04)" />
                    {stapel(y + 24, foreDelar)}
                    <Txt x={xEnd(summaFore)} y={y + 38} size={12.5} w={600}>{fmt(summaFore, 3)}</Txt>
                    <Txt x={x} y={y + 77} size={13} w={600}>Nu</Txt>
                    <rect x={x0} y={y + 64} width={BW} height={18} fill="rgba(15,22,32,0.04)" />
                    {stapel(y + 64, nuDelar)}
                    <Txt x={xEnd(summaNu + forlust)} y={y + 78} size={12.5} w={600}>{fmt(summaNu, 3)}</Txt>
                    <g transform={`translate(${x},${y + 104 * F})`}>
                        <rect x={0 * F} y="-9" width="12" height="10" fill={COL.A} />
                        <Txt x={17 * F} y={0} size={12}>A</Txt>
                        <rect x={38 * F} y="-9" width="12" height="10" fill={COL.B} />
                        <Txt x={55 * F} y={0} size={12}>B</Txt>
                        {M.typ === 'isar' ? (
                            <React.Fragment>
                                <rect x={76 * F} y="-9" width="12" height="10" fill="url(#hatch-fjader)" stroke={COL.fjader} strokeWidth="1" />
                                <Txt x={93 * F} y={0} size={12}>fjäderns energi</Txt>
                            </React.Fragment>
                        ) : M.typ === 'oelastisk' ? (
                            <React.Fragment>
                                <rect x={76 * F} y="-9" width="12" height="10" fill="url(#hatch-varme)" stroke={COL.varme} strokeWidth="1" />
                                <Txt x={93 * F} y={0} size={12}>värme och deformation</Txt>
                            </React.Fragment>
                        ) : null}
                    </g>
                    <Txt x={x} y={y + 128 * F} size={12} c={COL.muted}>
                        {M.typ === 'elastisk' ? 'Elastisk stöt: rörelseenergin bevaras.'
                            : M.typ === 'oelastisk' ? (S.efter ? 'Oelastisk stöt: en del har blivit värme.' : 'Oelastisk stöt: en del blir värme vid stöten.')
                            : 'Fjädern ger vagnarna rörelseenergi.'}
                    </Txt>
                </g>
            );
        };

        // ── Rörelsemängden i en dimension: pilar efter varandra på en tallinje ──
        const Rorelsemangd1D = ({ M, S, gom }) => {
            const X0 = LAY.pX0, XZ = LAY.pXZ, HW = LAY.pHW, smal = LAY.F > 1;
            const pf = { A: M.fore.vA.x * M.mA, B: M.fore.vB.x * M.mB };
            const pe = M.efter ? { A: M.efter.vA.x * M.mA, B: M.efter.vB.x * M.mB } : pf;
            const ext = Math.max(Math.abs(pf.A), Math.abs(pf.A + pf.B), Math.abs(pe.A), Math.abs(pe.A + pe.B),
                                 Math.abs(pf.B), Math.abs(pe.B), 0.02);
            // Snyggt skalsteg
            const kand = [0.01, 0.02, 0.025, 0.05, 0.1, 0.2, 0.25, 0.5, 1];
            let steg = kand.find((s) => ext / s <= 5) || 1;
            const k = HW / (Math.ceil(ext / steg) * steg);
            const px = (p) => XZ + p * k;
            const nu = { A: S.pA.x, B: S.pB.x };
            const rad = (yA, p, op, efterRad) => {
                const tot = p.A + p.B;
                const visa = !(efterRad && gom);
                // Summans värde vid pilspetsen, eller på andra sidan nollan om det inte ryms
                const est = 9 * 7.2 * LAY.F;
                const ryms = tot >= 0 ? px(tot) + 9 + est < W - 6 : px(tot) - 9 - est > 6;
                const tl = ryms ? { x: px(tot) + (tot >= 0 ? 9 : -9), a: tot >= 0 ? 'start' : 'end' }
                                : { x: XZ + (tot >= 0 ? -9 : 9), a: tot >= 0 ? 'end' : 'start' };
                return (
                    <g opacity={op}>
                        {visa && Math.abs(p.A) * k > 1 && <Pil x1={px(0)} y1={yA} x2={px(p.A)} y2={yA} c={COL.A} w={5} head={13} />}
                        {visa && Math.abs(p.B) * k > 1 && <Pil x1={px(p.A)} y1={yA + 14} x2={px(p.A + p.B)} y2={yA + 14} c={COL.B} w={5} head={13} />}
                        {visa && Math.abs(tot) * k > 1 && <Pil x1={px(0)} y1={yA + 34} x2={px(tot)} y2={yA + 34} c={COL.tot} w={3.2} dash="7 4" head={12} />}
                        {visa && (
                            <Txt x={tl.x} y={yA + 39} a={tl.a} size={13} w={700}>
                                <Sb s="p" /> = {fmt(tot, 3)}
                            </Txt>
                        )}
                        {!visa && <Txt x={XZ + 10} y={yA + 18} size={14} w={700} c={COL.muted}>?</Txt>}
                    </g>
                );
            };
            const ticks = [];
            const nt = Math.round(HW / k / steg);
            for (let i = -nt; i <= nt; i++) {
                const xx = px(i * steg);
                ticks.push(<line key={'t' + i} x1={xx} y1={516} x2={xx} y2={i % 2 === 0 || nt <= 3 ? 523 : 520} stroke={COL.ink} strokeWidth="1.2" />);
                if (nt <= 3 || i % 2 === 0) ticks.push(<Txt key={'n' + i} x={xx} y={538} a="middle" size={11.5} c={COL.muted}>{fmtk(i * steg, 3)}</Txt>);
            }
            const totF = pf.A + pf.B;
            return (
                <g>
                    <Txt x={X0} y={362} size={12} c={COL.muted} w={700}>RÖRELSEMÄNGD (KG · M/S)</Txt>
                    <line x1={XZ} y1={378} x2={XZ} y2={516} stroke="rgba(15,22,32,0.35)" strokeWidth="1.2" />
                    <line x1={XZ - HW - 6} y1={516} x2={XZ + HW + 6} y2={516} stroke={COL.ink} strokeWidth="1.3" />
                    {ticks}
                    <Txt x={X0} y={406} size={13} w={600}>Före</Txt>
                    {rad(392, pf, 1, false)}
                    <Txt x={X0} y={472} size={13} w={600}>Nu</Txt>
                    {rad(458, nu, 1, true)}
                    {!gom && Math.abs(totF) * k > 1 && (
                        <line x1={px(totF)} y1={430} x2={px(totF)} y2={488} stroke={COL.lika} strokeWidth="1.6" strokeDasharray="3 3" />
                    )}
                </g>
            );
        };

        // ── Rörelsemängden i två dimensioner: vektorer efter varandra ──
        const Rorelsemangd2D = ({ M, S, box }) => {
            const pf = { A: mul(M.fore.vA, M.mA), B: mul(M.fore.vB, M.mB) };
            const pe = M.efter ? { A: mul(M.efter.vA, M.mA), B: mul(M.efter.vB, M.mB) } : null;
            const pts = [V(0, 0), pf.A, add(pf.A, pf.B)];
            if (pe) pts.push(pe.A);
            const xs = pts.map((p) => p.x), ys = pts.map((p) => p.y);
            const mx0 = Math.min(...xs), mx1 = Math.max(...xs), my0 = Math.min(...ys), my1 = Math.max(...ys);
            const m = 26;
            const sx = (box.w - 2 * m) / Math.max(mx1 - mx0, 1e-6), sy = (box.h - 2 * m) / Math.max(my1 - my0, 1e-6);
            const k = Math.min(sx, sy, 2400);
            const cx = box.x + box.w / 2 - (mx0 + mx1) / 2 * k, cy = box.y + box.h / 2 + (my0 + my1) / 2 * k;
            const P = (p) => ({ x: cx + p.x * k, y: cy - p.y * k });
            const O = P(V(0, 0));
            const tot = add(pf.A, pf.B);
            const kedja = (pA, pB, op, w) => {
                const a = P(pA), b = P(add(pA, pB));
                return (
                    <g opacity={op}>
                        {len(pA) * k > 1 && <Pil x1={O.x} y1={O.y} x2={a.x} y2={a.y} c={COL.A} w={w} head={13} />}
                        {len(pB) * k > 1 && <Pil x1={a.x} y1={a.y} x2={b.x} y2={b.y} c={COL.B} w={w} head={13} />}
                    </g>
                );
            };
            const etikett = (p0, p1, txt, c, sida) => {
                const a = P(p0), b = P(p1);
                const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy);
                if (L < 24) return null;
                const nx = -dy / L * sida, ny = dx / L * sida;
                return <Txt x={(a.x + b.x) / 2 + nx * 13} y={(a.y + b.y) / 2 + ny * 13 + 4} a="middle" size={13} w={700} c={c}>{txt}</Txt>;
            };
            const T = P(tot);
            const tomt = len(tot) * k < 1 && len(pf.A) * k < 1;
            return (
                <g>
                    <Txt x={box.x - 4} y={box.y - 10} size={12} c={COL.muted} w={700}>RÖRELSEMÄNGD (KG · M/S)</Txt>
                    <rect x={box.x} y={box.y} width={box.w} height={box.h} rx="8" fill="rgba(255,255,255,0.35)" stroke="rgba(15,22,32,0.14)" />
                    {tomt ? <Txt x={box.x + box.w / 2} y={box.y + box.h / 2} a="middle" c={COL.muted}>Ingen rörelsemängd</Txt> : (
                        <React.Fragment>
                            {S.efter && pe ? kedja(pf.A, pf.B, 0.28, 3.6) : null}
                            {S.efter && pe ? kedja(pe.A, pe.B, 1, 4.6) : kedja(pf.A, pf.B, 1, 4.6)}
                            {len(tot) * k > 1 && <Pil x1={O.x} y1={O.y} x2={T.x} y2={T.y} c={COL.tot} w={3} dash="7 4" head={12} />}
                            <circle cx={O.x} cy={O.y} r="3" fill={COL.ink} />
                            {S.efter && pe
                                ? <React.Fragment>{etikett(V(0, 0), pe.A, <Sb s="p" i="A" />, COL.A, 1)}{etikett(pe.A, add(pe.A, pe.B), <Sb s="p" i="B" />, COL.B, 1)}</React.Fragment>
                                : <React.Fragment>{etikett(V(0, 0), pf.A, <Sb s="p" i="A" />, COL.A, 1)}{etikett(pf.A, add(pf.A, pf.B), <Sb s="p" i="B" />, COL.B, 1)}</React.Fragment>}
                            {etikett(V(0, 0), tot, <Sb s="p" />, COL.tot, -1)}
                        </React.Fragment>
                    )}
                    <Txt x={box.x + 4} y={box.y + box.h + 18} size={12} c={COL.muted}>
                        {S.efter ? 'Bleka pilar: före stöten. Summan (streckad) är densamma.' : 'Streckad pil: summan av rörelsemängderna.'}
                    </Txt>
                </g>
            );
        };

        // ═══════════ Scenen i en dimension ═══════════
        const xp = (x) => X0 + x * S1;
        const Y_GLID = 210, Y_BALK = 232;

        const Vagn = ({ x, vem, m, typ, cmKant }) => {
            const cx = xp(x), hw = GL / 2 * S1;
            const fram = vem === 'A' ? 1 : -1;            // sidan som vetter mot den andra vagnen
            const fx = cx + fram * hw;
            const nStora = Math.floor((m - 0.0999) / 0.1 + 1e-9);
            const halv = Math.round((m - 0.1 - nStora * 0.1) * 100) >= 5;
            const vikter = [];
            const vw = Math.min(30, hw * 1.6);
            let yy = Y_GLID;
            for (let i = 0; i < nStora; i++) { yy -= 6; vikter.push(<rect key={i} x={cx - vw / 2} y={yy} width={vw} height="5.4" rx="1.2" fill="url(#g-vikt)" stroke="#7a5714" strokeWidth="0.6" />); }
            if (halv) { yy -= 4; vikter.push(<rect key="h" x={cx - vw * 0.37} y={yy} width={vw * 0.74} height="3.6" rx="1" fill="url(#g-vikt)" stroke="#7a5714" strokeWidth="0.6" />); }
            const k = typ === 'elastisk' ? KANT.elastisk * S1 : 0;
            return (
                <g>
                    {/* vikternas tapp */}
                    {(nStora > 0 || halv) && <rect x={cx - 1.6} y={yy - 5} width="3.2" height={Y_GLID - yy + 5} fill="#5d6570" />}
                    {vikter}
                    {/* vagnen: profil som rider på balken */}
                    <path d={`M${cx - hw},${Y_GLID + 4} Q${cx - hw},${Y_GLID} ${cx - hw + 4},${Y_GLID} L${cx + hw - 4},${Y_GLID}
                              Q${cx + hw},${Y_GLID} ${cx + hw},${Y_GLID + 4} L${cx + hw},${Y_BALK + 12} L${cx - hw},${Y_BALK + 12} Z`}
                          fill={`url(#g-${vem})`} stroke={vem === 'A' ? COL.Amork : COL.Bmork} strokeWidth="1.2" />
                    <line x1={cx - hw + 3} y1={Y_GLID + 3} x2={cx + hw - 3} y2={Y_GLID + 3} stroke="rgba(255,255,255,0.45)" strokeWidth="1.5" />
                    <text x={cx} y={Y_GLID + 18} textAnchor="middle" fontSize="15" fontWeight="700" fill="#ffffff"
                          fontFamily="'DM Sans', sans-serif">{vem}</text>
                    {/* framsidan: studsfjäder, kardborre eller fjäder */}
                    {typ === 'elastisk' && (
                        <path d={`M${fx},${Y_GLID + 6} C${fx + fram * k * 1.35},${Y_GLID + 8} ${fx + fram * k * 1.35},${Y_GLID + 22} ${fx},${Y_GLID + 24}`}
                              fill="none" stroke="#3a4151" strokeWidth="2.2" strokeLinecap="round" />
                    )}
                    {typ === 'oelastisk' && (
                        <g>
                            <rect x={fram > 0 ? fx : fx - KANT.oelastisk * S1} y={Y_GLID + 4} width={KANT.oelastisk * S1} height={20} fill="#2b2f36" />
                            {[0, 1, 2, 3, 4].map((i) => (
                                <line key={i} x1={fx} y1={Y_GLID + 6 + i * 4} x2={fx + fram * KANT.oelastisk * S1} y2={Y_GLID + 8 + i * 4} stroke="#6b7280" strokeWidth="0.8" />
                            ))}
                        </g>
                    )}
                </g>
            );
        };

        const Scen1D = ({ svgRef, M, P, t, S, show, gissa, gom, onDown, onMove, onUp }) => {
            const pos = M.pos(t);
            const xA = pos.A.x, xB = pos.B.x;
            const hw = GL / 2 * S1;
            const vid0 = t === 0 && !gissa;
            // Pilar: från vagnens framkant (i rörelseriktningen), i egna banor ovanför vagnarna
            const pilar = [];
            const pilFor = (vem, x, v, yLane, namn) => {
                const cx = xp(x);
                const start = v >= 0 ? cx + hw : cx - hw;
                const tip = start + v * VS1;
                return { vem, start, tip, y: yLane, v, namn };
            };
            const efter = S.efter;
            const ihop = efter && M.typ === 'oelastisk';
            if (ihop) {
                const v = S.vA.x;
                const vanster = xp(xA) - hw, hoger = xp(xB) + hw;
                const start = v >= 0 ? hoger : vanster;
                if (Math.abs(v) > 1e-9) pilar.push({ vem: 'AB', start, tip: start + v * VS1, y: 118, v, namn: vNamn(M.typ, 'A', true) });
            } else {
                pilar.push(pilFor('A', xA, S.vA.x, 124, vNamn(M.typ, 'A', efter)));
                pilar.push(pilFor('B', xB, S.vB.x, 96, vNamn(M.typ, 'B', efter)));
            }
            // Stroboskopet: en prick var 0,1 s för varje vagns mittpunkt
            const strob = [];
            if (show.strob) {
                for (let k = 0; k * 0.1 <= t + 1e-9; k++) {
                    const p = M.pos(k * 0.1);
                    strob.push(<circle key={'a' + k} cx={xp(p.A.x)} cy={300} r="2.4" fill={COL.A} />);
                    strob.push(<circle key={'b' + k} cx={xp(p.B.x)} cy={311} r="2.4" fill={COL.B} />);
                }
            }
            // Stöten: kort blixt där vagnarna möts
            let blixt = null;
            if (M.harStot && t >= M.tc && t < M.tc + 0.35 && M.typ !== 'isar') {
                const pc = M.pos(M.tc);
                const xc = (xp(pc.A.x) + xp(pc.B.x)) / 2, yc = Y_GLID + 14;
                const f = 1 - (t - M.tc) / 0.35;
                blixt = (
                    <g opacity={f}>
                        {[0, 45, 90, 135, 180, 225, 270, 315].map((a) => {
                            const r0 = 10, r1 = 10 + 12 * (1 - f) + 6;
                            const c = Math.cos(a * Math.PI / 180), s = Math.sin(a * Math.PI / 180);
                            return <line key={a} x1={xc + c * r0} y1={yc + s * r0} x2={xc + c * r1} y2={yc + s * r1} stroke="#d97706" strokeWidth="2" strokeLinecap="round" />;
                        })}
                    </g>
                );
            }
            // Isärknuffen: hoptryckt fjäder och tråd
            let isar = null;
            if (M.typ === 'isar') {
                const ax = xp(xA) + hw, bx = xp(xB) - hw;
                const fjL = t < M.tc ? bx - ax : Math.min(0.05 * S1, bx - ax);
                const n = 8, yC = Y_GLID + 13;
                let d = `M${ax},${yC}`;
                for (let i = 1; i <= n; i++) d += ` L${ax + fjL * (i - 0.5) / n},${yC + (i % 2 ? -6 : 6)}`;
                d += ` L${ax + fjL},${yC}`;
                isar = (
                    <g>
                        <path d={d} fill="none" stroke="#3a4151" strokeWidth="1.8" strokeLinejoin="round" />
                        {t < M.tc && <line x1={xp(xA)} y1={Y_GLID + 26} x2={xp(xB)} y2={Y_GLID + 26} stroke="#b4232f" strokeWidth="1.4" />}
                        {t >= M.tc && t < M.tc + 0.4 && (
                            <g opacity={1 - (t - M.tc) / 0.4}>
                                <circle cx={(ax + bx) / 2} cy={Y_GLID + 26} r={6 + 30 * (t - M.tc)} fill="none" stroke="#d97706" strokeWidth="1.6" />
                            </g>
                        )}
                    </g>
                );
            }
            const cmX = (M.mA * xA + M.mB * xB) / (M.mA + M.mB);
            let status;
            if (M.typ === 'isar') status = t < M.tc ? 'Tråden håller fjädern hoptryckt' : 'Tråden har gått av';
            else if (!M.harStot) status = 'Vagnarna möts aldrig';
            else if (t < M.tc) status = 'Före stöten';
            else status = M.typ === 'elastisk' ? 'Efter stöten: vagnarna har studsat isär' : 'Efter stöten: vagnarna sitter ihop';

            // Linjalen på balkens framsida
            const linjal = [];
            for (let i = 0; i <= 40; i++) {
                const xx = xp(i * 0.05);
                linjal.push(<line key={i} x1={xx} y1={Y_BALK + 8} x2={xx} y2={Y_BALK + 8 + (i % 2 === 0 ? 9 : 5)} stroke="rgba(15,22,32,0.6)" strokeWidth="1" />);
                if (i % 4 === 0) linjal.push(<Txt key={'n' + i} x={xx} y={Y_BALK + 46} a="middle" size={11.5} c={COL.muted}>{i === 40 ? '2,0 m' : fmtk(i * 0.05, 2)}</Txt>);
            }
            const hal = [];
            for (let xx = X0 + 8; xx < X1; xx += 14) hal.push(<circle key={xx} cx={xx} cy={Y_BALK + 3.5} r="1.1" fill="rgba(15,22,32,0.35)" />);

            return (
                <svg ref={svgRef} viewBox={`0 0 ${W} ${H1}`} onPointerMove={onMove} onPointerUp={onUp} onPointerCancel={onUp}
                     role="img" aria-label="Två vagnar på en luftkuddebana, med rörelsemängdsdiagram och energistaplar">
                    <Monster />
                    <rect width={W} height={H1} fill="#f3eee4" />
                    {/* informationsraden */}
                    <Txt x={LAY.infoX} y={36} size={15} w={700}>t = {fmt(t, 2)} s</Txt>
                    <Txt x={LAY.infoX} y={36 + 22 * LAY.F} size={13} c={COL.muted}>{status}</Txt>
                    <g>
                        <Txt x={LAY.infoX} y={36 + 46 * LAY.F} size={12} c={COL.muted}>Positiv riktning</Txt>
                        <Pil x1={LAY.infoX + 98 * LAY.F} y1={32 + 46 * LAY.F} x2={LAY.infoX + 98 * LAY.F + 44} y2={32 + 46 * LAY.F} c={COL.muted} w={2} head={9} />
                    </g>

                    <g transform={`translate(0,${DY1})`}>
                    {/* labbänken */}
                    <rect x="0" y={Y_BALK + 30} width={W} height="58" fill="url(#g-bank)" />
                    {[0, 1, 2, 3].map((i) => (
                        <path key={i} d={`M0,${Y_BALK + 40 + i * 12} C240,${Y_BALK + 36 + i * 12} 520,${Y_BALK + 46 + i * 12} ${W},${Y_BALK + 40 + i * 12}`}
                              fill="none" stroke="rgba(120,80,30,0.13)" strokeWidth="1.2" />
                    ))}
                    <rect x="0" y={Y_BALK + 88} width={W} height="10" fill="#a9845a" />
                    {/* stroboskopremsan */}
                    {show.strob && <rect x={X0 - 6} y={293} width={X1 - X0 + 12} height={25} fill="#fbf8f1" stroke="rgba(15,22,32,0.12)" />}
                    {strob}
                    {/* luftkuddebanan */}
                    <rect x={X0 - 18} y={Y_BALK + 18} width="14" height="12" fill="#6b7280" />
                    <rect x={X1 + 4} y={Y_BALK + 18} width="14" height="12" fill="#6b7280" />
                    <rect x={X0 - 14} y={Y_BALK} width={X1 - X0 + 28} height="7" fill="#e7ebef" stroke="#9aa4b0" strokeWidth="0.8" />
                    <rect x={X0 - 14} y={Y_BALK + 7} width={X1 - X0 + 28} height="18" fill="url(#g-balk)" stroke="#9aa4b0" strokeWidth="0.8" />
                    {hal}
                    {linjal}
                    <rect x={X0 - 24} y={Y_BALK - 26} width="10" height="51" rx="2" fill="#4b5563" />
                    <rect x={X1 + 14} y={Y_BALK - 26} width="10" height="51" rx="2" fill="#4b5563" />
                    {/* slangen från fläkten */}
                    <path d={`M${X0 - 24},${Y_BALK + 14} C${X0 - 52},${Y_BALK + 14} ${X0 - 48},${Y_BALK + 60} ${X0 - 62},${Y_BALK + 84}`}
                          fill="none" stroke="#3a4151" strokeWidth="6" strokeLinecap="round" />

                    {/* vagnarna */}
                    <g style={{ cursor: vid0 ? 'grab' : 'default' }} onPointerDown={(e) => onDown(e, { typ: 'vagn', vem: 'A' })}>
                        <Vagn x={xA} vem="A" m={M.mA} typ={M.typ} />
                    </g>
                    <g style={{ cursor: vid0 ? 'grab' : 'default' }} onPointerDown={(e) => onDown(e, { typ: 'vagn', vem: 'B' })}>
                        <Vagn x={xB} vem="B" m={M.mB} typ={M.typ} />
                    </g>
                    {isar}
                    {blixt}
                    {show.cm && (
                        <g>
                            <CMsym x={xp(cmX)} y={Y_BALK + 66} />
                            <Txt x={xp(cmX) + 11} y={Y_BALK + 70} size={11.5} c={COL.ink}>masscentrum</Txt>
                        </g>
                    )}

                    {/* hastighetspilarna */}
                    {show.pilar && pilar.map((p) => {
                        const c = p.vem === 'A' ? COL.A : p.vem === 'B' ? COL.B : COL.ink;
                        const doljTal = gom && efter;
                        let hoger = p.v >= 0;
                        const est = (doljTal ? 6 : 14) * 7.4 * LAY.F;
                        if (hoger && Math.max(p.tip, p.start) + 8 + est > W - 4) hoger = false;
                        else if (!hoger && Math.min(p.tip, p.start) - 8 - est < 4) hoger = true;
                        return (
                            <g key={p.vem}>
                                <line x1={p.start} y1={p.y + 6} x2={p.start} y2={Y_GLID - 2} stroke={c} strokeWidth="1" strokeDasharray="2 3" opacity="0.6" />
                                <Pil x1={p.start} y1={p.y} x2={p.tip} y2={p.y} c={c} w={3.6} head={12} />
                                <Txt x={hoger ? Math.max(p.tip, p.start) + 8 : Math.min(p.tip, p.start) - 8} y={p.y + 5} a={hoger ? 'start' : 'end'} size={14} c={c} w={600}>
                                    <Sb s={p.namn.s} i={p.namn.i} /> = {doljTal ? '?' : fmt(p.v, 2) + ' m/s'}
                                </Txt>
                                {vid0 && p.vem !== 'AB' && (
                                    <circle cx={p.tip} cy={p.y} r="10" fill="rgba(255,255,255,0.01)" stroke={c} strokeWidth="1.4" strokeDasharray="3 2"
                                            style={{ cursor: 'ew-resize' }} onPointerDown={(e) => onDown(e, { typ: 'pil', vem: p.vem })} />
                                )}
                            </g>
                        );
                    })}

                    <line x1="16" y1="336" x2={W - 16} y2="336" stroke="rgba(15,22,32,0.12)" />
                    <Rorelsemangd1D M={M} S={S} gom={gom} />
                    <Energi x={LAY.e1.x} y={LAY.e1.y} M={M} S={S} />
                    </g>
                </svg>
            );
        };

        // ═══════════ Scenen i två dimensioner ═══════════
        const bx = (x) => TX0 + x * S2, by = (y) => TY0 + (TH - y) * S2;

        const Puck = ({ p, r, vem, typ }) => {
            const cx = bx(p.x), cy = by(p.y), rr = r * S2;
            return (
                <g>
                    <ellipse cx={cx + 2} cy={cy + 3} rx={rr} ry={rr} fill="rgba(15,22,32,0.16)" />
                    <circle cx={cx} cy={cy} r={rr} fill={`url(#r-${vem})`} stroke={vem === 'A' ? COL.Amork : COL.Bmork} strokeWidth="1.4" />
                    <circle cx={cx} cy={cy} r={rr * 0.62} fill="none" stroke="rgba(255,255,255,0.35)" strokeWidth="1.4" />
                    {typ === 'oelastisk' && (
                        <circle cx={cx} cy={cy} r={rr - 1.8} fill="none" stroke="#2b2f36" strokeWidth="3.4" strokeDasharray="2 1.6" />
                    )}
                    <text x={cx} y={cy + 5} textAnchor="middle" fontSize={Math.max(12, Math.min(17, rr * 0.8))} fontWeight="700" fill="#ffffff"
                          fontFamily="'DM Sans', sans-serif">{vem}</text>
                </g>
            );
        };

        const Scen2D = ({ svgRef, M, t, S, show, gissa, gom, onDown, onMove, onUp }) => {
            const pos = M.pos(t);
            const vid0 = t === 0 && !gissa;
            const efter = S.efter;
            const ihop = efter && M.typ === 'oelastisk';
            const pilFran = (c, r, v) => {
                const L = len(v);
                if (L < 1e-9) return null;
                const u = mul(v, 1 / L);
                const s = add(c, mul(u, r));
                return { s, e: add(s, mul(v, VS2 / S2)) };
            };
            const pilar = [];
            if (ihop) {
                const v = S.vA, L = len(v);
                if (L > 1e-9) {
                    const u = mul(v, 1 / L);
                    const cm = mul(add(mul(pos.A, M.mA), mul(pos.B, M.mB)), 1 / (M.mA + M.mB));
                    const sp = Math.max(dot(sub(pos.A, cm), u) + M.rA, dot(sub(pos.B, cm), u) + M.rB);
                    const s = add(cm, mul(u, sp));
                    pilar.push({ vem: 'AB', s, e: add(s, mul(v, VS2 / S2)), v, namn: vNamn(M.typ, 'A', true) });
                }
            } else {
                const a = pilFran(pos.A, M.rA, S.vA), b = pilFran(pos.B, M.rB, S.vB);
                pilar.push({ vem: 'A', ...(a || { s: add(pos.A, V(M.rA, 0)), e: add(pos.A, V(M.rA, 0)) }), v: S.vA, namn: vNamn(M.typ, 'A', efter), noll: !a });
                pilar.push({ vem: 'B', ...(b || { s: add(pos.B, V(-M.rB, 0)), e: add(pos.B, V(-M.rB, 0)) }), v: S.vB, namn: vNamn(M.typ, 'B', efter), noll: !b });
            }
            const spok = [];
            if (show.strob) {
                for (let k = 0; k * 0.2 <= t + 1e-9; k++) {
                    const p = M.pos(k * 0.2);
                    spok.push(<circle key={'a' + k} cx={bx(p.A.x)} cy={by(p.A.y)} r={M.rA * S2} fill="rgba(31,95,168,0.07)" stroke="rgba(31,95,168,0.38)" strokeWidth="1" />);
                    spok.push(<circle key={'b' + k} cx={bx(p.B.x)} cy={by(p.B.y)} r={M.rB * S2} fill="rgba(194,65,12,0.07)" stroke="rgba(194,65,12,0.38)" strokeWidth="1" />);
                }
            }
            const cmUr = (p) => mul(add(mul(p.A, M.mA), mul(p.B, M.mB)), 1 / (M.mA + M.mB));
            const cm0 = cmUr(M.pos(0)), cmT = cmUr(pos);
            let blixt = null;
            if (M.harStot && t >= M.tc && t < M.tc + 0.35) {
                const pc = M.pos(M.tc);
                const kp = add(pc.A, mul(M.n, M.rA));
                const xc = bx(kp.x), yc = by(kp.y), f = 1 - (t - M.tc) / 0.35;
                blixt = (
                    <g opacity={f}>
                        {[0, 45, 90, 135, 180, 225, 270, 315].map((a) => {
                            const c = Math.cos(a * Math.PI / 180), s = Math.sin(a * Math.PI / 180), r1 = 8 + 14 * (1 - f) + 5;
                            return <line key={a} x1={xc + c * 6} y1={yc + s * 6} x2={xc + c * r1} y2={yc + s * r1} stroke="#d97706" strokeWidth="2" strokeLinecap="round" />;
                        })}
                    </g>
                );
            }
            let status;
            if (!M.harStot) status = 'Puckarna missar varandra';
            else if (t < M.tc) status = 'Före stöten';
            else status = M.typ === 'elastisk' ? 'Efter stöten: puckarna har studsat isär' : 'Efter stöten: puckarna sitter ihop';

            return (
                <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} onPointerMove={onMove} onPointerUp={onUp} onPointerCancel={onUp}
                     role="img" aria-label="Två puckar på ett airhockeybord sett uppifrån, med rörelsemängdsvektorer och energistaplar">
                    <Monster />
                    <rect width={W} height={H} fill="#f3eee4" />
                    {/* bordet */}
                    <rect x={TX0 - 12} y={TY0 - 12} width={TW * S2 + 24} height={TH * S2 + 24} rx="16" fill="#2f3a48" />
                    <rect x={TX0 - 5} y={TY0 - 5} width={TW * S2 + 10} height={TH * S2 + 10} rx="10" fill="#47566a" />
                    <rect x={TX0} y={TY0} width={TW * S2} height={TH * S2} rx="6" fill="#f6f8fa" />
                    <rect x={TX0} y={TY0} width={TW * S2} height={TH * S2} rx="6" fill="url(#lufthal)" />
                    <line x1={bx(TW / 2)} y1={TY0} x2={bx(TW / 2)} y2={TY0 + TH * S2} stroke="rgba(31,95,168,0.12)" strokeWidth="2" />
                    <circle cx={bx(TW / 2)} cy={by(TH / 2)} r={60 * S2 / 400} fill="none" stroke="rgba(31,95,168,0.12)" strokeWidth="2" />
                    {/* koordinataxlar i hörnet */}
                    <Pil x1={TX0 + 16} y1={TY0 + TH * S2 - 16} x2={TX0 + 66} y2={TY0 + TH * S2 - 16} c={COL.muted} w={1.6} head={8} />
                    <Pil x1={TX0 + 16} y1={TY0 + TH * S2 - 16} x2={TX0 + 16} y2={TY0 + TH * S2 - 66} c={COL.muted} w={1.6} head={8} />
                    <Txt x={TX0 + 70} y={TY0 + TH * S2 - 12} size={13} c={COL.muted}><Sb s="x" /></Txt>
                    <Txt x={TX0 + 22} y={TY0 + TH * S2 - 62} size={13} c={COL.muted}><Sb s="y" /></Txt>

                    {spok}
                    {show.cm && (
                        <g>
                            <line x1={bx(cm0.x)} y1={by(cm0.y)} x2={bx(cmT.x)} y2={by(cmT.y)} stroke={COL.cm} strokeWidth="1.4" strokeDasharray="4 4" opacity="0.6" />
                        </g>
                    )}
                    <g style={{ cursor: vid0 ? 'grab' : 'default' }} onPointerDown={(e) => onDown(e, { typ: 'puck', vem: 'A' })}>
                        <Puck p={pos.A} r={M.rA} vem="A" typ={M.typ} />
                    </g>
                    <g style={{ cursor: vid0 ? 'grab' : 'default' }} onPointerDown={(e) => onDown(e, { typ: 'puck', vem: 'B' })}>
                        <Puck p={pos.B} r={M.rB} vem="B" typ={M.typ} />
                    </g>
                    {blixt}
                    {show.cm && <CMsym x={bx(cmT.x)} y={by(cmT.y)} r={6} />}

                    {show.pilar && pilar.map((p) => {
                        const c = p.vem === 'A' ? COL.A : p.vem === 'B' ? COL.B : COL.ink;
                        const s = { x: bx(p.s.x), y: by(p.s.y) }, e = { x: bx(p.e.x), y: by(p.e.y) };
                        const dx = e.x - s.x, dy = e.y - s.y, L = Math.hypot(dx, dy) || 1;
                        const est = 30 * LAY.F;
                        let lx = e.x + dx / L * 12;
                        const ly = clamp(e.y + dy / L * 12, 16, H - 8);
                        if (dx >= 0 && lx + est > W - 6) lx = W - 6 - est;
                        if (dx < 0 && lx - est < 6) lx = 6 + est;
                        const doljTal = gom && efter;
                        return (
                            <g key={p.vem}>
                                {!p.noll && <Pil x1={s.x} y1={s.y} x2={e.x} y2={e.y} c={c} w={3.6} head={12} />}
                                {!p.noll && (
                                    <Txt x={lx} y={ly + 5} a={dx >= 0 ? 'start' : 'end'} size={14} c={c} w={600}>
                                        <Sb s={p.namn.s} i={p.namn.i} />{doljTal ? ' = ?' : ''}
                                    </Txt>
                                )}
                                {vid0 && p.vem !== 'AB' && (
                                    <circle cx={e.x} cy={e.y} r="11" fill="rgba(255,255,255,0.01)" stroke={c} strokeWidth="1.4" strokeDasharray="3 2"
                                            style={{ cursor: 'move' }} onPointerDown={(ev) => onDown(ev, { typ: 'pil', vem: p.vem })} />
                                )}
                            </g>
                        );
                    })}

                    {/* informationsraden ligger i bordets nedre högra hörn */}
                    {LAY.F > 1 ? (
                        <React.Fragment>
                            <Txt x={TX0} y={TY0 + TH * S2 + 40} size={15} w={700}>t = {fmt(t, 2)} s</Txt>
                            <Txt x={TX0} y={TY0 + TH * S2 + 62} size={13} c={COL.muted}>{status}</Txt>
                        </React.Fragment>
                    ) : (
                        <React.Fragment>
                            <Txt x={TX0 + TW * S2 - 12} y={TY0 + TH * S2 - 34} a="end" size={15} w={700}>t = {fmt(t, 2)} s</Txt>
                            <Txt x={TX0 + TW * S2 - 12} y={TY0 + TH * S2 - 14} a="end" size={13} c={COL.muted}>{status}</Txt>
                        </React.Fragment>
                    )}

                    <Rorelsemangd2D M={M} S={S} box={LAY.box2} />
                    <Energi x={LAY.e2.x} y={LAY.e2.y} M={M} S={S} />
                </svg>
            );
        };

        // ── Formelkortet ──
        const Term = ({ label, children }) => (
            <div className="flex flex-col items-center" style={{ lineHeight: 1.1 }}>
                <span className="flbl" style={{ whiteSpace: 'nowrap' }}>{label}</span>
                <span className="fnum">{children}</span>
                <span className="flbl" aria-hidden="true" style={{ visibility: 'hidden' }}>{label}</span>
            </div>
        );
        const Op = ({ children }) => <span className="fnum">{children}</span>;
        const v_ = (i) => <span><em>v</em>{i && <sub>{i}</sub>}</span>;
        const m_ = (i) => <span><em>m</em><sub>{i}</sub></span>;

        const FormulaCard = ({ M, S, gom }) => {
            const oel = M.typ === 'oelastisk';
            const pf = add(mul(M.fore.vA, M.mA), mul(M.fore.vB, M.mB));
            const pe = M.efter ? add(mul(M.efter.vA, M.mA), mul(M.efter.vB, M.mB)) : null;
            const visaEfter = pe && S.efter && !gom;
            const varde = (p) => M.dim === '1d'
                ? <b>{fmt(p.x, 3)}&nbsp;kg&nbsp;·&nbsp;m/s</b>
                : <b><em>p</em><sub>x</sub>&nbsp;=&nbsp;{fmt(p.x, 3)}, <em>p</em><sub>y</sub>&nbsp;=&nbsp;{fmt(p.y, 3)}</b>;
            return (
                <div className="formula-card glass-card rounded-xl p-4 mb-6 flex flex-wrap items-center gap-x-6 gap-y-3" style={{ color: 'var(--lab-ink)' }}>
                    {oel ? (
                        <span className="fk-grupp">
                            <Term label="A före">{m_('A')} · {v_('A')}</Term><Op>+</Op>
                            <Term label="B före">{m_('B')} · {v_('B')}</Term><Op>=</Op>
                            <Term label="Tillsammans efter">({m_('A')} + {m_('B')}) · {v_()}</Term>
                        </span>
                    ) : (
                        <span className="fk-grupp">
                            <Term label="A före">{m_('A')} · {v_('A0')}</Term><Op>+</Op>
                            <Term label="B före">{m_('B')} · {v_('B0')}</Term><Op>=</Op>
                            <Term label="A efter">{m_('A')} · {v_('A')}</Term><Op>+</Op>
                            <Term label="B efter">{m_('B')} · {v_('B')}</Term>
                        </span>
                    )}
                    <span className="fk-grupp" style={{ flexWrap: 'wrap' }}>
                        <span className="fk-chip"><span className="flbl">Total rörelsemängd före</span>{varde(pf)}</span>
                        <span className="fk-chip"><span className="flbl">Total rörelsemängd efter</span>
                            {visaEfter ? varde(pe) : <b style={{ color: 'var(--lab-ink-muted)' }}>{gom ? '?' : M.harStot ? 'efter stöten' : 'ingen stöt'}</b>}
                        </span>
                    </span>
                    {M.dim === '2d' && (
                        <p className="anm" style={{ flexBasis: '100%', margin: 0 }}>
                            I två dimensioner gäller rörelsemängdslagen i <em>x</em>-led och i <em>y</em>-led var för sig.
                        </p>
                    )}
                </div>
            );
        };

        // ── Reglage ──
        const Reglage = ({ label, value, min, max, step, onChange, enhet, d = 2, kompakt }) => (
            <div className={kompakt ? 'st-slider' : 'reg'}>
                <div className={kompakt ? 'st-slider-top' : 'reg-top'}>
                    <span>{label}</span>
                    <b>{fmt(value, d)}&nbsp;{enhet}</b>
                </div>
                <input type="range" min={min} max={max} step={step} value={value}
                       onChange={(e) => onChange(parseFloat(e.target.value))} aria-label={typeof label === 'string' ? label : undefined} />
            </div>
        );

        // ── Testa dig själv ──
        const MASSOR = [0.20, 0.25, 0.30, 0.40, 0.50, 0.60, 0.80];
        const nyFraga = (dim) => {
            if (dim === '2d') {
                const mA = rnd(MASSOR), mB = rnd(MASSOR);
                const u = rnd([0.30, 0.40, 0.50, 0.60]), w = rnd([0.20, 0.30, 0.40, 0.50]);
                const C = V(0.85, 0.72), T = 1.0;
                const P = { typ: 'oelastisk', mA, mB, A: V(C.x - u * T, C.y), vA: V(u, 0), B: V(C.x, C.y - w * T), vB: V(0, w) };
                const vx = mA * u / (mA + mB), vy = mB * w / (mA + mB);
                return {
                    dim, P, facit: Math.hypot(vx, vy),
                    text: `Puck A (${fmtk(mA, 2)} kg) glider i <em>x</em>-led med ${fmtk(u, 2)} m/s och puck B (${fmtk(mB, 2)} kg) i <em>y</em>-led med ${fmtk(w, 2)} m/s. De hakar i varandra. Vilken fart får de efter stöten?`,
                    enhet: 'm/s',
                    forklaring: `I <em>x</em>-led: <em>p<sub>x</sub></em> = ${fmtk(mA, 2)} · ${fmtk(u, 2)} = ${fmtk(mA * u, 4)} kg · m/s, så <em>v<sub>x</sub></em> = ${fmtk(mA * u, 4)} / ${fmtk(mA + mB, 2)} = ${fmtk(vx, 3)} m/s. `
                        + `I <em>y</em>-led: <em>p<sub>y</sub></em> = ${fmtk(mB, 2)} · ${fmtk(w, 2)} = ${fmtk(mB * w, 4)} kg · m/s, så <em>v<sub>y</sub></em> = ${fmtk(mB * w, 4)} / ${fmtk(mA + mB, 2)} = ${fmtk(vy, 3)} m/s. `
                        + `Farten blir <em>v</em> = √(<em>v<sub>x</sub></em>² + <em>v<sub>y</sub></em>²) = ${fmt(Math.hypot(vx, vy), 2)} m/s.`,
                };
            }
            const typ = rnd(['oelastisk', 'elastisk', 'isar']);
            let mA = rnd(MASSOR);
            let mB = rnd(MASSOR);
            if (typ === 'isar') {
                while (mB === mA) mB = rnd(MASSOR);
                const k = rnd([0.20, 0.25, 0.30, 0.35, 0.40]);
                const vB = mA * k / mB;
                const E = mA * k * k / 2 + mB * vB * vB / 2;
                const P = { typ, mA, mB, E, xc: 1.0, vA0: 0, vB0: 0, xA0: 0.45, xB0: 1.10 };
                return {
                    dim, P, facit: mA * k / mB, enhet: 'm/s', visaA: -k,
                    text: `Vagnarna (<em>m</em><sub>A</sub> = ${fmtk(mA, 2)} kg och <em>m</em><sub>B</sub> = ${fmtk(mB, 2)} kg) står still med en hoptryckt fjäder emellan. När tråden går av får A hastigheten ${fmt(-k, 2)} m/s. Vilken hastighet <em>v</em><sub>B</sub> får B?`,
                    forklaring: `Före knuffen står vagnarna still, så den totala rörelsemängden är 0. Efter: ${fmtk(mA, 2)} · ${par(fmt(-k, 2))} + ${fmtk(mB, 2)} · <em>v</em><sub>B</sub> = 0, så <em>v</em><sub>B</sub> = ${fmtk(mA * k, 4)} / ${fmtk(mB, 2)} = ${fmt(mA * k / mB, 2)} m/s.`,
                };
            }
            let vA0 = rnd([0.30, 0.40, 0.50, 0.60, 0.70]);
            let vB0 = rnd([-0.40, -0.30, -0.20, 0, 0, 0.10]);
            // Elastisk stöt: välj värden där båda sluthastigheterna blir jämna
            // hundradelar, så att facit och simuleringens avläsning är samma tal.
            if (typ === 'elastisk') {
                const jamn = (x) => Math.abs(x * 100 - Math.round(x * 100)) < 1e-6;
                for (let k = 0; k < 500; k++) {
                    const M2 = mA + mB;
                    if (jamn(((mA - mB) * vA0 + 2 * mB * vB0) / M2) && jamn(((mB - mA) * vB0 + 2 * mA * vA0) / M2)) break;
                    mA = rnd(MASSOR); mB = rnd(MASSOR);
                    vA0 = rnd([0.30, 0.40, 0.50, 0.60, 0.70]); vB0 = rnd([-0.40, -0.30, -0.20, 0, 0, 0.10]);
                }
            }
            const P = { typ, mA, mB, vA0, vB0, xA0: 0.55, xB0: 1.20, E: 0.08, xc: 1.0 };
            const ptot = mA * vA0 + mB * vB0, Mt = mA + mB;
            if (typ === 'oelastisk') {
                return {
                    dim, P, facit: ptot / Mt, enhet: 'm/s',
                    text: `Vagn A (${fmtk(mA, 2)} kg) har hastigheten ${fmt(vA0, 2)} m/s och vagn B (${fmtk(mB, 2)} kg) har ${fmt(vB0, 2)} m/s. Vagnarna hakar i varandra. Vilken hastighet <em>v</em> får de efter stöten?`,
                    forklaring: `Rörelsemängden före: ${fmtk(mA, 2)} · ${fmt(vA0, 2)} + ${fmtk(mB, 2)} · ${par(fmt(vB0, 2))} = ${fmtk(ptot, 4)} kg · m/s. Efter: (${fmtk(mA, 2)} + ${fmtk(mB, 2)}) · <em>v</em> = ${fmtk(ptot, 4)}, så <em>v</em> = ${fmtk(ptot, 4)} / ${fmtk(Mt, 2)} = ${fmt(ptot / Mt, 2)} m/s.`,
                };
            }
            const vA1 = Math.round(((mA - mB) * vA0 + 2 * mB * vB0) / Mt * 100) / 100;
            const facit = (ptot - mA * vA1) / mB;
            return {
                dim, P, facit, enhet: 'm/s', visaA: vA1,
                text: `Vagn A (${fmtk(mA, 2)} kg) har hastigheten ${fmt(vA0, 2)} m/s och vagn B (${fmtk(mB, 2)} kg) har ${fmt(vB0, 2)} m/s. De studsar isär, och efter stöten har A hastigheten ${fmt(vA1, 2)} m/s. Vilken hastighet <em>v</em><sub>B</sub> får B?`,
                forklaring: `Rörelsemängden före: ${fmtk(mA, 2)} · ${fmt(vA0, 2)} + ${fmtk(mB, 2)} · ${par(fmt(vB0, 2))} = ${fmtk(ptot, 4)} kg · m/s. Efter: ${fmtk(mA, 2)} · ${par(fmt(vA1, 2))} + ${fmtk(mB, 2)} · <em>v</em><sub>B</sub> = ${fmtk(ptot, 4)}, så <em>v</em><sub>B</sub> = (${fmtk(ptot, 4)} − ${par(fmtk(mA * vA1, 4))}) / ${fmtk(mB, 2)} = ${fmt(facit, 2)} m/s.`,
            };
        };
        const tolka = (s) => parseFloat(String(s).trim().replace(/\s/g, '').replace(',', '.').replace('−', '-'));

        // ═══════════ Appen ═══════════
        const App = () => {
            const [dim, setDim] = useState(() => new URLSearchParams(location.search).get('dim') === '2d' ? '2d' : '1d');
            const [p1, setP1] = useState(P1(FORSOK_1D[0]));
            const [p2, setP2] = useState(P2(FORSOK_2D[0]));
            const [forsok1, setForsok1] = useState('lika');
            const [forsok2, setForsok2] = useState('snett');
            const [t, setT] = useState(0);
            const [running, setRunning] = useState(false);
            const [speed, setSpeed] = useState(1);
            const [show, setShow] = useState({ pilar: true, strob: true, cm: false });
            const [gissa, setGissa] = useState(false);
            const [fraga, setFraga] = useState(null);
            const [gst, setGst] = useState({ svar: '', forsok: 0, klar: false, resultat: null });
            const [poang, setPoang] = useState({ p: 0, svit: 0, antal: 0 });
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [smal, setSmal] = useState(() => window.matchMedia('(max-width: 600px)').matches);
            valjLayout(smal);
            const [bred, setBred] = useState(() => window.matchMedia('(min-width: 1000px)').matches);
            const [togglesOpen, setTogglesOpen] = useState(() => !window.matchMedia('(max-width: 600px)').matches);

            const sceneWrapRef = useRef(null);
            const svgRef = useRef(null);
            const dragRef = useRef(null);

            const aktivP = gissa && fraga ? fraga.P : (dim === '1d' ? p1 : p2);
            const aktivDim = gissa && fraga ? fraga.dim : dim;
            const M = useMemo(() => aktivDim === '1d' ? modell1D(aktivP) : modell2D(aktivP), [aktivP, aktivDim]);
            const gom = gissa && !gst.klar;
            // I gissa-läget stannar tiden vid stöten tills eleven har svarat
            const tGrans = gom && M.harStot ? M.tc - 1e-6 : M.tEnd;
            const tv = Math.min(t, tGrans);
            const S = tillstand(M, tv);

            const Mref = useRef(M), tRef = useRef(0), spdRef = useRef(1), gransRef = useRef(tGrans);
            Mref.current = M; tRef.current = tv; spdRef.current = speed; gransRef.current = tGrans;

            useEffect(() => {
                if (!running) return;
                let raf, last = performance.now();
                const loop = (now) => {
                    const dt = Math.min(0.05, (now - last) / 1000);
                    last = now;
                    const nytt = tRef.current + dt * spdRef.current;
                    if (nytt >= gransRef.current) { setT(gransRef.current); setRunning(false); return; }
                    setT(nytt);
                    raf = requestAnimationFrame(loop);
                };
                raf = requestAnimationFrame(loop);
                return () => cancelAnimationFrame(raf);
            }, [running]);

            useEffect(() => {
                const handler = () => {
                    const w = sceneWrapRef.current;
                    setIsFullscreen(!!w && (document.fullscreenElement === w || document.webkitFullscreenElement === w));
                };
                document.addEventListener('fullscreenchange', handler);
                document.addEventListener('webkitfullscreenchange', handler);
                const mqs = window.matchMedia('(max-width: 600px)');
                mqs.addEventListener('change', () => setSmal(mqs.matches));
                const mqb = window.matchMedia('(min-width: 1000px)');
                const mqbh = () => setBred(mqb.matches);
                mqb.addEventListener('change', mqbh);
                return () => {
                    document.removeEventListener('fullscreenchange', handler);
                    document.removeEventListener('webkitfullscreenchange', handler);
                    mqb.removeEventListener('change', mqbh);
                };
            }, []);
            const toggleFullscreen = () => {
                const el = sceneWrapRef.current;
                if (!el) return;
                if (document.fullscreenElement || document.webkitFullscreenElement)
                    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
            };
            const bredFs = isFullscreen && bred;

            const nollstall = () => { setRunning(false); setT(0); };
            const andra1 = (f) => { setP1((p) => ({ ...p, ...f })); setForsok1(null); nollstall(); };
            const andra2 = (f) => { setP2((p) => ({ ...p, ...f })); setForsok2(null); nollstall(); };

            const valjForsok = (f) => {
                if (dim === '1d') { setP1(P1(f)); setForsok1(f.id); }
                else { setP2(P2(f)); setForsok2(f.id); }
                nollstall();
                setTimeout(() => setRunning(true), 250);
            };
            const valjDim = (d) => {
                setDim(d); nollstall();
                if (gissa) nyUppgift(d);
            };
            const valjTyp = (typ) => {
                if (dim === '1d') {
                    if (typ === 'isar') { setP1((p) => ({ ...p, typ, E: p.E || 0.08, xc: 1.0 })); }
                    else if (p1.typ === 'isar') { setP1((p) => ({ ...p, typ, vA0: 0.50, vB0: 0, xA0: 0.45, xB0: 1.15 })); }
                    else setP1((p) => ({ ...p, typ }));
                    setForsok1(null);
                } else { setP2((p) => ({ ...p, typ })); setForsok2(null); }
                nollstall();
            };
            // Ändrad massa i 2D: puckens radie ändras, så B knuffas undan om de överlappar
            const massa2 = (vem, m) => {
                setP2((p) => {
                    const q = { ...p, ['m' + vem]: m };
                    const R = radie(q.mA) + radie(q.mB) + 0.004;
                    const d = sub(q.B, q.A), L = len(d);
                    if (L < R) q.B = add(q.A, mul(L > 1e-9 ? mul(d, 1 / L) : V(1, 0), R));
                    return q;
                });
                setForsok2(null); nollstall();
            };
            const fart2 = (vem, f) => {
                setP2((p) => {
                    const v = p['v' + vem], L = len(v);
                    const u = L > 1e-9 ? mul(v, 1 / L) : (vem === 'A' ? V(1, 0) : V(-1, 0));
                    return { ...p, ['v' + vem]: mul(u, f) };
                });
                setForsok2(null); nollstall();
            };

            // ── Testa dig själv ──
            const nyUppgift = (d) => {
                setFraga(nyFraga(d || dim));
                setGst({ svar: '', forsok: 0, klar: false, resultat: null });
                setRunning(false); setT(0);
                setTimeout(() => setRunning(true), 300);
            };
            const valjLage = (l) => {
                if (l === 'gissa') { setGissa(true); nyUppgift(dim); }
                else { setGissa(false); setFraga(null); nollstall(); }
            };
            const svara = () => {
                if (!fraga || gst.klar) return;
                const x = tolka(gst.svar);
                if (!isFinite(x)) { setGst((g) => ({ ...g, resultat: { typ: 'tom' } })); return; }
                const ok = Math.abs(x - fraga.facit) <= Math.max(0.006, Math.abs(fraga.facit) * 0.025);
                const forsok = gst.forsok + 1;
                if (ok || forsok >= 2) {
                    const pts = ok ? (forsok === 1 ? 3 : 1) : 0;
                    setPoang((p) => ({ p: p.p + pts, svit: ok ? p.svit + 1 : 0, antal: p.antal + 1 }));
                    setGst((g) => ({ ...g, forsok, klar: true, resultat: { typ: ok ? 'ratt' : 'fel', pts } }));
                    setTimeout(() => setRunning(true), 200);
                } else {
                    setGst((g) => ({ ...g, forsok, resultat: { typ: 'forsok' } }));
                }
            };

            // ── Dra i scenen ──
            const svgPunkt = (e) => {
                const svg = svgRef.current;
                const pt = svg.createSVGPoint();
                pt.x = e.clientX; pt.y = e.clientY;
                return pt.matrixTransform(svg.getScreenCTM().inverse());
            };
            const onDown = (e, d) => {
                if (gissa || tv !== 0 || running) return;
                e.stopPropagation();
                const p = svgPunkt(e);
                if (aktivDim === '1d') {
                    const x0 = d.vem === 'A' ? M.start.A.x : M.start.B.x;
                    dragRef.current = { ...d, off: (p.x - X0) / S1 - x0 };
                } else {
                    const c = d.vem === 'A' ? p2.A : p2.B;
                    dragRef.current = { ...d, off: V((p.x - TX0) / S2 - c.x, (TH - (p.y - TY0) / S2) - c.y) };
                }
                try { svgRef.current.setPointerCapture(e.pointerId); } catch (err) {}
            };
            const onMove = (e) => {
                const d = dragRef.current;
                if (!d) return;
                const p = svgPunkt(e);
                if (aktivDim === '1d') {
                    const D = D1(p1.typ);
                    if (d.typ === 'vagn') {
                        const x = Math.round(((p.x - X0) / S1 - d.off) * 100) / 100;
                        if (p1.typ === 'isar') {
                            const xc = d.vem === 'A' ? x + D / 2 : x - D / 2;
                            andra1({ xc: clamp(xc, XMIN + D / 2, XMAX - D / 2) });
                        } else if (d.vem === 'A') andra1({ xA0: clamp(x, XMIN, p1.xB0 - D - 0.01) });
                        else andra1({ xB0: clamp(x, p1.xA0 + D + 0.01, XMAX) });
                    } else if (d.typ === 'pil' && p1.typ !== 'isar') {
                        const hw = GL / 2 * S1;
                        const cx = xp(d.vem === 'A' ? p1.xA0 : p1.xB0);
                        // Pilen börjar vid vagnens framkant i rörelseriktningen och
                        // byter sida när den dras förbi vagnen.
                        let v = 0;
                        if (p.x > cx + hw) v = (p.x - (cx + hw)) / VS1;
                        else if (p.x < cx - hw) v = (p.x - (cx - hw)) / VS1;
                        v = clamp(snapv(v), -1, 1);
                        andra1(d.vem === 'A' ? { vA0: v } : { vB0: v });
                    }
                } else {
                    const mx = (p.x - TX0) / S2, my = TH - (p.y - TY0) / S2;
                    if (d.typ === 'puck') {
                        const r = radie(d.vem === 'A' ? p2.mA : p2.mB);
                        const ny = V(clamp(Math.round((mx - d.off.x) * 100) / 100, r + 0.01, TW - r - 0.01),
                                     clamp(Math.round((my - d.off.y) * 100) / 100, r + 0.01, TH - r - 0.01));
                        const annan = d.vem === 'A' ? p2.B : p2.A;
                        if (len(sub(ny, annan)) < radie(p2.mA) + radie(p2.mB) + 0.004) return;
                        andra2(d.vem === 'A' ? { A: ny } : { B: ny });
                    } else {
                        const c = d.vem === 'A' ? p2.A : p2.B, r = radie(d.vem === 'A' ? p2.mA : p2.mB);
                        const rel = V(mx - c.x, my - c.y), L = len(rel);
                        let v = V(0, 0);
                        if (L > r) {
                            const u = mul(rel, 1 / L);
                            v = mul(u, (L - r) * S2 / VS2);
                        }
                        v = V(snapv(v.x), snapv(v.y));
                        const f = len(v);
                        if (f > 1) v = mul(v, 1 / f);
                        andra2(d.vem === 'A' ? { vA: v } : { vB: v });
                    }
                }
            };
            const onUp = () => { dragRef.current = null; };

            // ── Gemensamma bitar ──
            const spelaText = running ? 'Paus' : tv >= tGrans - 1e-6 && tv > 0 ? (gom ? 'Svara först' : 'Spela igen') : 'Starta';
            const spela = () => {
                if (running) { setRunning(false); return; }
                if (tv >= tGrans - 1e-6 && tv > 0) {
                    if (gom) return;
                    setT(0);
                }
                setRunning(true);
            };
            const styrknappar = (
                <div className="styr">
                    <button className="btn-toggle btn-prim btn-spela" onClick={spela} disabled={gom && tv >= tGrans - 1e-6 && tv > 0 && !running}>
                        {running ? (
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="1" /><rect x="14" y="4" width="5" height="16" rx="1" /></svg>
                        ) : (
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z" /></svg>
                        )}
                        {spelaText}
                    </button>
                    <button className="btn-toggle btn-om" onClick={nollstall}>Börja om</button>
                    <div className="tidrad">
                        <span>Tid</span>
                        <input type="range" min="0" max={tGrans} step="0.01" value={tv}
                               onChange={(e) => { setRunning(false); setT(parseFloat(e.target.value)); }} aria-label="Tid" />
                        <b>{fmt(tv, 2)}&nbsp;s</b>
                    </div>
                </div>
            );
            const fartval = (namn) => (
                <React.Fragment>
                    {[[0.25, 'Ultrarapid'], [0.5, 'Långsamt'], [1, 'Normalt']].map(([v, t2]) => (
                        <label key={v}><input type="radio" name={namn} checked={speed === v} onChange={() => setSpeed(v)} /><span>{t2}</span></label>
                    ))}
                </React.Fragment>
            );

            const typ = aktivDim === '1d' ? (gissa && fraga ? fraga.P.typ : p1.typ) : (gissa && fraga ? fraga.P.typ : p2.typ);
            const typKnappar = dim === '1d'
                ? [['elastisk', 'Elastisk'], ['oelastisk', 'Oelastisk'], ['isar', 'Knuffa isär']]
                : [['elastisk', 'Elastisk'], ['oelastisk', 'Oelastisk']];

            const reglage = (kompakt) => {
                if (gissa) return null;
                const mRad = (vem, val, on) => (
                    <Reglage kompakt={kompakt} label={<span><span className="prick" style={{ background: vem === 'A' ? COL.A : COL.B }}></span>Massa <em>m</em><sub>{vem}</sub></span>}
                             value={val} min={0.10} max={1.00} step={0.05} enhet="kg" onChange={on} />
                );
                if (dim === '1d') {
                    const vl = (vem) => <span><span className="prick" style={{ background: vem === 'A' ? COL.A : COL.B }}></span>Hastighet <span dangerouslySetInnerHTML={{ __html: htmlV(p1.typ, vem, false) }} /></span>;
                    return (
                        <React.Fragment>
                            {mRad('A', p1.mA, (v) => andra1({ mA: v }))}
                            {mRad('B', p1.mB, (v) => andra1({ mB: v }))}
                            {p1.typ === 'isar' ? (
                                <Reglage kompakt={kompakt} label="Fjäderns energi" value={p1.E} min={0.01} max={0.20} step={0.01} enhet="J" onChange={(v) => andra1({ E: v })} />
                            ) : (
                                <React.Fragment>
                                    <Reglage kompakt={kompakt} label={vl('A')} value={p1.vA0} min={-1} max={1} step={0.05} enhet="m/s" onChange={(v) => andra1({ vA0: v })} />
                                    <Reglage kompakt={kompakt} label={vl('B')} value={p1.vB0} min={-1} max={1} step={0.05} enhet="m/s" onChange={(v) => andra1({ vB0: v })} />
                                </React.Fragment>
                            )}
                        </React.Fragment>
                    );
                }
                const fl = (vem) => <span><span className="prick" style={{ background: vem === 'A' ? COL.A : COL.B }}></span>Fart före, puck {vem}</span>;
                return (
                    <React.Fragment>
                        {mRad('A', p2.mA, (v) => massa2('A', v))}
                        {mRad('B', p2.mB, (v) => massa2('B', v))}
                        <Reglage kompakt={kompakt} label={fl('A')} value={Math.round(len(p2.vA) * 100) / 100} min={0} max={1} step={0.05} enhet="m/s" onChange={(v) => fart2('A', v)} />
                        <Reglage kompakt={kompakt} label={fl('B')} value={Math.round(len(p2.vB) * 100) / 100} min={0} max={1} step={0.05} enhet="m/s" onChange={(v) => fart2('B', v)} />
                    </React.Fragment>
                );
            };

            const testPanel = gissa && fraga && (
                <div className="glass-card rounded-xl p-3">
                    <div className="flex justify-between items-baseline mb-2">
                        <span className="flbl">Uppgift</span>
                        <span className="anm">Poäng <b>{poang.p}</b> · svit <b>{poang.svit}</b></span>
                    </div>
                    <p className="fraga" dangerouslySetInnerHTML={{ __html: fraga.text }} />
                    <p className="anm mt-1">Positiv riktning åt höger. Skriv svaret med två decimaler.</p>
                    <div className="flex items-center gap-2 mt-2">
                        <input className="txt-in" value={gst.svar} disabled={gst.klar} inputMode="decimal"
                               onChange={(e) => setGst((g) => ({ ...g, svar: e.target.value }))}
                               onKeyDown={(e) => { if (e.key === 'Enter') svara(); }} aria-label="Ditt svar" />
