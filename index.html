    <style>
        :root {
            --ns-max: 1280px;
            --ns-pad: 56px;
            --ns-r-lg: 30px;
            --ns-r-md: 20px;
            --ns-r-sm: 12px;
            --ns-papper: #f8f4ec;
            --ns-rut: rgba(28, 61, 107, 0.075);
            --ns-skugga: 0 1px 0 rgba(255, 255, 255, 0.7) inset,
                         0 2px 6px -2px rgba(15, 22, 32, 0.10),
                         0 28px 60px -28px rgba(15, 22, 32, 0.38);
            --ns-skugga-hog: 0 2px 8px -2px rgba(15, 22, 32, 0.12),
                             0 44px 80px -32px rgba(15, 22, 32, 0.45);
            --ns-ease: cubic-bezier(.2, .7, .2, 1);
            --ns-ratt: #2f7d4f;
        }
        html { scroll-behavior: smooth; }
        body.laborans { background: var(--lab-bg); overflow-x: hidden; }
        .ns-wrap { max-width: var(--ns-max); margin: 0 auto; padding: 0 var(--ns-pad); width: 100%; }
        .ns-mono {
            font-family: var(--lab-font-mono); font-size: 11px; letter-spacing: 0.16em;
            text-transform: uppercase; color: var(--lab-ink-muted);
        }

        .ns-sok-ikon { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
            background: var(--lab-bg-raised); color: var(--lab-ink-soft); flex: 0 0 auto; }

        /* ── Hjälten: en labbänk av rutat papper ────────────────────── */
        .ns-hero { padding: 18px 0 0; }
        .ns-stage {
            position: relative; overflow: hidden; isolation: isolate;
            border-radius: var(--ns-r-lg);
            background: var(--ns-papper);
            border: 1px solid rgba(15, 22, 32, 0.08);
            box-shadow: 0 1px 0 rgba(255,255,255,.8) inset, 0 40px 90px -60px rgba(15, 22, 32, 0.45);
            padding: 72px 64px 56px;
            display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); gap: 40px;
            min-height: 640px;
        }
        /* Rutnätet tonar ut mot kanterna, som ett blad i ett kollegieblock. */
        .ns-stage::before {
            content: ''; position: absolute; inset: 0; z-index: -2;
            background-image:
                linear-gradient(var(--ns-rut) 1px, transparent 1px),
                linear-gradient(90deg, var(--ns-rut) 1px, transparent 1px),
                linear-gradient(rgba(28, 61, 107, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(28, 61, 107, 0.06) 1px, transparent 1px);
            background-size: 28px 28px, 28px 28px, 140px 140px, 140px 140px;
            -webkit-mask-image: radial-gradient(ellipse 85% 90% at 72% 42%, #000 35%, transparent 80%);
            mask-image: radial-gradient(ellipse 85% 90% at 72% 42%, #000 35%, transparent 80%);
        }
        /* Mjukt ljus bakom kollaget: accentrött och djupblått. */
        .ns-stage::after {
            content: ''; position: absolute; z-index: -1; inset: -20%;
            background:
                radial-gradient(closest-side at 78% 30%, rgba(200, 50, 74, 0.16), transparent 70%),
                radial-gradient(closest-side at 62% 82%, rgba(28, 61, 107, 0.16), transparent 70%),
                radial-gradient(closest-side at 12% 8%, rgba(255, 255, 255, 0.9), transparent 70%);
            filter: blur(10px);
            pointer-events: none;
        }
        .ns-hero-text { min-width: 0; display: flex; flex-direction: column; justify-content: center; position: relative; z-index: 2; }
        .ns-nytt {
            align-self: flex-start; display: inline-flex; align-items: center; gap: 10px;
            padding: 5px 14px 5px 5px; border-radius: 999px;
            background: rgba(255, 255, 255, 0.85); border: 1px solid var(--lab-line);
            box-shadow: 0 6px 18px -10px rgba(15, 22, 32, 0.3);
            font-size: 13px; color: var(--lab-ink-soft); text-decoration: none;
            transition: transform 200ms var(--ns-ease), box-shadow 200ms ease;
            max-width: 100%;
        }
        .ns-nytt:hover { transform: translateY(-1px); box-shadow: 0 10px 24px -12px rgba(15, 22, 32, 0.4); color: var(--lab-ink); }
        .ns-nytt-tag {
            font-family: var(--lab-font-mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase;
            background: var(--lab-accent); color: #fff; padding: 4px 9px; border-radius: 999px; flex: 0 0 auto;
        }
        .ns-nytt-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ns-nytt svg { flex: 0 0 auto; }
        .ns-h1 {
            font-family: var(--lab-font-display); font-weight: 400;
            font-size: clamp(54px, 7vw, 104px); line-height: 0.9; letter-spacing: -0.025em;
            color: var(--lab-ink); margin: 30px 0 26px;
        }
        .ns-h1 em { color: var(--lab-accent); position: relative; white-space: nowrap; }
        .ns-h1 .ns-streck {
            position: absolute; left: -2%; right: -4%; bottom: -0.1em; width: 106%; height: 0.32em;
            overflow: visible; pointer-events: none;
        }
        .ns-h1 .ns-streck path {
            fill: none; stroke: var(--lab-accent); stroke-width: 5; stroke-linecap: round;
            stroke-dasharray: 520; stroke-dashoffset: 520; opacity: 0.85;
            animation: ns-rita 1.1s 0.5s var(--ns-ease) forwards;
        }
        @keyframes ns-rita { to { stroke-dashoffset: 0; } }
        .ns-lead { font-size: 18.5px; line-height: 1.6; color: var(--lab-ink-soft); max-width: 31em; margin: 0 0 32px; }
        .ns-lead strong { color: var(--lab-ink); font-weight: 600; }
        .ns-cta { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 14px; }
        .ns-knapp {
            display: inline-flex; align-items: center; gap: 10px; height: 52px; padding: 0 24px;
            border-radius: 999px; font-size: 15px; font-weight: 600; text-decoration: none;
            transition: transform 200ms var(--ns-ease), box-shadow 200ms ease, background 200ms ease;
        }
        .ns-knapp svg { transition: transform 200ms var(--ns-ease); }
        .ns-knapp:hover svg { transform: translateX(3px); }
        .ns-knapp-primar { background: var(--lab-ink); color: var(--lab-bg) !important; box-shadow: 0 14px 30px -14px rgba(15, 22, 32, 0.7); }
        .ns-knapp-primar:hover { transform: translateY(-2px); background: #1b2533; }
        .ns-knapp-sekundar { background: rgba(255, 255, 255, 0.75); color: var(--lab-ink); border: 1px solid var(--lab-line-strong); }
        .ns-knapp-sekundar:hover { transform: translateY(-2px); background: #fff; }
        .ns-filmlank {
            display: inline-flex; align-items: center; gap: 10px; margin-left: 6px;
            font-size: 14.5px; color: var(--lab-ink-soft); text-decoration: none; font-weight: 500;
        }
        .ns-filmlank span.ring {
            width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
            border: 1px solid var(--lab-line-strong); background: rgba(255,255,255,.6); color: var(--lab-accent);
            transition: transform 200ms var(--ns-ease);
        }
        .ns-filmlank:hover { color: var(--lab-ink); }
        .ns-filmlank:hover span.ring { transform: scale(1.08); }
        .ns-stats {
            display: grid; grid-template-columns: repeat(4, auto); justify-content: start; gap: 0;
            margin-top: 46px; padding-top: 22px; border-top: 1px solid var(--lab-line);
        }
        .ns-stat { padding: 0 28px; border-left: 1px solid var(--lab-line); }
        .ns-stat:first-child { padding-left: 0; border-left: 0; }
        .ns-stat b {
            display: block; font-family: var(--lab-font-display); font-weight: 400;
            font-size: 40px; line-height: 1; letter-spacing: -0.02em; color: var(--lab-ink);
        }
        .ns-stat span { display: block; white-space: nowrap; margin-top: 8px; font-family: var(--lab-font-mono); font-size: 10.5px;
            letter-spacing: 0.14em; text-transform: uppercase; color: var(--lab-ink-muted); }

        /* Kollaget: riktiga skärmbilder från sajten, upplagda som blad på en bänk. */
        .ns-kollage { position: relative; height: 600px; align-self: center; perspective: 1400px; }
        .ns-blad {
            position: absolute; margin: 0;
            --rot: 0deg; --px: 0px; --py: 0px; --djup: 1;
            transform: translate3d(var(--px), var(--py), 0) rotate(var(--rot));
            transition: transform 600ms var(--ns-ease), box-shadow 300ms ease;
            will-change: transform;
        }
        .ns-blad-kropp {
            border-radius: var(--ns-r-md); overflow: hidden; background: #fff;
            border: 1px solid rgba(15, 22, 32, 0.10); box-shadow: var(--ns-skugga);
            animation: ns-sva 9s ease-in-out infinite alternate;
        }
        .ns-blad:hover { --rot: 0deg !important; z-index: 9; }
        .ns-blad:hover .ns-blad-kropp { box-shadow: var(--ns-skugga-hog); }
        .ns-blad img { display: block; width: 100%; height: auto; }
        @keyframes ns-sva { from { transform: translateY(-5px); } to { transform: translateY(6px); } }
        .ns-blad-etikett {
            position: absolute; left: 14px; bottom: 14px; display: inline-flex; align-items: center; gap: 8px;
            padding: 7px 12px 7px 10px; border-radius: 999px;
            background: rgba(255, 255, 255, 0.92); border: 1px solid var(--lab-line);
            -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
            font-size: 12.5px; font-weight: 500; color: var(--lab-ink);
            box-shadow: 0 6px 18px -10px rgba(15, 22, 32, 0.45);
        }
        .ns-blad-etikett i { width: 8px; height: 8px; border-radius: 50%; background: var(--lab-accent); display: block;
            box-shadow: 0 0 0 4px rgba(200, 50, 74, 0.16); animation: ns-puls 2.4s ease-in-out infinite; }
        @keyframes ns-puls { 50% { box-shadow: 0 0 0 7px rgba(200, 50, 74, 0.04); } }
        .ns-blad-etikett.mork { background: rgba(15, 22, 32, 0.78); color: #f3eee4; border-color: rgba(255,255,255,.12); }
        .ns-a { top: 0; right: 0; width: 74%; --rot: 2.2deg; z-index: 2; }
        .ns-a .ns-blad-kropp { animation-duration: 10s; }
        .ns-b { left: 0; top: 196px; width: 44%; --rot: -4.5deg; z-index: 4; }
        .ns-b .ns-blad-kropp { animation-duration: 8s; animation-delay: -3s; background: #f7f2e8; }
        .ns-c { left: 30%; bottom: 0; width: 52%; --rot: -2deg; z-index: 3; }
        .ns-c .ns-blad-kropp { animation-duration: 11s; animation-delay: -5s; background: #0f1620; border-color: rgba(255,255,255,.08); }
        .ns-tejp {
            position: absolute; width: 92px; height: 26px; z-index: 5;
            background: rgba(250, 238, 200, 0.72);
            box-shadow: 0 1px 3px rgba(15, 22, 32, 0.12);
            -webkit-mask-image: linear-gradient(90deg, transparent 0 3px, #000 3px calc(100% - 3px), transparent calc(100% - 3px));
        }
        .ns-formel {
            position: absolute; z-index: 6; left: 4%; top: 22px;
            --rot: -3deg; padding: 14px 20px 12px; border-radius: 16px;
            background: #fff; border: 1px solid var(--lab-line); box-shadow: var(--ns-skugga);
        }
        .ns-formel .ns-mono { display: block; font-size: 9.5px; margin-bottom: 4px; color: var(--lab-accent); }
        .ns-formel .katex { font-size: 1.45em; color: var(--lab-ink); }

        /* ── Rubriker för sektionerna ───────────────────────────────── */
        .ns-sektion { padding: 120px 0 0; }
        .ns-rubrikrad { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 40px; flex-wrap: wrap; }
        .ns-h2 {
            font-family: var(--lab-font-display); font-weight: 400;
            font-size: clamp(38px, 4.6vw, 62px); line-height: 1; letter-spacing: -0.02em;
            color: var(--lab-ink); margin: 14px 0 0;
        }
        .ns-h2 em { color: var(--lab-accent); }
        .ns-ingress { font-size: 17px; line-height: 1.6; color: var(--lab-ink-soft); max-width: 30em; margin: 0; }
        .ns-pil-lank {
            display: inline-flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 600;
            color: var(--lab-ink); text-decoration: none; padding-bottom: 3px;
            border-bottom: 2px solid var(--lab-accent);
        }
        .ns-pil-lank svg { transition: transform 200ms var(--ns-ease); }
        .ns-pil-lank:hover svg { transform: translateX(3px); }

        /* ── Kurserna ───────────────────────────────────────────────── */
        .ns-kurser { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; }
        .ns-kurs {
            position: relative; overflow: hidden; border-radius: var(--ns-r-lg);
            background: #fff; border: 1px solid var(--lab-line);
            box-shadow: 0 1px 0 rgba(255,255,255,.8) inset, 0 24px 50px -40px rgba(15, 22, 32, 0.5);
            display: flex; flex-direction: column;
            transition: transform 300ms var(--ns-ease), box-shadow 300ms ease;
        }
        .ns-kurs:hover { transform: translateY(-4px); box-shadow: var(--ns-skugga-hog); }
        .ns-kurs-konst { position: relative; height: 190px; overflow: hidden; }
        .ns-kurs-konst svg { position: absolute; inset: 0; width: 100%; height: 100%; }
        .ns-kurs[data-amne="fy"] .ns-kurs-konst { background: linear-gradient(140deg, #fbe9ea, #f6dadc); }
        .ns-kurs[data-amne="ma"] .ns-kurs-konst { background: linear-gradient(140deg, #e6edf7, #d9e3f1); }
        .ns-kurs[data-amne="mf"] .ns-kurs-konst { background: linear-gradient(140deg, #1a2433, #0f1620); }
        .ns-kurs-kropp { padding: 26px 28px 28px; display: flex; flex-direction: column; flex: 1; }
        .ns-kurs h3 { font-family: var(--lab-font-display); font-weight: 400; font-size: 38px; line-height: 1;
            letter-spacing: -0.015em; margin: 8px 0 10px; color: var(--lab-ink); }
        .ns-kurs p { font-size: 15px; line-height: 1.55; color: var(--lab-ink-soft); margin: 0 0 22px; }
        .ns-nivaer { margin-top: auto; display: grid; gap: 8px; }
        .ns-nivaer.tva { grid-template-columns: 1fr 1fr; }
        .ns-niva {
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            padding: 13px 16px; border-radius: 14px; text-decoration: none;
            background: var(--lab-bg); border: 1px solid transparent; color: var(--lab-ink);
            transition: background 180ms ease, border-color 180ms ease, transform 180ms var(--ns-ease);
        }
        .ns-niva b { font-weight: 600; font-size: 15px; }
        .ns-niva small { display: block; font-family: var(--lab-font-mono); font-size: 10.5px; letter-spacing: 0.08em; color: var(--lab-ink-muted); margin-top: 2px; }
        .ns-niva svg { color: var(--lab-ink-muted); transition: transform 180ms var(--ns-ease), color 180ms ease; }
        .ns-niva:hover { background: #fff; border-color: var(--lab-accent); transform: translateY(-1px); }
        .ns-niva:hover svg { color: var(--lab-accent); transform: translateX(2px); }

        /* ── Bento: vad som finns ───────────────────────────────────── */
        .ns-bento { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 22px; }
        .ns-ruta {
            position: relative; overflow: hidden; border-radius: var(--ns-r-lg);
            background: #fff; border: 1px solid var(--lab-line); padding: 32px;
            text-decoration: none; color: var(--lab-ink); display: flex; flex-direction: column;
            transition: transform 300ms var(--ns-ease), box-shadow 300ms ease;
            box-shadow: 0 24px 50px -44px rgba(15, 22, 32, 0.5);
        }
        .ns-ruta:hover { transform: translateY(-4px); box-shadow: var(--ns-skugga-hog); }
        .ns-ruta h3 { font-family: var(--lab-font-display); font-weight: 400; font-size: 32px; line-height: 1.02;
            letter-spacing: -0.015em; margin: 10px 0 10px; }
        .ns-ruta p { font-size: 15px; line-height: 1.55; color: var(--lab-ink-soft); margin: 0; max-width: 28em; }
        .ns-ruta .ns-mono { color: var(--lab-accent); }
        .ns-ruta-pil { position: absolute; top: 26px; right: 26px; width: 40px; height: 40px; border-radius: 50%;
            display: grid; place-items: center; border: 1px solid var(--lab-line-strong); color: var(--lab-ink);
            transition: background 200ms ease, color 200ms ease, transform 300ms var(--ns-ease); }
        .ns-ruta:hover .ns-ruta-pil { background: var(--lab-ink); color: var(--lab-bg); transform: rotate(-45deg); }
        .ns-r-penna { grid-column: span 3; grid-row: span 2; background: var(--ns-papper); padding-bottom: 0; }
        .ns-r-sim { grid-column: span 3; }
        .ns-r-np, .ns-r-ov, .ns-r-verktyg { grid-column: span 1; }
        .ns-r-smal { grid-column: span 3; }
        .ns-penna-ark {
            margin: 30px -2px 0; flex: 1; min-height: 400px; position: relative;
            border-radius: 18px 18px 0 0; overflow: hidden; border: 1px solid var(--lab-line); border-bottom: 0;
            background: #f7f2e8; box-shadow: 0 -10px 40px -30px rgba(15,22,32,.4);
        }
        .ns-penna-ark img { position: absolute; left: 0; top: 0; width: 100%; height: auto; }
        /* Den riktiga pennmotorn skriver i rutan. Arket flyttas uppåt så att
           pennan hela tiden syns; motorns egna knappar behövs inte här. */
        .ns-penna-yta { position: absolute; left: 0; right: 0; top: 0; will-change: transform;
            transition: opacity 600ms ease; pointer-events: none; }
        .ns-penna-yta.tonad { opacity: 0; }
        .ns-penna-ark .hk-controls, .ns-penna-ark .hk-fsbtn, .ns-penna-ark .hk-settings,
        .ns-penna-ark .hk-setbtn, .ns-penna-ark .hk-navrail, .ns-penna-ark .hk-vyval { display: none !important; }
        .ns-penna-ark .hk-wrap { margin: 0; }
        .ns-penna-ark .hk-paper { border: 0; border-radius: 0; box-shadow: none; cursor: inherit; }
        .ns-penna-chip {
            position: absolute; left: 14px; bottom: 14px; z-index: 2; display: inline-flex; align-items: center; gap: 8px;
            padding: 7px 12px 7px 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.92);
            border: 1px solid var(--lab-line); font-size: 12.5px; font-weight: 500; color: var(--lab-ink);
            box-shadow: 0 6px 18px -10px rgba(15, 22, 32, 0.45);
        }
        .ns-penna-chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--lab-accent); display: block;
            box-shadow: 0 0 0 4px rgba(200, 50, 74, 0.16); animation: ns-puls 2.4s ease-in-out infinite; }
        .ns-sim-mosaik { position: relative; height: 170px; margin-top: 26px; }
        .ns-sim-mosaik img {
            position: absolute; top: 0; height: 160px; width: auto; border-radius: 14px;
            border: 1px solid var(--lab-line); box-shadow: 0 18px 30px -20px rgba(15,22,32,.5);
            transition: transform 400ms var(--ns-ease);
        }
        .ns-sim-mosaik img:nth-child(1) { left: 0; transform: rotate(-3deg); }
        .ns-sim-mosaik img:nth-child(2) { left: 30%; transform: rotate(1.5deg); z-index: 2; }
        .ns-sim-mosaik img:nth-child(3) { left: 60%; transform: rotate(-1deg); }
        .ns-ruta:hover .ns-sim-mosaik img:nth-child(1) { transform: rotate(-6deg) translateX(-8px); }
        .ns-ruta:hover .ns-sim-mosaik img:nth-child(3) { transform: rotate(2deg) translateX(8px); }
        .ns-tre { grid-column: span 3; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }

        const antalAvsnitt = (kurs) => KATALOG.filter(a => a.course === kurs).length;

        const UPDATES = [
            { date: '2026-10-16', href: 'katalog.html?id=ma1c-4.7&block=varfor-blir-produkten-1', title: 'Simulering: vrid lutningstrappan ett kvarts varv', text: 'Välj lutningen på en linje och tryck på knappen: trappsteget svänger 90 grader och lägger sig på den vinkelräta linjen. Stegen byter plats och det ena byter tecken, och därför blir produkten av k-värdena alltid −1. Ställ linjen vågrätt så ser du undantaget.' },
            { date: '2026-10-16', href: 'katalog.html?id=ma1c-4.7', title: 'Ny genomgång i Matematik nivå 1c: vinkelräta linjer (överkurs)', text: 'Två linjer som skär varandra i rät vinkel har k-värden vars produkt är −1. Genomgången visar varför, med figurer och en simulering, och går igenom hur man avgör om två linjer är vinkelräta, bestämmer en vinkelrät linje genom en punkt och visar att en triangel har en rät vinkel.' },
            { date: '2026-10-15', href: 'katalog.html?id=fy2-1.9&block=prova-sjalv', title: 'Simulering: kastet räknat steg för steg', text: 'Varje tidssteg blir en punkt på banan, och bredvid står den exakta kastparabeln som jämförelse. Ta ett steg i taget och följ hur hastigheten och accelerationen ändras, eller låt kastet köra. Gör tidssteget längre och se felet växa, eller slå på luftmotståndet så blir tennisbollens kast kortare, lägre och osymmetriskt. En tabell under banan visar värdena i varje steg.' },
            { date: '2026-10-15', href: 'katalog.html?id=fy2-1.9', title: 'Ny genomgång i Fysik nivå 2: numerisk simulering av kaströrelse', text: 'När luftmotståndet ändrar accelerationen hela tiden räcker inte formlerna för kaströrelse. Genomgången visar hur rörelsen i stället räknas fram i små tidssteg med stegmetoden, först två steg för hand med penna och sedan ett helt kast i ett kalkylblad som fylls i framför dig. Med övningar och exit ticket.' },
            { date: '2026-10-15', href: 'katalog.html?id=fy2-2.4&block=periodtid', title: 'Simulering: vad bestämmer periodtiden för en vikt i en fjäder?', text: 'Dra i massan, fjäderkonstanten och amplituden medan vikten svänger. Grafen visar hur lång tid varje svängning tar. En tyngre vikt svänger långsammare och en styvare fjäder snabbare, men amplituden ändrar inte periodtiden alls. Simuleringen finns i genomgången Svängningstid i fjäder.' },
            { date: '2026-10-14', href: 'fysik2-hjul-och-fjader-3d-app.html', title: 'Hjulet och fjädern i 3D', text: 'Samma försök som i genomgången Harmonisk svängning, nu i ett rum du kan vrida fritt: en lampa lyser på ett snurrande cykelhjul, stiftets skugga på väggen följer vikten i fjädern, och grafen på väggen blir en sinuskurva. Byt kameravy till Från lampan och se hjulet från kanten, så som ljuset ser det, och dra i periodtiden och amplituden.' },
            { date: '2026-10-14', href: 'slumpa-grupper.html', title: 'Nytt verktyg för lärare: slumpa grupper', text: 'Klistra in klasslistan en gång, bocka av den som inte är här och slumpa fram grupperna med ett klick. Välj elever per grupp eller antal grupper, bestäm vilka som ska arbeta tillsammans eller hållas isär, och dra i namnen för att flytta någon. På storskärmen fyller grupperna hela skärmen med så stor text som får plats. Grupperna kan också skrivas ut eller sparas som fil, utan konto och utan att några namn lämnar datorn. Verktyget finns under Resurser i menyn.' },
            { date: '2026-10-14', href: 'fysik2-hjul-och-fjader-app.html', title: 'Två nya simuleringar om harmonisk svängning', text: 'Hjulet och fjädern: en lampa lyser på ett snurrande cykelhjul, och skuggan av ett stift på hjulet rör sig upp och ned i exakt samma takt som en vikt i en fjäder, medan grafen ritar upp sinuskurvan. Läge, hastighet och acceleration: graferna ritas upp under varandra medan vikten svänger, och du kan dra tiden fram och tillbaka och se att hastigheten är noll i vändlägena, där accelerationen är som störst. Båda går att köra i helskärm och finns också i genomgången Harmonisk svängning.' },
            { date: '2026-10-14', href: 'katalog.html?id=fy2-2.3&block=hjulprojektion', title: 'Simulering: hjulet och fjädern i genomgången Harmonisk svängning', text: 'Ett stift sitter på ett cykelhjul som snurrar med jämn fart, och stiftets skugga på väggen rör sig upp och ned precis i takt med en vikt som svänger i en fjäder bredvid. En graf ritar samtidigt upp läget mot tiden, och kurvan blir en sinuskurva. Visa vinkeln på hjulet och se hur läget y = A · sin(ω · t) hänger ihop med hjulets vridning, och ändra periodtiden med glidaren.' },
            { date: '2026-10-14', href: 'katalog.html?id=fy2-2.3&block=svangningsgrafer', title: 'Simulering: läge, hastighet och acceleration i samma svängning', text: 'En vikt svänger i en fjäder medan graferna för läget, hastigheten och accelerationen ritas upp under varandra. En lodrät markör visar samma ögonblick i alla tre, och pilar på vikten visar hastigheten och accelerationen. Pausa i ett vändläge och se att hastigheten är noll medan accelerationen är som störst, och i jämviktsläget att det är tvärtom.' },
            { date: '2026-10-12', href: 'fysik1-hiss-app.html', title: 'Krafter i hissen: ny simulering till genomgången Accelerationens riktning', text: 'En person står på en kraftplatta i en hiss, precis som i laborationen med kraftplattan. Tryck på en våningsknapp och följ tyngdkraften, normalkraften, den resulterande kraften och accelerationen genom hela färden, medan plattans mätning ritas upp som en graf. Tankebubblan visar om det känns tungt, normalt eller lätt. Labbens nio lägen går att frysa med ett klick, från stilla längst ner till en tänkt hiss som faller fritt, och med Gissa först får du förutsäga vad plattan visar innan du får se det.' },
            { date: '2026-10-12', href: 'katalog.html?id=fy2-1.3&block=lodlinje', title: 'Simulering: tyngdpunkt och lodlinje', text: 'Genomgången Stabilitet har fått en simulering där en oregelbunden skiva hänger i en spik bredvid ett lod. Tyngdpunkten och lodlinjen genom den är utritade. Vrid skivan och se att lodlinjen hela tiden är lodrät men hamnar vid sidan av spiken, och släpp den så svänger skivan tillbaka tills tyngdpunkten hänger rakt under spiken. Rita av lodets snöre på skivan, häng upp den i ett annat hål och rita igen: där linjerna korsar varandra ligger tyngdpunkten.' },
            { date: '2026-10-12', href: 'katalog.html?id=fy2-2.2&block=kopplade-fjadrar', title: 'Simulering: en fjäder, serie och parallellt sida vid sida', text: 'Genomgången Fjäderenergi och kopplade fjädrar har fått en simulering med tre upphängningar bredvid varandra: en ensam fjäder, två seriekopplade och två parallellkopplade, alla likadana. Häng i 100 g i varje upphängning och se att seriekopplingen förlängs dubbelt så mycket som den ensamma fjädern och parallellkopplingen hälften så mycket. Sätt sedan alla tre i svängning och jämför periodtiderna. Samma försök finns som läget Kopplade fjädrar i simuleringen Hookes lag, där du också kan ändra massan och fjäderkonstanten.' },
            { date: '2026-10-12', href: 'katalog.html?id=ma1c-3.4&block=sparkonto-i-kalkylblad', title: 'Se hur kalkylbladet fylls i: sparkonto i genomgången Sparande och ränteberäkningar', text: 'Lösningen till exemplet om ett sparkonto visar nu hur man gör i ett kalkylprogram, i tre steg som klickas fram ett i taget. Pekaren klickar i cellerna, rubriker och tal skrivs in, formeln =B2*B12 ger behållningen efter ett år, och dollartecknen låser förändringsfaktorn innan formeln dras ned med fyllnadshandtaget. Varje steg kan pausas och spelas igen. Genomgången har också fått en figur som visar vad en cell, en kolumn och en rad är och hur cellerna namnges.' },
            { date: '2026-10-11', href: 'katalog.html?id=ma2c-6.5&block=testa-sjalv-galtonbradan', title: 'Galtonbrädan i ny tappning: normalfördelningen växer fram', text: 'Simuleringen av Galtonbrädan är helt omgjord och ligger nu direkt i genomgången Normalfördelning. Stålkulor rinner ur en glastratt, studsar mot mässingsstift på en bräda av trä och glas och staplas i facken, så att klockformen växer fram kula för kula. Släpp upp till 10 000 kulor på en gång, välj mellan 6 och 14 rader och se hur stor andel av dina kulor som hamnar inom en och två standardavvikelser från medelvärdet. Varje stift plingar när en kula träffar det, och ljudet går att stänga av.' },
            { date: '2026-10-11', href: 'np.html?id=ma3c-vt2018', title: 'Nationellt prov i Ma 3c: våren 2018', text: 'Ett andra prov för Matematik fortsättning nivå 1c (Ma 3c): nationella provet från våren 2018 med alla 28 uppgifter från delprov B, C och D. Derivator och primitiva funktioner, en graf där andraderivatans tecken ska avläsas, ett blåbärspris som ger störst dagsinkomst, en cirkel och dess tangent, höjden på glaspelaren i fontänen på Sergels torg med triangelsatserna, rösterna i en musiktävling som räknas fram med en integral, en gräsmatta som ska sås och en korvburk som ska bli så billig som möjligt. Varje uppgift har en textlösning som klickas fram steg för steg med förklaringar, uppbyggda figurer och bedömning enligt bedömningsanvisningarna, och en pennlösning där lösningen skrivs för hand på rutat papper.' },
            { date: '2026-10-11', href: 'np.html?id=ma4-vt2018', title: 'Nationellt prov i Ma 4: våren 2018', text: 'Ett andra prov för Matematik fortsättning nivå 2 (Ma 4): nationella provet från våren 2018 med alla 27 uppgifter från delprov B, C och D. Exakta värden och trigonometriska ekvationer, asymptoter, sammansatta funktioner, komplexa tal i talplanet och en tredjegradsekvation som löses med polynomdivision, temperaturen i ett växthus under ett dygn som en sinuskurva, area mellan kurvor, längden av en huggorm som ringlar längs marken, en täthetsfunktion för provtider och en rotationskropp. Varje uppgift har en textlösning som klickas fram steg för steg med förklaringar, uppbyggda figurer och bedömning enligt bedömningsanvisningarna, och en pennlösning där lösningen skrivs för hand på rutat papper.' },
            { date: '2026-10-10', href: 'np.html?id=fy1-vt2017', title: 'Kursprov i Fysik 1: våren 2017', text: 'Ett första prov för Fysik nivå 1: kursprovet från våren 2017 med alla 21 teoriuppgifter ur delprov A. Tryck och enheter, kopplingsscheman med amperemeter och voltmeter, en ny atomkärna ur en fusion, tidsdilatation, en boll som skjuts upp av en fjäder, vattenkraftverkets energi, två laddade kulor på en tråd, varmt vatten i en barnpool, bromssträckan på halt väglag i en nedförsbacke, en varmfront som stiger, blixten i filmen Tillbaka till framtiden, en heliumballong, en doppvärmare i ett akvarium och teknetium som mäter blodvolymen. Varje uppgift har en textlösning som klickas fram steg för steg med förklaringar, uppbyggda figurer och bedömning enligt bedömningsanvisningarna, och en pennlösning där lösningen skrivs för hand på rutat papper.' },
            { date: '2026-10-10', href: 'np.html?id=ma4-vt2022', title: 'Nationellt prov i Ma 4: våren 2022', text: 'Första provet för Matematik fortsättning nivå 2 (Ma 4) är inne: nationella provet från våren 2022 med alla 27 uppgifter från delprov B, C och D. Derivator med kedjeregeln och produktregeln, sinuskurvor med amplitud och period, asymptoter, trigonometriska ekvationer och formler, komplexa tal i talplanet och på polär form, polynomdivision, area mellan kurvor, rotationskroppar, en täthetsfunktion för hur sena eleverna är till lektionen och ett vindkraftverk vars elproduktion beräknas med en integral. Varje uppgift har en textlösning som klickas fram steg för steg med förklaringar, uppbyggda figurer och bedömning enligt bedömningsanvisningarna, och en pennlösning där lösningen skrivs för hand på rutat papper.' },
            { date: '2026-10-10', href: 'katalog.html?id=fy2-5.1&block=hubble-ultra-deep-field-tusentals-galaxer-i-en-tom-flack', title: 'Tusentals galaxer i en tom fläck: Hubble Ultra Deep Field i genomgången Universums struktur', text: 'Rymdteleskopet Hubble riktades mot en fläck på himlen där man inte såg någonting alls och samlade ljus därifrån i drygt elva dygn. På bilden syns omkring 10 000 galaxer, och ljuset från de svagaste har färdats i nästan 13 miljarder år. Genomgången visar bilden och räknar ut hur många galaxer det observerbara universum då rymmer: över hundra miljarder.' },
            { date: '2026-10-05', href: 'sammanfattningar.html', title: 'Sammanfattningar för varje avsnitt som bildspel', text: 'Välj en kurs och ett eller flera kapitel, så visas sammanfattningen av varje avsnitt en i taget i ett bildspel som byter bild av sig självt. Texten anpassas så att varje sammanfattning fyller skärmen, så bildspelet går bra att visa på en storskärm i klassrummet inför ett prov. Du når det överst i varje kapitelsammanfattning, där kapitlet du läser redan är förkryssat, och under Resurser i menyn.' },
            { date: '2026-10-03', href: 'sannolikhetskalkylator.html', title: 'Nytt verktyg: sannolikhetskalkylator', text: 'Skriv in medelvärde och standardavvikelse, dra i gränserna och se andelen som en färgad area under normalfördelningskurvan. Frågan ställs i ord, som "Hur många procent av kvinnorna är kortare än 160 cm?", och svaret visas direkt i procent tillsammans med en färdig redovisning. Skriv en andel i stället för en gräns, så räknas gränsen ut. Exemplen bygger på riktiga data, till exempel längden hos svenska kvinnor och män. Under Avancerad finns fjorton fördelningar till, hypotesprövning och konfidensintervall. Verktyget finns under Resurser i menyn.' },
            { date: '2026-10-02', href: 'katalog.html?id=ma1b-1.S:ovningsblad', title: 'Övningsblad till tre kapitel i Matematik nivå 1b', text: 'Sammanfattningarna av kapitlen Aritmetik, Procentuella förändringar och Räta linjer och funktioner i Matematik nivå 1b har fått var sitt övningsblad, med sammanlagt 151 uppgifter. De flesta är på grundnivå och tränar en metod i taget: negativa tal, bråk, värdesiffror, potenser och prefix, förändringsfaktor, ränta och lån, k- och m-värde, funktionsvärden och exponentialfunktioner. Några uppgifter på mellannivå kräver fler steg. Kapitlet om räta linjer har koordinatsystem att rita i och grafer att läsa av, och varje blad avslutas med svar och lösningsförslag där varje steg står på egen rad.' },
            { date: '2026-09-30', href: 'katalog.html?id=ma1c-1.7:ovningsblad', title: 'Övningsblad: potenser på tre nivåer', text: 'Genomgången Negativa exponenter och exponenten noll i Matematik nivå 1c har fått ett övningsblad med 63 uppgifter, tänkt för den som gått igenom alla genomgångar om potenser. Uppgifterna är ordnade i tre nivåer. Grund tränar en regel i taget, Mellan blandar reglerna och har de vanliga fällorna, som skillnaden mellan (−3) upphöjt till 0 och −3 upphöjt till 0, och Avancerad kräver att flera potenslagar kombineras i ekvationer med olika baser. Sist finns svar och lösningsförslag till varje uppgift.' },
            { date: '2026-09-30', href: 'katalog.html?id=fy2-1.S:ovningsblad', title: 'Övningsblad: avancerade uppgifter i kapitel 1', text: 'Sammanfattningen av kapitel 1 i Fysik nivå 2 har fått ett övningsblad med nio avancerade uppgifter från hela kapitlet: en stege som börjar glida, ett skåp som ska vältas, en kedjekarusell, en sond runt en okänd himlakropp och en backhoppare. Uppgifterna kräver att flera samband kombineras. Lösningsförslagen går att följa rad för rad, med figurer över krafter och hävarmar och numrerade ekvationer.' },
            { date: '2026-09-30', href: 'katalog.html?id=fy1-3.S:ovningsblad', title: 'Övningsblad: rita krafterna', text: 'Sammanfattningen av kapitlet Kraft och rörelse i Fysik nivå 1 har fått ett övningsblad att skriva ut. Eleven ritar alla krafter som verkar på en kropp i femton situationer, från en låda som står stilla till en hiss som startar uppåt, en kloss på ett lutande plan och en låda på ett lastbilsflak som ökar farten. Här finns de vanliga fällorna: en kraft framåt för att något rör sig, en normalkraft som alltid är lika stor som tyngdkraften och en friktion som aldrig kan peka framåt. Facit med en kort förklaring till varje uppgift står på de sista sidorna. Alla övningsblad finns nu också samlade under Resurser i menyn.' },
            { date: '2026-09-30', href: 'katalog.html?id=fy2-2.1&block=testa-sjalv-krafterna-pa-vikten-i-fjadern', title: 'Krafterna på en vikt i en fjäder: simulering i genomgången Hookes lag', text: 'Dra ner vikten och släpp, och se fjäderkraften, tyngdkraften och den resulterande kraften medan den pendlar. Tyngdkraften är lika stor hela tiden, medan fjäderkraften växer ju mer fjädern dras ut. Skillnaden mellan dem är den resulterande kraften, som alltid pekar mot jämviktsläget.' },
            { date: '2026-09-29', href: 'katalog.html?id=fy2-1.1:ovningsblad', title: 'Övningsblad: rita hävarmen', text: 'Genomgången Kraftmoment i Fysik nivå 2 har fått ett övningsblad att skriva ut. Ett exempel visar i tre steg hur man förlänger kraftens riktningslinje och ritar hävarmen som det kortaste avståndet från vridningspunkten. Sedan följer tolv figurer att rita i själv, från en ensam punkt och kraft till nyckel, gungbräda, kranbom och cykelvev. Facit står på baksidan.' },
            { date: '2026-09-26', href: 'kopplingsschema.html', title: 'Nytt verktyg för lärare: rita kopplingsscheman', text: 'Dra in batterier, resistorer, lampor och mätare på ledningarna, så ordnar sig schemat självt med jämna mellanrum och symboler som i läroboken. Skriv in resistanser och spänningar så räknas strömmarna ut, och kopiera bilden direkt till Word, PowerPoint eller Google Dokument. Verktyget finns under Verktyg i menyn.' },
            { date: '2026-09-20', href: 'np.html?id=ma2c-vt2018', title: 'Nationellt prov i Ma 2c: våren 2018', text: 'Ett andra prov för Matematik nivå 2c: nationella provet från våren 2018 med alla 26 uppgifter från delprov B, C och D. Räta linjens ekvation ur en graf, nollställen och symmetrilinje, normalfördelningar, logaritmlagarna, ett ekvationssystem med tre obekanta om äpplen och päron, för vilka värden på en konstant en andragradsekvation saknar reella rötter, trädets höjd med en spegel på marken, Högskoleprovets resultat, koldioxidutsläpp som ska minska med 40 procent, dödstal mot vattenförbrukning i 1800-talets Stockholm, Storsjöodjurets övre kant som andragradsfunktion och den största rektangeln i en triangel. Varje uppgift har en textlösning som klickas fram steg för steg med förklaringar, uppbyggda figurer och bedömning enligt bedömningsanvisningarna, och en pennlösning där lösningen skrivs för hand på rutat papper. Den enda uppgiften på stoff som utgått ur kursen, komplexa tal, är märkt.' },
            { date: '2026-09-18', href: 'katalog.html?id=ma1c-2.7:ovningsblad', title: 'Övningsblad: mängdträning i ekvationslösning med lösningsförslag', text: 'Avsnitten Ekvationslösningens grunder, Variabler i båda led och Ekvationer med nämnare i Matematik nivå 1 har fått ett nytt kort, Övningsblad. Där finns fem utskriftsklara blad på grundnivå med sammanlagt närmare 200 rena räkneuppgifter: ett steg, två steg, x i båda led, täljaren lika med kvoten gånger nämnaren, korsvis multiplikation och till sist ett blad där alla typerna är blandade. Varje blad inleds med ett genomräknat exempel och avslutas med svar och lösningsförslag till varje uppgift, ett led i taget, så att man kan träna helt på egen hand tills det sitter. Bladen går att öppna i mobilen eller skriva ut som PDF.' },
            { date: '2026-09-15', href: 'katalog.html?id=fy2-1.8&block=kanonvagn', title: 'Kanonvagnen: simulering i genomgången Kaströrelse', text: 'Den klassiska demonstrationen kan nu köras direkt i genomgången Kaströrelse. En vagn rullar med konstant fart längs en bana, och när den passerar avfyringsmärket skjuter en fjäderkanon en boll rakt upp. Bollen följer en kastparabel men landar ändå i tratten på vagnen, som hunnit rulla vidare: ingen kraft verkar i sidled, så bollen behåller vagnens hastighet i x-led hela vägen. Ställ in vagnens fart och kanonens utgångsfart, sakta ned med Ultrarapid och slå på hastighetspilarna för att se att bollens hastighet i x-led är lika lång i varje ögonblick och lika med vagnens.' },
            { date: '2026-09-15', href: 'katalog.html?id=fy2-1.8&block=skjutochslapp', title: 'Horisontellt kast: nytt avsnitt med demonstration i genomgången Kaströrelse', text: 'Genomgången Kaströrelse har fått ett avsnitt om specialfallet horisontellt kast, där föremålet lämnar bordskanten eller handen rakt vågrätt. Formlerna står i formelrutan sida vid sida med de allmänna formlerna, så att man ser att de är samma formler med vinkeln noll, och ett nytt exempel med en kula som rullar av ett bord räknas igenom med pennlösning. I demonstrationen Skjut och släpp samtidigt knuffas en kula ut vågrätt i samma ögonblick som en annan släpps rakt ned: blixtbilderna visar att kulorna hela tiden är på samma höjd, och ett enda ljud hörs när båda träffar golvet. Formlerna för stighöjd och kastvidd har dessutom fått var sin härledning.' },
            { date: '2026-09-14', href: 'katalog.html?id=fy2-1.7&block=koniskpendel', title: 'Pendeln som sveper runt: rörlig figur i genomgången Konisk pendel', text: 'Figuren överst i genomgången Konisk pendel går nu att sätta i rörelse. Vikten sveper runt i sin vågräta cirkel medan snöret, banradien, vinkeln och kraftpilarna följer med, i verklig tid ur genomgångens egen formel. Dra i glidaren för utslagsvinkeln och se att periodtiden blir kortare ju större vinkeln är.' },
            { date: '2026-09-14', href: 'fysik2-brytning-app.html', title: 'Brytningslagen i nytt utseende: laser som syns och glas som ser ut som glas', text: 'Simuleringen Brytningslagen har ritats om i sajtens laboranstema. Scenen ligger nu på rutat papper, glasblocket har fått en kall blå ton som är tätast vid de polerade ytorna, en sned glasreflex och en tunn speglingslinje under varje yta, och tonen blir djupare ju högre brytningsindex du väljer, från luft till diamant. Laserstrålen har en mörk, mättad kärna med en ljus mittlinje och ett mjukt sken runt om, så att både den gröna och den röda strålen syns tydligt mot papperet. Vinkelbågar, normaler, etiketter och sidopanelens knappar följer sajtens färger, och reflekterade strålar går nu att slå på även i fullskärm.' },
            { date: '2026-09-13', href: 'fysik2-cirkular-rorelse-app.html?situation=bana', title: 'Bilbana med kurvor samt krön och dal: två nya situationer i simuleringen Cirkulär rörelse', text: 'Simuleringen Cirkulär rörelse har fått två nya situationer, på förslag från en lärare som hört av sig. På bilbanan, sedd ovanifrån, kör bilen med konstant fart varv efter varv på en sluten bana med en vid och en snäv kurva. På rakorna behövs ingen kraft i sidled alls, i kurvorna pekar friktionskraften in mot centrum, och i den snäva kurvan är pilen tydligt längre än i den vida vid samma fart. Ställ in friktionstalet mellan däck och väg, från torr asfalt till is, och höj farten tills greppet inte räcker: då fortsätter bilen rakt fram längs tangenten, precis som tröghetslagen säger, och sladdpunkten markeras. I Krön och dal, sedd från sidan, kör bilen över två krön med en dal emellan. Normalkraften minskar på krönet och ökar i dalen, och över gränsfarten lättar bilen från vägen och flyger som en projektil. Krönets och dalens radier, farten, massan och friktionstalet ställs med glidare, och som förut kan de verkliga krafterna, resultanten eller centripetalkraften visas.' },
            { date: '2026-09-06', href: 'np.html?id=ma2c-vt2022', title: 'Nationellt prov i Ma 2c: våren 2022', text: 'Första provet för Matematik nivå 2c är inne: nationella provet från våren 2022 med alla 28 uppgifter från delprov B, C och D. Linjära ekvationssystem, kvadrerings- och konjugatregeln, pq-formeln, rotekvationer, logaritmer och exponentialekvationer, andragradsfunktioner som modell för en hage och en byggnad, randvinkelsatsen, likformighet, normalfördelning, linjär regression och tre bevisuppgifter. Varje uppgift har en textlösning som klickas fram steg för steg med förklaringar, uppbyggda figurer och bedömning enligt bedömningsanvisningarna, och en pennlösning där lösningen skrivs för hand på rutat papper.' },
            { date: '2026-09-05', href: 'fysik2-dubbelspalt.html', title: 'Dubbelspaltexperimentet — ny simulering i 3D och planvy till genomgången Ljus, diffraktion och interferens', text: 'Dubbelspaltexperimentet i en mörk 3D-scen, eller som planvy rakt ovanifrån med en växlingsknapp emellan. En laser lyser mot plattan med de två spalterna, och en vågyta visar hur de två vågsystemen breder ut sig och möts, med stilla nodlinjer där vågorna släcker ut varandra och höga stråk där de förstärker varandra. Skärmen fångar mönstret exakt där vågtopparna träffar den. Byt till en partikel i taget och se fotoner eller elektroner landa i en punkt var, tills samma band vuxit fram prick för prick; sätt en detektor vid spalterna som registrerar vilken spalt varje partikel går genom och se banden försvinna, eller välj tankeexperimentet med vanliga små kulor för att se de två strecken som hade uppstått utan någon vågnatur alls. Dra i våglängden så byter ljuset färg och banden glider isär, täck för en spalt och se enkelspaltens breda maximum, klicka på skärmen för att mäta vägskillnaden i våglängder, och tänd maximilinjerna för att se gitterformeln n · λ = d · sin α ritad i rummet. Färdiga försök ställer in allt med ett klick, och den äldre simuleringen Dubbelspaltexperimentet med observatör är ersatt av den nya.' },
            { date: '2026-09-03', href: 'fysik2-satellitbana-app.html', title: 'Satellit i omloppsbana — ny simulering till genomgången Energi och gravitation i cirkelbanor', text: 'Skjut upp en satellit runt jorden och se vad farten gör med banan. Utgångsläget är genomgångens exempel med rymdteleskopet Hubble, 7 560 m/s på 590 km höjd, som ger en cirkelbana. Sänk farten och satelliten faller inåt i en ellips, sänk den mer och den störtar mot jordytan; höj farten och den stiger utåt, höj den till flykthastigheten och den lämnar jorden för gott. Fartskalan överst visar var farten ligger i förhållande till kraschfarten, cirkelfarten och flykthastigheten, och den streckade banan förutsägs innan satelliten hunnit dit. Gravitationskraften och hastigheten ritas som pilar, jorden och banan är i skala, och avläsningen visar bland annat omloppstid, perigeum, apogeum och energierna. Jorden ses rakt ovanifrån nordpolen och roterar ett varv per stjärndygn, så en geostationär satellit verkligen står stilla över sin punkt på ekvatorn. Färdiga försök: Hubble, rymdstationen ISS, en GPS-satellit, en geostationär satellit och en satellit på månens avstånd.' },
            { date: '2026-09-02', href: 'katalog.html?id=fy2-3.1&block=magnetdelning', title: 'Dela en magnet på mitten — interaktiv demonstration i genomgången Magnetism och magnetfält', text: 'Demonstrationen Parvisa poler i genomgången Magnetism och magnetfält kan nu göras i webbläsaren. Ta tag i ena halvan av stavmagneten och dra isär, eller tryck Dela på mitten: magneten spricker och brottytorna får nya poler, en sydända på biten som behöll nordändan och en nordända på den andra. Bitarna dras ihop igen eftersom olika poler möts vid brottet, och varje bit kan delas en gång till, upp till fyra små magneter i en kedja. Hur många gånger man än delar får varje bit en nordända och en sydända. Poler uppträder alltid parvis.' },
            { date: '2026-09-02', href: 'katalog.html?id=fy2-3.1&block=magnetpoler', title: 'Dra i magneterna — interaktiv figur i genomgången Magnetism och magnetfält', text: 'Figuren med de två stavmagneterna i genomgången Magnetism och magnetfält går nu att ta i. Dra magneterna mot varandra på det rutade papperet: är lika poler vända mot varandra skjuts den andra magneten undan, hårdare ju närmare de kommer, medan olika poler får dem att rycka ihop och klicka fast i varandra. Blå pilar visar kraften på varje magnet. Vänd en magnet med knapparna, eller med ett dubbelklick, och se hur ett par som sitter ihop plötsligt stöter bort varandra.' },
            { date: '2026-09-02', href: 'katalog.html?id=fy2-1.8&block=snettkast', title: 'Snett kast — simuleringen omgjord och inbäddad i genomgången Kaströrelse', text: 'Simuleringen Snett kast har byggts om från grunden i sajtens laboranstema: en tennisboll kastas på rutat papper, skalan anpassar sig så att hela kastparabeln alltid ryms, och hastighetsvektorerna ritas i samma färger som i genomgångens figur, röda för komposanterna i x- och y-led och blå för den totala hastigheten. Kasta, pausa och stega bildruta för bildruta, läs av tid, läge och hastighet, se stighöjd och kastvidd markeras vid nedslaget och jämför med symmetrilinjen. Ändra utkastvinkel, utgångshastighet och utkasthöjd, slå på luftmotstånd och skruva upp det till ballongnivå, eller ta med bollen till månen. Utgångsläget är genomgångens första exempel, Elins spark på 15 m/s i 50 grader, så att svaren 6,72 m och 22,56 m går att se direkt. Simuleringen går också att köra direkt i genomgången Kaströrelse, som en simulering strax under hjälpfiguren.' },
            { date: '2026-09-02', href: 'katalog.html?id=fy2-1.8&block=kastvektorer', title: 'Hastighetsvektorerna en led i taget — interaktiv figur i genomgången Kaströrelse', text: 'Hjälpfiguren med kastparabeln i genomgången Kaströrelse har fått tre kryssrutor: Visa hastighet i x-led, Visa hastighet i y-led och Visa total hastighet. Alla vektorer på en gång kan vara förvirrande i början, så nu går det att tända en led i taget: först bara de röda pilarna i x-led, som är lika långa i alla fem punkter, sedan pilarna i y-led som krymper på väg upp, försvinner i högsta punkten och växer på väg ned, och till sist den blå resultanten med vinklarna α₀, α₁ och α₂.' },
            { date: '2026-08-31', href: 'katalog.html?id=fy2-1.6', title: 'Energi och gravitation i cirkelbanor — ny genomgång i Fysik nivå 2', text: 'Genomgången Cirkulär rörelse har delats: de två klassiska räkneexemplen där cirkelrörelsen kombineras med energiprincipen och Newtons gravitationslag har flyttats till ett eget avsnitt, 1.6 Energi och gravitation i cirkelbanor. Där repeteras gravitationslagen, läges- och rörelseenergin och energiprincipen från Fysik nivå 1, innan de två exemplen räknas igenom med pennlösningar: gungan som ska klara ett helt varv och rymdteleskopet Hubbles banhöjd. Nytt är också Newtons måntest: månens centripetalacceleration räknas ut ur banan och stämmer exakt med kvadratlagen, en 3 600-del av accelerationen vid jordytan. Nya övningar om satellitbanor och en ny exit ticket hör till.' },
            { date: '2026-08-31', href: 'katalog.html?id=fy2-1.5&block=centripetalkraft', title: 'Bilen i cirkelbanan — simulering i genomgången Cirkulär rörelse', text: 'Simuleringen med bilen i cirkelbana går nu att köra direkt i genomgången Cirkulär rörelse, inbäddad strax efter formeln för centripetalkraft. Bilen kör med konstant fart, sedd rakt uppifrån, och kraftpilen pekar hela tiden in mot centrum: ändra farten med glidaren och se centripetalkraften växa. Med växlaren uppe till höger byter du till loopen, där normalkraften och tyngdkraften tillsammans utgör centripetalkraften och bilen släpper från banan om farten är under gränsfarten.' },
            { date: '2026-08-30', href: 'fysik2-magnetror-app.html', title: 'Magneten i kopparröret — ny simulering om virvelströmmar', text: 'Det klassiska försöket som ny simulering i genomgången Virvelströmmar: två likadana magneter släpps samtidigt, en genom ett kopparrör och en genom ett plaströr. Magneten i plaströret faller fritt och är nere på en tredjedels sekund, medan magneten i kopparröret sjunker som genom sirap: virvelströmmarna i rörväggen bromsar den, så att den faller med konstant fart i stället för att accelerera. Rören hänger fritt i ett stativ och visas i genomskärning, så att de virvlande strömringarna, magnetfältet de skapar inuti röret och krafterna kan följas på vägen ned, och när magneten lämnar rörmynningen släpper bromsen och den faller fritt sista biten mot bänken. Diagrammet visar båda magneternas fart mot tiden. Simulera ett eller två rör, ställ in material, magnetstyrka och massa för varje rör för sig, och sakta ner förloppet med Ultrarapid.' },
            { date: '2026-08-30', href: 'katalog.html?id=ma2b', title: 'Ny nivå: Matematik nivå 2b', text: 'Matematiken får sin femte nivå — Matematik nivå 2b, fortsättningen på nivå 1b för dig som läser samhällsvetenskap eller ekonomi. Nivån delar nästan alla genomgångar med nivå 2c: linjära ekvationssystem, algebra och andragradsekvationer, andragradsfunktioner, geometri med satser och bevis, logaritmer samt statistik med normalfördelning och regression. Skillnaden mot 2c är att rotekvationer och logaritmer med andra baser utgår, och kapitel 2 och 5 har fått egna sammanfattningar som speglar det. Varje avsnitt har som vanligt teorigenomgång, övningar i tre nivåer, exit ticket och pennlösningar.' },
            { date: '2026-08-29', href: 'katalog.html?id=fy2-1.3&block=figur-6', title: 'Tre linjaler på tre spikar — simulering om jämviktstyperna', text: 'Figuren med kulan i skålen, på kullen och på golvet har fått en interaktiv granne i fördjupningen Stabilitet: tre likadana linjaler uppspikade på tre olika sätt, en rakt under varje fall i figuren. Dra i den som hänger i en spik genom överkanten och se den gunga tillbaka till utgångsläget, ge den som står på en spik genom nederkanten minsta lilla vinkel och se den välta ned mot marken, och sätt snurr på den som har spiken rakt genom tyngdpunkten: den roterar som en propeller och blir kvar där den stannar.' },
            { date: '2026-08-29', href: 'katalog.html?id=fy2-1.3', title: 'Stabilitet — ny fördjupningsgenomgång i Fysik nivå 2', text: 'Genomgången Mer kraftmoment har delats: allt om vältning och balans har flyttat till ett eget fördjupningsavsnitt, 1.3 Stabilitet, markerat med en asterisk i avsnittslistan. Där får stödytan och tyngdpunktens lodlinje förklara när något står kvar och när det välter, formeln för vältningsvinkeln, tan α = b/h, härleds, och begreppen stabil, labil och indifferent jämvikt reds ut med nya figurer. Demonstrationerna följer med: luta klossen tills den välter, balansera gafflarna på nålspetsen och låt dubbelkonen rulla uppför banan. Nya övningar och en ny exit ticket hör förstås till.' },
            { date: '2026-08-28', href: 'fysik2-dubbelkon-app.html', title: 'Dubbelkonen som rullar uppför — ny 3D-simulering om tyngdpunkten', text: 'Den klassiska demonstrationen där en dubbelkon släpps vid den låga änden av en V-formad bana och rullar av sig själv upp mot den höga. Illusionen avslöjas i 3D: skenorna går isär, kontaktpunkterna vandrar ut mot konens smala spetsar och tyngdpunkten sjunker hela vägen fastän banans kant stiger. Dra föremålet dit du vill, släpp det och följ tyngdpunktens gula spår under den vågräta startnivån. Byt till en vanlig cylinder som rullar nedåt som förväntat, gör banan brantare tills illusionen bryts vid den kritiska lutningen, och läs av villkoret med de tre vinklarna live. Demonstrationen går också att köra direkt i genomgången Stabilitet, som en simulering.' },
            { date: '2026-08-25', href: 'katalog.html?id=fy2-1.3', title: 'Balans på nålspets — gaffeltricket som simulering i genomgången', text: 'Demonstrationen om vältning i genomgången Stabilitet har fått en granne: två gafflar i en kork, en nål tvärs igenom och alltihop balanserande på nålspetsen mot kanten av ett mynt. Ta tag i en gaffel och luta bygget, eller knuffa till det, och se det vagga tillbaka i stället för att välta — gafflarnas tunga skaft drar tyngdpunkten ned under stödpunkten. Skalan vid sidan visar tyngdpunktens läge i millimeter, och med glidaren lyfter du gafflarna tills tyngdpunkten passerar stödpunkten och bygget faller. Samma princip som lindansarens långa balansstång.' },
            { date: '2026-08-25', href: 'np.html#fy2-vt2016', title: 'Första fysikprovet: Fysik 2 våren 2016', text: 'Provsidan får sitt första fysikprov! Kursprovet i Fysik 2 från våren 2016 med alla 19 teoriuppgifter ur delprov A — exoplanetens yttemperatur, repet som brister i filmen, masspektrometern och katodstråleröret. Lösningarna klickas fram ett steg i taget, och kraftfigurerna byggs upp i samma takt: först tyngdkraften, sedan spännkraften, sedan jämförelsen — så att varje kraft hinner landa innan nästa ritas ut.' },
            { date: '2026-08-24', href: 'katalog.html?id=fy1-4.4', title: 'Eulers disk — simulering i genomgången om energiprincipen', text: 'Demonstrationen i energiprincipen går nu att köra direkt i genomgången: en blank metalldisk snurras på högkant på en spegelblank sockel och rullar runt på sin kant. Ju längre ner tyngdpunkten kommer, desto snabbare vaggar disken — lägesenergin övergår i rörelseenergi, och eftersom friktionen är minimal sker omvandlingen långsamt, ända fram till finalen där vaggningen rusar i frekvens och disken abrupt lägger sig platt. Ljudet följer förloppet precis som när man gör försöket på riktigt: tonen stiger med varvtalet och slutar i ett skaller. Energistaplarna visar att summan av läges-, rörelse- och värmeenergi hela tiden är konstant, Visa spår ritar kontaktpunktens vidgande ring på sockeln, och Ultrarapid gör slutrusningen synlig.' },
            { date: '2026-08-24', href: 'fysik2-gaffelbalans-app.html', title: 'Gaffelbalansen — två gafflar, en kork och en nål på kanten av ett mynt', text: 'Det klassiska balanstricket som ny 3D-simulering i genomgången Stabilitet: två gafflar trycks fast i en kork, en nål sticks igenom — och alltihop balanserar på nålspetsen mot den ytterst smala kanten av ett mynt som står på högkant i en flaskkork. Vrid kameran fritt, knuffa till bygget och se det vagga tillbaka: gafflarnas tunga skaft drar ned systemets tyngdpunkt till en punkt strax under stödpunkten, så tyngdkraftens moment M = F · l rättar till varje lutning i stället för att välta den. Ändra gaffelvinkeln med glidaren och hitta den kritiska vinkel där tyngdpunkten passerar stödpunkten, följ kurvan i grafen — eller ta bort gafflarna och se korken falla på bråkdelen av en sekund.' },
            { date: '2026-08-23', href: 'fysik1-flugan-i-bagaren-app.html', title: 'Flugan i bägaren — väger en flygande fluga någonting?', text: 'Ny simulering om Newtons tredje lag: en bägare står på en laboratorievåg med 0,1 mg i upplösning, och en fluga sitter på botten. Vad händer med utslaget när den lyfter? Vågen i simuleringen får aldrig veta svaret på förhand: utslaget beräknas ur luftens rörelsemängd, så att svaret uppstår ur fysiken. Följ nedsvepet som luftpartiklar, sakta ner till ultrarapid där de enskilda vingslagen syns, jämför den dämpade vågen med en ideal kraftgivare och flytta systemgränsen tills problemet försvinner. I Förutsäg-läget gissar du utslaget innan förloppet körs: hovring, dykning, död fluga i fritt fall, öppen bägare eller vakuum. Med lock är svaret alltid detsamma — flugans tyngd går via luften ner i glaset.' },
            { date: '2026-08-16', href: 'fysik2-neutronstjarna.html', title: 'Neutronstjärnan i skala — 3D-jord med en stjärna stor som en stad', text: 'Hur stor är egentligen en neutronstjärna? Ny simulering i astronomikapitlet: rotera en fotorealistisk 3D-jord fritt och leta upp den lysande punkten ovanför klotet — det är hela stjärnan, i exakt samma skala som jorden. Flyg sedan ända fram med ett knapptryck och se ett klot på bara 22 kilometer i diameter, litet som en storstad, som ändå rymmer 1,4 solmassor. En kubikcentimeter av materian väger 400 miljoner ton. Pulsarstrålarna sveper runt i kraftigt nedsaktad rotation, och avläsningen visar hela tiden kamerans avstånd till stjärnan.' },
            { date: '2026-08-15', href: 'fysik2-tomtebloss-app.html', title: 'Tomtebloss och centrifug — tröghetslagen i cirkelbanan', text: 'Demonstrationerna från genomgången om cirkulär rörelse finns nu också som egen simulering i stort format. Tänd ett tomtebloss fäst i en skruvdragare, i mörker, och se gnistorna lämna cirkelbanan tangentiellt i rörelsens riktning — inte rakt ut från centrum — precis som Newtons första lag säger. Växla till centrifugen och blöt tvättsvampen: vattendropparna gör exakt samma sak. Ställ varvtalet med glidaren, pausa och frys bilden mitt i förloppet, slå på ultrarapid för att följa en enskild gnista — och lyssna på motortonen som följer varvtalet.' },
            { date: '2026-08-15', href: 'fysik2-skiftnyckel-app.html', title: 'Skiftnyckeln och hävarmen — ny simulering om kraftmoment', text: 'En trög mutter ska lossas med en skiftnyckel. Dra kraftens angreppspunkt längs skaftet, vrid kraften ett helt varv och se hävarmen ändras i realtid: det kortaste, vinkelräta avståndet från vridningspunkten till kraftens streckade riktningslinje. Drar du på skaftets andra sida vrider momentet medurs och räknas negativt, precis som i genomgången. Beräkningen l = d · sin α och kraftmomentet M = F · l följer med live, och momentmätaren visar om vridningen räcker för att muttern ska lossna. Färdiga försök jämför klassikerna: samma kraft längst ut på skaftet, nära muttern, snett — och parallellt med skaftet, där momentet blir exakt noll. En minivariant ligger dessutom insprängd direkt i teoriavsnittet 1.1, och avsnittets båda simuleringar växlas nu med ett klick.' },
            { date: '2026-08-14', href: 'katalog.html?id=ma1b', title: 'Ny nivå: Matematik nivå 1b', text: 'Matematiken får en fjärde grundnivå — Matematik nivå 1b, som framför allt riktar sig till Samhällsvetenskapsprogrammet och Ekonomiprogrammet. Nivån delar de flesta genomgångarna med nivå 1c (aritmetik, algebra och ekvationer, procent, räta linjer och funktioner samt statistik och sannolikhetslära), men trigonometrin och vektorerna utgår och två helt nya avsnitt tillkommer: KPI och index — indextal, basår och hur en lön räknas om mellan olika års penningvärden — och Tolka och granska tabeller och diagram, där du lär dig läsa frekvenstabeller, stapel-, linje- och cirkeldiagram och avslöja vilseledande diagram med avhuggna axlar. Varje avsnitt har som vanligt teorigenomgång, övningar i tre nivåer, exit ticket och pennlösningar.' },
            { date: '2026-08-09', href: 'katalog.html?id=fy2-5.3', title: 'Sol- och månförmörkelser i teorin', text: 'Genomgången om månens faser (Fysik nivå 2, 5.3) täcker nu också förmörkelserna. Nya figurer visar hur månens skugga delar sig i en smal kärnskugga — där förmörkelsen blir total — och en vid halvskugga där den blir partiell, hur jordens betydligt bredare skugga sväljer hela månen vid en månförmörkelse, och varför månen ändå lyser kopparröd: rött solljus bryts i jordens atmosfär och böjs in i skuggan. Här räknas också solens och månens vinkeldiametrar ut (båda ungefär en halv grad — själva förutsättningen för totala förmörkelser), och en tredje figur förklarar varför det inte blir förmörkelse varje månad: månens bana lutar 5,1° mot ekliptikan och skär den bara i två noder. Avsnittet växlar nu fritt mellan simuleringarna Månens faser och Solförmörkelse.' },
            { date: '2026-08-09', href: 'fysik2-solformorkelse.html', title: 'Solförmörkelse — upplev totaliteten från jorden', text: 'Ny simulering i astronomikapitlet: följ en solförmörkelse precis som den ser ut från marken. Månen glider in framför solen västerifrån, ljuset blir stålgrått och skuggan sveper in — och i totalitetens ögonblick tänds koronan med strålar och polarplymer kring den svarta månskivan, med kromosfärens röda rand och rosa protuberanser vid kontakterna. Sakta ner uppspelningen och se Bailys pärlor sila genom månens dalar innan diamantringen blixtrar till. Flytta månen mellan perigeum och apogeum för att växla mellan total och ringformig förmörkelse, eller ställ dig vid sidan av centrallinjen och se varför de flesta bara får en partiell förmörkelse. Geometrin är verklig: vinkeldiametrar, kontakttider, täckningsgrad och totalitetens längd beräknas ur samma samband som astronomerna använder.' },
            { date: '2026-08-06', href: 'fysik2-stavmagnet-app.html', title: 'Magnetism — stavmagnetens fält och magneternas krafter', text: 'Avsnittet Magnetism och magnetfält har fått två nya simuleringar. I Stavmagnetens magnetfält drar du en magnet över en platta med kompassnålar och ser varje nål svänga in sig i fältets riktning, strör järnfilspån över fältet och flyttar en provkompass dit du vill mäta — eller byter till 3D och roterar fritt runt magneten för att se att fältet finns i hela rummet. I Attraktion och repulsion ligger två stavmagneter på en labbänk: vänd polerna, dra dem närmare och släpp — de börjar glida först när magnetkraften övervinner friktionen, och kraft–avståndsgrafen visar varför magneter hugger tag först i sista stunden.' },
            { date: '2026-08-05', href: 'fysik1-flytkraft-app.html', title: 'Flyta eller sjunka — omgjord med flytkarta och gissa-läge', text: 'Simuleringen om lyftkraft har byggts om från grunden: föremålen ligger nu på en labbänk och dras ner i ett akvarium, och flytkartan bredvid visar alla densiteter på samma skala — hamnar föremålets markering ovanför vätskans linje flyter det, under linjen sjunker det. I nya Gissa-läget hänger ett okänt föremål i stativet: räkna ut densiteten ur massa och volym, svara flyter, svävar eller sjunker — och se föremålet släppas i samma sekund. Färdiga försök ställer upp klassikerna samma volym, samma massa och samma densitet med ett klick.' },
            { date: '2026-08-05', href: 'fysik-enhetskoll.html', title: 'Enhetskoll i slutet av varje kapitel', text: 'Enhetskollen har flyttat och vuxit: i stället för en enda quiz-sida under kapitel 1 avslutas nu varje kapitel i Fysik nivå 1 och 2 med en egen enhetskoll — direkt före sammanfattningen. Varje koll frågar på just de storheter, enheter och beteckningar kapitlet använder, från SI-grundenheterna i introduktionen till becquerel, tesla och ljusår längre fram. Svarar du fel får du öva igen tills allt sitter.' },
            { date: '2026-08-04', href: 'fysik2-resonans-app.html', title: 'Resonans — ny simulering om tvungen svängning', text: 'En motor skakar fjäderns fäste med en drivfrekvens du styr själv — träffar den systemets egenfrekvens växer utslaget kraftigt. Följ insvängningen i utslag–tid-grafen, bygg upp resonanskurvan punkt för punkt genom att svepa frekvensen, och se hur dämpningen kapar toppen medan massa och fjäderkonstant flyttar den. Håller du drivningen kvar på egenfrekvensen med minsta dämpning slår vikten till slut i bordet — i verkligheten växer inget utslag i det oändliga.' },
            { date: '2026-07-30', href: 'katalog.html#fy2-1.1', title: 'Handskrivna lösningar — exempel som skrivs fram med penna', text: 'Exempeluppgifterna i Kraftmoment (Fysik nivå 2, 1.1) löses nu av en blyertspenna på rutat papper, precis som på tavlan: figuren ritas först, kraftpilar och mätvärden antecknas i blått, mätvärdena samlas i en klammer innan de sätts in i formeln — och tankebubblor förklarar varje drag. Stega dig igenom lösningen i din egen takt med pilknapparna, stäng av bubblorna med "Utan tankar" när du bara vill se redovisningen — eller växla till "Som text" om du hellre läser lösningen som vanlig text.' },
            { date: '2026-07-27', href: 'katalog.html#ma1c-1.S', title: 'Kapitelsammanfattningar i hela matematiken', text: 'Varje kapitel i matematikens fyra nivåer avslutas nu med en sammanfattning inför provet — precis som i fysiken. Där samlas kapitlets begrepp med korta förklaringar, alla formler och regler i ett formelblock, viktiga samband och metoder, figurer värda att minnas och en checklista med självkontrollfrågor. Du hittar dem sist i varje kapitels avsnittslista, med uppläsning precis som övriga genomgångar.' },
            { date: '2026-07-25', href: 'fysik1-bandgenerator-app.html', title: 'Bandgeneratorn i 3D — gnistor, flygande formar och hår på ända', text: 'Starta motorn och se gummibandet bära elektroner upp till metallklotet, som laddas mer och mer negativt. Dra den jordade kulan mot klotet tills gnistan hoppar och elektronerna leds bort genom sladden, lägg aluminiumformar på klotet och se dem repellera iväg, eller slå på genomskärningen och titta in i klotet där bandet glider mot den vassa metallkammen. Modigast av alla är figuren som håller i klotet medan det laddas — hårstråna blir negativt laddade, repellerar varandra och ställer sig åt alla håll. Hela scenen är i 3D: dra för att vrida kameran och rulla för att zooma.' },
            { date: '2026-07-21', href: 'fysik1-flytkraft-app.html', title: 'Flyta eller sjunka — ny simulering om lyftkraft', text: 'Ta tag i blocken med musen eller fingret: släpp dem i bassängen med ett plask, tryck ner dem mot botten och känn hur de skjuts upp igen, eller lyft upp dem ur vätskan. Jämför två block med samma massa, volym eller densitet, eller utforska ett eget material — från frigolit till järn — i allt från bensin till kvicksilver. Skalenliga kraftpilar visar tyngdkraft och lyftkraft, och vattennivån stiger exakt med den undanträngda volymen enligt Arkimedes princip.' },
            { date: '2026-07-18', href: 'fysik-repetition.html', title: 'Sammanfattningar och repetitionsspel — alla fysikkapitel', text: 'Varje kapitel i Fysik nivå 1 och Fysik nivå 2 avslutas nu med en sammanfattning: kapitlets formler, begrepp, viktigaste samband och figurer komprimerade inför provet. Till varje sammanfattning hör ett repetitionsspel med varierade stationer — para ihop formler med betydelser, sortera begrepp i lådor, ordna i rätt följd, fyll luckor och avgör sant eller falskt. Dra brickorna med musen eller fingret, samla stjärnor och hitta luckorna innan provet gör det.' },
            { date: '2026-07-14', href: 'np.html#ma3c-vt2022', title: 'Nationellt prov i Ma 3c: våren 2022', text: 'Första provet för Matematik fortsättning nivå 1c (Ma 3c) är inne — nationella provet från våren 2022 med alla 28 uppgifter från delprov B, C och D: derivator och primitiva funktioner, enhetscirkeln, derivatans definition, tangenter, integraler, triangelsatserna och två optimeringsklassiker (mopedens bensinförbrukning och guldtråden över silverplattan). Lösningarna klickas fram ett steg i taget med förklaringar, uppbyggda figurer och bedömning enligt bedömningsanvisningarna.' },
            { date: '2026-07-14', href: 'np.html#ma1c-ht2016', title: 'Ännu ett nationellt prov: Ma 1c hösten 2016', text: 'Ett tredje nationellt prov med lösningar steg för steg är inne — Matematik 1c från hösten 2016, alla 28 uppgifter från delprov B, C och D (med tärnings- och kulspelsuppgifter, takvinklar, index och cirkelbevis). Samma upplägg som tidigare: klicka fram lösningen ett steg i taget, förklaring till vad och varför, figurer som byggs upp, delsvar per deluppgift och bedömning enligt bedömningsanvisningarna.' },
            { date: '2026-07-14', href: 'np.html#ma1c-vt2017', title: 'Fler nationella prov: Ma 1c våren 2017', text: 'Nu finns ett andra nationellt prov med lösningar steg för steg — Matematik 1c från våren 2017, alla 27 uppgifter från delprov B, C och D. Samma upplägg som tidigare: klicka fram lösningen ett steg i taget, med förklaring till vad som görs och varför, figurer som byggs upp längs vägen, delsvar för varje deluppgift, och bedömning enligt bedömningsanvisningarna. Presentationsläget fungerar för alla prov.' },
            { date: '2026-07-14', href: 'np.html#ma1c-vt2022', title: 'Nytt: nationella prov med lösningar steg för steg', text: 'Träna på riktiga nationella prov! Först ut är Matematik 1c från våren 2022 — alla 31 uppgifter från delprov B, C och D. Varje uppgift har en fullständig lösning som du klickar fram ett steg i taget, med en förklaring till varje steg: vad vi gör och varför. Figurerna byggs upp i takt med lösningen — se hjälplinjer ritas och mått tonas in. Efter sista steget visas svaret och hur uppgiften bedöms enligt bedömningsanvisningarna.' },
            { date: '2026-07-13', href: 'katalog.html#ma3c-2.3:visualisering', title: 'Interaktiva visualiseringar i matematiken', text: 'Sextiotre "aha-maskiner" har byggts in i matematikens nivåer: dra h mot 0 och se sekanten bli en tangent, släpp tusen kulor genom en Galtonbräda, pussla algebra-bitar till en rektangel vars sidor är faktorerna, gå ett varv runt en månghörning och se pilen vrida sig exakt 360°, zooma från en atom till Vintergatan på tiopotensernas skala, se ränta-på-ränta växa om enkel ränta — och upptäck i tre synkade grafer att en kurva kan vara avtagande och ändå bukta uppåt. Avsnitt med en visualisering har fått ett eget kort — Visualisering — bredvid Teori, Exit ticket och Övningar.' },
            { date: '2026-07-10', href: 'katalog.html#ma4', title: 'Nytt ämne: Matematik fortsättning nivå 2 — hela nivån', text: 'Matematikens fjärde nivå är komplett! 47 avsnitt i fyra kapitel — trigonometri (enhetscirkeln, trigonometriska ekvationer, sinus- och cosinusfunktionerna), derivata (kedjeregeln, produkt- och kvotregeln, asymptoter), integraler (area, täthetsfunktioner, rotationskroppar) och komplexa tal (polär form, de Moivres formel och Eulers formel). Varje avsnitt har teorigenomgång med figurer, övningar i tre nivåer, exit ticket — och interaktiva grafritare för de trigonometriska funktionerna.' },
            { date: '2026-07-10', href: 'fysik2-brada-tva-stod-app.html', title: 'Mer kraftmoment — bräda på två bockar', text: 'En bräda vilar på två bockar och en person kan gå ut på den. Dra i personen och i stöden och se stödkrafterna F_P och F_Q ändras direkt — ju närmare tyngdpunkten ett stöd sitter, desto mer bär det. Välj vridningspunkt fritt (vid ett stöd blir dess hävarm 0) och lös ut den andra kraften med momentlagen. Går tyngdpunkten förbi ett stöd välter brädan.' },
            { date: '2026-07-08', href: 'katalog.html#ma3c', title: 'Nytt ämne: Matematik fortsättning nivå 1c — hela nivån', text: 'Nu tar matematiken klivet in i analysen! Hela Matematik fortsättning nivå 1c är ute: 39 avsnitt i sex kapitel — rationella uttryck och gränsvärden, derivatan, deriveringsregler, kurvor och extremvärden, integraler samt trigonometri med triangelsatserna. Varje avsnitt har teorigenomgång med exempel och figurer, övningar i tre nivåer och exit ticket — och en interaktiv grafritare där du drar i basen och ser derivatan av eˣ.' },
            { date: '2026-07-07', href: 'katalog.html#ma2c', title: 'Nytt ämne: Matematik nivå 2c — hela nivån', text: 'Nästa nivå i matematiken är här! 42 avsnitt i sex kapitel — linjära ekvationssystem, algebra och andragradsekvationer, andragradsfunktioner, geometri med satser och bevis, logaritmer samt statistik med normalfördelning och regression. Varje avsnitt har teorigenomgång med exempel och figurer, övningar i tre nivåer, exit ticket och interaktiva grafer där parametrar formar kurvan.' },
            { date: '2026-07-06', href: 'katalog.html#ma1c-4.3', title: 'Interaktiva grafer i teorin', text: 'Genomgångarna om räta linjer och funktioner har fått inbyggda grafritare: dra i reglagen för k och m (eller C och a) och se hur grafen, ekvationen och lutningens trappsteg ändras live. Panorera genom att dra i rutnätet och zooma med mushjulet — direkt i genomgången. Först ut är sex avsnitt i Matematik nivå 1c.' },
            { date: '2026-07-06', href: 'katalog.html#ma1c', title: 'Nytt ämne: Matematik nivå 1c — hela nivån', text: 'Fysiklabbet får matematik! Hela nivån är ute: 56 avsnitt i sex kapitel — aritmetik, algebra och ekvationer, procentuella förändringar, räta linjer och funktioner, statistik och sannolikhetslära samt trigonometri med vektorer. Varje avsnitt har teorigenomgång med exempel och figurer, övningar i tre nivåer och exit ticket.' },
            { date: '2026-07-05', href: 'katalog.html#fy1-1.2:exitticket', title: 'Exit tickets — kort förhör på varje avsnitt', text: 'Alla 113 avsnitt har fått en exit ticket: ett kort flervalsförhör på avsnittets viktigaste grunder — begrepp, enheter, formler och enkel huvudräkning. Svarar du fel får du veta varför just det alternativet är fel, och det rätta svaret markeras med sin förklaring. Du hittar förhöret mellan Teori och Simulering i varje avsnitt.' },
            { date: '2026-07-03', href: 'fysik2-transformator-app.html', title: 'Transformator', text: 'Två spolar på en gemensam järnkärna: växelströmmen i primärspolen ger ett varierande magnetiskt flöde som inducerar en ny spänning i sekundärspolen. Ändra U₁ och varvtalen N₁ och N₂, se spänningsgrafen — och anslut en lampa för att se att strömmen ändras åt motsatt håll så att effekten bevaras.' },
            { date: '2026-07-03', href: 'fysik2-hastighetsvaljare-app.html', title: 'Hastighetsväljare och masspektrometer', text: 'Partiklar med olika fart skjuts in mellan två laddade plattor — bara de med hastigheten v = 𝔼/B går rakt fram genom hålet. På andra sidan böjer magnetfältet partikeln i en halvcirkel mot en fotografisk plåt, och ur banradien vägs partikeln. Prova elektron, proton, deuteron och alfapartikel.' },
            { date: '2026-07-03', href: 'fysik2-virvelstrommar-app.html', title: 'Virvelströmmar', text: 'En aluminiumpendel svänger genom ett magnetfält och bromsas in av inducerade virvelströmmar — enligt Lenz lag motverkar de alltid sin orsak. Slå av elektromagneten mitt i svängningen och byt till en platta med spår för att se bromsningen nästan försvinna.' },
            { date: '2026-07-03', href: 'fysik2-lenz-lag-app.html', title: 'Inducerad ström och Lenz lag', text: 'Ta tag i stavmagneten och närma dig eller avlägsna dig från slingan — galvanometern ger utslag åt olika håll, och strömmen får enligt Lenz lag alltid en riktning som motverkar orsaken. Jämför magnetens fält med slingans inducerade fält, byt pol och se kraften som bromsar magneten.' },
            { date: '2026-07-03', href: 'fysik2-induktion-app.html', title: 'Induktion och inducerad spänning', text: 'Dra en ledare genom ett magnetfält och se den inducerade spänningen e = l · v · B uppstå — men bara medan ledaren rör sig! Elektronerna knuffas av den magnetiska kraften mot ena änden tills kraftjämvikt råder, och polariteten byter håll när rörelsen vänder.' },
        ];

                if (!open || matches.length === 0) return;

                <div className="lab-search lab-search--in-header" ref={wrapRef}>

        // Bladen i kollaget följer muspekaren en aning, olika mycket

        function useParallax(ref) {
            useEffect(() => {
                const el = ref.current;
                if (!el) return;
                const lugn = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                const fin = window.matchMedia('(pointer: fine)').matches;
                if (lugn || !fin) return;
                let raf = 0;
                const flytta = (e) => {
                    const r = el.getBoundingClientRect();
                    const nx = (e.clientX - (r.left + r.width / 2)) / r.width;
                    const ny = (e.clientY - (r.top + r.height / 2)) / r.height;
                    cancelAnimationFrame(raf);
                    raf = requestAnimationFrame(() => {
                        el.querySelectorAll('[data-djup]').forEach(b => {
                            const d = +b.dataset.djup;
                            b.style.setProperty('--px', (-nx * d * 18).toFixed(1) + 'px');
                            b.style.setProperty('--py', (-ny * d * 14).toFixed(1) + 'px');
                        });
                    });
                };
                const nolla = () => el.querySelectorAll('[data-djup]').forEach(b => {
                    b.style.setProperty('--px', '0px'); b.style.setProperty('--py', '0px');
                });
                const scen = el.closest('.ns-stage') || el;
                scen.addEventListener('pointermove', flytta);
                scen.addEventListener('pointerleave', nolla);
                return () => { scen.removeEventListener('pointermove', flytta); scen.removeEventListener('pointerleave', nolla); cancelAnimationFrame(raf); };
            }, []);
        }
