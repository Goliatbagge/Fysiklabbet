        /* Scenen: en mörk laborationsscen (labbänk i dagsljus).
           Canvasen bor i .scene-stage med fast höjd; i fullskärm fyller den

           WebGL-canvas, så att djupet i rummet inte kostar en enda triangel. */
        .scene-wrap {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(15,22,32,0.35);

        .scene-wrap:fullscreen .scene-stage, .scene-wrap:-webkit-full-screen .scene-stage {
            position: absolute; inset: 0; height: auto;
        }
        @media (max-width: 600px) {
            .scene-stage { height: 400px; }
            /* Mobil fullskärm: scenen ligger kvar i flödet med en egen höjd,

               scenen (en absolut stage hoppas över och verktygen skulle
               då flöda in över bilden från toppen). */
            .scene-wrap:fullscreen .scene-stage, .scene-wrap:-webkit-full-screen .scene-stage {

            }

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // ── Konstanter ──
        // Världens enhet är meter. Pendlarna hänger från en bom på höjden BEAM_H
        // och svänger i planet vinkelrätt mot bommen (z-led). Längderna räknas
        // till kulans tyngdpunkt, precis som i genomgången.
        const DEG = Math.PI / 180;
        const G_EARTH = 9.82;
        const NP = 15;                 // antal pendlar i pendelvågen
        const N0 = 12;                 // den längsta pendeln gör N0 svängningar på Γ
        const PITCH = 0.2;             // avstånd mellan pendlarna (m)
        const BEAM_H = 3.2;            // bommens höjd över bänken (m)
        const R_WAVE = 0.065, R_ONE = 0.1;
        const K_ARROW = 0.1;           // pilarnas skala: 1 N = 0,10 m
        const BODIES = [
            { id: 'manen', name: 'Månen', g: 1.62 },
            { id: 'mars', name: 'Mars', g: 3.71 },
            { id: 'jorden', name: 'Jorden', g: 9.82 },
            { id: 'jupiter', name: 'Jupiter', g: 24.8 },
        ];
        const INK = '#0f1620', C_FG = '#c02626', C_FS = '#1d4fb8', C_ALFA = '#a8520a';

        // pendel k gör (N0 + k) hela svängningar på Γ, så T = Γ/(N0 + k) och l = g·T²/(4π²)
        const pendLen = (k, gamma) => G_EARTH * Math.pow(gamma / (2 * Math.PI * (N0 + k)), 2);
        const hueOf = (k) => (k / (NP - 1)) * 0.78;          // röd till violett
        const cssHue = (k) => 'hsl(' + Math.round(hueOf(k) * 360) + ' 72% 48%)';

        const fmt = (num, decimals = 1) => {
            if (!isFinite(num)) return '–';
            const s = num.toFixed(decimals);
            if (parseFloat(s) === 0) return '0';
            return s.replace('.', ',').replace('-', '−');
        };
        const NB = ' ';
        const withUnit = (v, d, u) => fmt(v, d) + NB + u;

        // ── Reglage-komponenter ──
        const NumInput = ({ value, min, max, onCommit, fmtFn, unit }) => {
            const [txt, setTxt] = useState(() => fmtFn(value));
            const [editing, setEditing] = useState(false);
            useEffect(() => { if (!editing) setTxt(fmtFn(value)); }, [value, editing]);
            const commit = (raw) => {
                const norm = raw.replace(',', '.').trim();
                if (norm === '' || norm === '-' || norm === '.') return;
                let n = parseFloat(norm);
                if (!isFinite(n)) return;
                if (min != null) n = Math.max(min, n);
                if (max != null) n = Math.min(max, n);
                onCommit(n);
            };
            return (
                <span className="num-wrap">
                    <input className="num-in" type="text" inputMode="decimal" value={txt}
                           onFocus={() => setEditing(true)}
                           onChange={(e) => setTxt(e.target.value)}
                           onBlur={() => { setEditing(false); commit(txt); }}
                           onKeyDown={(e) => { if (e.key === 'Enter') { e.target.blur(); } }} />
                    <span className="num-unit">{unit}</span>
                </span>
            );
        };
        const Slider = ({ label, sub, value, min, max, step, unit, onChange, decimals = 0 }) => (
            <div className="p-3 rounded-xl glass-card mb-3">
                <div className="flex justify-between items-baseline mb-2 gap-2">
                    <label className="text-sm font-bold" style={{ color: 'var(--lab-ink)' }}
                           dangerouslySetInnerHTML={{ __html: label }} />
                    <NumInput value={value} min={min} max={max} fmtFn={(x) => fmt(x, decimals)} unit={unit} onCommit={onChange} />
                </div>
                <input type="range" min={min} max={max} step={step} value={value}
                       onChange={(e) => onChange(parseFloat(e.target.value))}
                       className="w-full cursor-pointer" />
                <div className="flex justify-between mt-1 text-xs font-mono" style={{ color: 'var(--lab-ink-muted)' }}>
                    <span>{fmt(min, decimals)} {unit}</span>
                    <span>{fmt(max, decimals)} {unit}</span>
                </div>
                {sub && <div className="text-xs mt-1" style={{ color: 'var(--lab-ink-muted)' }}
                             dangerouslySetInnerHTML={{ __html: sub }} />}
            </div>
        );
        const StSlider = ({ label, value, min, max, step, onChange, decimals, unit }) => (
            <div className="st-slider">
                <div className="st-slider-top">
                    <span dangerouslySetInnerHTML={{ __html: label }} />
                    <NumInput value={value} min={min} max={max} fmtFn={(x) => fmt(x, decimals)} unit={unit} onCommit={onChange} />
                </div>
                <input type="range" min={min} max={max} step={step} value={value}
                       onChange={(e) => onChange(parseFloat(e.target.value))} />
            </div>
        );

        // ── Etiketter i scenen: sprites med fast storlek på skärmen ──
        // En etikett byggs av delar: kursiv variabel, index (rakt) eller vanlig text.
        // Texten ritas i bläck eller i kraftens färg, utan kontur eller halo.
        function makeLabel(color, fontPx) {
            const cv = document.createElement('canvas');
            const ctx = cv.getContext('2d');
            const H = 96, F = 64, S = 44;
            const tex = new THREE.CanvasTexture(cv);
            tex.minFilter = THREE.LinearFilter;
            const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false, sizeAttenuation: false });
            const sp = new THREE.Sprite(mat);
            sp.renderOrder = 10;
            const fontOf = (p) => p.sub ? '500 ' + S + "px Poppins, sans-serif"
                : p.i ? 'italic ' + F + "px 'Times New Roman', serif"
                : '500 ' + F + 'px Poppins, sans-serif';
            const lab = { sprite: sp, px: fontPx * H / F, aspect: 1, key: '', parts: null };
            lab.set = (parts) => {
                const key = JSON.stringify(parts);
                if (key === lab.key) return;
                lab.key = key; lab.parts = parts;
                lab.draw();
            };
            lab.draw = () => {
                if (!lab.parts) return;
                let w = 16;
                const ws = lab.parts.map(p => { ctx.font = fontOf(p); const x = ctx.measureText(p.t).width; w += x; return x; });
                cv.width = Math.ceil(w); cv.height = H;
                ctx.textBaseline = 'alphabetic';
                let x = 8;

                    const st = stateRef.current;
                    sim.t = 0;
                    sim.a0 = (st.mode === 'wave' ? st.alphaW : st.alphaS) * DEG;
                    for (let k = 0; k < NP; k++) { sim.a[k] = sim.a0; sim.w[k] = 0; }
                    sim.sa = sim.a0; sim.sw = 0; sim.tMeas = null; sim.lastCross = null;
                    update();
                };
                actionsRef.current.reset();
                window.__pendel = { sim, stateRef, advance };   // testkrok för verifiering

                // ── Animation ──
                let raf = null, last = 0, visible = true;
                const tick = (now) => {
                    raf = requestAnimationFrame(tick);
                    if (!visible) { last = 0; return; }
                    const dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
                    last = now;
                    const st = stateRef.current;
                    if (st.running && dt > 0) advance(dt * st.speed);
                    update();
                    controls.update();
                    // sett rakt uppifrån skymmer bommen pendlarna, så den göms då
                    const top = controls.getPolarAngle() < 0.4; viewTop = top;
                    beam.visible = !top; poles[0].visible = !top; poles[1].visible = !top && beamKey === 'wave'; feet[0].visible = !top; feet[1].visible = !top && beamKey === 'wave';
                    renderer.render(scene, camera);
                };
                raf = requestAnimationFrame(tick);
                const io = new IntersectionObserver((e) => { visible = e[0].isIntersecting; }, { threshold: 0.02 });
                io.observe(mount);

                const onResize = () => {
                    width = mount.clientWidth; height = mount.clientHeight;
                    if (!width || !height) return;
                    camera.aspect = width / height;
                    camera.updateProjectionMatrix();
                    renderer.setSize(width, height);
                    sizeLabels();
                };
                sizeLabels();
                const ro = new ResizeObserver(onResize);
                ro.observe(mount);

                return () => {
                    cancelAnimationFrame(raf);
                    io.disconnect(); ro.disconnect();
                    controls.dispose();
                    renderer.dispose();
                    if (renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement);
                };
            }, []);

            return <div ref={mountRef} style={{ position: 'absolute', inset: 0 }} />;
        };

        // ── Diagram: periodtid mot längd för pendlarna ──
        const PlotTL = ({ gamma, g }) => {
            const W = 300, H = 200, pl = 44, pr = 12, pt = 14, pb = 40;
            const lmax = pendLen(0, gamma), Tmax = 2 * Math.PI * Math.sqrt(lmax / g);
            const niceUp = (v, s) => Math.ceil(v / s) * s;
            const xs = lmax > 1.2 ? 0.5 : 0.25, ys = Tmax > 4 ? 2 : 1;
            const xM = niceUp(lmax * 1.05, xs), yM = niceUp(Tmax * 1.05, ys);
            const X = (l) => pl + (l / xM) * (W - pl - pr), Y = (T) => H - pb - (T / yM) * (H - pb - pt);
            const curve = [];
            for (let i = 0; i <= 60; i++) {
                const l = xM * i / 60;
                curve.push(X(l).toFixed(1) + ',' + Y(2 * Math.PI * Math.sqrt(l / g)).toFixed(1));
            }
            const xt = [], yt = [];
            for (let v = 0; v <= xM + 1e-9; v += xs) xt.push(v);
            for (let v = 0; v <= yM + 1e-9; v += ys) yt.push(v);
            return (
                <svg viewBox={'0 0 ' + W + ' ' + H} width="100%" role="img"
                     aria-label="Diagram över periodtiden mot pendelns längd" style={{ display: 'block' }}>
                    {yt.map(v => <line key={'gy' + v} x1={pl} x2={W - pr} y1={Y(v)} y2={Y(v)} stroke="rgba(15,22,32,0.10)" />)}
                    <line x1={pl} y1={H - pb} x2={W - pr + 4} y2={H - pb} stroke="#0f1620" strokeWidth="1.4" />
                    <line x1={pl} y1={H - pb} x2={pl} y2={pt - 4} stroke="#0f1620" strokeWidth="1.4" />
                    <path d={'M' + (W - pr - 3) + ' ' + (H - pb - 3.5) + ' L' + (W - pr + 4) + ' ' + (H - pb) + ' L' + (W - pr - 3) + ' ' + (H - pb + 3.5) + ' Z'} fill="#0f1620" />
                    <path d={'M' + (pl - 3.5) + ' ' + (pt + 3) + ' L' + pl + ' ' + (pt - 4) + ' L' + (pl + 3.5) + ' ' + (pt + 3) + ' Z'} fill="#0f1620" />
                    {xt.map(v => (
                        <g key={'x' + v}>
                            <line x1={X(v)} x2={X(v)} y1={H - pb} y2={H - pb + 4} stroke="#0f1620" />
                            <text x={X(v)} y={H - pb + 17} textAnchor="middle" fontSize="12" fill="#3a4151">{fmt(v, v % 1 ? 2 : 0)}</text>
                        </g>
                    ))}
                    {yt.map(v => (
                        <g key={'y' + v}>
                            <line x1={pl - 4} x2={pl} y1={Y(v)} y2={Y(v)} stroke="#0f1620" />
                            <text x={pl - 7} y={Y(v) + 4} textAnchor="end" fontSize="12" fill="#3a4151">{fmt(v, 0)}</text>
                        </g>
                    ))}
                    <polyline points={curve.join(' ')} fill="none" stroke="rgba(15,22,32,0.55)" strokeWidth="1.6" strokeDasharray="5 3" />
                    {Array.from({ length: NP }, (_, k) => {
                        const l = pendLen(k, gamma);
                        return <circle key={k} cx={X(l)} cy={Y(2 * Math.PI * Math.sqrt(l / g))} r="5" fill={cssHue(k)} stroke="#0f1620" strokeWidth="0.8" />;
                    })}
                    <text x={(pl + W - pr) / 2} y={H - 6} textAnchor="middle" fontSize="13" fill="#0f1620">
                        <tspan fontStyle="italic" fontFamily="'Times New Roman', serif" fontSize="15">l</tspan> (m)
                    </text>
                    <text x="12" y={(pt + H - pb) / 2} textAnchor="middle" fontSize="13" fill="#0f1620"
                          transform={'rotate(-90 12 ' + ((pt + H - pb) / 2) + ')'}>
                        <tspan fontStyle="italic" fontFamily="'Times New Roman', serif" fontSize="15">T</tspan> (s)
                    </text>
                </svg>
            );
        };

        // ── Appen ──
        const VIEWS_BY_MODE = { wave: ['snett', 'ovan', 'sidan'], one: ['sidan', 'snett'] };
        const VIEW_NAMES = { snett: 'Snett framifrån', ovan: 'Rakt ovanifrån', sidan: 'Från sidan' };
        const VIEW_SHORT = { snett: 'Snett', ovan: 'Ovanifrån', sidan: 'Sidan' };

        const App = () => {
            const [mode, setMode] = useState('wave');
            const [gamma, setGamma] = useState(30);
            const [bodyId, setBodyId] = useState('jorden');
            const [alphaW, setAlphaW] = useState(8);
            const [alphaS, setAlphaS] = useState(30);
            const [len, setLen] = useState(1.2);
            const [mass, setMass] = useState(0.5);
            const [speed, setSpeed] = useState(1);
            const [running, setRunning] = useState(true);
            const [show, setShow] = useState({ skugga: true, vag: true, etiketter: true, kraft: true, komp: true, bana: true });
            const [view, setViewState] = useState('snett');
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [togglesOpen, setTogglesOpen] = useState(true);
            const [ui, setUi] = useState({ t: 0, sa: 0, sw: 0, tMeas: null });
            const sceneWrapRef = useRef(null);

            const g = BODIES.find(b => b.id === bodyId).g;
            const alpha0 = mode === 'wave' ? alphaW : alphaS;
            const setAlpha0 = (v) => (mode === 'wave' ? setAlphaW(v) : setAlphaS(v));

            const stateRef = useRef({});
            stateRef.current = { mode, gamma, g, alphaW, alphaS, len, mass, speed, running, show, view };
            const simRef = useRef({
                t: 0, a: new Float64Array(NP), w: new Float64Array(NP), sa: 0, sw: 0, a0: 0,
                na: 0, nw: 0, tMeas: null, lastCross: null,
            });
            const actionsRef = useRef({});

            // Nytt försök (pendlarna släpps om) när något som styr rörelsen ändras
            useEffect(() => {
                if (actionsRef.current.reset) actionsRef.current.reset();
            }, [mode, gamma, g, alphaW, alphaS, len]);
            useEffect(() => {
                if (actionsRef.current.setView) actionsRef.current.setView(mode, view);
            }, [mode, view]);

            useEffect(() => {
                const id = setInterval(() => {
                    const s = simRef.current;
                    setUi(u => (u.t === s.t && u.sa === s.sa && u.tMeas === s.tMeas) ? u : { t: s.t, sa: s.sa, sw: s.sw, tMeas: s.tMeas });
                }, 120);
                return () => clearInterval(id);
            }, []);
            useEffect(() => {
                const handler = () => setIsFullscreen(
                    document.fullscreenElement === sceneWrapRef.current ||
                    document.webkitFullscreenElement === sceneWrapRef.current);
                document.addEventListener('fullscreenchange', handler);
                document.addEventListener('webkitfullscreenchange', handler);
                return () => {
                    document.removeEventListener('fullscreenchange', handler);
                    document.removeEventListener('webkitfullscreenchange', handler);
                };
            }, []);
            const toggleFullscreen = () => {
                const el = sceneWrapRef.current;
                if (!el) return;
                if (document.fullscreenElement || document.webkitFullscreenElement)
                    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
            };
            const tShow = (k) => setShow(s => ({ ...s, [k]: !s[k] }));
            const reset = () => { if (actionsRef.current.reset) actionsRef.current.reset(); setRunning(false); setUi(u => ({ ...u, t: 0 })); };
            const chooseMode = (m) => {
                if (m === mode) return;
                setMode(m);
                setViewState(m === 'wave' ? 'snett' : 'sidan');
                setRunning(true);
            };
            const setView = (v) => setViewState(v);
            const views = VIEWS_BY_MODE[mode];
            const nextView = () => setView(views[(views.indexOf(view) + 1) % views.length]);
            const playLabel = running ? 'Paus' : (ui.t === 0 ? 'Släpp' : 'Fortsätt');

            // Härledda värden
            const lens = useMemo(() => Array.from({ length: NP }, (_, k) => pendLen(k, gamma)), [gamma]);
            const gammaP = gamma * Math.sqrt(G_EARTH / g);
            const tMod = gammaP > 0 ? ui.t % gammaP : 0;
            const nextRe = ui.t === 0 ? gammaP : gammaP - tMod;
            const Tform = mode === 'wave' ? 2 * Math.PI * Math.sqrt(lens[0] / g) : 2 * Math.PI * Math.sqrt(len / g);
            const aDeg = ui.sa / DEG;
            const FG = mass * g, FC = FG * Math.cos(ui.sa), F1 = FG * Math.sin(ui.sa);
            const FS = FG * Math.cos(ui.sa) + mass * len * ui.sw * ui.sw;
            const corr = (() => {                                              // exakt periodtid / småvinkelformeln
                let a = 1, b = Math.cos(alpha0 * DEG / 2);
                for (let i = 0; i < 8; i++) { const an = (a + b) / 2; b = Math.sqrt(a * b); a = an; }
                return 1 / a;
            })();

            const Readout = ({ label, value, unit, accent }) => (
                <div className="p-2 rounded-lg" style={{ background: 'var(--lab-bg)', border: '1px solid var(--lab-line-strong)' }}>
                    <div className="text-xs" style={{ color: 'var(--lab-ink-muted)' }} dangerouslySetInnerHTML={{ __html: label }} />
                    <div className="font-mono font-bold text-sm" style={{ color: accent ? 'var(--lab-accent)' : 'var(--lab-ink)' }}>
                        {value} <span className="font-normal text-xs" style={{ color: 'var(--lab-ink-muted)' }}>{unit}</span>
                    </div>
                </div>
            );

            const modeBlock = () => (
                <React.Fragment>
                    <div className="st-title">Läge</div>
                    <label><input type="radio" name="pendel-lage" checked={mode === 'wave'} onChange={() => chooseMode('wave')} /><span>Pendelvågen, femton pendlar</span></label>
                    <label><input type="radio" name="pendel-lage" checked={mode === 'one'} onChange={() => chooseMode('one')} /><span>En pendel med krafter</span></label>
                </React.Fragment>
            );
            const visaBlock = () => (
                <React.Fragment>
                    <div className="st-title mt">Visa</div>
                    {mode === 'wave' ? (
                        <React.Fragment>
                            <label><input type="checkbox" checked={show.vag} onChange={() => tShow('vag')} /><span className="st-swatch" style={{ background: '#0f1620' }}></span><span>Vågformen på bänken</span></label>
                            <label><input type="checkbox" checked={show.skugga} onChange={() => tShow('skugga')} /><span className="st-swatch" style={{ background: '#8a8f99' }}></span><span>Skuggor</span></label>
                        </React.Fragment>
                    ) : (
                        <React.Fragment>
                            <label><input type="checkbox" checked={show.kraft} onChange={() => tShow('kraft')} /><span className="st-swatch" style={{ background: C_FS }}></span><span>Krafterna <em>F</em><sub>S</sub> och <em>F</em><sub>G</sub></span></label>
                            <label><input type="checkbox" checked={show.komp} onChange={() => tShow('komp')} /><span className="st-swatch" style={{ background: C_FG }}></span><span>Komposanter av <em>F</em><sub>G</sub></span></label>
                            <label><input type="checkbox" checked={show.bana} onChange={() => tShow('bana')} /><span className="st-swatch" style={{ background: '#8a8f99' }}></span><span>Banan</span></label>
                            <label><input type="checkbox" checked={show.skugga} onChange={() => tShow('skugga')} /><span className="st-swatch" style={{ background: '#8a8f99' }}></span><span>Skugga</span></label>
                        </React.Fragment>
                    )}
                    <label><input type="checkbox" checked={show.etiketter} onChange={() => tShow('etiketter')} /><span>Etiketter</span></label>
                </React.Fragment>
            );
            const bodyButtons = (small) => (
                <div className="view-grid" style={{ flexWrap: 'wrap' }}>
                    {BODIES.map(b => (
                        <button key={b.id} className={'btn-toggle btn-small' + (bodyId === b.id ? ' active' : '')}
                                style={small ? { padding: '4px 6px', fontSize: 11.5 } : null}
                                onClick={() => setBodyId(b.id)}>{b.name}</button>
                    ))}
                </div>
            );

            const sliderSet = (Comp) => (
                <React.Fragment>
                    {mode === 'wave' ? (
                        <Comp label="Mönstrets tid (<em>Γ</em>)" sub="Tiden på Jorden. Längderna är valda så att pendel nummer <em>k</em> gör 12 + <em>k</em> hela svängningar på den. Ändrar du tiden byts längderna."
                              value={gamma} min={20} max={40} step={1} unit="s" onChange={setGamma} decimals={0} />
                    ) : (
                        <React.Fragment>
                            <Comp label="Pendellängd (<em>l</em>)" sub="Mätt till kulans tyngdpunkt."
                                  value={len} min={0.3} max={2.5} step={0.05} unit="m" onChange={setLen} decimals={2} />
                            <Comp label="Massa (<em>m</em>)" sub="Påverkar krafterna men inte periodtiden."
                                  value={mass} min={0.1} max={1} step={0.05} unit="kg" onChange={setMass} decimals={2} />
                        </React.Fragment>
                    )}
                    <Comp label="Utslag (<em>α</em>)" sub={mode === 'wave' ? 'Formeln för <em>T</em> gäller vid små utslag. Prova 40° och se mönstret förlora sin ordning.' : 'Vid stora utslag blir periodtiden längre än formeln ger.'}
                          value={alpha0} min={2} max={mode === 'wave' ? 40 : 70} step={1} unit="°" onChange={setAlpha0} decimals={0} />
                    <Comp label="Tidsfart" sub="Under 1 går det i slow motion."
                          value={speed} min={0.1} max={4} step={0.1} unit="×" onChange={setSpeed} decimals={1} />
                </React.Fragment>
            );

            const sceneToggles = () => {
                if (!togglesOpen) return (
                    <button className="st-show-btn" onClick={() => setTogglesOpen(true)}
                            aria-label="Visa inställningar" title="Visa inställningar" aria-expanded="false">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             strokeWidth="2" strokeLinecap="round" aria-hidden="true">
                            <line x1="4" y1="8" x2="20" y2="8" />
                            <circle cx="14.5" cy="8" r="2.7" fill="currentColor" stroke="none" />
                            <line x1="4" y1="16" x2="20" y2="16" />
                            <circle cx="9.5" cy="16" r="2.7" fill="currentColor" stroke="none" />
                        </svg>
                    </button>
                );
                return (
                    <div className="scene-toggles">
                        <button className="st-hide" onClick={() => setTogglesOpen(false)}
                                aria-label="Dölj inställningar" title="Dölj inställningar" aria-expanded="true">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 strokeWidth="2.4" strokeLinecap="round" aria-hidden="true">
                                <path d="M6 6l12 12M18 6L6 18" />
                            </svg>
                        </button>
                        {modeBlock()}
                        {visaBlock()}
                        {isFullscreen && (
                            <React.Fragment>
                                <div className="st-title mt">Reglage</div>
                                <div className="st-sliders">
                                    {sliderSet((p) => <StSlider {...p} sub={undefined} />)}
                                </div>
                                <div className="st-title mt">Himlakropp</div>
                                {bodyButtons(true)}
                                <div className="st-title mt">Kameravy</div>
                                <div className="st-views">
                                    {views.map(v => <button key={v} className="btn-toggle" onClick={() => setView(v)}>{VIEW_SHORT[v]}</button>)}
                                </div>
                                <div className="st-actions">
                                    <button className="btn-toggle" onClick={() => setRunning(r => !r)}>{playLabel}</button>
                                    <button className="btn-toggle" onClick={reset}>Börja om</button>
                                </div>
                            </React.Fragment>
                        )}
                    </div>
                );
            };

            const FormulaVbl = ({ label, sym }) => (
                <div style={{ textAlign: 'center' }}>
                    <div className="flbl mb-1">{label}</div>
                    <div className="fnum">{sym}</div>
                    <div className="flbl mt-1" aria-hidden="true" style={{ visibility: 'hidden' }}>{label}</div>
                </div>
            );

            return (
                <div className="min-h-screen dark-container px-4 md:px-8 pb-12" style={{ fontFamily: 'Poppins, sans-serif' }}>
                    <div className="max-w-6xl mx-auto pt-6">
                        <div className="breadcrumb mb-4" style={{ fontSize: 13 }}>
                            <a href="index.html">Hem</a> / <a href="katalog.html#fy2">Fysik nivå 2</a> / Pendelvågen i 3D
                        </div>
                        <h1 className="text-3xl md:text-4xl font-black tracking-tight" style={{ color: 'var(--lab-ink)' }}>Pendelvågen i 3D</h1>
                        <p className="mt-2 mb-5" style={{ color: 'var(--lab-ink-soft)', maxWidth: 820 }}>
                            Femton pendlar hänger bredvid varandra, och varje pendel är en aning kortare än grannen.
                            Eftersom <strong>kortare pendel ger kortare periodtid</strong> hamnar de snabbt ur takt:
                            kulorna bildar ormar, vågor och till synes kaos. Längderna är räknade så att pendel nummer <em>k</em>{' '}
                            hinner göra precis 12 + <em>k</em> hela svängningar på samma tid <em>Γ</em>, och då står alla
                            kulor i rad igen. Välj <strong>Rakt ovanifrån</strong> för att se vågformen, byt himlakropp
                            och se hur tiden förlängs, eller undersök <strong>en enda pendel</strong> och dess krafter.
                        </p>

                        {/* Formelkort med ord-etiketter */}
                        <div className="glass-card rounded-xl p-4 mb-6 flex flex-wrap items-center gap-x-8 gap-y-4 formula-card">
                            <div className="flex items-center gap-3">
                                <FormulaVbl label="Periodtid" sym={<em>T</em>} />
                                <span className="fnum">=</span>
                                <span className="fnum">2π</span>
                                <span className="fnum">⋅</span>
                                <span className="fnum" style={{ fontSize: 34, lineHeight: 1, marginRight: -4 }}>√</span>
                                <div style={{ borderTop: '2px solid currentColor', paddingTop: 3, display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
                                    <div style={{ textAlign: 'center' }}>
                                        <div className="flbl mb-1">Pendellängd</div>
                                        <div className="fnum"><em>l</em></div>
                                    </div>
                                    <div style={{ borderTop: '2px solid currentColor', width: '100%', margin: '3px 0' }}></div>
                                    <div style={{ textAlign: 'center' }}>
                                        <div className="fnum"><em>g</em></div>
                                        <div className="flbl mt-1">Tyngdacceleration</div>
                                    </div>
                                </div>
                            </div>
                            <div className="text-sm" style={{ color: 'var(--lab-ink-soft)', maxWidth: 480 }}>
                                {mode === 'wave'
                                    ? <span>Längsta pendeln har <em>l</em> = {fmt(lens[0], 2)} m och <em>g</em> = {fmt(g, 2)} m/s², så
                                        <em> T</em> = {fmt(Tform, 2)} s. Den kortaste har <em>l</em> = {fmt(lens[NP - 1], 2)} m och
                                        <em> T</em> = {fmt(2 * Math.PI * Math.sqrt(lens[NP - 1] / g), 2)} s. Pendelns massa och utslag ingår inte i formeln.</span>
                                    : <span>Med <em>l</em> = {fmt(len, 2)} m och <em>g</em> = {fmt(g, 2)} m/s² ger formeln
                                        <em> T</em> = {fmt(Tform, 2)} s. Den gäller vid små utslag. Pendelns massa ingår inte.</span>}
                            </div>
                        </div>

                        <main className="flex flex-col lg:flex-row gap-6">
                            <div className="lg:w-3/5 order-1">
                                <div className={"scene-wrap" + (isFullscreen ? " is-fs" : "")} ref={sceneWrapRef} data-theme="ljusPapper">
                                    <div className="scene-stage">
                                        <PendelScene stateRef={stateRef} simRef={simRef} actionsRef={actionsRef} />
                                        <button className="fs-btn" onClick={toggleFullscreen} aria-label="Fullskärm"
                                                title={isFullscreen ? 'Lämna fullskärm' : 'Fullskärm'}>
                                            {isFullscreen ? (
                                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                    <path d="M9 3v6H3"/><path d="M15 21v-6h6"/><path d="M21 9h-6V3"/><path d="M3 15h6v6"/>
                                                </svg>
                                            ) : (
                                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                    <path d="M3 9V3h6"/><path d="M21 9V3h-6"/><path d="M3 15v6h6"/><path d="M21 15v6h-6"/>
                                                </svg>
                                            )}
                                        </button>
                                        <button className="vy-btn" onClick={nextView} aria-label="Byt kameravy"
                                                title={'Byt kameravy: nu ' + VIEW_NAMES[view].toLowerCase() + ', nästa ' + VIEW_NAMES[views[(views.indexOf(view) + 1) % views.length]].toLowerCase()}>
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M2 12h4"/><path d="M18 12h4"/><circle cx="12" cy="12" r="4"/>
                                            </svg>
                                        </button>
                                        <div className="scene-info si-diskret">
                                            <div>{mode === 'wave' ? 'Tid sedan släppet ' + fmt(ui.t, 1) + ' s' : 'Tid ' + fmt(ui.t, 1) + ' s'}</div>
                                            {mode === 'wave' && <span>Alla i rad igen om {fmt(nextRe, 1)}{NB}s</span>}
                                        </div>
                                        <div className="scene-hint">Dra för att vrida kameran, rulla för att zooma</div>

                                        <div className="fs-quick">
                                            <button className="fq-play" onClick={() => setRunning(r => !r)}
                                                    aria-label={playLabel} title={playLabel}>
                                                {running ? (
                                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                                        <rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>
                                                    </svg>
                                                ) : (
                                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
                                                )}
                                            </button>
                                            <div className="fq-rows">
                                                <div className="fq-row">
                                                    <span className="fq-lbl">Tidsfart</span>
                                                    <input type="range" min={0.1} max={4} step={0.1} value={speed}
                                                           onChange={e => setSpeed(parseFloat(e.target.value))} aria-label="Tidsfart" />
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    {sceneToggles()}
                                </div>
                            </div>

                            <div className="lg:w-2/5 order-2">
                                <div className="flex gap-2 mb-3">
                                    <button className="btn-toggle flex-1" onClick={() => setRunning(r => !r)}>{playLabel}</button>
                                    <button className="btn-toggle flex-1" onClick={reset}>Börja om</button>
                                </div>
                                {sliderSet(Slider)}
                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <h3 className="font-bold text-sm mb-2" style={{ color: 'var(--lab-ink)' }}>Himlakropp (tyngdacceleration <em>g</em>)</h3>
                                    {bodyButtons(false)}
                                    <div className="text-xs mt-2" style={{ color: 'var(--lab-ink-muted)' }}>
                                        {mode === 'wave'
                                            ? <span>Pendlarna är byggda för Jorden. På {BODIES.find(b => b.id === bodyId).name} är <em>g</em> = {fmt(g, 2)} m/s², så varje <em>T</em> blir {fmt(Math.sqrt(G_EARTH / g), 2)} gånger så lång och hela mönstret tar {fmt(gammaP, 0)}{NB}s.</span>
                                            : <span>Det är tyngdaccelerationen <em>g</em> = {fmt(g, 2)} m/s² som dras in i formeln.</span>}
                                    </div>
                                </div>
                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <h3 className="font-bold text-sm mb-2" style={{ color: 'var(--lab-ink)' }}>Kameravy</h3>
                                    <div className="view-grid">
                                        {views.map(v => (
                                            <button key={v} className={'btn-toggle btn-small' + (view === v ? ' active' : '')} onClick={() => setView(v)}>{VIEW_NAMES[v]}</button>
                                        ))}
                                    </div>
                                </div>
                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <h3 className="font-bold text-sm mb-2" style={{ color: 'var(--lab-ink)' }}>Avläsningar</h3>
                                    {mode === 'wave' ? (
                                        <React.Fragment>
                                            <div className="grid grid-cols-2 gap-2">
                                                <Readout label="Tid sedan släppet" value={fmt(ui.t, 1)} unit="s" />
                                                <Readout label="Alla i rad igen om" value={fmt(nextRe, 1)} unit="s" accent />
                                                <Readout label="Återföreningstid" value={fmt(gammaP, 1)} unit="s" />
                                                <Readout label="Periodtidens avvikelse vid utslaget" value={(corr >= 1.0005 ? '+' : '') + fmt((corr - 1) * 100, 1)} unit="%" />
                                            </div>
                                            <div style={{ height: 8, borderRadius: 4, background: 'rgba(15,22,32,0.12)', marginTop: 10, overflow: 'hidden' }}>
                                                <div style={{ height: '100%', width: (100 * (ui.t === 0 ? 0 : tMod / gammaP)) + '%', background: 'var(--lab-accent)' }}></div>
                                            </div>
                                            <div className="text-xs mt-1" style={{ color: 'var(--lab-ink-muted)' }}>Stapeln fylls tills pendlarna står i rad igen.</div>
                                        </React.Fragment>
                                    ) : (
                                        <div className="grid grid-cols-2 gap-2">
                                            <Readout label="Utslag <em>α</em>" value={fmt(aDeg, 0)} unit="°" />
                                            <Readout label="Tyngdkraft <em>F</em><sub>G</sub> = <em>m</em> · <em>g</em>" value={fmt(FG, 2)} unit="N" />
                                            <Readout label="Spännkraft <em>F</em><sub>S</sub>" value={fmt(FS, 2)} unit="N" accent />
                                            <Readout label="Tangentiell komposant <em>F</em><sub>1</sub> = <em>F</em><sub>G</sub> · sin <em>α</em>" value={fmt(Math.abs(F1), 2)} unit="N" />
                                            <Readout label="Komposant längs snöret <em>F</em><sub>G</sub> · cos <em>α</em>" value={fmt(FC, 2)} unit="N" />
                                            <Readout label="Periodtid, formeln" value={fmt(Tform, 2)} unit="s" />
                                            <Readout label="Periodtid, uppmätt" value={ui.tMeas == null ? 'väntar' : fmt(ui.tMeas, 2)} unit={ui.tMeas == null ? '' : 's'} accent />
                                        </div>
                                    )}
                                    {mode === 'one' && <div className="text-xs mt-2" style={{ color: 'var(--lab-ink-muted)' }}>Pilarnas längd är proportionell mot kraften: 1 N motsvarar 10 cm.</div>}
                                </div>
                                {mode === 'wave' && (
                                    <div className="glass-card rounded-xl p-3 mb-3">
                                        <h3 className="font-bold text-sm mb-2" style={{ color: 'var(--lab-ink)' }}>Periodtid mot längd</h3>
                                        <PlotTL gamma={gamma} g={g} />
                                        <div className="text-xs mt-1" style={{ color: 'var(--lab-ink-muted)' }}>
                                            Varje prick är en pendel, med samma färg som kulan. Dubbel längd ger inte dubbel periodtid, utan <em>T</em> växer med kvadratroten ur <em>l</em>.
                                        </div>
                                    </div>
                                )}
                            </div>
                        </main>

                        {mode === 'wave' && (
                            <div className="glass-card rounded-xl p-3 mt-6" style={{ overflowX: 'auto' }}>
                                <h3 className="font-bold text-sm mb-2" style={{ color: 'var(--lab-ink)' }}>Pendlarna</h3>
                                <table className="text-sm font-mono" style={{ borderCollapse: 'collapse', width: '100%', minWidth: 460, color: 'var(--lab-ink)' }}>
                                    <thead>
                                        <tr style={{ textAlign: 'right', color: 'var(--lab-ink-muted)' }}>
                                            <th style={{ textAlign: 'left', padding: '3px 6px' }}>Nr</th>
                                            <th style={{ padding: '3px 6px' }}>Längd <em>l</em> (m)</th>
                                            <th style={{ padding: '3px 6px' }}>Periodtid <em>T</em> (s)</th>
                                            <th style={{ padding: '3px 6px' }}>Svängningar på <em>Γ</em></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {lens.map((l, k) => (
                                            <tr key={k} style={{ textAlign: 'right', borderTop: '1px solid var(--lab-line)' }}>
                                                <td style={{ textAlign: 'left', padding: '3px 6px' }}>
                                                    <span style={{ display: 'inline-block', width: 11, height: 11, borderRadius: '50%', background: cssHue(k), marginRight: 8, verticalAlign: -1 }}></span>{k + 1}
                                                </td>
                                                <td style={{ padding: '3px 6px' }}>{fmt(l, 3)}</td>
                                                <td style={{ padding: '3px 6px' }}>{fmt(2 * Math.PI * Math.sqrt(l / g), 3)}</td>
                                                <td style={{ padding: '3px 6px' }}>{N0 + k}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}

                        <div className="grid md:grid-cols-2 gap-4 mt-6">
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Varför står de i rad igen?</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Pendel nummer <em>k</em> har periodtiden <em>T</em> = <em>Γ</em>/(12 + <em>k</em>), så den hinner göra ett helt antal
                                    svängningar på <em>Γ</em>. Alla pendlar är då tillbaka i sitt startläge samtidigt, även om de
                                    mitt i förloppet svänger åt helt olika håll. Efter halva tiden bildar kulorna två vågor, och
                                    vid andra bråkdelar av <em>Γ</em> syns fler och fler små vågor tills det ser slumpmässigt ut.
                                </p>
                            </div>
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Små utslag, annars driver mönstret</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Formeln <em>T</em> = 2π · √(<em>l</em>/<em>g</em>) gäller bara när utslaget är litet. Vid 8° är
                                    felet runt 0,1 %, och pendlarna kommer tillbaka i rad. Dra utslaget mot 40°: periodtiden växer
                                    med några procent, de långa och korta pendlarna får olika stort fel, och när tiden
                                    <em> Γ</em> gått står kulorna inte längre exakt i rad.
                                </p>
                            </div>
                            <div className="glass-card rounded-xl p-4 md:col-span-2">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Prova själv</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Släpp pendlarna och välj <strong>Rakt ovanifrån</strong>: den svarta linjen på bänken är vågformen.
                                    Välj sedan <strong>Månen</strong>. Samma pendlar svänger långsammare, eftersom <em>g</em> är mindre, men mönstret
                                    återkommer ändå, bara senare. Byt till <strong>En pendel med krafter</strong>, ge den ett stort utslag och följ
                                    spännkraften <em>F</em><sub>S</sub>: den är större i lägsta punkten än när pendeln står stilla. Tyngdkraften <em>F</em><sub>G</sub> delas i en
                                    komposant längs snöret och en tangentiell komposant <em>F</em><sub>1</sub>, som är den kraft som driver pendeln mot jämviktsläget.
                                    Teorin finns i genomgången{' '}
                                    <a className="underline" href="katalog.html?id=fy2-2.5">Plan matematisk pendel</a>.
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);

    </script>
    <script src="feedback.js" defer></script>
    <script src="sim-dock.js" defer></script>
    <script src="data/katalog.js"></script>
    <script src="section-nav.js"></script>

</body>
