    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const G = 9.82;                     // tyngdfaktorn (N/kg)
        const DEG = Math.PI / 180;

        // ── Cirkelbana (ovanifrån): glidarintervall ──
        const VMIN = 2, VMAX = 15;          // banhastighet (m/s)
        const RMIN = 5, RMAX = 25;          // banradie (m)
        const MMIN = 500, MMAX = 2000;      // massa (kg)

        // ── Bilbana (ovanifrån): glidarintervall ──
        const BR1MIN = 10, BR1MAX = 20;     // vida kurvans radie (m)
        const BR2MIN = 4, BR2MAX = 10;      // snäva kurvans radie (m)
        const MUMIN = 0.1, MUMAX = 1.0;     // friktionstal däck–väg

        // ── Krön och dal (från sidan): glidarintervall ──
        const KRMIN = 8, KRMAX = 16;        // krönets och dalens radie (m)

        // ── Loop: fasta parametrar ──
        const RL = 8.0;                     // loopens radie (m)
        const ML = 1000;                    // bilens massa i loopen (kg)
        const V0MIN = 8, V0MAX = 24;        // fart längst ned (m/s)
        const VCRIT = Math.sqrt(5 * G * RL);        // gränsfart längst ned
        const VTOP_MIN = Math.sqrt(G * RL);         // gränsfart i toppen

        const fmt = (num, decimals = 1) => {
            if (!isFinite(num)) return '–';
            const s = num.toFixed(decimals);
            if (parseFloat(s) === 0) return '0';
            return s.replace('.', ',');
        };
        // Tusentalsavgränsare med hårt mellanslag (NBSP) — för krafter i N.
        const fmtNum = (n, d = 0) => {
            if (!isFinite(n)) return '–';
            const s = n.toFixed(d);
            if (parseFloat(s) === 0) return '0';
            const [intp, frac] = s.split('.');
            const withSpaces = intp.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
            return frac !== undefined ? withSpaces + ',' + frac : withSpaces;
        };

        const COL = {
            fart:  '#2563c9',  // blå — hastighet v (samma som teorifigurerna)
            acc:   '#7c3aed',  // violett — centripetalacceleration a_C
            fc:    '#b8860b',  // mörk guld — centripetalkraften F_C
            res:   '#0f1620',  // bläck — resulterande kraften F_R (vektorsumman)
            frik:  '#e0701a',  // orange — friktionskraft F_f
            tyngd: '#c8324a',  // crimson — tyngdkraft F_G
            norm:  '#0d9488',  // teal — normalkraft F_N
            ink:   '#0f1620',
        };

        // ── SVG-pil: EN sammanhängande polygon, skaft och spets i ett ──
        // Pilen ritades tidigare som en linje med en triangel ovanpå, båda
        // med egen kontur. Triangelns kontur syntes då som en söm tvärs över
        // pilen, och pilen såg ihopsatt ut i stället för hel (påpekat
        // 2026-09-13). Nu är den en enda form utan kontur: mot den ljusa
        // papperscenen räcker pilens egen färg, och en kontur runt bara en
        // av delarna vore fel ändå.
        const Arrow = ({ x1, y1, x2, y2, color, width = 7, head = 20, opacity = 1 }) => {
            const ang = Math.atan2(y2 - y1, x2 - x1);
            const len = Math.hypot(x2 - x1, y2 - y1);
            if (len < 0.5) return null;
            const hw = 0.42;                                  // spetsens halva öppningsvinkel
            const hd = Math.max(11, Math.min(head, len * 0.9));
            const ux = Math.cos(ang), uy = Math.sin(ang);     // längs pilen
            const nx = -uy, ny = ux;                          // vinkelrätt mot pilen
            const hh = hd * Math.sin(hw);                     // spetsens halva bredd
            const bd = hd * Math.cos(hw);                     // spetsens bas, från spetsen räknat
            const bx = x2 - bd * ux, by = y2 - bd * uy;
            // skaftet får aldrig bli bredare än spetsen (korta pilar)
            const w = Math.min(width, hh * 1.25) / 2;
            const P = (px, py) => `${px.toFixed(2)},${py.toFixed(2)}`;
            const pts = [
                P(x1 + nx * w, y1 + ny * w),
                P(bx + nx * w, by + ny * w),
                P(bx + nx * hh, by + ny * hh),
                P(x2, y2),
                P(bx - nx * hh, by - ny * hh),
                P(bx - nx * w, by - ny * w),
                P(x1 - nx * w, y1 - ny * w),
            ].join(' ');
            return <polygon points={pts} fill={color} opacity={opacity} />;
        };

        // Mjuk pilkompression (cirkelscenen): linjär skala upp till knäet
        // (60 % av cap), därefter avtagande tillväxt mot cap enligt
        // t/(1 + t). Pilen FORTSÄTTER alltså alltid att växa när kraften
        // eller accelerationen ökar — den hårda klippningen gjorde att
        // pilen slutade växa redan vid ca 8 m/s (påpekat 2026-08-31) —
        // men når aldrig fram till cirkelns centrum.
        const softLen = (raw, cap) => {
            const knee = cap * 0.6;
            if (raw <= knee) return raw;
            const rest = cap - knee;
            const t = (raw - knee) / rest;
            return knee + rest * (t / (1 + t));
        };

        // Etikett vid pilspets: placeras ett stycke BORTOM spetsen i pilens
        // riktning, med anchor så texten flödar ut i fri yta.
        const tipLabel = (tip, dir, extra = 15) => {
            const x = tip.x + dir.x * extra, y = tip.y + dir.y * extra;
            const anchor = dir.x > 0.35 ? 'start' : (dir.x < -0.35 ? 'end' : 'middle');
            const dy = dir.y > 0.35 ? 15 : (dir.y < -0.35 ? -5 : 5);
            return { x, y: y + dy, anchor };
        };

        // Markering på glidaren vid en gränsfart. Ritas inte alls när
        // gränsen ligger utanför glidarens intervall.
        const SliderMark = ({ value, min, max }) => {
            if (!isFinite(value) || value < min || value > max) return null;
            const p = (value - min) / (max - min);
            // nära glidarens ändar flödar ordet inåt i stället för att
            // centreras, så att det inte spiller ut över etiketten bredvid
            const capStyle = p < 0.2 ? { left: 0, transform: 'none' }
                : (p > 0.8 ? { left: 'auto', right: 0, transform: 'none' } : null);
            return (
                <span className="sl-mark" style={{ left: `calc(8px + (100% - 16px) * ${p})` }}>
                    <span className="sl-cap" style={capStyle}>Gränsfart</span>
                    <b /><i />
                </span>
            );
        };

        // Skjuter in en etikett som hamnat utanför viewBoxens sidkant. Bredden
        // uppskattas ur strängens längd (~0,55 · font-size per tecken). Utan den
        // kapades "F_N = 8 044 N" av vänsterkanten när bilen låg i dalen längst
        // till vänster.
        const fitX = (l, text, fontSize = 16) => {
            const w = String(text).length * fontSize * 0.55;
            const left = l.anchor === 'end' ? l.x - w : (l.anchor === 'middle' ? l.x - w / 2 : l.x);
            const right = left + w;
            let x = l.x;
            if (left < 6) x += 6 - left;
            else if (right > VBW - 6) x -= right - (VBW - 6);
            return { x, y: l.y, anchor: l.anchor };
        };

        // Väljer det första av flera etikettlägen som ryms i sidled. Ger en
        // etikett vid kanten en chans att hoppa över till pilens andra sida
        // i stället för att klämmas in ovanpå pilen.
        const pickX = (cands, text, fontSize = 16) => {
            const w = String(text).length * fontSize * 0.55;
            const fits = (l) => {
                const left = l.anchor === 'end' ? l.x - w : (l.anchor === 'middle' ? l.x - w / 2 : l.x);
                return left >= 6 && left + w <= VBW - 6;
            };
            return cands.find(fits) || fitX(cands[0], text, fontSize);
        };

        const Slider = ({ label, value, min, max, step, onChange, mark, children }) => (
            <div className={"flex items-center gap-2 mb-2" + (mark != null ? " sl-row-mark" : "")}>
                <span className="text-xs flex-shrink-0" style={{ minWidth: 110, color: 'var(--lab-ink-soft)' }}
                      dangerouslySetInnerHTML={{ __html: label }} />
                <span className="sl-wrap">
                    <input type="range" min={min} max={max} step={step} value={value}
                           onChange={(e) => onChange(parseFloat(e.target.value))}
                           className="cursor-pointer" />
                    {mark != null && <SliderMark value={mark} min={min} max={max} />}
                </span>
                {children}
            </div>
        );

        // Kompakt reglage-rad för inställningsrutan uppe till höger i
        // fullskärm: etikett + sifferfält på en rad, glidaren under.
        const StSlider = ({ label, value, min, max, step, onChange, valueNode, mark }) => (
            <div className={"st-slider" + (mark != null ? " st-slider-mark" : "")}>
                <div className="st-slider-top">
                    <span dangerouslySetInnerHTML={{ __html: label }} />
                    {valueNode}
                </div>
                <span className="sl-wrap">
                    <input type="range" min={min} max={max} step={step} value={value}
                           onChange={(e) => onChange(parseFloat(e.target.value))} />
                    {mark != null && <SliderMark value={mark} min={min} max={max} />}
                </span>
            </div>
        );

        const NumInput = ({ value, min, max, onCommit, fmtFn, unit, color = 'var(--lab-accent, #c8324a)' }) => {
            const [txt, setTxt] = useState(() => fmtFn(value));
            const [editing, setEditing] = useState(false);
            useEffect(() => { if (!editing) setTxt(fmtFn(value)); }, [value, editing]);
            const commit = (raw) => {
                const norm = raw.replace(',', '.').trim();
                if (norm === '' || norm === '-' || norm === '.' || norm === '-.') return;
                let n = parseFloat(norm);
                if (!isFinite(n)) return;
                if (min != null && n < min) n = min;
                if (max != null && n > max) n = max;
                onCommit(n);
            };
            return (
                <span className="num-wrap">
                    <input className="num-in" type="text" inputMode="decimal" value={txt}
                           style={{ color }} aria-label="Skriv in värde"
                           onFocus={() => setEditing(true)}
                           onChange={(e) => { setTxt(e.target.value); commit(e.target.value); }}
                           onBlur={() => { setEditing(false); setTxt(fmtFn(value)); }}
                           onKeyDown={(e) => { if (e.key === 'Enter') e.currentTarget.blur(); }} />
                    {unit && <span className="num-unit">{unit}</span>}
                </span>
            );
        };

        // ════════════════════════════════════════════════════════
        //  SCEN 1 — bil i cirkelbana, sedd ovanifrån
        // ════════════════════════════════════════════════════════
        const VBW = 820, VBH = 540;
        // centrum förskjutet åt vänster så banan går fri från visa-panelen
        // uppe till höger
        const CX = 360, CY = 278;

        // px per meter varierar med radien så banan alltid fyller scenen lagom
        const rToPx = (r) => Math.max(76, Math.min(205, 70 + r * 5.4));

        // Bil sedd ovanifrån — lokala koordinater: +x = framåt, origo i bilens mitt
        const CarTop = () => (
            <g>
                <rect x="-25" y="-13" width="50" height="26" rx="7"
                      fill="url(#carG)" stroke="#2c5a86" strokeWidth="2" />
                {/* vindruta (fram) och bakruta */}
                <path d="M 8,-10 L 15,-7 L 15,7 L 8,10 Z" fill="#c7d6e4" stroke="#2c5a86" strokeWidth="1.2" />
                <path d="M -12,-10 L -17,-8 L -17,8 L -12,10 Z" fill="#c7d6e4" stroke="#2c5a86" strokeWidth="1.2" />
                {/* tak */}
                <rect x="-12" y="-9" width="20" height="18" rx="4" fill="#6fa8d6" stroke="#2c5a86" strokeWidth="1.2" />
                {/* strålkastare */}
                <rect x="22" y="-10" width="2.6" height="5" rx="1" fill="#f0e6c8" />
                <rect x="22" y="5" width="2.6" height="5" rx="1" fill="#f0e6c8" />
            </g>
        );

        const CircleScene = ({ phase, v, m, r, show, forceView, kompakt }) => {
            const rPx = rToPx(r);
            const cosP = Math.cos(phase), sinP = Math.sin(phase);
            const P = { x: CX + rPx * cosP, y: CY - rPx * sinP };      // bilens mitt (motsols)
            const t = { x: -sinP, y: -cosP };                          // tangent (rörelseriktning)
            const inward = { x: -cosP, y: sinP };                      // in mot centrum

            const aC = v * v / r;
            const FC = m * aC;

            // pillängder — pilen växer alltid med beloppet (softLen), men
            // planar mjukt ut så att spetsen aldrig når cirkelns centrum
            const capF = rPx - 12;
            const LF = FC <= 0.5 ? 0 : Math.max(14, softLen(FC * 0.016, capF));
            const capA = rPx - 30;
            const LA = aC <= 0.02 ? 0 : Math.max(13, softLen(aC * 8, capA));
            const LV = Math.max(14, Math.min(v * 7, 150));

            const rotDeg = -(90 + phase / DEG);

            // kraftpil: från bilens mitt (kontaktytan däck–väg sedd ovanifrån) mot
            // centrum. Etiketten läggs vinkelrätt ut på LEDANDE sidan (+t) så den
            // aldrig hamnar på den kolinjära radien.
            const fTip = { x: P.x + inward.x * LF, y: P.y + inward.y * LF };
            const fl = tipLabel(fTip, t, 14);
            // a_C-pil: parallellförskjuten bakåt längs tangenten så den inte
            // ligger ovanpå kraftpilen/radien; etiketten flödar vidare INÅT
            // förbi spetsen — cirkelns inre är alltid fri yta
            const aOff = 34;
            const aStart = { x: P.x - t.x * aOff, y: P.y - t.y * aOff };
            const aTip = { x: aStart.x + inward.x * LA, y: aStart.y + inward.y * LA };
            // extra knuff åt släpsidan så etiketten inte tangerar kraftpilen
            const al = tipLabel({ x: aTip.x - t.x * 10, y: aTip.y - t.y * 10 }, inward, 14);
            // v-pil: från bilens FRAMKANT (objektets rand i pilens riktning)
            const vStart = { x: P.x + t.x * 26, y: P.y + t.y * 26 };
            const vTip = { x: vStart.x + t.x * LV, y: vStart.y + t.y * LV };
            const vl = tipLabel(vTip, t);
            // radie-etikett: bara ett kursivt r intill linjen (som i teori-
            // figurerna) — värdet står i Avläsning. Håller etiketten fri från
            // väg, pilar och a_C-etikett vid alla vinklar.
            const rMid = { x: CX + rPx * 0.45 * cosP, y: CY - rPx * 0.45 * sinP };
            const rl = tipLabel(rMid, t, 10);

            const showF = show.forces && forceView === 'verkliga';
            const showFc = show.forces && forceView === 'centripetal';
            // sedd ovanifrån är resultanten = friktionskraften (F_N och F_G tar
            // ut varandra lodrätt) — samma pil, i rollen som F_R
            const showFr = show.forces && forceView === 'resultant';

            return (
                <svg viewBox={`0 0 ${VBW} ${VBH}`} preserveAspectRatio="xMidYMid meet"
                     style={{ fontFamily: "'DM Sans', sans-serif" }}>
                    <defs>
                        <linearGradient id="wallG" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stopColor="#f7f2e8" />
                            <stop offset="100%" stopColor="#ece3d2" />
                        </linearGradient>
                        <linearGradient id="carG" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stopColor="#5b9bd1" />
                            <stop offset="100%" stopColor="#3f7cb4" />
                        </linearGradient>
                    </defs>

                    <rect x="0" y="0" width={VBW} height={VBH} fill="url(#wallG)" />

                    {/* vägbana (ring) */}
                    <circle cx={CX} cy={CY} r={rPx} fill="none" stroke="#8f959e" strokeWidth="40" />
                    <circle cx={CX} cy={CY} r={rPx + 20} fill="none" stroke="rgba(15,22,32,0.45)" strokeWidth="1.6" />
                    <circle cx={CX} cy={CY} r={rPx - 20} fill="none" stroke="rgba(15,22,32,0.45)" strokeWidth="1.6" />
                    <circle cx={CX} cy={CY} r={rPx} fill="none" stroke="#ece5d2" strokeWidth="2.4"
                            strokeDasharray="16 14" opacity="0.85" />

                    {/* centrum */}
                    <circle cx={CX} cy={CY} r="3.4" fill={COL.ink} />

                    {/* radie */}
                    {show.radius && (
                        <g>
                            <line x1={CX} y1={CY} x2={P.x} y2={P.y} stroke={COL.ink}
                                  strokeWidth="1.7" strokeDasharray="6 5" opacity="0.75" />
                            <text x={rl.x} y={rl.y} textAnchor={rl.anchor} fontSize="18" fontWeight="700" fill={COL.ink}>
                                <tspan fontStyle="italic">r</tspan>
                            </text>
                        </g>
                    )}

                    {/* tillståndstext — centrerad över scenens vänstra del så den
                        inte hamnar bakom visa-panelen uppe till höger. I mini-
                        läget (kompakt) är skalan mindre och överkanten upptagen
                        av fullskärmsknappen och situationsväxlaren — texten
                        läggs då centrerad i den fria nederkanten i stället. */}
                    <text x={kompakt ? 410 : 290} y={kompakt ? 524 : 40} textAnchor="middle"
                          fontSize={kompakt ? 17 : 19} fontWeight="700" fill="rgba(15,22,32,0.7)">
                        Konstant fart — men hastigheten byter riktning
                    </text>

                    {/* bilen */}
                    <g transform={`translate(${P.x} ${P.y}) rotate(${rotDeg})`}>
                        <CarTop />
                    </g>

                    {/* friktionskraft (den verkliga kraften) — angriper i kontakt-
                        ytan däck–väg, som ovanifrån ligger under bilen */}
                    {showF && LF > 0 && (
                        <g>
                            <Arrow x1={P.x} y1={P.y} x2={fTip.x} y2={fTip.y} color={COL.frik} />
                            <text x={fl.x} y={fl.y} textAnchor={fl.anchor} fontSize="17" fontWeight="700" fill={COL.frik}>
                                <tspan fontStyle="italic">F</tspan><tspan dy="4" fontSize="13">f</tspan>
                                <tspan dy="-4"> = {fmtNum(FC)} N</tspan>
                            </text>
                        </g>
                    )}

                    {/* centripetalkraften */}
                    {showFc && LF > 0 && (
                        <g>
                            <Arrow x1={P.x} y1={P.y} x2={fTip.x} y2={fTip.y} color={COL.fc} />
                            <text x={fl.x} y={fl.y} textAnchor={fl.anchor} fontSize="17" fontWeight="700" fill={COL.fc}>
                                <tspan fontStyle="italic">F</tspan><tspan dy="4" fontSize="13">C</tspan>
                                <tspan dy="-4"> = {fmtNum(FC)} N</tspan>
                            </text>
                        </g>
                    )}

                    {/* resulterande kraften — vid konstant fart är F_R = F_C */}
                    {showFr && LF > 0 && (
                        <g>
                            <Arrow x1={P.x} y1={P.y} x2={fTip.x} y2={fTip.y} color={COL.res} />
                            <text x={fl.x} y={fl.y} textAnchor={fl.anchor} fontSize="17" fontWeight="700" fill={COL.res}>
                                <tspan fontStyle="italic">F</tspan><tspan dy="4" fontSize="13">R</tspan>
                                <tspan dy="-4"> = {fmtNum(FC)} N</tspan>
                            </text>
                        </g>
                    )}

                    {/* centripetalacceleration — parallellförskjuten från kraftpilen */}
                    {show.accel && LA > 0 && (
                        <g>
                            <Arrow x1={aStart.x} y1={aStart.y} x2={aTip.x} y2={aTip.y} color={COL.acc} width={6} head={17} />
                            <text x={al.x} y={al.y} textAnchor={al.anchor} fontSize="16" fontWeight="700" fill={COL.acc}>
                                <tspan fontStyle="italic">a</tspan><tspan dy="4" fontSize="12">C</tspan>
                                <tspan dy="-4"> = {fmt(aC, 1)} m/s²</tspan>
                            </text>
                        </g>
                    )}

                    {/* hastighet — startar vid bilens framkant, tangentiellt */}
                    {show.vel && (
                        <g>
                            <Arrow x1={vStart.x} y1={vStart.y} x2={vTip.x} y2={vTip.y} color={COL.fart} width={6.5} head={18} />
                            <text x={vl.x} y={vl.y} textAnchor={vl.anchor} fontSize="17" fontWeight="700" fill={COL.fart}>
                                <tspan fontStyle="italic">v</tspan> = {fmt(v, 1)} m/s
                            </text>
                        </g>
                    )}
                </svg>
            );
        };

        // ════════════════════════════════════════════════════════
        //  SCEN 2 — bil i loop (sedd från sidan)
        // ════════════════════════════════════════════════════════
        const LCX = 360, LCY = 250, LRPX = 178;
        const PXM = LRPX / RL;                    // px per meter
        const GROUND_Y = LCY + LRPX + 8;

        // Bil sedd från sidan — lokala koordinater: kontaktpunkt i (0,0),
        // +x = framåt, −y = upp (in mot loopens centrum vid botten)
        const CarSide = () => (
            <g>
                {/* kaross */}
                <path d="M -27,-9 L -24,-17 L -10,-19 L -6,-26 L 12,-26 L 18,-18 L 27,-15 L 28,-9 Q 28,-6 24,-6 L -23,-6 Q -27,-6 -27,-9 Z"
                      fill="url(#carSG)" stroke="#2c5a86" strokeWidth="2" strokeLinejoin="round" />
                {/* ruta */}
                <path d="M -4,-24 L 10,-24 L 14,-18 L -7,-18 Z" fill="#c7d6e4" stroke="#2c5a86" strokeWidth="1.2" />
                {/* hjul */}
                <circle cx="-16" cy="-5.5" r="5.5" fill="#2b2f36" stroke="#15181d" strokeWidth="1.6" />
                <circle cx="16" cy="-5.5" r="5.5" fill="#2b2f36" stroke="#15181d" strokeWidth="1.6" />
                <circle cx="-16" cy="-5.5" r="1.8" fill="#c9ced6" />
                <circle cx="16" cy="-5.5" r="1.8" fill="#c9ced6" />
            </g>
        );

        const kFL = 0.003;                        // px per N (kraftpilar, loop)
        const lenFL = (F) => (F <= 1 ? 0 : Math.min(F * kFL, 250));

        const LoopScene = ({ ls, v0, show, forceView, kompakt }) => {
            // ls: { st, th, dir, x, y, vx, vy, detach, trace }  (px där inget annat anges)
            const th = ls.th;
            const onTrack = ls.st === 'track';
            const failed = ls.st === 'failed';

            // position + riktningar på banan (α från loopens botten, medsols i scenen)
            const pos = onTrack
                ? { x: LCX + LRPX * Math.sin(th), y: LCY + LRPX * Math.cos(th) }
                : { x: ls.x, y: ls.y };
            const inward = { x: -Math.sin(th), y: -Math.cos(th) };     // mot centrum
            const tdir = { x: Math.cos(th), y: -Math.sin(th) };        // rörelseriktning (α växer)

            // fart ur energiprincipen
            const v2 = Math.max(0, v0 * v0 - 2 * G * RL * (1 - Math.cos(th)));
            const vmag = onTrack ? Math.sqrt(v2) : Math.hypot(ls.vx, ls.vy) / PXM;
            const N = onTrack ? Math.max(0, ML * (v2 / RL + G * Math.cos(th))) : 0;
            const FG = ML * G;
            const FCnow = onTrack ? ML * v2 / RL : 0;

            const LN = lenFL(N), LG = lenFL(FG), LFC = lenFL(FCnow);
            const LV = Math.max(0, Math.min(vmag * 5.5, 140));
            const LA = Math.max(0, Math.min((onTrack ? v2 / RL : 0) * 2.0, 150));

            // krafternas geometri. Radiella pilar (F_N, F_C) och radien är
            // kolinjära — deras etiketter läggs vinkelrätt ut på LEDANDE sidan,
            // a_C-etiketten på SLÄPANDE sidan, så inget hamnar på linjerna.
            const cm = { x: pos.x + inward.x * 14, y: pos.y + inward.y * 14 };  // tyngdpunkt (mitt i karossen)
            const gTip = { x: cm.x, y: cm.y + LG };
            const gl = { x: gTip.x + 12, y: gTip.y + 16, anchor: 'start' };     // bredvid, ej på radiella linjer
            const nTip = { x: pos.x + inward.x * LN, y: pos.y + inward.y * LN };
            const nl = tipLabel(nTip, tdir, 14);
            const fcTip = { x: cm.x + inward.x * LFC, y: cm.y + inward.y * LFC };
            const fcl = tipLabel(fcTip, tdir, 14);
            const aOff = 30;
            const aStart = { x: pos.x - tdir.x * aOff + inward.x * 6, y: pos.y - tdir.y * aOff + inward.y * 6 };
            const aTip = { x: aStart.x + inward.x * LA, y: aStart.y + inward.y * LA };
            const al = tipLabel(aTip, { x: -tdir.x, y: -tdir.y }, 12);
            const vel = onTrack
                ? { x: tdir.x * (ls.dir >= 0 ? 1 : -1), y: tdir.y * (ls.dir >= 0 ? 1 : -1) }
                : (() => { const L = Math.hypot(ls.vx, ls.vy) || 1; return { x: ls.vx / L, y: ls.vy / L }; })();
            const vStart = { x: cm.x + vel.x * 30, y: cm.y + vel.y * 30 };
            const vTip = { x: vStart.x + vel.x * LV, y: vStart.y + vel.y * LV };
            const vl = tipLabel(vTip, vel);

            // radie-etikett — vinkelrätt förskjuten, ankrad bort från linjen
            const rMid = { x: LCX + LRPX * 0.55 * Math.sin(th), y: LCY + LRPX * 0.55 * Math.cos(th) };
            const rl = tipLabel(rMid, tdir, 12);

            const showF = show.forces && forceView === 'verkliga';
            const showFc = show.forces && forceView === 'centripetal';
            const showFr = show.forces && forceView === 'resultant';

            // resulterande kraften = vektorsumman av F_N och F_G. På banan har
            // den både en radiell del (centripetal) och en tangentiell del
            // (farten ändras) — i luften är den bara tyngdkraften.
            const frVec = { x: N * inward.x, y: N * inward.y + FG };
            const frMag = Math.hypot(frVec.x, frVec.y);
            const frU = frMag > 1 ? { x: frVec.x / frMag, y: frVec.y / frMag } : { x: 0, y: 1 };
            const frLen = lenFL(frMag);
            const frTip = { x: cm.x + frU.x * frLen, y: cm.y + frU.y * frLen };
            const frl = tipLabel(frTip, frU);

            // statusrad
            let stateText, stateCol;
            if (ls.st === 'ballistic' || failed) {
                stateText = 'Normalkraften blev 0 — bilen släpper och faller fritt!';
                stateCol = COL.tyngd;
            } else if (v0 < Math.sqrt(2 * G * RL) - 0.005) {
                stateText = 'För låg fart — bilen rullar fram och tillbaka';
                stateCol = 'rgba(15,22,32,0.7)';
            } else if (v0 < VCRIT - 0.05) {
                stateText = 'För låg fart — bilen släpper där normalkraften blir 0';
                stateCol = COL.frik;
            } else if (v0 < VCRIT + 0.05) {
                stateText = 'Precis på gränsen — i toppen är normalkraften 0';
                stateCol = COL.fc;
            } else {
                stateText = 'Bilen klarar loopen — normalkraft från vägen hela varvet';
                stateCol = COL.norm;
            }

            return (
                <svg viewBox={`0 0 ${VBW} ${VBH}`} preserveAspectRatio="xMidYMid meet"
                     style={{ fontFamily: "'DM Sans', sans-serif" }}>
                    <defs>
                        <linearGradient id="wallG2" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stopColor="#f7f2e8" />
                            <stop offset="100%" stopColor="#ece3d2" />
                        </linearGradient>
                        <linearGradient id="carSG" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stopColor="#5b9bd1" />
                            <stop offset="100%" stopColor="#3f7cb4" />
                        </linearGradient>
                    </defs>

                    <rect x="0" y="0" width={VBW} height={VBH} fill="url(#wallG2)" />

                    {/* mark + tillfartsväg */}
                    <line x1="24" y1={GROUND_Y} x2={VBW - 24} y2={GROUND_Y} stroke={COL.ink} strokeWidth="3" strokeLinecap="round" />

                    {/* loopbanan (ring) */}
                    <circle cx={LCX} cy={LCY} r={LRPX + 5} fill="none" stroke="#8f959e" strokeWidth="10" />
                    <circle cx={LCX} cy={LCY} r={LRPX + 10.5} fill="none" stroke="rgba(15,22,32,0.5)" strokeWidth="1.6" />
                    <circle cx={LCX} cy={LCY} r={LRPX} fill="none" stroke="rgba(15,22,32,0.5)" strokeWidth="1.4" />

                    {/* centrum */}
                    <circle cx={LCX} cy={LCY} r="3.4" fill={COL.ink} />

                    {/* radie — bara medan bilen är på banan */}
                    {show.radius && onTrack && (
                        <g>
                            <line x1={LCX} y1={LCY} x2={pos.x} y2={pos.y} stroke={COL.ink}
                                  strokeWidth="1.7" strokeDasharray="6 5" opacity="0.75" />
                            <text x={rl.x} y={rl.y} textAnchor={rl.anchor} fontSize="17" fontWeight="700" fill={COL.ink}>
                                <tspan fontStyle="italic">r</tspan> = {fmt(RL, 1)} m
                            </text>
                        </g>
                    )}

                    {/* fallbana + släpp-punkt */}
                    {ls.trace.length > 1 && (
                        <polyline points={ls.trace.map(p => `${p.x},${p.y}`).join(' ')} fill="none"
                                  stroke="rgba(15,22,32,0.4)" strokeWidth="2" strokeDasharray="4 5" />
                    )}
                    {ls.detach && (
                        <g>
                            <circle cx={ls.detach.x} cy={ls.detach.y} r="7" fill="none"
                                    stroke={COL.tyngd} strokeWidth="2" strokeDasharray="3 3" />
                            <text x={ls.detach.x + ls.detach.lx} y={ls.detach.y + ls.detach.ly}
                                  textAnchor={ls.detach.anchor} fontSize="15" fontWeight="700" fill={COL.tyngd}>
                                <tspan fontStyle="italic">F</tspan><tspan dy="4" fontSize="11">N</tspan>
                                <tspan dy="-4"> = 0 här</tspan>
                            </text>
                        </g>
                    )}

                    {/* tillståndstext — vänsterställd yta, fri från visa-panelen.
                        I mini-läget (kompakt) täcks överkanten av fullskärms-
                        knappen och situationsväxlaren — texten läggs då
                        centrerad i den fria nederkanten under marklinjen. */}
                    <text x={kompakt ? 410 : 290} y={kompakt ? 524 : 38} textAnchor="middle"
                          fontSize={kompakt ? 17 : 19} fontWeight="700" fill={stateCol}>
                        {stateText}
                    </text>

                    {/* bilen */}
                    <g transform={`translate(${pos.x} ${pos.y}) rotate(${-(onTrack ? th : ls.rot) / DEG})`}>
                        <CarSide />
                    </g>

                    {/* verkliga krafter: tyngdkraft + normalkraft */}
                    {showF && (
                        <g>
                            {/* F_G — från tyngdpunkten, alltid rakt ned, med CM-prick */}
                            <Arrow x1={cm.x} y1={cm.y} x2={gTip.x} y2={gTip.y} color={COL.tyngd} />
                            <circle cx={cm.x} cy={cm.y} r="2.8" fill={COL.tyngd} />
                            <text x={gl.x} y={gl.y} textAnchor={gl.anchor} fontSize="16" fontWeight="700" fill={COL.tyngd}>
                                <tspan fontStyle="italic">F</tspan><tspan dy="4" fontSize="12">G</tspan>
                                <tspan dy="-4"> = {fmtNum(FG)} N</tspan>
                            </text>
                            {/* F_N — från kontaktytan däck–väg, in mot centrum */}
                            {onTrack && LN > 0.5 && (
                                <g>
                                    <Arrow x1={pos.x} y1={pos.y} x2={nTip.x} y2={nTip.y} color={COL.norm} />
                                    <text x={nl.x} y={nl.y} textAnchor={nl.anchor} fontSize="16" fontWeight="700" fill={COL.norm}>
                                        <tspan fontStyle="italic">F</tspan><tspan dy="4" fontSize="12">N</tspan>
                                        <tspan dy="-4"> = {fmtNum(N)} N</tspan>
                                    </text>
                                </g>
                            )}
                        </g>
                    )}

                    {/* centripetalkraften (resultanten) */}
                    {showFc && onTrack && LFC > 0.5 && (
                        <g>
                            <Arrow x1={cm.x} y1={cm.y} x2={fcTip.x} y2={fcTip.y} color={COL.fc} />
                            <text x={fcl.x} y={fcl.y} textAnchor={fcl.anchor} fontSize="16" fontWeight="700" fill={COL.fc}>
                                <tspan fontStyle="italic">F</tspan><tspan dy="4" fontSize="12">C</tspan>
                                <tspan dy="-4"> = {fmtNum(FCnow)} N</tspan>
                            </text>
                        </g>
                    )}
                    {showFc && !onTrack && (
                        <g>
                            <Arrow x1={cm.x} y1={cm.y} x2={gTip.x} y2={gTip.y} color={COL.tyngd} />
                            <circle cx={cm.x} cy={cm.y} r="2.8" fill={COL.tyngd} />
                            <text x={gl.x} y={gl.y} textAnchor={gl.anchor} fontSize="16" fontWeight="700" fill={COL.tyngd}>
                                <tspan fontStyle="italic">F</tspan><tspan dy="4" fontSize="12">G</tspan>
                                <tspan dy="-4"> = {fmtNum(FG)} N</tspan>
                            </text>
                        </g>
                    )}

                    {/* resulterande kraften F_R = F_N + F_G (vektorsumma). På banan
                        lutar den mot rörelseriktningen utom i topp- och bottenläget;
                        i luften är den = tyngdkraften. */}
                    {showFr && frLen > 0.5 && (
                        <g>
                            <Arrow x1={cm.x} y1={cm.y} x2={frTip.x} y2={frTip.y} color={COL.res} />
                            <text x={frl.x} y={frl.y} textAnchor={frl.anchor} fontSize="16" fontWeight="700" fill={COL.res}>
                                <tspan fontStyle="italic">F</tspan><tspan dy="4" fontSize="12">R</tspan>
                                <tspan dy="-4"> = {fmtNum(frMag)} N</tspan>
                            </text>
                        </g>
                    )}

                    {/* centripetalacceleration */}
                    {show.accel && onTrack && LA > 0.5 && (
                        <g>
                            <Arrow x1={aStart.x} y1={aStart.y} x2={aTip.x} y2={aTip.y} color={COL.acc} width={6} head={17} />
                            <text x={al.x} y={al.y} textAnchor={al.anchor} fontSize="15" fontWeight="700" fill={COL.acc}>
                                <tspan fontStyle="italic">a</tspan><tspan dy="4" fontSize="11">C</tspan>
                                <tspan dy="-4"> = {fmt(onTrack ? v2 / RL : 0, 1)} m/s²</tspan>
                            </text>
                        </g>
                    )}

                    {/* hastighet */}
                    {show.vel && LV > 2 && (
                        <g>
                            <Arrow x1={vStart.x} y1={vStart.y} x2={vTip.x} y2={vTip.y} color={COL.fart} width={6.5} head={18} />
                            <text x={vl.x} y={vl.y} textAnchor={vl.anchor} fontSize="16" fontWeight="700" fill={COL.fart}>
                                <tspan fontStyle="italic">v</tspan> = {fmt(vmag, 1)} m/s
                            </text>
                        </g>
                    )}
                </svg>
            );
        };

        // ════════════════════════════════════════════════════════
        //  SCEN 3 — bilbana med två kurvor, sedd ovanifrån
        //  (förslag från en besökare 2026-09-13: rak väg → kurva → rak väg,
        //  så att man ser att centripetalkraften bara behövs i kurvan)
        // ════════════════════════════════════════════════════════
        const PXB = 6;                                   // px per meter
        // Kurvornas centrum i VÄRLDSKOORDINATER (y uppåt, origo nere till
        // vänster). Banan lutar något så att den vida kurvan hamnar nere till
        // höger, under inställningsrutan, och den snäva uppe till vänster.
        const BC1 = { x: 455, y: 185 };                  // vida kurvan
        const BC2 = { x: 150, y: 325 };                  // snäva kurvan
        const W2S = (p) => ({ x: p.x, y: VBH - p.y });   // värld → SVG
        const rot2 = (p, a) => ({ x: p.x * Math.cos(a) - p.y * Math.sin(a),
                                  y: p.x * Math.sin(a) + p.y * Math.cos(a) });

        // Banan: två cirkelbågar (r1 > r2) förbundna med sina yttre tangenter —
        // en sluten bana som körs moturs: raka, snäva kurvan, raka, vida kurvan.
        // Eftersom radierna är olika lutar rakorna något och bågarna är inte
        // exakt halvcirklar (180° ± 2φ), men de är cirkelbågar med konstant
        // radie, vilket är det som räknas för fysiken.
        const buildBana = (r1m, r2m) => {
            const r1 = r1m * PXB, r2 = r2m * PXB;
            const dx = BC2.x - BC1.x, dy = BC2.y - BC1.y;
            const d = Math.hypot(dx, dy), psi = Math.atan2(dy, dx);
            const phi = Math.asin((r1 - r2) / d);
            const nU = rot2({ x: Math.sin(phi), y: Math.cos(phi) }, psi);
            const nL = rot2({ x: Math.sin(phi), y: -Math.cos(phi) }, psi);
            const T1L = { x: BC1.x + r1 * nL.x, y: BC1.y + r1 * nL.y };
            const T2U = { x: BC2.x + r2 * nU.x, y: BC2.y + r2 * nU.y };
            const Ls = d * Math.cos(phi);
            const e1 = rot2({ x: Math.cos(phi), y: Math.sin(phi) }, psi);
            const e2 = rot2({ x: -Math.cos(phi), y: Math.sin(phi) }, psi);
            const segs = [
                { type: 'line', len: Ls, P: T1L, e: e1 },
                { type: 'arc', len: r2 * (Math.PI - 2 * phi), C: BC2, r: r2, rm: r2m,
                  a0: psi + phi - Math.PI / 2, name: 'snäva', idx: 2 },
                { type: 'line', len: Ls, P: T2U, e: e2 },
                { type: 'arc', len: r1 * (Math.PI + 2 * phi), C: BC1, r: r1, rm: r1m,
                  a0: psi + Math.PI / 2 - phi, name: 'vida', idx: 1 },
            ];
            let acc = 0;
            segs.forEach((sg) => { sg.s0 = acc; acc += sg.len; });
            const Ltot = acc;
            // läge (värld, px), rörelseriktning e och kurvinfo vid båglängden s
            const at = (s) => {
                s = ((s % Ltot) + Ltot) % Ltot;
                const sg = segs.find((g) => s < g.s0 + g.len) || segs[segs.length - 1];
                const u = s - sg.s0;
                if (sg.type === 'line')
                    return { x: sg.P.x + sg.e.x * u, y: sg.P.y + sg.e.y * u, e: sg.e, inward: null, seg: sg };
                const ang = sg.a0 + u / sg.r;
                const c = Math.cos(ang), sn = Math.sin(ang);
                return { x: sg.C.x + sg.r * c, y: sg.C.y + sg.r * sn,
                         e: { x: -sn, y: c }, inward: { x: -c, y: -sn }, seg: sg };
            };
            // vägbanan som punktlistor (mitt + två kanter) i SVG-koordinater
            const mid = [], inner = [], outer = [];
            for (let s = 0; s <= Ltot + 1; s += 3) {
                const q = at(Math.min(s, Ltot));
                const n = { x: -q.e.y, y: q.e.x };           // vänsternormal (in mot banans mitt)
                const p = W2S(q), pi = W2S({ x: q.x + 20 * n.x, y: q.y + 20 * n.y });
                const po = W2S({ x: q.x - 20 * n.x, y: q.y - 20 * n.y });
                mid.push(`${p.x.toFixed(1)},${p.y.toFixed(1)}`);
                inner.push(`${pi.x.toFixed(1)},${pi.y.toFixed(1)}`);
                outer.push(`${po.x.toFixed(1)},${po.y.toFixed(1)}`);
            }
            const start = at(0), sn0 = { x: -start.e.y, y: start.e.x };
            const startLine = [W2S({ x: start.x + 20 * sn0.x, y: start.y + 20 * sn0.y }),
                               W2S({ x: start.x - 20 * sn0.x, y: start.y - 20 * sn0.y })];
            return { segs, Ltot, at, r1, r2, mid: mid.join(' '), inner: inner.join(' '), outer: outer.join(' '), startLine };
        };

        const kFB = 0.006;                                // px per N (kraftpilar, bilbanan)
        const lenFB = (F) => (F <= 1 ? 0 : Math.max(14, softLen(F * kFB, 230)));

        const BanaScene = ({ bs, geom, v, m, mu, show, forceView, kompakt }) => {
            const onTrack = bs.st === 'track';
            const q = onTrack ? geom.at(bs.s) : null;
            const P = W2S(onTrack ? q : { x: bs.x, y: bs.y });
            const ew = onTrack ? q.e : bs.hd;
            const t = { x: ew.x, y: -ew.y };                          // rörelseriktning (SVG)
            const onArc = onTrack && q.seg.type === 'arc';
            const inward = onArc ? { x: q.inward.x, y: -q.inward.y } : null;
            const rNow = onArc ? q.seg.rm : Infinity;
            const aC = onArc ? v * v / rNow : 0;
            const FC = m * aC;
            const Fmax = mu * m * G;
            const sp = onTrack ? v : bs.sp / PXB;

            const rotDeg = -Math.atan2(ew.y, ew.x) / DEG;

            // krafter: F_f inåt i kurvan (statisk friktion), bakåt vid sladd
            // (glidfriktion, bromsar bilen)
            const LF = onArc ? lenFB(FC) : (!onTrack && sp > 0.05 ? lenFB(Fmax) : 0);
            const fDir = onArc ? inward : { x: -t.x, y: -t.y };
            const fTip = { x: P.x + fDir.x * LF, y: P.y + fDir.y * LF };
            const fl0 = tipLabel(fTip, onArc ? t : fDir, 14);
            const LA = onArc ? Math.max(13, softLen(aC * 8, 170)) : 0;
            const aOff = 34;
            const aStart = { x: P.x - t.x * aOff, y: P.y - t.y * aOff };
            const aTip = onArc ? { x: aStart.x + inward.x * LA, y: aStart.y + inward.y * LA } : aStart;
            const al = onArc ? tipLabel({ x: aTip.x - t.x * 10, y: aTip.y - t.y * 10 }, inward, 14) : null;
            const LV = Math.max(0, Math.min(sp * 7, 150));
            const vStart = { x: P.x + t.x * 26, y: P.y + t.y * 26 };
            const vTip = { x: vStart.x + t.x * LV, y: vStart.y + t.y * LV };
            let vl = tipLabel(vTip, t);
            if (vl.x < 70 || vl.x > VBW - 70 || vl.y < 30 || vl.y > VBH - 30) {
                // nära kanten: etiketten läggs vinkelrätt ut vid pilens mitt i stället
                const mid = { x: (vStart.x + vTip.x) / 2, y: (vStart.y + vTip.y) / 2 };
                vl = { x: mid.x - t.y * 22, y: mid.y + t.x * 22 + 5, anchor: -t.y > 0.3 ? 'start' : (-t.y < -0.3 ? 'end' : 'middle') };
            }
            const Cs = onArc ? W2S(q.seg.C) : null;
            const rl0 = onArc ? tipLabel({ x: Cs.x + (P.x - Cs.x) * 0.5, y: Cs.y + (P.y - Cs.y) * 0.5 }, t, 10) : null;

            // etiketterna skjuts in innanför viewBoxens sidkanter
            const fTxt = `Ff = ${fmtNum(onArc ? FC : Fmax)} N`;
            const fl = fitX(fl0, fTxt, 17);
            const rl = rl0 && fitX(rl0, `r1 = ${fmt(rNow, 1)} m`, 17);
            vl = fitX(vl, `v = ${fmt(sp, 1)} m/s`, 17);
            const al2 = al && fitX(al, `aC = ${fmt(aC, 1)} m/s2`, 16);

            const showF = show.forces && forceView === 'verkliga';
            const showFc = show.forces && forceView === 'centripetal';
            const showFr = show.forces && forceView === 'resultant';

            let stateText, stateCol;
            if (!onTrack) {
                stateText = 'För lite grepp: bilen fortsätter rakt fram';
                stateCol = COL.tyngd;
            } else if (onArc) {
                stateText = `${q.seg.name === 'vida' ? 'Vida' : 'Snäva'} kurvan: friktionen ger centripetalkraften`;
                stateCol = COL.frik;
            } else {
                stateText = 'Rak väg: ingen kraft i sidled behövs';
                stateCol = 'rgba(15,22,32,0.7)';
            }
            const rSub = (sg) => (sg.idx === 1 ? '1' : '2');

            return (
                <svg viewBox={`0 0 ${VBW} ${VBH}`} preserveAspectRatio="xMidYMid meet"
                     style={{ fontFamily: "'DM Sans', sans-serif" }}>
                    <defs>
                        <linearGradient id="wallG3" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stopColor="#f7f2e8" />
                            <stop offset="100%" stopColor="#ece3d2" />
                        </linearGradient>
                        <linearGradient id="carG" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stopColor="#5b9bd1" />
                            <stop offset="100%" stopColor="#3f7cb4" />
                        </linearGradient>
                    </defs>
                    <rect x="0" y="0" width={VBW} height={VBH} fill="url(#wallG3)" />

                    {/* vägbanan */}
                    <polygon points={geom.mid} fill="none" stroke="#8f959e" strokeWidth="40" strokeLinejoin="round" />
                    <polygon points={geom.outer} fill="none" stroke="rgba(15,22,32,0.45)" strokeWidth="1.6" strokeLinejoin="round" />
                    <polygon points={geom.inner} fill="none" stroke="rgba(15,22,32,0.45)" strokeWidth="1.6" strokeLinejoin="round" />
                    <polygon points={geom.mid} fill="none" stroke="#ece5d2" strokeWidth="2.4"
                             strokeDasharray="16 14" opacity="0.85" strokeLinejoin="round" />
                    {/* startlinje */}
                    <line x1={geom.startLine[0].x} y1={geom.startLine[0].y} x2={geom.startLine[1].x} y2={geom.startLine[1].y}
                          stroke="#f3eee4" strokeWidth="5" strokeDasharray="5 5" />

                    {/* kurvornas centrum */}
                    {geom.segs.filter((sg) => sg.type === 'arc').map((sg) => {
                        const c = W2S(sg.C);
                        return <circle key={sg.idx} cx={c.x} cy={c.y} r="3.4" fill={COL.ink} />;
                    })}

                    {/* radie — bara i kurvan */}
                    {show.radius && onArc && (
                        <g>
                            <line x1={Cs.x} y1={Cs.y} x2={P.x} y2={P.y} stroke={COL.ink}
                                  strokeWidth="1.7" strokeDasharray="6 5" opacity="0.75" />
                            <text x={rl.x} y={rl.y} textAnchor={rl.anchor} fontSize="17" fontWeight="700" fill={COL.ink}>
                                <tspan fontStyle="italic">r</tspan><tspan dy="4" fontSize="13">{rSub(q.seg)}</tspan>
                                <tspan dy="-4"> = {fmt(rNow, 1)} m</tspan>
                            </text>
                        </g>
                    )}

                    {/* riktningslinje från sladdpunkten: utan kraft fortsätter bilen rakt fram */}
                    {bs.skid && (
                        <line x1={bs.skid.x} y1={bs.skid.y} x2={bs.skid.x + bs.skid.dx * 500} y2={bs.skid.y + bs.skid.dy * 500}
                              stroke="rgba(15,22,32,0.35)" strokeWidth="1.6" strokeDasharray="7 6" />
                    )}
                    {/* sladdspår + punkten där greppet släppte */}
                    {bs.trace.length > 1 && (
                        <polyline points={bs.trace.map((p) => `${p.x},${p.y}`).join(' ')} fill="none"
                                  stroke="rgba(15,22,32,0.45)" strokeWidth="6" strokeLinecap="round" strokeDasharray="3 8" />
                    )}
                    {bs.skid && (
                        <g>
                            <circle cx={bs.skid.x} cy={bs.skid.y} r="7" fill="none"
                                    stroke={COL.tyngd} strokeWidth="2" strokeDasharray="3 3" />
                            <text x={bs.skid.x + bs.skid.lx} y={bs.skid.y + bs.skid.ly} textAnchor={bs.skid.anchor}
                                  fontSize="15" fontWeight="700" fill={COL.tyngd}>Greppet släppte här</text>
                        </g>
                    )}

                    <text x={kompakt ? 410 : 290} y={kompakt ? 524 : 40} textAnchor="middle"
                          fontSize={kompakt ? 17 : 19} fontWeight="700" fill={stateCol}>
                        {stateText}
                    </text>

                    {/* bilen */}
                    <g transform={`translate(${P.x} ${P.y}) rotate(${rotDeg})`}>
                        <CarTop />
                    </g>

                    {/* friktionskraften — i kurvan in mot centrum, vid sladd bakåt */}
                    {showF && LF > 0 && (
                        <g>
                            <Arrow x1={P.x} y1={P.y} x2={fTip.x} y2={fTip.y} color={COL.frik} />
                            <text x={fl.x} y={fl.y} textAnchor={fl.anchor} fontSize="17" fontWeight="700" fill={COL.frik}>
                                <tspan fontStyle="italic">F</tspan><tspan dy="4" fontSize="13">f</tspan>
                                <tspan dy="-4"> = {fmtNum(onArc ? FC : Fmax)} N</tspan>
                            </text>
                        </g>
                    )}
                    {showFc && onArc && LF > 0 && (
                        <g>
                            <Arrow x1={P.x} y1={P.y} x2={fTip.x} y2={fTip.y} color={COL.fc} />
                            <text x={fl.x} y={fl.y} textAnchor={fl.anchor} fontSize="17" fontWeight="700" fill={COL.fc}>
                                <tspan fontStyle="italic">F</tspan><tspan dy="4" fontSize="13">C</tspan>
                                <tspan dy="-4"> = {fmtNum(FC)} N</tspan>
                            </text>
                        </g>
                    )}
                    {showFr && LF > 0 && (
                        <g>
                            <Arrow x1={P.x} y1={P.y} x2={fTip.x} y2={fTip.y} color={COL.res} />
                            <text x={fl.x} y={fl.y} textAnchor={fl.anchor} fontSize="17" fontWeight="700" fill={COL.res}>
                                <tspan fontStyle="italic">F</tspan><tspan dy="4" fontSize="13">R</tspan>
                                <tspan dy="-4"> = {fmtNum(onArc ? FC : Fmax)} N</tspan>
                            </text>
                        </g>
                    )}
                    {/* på rakan: ingen kraft — säg det vid bilen */}
                    {show.forces && onTrack && !onArc && (
                        <text x={P.x - t.y * 46} y={P.y + t.x * 46} dominantBaseline="middle"
                              textAnchor={-t.y > 0.3 ? 'start' : (-t.y < -0.3 ? 'end' : 'middle')}
                              fontSize="15" fontWeight="700" fill={forceView === 'centripetal' ? COL.fc : (forceView === 'resultant' ? COL.res : COL.frik)}>
                            <tspan fontStyle="italic">F</tspan>
                            <tspan dy="4" fontSize="11">{forceView === 'centripetal' ? 'C' : (forceView === 'resultant' ? 'R' : 'f')}</tspan>
                            <tspan dy="-4"> = 0</tspan>
                        </text>
                    )}

                    {/* centripetalacceleration */}
                    {show.accel && onArc && LA > 0 && (
                        <g>
                            <Arrow x1={aStart.x} y1={aStart.y} x2={aTip.x} y2={aTip.y} color={COL.acc} width={6} head={17} />
                            <text x={al2.x} y={al2.y} textAnchor={al2.anchor} fontSize="16" fontWeight="700" fill={COL.acc}>
                                <tspan fontStyle="italic">a</tspan><tspan dy="4" fontSize="12">C</tspan>
                                <tspan dy="-4"> = {fmt(aC, 1)} m/s²</tspan>
                            </text>
                        </g>
                    )}

                    {/* hastighet */}
                    {show.vel && LV > 2 && (
                        <g>
                            <Arrow x1={vStart.x} y1={vStart.y} x2={vTip.x} y2={vTip.y} color={COL.fart} width={6.5} head={18} />
                            <text x={vl.x} y={vl.y} textAnchor={vl.anchor} fontSize="17" fontWeight="700" fill={COL.fart}>
                                <tspan fontStyle="italic">v</tspan> = {fmt(sp, 1)} m/s
                            </text>
                        </g>
                    )}
                </svg>
            );
        };

        // ════════════════════════════════════════════════════════
        //  SCEN 4 — krön och dal, sedd från sidan
        //  Vägen är en våg av cirkelbågar och raka backar: två krön (centrum
        //  under vägen) med en dal (centrum ovanför) emellan. Bilen håller
        //  konstant fart, så på backarna verkar också en drivande eller
        //  bromsande friktionskraft längs vägen.
        // ════════════════════════════════════════════════════════
        const PXK = 9;                                   // px per meter
        const BETA = 35 * DEG;                           // backarnas lutning
        const KY0 = 110;                                 // plana vägens höjd (värld, y uppåt)

        const buildKron = (rkm, rdm) => {
            const rk = rkm * PXK, rd = rdm * PXK;
            const sb = Math.sin(BETA), cb = Math.cos(BETA);
            const arcsW = 4 * sb * (rk + rd);
            let L = (VBW - 100 - arcsW) / (4 * cb);      // backarnas längd
            L = Math.max(36, Math.min(110, L));
            const waveW = arcsW + 4 * L * cb;
            const x0 = (VBW - waveW) / 2;
            const segs = [];
            let P = { x: -30, y: KY0 }, psi = 0;
            const line = (len, flat) => {
                segs.push({ type: 'line', len, P: { ...P }, psi, flat: !!flat });
                P = { x: P.x + len * Math.cos(psi), y: P.y + len * Math.sin(psi) };
            };
            // dA > 0: dal (svänger uppåt, centrum ovanför vägen); dA < 0: krön
            const arc = (r, rm, dA, kind) => {
                const sgn = dA > 0 ? 1 : -1;
                const C = { x: P.x - sgn * r * Math.sin(psi), y: P.y + sgn * r * Math.cos(psi) };
                const a0 = Math.atan2(P.y - C.y, P.x - C.x);
                segs.push({ type: 'arc', len: r * Math.abs(dA), C, r, rm, a0, dA, psi0: psi, kind });
                psi += dA;
                P = { x: C.x + r * Math.cos(a0 + dA), y: C.y + r * Math.sin(a0 + dA) };
            };
            line(x0 + 30, true);
            arc(rd, rdm, BETA, 'dal');
            line(L);
            arc(rk, rkm, -2 * BETA, 'krön');
            line(L);
            arc(rd, rdm, 2 * BETA, 'dal');
            line(L);
            arc(rk, rkm, -2 * BETA, 'krön');
            line(L);
            arc(rd, rdm, BETA, 'dal');
            line(VBW + 30 - P.x, true);
            let acc = 0;
            segs.forEach((sg) => { sg.s0 = acc; acc += sg.len; });
            const Ltot = acc;
            const at = (s) => {
                s = Math.max(0, Math.min(Ltot, s));
                const sg = segs.find((g) => s < g.s0 + g.len) || segs[segs.length - 1];
                const u = s - sg.s0;
                if (sg.type === 'line')
                    return { x: sg.P.x + Math.cos(sg.psi) * u, y: sg.P.y + Math.sin(sg.psi) * u,
                             psi: sg.psi, inward: null, seg: sg };
                const sgn = sg.dA > 0 ? 1 : -1;
                const ang = sg.a0 + sgn * u / sg.r;
                return { x: sg.C.x + sg.r * Math.cos(ang), y: sg.C.y + sg.r * Math.sin(ang),
                         psi: sg.psi0 + sgn * u / sg.r, inward: { x: -Math.cos(ang), y: -Math.sin(ang) }, seg: sg };
            };
            // vägprofil (SVG) + höjdfunktion för landningen efter ett hopp
            const prof = [];
            const pts = [];
            for (let s = 0; s <= Ltot + 1; s += 2) {
                const q = at(Math.min(s, Ltot));
                prof.push([q.x, q.y]);
                const p = W2S(q);
                pts.push(`${p.x.toFixed(1)},${p.y.toFixed(1)}`);
            }
            const roadY = (x) => {
                if (x <= prof[0][0]) return prof[0][1];
                let lo = 0, hi = prof.length - 1;
                while (hi - lo > 1) { const mi = (lo + hi) >> 1; if (prof[mi][0] <= x) lo = mi; else hi = mi; }
                const [xa, ya] = prof[lo], [xb, yb] = prof[hi];
                return xb === xa ? ya : ya + (yb - ya) * (x - xa) / (xb - xa);
            };
            const first = W2S(at(0)), last = W2S(at(Ltot));
            const ground = `M ${first.x},${first.y} ` + pts.map((p) => 'L ' + p).join(' ') +
                           ` L ${last.x},${VBH + 5} L ${first.x},${VBH + 5} Z`;
            return { segs, Ltot, at, roadY, road: pts.join(' '), ground, rk, rd };
        };

        const kFK = 0.0065;                              // px per N (kraftpilar, krön och dal)
        const lenFK = (F) => (F <= 1 ? 0 : Math.max(12, softLen(F * kFK, 215)));

        // ur läget på vägen: normalkraft, friktion längs vägen, centripetalkraft
        const kronForces = (q, v, m) => {
            const c = Math.cos(q.psi), sn = Math.sin(q.psi);
            const sg = q.seg;
            const k = sg.type === 'arc' ? (sg.kind === 'dal' ? 1 : -1) : 0;
            const aC = k !== 0 ? v * v / sg.rm : 0;
            const N = m * (G * c + k * aC);
            const Ff = m * G * sn;                        // + = framåt (uppför), − = bakåt (nedför)
            return { N, Ff, FC: m * aC, aC, c, sn, k };
        };

        const KronScene = ({ ks, geom, v, m, show, forceView, kompakt }) => {
            const onTrack = ks.st === 'track';
            const q = onTrack ? geom.at(ks.s) : null;
            const pos = W2S(onTrack ? q : { x: ks.x, y: ks.y });
            const psi = onTrack ? q.psi : ks.rot;
            const h = { x: Math.cos(psi), y: -Math.sin(psi) };           // rörelseriktning (SVG)
            const n = { x: -Math.sin(psi), y: -Math.cos(psi) };          // vägens normal, uppåt (SVG)
            const F = onTrack ? kronForces(q, v, m) : { N: 0, Ff: 0, FC: 0, aC: 0, k: 0 };
            const onArc = onTrack && q.seg.type === 'arc';
            const FG = m * G;
            const vmag = onTrack ? v : Math.hypot(ks.vx, ks.vy) / PXK;
            const inward = onArc ? { x: q.inward.x, y: -q.inward.y } : null;

            const cm = { x: pos.x + n.x * 11, y: pos.y + n.y * 11 };      // tyngdpunkt (karossen är skalad 0,75)
            const LG = lenFK(FG), LN = lenFK(F.N), LFf = lenFK(Math.abs(F.Ff)), LFC = lenFK(F.FC);
            const gTip = { x: cm.x, y: cm.y + LG };
            const gl = { x: gTip.x + 12, y: gTip.y + 16, anchor: 'start' };
            const nTip = { x: pos.x + n.x * LN, y: pos.y + n.y * LN };
            const nlCands = [tipLabel(nTip, { x: -h.x, y: -h.y }, 14), tipLabel(nTip, h, 14)];
            const fSgn = F.Ff >= 0 ? 1 : -1;
            const fDir = { x: h.x * fSgn, y: h.y * fSgn };
            const fTip = { x: pos.x + fDir.x * LFf, y: pos.y + fDir.y * LFf };
            // etiketten strax under vägbanan, bortom bilens stötfångare — fri
            // från tyngdkraftens pil, som går rakt ned genom kontaktpunkten
            const fOff = Math.max(LFf, 28) + 8;
            const fl = { x: pos.x + fDir.x * fOff - n.x * 17, y: pos.y + fDir.y * fOff - n.y * 17 + 5,
                         anchor: fDir.x > 0 ? 'start' : 'end' };
            const fcTip = onArc ? { x: cm.x + inward.x * LFC, y: cm.y + inward.y * LFC } : cm;
            // radiella pilar (F_C, a_C) pekar ned i marken på krönet och upp i
            // luften i dalen — etiketterna läggs BORTOM spetsen i pilens riktning,
            // förskjutna åt var sin sida om den kolinjära radien
            const fcl = onArc ? { x: fcTip.x + inward.x * 18 + h.x * 8, y: fcTip.y + inward.y * 18 + 5, anchor: 'start' } : null;
            const LA = onArc ? Math.max(0, Math.min(F.aC * 2.4, 150)) : 0;
            const aOff = 36;
            const aStart = { x: pos.x - h.x * aOff + n.x * 6, y: pos.y - h.y * aOff + n.y * 6 };
            const aTip = onArc ? { x: aStart.x + inward.x * LA, y: aStart.y + inward.y * LA } : aStart;
            const al = onArc ? { x: aTip.x + inward.x * 26 - h.x * 8, y: aTip.y + inward.y * 26 + 5, anchor: 'end' } : null;
            const vel = onTrack ? h : (() => { const L = Math.hypot(ks.vx, ks.vy) || 1; return { x: ks.vx / L, y: -ks.vy / L }; })();
            const LV = Math.max(0, Math.min(vmag * 6, 140));
            const vStart = { x: cm.x + vel.x * 24 + n.x * 12, y: cm.y + vel.y * 24 + n.y * 12 };
            const vTip = { x: vStart.x + vel.x * LV, y: vStart.y + vel.y * LV };
            const vl = tipLabel(vTip, vel);
            const Cs = onArc ? W2S(q.seg.C) : null;
            // radie-etiketten intill centrum (i marken på krönet, i luften i dalen)
            const rl = onArc ? { x: Cs.x - 11, y: Cs.y + 5, anchor: 'end' } : null;

            // resulterande kraft = F_N + F_f + F_G (vektorsumma, SVG-koordinater)
            const frVec = onTrack
                ? { x: F.N * n.x + F.Ff * h.x, y: F.N * n.y + F.Ff * h.y + FG }
                : { x: 0, y: FG };
            const frMag = Math.hypot(frVec.x, frVec.y);
            const frU = frMag > 1 ? { x: frVec.x / frMag, y: frVec.y / frMag } : { x: 0, y: 1 };
            const frLen = lenFK(frMag);
            const frTip = { x: cm.x + frU.x * frLen, y: cm.y + frU.y * frLen };
            const frl0 = tipLabel(frTip, frU);

            // alla etiketter skjuts in innanför viewBoxens sidkanter
            const nl = pickX(nlCands, `FN = ${fmtNum(F.N)} N`);
            const gl2 = fitX(gl, `FG = ${fmtNum(FG)} N`);
            const fl2 = fitX(fl, `Ff = ${fmtNum(Math.abs(F.Ff))} N`);
            const fcl2 = fcl && fitX(fcl, `FC = ${fmtNum(F.FC)} N`);
            const al2 = al && fitX(al, `aC = ${fmt(F.aC, 1)} m/s2`, 15);
            const vMid = { x: (vStart.x + vTip.x) / 2, y: (vStart.y + vTip.y) / 2 };
            const vl2 = pickX([vl, { x: vMid.x - vel.y * 20, y: vMid.y + vel.x * 20 + 5,
                                     anchor: -vel.y > 0.3 ? 'start' : (-vel.y < -0.3 ? 'end' : 'middle') }],
                              `v = ${fmt(vmag, 1)} m/s`);
            const frl = fitX(frl0, `FR = ${fmtNum(frMag)} N`);
            const rl2 = rl && fitX(rl, `rk = ${fmt(onArc ? q.seg.rm : 0, 1)} m`, 17);

            const showF = show.forces && forceView === 'verkliga';
            const showFc = show.forces && forceView === 'centripetal';
            const showFr = show.forces && forceView === 'resultant';

            let stateText, stateCol;
            if (!onTrack) {
                stateText = 'Normalkraften blev 0. Bilen lättar från vägen!';
                stateCol = COL.tyngd;
            } else if (onArc && q.seg.kind === 'krön') {
                stateText = 'Krön: mindre normalkraft än på plan väg';
                stateCol = COL.norm;
            } else if (onArc) {
                stateText = 'Dal: större normalkraft än på plan väg';
                stateCol = COL.norm;
            } else if (q.seg.flat) {
                stateText = 'Plan väg: normalkraften bär bara tyngden';
                stateCol = 'rgba(15,22,32,0.7)';
            } else {
                stateText = 'Backe: friktionen håller farten konstant';
                stateCol = 'rgba(15,22,32,0.7)';
            }

            return (
                <svg viewBox={`0 0 ${VBW} ${VBH}`} preserveAspectRatio="xMidYMid meet"
                     style={{ fontFamily: "'DM Sans', sans-serif" }}>
                    <defs>
                        <linearGradient id="wallG4" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stopColor="#f7f2e8" />
                            <stop offset="100%" stopColor="#ece3d2" />
                        </linearGradient>
                        <linearGradient id="carSG" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stopColor="#5b9bd1" />
                            <stop offset="100%" stopColor="#3f7cb4" />
                        </linearGradient>
                    </defs>
                    <rect x="0" y="0" width={VBW} height={VBH} fill="url(#wallG4)" />

                    {/* marken under vägen + vägbanan */}
                    <path d={geom.ground} fill="#e3d9c3" />
                    <polyline points={geom.road} fill="none" stroke="#8f959e" strokeWidth="9" strokeLinejoin="round" />
                    <polyline points={geom.road} fill="none" stroke="rgba(15,22,32,0.55)" strokeWidth="1.6" strokeLinejoin="round" />

                    {/* kurvornas centrum */}
                    {geom.segs.filter((sg) => sg.type === 'arc').map((sg, i) => {
                        const c = W2S(sg.C);
                        return <circle key={i} cx={c.x} cy={c.y} r="3" fill={COL.ink} opacity="0.7" />;
                    })}

                    {/* radie — bara i krön och dal */}
                    {show.radius && onArc && (
                        <g>
                            <line x1={Cs.x} y1={Cs.y} x2={pos.x} y2={pos.y} stroke={COL.ink}
                                  strokeWidth="1.7" strokeDasharray="6 5" opacity="0.75" />
                            <text x={rl2.x} y={rl2.y} textAnchor={rl2.anchor} fontSize="17" fontWeight="700" fill={COL.ink}>
                                <tspan fontStyle="italic">r</tspan><tspan dy="4" fontSize="13">{q.seg.kind === 'krön' ? 'k' : 'd'}</tspan>
                                <tspan dy="-4"> = {fmt(q.seg.rm, 1)} m</tspan>
                            </text>
                        </g>
                    )}

                    {/* hoppets bana + punkten där bilen lättade */}
                    {ks.trace.length > 1 && (
                        <polyline points={ks.trace.map((p) => `${p.x},${p.y}`).join(' ')} fill="none"
                                  stroke="rgba(15,22,32,0.4)" strokeWidth="2" strokeDasharray="4 5" />
                    )}
                    {ks.detach && (
                        <g>
                            <circle cx={ks.detach.x} cy={ks.detach.y} r="7" fill="none"
                                    stroke={COL.tyngd} strokeWidth="2" strokeDasharray="3 3" />
                            <text x={ks.detach.x - 12} y={ks.detach.y + 28} textAnchor="end"
                                  fontSize="15" fontWeight="700" fill={COL.tyngd}>
                                <tspan fontStyle="italic">F</tspan><tspan dy="4" fontSize="11">N</tspan>
                                <tspan dy="-4"> = 0 här</tspan>
                            </text>
                        </g>
                    )}

                    <text x={kompakt ? 410 : 290} y={kompakt ? 524 : 38} textAnchor="middle"
                          fontSize={kompakt ? 17 : 19} fontWeight="700" fill={stateCol}>
                        {stateText}
                    </text>

                    {/* bilen (mindre än i loopen — radierna är större i förhållande) */}
                    <g transform={`translate(${pos.x} ${pos.y}) rotate(${-psi / DEG}) scale(0.75)`}>
                        <CarSide />
                    </g>

                    {/* verkliga krafter: tyngdkraft, normalkraft, friktion längs vägen */}
                    {(showF || (showFc && !onTrack)) && (
                        <g>
                            <Arrow x1={cm.x} y1={cm.y} x2={gTip.x} y2={gTip.y} color={COL.tyngd} />
                            <circle cx={cm.x} cy={cm.y} r="2.8" fill={COL.tyngd} />
                            <text x={gl2.x} y={gl2.y} textAnchor={gl2.anchor} fontSize="16" fontWeight="700" fill={COL.tyngd}>
                                <tspan fontStyle="italic">F</tspan><tspan dy="4" fontSize="12">G</tspan>
                                <tspan dy="-4"> = {fmtNum(FG)} N</tspan>
                            </text>
                        </g>
                    )}
                    {showF && onTrack && LN > 0.5 && (
                        <g>
                            <Arrow x1={pos.x} y1={pos.y} x2={nTip.x} y2={nTip.y} color={COL.norm} />
                            <text x={nl.x} y={nl.y} textAnchor={nl.anchor} fontSize="16" fontWeight="700" fill={COL.norm}>
                                <tspan fontStyle="italic">F</tspan><tspan dy="4" fontSize="12">N</tspan>
                                <tspan dy="-4"> = {fmtNum(F.N)} N</tspan>
                            </text>
                        </g>
                    )}
                    {showF && onTrack && Math.abs(F.Ff) > 1 && (
                        <g>
                            <Arrow x1={pos.x} y1={pos.y} x2={fTip.x} y2={fTip.y} color={COL.frik} />
                            <text x={fl2.x} y={fl2.y} textAnchor={fl2.anchor} fontSize="16" fontWeight="700" fill={COL.frik}>
                                <tspan fontStyle="italic">F</tspan><tspan dy="4" fontSize="12">f</tspan>
                                <tspan dy="-4"> = {fmtNum(Math.abs(F.Ff))} N</tspan>
                            </text>
                        </g>
                    )}

                    {/* centripetalkraften (resultanten i krön och dal) */}
                    {showFc && onArc && LFC > 0.5 && (
                        <g>
                            <Arrow x1={cm.x} y1={cm.y} x2={fcTip.x} y2={fcTip.y} color={COL.fc} />
                            <text x={fcl2.x} y={fcl2.y} textAnchor={fcl2.anchor} fontSize="16" fontWeight="700" fill={COL.fc}>
                                <tspan fontStyle="italic">F</tspan><tspan dy="4" fontSize="12">C</tspan>
                                <tspan dy="-4"> = {fmtNum(F.FC)} N</tspan>
                            </text>
                        </g>
                    )}
                    {showFc && onTrack && !onArc && (
                        <text x={cm.x - h.x * 46} y={cm.y - h.y * 46 - 8} textAnchor="middle"
                              fontSize="15" fontWeight="700" fill={COL.fc}>
                            <tspan fontStyle="italic">F</tspan><tspan dy="4" fontSize="11">C</tspan><tspan dy="-4"> = 0</tspan>
                        </text>
                    )}

                    {/* resulterande kraften */}
                    {showFr && frLen > 0.5 && (
                        <g>
                            <Arrow x1={cm.x} y1={cm.y} x2={frTip.x} y2={frTip.y} color={COL.res} />
                            <text x={frl.x} y={frl.y} textAnchor={frl.anchor} fontSize="16" fontWeight="700" fill={COL.res}>
                                <tspan fontStyle="italic">F</tspan><tspan dy="4" fontSize="12">R</tspan>
                                <tspan dy="-4"> = {fmtNum(frMag)} N</tspan>
                            </text>
                        </g>
                    )}
                    {showFr && onTrack && frMag <= 1 && (
                        <text x={cm.x - h.x * 46} y={cm.y - h.y * 46 - 8} textAnchor="middle"
                              fontSize="15" fontWeight="700" fill={COL.res}>
                            <tspan fontStyle="italic">F</tspan><tspan dy="4" fontSize="11">R</tspan><tspan dy="-4"> = 0</tspan>
                        </text>
                    )}

                    {/* centripetalacceleration */}
                    {show.accel && onArc && LA > 0.5 && (
                        <g>
                            <Arrow x1={aStart.x} y1={aStart.y} x2={aTip.x} y2={aTip.y} color={COL.acc} width={6} head={17} />
                            <text x={al2.x} y={al2.y} textAnchor={al2.anchor} fontSize="15" fontWeight="700" fill={COL.acc}>
                                <tspan fontStyle="italic">a</tspan><tspan dy="4" fontSize="11">C</tspan>
                                <tspan dy="-4"> = {fmt(F.aC, 1)} m/s²</tspan>
                            </text>
                        </g>
                    )}

                    {/* hastighet */}
                    {show.vel && LV > 2 && (
                        <g>
                            <Arrow x1={vStart.x} y1={vStart.y} x2={vTip.x} y2={vTip.y} color={COL.fart} width={6.5} head={18} />
                            <text x={vl2.x} y={vl2.y} textAnchor={vl2.anchor} fontSize="16" fontWeight="700" fill={COL.fart}>
                                <tspan fontStyle="italic">v</tspan> = {fmt(vmag, 1)} m/s
                            </text>
                        </g>
                    )}
                </svg>
            );
        };

        // ── Formelkort med ord-etiketter ──
        const Vbl = ({ label, children }) => (
            <div className="flex flex-col items-center" style={{ lineHeight: 1.1 }}>
                <span className="flbl">{label}</span>
                <span className="fnum">{children}</span>
                <span className="flbl" aria-hidden="true" style={{ visibility: 'hidden' }}>{label}</span>
            </div>
        );
        const Frac = ({ topLabel, top, bottomLabel, bottom }) => (
            <div className="flex flex-col items-center" style={{ lineHeight: 1.1 }}>
                <span className="flbl">{topLabel}</span>
                <span className="fnum">{top}</span>
                {/* nämnaren sträcks över kolumnens fulla bredd så att
                    bråkstrecket täcker hela täljaren */}
                <span className="fnum" style={{ alignSelf: 'stretch', textAlign: 'center',
                                                borderTop: '2px solid currentColor', paddingTop: 3, marginTop: 3 }}>{bottom}</span>
                <span className="flbl">{bottomLabel}</span>
            </div>
        );
        const FormulaCard = () => (
            <div className="formula-card glass-card rounded-xl p-4 mb-6 flex flex-wrap items-center gap-x-4 gap-y-3" style={{ color: 'var(--lab-ink)' }}>
                <Vbl label="Centripetalkraft"><em>F</em><sub>C</sub></Vbl>
                <span className="fnum">=</span>
                <Frac topLabel="Massa · fart²" top={<span><em>m</em>&thinsp;·&thinsp;<em>v</em>²</span>}
                      bottomLabel="Banradie" bottom={<em>r</em>} />
                <span className="fnum" style={{ margin: '0 14px', color: 'var(--lab-ink-muted)' }}>|</span>
                <Vbl label="Centripetalacc."><em>a</em><sub>C</sub></Vbl>
                <span className="fnum">=</span>
                <Frac topLabel="Fart²" top={<span><em>v</em>²</span>}
                      bottomLabel="Banradie" bottom={<em>r</em>} />
                <span className="fnum">=</span>
                <Vbl label="Vinkelhast.² · radie"><em>ω</em>²&thinsp;·&thinsp;<em>r</em></Vbl>
                <span className="fnum" style={{ margin: '0 14px', color: 'var(--lab-ink-muted)' }}>|</span>
                <Vbl label="Banfart"><em>v</em></Vbl>
                <span className="fnum">=</span>
                <Vbl label="Vinkelhastighet"><em>ω</em></Vbl>
                <span className="fnum">·</span>
                <Vbl label="Banradie"><em>r</em></Vbl>
            </div>
        );

        // ── Huvudapp ─────────────────────────────────────────────
        const App = () => {
            // Länkbara lägen: ?situation=loop, ?visa=krafter,hastighet,acc,radie,
            // ?kraftvy=centripetal — praktiskt för läraren som vill länka en vy.
            const [mode, setMode] = useState(() => {
                const s = new URLSearchParams(location.search).get('situation');
                return ['loop', 'bana', 'kron'].includes(s) ? s : 'cirkel';
            });
            const [running, setRunning] = useState(true);
            const [show, setShow] = useState(() => {
                const visa = (new URLSearchParams(location.search).get('visa') || '').split(',').filter(Boolean);
                if (!visa.length) return { forces: true, vel: true, accel: false, radius: false };
                return { forces: visa.includes('krafter'), vel: visa.includes('hastighet'),
                         accel: visa.includes('acc') || visa.includes('acceleration'),
                         radius: visa.includes('radie') };
            });
            const [forceView, setForceView] = useState(() => {
                const kv = new URLSearchParams(location.search).get('kraftvy');
                return kv === 'centripetal' || kv === 'resultant' ? kv : 'verkliga';
            });

            // cirkelbana
            const [v, setV] = useState(8);        // banhastighet (m/s)
            const [m, setM] = useState(1000);     // massa (kg)
            const [r, setR] = useState(12);       // banradie (m)
            const [phase, setPhase] = useState(() => {
                const f = parseFloat(new URLSearchParams(location.search).get('fas'));
                return isFinite(f) ? f : Math.PI / 2;
            });

            // loop
            const [v0, setV0] = useState(21);     // fart längst ned (m/s)
            const loopRef = useRef(null);
            const [, setTick] = useState(0);

            // bilbana (ovanifrån): två kurvor + friktionstal
            const [r1, setR1] = useState(16);     // vida kurvans radie (m)
            const [r2, setR2] = useState(8);      // snäva kurvans radie (m)
            const [mu, setMu] = useState(0.9);    // friktionstal däck–väg
            const banaGeom = React.useMemo(() => buildBana(r1, r2), [r1, r2]);
            const banaRef = useRef(null);
            const resetBana = () => {
                banaRef.current = { st: 'track', s: 0, x: 0, y: 0, hd: { x: 1, y: 0 }, sp: 0,
                                    trace: [], skid: null, failT: 0 };
            };
            if (!banaRef.current) resetBana();

            // krön och dal (från sidan)
            const [rk, setRk] = useState(12);     // krönets radie (m)
            const [rd, setRd] = useState(12);     // dalens radie (m)
            const kronGeom = React.useMemo(() => buildKron(rk, rd), [rk, rd]);
            const kronRef = useRef(null);
            const resetKron = () => {
                kronRef.current = { st: 'track', s: 0, x: 0, y: 0, vx: 0, vy: 0, rot: 0,
                                    trace: [], detach: null, failT: 0 };
            };
            if (!kronRef.current) resetKron();
            // parametrarna läses ur en ref i animationsloopen, så att ett
            // glidardrag inte startar om loopen
            const parRef = useRef({});
            parRef.current = { v, m, mu, banaGeom, kronGeom };

            const [isFullscreen, setIsFullscreen] = useState(false);
            const [togglesOpen, setTogglesOpen] = useState(true);
            const sceneWrapRef = useRef(null);
            const lastRef = useRef(null);

            const w = v / r;                       // vinkelhastighet (rad/s)
            const aC = v * v / r;
            const FC = m * aC;
            const T = 2 * Math.PI * r / v;

            const resetLoop = () => {
                loopRef.current = { st: 'track', th: 0, dir: 1, x: 0, y: 0, vx: 0, vy: 0,
                                    rot: 0, detach: null, trace: [], failT: 0, bT: 0 };
            };
            if (!loopRef.current) resetLoop();

            useEffect(() => { resetLoop(); setTick(t => t + 1); }, [v0, mode]);
            useEffect(() => { resetBana(); setTick(t => t + 1); }, [r1, r2, mode]);
            useEffect(() => { resetKron(); setTick(t => t + 1); }, [rk, rd, mode]);

            // animationsloop
            useEffect(() => {
