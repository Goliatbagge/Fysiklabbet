    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // ── Format: decimalkomma, exakt noll skrivs "0" ─────────────
        const fmt = (n, d = 2) => {
            const s = n.toFixed(d);
            if (parseFloat(s) === 0) return '0';
            return s.replace('.', ',');
        };
        const NB = ' ';

        // Färger som i teorigenomgången fy2-3.9: flödeslinjer röda, ytan blå
        const COL = {
            linje: '#c0392b',
            linjeSvag: 'rgba(192,57,43,0.22)',
            yta: '#2563c9',
            ytaFyll: 'rgba(37,99,201,0.20)',
            skuggaFyll: 'rgba(37,99,201,0.10)',
            ink: '#0f1620',
        };

        // ── Scenens geometri (logiska koordinater 640 × 500) ─────────
        const W = 640, H = 500;
        const CX = 320, CY = 258;
        const KX = 0.5, KY = 0.42;          // sned parallellprojektion: djup → upp och åt höger
        const SKALA = 230;                  // px per meter för ytans sidor
        const ASPEKT = 1.4;                 // ytans bredd/djup
        const GX = 215, GZ = 130;           // flödeslinjernas utbredning (bredd, djup)
        const YT = 165, YB = -150;          // flödeslinjernas topp och botten
        const YH = 110;                     // höjden där pilspetsarna sitter
        const YS = -128;                    // höjden där skuggan A⊥ ritas

        const P = (X, Y, Z) => ({ x: CX + X + Z * KX, y: CY - Y - Z * KY });
        // Linjeavstånd: tätheten (linjer per area) är proportionell mot B
        const avstand = (B) => 20 / Math.sqrt(B);
        // Linjerna står i ett rutnät som är vridet en aning mot ytans kanter.
        // Ett rutnät parallellt med kanterna ger rader som antingen alla går
        // genom ytan eller alla missar den, så antalet ändras i hopp: ytan
        // kunde vridas 50° utan att en enda linje försvann. Med det vridna
        // nätet följer antalet B · A⊥ inom ungefär 10 %.
        const NAT_VRID = 0.3, NAT_DU = 0.25, NAT_DV = 0.37;

        // Bygger listan av flödeslinjer och räknar dem som går genom ytan
        const byggLinjer = (B, A, alphaDeg) => {
            const s = avstand(B);
            const w = SKALA * Math.sqrt(A * ASPEKT);
            const d = SKALA * Math.sqrt(A / ASPEKT);
            const ca = Math.cos(alphaDeg * Math.PI / 180);
            const halvDjupSkugga = (d / 2) * ca;
            const linjer = [];
            let antal = 0;
            const n = Math.ceil(Math.hypot(GX, GZ) / s) + 1;
            const cr = Math.cos(NAT_VRID), sr = Math.sin(NAT_VRID);
            for (let k = -n; k <= n; k++) {
                for (let i = -n; i <= n; i++) {
                    const u = (i + NAT_DU) * s, v = (k + NAT_DV) * s;
                    const X = u * cr - v * sr, Z = u * sr + v * cr;
                    if (Math.abs(X) > GX || Math.abs(Z) > GZ) continue;
                    const genom = Math.abs(X) <= w / 2 && Math.abs(Z) < halvDjupSkugga - 0.01;
                    if (genom) antal++;
                    linjer.push({ X, Z, genom });
                }
            }
            return { linjer, antal, w, d };
        };

        // ── Scenen: canvas med flödeslinjer, yta och skugga ──────────
        const FlodesScen = ({ B, A, alpha, setAlpha, visaSkugga, visaSvaga }) => {
            const canvasRef = useRef(null);
            const drag = useRef(null);

            const rita = useCallback(() => {
                const cv = canvasRef.current;
                if (!cv) return;
                const rect = cv.getBoundingClientRect();
                if (rect.width < 2 || rect.height < 2) return;
                const dpr = window.devicePixelRatio || 1;
                const bw = Math.round(rect.width * dpr), bh = Math.round(rect.height * dpr);
                if (cv.width !== bw || cv.height !== bh) { cv.width = bw; cv.height = bh; }
                const ctx = cv.getContext('2d');
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.fillStyle = '#f3eee4';
                ctx.fillRect(0, 0, bw, bh);
                const sc = Math.min(bw / W, bh / H);
                ctx.setTransform(sc, 0, 0, sc, (bw - W * sc) / 2, (bh - H * sc) / 2);

                // Kollegieblockets rutnät över hela den synliga ytan
                const x0 = -((bw - W * sc) / 2) / sc, y0 = -((bh - H * sc) / 2) / sc;
                const x1 = x0 + bw / sc, y1 = y0 + bh / sc;
                ctx.strokeStyle = 'rgba(37,99,201,0.07)';
                ctx.lineWidth = 1;
                for (let x = Math.floor(x0 / 24) * 24; x <= x1; x += 24) {
                    ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke();
                }
                for (let y = Math.floor(y0 / 24) * 24; y <= y1; y += 24) {
                    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
                }

                const { linjer, w, d } = byggLinjer(B, A, alpha);
                const ar = alpha * Math.PI / 180;
                const sa = Math.sin(ar), ca = Math.cos(ar);

                // Ytans hörn (u längs bredden, v längs djupet), vridna α kring x-axeln
                const horn = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([u, v]) => {
                    const X = u * w / 2, vv = v * d / 2;
                    return { X, Y: vv * sa, Z: vv * ca };
                });
                const hornS = horn.map(h => P(h.X, h.Y, h.Z));
                const skugga = horn.map(h => P(h.X, YS, h.Z));

                const poly = (pts) => {
                    ctx.beginPath();
                    pts.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
                    ctx.closePath();
                };

                // 1. Skuggan A⊥: ytans projektion längs fältet
                if (visaSkugga) {
                    poly(skugga);
                    ctx.fillStyle = COL.skuggaFyll; ctx.fill();
                    ctx.setLineDash([7, 5]);
                    ctx.strokeStyle = COL.yta; ctx.lineWidth = 1.6; ctx.stroke();
                    ctx.setLineDash([]);
                }

                // Delar varje flödeslinje i den del som ligger bakom ytans plan
                // (ritas före ytan) och den som ligger framför (ritas efter).
                // Kameran ser alltid ytans ovansida, så "framför" = Y > Z · tan α.
                const delning = (Z) => {
                    if (ca < 1e-6) return Z < 0 ? YB : YT;
                    return Math.max(YB, Math.min(YT, Z * sa / ca));
                };
                const sorterade = linjer.slice().sort((a, b) => b.Z - a.Z);

                const stil = (l) => {
                    if (l.genom) { ctx.strokeStyle = COL.linje; ctx.fillStyle = COL.linje; ctx.lineWidth = 2.3; }
                    else { ctx.strokeStyle = COL.linjeSvag; ctx.fillStyle = COL.linjeSvag; ctx.lineWidth = 1.3; }
                };
                const segment = (l, ya, yb) => {
                    if (yb - ya < 0.5) return;
                    const a = P(l.X, ya, l.Z), b = P(l.X, yb, l.Z);
                    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
                };
                // Pilspetsen sitter MITT PÅ linjen (fältlinjekonventionen), på
                // samma höjd för alla linjer så att spetsarna bildar rader
                const spets = (l) => {
                    const p = P(l.X, YH, l.Z);
                    const h = l.genom ? 7 : 5.5;
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y + h * 0.8);
                    ctx.lineTo(p.x - h * 0.75, p.y - h * 0.7);
                    ctx.lineTo(p.x + h * 0.75, p.y - h * 0.7);
                    ctx.closePath(); ctx.fill();
                };
                const synlig = (l) => l.genom || visaSvaga;

                // 2. Linjedelar bakom ytans plan
                ctx.lineCap = 'butt';
                sorterade.forEach(l => {
                    if (!synlig(l)) return;
                    stil(l);
                    const ys = delning(l.Z);
                    segment(l, YB, ys);
                    if (YH <= ys) spets(l);
                });

                // 3. Ytan A
                poly(hornS);
                ctx.fillStyle = COL.ytaFyll; ctx.fill();
                ctx.strokeStyle = COL.yta; ctx.lineWidth = 2.2; ctx.lineJoin = 'round'; ctx.stroke();

                // Lodräta projektionslinjer från ytans hörn ned till skuggan
                if (visaSkugga) {
                    ctx.setLineDash([2, 4]);
                    ctx.strokeStyle = 'rgba(37,99,201,0.55)'; ctx.lineWidth = 1.2;
                    hornS.forEach((p, i) => {
                        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(skugga[i].x, skugga[i].y); ctx.stroke();
                    });
                    ctx.setLineDash([]);
                }

                // 4. Linjedelar framför ytans plan
                sorterade.forEach(l => {
                    if (!synlig(l)) return;
                    stil(l);
                    const ys = delning(l.Z);
                    segment(l, ys, YT);
                    if (YH > ys) spets(l);
                });

                // 5. Etiketter i små pappersrutor (aldrig halo)
                const etikett = (txt, sub, x, y, farg) => {
                    ctx.font = 'italic 600 22px Poppins, sans-serif';
                    const w1 = ctx.measureText(txt).width;
                    ctx.font = '600 15px Poppins, sans-serif';
                    const w2 = sub ? ctx.measureText(sub).width + 1 : 0;
                    const bw2 = w1 + w2 + 14, bh2 = 30;
                    const bx = x - bw2 / 2, by = y - bh2 / 2;
                    ctx.fillStyle = 'rgba(246,242,234,0.95)';
                    ctx.strokeStyle = 'rgba(15,22,32,0.22)'; ctx.lineWidth = 1;
                    ctx.beginPath();
                    if (ctx.roundRect) ctx.roundRect(bx, by, bw2, bh2, 7); else ctx.rect(bx, by, bw2, bh2);
                    ctx.fill(); ctx.stroke();
                    ctx.fillStyle = farg; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
                    ctx.font = 'italic 600 22px Poppins, sans-serif';
                    ctx.fillText(txt, bx + 7, by + 22);
                    if (sub) { ctx.font = '600 15px Poppins, sans-serif'; ctx.fillText(sub, bx + 7 + w1 + 1, by + 26); }
                };
                // B vid den främre vänstra flödeslinjens topp
                const pB = P(-GX, YT, -GZ);
                etikett('B', '', pB.x - 4, pB.y + 22, COL.linje);
                // A vid ytans högra främre hörn, A⊥ vid skuggans
                const pA = hornS[1];
                etikett('A', '', Math.min(W - 26, pA.x + 26), pA.y + 4, COL.yta);
                if (visaSkugga) {
                    const pS = skugga[1];
                    etikett('A', '⊥', Math.min(W - 32, pS.x + 34), pS.y + 6, COL.yta);
                }
            }, [B, A, alpha, visaSkugga, visaSvaga]);

            useEffect(() => { rita(); }, [rita]);
            useEffect(() => {
                const cv = canvasRef.current;
                if (!cv) return;
                const ro = new ResizeObserver(() => rita());
                ro.observe(cv);
                if (document.fonts && document.fonts.ready) document.fonts.ready.then(rita);
                return () => ro.disconnect();
            }, [rita]);

            // Dra uppåt/nedåt i scenen för att vrida ytan
            const ned = (e) => {
                drag.current = { y: e.clientY, a: alpha };
                e.currentTarget.setPointerCapture(e.pointerId);
            };
            const flytta = (e) => {
                if (!drag.current) return;
                const na = drag.current.a - (e.clientY - drag.current.y) * 0.45;
                setAlpha(Math.round(Math.max(0, Math.min(90, na))));
            };
            const upp = () => { drag.current = null; };

            return (
                <canvas ref={canvasRef} className="flux-canvas" width={W} height={H}
                        aria-label="Flödeslinjer genom en yta i ett homogent magnetfält"
                        onPointerDown={ned} onPointerMove={flytta}
                        onPointerUp={upp} onPointerCancel={upp} />
            );
        };

        // ── Sidovy: ytan i profil, vinkeln α och skuggan A⊥ ─────────
        const Sidovy = ({ alpha }) => {
            const ar = alpha * Math.PI / 180;
            const cx = 130, cy = 82, L = 70;
            const ex = L * Math.cos(ar), ey = L * Math.sin(ar);
            const r = 30;
            const linjeX = [];
            for (let x = 20; x <= 240; x += 20) linjeX.push(x);
            const ymark = 158;
            // α-etiketten står i luckan mellan två flödeslinjer (x = 170),
            // på bisektrisen inne i vinkelns kil
            const bx = 170, by = cy - (bx - cx) * Math.tan(ar / 2) + 5;
            return (
                <svg viewBox="0 0 260 182" width="100%" style={{ maxWidth: 340, display: 'block', margin: '0 auto' }}
                     role="img" aria-label="Ytan sedd från sidan, lutad vinkeln alfa mot det vågräta. Skuggan under har bredden som fångar flödeslinjerna.">
                    {linjeX.map(x => {
                        const genom = Math.abs(x - cx) < ex - 0.5;
                        const c = genom ? COL.linje : 'rgba(192,57,43,0.3)';
                        return (
                            <g key={x}>
                                <line x1={x} y1="8" x2={x} y2="146" stroke={c} strokeWidth={genom ? 1.8 : 1.2} />
                                <polygon points={`${x - 3.6},20 ${x + 3.6},20 ${x},28`} fill={c} />
                            </g>
                        );
                    })}
                    <line x1={cx - 90} y1={cy} x2={cx + 90} y2={cy} stroke="rgba(15,22,32,0.4)"
                          strokeWidth="1" strokeDasharray="4 3" />
                    <line x1={cx - ex} y1={cy + ey} x2={cx + ex} y2={cy - ey} stroke={COL.yta}
                          strokeWidth="4" strokeLinecap="round" />
                    {alpha >= 3 && (
                        <path d={`M ${cx + r} ${cy} A ${r} ${r} 0 0 0 ${cx + r * Math.cos(ar)} ${cy - r * Math.sin(ar)}`}
                              fill="none" stroke={COL.ink} strokeWidth="1.3" />
                    )}
                    {alpha >= 25 && (
                        <text x={bx} y={by} fontSize="14" fill={COL.ink} textAnchor="middle"
                              fontStyle="italic" fontFamily="Poppins, sans-serif">α</text>
                    )}
                    {[-1, 1].map(s => (
                        <line key={s} x1={cx + s * ex} y1={cy - s * ey} x2={cx + s * ex} y2={ymark}
                              stroke="rgba(37,99,201,0.6)" strokeWidth="1.1" strokeDasharray="2 3" />
                    ))}
                    <line x1={cx - ex} y1={ymark} x2={cx + ex} y2={ymark} stroke={COL.yta}
                          strokeWidth="3" strokeDasharray="6 4" />
                    <text x={cx} y="177" fontSize="14" fill={COL.yta} textAnchor="middle" fontFamily="Poppins, sans-serif">
                        <tspan fontStyle="italic">A</tspan><tspan fontSize="11" dy="2">⊥</tspan>
                    </text>
                </svg>
            );
        };

        // ── Formelkort ───────────────────────────────────────────────
        const Vbl = ({ label, children }) => (
            <div className="flex flex-col items-center" style={{ lineHeight: 1.1 }}>
                <span className="flbl">{label}</span>
                <span className="fnum">{children}</span>
                <span className="flbl" aria-hidden="true" style={{ visibility: 'hidden' }}>{label}</span>
            </div>
        );
        const Aperp = () => <span><em>A</em><sub style={{ fontStyle: 'normal' }}>⊥</sub></span>;

        const FormulaCard = ({ B, Ap, Phi }) => (
            <div className="formula-card glass-card rounded-xl p-4 mb-6 flex flex-wrap items-center gap-x-3 gap-y-3" style={{ color: 'var(--lab-ink)' }}>
                <Vbl label="Magnetiskt flöde"><em>Φ</em></Vbl>
                <span className="fnum">=</span>
                <Vbl label="Flödestäthet"><em>B</em></Vbl>
                <span className="fnum">·</span>
                <Vbl label="Area vinkelrät mot fältet"><Aperp /></Vbl>
                <span className="fnum">=</span>
                <span className="fnum font-mono" style={{ whiteSpace: 'nowrap' }}>{fmt(B, 2)}{NB}T</span>
                <span className="fnum">·</span>
                <span className="fnum font-mono" style={{ whiteSpace: 'nowrap' }}>{fmt(Ap, 3)}{NB}m²</span>
                <span className="fnum">=</span>
                <span className="fnum font-mono font-bold" style={{ whiteSpace: 'nowrap', color: COL.linje }}>{fmt(Phi, 3)}{NB}Wb</span>
            </div>
        );

        const Slider = ({ label, sub, value, min, max, step, unit, onChange, decimals = 2 }) => (
            <div className="mb-3">
                <div className="flex justify-between items-baseline mb-1">
                    <label className="text-sm font-bold" style={{ color: 'var(--lab-ink)' }}>{label}</label>
                    <div className="font-mono font-semibold text-sm" style={{ color: 'var(--lab-accent)', whiteSpace: 'nowrap' }}>
                        {fmt(value, decimals)}{unit === '°' ? '' : NB}<span style={{ color: 'var(--lab-ink-muted)' }}>{unit}</span>
                    </div>
                </div>
                <input type="range" min={min} max={max} step={step} value={value}
                       onChange={(e) => onChange(parseFloat(e.target.value))}
                       className="w-full cursor-pointer" />
                {sub && <div className="text-xs mt-1" style={{ color: 'var(--lab-ink-muted)' }}>{sub}</div>}
            </div>
        );

        const StSlider = ({ label, value, min, max, step, unit, onChange, decimals = 2 }) => (
            <div className="st-slider">
                <div className="st-slider-top">
                    <span>{label}</span>
                    <span className="font-mono font-semibold" style={{ whiteSpace: 'nowrap' }}>
                        {fmt(value, decimals)}{unit === '°' ? '' : NB}{unit}
                    </span>
                </div>
                <input type="range" min={min} max={max} step={step} value={value}
                       onChange={(e) => onChange(parseFloat(e.target.value))} />
            </div>
        );

        const Readout = ({ label, value, unit, color }) => (
            <div className="p-2 rounded-lg" style={{ background: 'rgba(15,22,32,0.04)', border: '1px solid var(--lab-line, rgba(15,22,32,0.14))' }}>
                <div className="flbl mb-1" style={{ textTransform: 'none', letterSpacing: 0, fontSize: 11.5 }}>{label}</div>
                <div className="font-mono font-bold" style={{ color: color || 'var(--lab-ink)', fontSize: 15, whiteSpace: 'nowrap' }}>
                    {value}{unit ? (unit === '°' ? '' : NB) : ''}<span className="font-normal text-xs" style={{ color: 'var(--lab-ink-muted)' }}>{unit}</span>
                </div>
            </div>
        );

        const FORSOK = [
            { namn: 'Starkt fält, liten yta', sub: <><em>B</em> = 1,00{NB}T och <em>A</em> = 0,20{NB}m²</>, B: 1.00, A: 0.20, alpha: 0 },
            { namn: 'Svagt fält, stor yta', sub: <><em>B</em> = 0,25{NB}T och <em>A</em> = 0,80{NB}m²</>, B: 0.25, A: 0.80, alpha: 0 },
            { namn: 'Ytan parallell med fältet', sub: 'Vrid ytan till 90°', alpha: 90 },
        ];

        // ── Huvudapp ─────────────────────────────────────────────────
        const App = () => {
            const [B, setB] = useState(0.50);
            const [A, setA] = useState(0.40);
            const [alpha, setAlpha] = useState(0);
            const [visaSkugga, setVisaSkugga] = useState(true);
            const [visaSvaga, setVisaSvaga] = useState(true);
            const [togglesOpen, setTogglesOpen] = useState(true);
            const [isFullscreen, setIsFullscreen] = useState(false);
            const wrapRef = useRef(null);

            useEffect(() => {
                const h = () => {
                    const el = document.fullscreenElement || document.webkitFullscreenElement;
                    setIsFullscreen(!!el && el === wrapRef.current);
                };
                document.addEventListener('fullscreenchange', h);
                document.addEventListener('webkitfullscreenchange', h);
                return () => {
                    document.removeEventListener('fullscreenchange', h);
                    document.removeEventListener('webkitfullscreenchange', h);
                };
            }, []);
            const toggleFullscreen = () => {
                const el = wrapRef.current;
                if (!el) return;
                if (document.fullscreenElement || document.webkitFullscreenElement) {
                    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                } else {
                    (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
                }
            };

            const ca = Math.cos(alpha * Math.PI / 180);
            const Ap = Math.round(A * ca * 1000) / 1000;       // samma avrundning som visas
            const Phi = B * Ap;
            const { antal } = byggLinjer(B, A, alpha);

            const valjForsok = (f) => {
                if (f.B !== undefined) setB(f.B);
                if (f.A !== undefined) setA(f.A);
                setAlpha(f.alpha);
            };

            const reglage = [
                { key: 'B', label: <>Flödestäthet <em>B</em></>, value: B, min: 0.05, max: 1.00, step: 0.01, unit: 'T', onChange: setB, decimals: 2,
                  sub: <>Hur tätt flödeslinjerna ligger. Dubbla <em>B</em> ger dubbelt så många linjer per kvadratmeter.</> },
                { key: 'A', label: <>Area <em>A</em></>, value: A, min: 0.05, max: 1.00, step: 0.01, unit: 'm²', onChange: setA, decimals: 2,
                  sub: 'Ytans storlek.' },
                { key: 'alpha', label: <>Vinkel <em>α</em></>, value: alpha, min: 0, max: 90, step: 1, unit: '°', onChange: setAlpha, decimals: 0,
                  sub: 'Hur mycket ytan lutar mot det vågräta. Du kan också dra i scenen.' },
            ];

            return (
                <div className="min-h-screen dark-container px-4 md:px-8 pb-12" style={{ fontFamily: "'DM Sans', sans-serif" }}>
                    <div className="max-w-6xl mx-auto pt-6">
                        <div className="breadcrumb mb-4" style={{ fontSize: 13 }}>
                            <a href="index.html">Hem</a> / <a href="katalog.html#fy2">Fysik nivå 2</a> / Magnetiskt flöde
                        </div>
                        <h1 className="text-3xl md:text-4xl font-black tracking-tight" style={{ color: 'var(--lab-ink)' }}>Magnetiskt flöde</h1>
                        <p className="mt-2 mb-5" style={{ color: 'var(--lab-ink-soft)', maxWidth: 820 }}>
                            En yta står i ett homogent magnetfält. Det magnetiska flödet är antalet flödeslinjer som passerar genom ytan. Ändra flödestätheten, ytans storlek och hur mycket den lutar, och se hur många linjer ytan fångar.
                        </p>

                        <FormulaCard B={B} Ap={Ap} Phi={Phi} />

                        <main className="flex flex-col lg:flex-row gap-6">
                            <div className="lg:w-3/5 order-1">
                                <div className="scene-wrap" data-theme="ljusPapper" ref={wrapRef}>
                                    <FlodesScen B={B} A={A} alpha={alpha} setAlpha={setAlpha}
                                                visaSkugga={visaSkugga} visaSvaga={visaSvaga} />

                                    <div className="scene-info">
                                        <span className="si-lbl">Linjer genom ytan</span>
                                        <span className="si-val">{antal}</span>
                                        <span className="si-lbl" style={{ marginTop: 4 }}>Magnetiskt flöde</span>
                                        <span className="si-val" style={{ color: COL.linje }}>{fmt(Phi, 3)}{NB}Wb</span>
                                    </div>

                                    <div className="scene-hint">Dra uppåt eller nedåt i scenen för att vrida ytan</div>

                                    {togglesOpen ? (
                                        <div className="scene-toggles">
                                            <button className="st-hide" onClick={() => setTogglesOpen(false)}
                                                    aria-label="Dölj inställningar" title="Dölj inställningar">
                                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                     strokeWidth="2.4" strokeLinecap="round"><path d="M6 6l12 12M18 6L6 18" /></svg>
                                            </button>
                                            <div className="st-title">Visa</div>
                                            <label>
                                                <input type="checkbox" checked={visaSkugga} onChange={e => setVisaSkugga(e.target.checked)} />
                                                <span className="st-swatch dash"></span>
                                                <span>Ytans skugga <em>A</em><sub>⊥</sub></span>
                                            </label>
                                            <label>
                                                <input type="checkbox" checked={visaSvaga} onChange={e => setVisaSvaga(e.target.checked)} />
                                                <span className="st-swatch" style={{ background: 'rgba(192,57,43,0.35)' }}></span>
                                                <span>Linjer som missar ytan</span>
                                            </label>
                                            {isFullscreen && (
                                                <React.Fragment>
                                                    <div className="st-title mt">Reglage</div>
                                                    <div className="st-sliders">
                                                        {reglage.map(r => <StSlider key={r.key} {...r} />)}
                                                    </div>
                                                </React.Fragment>
                                            )}
                                        </div>
                                    ) : (
                                        <button className="st-show-btn" onClick={() => setTogglesOpen(true)}
                                                aria-label="Visa inställningar" title="Visa inställningar">
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                 strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M4 7h10M18 7h2M4 17h2M10 17h10" /><circle cx="16" cy="7" r="2" /><circle cx="8" cy="17" r="2" />
                                            </svg>
                                        </button>
                                    )}

                                    <button className="fs-btn" onClick={toggleFullscreen} aria-label="Fullskärm"
                                            title={isFullscreen ? 'Lämna fullskärm' : 'Fullskärm'}>
                                        {isFullscreen ? (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M9 3v6H3" /><path d="M15 21v-6h6" /><path d="M21 9h-6V3" /><path d="M3 15h6v6" />
                                            </svg>
                                        ) : (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M3 9V3h6" /><path d="M21 9V3h-6" /><path d="M3 15v6h6" /><path d="M21 15v6h-6" />
                                            </svg>
                                        )}
                                    </button>
                                </div>
                            </div>

                            <div className="lg:w-2/5 order-2">
                                <div className="glass-card rounded-xl p-3 mb-3">
                                    {reglage.map(r => <Slider key={r.key} {...r} />)}
                                    <div className="flbl mb-2 mt-1">Färdiga försök</div>
                                    <div className="grid gap-2">
                                        {FORSOK.map(f => (
                                            <button key={f.namn} className="btn-forsok" onClick={() => valjForsok(f)}>
                                                {f.namn}<span className="bf-sub">{f.sub}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <div className="flbl mb-2">Avläsning</div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <Readout label={<>Area <em>A</em></>} value={fmt(A, 2)} unit="m²" color={COL.yta} />
                                        <Readout label={<>Vinkel <em>α</em></>} value={fmt(alpha, 0)} unit="°" />
                                        <Readout label={<>Skuggans area <em>A</em><sub>⊥</sub> = <em>A</em> · cos <em>α</em></>} value={fmt(Ap, 3)} unit="m²" color={COL.yta} />
                                        <Readout label="Linjer genom ytan" value={String(antal)} unit="" />
                                    </div>
                                    <div className="mt-2 p-2 rounded-lg text-sm" style={{ background: 'rgba(192,57,43,0.07)', color: 'var(--lab-ink-soft)' }}>
                                        <span style={{ whiteSpace: 'nowrap' }}><em>Φ</em> = <em>B</em> · <em>A</em><sub>⊥</sub></span>{' '}
                                        <span style={{ whiteSpace: 'nowrap' }}>= {fmt(B, 2)}{NB}T · {fmt(Ap, 3)}{NB}m²</span>{' '}
                                        <span style={{ whiteSpace: 'nowrap', color: COL.linje, fontWeight: 700 }}>= {fmt(Phi, 3)}{NB}Wb</span>
                                    </div>
                                </div>

                                <div className="glass-card rounded-xl p-3">
                                    <div className="flbl mb-2">Ytan sedd från sidan</div>
                                    <Sidovy alpha={alpha} />
                                    <p className="text-sm mt-2" style={{ color: 'var(--lab-ink-soft)' }}>
                                        Flödeslinjerna går lodrätt. Lutar ytan vinkeln <em>α</em> fångar den lika många linjer som sin skugga, den del av ytan som står vinkelrätt mot fältet: <span style={{ whiteSpace: 'nowrap' }}><em>A</em><sub>⊥</sub> = <em>A</em> · cos <em>α</em></span>.
                                    </p>
                                </div>
                            </div>
                        </main>

                        <div className="grid md:grid-cols-3 gap-4 mt-6">
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Flödestäthet och flöde</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Blanda inte ihop dem. Den magnetiska flödestätheten <em>B</em> anger hur tätt flödeslinjerna ligger och mäts i tesla (T). Det magnetiska flödet <em>Φ</em> anger hur många linjer som passerar genom en viss yta och mäts i weber (Wb).
                                </p>
                            </div>
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Samma flöde på två sätt</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Tänk på regn: <em>B</em> är antalet droppar per kvadratmeter och <em>Φ</em> antalet droppar som träffar en hink. En stor hink i lätt regn kan fånga lika mycket som en liten hink i skyfall. Pröva de två första försöken: båda ger <span style={{ whiteSpace: 'nowrap' }}>0,200{NB}Wb</span>.
                                </p>
                            </div>
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Vinkeln spelar roll</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Bara den del av ytan som står vinkelrätt mot fältet räknas. Står ytan vinkelrätt mot flödeslinjerna (<span style={{ whiteSpace: 'nowrap' }}><em>α</em> = 0°</span>) blir flödet störst. Ligger ytan parallellt med linjerna (<span style={{ whiteSpace: 'nowrap' }}><em>α</em> = 90°</span>) går inga linjer igenom, och flödet är noll. Att flödet ändras när ytan vrids är grunden för generatorn.
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script src="feedback.js" defer></script>
    <script src="sim-dock.js" defer></script>
    <script src="data/katalog.js"></script>
    <script src="section-nav.js"></script>
    <!-- Cloudflare Web Analytics: cookiefri besöksmätning, se CLAUDE.md. -->
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js"
            data-cf-beacon='{"token": "366677ecfe014a76b73f5bc78a489e0e"}'></script>
</body>
