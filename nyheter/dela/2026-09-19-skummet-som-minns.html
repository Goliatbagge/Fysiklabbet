    <title>Skummet som minns exakt var det trycktes ihop — och struntar i hur fort det gick — Fysiklabbet</title>
    <meta name="description" content="Pressa ihop en bit vanlig cellplast, håll den nere en stund och släpp: kraften har hunnit sjunka, och materialet hittar inte tillbaka till punkten där det vände. En skog av lodräta kolnanorör gör precis det, gång på gång, lika gärna i ultrarapid som i ett slag. Ett lag vid University of Wisconsin–Madison visar att förlusterna i skummet inte kommer från sega polymerkedjor utan från torr friktion mellan rören, och att materialet därför bär ett minne som inte bleknar.">
