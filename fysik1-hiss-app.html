                        <circle cx={ex} cy={ey} r="5.4" fill="#e8b489" stroke="#c8895c" strokeWidth="1" />
                    </g>
                );
            };
            return (
                <g>
                    {/* ben och skor */}
                    <path d="M 131 196 L 148 196 L 147 273 L 133 273 Z" fill="#3a4654" />
                    <path d="M 152 196 L 169 196 L 167 273 L 153 273 Z" fill="#3a4654" />
                    <path d="M 129 272 L 148 272 L 148 280 L 124 280 Q 124 274 129 272 Z" fill="#1f2530" />
                    <path d="M 152 272 L 171 272 Q 176 274 176 280 L 152 280 Z" fill="#1f2530" />
                    {/* armar bakom kroppen */}
                    {arm(131, -1)}
                    {arm(169, 1)}
                    {/* bålen */}
                    <path d="M 128 129 Q 128 121.5 137 121 L 163 121 Q 172 121.5 172 129 L 170 202 L 130 202 Z"
                          fill="#6f9fd0" stroke="#3f6f9f" strokeWidth="1.2" strokeLinejoin="round" />
                    <rect x="130" y="197" width="40" height="5" fill="#2b313b" />
                    {/* hals och huvud */}
                    <rect x="144.5" y="111" width="11" height="12" fill="#e8b489" />
                    <circle cx="150" cy="98" r="17" fill="#e8b489" stroke="#c8895c" strokeWidth="1.2" />
                    <path d="M 133.4 95 Q 134 79 150 79 Q 166 79 166.6 95 Q 160 86.5 150 87.5 Q 140 86.5 133.4 95 Z" fill="#5b4636" />
                    <Ansikte k={k} />
                </g>
            );
        };

        const Zoom = ({ st, m, show, dolj, broken }) => {
            const K = krafter(m, st.a);
            const kv = K.kv;
            const tipN = FOT - LG * kv;
            const gp = (st.glipa || 0) * PX_PER_M;   // glipan i bildpunkter
            const cm = CM - gp;
            const tipG = cm + LG;
            // Etiketterna till vänster om personen, två rader var: F_N-etiketten
            // flyttas upp om den skulle hamna i F_G-etikettens rader.
            const labG = tipG + 5;
            let labN = tipN + 5;
            if (labN > labG - 34) labN = labG - 34;
            const lFR = LG * K.FR / K.FG;            // samma skala som de andra krafterna
            const lA = ASKALA * K.a;
            const tipR = cm - lFR, tipA = cm - lA;
            const kansla = K.kansla;
            const van = Math.max(0, Math.min(TOPP, Math.round(st.y / VAN_H)));
            const riktn = st.v > 0.05 ? 1 : (st.v < -0.05 ? -1 : 0);
            return (
                <g>
                    <defs>
                        <clipPath id="zoomKlipp"><rect x="0" y="0" width={ZW} height={ZH} rx="10" /></clipPath>
                        <linearGradient id="vaggG" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stopColor="#ece7dd" />
                            <stop offset="100%" stopColor="#dcd5c7" />
                        </linearGradient>
                    </defs>
                    <g clipPath="url(#zoomKlipp)">
                        <rect x="0" y="0" width={ZW} height={ZH} fill="url(#vaggG)" />
                        <rect x="0" y="0" width="7" height="290" fill="#c9c2b3" />
                        <rect x={ZW - 7} y="0" width="7" height="290" fill="#c9c2b3" />
                        {/* golvet i hisskorgen */}
                        <rect x="0" y="290" width={ZW} height="26" fill="#565d68" />
                        <text x={PX} y="307" textAnchor="middle" fontSize="11" fill="#e9edf3" letterSpacing="0.06em">KRAFTPLATTA</text>
                        {/* kraftplattan och mätlådan */}
                        <rect x="100" y={FOT} width="100" height="10" rx="1.5" fill="#4b5563" stroke="#2b313b" strokeWidth="1" />
                        <rect x="100" y={FOT} width="100" height="2" fill="#8d96a3" />
                        <path d="M 200 286 Q 210 286 216 284" fill="none" stroke="#2b313b" strokeWidth="1.8" />
                        <rect x="216" y="274" width="34" height="16" rx="2" fill="#3b4656" stroke="#1f2530" strokeWidth="1" />
                        <circle cx="243" cy="279" r="1.8" fill="#4ade80" />
                        {/* våningsvisaren */}
                        <rect x="122" y="14" width="56" height="30" rx="4" fill="#1f2530" />
                        {riktn !== 0 && (
                            <polygon points={riktn > 0 ? '133,22 139,33 127,33' : '127,24 139,24 133,35'} fill="#f2a33a" />
                        )}
                        <text x="160" y="36" textAnchor="middle" fontSize="19" fontWeight="700" fill="#f2a33a"
                              fontFamily="'JetBrains Mono', monospace">{broken ? '–' : van}</text>
                        {/* skärmen som visar normalkraften (Digits) */}
                        <rect x="292" y="10" width="120" height="54" rx="6" fill="#2b313b" />
                        <rect x="298" y="16" width="108" height="42" rx="3" fill="#dfe9d8" />
                        <text x="352" y="28" textAnchor="middle" fontSize="9.5" fill="#3c4a3a" letterSpacing="0.04em">NORMALKRAFT (N)</text>
                        <text x="352" y="51" textAnchor="middle" fontSize={K.FN >= 1000 && !dolj ? 17 : 20} fontWeight="700" fill={COL.ink}
                              fontFamily="'JetBrains Mono', monospace">{dolj ? '?' : fmt(K.FN, 1)}</text>

                        <g transform={`translate(0 ${-gp})`}><Person k={dolj ? 'normal' : kansla} /></g>

                        {/* tankebubblan */}
                        <rect x="8" y="12" width="110" height="50" rx="16" fill="#fbf8f2" stroke="rgba(15,22,32,0.45)" strokeWidth="1.2" />
                        <circle cx="119" cy="66" r="4.5" fill="#fbf8f2" stroke="rgba(15,22,32,0.45)" strokeWidth="1.1" />
                        <circle cx="124.5" cy="72.5" r="2.8" fill="#fbf8f2" stroke="rgba(15,22,32,0.45)" strokeWidth="1" />
                        <text x="63" y="31" textAnchor="middle" fontSize="11.5" fill="rgba(15,22,32,0.75)">Jag känner mig</text>
                        <text x="63" y="53" textAnchor="middle" fontSize={!dolj && kv > 1.6 ? 15 : 18} fontWeight="700"
                              fill={dolj ? COL.ink : COL[kansla]}>{dolj ? '?' : (kv > 1.6 ? 'mycket tung' : KANSLA_ORD[kansla])}</text>

                        {/* krafterna på personen: samma verkningslinje, skaften intill varandra */}
                        {show.krafter && (
                            <g>
                                <Arrow x1={PX - 2.6} y1={cm} x2={PX - 2.6} y2={tipG} color={COL.tyngd} edge />
                                <circle cx={PX - 2.6} cy={cm} r="2.8" fill={COL.tyngd} stroke="rgba(15,22,32,0.55)" strokeWidth="1" />
                                <text x="100" y={labG} textAnchor="end" fontSize="15" fontWeight="700" fill={COL.tyngd}>
                                    <Sym s="F" sub="G" fs={15} />
                                </text>
                                <text x="100" y={labG + 16} textAnchor="end" fontSize="13" fontWeight="600" fill={COL.tyngd}>
                                    {fmt(K.FG, 1)} N
                                </text>
                                {!dolj && (
                                    <g>
                                        <Arrow x1={PX + 2.6} y1={FOT} x2={PX + 2.6} y2={tipN} color={COL.norm} edge />
                                        <text x="100" y={labN} textAnchor="end" fontSize="15" fontWeight="700" fill={COL.norm}>
                                            <Sym s="F" sub="N" fs={15} />
                                        </text>
                                        <text x="100" y={labN + 16} textAnchor="end" fontSize="13" fontWeight="600" fill={COL.norm}>
                                            {fmt(K.FN, 1)} N
                                        </text>
                                    </g>
                                )}
                            </g>
                        )}
                        {/* resulterande kraft (streckad) och acceleration, bredvid personen */}
                        {show.res && !dolj && (
                            <g>
                                <Arrow x1={252} y1={cm} x2={252} y2={tipR} color={COL.res} width={4} head={13} dashed />
                                {Math.abs(lFR) >= 1 && <circle cx="252" cy={cm} r="2" fill={COL.res} />}
                                <text x="252" y={Math.abs(lFR) < 1 ? cm + 20 : (lFR > 0 ? tipR - 8 : tipR + 18)} textAnchor="middle"
                                      fontSize="13.5" fontWeight="700" fill={COL.res}>
                                    <Sym s="F" sub="R" fs={13.5} /> = {fmt(K.FR, 1)} N
                                </text>
                            </g>
                        )}
                        {show.acc && !dolj && (
                            <g>
                                <Arrow x1={362} y1={cm} x2={362} y2={tipA} color={COL.acc} width={4} head={13} />
                                {Math.abs(lA) >= 1 && <circle cx="362" cy={cm} r="2" fill={COL.acc} />}
                                <text x="362" y={Math.abs(lA) < 1 ? cm + 20 : (lA > 0 ? tipA - 8 : tipA + 18)} textAnchor="middle"
                                      fontSize="13.5" fontWeight="700" fill={COL.acc}>
                                    <tspan fontStyle="italic">a</tspan> = {fmt(K.a, 2)} m/s²
                                </text>
                            </g>
                        )}
                    </g>
                    <rect x="0" y="0" width={ZW} height={ZH} rx="10" fill="none" stroke="rgba(15,22,32,0.55)" strokeWidth="1.5" />
                </g>
            );
        };

        // ── Upplevd tyngd: skala från tyngdlös till dubbel tyngd ──
        const Matare = ({ x, y, w, m, a, dolj }) => {
            const K = krafter(m, a);
            const X = (r) => x + w * Math.max(0, Math.min(2, r)) / 2;
            const kg = K.FN / g;
            return (
                <g>
                    <text x={x} y={y + 11} fontSize="11" fontWeight="600" letterSpacing="0.06em" fill="rgba(15,22,32,0.6)">UPPLEVD TYNGD</text>
                    <text x={x} y={y + 33} fontSize="22" fontWeight="700" fill={dolj ? COL.ink : COL[K.kansla]}>
                        {dolj ? '?' : (K.kv > 1.6 ? 'mycket tung' : KANSLA_ORD[K.kansla])}
                    </text>
                    <rect x={x} y={y + 52} width={w / 2} height="10" fill={COL.latt} opacity="0.22" />
                    <rect x={x + w / 2} y={y + 52} width={w / 2} height="10" fill={COL.tung} opacity="0.22" />
                    <rect x={x} y={y + 52} width={w} height="10" fill="none" stroke="rgba(15,22,32,0.45)" strokeWidth="1" />
                    <line x1={X(1)} y1={y + 48} x2={X(1)} y2={y + 66} stroke={COL.ink} strokeWidth="1.6" />
                    {!dolj && (
                        <polygon points={`${X(K.kv)},${y + 51} ${X(K.kv) - 6},${y + 41} ${X(K.kv) + 6},${y + 41}`}
                                 fill={COL[K.kansla]} stroke="rgba(15,22,32,0.4)" strokeWidth="1" />
                    )}
                    <text x={x} y={y + 78} fontSize="11.5" fill="rgba(15,22,32,0.7)">0</text>
                    <text x={X(1)} y={y + 78} textAnchor="middle" fontSize="11.5" fill="rgba(15,22,32,0.7)"><Sym s="F" sub="G" fs={11.5} /></text>
                    <text x={x + w} y={y + 78} textAnchor="end" fontSize="11.5" fill="rgba(15,22,32,0.7)">2 · <Sym s="F" sub="G" fs={11.5} /></text>
                    <text x={x} y={y + 100} fontSize="13" fill="rgba(15,22,32,0.82)">
                        En personvåg skulle visa {dolj ? '?' : fmt(kg, 0)} kg
                    </text>
                </g>
            );
        };

        // ── Grafen: kraftplattans mätning ─────────────────────────
        const niceStep = (span, maxTicks) => {
            const raw = span / maxTicks;
            const p = Math.pow(10, Math.floor(Math.log10(raw)));
            for (const f of [1, 2, 2.5, 5, 10]) if (f * p >= raw) return f * p;
            return 10 * p;
        };
        const Graf = ({ x, y, w, h, hist, mode, tNow, aMax, vMax, tGrans }) => {
            const px0 = x + 54, px1 = x + w - 16, py0 = y + 36, py1 = y + h - 30;
            const t0 = Math.max(0, tNow - FONSTER + 3), t1 = t0 + FONSTER;
            const syns = hist.filter(p => p.t >= t0 - 0.1 && p.t <= Math.min(tNow, tGrans) + 1e-6);
            let ymin, ymax;
            if (mode === 'fn') {
                let mx = 0, fg = 0;
                for (const p of syns) { if (p.fn > mx) mx = p.fn; if (p.fg > fg) fg = p.fg; }
                if (!fg && hist.length) fg = hist[hist.length - 1].fg;
                let mn = Infinity;
                for (const p of syns) if (p.fn < mn) mn = p.fn;
                if (!isFinite(mn)) mn = fg;
                // Som i mätprogrammet: skalan hugger runt mätvärdena, men
                // når ned till 0 så snart plattan visar nära noll.
                ymin = Math.max(0, Math.min(0.7 * fg, mn * 0.9)); ymax = Math.max(1.3 * fg, mx * 1.08, 100);
            } else {
                let mx = 0;
                for (const p of syns) mx = Math.max(mx, Math.abs(mode === 'a' ? p.a : p.v));
                const bas = mode === 'a' ? aMax * 1.3 : vMax * 1.25;
                const A = Math.max(bas, mx * 1.1);
                ymin = -A; ymax = A;
            }
            const steg = niceStep(ymax - ymin, 5);
            ymax = Math.ceil(ymax / steg - 1e-9) * steg;
            if (ymin < 0) ymin = -ymax;
            else ymin = Math.floor(ymin / steg + 1e-9) * steg;
            const X = (t) => px0 + (px1 - px0) * (t - t0) / (t1 - t0);
            const Y = (v) => py1 - (py1 - py0) * (v - ymin) / (ymax - ymin);
            const val = (p) => mode === 'fn' ? p.fn : (mode === 'a' ? p.a : p.v);
            const ref = (p) => mode === 'fn' ? p.fg : 0;
            const farg = mode === 'fn' ? COL.norm : (mode === 'a' ? COL.acc : COL.fart);
            // Ytan mellan kurvan och referenslinjen (F_G, eller a = 0):
            // ovanför = tung, nedanför = lätt
            let dTung = '', dLatt = '';
            if (mode !== 'v') {
                for (let i = 1; i < syns.length; i++) {
                    const A = syns[i - 1], B = syns[i];
                    const dA = val(A) - ref(A), dB = val(B) - ref(B);
                    const tol = mode === 'fn' ? 0.02 * (ref(B) || 1) : 0.196;
                    const medel = (dA + dB) / 2;
                    if (Math.abs(medel) < tol) continue;
                    const q = `M${X(A.t).toFixed(1)},${Y(val(A)).toFixed(1)}L${X(B.t).toFixed(1)},${Y(val(B)).toFixed(1)}L${X(B.t).toFixed(1)},${Y(ref(B)).toFixed(1)}L${X(A.t).toFixed(1)},${Y(ref(A)).toFixed(1)}Z`;
                    if (medel > 0) dTung += q; else dLatt += q;
                }
            }
            const kurva = syns.map(p => X(p.t).toFixed(1) + ',' + Y(val(p)).toFixed(1)).join(' ');
            const refLinje = mode === 'fn' ? syns.map(p => X(p.t).toFixed(1) + ',' + Y(p.fg).toFixed(1)).join(' ') : '';
            const yTicks = [];
            for (let v = ymin; v <= ymax + 1e-9; v += steg) yTicks.push(Math.round(v * 1000) / 1000);
            const xTicks = [];
            for (let t = Math.ceil(t0 / 5) * 5; t <= t1 + 1e-9; t += 5) xTicks.push(t);
            const sist = syns[syns.length - 1];
            const titel = mode === 'fn' ? ['Normalkraft ', 'F', 'N', ' (N), mätt med kraftplattan']
                : mode === 'a' ? ['Acceleration ', 'a', null, ' (m/s²), positiv riktning uppåt']
                : ['Hastighet ', 'v', null, ' (m/s), positiv riktning uppåt'];
            const fgSist = mode === 'fn' && sist ? sist.fg : null;
            return (
                <g>
                    <rect x={x} y={y} width={w} height={h} rx="10" fill="#faf7f0" stroke="rgba(15,22,32,0.4)" strokeWidth="1.2" />
                    <text x={x + 14} y={y + 21} fontSize="13.5" fontWeight="700" fill={COL.ink}>
                        {titel[0]}{titel[2] ? <Sym s={titel[1]} sub={titel[2]} fs={13.5} /> : <tspan fontStyle="italic">{titel[1]}</tspan>}
                        <tspan fontWeight="400" fill="rgba(15,22,32,0.7)">{titel[3]}</tspan>
                    </text>
                    {mode !== 'v' && (
                        <g fontSize="12" fill="rgba(15,22,32,0.75)">
                            <rect x={x + w - 108} y={y + 11} width="12" height="10" fill={COL.tung} opacity="0.3" />
                            <text x={x + w - 92} y={y + 20}>tung</text>
                            <rect x={x + w - 58} y={y + 11} width="12" height="10" fill={COL.latt} opacity="0.3" />
                            <text x={x + w - 42} y={y + 20}>lätt</text>
                        </g>
                    )}
                    {/* rutnät och skalor */}
                    {yTicks.map(v => (
                        <g key={'y' + v}>
                            <line x1={px0} y1={Y(v)} x2={px1} y2={Y(v)} stroke="rgba(37,99,201,0.13)" strokeWidth="1" />
                            <text x={px0 - 6} y={Y(v) + 4} textAnchor="end" fontSize="11" fill="rgba(15,22,32,0.7)">{fmt(v, steg < 1 ? 1 : 0)}</text>
                        </g>
                    ))}
                    {xTicks.map(t => (
                        <g key={'x' + t}>
                            <line x1={X(t)} y1={py0} x2={X(t)} y2={py1} stroke="rgba(37,99,201,0.13)" strokeWidth="1" />
                            {X(t) < px1 - 34 && <text x={X(t)} y={py1 + 15} textAnchor="middle" fontSize="11" fill="rgba(15,22,32,0.7)">{fmt(t, 0)}</text>}
                        </g>
                    ))}
                    <text x={px1} y={py1 + 15} textAnchor="end" fontSize="12" fill="rgba(15,22,32,0.8)"><tspan fontStyle="italic">t</tspan> (s)</text>
                    <line x1={px0} y1={py0 - 4} x2={px0} y2={py1} stroke="rgba(15,22,32,0.6)" strokeWidth="1.2" />
                    <line x1={px0} y1={Y(Math.max(0, ymin))} x2={px1} y2={Y(Math.max(0, ymin))} stroke="rgba(15,22,32,0.6)" strokeWidth="1.2" />
                    {dTung && <path d={dTung} fill={COL.tung} opacity="0.22" />}
                    {dLatt && <path d={dLatt} fill={COL.latt} opacity="0.22" />}
                    {mode === 'fn' && syns.length > 1 && (
                        <polyline points={refLinje} fill="none" stroke={COL.tyngd} strokeWidth="1.8" strokeDasharray="7 5" />
                    )}
                    {fgSist != null && (
                        <text x={px1 - 4} y={Y(fgSist) - 6} textAnchor="end" fontSize="13" fontWeight="700" fill={COL.tyngd}>
                            <Sym s="F" sub="G" fs={13} />
                        </text>
                    )}
                    {syns.length > 1 && <polyline points={kurva} fill="none" stroke={farg} strokeWidth="2.4" strokeLinejoin="round" />}
                    {sist && tNow <= tGrans + 1e-6 && (
                        <g>
                            <line x1={X(tNow)} y1={py0} x2={X(tNow)} y2={py1} stroke="rgba(15,22,32,0.35)" strokeWidth="1" strokeDasharray="3 3" />
                            <circle cx={X(sist.t)} cy={Y(val(sist))} r="4" fill={farg} stroke="rgba(15,22,32,0.4)" strokeWidth="1" />
                        </g>
                    )}
                </g>
            );
        };

        // ── Gissa-panelen (ritas över grafen medan frågan står öppen) ──
        const ALT = [
            { id: 'tung', rad1: ['Större än ', 'F', 'G'], rad2: 'tung' },
            { id: 'normal', rad1: ['Lika med ', 'F', 'G'], rad2: 'normal' },
            { id: 'latt', rad1: ['Mindre än ', 'F', 'G'], rad2: 'lätt' },
            { id: 'tyngdlos', rad1: ['Noll', null, null], rad2: 'tyngdlös' },
        ];
        const GissaPanel = ({ x, y, w, h, fraga, svara, fortsatt, poang, smal }) => {
            const info = FAS[fraga.seg.ph];
            const ratt = info.svar;
            const besvarad = fraga.svar != null;
            const titel = fraga.titel;
            const knW = smal ? (w - 40) / 2 : (w - 50) / 4;
            const knH = 46;
            const knappar = ALT.map((o, i) => {
                const kx = smal ? x + 14 + (i % 2) * (knW + 12) : x + 14 + i * (knW + 7.3);
                const ky = smal ? y + 74 + Math.floor(i / 2) * (knH + 8) : y + 78;
                let fill = '#f3eee4', stroke = 'rgba(15,22,32,0.4)', tc = COL.ink;
                if (besvarad) {
                    if (o.id === ratt) { fill = 'rgba(21,128,61,0.14)'; stroke = COL.norm; }
                    else if (o.id === fraga.svar) { fill = 'rgba(200,50,74,0.10)'; stroke = COL.res; }
                    else { tc = 'rgba(15,22,32,0.45)'; }
                }
                return (
                    <g key={o.id} style={{ cursor: besvarad ? 'default' : 'pointer' }}
                       onClick={() => { if (!besvarad) svara(o.id); }}>
                        <rect x={kx} y={ky} width={knW} height={knH} rx="8" fill={fill} stroke={stroke} strokeWidth="1.5" />
                        <text x={kx + knW / 2} y={ky + 20} textAnchor="middle" fontSize="14" fontWeight="700" fill={tc}>
                            {o.rad1[0]}{o.rad1[1] && <Sym s={o.rad1[1]} sub={o.rad1[2]} fs={14} />}
                        </text>
                        <text x={kx + knW / 2} y={ky + 37} textAnchor="middle" fontSize="12" fill={tc}>{o.rad2}</text>
                    </g>
                );
            });
            const fy = smal ? y + 74 + 2 * (knH + 8) + 12 : y + 78 + knH + 20;
            const maxT = Math.floor((w - 28) / 7.3);
            const rader = besvarad ? radbryt(FORKLARING[fraga.seg.ph].replace(/F_N/g, 'FN').replace(/F_G/g, 'FG').replace(/F_R/g, 'FR'), maxT) : [];
            // index i förklaringen skrivs ut som tspan
            const radJSX = (r) => r.split(/(FN|FG|FR)/).map((del, i) =>
                /^F[NGR]$/.test(del) ? <Sym key={i} s="F" sub={del[1]} fs={13} /> : <tspan key={i}>{del}</tspan>);
            return (
                <g>
                    <rect x={x} y={y} width={w} height={h} rx="10" fill="#fbf8f2" stroke="rgba(15,22,32,0.55)" strokeWidth="1.5" />
                    <text x={x + 14} y={y + 21} fontSize="11" fontWeight="600" letterSpacing="0.06em" fill="rgba(15,22,32,0.6)">
                        {besvarad ? 'FACIT' : 'FÖRUTSÄG INNAN DU SER MÄTNINGEN'}
                    </text>
                    <text x={x + w - 14} y={y + 21} textAnchor="end" fontSize="12" fill="rgba(15,22,32,0.7)">
                        {poang.n > 0 ? `${poang.ratt} av ${poang.n} rätt` : ''}
                    </text>
                    <text x={x + 14} y={y + 44} fontSize="16" fontWeight="700" fill={COL.ink}>{titel}.</text>
                    <text x={x + 14} y={y + 63} fontSize="13.5" fill="rgba(15,22,32,0.82)">
                        Hur stor är normalkraften <Sym s="F" sub="N" fs={13.5} /> jämfört med tyngdkraften <Sym s="F" sub="G" fs={13.5} />?
                    </text>
                    {knappar}
                    {!besvarad && radbryt('Ledtråd: titta på hur hastigheten ändras, inte på åt vilket håll hissen åker. Accelerationen och den resulterande kraften pekar åt samma håll som förändringen.', maxT).map((r, i) => (
                        <text key={i} x={x + 14} y={fy + 4 + i * 17} fontSize="13" fill="rgba(15,22,32,0.6)">{r}</text>
                    ))}
                    {besvarad && (
                        <g>
                            <text x={x + 14} y={fy + 4} fontSize="14" fontWeight="700"
                                  fill={fraga.svar === ratt ? COL.norm : COL.res}>
                                {fraga.svar === ratt ? 'Rätt svar.' : 'Inte riktigt. Rätt svar är ' + KANSLA_ORD[ratt] + '.'}
                            </text>
                            {rader.map((r, i) => (
                                <text key={i} x={x + 14} y={fy + 26 + i * 17} fontSize="13" fill="rgba(15,22,32,0.85)">{radJSX(r)}</text>
                            ))}
                            <g style={{ cursor: 'pointer' }} onClick={fortsatt}>
                                <rect x={x + w - 112} y={fy - 15} width="98" height="28" rx="8" fill={COL.ink} />
                                <text x={x + w - 63} y={fy + 4} textAnchor="middle" fontSize="13.5" fontWeight="600" fill="#f3eee4">Fortsätt</text>
                            </g>
                        </g>
                    )}
                </g>
            );
        };

        // ── Layouter: bred skärm och telefon ─────────────────────
        const LAYOUT = {
            bred: { W: 900, H: 640, hus: { x: 14, y: 78, s: 1 }, zoom: { x: 215, y: 72, s: 1 },
                    banner: { x: 425, y: 34 }, matare: { x: 652, y: 270, w: 226 },
                    graf: { x: 215, y: 398, w: 671, h: 230 } },
            smal: { W: 520, H: 830, hus: { x: 6, y: 72, s: 0.6 }, zoom: { x: 124, y: 72, s: 392 / 420 },
                    banner: { x: 292, y: 30 }, matare: { x: 12, y: 404, w: 496 },
                    graf: { x: 6, y: 528, w: 508, h: 294 } },
            smalFs: { W: 520, H: 892, hus: { x: 6, y: 72, s: 0.6 }, zoom: { x: 124, y: 72, s: 392 / 420 },
                    banner: { x: 292, y: 30 }, matare: { x: 12, y: 404, w: 496 }, knapprad: { y: 526 },
                    graf: { x: 6, y: 592, w: 508, h: 294 } },
        };

        const Scen = ({ L, smal, st, m, show, dolj, tl, tNow, hist, grafMode, aMax, vMax, fraga, svara, fortsatt, poang, knappar }) => {
            const broken = tl.brottT != null && tNow >= tl.brottT;
            let cwH = H_TOPP - st.y;
            if (broken) {
                const yb = sampla(tl, tl.brottT).y;
                const tt = tNow - tl.brottT;
                cwH = Math.max(-0.4, (H_TOPP - yb) - g * tt * tt / 2);
            }
            let titel = FAS[st.ph].titel;
            if (st.ph === 'vila') {
                if (broken) titel = 'Hissen har fastnat mellan våningarna';
                else if (st.y < 0.05) titel = 'Hissen står stilla längst ner';
                else if (st.y > H_TOPP - 0.05) titel = 'Hissen står stilla högst upp';
                else titel = 'Hissen står stilla på våning ' + Math.round(st.y / VAN_H);
            }
            const K = krafter(m, st.a);
            const under = dolj ? 'Positiv riktning är uppåt'
                : K.a > 0.004 ? 'Accelerationen är riktad uppåt'
                : K.a < -0.004 ? 'Accelerationen är riktad nedåt'
                : 'Ingen acceleration: hastigheten ändras inte';
            // zoomlinjer från korgen i huset till den inzoomade bilden
            const hs = L.hus.s, carX = L.hus.x + 96 * hs;
            const carT = L.hus.y + (BY(st.y) - 40) * hs, carB = L.hus.y + BY(st.y) * hs;
            const tGrans = fraga && !fraga.svar ? fraga.seg.t0 : Infinity;
            return (
                <svg viewBox={`0 0 ${L.W} ${L.H}`} preserveAspectRatio="xMidYMid meet"
                     style={{ fontFamily: "'Poppins', system-ui, sans-serif" }}>
                    <defs>
                        <linearGradient id="paperG" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stopColor="#f7f2e8" />
                            <stop offset="100%" stopColor="#ece3d2" />
                        </linearGradient>
                        <pattern id="rutG" width="24" height="24" patternUnits="userSpaceOnUse">
                            <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(37,99,201,0.09)" strokeWidth="1" />
                        </pattern>
                    </defs>
                    <rect x="0" y="0" width={L.W} height={L.H} fill="url(#paperG)" />
                    <rect x="0" y="0" width={L.W} height={L.H} fill="url(#rutG)" />

                    <text x={L.banner.x} y={L.banner.y} textAnchor="middle" fontSize={smal ? 17 : 19} fontWeight="700" fill={COL.ink}>{titel}</text>
                    <text x={L.banner.x} y={L.banner.y + 20} textAnchor="middle" fontSize={smal ? 12.5 : 13.5} fill="rgba(15,22,32,0.75)">{under}</text>

                    <line x1={carX} y1={carT} x2={L.zoom.x} y2={L.zoom.y} stroke="rgba(15,22,32,0.3)" strokeWidth="1" strokeDasharray="4 4" />
                    <line x1={carX} y1={carB} x2={L.zoom.x} y2={L.zoom.y + ZH * L.zoom.s} stroke="rgba(15,22,32,0.3)" strokeWidth="1" strokeDasharray="4 4" />

                    <g transform={`translate(${L.hus.x} ${L.hus.y}) scale(${hs})`}>
                        <Huset y={st.y} v={st.v} ph={st.ph} trasig={broken} cwH={cwH} visaV={show.fart} glipa={st.glipa}
                               knappar={knappar && !L.knapprad ? knappar : null} />
                    </g>
                    <g transform={`translate(${L.zoom.x} ${L.zoom.y}) scale(${L.zoom.s})`}>
                        <Zoom st={st} m={m} show={show} dolj={dolj} broken={broken} />
                    </g>
                    <Matare x={L.matare.x} y={L.matare.y} w={L.matare.w} m={m} a={st.a} dolj={dolj} />
                    {knappar && L.knapprad && (
                        <g>
                            <text x={12} y={L.knapprad.y + 4} fontSize="11" fontWeight="600" letterSpacing="0.06em"
                                  fill="rgba(15,22,32,0.6)">ÅK TILL VÅNING</text>
                            {[...Array(TOPP + 1)].map((_, k) => (
                                <VKnapp key={k} x={12 + 22 + k * 56.5} y={L.knapprad.y + 34} r={21} fs={18} k={k} knappar={knappar} />
                            ))}
                        </g>
                    )}
                    {fraga ? (
                        <GissaPanel x={L.graf.x} y={L.graf.y} w={L.graf.w} h={L.graf.h} fraga={fraga} svara={svara}
                                    fortsatt={fortsatt} poang={poang} smal={smal} />
                    ) : (
                        <Graf x={L.graf.x} y={L.graf.y} w={L.graf.w} h={L.graf.h} hist={hist} mode={grafMode}
                              tNow={tNow} aMax={aMax} vMax={vMax} tGrans={tGrans} />
                    )}
                </svg>
            );
        };

        // ── Formelkort med ord-etiketter ──
        const Vbl = ({ label, children }) => (
            <div className="flex flex-col items-center" style={{ lineHeight: 1.1 }}>
                <span className="flbl">{label}</span>
                <span className="fnum">{children}</span>
                <span className="flbl" aria-hidden="true" style={{ visibility: 'hidden' }}>{label}</span>
            </div>
        );
        const Frac = ({ topLabel, top, bottomLabel, bottom }) => (
            <div className="flex flex-col items-center" style={{ lineHeight: 1.1 }}>
                <span className="flbl">{topLabel}</span>
                <span className="fnum">{top}</span>
                <span className="fnum" style={{ alignSelf: 'stretch', textAlign: 'center',
                                                borderTop: '2px solid currentColor', paddingTop: 3, marginTop: 3 }}>{bottom}</span>
                <span className="flbl">{bottomLabel}</span>
            </div>
        );
        const FormulaCard = () => (
            <div className="formula-card glass-card rounded-xl p-4 mb-6 flex flex-wrap items-center gap-x-4 gap-y-3" style={{ color: 'var(--lab-ink)' }}>
                <Vbl label="Resulterande kraft"><em>F</em><sub>R</sub></Vbl>
                <span className="fnum">=</span>
                <Vbl label="Normalkraft"><em>F</em><sub>N</sub></Vbl>
                <span className="fnum">−</span>
                <Vbl label="Tyngdkraft"><em>F</em><sub>G</sub></Vbl>
                <span className="fnum" style={{ margin: '0 12px', color: 'var(--lab-ink-muted)' }}>|</span>
                <Vbl label="Resulterande kraft"><em>F</em><sub>R</sub></Vbl>
                <span className="fnum">=</span>
                <Vbl label="Massa"><em>m</em></Vbl>
                <span className="fnum">·</span>
                <Vbl label="Acceleration"><em>a</em></Vbl>
                <span className="fnum">⟺</span>
                <Vbl label="Acceleration"><em>a</em></Vbl>
                <span className="fnum">=</span>
                <Frac topLabel="Resulterande kraft" top={<span><em>F</em><sub>R</sub></span>}
                      bottomLabel="Massa" bottom={<em>m</em>} />
                <span className="text-sm" style={{ color: 'var(--lab-ink-muted)', marginLeft: 8 }}>positiv riktning uppåt</span>
            </div>
        );

        const NumInput = ({ value, min, max, onCommit, d = 1, unit }) => {
            const [txt, setTxt] = useState(() => fmt(value, d));
            const [editing, setEditing] = useState(false);
            useEffect(() => { if (!editing) setTxt(fmt(value, d)); }, [value, editing]);
            const commit = (raw) => {
                const norm = raw.replace(/\s/g, '').replace(',', '.').replace('−', '-').trim();
                if (norm === '' || norm === '.') return;
                let n = parseFloat(norm);
                if (!isFinite(n)) return;
                n = Math.max(min, Math.min(max, n));
                onCommit(n);
            };
            return (
                <span className="num-wrap">
                    <input className="num-in" type="text" inputMode="decimal" value={txt}
                           style={{ color: 'var(--lab-accent, #c8324a)' }} aria-label="Skriv in värde"
                           onFocus={() => setEditing(true)}
                           onChange={(e) => { setTxt(e.target.value); commit(e.target.value); }}
                           onBlur={() => { setEditing(false); setTxt(fmt(value, d)); }}
                           onKeyDown={(e) => { if (e.key === 'Enter') e.currentTarget.blur(); }} />
                    {unit && <span className="num-unit">{unit}</span>}
                </span>
            );
        };
        const Slider = ({ label, value, min, max, step, onChange, children }) => (
            <div className="flex items-center gap-2 mb-2">
                <span className="text-xs flex-shrink-0" style={{ minWidth: 112, color: 'var(--lab-ink-soft)' }}
                      dangerouslySetInnerHTML={{ __html: label }} />
                <input type="range" min={min} max={max} step={step} value={value}
                       onChange={(e) => onChange(parseFloat(e.target.value))} className="flex-1 cursor-pointer" />
                {children}
            </div>
        );
        const StSlider = ({ label, value, min, max, step, onChange, children }) => (
            <div className="st-slider">
                <div className="st-slider-top">
                    <span dangerouslySetInnerHTML={{ __html: label }} />
                    {children}
                </div>
                <input type="range" min={min} max={max} step={step} value={value}
                       onChange={(e) => onChange(parseFloat(e.target.value))} />
            </div>
        );

        // ── Huvudapp ─────────────────────────────────────────────
        const App = () => {
            const [m, setM] = useState(70);
            const [aMax, setAMax] = useState(1.5);
            const [vMax, setVMax] = useState(2.5);
            const [tempo, setTempo] = useState(1);
            const [paused, setPaused] = useState(false);
            const [show, setShow] = useState({ krafter: true, res: true, acc: true, fart: true });
            const [grafMode, setGrafMode] = useState('fn');
            const [gissa, setGissa] = useState(false);
            const [fraga, setFraga] = useState(null);
            const [poang, setPoang] = useState({ ratt: 0, n: 0 });
            const [lage, setLage] = useState(null);
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [togglesOpen, setTogglesOpen] = useState(true);
            const [smal, setSmal] = useState(() => window.innerWidth <= 600);
            const [, setTick] = useState(0);
            const sceneWrapRef = useRef(null);
            const tlRef = useRef(null);
            const tRef = useRef(0);
            const histRef = useRef([]);
            const lastRef = useRef(null);
            const mRef = useRef(m); mRef.current = m;
            const tempoRef = useRef(tempo); tempoRef.current = tempo;
            const gissaRef = useRef(gissa); gissaRef.current = gissa;
            if (!tlRef.current) { tlRef.current = nyTL(0); }

            useEffect(() => {
                const on = () => setSmal(window.innerWidth <= 600);
                window.addEventListener('resize', on);
                return () => window.removeEventListener('resize', on);
            }, []);

            const mata = (tl, fran, till) => {
                const h = histRef.current;
                let t = h.length ? h[h.length - 1].t + HIST_DT : fran;
                const mm = mRef.current;
                while (t <= till + 1e-9) {
                    const s = personen(tl, t);
                    h.push({ t, a: s.a, v: s.v, fn: Math.max(0, mm * (g + s.a)), fg: mm * g });
                    t += HIST_DT;
                }
                while (h.length && h[0].t < till - FONSTER - 5) h.shift();
            };

            // animationsloop
            useEffect(() => {
                if (paused) { lastRef.current = null; return; }
                let raf;
                const step = (ts) => {
                    if (lastRef.current == null) lastRef.current = ts;
                    const dtR = Math.min((ts - lastRef.current) / 1000, 0.05);
                    lastRef.current = ts;
                    const tl = tlRef.current;
                    const tGam = tRef.current;
                    let tNy = tGam + dtR * tempoRef.current;
                    let stopp = null;
                    if (gissaRef.current) {
                        for (const sg of tl.segs) {
                            if (sg.ask != null && !sg.klar && sg.ask > tGam - 1e-9 && sg.ask <= tNy) { stopp = sg; break; }
                        }
                    }
                    if (stopp) tNy = stopp.ask;
                    for (const sg of tl.segs) if (sg.ask != null && sg.ask <= tNy) sg.klar = true;
                    mata(tl, tGam, tNy);
                    tRef.current = tNy;
                    if (stopp) {
                        const s = sampla(tl, tNy);
                        let titel = FAS[stopp.ph].titel;
                        if (stopp.ph === 'vila') titel = s.y > H_TOPP - 0.05 ? 'Hissen står stilla högst upp'
                            : s.y < 0.05 ? 'Hissen står stilla längst ner' : 'Hissen har stannat';
                        setFraga({ seg: stopp, svar: null, titel });
                        setPaused(true);
                        setTick(t => t + 1);
                        return;
                    }
                    setTick(t => t + 1);
                    raf = requestAnimationFrame(step);
                };
                raf = requestAnimationFrame(step);
                return () => cancelAnimationFrame(raf);
            }, [paused]);

            // fullskärm
            useEffect(() => {
                const handler = () => {
                    const fs = document.fullscreenElement === sceneWrapRef.current ||
                        document.webkitFullscreenElement === sceneWrapRef.current;
                    setIsFullscreen(fs);
                };
                document.addEventListener('fullscreenchange', handler);
                document.addEventListener('webkitfullscreenchange', handler);
                return () => {
                    document.removeEventListener('fullscreenchange', handler);
                    document.removeEventListener('webkitfullscreenchange', handler);
                };
            }, []);
            const toggleFullscreen = () => {
                const el = sceneWrapRef.current;
                if (!el) return;
                if (document.fullscreenElement || document.webkitFullscreenElement)
                    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
            };

            // ── Åtgärder ──
            const startaTL = (tl, tStart = 0) => {
                tlRef.current = tl;
                histRef.current = [];
                tRef.current = 0;
                mata(tl, 0, tStart);
                tRef.current = tStart;
                for (const sg of tl.segs) if (sg.ask != null && sg.ask < tStart - 1e-9) sg.klar = true;
                setFraga(null);
            };
            const borjaOm = () => {
                startaTL(nyTL(0));
                setLage(null);
                setPaused(false);
            };
            const aka = (van) => {
                const tl = tlRef.current;
                if (tl.trasig) return;
                const slut = tSlut(tl);
                if (tRef.current > slut) laggVila(tl, tRef.current - slut + DT);
                laggResa(tl, van * VAN_H, aMax, vMax);
                setLage(null);
                if (fraga) setFraga(null);
                setPaused(false);
            };
            const helaLabben = () => { startaTL(labbTL(aMax, vMax)); setLage(null); setPaused(false); };
            const linanBrister = () => { startaTL(brottTL()); setLage(null); setPaused(false); };
            const valjLage = (L) => {
                const tl = L.prog === 'labb' ? labbTL(aMax, vMax) : brottTL();
                startaTL(tl, L.hitta(tl));
                setLage(L.id);
                setPaused(true);
            };
            const svara = (val) => {
                setFraga(f => f ? { ...f, svar: val } : f);
                setPoang(p => ({ ratt: p.ratt + (val === FAS[fraga.seg.ph].svar ? 1 : 0), n: p.n + 1 }));
            };
            const fortsatt = () => { setFraga(null); setPaused(false); };
            const spela = () => {
                if (fraga) { setFraga(null); setPaused(false); return; }
                setPaused(p => !p);
            };
            const tShow = (k) => setShow(sh => ({ ...sh, [k]: !sh[k] }));

            const tl = tlRef.current;
            const tNow = tRef.current;
            const st = personen(tl, tNow);
            const dolj = !!(fraga && !fraga.svar);
            const K = krafter(m, st.a);
            const vanNu = Math.round(st.y / VAN_H);
            const ledig = tNow >= tSlut(tl) - 1e-9;
            const malVan = new Set(tl.mal.filter(x => x.t > tNow).map(x => x.van));
            const harVan = ledig && Math.abs(st.y - vanNu * VAN_H) < 0.02 ? vanNu : null;
            const L = smal ? (isFullscreen ? LAYOUT.smalFs : LAYOUT.smal) : LAYOUT.bred;
            // Våningsknapparna ligger i scenen i helskärm (husets våningsnummer
            // på bred skärm, en knapprad på telefon), i sidopanelen annars.
            const knappar = isFullscreen ? { aka, lit: malVan, har: harVan, trasig: tl.trasig } : null;
            const primaryLabel = fraga ? 'Fortsätt' : (paused ? 'Fortsätt' : 'Pausa');
            const lageInfo = LAGEN.find(x => x.id === lage);

            const reglage = (Sl) => (
                <React.Fragment>
                    <Sl label="Personens massa (<em>m</em>)" value={m} min={20} max={130} step={1} onChange={setM}>
                        <NumInput value={m} min={1} max={500} d={0} unit="kg" onCommit={(x) => setM(Math.round(x))} />
                    </Sl>
                    <Sl label="Största acceleration" value={aMax} min={0.5} max={3} step={0.1} onChange={setAMax}>
                        <NumInput value={aMax} min={0.3} max={5} d={1} unit="m/s²" onCommit={setAMax} />
                    </Sl>
                    <Sl label="Toppfart" value={vMax} min={1} max={6} step={0.1} onChange={setVMax}>
                        <NumInput value={vMax} min={0.5} max={10} d={1} unit="m/s" onCommit={setVMax} />
                    </Sl>
                    <Sl label="Tempo" value={tempo} min={0.25} max={1.5} step={0.05} onChange={setTempo}>
                        <span className="num-unit" style={{ minWidth: 60, textAlign: 'right' }}>{fmt(tempo, 2)} ×</span>
                    </Sl>
                </React.Fragment>
            );

            const hisspanel = (cls) => (
                <div className={'hisspanel ' + cls} role="group" aria-label="Våningsknappar">
                    {[...Array(TOPP + 1)].map((_, i) => TOPP - i).map(v => (
                        <button key={v} className={'vknapp' + (malVan.has(v) ? ' lit' : '') + (harVan === v ? ' har' : '')}
                                disabled={tl.trasig} onClick={() => aka(v)} aria-label={'Åk till våning ' + v}>{v}</button>
                    ))}
                </div>
            );

            const sceneToggles = () => {
                if (!togglesOpen) return (
                    <button className="st-show-btn" onClick={() => setTogglesOpen(true)}
                            aria-label="Visa inställningar" title="Visa inställningar" aria-expanded="false">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             strokeWidth="2" strokeLinecap="round" aria-hidden="true">
                            <line x1="4" y1="8" x2="20" y2="8" />
                            <circle cx="14.5" cy="8" r="2.7" fill="currentColor" stroke="none" />
                            <line x1="4" y1="16" x2="20" y2="16" />
                            <circle cx="9.5" cy="16" r="2.7" fill="currentColor" stroke="none" />
                        </svg>
                    </button>
                );
                return (
                    <div className="scene-toggles">
                        <button className="st-hide" onClick={() => setTogglesOpen(false)}
                                aria-label="Dölj inställningar" title="Dölj inställningar" aria-expanded="true">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 strokeWidth="2.4" strokeLinecap="round" aria-hidden="true">
                                <path d="M6 6l12 12M18 6L6 18" />
                            </svg>
                        </button>
                        <div className="st-title">Visa</div>
                        <label><input type="checkbox" checked={show.krafter} onChange={() => tShow('krafter')} />
                            <span className="st-swatch" style={{ background: `linear-gradient(90deg, ${COL.norm} 50%, ${COL.tyngd} 50%)` }}></span>
                            <span><em>F</em><sub>N</sub> och <em>F</em><sub>G</sub></span></label>
                        <label><input type="checkbox" checked={show.res} onChange={() => tShow('res')} />
                            <span className="st-swatch dash"></span>
                            <span>Resultant <em>F</em><sub>R</sub></span></label>
                        <label><input type="checkbox" checked={show.acc} onChange={() => tShow('acc')} />
                            <span className="st-swatch" style={{ background: COL.acc }}></span>
                            <span>Acceleration <em>a</em></span></label>
                        <label><input type="checkbox" checked={show.fart} onChange={() => tShow('fart')} />
                            <span className="st-swatch" style={{ background: COL.fart }}></span>
                            <span>Hastighet <em>v</em></span></label>
                        <div className="st-title mt">Graf</div>
                        <div className="st-row">
                            <label><input type="radio" name="graf" checked={grafMode === 'fn'} onChange={() => setGrafMode('fn')} /><span><em>F</em><sub>N</sub></span></label>
                            <label><input type="radio" name="graf" checked={grafMode === 'a'} onChange={() => setGrafMode('a')} /><span><em>a</em></span></label>
                            <label><input type="radio" name="graf" checked={grafMode === 'v'} onChange={() => setGrafMode('v')} /><span><em>v</em></span></label>
                        </div>
                        <label style={{ marginTop: 6 }}><input type="checkbox" checked={gissa} onChange={() => setGissa(x => !x)} />
                            <span>Gissa först</span></label>
                        {/* Våningsknappar, försök, glidare och styrknappar BARA i
                            fullskärm. I normalläget bor de i sidopanelen. */}
                        {isFullscreen && (
                            <React.Fragment>
                                <div className="st-title mt">Färdiga försök</div>
                                <div className="st-presets">
                                    <button className="btn-toggle" onClick={helaLabben}>Hela labben</button>
                                    <button className="btn-toggle" onClick={linanBrister}>Linan brister</button>
                                </div>
                                <div className="st-title mt">Labbens nio lägen</div>
                                <div className="st-presets">
                                    {LAGEN.map(x => (
                                        <button key={x.id} className={'btn-toggle' + (lage === x.id ? ' active' : '')}
                                                onClick={() => valjLage(x)} title={x.namn}>{x.id}</button>
                                    ))}
                                </div>
                                <div className="st-title mt">Reglage</div>
                                <div className="st-sliders">{reglage(StSlider)}</div>
                                <div className="st-actions">
                                    <button className="btn-toggle" onClick={spela}>{primaryLabel}</button>
                                    <button className="btn-toggle" onClick={borjaOm}>Börja om</button>
                                </div>
                            </React.Fragment>
                        )}
                    </div>
                );
            };

            const Avl = ({ val, lbl, col }) => (
                <div>
                    <div style={{ color: col || 'var(--lab-ink)', fontWeight: 700, fontSize: 15 }}>{val}</div>
                    <div className="text-xs" style={{ color: 'var(--lab-ink-muted)' }} dangerouslySetInnerHTML={{ __html: lbl }} />
                </div>
            );
            const Fr = ({ t, n }) => <span className="cfrac"><span>{t}</span><span>{n}</span></span>;
            const rikt = (x) => x > 0 ? 'uppåt' : (x < 0 ? 'nedåt' : '');

            return (
                <div className="min-h-screen dark-container px-4 md:px-8 pb-12" style={{ fontFamily: "'DM Sans', sans-serif" }}>
                    <div className="max-w-7xl mx-auto pt-6">
                        <div className="breadcrumb mb-4" style={{ fontSize: 13 }}>
                            <a href="index.html">Hem</a> / <a href="katalog.html#fy1">Fysik nivå 1</a> / Krafter i hissen
                        </div>
                        <h1 className="text-3xl md:text-4xl font-black tracking-tight" style={{ color: 'var(--lab-ink)' }}>Krafter i hissen</h1>
                        <p className="mt-2 mb-5" style={{ color: 'var(--lab-ink-soft)', maxWidth: 860 }}>
                            En person står på en kraftplatta i en hiss, precis som i laborationen. Två krafter verkar på personen:
                            <strong> tyngdkraften</strong> <em>F</em><sub>G</sub> nedåt och <strong>normalkraften</strong> <em>F</em><sub>N</sub> från
                            plattan uppåt. Det är normalkraften plattan mäter, och det är den du känner som din tyngd. Tryck på en
                            våningsknapp och följ krafterna, den resulterande kraften och accelerationen genom hela färden. Slå på
                            Gissa först om du vill förutsäga vad plattan visar innan du får se det.
                        </p>

                        <FormulaCard />

                        <main className="flex flex-col lg:flex-row gap-6">
                            {/* Scen */}
                            <div className="lg:w-2/3 order-1">
                                <div className={"scene-wrap" + (isFullscreen ? " is-fs" : "")} data-theme="ljusPapper" ref={sceneWrapRef}>
                                    <Scen L={L} smal={smal} st={st} m={m} show={show} dolj={dolj} tl={tl} tNow={tNow}
                                          hist={histRef.current} grafMode={grafMode} aMax={aMax} vMax={vMax}
                                          fraga={fraga} svara={svara} fortsatt={fortsatt} poang={poang} knappar={knappar} />
                                    {sceneToggles()}
                                    <button className="fs-btn" onClick={toggleFullscreen} aria-label="Fullskärm"
                                            title={isFullscreen ? 'Lämna fullskärm' : 'Fullskärm'}>
                                        {isFullscreen ? (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M9 3v6H3" /><path d="M15 21v-6h6" /><path d="M21 9h-6V3" /><path d="M3 15h6v6" />
                                            </svg>
                                        ) : (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M3 9V3h6" /><path d="M21 9V3h-6" /><path d="M3 15v6h6" /><path d="M21 15v6h-6" />
                                            </svg>
                                        )}
                                    </button>
                                </div>
                            </div>

                            {/* Kontroller */}
                            <div className="lg:w-1/3 order-2">
                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <div className="flbl mb-2">Åk till våning</div>
                                    <div className="flex gap-4 items-center">
                                        {hisspanel('')}
                                        <div className="flex flex-col gap-2 flex-1">
                                            <button className="btn-toggle" onClick={spela}>{primaryLabel}</button>
                                            <button className="btn-toggle" onClick={borjaOm}>Börja om</button>
                                            <p className="text-xs" style={{ color: 'var(--lab-ink-muted)' }}>
                                                {tl.trasig ? 'Hissen är ur funktion efter att linan gått av. Tryck Börja om.'
                                                    : 'Trycker du på flera knappar åker hissen till våningarna i tur och ordning.'}
                                            </p>
                                        </div>
                                    </div>
                                </div>

                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <div className="flbl mb-2">Färdiga försök</div>
                                    <div className="flex gap-2 flex-wrap mb-3">
                                        <button className="btn-toggle btn-small" onClick={helaLabben}>Hela labben: upp och ner</button>
                                        <button className="btn-toggle btn-small" onClick={linanBrister}>Linan brister (teoretiskt)</button>
                                    </div>
                                    <div className="flbl mb-2">Labbens nio lägen</div>
                                    <div className="lage-grid">
                                        {LAGEN.map(x => (
                                            <button key={x.id} className={'btn-toggle' + (lage === x.id ? ' active' : '')}
                                                    onClick={() => valjLage(x)}>{x.namn}</button>
                                        ))}
                                    </div>
                                    <p className="text-xs mt-2" style={{ color: 'var(--lab-ink-muted)' }}>
                                        {lageInfo ? LAGE_TEXT[lageInfo.id] + ' Tryck Fortsätt för att köra vidare.'
                                            : 'Samma nio lägen som i laborationen. Ett klick fryser bilden i just det läget, med mätningen fram till dess i grafen.'}
                                    </p>
                                </div>

                                {/* Newtons andra lag med de aktuella värdena */}
                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <div className="flbl mb-3">Newtons andra lag just nu</div>
                                    {dolj ? (
                                        <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                            Svara på frågan i scenen först, så visas uträkningen.
                                        </p>
                                    ) : (
                                        <div>
                                            <div className="calc-row">
                                                <span className="nowrap"><em>F</em><sub>G</sub> = <em>m</em> · <em>g</em></span>
                                                <span className="nowrap">= {fmt(m, 0)} kg · 9,82 N/kg</span>
                                                <span className="nowrap" style={{ color: COL.tyngd, fontWeight: 700 }}>= {fmt(K.FG, 1)} N</span>
                                            </div>
                                            <div className="calc-row">
                                                <span className="nowrap"><em>F</em><sub>R</sub> = <em>F</em><sub>N</sub> − <em>F</em><sub>G</sub></span>
                                                <span className="nowrap">= {fmt(K.FN, 1)} N − {fmt(K.FG, 1)} N</span>
                                                <span className="nowrap" style={{ color: COL.res, fontWeight: 700 }}>= {fmt(K.FR, 1)} N</span>
                                            </div>
                                            <div className="calc-row">
                                                <span className="nowrap"><em>a</em> = <Fr t={<span><em>F</em><sub>R</sub></span>} n={<em>m</em>} /></span>
                                                <span className="nowrap">= <Fr t={fmt(K.FR, 1) + ' N'} n={fmt(m, 0) + ' kg'} /></span>
                                                <span className="nowrap" style={{ color: COL.acc, fontWeight: 700 }}>= {fmt(K.a, 2)} m/s²</span>
                                            </div>
                                            <p className="text-sm mt-3" style={{ color: 'var(--lab-ink-soft)' }}>
                                                {Math.abs(K.FR) < 0.05
                                                    ? <span>Den resulterande kraften är noll, så personen har ingen acceleration. <em>F</em><sub>N</sub> är lika stor som <em>F</em><sub>G</sub>.</span>
                                                    : <span>Den resulterande kraften och accelerationen är riktade <strong>{rikt(K.FR)}</strong>. Normalkraften är {K.FN > K.FG ? 'större' : 'mindre'} än tyngdkraften, så personen känner sig <strong style={{ color: COL[K.kansla] }}>{KANSLA_ORD[K.kansla]}</strong>.</span>}
                                            </p>
                                        </div>
                                    )}
                                    <div className="grid grid-cols-3 gap-2 text-center mt-3 pt-3" style={{ borderTop: '1px solid var(--lab-line, rgba(15,22,32,0.14))' }}>
                                        <Avl val={fmt(st.v, 2) + ' m/s'} lbl="hastighet <em>v</em>" col={COL.fart} />
                                        <Avl val={fmt(st.y, 1) + ' m'} lbl="höjd över bottenvåningen" />
                                        <Avl val={gissa ? `${poang.ratt} av ${poang.n}` : '–'} lbl="rätta gissningar" />
                                    </div>
                                </div>

                                <div className="glass-card rounded-xl p-3">
                                    <div className="flbl mb-2">Reglage</div>
                                    {reglage(Slider)}
                                    <p className="text-xs mt-1" style={{ color: 'var(--lab-ink-muted)' }}>
                                        En vanlig hiss accelererar med ungefär 1 m/s² och har en toppfart på 1 till 2,5 m/s.
                                        Ändrad acceleration och toppfart gäller från nästa resa.
                                    </p>
                                </div>
                            </div>
                        </main>

                        {/* Pedagogiska sektioner */}
                        <div className="grid md:grid-cols-3 gap-4 mt-6">
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Det är normalkraften du känner</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Tyngdkraften <em>F</em><sub>G</sub> = <em>m</em> · <em>g</em> är lika stor under hela resan. Det som
                                    ändras är hur hårt golvet trycker upp mot dina fötter, alltså normalkraften <em>F</em><sub>N</sub>.
                                    Den kraften känner du i fötterna och knäna, och den är det en våg eller en kraftplatta mäter.
                                    Därför känns du tung när <em>F</em><sub>N</sub> är större än <em>F</em><sub>G</sub> och lätt när den är mindre.
                                </p>
                            </div>
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Accelerationen avgör, inte rörelsen</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Med positiv riktning uppåt ger Newtons andra lag <em>F</em><sub>N</sub> − <em>F</em><sub>G</sub> = <em>m</em> · <em>a</em>.
                                    Om hissen åker uppåt eller nedåt spelar ingen roll, bara åt vilket håll hastigheten ändras. En hiss som
                                    startar uppåt och en hiss som bromsar in på väg ner har båda accelerationen riktad uppåt, och i båda
                                    känner du dig tung. Med konstant fart är <em>a</em> = 0 och allt känns som vanligt.
                                </p>
                            </div>
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Fritt fall: tyngdlös men inte viktlös</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Om linan går av faller hissen och du med accelerationen <em>g</em> nedåt. Då räcker tyngdkraften
                                    ensam för att ge dig den accelerationen, och plattan behöver inte trycka alls: <em>F</em><sub>N</sub> = 0. Minsta knuff räcker för att du ska lyfta från golvet och sväva i hissen.
                                    Tyngdkraften är precis lika stor som förut, men du känner den inte. Samma sak gäller astronauterna i
                                    rymdstationen, som faller fritt runt jorden hela tiden. En riktig hiss har en fångapparat som griper
                                    tag i skenorna och bromsar.
                                </p>
                            </div>
                        </div>

                        <details className="glass-card rounded-xl p-4 mt-4">
                            <summary className="accordion-head" style={{ color: 'var(--lab-ink)' }}>
                                <span>Vanliga missuppfattningar</span><span style={{ color: 'var(--lab-ink-muted)' }}>▾</span>
                            </summary>
                            <ul className="mt-3 space-y-2 text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                <li><strong>”När hissen åker uppåt känner man sig tung.”</strong> Bara medan den ökar farten. När den åker
                                    uppåt med konstant fart är normalkraften lika stor som tyngdkraften, och när den bromsar in på väg
                                    upp känner man sig lätt.</li>
                                <li><strong>”Tyngdkraften ändras när hissen accelererar.”</strong> Nej, <em>F</em><sub>G</sub> = <em>m</em> · <em>g</em> är
                                    densamma hela tiden. Det är normalkraften som ändras, och det är den plattan visar.</li>
                                <li><strong>”Bromsar hissen är accelerationen negativ.”</strong> Det beror på åt vilket håll den åker. Bromsar
                                    den på väg ner går hastigheten från ett negativt värde mot noll, den ökar alltså, och accelerationen
                                    är positiv. Jämför med exemplet om hissen i genomgången Accelerationens riktning.</li>
                                <li><strong>”I fritt fall finns ingen tyngdkraft.”</strong> Tyngdkraften finns kvar och är lika stor. Det är
                                    normalkraften som försvinner, och därför känns det som om man saknar tyngd.</li>
                            </ul>
                        </details>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script src="feedback.js" defer></script>
    <script src="sim-dock.js" defer></script>
    <script src="data/katalog.js"></script>
    <script src="section-nav.js"></script>
    <!-- Cloudflare Web Analytics: cookiefri besöksmätning, se CLAUDE.md. -->
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js"
            data-cf-beacon='{"token": "366677ecfe014a76b73f5bc78a489e0e"}'></script>
</body>
</html>
