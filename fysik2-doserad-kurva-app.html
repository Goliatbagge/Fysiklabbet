            const sceneToggles = () => {
                if (!togglesOpen) return (
                    <button className="st-show-btn" onClick={() => setTogglesOpen(true)}
                            aria-label="Visa inställningar" title="Visa inställningar" aria-expanded="false">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             strokeWidth="2" strokeLinecap="round" aria-hidden="true">
                            <line x1="4" y1="8" x2="20" y2="8" />
                            <circle cx="14.5" cy="8" r="2.7" fill="currentColor" stroke="none" />
                            <line x1="4" y1="16" x2="20" y2="16" />
                            <circle cx="9.5" cy="16" r="2.7" fill="currentColor" stroke="none" />
                        </svg>
                    </button>
                );
                return (
                    <div className="scene-toggles">
                        <button className="st-hide" onClick={() => setTogglesOpen(false)}
                                aria-label="Dölj inställningar" title="Dölj inställningar" aria-expanded="true">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 strokeWidth="2.4" strokeLinecap="round" aria-hidden="true">
                                <path d="M6 6l12 12M18 6L6 18" />
                            </svg>
                        </button>
                        <div className="st-title">Visa</div>
                        <label><input type="checkbox" checked={show.krafter} onChange={() => tShow('krafter')} />
                            <span className="st-swatch" style={{ background: `linear-gradient(90deg, ${COL.tyngd} 33%, ${COL.norm} 33% 66%, ${COL.frik} 66%)` }}></span>
                            <span>Krafterna på bilen</span></label>
                        <label><input type="checkbox" checked={show.fc} onChange={() => tShow('fc')} />
                            <span className="st-swatch" style={{ background: `repeating-linear-gradient(90deg, ${COL.fc} 0 4px, transparent 4px 6px)` }}></span>
                            <span>Centripetalkraften <em>F</em><sub>C</sub></span></label>
                        <label><input type="checkbox" checked={show.fart} onChange={() => tShow('fart')} />
                            <span className="st-swatch" style={{ background: COL.fart }}></span><span>Hastigheten <em>v</em></span></label>
                        <label><input type="checkbox" checked={show.radie} onChange={() => tShow('radie')} />
                            <span className="st-swatch" style={{ background: `repeating-linear-gradient(90deg, ${COL.ink} 0 4px, transparent 4px 6px)` }}></span>
                            <span>Radien <em>r</em></span></label>
                        <div className="st-title mt">Scen</div>
                        <label><input type="checkbox" checked={slow} onChange={() => setSlow(s => !s)} /><span>Ultrarapid</span></label>
                        {isFullscreen && (
                            <React.Fragment>
                                <div className="st-title mt">Reglage</div>
                                <div className="st-sliders">{reglageFS}</div>
                                <div className="st-actions">
                                    <button className="btn-toggle" onClick={() => setRunning(x => !x)}>{running ? 'Pausa' : 'Fortsätt'}</button>
                                    <button className="btn-toggle" onClick={friktionsfri}>Kör i friktionsfri fart</button>
                                </div>
                            </React.Fragment>
                        )}
                    </div>
                );
            };

            return (
                <div className="min-h-screen dark-container px-4 md:px-8 pb-12" style={{ fontFamily: "'DM Sans', sans-serif" }}>
                    <div className="max-w-6xl mx-auto pt-6">
                        <div className="breadcrumb mb-4" style={{ fontSize: 13 }}>
                            <a href="index.html">Hem</a> / <a href="katalog.html#fy2">Fysik nivå 2</a> / Doserad kurva
                        </div>
                        <h1 className="text-3xl md:text-4xl font-black tracking-tight" style={{ color: 'var(--lab-ink)' }}>Doserad kurva</h1>
                        <p className="mt-2 mb-5" style={{ color: 'var(--lab-ink-soft)', maxWidth: 860 }}>
                            En bil som kör runt en kurva behöver en kraft in mot kurvans centrum. På en plan väg måste
                            friktionen mellan däcken och vägen ge hela den kraften. I en doserad kurva lutar vägbanan in
                            mot centrum, och då hjälper normalkraften till. Ändra farten, lutningen, radien och underlaget,
                            och se när friktionen pekar nedför vägbanan, när den pekar uppför och när den inte behövs alls.
                            Räcker inte greppet glider bilen utåt eller inåt.
                        </p>

                        <FormulaCard />

                        <main className="flex flex-col lg:flex-row gap-6">
                            <div className="lg:w-2/3 order-1">
                                <div className="scene-wrap" data-theme="ljusPapper" ref={sceneWrapRef}>
                                    <BanaScene wrapRef={sceneWrapRef} />
                                    <div className="scene-info" style={ut.av ? { pointerEvents: 'auto' } : undefined}>
                                        <div className="si-status" style={{ color: statusFarg }}>{status}</div>
                                        {ut.av !== 0 && (
                                            <div className="si-rad" style={{ marginTop: 3 }}>
                                                {ut.av === 1 ? 'Farten är för hög för greppet. ' : 'Farten är för låg för greppet. '}
                                                Ändra något reglage, eller
                                                <button className="btn-toggle" style={{ display: 'block', marginTop: 6, padding: '4px 10px', fontSize: 13 }}
                                                        onClick={() => SIM.reset && SIM.reset()}>Försök igen</button>
                                            </div>
                                        )}
                                        <div className="si-rad">
                                            {fmt(v, 1)} m/s = {fmt(v * 3.6, 0)} km/h
                                            {!ut.glider && !ut.av && fMax > 1 && <span><br />friktionen är {fmt(Math.min(andel, 9.99) * 100, 0)}&nbsp;% av största möjliga</span>}
                                        </div>
                                    </div>
                                    <div className="scene-hint">Dra för att vrida kameran, scrolla för att zooma.</div>
                                    {sceneToggles()}
                                    <div className="fs-quick">
                                        <button className="fq-play" onClick={() => setRunning(x => !x)}
                                                aria-label={running ? 'Paus' : 'Start'} title={running ? 'Paus' : 'Start'}>
                                            {running ? (
                                                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                                    <rect x="6" y="5" width="4" height="14" rx="1" />
                                                    <rect x="14" y="5" width="4" height="14" rx="1" />
                                                </svg>
                                            ) : (
                                                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                                    <path d="M8 5.5v13l11-6.5z" />
                                                </svg>
                                            )}
                                        </button>
                                        <div className="fq-rows">
                                            <div className="fq-row">
                                                <span className="fq-lbl">Fart</span>
                                                <input type="range" min={0} max={V_MAX} step={0.5} value={v}
                                                       onChange={e => setV(parseFloat(e.target.value))} aria-label="Fart" />
                                            </div>
                                            <div className="fq-row">
                                                <span className="fq-lbl">Vinkel</span>
                                                <input type="range" min={0} max={A_MAX} step={1} value={alfa}
                                                       onChange={e => setAlfa(parseFloat(e.target.value))} aria-label="Doseringsvinkel" />
                                            </div>
                                        </div>
                                    </div>
                                    <button className="fs-btn" onClick={toggleFullscreen} aria-label="Fullskärm"
                                            title={isFullscreen ? 'Lämna fullskärm' : 'Fullskärm'}>
                                        {isFullscreen ? (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M9 3v6H3" /><path d="M15 21v-6h6" /><path d="M21 9h-6V3" /><path d="M3 15h6v6" />
                                            </svg>
                                        ) : (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M3 9V3h6" /><path d="M21 9V3h-6" /><path d="M3 15v6h6" /><path d="M21 15v6h-6" />
                                            </svg>
                                        )}
                                    </button>
                                </div>
                            </div>

                            <div className="lg:w-1/3 order-2">
                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <div className="flbl mb-2">Reglage</div>
                                    <Reglage label="Fart <em>v</em>" value={v} min={0} max={V_MAX} step={0.5} onChange={setV}
                                             text={`${fmt(v, 1)} m/s (${fmt(v * 3.6, 0)} km/h)`} aria="Fart" />
                                    <Reglage label="Doseringsvinkel <em>α</em>" value={alfa} min={0} max={A_MAX} step={1} onChange={setAlfa}
                                             text={`${fmt(alfa, 0)}°`} aria="Doseringsvinkel" />
                                    <Reglage label="Radie <em>r</em>" value={r} min={R_MIN} max={R_MAX} step={5} onChange={setR}
                                             text={`${fmt(r, 0)} m`} aria="Radie" />
                                    <div className="text-sm mt-2 mb-1" style={{ color: 'var(--lab-ink)' }}>Underlag</div>
                                    <div className="seg" style={{ gridTemplateColumns: 'repeat(4, 1fr)' }}>
                                        {UNDERLAG.map(u => (
                                            <button key={u.id} className={typ === u.id ? 'active' : ''} onClick={() => setMu(u.mu)}>
                                                {u.namn}<small><em>μ</em> = {fmt(u.mu, 2)}</small>
                                            </button>
                                        ))}
                                    </div>
                                    <div className="mt-2">
                                        <Reglage label="Friktionstal <em>μ</em>" value={mu} min={0} max={1} step={0.05} onChange={setMu}
                                                 text={fmt(mu, 2)} aria="Friktionstal" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-2 mt-2">
                                        <button className="btn-toggle" onClick={() => setRunning(x => !x)}>{running ? 'Pausa' : 'Fortsätt'}</button>
                                        <button className="btn-toggle" onClick={borjaOm}>Börja om</button>
                                    </div>
                                </div>

                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <div className="flbl mb-2">Vy</div>
                                    <div className="seg" style={{ gridTemplateColumns: 'repeat(3, 1fr)' }}>
                                        <button className={vy === 'folj' ? 'active' : ''} onClick={() => valjVy('folj')}>Följ bilen</button>
                                        <button className={vy === 'bakifran' ? 'active' : ''} onClick={() => valjVy('bakifran')}>Bakifrån</button>
                                        <button className={vy === 'hela' ? 'active' : ''} onClick={() => valjVy('hela')}>Hela banan</button>
                                    </div>
                                </div>

                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <div className="flbl mb-2">Farterna för den här kurvan</div>
                                    <div className="rd-row"><span>Lägsta fart</span>
                                        <span className="rv" style={{ color: COL.vmin }}>{g.vmin > 0 ? `${fmt(g.vmin, 1)} m/s` : 'bilen kan stå still'}</span></div>
                                    <div className="rd-row"><span>Friktionsfri fart</span>
                                        <span className="rv">{alfa > 0 ? `${fmt(g.v0, 1)} m/s` : 'finns inte'}</span></div>
                                    <div className="rd-row"><span>Högsta fart</span>
                                        <span className="rv" style={{ color: COL.vmax }}>{isFinite(g.vmax) ? `${fmt(g.vmax, 1)} m/s` : 'ingen gräns'}</span></div>
                                    <button className="btn-toggle w-full mt-3" onClick={friktionsfri} disabled={alfa === 0}
                                            style={alfa === 0 ? { opacity: 0.5, cursor: 'default' } : undefined}>
                                        Kör i friktionsfri fart
                                    </button>
                                </div>
                            </div>
                        </main>

                        <div className="mt-6 grid lg:grid-cols-2 gap-5">
                            <div className="glass-card rounded-xl p-4">
                                <div className="flex items-baseline justify-between flex-wrap gap-2">
                                    <div className="flbl">Tvärsnitt, sett bakifrån</div>
                                    <label className="text-sm flex items-center gap-2 cursor-pointer" style={{ color: 'var(--lab-ink)' }}>
                                        <input type="checkbox" checked={kompos} onChange={() => setKompos(k => !k)} style={{ accentColor: 'var(--lab-accent)' }} />
                                        Visa komposanterna
                                    </label>
                                </div>
                                <Tvarsnitt alfa={alfa} N={ut.N} f={ut.f} acc={ut.acc} kompos={kompos} visaFC={show.fc} glider={ut.glider} />
                                <div className="grid sm:grid-cols-2 gap-x-5 mt-2">
                                    <div className="rd-row"><span>Tyngdkraft <em>F</em><sub>G</sub></span><span className="rv" style={{ color: COL.tyngd }}>{kN(MASSA * G)}</span></div>
                                    <div className="rd-row"><span>Normalkraft <em>F</em><sub>N</sub></span><span className="rv" style={{ color: COL.norm }}>{kN(ut.N)}</span></div>
                                    <div className="rd-row"><span>Friktionskraft <em>F</em><sub>f</sub></span><span className="rv" style={{ color: COL.frik }}>{kN(ut.f)}</span></div>
                                    <div className="rd-row"><span>Centripetalkraft <em>F</em><sub>C</sub></span><span className="rv" style={{ color: COL.fc }}>{kN(MASSA * ut.acc)}</span></div>
                                </div>
                                <div className="text-sm mt-2" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Friktionen: <strong style={{ color: 'var(--lab-ink)' }}>{friktRiktning}</strong>
                                </div>
                                <div className="mt-3">
                                    <div className="flex justify-between text-sm mb-1" style={{ color: 'var(--lab-ink-soft)' }}>
                                        <span>Friktion som behövs, jämfört med största möjliga <em>μ</em> · <em>F</em><sub>N</sub></span>
                                        <span className="mono" style={{ color: andel > 1 ? COL.vmax : 'var(--lab-ink)', whiteSpace: 'nowrap', marginLeft: 8 }}>
                                            {isFinite(andel) ? `${fmt(andel * 100, 0)} %` : 'mer än max'}
                                        </span>
                                    </div>
                                    <div className="grepp-bar">
                                        <div style={{ width: `${Math.min(100, (isFinite(andel) ? andel : 2) * 100)}%`, background: andel > 1 ? COL.vmax : COL.hall }} />
                                    </div>
                                </div>
                                <p className="text-xs mt-3" style={{ color: 'var(--lab-ink-muted)' }}>
                                    Bilens massa är 1&nbsp;200&nbsp;kg och <em>g</em> = 9,82&nbsp;N/kg. Kraftpilarna är skalenliga
                                    med samma skala hela tiden. Normalkraften och friktionen angriper där hjulen möter vägen,
                                    och tyngdkraften i tyngdpunkten. Centripetalkraften är streckad: den är summan av de andra
                                    krafterna, ingen egen kraft.
                                </p>
                            </div>

                            <div className="glass-card rounded-xl p-4 karta">
                                <div className="flbl mb-1">Fartkartan: dra punkten</div>
                                <p className="text-sm mb-2" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Varje punkt är en kombination av doseringsvinkel och fart, för radien {fmt(r, 0)}&nbsp;m och
                                    friktionstalet {fmt(mu, 2)}. Dra punkten för att ändra båda på en gång.
                                </p>
                                <Fartkarta alfa={alfa} v={v} r={r} mu={mu} onSatt={(al, vv) => { setAlfa(al); setV(vv); }} />
                                <div className="legend">
                                    <span><b style={{ background: 'rgba(63,125,58,0.30)' }}></b>Greppet räcker</span>
                                    <span><b style={{ background: 'rgba(155,44,44,0.18)' }}></b>Bilen glider utåt</span>
                                    <span><b style={{ background: 'rgba(31,79,163,0.20)' }}></b>Bilen glider inåt</span>
                                    <span><i style={{ borderTopColor: COL.vmax }}></i>Högsta fart</span>
                                    <span><i style={{ borderTopColor: COL.ink, borderTopStyle: 'dashed' }}></i>Friktionsfri fart</span>
                                    <span><i style={{ borderTopColor: COL.vmin }}></i>Lägsta fart</span>
                                </div>
                                <p className="text-sm mt-4" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Vid doseringsvinkeln <strong style={{ color: 'var(--lab-ink)' }}>{fmt(alfa, 0)}°</strong> klarar bilen{' '}
                                    {g.vmin > 0
                                        ? <span>farter mellan <span className="mono">{fmt(g.vmin, 1)}</span> och </span>
                                        : <span>alla farter från stillastående upp till </span>}
                                    {isFinite(g.vmax)
                                        ? <span><span className="mono">{fmt(g.vmax, 1)}&nbsp;m/s</span>.</span>
                                        : <span>hur höga farter som helst, i alla fall i teorin.</span>}{' '}
                                    {alfa > 0
                                        ? <span>Friktionen behövs inte alls bara vid en enda fart, <span className="mono">{fmt(g.v0, 1)}&nbsp;m/s</span>. Ju lägre friktionstal, desto smalare blir det gröna bandet runt den farten.</span>
                                        : <span>På en plan väg finns ingen friktionsfri fart: utan friktion går det inte att svänga alls.</span>}
                                </p>
                            </div>
                        </div>

                        <div className="mt-8 grid md:grid-cols-2 gap-5 forkl" style={{ color: 'var(--lab-ink-soft)' }}>
                            <details className="glass-card rounded-xl p-4" open>
                                <summary className="accordion-head" style={{ color: 'var(--lab-ink)' }}>Vilka krafter verkar på bilen?<span>+</span></summary>
                                <ol>
                                    <li><strong>Tyngdkraften <em>F</em><sub>G</sub></strong> pekar rakt nedåt och angriper i
                                        tyngdpunkten.</li>
                                    <li><strong>Normalkraften <em>F</em><sub>N</sub></strong> är vinkelrät mot vägbanan. När vägen
                                        lutar in mot centrum lutar normalkraften också inåt, och dess vågräta komposant pekar mot
                                        kurvans centrum.</li>
                                    <li><strong>Friktionskraften <em>F</em><sub>f</sub></strong> verkar längs vägbanan, mellan
                                        däcken och vägen. Den kan peka nedför vägbanan (inåt) eller uppför (utåt), beroende på
                                        farten.</li>
                                    <li><strong>Resultanten är centripetalkraften <em>F</em><sub>C</sub></strong>. Cirkelbanan
                                        ligger i ett vågrätt plan, så resultanten är vågrät och pekar in mot centrum, inte längs
                                        vägbanan. Slå på komposanterna i tvärsnittet: de lodräta delarna tar ut varandra, och de
                                        vågräta blir tillsammans <Tex t={String.raw`F_C = \dfrac{m \cdot v^2}{r}`} />.</li>
                                </ol>
                            </details>

                            <details className="glass-card rounded-xl p-4" open>
                                <summary className="accordion-head" style={{ color: 'var(--lab-ink)' }}>Farten där ingen friktion behövs<span>+</span></summary>
                                <p>Utan friktion verkar bara tyngdkraften och normalkraften. Normalkraftens lodräta komposant
                                    bär bilens tyngd, och den vågräta ska vara hela centripetalkraften:</p>
                                <Tex d t={String.raw`F_N \cdot \sin\alpha = \frac{m \cdot v^2}{r} \qquad F_N \cdot \cos\alpha = m \cdot g`} />
                                <p>Dividera den första ekvationen med den andra. Då försvinner både <em>F</em><sub>N</sub> och
                                    massan:</p>
                                <Tex d t={String.raw`\tan\alpha = \frac{v^2}{r \cdot g} \quad\Longleftrightarrow\quad v_0 = \sqrt{r \cdot g \cdot \tan\alpha}`} />
                                <p>Med <Tex t={String.raw`r = 60\ \mathrm{m}`} /> och <Tex t={String.raw`\alpha = 15^\circ`} /> blir
                                    farten ungefär 13&nbsp;m/s, alltså 45&nbsp;km/h. Kör bilen i den farten pekar friktionen
                                    ingenstans, och bilen klarar kurvan även på blankis. Den friktionsfria farten beror inte på
                                    bilens massa: en lastbil och en cykel får samma fart.</p>
                            </details>

                            <details className="glass-card rounded-xl p-4">
                                <summary className="accordion-head" style={{ color: 'var(--lab-ink)' }}>Högsta och lägsta fart<span>+</span></summary>
                                <p><strong>Snabbare än den friktionsfria farten</strong> räcker normalkraften inte till, och
                                    friktionen måste peka nedför vägbanan, inåt. Vid gränsen är
                                    <Tex t={String.raw`\ F_f = \mu \cdot F_N`} />, och kraftekvationerna vågrätt och lodrätt blir</p>
                                <Tex d t={String.raw`F_N \cdot \sin\alpha + \mu \cdot F_N \cdot \cos\alpha = \frac{m \cdot v^2}{r} \qquad F_N \cdot \cos\alpha - \mu \cdot F_N \cdot \sin\alpha = m \cdot g`} />
                                <p>Division ger den högsta farten:</p>
                                <Tex d t={String.raw`v_\text{max} = \sqrt{\frac{r \cdot g \cdot (\sin\alpha + \mu \cdot \cos\alpha)}{\cos\alpha - \mu \cdot \sin\alpha}}`} />
                                <p><strong>Långsammare än den friktionsfria farten</strong> skulle bilen glida nedför, och
                                    friktionen pekar uppför vägbanan. Samma räkning med ombytta tecken ger</p>
                                <Tex d t={String.raw`v_\text{min} = \sqrt{\frac{r \cdot g \cdot (\sin\alpha - \mu \cdot \cos\alpha)}{\cos\alpha + \mu \cdot \sin\alpha}}`} />
                                <p>Är <Tex t={String.raw`\tan\alpha \leq \mu`} /> blir täljaren noll eller negativ, och då kan
                                    bilen stå still i kurvan utan att glida. På en plan väg, <Tex t={String.raw`\alpha = 0`} />,
                                    ger formeln <Tex t={String.raw`v_\text{max} = \sqrt{\mu \cdot r \cdot g}`} />: där är
                                    friktionen ensam om att hålla bilen kvar.</p>
                            </details>

                            <details className="glass-card rounded-xl p-4">
                                <summary className="accordion-head" style={{ color: 'var(--lab-ink)' }}>Pröva själv i simuleringen<span>+</span></summary>
                                <ul>
                                    <li><strong>Öka farten sakta</strong> och titta på friktionspilen i tvärsnittet. Den krymper,
                                        försvinner vid den friktionsfria farten och växer sedan åt andra hållet.</li>
                                    <li><strong>Välj is</strong> och tryck på Kör i friktionsfri fart. Bilen klarar kurvan, men
                                        ändra farten lite åt något håll så glider den. På fartkartan har det gröna bandet krympt
                                        till nästan en linje.</li>
                                    <li><strong>Gör kurvan plan</strong> (<em>α</em> = 0°). Nu finns ingen friktionsfri fart, och
                                        all kraft in mot centrum måste komma från friktionen.</li>
                                    <li><strong>Brant kurva och halt underlag:</strong> sänk farten mot noll. Bilen glider ned mot
                                        innerkanten, precis som en låda på ett lutande plan.</li>
                                    <li><strong>Ändra radien</strong> och se det gröna bandet på fartkartan flytta sig. En större
                                        radie tillåter högre fart.</li>
                                    <li><strong>Titta bakifrån</strong> när bilen tar i hårt. Angreppspunkten för normalkraften
                                        flyttar sig mot ytterhjulen: de bär mer av bilen än innerhjulen.</li>
                                </ul>
                            </details>

                            <details className="glass-card rounded-xl p-4">
                                <summary className="accordion-head" style={{ color: 'var(--lab-ink)' }}>Vanliga missförstånd<span>+</span></summary>
                                <ul>
                                    <li><strong>”Centrifugalkraften slungar ut bilen.”</strong> Det finns ingen kraft som drar
                                        bilen utåt. Bilen vill fortsätta rakt fram enligt Newtons första lag, och glider utåt
                                        när krafterna inåt inte räcker för att kröka banan.</li>
                                    <li><strong>”Friktionen pekar alltid in mot centrum.”</strong> Bara när bilen kör fortare än
                                        den friktionsfria farten. Kör den långsammare pekar friktionen uppför vägbanan, utåt.</li>
                                    <li><strong>”Resultanten pekar längs vägbanan.”</strong> Nej, bilen rör sig i ett vågrätt
                                        plan, så resultanten är vågrät och pekar mot kurvans centrum.</li>
                                    <li><strong>”Normalkraften är lika stor som tyngdkraften.”</strong> Bara på ett plant
                                        underlag utan acceleration i höjdled. I en doserad kurva är normalkraften större än
                                        tyngdkraften, eftersom den både bär bilen och hjälper till att kröka banan.</li>
                                    <li><strong>”En tung bil klarar kurvan bättre.”</strong> Massan finns på båda sidor i
                                        ekvationerna och tar ut sig själv. Högsta och lägsta fart beror bara på <em>r</em>,
                                        <em> α</em>, <em>μ</em> och <em>g</em>.</li>
                                </ul>
                            </details>

                            <details className="glass-card rounded-xl p-4">
                                <summary className="accordion-head" style={{ color: 'var(--lab-ink)' }}>Doserade kurvor i verkligheten<span>+</span></summary>
                                <p>Motorvägarnas av- och påfarter doseras ofta några grader, så att de går att köra även när
                                    vägen är hal. Cykelbanor i velodromer lutar upp till drygt 40°, och ovalbanor för
                                    racerbilar har doseringar på 20 till 30°. Även järnvägens kurvor doseras: ytterrälen
                                    ligger högre än innerrälen, så att tåget lutar in mot kurvan och passagerarna inte
                                    pressas ut mot sidan.</p>
                                <p>Ett flygplan som svänger gör samma sak i luften. Det lutar vingarna, och lyftkraften får
                                    då en vågrät komposant som krökar banan, precis som normalkraften i den doserade kurvan.</p>
                            </details>
                        </div>
                    </div>
                </div>
            );
