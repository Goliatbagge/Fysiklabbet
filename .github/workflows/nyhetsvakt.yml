# Nyhetsvakt: larmar när dagens eller morgondagens nyhet saknas på main.
#
# VARFÖR DEN FINNS
# Dagens nyhet skrivs av schemalagda uppgifter på Windows-datorn
# (.claude/nyheter/daglig-nyhet.ps1). Den 4 oktober 2026 publicerades ingen
# nyhet alls, och ingenting på sajten såg trasigt ut: listan visade bara
# gårdagens artikel överst. Felet upptäcktes först när användaren själv tittade.
#
# Sedan 2026-10-25 skrivs nyheten ett dygn i förväg (natten före, 03.20 med
# omförsök 07.20 och 13.15) och hålls dold av datumgrinden till midnatt.
# Vakten kollar därför två saker:
#   1. DAGENS artikel, från kl 08: saknas den har både förberedelsen och
#      nattens skyddsnät misslyckats. Ärende "Ingen nyhet publicerad <datum>".
#   2. MORGONDAGENS artikel, från kl 16: saknas den har alla tre
#      nattkörningarna misslyckats, och ägaren varnas ett halvt dygn innan
#      sajten står utan nyhet. Ärende "Ingen nyhet förberedd för <datum>".
# Före 2026-10-31 fanns bara den första kollen, och den gick bara kl 08-12.
# GitHub hoppar över de flesta schemalagda körningar (en av fem kom fram per
# dag, kl 14.30), så 2026-10-30 och 2026-10-31 gick båda nattkörningarna
# fel utan att något larm hann gå. Schemat går nu varje timme dygnet runt;
# det är bara så de körningar som faktiskt kommer fram blir utspridda.
#
# Vakten skriver ingenting själv (det finns ingen Claude-nyckel i GitHub).
# Ett ärende per fall, inte ett rött kryss per timme, och ärendet stängs
# automatiskt när artikeln kommit in. Jobbets logg ligger på grenen
# nyhetsjobb-logg (daglig-nyhet.ps1 pushar den efter varje körning), och
# ärendet länkar dit. Se CLAUDE.md, "Dagens nyhet".

name: Nyhetsvakt

on:
  schedule:
    # Udda minut: kön är längst på :00.
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  vakt:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Stockholm
    steps:
      # Bara nyhetsfilen: repot är stort (bilder, film, ljud), och en full
      # utcheckning tar minuter för en koll som tar en sekund.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: data/nyheter.js
          sparse-checkout-cone-mode: false

      - name: Finns dagens och morgondagens nyhet?
        id: koll
        run: |
          idag=$(date +%F)
          imorgon=$(date -d tomorrow +%F)
          timme=$(date +%-H)
          echo "idag=$idag" >> "$GITHUB_OUTPUT"
          echo "imorgon=$imorgon" >> "$GITHUB_OUTPUT"
          finns() {
            # Båda nyckelformerna förekommer: date: "…" och "date": "…".
            grep -Eq "[\"']?date[\"']?[[:space:]]*:[[:space:]]*[\"']$1[\"']" data/nyheter.js
          }
          # ja = finns, nej = saknas och det är dags att larma,
          # tidigt = saknas men nattkörningarna kan fortfarande hålla på.
          if finns "$idag"; then echo "idag_finns=ja" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$timme" -lt 8 ]; then echo "idag_finns=tidigt" >> "$GITHUB_OUTPUT"
          else echo "idag_finns=nej" >> "$GITHUB_OUTPUT"; echo "::warning::Ingen nyhet daterad $idag."
          fi
          if finns "$imorgon"; then echo "imorgon_finns=ja" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$timme" -lt 16 ]; then echo "imorgon_finns=tidigt" >> "$GITHUB_OUTPUT"
          else echo "imorgon_finns=nej" >> "$GITHUB_OUTPUT"; echo "::warning::Ingen nyhet förberedd för $imorgon."
          fi

      - name: Öppna eller stäng ärenden
        uses: actions/github-script@v7
        env:
          IDAG: ${{ steps.koll.outputs.idag }}
          IMORGON: ${{ steps.koll.outputs.imorgon }}
          IDAG_FINNS: ${{ steps.koll.outputs.idag_finns }}
          IMORGON_FINNS: ${{ steps.koll.outputs.imorgon_finns }}
        with:
          script: |
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const loggLank = `https://github.com/${repo.owner}/${repo.repo}/tree/nyhetsjobb-logg`;
            const oppna = (await github.paginate(github.rest.issues.listForRepo, {
              ...repo, state: 'open', per_page: 100,
            })).filter((i) => !i.pull_request);

            async function hantera(titel, finns, kropp) {
              const befintliga = oppna.filter((i) => i.title === titel);
              if (finns === 'ja') {
                for (const i of befintliga) {
                  await github.rest.issues.createComment({ ...repo, issue_number: i.number,
                    body: 'Artikeln finns nu i data/nyheter.js. Stänger ärendet automatiskt.' });
                  await github.rest.issues.update({ ...repo, issue_number: i.number,
                    state: 'closed', state_reason: 'completed' });
                }
                return;
              }
              if (finns !== 'nej') return;
              if (befintliga.length) { core.info(`#${befintliga[0].number} finns redan: ${titel}`); return; }
              const nytt = await github.rest.issues.create({ ...repo, title: titel, body: kropp.join('\n') });
              core.warning(`Öppnade ärende #${nytt.data.number}: ${titel}`);
            }

            const felsok = (datum) => [
              'Felsök så här:',
              `1. Läs jobbets logg på grenen [nyhetsjobb-logg](${loggLank}) (filen \`${datum}.log\` och dagen före), eller på Windows-datorn i \`C:\\claude\\Fysiklabbet-nyhetsjobb\\.claude\\nyheter\\logg\\\`. Vanliga orsaker: datorn var avstängd eller sov, Claude-gränsen (session eller vecka) var nådd, nätet var nere.`,
              "2. Kör om för hand på datorn: `Start-ScheduledTask -TaskName 'Fysiklabbet daglig nyhet'`. Varje körning skriver först dagens artikel om den saknas, sedan morgondagens (högst tre försök per artikel och dygn).",
              '3. En molnsession kan bara skriva nyheten om miljöns nätverksåtkomst släpper in nyhetskällorna (phys.org, physics.aps.org, arxiv.org, nature.com med flera). Med standardpolicyn blockeras de.',
              '',
              'Ärendet stängs automatiskt när artikeln finns på main.',
            ];

            await hantera(`Ingen nyhet publicerad ${process.env.IDAG}`, process.env.IDAG_FINNS, [
              `Det finns ingen artikel daterad **${process.env.IDAG}** i \`data/nyheter.js\` på main, så sajten visar gårdagens nyhet överst.`,
              '',
              'Varken nattkörningen dagen före (som skulle förbereda artikeln) eller nattens skyddsnät har publicerat något.',
              '',
              ...felsok(process.env.IDAG),
            ]);

            await hantera(`Ingen nyhet förberedd för ${process.env.IMORGON}`, process.env.IMORGON_FINNS, [
              `Det finns ingen artikel daterad **${process.env.IMORGON}** i \`data/nyheter.js\` på main, trots att nattkörningen (03.20) och omförsöken 07.20 och 13.15 borde ha skrivit den.`,
              '',
              'Händer inget före midnatt står sajten utan ny nyhet i morgon, om inte nattens skyddsnät lyckas.',
              '',
              ...felsok(process.env.IDAG),
            ]);
