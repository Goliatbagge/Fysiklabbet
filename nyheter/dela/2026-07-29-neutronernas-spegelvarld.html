    <title>Forskare letar efter en dold spegelvärld i 25 miljarder neutroner — och hittar inget spår — Fysiklabbet</title>
    <meta name="description" content="En snart sjuttio år gammal hypotes i partikelfysiken föreslår att varje partikel har en osynlig spegelpartner i en parallell materievärld som bara märks via gravitationen — och som räknas som en kandidat för mörk materia. Vid Paul Scherrer-institutet i Schweiz har forskare med hittills oöverträffad precision letat efter tecken på att neutroner läcker in i denna spegelvärld, genom att studera omkring 25 miljarder neutroner under flera månader — utan att hitta ett enda spår.">
