    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        /* =====================================================================
           Vattenkraftverket på labbänken (generator med roterande magnet), 3D.

           En vattenstråle från en labbkran träffar skovlarna på ett hjul. På
           hjulets axel sitter en stavmagnet som snurrar förbi en fast spole
           med järnkärna. Spolen är kopplad till en voltmeter och, via en
           strömbrytare, till en liten glödlampa. Eleven kan också veva själv.

           Fysiken (samma beteckningar som genomgången fy2-3.10):
           - Flödet genom spolen: Φ = N · B · A · cos θ, där B är
             flödestätheten i spolen när magneten pekar rakt mot den.
             B avtar snabbt med avståndet g mellan magnet och spole:
             B = B0 / (1 + g/L0)³ (en dipol avtar med tredje potensen).
           - Inducerad spänning: u = −dΦ/dt = N · B · A · ω · sin θ,
             så û = N · B · A · ω, precis som ê = B · A · ω för en slinga.
           - Med lampan inkopplad går strömmen i = u / (R_spole + R_lampa).
             Effekten u · i måste hjulet leverera. Det ger ett bromsande
             kraftmoment τ = u · i / ω = N · B · A · sin θ · i (Lenz lag).
           - Vattnet: τ_vatten = K · q · (q · W0 − ω). Strålen från en kran
             som öppnas mer blir både större och snabbare.
           - Hjulet: J · dω/dt = τ_vatten − τ_broms − friktion.
           Enheter i scenen: 1 enhet = 1 cm. SI i fysiken.
           ===================================================================== */

        const COL = {
            ink:    '#1f2530',
            falt:   '#c0392b',   // magnetfältet B (rött, som teorifigurerna)
            flux:   '#2563c9',   // flödet Φ (blått, som i transformatorn)
            ind:    '#7b3fa0',   // inducerad spänning och ström (lila, som i Lenz lag)
            kraft:  '#2563c9',
            npol:   '#c0392b',
            spol:   '#f4f2ee',
            koppar: '#c87f3a',
            lampa:  '#f2b134',
            vatten: '#3a86c8',
        };

        // ── Fysikens konstanter ──
        const A_SPOLE = Math.PI * 0.014 * 0.014;   // spolens area (m²), radie 1,4 cm
        const B0 = 0.80, L0 = 1.2;                 // T, cm (med järnkärna)
        const UTAN_KARNA = 0.22;                   // utan järnkärna blir B så här mycket mindre
        const R_PER_VARV = 0.01;                   // Ω per varv
        const R_LAMPA = 12;                        // Ω (lampan är märkt 1,2 V 0,1 A)
        const P_LAMPA = 0.12;                      // W, lampans märkeffekt
        const K_VATTEN = 1.1e-3, W0 = 28;            // N·m·s, rad/s
        const J_HJUL = 1.0e-3;                     // kg·m²
        const FRIK_V = 1.5e-5, FRIK_C = 1.2e-3;    // N·m·s, N·m
        const R_VEV = 0.026;                       // vevens längd (m)
        const W_MAX = 30;                          // rad/s

        const bFalt = (g, karna) => B0 / Math.pow(1 + g / L0, 3) * (karna ? 1 : UTAN_KARNA);

        // ── Geometri (cm) ──
        const AY = 7.0;                    // axelns höjd över bänken
        const Z_HJUL = -4.2, HJUL_R = 4.2, HJUL_B = 1.7;
        const Z_MAG = 1.6, MAG_L = 5.0, MAG_T = 1.2, MAG_H = MAG_L / 2;
        const Z_VEV = 5.6, VEV_R = 2.6;
        const SPOLE_L = 3.4, SPOLE_RI = 1.4;
        const KARNA_R = 1.2;
        const spoleRY = (N) => 1.75 + 0.8 * N / 1200;
        const spoleX = (g) => MAG_H + g + 0.5 + SPOLE_L / 2;    // spolens mitt; kärnans ände ligger g från magneten
        const KRAN_X = HJUL_R * Math.cos(0.42), KRAN_Z = Z_HJUL;
        const LAMP = new THREE.Vector3(9.5, 0, 9.6);
        const VOLT = new THREE.Vector3(15.5, 0, -2.5);

        const tr = (t) => (window.I18N ? I18N.t(t) : t);
        const fmt = (num, decimals = 1) => {
            if (!isFinite(num)) return '–';
            const s = num.toFixed(decimals);
            if (parseFloat(s) === 0) return '0';
            return s.replace('.', ',').replace('-', '−');
        };

        // ─────────────────────────────────────────────────────────────────
        // Fältlinjer runt stavmagneten (i magnetens eget system: x längs
        // magneten, nordändan åt +x). Modell: två magnetiska poler i ±a.
        // ─────────────────────────────────────────────────────────────────
        const POL_A = 2.05;
        function faltLokal(x, y) {
            const dx1 = x - POL_A, dx2 = x + POL_A;
            const r1 = Math.pow(dx1 * dx1 + y * y, 1.5), r2 = Math.pow(dx2 * dx2 + y * y, 1.5);
            return [dx1 / r1 - dx2 / r2, y / r1 - y / r2];
        }
        // Linjen spåras från nordändan. Når den sydändan innan den lämnar
        // radien R_KLIPP ritas hela slingan, annars ritas bara biten närmast
        // magneten, och sydändans bit fås ur symmetrin (x → −x).
        const R_KLIPP = 6.2;
        function sparaLinje(phi) {
            let x = POL_A + 0.32 * Math.cos(phi), y = 0.32 * Math.sin(phi);
            const pts = [[x, y]];
            const h = 0.05;
            for (let n = 0; n < 3000; n++) {
                let [a, b] = faltLokal(x, y); let m = Math.hypot(a, b);
                const mx = x + a / m * h / 2, my = y + b / m * h / 2;
                [a, b] = faltLokal(mx, my); m = Math.hypot(a, b);
                x += a / m * h; y += b / m * h;
                if (Math.hypot(x + POL_A, y) < 0.3) { pts.push([x, y]); return [pts]; }
                if (Math.hypot(x, y) > R_KLIPP) {
                    pts.push([x, y]);
                    const sod = pts.map(([px, py]) => [-px, py]).reverse();
                    return [pts, sod];
                }
                if (n % 3 === 0) pts.push([x, y]);
            }
            return [];
        }
        const FALT_LINJER = [];
        [[0, [0.1, 0.5, 1.05, 1.6]], [Math.PI, [0.1, 0.5, 1.05, 1.6]],
         [0.55, [0.7]], [-0.55, [0.7]], [Math.PI + 0.55, [0.7]], [Math.PI - 0.55, [0.7]]].forEach(([psi, phis]) => {
            phis.forEach(phi => {
                sparaLinje(phi).forEach(l => { if (l.length > 4) FALT_LINJER.push({ psi, pts: l }); });
            });
        });

        // ─────────────────────────────────────────────────────────────────
        // Grafikhjälp (samma som i elmotorn och Lenz lag)
        // ─────────────────────────────────────────────────────────────────
        const textSprite = (parts, h = 0.42) => {
            const c = document.createElement('canvas');
            const ctx = c.getContext('2d');
            const FS = 64, PAD = 14;
            const fontFor = (p) => `${p.italic ? 'italic ' : ''}${p.weight || 600} ${p.small ? FS * 0.74 : FS}px Poppins, sans-serif`;
            let w = 0;
            parts.forEach((p) => { ctx.font = fontFor(p); w += ctx.measureText(p.t).width; });
            c.width = Math.max(2, Math.ceil(w) + PAD * 2);
            c.height = FS + PAD * 2;
            let x = PAD;
            parts.forEach((p) => {
                ctx.font = fontFor(p);
                ctx.textBaseline = 'middle';
                ctx.fillStyle = p.color;
                const dy = p.sub ? FS * 0.24 : p.sup ? -FS * 0.24 : 0;
                ctx.fillText(p.t, x, c.height / 2 + 2 + dy);
                x += ctx.measureText(p.t).width;
            });
            const tex = new THREE.CanvasTexture(c);
            tex.minFilter = THREE.LinearFilter;
            tex.anisotropy = 4;
            tex.encoding = THREE.sRGBEncoding;
            const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false, toneMapped: false }));
            spr.scale.set(h * c.width / c.height, h, 1);
            spr.renderOrder = 20;
            return spr;
        };
        const Y_AXEL = new THREE.Vector3(0, 1, 0);

                pts, L, len: L[L.length - 1],

                },
            };

                let sampT = 0;
                let droppAcc = 0;
                const tick = () => {
                    raf = requestAnimationFrame(tick);
                    const now = performance.now();
                    const dtv = Math.min(0.05, (now - tLast) / 1000);
                    tLast = now;
                    if (!synlig) return;
                    const p = SIM.p;
                    if (ritadN !== p.N || SIM.dirty) { SIM.dirty = false; byggSpole(); }

                    const B = bFalt(p.g, p.karna);
                    const NBA = p.N * B * A_SPOLE;                  // Wb (flödets toppvärde)
                    const R = R_PER_VARV * p.N + R_LAMPA;
                    const sluten = p.lampa;
                    const vevar = p.drift === 'vev' && !!vevDrag;
                    const skala = p.slow ? 0.12 : 1;
                    let u = 0, i = 0, Pin = 0, Pf = 0, Pk = 0, F = 0;

                    if (p.running || vevar) {
                        if (vevar) {
                            // Vinkeln följer handen (men aldrig fortare än W_MAX)
                            const onskat = vevDrag.mal - vinkelVis;
                            const maxSteg = W_MAX * dtv;
                            const steg = Math.max(-maxSteg, Math.min(maxSteg, onskat * Math.min(1, dtv / 0.05)));
                            if (Math.abs(onskat) > maxSteg) vevDrag.mal = vinkelVis + steg + Math.sign(onskat) * Math.min(Math.abs(onskat) - maxSteg, 0.6);
                            vinkelVis += steg;
                            const wNy = -steg / Math.max(dtv, 1e-4);
                            const wGammal = vevOmega;
                            vevOmega += (wNy - vevOmega) * Math.min(1, dtv / 0.12);
                            omega = vevOmega;
                            theta = -vinkelVis;
                            const dtS = dtv;
                            tSim += dtS;
                            const e = NBA * omega * Math.sin(theta);
                            u = e; i = sluten ? e / R : 0;
                            const tauB = NBA * Math.sin(theta) * i;
                            const tauF = FRIK_V * omega + FRIK_C * Math.tanh(omega / 0.5);
                            const alfa = (vevOmega - wGammal) / Math.max(dtv, 1e-4);
                            const tauHand = tauB + tauF + J_HJUL * alfa;
                            Pin = tauHand * omega; Pf = tauF * omega; Pk = J_HJUL * alfa * omega;
                            F = Math.abs(tauB + tauF) / R_VEV;
                            stromS += i * dtS * 9;
                        } else {
                            const dtS = dtv * skala;
                            const n = Math.max(1, Math.ceil(dtS / 0.002));
                            const h = dtS / n;
                            let sPin = 0, sPf = 0, sPk = 0;
                            for (let k = 0; k < n; k++) {
                                const e = NBA * omega * Math.sin(theta);
                                const ii = sluten ? e / R : 0;
                                const tauB = NBA * Math.sin(theta) * ii;
                                const q = p.drift === 'vatten' ? p.q : 0;
                                let tauV = K_VATTEN * q * (q * W0 - omega);
                                const tauF = FRIK_V * omega + FRIK_C * Math.tanh(omega / 0.5);
                                const alfa = (tauV - tauB - tauF) / J_HJUL;
                                sPin += tauV * omega; sPf += tauF * omega; sPk += J_HJUL * alfa * omega;
                                omega += alfa * h;
                                if (q === 0 && Math.abs(omega) < 0.05 && Math.abs(tauB) < FRIK_C) omega = 0;
                                theta += omega * h;
                            }
                            Pin = sPin / n; Pf = sPf / n; Pk = sPk / n;
                            vinkelVis = -theta;
                            vevOmega = omega;
                            tSim += dtS;
                            u = NBA * omega * Math.sin(theta);
                            i = sluten ? u / R : 0;
                            stromS += i * dtS * 9;
                        }
                    }
                    const Pl = i * i * R_LAMPA, Ps = i * i * R_PER_VARV * p.N;

                    // medelvärden (glidande, cirka en sekund)
                    const km = Math.min(1, dtv / 0.9);
                    med.Pin += (Pin - med.Pin) * km; med.Pl += (Pl - med.Pl) * km; med.Ps += (Ps - med.Ps) * km;
                    med.Pf += (Pf - med.Pf) * km; med.Pk += (Pk - med.Pk) * km;
                    med.F += ((vevar ? F : 0) - med.F) * Math.min(1, dtv / 0.35);
                    // toppvärden: största |u| och |i| det senaste varvet (minst 0,4 s)
                    uMaxFonster = Math.max(uMaxFonster, Math.abs(u)); iMaxFonster = Math.max(iMaxFonster, Math.abs(i));
                    fonsterT += dtv * skala;
                    const varvT = Math.abs(omega) > 0.5 ? 2 * Math.PI / Math.abs(omega) : 0.5;
                    if (fonsterT > Math.max(0.4 * skala, varvT * 1.05)) {
                        med.uMax = uMaxFonster; med.iMax = iMaxFonster;
                        uMaxFonster = 0; iMaxFonster = 0; fonsterT = 0;
                    }

                    // glödtråden har en värmetröghet på några hundradels sekunder
                    tradT += (Pl - tradT) * Math.min(1, (dtv * skala) / 0.05);
                    const ljus = Math.max(0, Math.min(1.3, tradT / P_LAMPA));
                    const lj = Math.pow(ljus, 0.55);
                    glasMat.emissiveIntensity = lj * 3.0; glasMat.opacity = 0.28 + 0.4 * Math.min(1, lj);
                    trad.material.emissiveIntensity = lj * 6;
                    glod.material.opacity = Math.min(1, lj * 1.1);
                    glod.scale.setScalar(4 + lj * 6);
                    lampLjus.intensity = lj * 3.2;

                    // voltmeterns nål: en dämpad svängning (egenfrekvens 6 Hz)
                    const nalMal = Math.max(-3.3, Math.min(3.3, u)) / 3 * (0.28 * Math.PI);
                    const w0n = 2 * Math.PI * 6, dzeta = 0.7;
                    const hs = dtv * skala;
                    for (let k = 0; k < 4; k++) {
                        const aN = w0n * w0n * (nalMal - nalV) - 2 * dzeta * w0n * nalA;
                        nalA += aN * hs / 4; nalV += nalA * hs / 4;
                    }
                    nalG.rotation.z = -nalV;

                    // strömbrytaren
                    brytVinkel += ((sluten ? 0 : 1.05) - brytVinkel) * Math.min(1, dtv * 12);
                    kniv.rotation.z = brytVinkel;

                    // rotationen
                    hjulG.rotation.z = vinkelVis;
                    magnetG.rotation.z = vinkelVis;
                    vevG.rotation.z = vinkelVis;

                    // vattnet
                    const qv = p.drift === 'vatten' ? p.q : 0;
                    stral.visible = qv > 0.01;
                    if (stral.visible) { const s = 0.45 + 1.1 * Math.sqrt(qv); stral.scale.set(s, 1, s); }
                    vredG.rotation.y = -qv * 1.4;
                    droppAcc += qv * dtv * skala * 90;
                    while (droppAcc > 1) {
                        droppAcc -= 1;
                        const d = droppar.find(x => x.liv < 0);
                        if (!d) break;
                        d.liv = 0;
                        d.p.set(KRAN_X + (Math.random() - 0.5) * 0.4, TRAFF_Y - 0.2, Z_HJUL + (Math.random() - 0.5) * 1.1);
                        d.v.set(0.4 + Math.random() * 1.6 + omega * 0.05, -2 - Math.random() * 6, (Math.random() - 0.5) * 3);
                        d.m.visible = true;
                    }
                    droppar.forEach(d => {
                        if (d.liv < 0) return;
                        const hs2 = dtv * skala;
                        d.liv += hs2; d.v.y -= 98 * hs2 * 0.5; d.p.addScaledVector(d.v, hs2);
                        d.m.position.copy(d.p);
                        if (d.p.y < 1.35) { d.liv = -1; d.m.visible = false; }
                    });
                    ringar.forEach(r => {
                        const f = ((tSim * 1.1 + r.userData.fas) % 1);
                        r.visible = qv > 0.01;
                        r.scale.setScalar(0.4 + f * 2.2);
                        r.material.opacity = 0.5 * (1 - f) * Math.min(1, qv * 2);
                    });

                    // flödet genom spolen
                    const sh = p.show;
                    const phi = Math.cos(theta);
                    flodePil.visible = sh.flode;
                    const phiRef = 600 * bFalt(0.5, true) * A_SPOLE;
                    const Lphi = 4.6 * Math.min(1.6, NBA / phiRef) * Math.abs(phi);
                    if (sh.flode && Lphi > 0.15) {
                        const riktning = phi >= 0 ? 1 : -1;
                        stallPil(flodePil, new THREE.Vector3(-riktning * Lphi / 2, AY, 0), new THREE.Vector3(riktning * Lphi, 0, 0), { r: 0.16 });
                        flodePil.renderOrder = 9;
                    } else flodePil.visible = false;
                    phiLapp.visible = sh.flode;
                    faltG.visible = sh.falt; bLapp.visible = sh.falt;
                    karna.visible = p.karna;

                    // strömpilar
                    stromG.visible = sh.strom && sluten && stromBana;
                    if (stromG.visible) {
                        const L = stromBana.len, n = stromPilar.length;
                        const stilla = Math.abs(i) < 0.004;
                        stromPilar.forEach((m, k) => {
                            const s = (((k / n) * L + stromS) % L + L) % L;
                            const { p: q, d } = stromBana.at(s);
                            m.position.copy(q);
                            m.quaternion.setFromUnitVectors(Y_AXEL, d.multiplyScalar(i >= 0 ? 1 : -1));
                            const storlek = stilla ? 0.001 : Math.min(1, 0.35 + Math.abs(i) / 0.12);
                            m.scale.setScalar(storlek);
                        });
                        iLapp.position.copy(iLappPos);
                        iLapp.visible = Math.abs(med.iMax) > 0.004;
                    }

                    // kraften på veven (skalenlig, vinkelrät mot vevarmen)
                    const visaF = sh.kraft && vevar && med.F > 0.02;
                    vevPil.visible = visaF; fLapp.visible = visaF;
                    if (visaF) {
                        const hp = new THREE.Vector3(VEV_R * Math.cos(vinkelVis), AY + VEV_R * Math.sin(vinkelVis), Z_VEV + 2.2);
                        const tang = new THREE.Vector3(-Math.sin(vinkelVis), Math.cos(vinkelVis), 0).multiplyScalar(omega < 0 ? 1 : -1);
                        const Lf = Math.min(7, med.F * 14);
                        stallPil(vevPil, hp, tang.clone().multiplyScalar(Lf), { r: 0.13 });
                        fLapp.position.copy(hp.clone().add(tang.multiplyScalar(Lf + 0.9)));
                    }

                    // graf
                    sampT += dtv * skala;
                    if (sampT >= 1 / 120 && (p.running || vevar)) {
                        sampT = 0;
                        SIM.buf.push({ t: tSim, u, f: phi * Math.min(1.6, NBA / phiRef) });
                        while (SIM.buf.length && SIM.buf[0].t < tSim - GRAF_T) SIM.buf.shift();
                    }

                    Object.assign(SIM.ut, {
                        varv: Math.abs(omega) / (2 * Math.PI), u, i, uTopp: med.uMax, iTopp: med.iMax, lampa: ljus,
                        Pin: med.Pin, Plampa: med.Pl, Pspole: med.Ps, Pfrik: med.Pf, Pkin: med.Pk, Fvev: med.F, vevar, B,
                    });

                    if (camMal) {
                        const k = Math.min(1, dtv * 4);
                        cam.theta += (camMal.theta - cam.theta) * k;
                        cam.phi += (camMal.phi - cam.phi) * k;
                        cam.radius += (camMal.radius - cam.radius) * k;
                        cam.target.lerp(camMal.target, k);
                        if (Math.abs(camMal.phi - cam.phi) < 1e-3 && Math.abs(camMal.theta - cam.theta) < 1e-3) camMal = null;
                    }
                    uppdateraKamera();
                    renderer.render(scene, camera);
                };
                tick();

                return () => {
                    cancelAnimationFrame(raf);
                    ro.disconnect(); io.disconnect();
                    el.removeEventListener('pointerdown', onDown);
                    window.removeEventListener('pointermove', onMove);
                    window.removeEventListener('pointerup', onUp);
                    window.removeEventListener('pointercancel', onUp);
                    el.removeEventListener('wheel', onWheel);
                    renderer.dispose();
                    if (renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement);
                };
            }, []);
            return <div ref={mountRef} className="gen-mount" />;
        }

        // ─────────────────────────────────────────────────────────────────
        // Grafen: spänningen u och flödet Φ
        // ─────────────────────────────────────────────────────────────────
        const SKALSTEG = [0.5, 1, 2, 3, 5, 10];
        function Graf({ buf, uTopp }) {
            const W = 600, H = 176, pl = 44, pr = 16, pt = 18, pb = 24;
            const tNu = buf.length ? buf[buf.length - 1].t : 0;
            const X = (t) => pl + (W - pl - pr) * (1 - (tNu - t) / GRAF_T);
            const s = SKALSTEG.find(v => v >= uTopp * 1.05) || 10;
            const mid = pt + (H - pt - pb) / 2, amp = (H - pt - pb) / 2;
            const Y = (u) => mid - amp * Math.max(-1.08, Math.min(1.08, u / s));
            const uPts = buf.map(b => `${X(b.t).toFixed(1)},${Y(b.u).toFixed(1)}`).join(' ');
            const fPts = buf.map(b => `${X(b.t).toFixed(1)},${(mid - amp * 0.6 * b.f).toFixed(1)}`).join(' ');
            const st = (v) => (v < 0 ? '−' : '') + fmt(Math.abs(v), Math.abs(v) < 1 ? 1 : 0);
            return (
                <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ display: 'block' }} fontFamily="Poppins, sans-serif" role="img"
                     aria-label="Graf över den inducerade spänningen u och flödet Φ genom spolen de senaste två sekunderna">
                    <line x1={pl} y1={pt - 6} x2={pl} y2={H - pb} stroke={COL.ink} strokeWidth="1" opacity="0.5" />
                    <line x1={pl} y1={mid} x2={W - pr} y2={mid} stroke="#38bdf8" strokeWidth="1.4" />
                    {[1, -1].map(sg => (
                        <g key={sg}>
                            <line x1={pl - 4} y1={mid - sg * amp} x2={pl} y2={mid - sg * amp} stroke={COL.ink} strokeWidth="1" />
                            <text x={pl - 6} y={mid - sg * amp + 4} textAnchor="end" fontSize="11" fill={COL.ind}>{st(sg * s)}</text>
                        </g>
                    ))}
                    <text x={pl - 6} y={mid + 4} textAnchor="end" fontSize="11" fill={COL.ink}>0</text>
                    <text x={pl + 8} y={pt + 2} fontSize="12" fill={COL.ind}><tspan fontStyle="italic">u</tspan> (V)</text>
                    <text x={pl + 62} y={pt + 2} fontSize="12" fill={COL.flux}><tspan fontStyle="italic">Φ</tspan> (streckad)</text>
                    <text x={W - pr} y={H - 6} textAnchor="end" fontSize="11" fill={COL.ink}><tspan fontStyle="italic">t</tspan></text>
                    <polyline points={fPts} fill="none" stroke={COL.flux} strokeWidth="1.8" strokeDasharray="6 4" strokeLinejoin="round" />
                    <polyline points={uPts} fill="none" stroke={COL.ind} strokeWidth="2.4" strokeLinejoin="round" />
                </svg>
            );
        }

        // ─────────────────────────────────────────────────────────────────
        // Formelkort
        // ─────────────────────────────────────────────────────────────────
        const Vbl = ({ lbl, children, color }) => (
            <div className="flex flex-col items-center">
                <span className="flbl">{lbl}</span>
                <span className="fnum" style={color ? { color } : null}>{children}</span>
                <span className="flbl" aria-hidden="true" style={{ visibility: 'hidden' }}>{lbl}</span>
            </div>
        );
        const Op = ({ children }) => <span className="fnum" style={{ padding: '0 5px' }}>{children}</span>;
        const FormulaCard = () => (
            <div className="glass-card fkort rounded-xl px-5 py-3 mb-5 flex flex-wrap items-center gap-x-10 gap-y-3">
                <div className="flex items-center">
                    <Vbl lbl="Spänning" color={COL.ind}><em>u</em></Vbl>
                    <Op>=</Op>
                    <Vbl lbl="Topp­spänning" color={COL.ind}><em>û</em></Vbl>
                    <Op>·</Op>
                    <span className="fnum">sin(</span>
                    <Vbl lbl="Vinkel­hastighet"><em>ω</em></Vbl>
                    <Vbl lbl="Tid"><em>t</em></Vbl>
                    <span className="fnum">)</span>
                </div>
                <div className="flex items-center">
                    <Vbl lbl="Topp­spänning" color={COL.ind}><em>û</em></Vbl>
                    <Op>=</Op>
                    <Vbl lbl="Antal varv"><em>N</em></Vbl>
                    <Op>·</Op>
                    <Vbl lbl="Flödes­täthet" color={COL.falt}><em>B</em></Vbl>
                    <Op>·</Op>
                    <Vbl lbl="Area"><em>A</em></Vbl>
                    <Op>·</Op>
                    <Vbl lbl="Vinkel­hastighet"><em>ω</em></Vbl>
                </div>
            </div>
        );

        const StSlider = ({ label, value, min, max, step, onChange, valueText }) => (
            <div className="st-slider">
                <div className="st-slider-top">
                    <span dangerouslySetInnerHTML={{ __html: label }} />
                    <span style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 600, fontSize: 13 }}>{valueText}</span>
                </div>
                <span className="sl-wrap">
                    <input type="range" min={min} max={max} step={step} value={value}
                           onChange={(e) => onChange(parseFloat(e.target.value))} />
                </span>
            </div>
        );
        const Reglage = ({ label, value, min, max, step, onChange, valueText, sub }) => (
            <div className="mb-3">
                <div className="mb-1 flex justify-between items-baseline">
                    <span className="text-sm" style={{ color: 'var(--lab-ink)' }} dangerouslySetInnerHTML={{ __html: label }} />
                    <span style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 600 }}>{valueText}</span>
                </div>
                <input type="range" className="w-full cursor-pointer" min={min} max={max} step={step} value={value}
                       onChange={(e) => onChange(parseFloat(e.target.value))} />
                {sub && <p className="text-xs mt-1" style={{ color: 'var(--lab-ink-muted)' }}>{sub}</p>}
            </div>
        );

        const EnergiRad = ({ label, P, max, color }) => (
            <div className="energi-rad">
                <span style={{ color: 'var(--lab-ink)' }}>{label}</span>
                <div className="bar"><div style={{ width: `${Math.max(0, Math.min(100, P / max * 100))}%`, background: color }} /></div>
                <span className="val">{fmt(Math.max(0, P) * 1000, P * 1000 < 10 ? 1 : 0)} mW</span>
            </div>
        );

        // ─────────────────────────────────────────────────────────────────
        // Appen
        // ─────────────────────────────────────────────────────────────────
        const App = () => {
            const [running, setRunning] = useState(true);
            const [drift, setDrift] = useState('vatten');
            const [q, setQ] = useState(0.85);
            const [N, setN] = useState(600);
            const [g, setG] = useState(0.5);
            const [karna, setKarna] = useState(true);
            const [lampa, setLampa] = useState(false);
            const [slow, setSlow] = useState(false);
            const [show, setShow] = useState({ ...SIM.p.show });
            const [vy, setVy] = useState('snett');
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [togglesOpen, setTogglesOpen] = useState(true);
            const [ut, setUt] = useState({ ...SIM.ut });
            const [buf, setBuf] = useState([]);
            const qSenast = useRef(0.85);
            const sceneWrapRef = useRef(null);

            useEffect(() => {
                Object.assign(SIM.p, { running, drift, q, N, g, karna, lampa, slow, show: { ...show } });
            }, [running, drift, q, N, g, karna, lampa, slow, show]);
            useEffect(() => { SIM.dirty = true; }, [g, N]);
            useEffect(() => { if (q > 0.01) qSenast.current = q; }, [q]);
            useEffect(() => {
                SIM.cb.brytare = () => setLampa(v => !v);
                SIM.cb.kran = () => { setDrift('vatten'); setQ(v => (v > 0.01 ? 0 : (qSenast.current || 0.85))); };
                SIM.cb.g = (v) => setG(v);
                SIM.cb.drift = (d) => setDrift(d);
                const id = setInterval(() => { setUt({ ...SIM.ut }); setBuf(SIM.buf.slice()); }, 70);
                return () => clearInterval(id);
            }, []);
            useEffect(() => {
                const h = () => setIsFullscreen(!!(document.fullscreenElement || document.webkitFullscreenElement));
                document.addEventListener('fullscreenchange', h);
                document.addEventListener('webkitfullscreenchange', h);
                return () => { document.removeEventListener('fullscreenchange', h); document.removeEventListener('webkitfullscreenchange', h); };
            }, []);
            const toggleFullscreen = () => {
                const el = sceneWrapRef.current;
                if (document.fullscreenElement || document.webkitFullscreenElement) {
                    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                } else {
                    (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
                }
            };
            const tShow = (k) => setShow(s => ({ ...s, [k]: !s[k] }));
            const valjVy = (n) => { setVy(n); if (SIM.vy) SIM.vy(n); };
            const forval = (namn) => {
                setRunning(true);
                if (namn === 'slackt') { setDrift('vatten'); setQ(0.85); setLampa(false); setN(600); setG(0.5); setKarna(true); }
                if (namn === 'tand') { setDrift('vatten'); setQ(0.85); setLampa(true); setN(600); setG(0.5); setKarna(true); }
                if (namn === 'vev') { setDrift('vev'); setLampa(true); setN(600); setG(0.5); setKarna(true); setSlow(false); }
                if (namn === 'karna') { setDrift('vatten'); setQ(0.85); setLampa(true); setN(600); setG(0.5); setKarna(false); }
            };
            const borjaOm = () => { forval('slackt'); setSlow(false); valjVy('snett'); };

            const varvS = ut.varv;
            const f = varvS;                 // ett varv ger en hel period
            const omega = 2 * Math.PI * varvS;
            const uEff = ut.uTopp / Math.SQRT2;
            const Pmax = Math.max(0.03, ut.Pin * 1.05, ut.Plampa + ut.Pspole + ut.Pfrik);
            const uKalk = N * ut.B * A_SPOLE * omega;
            const hint = drift === 'vev'
                ? 'Ta tag i veven och dra den runt. Klicka på strömbrytaren för att tända lampan.'
                : 'Dra i spolen för att flytta den. Klicka på strömbrytaren eller kranens vred. Dra i scenen för att vrida.';

            const reglageFs = (
                <React.Fragment>
                    {drift === 'vatten' && (
                        <StSlider label="Vattenflöde" value={q} min={0} max={1} step={0.01} onChange={setQ} valueText={`${Math.round(q * 100)} %`} />
                    )}
                    <StSlider label="Antal varv (<em>N</em>)" value={N} min={100} max={1200} step={100} onChange={setN} valueText={`${N}`} />
                    <StSlider label="Avstånd till spolen" value={g} min={0.3} max={5} step={0.1} onChange={setG} valueText={`${fmt(g, 1)} cm`} />
                </React.Fragment>
            );

            const sceneToggles = () => {
                if (!togglesOpen) return (
                    <button className="st-show-btn" onClick={() => setTogglesOpen(true)}
                            aria-label="Visa inställningar" title="Visa inställningar" aria-expanded="false">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             strokeWidth="2" strokeLinecap="round" aria-hidden="true">
                            <line x1="4" y1="8" x2="20" y2="8" />
                            <circle cx="14.5" cy="8" r="2.7" fill="currentColor" stroke="none" />
                            <line x1="4" y1="16" x2="20" y2="16" />
                            <circle cx="9.5" cy="16" r="2.7" fill="currentColor" stroke="none" />
                        </svg>
                    </button>
                );
                return (
                    <div className="scene-toggles">
                        <button className="st-hide" onClick={() => setTogglesOpen(false)}
                                aria-label="Dölj inställningar" title="Dölj inställningar" aria-expanded="true">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 strokeWidth="2.4" strokeLinecap="round" aria-hidden="true">
                                <path d="M6 6l12 12M18 6L6 18" />
                            </svg>
                        </button>
                        <div className="st-title">Visa</div>
                        <label><input type="checkbox" checked={show.falt} onChange={() => tShow('falt')} />
                            <span className="st-swatch" style={{ background: COL.falt }}></span><span>Magnetfältet <em>B</em></span></label>
                        <label><input type="checkbox" checked={show.flode} onChange={() => tShow('flode')} />
                            <span className="st-swatch" style={{ background: COL.flux }}></span><span>Flödet <em>Φ</em> i spolen</span></label>
                        <label><input type="checkbox" checked={show.strom} onChange={() => tShow('strom')} />
                            <span className="st-swatch" style={{ background: COL.ind }}></span><span>Strömmen <em>i</em></span></label>
                        <label><input type="checkbox" checked={show.kraft} onChange={() => tShow('kraft')} />
                            <span className="st-swatch" style={{ background: COL.kraft }}></span><span>Kraften på veven</span></label>
                        <div className="st-title mt">Scen</div>
                        <label><input type="checkbox" checked={karna} onChange={() => setKarna(v => !v)} /><span>Järnkärna i spolen</span></label>
                        <label><input type="checkbox" checked={slow} onChange={() => setSlow(v => !v)} /><span>Ultrarapid</span></label>
                        {isFullscreen && (
                            <React.Fragment>
                                <div className="st-title mt">Reglage</div>
                                <div className="st-sliders">{reglageFs}</div>
                                <div className="st-actions">
                                    <button className={'btn-toggle' + (lampa ? ' active' : '')} onClick={() => setLampa(v => !v)}>{lampa ? 'Släck lampan' : 'Tänd lampan'}</button>
                                    <button className="btn-toggle" onClick={() => setDrift(d => d === 'vatten' ? 'vev' : 'vatten')}>{drift === 'vatten' ? 'Veva själv' : 'Driv med vatten'}</button>
                                    <button className="btn-toggle" onClick={() => setRunning(r => !r)}>{running ? 'Pausa' : 'Fortsätt'}</button>
                                </div>
                            </React.Fragment>
                        )}
                    </div>
                );
            };

            return (
                <div className="min-h-screen dark-container px-4 md:px-8 pb-12" style={{ fontFamily: "'DM Sans', sans-serif" }}>
                    <div className="max-w-6xl mx-auto pt-6">
                        <div className="breadcrumb mb-4" style={{ fontSize: 13 }}>
                            <a href="index.html">Hem</a> / <a href="katalog.html#fy2">Fysik nivå 2</a> / Vattenkraftverket på labbänken
                        </div>
                        <h1 className="text-3xl md:text-4xl font-black tracking-tight" style={{ color: 'var(--lab-ink)' }}>Vattenkraftverket på labbänken</h1>
                        <p className="mt-2 mb-5" style={{ color: 'var(--lab-ink-soft)', maxWidth: 860 }}>
                            En vattenstråle från kranen får ett skovelhjul att snurra. På samma axel sitter en magnet
                            som roterar förbi en spole. Flödet genom spolen ändras hela tiden, och då induceras en
                            växelspänning, precis som i ett riktigt kraftverk. Tänd lampan och se vad som händer med
                            hjulet: energin till lampan måste komma någonstans ifrån. Flytta spolen, ändra antalet
                            varv eller veva själv.
                        </p>

                        <FormulaCard />

                        <main className="flex flex-col lg:flex-row gap-6">
                            <div className="lg:w-2/3 order-1">
                                <div className={"scene-wrap" + (isFullscreen ? " is-fs" : "")} data-theme="ljusPapper" ref={sceneWrapRef}>
                                    <GenScene wrapRef={sceneWrapRef} />
                                    <div className="scene-hint">{hint}</div>
                                    {sceneToggles()}
                                    <div className="fs-quick">
                                        <button className="fq-play" onClick={() => setRunning(r => !r)}
                                                aria-label={running ? 'Paus' : 'Start'} title={running ? 'Paus' : 'Start'}>
                                            {running ? (
                                                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                                    <rect x="6" y="5" width="4" height="14" rx="1" />
                                                    <rect x="14" y="5" width="4" height="14" rx="1" />
                                                </svg>
                                            ) : (
                                                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                                    <path d="M8 5.5v13l11-6.5z" />
                                                </svg>
                                            )}
                                        </button>
                                        <div className="fq-rows">
                                            <div className="fq-row">
                                                <span className="fq-lbl">Vattenflöde</span>
                                                <input type="range" min={0} max={1} step={0.01} value={q}
                                                       onChange={e => { setDrift('vatten'); setQ(parseFloat(e.target.value)); }} aria-label="Vattenflöde" />
                                            </div>
                                        </div>
                                    </div>
                                    <button className="fs-btn" onClick={toggleFullscreen} aria-label="Fullskärm"
                                            title={isFullscreen ? 'Lämna fullskärm' : 'Fullskärm'}>
                                        {isFullscreen ? (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M9 3v6H3" /><path d="M15 21v-6h6" /><path d="M21 9h-6V3" /><path d="M3 15h6v6" />
                                            </svg>
                                        ) : (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M3 9V3h6" /><path d="M21 9V3h-6" /><path d="M3 15v6h6" /><path d="M21 15v6h-6" />
                                            </svg>
                                        )}
                                    </button>
                                </div>

                                <div className="glass-card rounded-xl p-3 mt-4">
                                    <div className="flex flex-wrap justify-between items-baseline gap-2">
                                        <div className="flbl">Spänningen över spolen och flödet genom den</div>
                                        <div className="text-xs" style={{ color: 'var(--lab-ink-muted)' }}>de senaste {fmt(GRAF_T, 0)} sekunderna{slow ? ' (ultrarapid)' : ''}</div>
                                    </div>
                                    <Graf buf={buf} uTopp={ut.uTopp} />
                                    <p className="text-sm mt-1" style={{ color: 'var(--lab-ink-soft)' }}>
                                        Flödet är störst när magneten pekar rakt mot spolen, men då ändras det inte just
                                        i det ögonblicket, och spänningen är noll. Spänningen är störst när flödet passerar
                                        noll, för där ändras det snabbast.
                                    </p>
                                </div>

                                <div className="glass-card rounded-xl p-3 mt-4">
                                    <div className="flbl">Vart tar energin vägen?</div>
                                    <EnergiRad label={drift === 'vev' ? 'Din hand ger' : 'Vattnet ger hjulet'} P={ut.Pin} max={Pmax} color={drift === 'vev' ? '#8a2d2d' : COL.vatten} />
                                    <EnergiRad label="Lampan" P={ut.Plampa} max={Pmax} color={COL.lampa} />
                                    <EnergiRad label="Spolen blir varm" P={ut.Pspole} max={Pmax} color={COL.koppar} />
                                    <EnergiRad label="Friktion i lagren" P={ut.Pfrik} max={Pmax} color="#8d939b" />
                                    <p className="text-sm mt-2" style={{ color: 'var(--lab-ink-soft)' }}>
                                        {lampa
                                            ? 'Lampan är tänd. Strömmen i spolen ger ett eget magnetfält som bromsar magneten (Lenz lag), så hjulet måste uträtta arbete för att hålla farten. Därför går det långsammare.'
                                            : 'Kretsen är bruten. Ingen ström går, och då bromsar spolen inte magneten. Nästan all energi går till friktion, och hjulet snurrar fort. Tänd lampan och jämför.'}
                                    </p>
                                </div>
                            </div>

                            <div className="lg:w-1/3 order-2">
                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <div className="flbl mb-2">Färdiga försök</div>
                                    <div className="forval">
                                        <button className="btn-toggle" onClick={() => forval('slackt')}>Lampan släckt</button>
                                        <button className="btn-toggle" onClick={() => forval('tand')}>Tänd lampan</button>
                                        <button className="btn-toggle" onClick={() => forval('vev')}>Veva själv</button>
                                        <button className="btn-toggle" onClick={() => forval('karna')}>Utan järnkärna</button>
                                    </div>
                                </div>

                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <div className="flbl mb-2">Drivning</div>
                                    <div className="vy-seg two mb-3">
                                        <button className={drift === 'vatten' ? 'active' : ''} onClick={() => setDrift('vatten')}>Vatten</button>
                                        <button className={drift === 'vev' ? 'active' : ''} onClick={() => setDrift('vev')}>Veva själv</button>
                                    </div>
                                    {drift === 'vatten'
                                        ? <Reglage label="Vattenflöde" value={q} min={0} max={1} step={0.01} onChange={setQ} valueText={`${Math.round(q * 100)} %`} />
                                        : <p className="text-sm mb-3" style={{ color: 'var(--lab-ink-soft)' }}>Ta tag i veven längst fram på axeln och dra den runt. Kraften du behöver visas som en blå pil.</p>}
                                    <Reglage label="Antal varv <em>N</em>" value={N} min={100} max={1200} step={100} onChange={setN} valueText={`${N}`} />
                                    <Reglage label="Avstånd mellan magnet och spole" value={g} min={0.3} max={5} step={0.1} onChange={setG} valueText={`${fmt(g, 1)} cm`}
                                             sub="Du kan också dra i spolen." />
                                    <div className="grid grid-cols-2 gap-2">
                                        <button className={'btn-toggle' + (lampa ? ' active' : '')} onClick={() => setLampa(v => !v)}>{lampa ? 'Släck lampan' : 'Tänd lampan'}</button>
                                        <button className={'btn-toggle' + (karna ? ' active' : '')} onClick={() => setKarna(v => !v)}>Järnkärna</button>
                                        <button className="btn-toggle" onClick={() => setRunning(r => !r)}>{running ? 'Pausa' : 'Fortsätt'}</button>
                                        <button className="btn-toggle" onClick={borjaOm}>Börja om</button>
                                    </div>
                                </div>

                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <div className="flbl mb-2">Avläsning</div>
                                    <div className="readout">
                                        <div>
                                            <div className="rv">{fmt(varvS, 1)} Hz</div>
                                            <div className="rl">varvtal och frekvens <em>f</em></div>
                                        </div>
                                        <div>
                                            <div className="rv">{fmt(omega, 0)} rad/s</div>
                                            <div className="rl">vinkelhastighet <em>ω</em></div>
                                        </div>
                                        <div>
                                            <div className="rv" style={{ color: COL.ind }}>{fmt(ut.uTopp, 2)} V</div>
                                            <div className="rl">toppspänning <em>û</em></div>
                                        </div>
                                        <div>
                                            <div className="rv" style={{ color: COL.ind }}>{fmt(uEff, 2)} V</div>
                                            <div className="rl">effektivvärde <em>U</em></div>
                                        </div>
                                        <div>
                                            <div className="rv">{lampa ? fmt(ut.iTopp * 1000, 0) + ' mA' : '0'}</div>
                                            <div className="rl">toppström <em>î</em></div>
                                        </div>
                                        <div>
                                            <div className="rv">{drift === 'vev' ? fmt(ut.Fvev, 2) + ' N' : fmt(ut.B * 1000, 0) + ' mT'}</div>
                                            <div className="rl">{drift === 'vev' ? 'kraft på veven' : <span>flödestäthet <em>B</em> i spolen</span>}</div>
                                        </div>
                                    </div>
                                    <p className="text-xs mt-2" style={{ color: 'var(--lab-ink-muted)' }}>
                                        Kontroll: <em>N</em>&nbsp;·&nbsp;<em>B</em>&nbsp;·&nbsp;<em>A</em>&nbsp;·&nbsp;<em>ω</em> = {N}&nbsp;·&nbsp;{fmt(ut.B, 3)}&nbsp;T&nbsp;·&nbsp;6,16&nbsp;cm²&nbsp;·&nbsp;{fmt(omega, 1)}&nbsp;rad/s ≈ {fmt(uKalk, 2)}&nbsp;V.
                                        Lampan är märkt 1,2&nbsp;V och 0,1&nbsp;A.
                                    </p>
                                </div>

                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <div className="flbl mb-2">Vy</div>
                                    <div className="vy-seg">
                                        <button className={vy === 'snett' ? 'active' : ''} onClick={() => valjVy('snett')}>Snett</button>
                                        <button className={vy === 'fram' ? 'active' : ''} onClick={() => valjVy('fram')}>Framifrån</button>
                                        <button className={vy === 'ovan' ? 'active' : ''} onClick={() => valjVy('ovan')}>Ovanifrån</button>
                                    </div>
                                </div>
                            </div>
                        </main>

                        <div className="mt-8 grid md:grid-cols-2 gap-5 forkl" style={{ color: 'var(--lab-ink-soft)' }}>
                            <details className="glass-card rounded-xl p-4" open>
                                <summary className="accordion-head" style={{ color: 'var(--lab-ink)' }}>Så fungerar generatorn<span>+</span></summary>
                                <ol>
                                    <li><strong>Vattnet driver hjulet.</strong> Strålen träffar skovlarna och trycker
                                        dem nedåt. Hjulet, axeln och magneten börjar rotera.</li>
                                    <li><strong>Flödet genom spolen ändras.</strong> När nordändan pekar rakt mot
                                        spolen går mycket av magnetens fält genom den. Ett kvarts varv senare pekar
                                        magneten åt sidan, och flödet är noll. Ytterligare ett kvarts varv senare pekar
                                        sydändan mot spolen, och flödet går åt andra hållet.</li>
                                    <li><strong>En ändring av flödet inducerar en spänning</strong>,{' '}
                                        <em>e</em>&nbsp;=&nbsp;−<em>N</em>&thinsp;·&thinsp;Δ<em>Φ</em>/Δ<em>t</em>. Flödet
                                        varierar som en cosinusfunktion, och då varierar spänningen som en
                                        sinusfunktion: <em>u</em>&nbsp;=&nbsp;<em>û</em>&thinsp;·&thinsp;sin(<em>ωt</em>).</li>
                                    <li><strong>Spänningen byter tecken varje halvt varv.</strong> Det är en
                                        växelspänning, och frekvensen är lika med antalet varv per sekund.</li>
                                    <li><strong>Järnkärnan samlar fältet.</strong> Järn leder magnetfältet mycket
                                        bättre än luft, så flödet genom spolen blir flera gånger större.</li>
                                </ol>
                            </details>

                            <details className="glass-card rounded-xl p-4" open>
                                <summary className="accordion-head" style={{ color: 'var(--lab-ink)' }}>Pröva själv i simuleringen<span>+</span></summary>
                                <ul>
                                    <li><strong>Tänd lampan.</strong> Hjulet saktar in. Strömmen i spolen ger ett
                                        magnetfält som motverkar magnetens rörelse, så vattnet måste uträtta mer
                                        arbete. Titta på energistaplarna.</li>
                                    <li><strong>Stäng av vattnet</strong> (klicka på vredet) med lampan tänd och
                                        sedan med lampan släckt. Hur länge snurrar hjulet vidare i de två fallen?</li>
                                    <li><strong>Veva själv.</strong> Kraften du behöver är liten när lampan är släckt
                                        och växer när du tänder den. Vevar du fortare blir den större.</li>
                                    <li><strong>Dubbla antalet varv.</strong> Med vatten och släckt lampa blir
                                        toppspänningen dubbelt så stor, eftersom <em>û</em> är proportionell mot <em>N</em>.</li>
                                    <li><strong>Dra bort spolen.</strong> Fältet från en magnet avtar snabbt med
                                        avståndet. Redan några centimeter bort blir spänningen liten.</li>
                                    <li><strong>Slå på Ultrarapid</strong> och följ voltmeterns nål. Den pendlar
                                        mellan plus och minus. Lampan flimrar, eftersom den slocknar varje gång
                                        spänningen passerar noll.</li>
                                </ul>
                            </details>

                            <details className="glass-card rounded-xl p-4">
                                <summary className="accordion-head" style={{ color: 'var(--lab-ink)' }}>Riktiga kraftverk<span>+</span></summary>
                                <p>I ett vattenkraftverk faller vattnet genom en turbin, och turbinens axel driver
                                    en generator. Precis som här är det magneterna (elektromagneter på den roterande
                                    delen, rotorn) som snurrar, medan spolarna sitter still runt omkring (statorn).
                                    Då behövs inga släpringar för att föra ut den stora strömmen.</p>
                                <p>Generatorerna i det svenska elnätet roterar så att spänningen får frekvensen
                                    50&nbsp;Hz. En generator med ett par magnetpoler måste då snurra 50 varv per
                                    sekund. Stora vattenkraftsgeneratorer har i stället många polpar och kan gå
                                    långsamt.</p>
                                <p>Precis som lampan här bromsar hjulet, bromsas turbinerna när elförbrukningen
                                    ökar. Kraftverket släpper då på mer vatten för att hålla frekvensen.</p>
                            </details>

                            <details className="glass-card rounded-xl p-4">
                                <summary className="accordion-head" style={{ color: 'var(--lab-ink)' }}>Vanliga missförstånd<span>+</span></summary>
                                <ul>
                                    <li><strong>”Generatorn skapar energi.”</strong> Nej, den omvandlar rörelseenergi
                                        till elektrisk energi. Utan vatten eller hand som driver den blir det ingen el.</li>
                                    <li><strong>”Spänningen är störst när magneten pekar mot spolen.”</strong> Då är
                                        flödet störst, men spänningen beror på hur snabbt flödet ändras. I just det
                                        läget ändras det inte alls.</li>
                                    <li><strong>”Det är lika tungt att snurra generatorn oavsett vad som är
                                        inkopplat.”</strong> Nej, ju mer ström som tas ut, desto större bromsande
                                        kraft. En cykeldynamo känns tyngre när lampan är på.</li>
                                    <li><strong>”Magneten slits ut när den används.”</strong> Nej, magneten förlorar
                                        ingen energi. Energin kommer från det som driver axeln.</li>
                                </ul>
                            </details>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script src="feedback.js" defer></script>
    <script src="sim-dock.js" defer></script>
    <script src="data/katalog.js"></script>
    <script src="section-nav.js"></script>
    <!-- Cloudflare Web Analytics: cookiefri besöksmätning, se CLAUDE.md. -->
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js"
            data-cf-beacon='{"token": "366677ecfe014a76b73f5bc78a489e0e"}'></script>
