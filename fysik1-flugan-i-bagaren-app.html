            pressButton(id) { this.btnFlash = { id, until: performance.now() + 160 }; }

            hoverCursor(e) {
                const p = this.pointerToLogical(e);
                if (!p) return;
                let cur = '';
                if (this.scaleButtonAt(e)) cur = 'pointer';
                else {
                    const fx = CX + (this.x + this.wander) * PX;
                    const fy = BOT_Y - this.z * PX - 4;
                    if (Math.hypot(p.x - fx, p.y - fy) < 34) cur = 'grab';
                }
                this.canvas.style.cursor = cur;
            }

            pointerToLogical(e) {
                const rect = this.canvas.getBoundingClientRect();
                const v = this._view;
                if (!v) return null;
                const cx = (e.clientX - rect.left) * (this.canvas.width / rect.width);
                const cy = (e.clientY - rect.top) * (this.canvas.height / rect.height);
                return { x: (cx - v.ox) / v.S, y: (cy - v.oy) / v.S };
            }

            tryGrab(e) {
                const p = this.pointerToLogical(e);
                if (!p) return false;
                const fx = CX + (this.x + this.wander) * PX;
                const fy = BOT_Y - this.z * PX - 4;
                if (Math.hypot(p.x - fx, p.y - fy) < 34) {
                    this.dragTarget = this.z;
                    this.xT = this.x;
                    return true;
                }
                return false;
            }

            dragTo(e) {
                const p = this.pointerToLogical(e);
                if (!p || this.dragTarget === null) return;
                const R = D_BEAKER / 2;
                let xT = clamp((p.x - CX) / PX, -0.066, 0.075);
                let zT = (BOT_Y - p.y) / PX;
                if (this.cfg.lid && Math.abs(this.x) < R && this.z < this.H) {
                    // locket på och flugan därinne: instängd i bägaren
                    xT = clamp(xT, -(R - 0.006), R - 0.006);
                    zT = clamp(zT, 0.002, this.H - 0.012);
                } else {
                    // locket blockerar mynningen utifrån — men det går att
                    // landa ovanpå det
                    if (this.cfg.lid && Math.abs(xT) < R && zT < this.H + 0.004) zT = this.H + 0.004;
                    zT = clamp(zT, this.floorZof(xT) + 0.002, this.H + 0.055);
                }
                this.dragTarget = zT;
                this.xT = xT;
                // väggkollisionen i step() hindrar sidbyte under mynningsnivån
                // — flugan pressas mot glaset tills den lyfts över kanten
            }

            release() {
                // stanna kvar och hovra där flugan släpptes (om den flyger);
                // sidledsmålet xT ligger kvar så att den inte glider tillbaka
                if (this.dragTarget !== null && this.dragTarget > this.floorZof(this.xT) + 0.006) {
                    this.cfg.hoverH = clamp(this.dragTarget, 0.01, this.H + 0.05);
                }
                this.dragTarget = null;
            }
        }

        // ── Toppnivå-komponenter ──────────────────────────────────
        const MiniSlider = ({ label, value, min, max, step = 1, unit, onChange, decimals = 1, fmt }) => (
            <div>
                <div className="flex justify-between items-center mb-1">
                    <span className="text-xs font-semibold uppercase tracking-wide" style={{ color: 'var(--lab-ink-soft, #3a4151)', letterSpacing: '0.06em', fontFamily: 'var(--lab-font-mono, monospace)' }}>{label}</span>
                    <span className="font-mono text-sm font-semibold" style={{ color: 'var(--lab-accent, #c8324a)' }}>
                        {fmt ? fmt(value) : (formatNum(value, decimals) + (unit ? ' ' : ''))}{fmt ? '' : <span className="text-xs" style={{ color: 'var(--lab-ink-muted, #8a8579)' }}>{unit}</span>}
                    </span>
                </div>
                <input type="range" min={min} max={max} step={step} value={value}
                    onChange={(e) => onChange(parseFloat(e.target.value))}
                    className="w-full rounded appearance-none cursor-pointer transition-all" />
            </div>
        );

        // Kompakt glidare för rutan uppe till höger (fullskärm)
        const BoxSlider = ({ label, value, min, max, step, onChange, fmt }) => (
            <div className="st-sl">
                <div className="st-sl-row">
                    <span>{label}</span>
                    <span className="st-sl-val">{fmt(value)}</span>
                </div>
                <input type="range" min={min} max={max} step={step} value={value}
                    onChange={(e) => onChange(parseFloat(e.target.value))} />
            </div>
        );

        const selectStyle = {
            width: '100%', border: '1px solid var(--lab-line-strong, rgba(15,22,32,0.28))',
            background: 'var(--lab-bg-panel, #ffffff)', color: 'var(--lab-ink, #0f1620)',
            borderRadius: 6, padding: '6px 8px', fontSize: 13.5, cursor: 'pointer',
        };

        // ── Huvudapp ──────────────────────────────────────────────
        const App = () => {
            const [mode, setMode] = useState('utforska');           // 'utforska' | 'gissa'
            const [scenarioId, setScenarioId] = useState('hovrar');
            const [massMg, setMassMg] = useState(12);
            const [rho, setRho] = useState(RHO0);
            const [hoverH, setHoverH] = useState(0.06);
            const [beakerH, setBeakerH] = useState(0.12);
            const [lid, setLid] = useState(false);
            const [speedIdx, setSpeedIdx] = useState(0);
            const [showAir, setShowAir] = useState(true);
            const [sound, setSound] = useState(true);
            const [showPressure, setShowPressure] = useState(true);
            const [boundary, setBoundary] = useState('ingen');
            const [paused, setPaused] = useState(false);
            const [readout, setReadout] = useState(null);
            const [gissa, setGissa] = useState({ ch: null, phase: 'gissa', guess: null, streak: 0, right: 0, total: 0 });
            const [isFullscreen, setIsFullscreen] = useState(false);

            const sceneWrapRef = useRef(null);
            const canvasRef = useRef(null);
            const simRef = useRef(null);
            const tareRef = useRef(0);

            // Skapa simulatorn en gång
            useEffect(() => {
                const sim = new FlySim(canvasRef.current);
                simRef.current = sim;
                window.__flySim = sim;   // för fysiktesterna (.claude/test-fluga-fysik.js)
                sim.onReadout = (r) => setReadout(r);
                // Ljudet får bara starta efter en användargest (autoplay-
                // policyn) — lås upp vid FÖRSTA interaktionen var som helst
                // på sidan, inte bara i scenen. pointerup/keydown räknas som
                // gest i alla webbläsare (pointerdown gör det inte vid touch).
                const unlock = () => sim.resumeAudio();
                document.addEventListener('pointerdown', unlock, { passive: true });
                document.addEventListener('pointerup', unlock, { passive: true });
                document.addEventListener('keydown', unlock);
                return () => {
                    document.removeEventListener('pointerdown', unlock);
                    document.removeEventListener('pointerup', unlock);
                    document.removeEventListener('keydown', unlock);
                    sim.dispose();
                };
            }, []);

            // Spegla UI-läget in i simulatorn
            useEffect(() => {
                const sim = simRef.current;
                if (!sim) return;
                Object.assign(sim.cfg, {
                    massMg, rho, hoverH, beakerH, lid, speedIdx,
                    showAir, showPressure, boundary, paused, sound,
                });
            }, [massMg, rho, hoverH, beakerH, lid, speedIdx, showAir, showPressure, boundary, paused, sound]);

            // Starta ett förlopp (med ev. förloppsspecifika förutsättningar)
            const runScenario = useCallback((id) => {
                const sim = simRef.current;
                if (!sim) return;
                setScenarioId(id);
                sim.resumeAudio();
                if (id === 'vakuum') { setRho(0); setLid(true); }
                else if (id === 'mynning') { setLid(false); if (rho < 0.3) setRho(RHO0); }
                else if (rho < 0.3) setRho(RHO0);
                // cfg uppdateras av effekten ovan först nästa render — sätt direkt också
                if (id === 'vakuum') { sim.cfg.rho = 0; sim.cfg.lid = true; }
                else if (id === 'mynning') { sim.cfg.lid = false; if (sim.cfg.rho < 0.3) sim.cfg.rho = RHO0; }
                else if (sim.cfg.rho < 0.3) sim.cfg.rho = RHO0;
                sim.startScenario(id);
                setPaused(false);
                sim.cfg.paused = false;
            }, [rho]);

            // Gissa-läget: se till att det finns en utmaning
            useEffect(() => {
                if (mode === 'gissa' && !gissa.ch) {
                    const id = GUESS_POOL[Math.floor(Math.random() * GUESS_POOL.length)];
                    setGissa(g => ({ ...g, ch: id, phase: 'gissa', guess: null }));
                    // ställ scenen: flugan sitter still tills eleven gissat
                    const sim = simRef.current;
                    if (sim) { sim.startScenario('sitter'); setScenarioId('sitter'); }
                }
            }, [mode, gissa.ch]);

            const nextChallenge = () => {
                let id = GUESS_POOL[Math.floor(Math.random() * GUESS_POOL.length)];
                if (id === gissa.ch && GUESS_POOL.length > 1) {
                    id = GUESS_POOL[(GUESS_POOL.indexOf(id) + 1) % GUESS_POOL.length];
                }
                setGissa(g => ({ ...g, ch: id, phase: 'gissa', guess: null }));
                const sim = simRef.current;
                if (sim) { sim.startScenario('sitter'); setScenarioId('sitter'); }
            };

            const answer = (guess) => {
                if (gissa.phase !== 'gissa' || !gissa.ch) return;
                setGissa(g => ({ ...g, phase: 'kor', guess }));
                runScenario(gissa.ch);
            };

            // När förloppet nått sin karakteristiska fas → visa facit
            useEffect(() => {
                if (mode !== 'gissa' || gissa.phase !== 'kor' || !readout) return;
                if (readout.scenarioId === gissa.ch && readout.facitReady) {
                    const sc = SCENARIOS.find(s => s.id === gissa.ch);
                    const ok = gissa.guess === sc.svar;
                    setGissa(g => ({
                        ...g, phase: 'svar',
                        total: g.total + 1,
                        right: g.right + (ok ? 1 : 0),
                        streak: ok ? g.streak + 1 : 0,
                    }));
                }
            }, [readout, mode, gissa.phase, gissa.ch, gissa.guess]);

            // ── Fullskärm ──
            useEffect(() => {
                const handler = () => {
                    setIsFullscreen(
                        document.fullscreenElement === sceneWrapRef.current ||
                        document.webkitFullscreenElement === sceneWrapRef.current
                    );
                };
                document.addEventListener('fullscreenchange', handler);
                document.addEventListener('webkitfullscreenchange', handler);
                return () => {
                    document.removeEventListener('fullscreenchange', handler);
                    document.removeEventListener('webkitfullscreenchange', handler);
                };
            }, []);

            const toggleFullscreen = () => {
                const el = sceneWrapRef.current;
                if (!el) return;
                const isFs = document.fullscreenElement || document.webkitFullscreenElement;
                if (isFs) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
            };

            // ── Dra flugan ──
            const dragging = useRef(false);
            const onPointerDown = (e) => {
                const sim = simRef.current;
                if (!sim) return;
                sim.resumeAudio();
                const btn = sim.scaleButtonAt(e);
                if (btn === 'noll') { sim.pressButton('noll'); sim.tare(); return; }
                if (btn === 'onoff') { sim.pressButton('onoff'); sim.scaleOn = !sim.scaleOn; return; }
                if (sim.tryGrab(e)) {
                    dragging.current = true;
                    e.target.setPointerCapture(e.pointerId);
                }
            };
            const onPointerMove = (e) => {
                const sim = simRef.current;
                if (!sim) return;
                if (dragging.current) { sim.dragTo(e); return; }
                sim.hoverCursor(e);
            };
            const onPointerUp = () => {
                if (!dragging.current) return;
                dragging.current = false;
                simRef.current?.release();
            };

            const sim = simRef.current;
            const mg_uN = massMg * G_ACC;   // flugans tyngd i µN (1 mg ↔ 9,82 µN)
            const speed = SPEEDS[speedIdx];
            const currentScenario = SCENARIOS.find(s => s.id === scenarioId);

            // ── Reglage-JSX (sidopanel + fullskärm) ──
            const sliders = (tag) => (
                <div className="p-4 glass-card flex flex-col gap-3" style={{ borderRadius: '6px' }}>
                    <div className="text-sm font-semibold uppercase tracking-wide" style={{ color: 'var(--lab-ink-soft, #3a4151)', letterSpacing: '0.06em', fontFamily: 'var(--lab-font-mono, monospace)' }}>Reglage</div>
                    <MiniSlider label="Uppspelning" value={speedIdx} min={0} max={SPEEDS.length - 1} step={1}
                        onChange={setSpeedIdx}
                        fmt={(v) => SPEEDS[v] === 1 ? 'realtid' : '1/' + formatNum(1 / SPEEDS[v], 0) + '×'} />
                    <MiniSlider label={<span>Flugans massa <em>m</em></span>} value={massMg} min={5} max={30} step={1} unit="mg"
                        onChange={setMassMg} decimals={0} />
                    <MiniSlider label={<span>Lufttäthet <em>ρ</em></span>} value={rho} min={0} max={1.3} step={0.01} unit="kg/m³"
                        onChange={setRho} decimals={2} />
                    <MiniSlider label="Hovringshöjd" value={hoverH * 100} min={1} max={beakerH * 100 - 1} step={0.5} unit="cm"
                        onChange={(v) => setHoverH(v / 100)} decimals={1} />
                    <MiniSlider label="Bägarens höjd" value={beakerH * 100} min={8} max={16} step={0.5} unit="cm"
                        onChange={(v) => { setBeakerH(v / 100); if (hoverH > v / 100 - 0.01) setHoverH(v / 100 - 0.02); }} decimals={1} />
                    <div>
                        <div className="text-xs font-semibold uppercase tracking-wide mb-1" style={{ color: 'var(--lab-ink-soft, #3a4151)', letterSpacing: '0.06em', fontFamily: 'var(--lab-font-mono, monospace)' }}>Systemgräns (frilagd kropp)</div>
                        <select value={boundary} onChange={(e) => setBoundary(e.target.value)} style={selectStyle}>
                            <option value="ingen">Ingen</option>
                            <option value="fluga">Bara flugan</option>
                            <option value="luft">Bara luften i bägaren</option>
                            <option value="hela">Hela systemet (bägare + luft + fluga)</option>
                        </select>
                    </div>
                </div>
            );

            const scenarioButtons = (tag) => (
                <div className="p-4 glass-card flex flex-col gap-2" style={{ borderRadius: '6px' }}>
                    <div className="text-sm font-semibold uppercase tracking-wide" style={{ color: 'var(--lab-ink-soft, #3a4151)', letterSpacing: '0.06em', fontFamily: 'var(--lab-font-mono, monospace)' }}>Förlopp</div>
                    {SCENARIOS.map(sc => (
                        <button key={sc.id + tag} type="button"
                            className={'preset-btn' + (scenarioId === sc.id ? ' p-active' : '')}
                            onClick={() => runScenario(sc.id)}>
                            <span className="p-title">{sc.name}</span>
                            <span className="p-desc">{sc.desc}</span>
                        </button>
                    ))}
                    {currentScenario && mode === 'utforska' && (
                        <div className="text-xs mt-1" style={{ color: 'var(--lab-ink-soft, #3a4151)', lineHeight: 1.55 }}>
                            {currentScenario.explain}
                        </div>
                    )}
                </div>
            );

            const gissaSc = gissa.ch ? SCENARIOS.find(s => s.id === gissa.ch) : null;
            const gissaOk = gissaSc && gissa.guess === gissaSc.svar;
            const gissaCard = (
                <div className="p-4 glass-card flex flex-col gap-3" style={{ borderRadius: '6px' }}>
                    <div className="text-sm font-semibold uppercase tracking-wide" style={{ color: 'var(--lab-ink-soft, #3a4151)', letterSpacing: '0.06em', fontFamily: 'var(--lab-font-mono, monospace)' }}>Förutsäg</div>
                    {gissaSc && (
                        <React.Fragment>
                            <div className="text-sm" style={{ color: 'var(--lab-ink, #0f1620)' }}>
                                <strong>{gissaSc.name}.</strong> {gissaSc.desc}
                            </div>
                            <div className="text-sm" style={{ color: 'var(--lab-ink-soft, #3a4151)' }}>
                                Vad visar vågen under förloppet, jämfört med när flugan
                                sitter stilla på botten?
                            </div>
                            {gissa.phase === 'gissa' && (
                                <div className="flex gap-2">
                                    {['Ökar', 'Oförändrat', 'Minskar'].map(g => (
                                        <button key={g} type="button" className="guess-btn" onClick={() => answer(g)}>{g}</button>
                                    ))}
                                </div>
                            )}
                            {gissa.phase === 'kor' && (
                                <div className="text-sm font-semibold" style={{ color: 'var(--lab-ink-soft, #3a4151)' }}>
                                    Du gissade "{gissa.guess}" — titta på grafen …
                                </div>
                            )}
                            {gissa.phase === 'svar' && (
                                <React.Fragment>
                                    <div className="text-sm font-semibold" style={{ color: gissaOk ? '#2d6a3e' : 'var(--lab-accent, #c8324a)' }}>
                                        {gissaOk ? 'Rätt! Utslaget ' + gissaSc.svar.toLowerCase() + (gissaSc.svar === 'Oförändrat' ? ' — det är oförändrat.' : '.')
                                            : 'Inte riktigt — rätt svar är "' + gissaSc.svar + '".'}
                                    </div>
                                    <div className="text-sm" style={{ color: 'var(--lab-ink-soft, #3a4151)', lineHeight: 1.55 }}>
                                        {gissaSc.explain}
                                    </div>
                                    <button type="button" className="guess-btn" onClick={nextChallenge}>Nästa förlopp</button>
                                </React.Fragment>
                            )}
                            <div className="text-xs" style={{ color: 'var(--lab-ink-muted, #8a8579)' }}>
                                Rätt: {gissa.right} av {gissa.total}{gissa.streak >= 2 ? ' — svit: ' + gissa.streak : ''}
                            </div>
                        </React.Fragment>
                    )}
                </div>
            );

            const fmtuN = (v) => (Math.abs(v) < 0.05 ? '0' : fmtSmart(v, 1)) + ' µN';

            return (
                <div className="min-h-screen dark-container px-4 md:px-8 pb-8 pt-4 font-sans" style={{ fontFamily: 'Poppins, sans-serif' }}>
                    <div className="max-w-6xl mx-auto">
                        <div className="breadcrumb mb-6">
                            <a href="index.html">Hem</a> / <a href="katalog.html#fy1">Fysik nivå 1</a> / Flugan i bägaren
                        </div>
                    </div>

                    <header className="max-w-6xl mx-auto mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h1 className="text-3xl md:text-4xl font-black tracking-tight glow-text">
                                Flugan i bägaren
                            </h1>
                            {/* Formelkort: N = M·g + Δp/Δt med ord-etiketter, allt på en mittlinje */}
                            <div className="mt-3 flex items-center gap-3 flex-wrap" style={{ fontFamily: 'Poppins, sans-serif', color: 'var(--lab-ink, #0f1620)' }}>
                                <div className="flex flex-col items-center">
                                    <span className="text-xs font-semibold" style={{ color: 'var(--lab-ink-muted, #8a8579)', letterSpacing: '0.06em', textTransform: 'uppercase' }}>Vågens kraft</span>
                                    <span className="text-2xl font-bold"><em>N</em></span>
                                    <span className="text-xs font-semibold" aria-hidden="true" style={{ visibility: 'hidden' }}>Vågens kraft</span>
                                </div>
                                <div className="flex flex-col items-center">
                                    <span className="text-xs" aria-hidden="true" style={{ visibility: 'hidden' }}>=</span>
                                    <span className="text-xl">=</span>
                                    <span className="text-xs" aria-hidden="true" style={{ visibility: 'hidden' }}>=</span>
                                </div>
                                <div className="flex flex-col items-center">
                                    <span className="text-xs font-semibold" style={{ color: 'var(--lab-ink-muted, #8a8579)', letterSpacing: '0.06em', textTransform: 'uppercase' }}>Systemets tyngd</span>
                                    <span className="text-2xl font-bold"><em>M</em> · <em>g</em></span>
                                    <span className="text-xs font-semibold" aria-hidden="true" style={{ visibility: 'hidden' }}>Systemets tyngd</span>
                                </div>
                                <div className="flex flex-col items-center">
                                    <span className="text-xs" aria-hidden="true" style={{ visibility: 'hidden' }}>+</span>
                                    <span className="text-xl">+</span>
                                    <span className="text-xs" aria-hidden="true" style={{ visibility: 'hidden' }}>+</span>
                                </div>
                                <div className="flex flex-col items-center">
                                    <span className="text-xs font-semibold" style={{ color: 'var(--lab-ink-muted, #8a8579)', letterSpacing: '0.06em', textTransform: 'uppercase' }}>Rörelsemängdsändring per tid</span>
                                    <span className="text-xl font-bold leading-none flex flex-col items-center">
                                        <span style={{ padding: '0 6px' }}>Δ<em>p</em></span>
                                        <span style={{ borderTop: '2px solid currentColor', padding: '0 6px' }}>Δ<em>t</em></span>
                                    </span>
                                    <span className="text-xs font-semibold" aria-hidden="true" style={{ visibility: 'hidden' }}>Rörelsemängdsändring per tid</span>
                                </div>
                            </div>
                            <p className="mt-2" style={{ color: 'var(--lab-ink-soft, #3a4151)' }}>
                                En bägare står på en känslig våg, och en fluga sitter på botten. Vad händer med
                                utslaget när flugan lyfter? Vågen i simuleringen räknar aldrig med facit — den känner
                                bara kontaktkrafter och luftens tryck mot glaset. Kör förloppen, sakta ner till
                                ultrarapid och se hur flugans tyngd tar vägen genom luften ner i bägaren.
                            </p>
                        </div>

                        <div className="flex flex-col items-start md:items-end gap-2 flex-shrink-0">
                            {/* Växlingen mellan avsnittets två simuleringar sköts av
                                avsnittsraden överst på sidan (section-nav.js) — lägg
                                inga egna flikar för det här. */}
                            {/* Läge inom denna simulering */}
                            <div>
                                <div className="text-right mb-1" style={{ fontSize: 10, letterSpacing: '0.08em', textTransform: 'uppercase', color: 'var(--lab-ink-muted, #8a8579)', fontWeight: 600, fontFamily: 'var(--lab-font-mono, monospace)' }}>Läge</div>
                                <div className="p-1 flex gap-1" style={{ background: 'var(--lab-bg, #f3eee4)', border: '1px solid var(--lab-line-strong, rgba(15,22,32,0.28))', borderRadius: '6px' }}>
                                    <button onClick={() => setMode('utforska')}
                                        className={`tab-button px-4 py-2 rounded text-sm font-semibold border ${mode === 'utforska' ? 'tab-active' : ''}`}>
                                        Utforska
                                    </button>
                                    <button onClick={() => { setMode('gissa'); setGissa(g => ({ ...g, ch: null })); }}
                                        className={`tab-button px-4 py-2 rounded text-sm font-semibold border ${mode === 'gissa' ? 'tab-active' : ''}`}>
                                        Förutsäg
                                    </button>
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto flex flex-col lg:flex-row gap-6">
                        {/* Scen */}
                        <div className="flex-grow lg:w-2/3 order-1">
                            <div className="glass-card rounded-2xl overflow-hidden">
                                <div className="scene-wrap relative" data-theme="ljusPapper" ref={sceneWrapRef}>
                                    <canvas ref={canvasRef} width={VB_W} height={VB_H}
                                        role="img"
                                        aria-label="En glasbägare står på en laboratorievåg. En fluga flyger inne i bägaren, luftens strömning visas som partiklar och vågens utslag ritas i en graf."
                                        onPointerDown={onPointerDown} onPointerMove={onPointerMove}
                                        onPointerUp={onPointerUp} onPointerCancel={onPointerUp} />

                                    <button className="fs-btn" onClick={toggleFullscreen} aria-label="Fullskärm"
                                        title={isFullscreen ? 'Lämna fullskärm' : 'Fullskärm'}>
                                        {isFullscreen ? (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M9 3v6H3" /><path d="M15 21v-6h6" /><path d="M21 9h-6V3" /><path d="M3 15h6v6" />
                                            </svg>
                                        ) : (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M3 9V3h6" /><path d="M21 9V3h-6" /><path d="M3 15v6h6" /><path d="M21 15v6h-6" />
                                            </svg>
                                        )}
                                    </button>

                                    {/* Ljud på/av — egen ikonknapp uppe till höger,
                                        samma mönster som minisimuleringarna. */}
                                    <button className="snd-btn"
                                        onClick={() => { const v = !sound; setSound(v); if (v) simRef.current?.resumeAudio(); }}
                                        aria-label="Ljud på/av"
                                        title={sound ? 'Stäng av ljudet' : 'Slå på ljudet'}>
                                        {sound ? (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M11 5 6 9H3v6h3l5 4z" /><path d="M15.5 8.5a5 5 0 0 1 0 7" /><path d="M18.5 5.5a9 9 0 0 1 0 13" />
                                            </svg>
                                        ) : (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M11 5 6 9H3v6h3l5 4z" /><line x1="16" y1="9" x2="22" y2="15" /><line x1="22" y1="9" x2="16" y2="15" />
                                            </svg>
                                        )}
                                    </button>

                                    {/* Visningsval + styrknappar — uppe till höger.
                                        I FULLSKÄRM ligger även förloppsvalet och
                                        glidarna här, så att scenen aldrig skyms av
                                        någon panel (se kommentaren vid .scene-toggles
                                        i sidans <style>). */}
                                    <div className="scene-toggles">
                                        {isFullscreen && (mode === 'gissa' ? (
                                            <React.Fragment>
                                                <div className="st-title">Förutsäg</div>
                                                {gissaSc && (
                                                    <React.Fragment>
                                                        <div className="st-txt"><strong>{gissaSc.name}</strong></div>
                                                        {gissa.phase === 'gissa' && (
                                                            <div className="st-stack">
                                                                {['Ökar', 'Oförändrat', 'Minskar'].map(g => (
                                                                    <button key={g} type="button" className="st-btn"
                                                                        onClick={() => answer(g)}>{g}</button>
                                                                ))}
                                                            </div>
                                                        )}
                                                        {gissa.phase === 'kor' && (
                                                            <div className="st-txt">Du gissade ”{gissa.guess}” — titta på grafen …</div>
                                                        )}
                                                        {gissa.phase === 'svar' && (
                                                            <React.Fragment>
                                                                <div className="st-txt" style={{ color: gissaOk ? '#2d6a3e' : 'var(--lab-accent, #c8324a)', fontWeight: 600 }}>
                                                                    {gissaOk ? 'Rätt! ' + gissaSc.svar : 'Fel — rätt svar: ' + gissaSc.svar}
                                                                </div>
                                                                <div className="st-stack">
                                                                    <button type="button" className="st-btn" onClick={nextChallenge}>Nästa förlopp</button>
                                                                </div>
                                                            </React.Fragment>
                                                        )}
                                                        <div className="st-txt" style={{ color: 'var(--lab-ink-muted, #8a8579)' }}>
                                                            Rätt: {gissa.right} av {gissa.total}
                                                        </div>
                                                    </React.Fragment>
                                                )}
                                            </React.Fragment>
                                        ) : (
                                            <React.Fragment>
                                                <div className="st-title">Förlopp</div>
                                                <select className="st-select" value={scenarioId}
                                                    onChange={(e) => runScenario(e.target.value)}>
                                                    {SCENARIOS.map(sc => (
                                                        <option key={sc.id} value={sc.id}>{sc.name}</option>
                                                    ))}
                                                </select>
                                            </React.Fragment>
                                        ))}
                                        <div className={'st-title' + (isFullscreen ? ' mt' : '')}>Visa</div>
                                        <label>
                                            <input type="checkbox" checked={showAir} onChange={(e) => setShowAir(e.target.checked)} />
                                            <span>Luftströmning</span>
                                        </label>
                                        <label>
                                            <input type="checkbox" checked={showPressure} onChange={(e) => setShowPressure(e.target.checked)} />
                                            <span>Tryck mot botten</span>
                                        </label>
                                        <div className="st-title mt">Bägare</div>
                                        <label>
                                            <input type="checkbox" checked={lid} onChange={(e) => setLid(e.target.checked)} />
                                            <span>Lock på bägaren</span>
                                        </label>
                                        <div className="st-actions">
                                            <button type="button" className="st-btn" onClick={() => setPaused(p => !p)}>
                                                {paused ? 'Starta' : 'Pausa'}
                                            </button>
                                            <button type="button" className="st-btn" onClick={() => runScenario(scenarioId)}>Börja om</button>
                                        </div>
                                        <div className="st-actions" style={{ marginTop: 4 }}>
                                            <button type="button" className="st-btn" onClick={() => simRef.current && simRef.current.tare()}>Nollställ vågen</button>
                                        </div>
                                        {isFullscreen && (
                                            <React.Fragment>
                                                <div className="st-title mt">Reglage</div>
                                                <BoxSlider label="Uppspelning" value={speedIdx} min={0} max={SPEEDS.length - 1} step={1}
                                                    onChange={setSpeedIdx}
                                                    fmt={(v) => SPEEDS[v] === 1 ? 'realtid' : '1/' + formatNum(1 / SPEEDS[v], 0)} />
                                                <BoxSlider label="Flugans massa" value={massMg} min={5} max={30} step={1}
                                                    onChange={setMassMg} fmt={(v) => formatNum(v, 0) + ' mg'} />
                                                <BoxSlider label="Lufttäthet" value={rho} min={0} max={1.3} step={0.01}
                                                    onChange={setRho} fmt={(v) => formatNum(v, 2) + ' kg/m³'} />
                                                <BoxSlider label="Hovringshöjd" value={hoverH * 100} min={1} max={beakerH * 100 - 1} step={0.5}
                                                    onChange={(v) => setHoverH(v / 100)} fmt={(v) => formatNum(v, 1) + ' cm'} />
                                                <BoxSlider label="Bägarens höjd" value={beakerH * 100} min={8} max={16} step={0.5}
                                                    onChange={(v) => { setBeakerH(v / 100); if (hoverH > v / 100 - 0.01) setHoverH(v / 100 - 0.02); }}
                                                    fmt={(v) => formatNum(v, 1) + ' cm'} />
                                                <div className="st-title mt">Systemgräns</div>
                                                <select className="st-select" value={boundary}
                                                    onChange={(e) => setBoundary(e.target.value)}>
                                                    <option value="ingen">Ingen</option>
                                                    <option value="fluga">Bara flugan</option>
                                                    <option value="luft">Bara luften i bägaren</option>
                                                    <option value="hela">Hela systemet</option>
                                                </select>
                                            </React.Fragment>
                                        )}
                                    </div>
                                </div>
                            </div>

                            {/* Förklaring under scenen */}
                            <div className="mt-6 p-4 text-sm glass-card" style={{ borderRadius: '6px', color: 'var(--lab-ink-soft, #3a4151)' }}>
                                <div className="font-semibold mb-2" style={{ color: 'var(--lab-ink, #0f1620)' }}>Så hänger det ihop</div>
                                <ul className="list-disc pl-5 flex flex-col gap-1">
                                    <li><strong>"Flugan rör ju inte botten — då försvinner väl dess tyngd?"</strong> Nej.
                                        Kraftöverföring kräver inte kontakt med benen: flugans vingar accelererar luft nedåt
                                        (Newtons tredje lag — luften trycker upp flugan, flugan trycker ner luften), och i en
                                        sluten bägare måste hela det rörelsemängdsflödet till slut tas upp av botten och
                                        väggarna. Flugans tyngd går via luften i stället för via benen.</li>
                                    <li>Vågen visar systemets tyngd <em>plus</em> den totala rörelsemängdsändringen där inne:
                                        {' '}<em>N</em> = <em>M</em> · <em>g</em> + Δ<em>p</em>{' '}/{' '}Δ<em>t</em>. Hovrar flugan
                                        stationärt ändras ingen rörelsemängd — utslaget är exakt oförändrat. Accelererar
                                        flugan uppåt ökar utslaget med <em>m</em> · <em>a</em>; faller den fritt minskar det
                                        med <em>m</em> · <em>g</em>.</li>
                                    <li><strong>Öppen eller sluten bägare är hela skillnaden.</strong> Sitter flugan djupt ner
                                        fångas nedsvepet in även utan lock. Hovrar den vid mynningen sprider sig luftstrålen ut
                                        i rummet — rörelsemängden hamnar på bordet i stället, och vågen tappar flugans tyngd.
                                        Infångningsfaktorn <em>f</em> i avläsningarna visar exakt hur stor andel som stannar kvar.</li>
                                    <li>Trycket som bär flugan är löjligt litet — några hundradels pascal utspritt över botten.
                                        Det är inte trycket som "känns", utan rörelsemängdsräkningen som bär hela beviset.</li>
                                    <li><strong>Energi och rörelsemängd är olika saker:</strong> flugan uträttar hela tiden
                                        arbete mot luften och luften värms en aning — men det påverkar inte kraftbalansen.
                                        Vågen mäter kraft, inte energi.</li>
                                    <li>Jämför grafens två kurvor: den grå visar den <strong>verkliga kraften</strong> mot
                                        vågen — med vingslagens 200 Hz-rippel och de korta start- och landningsspikarna —
                                        medan den röda visar vad den dämpade <strong>laboratorievågen</strong> hinner uppfatta.
                                        Vågen filtrerar bort alltihop, och det är därför man aldrig ser något hända i ett
                                        verkligt klassrumsförsök.</li>
                                </ul>
                            </div>

                            {/* Analogier */}
                            <div className="mt-4 p-4 glass-card analogi" style={{ borderRadius: '6px' }}>
                                <div className="font-semibold mb-2 text-sm" style={{ color: 'var(--lab-ink, #0f1620)' }}>Samma fysik i andra kläder</div>
                                <details>
                                    <summary>Svävande magnet på en våg</summary>
                                    <p>Låt en magnet sväva över en platta som står på vågen. Ingen kontakt — men vågen visar
                                    ändå bådas tyngd. Kraften överförs genom magnetfältet precis som flugans tyngd överförs
                                    genom luften.</p>
                                </details>
                                <details>
                                    <summary>Fåglar i en sluten lastbil</summary>
                                    <p>Den klassiska varianten: blir lastbilen lättare när alla fåglar i skåpet lyfter?
                                    Nej — så länge fåglarna hovrar trycker deras vingslag ner luften, som trycker mot golvet.
                                    Öppna flaket, så åker en del av nedsvepet ut och lastbilen blir faktiskt lite lättare.</p>
                                </details>
                                <details>
                                    <summary>Helikopter i en silo</summary>
                                    <p>Samma problem uppskalat: en helikopter som hovrar inne i en jättesilo på en våg ändrar
                                    inte utslaget. Hovrar den precis ovanför den öppna siloöppningen går rotorvinden ut över
                                    kanterna och utslaget sjunker. Öppet kontra slutet är hela skillnaden.</p>
                                </details>
                                <details>
                                    <summary>Timglaset på vågen</summary>
                                    <p>Nära släkting med motsatt intuition: ett rinnande timglas väger inte mindre — under den
                                    stationära rinningen väger det till och med aningen <em>mer</em>, eftersom sandpelarens
                                    masscentrum bromsas in mot högen där nere. Räkna gärna på det som fortsättningsfråga.</p>
                                </details>
                                <details>
                                    <summary>Fisken i akvariet</summary>
                                    <p>En fisk som simmar mitt i vattnet ändrar inte akvariets vikt. Där gör dessutom
                                    Arkimedes princip jobbet: fisken väger lika mycket som vattnet den tränger undan, så
                                    inte ens djupet spelar någon roll.</p>
                                </details>
                            </div>

                            {/* Modellens begränsningar */}
                            <div className="mt-4 p-4 text-sm glass-card" style={{ borderRadius: '6px', color: 'var(--lab-ink-soft, #3a4151)' }}>
                                <div className="font-semibold mb-2" style={{ color: 'var(--lab-ink, #0f1620)' }}>Modellens begränsningar</div>
                                <p style={{ lineHeight: 1.6 }}>
                                    Det här är en fysikaliskt korrekt men förenklad modell — ingen strömningsberäkning (CFD).
                                    Lyftkraften kommer ur aktuatorskiveteori (luft accelereras nedåt genom vingarnas svepta
                                    yta), luftstrålens väg ner till botten beskrivs med en enda transporttid i stället för ett
                                    verkligt hastighetsfält, infångningsfaktorn <em>f</em> är en fenomenologisk parameter, och
                                    turbulens saknas helt. Det som däremot är exakt är själva rörelsemängdsbokföringen:
                                    identiteten <em>N</em> − <em>M</em> · <em>g</em> = Δ<em>p</em>{' '}/{' '}Δ<em>t</em> uppfylls i
                                    varje tidssteg, och det är den som bär slutsatserna. Att diskutera var en modell gäller —
                                    och var den slutar gälla — är i sig fysik.
                                </p>
                            </div>
                        </div>

                        {/* Sidopanel */}
                        <div className="lg:w-1/3 flex-shrink-0 order-2 flex flex-col gap-4">
                            {mode === 'gissa' ? gissaCard : scenarioButtons('panel')}
                            {mode === 'utforska' && sliders('panel')}

                            {/* Rörelsemängdsbokföring / avläsningar */}
                            <div className="p-4 glass-card" style={{ borderRadius: '6px' }}>
                                <div className="text-sm font-semibold uppercase tracking-wide mb-2" style={{ color: 'var(--lab-ink-soft, #3a4151)', letterSpacing: '0.06em', fontFamily: 'var(--lab-font-mono, monospace)' }}>Bokföring</div>
                                <table className="readout-table">
                                    <tbody>
                                        <tr>
                                            <td>Vågen visar</td>
                                            <td>{readout && readout.grams != null ? formatNum(readout.grams, 4) + ' g' : '—'}</td>
                                        </tr>
                                        <tr>
                                            <td>Flugans tyngd <em>m</em> · <em>g</em></td>
                                            <td>{fmtuN(mg_uN)}</td>
                                        </tr>
                                        <tr>
                                            <td>Kontaktkraft mot vågen</td>
                                            <td>{readout ? fmtuN(readout.FcuN) : '—'}</td>
                                        </tr>
                                        <tr>
                                            <td>Luftens kraft mot botten och väggar</td>
                                            <td>{readout ? fmtuN(readout.airuN) : '—'}</td>
                                        </tr>
                                        <tr>
                                            <td>Läckage förbi mynningen</td>
                                            <td>{readout ? fmtuN(readout.leakuN) : '—'}</td>
                                        </tr>
                                        <tr>
                                            <td>Infångningsfaktor <em>f</em></td>
                                            <td>{readout ? formatNum(readout.f * 100, 0) + ' %' : '—'}</td>
                                        </tr>
                                        <tr>
                                            <td>Avvikelse <em>N</em> − <em>M</em> · <em>g</em></td>
                                            <td style={{ fontWeight: 600, color: readout && Math.abs(readout.devuN) > 6 ? 'var(--lab-accent, #c8324a)' : '#2d6a3e' }}>
                                                {readout ? fmtuN(readout.devuN) : '—'}
                                            </td>
                                        </tr>
                                        <tr>
                                            <td>Impulsöverskott sedan start</td>
                                            <td>{readout ? fmtuN(readout.impulse) + '·s' : '—'}</td>
                                        </tr>
                                    </tbody>
                                </table>
                                <div className="text-xs mt-2" style={{ color: 'var(--lab-ink-muted, #8a8579)', lineHeight: 1.5 }}>
                                    Avvikelsen är alltid summan av flugans och luftens rörelsemängdsändring
                                    plus läckaget — masscentrumsatsen, uppfylld i varje tidssteg. Impulsöverskottet
                                    går mot noll över ett helt förlopp: ytorna över och under nollinjen tar ut varandra.
                                    Dra gärna i flugan direkt i scenen — i både höjd- och sidled: lyft den över
                                    kanten, ut ur bägaren och bort till bänken. Hovrar den utanför vågen, eller
                                    sätter sig på bordet, tappar vågen hela dess tyngd.
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script src="feedback.js" defer></script>
    <script src="sim-dock.js" defer></script>
    <script src="data/katalog.js"></script>
    <script src="section-nav.js"></script>
</body>
</html>
