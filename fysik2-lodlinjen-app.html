    <script id="tyngdpunkt-motor">
// Motorn för Tyngdpunktsjakten (fysik2-lodlinjen-app.html).
// Källan ligger här och klistras in oförändrad i sidan; testet
// .claude/test-tyngdpunkt-motor.js kontrollerar fysiken och att kopian är identisk.
//
// En platt, jämntjock skiva beskrivs som en polygon i centimeter (y nedåt,
// som på skärmen). Tyngdpunkten är polygonens areatyngdpunkt, och
// tröghetsmomentet kring en upphängningspunkt P följer av polygonens
// polära ytmoment: I / m = J_C / A + |C − P|².
//
// Skivan hänger i en spik och kan vrida sig fritt kring den. Vinkeln θ är
// skivans vridning (positiv medurs på skärmen). Tyngdkraften ger kraftmomentet
// M = m · g · r_x kring spiken, där r_x är tyngdpunktens vågräta avstånd från
// spiken (hävarmen l_G). Rörelsen är en fysisk pendel med lite dämpning
// (luftmotstånd och friktion i hålet), så skivan stannar med tyngdpunkten
// rakt under spiken.
(function () {
    const G = 982;            // cm/s²
    const DAMP = 1.9;          // dämpning (1/s)
    const MASSA_PER_CM2 = 0.06; // g/cm², papp

    function geom(pts) {
        let A = 0, cx = 0, cy = 0, ix = 0, iy = 0;
        for (let i = 0; i < pts.length; i++) {
            const [x0, y0] = pts[i], [x1, y1] = pts[(i + 1) % pts.length];
            const c = x0 * y1 - x1 * y0;
            A += c; cx += (x0 + x1) * c; cy += (y0 + y1) * c;
            ix += (y0 * y0 + y0 * y1 + y1 * y1) * c;
            iy += (x0 * x0 + x0 * x1 + x1 * x1) * c;
        }
        A /= 2; cx /= 6 * A; cy /= 6 * A;
        const J0 = (ix + iy) / 12;              // polärt ytmoment kring origo (med tecken som A)
        const JC = J0 / Math.sign(A) - Math.abs(A) * (cx * cx + cy * cy);
        return { A: Math.abs(A), cx, cy, JC };
    }
    function inuti(pts, x, y) {
        let inne = false;
        for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
            const [xi, yi] = pts[i], [xj, yj] = pts[j];
            if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inne = !inne;
        }
        return inne;
    }
    function kantAvstand(pts, x, y) {
        let d = Infinity;
        for (let i = 0; i < pts.length; i++) {
            const [x0, y0] = pts[i], [x1, y1] = pts[(i + 1) % pts.length];
            const dx = x1 - x0, dy = y1 - y0, L2 = dx * dx + dy * dy;
            const t = L2 ? Math.max(0, Math.min(1, ((x - x0) * dx + (y - y0) * dy) / L2)) : 0;
            d = Math.min(d, Math.hypot(x - x0 - t * dx, y - y0 - t * dy));
        }
        return d;
    }
    // Upphängningshål nära kanten i några riktningar: ytterpunkten i riktningen,
    // flyttad inåt tills hålet ligger minst 1,2 cm från kanten.
    function hal(pts, riktningar) {
        const g = geom(pts);
        const ut = [];
        for (const v of riktningar) {
            const a = v * Math.PI / 180, ux = Math.cos(a), uy = Math.sin(a);
            let best = pts[0], bv = -Infinity;
            for (const p of pts) { const s = p[0] * ux + p[1] * uy; if (s > bv) { bv = s; best = p; } }
            let x = best[0], y = best[1];
            const L = Math.hypot(g.cx - x, g.cy - y);
            let ok = false;
            for (let k = 0; k < 25; k++) {     // högst 5 cm in från kanten
                if (inuti(pts, x, y) && kantAvstand(pts, x, y) >= 1.2) { ok = true; break; }
                x += (g.cx - x) / L * 0.2; y += (g.cy - y) / L * 0.2;
            }
            if (ok && !ut.some((h) => Math.hypot(h[0] - x, h[1] - y) < 3)) ut.push([+x.toFixed(2), +y.toFixed(2)]);
        }
        return ut;
    }

    // ── Pendeln ──
    const rot = (x, y, t) => [x * Math.cos(t) - y * Math.sin(t), x * Math.sin(t) + y * Math.cos(t)];
    // tyngdpunktens läge relativt spiken när skivan är vriden θ
    function rel(form, P, theta) { return rot(form.g.cx - P[0], form.g.cy - P[1], theta); }
    function jamvikt(form, P) {
        const v = [form.g.cx - P[0], form.g.cy - P[1]];
        return Math.PI / 2 - Math.atan2(v[1], v[0]);
    }
    function steg(st, form, dt) {
        if (st.haller) return st;
        const P = form.hal[st.hal];
        const d2 = (form.g.cx - P[0]) ** 2 + (form.g.cy - P[1]) ** 2;
        const Im = form.g.JC / form.g.A + d2;       // I / m (cm²)
        const n = Math.max(1, Math.ceil(dt / 0.002)), h = dt / n;
        for (let i = 0; i < n; i++) {
            const r = rel(form, P, st.theta);
            st.omega += (G * r[0] / Im - DAMP * st.omega) * h;
            st.theta += st.omega * h;
        }
        st.t += dt;
        return st;
    }
    const iVila = (st, form) => {
        const r = rel(form, form.hal[st.hal], st.theta);
        return !st.haller && Math.abs(st.omega) < 0.01 && Math.abs(r[0]) < 0.05;
    };
    // lodlinjen genom spiken uttryckt i skivans koordinater (punkt + riktning)
    function lodlinje(form, st) {
        const P = form.hal[st.hal];
        const d = rot(0, 1, -st.theta);
        return { x: P[0], y: P[1], dx: d[0], dy: d[1] };
    }
    function skarning(a, b) {
        const det = a.dx * b.dy - a.dy * b.dx;
        if (Math.abs(det) < 1e-9) return null;
        const t = ((b.x - a.x) * b.dy - (b.y - a.y) * b.dx) / det;
        return [a.x + t * a.dx, a.y + t * a.dy];
    }

    // ── Formerna ──
    function hastsko() {
        const p = [], R = 14, r = 8, ben = 10;
        p.push([-R, ben]);
        for (let i = 0; i <= 24; i++) { const a = Math.PI - i * Math.PI / 24; p.push([R * Math.cos(a), -R * Math.sin(a)]); }
        p.push([R, ben], [r, ben]);
        for (let i = 0; i <= 24; i++) { const a = i * Math.PI / 24; p.push([r * Math.cos(a), -r * Math.sin(a)]); }
        p.push([-r, ben]);
        return p.map(([x, y]) => [+(x + R).toFixed(2), +(y + R).toFixed(2)]);
    }
    const SVERIGE = [[0.3,26.3],[0.4,26.63],[0.61,26.59],[0.8,25.63],[0.66,24.83],[0.97,24.12],[1.66,23.48],[1.78,22.58],[1.42,21.12],[1.93,20.98],[2.14,20.2],[1.24,19.23],[1.43,17.76],[1.2,16.95],[1.32,15.88],[1.05,15.1],[1.27,14.31],[2.03,13.24],[2.54,13.05],[3.47,13.2],[3.6,13],[3.62,12.02],[3.09,11.72],[4.11,9.82],[4.31,8.53],[4.19,7.64],[4.81,7.54],[5.36,7.18],[5.28,6.7],[6.49,5.21],[6.15,4.24],[6.71,3.7],[6.96,3],[7.62,2.45],[8.35,2.82],[8.68,2.2],[8.66,1.34],[8.84,1.27],[10.89,1.79],[11.22,1.47],[10.89,1.3],[11.36,0.5],[11.07,0.05],[11.7,0],[13.39,1.36],[14.45,1.75],[15.43,2.84],[15.19,4.15],[15.53,4.24],[15.43,5.01],[15.85,5.85],[15.5,6.72],[15.5,7.32],[16.06,8.5],[15.48,8.43],[14.76,8.68],[14.32,8.33],[14.06,8.52],[13.9,8.34],[13.71,9.05],[13.3,9.22],[13.25,9.5],[12.86,9.54],[12.91,9.93],[12.67,9.77],[12.87,10.29],[12.33,11.12],[12.81,12.02],[12.19,12.78],[11.87,13.59],[10.82,14.27],[10.58,14.65],[10.13,14.62],[9.74,15.25],[9.21,15.4],[8.85,15.88],[9.08,15.9],[9.03,16.15],[8.67,16.43],[8.31,16.21],[8.5,16.92],[8.02,17.32],[7.73,17.16],[7.76,17.62],[8.01,17.89],[7.69,18.86],[7.8,19.33],[7.47,19.22],[7.39,19.62],[7.53,21.92],[8.04,22.36],[8.41,22.21],[9.14,23.09],[9.12,23.36],[9.43,23.55],[9.68,24.21],[9.17,24.9],[8.41,25.44],[8.62,25.56],[9.15,25.35],[9.22,25.53],[8.97,25.63],[8.81,26.1],[7.2,27.3],[6.25,27.35],[6.97,27.49],[7.14,27.73],[6.79,27.88],[6.94,28.46],[6.68,29.51],[6.79,30.34],[6.58,30.96],[6.64,31.47],[5.99,33.7],[5.78,33.95],[5.53,33.8],[4.4,33.93],[4.46,34.19],[4.21,34.16],[3.79,34.72],[3.94,35.52],[3.74,35.87],[3.29,35.78],[2.68,36],[2.15,35.83],[2.25,34.94],[1.64,33.52],[2.04,33.59],[1.86,33.12],[2.12,33.09],[2.14,32.66],[1.57,31.9],[0.72,29.76],[0.68,29.1],[0.37,28.71],[0.35,28.13],[0.13,28.05],[0,26.42],[0.05,26.18]];
    const RAA = {
        skiva:   { namn: 'Oregelbunden skiva', pts: [[3, 4], [16, 0], [27, 5], [30, 15], [24, 26], [13, 29], [6, 23], [0, 13]], rikt: [-110, 10, 130, 210] },
        L:       { namn: 'L-formad skiva', pts: [[0, 0], [8, 0], [8, 22], [30, 22], [30, 30], [0, 30]], rikt: [-100, 10, 135, 200] },
        hastsko: { namn: 'Hästsko', pts: hastsko(), rikt: [-90, 30, 150] },
        sverige: { namn: 'Sverigekartan', pts: SVERIGE, rikt: [-95, 170, 85, -30] },
    };
    function form(pts, rikt) {
        const g = geom(pts);
        return { pts, g, hal: hal(pts, rikt || [-90, 30, 150, 210]), massa: g.A * MASSA_PER_CM2 };
    }
    const FORMER = {};
    for (const id in RAA) FORMER[id] = Object.assign(form(RAA[id].pts, RAA[id].rikt), { namn: RAA[id].namn });

    // Egen form: kontrollera att polygonen inte korsar sig själv och inte är för liten.
    function korsar(pts) {
        const n = pts.length;
        const kryss = (a, b, c) => (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);
        for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
            if (Math.abs(i - j) <= 1 || (i === 0 && j === n - 1)) continue;
            const a = pts[i], b = pts[(i + 1) % n], c = pts[j], d = pts[(j + 1) % n];
            if (kryss(a, b, c) * kryss(a, b, d) < 0 && kryss(c, d, a) * kryss(c, d, b) < 0) return true;
        }
        return false;
    }
    function egen(pts) {
        if (pts.length < 3) return { fel: 'Klicka ut minst tre hörn.' };
        if (korsar(pts)) return { fel: 'Kanterna korsar varandra. Börja om och klicka ut hörnen i ordning runt formen.' };
        const g = geom(pts);
        if (g.A < 40) return { fel: 'Formen är för liten. Gör den större.' };
        return Object.assign(form(pts, [-90, 30, 150, 210]), { namn: 'Egen form' });
    }

    const nytt = (form, hal, theta) => ({ hal: hal || 0, theta: theta == null ? jamvikt(form, form.hal[hal || 0]) : theta, omega: 0, haller: false, t: 0 });

    const ut = { G, MASSA_PER_CM2, geom, inuti, kantAvstand, hal, rot, rel, jamvikt, steg, iVila, lodlinje, skarning, FORMER, egen, korsar, nytt };
    if (typeof window !== 'undefined') window.TyngdpunktMotor = ut;
    if (typeof module !== 'undefined') module.exports = ut;
})();
</script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const M = window.TyngdpunktMotor;

        // ── Talformat: decimalkomma, äkta minustecken, exakt noll som "0" ──
        const fmt = (num, d = 1) => {
            if (!isFinite(num)) return '–';
            const s = num.toFixed(d);
            if (parseFloat(s) === 0) return '0';
            return s.replace('.', ',').replace('-', '−');
        };
        const NB = ' ';
        const Sub = ({ s, i }) => <span><em>{s}</em><sub>{i}</sub></span>;

        const COL = {
            ink:   '#0f1620',
            soft:  'rgba(15,22,32,0.7)',
            tyngd: '#2563c9',
            tp:    '#2e9e4f',
            linje: '#334155',
            matt:  '#0f766e',
            fel:   '#c8324a',
            ok:    '#15803d',
        };

        // ════════════════════════════════════════════════════════
        //  SCENENS GEOMETRI (viewBox 1000 × 660)
        // ════════════════════════════════════════════════════════
        const VB_W = 1000, VB_H = 660;
        const SKP = 12;                  // px per cm
        // Spiken sitter så högt att skivan ryms på tavlan när den hänger stilla i hålet
        // (en egen spik för varje hål; skivan flyttas till nästa spik när den byter hål).
        const spik = (form, hal) => {
            const P = form.hal[hal], t = M.jamvikt(form, P);
            let upp = 0;
            for (const p of form.pts) upp = Math.max(upp, -M.rot(p[0] - P[0], p[1] - P[1], t)[1]);
            return [355, Math.max(84, 52 + upp * SKP)];
        };
        const LOD_Y = 618;               // lodets spets
        const PLAN = [355, 330];         // skivans mitt när den ligger plant (nålspetsen, gissa, rita)
        const RUTA = 30;                 // ritytans sida (cm): diagonalen ryms på tavlan

        // Formen hängd i spiken: lokala cm-koordinater → skärmen
        const hangd = (form, st) => {
            const P = form.hal[st.hal];
            const S = spik(form, st.hal);
            return (p) => { const r = M.rot(p[0] - P[0], p[1] - P[1], st.theta); return [S[0] + r[0] * SKP, S[1] + r[1] * SKP]; };
        };
        // Formen liggande plant, med mitten av sin omskrivna rektangel i PLAN (inte tyngdpunkten, som inte ska avslöjas)
        const mitt = (form) => {
            const xs = form.pts.map((p) => p[0]), ys = form.pts.map((p) => p[1]);
            return [(Math.min(...xs) + Math.max(...xs)) / 2, (Math.min(...ys) + Math.max(...ys)) / 2];
        };
        const plant = (form) => { const m = mitt(form); return (p) => [PLAN[0] + (p[0] - m[0]) * SKP, PLAN[1] + (p[1] - m[1]) * SKP]; };
        const tillForm = (form, x, y) => { const m = mitt(form); return [(x - PLAN[0]) / SKP + m[0], (y - PLAN[1]) / SKP + m[1]]; };
        // bryter en text i rader om högst n tecken
        const radbryt = (text, n) => {
            const rader = [];
            for (const ord of text.split(' ')) {
                if (rader.length && (rader[rader.length - 1] + ' ' + ord).length <= n) rader[rader.length - 1] += ' ' + ord;
                else rader.push(ord);
            }
            return rader;
        };
        const sti = (pts, T) => 'M ' + pts.map((p) => T(p).map((v) => v.toFixed(1)).join(' ')).join(' L ') + ' Z';

        // ════════════════════════════════════════════════════════
        //  RITDELAR
        // ════════════════════════════════════════════════════════
        // ════════════════════════════════════════════════════════
        //  RITDELAR
        // ════════════════════════════════════════════════════════
        // Pil med rakt avslutat skaft som slutar vid huvudets bas.
        const Pil = ({ x1, y1, x2, y2, color, width = 4.5, head = 15, dash = false, edge = false, opacity = 1 }) => {
            const len = Math.hypot(x2 - x1, y2 - y1);
            if (len < 2) return null;
            const ux = (x2 - x1) / len, uy = (y2 - y1) / len;
            const hd = Math.min(head, len * 0.9);
            const bx = x2 - ux * hd, by = y2 - uy * hd;
            const hw = hd * 0.48;
            const p1 = `${bx - uy * hw},${by + ux * hw}`;
            const p2 = `${bx + uy * hw},${by - ux * hw}`;
            const kant = 'rgba(15,22,32,0.5)';
            return (
                <g opacity={opacity}>
                    {edge && <line x1={x1} y1={y1} x2={bx} y2={by} stroke={kant} strokeWidth={width + 3} strokeLinecap="butt" />}
                    <line x1={x1} y1={y1} x2={bx} y2={by} stroke={color} strokeWidth={width}
                          strokeLinecap="butt" strokeDasharray={dash ? '7 5' : undefined} />
                    <polygon points={`${x2},${y2} ${p1} ${p2}`} fill={color}
                             stroke={edge ? kant : 'none'} strokeWidth={edge ? 1.6 : 0} strokeLinejoin="round" />
                </g>
            );
        };

        // Beteckning med index: F, Fₛ, F₁ … Variabeln kursiv, indexet rakt.
        const Bet = ({ x, y, sym, idx, color, size = 18, anchor = 'start', weight = 600 }) => (
            <text x={x} y={y} textAnchor={anchor} fontSize={size} fontWeight={weight} fill={color}
                  fontFamily="Poppins, sans-serif">
                <tspan fontStyle="italic">{sym}</tspan>
                {idx != null && <tspan fontSize={size * 0.68} dy={size * 0.25}>{idx}</tspan>}
            </text>
        );

        // Korktavlan med ram
        const Korktavla = () => (
            <g>
                <rect x="22" y="22" width="666" height="616" rx="6" fill="#8a5a2b" />
                <rect x="34" y="34" width="642" height="592" rx="3" fill="#d8b688" />
                {KORK.map(([x, y, r, o], i) => <circle key={i} cx={x} cy={y} r={r} fill="#8f6436" opacity={o} />)}
            </g>
        );
        const KORK = (() => {
            let s = 7; const rnd = () => ((s = (s * 9301 + 49297) % 233280) / 233280);
            return Array.from({ length: 260 }, () => [40 + rnd() * 630, 40 + rnd() * 580, 0.7 + rnd() * 1.6, 0.12 + rnd() * 0.25]);
        })();

        // Skivan med hål, inritade linjer och tyngdpunkt. T: cm → skärm.
        const Skiva = ({ form, T, linjer, visaTp, onHal, aktivtHal, klippId, onDown, tilt }) => {
            const d = sti(form.pts, T);
            const C = T([form.g.cx, form.g.cy]);
            return (
                <g>
                    <defs><clipPath id={klippId}><path d={d} /></clipPath></defs>
                    <path d={d} fill="#000" opacity="0.12" transform="translate(5 7)" />
                    <path d={d} fill={tilt ? '#e6d4ad' : '#eddcb6'} stroke="#8a6a3a" strokeWidth="1.8" strokeLinejoin="round"
                          style={{ cursor: onDown ? 'grab' : 'default' }} onPointerDown={onDown} />
                    <g clipPath={`url(#${klippId})`} style={{ pointerEvents: 'none' }}>
                        {linjer.map((l, i) => {
                            const a = T([l.x - 80 * l.dx, l.y - 80 * l.dy]), b = T([l.x + 80 * l.dx, l.y + 80 * l.dy]);
                            return <line key={i} x1={a[0]} y1={a[1]} x2={b[0]} y2={b[1]} stroke={COL.linje} strokeWidth="1.8" opacity="0.85" />;
                        })}
                    </g>
                    {/* linjerna utanför skivan, tunt streckade, så att korsningen syns även när den ligger i luften */}
                    <defs><clipPath id={klippId + 'Tavla'}><rect x="34" y="34" width="642" height="592" /></clipPath></defs>
                    <g clipPath={`url(#${klippId}Tavla)`}>
                    {linjer.length >= 2 && !M.inuti(form.pts, form.g.cx, form.g.cy) && linjer.map((l, i) => {
                        const a = T([l.x - 80 * l.dx, l.y - 80 * l.dy]), b = T([l.x + 80 * l.dx, l.y + 80 * l.dy]);
                        return <line key={'u' + i} x1={a[0]} y1={a[1]} x2={b[0]} y2={b[1]} stroke={COL.linje} strokeWidth="1.1" strokeDasharray="4 4" opacity="0.6" style={{ pointerEvents: 'none' }} />;
                    })}
                    </g>
                    {form.hal.map((h, i) => {
                        const p = T(h);
                        return (
                            <g key={i} style={{ cursor: onHal ? 'pointer' : 'default' }} onClick={onHal ? () => onHal(i) : undefined}>
                                <circle cx={p[0]} cy={p[1]} r="11" fill="transparent" />
                                <circle cx={p[0]} cy={p[1]} r="4.2" fill="#3b2a17" stroke="#8a6a3a" strokeWidth="1" opacity={i === aktivtHal ? 0 : 1} />
                            </g>
                        );
                    })}
                    {visaTp && <circle cx={C[0]} cy={C[1]} r="6" fill={COL.tp} stroke="#14532d" strokeWidth="1.2" style={{ pointerEvents: 'none' }} />}
                </g>
            );
        };

        // ════════════════════════════════════════════════════════
        //  SCENEN
        // ════════════════════════════════════════════════════════
        const Scen = (p) => {
            const { lage, form, st, linjer, visaTp, svgRef } = p;
            return (
                <svg ref={svgRef} viewBox={`0 0 ${VB_W} ${VB_H}`} preserveAspectRatio="xMidYMid meet" role="img"
                     aria-label="En skiva av papp hänger i en spik på en korktavla, med ett lod i samma spik. När skivan stannat ritas lodets snöre av på skivan. Två sådana linjer från olika hål korsar varandra i tyngdpunkten.">
                    <defs>
                        <linearGradient id="vagg" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0" stopColor="#f7f2e8" /><stop offset="1" stopColor="#ece3d2" />
                        </linearGradient>
                    </defs>
                    <rect x="0" y="0" width={VB_W} height={VB_H} fill="url(#vagg)" />
                    <g fontFamily="Poppins, sans-serif">
                        <Korktavla />
                        {lage === 'hang' && <HangVy {...p} />}
                        {lage === 'nal' && <NalVy {...p} />}
                        {lage === 'gissa' && <GissaVy {...p} />}
                        {lage === 'rita' && <RitaVy {...p} />}
                    </g>
                </svg>
            );
        };

        const HangVy = ({ form, st, linjer, visaTp, svgRef, setHall, haller, onHal, dolj }) => {
            const vila = M.iVila(st, form);
            const T = hangd(form, st);
            const SP = spik(form, st.hal);
            const C = T([form.g.cx, form.g.cy]);
            const r = M.rel(form, form.hal[st.hal], st.theta);
            const lG = r[0];                          // cm, positiv: tyngdpunkten till höger om spiken
            const FG = form.massa / 1000 * 9.82;
            const ys = form.pts.map((q) => T(q)[1]);
            // måttlinjen i fri yta under skivan, eller ovanför den om skivan går ända ned
            const yMatt = Math.max(...ys) + 26 <= LOD_Y - 40 ? Math.max(...ys) + 26 : Math.max(44, Math.min(...ys) - 22);
            const dra = (e) => {
                const svg = svgRef.current; if (!svg) return;
                e.preventDefault();
                const pos = (ev) => { const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); };
                const q0 = pos(e), v0 = Math.atan2(q0.y - SP[1], q0.x - SP[0]), t0 = st.theta;
                setHall(true, t0);
                const flytta = (ev) => { const q = pos(ev); setHall(true, t0 + Math.atan2(q.y - SP[1], q.x - SP[0]) - v0); };
                const slapp = () => { window.removeEventListener('pointermove', flytta); window.removeEventListener('pointerup', slapp); setHall(false); };
                window.addEventListener('pointermove', flytta);
                window.addEventListener('pointerup', slapp);
            };
            return (
                <g>
                    <Skiva form={form} T={T} linjer={linjer} visaTp={visaTp} onHal={dolj ? null : onHal} aktivtHal={st.hal} klippId="klippHang" onDown={dolj ? null : dra} />
                    {/* lodet i samma spik */}
                    <line x1={SP[0]} y1={SP[1]} x2={SP[0]} y2={LOD_Y - 26} stroke="#4b5563" strokeWidth="1.4" />
                    <path d={`M ${SP[0] - 8} ${LOD_Y - 26} L ${SP[0] + 8} ${LOD_Y - 26} L ${SP[0]} ${LOD_Y} Z`} fill="#6b7280" stroke="#374151" strokeWidth="1.2" strokeLinejoin="round" />
                    {/* spiken */}
                    <circle cx={SP[0]} cy={SP[1]} r="6" fill="#9ca3af" stroke="#374151" strokeWidth="1.4" />
                    <circle cx={SP[0] - 1.6} cy={SP[1] - 1.6} r="1.8" fill="#e5e7eb" />
                    {/* tyngdkraften och hävarmen */}
                    {visaTp && (
                        <g style={{ pointerEvents: 'none' }}>
                            <line x1={C[0]} y1={C[1]} x2={C[0]} y2={yMatt + 10} stroke={COL.tp} strokeWidth="1.6" strokeDasharray="6 4" />
                            <Pil x1={C[0]} y1={C[1]} x2={C[0]} y2={C[1] + 64} color={COL.tyngd} width={4} edge />
                            <Bet x={C[0] + (lG >= 0 ? 10 : -10)} y={C[1] + 58} sym="F" idx="G" color={COL.tyngd} size={17} anchor={lG >= 0 ? 'start' : 'end'} />
                            {Math.abs(lG) > 0.5 && (
                                <g>
                                    <line x1={SP[0]} y1={yMatt} x2={C[0]} y2={yMatt} stroke={COL.matt} strokeWidth="1.6" />
                                    <path d={`M ${SP[0]} ${yMatt} l ${lG > 0 ? 8 : -8} -4 l 0 8 Z M ${C[0]} ${yMatt} l ${lG > 0 ? -8 : 8} -4 l 0 8 Z`} fill={COL.matt} />
                                    <text x={C[0] + (lG > 0 ? 10 : -10)} y={yMatt + 5} textAnchor={lG > 0 ? 'start' : 'end'} fontSize="14" fill={COL.matt}>
                                        <tspan fontStyle="italic">l</tspan><tspan fontSize="10" dy="3">G</tspan><tspan dy="-3"> = {fmt(Math.abs(lG), 1)}{NB}cm</tspan>
                                    </text>
                                </g>
                            )}
                        </g>
                    )}
                    {/* avläsningen */}
                    <g transform="translate(0 70)" fontSize="15" fill={COL.ink}>
                        <text x="712" y="70" fontSize="14" fontWeight="600">{form.namn}</text>
                        <text x="712" y="96">massa {fmt(form.massa, 0)}{NB}g</text>
                        <text x="712" y="122"><tspan fontStyle="italic">F</tspan><tspan fontSize="11" dy="4">G</tspan><tspan dy="-4"> = {fmt(FG, 2)}{NB}N</tspan></text>
                        {visaTp ? (
                            <g>
                                <text x="712" y="160" fontSize="14" fontWeight="600">Kraftmoment kring spiken</text>
                                <text x="712" y="186"><tspan fontStyle="italic">l</tspan><tspan fontSize="11" dy="4">G</tspan><tspan dy="-4"> = {fmt(Math.abs(lG), 1)}{NB}cm</tspan></text>
                                <text x="712" y="212"><tspan fontStyle="italic">M</tspan> = <tspan fontStyle="italic">F</tspan><tspan fontSize="11" dy="4">G</tspan><tspan dy="-4"> · </tspan><tspan fontStyle="italic">l</tspan><tspan fontSize="11" dy="4">G</tspan><tspan dy="-4"> = {vila ? '0' : fmt(FG * Math.abs(lG) / 100 * 1000, 0)}{NB}mNm</tspan></text>
                                {radbryt(vila ? 'Inget kraftmoment: skivan hänger still.' : Math.abs(lG) < 0.3 ? 'Hävarmen är nästan noll, men skivan svänger förbi.' : `Kraftmomentet är ${lG > 0 ? 'medurs' : 'moturs'} och vrider skivan mot jämviktsläget.`, 36).map((r, i) => <text key={i} x="712" y={238 + i * 17} fontSize="13" fill={COL.soft}>{r}</text>)}
                            </g>
                        ) : (
                            <text x="712" y="170" fontSize="13" fill={COL.soft}>Tyngdpunkten är dold.</text>
                        )}
                        <text x="712" y="292" fontSize="14" fontWeight="600">Inritade linjer: {linjer.length}</text>
                        {linjer.length === 0 && <text x="712" y="318" fontSize="13" fill={COL.soft}>Vänta tills skivan hänger still</text>}
                        {linjer.length === 0 && <text x="712" y="336" fontSize="13" fill={COL.soft}>och rita sedan av lodets snöre.</text>}
                        {linjer.length === 1 && <text x="712" y="318" fontSize="13" fill={COL.soft}>Häng skivan i ett annat hål</text>}
                        {linjer.length === 1 && <text x="712" y="336" fontSize="13" fill={COL.soft}>(klicka på hålet) och rita igen.</text>}
                        {linjer.length >= 2 && <text x="712" y="318" fontSize="13" fill={COL.tp} fontWeight="600">Linjerna korsas i tyngdpunkten.</text>}
                        {!vila && <text x="712" y="366" fontSize="13" fill={COL.fel}>Skivan svänger fortfarande …</text>}
                        <text x="712" y="400" fontSize="13" fill={COL.soft}>Dra i skivan för att vrida den</text>
                        <text x="712" y="418" fontSize="13" fill={COL.soft}>och släpp den sedan.</text>
                    </g>
                </g>
            );
        };

        // Nålspetsen: skivan sedd uppifrån, liggande på en nål.
        const NalVy = ({ form, linjer, visaTp, nal, setNal, svgRef }) => {
            const T0 = plant(form);
            const C = [form.g.cx, form.g.cy];
            const inne = nal && M.inuti(form.pts, nal[0], nal[1]);
            const avst = nal ? Math.hypot(C[0] - nal[0], C[1] - nal[1]) : 0;
            const balans = inne && avst < 0.8;
            // skivan tippar kring nålen åt tyngdpunktens håll: förkortning längs riktningen
            const beta = inne && !balans ? Math.min(0.55, 0.12 + avst * 0.05) : 0;
            const u = nal && avst > 0 ? [(C[0] - nal[0]) / avst, (C[1] - nal[1]) / avst] : [1, 0];
            const T = (p) => {
                if (!beta) return T0(p);
                const v = [p[0] - nal[0], p[1] - nal[1]], s = v[0] * u[0] + v[1] * u[1], k = (1 - Math.cos(beta)) * s;
                return T0([p[0] - k * u[0], p[1] - k * u[1]]);
            };
            const dra = (e) => {
                const svg = svgRef.current; if (!svg) return;
                e.preventDefault();
                const pos = (ev) => { const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; const q = pt.matrixTransform(svg.getScreenCTM().inverse()); return tillForm(form, q.x, q.y); };
                setNal(pos(e));
                const flytta = (ev) => setNal(pos(ev));
                const slapp = () => { window.removeEventListener('pointermove', flytta); window.removeEventListener('pointerup', slapp); };
                window.addEventListener('pointermove', flytta);
                window.addEventListener('pointerup', slapp);
            };
            const nP = nal ? T0(nal) : null;
            let text = 'Klicka eller dra där nålen ska stå.', farg = COL.soft;
            if (nal && !inne) {
                text = M.inuti(form.pts, C[0], C[1]) || avst > 3 ? 'Nålen står inte under skivan.' : 'Tyngdpunkten ligger utanför skivan. Den här formen går inte att balansera på en nålspets.';
                farg = COL.fel;
            } else if (balans) { text = 'Skivan balanserar på nålen.'; farg = COL.ok; }
            else if (nal) { text = M.inuti(form.pts, C[0], C[1]) ? 'Skivan tippar åt tyngdpunktens håll och glider av nålen.' : 'Skivan tippar åt tyngdpunktens håll. Tyngdpunkten ligger utanför skivan, så ingen nålplacering fungerar.'; farg = COL.fel; }
            return (
                <g>
                    <rect x="34" y="34" width="642" height="592" fill="transparent" onPointerDown={dra} style={{ cursor: 'crosshair' }} />
                    <g style={{ pointerEvents: 'none' }}>
                        <Skiva form={form} T={T} linjer={linjer} visaTp={visaTp} aktivtHal={-1} klippId="klippNal" tilt={beta > 0} />
                    </g>
                    {nP && (
                        <g style={{ pointerEvents: 'none' }}>
                            <circle cx={nP[0]} cy={nP[1]} r="5" fill="#9ca3af" stroke="#111827" strokeWidth="1.4" />
                            <circle cx={nP[0]} cy={nP[1]} r="1.6" fill="#111827" />
                            {inne && !balans && (() => {
                                const a = T0([nal[0] + u[0] * 2.5, nal[1] + u[1] * 2.5]), b = T0([nal[0] + u[0] * 7, nal[1] + u[1] * 7]);
                                return <Pil x1={a[0]} y1={a[1]} x2={b[0]} y2={b[1]} color={COL.fel} width={3.5} head={12} />;
                            })()}
                        </g>
                    )}
                    <g transform="translate(0 70)" fontSize="15" fill={COL.ink}>
                        <text x="712" y="70" fontSize="14" fontWeight="600">Nålspetsen, sedd uppifrån</text>
                        {radbryt(text, 34).map((r, i) => <text key={i} x="712" y={100 + i * 18} fontSize="13" fill={farg} fontWeight="600">{r}</text>)}
                        {nal && inne && !balans && visaTp && <text x="712" y="176" fontSize="13" fill={COL.soft}>Nålen står {fmt(avst, 1)}{NB}cm från tyngdpunkten.</text>}
                        <text x="712" y="210" fontSize="13" fill={COL.soft}>Står nålen rakt under tyngdpunkten</text>
                        <text x="712" y="228" fontSize="13" fill={COL.soft}>går lodlinjen genom stödpunkten</text>
                        <text x="712" y="246" fontSize="13" fill={COL.soft}>och skivan balanserar.</text>
                    </g>
                </g>
            );
        };

        // Gissa: skivan ligger plant, eleven klickar där tyngdpunkten ligger.
        const GissaVy = ({ form, gissning, setGissning, svgRef, dolj }) => {
            const T = plant(form);
            const klick = (e) => {
                if (!dolj) return;
                const svg = svgRef.current; const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
                const q = pt.matrixTransform(svg.getScreenCTM().inverse());
                setGissning(tillForm(form, q.x, q.y));
            };
            const g = gissning ? T(gissning) : null;
            return (
                <g>
                    <rect x="34" y="34" width="642" height="592" fill="transparent" onPointerDown={klick} style={{ cursor: 'crosshair' }} />
                    <g style={{ pointerEvents: 'none' }}>
                        <Skiva form={form} T={T} linjer={[]} visaTp={false} aktivtHal={-1} klippId="klippGissa" />
                        {g && <g><line x1={g[0] - 9} y1={g[1]} x2={g[0] + 9} y2={g[1]} stroke={COL.fel} strokeWidth="2.4" /><line x1={g[0]} y1={g[1] - 9} x2={g[0]} y2={g[1] + 9} stroke={COL.fel} strokeWidth="2.4" /></g>}
                    </g>
                    <g transform="translate(0 70)" fontSize="13" fill={COL.soft}>
                        <text x="712" y="70" fontSize="14" fontWeight="600" fill={COL.ink}>Var ligger tyngdpunkten?</text>
                        <text x="712" y="98">Klicka där du tror att den ligger.</text>
                        <text x="712" y="116">Sedan hängs skivan upp i två hål.</text>
                    </g>
                </g>
            );
        };

        // Rita en egen form: klicka ut hörnen.
        const RitaVy = ({ ritPts, setRitPts, svgRef }) => {
            const x0 = PLAN[0] - RUTA / 2 * SKP, y0 = PLAN[1] - RUTA / 2 * SKP;
            const T = (p) => [x0 + p[0] * SKP, y0 + p[1] * SKP];
            const klick = (e) => {
                const svg = svgRef.current; const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
                const q = pt.matrixTransform(svg.getScreenCTM().inverse());
                const p = [+((q.x - x0) / SKP).toFixed(1), +((q.y - y0) / SKP).toFixed(1)];
                if (p[0] < 0 || p[1] < 0 || p[0] > RUTA || p[1] > RUTA) return;
                setRitPts((a) => a.concat([p]));
            };
            const linjer = [];
            for (let i = 0; i <= RUTA; i += 5) linjer.push(i);
            return (
                <g>
                    <rect x={x0} y={y0} width={RUTA * SKP} height={RUTA * SKP} fill="#f4ead2" stroke="#8a6a3a" strokeWidth="1.2" strokeDasharray="6 4"
                          onPointerDown={klick} style={{ cursor: 'crosshair' }} />
                    <g style={{ pointerEvents: 'none' }}>
                        {linjer.map((i) => <g key={i}><line x1={x0 + i * SKP} y1={y0} x2={x0 + i * SKP} y2={y0 + RUTA * SKP} stroke="#b9a37a" strokeWidth="0.6" opacity="0.6" /><line x1={x0} y1={y0 + i * SKP} x2={x0 + RUTA * SKP} y2={y0 + i * SKP} stroke="#b9a37a" strokeWidth="0.6" opacity="0.6" /></g>)}
                        {ritPts.length > 2 && <path d={sti(ritPts, T)} fill="#eddcb6" opacity="0.7" />}
                        {ritPts.length > 1 && <polyline points={ritPts.map((p) => T(p).join(',')).join(' ')} fill="none" stroke="#8a6a3a" strokeWidth="2" strokeLinejoin="round" />}
                        {ritPts.map((p, i) => { const q = T(p); return <circle key={i} cx={q[0]} cy={q[1]} r={i === 0 ? 5.5 : 4} fill={i === 0 ? COL.tp : '#8a6a3a'} />; })}
                    </g>
                    <g transform="translate(0 70)" fontSize="13" fill={COL.soft}>
                        <text x="712" y="70" fontSize="14" fontWeight="600" fill={COL.ink}>Rita en egen form</text>
                        <text x="712" y="98">Klicka ut hörnen i ordning runt</text>
                        <text x="712" y="116">formen. Rutorna är 5{NB}cm.</text>
                        <text x="712" y="144">Tryck på Klar när du är färdig.</text>
                        <text x="712" y="172">Hörn: {ritPts.length}</text>
                    </g>
                </g>
            );
        };

        // ════════════════════════════════════════════════════════
        //  REGLAGE
        // ════════════════════════════════════════════════════════
        const NumInput = ({ value, min, max, onCommit, fmtFn, unit, disabled, color = 'var(--lab-accent, #c8324a)' }) => {
            const [txt, setTxt] = useState(() => fmtFn(value));
            const [editing, setEditing] = useState(false);
            useEffect(() => { if (!editing) setTxt(fmtFn(value)); }, [value, editing]);
            const commit = (raw) => {
                const norm = raw.replace(',', '.').replace('−', '-').trim();
                if (norm === '' || norm === '-' || norm === '.') return;
                let n = parseFloat(norm);
                if (!isFinite(n)) return;
                if (min != null && n < min) n = min;
                if (max != null && n > max) n = max;
                onCommit(n);
            };
            return (
                <span className="num-wrap">
                    <input className="num-in" type="text" inputMode="decimal" value={txt} disabled={disabled}
                           style={{ color }} aria-label="Skriv in värde"
                           onFocus={() => setEditing(true)}
                           onChange={(e) => { setTxt(e.target.value); commit(e.target.value); }}
                           onBlur={() => { setEditing(false); setTxt(fmtFn(value)); }}
                           onKeyDown={(e) => { if (e.key === 'Enter') e.currentTarget.blur(); }} />
                    {unit && <span className="num-unit">{unit}</span>}
                </span>
            );
        };
        const Slider = ({ label, value, min, max, step, onChange, disabled, children }) => (
            <div className="flex items-center gap-2 mb-2">
                <span className="text-xs flex-shrink-0" style={{ minWidth: 112, color: 'var(--lab-ink-soft)' }}
                      dangerouslySetInnerHTML={{ __html: label }} />
                <input type="range" min={min} max={max} step={step} value={value} disabled={disabled}
                       onChange={(e) => onChange(parseFloat(e.target.value))} className="flex-1 cursor-pointer" />
                {children}
            </div>
        );
        const StSlider = ({ label, value, min, max, step, onChange, disabled, valueNode }) => (
            <div className="st-slider">
                <div className="st-slider-top">
                    <span dangerouslySetInnerHTML={{ __html: label }} />
                    {valueNode}
                </div>
                <input type="range" min={min} max={max} step={step} value={value} disabled={disabled}
                       onChange={(e) => onChange(parseFloat(e.target.value))} />
            </div>
        );

        // Formelkortet: varje storhet har sitt namn ovanför.
        const Vbl = ({ label, children }) => (
            <div className="flex flex-col items-center" style={{ lineHeight: 1.1 }}>
                <span className="flbl">{label}</span>
                <span className="fnum">{children}</span>
                <span className="flbl" aria-hidden="true" style={{ visibility: 'hidden' }}>{label}</span>
            </div>
        );

        // ════════════════════════════════════════════════════════
        //  FORMELKORTET
        // ════════════════════════════════════════════════════════
        const FormelKort = () => (
            <div className="glass-card rounded-xl p-4 mb-6" style={{ color: 'var(--lab-ink)' }}>
                <div className="flex flex-wrap items-center gap-x-8 gap-y-3">
                    <div className="flex items-center gap-x-3">
                        <Vbl label="Kraftmoment"><em>M</em></Vbl>
                        <span className="fnum">=</span>
                        <Vbl label="Tyngdkraft"><Sub s="F" i="G" /></Vbl>
                        <span className="fnum">·</span>
                        <Vbl label="Hävarm"><Sub s="l" i="G" /></Vbl>
                    </div>
                    <div className="text-sm" style={{ color: 'var(--lab-ink-soft)', maxWidth: 560 }}>
                        Tyngdkraften angriper i tyngdpunkten. Hävarmen <Sub s="l" i="G" /> är tyngdpunktens vågräta avstånd från spiken,
                        och kraftmomentet vrider skivan mot det läge där <Sub s="l" i="G" /> = 0. Skivan svänger förbi några gånger, men
                        luftmotståndet och friktionen i hålet bromsar den. Den stannar med tyngdpunkten på lodlinjen genom
                        upphängningspunkten, rakt under spiken, och lodets snöre följer just den linjen.
                    </div>
                </div>
            </div>
        );

        // ════════════════════════════════════════════════════════
        //  FÄRDIGA FÖRSÖK OCH GISSA-LÄGET
        // ════════════════════════════════════════════════════════
        const FORSOK = [
            { id: 'tva',   namn: 'Två hål räcker', sub: 'den oregelbundna skivan', form: 'skiva', antal: 2 },
            { id: 'tre',   namn: 'Tredje linjen som kontroll', sub: 'går genom samma punkt', form: 'skiva', antal: 3 },
            { id: 'L',     namn: 'L-formen', sub: 'korsningen utanför skivan', form: 'L', antal: 2 },
            { id: 'hast',  namn: 'Hästskon', sub: 'tyngdpunkten i luften', form: 'hastsko', antal: 2 },
            { id: 'sve',   namn: 'Sverigekartan', sub: 'var ligger mittpunkten?', form: 'sverige', antal: 2 },
        ];
        // en slumpad oregelbunden form (hörnen i vinkelordning, så kanterna korsas aldrig)
        function slumpForm() {
            const n = 6 + Math.floor(Math.random() * 4), pts = [];
            for (let i = 0; i < n; i++) {
                const a = (i + 0.3 * Math.random()) / n * 2 * Math.PI, r = 7 + Math.random() * 9;
                pts.push([+(17 + r * Math.cos(a)).toFixed(1), +(17 + r * Math.sin(a)).toFixed(1)]);
            }
            return Object.assign(M.egen(pts), { namn: 'Okänd skiva' });
        }

        // ════════════════════════════════════════════════════════
        //  HUVUDAPP
        // ════════════════════════════════════════════════════════
        const App = () => {
            const [formId, setFormId] = useState('skiva');
            const [egenForm, setEgenForm] = useState(null);
            const [gissForm, setGissForm] = useState(null);
            const [lage, setLage] = useState('hang');
            const [linjer, setLinjer] = useState([]);
            const [visaTpVal, setVisaTpVal] = useState(false);
            const [nal, setNal] = useState(null);
            const [ritPts, setRitPts] = useState([]);
            const [ritFel, setRitFel] = useState('');
            const [togglesOpen, setTogglesOpen] = useState(true);
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [, setFrame] = useState(0);
            const [gissa, setGissa] = useState(null);       // { steg: 'klicka' | 'visar' | 'klar' }
            const [gissning, setGissning] = useState(null);
            const [svarStatus, setSvarStatus] = useState(null);
            const [poang, setPoang] = useState({ ratt: 0, totalt: 0, svit: 0 });

            const form = gissForm || (formId === 'egen' ? egenForm : M.FORMER[formId]);
            const formRef = useRef(form); formRef.current = form;
            const st = useRef(M.nytt(form, 0));
            const sekvens = useRef(0);
            const sceneWrapRef = useRef(null);
            const svgRef = useRef(null);

            useEffect(() => {
                let raf, last = null;
                const loop = (ts) => {
                    if (last == null) last = ts;
                    const dt = Math.min((ts - last) / 1000, 0.05); last = ts;
                    M.steg(st.current, formRef.current, dt);
                    setFrame((n) => n + 1);
                    raf = requestAnimationFrame(loop);
                };
                raf = requestAnimationFrame(loop);
                return () => cancelAnimationFrame(raf);
            }, []);

            // hängs upp i ett hål: skivan behåller sin vridning och svänger till rätta
            const hangUpp = (f, h) => { st.current = M.nytt(f, h, st.current.theta); };
            const nyForm = (f) => {
                sekvens.current++;
                setLinjer([]); setNal(null);
                st.current = M.nytt(f, 0, M.jamvikt(f, f.hal[0]) + 0.6);
            };
            const valjForm = (id) => {
                if (id === 'egen') { setLage('rita'); setRitPts([]); setRitFel(''); sekvens.current++; return; }
                setFormId(id); setLage('hang'); nyForm(M.FORMER[id]);
            };
            const setHall = (h, theta) => {
                const s = st.current;
                s.haller = h; s.omega = 0;
                if (theta != null) s.theta = theta;
            };
            const vila = M.iVila(st.current, form);
            const ritaAv = () => {
                if (!vila) return;
                setLinjer((l) => l.concat([M.lodlinje(form, st.current)]));
            };
            const visaTp = visaTpVal || linjer.length >= 2 || (gissa && gissa.steg === 'klar');

            // färdiga försök: skivan hängs i ett hål i taget och linjen ritas av när den stannat
            const korSekvens = (f, antal, efter) => {
                const id = ++sekvens.current;
                setLinjer([]); setNal(null); setLage('hang');
                let k = 0;
                const nasta = () => {
                    if (sekvens.current !== id) return;
                    if (k >= antal) { if (efter) efter(); return; }
                    st.current = M.nytt(f, k, M.jamvikt(f, f.hal[k]) + (k % 2 ? -0.7 : 0.7));
                    const t0 = performance.now();
                    const vanta = () => {
                        if (sekvens.current !== id) return;
                        if (M.iVila(st.current, f) || performance.now() - t0 > 12000) {
                            setLinjer((l) => l.concat([M.lodlinje(f, st.current)]));
                            k++;
                            setTimeout(nasta, 700);
                        } else setTimeout(vanta, 100);
                    };
                    setTimeout(vanta, 600);
                };
                nasta();
            };
            const korForsok = (fo) => {
                setGissForm(null); setFormId(fo.form);
                const f = M.FORMER[fo.form];
                st.current = M.nytt(f, 0);
                setTimeout(() => korSekvens(f, fo.antal), 50);
            };

            // ── Rita egen form ──
            const ritaKlar = () => {
                const f = M.egen(ritPts);
                if (f.fel) { setRitFel(f.fel); return; }
                setRitFel(''); setEgenForm(f); setFormId('egen'); setLage('hang');
                st.current = M.nytt(f, 0, M.jamvikt(f, f.hal[0]) + 0.6); setLinjer([]);
            };

            // ── Gissa-läget ──
            const startaGissa = () => {
                sekvens.current++;
                const val = ['skiva', 'L', 'hastsko', 'sverige', 'slump', 'slump', 'slump'][Math.floor(Math.random() * 7)];
                const f = val === 'slump' ? slumpForm() : M.FORMER[val];
                setGissForm(f); setLage('gissa'); setLinjer([]); setGissning(null); setSvarStatus(null);
                setGissa({ steg: 'klicka' });
                st.current = M.nytt(f, 0);
            };
            const kolla = () => {
                const f = formRef.current;
                const d = Math.hypot(gissning[0] - f.g.cx, gissning[1] - f.g.cy);
                const dr = Math.round(d * 10) / 10;       // samma avrundning som i texten
                const ratt = dr <= 2;
                const omdome = dr <= 1 ? 'Mitt i prick!' : dr <= 2 ? 'Rätt!' : dr <= 4 ? 'Nära, men inte riktigt.' : 'Inte riktigt.';
                let text = `${omdome} Din gissning låg ${fmt(d, 1)}${NB}cm från tyngdpunkten.`;
                if (!M.inuti(f.pts, f.g.cx, f.g.cy)) text += ' Tyngdpunkten ligger utanför skivan, i luften.';
                setGissa({ steg: 'visar' });
                setPoang((p) => ({ ratt: p.ratt + (ratt ? 1 : 0), totalt: p.totalt + 1, svit: ratt ? p.svit + 1 : 0 }));
                korSekvens(f, 2, () => { setGissa({ steg: 'klar' }); setSvarStatus({ ratt, text }); });
            };
            const avslutaGissa = () => { sekvens.current++; setGissa(null); setGissForm(null); setSvarStatus(null); setLage('hang'); nyForm(M.FORMER[formId] || egenForm || M.FORMER.skiva); };
            const dolj = !!gissa && gissa.steg === 'klicka';
            const las = !!gissa;

            // ── Fullskärm ──
            useEffect(() => {
                const handler = () => setIsFullscreen(document.fullscreenElement === sceneWrapRef.current || document.webkitFullscreenElement === sceneWrapRef.current);
                document.addEventListener('fullscreenchange', handler);
                document.addEventListener('webkitfullscreenchange', handler);
                return () => { document.removeEventListener('fullscreenchange', handler); document.removeEventListener('webkitfullscreenchange', handler); };
            }, []);
            const toggleFullscreen = () => {
                const el = sceneWrapRef.current;
                if (!el) return;
                if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
            };

            const knappar = (cls) => lage === 'hang' ? (
                <React.Fragment>
                    <button className={cls('btn-start')} disabled={las || !vila} onClick={ritaAv}>Rita av lodet</button>
                    <button className={cls('btn-toggle')} disabled={las} onClick={() => { sekvens.current++; hangUpp(form, (st.current.hal + 1) % form.hal.length); }}>Byt hål</button>
                    <button className={cls('btn-toggle')} disabled={las || !linjer.length} onClick={() => setLinjer([])}>Sudda linjerna</button>
                    <button className={cls('btn-toggle')} disabled={las} onClick={() => { sekvens.current++; st.current.omega += 2.2; }}>Knuffa till</button>
                </React.Fragment>
            ) : lage === 'nal' ? (
                <React.Fragment>
                    <button className={cls('btn-toggle')} disabled={las || !nal} onClick={() => setNal(null)}>Ta bort nålen</button>
                </React.Fragment>
            ) : lage === 'rita' ? (
                <React.Fragment>
                    <button className={cls('btn-start')} onClick={ritaKlar}>Klar</button>
                    <button className={cls('btn-toggle')} disabled={!ritPts.length} onClick={() => setRitPts((a) => a.slice(0, -1))}>Ångra hörn</button>
                    <button className={cls('btn-toggle')} disabled={!ritPts.length} onClick={() => { setRitPts([]); setRitFel(''); }}>Rensa</button>
                </React.Fragment>
            ) : null;

            const sceneToggles = () => {
                if (!togglesOpen) return (
                    <button className="st-show-btn" onClick={() => setTogglesOpen(true)} aria-label="Visa inställningar" title="Visa inställningar" aria-expanded="false">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" aria-hidden="true">
                            <line x1="4" y1="8" x2="20" y2="8" /><circle cx="14.5" cy="8" r="2.7" fill="currentColor" stroke="none" />
                            <line x1="4" y1="16" x2="20" y2="16" /><circle cx="9.5" cy="16" r="2.7" fill="currentColor" stroke="none" />
                        </svg>
                    </button>
                );
                return (
                    <div className="scene-toggles">
                        <button className="st-hide" onClick={() => setTogglesOpen(false)} aria-label="Dölj inställningar" title="Dölj inställningar" aria-expanded="true">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
                        </button>
                        <div className="st-title">Visa</div>
                        <label><input type="checkbox" checked={visaTpVal} disabled={las} onChange={() => setVisaTpVal((v) => !v)} /><span>Tyngdpunkten</span></label>
                        {isFullscreen && knappar((k) => k) && (
                            <React.Fragment>
                                <div className="st-title mt">Verktyg</div>
                                <div className="st-actions">{knappar((k) => k)}</div>
                            </React.Fragment>
                        )}
                    </div>
                );
            };

            return (
                <div className="min-h-screen dark-container px-4 md:px-8 pb-12" style={{ fontFamily: "'DM Sans', sans-serif" }}>
                    <div className="max-w-7xl mx-auto pt-6">
                        <div className="breadcrumb mb-4" style={{ fontSize: 13 }}>
                            <a href="index.html">Hem</a> / <a href="katalog.html#fy2">Fysik nivå 2</a> / Tyngdpunkt och lodlinje
                        </div>
                        <h1 className="text-3xl md:text-4xl font-black tracking-tight" style={{ color: 'var(--lab-ink)' }}>Tyngdpunkt och lodlinje</h1>
                        <p className="mt-2 mb-5" style={{ color: 'var(--lab-ink-soft)', maxWidth: 860 }}>
                            Häng upp en skiva i en spik, låt den stanna och rita av lodets snöre. Häng upp skivan i ett annat hål och gör likadant: där linjerna korsas ligger tyngdpunkten. Pröva en L-formad skiva, en hästsko, Sverigekartan eller en form du ritar själv, och
                            kontrollera punkten på en nålspets.
                        </p>

                        <FormelKort />

                        <main className="flex flex-col lg:flex-row gap-6">
                            <div className="lg:w-2/3 xl:w-3/4 order-1">
                                <div className="scene-wrap" data-theme="ljusPapper" ref={sceneWrapRef}>
                                    <Scen lage={lage} form={form} st={st.current} linjer={linjer} visaTp={visaTp} svgRef={svgRef}
                                          setHall={setHall} onHal={(i) => { sekvens.current++; hangUpp(form, i); }} dolj={dolj || (gissa && gissa.steg === 'visar')}
                                          nal={nal} setNal={setNal} gissning={gissning} setGissning={setGissning} ritPts={ritPts} setRitPts={setRitPts} />
                                    {sceneToggles()}
                                    <button className="fs-btn" onClick={toggleFullscreen} aria-label="Fullskärm" title={isFullscreen ? 'Lämna fullskärm' : 'Fullskärm'}>
                                        {isFullscreen ? (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M9 3v6H3" /><path d="M15 21v-6h6" /><path d="M21 9h-6V3" /><path d="M3 15h6v6" />
                                            </svg>
                                        ) : (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M3 9V3h6" /><path d="M21 9V3h-6" /><path d="M3 15v6h6" /><path d="M21 15v6h-6" />
                                            </svg>
                                        )}
                                    </button>
                                </div>
                                <p className="text-sm mt-2" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Skivan är av jämntjock papp, så tyngdpunkten ligger i formens geometriska mittpunkt. Klicka på ett hål för att
                                    hänga skivan där. När tyngdpunkten (grön prick) visas ritas tyngdkraften ut som en blå pil från den, och hävarmen
                                    som en måttlinje mellan lodets snöre och lodlinjen genom tyngdpunkten. Spiken påverkar också skivan med en kraft,
                                    men den angriper i vridningspunkten och har därför ingen hävarm och inget kraftmoment.
                                </p>
                                {ritFel && lage === 'rita' && <p className="text-sm mt-1" style={{ color: COL.fel }}>{ritFel}</p>}
                            </div>

                            <div className="lg:w-1/3 xl:w-1/4 order-2">
                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <div className="flbl mb-2" style={{ textAlign: 'left' }}>Läge</div>
                                    <div className="forsok-lista mb-3">
                                        {[['hang', 'Hitta tyngdpunkten'], ['nal', 'Nålspetsen']].map(([k, n]) => (
                                            <button key={k} className="forsok" disabled={las || (lage === 'rita' && !egenForm && formId === 'egen')}
                                                    onClick={() => { sekvens.current++; setLage(k); if (k === 'hang' && formId === 'egen' && !egenForm) setFormId('skiva'); }}
                                                    style={lage === k ? { background: 'var(--lab-ink)', color: 'var(--lab-bg)' } : undefined}>{n}</button>
                                        ))}
                                    </div>
                                    <div className="flbl mb-2" style={{ textAlign: 'left' }}>Form</div>
                                    <div className="forsok-lista">
                                        {Object.keys(M.FORMER).concat(['egen']).map((id) => (
                                            <button key={id} className="forsok" disabled={las} onClick={() => valjForm(id)}
                                                    style={(formId === id && lage !== 'rita') || (id === 'egen' && lage === 'rita') ? { background: 'var(--lab-ink)', color: 'var(--lab-bg)' } : undefined}>
                                                {id === 'egen' ? 'Rita en egen form' : M.FORMER[id].namn}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {knappar((k) => k) && (
                                    <div className="glass-card rounded-xl p-3 mb-3">
                                        {isFullscreen && <p className="text-xs mb-2" style={{ color: 'var(--lab-ink-soft)' }}>Verktygen finns i rutan uppe till höger i fullskärm.</p>}
                                        {!isFullscreen && <div className="grid grid-cols-2 gap-2">{knappar((k) => k + ' w-full')}</div>}
                                    </div>
                                )}

                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <div className="flbl mb-2" style={{ textAlign: 'left' }}>Färdiga försök</div>
                                    <div className="forsok-lista">
                                        {FORSOK.map((f) => (
                                            <button key={f.id} className="forsok" disabled={las} onClick={() => korForsok(f)}>
                                                {f.namn}<span className="sub">{f.sub}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <div className="flex items-center justify-between mb-2">
                                        <div className="flbl" style={{ textAlign: 'left' }}>Gissa-läge</div>
                                        {poang.totalt > 0 && <div className="text-xs" style={{ color: 'var(--lab-ink-soft)' }}>{poang.ratt} av {poang.totalt} rätt{poang.svit > 1 ? `, ${poang.svit} i rad` : ''}</div>}
                                    </div>
                                    {!gissa && <button className="btn-toggle w-full" onClick={startaGissa}>Var ligger tyngdpunkten?</button>}
                                    {gissa && (
                                        <div>
                                            {gissa.steg === 'klicka' && <p className="text-sm mb-2" style={{ color: 'var(--lab-ink)' }}>Klicka där du tror att tyngdpunkten ligger. Den kan också ligga utanför skivan. Svaret räknas som rätt om det ligger högst 2{NB}cm från tyngdpunkten.</p>}
                                            {gissa.steg === 'klicka' && <button className="btn-start w-full mb-2" disabled={!gissning} onClick={kolla}>Kolla</button>}
                                            {gissa.steg === 'visar' && <p className="text-sm mb-2" style={{ color: 'var(--lab-ink-soft)' }}>Skivan hängs upp i två hål …</p>}
                                            {svarStatus && <p className="text-sm mb-2" style={{ color: svarStatus.ratt ? COL.ok : 'var(--lab-accent)' }}>{svarStatus.text}</p>}
                                            <div className="flex gap-2">
                                                {gissa.steg === 'klar' && <button className="btn-toggle flex-1" onClick={startaGissa}>Ny skiva</button>}
                                                <button className="btn-toggle flex-1" onClick={avslutaGissa}>Avsluta</button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </main>

                        <div className="grid md:grid-cols-3 gap-4 mt-6">
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Tyngdpunkten hamnar under spiken</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Ligger tyngdpunkten vid sidan av spiken har tyngdkraften en hävarm, och kraftmomentet vrider skivan. Skivan
                                    svänger fram och tillbaka och stannar när hävarmen är noll, med tyngdpunkten rakt under spiken. Står tyngdpunkten
                                    rakt ovanför spiken är hävarmen också noll, men minsta knuff vrider skivan ned. Det är en labil jämvikt.
                                </p>
                            </div>
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Två linjer räcker</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Lodets snöre visar lodlinjen genom spiken, och tyngdpunkten ligger någonstans på den. Från ett annat hål får
                                    man en ny linje, och tyngdpunkten ligger på båda linjerna. Den enda punkt som ligger på båda är den där linjerna korsas.
                                    En tredje linje går genom samma punkt.
                                </p>
                            </div>
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Tyngdpunkten kan ligga i luften</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    I en L-formad skiva eller en hästsko korsas linjerna utanför materialet. Tyngdpunkten är en punkt, inte en
                                    bit av föremålet, och den kan ligga där det inte finns något material. En sådan skiva går inte att balansera
                                    på en nålspets.
                                </p>
                            </div>
                        </div>

                        <details className="glass-card rounded-xl p-4 mt-4">
                            <summary className="accordion-head" style={{ color: 'var(--lab-ink)' }}>
                                <span>Sveriges mittpunkt</span><span style={{ color: 'var(--lab-ink-muted)' }}>▾</span>
                            </summary>
                            <div className="mt-3 text-sm space-y-2" style={{ color: 'var(--lab-ink-soft)' }}>
                                <p>
                                    Sveriges mest kända mittpunkt bestämdes 1947 med just tyngdpunktsmetoden. Två geografer vid Stockholms högskola
                                    klistrade upp en Sverigekarta på styv papp, fäste Öland och Gotland vid fastlandet och letade upp punkten där kartan
                                    balanserade på en nålspets, som i läget Nålspetsen här. Punkten hamnade vid Flataklocken i Ånge kommun i Medelpad.
                                </p>
                                <p>
                                    Kartan här är förenklad och visar bara fastlandet, utan Gotland, Öland och de andra öarna. Den är ritad efter
                                    kartdata från Natural Earth, som är fria att använda. Dess tyngdpunkt hamnar också i södra Norrland, men en bit
                                    norr om Flataklocken. Det beror på att öarna saknas och på hur kartan ritas: här blir norra Sverige något för brett
                                    i förhållande till södra. Med andra kartor, med havsområdena inräknade eller med andra metoder har man fått andra
                                    mittpunkter i Hälsingland och Härjedalen, så Sverige har flera ”mittpunkter”.
                                </p>
                            </div>
                        </details>

                        <details className="glass-card rounded-xl p-4 mt-4">
                            <summary className="accordion-head" style={{ color: 'var(--lab-ink)' }}>
                                <span>Vanliga missuppfattningar</span><span style={{ color: 'var(--lab-ink-muted)' }}>▾</span>
                            </summary>
                            <ul className="mt-3 space-y-2 text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                <li><strong>”Tyngdpunkten ligger alltid i föremålets mitt.”</strong> Det stämmer bara för symmetriska föremål. I en oregelbunden
                                    skiva ligger den närmare den del där mest material finns.</li>
                                <li><strong>”Tyngdpunkten måste ligga i materialet.”</strong> Nej. I en hästsko eller ett L ligger den i luften.</li>
                                <li><strong>”Lodlinjen från hålet längst upp går genom skivans mitt.”</strong> Nej. Den går genom tyngdpunkten, och i en
                                    oregelbunden skiva är det inte samma punkt som mitten. Skivan hänger alltid så att tyngdpunkten hamnar rakt
                                    under spiken, var hålet än sitter.</li>
                            </ul>
                        </details>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script src="feedback.js" defer></script>
    <script src="sim-dock.js" defer></script>
    <script src="data/katalog.js"></script>
    <script src="section-nav.js"></script>
