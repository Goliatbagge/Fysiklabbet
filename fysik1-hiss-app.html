    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ── Fysik: samma beteckningar som genomgångarna Newtons andra lag
        //    (fy1-3.2) och Accelerationens riktning (fy1-3.9). Positiv
        //    riktning är UPPÅT i hela simuleringen. ──
        const g = 9.82;                 // tyngdfaktorn (N/kg)
        const VAN_H = 3.0;              // våningshöjd (m)
        const TOPP = 8;                 // översta våningen
        const H_TOPP = VAN_H * TOPP;    // 24 m
        const TAU = 0.6;                // tid för accelerationen att byggas upp (s), ryckbegränsning
        const DT = 0.01;                // tidssteg i den förberäknade färden (s)
        const HIST_DT = 1 / 30;         // mätpunkter i grafen (s)
        const FONSTER = 30;             // grafens tidsfönster (s)

        const COL = {
            tyngd: '#7c3aed',   // lila: tyngdkraft F_G (som i Tyngdkraft och normalkraft)
            norm:  '#15803d',   // grön: normalkraft F_N
            res:   '#c8324a',   // crimson, streckad: resulterande kraft F_R
            acc:   '#e0701a',   // orange: acceleration a
            fart:  '#2563c9',   // blå: hastighet v
            ink:   '#0f1620',
            tung: '#b45309', normal: '#3f4a57', latt: '#0e7490', tyngdlos: '#155e75',
        };
        const KANSLA_ORD = { tung: 'tung', normal: 'normal', latt: 'lätt', tyngdlos: 'tyngdlös' };

        // Talformat: komma som decimaltecken, hårt mellanslag i tusental,
        // äkta minustecken, exakt noll utan decimaler.
        const fmt = (n, d = 1) => {
            if (!isFinite(n)) return '–';
            const s = Math.abs(n).toFixed(d);
            if (parseFloat(s) === 0) return '0';
            const [ip, fr] = s.split('.');
            const w = ip.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
            return (n < 0 ? '−' : '') + (fr !== undefined ? w + ',' + fr : w);
        };
        const r1 = (x) => Math.round(x * 10) / 10;

        // Krafterna med en decimal, avrundade EN gång så att alla
        // avläsningar räknar med samma tal: F_R = F_N − F_G exakt och
        // a = F_R / m med två decimaler.
        const krafter = (m, a) => {
            const FG = r1(m * g);
            const FN = r1(Math.max(0, m * (g + a)));
            const FR = r1(FN - FG);
            const aV = Math.round(FR / m * 100) / 100;
            const kv = FG > 0 ? FN / FG : 1;
            const kansla = kv < 0.02 ? 'tyngdlos' : (kv < 0.98 ? 'latt' : (kv <= 1.02 ? 'normal' : 'tung'));
            return { FG, FN, FR, a: aV, kv, kansla };
        };

        // ── Faserna i färden ─────────────────────────────────────
        const FAS = {
            vila:       { titel: 'Hissen står stilla', svar: 'normal' },
            okarUpp:    { titel: 'Hissen ökar farten uppåt', svar: 'tung',
                          lab: 'Hissen har sin största acceleration på väg upp' },
            konstUpp:   { titel: 'Hissen åker uppåt med konstant fart', svar: 'normal',
                          lab: 'Hissen med konstant hastighet upp' },
            bromsarUpp: { titel: 'Hissen bromsar in på väg upp', svar: 'latt',
                          lab: 'Hissen bromsar in som mest på väg upp' },
            okarNer:    { titel: 'Hissen ökar farten nedåt', svar: 'latt',
                          lab: 'Hissen har sin största acceleration på väg ner' },
            konstNer:   { titel: 'Hissen åker nedåt med konstant fart', svar: 'normal',
                          lab: 'Hissen med konstant hastighet ner' },
            bromsarNer: { titel: 'Hissen bromsar in på väg ner', svar: 'tung',
                          lab: 'Hissen bromsar in som mest på väg ner' },
            fall:       { titel: 'Linan har gått av: hissen faller fritt', svar: 'tyngdlos',
                          lab: 'Hissen går sönder och faller fritt (teoretiskt)' },
            fanga:      { titel: 'Fångapparaten bromsar hissen', svar: 'tung' },
        };
        const FORKLARING = {
            vila: 'Hastigheten ändras inte, den är noll hela tiden. Då är a = 0 och den resulterande kraften är noll, så normalkraften är exakt lika stor som tyngdkraften. Du känner dig normal.',
            okarUpp: 'Hastigheten ökar uppåt, från 0 mot ett positivt värde, så accelerationen är riktad uppåt. Då måste den resulterande kraften också peka uppåt: plattan trycker hårdare än tyngdkraften drar, F_N > F_G, och du känner dig tung.',
            konstUpp: 'Hastigheten är konstant, så a = 0 och F_R = 0. Normalkraften är då lika stor som tyngdkraften. Att hissen rör sig uppåt spelar ingen roll, det är bara förändringen av hastigheten som märks. Du känner dig normal.',
            bromsarUpp: 'Hissen är på väg uppåt men hastigheten minskar, så accelerationen är riktad nedåt. Den resulterande kraften pekar nedåt: plattan trycker svagare än tyngdkraften drar, F_N < F_G, och du känner dig lätt.',
            okarNer: 'Hastigheten går från 0 mot allt mer negativa värden. Den minskar alltså, och accelerationen är riktad nedåt. F_R pekar nedåt, så F_N < F_G och du känner dig lätt.',
            konstNer: 'Hastigheten är konstant, så a = 0 och F_R = 0. Normalkraften är lika stor som tyngdkraften trots att hissen åker nedåt. Du känner dig normal.',
            bromsarNer: 'Hissen rör sig nedåt men hastigheten går från ett negativt värde mot 0. Hastigheten ökar alltså, och accelerationen är riktad uppåt. F_R pekar uppåt, så F_N > F_G och du känner dig tung. Det är därför det känns i knäna när hissen stannar längst ner.',
            fall: 'Du och hissen faller tillsammans med accelerationen a = −g. Hela tyngdkraften går åt till att ge dig den accelerationen, F_R = F_G, så plattan behöver inte trycka alls: F_N = 0. Tyngdkraften finns kvar, men du känner dig tyngdlös. Den lilla knuff du får av benen när linan går av räcker för att du ska lyfta från plattan och sväva fritt i hissen.',
            fanga: 'Hissen rör sig nedåt men bromsas hårt, så accelerationen är riktad uppåt och stor. Normalkraften blir mycket större än tyngdkraften, och du känner dig mycket tung.',
        };
        const RORLIG = new Set(['okarUpp', 'konstUpp', 'bromsarUpp', 'okarNer', 'konstNer', 'bromsarNer', 'fall', 'fanga']);

        // ── Färdens profil ───────────────────────────────────────
        // Accelerationen byggs upp linjärt under TAU, ligger kvar på sitt
        // största värde och klingar av igen: så kör en riktig hiss, och det
        // ger kraftplattans mjuka puckel i grafen.
        const accBlock = (vp, aMax) => {
            const ap = Math.min(aMax, vp / TAU);
            const t1 = Math.max(0, vp / ap - TAU);
            return { ap, t1, T: 2 * TAU + t1, d: vp * (2 * TAU + t1) / 2 };
        };
        const trapA = (t, ap, t1) => {
            if (t <= 0) return 0;
            if (t < TAU) return ap * t / TAU;
            if (t < TAU + t1) return ap;
            if (t < 2 * TAU + t1) return ap * (2 * TAU + t1 - t) / TAU;
            return 0;
        };
        const planResa = (D, aMax, vMax) => {
            let vp = vMax;
            if (2 * accBlock(vMax, aMax).d > D) {
                let lo = 0, hi = vMax;
                for (let k = 0; k < 50; k++) {
                    const mid = (lo + hi) / 2;
                    if (2 * accBlock(mid, aMax).d > D) hi = mid; else lo = mid;
                }
                vp = lo;
            }
            const b = accBlock(vp, aMax);
            return { vp, ...b, tc: Math.max(0, (D - 2 * b.d) / vp) };
        };

        // Tidslinjen: förberäknade punkter var DT:e sekund, och faserna
        // (segs) med frågetidpunkter för gissa-läget.
        const nyTL = (y0) => ({ s: [{ a: 0, v: 0, y: y0, ph: 'vila' }], segs: [{ ph: 'vila', t0: 0, t1: 0, efter: null }],
                                 brottT: null, trasig: false, mal: [] });
        const tSlut = (tl) => (tl.s.length - 1) * DT;
        const sista = (tl) => tl.s[tl.s.length - 1];
        const pushS = (tl, a, v, y, ph) => {
            tl.s.push({ a, v, y, ph });
            const t = tSlut(tl);
            const last = tl.segs[tl.segs.length - 1];
            if (last.ph === ph) last.t1 = t;
            else tl.segs.push({ ph, t0: t - DT, t1: t, efter: last.ph });
        };
        // Frågetidpunkt (ask) och mittpunkt (mid) för varje ny fas
        const markera = (tl) => {
            for (const sg of tl.segs) {
                if (sg.ask !== undefined) continue;
                const len = sg.t1 - sg.t0;
                if (sg.ph === 'okarUpp' || sg.ph === 'okarNer' || sg.ph === 'bromsarUpp' || sg.ph === 'bromsarNer') {
                    sg.ask = sg.t0 + Math.min(TAU, len / 2);
                    sg.mid = sg.t0 + Math.min(TAU, len / 2) + Math.max(0, len - 2 * TAU) / 2;
                } else if (sg.ph === 'konstUpp' || sg.ph === 'konstNer') {
                    sg.ask = sg.t0 + Math.min(0.5, len / 2); sg.mid = sg.t0 + len / 2;
                } else if (sg.ph === 'fall' || sg.ph === 'fanga') {
                    sg.ask = sg.t0 + Math.min(0.25, len / 2); sg.mid = sg.t0 + len / 2;
                } else {
                    // stilla: fråga bara när hissen just har stannat
                    sg.ask = (sg.efter && RORLIG.has(sg.efter) && sg.efter !== 'fall') ? sg.t0 + 0.4 : null;
                    sg.mid = sg.t0 + 1.0;
                }
            }
        };
        const laggVila = (tl, dur) => {
            const st = sista(tl);
            const n = Math.round(dur / DT);
            for (let k = 0; k < n; k++) pushS(tl, 0, 0, st.y, 'vila');
            markera(tl);
        };
        const laggResa = (tl, malY, aMax, vMax) => {
            const st = sista(tl);
            const D = Math.abs(malY - st.y);
            if (D < 0.01 || tl.trasig) return;
            const sgn = Math.sign(malY - st.y);
            const p = planResa(D, aMax, vMax);
            const T = 2 * p.T + p.tc;
            const fas = (tr) => tr < p.T ? (sgn > 0 ? 'okarUpp' : 'okarNer')
                : tr < p.T + p.tc ? (sgn > 0 ? 'konstUpp' : 'konstNer')
                : (sgn > 0 ? 'bromsarUpp' : 'bromsarNer');
            const aAt = (tr) => tr < p.T ? sgn * trapA(tr, p.ap, p.t1)
                : tr < p.T + p.tc ? 0 : -sgn * trapA(tr - p.T - p.tc, p.ap, p.t1);
            let v = 0, y = st.y, aPrev = 0;
            const n = Math.ceil(T / DT);
            for (let k = 1; k <= n; k++) {
                const tr = k * DT;
                const a = aAt(tr);
                const vN = v + (aPrev + a) / 2 * DT;
                y += (v + vN) / 2 * DT;
                v = vN; aPrev = a;
                pushS(tl, a, v, y, fas(tr - DT / 2));
            }
            tl.mal.push({ van: Math.round(malY / VAN_H), t: tSlut(tl) });
            const s = sista(tl); s.y = malY; s.v = 0; s.a = 0;
            pushS(tl, 0, 0, malY, 'vila');
            laggVila(tl, 1.0);
        };
        // Linan går av: fritt fall i 1,0 s, sedan bromsar fångapparaten
        // med a = +g tills hissen står still.
        const laggBrott = (tl) => {
            const st = sista(tl);
            tl.brottT = tSlut(tl);
            tl.trasig = true;
            let v = 0, y = st.y, aPrev = 0;
            for (let k = 1; k <= 100; k++) {
                const a = -g;
                const vN = v + (k === 1 ? a : (aPrev + a) / 2) * DT;
                y += (v + vN) / 2 * DT; v = vN; aPrev = a;
                pushS(tl, a, v, y, 'fall');
            }
            for (let k = 1; k <= 100; k++) {
                const a = g;
                const vN = Math.min(0, v + a * DT);
                y += (v + vN) / 2 * DT; v = vN;
                pushS(tl, a, v, y, 'fanga');
            }
            pushS(tl, 0, 0, y, 'vila');
            laggVila(tl, 2.0);
        };
        // Svävandet efter linbrottet. Benen var ihoptryckta av tyngden, och
        // när linan går av ger de personen en liten knuff uppåt (U0). Under
        // det fria fallet har personen och hissen samma acceleration, så
        // glipan växer med konstant fart. När fångapparaten bromsar hissen
        // (a = +g) faller personen fortfarande fritt (a = −g) tills golvet
        // kommer ikapp: glipan minskar då med den relativa accelerationen 2g.
        // Så länge glipan finns är F_N = 0.
        const U0 = 0.2;            // knuffen från benen (m/s)
        const FALL_T = 1.0;        // det fria fallets längd (s), se laggBrott
        const glipa = (tl, t) => {
            if (tl.brottT == null || t <= tl.brottT) return 0;
            const tf = t - tl.brottT;
            if (tf <= FALL_T) return U0 * tf;
            const t2 = tf - FALL_T;
            return Math.max(0, U0 * FALL_T + U0 * t2 - g * t2 * t2);
        };
        // Personens tillstånd: hissens rörelse, men utan kontakt faller
        // personen fritt med a = −g.
        const personen = (tl, t) => {
            const s = sampla(tl, t);
            const gp = glipa(tl, t);
            return gp > 0 ? { ...s, a: -g, glipa: gp } : { ...s, glipa: 0 };
        };
        const sampla = (tl, t) => {
            const n = tl.s.length;
            const f = t / DT, i = Math.floor(f);
            if (i >= n - 1) return tl.s[n - 1];
            if (i < 0) return tl.s[0];
            const u = f - i, A = tl.s[i], B = tl.s[i + 1];
            return { a: A.a + (B.a - A.a) * u, v: A.v + (B.v - A.v) * u, y: A.y + (B.y - A.y) * u, ph: u < 0.5 ? A.ph : B.ph };
        };

        // Labbens förlopp: stå stilla längst ner, åk upp, stanna, åk ner.
        const labbTL = (aMax, vMax) => {
            const tl = nyTL(0);
            laggVila(tl, 2.0);
            laggResa(tl, H_TOPP, aMax, vMax);
            laggVila(tl, 2.0);
            laggResa(tl, 0, aMax, vMax);
            laggVila(tl, 1.0);
            return tl;
        };
        const brottTL = () => {
            const tl = nyTL(H_TOPP);
            laggVila(tl, 1.5);

        };

        // Labbens nio lägen, i samma ordning som på labbladet
        const LAGEN = [

        const LAGE_TEXT = {

        const Arrow = ({ x1, y1, x2, y2, color, width = 4.6, head = 14, dashed = false, edge = false }) => {

            const len = Math.hypot(x2 - x1, y2 - y1);

            const bx = x2 - hd * 0.82 * Math.cos(ang), by = y2 - hd * 0.82 * Math.sin(ang);
            const pL = [x2 - hd * Math.cos(ang - hw), y2 - hd * Math.sin(ang - hw)];
            const pR = [x2 - hd * Math.cos(ang + hw), y2 - hd * Math.sin(ang + hw)];
