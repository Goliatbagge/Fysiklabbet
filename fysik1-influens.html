    <script type="text/babel">
        const { useState, useRef, useEffect, useCallback } = React;

        // ==================== FULLSKÄRM (delad logik) ====================

        function useFullscreen(ref) {
            const [isFullscreen, setIsFullscreen] = useState(false);

            useEffect(() => {
                const handler = () => {
                    setIsFullscreen(
                        document.fullscreenElement === ref.current ||
                        document.webkitFullscreenElement === ref.current
                    );
                    // Canvasarna följer wrapperns nya storlek via resize-lyssnarna
                    setTimeout(() => window.dispatchEvent(new Event('resize')), 60);
                    setTimeout(() => window.dispatchEvent(new Event('resize')), 300);
                };
                document.addEventListener('fullscreenchange', handler);
                document.addEventListener('webkitfullscreenchange', handler);
                return () => {
                    document.removeEventListener('fullscreenchange', handler);
                    document.removeEventListener('webkitfullscreenchange', handler);
                };
            }, []);

            const toggleFullscreen = () => {
                const el = ref.current;
                if (!el) return;
                const isFs = document.fullscreenElement || document.webkitFullscreenElement;
                if (isFs) {
                    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                } else {
                    (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
                }
            };

            return [isFullscreen, toggleFullscreen];
        }

        // ==================== LEDARE SIMULATION (BURK) ====================

        const LedareCanvas = ({ showCharges, resetSignal, onContact }) => {
            const canvasRef = useRef(null);
            const containerRef = useRef(null);
            const showChargesRef = useRef(showCharges);

            const onContactRef = useRef(onContact);

            useEffect(() => {
                showChargesRef.current = showCharges;
            }, [showCharges]);

            useEffect(() => {
                onContactRef.current = onContact;
            }, [onContact]);

            const ROD_WIDTH = 120;
            const ROD_HEIGHT = 40;
            const CAN_RADIUS = 60;
            const FLOOR_Y_RATIO = 0.25;

            const ATTRACTION_STRENGTH = 300000;
            const REPULSION_STRENGTH = 300000;
            const DAMPING = 0.96;

            const STATIC_FRICTION_THRESHOLD = 3.0;
            const CHARGE_SHIFT_FACTOR = 0.85;
            const ELECTRON_SMOOTHING = 0.15;

            const physicsState = useRef({
                canX: 0,
                canY: 0,
                canV: 0,
                canRotation: 0,
                rodX: 200,
                rodY: 200,
                electrons: [],
                lastTime: 0,
            });

            const initCharges = useCallback(() => {
                const particles = [];
                const rows = 4;
                const cols = 4;
                const step = (CAN_RADIUS * 1.4) / Math.max(rows, cols);

                let idCounter = 0;
                for (let r = -rows/2; r < rows/2; r++) {
                    for (let c = -cols/2; c < cols/2; c++) {
                        const x = (c + 0.5) * step;
                        const y = (r + 0.5) * step;

                        if (Math.sqrt(x*x + y*y) < CAN_RADIUS - 10) {
                            particles.push({
                                id: idCounter++,
                                basePosition: { x, y },
                                currentPosition: { x, y }
                            });
                        }
                    }
                }
                physicsState.current.electrons = particles;
            }, []);

            useEffect(() => {
                if (!containerRef.current) return;
                const width = containerRef.current.clientWidth;
                const height = containerRef.current.clientHeight;

                const floorY = height * (1 - FLOOR_Y_RATIO);
                const canY = floorY - CAN_RADIUS;

                const startCanX = width * 0.75;
                const startRodX = Math.max(ROD_WIDTH / 2 + 4, width * 0.15);
                const startRodY = canY;

                physicsState.current.canX = startCanX;
                physicsState.current.canY = canY;
                physicsState.current.canV = 0;
                physicsState.current.canRotation = 0;
                physicsState.current.rodX = startRodX;
                physicsState.current.rodY = startRodY;
                physicsState.current.lastTime = 0;

                initCharges();
            }, [resetSignal, initCharges]);

            const handleInput = useCallback((clientX, clientY) => {
                if (!canvasRef.current) return;
                const rect = canvasRef.current.getBoundingClientRect();
                const x = clientX - rect.left;
                const y = clientY - rect.top;

                const floorY = rect.height * (1 - FLOOR_Y_RATIO);
                const maxRodY = floorY - ROD_HEIGHT/2;

                physicsState.current.rodX = Math.max(ROD_WIDTH/2, Math.min(rect.width - ROD_WIDTH/2, x));
                physicsState.current.rodY = Math.max(ROD_HEIGHT/2, Math.min(maxRodY, y));
            }, []);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;

                const onMouseMove = (e) => handleInput(e.clientX, e.clientY);
                const onTouchMove = (e) => {
                    e.preventDefault();
                    handleInput(e.touches[0].clientX, e.touches[0].clientY);
                };
                const onMouseDown = (e) => handleInput(e.clientX, e.clientY);

                canvas.addEventListener('mousemove', onMouseMove);
                canvas.addEventListener('touchmove', onTouchMove, { passive: false });
                canvas.addEventListener('mousedown', onMouseDown);

                return () => {
                    canvas.removeEventListener('mousemove', onMouseMove);
                    canvas.removeEventListener('touchmove', onTouchMove);
                    canvas.removeEventListener('mousedown', onMouseDown);
                };
            }, [handleInput]);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                if (!ctx) return;

                let animationFrameId;

                const render = (time) => {
                    const { width, height } = canvas;
                    const state = physicsState.current;

                    if (width === 0 || height === 0) {
                        animationFrameId = requestAnimationFrame(render);
                        return;
                    }

                    if (!Number.isFinite(state.canX)) state.canX = width * 0.75;
                    if (!Number.isFinite(state.canV)) state.canV = 0;
                    if (!Number.isFinite(state.rodX)) state.rodX = width * 0.15;

                    const floorY = height * (1 - FLOOR_Y_RATIO);
                    const canY = floorY - CAN_RADIUS;
                    if (!Number.isFinite(state.rodY)) state.rodY = canY;

                    if (state.lastTime === 0) {
                        state.lastTime = time;
                    }

                    let deltaTime = (time - state.lastTime) / 1000;
                    state.lastTime = time;

                    if (deltaTime < 0 || deltaTime > 0.1) {
                        deltaTime = 0.016;
                    }

                    const rodY = state.rodY;

                    const distVectorX = state.canX - state.rodX;
                    const distVectorY = canY - rodY;
                    const dist = Math.sqrt(distVectorX * distVectorX + distVectorY * distVectorY);
                    const effDist = Math.max(dist, ROD_WIDTH/2 + CAN_RADIUS + 5);

                    const dirX = dist > 0 ? distVectorX / dist : 1;
                    const dirY = dist > 0 ? distVectorY / dist : 0;

                    const inductionStrength = Math.min(30000 / (effDist * effDist), 1);

                    state.electrons.forEach(p => {
                        const cos = Math.cos(state.canRotation);
                        const sin = Math.sin(state.canRotation);

                        const rotX = p.basePosition.x * cos - p.basePosition.y * sin;
                        const rotY = p.basePosition.x * sin + p.basePosition.y * cos;

                        let targetX = rotX + (dirX * inductionStrength * CAN_RADIUS * CHARGE_SHIFT_FACTOR);
                        let targetY = rotY + (dirY * inductionStrength * CAN_RADIUS * CHARGE_SHIFT_FACTOR);

                        const d = Math.sqrt(targetX*targetX + targetY*targetY);
                        if (d > CAN_RADIUS - 12) {
                            const scale = (CAN_RADIUS - 12) / d;
                            targetX *= scale;
                            targetY *= scale;
                        }

                        p.currentPosition.x += (targetX - p.currentPosition.x) * ELECTRON_SMOOTHING;
                        p.currentPosition.y += (targetY - p.currentPosition.y) * ELECTRON_SMOOTHING;
                    });

                    let netForce = 0;
                    state.electrons.forEach(p => {
                        const cos = Math.cos(state.canRotation);
                        const sin = Math.sin(state.canRotation);
                        const pX = state.canX + (p.basePosition.x * cos - p.basePosition.y * sin);
                        const pY = canY + (p.basePosition.x * sin + p.basePosition.y * cos);

                        const eX = state.canX + p.currentPosition.x;
                        const eY = canY + p.currentPosition.y;

                        const dpX = pX - state.rodX;
                        const dpY = pY - rodY;
                        const distP2 = Math.max(dpX*dpX + dpY*dpY, 200);
                        const distP = Math.sqrt(distP2);
                        const dirPx = (state.rodX - pX) / distP;

                        const forceProton = (ATTRACTION_STRENGTH / distP2) * dirPx;

                        const deX = eX - state.rodX;
                        const deY = eY - rodY;
                        const distE2 = Math.max(deX*deX + deY*deY, 200);
                        const distE = Math.sqrt(distE2);
                        const dirEx = (state.rodX - eX) / distE;

                        const forceElectron = -(REPULSION_STRENGTH / distE2) * dirEx;

                        netForce += (forceProton + forceElectron);
                    });

                    if (Math.abs(state.canV) < 2.0 && Math.abs(netForce) < STATIC_FRICTION_THRESHOLD) {
                        netForce = 0;
                        state.canV = 0;
                    }

                    const acceleration = netForce;
                    state.canV += acceleration * deltaTime;

                    if (Math.abs(netForce) < STATIC_FRICTION_THRESHOLD * 2) {
                        state.canV *= DAMPING;
                    } else {
                        state.canV *= 0.998;
                    }

                    const collisionDistX = state.canX - state.rodX;
                    const collisionDistY = canY - rodY;
                    const collisionDist = Math.sqrt(collisionDistX * collisionDistX + collisionDistY * collisionDistY);
                    const minDist = ROD_WIDTH/2 + CAN_RADIUS;

                    if (collisionDist < minDist + 5 && collisionDist > 0) {
                        if (onContactRef.current) {
                            onContactRef.current();
                            return;
                        }
                        const pushX = (collisionDistX / collisionDist) * (minDist - collisionDist);
                        state.canX += pushX;

                        if ((collisionDistX > 0 && state.canV < 0) || (collisionDistX < 0 && state.canV > 0)) {
                            state.canV = 0;
                        }
                    }

                    state.canX += state.canV * deltaTime;

                    const dx = state.canV * deltaTime;
                    state.canRotation += dx / CAN_RADIUS;

                    ctx.fillStyle = '#f3eee4';
                    ctx.fillRect(0, 0, width, height);

                    // (Mörkblå bakgrundsvinjett borttagen — blev en grå fläck på papperstemat)

                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.moveTo(0, floorY);
                    ctx.lineTo(width, floorY);
                    ctx.strokeStyle = '#334155';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.shadowBlur = 0;

                    const rodGradient = ctx.createLinearGradient(state.rodX - ROD_WIDTH/2, 0, state.rodX + ROD_WIDTH/2, 0);
                    rodGradient.addColorStop(0, '#f3eee4');
                    rodGradient.addColorStop(0.3, '#334155');
                    rodGradient.addColorStop(0.5, '#475569');
                    rodGradient.addColorStop(0.7, '#334155');
                    rodGradient.addColorStop(1, '#f3eee4');

                    ctx.shadowBlur = 8;
                    ctx.shadowColor = 'rgba(15, 22, 32, 0.28)';
                    ctx.fillStyle = rodGradient;
                    if (ctx.roundRect) {
                        ctx.beginPath();
                        ctx.roundRect(state.rodX - ROD_WIDTH/2, rodY - ROD_HEIGHT/2, ROD_WIDTH, ROD_HEIGHT, 8);
                        ctx.fill();
                        ctx.strokeStyle = '#64748b';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    } else {
                        ctx.fillRect(state.rodX - ROD_WIDTH/2, rodY - ROD_HEIGHT/2, ROD_WIDTH, ROD_HEIGHT);
                    }
                    ctx.shadowBlur = 0;

                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#1e40af';
                    ctx.font = 'bold 24px Poppins, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    for(let i=1; i<4; i++) {
                        const rx = state.rodX - ROD_WIDTH/2 + (i * ROD_WIDTH/4);
                        ctx.fillText('−', rx, rodY);
                    }
                    ctx.shadowBlur = 0;

                    ctx.save();
                    ctx.translate(state.canX, canY);
                    ctx.rotate(state.canRotation);

                    const gradient = ctx.createRadialGradient(-20, -20, 10, 0, 0, CAN_RADIUS);
                    gradient.addColorStop(0, '#94a3b8');
                    gradient.addColorStop(0.3, '#64748b');
                    gradient.addColorStop(0.6, '#475569');
                    gradient.addColorStop(1, '#334155');

                    ctx.shadowBlur = 10;
                    ctx.shadowColor = 'rgba(15, 22, 32, 0.25)';
                    ctx.beginPath();
                    ctx.arc(0, 0, CAN_RADIUS, 0, Math.PI * 2);
                    ctx.fillStyle = gradient;
                    ctx.fill();
                    ctx.strokeStyle = '#0f1620';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    ctx.shadowBlur = 0;

                    ctx.beginPath();
                    ctx.arc(0, 0, CAN_RADIUS - 5, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(15, 22, 32, 0.42)';
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    ctx.fillStyle = '#64748b';
                    ctx.beginPath();
                    ctx.ellipse(CAN_RADIUS * 0.4, 0, 10, 15, 0, 0, Math.PI*2);
                    ctx.fill();

                    if (showChargesRef.current) {
                        state.electrons.forEach(p => {
                            ctx.shadowBlur = 0;
                            ctx.fillStyle = '#c8324a';
                            ctx.font = 'bold 16px Poppins, sans-serif';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillText('+', p.basePosition.x, p.basePosition.y);
                        });
                        ctx.shadowBlur = 0;
                    }
                    ctx.restore();

                    if (showChargesRef.current) {
                        ctx.save();
                        ctx.translate(state.canX, canY);
                        state.electrons.forEach(p => {
                            const outerGlow = ctx.createRadialGradient(p.currentPosition.x, p.currentPosition.y, 0, p.currentPosition.x, p.currentPosition.y, 18);
                            outerGlow.addColorStop(0, 'rgba(59, 130, 246, 0.30)');
                            outerGlow.addColorStop(0.5, 'rgba(59, 130, 246, 0.10)');
                            outerGlow.addColorStop(1, 'rgba(59, 130, 246, 0)');
                            ctx.beginPath();
                            ctx.arc(p.currentPosition.x, p.currentPosition.y, 18, 0, Math.PI * 2);
                            ctx.fillStyle = outerGlow;
                            ctx.fill();

                            ctx.shadowBlur = 0;
                            ctx.fillStyle = '#1e40af';
                            ctx.font = 'bold 20px Poppins, sans-serif';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillText('−', p.currentPosition.x, p.currentPosition.y);
                        });
                        ctx.shadowBlur = 0;
                        ctx.restore();
                    }

                    animationFrameId = requestAnimationFrame(render);
                };

                animationFrameId = requestAnimationFrame(render);

                return () => {
                    cancelAnimationFrame(animationFrameId);
                };
            }, [resetSignal, initCharges]);

            useEffect(() => {
                const handleResize = () => {
                    if (containerRef.current && canvasRef.current) {
                        const rect = containerRef.current.getBoundingClientRect();
                        canvasRef.current.width = rect.width;
                        canvasRef.current.height = rect.height;

                        if (!Number.isFinite(physicsState.current.canX) || physicsState.current.canX > rect.width + 200 || physicsState.current.canX < -200) {
                            physicsState.current.canX = rect.width * 0.75;
                            physicsState.current.rodX = rect.width * 0.15;
                        }
                    }
                };

                window.addEventListener('resize', handleResize);
                setTimeout(handleResize, 0);

                return () => window.removeEventListener('resize', handleResize);
            }, []);

            return (
                <div ref={containerRef} className="absolute inset-0 cursor-move">
                    <canvas
                        ref={canvasRef}
                        className="block touch-none"
                        style={{ width: '100%', height: '100%' }}
                    />
                </div>
            );
        };

        const ContactOverlay = ({ onReset }) => {
            return (
                <div className="contact-overlay" onClick={onReset}>
                    <div className="contact-banner" onClick={(e) => e.stopPropagation()}>
                        <div className="flbl mb-2">Staven nuddade burken</div>
                        <p className="text-sm mb-4" style={{ color: 'var(--lab-ink-soft)', lineHeight: 1.65 }}>
                            Nu överförs elektroner från den negativt laddade staven till burken.
                            Burken blir negativt laddad och är inte längre neutral. Eftersom både
                            staven och burken nu är negativa repellerar de varandra.
                        </p>
                        <button className="btn-toggle active" onClick={onReset}>Börja om</button>
                    </div>
                </div>
            );
        };

        // ==================== ISOLATOR SIMULATION (BALLONG) ====================

        const IsolatorCanvas = ({ resetSignal, onHint }) => {
            const canvasRef = useRef(null);
            const containerRef = useRef(null);
            const onHintRef = useRef(onHint);
            const lastHintRef = useRef('');
            useEffect(() => { onHintRef.current = onHint; }, [onHint]);

            const BALLOON_RADIUS = 50;
            const HEAD_WIDTH = 80;
            const HEAD_HEIGHT = 100;
            const CEILING_HEIGHT = 80;
            const NUM_DIPOLES = 10;
            const DIPOLE_ROWS = 2;

            const physicsState = useRef({
                balloonX: 0,
                balloonY: 0,
                balloonVY: 0,
                isCharged: false,
                chargeLevel: 0,
                isRubbing: false,
                rubCount: 0,
                isDragging: false,
                isStuck: false,
                headX: 0,
                headY: 0,
                dipoles: [],
                electrons: [],
                hairStrands: [],
                lastTime: 0,
            });

            const initDipoles = useCallback((width) => {
                const dipoles = [];
                const spacing = width / (NUM_DIPOLES + 1);
                const rowSpacing = 30;
                for (let row = 0; row < DIPOLE_ROWS; row++) {
                    const offset = row % 2 === 1 ? spacing / 2 : 0; // Offset every other row
                    for (let i = 0; i < NUM_DIPOLES; i++) {
                        dipoles.push({
                            x: spacing * (i + 1) + offset,
                            y: 35 + row * rowSpacing,
                            angle: Math.random() * Math.PI * 2,
                            targetAngle: Math.random() * Math.PI * 2,
                        });
                    }
                }
                return dipoles;
            }, []);

            const initElectrons = useCallback(() => {
                const electrons = [];
                const numElectrons = 16;
                for (let i = 0; i < numElectrons; i++) {
                    const angle = (i / numElectrons) * Math.PI * 2;
                    electrons.push({
                        angle: angle,
                        radius: BALLOON_RADIUS - 8,
                        baseAngle: angle,
                    });
                }
                return electrons;
            }, []);

            const initHairStrands = useCallback(() => {
                const strands = [];
                // Skapa hårstrån runt toppen av huvudet i en halvcirkel
                const numStrands = 35;
                for (let i = 0; i < numStrands; i++) {
                    // Fördela i en båge från -80 till +80 grader (toppen av huvudet)
                    const t = i / (numStrands - 1); // 0 till 1
                    const arcAngle = -Math.PI * 0.45 + t * Math.PI * 0.9; // -80 till +80 grader

                    // Kortare baslängd - håret blir längre efter laddning
                    const baseLength = 12 + Math.random() * 8;

                    strands.push({
                        arcAngle, // Position på huvudets båge
                        baseLength,
                        randomCurve: (Math.random() - 0.5) * 0.4,
                        randomLength: Math.random() * 0.3, // Extra längdvariation
                        isHighlight: i % 4 === 0,
                        flutter: 0,
                    });
                }
                return strands;
            }, []);

            useEffect(() => {
                if (!containerRef.current) return;
                const width = containerRef.current.clientWidth;
                const height = containerRef.current.clientHeight;

                physicsState.current.balloonX = width * 0.3;
                physicsState.current.balloonY = height * 0.6;
                physicsState.current.balloonVY = 0;
                physicsState.current.isCharged = false;
                physicsState.current.chargeLevel = 0;
                physicsState.current.isRubbing = false;
                physicsState.current.rubCount = 0;
                physicsState.current.isDragging = false;
                physicsState.current.isStuck = false;
                physicsState.current.headX = width * 0.7;
                physicsState.current.headY = height * 0.75;
                physicsState.current.dipoles = initDipoles(width);
                physicsState.current.electrons = initElectrons();
                physicsState.current.hairStrands = initHairStrands();
                physicsState.current.lastTime = 0;
            }, [resetSignal, initDipoles, initElectrons, initHairStrands]);

            const handleInput = useCallback((clientX, clientY, isDown = false) => {
                if (!canvasRef.current) return;
                const rect = canvasRef.current.getBoundingClientRect();
                const x = clientX - rect.left;
                const y = clientY - rect.top;
                const state = physicsState.current;

                const distToBalloon = Math.sqrt(
                    Math.pow(x - state.balloonX, 2) + Math.pow(y - state.balloonY, 2)
                );

                if (isDown && distToBalloon < BALLOON_RADIUS + 20) {
                    state.isDragging = true;
                    state.isStuck = false;
                }

                if (state.isDragging) {
                    // Ceiling line is at CEILING_HEIGHT + 30, balloon stops when its top edge touches it
                    const ceilingLineY = CEILING_HEIGHT + 30;
                    const minBalloonY = ceilingLineY + BALLOON_RADIUS;

                    state.balloonX = x;
                    state.balloonY = Math.max(minBalloonY, y);

                    // Check if rubbing against hair on head
                    const hairTopY = state.headY - HEAD_HEIGHT / 2 - 30; // Top of hair
                    const distToHead = Math.sqrt(
                        Math.pow(x - state.headX, 2) + Math.pow(y - hairTopY, 2)
                    );

                    if (distToHead < BALLOON_RADIUS + 50) {
                        if (!state.isRubbing) {
                            state.isRubbing = true;
                            state.rubCount++;
                            if (state.rubCount >= 3) {
                                state.isCharged = true;
                            }
                            state.chargeLevel = Math.min(1, state.chargeLevel + 0.35);
                        }
                    } else {
                        state.isRubbing = false;
                    }

                    // Check if near ceiling - balloon sticks when charged and touching ceiling
                    if (state.isCharged && state.balloonY <= minBalloonY + 10) {
                        state.isStuck = true;
                        state.balloonY = minBalloonY;
                    }
                }
            }, []);

            const handleInputEnd = useCallback(() => {
                physicsState.current.isDragging = false;
            }, []);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;

                const onMouseMove = (e) => handleInput(e.clientX, e.clientY);
                const onMouseDown = (e) => handleInput(e.clientX, e.clientY, true);
                const onMouseUp = () => handleInputEnd();
                const onTouchMove = (e) => {
                    e.preventDefault();
                    handleInput(e.touches[0].clientX, e.touches[0].clientY);
                };
                const onTouchStart = (e) => {
                    e.preventDefault();
                    handleInput(e.touches[0].clientX, e.touches[0].clientY, true);
                };
                const onTouchEnd = () => handleInputEnd();

                canvas.addEventListener('mousemove', onMouseMove);
                canvas.addEventListener('mousedown', onMouseDown);
                canvas.addEventListener('mouseup', onMouseUp);
                canvas.addEventListener('mouseleave', onMouseUp);
                canvas.addEventListener('touchmove', onTouchMove, { passive: false });
                canvas.addEventListener('touchstart', onTouchStart, { passive: false });
                canvas.addEventListener('touchend', onTouchEnd);

                return () => {
                    canvas.removeEventListener('mousemove', onMouseMove);
                    canvas.removeEventListener('mousedown', onMouseDown);
                    canvas.removeEventListener('mouseup', onMouseUp);
                    canvas.removeEventListener('mouseleave', onMouseUp);
                    canvas.removeEventListener('touchmove', onTouchMove);
                    canvas.removeEventListener('touchstart', onTouchStart);
                    canvas.removeEventListener('touchend', onTouchEnd);
                };
            }, [handleInput, handleInputEnd]);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                if (!ctx) return;

                let animationFrameId;

                const render = (time) => {
                    const { width, height } = canvas;
                    const state = physicsState.current;

                    if (width === 0 || height === 0) {
                        animationFrameId = requestAnimationFrame(render);
                        return;
                    }

                    if (state.lastTime === 0) state.lastTime = time;
                    let deltaTime = (time - state.lastTime) / 1000;
                    state.lastTime = time;
                    if (deltaTime < 0 || deltaTime > 0.1) deltaTime = 0.016;

                    // Update dipole angles based on balloon position
                    if (state.isCharged) {
                        state.dipoles.forEach(dipole => {
                            const dx = state.balloonX - dipole.x;
                            const dy = state.balloonY - dipole.y;
                            const dist = Math.sqrt(dx * dx + dy * dy);

                            // Only start rotating when balloon is close (within 180px)
                            if (dist < 180) {
                                // Point positive end toward balloon
                                dipole.targetAngle = Math.atan2(dy, dx);
                                // Faster rotation when closer
                                const rotationSpeed = 0.15 * (1 - dist / 180);
                                let angleDiff = dipole.targetAngle - dipole.angle;
                                while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                                while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                                dipole.angle += angleDiff * (0.05 + rotationSpeed);
                            }
                            // When far away, dipoles stay in their random orientation
                        });
                    }

                    // Update hair strands - endast fladder vid gnuggning
                    state.hairStrands.forEach(strand => {
                        if (state.isRubbing) {
                            // Fladdra medan man gnuggar
                            strand.flutter = Math.sin(time * 0.02 + strand.arcAngle * 5) * 0.15;
                        } else {
                            // Inget fladder annars - håret står stilla
                            strand.flutter *= 0.9; // Mjuk övergång tillbaka till stillhet
                            if (Math.abs(strand.flutter) < 0.001) strand.flutter = 0;
                        }
                    });

                    // Apply gravity if not dragging and not stuck
                    if (!state.isDragging && !state.isStuck && state.balloonY < height - BALLOON_RADIUS) {
                        state.balloonVY += 200 * deltaTime;
                        state.balloonY += state.balloonVY * deltaTime;

                        if (state.balloonY > height - BALLOON_RADIUS) {
                            state.balloonY = height - BALLOON_RADIUS;
                            state.balloonVY = 0;
                        }
                    }

                    // Papper-bakgrund
                    ctx.fillStyle = '#f3eee4';
                    ctx.fillRect(0, 0, width, height);

                    // (Mörkblå bakgrundsvinjett borttagen — blev en grå fläck på papperstemat)

                    // Draw ceiling
                    const ceilingGradient = ctx.createLinearGradient(0, 0, 0, CEILING_HEIGHT + 30);
                    ceilingGradient.addColorStop(0, '#f3eee4');
                    ceilingGradient.addColorStop(1, '#f3eee4');
                    ctx.fillStyle = ceilingGradient;
                    ctx.fillRect(0, 0, width, CEILING_HEIGHT + 30);

                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.moveTo(0, CEILING_HEIGHT + 30);
                    ctx.lineTo(width, CEILING_HEIGHT + 30);
                    ctx.strokeStyle = '#334155';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.shadowBlur = 0;

                    // Draw dipoles in ceiling
                    state.dipoles.forEach(dipole => {
                        ctx.save();
                        ctx.translate(dipole.x, dipole.y);
                        ctx.rotate(dipole.angle);

                        // Dipole oval shape
                        const dipoleWidth = 40;
                        const dipoleHeight = 16;

                        // Draw oval
                        ctx.beginPath();
                        ctx.ellipse(0, 0, dipoleWidth / 2, dipoleHeight / 2, 0, 0, Math.PI * 2);
                        ctx.fillStyle = '#334155';
                        ctx.strokeStyle = '#475569';
                        ctx.lineWidth = 2;
                        ctx.fill();
                        ctx.stroke();

                        // Positive side (right, toward balloon when aligned)
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = '#c8324a';
                        ctx.font = 'bold 14px Poppins, sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('+', dipoleWidth / 4, 0);

                        // Negative side (left) — glödande blå elektron
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = '#1e40af';
                        ctx.fillText('−', -dipoleWidth / 4, 0);
                        ctx.shadowBlur = 0;

                        ctx.restore();
                    });

                    // Draw head with hair
                    ctx.save();
                    ctx.translate(state.headX, state.headY);

                    // Hair (drawn first, behind head)
                    const hairColor = '#5d4037';
                    const hairHighlight = '#8d6e63';

                    // Rita hårstrån runt huvudets topp
                    ctx.lineWidth = 3;
                    ctx.lineCap = 'round';

                    // Huvudets radie för att placera hårfästen
                    const headRadiusX = HEAD_WIDTH / 2;
                    const headRadiusY = HEAD_HEIGHT / 2;

                    state.hairStrands.forEach(strand => {
                        // Startposition på huvudets ellips
                        const startX = Math.sin(strand.arcAngle) * headRadiusX * 0.9;
                        const startY = -Math.cos(strand.arcAngle) * headRadiusY * 0.85;

                        // Hårlängd - blir längre när laddat (håret spretar mer)
                        // chargeLevel 0 = kort hår, chargeLevel 1 = långt hår (2x längre)
                        const chargeLengthMultiplier = 1 + state.chargeLevel * 1.5;
                        const hairLength = strand.baseLength * (1 + strand.randomLength) * chargeLengthMultiplier;

                        // Håret pekar alltid ut från huvudet
                        const normalAngle = strand.arcAngle;

                        // Lägg till lite fladder endast vid gnuggning
                        const flutterOffset = strand.flutter || 0;

                        // Slutposition - pekar ut från huvudet
                        const endX = startX + Math.sin(normalAngle + flutterOffset) * hairLength;
                        const endY = startY - Math.cos(normalAngle + flutterOffset) * hairLength;

                        // Kontrollpunkt för mjuk kurva
                        const ctrlX = startX + Math.sin(normalAngle + flutterOffset) * hairLength * 0.5 + strand.randomCurve * 8;
                        const ctrlY = startY - Math.cos(normalAngle + flutterOffset) * hairLength * 0.5;

                        ctx.beginPath();
                        ctx.moveTo(startX, startY);
                        ctx.quadraticCurveTo(ctrlX, ctrlY, endX, endY);
                        ctx.strokeStyle = strand.isHighlight ? hairHighlight : hairColor;
                        ctx.stroke();
                    });

                    // Head shape (oval face)
                    const headGradient = ctx.createRadialGradient(-10, -15, 10, 0, 0, HEAD_HEIGHT / 2);
                    headGradient.addColorStop(0, '#fcd5b8');
                    headGradient.addColorStop(0.5, '#e8b896');
                    headGradient.addColorStop(1, '#d4a584');

                    ctx.beginPath();
                    ctx.ellipse(0, 0, HEAD_WIDTH / 2, HEAD_HEIGHT / 2, 0, 0, Math.PI * 2);
                    ctx.fillStyle = headGradient;
                    ctx.fill();
                    ctx.strokeStyle = '#c4957a';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    // Eyes
                    ctx.fillStyle = '#0f1620';
                    ctx.beginPath();
                    ctx.ellipse(-15, -10, 6, 8, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(15, -10, 6, 8, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Eye highlights
                    ctx.fillStyle = '#0f1620';
                    ctx.beginPath();
                    ctx.arc(-17, -12, 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(13, -12, 2, 0, Math.PI * 2);
                    ctx.fill();

                    // Smile
                    ctx.strokeStyle = '#8b6c5c';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(0, 10, 15, 0.2, Math.PI - 0.2);
                    ctx.stroke();

                    // Neck
                    const neckGradient = ctx.createLinearGradient(-15, HEAD_HEIGHT/2, 15, HEAD_HEIGHT/2);
                    neckGradient.addColorStop(0, '#d4a584');
                    neckGradient.addColorStop(0.5, '#e8b896');
                    neckGradient.addColorStop(1, '#d4a584');
                    ctx.fillStyle = neckGradient;
                    ctx.fillRect(-15, HEAD_HEIGHT/2 - 5, 30, 25);

                    // Shoulders/upper body
                    const bodyGradient = ctx.createLinearGradient(0, HEAD_HEIGHT/2 + 15, 0, HEAD_HEIGHT/2 + 80);
                    bodyGradient.addColorStop(0, '#3b82f6');
                    bodyGradient.addColorStop(1, '#1d4ed8');
                    ctx.fillStyle = bodyGradient;
                    ctx.beginPath();
                    ctx.moveTo(-15, HEAD_HEIGHT/2 + 20);
                    ctx.quadraticCurveTo(-60, HEAD_HEIGHT/2 + 30, -70, HEAD_HEIGHT/2 + 80);
                    ctx.lineTo(70, HEAD_HEIGHT/2 + 80);
                    ctx.quadraticCurveTo(60, HEAD_HEIGHT/2 + 30, 15, HEAD_HEIGHT/2 + 20);
                    ctx.closePath();
                    ctx.fill();

                    // Collar/shirt detail
                    ctx.strokeStyle = '#2563eb';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(-10, HEAD_HEIGHT/2 + 20);
                    ctx.lineTo(0, HEAD_HEIGHT/2 + 35);
                    ctx.lineTo(10, HEAD_HEIGHT/2 + 20);
                    ctx.stroke();

                    // Show positive charges in hair if electrons transferred - i en båge
                    if (state.chargeLevel > 0) {
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = '#c8324a';
                        ctx.font = 'bold 18px Poppins, sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        const numCharges = Math.floor(state.chargeLevel * 6);
                        for (let i = 0; i < numCharges; i++) {
                            // Fördela i en båge över huvudet
                            const t = numCharges > 1 ? i / (numCharges - 1) : 0.5;
                            const arcAngle = -Math.PI * 0.35 + t * Math.PI * 0.7;
                            const radius = HEAD_HEIGHT / 2 + 15;
                            const x = Math.sin(arcAngle) * radius;
                            const y = -Math.cos(arcAngle) * radius;
                            ctx.fillText('+', x, y);
                        }
                        ctx.shadowBlur = 0;
                    }

                    ctx.restore();

                    // Draw balloon
                    ctx.save();
                    ctx.translate(state.balloonX, state.balloonY);

                    // Balloon glow if charged
                    if (state.isCharged) {
                        ctx.shadowBlur = 30;
                        ctx.shadowColor = 'rgba(59, 130, 246, 0.45)';   // blå glöd: negativ laddning
                    }

                    // Balloon gradient
                    const balloonGradient = ctx.createRadialGradient(-20, -20, 10, 0, 0, BALLOON_RADIUS);
                    balloonGradient.addColorStop(0, '#86efac');
                    balloonGradient.addColorStop(0.4, '#22c55e');
                    balloonGradient.addColorStop(0.8, '#15803d');
                    balloonGradient.addColorStop(1, '#14532d');

                    ctx.beginPath();
                    ctx.arc(0, 0, BALLOON_RADIUS, 0, Math.PI * 2);
                    ctx.fillStyle = balloonGradient;
                    ctx.fill();
                    ctx.strokeStyle = '#bbf7d0';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.shadowBlur = 0;

                    // Balloon highlight
                    ctx.beginPath();
                    ctx.arc(-25, -25, 15, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                    ctx.fill();

                    // Balloon knot - vriden 180 grader (pekar uppåt in i ballongen)
                    ctx.beginPath();
                    ctx.moveTo(0, BALLOON_RADIUS - 5);
                    ctx.lineTo(-6, BALLOON_RADIUS + 8);
                    ctx.lineTo(6, BALLOON_RADIUS + 8);
                    ctx.closePath();
                    ctx.fillStyle = '#166534';
                    ctx.fill();

                    // Draw electrons on balloon if charged
                    if (state.chargeLevel > 0) {
                        const numVisible = Math.max(1, Math.floor(state.chargeLevel * state.electrons.length));
                        const electronRadius = BALLOON_RADIUS - 8;
                        for (let i = 0; i < numVisible; i++) {
                            // Distribute electrons evenly around the balloon
                            const angle = (i / numVisible) * Math.PI * 2;
                            const x = Math.cos(angle) * electronRadius;
                            const y = Math.sin(angle) * electronRadius;

                            // Outer glow — glödande blå
                            const outerGlow = ctx.createRadialGradient(x, y, 0, x, y, 14);
                            outerGlow.addColorStop(0, 'rgba(59, 130, 246, 0.85)');
                            outerGlow.addColorStop(0.5, 'rgba(59, 130, 246, 0.35)');
                            outerGlow.addColorStop(1, 'rgba(59, 130, 246, 0)');
                            ctx.beginPath();
                            ctx.arc(x, y, 14, 0, Math.PI * 2);
                            ctx.fillStyle = outerGlow;
                            ctx.fill();

                            // Minus sign
                            ctx.shadowBlur = 0;
                            ctx.fillStyle = '#1e40af';
                            ctx.font = 'bold 16px Poppins, sans-serif';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillText('−', x, y);
                        }
                        ctx.shadowBlur = 0;
                    }

                    ctx.restore();

                    // Ledtexten visas i scenens hint-ruta (.scene-hint), som i
                    // övriga simuleringar — inte ritad på canvasen.
                    let instruction = 'Dra ballongen mot håret för att ladda den.';
                    if (state.isStuck) {
                        instruction = 'Ballongen sitter fast. Dipolerna i taket har vridit sig.';
                    } else if (state.isCharged) {
                        instruction = 'Dra den laddade ballongen upp mot taket.';
                    } else if (state.isRubbing || state.chargeLevel > 0) {
                        instruction = 'Gnugga mer!';
                    }
                    if (instruction !== lastHintRef.current) {
                        lastHintRef.current = instruction;
                        if (onHintRef.current) onHintRef.current(instruction);
                    }

                    animationFrameId = requestAnimationFrame(render);
                };

                animationFrameId = requestAnimationFrame(render);

                return () => cancelAnimationFrame(animationFrameId);
            }, [resetSignal]);

            useEffect(() => {
                const handleResize = () => {
                    if (containerRef.current && canvasRef.current) {
                        const rect = containerRef.current.getBoundingClientRect();
                        canvasRef.current.width = rect.width;
                        canvasRef.current.height = rect.height;
                    }
                };

                window.addEventListener('resize', handleResize);
                setTimeout(handleResize, 0);

                return () => window.removeEventListener('resize', handleResize);
            }, []);

            return (
                <div ref={containerRef} className="absolute inset-0 cursor-grab active:cursor-grabbing">
                    <canvas
                        ref={canvasRef}
                        className="block touch-none"
                        style={{ width: '100%', height: '100%' }}
                    />
                </div>
            );
        };

        // ==================== MAIN APP ====================

        const FS_ICON = (isFullscreen) => isFullscreen ? (
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M9 3v6H3"/><path d="M15 21v-6h6"/><path d="M21 9h-6V3"/><path d="M3 15h6v6"/>
            </svg>
        ) : (
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M3 9V3h6"/><path d="M21 9V3h-6"/><path d="M3 15v6h6"/><path d="M21 15v6h-6"/>
            </svg>
        );

        const TEXTER = {
            ledare: {
                gor: 'Dra ebonitstaven mot burken och se hur burken börjar rulla efter staven. Nuddar staven burken hoppar elektroner över till burken, och då stöts burken i stället bort.',
                kort: [
                    { titel: 'Ebonitstav', text: 'Negativt laddad efter att ha gnidits mot päls. De negativa laddningarna repellerar elektronerna i burken.' },
                    { titel: 'Influens i ledare', text: 'Elektronerna i burken flyttar sig fritt bort från staven. Sidan närmast staven blir positiv och attraheras av staven.' },
                ],
            },
            isolator: {
                gor: 'Gnugga ballongen mot håret så att den laddas, och dra den sedan upp mot taket. Dipolerna i taket vrider sig och ballongen fastnar.',
                kort: [
                    { titel: 'Laddad ballong', text: 'När ballongen gnuggas mot hår överförs elektroner till ballongen, som blir negativt laddad.' },
                    { titel: 'Influens i isolator', text: 'I en isolator kan elektroner inte röra sig fritt. I stället vrids dipolerna så att deras positiva ändar pekar mot ballongen.' },
                ],
            },
        };

        function App() {
            const [mode, setMode] = useState('ledare');
            const [showCharges, setShowCharges] = useState(true);
            const [resetSignal, setResetSignal] = useState(0);
            const [showContact, setShowContact] = useState(false);
            const [togglesOpen, setTogglesOpen] = useState(true);
            const [isolatorHint, setIsolatorHint] = useState('Dra ballongen mot håret för att ladda den.');
            const sceneWrapRef = useRef(null);
            const [isFullscreen, toggleFullscreen] = useFullscreen(sceneWrapRef);

            const reset = useCallback(() => {
                setShowContact(false);
                setResetSignal(prev => prev + 1);
            }, []);
            const handleContact = useCallback(() => setShowContact(true), []);
            const switchMode = (m) => {
                if (m === mode) return;
                setMode(m);
                setShowContact(false);
                setResetSignal(prev => prev + 1);
            };

            const hint = mode === 'ledare'
                ? (showContact ? 'Klicka på Börja om för att göra om försöket.' : 'Flytta staven med musen eller fingret.')
                : isolatorHint;
            const t = TEXTER[mode];

            // Inställningsrutan uppe till höger. I normalläget bara visningsvalet
            // (situationsväljaren och Börja om bor i sidopanelen); i fullskärm
            // samlas allt här. Hopfällbar med krysset/den runda knappen.
            const harToggles = isFullscreen || mode === 'ledare';
            const sceneToggles = () => {
                if (!harToggles) return null;
                if (!togglesOpen) return (
                    <button className="st-show-btn" onClick={() => setTogglesOpen(true)}
                            aria-label="Visa inställningar" title="Visa inställningar" aria-expanded="false">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             strokeWidth="2" strokeLinecap="round" aria-hidden="true">
                            <line x1="4" y1="8" x2="20" y2="8" />
                            <circle cx="14.5" cy="8" r="2.7" fill="currentColor" stroke="none" />
                            <line x1="4" y1="16" x2="20" y2="16" />
                            <circle cx="9.5" cy="16" r="2.7" fill="currentColor" stroke="none" />
                        </svg>
                    </button>
                );
                return (
                    <div className="scene-toggles">
                        <button className="st-hide" onClick={() => setTogglesOpen(false)}
                                aria-label="Dölj inställningar" title="Dölj inställningar" aria-expanded="true">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 strokeWidth="2.4" strokeLinecap="round" aria-hidden="true">
                                <path d="M6 6l12 12M18 6L6 18" />
                            </svg>
                        </button>
                        {isFullscreen && (
                            <React.Fragment>
                                <div className="st-title">Situation</div>
                                <label><input type="radio" name="sit" checked={mode === 'ledare'} onChange={() => switchMode('ledare')} /><span>Ledare (burk)</span></label>
                                <label><input type="radio" name="sit" checked={mode === 'isolator'} onChange={() => switchMode('isolator')} /><span>Isolator (ballong)</span></label>
                            </React.Fragment>
                        )}
                        {mode === 'ledare' && (
                            <React.Fragment>
                                <div className={'st-title' + (isFullscreen ? ' mt' : '')}>Visa</div>
                                <label><input type="checkbox" checked={showCharges} onChange={() => setShowCharges(v => !v)} /><span>Laddningar</span></label>
                            </React.Fragment>
                        )}
                        {isFullscreen && (
                            <div className="st-actions">
                                <button className="btn-toggle" onClick={reset}>Börja om</button>
                            </div>
                        )}
                    </div>
                );
            };

            return (
                <div className="min-h-screen dark-container px-4 md:px-8 pb-12">
                    <div className="max-w-6xl mx-auto pt-6">
                        <div className="breadcrumb mb-4" style={{ fontSize: 13 }}>
                            <a href="index.html">Hem</a> / <a href="katalog.html#fy1">Fysik nivå 1</a> / Elektrisk influens
                        </div>
                        <div className="intro-head">
                            <h1 className="text-3xl md:text-4xl font-black tracking-tight" style={{ color: 'var(--lab-ink)' }}>Elektrisk influens</h1>
                            {/* Växlare till avsnittets andra simulering */}
                            <div className="sim-switch-wrap">
                                <span className="sim-switch-label">Simulering</span>
                                <div className="sim-switch">
                                    <span className="sim-switch-active">Elektrisk influens</span>
                                    <a href="fysik1-bandgenerator-app.html">Bandgeneratorn</a>
                                </div>
                            </div>
                        </div>
                        <p className="mt-2 mb-5" style={{ color: 'var(--lab-ink-soft)', maxWidth: 820 }}>
                            Ett laddat föremål kan dra till sig ett neutralt föremål utan att röra det.
                            Laddningarna i det neutrala föremålet omfördelas, och det kallas <strong>influens</strong>.
                            I en <strong>ledare</strong>, som aluminiumburken, rör sig elektronerna fritt: de stöts
                            bort från den negativa ebonitstaven, burkens närmaste sida blir positiv och burken
                            rullar mot staven. I en <strong>isolator</strong>, som taket ballongen fastnar på, sitter
                            elektronerna fast, men molekylernas <strong>dipoler</strong> vrider sig så att de
                            positiva ändarna vänds mot ballongen.
                        </p>

                        <main className="flex flex-col lg:flex-row gap-6">
                            {/* Scen */}
                            <div className="lg:w-3/5 order-1">
                                <div className="scene-wrap" data-theme="ljusPapper" ref={sceneWrapRef}>
                                    {mode === 'ledare'
                                        ? <LedareCanvas showCharges={showCharges} resetSignal={resetSignal}
                                                        onContact={showContact ? null : handleContact} />
                                        : <IsolatorCanvas resetSignal={resetSignal} onHint={setIsolatorHint} />}
                                    {mode === 'ledare' && showContact && <ContactOverlay onReset={reset} />}

                                    <div className="scene-hint">{hint}</div>
                                    {sceneToggles()}

                                    <button className="fs-btn" onClick={toggleFullscreen} aria-label="Fullskärm"
                                            title={isFullscreen ? 'Lämna fullskärm' : 'Fullskärm'}>
                                        {FS_ICON(isFullscreen)}
                                    </button>
                                </div>
                            </div>

                            {/* Kontroller */}
                            <div className="lg:w-2/5 order-2">
                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <div className="flbl mb-2">Situation</div>
                                    <div className="mode-seg">
                                        <button className={mode === 'ledare' ? 'active' : ''} onClick={() => switchMode('ledare')}>
                                            Ledare<span className="sub">aluminiumburk och ebonitstav</span>
                                        </button>
                                        <button className={mode === 'isolator' ? 'active' : ''} onClick={() => switchMode('isolator')}>
                                            Isolator<span className="sub">ballong mot taket</span>
                                        </button>
                                    </div>
                                </div>

                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <div className="flbl mb-1">Så gör du</div>
                                    <p className="text-sm mb-3" style={{ color: 'var(--lab-ink-soft)' }}>{t.gor}</p>
                                    <div className="flex gap-2">
                                        <button className="btn-toggle flex-1" onClick={reset}>Börja om</button>
                                    </div>
                                </div>

                                {t.kort.map(k => (
                                    <div className="glass-card rounded-xl p-3 mb-3" key={k.titel}>
                                        <div className="flbl mb-1">{k.titel}</div>
                                        <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>{k.text}</p>
                                    </div>
                                ))}
                            </div>
                        </main>
                    </div>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
    <script src="feedback.js" defer></script>
    <script src="sim-dock.js" defer></script>
    <script src="data/katalog.js"></script>
    <script src="section-nav.js"></script>
    <!-- Cloudflare Web Analytics: cookiefri besöksmätning, se CLAUDE.md. -->

</body>
