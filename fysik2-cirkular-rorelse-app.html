                if (!running) { lastRef.current = null; return; }
                let raf;
                const step = (ts) => {
                    if (lastRef.current == null) lastRef.current = ts;
                    const dt = Math.min((ts - lastRef.current) / 1000, 0.05);
                    lastRef.current = ts;

                    if (mode === 'cirkel') {
                        setPhase(p => p + (v / r) * dt);
                    } else if (mode === 'bana') {
                        const bs = banaRef.current;
                        const { v: vb, mu: mub, banaGeom: bg } = parRef.current;
                        if (bs.st === 'track') {
                            bs.s = (bs.s + vb * PXB * dt) % bg.Ltot;
                            const q = bg.at(bs.s);
                            // räcker greppet? statisk friktion kan som mest ge μ·m·g
                            if (q.seg.type === 'arc' && vb * vb / q.seg.rm > mub * G) {
                                bs.st = 'skid';
                                bs.x = q.x; bs.y = q.y; bs.hd = q.e; bs.sp = vb * PXB;
                                const p = W2S(q);
                                const inw = { x: q.inward.x, y: -q.inward.y };    // in mot kurvans centrum (SVG)
                                bs.skid = { x: p.x, y: p.y, dx: q.e.x, dy: -q.e.y, lx: inw.x * 34, ly: inw.y * 34 + 5,
                                            anchor: inw.x > 0.3 ? 'start' : (inw.x < -0.3 ? 'end' : 'middle') };
                                bs.trace = [p];
                            }
                        } else if (bs.st === 'skid') {
                            // glidfriktionen bromsar bilen längs den raka sladdlinjen
                            bs.sp = Math.max(0, bs.sp - mub * G * PXB * dt);
                            bs.x += bs.hd.x * bs.sp * dt;
                            bs.y += bs.hd.y * bs.sp * dt;
                            const p = W2S(bs);
                            const lp = bs.trace[bs.trace.length - 1];
                            if (Math.hypot(p.x - lp.x, p.y - lp.y) > 6) bs.trace.push(p);
                            if (bs.sp <= 0.01 || bs.x < -40 || bs.x > VBW + 40 || bs.y < -40 || bs.y > VBH + 40)
                                bs.st = 'failed';
                        } else {
                            bs.failT += dt;
                            if (bs.failT > 2.4) resetBana();
                        }
                        setTick(t => t + 1);
                    } else if (mode === 'kron') {
                        const ks = kronRef.current;
                        const { v: vk, m: mk, kronGeom: kg } = parRef.current;
                        if (ks.st === 'track') {
                            ks.s += vk * PXK * dt;
                            if (ks.s >= kg.Ltot) ks.s -= kg.Ltot;           // bilen kommer in igen från vänster
                            const q = kg.at(ks.s);
                            // lättar bilen? På ett krön är F_N = m·g·cos α − m·v²/r; blir den
                            // 0 finns inget som håller bilen kvar på vägen.
                            if (q.seg.type === 'arc' && q.seg.kind === 'krön' && kronForces(q, vk, mk).N <= 0) {
                                ks.st = 'ballistic';
                                ks.x = q.x; ks.y = q.y;
                                ks.vx = vk * PXK * Math.cos(q.psi); ks.vy = vk * PXK * Math.sin(q.psi);
                                ks.rot = q.psi; ks.bT = 0;
                                const p = W2S(q);
                                ks.detach = { x: p.x, y: p.y };
                                ks.trace = [p];
                            }
                        } else if (ks.st === 'ballistic') {
                            ks.vy -= G * PXK * dt;
                            ks.x += ks.vx * dt;
                            ks.y += ks.vy * dt;
                            ks.rot = Math.atan2(ks.vy, ks.vx);
                            ks.bT += dt;
                            const p = W2S(ks);
                            const lp = ks.trace[ks.trace.length - 1];
                            if (Math.hypot(p.x - lp.x, p.y - lp.y) > 7) ks.trace.push(p);
                            if ((ks.bT > 0.1 && ks.y <= kg.roadY(ks.x)) || ks.x > VBW + 40) ks.st = 'failed';
                        } else {
                            ks.failT += dt;
                            if (ks.failT > 2.4) resetKron();
                        }
                        setTick(t => t + 1);
                    } else {
                        const ls = loopRef.current;
                        if (ls.st === 'track') {
                            // fart ur energiprincipen (exakt, ingen drift)
                            const v2 = v0 * v0 - 2 * G * RL * (1 - Math.cos(ls.th));
                            if (v2 <= 0.0005) {
                                ls.dir = -ls.dir;                       // vändläge — rulla tillbaka
                                ls.th += ls.dir * 0.002;
                            } else {
                                const vmag = Math.sqrt(v2);
                                ls.th += ls.dir * (vmag / RL) * dt;
                                // släpper bilen? (övre halvan: krävd centripetalkraft > vad
                                // tyngdkraftens komposant kan ge när F_N = 0)
                                const c = Math.cos(ls.th);
                                if (c < 0 && (v2 / RL + G * c) <= 0) {
                                    ls.st = 'ballistic';
                                    const sn = Math.sin(ls.th);
                                    ls.x = LCX + LRPX * sn; ls.y = LCY + LRPX * c;
                                    const sp = Math.sqrt(Math.max(0, v2)) * PXM;
                                    ls.vx = Math.cos(ls.th) * sp * ls.dir;
                                    ls.vy = -Math.sin(ls.th) * sp * ls.dir;
                                    ls.rot = ls.th;
                                    ls.detach = { x: ls.x, y: ls.y,
                                                  lx: sn >= 0 ? 14 : -14, ly: c < 0 ? -10 : 18,
                                                  anchor: sn >= 0 ? 'start' : 'end' };
                                    ls.trace = [{ x: ls.x, y: ls.y }];
                                }
                            }
                        } else if (ls.st === 'ballistic') {
                            ls.vy += G * PXM * dt;
                            ls.x += ls.vx * dt;
                            ls.y += ls.vy * dt;
                            ls.bT += dt;
                            if (ls.trace.length === 0 ||
                                Math.hypot(ls.x - ls.trace[ls.trace.length - 1].x, ls.y - ls.trace[ls.trace.length - 1].y) > 7)
                                ls.trace.push({ x: ls.x, y: ls.y });
                            // Bilen släpper PÅ cirkeln (radialfart 0) och faller inåt.
                            // Banan räknas som träffad först när bilen åter når ringen
                            // MED radialfart utåt — annars triggar kraschen direkt i
                            // släppögonblicket.
                            const dc = Math.hypot(ls.x - LCX, ls.y - LCY);
                            const vr = ((ls.x - LCX) * ls.vx + (ls.y - LCY) * ls.vy) / (dc || 1);
                            if ((dc >= LRPX - 3 && vr > 0 && ls.bT > 0.15) || ls.y >= GROUND_Y - 10) ls.st = 'failed';
                        } else if (ls.st === 'failed') {
                            ls.failT += dt;
                            if (ls.failT > 2.4) resetLoop();
                        }
                        setTick(t => t + 1);
                    }
                    raf = requestAnimationFrame(step);
                };
                raf = requestAnimationFrame(step);
                return () => cancelAnimationFrame(raf);
            }, [running, mode, v, r, v0]);

            // fullskärm
            useEffect(() => {
                const handler = () => {
                    const fs = document.fullscreenElement === sceneWrapRef.current ||
                        document.webkitFullscreenElement === sceneWrapRef.current;
                    setIsFullscreen(fs);
                };
                document.addEventListener('fullscreenchange', handler);
                document.addEventListener('webkitfullscreenchange', handler);
                return () => {
                    document.removeEventListener('fullscreenchange', handler);
                    document.removeEventListener('webkitfullscreenchange', handler);
                };
            }, []);
            const toggleFullscreen = () => {
                const el = sceneWrapRef.current;
                if (!el) return;
                if (document.fullscreenElement || document.webkitFullscreenElement)
                    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
            };

            const tShow = (k) => setShow((sh) => ({ ...sh, [k]: !sh[k] }));
            const reset = () => {
                if (mode === 'cirkel') setPhase(Math.PI / 2);
                else if (mode === 'bana') { resetBana(); setTick(t => t + 1); }
                else if (mode === 'kron') { resetKron(); setTick(t => t + 1); }
                else { resetLoop(); setTick(t => t + 1); }
                setRunning(true);
                lastRef.current = null;
            };
            const setModeReset = (mo) => { setMode(mo); setRunning(true); lastRef.current = null; };

            // aktuella loopvärden (för avläsning)
            const ls = loopRef.current;
            // bilbanan: krävd centripetalkraft i varje kurva mot största friktionskraft
            const bs = banaRef.current;
            const bq = bs.st === 'track' ? banaGeom.at(bs.s) : null;
            const FC1 = m * v * v / r1, FC2 = m * v * v / r2, Fmax = mu * m * G;
            const vGrepp = Math.sqrt(mu * G * r2);         // högsta fart i snäva kurvan
            const bNow = bq && bq.seg.type === 'arc' ? m * v * v / bq.seg.rm : 0;
            // krön och dal
            const ks = kronRef.current;
            const kq = ks.st === 'track' ? kronGeom.at(ks.s) : null;
            const kF = kq ? kronForces(kq, v, m) : { N: 0, Ff: 0, FC: 0, aC: 0 };
            const nTopK = m * (G - v * v / rk);            // F_N på krönets topp (< 0 = lättar)
            const nBotD = m * (G + v * v / rd);            // F_N i dalens botten
            const vKron = Math.sqrt(G * rk);               // gränsfart i krönets TOPP
            // Normalkraften m(g·cos α − v²/r) är MINST där cos α är minst,
            // alltså där krönbågen börjar (α = BETA), inte i toppen. Det är
            // därför denna fart, inte √(g·r), som är krönets gränsfart.
            const vKant = Math.sqrt(G * rk * Math.cos(BETA));
            const lv2 = Math.max(0, v0 * v0 - 2 * G * RL * (1 - Math.cos(ls.th)));
            const lN = ls.st === 'track' ? Math.max(0, ML * (lv2 / RL + G * Math.cos(ls.th))) : 0;
            const lvNow = ls.st === 'track' ? Math.sqrt(lv2) : Math.hypot(ls.vx, ls.vy) / PXM;
            const lh = ls.st === 'track' ? RL * (1 - Math.cos(ls.th)) : (GROUND_Y - 10 - ls.y) / PXM;
            const vTop2 = v0 * v0 - 4 * G * RL;
            const nTop = vTop2 >= 0 ? ML * (vTop2 / RL - G) : NaN;   // F_N i toppen (kan vara < 0 = klarar inte)

            // Mini-läget (?embed=1&mini=1): minisim-kortet i teorin styr sidan
            // via postMessage och får läget tillbaka till sin info-rad.
            // Refs i stället för deps: lyssnaren/intervallet sätts upp en gång,
            // men ska alltid se senaste render-varvets funktioner och värden.
            const miniRef = useRef({});
            miniRef.current = { setModeReset, reset, setRunning, setV, setV0 };
            const miniStatusRef = useRef({});
            miniStatusRef.current = { mode, running, FC, v, v0, vcrit: VCRIT,
                                      FC2, Fmax, nTop: nTopK, vKron, vKant, vGrepp };
            useEffect(() => {
                if (!window.__MINI) return;
                const onMsg = (e) => {
                    const msg = e.data;
                    if (!msg || !msg.fysikCirkular) return;
                    const mi = miniRef.current;
                    if (msg.fysikCirkular === 'situation')
                        mi.setModeReset(['loop', 'bana', 'kron'].includes(msg.value) ? msg.value : 'cirkel');
                    else if (msg.fysikCirkular === 'paus') mi.setRunning(false);
                    else if (msg.fysikCirkular === 'kor') mi.setRunning(true);
                    else if (msg.fysikCirkular === 'reset') mi.reset();
                    else if (msg.fysikCirkular === 'fart')
                        mi.setV(Math.max(VMIN, Math.min(VMAX, +msg.value || VMIN)));
                    else if (msg.fysikCirkular === 'fart0')
                        mi.setV0(Math.max(V0MIN, Math.min(V0MAX, +msg.value || V0MIN)));
                };
                window.addEventListener('message', onMsg);
                const id = window.parent !== window
                    ? setInterval(() => {
                          window.parent.postMessage({ fysikCirkularStatus: miniStatusRef.current }, '*');
                      }, 200)
                    : null;
                return () => { window.removeEventListener('message', onMsg); if (id) clearInterval(id); };
            }, []);

            const primaryLabel = running ? 'Pausa' : 'Fortsätt';

            // Inställningsrutan uppe till höger. Hopfällbar: krysset fäller
            // ihop hela rutan, den runda knappen (samma stil som .fs-btn,
            // spegelvänt hörn) tar tillbaka den. I fullskärm bor GLIDARNA
            // också här — den nedre fs-controls-panelen låg ovanpå scenen
            // och skymde bilen när man drog i reglagen (påpekat 2026-08-31).
            const sceneToggles = () => {
                if (!togglesOpen) return (
                    <button className="st-show-btn" onClick={() => setTogglesOpen(true)}
                            aria-label="Visa inställningar" title="Visa inställningar" aria-expanded="false">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             strokeWidth="2" strokeLinecap="round" aria-hidden="true">
                            <line x1="4" y1="8" x2="20" y2="8" />
                            <circle cx="14.5" cy="8" r="2.7" fill="currentColor" stroke="none" />
                            <line x1="4" y1="16" x2="20" y2="16" />
                            <circle cx="9.5" cy="16" r="2.7" fill="currentColor" stroke="none" />
                        </svg>
                    </button>
                );
                return (
                <div className="scene-toggles">
                    <button className="st-hide" onClick={() => setTogglesOpen(false)}
                            aria-label="Dölj inställningar" title="Dölj inställningar" aria-expanded="true">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             strokeWidth="2.4" strokeLinecap="round" aria-hidden="true">
                            <path d="M6 6l12 12M18 6L6 18" />
                        </svg>
                    </button>
                    <div className="st-title">Visa</div>
                    <label><input type="checkbox" checked={show.forces} onChange={() => tShow('forces')} /><span>Krafter</span></label>
                    {show.forces && (
                        <React.Fragment>
                            <label className="st-sub">
                                <input type="radio" name="fview" checked={forceView === 'verkliga'} onChange={() => setForceView('verkliga')} />
                                {(mode === 'cirkel' || mode === 'bana')
                                    ? <span className="st-swatch" style={{ background: COL.frik }}></span>
                                    : <span style={{ display: 'inline-flex', gap: 2, flexShrink: 0 }}>
                                          <span className="st-swatch" style={{ background: COL.tyngd }}></span>
                                          <span className="st-swatch" style={{ background: COL.norm }}></span>
                                          {mode === 'kron' && <span className="st-swatch" style={{ background: COL.frik }}></span>}
                                      </span>}
                                <span>Verkliga krafter</span>
                            </label>
                            <label className="st-sub">
                                <input type="radio" name="fview" checked={forceView === 'resultant'} onChange={() => setForceView('resultant')} />
                                <span className="st-swatch" style={{ background: COL.res }}></span>
                                <span>Resulterande kraft <em>F</em><sub>R</sub></span>
                            </label>
                            <label className="st-sub">
                                <input type="radio" name="fview" checked={forceView === 'centripetal'} onChange={() => setForceView('centripetal')} />
                                <span className="st-swatch" style={{ background: COL.fc }}></span>
                                <span>Centripetalkraft <em>F</em><sub>C</sub></span>
                            </label>
                        </React.Fragment>
                    )}
                    <label><input type="checkbox" checked={show.vel} onChange={() => tShow('vel')} />
                        <span className="st-swatch" style={{ background: COL.fart }}></span>
                        <span>Hastighet <em>v</em></span></label>
                    <label><input type="checkbox" checked={show.accel} onChange={() => tShow('accel')} />
                        <span className="st-swatch" style={{ background: COL.acc }}></span>
                        <span>Centripetalacc. <em>a</em><sub>C</sub></span></label>
                    <label><input type="checkbox" checked={show.radius} onChange={() => tShow('radius')} />
                        <span className="st-swatch" style={{ background: 'rgba(15,22,32,0.6)' }}></span>
                        <span>Radie <em>r</em></span></label>
                    <div className="st-title mt">Situation</div>
                    <label><input type="radio" name="mode" checked={mode === 'cirkel'} onChange={() => setModeReset('cirkel')} /><span>Cirkelbana (ovanifrån)</span></label>
                    <label><input type="radio" name="mode" checked={mode === 'bana'} onChange={() => setModeReset('bana')} /><span>Bilbana med kurvor (ovanifrån)</span></label>
                    <label><input type="radio" name="mode" checked={mode === 'loop'} onChange={() => setModeReset('loop')} /><span>Loop (från sidan)</span></label>
                    <label><input type="radio" name="mode" checked={mode === 'kron'} onChange={() => setModeReset('kron')} /><span>Krön och dal (från sidan)</span></label>
                    {/* Glidare och styrknappar visas här BARA i fullskärm — i
                        normalläget finns de i sidopanelen (aldrig dubblerade). */}
                    {isFullscreen && (
                        <React.Fragment>
                            <div className="st-title mt">Reglage</div>
                            <div className="st-sliders">
                                {mode === 'cirkel' ? (
                                    <React.Fragment>
                                        <StSlider label="Banhastighet (<em>v</em>)" value={v} min={VMIN} max={VMAX} step={0.1}
                                                  onChange={setV}
                                                  valueNode={<NumInput value={v} min={0.5} max={null} fmtFn={(x) => fmt(x, 1)} unit="m/s" onCommit={setV} />} />
                                        <StSlider label="Vinkelhastighet (<em>ω</em>)" value={w} min={VMIN / r} max={VMAX / r} step={0.005}
                                                  onChange={(nw) => setV(nw * r)}
                                                  valueNode={<NumInput value={w} min={0.01} max={null} fmtFn={(x) => fmt(x, 2)} unit="rad/s" onCommit={(nw) => setV(nw * r)} />} />
                                        <StSlider label="Massa (<em>m</em>)" value={m} min={MMIN} max={MMAX} step={50}
                                                  onChange={setM}
                                                  valueNode={<NumInput value={m} min={1} max={null} fmtFn={(x) => fmt(x, 0)} unit="kg" onCommit={setM} />} />
                                        <StSlider label="Banradie (<em>r</em>)" value={r} min={RMIN} max={RMAX} step={0.5}
                                                  onChange={setR}
                                                  valueNode={<NumInput value={r} min={1} max={null} fmtFn={(x) => fmt(x, 1)} unit="m" onCommit={setR} />} />
                                    </React.Fragment>
                                ) : mode === 'bana' ? (
                                    <React.Fragment>
                                        <StSlider label="Banhastighet (<em>v</em>)" value={v} min={VMIN} max={VMAX} step={0.1}
                                                  onChange={setV} mark={vGrepp}
                                                  valueNode={<NumInput value={v} min={0.5} max={null} fmtFn={(x) => fmt(x, 1)} unit="m/s" onCommit={setV} />} />
                                        <StSlider label="Massa (<em>m</em>)" value={m} min={MMIN} max={MMAX} step={50}
                                                  onChange={setM}
                                                  valueNode={<NumInput value={m} min={1} max={null} fmtFn={(x) => fmt(x, 0)} unit="kg" onCommit={setM} />} />
                                        <StSlider label="Vida kurvans radie (<em>r</em>₁)" value={r1} min={BR1MIN} max={BR1MAX} step={0.5}
                                                  onChange={setR1}
                                                  valueNode={<NumInput value={r1} min={BR1MIN} max={BR1MAX} fmtFn={(x) => fmt(x, 1)} unit="m" onCommit={setR1} />} />
                                        <StSlider label="Snäva kurvans radie (<em>r</em>₂)" value={r2} min={BR2MIN} max={BR2MAX} step={0.5}
                                                  onChange={setR2}
                                                  valueNode={<NumInput value={r2} min={BR2MIN} max={BR2MAX} fmtFn={(x) => fmt(x, 1)} unit="m" onCommit={setR2} />} />
                                        <StSlider label="Friktionstal (<em>μ</em>)" value={mu} min={MUMIN} max={MUMAX} step={0.05}
                                                  onChange={setMu}
                                                  valueNode={<NumInput value={mu} min={MUMIN} max={MUMAX} fmtFn={(x) => fmt(x, 2)} unit="" onCommit={setMu} />} />
                                    </React.Fragment>
                                ) : mode === 'kron' ? (
                                    <React.Fragment>
                                        <StSlider label="Fart (<em>v</em>)" value={v} min={VMIN} max={VMAX} step={0.1}
                                                  onChange={setV} mark={vKant}
                                                  valueNode={<NumInput value={v} min={0.5} max={null} fmtFn={(x) => fmt(x, 1)} unit="m/s" onCommit={setV} />} />
                                        <StSlider label="Massa (<em>m</em>)" value={m} min={MMIN} max={MMAX} step={50}
                                                  onChange={setM}
                                                  valueNode={<NumInput value={m} min={1} max={null} fmtFn={(x) => fmt(x, 0)} unit="kg" onCommit={setM} />} />
                                        <StSlider label="Krönets radie (<em>r</em><sub>k</sub>)" value={rk} min={KRMIN} max={KRMAX} step={0.5}
                                                  onChange={setRk}
                                                  valueNode={<NumInput value={rk} min={KRMIN} max={KRMAX} fmtFn={(x) => fmt(x, 1)} unit="m" onCommit={setRk} />} />
                                        <StSlider label="Dalens radie (<em>r</em><sub>d</sub>)" value={rd} min={KRMIN} max={KRMAX} step={0.5}
                                                  onChange={setRd}
                                                  valueNode={<NumInput value={rd} min={KRMIN} max={KRMAX} fmtFn={(x) => fmt(x, 1)} unit="m" onCommit={setRd} />} />
                                    </React.Fragment>
                                ) : (
                                    <StSlider label="Fart längst ned (<em>v</em>₀)" value={v0} min={V0MIN} max={V0MAX} step={0.1}
                                              onChange={setV0} mark={VCRIT}
                                              valueNode={<NumInput value={v0} min={0.5} max={null} fmtFn={(x) => fmt(x, 1)} unit="m/s" onCommit={setV0} />} />
                                )}
                            </div>
                            <div className="st-actions">
                                <button className="btn-toggle" onClick={() => setRunning((rr) => !rr)}>{primaryLabel}</button>
                                <button className="btn-toggle" onClick={reset}>Börja om</button>
                            </div>
                        </React.Fragment>
                    )}
                </div>
                );
            };

            return (
                <div className="min-h-screen dark-container px-4 md:px-8 pb-12" style={{ fontFamily: "'DM Sans', sans-serif" }}>
                    <div className="max-w-6xl mx-auto pt-6">
                        <div className="breadcrumb mb-4" style={{ fontSize: 13 }}>
                            <a href="index.html">Hem</a> / <a href="katalog.html#fy2">Fysik nivå 2</a> / Cirkulär rörelse
                        </div>
                        <div className="intro-head">
                            <h1 className="text-3xl md:text-4xl font-black tracking-tight" style={{ color: 'var(--lab-ink)' }}>Cirkulär rörelse</h1>
                            {/* Växlare till avsnittets andra simulering */}
                            <div className="sim-switch-wrap">
                                <span className="sim-switch-label">Simulering</span>
                                <div className="sim-switch">
                                    <span className="sim-switch-active">Cirkulär rörelse</span>
                                    <a href="fysik2-tomtebloss-app.html">Tomtebloss och centrifug</a>
                                </div>
                            </div>
                        </div>
                        <p className="mt-2 mb-5" style={{ color: 'var(--lab-ink-soft)', maxWidth: 820 }}>
                            En kropp i cirkelbana påverkas av en resulterande kraft som ständigt pekar in mot
                            cirkelns medelpunkt — <strong>centripetalkraften</strong> <em>F</em><sub>C</sub>. Den är
                            ingen egen kraft, utan utgörs av de verkliga krafter som råkar verka: för bilen på den
                            cirkulära vägen och på bilbanan med kurvor är det <strong>friktionskraften</strong> från
                            vägbanan, och i loopen, på krönet och i dalen är det <strong>normalkraften</strong> och{' '}
                            <strong>tyngdkraften</strong> tillsammans. Växla mellan att visa de verkliga krafterna och
                            resultanten, se att kraften bara behövs i kurvorna och blir större ju snävare kurvan är,
                            och undersök gränsfarten där bilen precis klarar loopen eller lättar från krönet.
                        </p>

                        <FormulaCard />

                        <main className="flex flex-col lg:flex-row gap-6">
                            {/* Scen */}
                            <div className="lg:w-3/5 order-1">
                                <div className={"scene-wrap" + (isFullscreen ? " is-fs" : "")} data-theme="ljusPapper" ref={sceneWrapRef}>
                                    {mode === 'cirkel'
                                        ? <CircleScene phase={phase} v={v} m={m} r={r} show={show} forceView={forceView}
                                                       kompakt={window.__MINI && !isFullscreen} />
                                        : mode === 'bana'
                                        ? <BanaScene bs={bs} geom={banaGeom} v={v} m={m} mu={mu} show={show} forceView={forceView}
                                                     kompakt={window.__MINI && !isFullscreen} />
                                        : mode === 'kron'
                                        ? <KronScene ks={ks} geom={kronGeom} v={v} m={m} show={show} forceView={forceView}
                                                     kompakt={window.__MINI && !isFullscreen} />
                                        : <LoopScene ls={ls} v0={v0} show={show} forceView={forceView}
                                                     kompakt={window.__MINI && !isFullscreen} />}

                                    <div className="scene-hint">
                                        {mode === 'cirkel'
                                            ? 'Bilen håller konstant fart. Krafterna sedda ovanifrån.'
                                            : mode === 'bana'
                                            ? 'Bilen håller konstant fart, och luft- och rullmotstånd försummas: friktionen behövs bara i sidled, i kurvorna. Den kan som mest ge μ · m · g.'
                                            : mode === 'kron'
                                            ? 'Bilen håller konstant fart, så friktionen längs vägen driver i uppförsbacke och bromsar i nedförsbacke.'
                                            : 'Friktion och luftmotstånd försummas — farten följer energiprincipen.'}
                                    </div>
                                    {sceneToggles()}

                                    <button className="fs-btn" onClick={toggleFullscreen} aria-label="Fullskärm"
                                            title={isFullscreen ? 'Lämna fullskärm' : 'Fullskärm'}>
                                        {isFullscreen ? (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M9 3v6H3" /><path d="M15 21v-6h6" /><path d="M21 9h-6V3" /><path d="M3 15h6v6" />
                                            </svg>
                                        ) : (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M3 9V3h6" /><path d="M21 9V3h-6" /><path d="M3 15v6h6" /><path d="M21 15v6h-6" />
                                            </svg>
                                        )}
                                    </button>
                                </div>
                            </div>

                            {/* Kontroller */}
                            <div className="lg:w-2/5 order-2">
                                {/* Situationsväljare */}
                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <div className="flbl mb-2">Situation</div>
                                    <div className="mode-seg">
                                        <button className={mode === 'cirkel' ? 'active' : ''} onClick={() => setModeReset('cirkel')}>
                                            Cirkelbana<span className="sub">bil ovanifrån</span>
                                        </button>
                                        <button className={mode === 'bana' ? 'active' : ''} onClick={() => setModeReset('bana')}>
                                            Bilbana med kurvor<span className="sub">bil ovanifrån</span>
                                        </button>
                                        <button className={mode === 'loop' ? 'active' : ''} onClick={() => setModeReset('loop')}>
                                            Loop<span className="sub">bil från sidan</span>
                                        </button>
                                        <button className={mode === 'kron' ? 'active' : ''} onClick={() => setModeReset('kron')}>
                                            Krön och dal<span className="sub">bil från sidan</span>
                                        </button>
                                    </div>
                                </div>

                                {/* Reglage */}
                                <div className="glass-card rounded-xl p-3 mb-3">
                                    {mode === 'cirkel' ? (
                                        <React.Fragment>
                                            <Slider label="Banhastighet <em>v</em>" value={v} min={VMIN} max={VMAX} step={0.1} onChange={setV}>
                                                <NumInput value={v} min={0.5} max={null} fmtFn={(x) => fmt(x, 1)} unit="m/s" onCommit={setV} />
                                            </Slider>
                                            <Slider label="Vinkelhastighet <em>ω</em>" value={w} min={VMIN / r} max={VMAX / r} step={0.005}
                                                    onChange={(nw) => setV(nw * r)}>
                                                <NumInput value={w} min={0.01} max={null} fmtFn={(x) => fmt(x, 2)} unit="rad/s" onCommit={(nw) => setV(nw * r)} />
                                            </Slider>
                                            <Slider label="Massa <em>m</em>" value={m} min={MMIN} max={MMAX} step={50} onChange={setM}>
                                                <NumInput value={m} min={1} max={null} fmtFn={(x) => fmt(x, 0)} unit="kg" onCommit={setM} />
                                            </Slider>
                                            <Slider label="Banradie <em>r</em>" value={r} min={RMIN} max={RMAX} step={0.5} onChange={setR}>
                                                <NumInput value={r} min={1} max={null} fmtFn={(x) => fmt(x, 1)} unit="m" onCommit={setR} />
                                            </Slider>
                                            <p className="text-xs mt-1" style={{ color: 'var(--lab-ink-muted)' }}>
                                                <em>v</em> och <em>ω</em> är kopplade: <em>v</em> = <em>ω</em>&thinsp;·&thinsp;<em>r</em>.
                                                Ändras radien behåller bilen sin fart, så <em>ω</em> ändras.
                                            </p>
                                        </React.Fragment>
                                    ) : mode === 'bana' ? (
                                        <React.Fragment>
                                            <Slider label="Banhastighet <em>v</em>" value={v} min={VMIN} max={VMAX} step={0.1} onChange={setV} mark={vGrepp}>
                                                <NumInput value={v} min={0.5} max={null} fmtFn={(x) => fmt(x, 1)} unit="m/s" onCommit={setV} />
                                            </Slider>
                                            <Slider label="Massa <em>m</em>" value={m} min={MMIN} max={MMAX} step={50} onChange={setM}>
                                                <NumInput value={m} min={1} max={null} fmtFn={(x) => fmt(x, 0)} unit="kg" onCommit={setM} />
                                            </Slider>
                                            <Slider label="Vida kurvan <em>r</em>₁" value={r1} min={BR1MIN} max={BR1MAX} step={0.5} onChange={setR1}>
                                                <NumInput value={r1} min={BR1MIN} max={BR1MAX} fmtFn={(x) => fmt(x, 1)} unit="m" onCommit={setR1} />
                                            </Slider>
                                            <Slider label="Snäva kurvan <em>r</em>₂" value={r2} min={BR2MIN} max={BR2MAX} step={0.5} onChange={setR2}>
                                                <NumInput value={r2} min={BR2MIN} max={BR2MAX} fmtFn={(x) => fmt(x, 1)} unit="m" onCommit={setR2} />
                                            </Slider>
                                            <Slider label="Friktionstal <em>μ</em>" value={mu} min={MUMIN} max={MUMAX} step={0.05} onChange={setMu}>
                                                <NumInput value={mu} min={MUMIN} max={MUMAX} fmtFn={(x) => fmt(x, 2)} unit="" onCommit={setMu} />
                                            </Slider>
                                            <p className="text-xs mt-1" style={{ color: 'var(--lab-ink-muted)' }}>
                                                Friktionen mellan däck och väg kan som mest ge <em>F</em><sub>f</sub> = <em>μ</em>&thinsp;·&thinsp;<em>m</em>&thinsp;·&thinsp;<em>g</em>.
                                                Kräver en kurva mer än så fortsätter bilen rakt fram. Torr asfalt har
                                                <em> μ</em> ≈ 0,8, våt väg ≈ 0,5 och is ≈ 0,1. Markeringen på fartglidaren
                                                visar högsta fart i den snäva kurvan.
                                            </p>
                                        </React.Fragment>
                                    ) : mode === 'kron' ? (
                                        <React.Fragment>
                                            <Slider label="Fart <em>v</em>" value={v} min={VMIN} max={VMAX} step={0.1} onChange={setV} mark={vKant}>
                                                <NumInput value={v} min={0.5} max={null} fmtFn={(x) => fmt(x, 1)} unit="m/s" onCommit={setV} />
                                            </Slider>
                                            <Slider label="Massa <em>m</em>" value={m} min={MMIN} max={MMAX} step={50} onChange={setM}>
                                                <NumInput value={m} min={1} max={null} fmtFn={(x) => fmt(x, 0)} unit="kg" onCommit={setM} />
                                            </Slider>
                                            <Slider label="Krönets radie <em>r</em><sub>k</sub>" value={rk} min={KRMIN} max={KRMAX} step={0.5} onChange={setRk}>
                                                <NumInput value={rk} min={KRMIN} max={KRMAX} fmtFn={(x) => fmt(x, 1)} unit="m" onCommit={setRk} />
                                            </Slider>
                                            <Slider label="Dalens radie <em>r</em><sub>d</sub>" value={rd} min={KRMIN} max={KRMAX} step={0.5} onChange={setRd}>
                                                <NumInput value={rd} min={KRMIN} max={KRMAX} fmtFn={(x) => fmt(x, 1)} unit="m" onCommit={setRd} />
                                            </Slider>
                                            <p className="text-xs mt-1" style={{ color: 'var(--lab-ink-muted)' }}>
                                                Backarna lutar {fmt(BETA / DEG, 0)}°, och bilen lättar redan där krönet
                                                börjar: √(<em>g</em>&thinsp;·&thinsp;<em>r</em><sub>k</sub>&thinsp;·&thinsp;cos&nbsp;<em>α</em>) ≈ {fmt(vKant, 1)}&nbsp;m/s.
                                                Det är den farten markeringen på glidaren visar. I själva toppen går
                                                gränsen först vid √(<em>g</em>&thinsp;·&thinsp;<em>r</em><sub>k</sub>) ≈ {fmt(vKron, 1)}&nbsp;m/s.
                                            </p>
                                        </React.Fragment>
                                    ) : (
                                        <React.Fragment>
                                            <Slider label="Fart längst ned <em>v</em>₀" value={v0} min={V0MIN} max={V0MAX} step={0.1} onChange={setV0} mark={VCRIT}>
                                                <NumInput value={v0} min={0.5} max={null} fmtFn={(x) => fmt(x, 1)} unit="m/s" onCommit={setV0} />
                                            </Slider>
                                            <p className="text-xs mt-1" style={{ color: 'var(--lab-ink-muted)' }}>
                                                Loopens radie är <em>r</em> = {fmt(RL, 1)}&nbsp;m och bilens massa {fmtNum(ML)}&nbsp;kg.
                                                Gränsfarten längst ned är √(5&thinsp;·&thinsp;<em>g</em>&thinsp;·&thinsp;<em>r</em>) ≈ {fmt(VCRIT, 1)}&nbsp;m/s,
                                                och markeringen på glidaren visar den.
                                            </p>
                                        </React.Fragment>
                                    )}
                                    <div className="flex gap-2 mt-2">
                                        <button className="btn-toggle flex-1" onClick={() => setRunning((rr) => !rr)}>{primaryLabel}</button>
                                        <button className="btn-toggle flex-1" onClick={reset}>Börja om</button>
                                    </div>
                                </div>

                                {/* Avläsning */}
                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <div className="flbl mb-2">Avläsning</div>
                                    {mode === 'cirkel' ? (
                                        <div className="grid grid-cols-2 gap-2 text-center">
                                            <div>
                                                <div style={{ color: COL.acc, fontWeight: 700, fontSize: 16 }}>{fmt(aC, 1)} m/s²</div>
                                                <div className="text-xs" style={{ color: 'var(--lab-ink-muted)' }}>centripetalacc. <em>a</em><sub>C</sub></div>
                                            </div>
                                            <div>
                                                <div style={{ color: forceView === 'centripetal' ? COL.fc : COL.frik, fontWeight: 700, fontSize: 16 }}>{fmtNum(FC)} N</div>
                                                <div className="text-xs" style={{ color: 'var(--lab-ink-muted)' }}>centripetalkraft <em>F</em><sub>C</sub></div>
                                            </div>
                                            <div>
                                                <div style={{ color: 'var(--lab-ink)', fontWeight: 700, fontSize: 16 }}>{fmt(w, 2)} rad/s</div>
                                                <div className="text-xs" style={{ color: 'var(--lab-ink-muted)' }}>vinkelhastighet <em>ω</em></div>
                                            </div>
                                            <div>
                                                <div style={{ color: 'var(--lab-ink)', fontWeight: 700, fontSize: 16 }}>{fmt(T, 1)} s</div>
                                                <div className="text-xs" style={{ color: 'var(--lab-ink-muted)' }}>omloppstid <em>T</em></div>
                                            </div>
                                            <div>
                                                <div style={{ color: 'var(--lab-ink)', fontWeight: 700, fontSize: 16 }}>{fmt(1 / T, 2)} Hz</div>
                                                <div className="text-xs" style={{ color: 'var(--lab-ink-muted)' }}>frekvens <em>f</em></div>
                                            </div>
                                            <div>
                                                <div style={{ color: 'var(--lab-ink)', fontWeight: 700, fontSize: 16 }}>{fmt(r, 1)} m</div>
                                                <div className="text-xs" style={{ color: 'var(--lab-ink-muted)' }}>banradie <em>r</em></div>
                                            </div>
                                        </div>
                                    ) : mode === 'bana' ? (
                                        <div className="grid grid-cols-2 gap-2 text-center">
                                            <div>
                                                <div style={{ color: FC1 > Fmax ? COL.tyngd : COL.frik, fontWeight: 700, fontSize: 16 }}>{fmtNum(FC1)} N</div>
                                                <div className="text-xs" style={{ color: 'var(--lab-ink-muted)' }}><em>F</em><sub>C</sub> som krävs i vida kurvan</div>
                                            </div>
                                            <div>
                                                <div style={{ color: FC2 > Fmax ? COL.tyngd : COL.frik, fontWeight: 700, fontSize: 16 }}>{fmtNum(FC2)} N</div>
                                                <div className="text-xs" style={{ color: 'var(--lab-ink-muted)' }}><em>F</em><sub>C</sub> som krävs i snäva kurvan</div>
                                            </div>
                                            <div>
                                                <div style={{ color: 'var(--lab-ink)', fontWeight: 700, fontSize: 16 }}>{fmtNum(Fmax)} N</div>
                                                <div className="text-xs" style={{ color: 'var(--lab-ink-muted)' }}>största friktionskraft <em>μ</em>&thinsp;·&thinsp;<em>m</em>&thinsp;·&thinsp;<em>g</em></div>
                                            </div>
                                            <div>
                                                <div style={{ color: COL.acc, fontWeight: 700, fontSize: 16 }}>{fmt(bNow / m, 1)} m/s²</div>
                                                <div className="text-xs" style={{ color: 'var(--lab-ink-muted)' }}>centripetalacc. just nu <em>a</em><sub>C</sub></div>
                                            </div>
                                            <div>
                                                <div style={{ color: 'var(--lab-ink)', fontWeight: 700, fontSize: 16 }}>{fmt(v * v / (mu * G), 1)} m</div>
                                                <div className="text-xs" style={{ color: 'var(--lab-ink-muted)' }}>minsta radie greppet klarar <em>v</em>²/(<em>μ</em>&thinsp;·&thinsp;<em>g</em>)</div>
                                            </div>
                                            <div>
                                                <div style={{ color: 'var(--lab-ink)', fontWeight: 700, fontSize: 16 }}>{fmt(Math.sqrt(mu * G * r2), 1)} m/s</div>
                                                <div className="text-xs" style={{ color: 'var(--lab-ink-muted)' }}>högsta fart i snäva kurvan √(<em>μ</em>&thinsp;·&thinsp;<em>g</em>&thinsp;·&thinsp;<em>r</em>₂)</div>
                                            </div>
                                        </div>
                                    ) : mode === 'kron' ? (
                                        <div className="grid grid-cols-2 gap-2 text-center">
                                            <div>
                                                <div style={{ color: COL.norm, fontWeight: 700, fontSize: 16 }}>{ks.st === 'track' ? fmtNum(kF.N) + ' N' : '0 N'}</div>
                                                <div className="text-xs" style={{ color: 'var(--lab-ink-muted)' }}>normalkraft just nu <em>F</em><sub>N</sub></div>
                                            </div>
                                            <div>
                                                <div style={{ color: COL.tyngd, fontWeight: 700, fontSize: 16 }}>{fmtNum(m * G)} N</div>
                                                <div className="text-xs" style={{ color: 'var(--lab-ink-muted)' }}>tyngdkraft <em>F</em><sub>G</sub></div>
                                            </div>
                                            <div>
                                                <div style={{ color: nTopK > 0 ? COL.norm : COL.tyngd, fontWeight: 700, fontSize: 16 }}>{nTopK > 0 ? fmtNum(nTopK) + ' N' : 'lättar'}</div>
                                                <div className="text-xs" style={{ color: 'var(--lab-ink-muted)' }}><em>F</em><sub>N</sub> på krönets topp</div>
                                            </div>
                                            <div>
                                                <div style={{ color: COL.norm, fontWeight: 700, fontSize: 16 }}>{fmtNum(nBotD)} N</div>
                                                <div className="text-xs" style={{ color: 'var(--lab-ink-muted)' }}><em>F</em><sub>N</sub> i dalens botten</div>
                                            </div>
                                            <div>
                                                <div style={{ color: 'var(--lab-accent)', fontWeight: 700, fontSize: 16 }}>{fmt(vKant, 1)} m/s</div>
                                                <div className="text-xs" style={{ color: 'var(--lab-ink-muted)' }}>gränsfart, bilen lättar där krönet börjar √(<em>g</em>&thinsp;·&thinsp;<em>r</em><sub>k</sub>&thinsp;·&thinsp;cos&nbsp;<em>α</em>)</div>
                                            </div>
                                            <div>
                                                <div style={{ color: 'var(--lab-ink)', fontWeight: 700, fontSize: 16 }}>{fmt(vKron, 1)} m/s</div>
                                                <div className="text-xs" style={{ color: 'var(--lab-ink-muted)' }}>gränsfart i krönets topp √(<em>g</em>&thinsp;·&thinsp;<em>r</em><sub>k</sub>)</div>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-2 gap-2 text-center">
                                            <div>
                                                <div style={{ color: COL.fart, fontWeight: 700, fontSize: 16 }}>{fmt(lvNow, 1)} m/s</div>
                                                <div className="text-xs" style={{ color: 'var(--lab-ink-muted)' }}>fart just nu <em>v</em></div>
                                            </div>
                                            <div>
                                                <div style={{ color: COL.norm, fontWeight: 700, fontSize: 16 }}>{ls.st === 'track' ? fmtNum(lN) + ' N' : '0 N'}</div>
                                                <div className="text-xs" style={{ color: 'var(--lab-ink-muted)' }}>normalkraft just nu <em>F</em><sub>N</sub></div>
                                            </div>
                                            <div>
                                                <div style={{ color: 'var(--lab-ink)', fontWeight: 700, fontSize: 16 }}>{isFinite(nTop) && nTop >= 0 ? fmtNum(nTop) + ' N' : '–'}</div>
                                                <div className="text-xs" style={{ color: 'var(--lab-ink-muted)' }}><em>F</em><sub>N</sub> i toppen</div>
                                            </div>
                                            <div>
                                                <div style={{ color: 'var(--lab-accent)', fontWeight: 700, fontSize: 16 }}>{fmt(VCRIT, 1)} m/s</div>
                                                <div className="text-xs" style={{ color: 'var(--lab-ink-muted)' }}>gränsfart längst ned</div>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                {/* Kraftinsikt */}
                                {mode === 'cirkel' ? (
                                    <div className="glass-card rounded-xl p-3">
                                        <div className="flbl mb-1">Vad utgör centripetalkraften?</div>
                                        <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                            Sedd ovanifrån är det <span style={{ color: COL.frik, fontWeight: 600 }}>friktionskraften</span> mellan
                                            däcken och vägbanan som pekar in mot centrum. Den är alltså inte en extra kraft —
                                            väljer du <span style={{ color: COL.fc, fontWeight: 600 }}>centripetalkraft</span> ser du samma
                                            pil igen, nu i rollen som resultant: <em>F</em><sub>C</sub> = <em>F</em><sub>f</sub>.
                                        </p>
                                    </div>
                                ) : mode === 'bana' ? (
                                    <div className="glass-card rounded-xl p-3">
                                        <div className="flbl mb-1">Bara i kurvorna behövs en kraft</div>
                                        <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                            På rakorna behövs ingen kraft i sidled: bilen fortsätter rakt fram av sig själv
                                            (Newtons första lag). I kurvorna måste <span style={{ color: COL.frik, fontWeight: 600 }}>friktionskraften</span> böja
                                            banan, <em>F</em><sub>f</sub> = <em>m</em>&thinsp;·&thinsp;<em>v</em>²/<em>r</em>, och ju snävare kurvan är,
                                            desto större kraft krävs vid samma fart. Räcker inte greppet, <em>m</em>&thinsp;·&thinsp;<em>v</em>²/<em>r</em> &gt; <em>μ</em>&thinsp;·&thinsp;<em>m</em>&thinsp;·&thinsp;<em>g</em>,
                                            fortsätter bilen tangentiellt ut ur kurvan. Massan spelar ingen roll: den förkortas bort.
                                        </p>
                                    </div>
                                ) : mode === 'kron' ? (
                                    <div className="glass-card rounded-xl p-3">
                                        <div className="flbl mb-1">Lättare på krönet, tyngre i dalen</div>
                                        <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                            På krönets topp pekar centrum nedåt, så <span style={{ color: COL.tyngd, fontWeight: 600 }}><em>F</em><sub>G</sub></span> −{' '}
                                            <span style={{ color: COL.norm, fontWeight: 600 }}><em>F</em><sub>N</sub></span> = <em>F</em><sub>C</sub> och
                                            <em> F</em><sub>N</sub> = <em>m</em>&thinsp;·&thinsp;<em>g</em> − <em>m</em>&thinsp;·&thinsp;<em>v</em>²/<em>r</em><sub>k</sub>.
                                            Där blir normalkraften 0 vid √(<em>g</em>&thinsp;·&thinsp;<em>r</em><sub>k</sub>) ≈ {fmt(vKron, 1)}&nbsp;m/s.
                                            Men vägen lutar {fmt(BETA / DEG, 0)}° där krönet börjar, och då pekar bara komposanten
                                            <em> m</em>&thinsp;·&thinsp;<em>g</em>&thinsp;·&thinsp;cos&nbsp;<em>α</em> mot centrum. Normalkraften är alltså minst
                                            just där, och bilen lättar redan vid {fmt(vKant, 1)}&nbsp;m/s. Det är krönets
                                            gränsfart, och den markeringen sitter på fartglidaren.
                                            I dalens botten pekar centrum uppåt: <em>F</em><sub>N</sub> − <em>F</em><sub>G</sub> = <em>F</em><sub>C</sub>, så
                                            <em> F</em><sub>N</sub> = <em>m</em>&thinsp;·&thinsp;<em>g</em> + <em>m</em>&thinsp;·&thinsp;<em>v</em>²/<em>r</em><sub>d</sub>.
                                        </p>
                                    </div>
                                ) : (
                                    <div className="glass-card rounded-xl p-3">
                                        <div className="flbl mb-1">Gränsfarten i toppen</div>
                                        <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                            I toppen pekar både <span style={{ color: COL.norm, fontWeight: 600 }}><em>F</em><sub>N</sub></span> och{' '}
                                            <span style={{ color: COL.tyngd, fontWeight: 600 }}><em>F</em><sub>G</sub></span> nedåt, mot centrum:
                                            <em> F</em><sub>N</sub> + <em>F</em><sub>G</sub> = <em>F</em><sub>C</sub>. I gränsfallet är{' '}
                                            <em>F</em><sub>N</sub> = 0, så <em>m</em>&thinsp;·&thinsp;<em>g</em> = <em>m</em>&thinsp;·&thinsp;<em>v</em>²/<em>r</em>
                                            {' '}vilket ger farten √(<em>g</em>&thinsp;·&thinsp;<em>r</em>) ≈ {fmt(VTOP_MIN, 1)}&nbsp;m/s i toppen —
                                            och med energiprincipen √(5&thinsp;·&thinsp;<em>g</em>&thinsp;·&thinsp;<em>r</em>) ≈ {fmt(VCRIT, 1)}&nbsp;m/s längst ned.
                                        </p>
                                    </div>
                                )}
                            </div>
                        </main>

                        {/* Pedagogiska sektioner */}
                        <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-4 mt-6">
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Ingen egen kraft</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Centripetalkraften är en <strong>resultant</strong> av de krafter som verkar på kroppen —
                                    spännkraft i ett snöre, friktionskraft, normalkraft eller tyngdkraft. Rita aldrig in
                                    <em> F</em><sub>C</sub> som en extra pil bredvid de verkliga krafterna: den <em>är</em> deras summa.
                                </p>
                            </div>
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Konstant fart — ändå acceleration</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Farten är konstant, men hastigheten är en vektor och byter riktning hela tiden. Kroppen
                                    accelererar därför ständigt in mot centrum med <em>a</em><sub>C</sub> = <em>v</em>²/<em>r</em>.
                                    Enligt Newtons första lag skulle kroppen annars fortsätta rakt fram, tangentiellt.
                                </p>
                            </div>
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Normalkraften varierar i loopen</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Längst ned är farten störst och <em>F</em><sub>N</sub> = <em>m</em>·<em>v</em>²/<em>r</em> + <em>m</em>·<em>g</em> —
                                    normalkraften är som störst. I toppen är farten minst och
                                    <em> F</em><sub>N</sub> = <em>m</em>·<em>v</em>²/<em>r</em> − <em>m</em>·<em>g</em>. Blir den 0 har bilen nått
                                    gränsfarten; under den släpper bilen från banan.
                                </p>
                            </div>
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Krön, dal och kurvor på vägen</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Över ett krön är <em>F</em><sub>N</sub> = <em>m</em>·<em>g</em> − <em>m</em>·<em>v</em>²/<em>r</em>, så bilen känns
                                    lättare och lättar helt vid √(<em>g</em>·<em>r</em>). I en dal är
                                    <em> F</em><sub>N</sub> = <em>m</em>·<em>g</em> + <em>m</em>·<em>v</em>²/<em>r</em>. På bilbanan behövs ingen kraft
                                    alls på rakorna, och i kurvorna växer friktionskraften när radien minskar.
                                </p>
                            </div>
                        </div>

                        <details className="glass-card rounded-xl p-4 mt-4">
                            <summary className="accordion-head" style={{ color: 'var(--lab-ink)' }}>
                                <span>Vanliga missuppfattningar</span><span style={{ color: 'var(--lab-ink-muted)' }}>▾</span>
                            </summary>
                            <ul className="mt-3 space-y-2 text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                <li><strong>”Det finns en centrifugalkraft som drar utåt.”</strong> Centrifugalkraften är en
                                    imaginär kraft — en upplevelse i det roterande systemet. Sett utifrån vill kroppen bara
                                    fortsätta rakt fram (tröghet, Newtons första lag); det som känns som en kraft utåt är att
                                    banan kröker in under dig.</li>
                                <li><strong>”Konstant fart betyder ingen acceleration.”</strong> Nej — acceleration är hastighetens
                                    <em> ändring</em>, och riktningen ändras hela tiden i en cirkelbana. Därför krävs en resulterande
                                    kraft trots att farten är konstant.</li>
                                <li><strong>”Centripetalkraften är en extra kraft i kraftfiguren.”</strong> Nej — den är summan av de
                                    verkliga krafterna. I loopens topp gäller <em>F</em><sub>N</sub> + <em>F</em><sub>G</sub> = <em>F</em><sub>C</sub>,
                                    i botten <em>F</em><sub>N</sub> − <em>F</em><sub>G</sub> = <em>F</em><sub>C</sub>.</li>
                                <li><strong>”Om något slungas ut ur en cirkelbana åker det rakt ut från centrum.”</strong> Nej — det
                                    fortsätter <em>tangentiellt</em>, i den riktning hastigheten hade i släppögonblicket. Precis som
                                    bilen som släpper i loopen: den fortsätter i sin tangentriktning och faller sedan som en projektil.</li>
                                <li><strong>”En tung bil klarar kurvan sämre än en lätt.”</strong> Nej. Kraften som krävs,
                                    <em> m</em>·<em>v</em>²/<em>r</em>, och den största friktionskraften, <em>μ</em>·<em>m</em>·<em>g</em>,
                                    växer båda med massan, som förkortas bort. Farten och radien avgör, inte massan.</li>
                            </ul>
                        </details>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script src="feedback.js" defer></script>
    <script src="sim-dock.js" defer></script>
    <script src="data/katalog.js"></script>
