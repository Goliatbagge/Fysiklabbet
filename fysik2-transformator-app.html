    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const tr = (t, p) => (window.I18N ? I18N.t(t, p) : t);

        // ── Glidarintervall ──
        const U1MIN = 5, U1MAX = 400;          // primärspänning U1 (V, effektivvärde)
        const NMIN = 20, NMAX = 2000;          // varvtal N1, N2
        const RMIN = 5, RMAX = 500;            // lampans resistans (ohm)

        // Växelspänningen visas kraftigt nedsaktad: 0,4 Hz på skärmen (50 Hz i verkligheten)
        const FA = 0.4, OMEGA = 2 * Math.PI * FA;
        const TAU = 0.4;                       // tidskonstant för flödet vid till- och frånslag med likspänning (s)
        const GRAF_T = 5;                      // grafens tidsfönster (s)

        const fmt = (num, decimals = 1) => {
            if (!isFinite(num)) return '–';
            const s = num.toFixed(decimals);
            if (parseFloat(s) === 0) return '0';
            return s.replace('.', ',').replace('-', '−');
        };
        const fmtN = (n) => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
        const fmtU = (U) => {
            const a = Math.abs(U);
            if (a < 0.005) return '0 V';
            if (a >= 1000) return `${fmt(U / 1000, a < 10000 ? 2 : 1)} kV`;
            return `${fmt(U, a >= 100 ? 0 : a >= 10 ? 1 : 2)} V`;
        };
        const fmtI = (I) => {
            const a = Math.abs(I);
            if (a < 5e-6) return '0 A';
            if (a >= 1) return `${fmt(I, a >= 10 ? 1 : 2)} A`;
            const m = I * 1e3; return `${fmt(m, Math.abs(m) < 10 ? 1 : 0)} mA`;
        };
        const fmtP = (P) => {
            if (P < 5e-6) return '0 W';
            if (P >= 1000) return `${fmt(P / 1000, 2)} kW`;
            if (P >= 1) return `${fmt(P, P >= 100 ? 0 : 1)} W`;
            const m = P * 1e3; return `${fmt(m, m < 10 ? 1 : 0)} mW`;
        };

        const COL = {
            ink:    '#1f2530',
            flux:   '#2563c9',   // det magnetiska flödet (blått, som teorifiguren)
            prim:   '#1f2530',   // primärsidans ström och spänning (bläck)
            sek:    '#7b3fa0',   // sekundärsidans inducerade ström och spänning (lila, som i Lenz lag)
            elek:   '#0e7c86',   // elektronerna (blågröna)
            koppar: '#c87f3a',
            kopparM:'#8a5a28',
            karna:  '#c9ced5',
            lampa:  '#f2b134',
        };

        // ─────────────────────────────────────────────────────────────────
        // Fysiken (ideal transformator, exakt enligt genomgången fy2-3.11)
        // ─────────────────────────────────────────────────────────────────
        // N1/N2 = U1/U2 och N1/N2 = I2/I1. Momentanvärden: u = Û · sin(ωt),
        // flödet Φ = −Φ̂ · cos(ωt) så att e = N · dΦ/dt ligger i fas med u.
        function effektivvarden(p) {
            const ac = p.kalla === 'ac' && p.till;
            const U2 = ac ? p.U1 * p.N2 / p.N1 : 0;
            const I2 = ac && p.load ? U2 / p.R : 0;
            const I1 = ac && p.load ? I2 * p.N2 / p.N1 : 0;
            return { U1: p.till ? p.U1 : 0, U2, I1, I2, P: U2 * I2, U2ac: p.U1 * p.N2 / p.N1 };
        }

        // ─────────────────────────────────────────────────────────────────
        // Polylinjer (ström och elektroner längs ledningarna)
        // ─────────────────────────────────────────────────────────────────
        function polylinje2(pts) {
            const L = [0];
            for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
            return {
                pts, L, len: L[L.length - 1],
                at(s) {
                    s = Math.max(0, Math.min(this.len, s));
                    let lo = 0, hi = this.L.length - 1;
                    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (this.L[m] < s) lo = m; else hi = m; }
                    const t = (s - this.L[lo]) / Math.max(1e-9, this.L[hi] - this.L[lo]);
                    const a = this.pts[lo], b = this.pts[hi];
                    const d = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
                    return { x: a[0] + t * (b[0] - a[0]), y: a[1] + t * (b[1] - a[1]), dx: (b[0] - a[0]) / d, dy: (b[1] - a[1]) / d };
                },
            };
        }

        // ─────────────────────────────────────────────────────────────────
        // 2D-scenen
        // ─────────────────────────────────────────────────────────────────
        const VBW = 820, VBH = 470;
        const K2 = { x0: 230, x1: 560, y0: 78, y1: 368, w: 44 };   // järnkärnan
        const LEG1 = K2.x0 + K2.w / 2, LEG2 = K2.x1 - K2.w / 2;   // benens mittlinjer
        const OK = (K2.y0 + K2.w / 2), NK = (K2.y1 - K2.w / 2);   // oket upptill och nedtill (mittlinje)
        const CY0 = 150, CY1 = 296;                               // spolarnas översta och nedersta varv
        const CRX = 33, CRY = 8;                                  // varvens halvaxlar
        const SRC = { x: 96, y: 223, r: 18 };
        const LAMP = { x: 700, y: 223, r: 19 };
        const BRYT = { x0: 140, x1: 182 };                        // strömbrytaren på primärsidans övre ledning

        const varv2D = (N) => Math.max(3, Math.min(14, Math.round(3 + 11 * (N - NMIN) / (NMAX - NMIN))));

        // Ledningarna, som polylinjer i strömmens positiva riktning
        const P1 = polylinje2([[SRC.x, SRC.y - SRC.r], [SRC.x, CY0], [LEG1 - CRX, CY0]]);
        const P1b = polylinje2([[LEG1 - CRX, CY1], [SRC.x, CY1], [SRC.x, SRC.y + SRC.r]]);
        const P2 = polylinje2([[LEG2 + CRX, CY1], [LAMP.x, CY1], [LAMP.x, LAMP.y + LAMP.r]]);
        const P2b = polylinje2([[LAMP.x, LAMP.y - LAMP.r], [LAMP.x, CY0], [LEG2 + CRX, CY0]]);

        function Scen2D({ st, p, show, eff, onBrytare }) {
            const f = st.f;
            const els = [], fram = [], bak = [];

            // spolarna: varvens bakre halva ritas före kärnan, den främre efter
            const spole = (cx, N, farg) => {
                const n = varv2D(N);
                for (let i = 0; i < n; i++) {
                    const cy = CY0 + (n === 1 ? 0 : i * (CY1 - CY0) / (n - 1));
                    bak.push(<path key={`b${cx}-${i}`} d={`M ${cx - CRX} ${cy} A ${CRX} ${CRY} 0 0 1 ${cx + CRX} ${cy}`}
                                   fill="none" stroke={COL.kopparM} strokeWidth="3.4" strokeLinecap="round" />);
                    fram.push(<path key={`f${cx}-${i}`} d={`M ${cx - CRX} ${cy} A ${CRX} ${CRY} 0 0 0 ${cx + CRX} ${cy}`}
                                    fill="none" stroke={farg} strokeWidth="3.6" strokeLinecap="round" />);
                }
            };
            spole(LEG1, p.N1, COL.koppar);
            spole(LEG2, p.N2, COL.koppar);

            // flödets pilar längs kärnans mittlinje (positivt flöde medurs)
            const fluxEls = [];
            if (show.flux && Math.abs(f) > 0.03) {
                const a = Math.abs(f), dir = f > 0 ? 1 : -1;
                const L = 12 + 34 * a;
                const pilar = [[330, OK, dir, 0], [460, OK, dir, 0], [460, NK, -dir, 0], [330, NK, -dir, 0]];
                pilar.forEach(([x, y, dx], i) => {
                    const tip = x + dx * L / 2, tail = x - dx * L / 2, base = tip - dx * 11;
                    fluxEls.push(
                        <g key={`fx${i}`} opacity={0.35 + 0.65 * a}>
                            <line x1={tail} y1={y} x2={base} y2={y} stroke={COL.flux} strokeWidth={2.4 + 2.2 * a} strokeLinecap="butt" />
                            <polygon points={`${tip},${y} ${base},${y - 6.5} ${base},${y + 6.5}`} fill={COL.flux} />
                        </g>
                    );
                });
            }

            // ström- och elektronmarkörer längs en ledning
            const stromPilar = (pl, a, farg, key) => {

                    const ux = q.dx * sg, uy = q.dy * sg;

            const elektroner = (pl, q, key) => {
                if (!show.elek) return null;
                const steg = 22, out = [];
                const n = Math.floor(pl.len / steg);
                for (let i = 0; i < n; i++) {

                    {/* bakre halvorna av varven, kärnan, flödet och de främre halvorna */}
                    {bak}
                    <path d={`M ${K2.x0} ${K2.y0} H ${K2.x1} V ${K2.y1} H ${K2.x0} Z M ${K2.x0 + K2.w} ${K2.y0 + K2.w} V ${K2.y1 - K2.w} H ${K2.x1 - K2.w} V ${K2.y0 + K2.w} Z`}
                          fillRule="evenodd" fill="url(#lam)" stroke="#7d848e" strokeWidth="1.6" />
                    {show.flux && (
                        <rect x={LEG1} y={OK} width={LEG2 - LEG1} height={NK - OK} rx="8" fill="none" stroke={COL.flux}
                              strokeWidth="1.6" strokeDasharray="5 5" opacity={0.15 + 0.45 * Math.abs(f)} />

        // ─────────────────────────────────────────────────────────────────
        // 3D-hjälp (samma mönster som Den enklaste elmotorn och Lenz lag)
        // ─────────────────────────────────────────────────────────────────
        const Y_AXEL = new THREE.Vector3(0, 1, 0);
        const linjar = (hex) => new THREE.Color(hex).convertSRGBToLinear();
        const markMat = (hex, opt = {}) => new THREE.MeshStandardMaterial({
            color: linjar(hex), emissive: linjar(hex).multiplyScalar(opt.glod != null ? opt.glod : 0.5),
            roughness: 0.55, metalness: 0, toneMapped: false,
            transparent: !!opt.opacity, opacity: opt.opacity || 1, depthWrite: !opt.opacity });
        function canvasTex(w, h, rita) {
            const c = document.createElement('canvas');
            c.width = w; c.height = h;
            rita(c.getContext('2d'), w, h);
            const t = new THREE.CanvasTexture(c);
            t.encoding = THREE.sRGBEncoding;
            t.anisotropy = 8;
            t.userData = { c, rita };
            return t;
        }
        const ritaOm = (t, rita) => { const c = t.userData.c; rita(c.getContext('2d'), c.width, c.height); t.needsUpdate = true; };
        const textSprite = (parts, h = 0.42) => {
            const c = document.createElement('canvas');
            const ctx = c.getContext('2d');
            const FS = 64, PAD = 14;
            const fontFor = (q) => `${q.italic ? 'italic ' : ''}${q.weight || 600} ${q.small ? FS * 0.66 : FS}px Poppins, sans-serif`;
            let w = 0;
            parts.forEach((q) => { ctx.font = fontFor(q); w += ctx.measureText(q.t).width; });
            c.width = Math.max(2, Math.ceil(w) + PAD * 2);
            c.height = FS + PAD * 2;
            let x = PAD;
            parts.forEach((q) => {
                ctx.font = fontFor(q); ctx.textBaseline = 'middle'; ctx.fillStyle = q.color;
                ctx.fillText(q.t, x, c.height / 2 + 2 + (q.small ? FS * 0.2 : 0));
                x += ctx.measureText(q.t).width;
            });
            const tex = new THREE.CanvasTexture(c);
            tex.minFilter = THREE.LinearFilter; tex.encoding = THREE.sRGBEncoding;
            const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false, toneMapped: false }));
            spr.scale.set(h * c.width / c.height, h, 1);
            spr.renderOrder = 20;
            return spr;
        };
        function traTextur() {
            return canvasTex(1024, 1024, (ctx, w, h) => {
                const g = ctx.createLinearGradient(0, 0, w, h);
                g.addColorStop(0, '#caa274'); g.addColorStop(1, '#b98d5e');
                ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
                let seed = 11;
                const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
                for (let i = 0; i < 140; i++) {
                    const y0 = rnd() * h, amp = 4 + rnd() * 14, fr = 0.004 + rnd() * 0.01, ph = rnd() * 6;
                    ctx.strokeStyle = `rgba(${90 + rnd() * 30},${55 + rnd() * 20},30,${0.05 + rnd() * 0.13})`;
                    ctx.lineWidth = 0.6 + rnd() * 2.4;
                    ctx.beginPath();
                    for (let x = 0; x <= w; x += 8) {
                        const y = y0 + Math.sin(x * fr + ph) * amp + Math.sin(x * fr * 3.1 + ph) * amp * 0.25;
                        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                    }
                    ctx.stroke();
                }
                ctx.strokeStyle = 'rgba(70,45,25,0.35)'; ctx.lineWidth = 2;
                [256, 512, 768].forEach(y => { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); });
            });
        }
        // järnkärnans plåtar: tunna ränder (laminering) på ytor där plåtkanterna syns
        function lamTextur(randerVagratt) {
            return canvasTex(512, 512, (ctx, w, h) => {
                const g = ctx.createLinearGradient(0, 0, w, h);
                g.addColorStop(0, '#9aa1aa'); g.addColorStop(1, '#7f8790');
                ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
                for (let i = 0; i < 64; i++) {
                    const p = i * (randerVagratt ? h : w) / 64;
                    ctx.fillStyle = i % 2 ? 'rgba(255,255,255,0.10)' : 'rgba(0,0,0,0.12)';
                    if (randerVagratt) ctx.fillRect(0, p, w, 2.2); else ctx.fillRect(p, 0, 2.2, h);
                }
            });
        }
        function stalTextur() {
            return canvasTex(512, 512, (ctx, w, h) => {
                ctx.fillStyle = '#8d949d'; ctx.fillRect(0, 0, w, h);
                let seed = 5;
                const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
                for (let i = 0; i < 900; i++) {
                    ctx.fillStyle = `rgba(${rnd() > 0.5 ? 255 : 0},${rnd() > 0.5 ? 255 : 0},255,${0.02 + rnd() * 0.03})`;
                    ctx.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 30, 1);
                }
            });
        }
        function omgivning(renderer) {
            const tex = canvasTex(1024, 512, (ctx, w, h) => {
                const g = ctx.createLinearGradient(0, 0, 0, h);
                g.addColorStop(0, '#fbf8f2'); g.addColorStop(0.45, '#efe7d8'); g.addColorStop(0.55, '#a98559'); g.addColorStop(1, '#5d4128');
                ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
                ctx.fillStyle = 'rgba(255,255,255,0.95)';
                ctx.fillRect(w * 0.12, h * 0.12, w * 0.16, h * 0.2);
                ctx.fillRect(w * 0.6, h * 0.08, w * 0.22, h * 0.14);
            });
            tex.mapping = THREE.EquirectangularReflectionMapping;
            const pm = new THREE.PMREMGenerator(renderer);
            const env = pm.fromEquirectangular(tex).texture;
            pm.dispose();
            return env;
        }
        // nätaggregatets front: display med U1 och strömbrytarens text
        function ritaAggregat(ctx, w, h, s) {
            ctx.fillStyle = '#e9e4da'; ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = '#d8d1c4'; ctx.fillRect(0, h * 0.84, w, h * 0.16);
            // display
            const dx = w * 0.08, dy = h * 0.1, dw = w * 0.58, dh = h * 0.36;
            ctx.fillStyle = '#1b2a22'; ctx.beginPath(); ctx.roundRect(dx, dy, dw, dh, 14); ctx.fill();
            ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
            if (s.till) {
                ctx.fillStyle = '#7dffb2';
                let fs = dh * 0.62;
                const fontV = () => `600 ${Math.round(fs)}px "JetBrains Mono", monospace`;
                ctx.font = fontV();
                while (ctx.measureText(s.text).width > dw - 44 && fs > 10) { fs *= 0.94; ctx.font = fontV(); }
                ctx.fillText(s.text, dx + dw - 22, dy + dh * 0.53);
            }
            ctx.textAlign = 'left'; ctx.fillStyle = '#3a3f47';
            ctx.font = `600 ${Math.round(h * 0.075)}px Poppins, sans-serif`;
            ctx.fillText(tr(s.ac ? 'VÄXELSPÄNNING' : 'LIKSPÄNNING') + (s.ac ? '  ~' : '  ='), dx, h * 0.58);
            ctx.font = `600 ${Math.round(h * 0.06)}px Poppins, sans-serif`;
            ctx.fillStyle = '#5a6170';
            ctx.fillText('FYSIKLABBET', dx, h * 0.92);
            ctx.textAlign = 'center';
            ctx.fillText(tr(s.till ? 'PÅ' : 'AV'), w * 0.83, h * 0.12);
            // vred
            ctx.fillStyle = '#2b2f36'; ctx.beginPath(); ctx.arc(w * 0.83, h * 0.7, h * 0.11, 0, 2 * Math.PI); ctx.fill();
            ctx.strokeStyle = '#e9e4da'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(w * 0.83, h * 0.7); ctx.lineTo(w * 0.83 + h * 0.07, h * 0.64); ctx.stroke();
        }
        // multimeterns front: digital display med U2
        function ritaMultimeter(ctx, w, h, s) {
            ctx.fillStyle = '#e8b735'; ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = '#2b2f36'; ctx.beginPath(); ctx.roundRect(w * 0.07, h * 0.04, w * 0.86, h * 0.92, 26); ctx.fill();
            const dx = w * 0.14, dy = h * 0.09, dw = w * 0.72, dh = h * 0.26;
            ctx.fillStyle = '#c6d3b4'; ctx.beginPath(); ctx.roundRect(dx, dy, dw, dh, 10); ctx.fill();
            ctx.fillStyle = '#18201a'; ctx.textBaseline = 'middle';
            ctx.textAlign = 'left'; ctx.font = `600 ${Math.round(dh * 0.18)}px Poppins, sans-serif`;
            ctx.fillText(s.ac ? 'AC' : 'DC', dx + 12, dy + dh * 0.17);
            // värdet krymps tills det ryms helt i displayen (till exempel "39,1 V" eller "2,30 kV")
            ctx.textAlign = 'right';
            let fs = dh * 0.5;
            const fontV = () => `600 ${Math.round(fs)}px "JetBrains Mono", monospace`;
            ctx.font = fontV();
            while (ctx.measureText(s.text).width > dw - 30 && fs > 10) { fs *= 0.94; ctx.font = fontV(); }
            ctx.fillText(s.text, dx + dw - 14, dy + dh * 0.58);
            // vridomkopplare
            ctx.fillStyle = '#3b4048'; ctx.beginPath(); ctx.arc(w / 2, h * 0.6, w * 0.22, 0, 2 * Math.PI); ctx.fill();
            ctx.fillStyle = '#1b1e23'; ctx.beginPath(); ctx.arc(w / 2, h * 0.6, w * 0.15, 0, 2 * Math.PI); ctx.fill();
            ctx.strokeStyle = '#e9e4da'; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(w / 2, h * 0.6); ctx.lineTo(w / 2 - w * 0.12, h * 0.6 - w * 0.1); ctx.stroke();
            ctx.fillStyle = '#e9e4da'; ctx.textAlign = 'center';
            ctx.font = `600 ${Math.round(w * 0.075)}px Poppins, sans-serif`;
            ctx.fillText('V~', w / 2 - w * 0.27, h * 0.43);
            ctx.fillText('V', w / 2 + w * 0.27, h * 0.43);
            ctx.fillText(tr('COM'), w * 0.3, h * 0.9); ctx.fillText('V', w * 0.7, h * 0.9);
        }

        // Geometri i 3D (cm). Kärnan står på en träsockel, x åt höger, y uppåt, z mot betraktaren.
        const KG = { b: 26, h: 22, d: 5, w: 4.5, y0: 2.2 };
        const KX = KG.b / 2 - KG.w / 2;                       // benens mittlinjer x = ±KX
        const SP = { y0: KG.y0 + KG.w + 0.9, y1: KG.y0 + KG.h - KG.w - 0.9, hx: KG.w / 2 + 0.75, hz: KG.d / 2 + 0.75, r: 0.7 };
        const varv3D = (N) => Math.max(5, Math.min(30, Math.round(5 + 25 * (N - NMIN) / (NMAX - NMIN))));
        const VYER3 = {

        function Scen3D({ stRef, pRef, apiRef }) {

                const pek = new Map();
                let drag = null, pinch = null, klick = null;
                const onDown = (e) => {
                    pek.set(e.pointerId, { x: e.clientX, y: e.clientY });
                    el.setPointerCapture(e.pointerId);
                    camMal = null;
                    if (pek.size === 1) { drag = { x: e.clientX, y: e.clientY }; klick = { x: e.clientX, y: e.clientY }; }
                    else if (pek.size === 2) {
                        const [a, b] = [...pek.values()];
                        pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), r: cam.radius };
                        drag = null; klick = null;
                    }
                };
                const onMove = (e) => {
                    if (pek.has(e.pointerId)) pek.set(e.pointerId, { x: e.clientX, y: e.clientY });
                    if (pinch && pek.size === 2) {
                        const [a, b] = [...pek.values()];
                        cam.radius = Math.max(40, Math.min(170, pinch.r * pinch.d / Math.max(1, Math.hypot(a.x - b.x, a.y - b.y))));
                        return;
                    }
                    if (klick && Math.hypot(e.clientX - klick.x, e.clientY - klick.y) > 6) klick = null;
                    if (drag) {
                        cam.theta -= (e.clientX - drag.x) * 0.006;
                        cam.phi = Math.max(0.08, Math.min(1.52, cam.phi - (e.clientY - drag.y) * 0.005));
                        drag.x = e.clientX; drag.y = e.clientY;
                        if (!klick) el.classList.add('dragging');
                        return;
                    }
                    if (e.pointerType === 'mouse') {
                        satt(e);
                        const h = traff();
                        el.classList.toggle('pointer', !!h); el.classList.toggle('grab', !h);
                    }
                };
                const onUp = (e) => {
                    if (klick && pek.size === 1) {
                        satt(e);
                        const h = traff();
                        if (h === 'brytare') apiRef.current.brytare();
                        if (h === 'lampa') apiRef.current.lampa();
                    }
                    klick = null;
                    pek.delete(e.pointerId);
                    if (pek.size < 2) pinch = null;
                    if (pek.size === 0) drag = null;
                    el.classList.remove('dragging');
                };
                const onWheel = (e) => { e.preventDefault(); camMal = null; cam.radius = Math.max(40, Math.min(170, cam.radius * Math.exp(e.deltaY * 0.0012))); };
                el.addEventListener('pointerdown', onDown);
                el.addEventListener('pointermove', onMove);
                el.addEventListener('pointerup', onUp);
                el.addEventListener('pointercancel', onUp);
                el.addEventListener('wheel', onWheel, { passive: false });
                el.classList.add('grab');

                const ro = new ResizeObserver(() => {
                    renderer.setSize(W(), H());
                    camera.aspect = W() / H();
                    // vågrätt synfält så att aggregat, kärna och lampa ryms (smalare på stående skärmar)
                    camera.fov = Math.max(26, Math.min(82, 2 * Math.atan(Math.tan((camera.aspect < 1 ? 31 : 25) * Math.PI / 180) / camera.aspect) * 180 / Math.PI));
                    camera.updateProjectionMatrix();
                });
                ro.observe(el);
                let synlig = true;
                const io = new IntersectionObserver((en) => { synlig = en[0].isIntersecting; }, { threshold: 0.01 });
                io.observe(el);

                let raf = 0, tLast = performance.now();
                const tick = () => {
                    raf = requestAnimationFrame(tick);
                    const now = performance.now();
                    const dt = Math.min(0.05, (now - tLast) / 1000); tLast = now;
                    if (!synlig) return;
                    const st = stRef.current, p = pRef.current, sh = p.show, eff = p.eff;
                    const nyckel = `${varv3D(p.N1)}-${varv3D(p.N2)}-${p.load}`;
                    if (nyckel !== byggt) { bygg(p.N1, p.N2, p.load); byggt = nyckel; }

                    // displayerna
                    const dA = `${p.till}-${p.kalla}-${fmtU(p.U1)}`;
                    if (dA !== dispAggr) { dispAggr = dA; ritaOm(aggrTex, (ctx, w, h) => ritaAggregat(ctx, w, h, { till: p.till, ac: p.kalla === 'ac', text: fmtU(p.U1).replace(' ', ' ') })); }
                    const visU2 = p.kalla === 'ac' ? eff.U2 : st.u2;
                    const dM = `${p.kalla}-${fmtU(visU2)}`;
                    if (dM !== dispMm) { dispMm = dM; ritaOm(mmTex, (ctx, w, h) => ritaMultimeter(ctx, w, h, { ac: p.kalla === 'ac', text: fmtU(visU2) })); }
                    vipp.rotation.x = p.till ? -0.35 : 0.35;

                    // lampan
                    lampG.visible = true;
                    const gl = p.load ? Math.min(1, st.glow * 1.6) : 0;
                    glasMat.emissiveIntensity = 3.2 * gl;
                    glasMat.opacity = 0.32 + 0.6 * gl;
                    gloria.material.opacity = gl;
                    gloria.scale.setScalar(7 + 9 * gl);
                    trad.material.emissive.copy(linjar('#ffb43a')).multiplyScalar(p.load ? 3 * st.glow : 0);
                    ljus.intensity = p.load ? 2.2 * st.glow : 0;

                    // flödet
                    const f = st.f, af = Math.abs(f);
                    fluxPilar.forEach(fp => {
                        const vis = sh.flux && af > 0.03;
                        fp.g.visible = vis;
                        if (!vis) return;
                        const L = 1.5 + 5 * af;
                        const dir = (f > 0 ? 1 : -1) * fp.dx;
                        fp.g.rotation.z = dir > 0 ? -Math.PI / 2 : Math.PI / 2;
                        fp.sk.scale.set(1, L, 1); fp.sk.position.y = 0;
                        fp.sp.position.y = L / 2 + 1.0;
                    });
                    fluxRing.visible = sh.flux;
                    fluxRing.material.opacity = 0.12 + 0.5 * af;
                    phiL.visible = sh.flux;

                    // strömmar och elektroner
                    kretsar.forEach(k => {
                        const a = k.sida === 'p' ? st.a1 : st.a2;
                        const q = (k.sida === 'p' ? st.q1 : st.q2) * 0.1;
                        const aktiv = Math.abs(a) > 0.04 && (k.sida === 'p' ? p.till : p.load);
                        const sg = a >= 0 ? 1 : -1;
                        k.pilar.forEach(pp => {
                            pp.m.visible = sh.strom && aktiv;
                            if (!pp.m.visible) return;
                            const { p: pos, d } = k.bana.at(pp.s0);
                            pp.m.position.copy(pos);
                            pp.m.quaternion.setFromUnitVectors(Y_AXEL, d.multiplyScalar(sg));
                            const sk = 0.45 + 0.75 * Math.abs(a);
                            pp.m.scale.set(sk, sk, sk);
                        });
                        k.elek.forEach(ee => {
                            ee.m.visible = sh.elek;
                            if (ee.m.visible) ee.m.position.copy(k.bana.at(ee.s0 - q).p);
                        });
                    });
                    i1L.visible = sh.strom && p.till && Math.abs(st.a1) > 0.04;
                    i2L.visible = sh.strom && p.load && Math.abs(st.a2) > 0.04;

                    if (camMal) {
                        const k = Math.min(1, dt * 4);
                        cam.theta += (camMal.theta - cam.theta) * k; cam.phi += (camMal.phi - cam.phi) * k;
                        cam.radius += (camMal.radius - cam.radius) * k; cam.target.lerp(camMal.target, k);
                        if (Math.abs(camMal.phi - cam.phi) < 1e-3 && Math.abs(camMal.theta - cam.theta) < 1e-3) camMal = null;
                    }
                    uppdKam();
                    renderer.render(scene, camera);
                };
                tick();
                return () => {
                    cancelAnimationFrame(raf); ro.disconnect(); io.disconnect();
                    el.removeEventListener('pointerdown', onDown); el.removeEventListener('pointermove', onMove);
                    el.removeEventListener('pointerup', onUp); el.removeEventListener('pointercancel', onUp);
                    el.removeEventListener('wheel', onWheel);
                    renderer.dispose();
                    if (renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement);
                };
            }, []);
            return <div ref={mountRef} className="tre-mount" />;
        }

        // ─────────────────────────────────────────────────────────────────
        // Graf: u1(t), u2(t) och flödet Φ(t)
        // ─────────────────────────────────────────────────────────────────
        const skalsteg = (m) => {
            const s = [0.5, 1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000, 50000, 100000, 200000, 500000, 1e6, 2e6, 5e6];
            return s.find(x => x >= m * 1.02) || s[s.length - 1];
        };
        function Graf({ buf, U1, U2ac }) {
            const W = 560, H = 170, pl = 46, pr = 46, pt = 14, pb = 24;
            const tNu = buf.length ? buf[buf.length - 1].t : 0;
            const X = (t) => pl + (W - pl - pr) * (1 - (tNu - t) / GRAF_T);
            const s1 = skalsteg(Math.SQRT2 * Math.max(U1, 1e-3)), s2 = skalsteg(Math.SQRT2 * Math.max(U2ac, 1e-3));
            const mid = pt + (H - pt - pb) / 2, amp = (H - pt - pb) / 2;
            const Y = (u, s) => mid - amp * Math.max(-1.08, Math.min(1.08, u / s));
            const lin = (k, s) => buf.map(b => `${X(b.t).toFixed(1)},${Y(b[k], s).toFixed(1)}`).join(' ');
            const fUt = buf.map(b => `${X(b.t).toFixed(1)},${(mid - amp * 0.92 * b.f).toFixed(1)}`).join(' ');
            const t1 = (v) => fmt(v, v < 1 ? 1 : 0).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
            return (
                <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ display: 'block' }} fontFamily="Poppins, sans-serif">
                    <line x1={pl} y1={pt} x2={pl} y2={H - pb} stroke={COL.ink} strokeWidth="1" opacity="0.5" />
                    <line x1={W - pr} y1={pt} x2={W - pr} y2={H - pb} stroke={COL.ink} strokeWidth="1" opacity="0.5" />
                    <line x1={pl} y1={mid} x2={W - pr} y2={mid} stroke="#38bdf8" strokeWidth="1.4" />
                    {[1, -1].map(sg => (
                        <g key={sg}>
                            <line x1={pl - 4} y1={mid - sg * amp} x2={pl} y2={mid - sg * amp} stroke={COL.ink} strokeWidth="1" />
                            <text x={pl - 6} y={mid - sg * amp + 4} textAnchor="end" fontSize="10" fill={COL.prim}>{(sg < 0 ? '−' : '') + t1(s1)}</text>
                            <line x1={W - pr} y1={mid - sg * amp} x2={W - pr + 4} y2={mid - sg * amp} stroke={COL.ink} strokeWidth="1" />
                            <text x={W - pr + 6} y={mid - sg * amp + 4} textAnchor="start" fontSize="10" fill={COL.sek}>{(sg < 0 ? '−' : '') + t1(s2)}</text>
                        </g>
                    ))}
                    <text x={pl - 6} y={mid + 4} textAnchor="end" fontSize="10" fill={COL.ink}>0</text>
                    <text x={pl + 6} y={pt + 9} fontSize="11" fill={COL.prim}><tspan fontStyle="italic">u</tspan><tspan fontSize="8" dy="2">1</tspan><tspan dy="-2"> (V)</tspan></text>
                    <text x={W - pr - 6} y={pt + 9} textAnchor="end" fontSize="11" fill={COL.sek}><tspan fontStyle="italic">u</tspan><tspan fontSize="8" dy="2">2</tspan><tspan dy="-2"> (V)</tspan></text>
                    <text x={(W) / 2} y={pt + 9} textAnchor="middle" fontSize="11" fill={COL.flux}><tspan fontStyle="italic">Φ</tspan></text>
                    <text x={W - pr} y={H - 6} textAnchor="end" fontSize="10.5" fill={COL.ink}><tspan fontStyle="italic">t</tspan></text>
                    <polyline points={fUt} fill="none" stroke={COL.flux} strokeWidth="1.6" strokeDasharray="5 4" strokeLinejoin="round" />
                    <polyline points={lin('u1', s1)} fill="none" stroke={COL.prim} strokeWidth="2" strokeLinejoin="round" />
                    <polyline points={lin('u2', s2)} fill="none" stroke={COL.sek} strokeWidth="2.2" strokeLinejoin="round" />
                </svg>
            );
        }

        // ─────────────────────────────────────────────────────────────────
        // Formelkort och reglage
        // ─────────────────────────────────────────────────────────────────
        const LFrac = ({ topLbl, top, botLbl, bot }) => (
            <div className="flex flex-col items-center" style={{ lineHeight: 1.15 }}>
                <span className="flbl">{topLbl}</span>
                <span className="fnum" style={{ padding: '0 8px 3px' }}>{top}</span>
                <span className="fnum" style={{ padding: '3px 8px 0', borderTop: '2px solid currentColor', alignSelf: 'stretch', textAlign: 'center' }}>{bot}</span>
                <span className="flbl">{botLbl}</span>
            </div>
        );
        const Frac = ({ top, bot, size = 15 }) => (
            <div className="flex flex-col items-center" style={{ lineHeight: 1.15 }}>
                <span style={{ fontSize: size, padding: '0 6px 2px' }}>{top}</span>
                <span style={{ fontSize: size, padding: '2px 6px 0', borderTop: '2px solid currentColor', alignSelf: 'stretch', textAlign: 'center' }}>{bot}</span>
            </div>
        );
        // Formelkortet (prov 2026-11-07): ett kort ord ovanför varje bråk i stället för en
        // etikett på varje variabel, så att bråkstrecken blir smala. Index 1 (primär) i bläck,
        // index 2 (sekundär) i lila, samma färger som i scenen.
        const Sym = ({ b, i }) => (
            <span style={{ color: i === 2 ? COL.sek : COL.prim, whiteSpace: 'nowrap' }}><em>{b}</em><span style={{ fontSize: '0.6em', verticalAlign: '-0.28em', marginLeft: '0.04em' }}>{i}</span></span>
        );
        const Brak = ({ top, bot }) => (
            <span className="inline-flex flex-col items-center fnum" style={{ lineHeight: 1.12, fontSize: 25 }}>
                <span style={{ padding: '0 3px 2px' }}>{top}</span>
                <span style={{ padding: '2px 3px 0', borderTop: '2px solid var(--lab-ink, #1f2530)', alignSelf: 'stretch', textAlign: 'center' }}>{bot}</span>
            </span>
        );
        const Formel = ({ a, b }) => (
            <div style={{ display: 'grid', gridTemplateColumns: 'auto auto auto', columnGap: 12, rowGap: 2, alignItems: 'center', justifyItems: 'center' }}>
                <span className="flbl">{a.lbl}</span><span />
                <span className="flbl">{b.lbl}</span>
                <Brak top={a.top} bot={a.bot} />
                <span className="fnum" style={{ fontSize: 25 }}>=</span>
                <Brak top={b.top} bot={b.bot} />
            </div>
        );
        const FormulaCard = () => (
            <div className="glass-card rounded-xl p-4 mb-6" style={{ color: 'var(--lab-ink)' }}>
                <div className="flex flex-wrap items-center gap-x-12 gap-y-4">
                    <Formel a={{ lbl: 'varv', top: <Sym b="N" i={1} />, bot: <Sym b="N" i={2} /> }}
                            b={{ lbl: 'spänning', top: <Sym b="U" i={1} />, bot: <Sym b="U" i={2} /> }} />
                    <Formel a={{ lbl: 'varv', top: <Sym b="N" i={1} />, bot: <Sym b="N" i={2} /> }}
                            b={{ lbl: 'ström', top: <Sym b="I" i={2} />, bot: <Sym b="I" i={1} /> }} />
                    <div style={{ fontSize: 14, lineHeight: 1.5 }}>
                        <div><span style={{ color: COL.prim, fontWeight: 700 }}>1</span> = primärspolen</div>
                        <div><span style={{ color: COL.sek, fontWeight: 700 }}>2</span> = sekundärspolen</div>
                    </div>
                </div>
                <div className="mt-3" style={{ color: 'var(--lab-ink-muted)', fontSize: 13 }}>
                    Gäller en ideal transformator, utan energiförluster. Lägg märke till att strömkvoten är omvänd.
                </div>
            </div>
        );
        const Slider = ({ label, sub, value, min, max, step, onChange, valueText }) => (
            <div className="mb-3">
                <div className="flex justify-between items-baseline mb-1">
                    <label className="text-sm font-bold" style={{ color: 'var(--lab-ink)' }} dangerouslySetInnerHTML={{ __html: label }} />
                    <div className="font-mono font-semibold text-sm" style={{ color: 'var(--lab-accent)' }}>{valueText}</div>
                </div>
                <input type="range" min={min} max={max} step={step} value={value}
                       onChange={(e) => onChange(parseFloat(e.target.value))} className="w-full cursor-pointer" />
                {sub && <div className="text-xs mt-1" style={{ color: 'var(--lab-ink-muted)' }} dangerouslySetInnerHTML={{ __html: sub }} />}
            </div>
        );
        const StSlider = ({ label, value, min, max, step, onChange, valueText }) => (
            <div className="st-slider">
                <div className="st-slider-top">
                    <span dangerouslySetInnerHTML={{ __html: label }} />
                    <span style={{ whiteSpace: 'nowrap', fontWeight: 600, color: 'var(--lab-ink, #0f1620)' }}>{valueText}</span>
                </div>
                <span className="sl-wrap">
                    <input type="range" min={min} max={max} step={step} value={value}
                           onChange={(e) => onChange(parseFloat(e.target.value))} />
                </span>
            </div>
        );
        const Readout = ({ label, value, color }) => (
            <div className="p-2 rounded-lg" style={{ background: 'var(--lab-bg)', border: '1px solid var(--lab-line-strong)' }}>
                <div className="text-xs" style={{ color: 'var(--lab-ink-muted)' }} dangerouslySetInnerHTML={{ __html: label }} />
                <div className="font-mono font-bold text-sm" style={{ color: color || 'var(--lab-ink)' }}>{value}</div>
            </div>
        );

        // ─────────────────────────────────────────────────────────────────
        // Appen
        // ─────────────────────────────────────────────────────────────────
        const App = () => {
            const q = new URLSearchParams(location.search);
            const num = (k, d) => (isFinite(parseFloat(q.get(k))) ? parseFloat(q.get(k)) : d);
            const [U1, setU1] = useState(num('u1', 230));
            const [N1, setN1] = useState(num('n1', 1150));
            const [N2, setN2] = useState(num('n2', 100));
            const [R, setR] = useState(num('r', 50));
            const [load, setLoad] = useState(q.get('last') !== '0');
            const [kalla, setKalla] = useState(q.get('kalla') === 'lik' ? 'dc' : 'ac');
            const [till, setTill] = useState(true);
            const [running, setRunning] = useState(true);
            const [dim, setDim] = useState(q.get('vy') === '3d' ? '3d' : '2d');
            const [vy3, setVy3] = useState('snett');
            const [show, setShow] = useState({ flux: true, strom: true, elek: false });
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [togglesOpen, setTogglesOpen] = useState(true);
            const [, setTick] = useState(0);

            const sceneWrapRef = useRef(null);
            const stRef = useRef({ t: 0, th: 0, f: 0, u1: 0, u2: 0, i1: 0, i2: 0, a1: 0, a2: 0, q1: 0, q2: 0, glow: 0, buf: [] });
            const pRef = useRef({});
            const apiRef = useRef({});
            const eff = effektivvarden({ U1, N1, N2, R, load, kalla, till });
            pRef.current = { U1, N1, N2, R, load, kalla, till, running, show, eff };

            // ── Fysikloopen (gemensam för 2D och 3D) ──
            useEffect(() => {
                let raf, last = performance.now(), sista = 0;
                const loop = (now) => {
                    raf = requestAnimationFrame(loop);
                    const dt = Math.min((now - last) / 1000, 0.05);
                    last = now;
                    const p = pRef.current, st = stRef.current;
                    if (!p.running) { setTick(t => (t + 1) % 1e6); return; }
                    st.t += dt;
                    const U2ac = p.U1 * p.N2 / p.N1;
                    let dfdt;
                    if (p.kalla === 'ac') {
                        if (p.till) {
                            st.th = (st.th + OMEGA * dt) % (2 * Math.PI);
                            const fNy = -Math.cos(st.th);
                            dfdt = OMEGA * Math.sin(st.th);
                            st.f = fNy;
                            st.u1 = Math.SQRT2 * p.U1 * Math.sin(st.th);
                        } else { st.f = 0; dfdt = 0; st.u1 = 0; }
                    } else {
                        // likspänning: flödet växer eller avtar mot sitt slutvärde vid till- och frånslag
                        const mal = p.till ? 1 : 0;
                        const fNy = mal + (st.f - mal) * Math.exp(-dt / TAU);
                        dfdt = (fNy - st.f) / dt;
                        st.f = fNy;
                        st.u1 = p.till ? p.U1 : 0;
                    }
                    // e2 = N2 · dΦ/dt, normerat så att växelspänningens toppvärde blir √2 · U2
                    st.u2 = Math.SQRT2 * U2ac * dfdt / OMEGA;
                    st.i2 = p.load ? st.u2 / p.R : 0;
                    st.i1 = p.kalla === 'ac' ? st.i2 * p.N2 / p.N1 : 0;
                    // normerade strömmar för pilar och elektroner: den största strömmen får störst utslag
                    const I2max = Math.SQRT2 * U2ac / p.R, I1max = I2max * p.N2 / p.N1;
                    const Iref = Math.max(I1max, I2max, 1e-9);
                    if (p.kalla === 'ac') {
                        st.a1 = p.load ? st.i1 / Iref : 0;
                        st.a2 = p.load ? st.i2 / Iref : 0;
                    } else {
                        st.a1 = p.till ? 0.8 : 0;                         // likström i primärkretsen
                        st.a2 = p.load ? Math.max(-1, Math.min(1, st.i2 / Math.max(I2max, 1e-9))) : 0;
                    }
                    // elektronernas förflyttning (motsatt strömmen); 2D i px, 3D skalas ned
                    const K = 40;
                    st.q1 += K * st.a1 * dt * (p.kalla === 'ac' ? 1 : 0.6);
                    st.q2 += K * st.a2 * dt;
                    // lampans glöd: effektivvärdet vid växelspänning, momentan effekt vid likspänningens stöt
                    const P = p.kalla === 'ac' ? p.eff.P : (p.load ? st.u2 * st.u2 / p.R / 2 : 0);
                    const mal = p.load ? P / (P + 12) : 0;
                    st.glow += (mal - st.glow) * Math.min(1, dt * (p.kalla === 'ac' ? 6 : 14));
                    if (st.t - sista > 1 / 30) {
                        sista = st.t;
                        st.buf.push({ t: st.t, u1: st.u1, u2: st.u2, f: st.f });
                        while (st.buf.length && st.t - st.buf[0].t > GRAF_T) st.buf.shift();
                    }
                    setTick(t => (t + 1) % 1e6);
                };
                raf = requestAnimationFrame(loop);
                return () => cancelAnimationFrame(raf);
            }, []);

            apiRef.current.brytare = () => setTill(t => !t);
            apiRef.current.lampa = () => setLoad(l => !l);

            useEffect(() => {
                const handler = () => setIsFullscreen(document.fullscreenElement === sceneWrapRef.current || document.webkitFullscreenElement === sceneWrapRef.current);
                document.addEventListener('fullscreenchange', handler);
                document.addEventListener('webkitfullscreenchange', handler);
                return () => { document.removeEventListener('fullscreenchange', handler); document.removeEventListener('webkitfullscreenchange', handler); };
            }, []);
            const toggleFullscreen = () => {
                const el = sceneWrapRef.current;
                if (!el) return;
                if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
            };
            const tShow = (key) => setShow(sh => ({ ...sh, [key]: !sh[key] }));
            const valjVy3 = (n) => { setVy3(n); if (apiRef.current.vy) apiRef.current.vy(n); };
            const forval = (u, n1, n2) => { setU1(u); setN1(n1); setN2(n2); setKalla('ac'); setTill(true); };

            const st = stRef.current;
            const ratioText = N1 >= N2
                ? `${fmt(N1 / N2, N1 / N2 >= 10 ? 1 : 2)} : 1`
                : `1 : ${fmt(N2 / N1, N2 / N1 >= 10 ? 1 : 2)}`;
            const upp = N2 > N1;
            const dcPuls = kalla === 'dc' && Math.abs(st.u2) > 0.01 * Math.max(eff.U2ac, 1e-3);

            const reglage = (Comp) => (
                <React.Fragment>
                    <Comp label={Comp === Slider ? 'Primärspänning (<em>U</em>₁)' : 'Spänning (<em>U</em>₁)'} value={U1}
                        min={U1MIN} max={U1MAX} step={5} onChange={setU1} valueText={fmtU(U1)}
                        sub={Comp === Slider ? (kalla === 'ac' ? 'Effektivvärdet av växelspänningen över primärspolen.' : 'Likspänningen över primärspolen.') : undefined} />
                    <Comp label={Comp === Slider ? 'Varv i primärspolen (<em>N</em>₁)' : 'Varv primär (<em>N</em>₁)'} value={N1}
                        min={NMIN} max={NMAX} step={10} onChange={setN1} valueText={fmtN(N1)}
                        sub={Comp === Slider ? 'Fler varv i primärspolen ger lägre sekundärspänning.' : undefined} />
                    <Comp label={Comp === Slider ? 'Varv i sekundärspolen (<em>N</em>₂)' : 'Varv sekundär (<em>N</em>₂)'} value={N2}
                        min={NMIN} max={NMAX} step={10} onChange={setN2} valueText={fmtN(N2)}
                        sub={Comp === Slider ? 'Fler varv i sekundärspolen ger högre sekundärspänning.' : undefined} />
                    {load && <Comp label={Comp === Slider ? 'Lampans resistans (<em>R</em>)' : 'Resistans (<em>R</em>)'} value={R}
                        min={RMIN} max={RMAX} step={5} onChange={setR} valueText={`${fmt(R, 0)} Ω`}
                        sub={Comp === Slider ? 'Lampan bestämmer strömmen genom Ohms lag, <em>I</em>₂ = <em>U</em>₂ / <em>R</em>.' : undefined} />}
                </React.Fragment>
            );

            const sceneToggles = () => (
                !togglesOpen ? (
                    <button className="st-show-btn" onClick={() => setTogglesOpen(true)} aria-label="Visa inställningar" title="Visa inställningar" aria-expanded="false">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" aria-hidden="true">
                            <line x1="4" y1="8" x2="20" y2="8" /><circle cx="14.5" cy="8" r="2.7" fill="currentColor" stroke="none" />
                            <line x1="4" y1="16" x2="20" y2="16" /><circle cx="9.5" cy="16" r="2.7" fill="currentColor" stroke="none" />
                        </svg>
                    </button>
                ) : (
                <div className="scene-toggles">
                    <button className="st-hide" onClick={() => setTogglesOpen(false)} aria-label="Dölj inställningar" title="Dölj inställningar" aria-expanded="true">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
                    </button>
                    <div className="st-title">Visa</div>
                    <label><input type="checkbox" checked={show.flux} onChange={() => tShow('flux')} />
                        <span className="st-swatch" style={{ background: COL.flux }}></span><span>Magnetiska flödet <em>Φ</em></span></label>
                    <label><input type="checkbox" checked={show.strom} onChange={() => tShow('strom')} />
                        <span className="st-swatch" style={{ background: `linear-gradient(90deg, ${COL.prim} 50%, ${COL.sek} 50%)` }}></span><span>Strömmarna <em>I</em>₁ och <em>I</em>₂</span></label>
                    <label><input type="checkbox" checked={show.elek} onChange={() => tShow('elek')} />
                        <span className="st-dot" style={{ background: COL.elek }}></span><span>Elektronerna</span></label>
                    <div className="st-title st-group">Sekundärsidan</div>
                    <label><input type="checkbox" checked={load} onChange={() => setLoad(l => !l)} /><span>Anslut lampan</span></label>
                    {isFullscreen && (
                        <React.Fragment>
                            <div className="st-title st-group">Reglage</div>
                            <div className="st-sliders">{reglage(StSlider)}</div>
                        </React.Fragment>
                    )}
                    {isFullscreen && (
                        <div className="st-actions">
                            <button className={`btn-toggle ${till ? '' : 'active'}`} onClick={() => setTill(t => !t)}>
                                {tr(till ? 'Slå av spänningen' : 'Slå på spänningen')}
                            </button>
                            <button className={`btn-toggle ${running ? '' : 'active'}`} onClick={() => setRunning(r => !r)}>
                                {tr(running ? 'Pausa' : 'Fortsätt')}
                            </button>
                        </div>
                    )}
                </div>
                )
            );

            return (
                <div className="min-h-screen dark-container px-4 md:px-8 pb-12" style={{ fontFamily: "'DM Sans', sans-serif" }}>
                    <div className="max-w-6xl mx-auto pt-6">
                        <div className="breadcrumb mb-4" style={{ fontSize: 13 }}>
                            <a href="index.html">Hem</a> / <a href="katalog.html#fy2">Fysik nivå 2</a> / Transformator
                        </div>
                        <h1 className="text-3xl md:text-4xl font-black tracking-tight" style={{ color: 'var(--lab-ink)' }}>Transformator</h1>
                        <p className="mt-2 mb-5" style={{ color: 'var(--lab-ink-soft)', maxWidth: 840 }}>
                            Två spolar på en gemensam järnkärna. Växelströmmen i primärspolen ger ett magnetiskt
                            flöde <em>Φ</em> som hela tiden ändras, och flödet går genom kärnan och sekundärspolen,
                            där det inducerar en ny spänning. Ändra varvtalen och se spänningen transformeras upp
                            eller ner. Anslut lampan och se att strömmen ändras åt <strong>motsatt</strong> håll, så
                            att effekten bevaras. Prova också likspänning, och växla till 3D för att se
                            transformatorn på labbänken.
                        </p>

                        <FormulaCard />

                        <main className="flex flex-col lg:flex-row gap-6">
                            <div className="lg:w-3/5 order-1">
                                <div className={'scene-wrap' + (isFullscreen ? ' is-fs' : '')} data-theme="ljusPapper" ref={sceneWrapRef}>
                                    {dim === '2d'
                                        ? <Scen2D st={st} p={pRef.current} show={show} eff={eff} onBrytare={() => setTill(t => !t)} />
                                        : <Scen3D stRef={stRef} pRef={pRef} apiRef={apiRef} />}

                                    <div className="scene-info">
                                        <span className="si-lbl">Sekundärspänning <em style={{ textTransform: 'none' }}>U</em>₂</span>
                                        <span className="si-val" style={{ color: COL.sek }}>{kalla === 'ac' ? fmtU(eff.U2) : fmtU(st.u2)}</span>
                                        {load && (
                                            <React.Fragment>
                                                <span className="si-lbl" style={{ marginTop: 4 }}>Ström sekundär <em style={{ textTransform: 'none' }}>I</em>₂</span>
                                                <span className="si-val" style={{ fontSize: 13, color: COL.sek }}>{kalla === 'ac' ? fmtI(eff.I2) : fmtI(st.i2)}</span>
                                            </React.Fragment>
                                        )}
                                        {kalla === 'dc' && (
                                            <span className="si-val" style={{ fontSize: 12, fontWeight: 600, marginTop: 4, color: 'var(--lab-ink-soft)' }}>
                                                {tr(dcPuls ? 'Flödet ändras: spänningsstöt' : 'Flödet ändras inte')}
                                            </span>
                                        )}
                                    </div>

                                    <div className="scene-hint">{tr(dim === '2d'
                                        ? 'Klicka på strömbrytaren för att slå av och på.'
                                        : 'Dra för att vrida scenen. Klicka på aggregatet eller lampan.')}</div>
                                    {sceneToggles()}

                                    <button className="fs-btn" onClick={toggleFullscreen} aria-label="Fullskärm" title={isFullscreen ? 'Lämna fullskärm' : 'Fullskärm'}>
                                        {isFullscreen ? (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M9 3v6H3" /><path d="M15 21v-6h6" /><path d="M21 9h-6V3" /><path d="M3 15h6v6" />
                                            </svg>
                                        ) : (
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M3 9V3h6" /><path d="M21 9V3h-6" /><path d="M3 15v6h6" /><path d="M21 15v6h-6" />
                                            </svg>
                                        )}
                                    </button>
                                </div>

                                <div className="glass-card rounded-xl p-3 mt-3">
                                    <div className="flex flex-wrap justify-between items-baseline gap-x-4 mb-1">
                                        <div className="flbl">Spänningarna och flödet</div>
                                        <div className="text-xs" style={{ color: 'var(--lab-ink-muted)' }}>
                                            Visas kraftigt nedsaktat. I vägguttaget byter spänningen riktning 100 gånger per sekund.
                                        </div>
                                    </div>
                                    <Graf buf={st.buf} U1={U1} U2ac={eff.U2ac} />
                                    <div className="text-xs mt-1" style={{ color: 'var(--lab-ink-soft)' }}>
                                        Spänningen <em>u</em>₂ är störst när flödet <em>Φ</em> ändras snabbast, och noll när flödet
                                        vänder. Det är flödesändringen som inducerar spänningen, inte flödet i sig.
                                    </div>
                                </div>
                            </div>

                            <div className="lg:w-2/5 order-2">
                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <div className="seg mb-3" style={{ gridTemplateColumns: '1fr 1fr' }}>
                                        <button className={dim === '2d' ? 'active' : ''} onClick={() => setDim('2d')}>2D<span className="sub">principskiss</span></button>
                                        <button className={dim === '3d' ? 'active' : ''} onClick={() => setDim('3d')}>3D<span className="sub">på labbänken</span></button>
                                    </div>
                                    {dim === '3d' && (
                                        <div className="seg mb-3" style={{ gridTemplateColumns: '1fr 1fr 1fr' }}>
                                            <button className={vy3 === 'snett' ? 'active' : ''} onClick={() => valjVy3('snett')}>Snett</button>
                                            <button className={vy3 === 'fram' ? 'active' : ''} onClick={() => valjVy3('fram')}>Framifrån</button>
                                            <button className={vy3 === 'ovan' ? 'active' : ''} onClick={() => valjVy3('ovan')}>Ovanifrån</button>
                                        </div>
                                    )}
                                    <div className="seg mb-3" style={{ gridTemplateColumns: '1fr 1fr' }}>
                                        <button className={kalla === 'ac' ? 'active' : ''} onClick={() => setKalla('ac')}>Växelspänning<span className="sub">som i vägguttaget</span></button>
                                        <button className={kalla === 'dc' ? 'active' : ''} onClick={() => setKalla('dc')}>Likspänning<span className="sub">som från ett batteri</span></button>
                                    </div>
                                    {reglage(Slider)}
                                    <div className="flex gap-2">
                                        <button className={`btn-toggle flex-1 text-sm ${till ? '' : 'active'}`} onClick={() => setTill(t => !t)}>
                                            {tr(till ? 'Slå av spänningen' : 'Slå på spänningen')}
                                        </button>
                                        <button className={`btn-toggle flex-1 text-sm ${running ? '' : 'active'}`} onClick={() => setRunning(r => !r)}>
                                            {tr(running ? 'Pausa' : 'Fortsätt')}
                                        </button>
                                    </div>
                                </div>

                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <div className="flbl mb-2">Beräkning av sekundärspänningen</div>
                                    <div className="flex flex-wrap items-center gap-x-2 gap-y-2" style={{ color: 'var(--lab-ink)', fontSize: 15 }}>
                                        <span><em>U</em>₂</span><span>=</span><span><em>U</em>₁</span><span>·</span>
                                        <Frac top={<span><em>N</em>₂</span>} bot={<span><em>N</em>₁</span>} />
                                        <span>=</span>
                                        <span style={{ whiteSpace: 'nowrap' }}>{fmtU(U1)}</span><span>·</span>
                                        <Frac top={fmtN(N2)} bot={fmtN(N1)} />
                                        <span>=</span>
                                        <span className="font-bold" style={{ color: COL.sek, whiteSpace: 'nowrap' }}>{fmtU(eff.U2ac)}</span>
                                    </div>
                                    <div className="text-xs mt-2" style={{ color: 'var(--lab-ink-soft)' }}>
                                        {N1 === N2 ? tr('Lika många varv: spänningen ändras inte.')
                                            : upp ? tr('Fler varv på sekundärsidan: spänningen transformeras upp {n} gånger.', { n: fmt(N2 / N1, N2 / N1 >= 10 ? 1 : 2) })
                                                  : tr('Färre varv på sekundärsidan: spänningen transformeras ner {n} gånger.', { n: fmt(N1 / N2, N1 / N2 >= 10 ? 1 : 2) })}
                                        {kalla === 'dc' && ' ' + tr('Men bara med växelspänning. Med likspänning blir det ingen spänning alls utom i till- och frånslaget.')}
                                    </div>
                                    <div className="grid grid-cols-2 gap-2 mt-3">
                                        <button className="btn-toggle text-sm" onClick={() => forval(230, 1150, 100)}>Exempel 1 ur teorin<span className="block text-xs font-normal">230 V till 20 V</span></button>
                                        <button className="btn-toggle text-sm" onClick={() => forval(10, 300, 1500)}>Demonstrationen<span className="block text-xs font-normal">300 och 1 500 varv</span></button>
                                        <button className="btn-toggle text-sm" onClick={() => forval(230, 1840, 40)}>Mobilladdare<span className="block text-xs font-normal">230 V till 5 V</span></button>
                                        <button className="btn-toggle text-sm" onClick={() => forval(230, 100, 1000)}>Tio gånger upp<span className="block text-xs font-normal">230 V till 2,3 kV</span></button>
                                    </div>
                                </div>

                                <div className="glass-card rounded-xl p-3 mb-3">
                                    <div className="flbl mb-2">Avläsning</div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <Readout label="Spänning primär <em>U</em>₁" value={fmtU(eff.U1)} color={COL.prim} />
                                        <Readout label="Spänning sekundär <em>U</em>₂" value={kalla === 'ac' ? fmtU(eff.U2) : fmtU(st.u2)} color={COL.sek} />
                                        <Readout label="Omsättning <em>N</em>₁ : <em>N</em>₂" value={ratioText} />
                                        {load && kalla === 'ac' ? (
                                            <React.Fragment>
                                                <Readout label="Effekt <em>P</em>" value={fmtP(eff.P)} />
                                                <Readout label="Ström primär <em>I</em>₁" value={fmtI(eff.I1)} color={COL.prim} />
                                                <Readout label="Ström sekundär <em>I</em>₂" value={fmtI(eff.I2)} color={COL.sek} />
                                                <Readout label="<em>U</em>₁ · <em>I</em>₁" value={fmtP(eff.U1 * eff.I1)} />
                                                <Readout label="<em>U</em>₂ · <em>I</em>₂" value={fmtP(eff.U2 * eff.I2)} />
                                            </React.Fragment>
                                        ) : <div />}
                                    </div>
                                    <div className="mt-2 p-2 rounded-lg text-xs" style={{ background: 'rgba(13,148,136,0.08)', color: 'var(--lab-ink-soft)' }}>
                                        {tr(kalla === 'dc'
                                            ? 'Med likspänning ändras flödet bara i ögonblicket när du slår till eller från. Då blir det en kort spänningsstöt i sekundärspolen, åt olika håll vid till- och frånslag. Resten av tiden induceras ingenting.'
                                            : !load
                                                ? 'Utan belastning går nästan ingen ström. Anslut lampan för att se strömmarna.'
                                                : 'Lägg märke till att effekten är densamma på båda sidor, U₁ · I₁ = U₂ · I₂. Transformatorn kan inte skapa energi: transformeras spänningen ner blir strömmen större i samma grad.')}
                                    </div>
                                </div>
                            </div>
                        </main>

                        <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-4 mt-6">
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Primär och sekundär</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Spolen som ansluts till den ingående spänningen kallas <strong>primärspole</strong>, och
                                    spolen där den nya spänningen induceras kallas <strong>sekundärspole</strong>. Järnkärnan
                                    leder det magnetiska flödet <em>Φ</em>, så att nästan allt flöde från primärspolen också
                                    går genom sekundärspolen.
                                </p>
                            </div>
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Bara växelspänning fungerar</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    En spänning induceras bara när flödet <strong>ändras</strong>. Växelströmmen byter
                                    riktning hela tiden, så flödet ändras hela tiden. Med likström blir flödet konstant, och
                                    då induceras ingenting. Välj Likspänning och slå av och på för att se det.
                                </p>
                            </div>
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Effekten bevaras</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Bortser vi från förluster är effekten lika stor på båda sidor,
                                    <span style={{ whiteSpace: 'nowrap' }}> <em>U</em>₁ · <em>I</em>₁ = <em>U</em>₂ · <em>I</em>₂</span>.
                                    Transformeras spänningen upp tio gånger blir strömmen en tiondel så stor. Därför är
                                    strömkvoten omvänd, <span style={{ whiteSpace: 'nowrap' }}><em>N</em>₁/<em>N</em>₂ = <em>I</em>₂/<em>I</em>₁</span>.
                                </p>
                            </div>
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Hög eller låg spänning?</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    En <strong>hög spänning med låg ström</strong> ger små förluster i ledningarna men större
                                    risk för urladdningar. En <strong>låg spänning med hög ström</strong> är säkrare men ger
                                    större förluster. Därför transformeras spänningen upp till hundratals kilovolt i
                                    kraftnätet och ner igen nära hemmen.
                                </p>
                            </div>
                        </div>

                        <details className="glass-card rounded-xl p-4 mt-4">
                            <summary className="accordion-head" style={{ color: 'var(--lab-ink)' }}>
                                <span>Var kommer formeln ifrån?</span><span style={{ color: 'var(--lab-ink-muted)' }}>▾</span>
                            </summary>
                            <div className="mt-3 text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                <p>
                                    Samma flödesändring går genom båda spolarna, och den inducerade spänningen i en spole
                                    är proportionell mot antalet varv:
                                </p>
                                <div className="flex flex-wrap items-center gap-x-2 my-3" style={{ color: 'var(--lab-ink)' }}>
                                    <span><em>e</em>₁ = −<em>N</em>₁ ·</span>
                                    <Frac size={14} top={<span>Δ<em>Φ</em></span>} bot={<span>Δ<em>t</em></span>} />
                                    <span className="mx-2" style={{ color: 'var(--lab-ink-muted)' }}>respektive</span>
                                    <span><em>e</em>₂ = −<em>N</em>₂ ·</span>
                                    <Frac size={14} top={<span>Δ<em>Φ</em></span>} bot={<span>Δ<em>t</em></span>} />
                                </div>
                                <p>
                                    Delar man uttrycken med varandra förkortas flödesändringen bort, och kvar
                                    står <span style={{ whiteSpace: 'nowrap' }}><em>e</em>₁/<em>e</em>₂ = <em>N</em>₁/<em>N</em>₂</span>.
                                    Eftersom transformatorns inre resistans är liten
                                    gäller <span style={{ whiteSpace: 'nowrap' }}><em>U</em>₁ ≈ <em>e</em>₁</span> och <span style={{ whiteSpace: 'nowrap' }}><em>U</em>₂ ≈ <em>e</em>₂</span>, alltså <span style={{ whiteSpace: 'nowrap' }}><em>N</em>₁/<em>N</em>₂ = <em>U</em>₁/<em>U</em>₂</span>.
                                    Strömsambandet följer sedan ur energiprincipen: <span style={{ whiteSpace: 'nowrap' }}><em>P</em>₁ = <em>P</em>₂</span> ger <span style={{ whiteSpace: 'nowrap' }}><em>U</em>₁ · <em>I</em>₁ = <em>U</em>₂ · <em>I</em>₂</span>.
                                </p>
                            </div>
                        </details>

                        <details className="glass-card rounded-xl p-4 mt-4">
                            <summary className="accordion-head" style={{ color: 'var(--lab-ink)' }}>
                                <span>Vanliga missuppfattningar</span><span style={{ color: 'var(--lab-ink-muted)' }}>▾</span>
                            </summary>
                            <ul className="mt-3 space-y-2 text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                <li><strong>"En transformator kan förstärka energin."</strong> Nej. Höjs spänningen sänks strömmen i samma grad. Effekten ut kan aldrig bli större än effekten in, och i verkligheten blir den något mindre på grund av förluster.</li>
                                <li><strong>"Den fungerar med likström också."</strong> Nej. En konstant ström ger ett konstant flöde, och utan flödesändring induceras ingen spänning i sekundärspolen. En verklig transformator kan dessutom bli förstörd av likspänning, eftersom bara spolens låga resistans då begränsar strömmen.</li>
                                <li><strong>"Fler varv är alltid bättre."</strong> Nej. Det är <em>förhållandet</em> mellan varvtalen som avgör spänningen. 1 150 : 100 ger exakt samma omsättning som 230 : 20.</li>
                                <li><strong>"Strömmen går från primärspolen till sekundärspolen."</strong> Nej. Spolarna har ingen elektrisk kontakt med varandra. Det enda som förbinder dem är det magnetiska flödet i järnkärnan. Titta på elektronerna: de stannar i sin egen krets.</li>
                            </ul>
                        </details>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script src="feedback.js" defer></script>
    <script src="sim-dock.js" defer></script>
    <script src="data/katalog.js"></script>
    <script src="section-nav.js"></script>
