<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Kopplingsschema — Fysiklabbet</title>
<meta name="description" content="Rita kopplingsscheman som i läroboken. Dra in komponenter, skriv in värden och kopiera bilden till ditt dokument.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500&family=Poppins:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f3eee4;
  --bg2: #ebe4d4;
  --panel: #fffdf9;
  --ink: #0f1620;
  --soft: #3f4a5c;
  --muted: #69655c;
  --line: rgba(15, 22, 32, 0.10);
  --line2: rgba(15, 22, 32, 0.20);
  --accent: #c8324a;
  --accent-soft: rgba(200, 50, 74, 0.08);
  --blue: #1c3d6b;
  --shadow: 0 1px 2px rgba(15, 22, 32, 0.05), 0 12px 32px -18px rgba(15, 22, 32, 0.28);
  --sans: "DM Sans", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --serif: "Instrument Serif", Georgia, serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background:
    radial-gradient(900px 500px at 12% -10%, rgba(200, 50, 74, 0.06), transparent 60%),
    radial-gradient(900px 600px at 100% 0%, rgba(28, 61, 107, 0.06), transparent 60%),
    var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font-family: inherit; }

/* ---------- Sidhuvud ---------- */
.top { display: flex; align-items: center; gap: 22px; padding: 14px 22px 12px; }
.brand { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--muted); font: 500 11px var(--mono); letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; }
.brand:hover { color: var(--ink); }
.brand svg { color: var(--accent); }
.titles { flex: 1; min-width: 0; padding-left: 20px; border-left: 1px solid var(--line2); }
.titles h1 { font-family: var(--serif); font-weight: 400; font-size: 34px; line-height: 1; margin: 0; letter-spacing: -.01em; }
.titles h1 em { color: var(--accent); }
.titles p { margin: 5px 0 0; color: var(--soft); font-size: 13.5px; }
.actions { display: flex; align-items: center; gap: 8px; }
.ibtn { width: 38px; height: 38px; flex: none; border-radius: 10px; border: 1px solid var(--line2); background: var(--panel); color: var(--ink); display: grid; place-items: center; cursor: pointer; transition: border-color .15s, background .15s, transform .15s; }
.ibtn:hover:not(:disabled) { border-color: var(--ink); }
.ibtn:active:not(:disabled) { transform: scale(.96); }
.ibtn:disabled { opacity: .32; cursor: default; }
.ibtn.danger:hover { border-color: var(--accent); color: var(--accent); }
.newbtn { height: 38px; padding: 0 13px 0 11px; border-radius: 10px; border: 1px solid var(--line2); background: var(--panel); color: var(--ink); display: inline-flex; align-items: center; gap: 7px; font: 600 13.5px var(--sans); cursor: pointer; transition: border-color .15s, transform .15s; margin-right: 4px; }
.newbtn:hover { border-color: var(--ink); }
.newbtn:active { transform: scale(.97); }
.newbtn svg { color: var(--soft); }
.split { display: inline-flex; position: relative; margin-left: 6px; }
.primary { height: 40px; padding: 0 16px 0 14px; border: 0; background: var(--ink); color: #fff; font: 600 14px var(--sans); display: inline-flex; align-items: center; gap: 9px; cursor: pointer; transition: background .15s; }
.primary:hover { background: #22324a; }
.split .primary:first-child { border-radius: 11px 0 0 11px; box-shadow: 0 8px 18px -10px rgba(15, 22, 32, .7); }
.split .more { border-radius: 0 11px 11px 0; padding: 0 11px; border-left: 1px solid rgba(255, 255, 255, .16); }
.menu { position: absolute; right: 0; top: calc(100% + 8px); width: 300px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 24px 48px -20px rgba(15, 22, 32, .45); padding: 8px; display: none; z-index: 40; }
.menu.open { display: block; animation: pop .16s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.98); } }
.mi { display: flex; align-items: flex-start; gap: 11px; width: 100%; padding: 9px 10px; border: 0; background: none; border-radius: 9px; font: 600 13.5px var(--sans); color: var(--ink); cursor: pointer; text-align: left; }
.mi svg { margin-top: 2px; flex: none; color: var(--soft); }
.mi:hover { background: var(--bg); }
.mi small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; margin-top: 1px; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px 8px; }
.mrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 10px; font-size: 13px; color: var(--soft); }
.menu .tgl { padding: 8px 10px 4px; }

/* ---------- Arbetsytan ---------- */
.app { display: grid; grid-template-columns: 214px minmax(0, 1fr) 296px; gap: 14px; padding: 0 22px 20px; height: calc(100vh - 84px); min-height: 520px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: auto; scrollbar-width: thin; }
.eyebrow { font: 500 10px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }

.palette { padding: 14px 12px 12px; }
.pal-g + .pal-g { margin-top: 16px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 8px; }
.tile { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 2px; padding: 7px 4px 8px; border-radius: 12px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: grab; user-select: none; -webkit-user-select: none; touch-action: pan-y; transition: transform .16s, box-shadow .16s, border-color .16s, color .16s; }
.tile:hover { transform: translateY(-2px); box-shadow: 0 12px 22px -14px rgba(15, 22, 32, .45); border-color: var(--line2); color: var(--accent); }
.tile:active { cursor: grabbing; transform: scale(.97); }
.tile svg { display: block; }
.tile span { font-size: 11.5px; color: var(--soft); text-align: center; line-height: 1.2; font-weight: 500; }
.pal-hint { font-size: 11.5px; line-height: 1.45; color: var(--muted); margin: 16px 4px 2px; }

.sheet { position: relative; min-width: 0; border-radius: 18px; border: 1px solid var(--line); background-color: #fffefb; box-shadow: var(--shadow); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
.sheet svg#svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; font-family: Poppins, Arial, sans-serif; }
.hit { fill: transparent; cursor: grab; transition: fill .12s; }
.hit:hover { fill: rgba(28, 61, 107, .06); }
.selbox { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; stroke-dasharray: 4 3; pointer-events: none; }
.zone { fill: #fff; stroke: var(--accent); stroke-width: 1.6; opacity: .75; pointer-events: none; }
.zone.par { stroke-dasharray: 3 2.5; fill: rgba(255, 255, 255, .8); }
.zone.near { fill: var(--accent); opacity: 1; stroke-dasharray: none; }
.zone.onto { fill: rgba(200, 50, 74, .08); stroke-dasharray: 4 3; opacity: 1; }
body.is-dragging, body.is-dragging * { cursor: grabbing !important; }
.sheet-tag { position: absolute; left: 16px; top: 14px; font: 500 10px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); pointer-events: none; }
.trash { position: absolute; left: 50%; bottom: 18px; transform: translate(-50%, 24px); opacity: 0; pointer-events: none; display: flex; align-items: center; gap: 9px; padding: 11px 18px; border-radius: 999px; background: #fff; border: 1.5px dashed rgba(200, 50, 74, .55); color: var(--accent); font: 600 13.5px var(--sans); box-shadow: var(--shadow); transition: opacity .18s, transform .18s, background .15s, color .15s; }
.sheet.can-trash .trash { opacity: 1; transform: translate(-50%, 0); }
.inline-ed { position: absolute; left: 0; top: 0; z-index: 20; display: none; align-items: baseline; gap: .28em; padding: .18em .5em .22em; background: #fff; border: 1.5px solid var(--accent); border-radius: .55em; box-shadow: 0 10px 24px -12px rgba(15, 22, 32, .45), 0 0 0 4px rgba(200, 50, 74, .10); font-family: Poppins, Arial, sans-serif; color: var(--ink); white-space: nowrap; }
.inline-ed.on { display: inline-flex; animation: iePop .14s ease-out; }
@keyframes iePop { from { opacity: 0; } }
.inline-ed i { font-style: italic; }
.inline-ed sub { font-size: .72em; vertical-align: -.25em; line-height: 0; }
.inline-ed .ie-eq { margin: 0 .05em 0 .25em; }
.inline-ed input { font: inherit; color: inherit; border: 0; outline: none; background: transparent; padding: 0; min-width: 2em; text-align: center; }
.inline-ed input::placeholder { color: #a39e93; }
.inline-ed .ie-unit { color: var(--soft); }
.inline-ed .ie-unit:empty { display: none; }
.inline-ed .ie-unit.pick { cursor: pointer; border-bottom: 1.5px dotted rgba(200, 50, 74, .6); padding: 0 .1em; border-radius: .2em; }
.inline-ed .ie-unit.pick:hover { background: var(--accent-soft); color: var(--accent); }
.unit-btn { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 8px; border-radius: 7px; border: 1px solid var(--line2); background: var(--bg); color: var(--ink); font: 600 13.5px var(--sans); cursor: pointer; }
.unit-btn:hover { border-color: var(--ink); }
.unit-btn svg { color: var(--muted); }
.unit input { padding-right: 70px; }
.unit-menu { position: fixed; z-index: 90; display: none; min-width: 170px; padding: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 20px 40px -18px rgba(15, 22, 32, .5); }
.unit-menu.on { display: block; animation: pop .14s ease-out; }
.unit-menu button { display: flex; align-items: baseline; gap: 10px; width: 100%; padding: 7px 10px; border: 0; background: none; border-radius: 8px; cursor: pointer; font: 400 13px var(--sans); color: var(--soft); text-align: left; }
.unit-menu button b { font: 600 14.5px Poppins, var(--sans); color: var(--ink); min-width: 2.4em; }
.unit-menu button:hover { background: var(--bg); }
.unit-menu button.on { background: var(--accent-soft); }
.unit-menu button.on b { color: var(--accent); }
.trash.hot { background: var(--accent); color: #fff; border-style: solid; transform: translate(-50%, 0) scale(1.06) !important; }
.ghost { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 60; color: var(--accent); filter: drop-shadow(0 10px 14px rgba(15, 22, 32, .22)); display: none; transition: opacity .12s; }
.ghost.on { display: block; }
.ghost.placed { opacity: 0; }
.ghost.trash { color: #8a8f98; opacity: .75; }
.ghost svg { display: block; }

.coach { position: absolute; left: 16px; bottom: 16px; max-width: 330px; display: none; align-items: flex-start; gap: 10px; padding: 12px 14px; background: var(--ink); color: #fff; border-radius: 14px; font-size: 13px; line-height: 1.45; box-shadow: 0 16px 30px -16px rgba(15, 22, 32, .6); }
.coach.on { display: flex; animation: pop .3s ease-out; }
.coach b { color: #ffd0d8; font-weight: 600; }
.coach .x { flex: none; background: none; border: 0; color: rgba(255, 255, 255, .6); cursor: pointer; padding: 0 0 0 4px; font: 600 12px var(--sans); }
.coach .x:hover { color: #fff; }
.coach-ghost { position: fixed; left: 0; top: 0; z-index: 55; pointer-events: none; color: var(--accent); display: none; opacity: 0; }
.coach-ghost.on { display: block; }
.coach-ghost .hand { position: absolute; right: -6px; bottom: -12px; }

/* ---------- Inspektören ---------- */
.inspector { padding: 16px 16px 18px; }
.ins-head { display: flex; align-items: center; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.ins-head.plain { padding-top: 2px; }
.ins-ico { width: 60px; height: 48px; flex: none; display: grid; place-items: center; border-radius: 12px; background: var(--bg); color: var(--ink); }
.ins-ico svg { width: 58px; height: 38px; }
.arrow-ico { color: var(--ink); }
.ins-t { flex: 1; min-width: 0; }
.ins-t h2 { margin: 3px 0 0; font-family: var(--serif); font-weight: 400; font-size: 24px; line-height: 1.05; }
.fld { margin-top: 15px; }
.fld > label { display: block; font-size: 12.5px; font-weight: 600; color: var(--soft); margin-bottom: 6px; }
.fld input { width: 100%; height: 40px; border-radius: 10px; border: 1px solid var(--line2); background: #fff; padding: 0 12px; font: 500 15px var(--sans); color: var(--ink); outline: none; transition: border-color .15s, box-shadow .15s; }
.fld input::placeholder { color: #a39e93; font-weight: 400; }
.fld input:focus { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(15, 22, 32, .08); }
.unit { position: relative; }
.unit input { padding-right: 42px; }
.unit span { position: absolute; right: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 600; font-size: 14px; pointer-events: none; }
.help { font-size: 12px; color: var(--muted); margin: 6px 2px 0; line-height: 1.4; }
.help.inline { margin: 0 0 0 4px; }
.help.note { margin: 2px 0 10px 45px; color: var(--accent); }
.help.calc, .help.calc-info { margin: 0 0 8px 41px; }
.help.calc-info { color: var(--muted); }
.row { display: flex; align-items: center; gap: 6px; }
.acts { margin-top: 12px; display: grid; gap: 8px; }
.acts:empty { display: none; }
.wbtn { display: flex; align-items: center; gap: 9px; width: 100%; height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line2); background: #fff; font: 500 13.5px var(--sans); color: var(--ink); cursor: pointer; transition: border-color .15s; }
.wbtn:hover { border-color: var(--ink); }
.wbtn:disabled { opacity: .38; cursor: default; border-color: var(--line2); }
.wbtn.sm { height: 34px; font-size: 12.5px; justify-content: center; padding: 0 8px; }
.span-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.zone.span { stroke-dasharray: 5 3; }
.wbtn svg { color: var(--soft); flex: none; }
.tgl { display: flex; align-items: center; gap: 11px; padding: 9px 0; cursor: pointer; position: relative; }
.tgl input { position: absolute; opacity: 0; pointer-events: none; }
.sw { width: 34px; height: 20px; border-radius: 20px; background: #d8d0bf; position: relative; flex: none; transition: background .18s; }
.sw::after { content: ''; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .25); transition: transform .18s; }
.tgl input:checked + .sw { background: var(--ink); }
.tgl input:checked + .sw::after { transform: translateX(14px); }
.tgl input:focus-visible + .sw { outline: 2px solid var(--accent); outline-offset: 2px; }
.tgl .tx { font-size: 14px; font-weight: 500; line-height: 1.25; }
.tgl .tx small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; margin-top: 1px; }
.tgl .tx i, .ins-t i { font-family: Poppins, sans-serif; }
.tgl.sub .sw { width: 30px; height: 18px; }
.tgl.sub .sw::after { width: 14px; height: 14px; }
.tgl.sub input:checked + .sw::after { transform: translateX(12px); }
.tgl.sub .tx { font-size: 13.5px; }
.grp { padding: 10px 0; border-bottom: 1px solid var(--line); }
.grp:last-child { border-bottom: 0; }
.grp > .eyebrow { margin: 6px 0 10px; }
.subgrp { margin-left: 14px; padding-left: 12px; border-left: 2px solid var(--line); transition: opacity .2s; }
.subgrp.off { opacity: .4; pointer-events: none; }
.optrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0 8px; font-size: 13.5px; font-weight: 500; }
.seg { display: inline-flex; background: var(--bg); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 6px 11px; border-radius: 8px; font: 500 13px var(--sans); color: var(--soft); cursor: pointer; transition: background .15s, color .15s; }
.seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(15, 22, 32, .16); }
.tpl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tpl { display: flex; flex-direction: column; align-items: stretch; gap: 5px; padding: 8px 8px 7px; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); cursor: pointer; transition: border-color .15s, transform .15s, box-shadow .15s; }
.tpl:hover { border-color: var(--line2); transform: translateY(-2px); box-shadow: 0 10px 20px -14px rgba(15, 22, 32, .4); }
.tpl svg { width: 100%; height: 50px; display: block; }
.tpl span { font-size: 11.5px; font-weight: 500; color: var(--soft); text-align: center; }
.tips ol { margin: 0; padding-left: 18px; font-size: 12.5px; line-height: 1.5; color: var(--soft); }
.tips li { margin-bottom: 5px; }
.tips b { color: var(--ink); font-weight: 600; }
.swap { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.swap-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 8px; }
.swap-b { height: 36px; border-radius: 9px; border: 1px solid var(--line); background: #fff; color: var(--soft); cursor: pointer; display: grid; place-items: center; padding: 0; transition: border-color .15s, color .15s; }
.swap-b:hover { border-color: var(--ink); color: var(--ink); }
.swap-b svg { width: 40px; height: 26px; }
.kbd-hint { font-size: 12px; color: var(--muted); line-height: 1.45; margin: 14px 2px 0; }

/* ---------- Toast ---------- */
.toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 30px); opacity: 0; pointer-events: none; background: var(--ink); color: #fff; padding: 12px 16px; border-radius: 13px; font-size: 13.5px; display: flex; gap: 12px; align-items: center; box-shadow: 0 18px 40px -16px rgba(15, 22, 32, .6); transition: opacity .22s, transform .22s; z-index: 80; max-width: calc(100vw - 32px); }
.toast.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast .tk { width: 22px; height: 22px; border-radius: 50%; background: #2f9e62; display: grid; place-items: center; flex: none; }
.toast .tk svg { width: 13px; height: 13px; }
.toast button { background: none; border: 0; color: #ffc7d0; font: 600 13.5px var(--sans); cursor: pointer; padding: 0 0 0 4px; }

/* ---------- Mindre skärmar ---------- */
@media (max-width: 1180px) {
  .app { grid-template-columns: 196px minmax(0, 1fr) 270px; }
}
@media (max-width: 900px) {
  body { overflow: auto; }
  .top { flex-wrap: wrap; padding: 12px 16px; gap: 12px; }
  .titles { order: 3; flex-basis: 100%; padding-left: 0; border-left: 0; }
  .titles h1 { font-size: 28px; }
  .actions { margin-left: auto; }
  .primary .lbl-long { display: none; }
  .newbtn span { display: none; }
  .newbtn { padding: 0; width: 38px; justify-content: center; margin-right: 0; }
  .app { grid-template-columns: 1fr; height: auto; padding: 0 12px 24px; gap: 10px; }
  .palette { order: 1; display: flex; gap: 14px; overflow-x: auto; padding: 10px 10px 8px; }
  .pal-g + .pal-g { margin-top: 0; }
  .tiles { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 86px; }
  .tile span { font-size: 10.5px; }
  .tile { touch-action: pan-x; }
  .pal-hint { display: none; }
  .sheet { order: 2; height: 58vh; min-height: 340px; }
  .inspector { order: 3; }
  .menu { position: fixed; left: 12px; right: 12px; top: 64px; width: auto; }
}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="../index.html" title="Till Fysiklabbet">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M3 6h7M14 6h7M3 6v12h18V6"/><path d="M10 2.5v7M14 4.5v3" stroke-width="2.4"/><rect x="8" y="15.5" width="8" height="5" fill="#fffdf9"/></svg>
    Fysiklabbet
  </a>
  <div class="titles">
    <h1>Kopplings<em>schema</em></h1>
    <p>Dra in komponenter på ledningarna. Schemat ordnar sig självt, precis som i läroboken.</p>
  </div>
  <div class="actions">
    <button class="newbtn" id="newBtn" title="Börja om med en tom krets" aria-label="Ny krets"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6.5A2.5 2.5 0 0 0 4 5.5v13A2.5 2.5 0 0 0 6.5 21h11a2.5 2.5 0 0 0 2.5-2.5V9z"/><path d="M14 3v6h6"/><path d="M12 12v6M9 15h6"/></svg><span>Ny krets</span></button>
    <button class="ibtn" id="undoBtn" title="Ångra (Ctrl+Z)" aria-label="Ångra"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="ibtn" id="redoBtn" title="Gör om (Ctrl+Y)" aria-label="Gör om"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    <div class="split">
      <button class="primary" id="copyBtn" title="Kopiera bilden (Ctrl+C)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="13" height="13" rx="2.5"/><path d="M16 8V5.5A2.5 2.5 0 0 0 13.5 3h-8A2.5 2.5 0 0 0 3 5.5v8A2.5 2.5 0 0 0 5.5 16H8"/></svg>
        <span>Kopiera <span class="lbl-long">bild</span></span>
      </button>
      <button class="primary more" id="moreBtn" aria-label="Fler sätt att spara" title="Fler sätt att spara"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="menu" id="exportMenu"></div>
    </div>
  </div>
</header>

<main class="app">
  <aside class="panel palette" id="palette" aria-label="Komponenter"></aside>
  <section class="sheet" id="sheet" aria-label="Kopplingsschemat">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg">
      <g id="cam"><g id="selg"></g><g id="ink"></g><g id="zones"></g><g id="hits"></g></g>
    </svg>
    <div class="sheet-tag">Ritytan</div>
    <div class="trash" id="trash"></div>
    <div class="inline-ed" id="inlineEd"><span class="ie-pre" id="iePre"></span><input id="ieInput" autocomplete="off" spellcheck="false" inputmode="decimal" aria-label="Värde"><span class="ie-unit" id="ieUnit"></span></div>
    <div class="coach" id="coach"><span><b>Kom igång:</b> dra en komponent från listan till en ledning. Allt fördelas jämnt av sig självt. Släpp den bredvid en komponent så parallellkopplas den.</span><button class="x" type="button" aria-label="Stäng tipset">Stäng</button></div>
  </section>
  <aside class="panel inspector" id="insp" aria-label="Egenskaper"></aside>
</main>

<div class="ghost" id="ghost"></div>
<div class="coach-ghost" id="coachGhost"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="kopplingsschema.js"></script>
</body>
</html>
