                                            {svarStatus && svarStatus !== 'kor' && <p className="text-sm mb-2" style={{ color: svarStatus.ratt ? '#15803d' : 'var(--lab-accent)' }}><Fx text={svarStatus.text} /></p>}
                                            <div className="flex gap-2">
                                                {svarStatus && svarStatus !== 'kor' && <button className="btn-toggle flex-1" onClick={() => startaGissa(gissa.typ)}>Ny uppgift</button>}
                                                <button className="btn-toggle flex-1" onClick={avslutaGissa} disabled={svarStatus === 'kor'}>Avsluta</button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </main>

                        <div className="grid md:grid-cols-3 gap-4 mt-6">
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Steg 1: hela systemet</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Se de sammankopplade föremålen som en enda kropp. Den resulterande kraften är de yttre krafterna längs rörelsen,
                                    till exempel den drivande tyngden minus de bromsande krafterna, och massan är alla föremålens massor tillsammans. Snörets krafter är inre
                                    krafter: räknat längs snöret drar de lika mycket åt båda hållen och tar ut varandra.
                                </p>
                            </div>
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Steg 2: ett föremål</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    För spännkraften frilägger man ett föremål. Då korsar snöret systemgränsen, och spännkraften blir en yttre kraft.
                                    Använd bara det föremålets massa. För en vikt som stiger är spännkraften större än tyngden, och för en vikt som sjunker är den mindre.
                                </p>
                            </div>
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Kontroll</h3>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Räkna spännkraften ur den andra vikten också: svaret ska bli detsamma. Med två hängande vikter hamnar
                                    spännkraften alltid mellan de två tyngderna, som kraftstaplarna visar. Är vikterna lika tunga och släpps från vila står
                                    systemet still, och spännkraften är lika med tyngden.
                                </p>
                            </div>
                        </div>

                        <details className="glass-card rounded-xl p-4 mt-4">
                            <summary className="accordion-head" style={{ color: 'var(--lab-ink)' }}>
                                <span>Vanliga missuppfattningar</span><span style={{ color: 'var(--lab-ink-muted)' }}>▾</span>
                            </summary>
                            <ul className="mt-3 space-y-2 text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                <li><strong>”Spännkraften är lika med den hängande viktens tyngd.”</strong> Bara när systemet står still. Sjunker vikten
                                    med acceleration är spännkraften mindre än tyngden, annars skulle vikten inte accelerera.</li>
                                <li><strong>”Man ska räkna med hela massan när man räknar ut spännkraften.”</strong> Nej. När man frilägger ett föremål
                                    är det bara det föremålets massa som accelereras av krafterna på det.</li>
                                <li><strong>”Spännkraften är olika stor i olika delar av snöret.”</strong> Inte i ett lätt snöre över friktionsfria trissor.
                                    Men två olika snören kan ha olika spännkraft, som i uppställningen med tre föremål.</li>
                                <li><strong>”Den tyngre vikten faller med accelerationen g.”</strong> Nej. Den andra vikten drar emot, och hela systemets massa ska
                                    accelereras, så accelerationen blir mindre än <em>g</em>.</li>
                            </ul>
                        </details>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script src="feedback.js" defer></script>
    <script src="sim-dock.js" defer></script>
    <script src="data/katalog.js"></script>
    <script src="section-nav.js"></script>

</body>
