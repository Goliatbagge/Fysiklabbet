        // Kursernas omslag: små ritningar i sajtens egen stil.
        // Banan är en lutad ellips kring planeten. Hastighetspilen följer
        // tangenten och börjar vid kroppens kant; kraftpilen pekar mot
        // planetens mitt och börjar i kroppens tyngdpunkt.
        const KonstFysik = () => {
            const cx = 290, cy = 96, rx = 120, ry = 43, fi = -18 * Math.PI / 180, t = 3.55;
            const rot = (x, y) => [x * Math.cos(fi) - y * Math.sin(fi), x * Math.sin(fi) + y * Math.cos(fi)];
            const [px0, py0] = rot(rx * Math.cos(t), ry * Math.sin(t));
            const P = [cx + px0, cy + py0];
            const [tx0, ty0] = rot(rx * Math.sin(t), -ry * Math.cos(t));
            const tl = Math.hypot(tx0, ty0), T = [tx0 / tl, ty0 / tl];
            const gl = Math.hypot(cx - P[0], cy - P[1]), G = [(cx - P[0]) / gl, (cy - P[1]) / gl];
            const kr = 8, huvud = 13;
            const pil = (start, dir, langd, farg) => {
                const spets = [start[0] + dir[0] * langd, start[1] + dir[1] * langd];
                const bas = [spets[0] - dir[0] * huvud, spets[1] - dir[1] * huvud];
                const n = [-dir[1], dir[0]];
                return (
                    <g>
                        <line x1={start[0]} y1={start[1]} x2={bas[0]} y2={bas[1]} stroke={farg} strokeWidth="3" strokeLinecap="butt" />
                        <polygon points={`${spets[0]},${spets[1]} ${bas[0] + n[0] * 6},${bas[1] + n[1] * 6} ${bas[0] - n[0] * 6},${bas[1] - n[1] * 6}`} fill={farg} />
                    </g>
                );
            };
            return (
                <svg viewBox="0 0 400 190" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
                    <g stroke="rgba(200,50,74,.26)" strokeWidth="1.2" fill="none">
                        {[60, 90, 150, 180].map((r, i) => <ellipse key={i} cx={cx} cy={cy} rx={r} ry={r * 0.36} transform={`rotate(-18 ${cx} ${cy})`} />)}
                    </g>
                    <ellipse cx={cx} cy={cy} rx={rx} ry={ry} transform={`rotate(-18 ${cx} ${cy})`} fill="none" stroke="#0f1620" strokeWidth="2" strokeDasharray="5 5" />
                    <circle cx={cx} cy={cy} r="30" fill="#c8324a" />
                    <circle cx={cx - 9} cy={cy - 10} r="9" fill="rgba(255,255,255,.35)" />
                    {pil(P, G, 58, '#c8324a')}
                    <circle cx={P[0]} cy={P[1]} r={kr} fill="#0f1620" />
                    {pil([P[0] + T[0] * kr, P[1] + T[1] * kr], T, 54, '#2563c9')}
                </svg>
            );
        };
        const KonstMatte = () => {
            const pts = [];
            for (let x = -4; x <= 4.001; x += 0.05) pts.push([200 + x * 38, 150 - (x * x) * 7.5]);
            const d = 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L');
            return (
                <svg viewBox="0 0 400 190" preserveAspectRatio="xMidYMid slice" aria-hidden="true">

                    </g>

                    <polygon points="388,145 398,150 388,155" fill="#1c3d6b" />
                    <line x1="200" y1="186" x2="200" y2="14" stroke="#1c3d6b" strokeWidth="1.6" />

        const KonstFortsattning = () => {

            const ytaPts = top.filter(p => p[0] >= 120 && p[0] <= 300);

        function Normalkurva() {
            // Samplas tätt ur täthetsfunktionen, så att kurvan blir mjuk.
            const W = 220, H = 74, x0 = 10, skala = 28;
            const y = x => H - 6 - 60 * Math.exp(-x * x / 2);
            const pts = [];
            for (let x = -3.6; x <= 3.601; x += 0.05) pts.push([x0 + (x + 3.6) * skala, y(x)]);
            const d = 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L');
            const mitt = pts.filter(p => p[0] >= x0 + 2.6 * skala - 0.01 && p[0] <= x0 + 4.6 * skala + 0.01);
            const yta = `M${mitt[0][0].toFixed(1)} ${H - 6} L` + mitt.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L') + ` L${mitt[mitt.length - 1][0].toFixed(1)} ${H - 6} Z`;
            return (
                <svg viewBox={`0 0 ${W} ${H + 4}`} aria-hidden="true">
                    <path d={yta} fill="rgba(200,50,74,.18)" />
                    <line x1="4" y1={H - 6} x2={W - 4} y2={H - 6} stroke="rgba(15,22,32,.35)" strokeWidth="1" />
                    <path d={d} fill="none" stroke="#c8324a" strokeWidth="2.2" />
                    <text x={W / 2} y={H - 16} textAnchor="middle" fontFamily="DM Sans, sans-serif" fontSize="12" fontWeight="600" fill="#ae243a">68&nbsp;%</text>
                </svg>
            );
        }

        // Rutan Pennlösningar kör den riktiga pennmotorn (handskrift.js) på
        // Exempel 2 i fy2-1.6, rymdteleskopet Hubble: pennan ritar först
        // figuren och räknar sedan fram banhöjden. Motorn är stor (2 MB), så
        // den hämtas först när rutan närmar sig skärmen; dessförinnan, och vid
        // reducerad rörelse, syns en stillbild av samma lösning. När lösningen
        // är klar står den kvar en stund och börjar sedan om.
        let hkLaddning = null;
        function laddaHandskrift() {
            if (window.HANDSKRIFT) return Promise.resolve();
            if (!hkLaddning) hkLaddning = new Promise((ok, fel) => {
                const sk = document.createElement('script');
                sk.src = 'handskrift.js?v=' + window.__CB;
                sk.onload = ok; sk.onerror = fel;
                document.head.appendChild(sk);
            });
            return hkLaddning;
        }

        function PennaLive() {
            const ark = useRef(null);
            const yta = useRef(null);
            const [igang, setIgang] = useState(false);
            useEffect(() => {
                const el = ark.current;
                if (!el || !('IntersectionObserver' in window)) return;
                if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
                let ctl = null, raf = 0, synlig = false, y = 0, mal = null, senast = 0,
                    klarSedan = 0, borjarOm = false, avbruten = false;
                // Arket följer pennan med en DÖDZON, som pennmotorns egen
                // helskärm: det står helt stilla medan pennan skriver i
                // rutans mittband och glider först när pennan närmar sig
                // under- eller överkanten, då till ett fast mål. Att sikta på
                // pennans exakta höjd i varje bildruta gjorde arket skakigt,
                // eftersom pennan rör sig upp och ned i varje bokstav.
                const ruta = (nu) => {
                    raf = requestAnimationFrame(ruta);
                    const dt = senast ? Math.min(nu - senast, 100) : 16;
                    senast = nu;
                    const svg = ctl && yta.current.querySelector('svg');
                    if (!svg) return;
                    const h = el.clientHeight, r = svg.getBoundingClientRect();
                    const penna = ctl.pennaY() - r.top;
                    const iRutan = penna - y;
                    if (iRutan > h * 0.72 || iRutan < h * 0.1)
                        mal = Math.max(0, Math.min(penna - h * 0.22, r.height - h));
                    if (mal != null) {
                        const d = mal - y;
                        if (Math.abs(d) < 0.5) { y = mal; mal = null; }
                        else y += d * (1 - Math.exp(-dt / 260));
                        yta.current.style.transform = `translateY(${(-y).toFixed(1)}px)`;
                    }
                    if (borjarOm || !ctl.klar()) { klarSedan = 0; return; }
                    if (!klarSedan) klarSedan = performance.now();
                    else if (performance.now() - klarSedan > 4000) {
                        borjarOm = true;
                        yta.current.classList.add('tonad');
                        setTimeout(() => {
                            if (avbruten) return;
                            ctl.restart(); y = 0; mal = null;
                            yta.current.style.transform = 'translateY(0px)';
                            if (!synlig) ctl.pause();
                            yta.current.classList.remove('tonad');
                            borjarOm = false;
                        }, 650);
                    }
                };
                const starta = () => {
                    if (!ctl) {
                        ctl = window.HANDSKRIFT.mount(yta.current, { typ: 'hubble' },
                            { autostart: true, stegvis: false, speed: 2 });
                        setIgang(true);
                    } else if (!ctl.klar()) ctl.play();
                    if (!raf) { senast = 0; raf = requestAnimationFrame(ruta); }
                };
                const io = new IntersectionObserver(([p]) => {
                    synlig = p.isIntersecting;
                    if (synlig) laddaHandskrift().then(() => { if (synlig && !avbruten) starta(); }).catch(() => {});
                    else if (ctl) { ctl.pause(); cancelAnimationFrame(raf); raf = 0; }
                }, { rootMargin: '200px 0px' });
                io.observe(el);
                return () => { avbruten = true; io.disconnect(); cancelAnimationFrame(raf); if (ctl) ctl.pause(); };
            }, []);
            return (
                <div className="ns-penna-ark" ref={ark}>
                    {!igang && <img src={BILD + 'penna-utdrag.webp'} alt="" />}
                    <div className="ns-penna-yta" ref={yta} aria-hidden="true" />
                    <span className="ns-penna-chip"><i />Exempel: Hubbles banhöjd</span>
                </div>
            );
        }

        function useInglidning() {
            useEffect(() => {
                const el = document.querySelectorAll('.ns-in');
                if (!('IntersectionObserver' in window)) { el.forEach(e => e.classList.add('synlig')); return; }
                const io = new IntersectionObserver((poster) => poster.forEach(p => {
                    if (p.isIntersecting) { p.target.classList.add('synlig'); io.unobserve(p.target); }
                }), { rootMargin: '0px 0px -8% 0px' });
                el.forEach(e => io.observe(e));
                return () => io.disconnect();
            }, []);
        }
