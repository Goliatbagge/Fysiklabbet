    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ── Konstanter ──────────────────────────────────────────────────
        // Spolen har längden l = 10 cm och radien 1,6 cm (radie/längd 0,16),
        // så att fältet mitt i den ligger nära värdet ur formeln för en lång
        // rak spole, B = μ0 · n · I / l (genomgången fy2-3.3).
        const MU0 = 4 * Math.PI * 1e-7;
        const L_M = 0.10;            // spolens längd (m)
        const A_N = 0.16;            // radie / längd
        const KARNA = 10;            // järnkärnans förstärkning (öppen stavkärna, l/d ≈ 3)
        const B_JORD = 1.6e-5;       // jordfältets vågräta del i Sverige (T), mot norr
        const AC_F = 0.35;           // växelströmmens frekvens i simuleringen (Hz, slow motion)
        const B_GEM = 2.5e-3;        // flödestätheten som krävs för att ett gem ska glida (T)
        const B_HALL = 1.0e-3;       // under detta släpper ett gem som sitter fast (kontakt håller bättre än avstånd drar)

        const COL = {
            falt: '#c0392b',         // fältlinjer
            npol: '#c0392b',         // nordända röd
            spol: '#f6f3ec',         // sydända vit
            strom: '#1f5fbf',        // ström blå
            ink: '#30363f',
            nal: '#5d646e',
            koppar: '#b8692f',
        };

        const fmt = (v, d) => {
            const s = v.toFixed(d);
            if (parseFloat(s) === 0) return '0';
            const [ip, fr] = s.split('.');
            const g = ip.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
            return fr !== undefined ? g + ',' + fr : g;
        };
        // Flödestäthet i mT med rimligt antal siffror
        const fmtB = (T) => {
            const v = Math.abs(T) * 1000;
            if (v >= 10) return fmt(v, 0);
            if (v >= 1) return fmt(v, 1);
            if (v >= 0.1) return fmt(v, 2);
            return fmt(v, 3);
        };

        // ── Fältmodell ──────────────────────────────────────────────────
        // Spolen är NM cirkulära strömslingor utlagda längs spolens längd.
        // Varje slingas fält räknas exakt (elliptiska integraler via AGM), och
        // summan läggs i en tabell över (|z|, ρ) i enheter av spolens längd.
        // Fältet anges i enheter av μ0 · n · I / l, så att en oändligt lång
        // spole skulle ge exakt 1 inuti. En stavmagnet med samma form och
        // magnetisering har PRECIS samma B-fält, och därför används samma
        // tabell i jämförelseläget.
        const NM = 32, TH = 0.025, ZM = 5, TN = Math.round(ZM / TH) + 1;
        const EPS = Math.pow(0.5 / NM, 2);

        const ellipKE = (m) => {
            let a = 1, b = Math.sqrt(Math.max(0, 1 - m)), c = Math.sqrt(m);
            let pow = 0.5, sum = pow * c * c;
            for (let i = 0; i < 14; i++) {
                const an = (a + b) / 2, bn = Math.sqrt(a * b);
                c = (a - b) / 2; a = an; b = bn;
                pow *= 2; sum += pow * c * c;
                if (Math.abs(c) < 1e-12) break;
            }
            const K = Math.PI / (2 * a);
            return [K, K * (1 - sum)];
        };
        const buildTable = () => {
            const bz = new Float32Array(TN * TN), br = new Float32Array(TN * TN);
            const a = A_N, I = 1 / NM;
            const zs = [];
            for (let k = 0; k < NM; k++) zs.push(-0.5 + (k + 0.5) / NM);
            for (let i = 0; i < TN; i++) {
                const z = i * TH;
                for (let j = 0; j < TN; j++) {
                    const rho = j * TH;
                    let sz = 0, sr = 0;
                    for (let k = 0; k < NM; k++) {
                        const dz = z - zs[k];
                        const D1 = (a + rho) * (a + rho) + dz * dz + EPS;
                        const D2 = (a - rho) * (a - rho) + dz * dz + EPS;
                        const [K, E] = ellipKE(4 * a * rho / D1);
                        const sq = Math.sqrt(D1);
                        sz += I / (2 * Math.PI) / sq * (K + (a * a - rho * rho - dz * dz) / D2 * E);
                        if (rho > 1e-6)
                            sr += I / (2 * Math.PI) * dz / (rho * sq) * (-K + (a * a + rho * rho + dz * dz) / D2 * E);
                    }
                    bz[i * TN + j] = sz; br[i * TN + j] = sr;
                }
            }
            return { bz, br };
        };
        let TAB = null;
        // Fält i punkten (z, r) i spolens enheter: z längs axeln, r tvärs
        // (positivt nedåt i bilden). Ger [Bx, By] i bildens riktningar för en
        // spole vars fält inuti pekar åt höger.
        const fieldNorm = (z, r) => {
            const az = Math.abs(z), ar = Math.abs(r);
            const sz = z < 0 ? -1 : 1, sr = r < 0 ? -1 : 1;
            if (az < ZM - TH && ar < ZM - TH) {
                const fx = az / TH, fy = ar / TH;
                const i = fx | 0, j = fy | 0, u = fx - i, v = fy - j;
                const k = i * TN + j;
                const T = TAB;
                const bz = (T.bz[k] * (1 - v) + T.bz[k + 1] * v) * (1 - u) + (T.bz[k + TN] * (1 - v) + T.bz[k + TN + 1] * v) * u;
                const br = (T.br[k] * (1 - v) + T.br[k + 1] * v) * (1 - u) + (T.br[k + TN] * (1 - v) + T.br[k + TN + 1] * v) * u;
                return [bz, br * sr * sz];
            }
            // långt bort: dipolfält med spolens magnetiska moment
            const R2 = z * z + r * r, R = Math.sqrt(R2);
            const c = Math.PI * A_N * A_N / (4 * Math.PI * R2 * R);
            const mr = z / R;
            return [c * (3 * mr * z / R - 1), c * (3 * mr * r / R)];
        };

        const mulberry = (seed) => () => {
            seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
            let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };

        // ── Formelkort ──────────────────────────────────────────────────
        const Vbl = ({ label, under, children }) => (
            <div className="flex flex-col items-center" style={{ lineHeight: 1.1 }}>
                <span className="flbl" style={under ? { visibility: 'hidden' } : {}} aria-hidden={under ? 'true' : undefined}>{label}</span>
                <span className="fnum">{children}</span>
                <span className="flbl" style={under ? {} : { visibility: 'hidden' }} aria-hidden={under ? undefined : 'true'}>{label}</span>
            </div>
        );
        const LFrac = ({ topLbl, top, botLbl, bot }) => (
            <div className="flex flex-col items-center" style={{ lineHeight: 1.15 }}>
                <span className="flbl brak-etikett">{topLbl}</span>
                <span className="fnum" style={{ padding: '0 3px 3px' }}>{top}</span>
                <span className="fnum" style={{ padding: '3px 3px 0', borderTop: '2px solid currentColor', alignSelf: 'stretch', textAlign: 'center' }}>{bot}</span>
                <span className="flbl brak-etikett">{botLbl}</span>
            </div>
        );
        const Frac = ({ top, bot }) => (
            <div className="flex flex-col items-center" style={{ lineHeight: 1.15 }}>
                <span className="fnum" style={{ padding: '0 3px 3px' }}>{top}</span>
                <span className="fnum" style={{ padding: '3px 3px 0', borderTop: '2px solid currentColor', alignSelf: 'stretch', textAlign: 'center' }}>{bot}</span>
            </div>
        );
        const FormulaCard = ({ n, I, core, ac }) => {
            const B = MU0 * n * I / L_M;
            return (
                <div className="formula-card glass-card rounded-xl p-4 mb-6 flex flex-wrap items-center gap-x-4 gap-y-3" style={{ color: 'var(--lab-ink)' }}>
                    <div className="fk-grupp">
                        <Vbl label="Flödestäthet"><em>B</em></Vbl>
                        <span className="fnum">=</span>
                        <Vbl label="Permeabilitet" under><em>μ</em><sub style={{ fontSize: 12 }}>0</sub></Vbl>
                        <span className="fnum">·</span>
                        <LFrac topLbl="Varv · ström" top={<React.Fragment><em>n</em> · <em>I</em></React.Fragment>}
                               botLbl="Längd" bot={<em>l</em>} />
                    </div>
                    <div className="fk-grupp">
                        <span className="fnum">=</span>
                        <span className="fnum">4<em>π</em> · 10<sup style={{ fontSize: 12 }}>−7</sup> ·</span>
                        <Frac top={<React.Fragment>{fmt(n, 0)} · {fmt(I, 1)}</React.Fragment>} bot={fmt(L_M, 2)} />
                        <span className="fnum">{'≈'} {fmtB(B)} mT</span>
                    </div>
                    <div style={{ color: 'var(--lab-ink-muted)', fontSize: 12.5, lineHeight: 1.45, maxWidth: 300 }}>
                        <em>μ</em><sub>0</sub> = 4<em>π</em> · 10<sup>−7</sup> T·m/A. Fältet inuti spolen, utan järnkärna.
                        {core === 'jarn' && <React.Fragment> Med järnkärnan blir det ungefär tio gånger starkare, cirka {fmtB(B * KARNA)} mT.</React.Fragment>}
                        {ac && <React.Fragment> Vid växelström är <em>I</em> strömmens toppvärde.</React.Fragment>}
                    </div>
                </div>
            );
        };

        const FORSOK = [
            { id: 'start', namn: 'Slå på strömmen',
              set: { on: true, ac: false, I: 1.5, n: 600, core: 'luft', kalla: 'spole' },
              text: 'Strömmen går genom spolen, och kompassnålarna nära den svänger in sig i ett fält som ser ut precis som en stavmagnets. Långt bort pekar nålarna fortfarande mot norr: där är jordens magnetfält starkare än spolens.' },
            { id: 'varv', namn: 'Fler varv, starkare fält',
              set: { on: true, ac: false, I: 1.5, n: 300, core: 'luft', kalla: 'spole' },
              text: 'Ställ provkompassen mitt i spolen och läs av <em>B</em>. Dra sedan varvtalet från 300 till 600: flödestätheten fördubblas. Samma sak händer om du fördubblar strömmen, eftersom <em>B</em> är proportionell mot både <em>n</em> och <em>I</em>.' },
            { id: 'jarn', namn: 'Järnkärnan lyfter gemen',
              set: { on: true, ac: false, I: 1.5, n: 600, core: 'luft', kalla: 'spole', gem: true },
              text: 'Utan järnkärna är fältet för svagt för att rubba gemen. Stoppa in järnkärnan: fältet blir ungefär tio gånger starkare, och de närmaste gemen dras till spolens ände. Öka strömmen så hämtar magneten gem längre bort. Slå av strömmen så släpper gemen.' },
            { id: 'stav', namn: 'Elektromagnet eller stavmagnet?',
              set: { on: true, ac: false, I: 1.5, n: 600, core: 'luft', kalla: 'stav' },
              text: 'En stavmagnet med samma form har exakt samma fält som spolen. Växla mellan dem och se att varken fältlinjerna eller kompassnålarna rör sig. Skillnaden är att elektromagnetens fält går att slå av, göra starkare och vända.' },
            { id: 'ac', namn: 'Växelström',
              set: { on: true, ac: true, I: 2, n: 600, core: 'jarn', kalla: 'spole', gem: true },
              text: 'Strömmen byter riktning hela tiden, och då byter nordändan och sydändan plats. Kompassnålarna svänger fram och tillbaka. Gemen dras ändå till spolen, eftersom järn dras till en magnet oavsett vilken pol som vetter mot det. Här går det i slow motion: elnätets ström byter riktning 100 gånger per sekund.' },
        ];

        // ── Huvudapp ────────────────────────────────────────────────────
        const App = () => {
            const q = new URLSearchParams(location.search);
            const [on, setOn] = useState(q.get('av') !== '1');
            const [ac, setAc] = useState(q.get('ac') === '1');
            const [I, setI] = useState(isFinite(parseFloat(q.get('i'))) ? Math.min(3, Math.max(0, parseFloat(q.get('i')))) : 1.5);
            const [n, setN] = useState(isFinite(parseFloat(q.get('n'))) ? Math.min(1000, Math.max(100, parseFloat(q.get('n')))) : 600);
            const [core, setCore] = useState(q.get('karna') === 'jarn' ? 'jarn' : 'luft');
            const [kalla, setKalla] = useState(q.get('kalla') === 'stav' ? 'stav' : 'spole');
            const [pol, setPol] = useState(q.get('vand') === '1' ? -1 : 1);
            const [wind, setWind] = useState(1);
            const [show, setShow] = useState({
                linjer: true, kompass: true, strom: true, poler: true,
                snitt: q.get('snitt') === '1', tumregel: q.get('tumregel') === '1', prov: true, gem: true,
            });
            const [lage, setLage] = useState(q.get('lage') === 'gissa' ? 'gissa' : 'fri');
            const [gissa, setGissa] = useState({ fas: 'fraga', pol: 1, wind: 1, svar: null });
            const [poang, setPoang] = useState({ ratt: 0, totalt: 0, svit: 0 });
            const [forsok, setForsok] = useState('start');
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [togglesOpen, setTogglesOpen] = useState(true);
            const [probeB, setProbeB] = useState(0);
            const [gemNyckel, setGemNyckel] = useState(0);

            const sceneWrapRef = useRef(null);
            const canvasRef = useRef(null);
            const stRef = useRef(null);
            const pRef = useRef({});
            const svaraRef = useRef(null);

            const gissar = lage === 'gissa';
            const effPol = gissar ? gissa.pol : pol;
            const effWind = gissar ? gissa.wind : wind;
            const effOn = gissar ? gissa.fas === 'svar' : on;
            const effAc = gissar ? false : ac;
            const effKalla = gissar ? 'spole' : kalla;
            pRef.current = { on: effOn, ac: effAc, I: gissar ? 1.5 : I, n: gissar ? 600 : n, core: gissar ? 'luft' : core,
                             kalla: effKalla, pol: effPol, wind: effWind, show, gissar, fas: gissa.fas, setOn };

            // ── Scenen ──────────────────────────────────────────────────
            useEffect(() => {
                const wrap = sceneWrapRef.current;
                const canvas = canvasRef.current;
                if (!wrap || !canvas) return;
                const ctx = canvas.getContext('2d');
                if (!TAB) TAB = buildTable();

                const st = {
                    W: 0, H: 0, dpr: 1, pw: 0, ph: 0, placed: false,
                    coil: { x: 0, y: 0 }, Lp: 200, ap: 32,
                    probe: { x: 0, y: 0, ang: -Math.PI / 2, w: 0 },
                    needles: [], clips: [],
                    lines: [], arrows: [], linesDirty: true,
                    drag: null, t: 0, phase: 0, lastInfo: 0, hover: null,
                };
                stRef.current = st;

                const sceneH = (w) => {
                    const narrow = window.matchMedia('(max-width: 600px)').matches;
                    const fs = document.fullscreenElement === wrap || document.webkitFullscreenElement === wrap;
                    if (fs) return narrow ? Math.round(window.innerHeight * 0.56) : wrap.clientHeight;
                    if (narrow) return Math.min(Math.round(w * 1.05), 470);
                    return wrap.clientHeight;
                };
                const geom = () => {
                    st.Lp = Math.round(Math.min(Math.max(st.W * 0.30, 150), 250));
                    st.ap = st.Lp * A_N;
                    st.sc = st.Lp / 220;
                };
                const placeClips = () => {
                    const c = st.coil, L = st.Lp;
                    const rel = [[0.80, 0.02, 0.4], [0.92, -0.19, -0.5], [1.05, 0.17, 1.2], [1.18, -0.04, 2.3], [1.33, 0.21, -1.1]];
                    st.clips = rel.map(([dx, dy, a], i) => ({
                        x: c.x + dx * L, y: c.y + dy * L, ang: a, vx: 0, vy: 0, stuck: null, i,
                    }));
                };
                const resize = () => {
                    const w = wrap.clientWidth, h = sceneH(w);
                    if (!w || !h) return;
                    if (w === st.W && h === st.H) return;
                    st.dpr = Math.min(window.devicePixelRatio || 1, 2);
                    canvas.width = Math.round(w * st.dpr); canvas.height = Math.round(h * st.dpr);
                    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
                    if (st.placed) {
                        const fx = w / st.pw, fy = h / st.ph;
                        st.coil.x *= fx; st.coil.y *= fy;
                        st.probe.x *= fx; st.probe.y *= fy;
                        st.clips.forEach((g) => { g.x *= fx; g.y *= fy; });
                    }
                    st.pw = w; st.ph = h; st.W = w; st.H = h;
                    geom();
                    if (!st.placed) {
                        st.coil.x = w * (w < 520 ? 0.42 : 0.40); st.coil.y = h * (w < 520 ? 0.40 : 0.47);
                        if (w < 520) { st.probe.x = w * 0.80; st.probe.y = h * 0.74; }
                        else { st.probe.x = st.coil.x - st.Lp * 0.5 - st.Lp * 0.36; st.probe.y = st.coil.y - st.ap * 2.6; }
                        placeClips();
                        st.placed = true;
                    }
                    clampCoil();
                    st.probe.x = Math.min(Math.max(st.probe.x, 30), w - 30);
                    st.probe.y = Math.min(Math.max(st.probe.y, 30), h - 30);
                    buildNeedles();
                    st.linesDirty = true;
                };
                const clampCoil = () => {
                    const mx = st.Lp / 2 + 30, my = st.ap + 34;
                    st.coil.x = Math.min(Math.max(st.coil.x, mx), st.W - mx);
                    st.coil.y = Math.min(Math.max(st.coil.y, my), st.H - my - 40);
                };
                const buildNeedles = () => {
                    st.needles = [];
                    const gap = st.W < 520 ? 40 : 50;
                    const nx = Math.floor(st.W / gap), ny = Math.floor(st.H / gap);
                    const ox = (st.W - (nx - 1) * gap) / 2, oy = (st.H - (ny - 1) * gap) / 2;
                    for (let i = 0; i < nx; i++)
                        for (let j = 0; j < ny; j++)
                            st.needles.push({ x: ox + i * gap, y: oy + j * gap, ang: -Math.PI / 2, w: 0 });
                };

                // nätaggregatets placering (nere till vänster)
                const supply = () => {
                    const s = st.W < 520 ? 0.74 : 1;
                    const w = 186 * s, h = 98 * s;
                    const x = 14, y = st.H - h - 14;
                    return {
                        s, x, y, w, h,
                        disp: { x: x + 12 * s, y: y + 12 * s, w: 132 * s, h: 34 * s },
                        sw: { x: x + 14 * s, y: y + 58 * s, w: 54 * s, h: 28 * s },
                        plus: { x: x + 118 * s, y: y + 72 * s },
                        minus: { x: x + 156 * s, y: y + 72 * s },
                        led: { x: x + 166 * s, y: y + 29 * s },
                    };
                };
                const coilEnds = () => {
                    const c = st.coil, L = st.Lp;
                    const fw = Math.max(6, L * 0.035);
                    const p = pRef.current;
                    const ext = p.core === 'jarn' && p.kalla === 'spole' ? L * 0.09 : (p.kalla === 'stav' ? 0 : fw);
                    return { fw, ext, left: c.x - L / 2, right: c.x + L / 2, outL: c.x - L / 2 - ext, outR: c.x + L / 2 + ext };
                };
                const leads = () => {
                    const c = st.coil, L = st.Lp, ap = st.ap;
                    return { L: { x: c.x - L / 2 + 10, y: c.y + ap }, R: { x: c.x + L / 2 - 10, y: c.y + ap } };
                };

                // fält i bildpunkt, i tesla, för given skalfaktor
                const coilB = (x, y, scale) => {
                    const [bx, by] = fieldNorm((x - st.coil.x) / st.Lp, (y - st.coil.y) / st.Lp);
                    return [bx * scale, by * scale];
                };

                // ── fältlinjer: slutna kurvor genom spolens inre ──
                const traceFrom = (x0, y0, sgn) => {
                    const pts = [[x0, y0]];
                    let x = x0, y = y0, len = 0;
                    const dir = (px, py) => {
                        const [bx, by] = fieldNorm((px - st.coil.x) / st.Lp, (py - st.coil.y) / st.Lp);
                        const nn = Math.hypot(bx, by) || 1;
                        return [sgn * bx / nn, sgn * by / nn];
                    };
                    const M = 90, ds = 3.2;
                    let closed = false;
                    for (let i = 0; i < 2600; i++) {
                        const k1 = dir(x, y);
                        const k2 = dir(x + 0.5 * ds * k1[0], y + 0.5 * ds * k1[1]);
                        const k3 = dir(x + 0.5 * ds * k2[0], y + 0.5 * ds * k2[1]);
                        const k4 = dir(x + ds * k3[0], y + ds * k3[1]);
                        const nx = x + ds * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]) / 6;
                        const ny = y + ds * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1]) / 6;
                        len += ds;
                        // tillbaka genom mittplanet, inne i spolen, på samma sida → sluten
                        if (len > 60 && (x - x0) * (nx - x0) <= 0 && Math.abs(ny - y0) < 6) {
                            pts.push([x0, y0]); closed = true; break;
                        }
                        x = nx; y = ny;
                        pts.push([x, y]);
                        if (x < -M || x > st.W + M || y < -M || y > st.H + M) break;
                    }
                    return { pts, closed };
                };
                const rebuildLines = () => {
                    st.lines = []; st.arrows = [];
                    const c = st.coil, ap = st.ap;
                    const K = 5;
                    const seeds = [0];
                    for (let i = 0; i < K; i++) { const r = ap * (i + 0.5) / K; seeds.push(-r, r); }
                    for (const r of seeds) {
                        const x0 = c.x, y0 = c.y + r;
                        const f = traceFrom(x0, y0, 1);
                        let pts = f.pts;
                        if (!f.closed) {
                            const b = traceFrom(x0, y0, -1).pts;
                            pts = b.slice(1).reverse().concat(pts);
                        }
                        st.lines.push(pts);
                        // pilspetsar mitt på linjen: där den korsar spolens mittplan
                        for (let i = 1; i < pts.length; i++) {
                            const a0 = pts[i - 1][0] - c.x, a1 = pts[i][0] - c.x;
                            if (a0 * a1 <= 0 && a0 !== a1) {
                                const yy = pts[i][1];
                                const inside = Math.abs(yy - c.y) < ap;
                                if (yy < -10 || yy > st.H + 10) continue;
                                // inuti bara en pil per linje (vid fröet)
                                if (inside && Math.abs(yy - y0) > 4) continue;
                                // inuti ligger linjerna tätt: pilar bara på axeln och på två linjer
                                if (inside && r !== 0 && Math.abs(Math.abs(r) / ap - 0.7) > 0.01) continue;
                                const ang = Math.atan2(pts[i][1] - pts[i - 1][1], pts[i][0] - pts[i - 1][0]);
                                if (!st.arrows.some((q) => Math.hypot(q.x - pts[i][0], q.y - yy) < 8))
                                    st.arrows.push({ x: c.x, y: yy, ang, inside });
                            }
                        }
                    }
                    st.linesDirty = false;
                };

                // ── Pekare ──
                const pos = (e) => { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
                const hitCoil = (x, y) => {
                    const e = coilEnds();
                    return x > e.outL - 6 && x < e.outR + 6 && Math.abs(y - st.coil.y) < st.ap + 12;
                };
                const hitSwitch = (x, y) => {
                    const S = supply().sw;
                    return x > S.x - 6 && x < S.x + S.w + 6 && y > S.y - 6 && y < S.y + S.h + 6;
                };
                const onDown = (e) => {
                    const [x, y] = pos(e);
                    const p = pRef.current;
                    if (p.gissar && p.fas === 'fraga') {
                        if (hitCoil(x, y)) { svaraRef.current && svaraRef.current(x < st.coil.x ? 'v' : 'h'); return; }
                    }
                    if (p.show.prov && Math.hypot(x - st.probe.x, y - st.probe.y) < 30) {
                        st.drag = { what: 'probe', dx: st.probe.x - x, dy: st.probe.y - y };
                    } else if (!p.gissar && p.show.gem && p.kalla === 'spole' &&
                               st.clips.some((g) => Math.hypot(x - g.x, y - g.y) < 16 * st.sc + 4)) {
                        let best = null, bd = 1e9;
                        st.clips.forEach((g) => { const d = Math.hypot(x - g.x, y - g.y); if (d < bd) { bd = d; best = g; } });
                        best.stuck = null; best.vx = 0; best.vy = 0; best.held = true;
                        st.drag = { what: 'clip', g: best, dx: best.x - x, dy: best.y - y };
                    } else if (!p.gissar && p.kalla === 'spole' && hitSwitch(x, y)) {
                        p.setOn((v) => !v);
                        return;
                    } else if (hitCoil(x, y)) {
                        st.drag = { what: 'coil', dx: st.coil.x - x, dy: st.coil.y - y };
                    }
                    if (st.drag) { canvas.setPointerCapture(e.pointerId); e.preventDefault(); }
                };
                const onMove = (e) => {
                    const [x, y] = pos(e);
                    if (!st.drag) {
                        const p = pRef.current;
                        let cur = 'default';
                        if (p.gissar && p.fas === 'fraga' && hitCoil(x, y)) { cur = 'pointer'; st.hover = x < st.coil.x ? 'v' : 'h'; }
                        else {
                            st.hover = null;
                            if ((p.show.prov && Math.hypot(x - st.probe.x, y - st.probe.y) < 30) || hitCoil(x, y)) cur = 'grab';
                            else if (!p.gissar && p.kalla === 'spole' && hitSwitch(x, y)) cur = 'pointer';
                        }
                        canvas.style.cursor = cur;
                        return;
                    }
                    if (st.drag.what === 'probe') {
                        st.probe.x = Math.min(Math.max(x + st.drag.dx, 30), st.W - 30);
                        st.probe.y = Math.min(Math.max(y + st.drag.dy, 30), st.H - 30);
                    } else if (st.drag.what === 'clip') {
                        const g = st.drag.g;
                        g.x = Math.min(Math.max(x + st.drag.dx, 12), st.W - 12);
                        g.y = Math.min(Math.max(y + st.drag.dy, 12), st.H - 12);
                    } else {
                        const ox = st.coil.x, oy = st.coil.y;
                        st.coil.x = x + st.drag.dx; st.coil.y = y + st.drag.dy;
                        clampCoil();
                        const dx = st.coil.x - ox, dy = st.coil.y - oy;
                        st.clips.forEach((g) => { if (g.stuck) { g.x += dx; g.y += dy; } });
                        st.linesDirty = true;
                    }
                };
                const onUp = (e) => {
                    if (st.drag && st.drag.what === 'clip') st.drag.g.held = false;
                    st.drag = null;
                    try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
                };
                const onLeave = () => { st.hover = null; };
                canvas.addEventListener('pointerdown', onDown);
                canvas.addEventListener('pointermove', onMove);
                canvas.addEventListener('pointerup', onUp);
                canvas.addEventListener('pointercancel', onUp);
                canvas.addEventListener('pointerleave', onLeave);
                st.resetClips = () => { placeClips(); };

                const ro = new ResizeObserver(resize);
                ro.observe(wrap);
                resize();

                // ── Ritverktyg ──
                const rr = (x, y, w, h, r) => {
                    ctx.beginPath();
                    if (!r) { ctx.rect(x, y, w, h); return; }
                    ctx.moveTo(x + r, y);
                    ctx.arcTo(x + w, y, x + w, y + h, r);
                    ctx.arcTo(x + w, y + h, x, y + h, r);
                    ctx.arcTo(x, y + h, x, y, r);
                    ctx.arcTo(x, y, x + w, y, r);
                    ctx.closePath();
                };
                const drawPaper = () => {
                    const g = ctx.createLinearGradient(0, 0, 0, st.H);
                    g.addColorStop(0, '#f7f2e8'); g.addColorStop(1, '#ece3d2');
                    ctx.fillStyle = g; ctx.fillRect(0, 0, st.W, st.H);
                    ctx.strokeStyle = 'rgba(96,130,175,0.16)'; ctx.lineWidth = 1;
                    ctx.beginPath();
                    for (let x = 25; x < st.W; x += 25) { ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, st.H); }
                    for (let y = 25; y < st.H; y += 25) { ctx.moveTo(0, y + 0.5); ctx.lineTo(st.W, y + 0.5); }
                    ctx.stroke();
                };
                const needleShape = (r) => {
                    ctx.beginPath();
                    ctx.moveTo(r, 0); ctx.lineTo(0, -r * 0.26); ctx.lineTo(0, r * 0.26);
                    ctx.closePath();
                };
                const drawCompass = (x, y, ang, r, bezel, alpha) => {
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.globalAlpha = alpha == null ? 1 : alpha;
                    ctx.beginPath(); ctx.arc(0, 0, r, 0, 2 * Math.PI);
                    ctx.fillStyle = bezel ? '#fdfaf3' : 'rgba(253,250,243,0.7)'; ctx.fill();
                    ctx.lineWidth = bezel ? 2.2 : 1;
                    ctx.strokeStyle = bezel ? '#5d646e' : 'rgba(93,100,110,0.5)'; ctx.stroke();
                    if (bezel) {
                        ctx.strokeStyle = 'rgba(93,100,110,0.5)'; ctx.lineWidth = 1.4;
                        for (let k = 0; k < 8; k++) {
                            const t = k * Math.PI / 4, l = k % 2 === 0 ? 5 : 3;
                            ctx.beginPath();
                            ctx.moveTo(Math.cos(t) * (r - 2.5), Math.sin(t) * (r - 2.5));
                            ctx.lineTo(Math.cos(t) * (r - 2.5 - l), Math.sin(t) * (r - 2.5 - l));
                            ctx.stroke();
                        }
                    }
                    ctx.rotate(ang);
                    ctx.fillStyle = COL.npol; needleShape(r * 0.82); ctx.fill();
                    ctx.rotate(Math.PI);
                    ctx.fillStyle = COL.nal; needleShape(r * 0.82); ctx.fill();
                    ctx.rotate(-Math.PI);
                    ctx.beginPath(); ctx.arc(0, 0, bezel ? 2.6 : 1.6, 0, 2 * Math.PI);
                    ctx.fillStyle = '#30363f'; ctx.fill();
                    ctx.restore();
                };
                const chevron = (x, y, ang, s, color) => {
                    ctx.save();
                    ctx.translate(x, y); ctx.rotate(ang);
                    ctx.fillStyle = color;
                    ctx.beginPath();
                    ctx.moveTo(4.5 * s, 0); ctx.lineTo(-3.5 * s, -3.6 * s); ctx.lineTo(-1.6 * s, 0); ctx.lineTo(-3.5 * s, 3.6 * s);
                    ctx.closePath(); ctx.fill();
                    ctx.restore();
                };
                const bez = (P0, P1, P2, P3, N) => {
                    const pts = [];
                    for (let i = 0; i <= N; i++) {
                        const t = i / N, u = 1 - t;
                        pts.push([u * u * u * P0.x + 3 * u * u * t * P1.x + 3 * u * t * t * P2.x + t * t * t * P3.x,
                                  u * u * u * P0.y + 3 * u * u * t * P1.y + 3 * u * t * t * P2.y + t * t * t * P3.y]);
                    }
                    return pts;
                };
                const wirePath = (T, P) => {
                    const dy = T.y - P.y;
                    return bez(T, { x: T.x, y: T.y - Math.max(30, dy * 0.45) }, { x: P.x, y: P.y + Math.max(40, dy * 0.55) }, P, 40);
                };
                const strokePts = (pts) => {
                    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
                    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
                    ctx.stroke();
                };
                // pilar längs en polylinje, förskjutna med fasen
                const flowAlong = (pts, phase, dir, s) => {
                    const seg = []; let tot = 0;
                    for (let i = 1; i < pts.length; i++) {
                        const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
                        seg.push(l); tot += l;
                    }
                    const gap = 30;
                    let o = ((phase * dir) % gap + gap) % gap;
                    for (let d = o + 8; d < tot - 8; d += gap) {
                        let acc = 0, i = 0;
                        while (i < seg.length && acc + seg[i] < d) { acc += seg[i]; i++; }
                        if (i >= seg.length) break;
                        const t = (d - acc) / seg[i];
                        const a = pts[i], b = pts[i + 1];
                        let ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
                        if (dir < 0) ang += Math.PI;
                        chevron(a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, ang, s, COL.strom);
                    }
                };

                const drawSupply = (p, I, iNow) => {
                    const S = supply(), s = S.s;
                    ctx.save();
                    // skugga + låda
                    ctx.fillStyle = 'rgba(15,22,32,0.16)'; rr(S.x + 3, S.y + 5, S.w, S.h, 10 * s); ctx.fill();
                    const g = ctx.createLinearGradient(0, S.y, 0, S.y + S.h);
                    g.addColorStop(0, '#4a5462'); g.addColorStop(1, '#323a46');
                    ctx.fillStyle = g; rr(S.x, S.y, S.w, S.h, 10 * s); ctx.fill();
                    ctx.strokeStyle = '#1f252e'; ctx.lineWidth = 1.2; ctx.stroke();
                    // display
                    const D = S.disp;
                    ctx.fillStyle = '#171c22'; rr(D.x, D.y, D.w, D.h, 4 * s); ctx.fill();
                    ctx.fillStyle = p.on ? '#ffc76a' : '#5c5446';
                    ctx.font = `600 ${Math.round(17 * s)}px 'JetBrains Mono', monospace`;
                    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
                    const shown = p.on ? (p.ac ? Math.abs(iNow) : I) : 0;
                    ctx.fillText(fmt(shown, 2) + ' A', D.x + 8 * s, D.y + D.h / 2 + 1);
                    ctx.font = `600 ${Math.round(10 * s)}px Poppins, sans-serif`;
                    ctx.textAlign = 'right';
                    ctx.fillStyle = p.on ? '#ffc76a' : '#5c5446';
                    ctx.fillText(p.ac ? 'AC' : 'DC', D.x + D.w - 7 * s, D.y + D.h / 2 + 1);

                    ctx.beginPath(); ctx.arc(S.led.x, S.led.y, 5 * s, 0, 2 * Math.PI);
