                                    <button className="btn-toggle" onClick={clearScreen}>Rensa skärmen</button>
                                    {measureZ != null && <button className="btn-toggle" onClick={clearMeasure}>Ta bort markören</button>}
                                </div>
                            </React.Fragment>
                        )}
                    </div>
                );
            };

            return (
                <div className="min-h-screen dark-container px-4 md:px-8 pb-12" style={{ fontFamily: 'Poppins, sans-serif' }}>
                    <div className="max-w-6xl mx-auto pt-6">
                        <div className="breadcrumb mb-4" style={{ fontSize: 13 }}>
                            <a href="index.html">Hem</a> / <a href="katalog.html#fy2">Fysik nivå 2</a> / Dubbelspalten i 3D
                        </div>
                        <div className="intro-head">
                            <h1 className="text-3xl md:text-4xl font-black tracking-tight" style={{ color: 'var(--lab-ink)' }}>Dubbelspalten i 3D</h1>
                        </div>
                        <p className="mt-2 mb-5" style={{ color: 'var(--lab-ink-soft)', maxWidth: 820 }}>
                            En laser lyser mot en platta med två smala spalter, och på skärmen bakom
                            uppstår <strong>interferensmönstret</strong>: ljusa band där vågorna från de
                            två spalterna kommer i fas och mörka där de släcker ut varandra. Vågytan på
                            golvet visar hur de två vågsystemen breder ut sig och möts, och banden på
                            skärmen ligger exakt där vågtopparna träffar den. Byt till <strong>en
                            partikel i taget</strong> och se samma mönster växa fram, prick för prick.
                            Sätt sedan en <strong>detektor</strong> vid spalterna som registrerar vilken
                            spalt varje partikel går genom, och se banden försvinna: mäts vägen beter sig
                            partikeln som en partikel, mäts den inte som en våg. Klicka på skärmen för
                            att mäta vägskillnaden, och kryssa i maximilinjerna för att se gitterformeln
                            ritad i rummet.

                        {/* Pedagogiska sektioner */}
                        <div className="grid md:grid-cols-2 gap-4 mt-6">
                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Vad visar vågytan?</h3>
                                <p className="text-sm mb-2" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Vågytan är samma bild som vattenvågorna i genomgången, fast i tre
                                    dimensioner: en plan våg kommer från vänster, och varje spalt blir en
                                    ny vågkälla som sänder ut halvcirkelformade vågfronter. Bakom plattan
                                    överlappar de två vågsystemen. Där vågtopp möter vågtopp blir
                                    utslaget dubbelt så stort, där vågtopp möter vågdal blir det noll.
                                </p>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Titta ovanifrån och följ de lugna stråken där ytan är nästan stilla:
                                    det är nodlinjerna, och de träffar skärmen precis i de mörka banden.
                                    Mellan dem ligger maximilinjerna, där vågen slår som högst hela vägen
                                    fram till skärmens ljusa band.
                                </p>
                            </div>

                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>En partikel i taget</h3>
                                <p className="text-sm mb-2" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Skruva ner till några partiklar per sekund. Varje foton eller elektron
                                    träffar skärmen i <strong>en enda punkt</strong>, som en partikel. Men
                                    punkterna hamnar inte var som helst: efter några hundra träffar har de
                                    ritat exakt samma band som vågorna gav. Var en enskild partikel landar
                                    går inte att förutsäga, bara sannolikheten, och sannolikheten är
                                    vågens intensitet.
                                </p>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Välj <em>Tankeexperiment: vanliga små kulor</em> för att se hur det
                                    <strong> hade sett ut om</strong> ljus och elektroner inte hade någon
                                    vågnatur alls, utan vore små kulor som skjuts en och en: varje kula
                                    går genom den ena spalten eller den andra och fortsätter rakt fram,
                                    så det blir två smala streck, ett bakom varje spalt och lika brett som
                                    spalten, och inga mörka band.
                                    Det är alltså inte ett verkligt utfall utan en jämförelse, och det
                                    är just skillnaden mot det verkliga mönstret som visar att
                                    partiklarna beter sig som vågor.
                                </p>
                            </div>

                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Detektor vid spalterna</h3>
                                <p className="text-sm mb-2" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Välj <em>Detektor: vilken spalt?</em> Två givare sätts intill spalterna,
                                    och varje gång en partikel passerar blinkar lampan vid den spalt den
                                    gick genom. Nu har varje partikel en bestämd väg, och den flyger
                                    synligt från sin spalt till skärmen. Räkna in träffarna: ungefär
                                    hälften genom A, hälften genom B, och på skärmen finns
                                    <strong> inga mörka band längre</strong>. Mönstret är i stället summan av
                                    de två spalternas egna diffraktionsmönster, ett brett ljust fält.
                                </p>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Detta är det verkliga experimentets mest berömda resultat. Observeras
                                    vägen beter sig elektronen som en partikel som gått genom en spalt;
                                    observeras den inte går den som en våg genom båda och interfererar
                                    med sig själv. Det är inte detektorns knuff som suddar ut banden,
                                    utan att informationen om vägen finns: en mätning som kunde avslöja
                                    spalten räcker, hur skonsam den än är. Att det inte blir två skarpa
                                    streck beror på att partikeln fortfarande har sin våglängd och
                                    diffrakterar genom den spalt den passerar: spalterna är smala i
                                    förhållande till avståndet mellan dem, så varje spalts eget ljus
                                    sprids ut över hela skärmen. Så är det också i verkliga försök, både
                                    med laser och med elektroner. Två åtskilda fält kräver att varje
                                    spalts diffraktionsbredd, ungefär <em>ℓ</em> · <em>λ</em>/<em>b</em>, är mindre
                                    än spaltavståndet <em>d</em>. Det färdiga försöket <em>Två skilda fält</em>
                                    ställer in just det: breda spalter långt isär, kort våglängd och
                                    skärmen nära.
                                </p>
                            </div>

                            <div className="glass-card rounded-xl p-4">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Gitterformeln i scenen</h3>
                                <p className="text-sm mb-2" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Kryssa i <em>Maximilinjer</em>. Från mitten mellan spalterna går en
                                    linje till varje ljust band, och vinkeln mellan centrallinjen och
                                    linjen till första maximet är avböjningsvinkeln <em>α</em><sub>1</sub>.
                                    Gitterformeln säger att sin <em>α</em><sub><em>n</em></sub> = <em>n</em> · <em>λ</em>/<em>d</em>:
                                    längre våglängd eller mindre spaltavstånd ger större vinklar och glesare band.
                                </p>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Prova: dra våglängden från blått till rött och se banden glida isär
                                    medan färgen ändras. Dra sedan ihop spalterna, så sprids banden ännu
                                    mer. Blir <em>λ</em> större än <em>d</em> försvinner sidomaxima helt,
                                    precis som formeln förutsäger, eftersom sin <em>α</em> aldrig kan bli större än 1.
                                </p>
                            </div>

                            <div className="glass-card rounded-xl p-4 md:col-span-2">
                                <h3 className="font-bold mb-2" style={{ color: 'var(--lab-ink)' }}>Täck för en spalt</h3>
                                <p className="text-sm mb-2" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Stäng spalt B. Kvar blir en enkelspalt, och interferensbanden
                                    försvinner: skärmen visar i stället ett brett, mjukt centralt maximum
                                    med svaga sidomaxima, diffraktionsmönstret från en enda spalt. Öppna
                                    spalten igen och banden är tillbaka, inne i samma breda kupa.
                                </p>
                                <p className="text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                    Det är därför de yttre banden i dubbelspaltmönstret alltid är svagare:
                                    varje spalts diffraktion bestämmer hur mycket ljus som når ut åt
                                    sidorna, och dubbelspaltens interferens delar upp det ljuset i band.
                                    Med smalare spalter (mindre <em>b</em>) blir kupan bredare och fler band syns.
                                </p>
                            </div>
                        </div>

                        <details className="glass-card rounded-xl p-4 mt-4">
                            <summary className="accordion-head" style={{ color: 'var(--lab-ink)' }}>
                                <span>Om storleken i scenen</span><span style={{ color: 'var(--lab-ink-muted)' }}>▾</span>
                            </summary>
                            <p className="mt-3 text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                Scenen är i mikrometerskala: spalterna sitter några mikrometer isär och
                                skärmen står några tiotal mikrometer bort, alltså tusen gånger närmare än i
                                en vanlig laboration. Alla mått är riktiga, och gitterformeln gäller precis
                                som vanligt. Den lilla uppställningen är vald för att vinklarna ska bli
                                stora nog att se: med en labbdubbelspalt på 0,1 mm och en skärm 2 m bort
                                är första maximets vinkel bara 0,4°, och vågorna på golvet skulle vara
                                omöjliga att urskilja. Elektronernas våglängd i scenen svarar mot ganska
                                långsamma elektroner, kring tusen meter per sekund. I det klassiska
                                elektronexperimentet är elektronerna mycket snabbare, våglängden tusentals
                                gånger kortare och spalterna därför mycket smalare, men bilden är densamma.
                            </p>
                        </details>

                        <details className="glass-card rounded-xl p-4 mt-4">
                            <summary className="accordion-head" style={{ color: 'var(--lab-ink)' }}>
                                <span>Vanliga missuppfattningar</span><span style={{ color: 'var(--lab-ink-muted)' }}>▾</span>
                            </summary>
                            <ul className="mt-3 space-y-2 text-sm" style={{ color: 'var(--lab-ink-soft)' }}>
                                <li><strong>&quot;Banden uppstår för att partiklarna krockar med varandra.&quot;</strong> Mönstret växer fram också när partiklarna skickas en i taget, med lång tid emellan. Varje partikel interfererar med sig själv, inte med andra.</li>
                                <li><strong>&quot;Ljuset går genom den ena spalten eller den andra.&quot;</strong> Om det vore så skulle mönstret bli summan av två enkelspaltmönster, utan mörka band. Täck för en spalt i taget och lägg ihop bilderna: det blir aldrig dubbelspaltens mönster.</li>
                                <li><strong>&quot;Längre skärmavstånd ger större vinklar.&quot;</strong> Vinklarna bestäms enbart av <em>λ</em> och <em>d</em>. Ett längre avstånd gör bara att samma vinklar ger större avstånd på skärmen, <em>x</em> = <em>ℓ</em> · tan <em>α</em>.</li>
                                <li><strong>&quot;Med detektor blir partikeln en kula som går rakt fram, så skärmen visar två streck.&quot;</strong> Nej. Detektorn tar bort interferensen mellan de två vägarna, men partikeln har kvar sin våglängd och diffrakterar genom den spalt den faktiskt passerar, precis som i enkelspaltförsöket. Därför blir fältet brett. Två smala streck är kul-tankeexperimentets bild, där vågnaturen är helt borttagen. Först med breda spalter långt isär, kort våglängd och en nära skärm blir varje spalts eget mönster smalt nog för att synas som två skilda fält.</li>
                                <li><strong>&quot;Detektorn stör partikeln mekaniskt, därför försvinner banden.&quot;</strong> Det avgörande är inte hur hårt detektorn påverkar partikeln utan att den ger information om vägen. Så snart det i princip går att veta vilken spalt partikeln tog finns inga två vägar att lägga ihop, och interferensen uteblir. Tas informationen bort kommer banden tillbaka.</li>
                                <li><strong>&quot;Mörkt betyder att ljuset försvann.&quot;</strong> Energin försvinner inte. Den som saknas i de mörka banden finns i de ljusa: interferensen flyttar ljuset, den förstör det inte.</li>
                            </ul>
                        </details>
                    </div>
                </div>
            );
        };
